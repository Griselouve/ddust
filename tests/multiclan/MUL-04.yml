test: MUL-04
titre: "Enfant accueilli dans un autre clan : son représentant ne répond pas (7 jours, horloge)"
criticite: mineur
# Compte A3 absent de la réserve (plan § 2) : repasser à true une fois créé.
enabled: false
telephones: [papa, tonton, enfant]
# Départ : la photo « famille » (bout_en_bout/E2E-02) : papa et Kid au tableau de
# bord, variables {clan}, {papa_id}, {kid}. Assets préchargés depuis le workspace.
photo: famille
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-02]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items:
  - ecran:age_screen
  - ecran:awake
  - ecran:clan_page
  - ecran:create_clan
  - ecran:dashboard
  - ecran:decisiontree
  - ecran:documents_acceptance_screen
  - ecran:home
  - ecran:invite_consent_screen
  - ecran:join_show_screen
  - ecran:kid_assent_screen
  - ecran:lang_choice
  - ecran:link_account_screen
  - ecran:my_clans_page
  - ecran:new_or_pick_clan
  - ecran:parentalgate_screen
  - ecran:player_name_screen
  - ecran:region_screen
  - ecran:theme_pick_page
  - ecran:welcome_child_screen
  - overlay:new_or_pick_clan/confirm
etapes:
  - tonton: {macro: onboarding_adulte, nom: Tonton}
  - tonton: {macro: creer_clan, clan: Les Cousins}
  - outil:  {nom: identite, telephone: tonton, champ: clan, garde: clan_b}
  - enfant: {action: navigate_new.clan_page}
  - enfant: {attend: clan_page, delai: 60}
  - enfant: {action: worker.open_my_clans}
  - enfant: {attend: my_clans_page, delai: 30}
  - enfant: {action: worker.on_my_clans_pick, event: {id: __join}}
  - enfant: {attend: kid_assent_screen, delai: 60}
  - enfant: {tap: kid_assent/go}
  - enfant: {attend: join_show_screen, delai: 60}
  - outil:  {nom: qr_lire, telephone: enfant, motif: "^ddust://join", garde: patte_b}
  - tonton: {action: worker.on_welcome_player}
  - tonton: {attend: welcome_child_screen, delai: 30}
  # QR donné comme par le lecteur intégré (action de ddust://join), pas par un lien Android.
  - outil: {nom: lien_event, url: "{patte_b}", garde: patte_b_ev}
  - tonton: {action: worker.on_join_link, event: "{patte_b_ev}"}
  - tonton: {attend: invite_consent_screen, delai: 60}
  - tonton: {attend_libre: true, delai: 30}
  - tonton: {tap: invite_consent_screen/yes}
  - enfant: {attend_journal: "relayée aux représentants (ok=true)", delai: 120}
  # Sept jours passent ; l'enfant rouvre le jeu : la demande échue est close, le chef de B prévenu.
  - outil:  {nom: horloge, telephone: enfant, quoi: demande_7j}
  - enfant: {relance: true}
  - enfant: {attend: dashboard, delai: 180}
  # (Même raison que MUL-03 : le statut de la demande, « expired ».)
  - outil: {nom: mul_demande, kid: "{kid}", statut: expired, delai: 120}
verifs:
  - firestore: {doc: "clans_players/{clan_b}/players/{kid}", existe: false}

test: BUT-03
titre: Forcer un absent pendant la cérémonie
criticite: mineur
enabled: true
telephones: [papa, enfant]
# Départ : la photo « famille » (bout_en_bout/E2E-02) : papa et Kid au tableau de
# bord, variables {clan}, {papa_id}, {kid}. Assets préchargés depuis le workspace.
photo: famille
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-02]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items:
  - ecran:butin_open_page
  - ecran:butin_page
  - ecran:clan_page
  - ecran:money_page
  - ecran:testme
etapes:
  # Kid range son téléphone : l'app passe en arrière-plan, il ne répondra pas à l'appel.
  - enfant: {touche: KEYCODE_HOME}
  # De l'argent au coffre (ligne de la bourse, money_page ; « 010 » s'affiche « 10 »).
  - papa: {tap: testme_open}
  - papa: {attend: testme, delai: 60}
  - papa: {action: worker.butin_show}
  - papa: {attend: butin_page, delai: 30}
  - papa: {action: worker.on_butin_row_tap, event: {id: wallet}}
  - papa: {attend: money_page, delai: 30}
  - papa: {action: worker.on_money_digit, event: "010"}
  - papa: {tap: money_page/ok}
  - papa: {attend: butin_page, delai: 30}
  - papa: {tap: butin_page/ok}
  - papa: {attend: testme, delai: 30}
  # Jauge pleine (helpers/horloge.py), puis l'écran Clan qui la relit à son appear.
  - outil: {nom: horloge, telephone: papa, quoi: butin}
  - papa: {tap: clan_open}
  - papa: {attend: clan_page, delai: 60}
  - papa: {attend_shape: clan_page/butin_open, delai: 60}
  - papa: {tap: clan_page/butin_open}
  - papa: {attend: butin_open_page, delai: 30}
  - papa: {tap: butin_open_page/ok}
  - papa: {attend_journal: "[opening] clan appelé : 1 joueur(s) attendu(s)", delai: 30}
  # La liste d'attente porte Kid. Ses lignes (DvList) ne sont pas tapables : le tap d'une
  # ligne appelle on_opening_row_tap avec la ligne ({id}) ; il n'agit que chez le meneur,
  # après l'appel (worker_butin.dart:824-851).
  - papa: {attend_shape: butin_open_page/list, delai: 30}
  - papa: {pause: 3}
  - papa: {action: worker.on_opening_row_tap, event: {id: "{kid}"}}
  - papa: {attend_journal: "[opening] absent forcé prêt par le meneur : {kid}", delai: 30}
  - papa: {attend_journal: "[opening] clan au complet : ouverture du coffre", delai: 60}
  - papa: {attend_journal: "[butin] jauge recalée : last_butin_xp=", delai: 60}
verifs:
  - journal: {telephone: papa, contient: "[butin] distribution : "}
  - journal: {telephone: enfant, absent: "[opening] réponse envoyée :"}
  - firestore: {collection: "clans_logs/{clan}/logs", ou: {champ: event, egal: ButinOpened}, existe: true}
  # Le drapeau d'appel de l'absent est retombé (forçage puis distribution, worker_butin.dart:845, 1175).
  - firestore: {doc: "clans_players/{clan}/players/{kid}", champ: pending_opening, egal: ""}

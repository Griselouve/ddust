test: BUT-01
titre: Préparer le butin (objets, note, argent promis)
criticite: majeur
enabled: true
telephones: [papa]
# Départ : la photo « papa_clan » (bout_en_bout/E2E-01) : papa onboardé, son clan
# « Les Testeurs », au tableau de bord. Assets préchargés depuis le workspace.
photo: papa_clan
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-01]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items: [ecran:butin_note_page, ecran:butin_page, ecran:money_page, ecran:testme]
etapes:
  # Un clan neuf n'a aucun objet à déposer (seulement le coffre et les bourses) : on en pose
  # un dans l'inventaire du chef (helpers/but_objet.py).
  - outil: {nom: but_objet, telephone: papa, type: potion_pv, cout: 20, garde: objet}
  - outil: {nom: identite, telephone: papa, champ: clan, garde: clan}
  # Onglet Items : son appear relit clans_items et crée coffre et bourse si besoin
  # (worker_items.dart:88-118). Icône de la taskbar (registry_commons.yml:593-600).
  - papa: {tap: testme_open}
  - papa: {attend: testme, delai: 60}
  - papa: {attend_journal: "poussé(s)", delai: 60}
  # Dépôt au coffre : le glisser-déposer sur la tuile du coffre appelle cette action
  # (items-base-global.yml:159-160, worker_butin.dart:157-186) ; la sonde ne glisse pas.
  - papa: {action: worker.item_to_butin, event: {source_id: "{objet}", source_type: potion_pv}}
  - papa: {attend_journal: "déposé dans le coffre", delai: 30}
  # Ouvrir le coffre : la tuile est dessinée par DvExplorer, non tapable ; son option unique
  # `item_open` appelle worker.butin_show (registry_items.yml:115-119).
  - papa: {action: worker.butin_show}
  - papa: {attend: butin_page, delai: 30}
  - papa: {attend_journal: "ligne(s) dans le coffre", delai: 30}
  # La note : ligne « Ajouter une note » de la DvList (id add_note, worker_butin.dart:377-380).
  - papa: {action: worker.on_butin_row_tap, event: {id: add_note}}
  - papa: {attend: butin_note_page, delai: 30}
  - papa: {ecrit: butin_note_page/entry, texte: "Sortie au parc samedi"}
  - papa: {tap: butin_note_page/ok}
  - papa: {attend: butin_page, delai: 30}
  # L'argent promis : ligne de la bourse (id wallet, worker_butin.dart:389-397) → money_page.
  - papa: {action: worker.on_butin_row_tap, event: {id: wallet}}
  - papa: {attend: money_page, delai: 30}
  # Le pavé n'est pas tapable. on_money_digit n'écrit l'affichage QUE si la saisie normalisée
  # diffère de ce qu'il reçoit (worker_chest.dart:202-215) : « 015 » s'affiche « 15 ».
  - papa: {action: worker.on_money_digit, event: "015"}
  - papa: {verifie: {shape: money_page/amount, egal: "15"}}
  - papa: {tap: money_page/ok}
  - papa: {attend_journal: "[butin] argent promis (en attente) : +15", delai: 30}
  - papa: {attend: butin_page, delai: 30}
  # « Valider » : le seul endroit qui écrit le brouillon (worker_butin.dart:409-489). On ne
  # tape PAS la ligne de l'objet : ce serait le SORTIR du coffre.
  - papa: {tap: butin_page/ok}
  - papa: {attend: testme, delai: 30}
verifs:
  - papa: {page: testme}
  - journal: {telephone: papa, contient: "déposé dans le coffre"}
  - journal: {telephone: papa, contient: "[butin] note déposée par"}
  - journal: {telephone: papa, contient: "[butin] validé : 0 objet(s) sorti(s), +15 d'argent de poche"}
  # L'objet est dans le coffre (owner sentinelle « butin », worker.dart:1084).
  - firestore: {doc: "clans_items/{clan}/items/{objet}", champ: owner, egal: butin}
  # La bourse du coffre a reçu la promesse.
  - firestore: {doc: "clans_items/{clan}/items/wallet", champ: quantity, egal: 15}
  # La note est portée par le document du coffre (champ notes, worker_butin.dart:524-566).
  - firestore: {doc: "clans_items/{clan}/items/butin", champ: notes, contient: "Sortie au parc samedi"}

test: ROS-02
titre: Promotion chef refusée pour un enfant
criticite: critique
enabled: true
telephones: [papa, enfant]
# Départ : la photo « famille » (bout_en_bout/E2E-02) : papa et Kid au tableau de
# bord, variables {clan}, {papa_id}, {kid}. Assets préchargés depuis le workspace.
photo: famille
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-02]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items: [ecran:clan_page]
etapes:
  - papa: {action: navigate_new.clan_page}
  - papa: {attend: clan_page, delai: 60}
  - papa: {attend_libre: true, delai: 60}
  # 1) L'option n'est pas proposée sur la tuile d'un mineur : promote_chief est réservé à
  #    legal_state "a" (worker_screen_clan.dart:607-608). `cible` = la ligne que pousse
  #    _refreshRoster (worker_screen_clan.dart:367-417). Vérifié plus bas (verifs).
  - outil: {nom: roster_menu, telephone: papa, cible: {id: "{kid}", name: Kid, legal_state: k, admin: false, founder: false, original_clan: "{clan}", no_account: false, dead: false, has_device: true, xp: 0}, garde: menu_kid}
  # 2) Et si on appelle l'action quand même, sa garde refuse (worker_members.dart:915-922).
  - papa: {action: worker.promote_chief, event: {id: "{kid}", name: Kid}}
  - papa: {attend_journal: "[roster] promote_chief REFUSÉ : Kid ({kid}) n'est pas légalement adulte (legal_state='k')", delai: 60}
verifs:
  # `player_log` présent : le sélecteur a bien répondu en chef (worker_screen_clan.dart:565).
  - outil: {nom: roster_menu, telephone: papa, cible: {id: "{kid}", name: Kid, legal_state: k, admin: false, founder: false, original_clan: "{clan}", no_account: false, dead: false, has_device: true, xp: 0}, absent: [promote_chief, nomore_chief], present: [player_log]}
  - journal: {telephone: papa, contient: "[roster] promote_chief REFUSÉ : Kid ({kid})"}
  - journal: {telephone: papa, absent: "[roster] promote_chief : Kid ({kid}) promu chef"}
  # Rien d'écrit : pas de miroir is_admin, pas d'entrée ChiefPromoted.
  - firestore: {doc: "clans_players/{clan}/players/{kid}", champ: is_admin, different: true}
  - firestore: {collection: "clans_logs/{clan}/logs", ou: {champ: event, egal: ChiefPromoted}, existe: false}

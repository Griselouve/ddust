test: ROS-01
titre: Promouvoir un adulte chef, puis le rétrograder
criticite: majeur
# Compte A2 absent de la réserve (plan § 2) : repasser à true une fois A2 créé.
enabled: false
telephones: [papa, maman]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items:
  - ecran:age_screen
  - ecran:awake
  - ecran:clan_page
  - ecran:create_clan
  - ecran:dashboard
  - ecran:decisiontree
  - ecran:documents_acceptance_screen
  - ecran:home
  - ecran:invite_consent_screen
  - ecran:join_show_screen
  - ecran:kid_assent_screen
  - ecran:lang_choice
  - ecran:link_account_screen
  - ecran:new_or_pick_clan
  - ecran:parentalgate_screen
  - ecran:player_name_screen
  - ecran:region_screen
  - ecran:theme_pick_page
  - ecran:welcome_child_screen
  - overlay:new_or_pick_clan/confirm
etapes:
  - macro: couple
  - papa: {action: navigate_new.clan_page}
  - papa: {attend: clan_page, delai: 60}
  - papa: {attend_libre: true, delai: 60}
  # « Promouvoir chef » / « Plus chef » sont des options du menu de la tuile (DvMenu, non
  # tapable) : on appelle leur action avec la ligne du roster, {id, name, ...}
  # (worker_screen_clan.dart:367-417 ; seuls id et name sont lus, worker_members.dart:893-895).
  - outil: {nom: roster_menu, telephone: papa, cible: {id: "{maman_id}", name: Maman, legal_state: a, admin: false, founder: false, original_clan: "{clan}", no_account: false}, present: [promote_chief], strict: true}
  - papa: {action: worker.promote_chief, event: {id: "{maman_id}", name: Maman}}
  - papa: {attend_journal: "[roster] promote_chief : Maman ({maman_id}) promu chef", delai: 60}
  - outil: {nom: firestore_attend, doc: "clans_players/{clan}/players/{maman_id}", champ: is_admin, egal: true, delai: 60}
  # Côté promu : sa vigilance voit is_admin=true et joue l'animation burn
  # (worker_celebrations.dart:777, appelée depuis le watch, worker_watch.dart:218).
  - maman: {attend_journal: "[chief] promotion détectée → animation burn", delai: 180}
  - maman: {attend_libre: true, delai: 60}
  # Promue, sa tuile propose désormais « Plus chef » (worker_screen_clan.dart:609-611).
  - outil: {nom: roster_menu, telephone: papa, cible: {id: "{maman_id}", name: Maman, legal_state: a, admin: true, founder: false, original_clan: "{clan}", no_account: false}, present: [nomore_chief], absent: [promote_chief], strict: true}
  - papa: {action: worker.nomore_chief, event: {id: "{maman_id}", name: Maman}}
  - papa: {attend_journal: "[roster] nomore_chief : Maman ({maman_id}) n'est plus chef", delai: 60}
  - outil: {nom: firestore_attend, doc: "clans_players/{clan}/players/{maman_id}", champ: is_admin, egal: false, delai: 60}
verifs:
  - journal: {telephone: papa, contient: "[roster] promote_chief : Maman ({maman_id}) promu chef"}
  - journal: {telephone: papa, contient: "[roster] nomore_chief : Maman ({maman_id}) n'est plus chef"}
  - journal: {telephone: maman, contient: "[chief] promotion détectée → animation burn"}
  # Journal du clan (worker_members.dart:950 et 1023).
  - firestore: {collection: "clans_logs/{clan}/logs", ou: {champ: event, egal: ChiefPromoted}, champ: userId, egal: "{maman_id}"}
  - firestore: {collection: "clans_logs/{clan}/logs", ou: {champ: event, egal: ChiefDemoted}, champ: userId, egal: "{maman_id}"}
  - firestore: {doc: "clans_players/{clan}/players/{maman_id}", champ: is_admin, egal: false}

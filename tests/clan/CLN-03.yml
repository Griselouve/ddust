test: CLN-03
titre: "Accueillir un adulte à distance : le code dicté, puis « c'est bien ton clan ? »"
criticite: majeur
# Compte A2 absent de la réserve (plan § 2) : repasser à true une fois A2 créé.
enabled: false
telephones: [papa, maman]
# Départ : la photo « papa_clan » (bout_en_bout/E2E-01) : papa onboardé, son clan
# « Les Testeurs », au tableau de bord. Assets préchargés depuis le workspace.
photo: papa_clan
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-01]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items:
  - ecran:age_screen
  - ecran:awake
  - ecran:dashboard
  - ecran:documents_acceptance_screen
  - ecran:home
  - ecran:invite_consent_screen
  - ecran:join_show_screen
  - ecran:kid_assent_screen
  - ecran:lang_choice
  - ecran:link_account_screen
  - ecran:new_or_pick_clan
  - ecran:parentalgate_screen
  - ecran:player_name_screen
  - ecran:region_screen
  - ecran:welcome_child_screen
etapes:
  - maman: {macro: onboarding_adulte, nom: Maman}
  - maman: {tap: new_or_pick_clan/join}
  - maman: {attend: join_show_screen, delai: 60}
  # Le code affiché (« Ton code : 48E-D8 »), comme s'il était dicté au téléphone.
  - outil: {nom: mul_code, telephone: maman, shape: join_show_screen/code, motif: join, garde: code}
  - papa: {action: worker.on_welcome_player}
  - papa: {attend: welcome_child_screen, delai: 30}
  - papa: {tap: welcome_child_screen/remote}
  - papa: {attend_shape: welcome_child_screen/code, delai: 10}
  - papa: {ecrit: welcome_child_screen/code, texte: "{code}"}
  - papa: {tap: welcome_child_screen/code_go}
  - papa: {attend: invite_consent_screen, delai: 60}
  - papa: {attend_libre: true, delai: 30}
  - papa: {tap: invite_consent_screen/yes}
  # Par code, l'invitée confirme : le dépôt n'a pas prouvé être passé par le QR code.
  - maman: {attend_shape: join_show_screen/family_yes, delai: 60}
  - maman: {verifie: {shape: join_show_screen/status, contient_un: ["C'est bien ton clan ?", "join_show_family_adult"]}}
  - maman: {tap: join_show_screen/family_yes}
  - maman: {attend: dashboard, delai: 240}
  - maman: {attend_libre: true, delai: 60}
  - outil: {nom: identite, telephone: maman, champ: userId, garde: maman_id}
  - outil: {nom: identite, telephone: papa, champ: clan, garde: clan}
verifs:
  - maman: {page: dashboard}
  - journal: {telephone: maman, contient: "[join] dépôt reçu ({code}, par code)"}
  - firestore: {doc: "clans_joins/{code}", existe: false}
  - firestore: {doc: "clans_players/{clan}/players/{maman_id}", champ: name, egal: Maman}

test: CLN-10
titre: "Usage unique : un second chef ne peut pas reprendre une boîte réclamée"
criticite: critique
# Compte A2 absent de la réserve (plan § 2) : repasser à true une fois A2 créé.
enabled: false
telephones: [papa, maman, enfant]
# Départ : la photo « papa_clan » (bout_en_bout/E2E-01) : papa onboardé, son clan
# « Les Testeurs », au tableau de bord. Assets préchargés depuis le workspace.
photo: papa_clan
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-01]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items:
  - ecran:age_screen
  - ecran:awake
  - ecran:create_clan
  - ecran:dashboard
  - ecran:decisiontree
  - ecran:documents_acceptance_screen
  - ecran:home
  - ecran:invite_consent_screen
  - ecran:join_show_screen
  - ecran:kid_assent_screen
  - ecran:lang_choice
  - ecran:link_account_screen
  - ecran:new_or_pick_clan
  - ecran:parentalgate_screen
  - ecran:player_name_screen
  - ecran:region_screen
  - ecran:theme_pick_page
  - ecran:welcome_child_screen
  - overlay:new_or_pick_clan/confirm
etapes:
  - maman:  {macro: onboarding_adulte, nom: Maman}
  - maman:  {macro: creer_clan, clan: Les Voisins}
  - enfant: {macro: onboarding_mineur}
  - outil:  {nom: mul_code, telephone: enfant, shape: join_show_screen/code, motif: join, garde: code}
  - outil:  {nom: qr_lire, telephone: enfant, motif: "^ddust://join", garde: patte}
  # Papa réclame la boîte et reste sur sa déclaration.
  - papa:   {action: worker.on_welcome_player}
  - papa:   {attend: welcome_child_screen, delai: 30}
  # QR donné comme par le lecteur intégré (action de ddust://join), pas par un lien Android.
  - outil: {nom: lien_event, url: "{patte}", garde: patte_ev}
  - papa:   {action: worker.on_join_link, event: "{patte_ev}"}
  - papa:   {attend: invite_consent_screen, delai: 60}
  # Maman tente la même boîte : refus (la règle n'autorise qu'un passage open → seen).
  - maman:  {action: worker.on_welcome_player}
  - maman:  {attend: welcome_child_screen, delai: 30}
  # QR donné comme par le lecteur intégré (action de ddust://join), pas par un lien Android.
  - outil: {nom: lien_event, url: "{patte}", garde: patte_ev}
  - maman:  {action: worker.on_join_link, event: "{patte_ev}"}
  - maman:  {attend_shape: welcome_child_screen/error, delai: 30}
verifs:
  - maman: {page: welcome_child_screen}
  - maman: {shape: welcome_child_screen/error, contient_un: ["Un autre chef est déjà en train de l'accueillir", "welcome_code_taken"]}
  - firestore: {doc: "clans_joins/{code}", champ: status, egal: seen}

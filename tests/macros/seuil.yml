# Du premier écran au choix de l'âge : réveil, langue, « Je pars à l'aventure », royaume
# (France, serveurs de test). Intro marquée vue par le moteur (phones.yml).
macro: seuil
parametres: {langue: fr, pays: FR}
etapes:
  # Le réveil passe parfois seul au choix de la langue (vu le 2026-10-18) : on attend l'un
  # ou l'autre, et on ne le touche que s'il est encore là.
  - {attend: [awake, lang_choice], delai: 120}
  - {si_visible: awake/tap, alors: [{tap: awake/tap}]}
  - {attend: lang_choice}
  # La tuile de langue attend son code dans l'événement : le tap de la sonde enverrait
  # « manual_act ». On appelle donc l'action qu'elle déclenche.
  - {action: worker.on_lang_chosen, event: "{langue}"}
  - {attend: home, delai: 120}
  - {tap: home/connect}
  - {attend: region_screen}
  # Le menu des pays ne s'ouvre qu'au doigt : on choisit le pays par son action.
  - {action: documents.on_region_selected, event: "{pays}"}
  - {attend_shape: documents/region_confirm}
  - {tap: documents/region_confirm}
  - {attend: age_screen, delai: 180}

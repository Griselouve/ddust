test: PRO-05
titre: Résurrection du chef seul
criticite: mineur
enabled: true
telephones: [papa]
# Départ : la photo « papa_clan » (bout_en_bout/E2E-01) : papa onboardé, son clan
# « Les Testeurs », au tableau de bord. Assets préchargés depuis le workspace.
photo: papa_clan
# Joué avant, obligatoirement : il prend la photo de départ (sauté si elle est à jour).
prerequisites: [E2E-01]
# Les ITEMS exercés (écrans, surcouches, interludes, leçons... : catalogue.py),
# relevés dans ses étapes et ses vérifications, macros comprises.
items: [ecran:dashboard, overlay:commons/death]
etapes:
  - outil: {nom: identite, telephone: papa, champ: clan,   garde: clan}
  - outil: {nom: identite, telephone: papa, champ: userId, garde: papa_id}
  - outil: {nom: horloge, telephone: papa, quoi: mort}
  - papa: {relance: true}
  - papa: {attend: dashboard, delai: 120}
  - papa: {attend_shape: commons/death_skull, delai: 90}
  # Chef seul mort : bouton « Résurrection » (loneAdmin, worker_celebrations.dart:177-178,
  # registry_commons.yml:866-881) → worker.resurrect_self (l. 298-340).
  - papa: {attend_shape: commons/death_revive, delai: 30}
  - papa: {tap: commons/death_revive}
  - papa: {attend_journal: "[death] résurrection admin solo: {papa_id}", delai: 60}
  - papa: {attend_libre: true, delai: 90}
  - papa: {attend_absent: commons/death_skull, delai: 90}
verifs:
  - journal: {telephone: papa, contient: "[death] résurrection admin solo: {papa_id}"}
  - papa: {shape: commons/death_skull, visible: false}
  - firestore: {doc: "clans_players/{clan}/players/{papa_id}", champ: status, egal: alive}
  - firestore: {doc: "clans_players/{clan}/players/{papa_id}", champ: gage, egal: ""}
  - firestore: {collection: "clans_logs/{clan}/logs", ou: {champ: event, egal: PlayerResurrected}, champ: adminId, egal: "{papa_id}"}

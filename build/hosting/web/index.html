  <script>
    // Redirection vers la langue du navigateur ; repli anglais.
    // ⚠ LA LISTE EST DUPLIQUÉE DE site.js, faute de pouvoir l'importer : cette page
    //   redirige avant tout chargement de script, et un <script src> de plus
    //   ajouterait un aller-retour réseau devant une simple redirection.
    (function () {
      var langs = ["fr", "en", "es", "it", "de", "pt", "nl"];
      var l = (navigator.language || "en").slice(0, 2).toLowerCase();
      if (langs.indexOf(l) < 0) l = "en";
      location.replace("/" + l + "/");
    })();
  </script>

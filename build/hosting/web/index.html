  <script>
    // Redirection vers la langue du navigateur ; repli anglais.
    // ⚠ LA LISTE EST DUPLIQUÉE DE site.js, faute de pouvoir l'importer : cette page
    //   redirige avant tout chargement de script, et un <script src> de plus
    //   ajouterait un aller-retour réseau devant une simple redirection.
    // ⚠ LE PORTUGAIS SE DÉCIDE SUR LA RÉGION, pas sur ses deux premières lettres :
    //   « pt-BR » va dans /br/ (portugais du Brésil), tout autre portugais dans /pt/.
    (function () {
      var langs = ["fr", "en", "es", "it", "de", "pt", "br", "nl"];
      var nav = (navigator.language || "en").toLowerCase();
      var bresilien = nav.indexOf("pt-br") === 0;
      var l = bresilien ? "br" : nav.slice(0, 2);
      // « br » tout court, c'est le BRETON : il n'a pas de site, il va à l'anglais.
      if (l === "br" && !bresilien) l = "en";
      if (langs.indexOf(l) < 0) l = "en";
      location.replace("/" + l + "/");
    })();
  </script>

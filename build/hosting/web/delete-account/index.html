<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Donjons &amp; Savons — Account deletion</title>
  <link rel="canonical" href="https://donjons.grisloup.com/delete-account/">
  <style>
    :root { --bg:#14110f; --card:#211c18; --ink:#efe7db; --muted:#a99e8e; --accent:#c9a24b; --danger:#c0483a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    }
    .card {
      background: var(--card); max-width: 640px; width: calc(100% - 32px);
      margin: 24px; padding: 24px 32px 32px; border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,.45);
    }
    .banner { display: block; width: 100%; height: auto; border-radius: 10px; margin: 0 0 22px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); font-size: .95rem; }
    ul { color: var(--muted); padding-left: 20px; margin: 0 0 16px; }
    .warn {
      border-left: 3px solid var(--danger); background: rgba(192,72,58,.10);
      padding: 12px 14px; border-radius: 6px; margin: 0 0 16px;
    }
    .row { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 20px; }
    .row input { margin-top: 4px; }
    button {
      font: inherit; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer;
      background: var(--accent); color: #1a1410; font-weight: 600;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.danger { background: var(--danger); color: #fff; }
    .link { background: none; color: var(--muted); text-decoration: underline; padding: 8px 0; font-weight: 400; }
    .hidden { display: none; }
    .who { font-weight: 600; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite; margin: 8px 0 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #gsi-btn { margin: 8px 0 4px; color-scheme: light; }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#14110f"></head>
<body>
  <main class="card">
    <img class="banner" src="/logo.png" alt="Donjons &amp; Savons">
    <h1 id="t-title"></h1>

    <!-- Etat : connexion -->
    <section id="state-signin">
      <p id="t-intro"></p>
      <ul>
        <li id="t-item1"></li>
        <li id="t-item2"></li>
        <li id="t-item3"></li>
      </ul>
      <p class="muted" id="t-signin-hint"></p>
      <div id="gsi-btn"></div>
    </section>

    <!-- Etat : confirmation -->
    <section id="state-confirm" class="hidden">
      <p><span id="t-connected-as"></span> <span class="who" id="who"></span></p>
      <div class="warn" id="t-warn"></div>
      <label class="row">
        <input type="checkbox" id="ack">
        <span id="t-ack"></span>
      </label>
      <button id="btn-delete" class="danger" disabled></button>
      <button id="btn-cancel" class="link"></button>
    </section>

    <!-- Etat : en cours -->
    <section id="state-working" class="hidden">
      <div class="spinner"></div>
      <p id="t-working"></p>
    </section>

    <!-- Etat : succes -->
    <section id="state-done" class="hidden">
      <p id="t-done"></p>
    </section>

    <!-- Etat : erreur -->
    <section id="state-error" class="hidden">
      <div class="warn" id="err-msg"></div>
      <button id="btn-retry"></button>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

        ack: "Capisco che l'eliminazione del mio account è definitiva.",

      de: {
        title: "Mein Donjons-&-Savons-Konto löschen",
        intro: "Die Löschung Ihres Kontos entfernt Ihre Daten sofort aus Donjons & Savons:",
        item1: "Ihre Figur, Ihre Stufen, Ihre Erfahrung und Ihr Gold;",

        item3: "wenn Sie Clanchef sind: Ihren Clan und die Profile der Kinder, die darin ohne eigenes Konto spielen.",

        connectedAs: "Angemeldet als",
        warn: "Diese Handlung ist endgültig. Ihre Daten verlassen das Spiel sofort, werden 30 Tage außerhalb des Dienstes aufbewahrt (nur bei Fehler, Support oder Betrug) und dann endgültig gelöscht. Sie können sie nicht wiederherstellen, und wenn Sie später wieder spielen, fangen Sie bei null an. Nur die Aufzeichnungen Ihrer Annahme der Bedingungen werden 5 Jahre lang als Nachweis der eingeholten Einwilligung aufbewahrt. Kündigen Sie Ihr Abonnement über Ihr Google-Konto ZUERST: die Löschung Ihres Kontos hier kündigt es nicht, und es würde weiter abgerechnet. Im Laden gekaufte Inhalte gehen mit dem Konto verloren, ohne Erstattung.",

        errPerm: "Sie können nur Ihr eigenes Konto löschen.",
        errGeneric: "Es ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut.",
        retry: "Erneut versuchen"
      },
      pt: {
        title: "Eliminar a minha conta Donjons & Savons",
        intro: "A eliminação da sua conta retira imediatamente os seus dados de Donjons & Savons:",
        item1: "a sua personagem, os seus níveis, a sua experiência e o seu ouro;",
        item2: "a sua pertença a todos os clãs de que faz parte;",
        item3: "se for chefe de clã: o seu clã e os perfis das crianças que aí jogam sem conta própria.",
        signinHint: "Ligue-se com a conta Google que utiliza na aplicação para continuar.",
        connectedAs: "Ligado como",
        warn: "Esta ação é definitiva. Os seus dados saem do jogo imediatamente, são conservados 30 dias fora do serviço (apenas erro, apoio ou fraude), e depois apagados definitivamente. Não os poderá recuperar e, se voltar a jogar mais tarde, começará do zero. Só os registos da sua aceitação das condições são conservados 5 anos, como prova do consentimento recolhido. Cancele a sua subscrição a partir da sua conta Google ANTES de continuar: eliminar a sua conta aqui não a cancela, e continuaria a ser faturada. Os conteúdos comprados na loja perdem-se com a conta, sem reembolso.",
        ack: "Compreendo que a eliminação da minha conta é definitiva.",
        del: "Eliminar a minha conta",
        cancel: "Cancelar",
        working: "A eliminar a sua conta…",
        done: "A sua conta foi eliminada e os seus dados retirados do jogo. Terminou a sessão.",

        errPerm: "Só pode eliminar a sua própria conta.",
        errGeneric: "Ocorreu um erro. Tente novamente.",

      },
      nl: {
        title: "Mijn Donjons & Savons-account verwijderen",
        intro: "Het verwijderen van uw account haalt uw gegevens onmiddellijk weg uit Donjons & Savons:",

        signinHint: "Meld u aan met het Google-account dat u in de applicatie gebruikt om verder te gaan.",
        connectedAs: "Aangemeld als",
        warn: "Deze handeling is definitief. Uw gegevens verlaten het spel onmiddellijk, worden 30 dagen buiten de dienst bewaard (alleen bij vergissing, ondersteuning of fraude) en daarna definitief gewist. U kunt ze niet terugkrijgen en als u later opnieuw speelt, begint u van nul. Alleen de registraties van uw aanvaarding van de voorwaarden worden 5 jaar bewaard, als bewijs van de verkregen toestemming. Zeg uw abonnement EERST op via uw Google-account: het verwijderen van uw account hier zegt het niet op, en het zou verder gefactureerd worden. In de winkel gekochte inhoud gaat met het account verloren, zonder terugbetaling.",

    var LANG = (navigator.language || "en").slice(0, 2).toLowerCase();
    var T = I18N[LANG] || I18N.en;

    function txt(id, key) { document.getElementById(id).textContent = T[key]; }
    txt("t-title", "title"); txt("t-intro", "intro");
    txt("t-item1", "item1"); txt("t-item2", "item2"); txt("t-item3", "item3");
    txt("t-signin-hint", "signinHint"); txt("t-connected-as", "connectedAs");
    txt("t-warn", "warn"); txt("t-ack", "ack"); txt("t-working", "working"); txt("t-done", "done");
    document.getElementById("btn-delete").textContent = T.del;
    document.getElementById("btn-cancel").textContent = T.cancel;
    document.getElementById("btn-retry").textContent = T.retry;
    document.documentElement.lang = (I18N[LANG] ? LANG : "en");

    // --- Etats UI -----------------------------------------------------------
    var STATES = ["signin", "confirm", "working", "done", "error"];
    function show(state) {
      STATES.forEach(function (s) {
        document.getElementById("state-" + s).classList.toggle("hidden", s !== state);
      });
    }

    // --- Firebase + Google Identity Services --------------------------------
    firebase.initializeApp(FIREBASE_CONFIG);

    function onGoogleCredential(response) {
      var cred = firebase.auth.GoogleAuthProvider.credential(response.credential);
      firebase.auth().signInWithCredential(cred).then(function (userCred) {
        document.getElementById("who").textContent =
          (userCred.user && userCred.user.email) || "";
        document.getElementById("ack").checked = false;
        document.getElementById("btn-delete").disabled = true;
        show("confirm");
      }).catch(function () {
        showError(T.errAuth);
      });
    }

    function initGsi() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        setTimeout(initGsi, 200);
        return;
      }
      google.accounts.id.initialize({ client_id: WEB_CLIENT_ID, callback: onGoogleCredential });
      google.accounts.id.renderButton(
        document.getElementById("gsi-btn"),
        { theme: "outline", size: "large", type: "standard", text: "continue_with" }
      );
    }
    initGsi();

    // --- Interactions -------------------------------------------------------
    document.getElementById("ack").addEventListener("change", function (e) {
      document.getElementById("btn-delete").disabled = !e.target.checked;
    });

    document.getElementById("btn-cancel").addEventListener("click", function () {
      firebase.auth().signOut().finally(function () { show("signin"); });
    });

    document.getElementById("btn-retry").addEventListener("click", function () {
      firebase.auth().signOut().finally(function () { show("signin"); });
    });

    function showError(msg) {
      document.getElementById("err-msg").textContent = msg;
      show("error");
    }

    // Les donnees sont partitionnees par region et rien, cote web, ne dit ou vit
    // l'utilisateur : on interroge donc CHAQUE region. Celles qui n'hebergent pas ce
    // compte repondent sans rien ecrire (garde-fou "not-in-region" cote Cloud Function).
    // Il n'y en a qu'une depuis le 2026-09-08 (`eu`), et cette page n'a pas eu a le
    // savoir : c'est tout l'interet de lire la liste au lieu de la coder en dur.
    // Si le placeholder n'a pas ete substitue (test local), on retombe sur l'endpoint nu.
    function deleteEndpoints() {
      var raw = DELETE_REGIONS.indexOf("@@@") === 0 ? "" : DELETE_REGIONS;
      var regions = raw.split(",").filter(function (r) { return r.trim() !== ""; });
      if (!regions.length) { return [DELETE_ENDPOINT]; }
      return regions.map(function (r) { return DELETE_ENDPOINT + "/" + r.trim(); });
    }

    function callDelete(url, idToken, ownerId) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
        body: JSON.stringify({ data: { ownerId: ownerId } })
      }).then(function (r) {
        return r.json().then(
          function (body) { return { ok: r.ok, body: body }; },
          function ()     { return { ok: r.ok, body: null }; }
        );
      });
    }

    document.getElementById("btn-delete").addEventListener("click", function () {
      var user = firebase.auth().currentUser;
      if (!user) { showError(T.errAuth); return; }
      show("working");
      var urls = deleteEndpoints();
      user.getIdToken().then(function (idToken) {
        // Sequentiel : une region a la fois, et la premiere erreur reelle interrompt la
        // chaine plutot que de laisser croire a une suppression complete.
        return urls.reduce(function (chain, url) {
          return chain.then(function (acc) {
            if (acc.failed) { return acc; }
            return callDelete(url, idToken, user.uid).then(function (res) {
              if (!res.ok || (res.body && res.body.error)) {
                acc.failed = (res.body && res.body.error && res.body.error.status) || "GENERIC";
              }
              return acc;
            });
          });
        }, Promise.resolve({ failed: null }));
      }).then(function (acc) {
        if (acc.failed) {
          if (acc.failed === "UNAUTHENTICATED") { showError(T.errAuth); }
          else if (acc.failed === "PERMISSION_DENIED") { showError(T.errPerm); }
          else { showError(T.errGeneric); }
          return;
        }
        firebase.auth().signOut().finally(function () { show("done"); });
      }).catch(function () {
        showError(T.errGeneric);
      });
    });

    show("signin");
  </script>

</html>

      clan_menu_advanced_desc:
        fr: "Invitation à distance, tribus de tes enfants, IA de la tribu, parrainage…"
        en: "Remote invitation, your children's tribes, tribe AI, sponsorship…"
        es: "Invitación a distancia, tribus de tus hijos, IA de la tribu, padrinazgo…"
        it: "Invito a distanza, tribù dei tuoi figli, IA della tribù, padrinato…"
        de: "Einladung aus der Ferne, Stämme deiner Kinder, Stammes-KI, Patenschaft…"
        pt: "Convite à distância, tribos dos teus filhos, IA da tribo, apadrinhamento…"
        br: "Convite a distância, tribos dos seus filhos, IA da tribo, indicação…"
        nl: "Uitnodiging op afstand, stammen van je kinderen, stam-AI, peterschap…"
      tuto_skip_hint_text:
        fr: "Tu pourras revoir chaque tutoriel quand tu voudras : écran Tribu, menu ⋮ en haut à droite, puis « Tutoriels »."
        en: "You can replay any tutorial whenever you like: Tribe screen, the ⋮ menu at the top right, then “Tutorials”."
        es: "Podrás volver a ver cada tutorial cuando quieras: pantalla Tribu, menú ⋮ arriba a la derecha y luego «Tutoriales»."
        it: "Potrai rivedere ogni tutorial quando vuoi: schermata Tribù, menu ⋮ in alto a destra, poi «Tutorial»."
        de: "Du kannst jedes Tutorial jederzeit wieder ansehen: Stamm-Bildschirm, Menü ⋮ oben rechts, dann „Tutorials“."
        pt: "Podes rever cada tutorial quando quiseres: ecrã Tribo, menu ⋮ no canto superior direito e depois «Tutoriais»."
        br: "Você pode rever cada tutorial quando quiser: tela Tribo, menu ⋮ no canto superior direito e depois “Tutoriais”."
        nl: "Je kunt elke tutorial bekijken wanneer je wilt: Stam-scherm, menu ⋮ rechtsboven, dan „Tutorials”."

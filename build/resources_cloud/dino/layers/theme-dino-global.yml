        pt: "Em conformidade com os Termos de utilização, ao criares um perfil de jogador para uma criança declaras ser o seu responsável legal e consentes a recolha dos seus dados. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "De acordo com os Termos de uso, ao criar um perfil de jogador para uma criança, você declara ser o responsável legal por ela e consente com a coleta dos dados dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Overeenkomstig de Gebruiksvoorwaarden verklaar je, door een spelersprofiel voor een kind aan te maken, dat je zijn wettelijke voogd bent en stem je in met het verzamelen van zijn gegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."

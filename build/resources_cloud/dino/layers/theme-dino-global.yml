      log_event_gobelin:
        fr: '@@@session.user.name@@@ a fait partir un ptérodactyle fouineur de la tribu.'
        en: '@@@session.user.name@@@ shooed a nosy pterodactyl out of the tribe.'
        es: '@@@session.user.name@@@ ha espantado a un pterodáctilo cotilla de la tribu.'
        de: '@@@session.user.name@@@ hat einen neugierigen Flugsaurier aus dem Stamm verscheucht.'
        it: '@@@session.user.name@@@ ha mandato via uno pterodattilo ficcanaso dalla tribù.'
        pt: '@@@session.user.name@@@ enxotou um pterodáctilo bisbilhoteiro da tribo.'
        br: '@@@session.user.name@@@ espantou um pterodáctilo xereta da tribo.'
        nl: '@@@session.user.name@@@ heeft een nieuwsgierige pterodactylus uit de stam gestuurd.'
      log_event_changelin:
        fr: '@@@session.user.name@@@ a démasqué un caméléon farceur caché dans la tribu.'
        en: '@@@session.user.name@@@ unmasked a cheeky chameleon hiding in the tribe.'
        es: '@@@session.user.name@@@ ha descubierto a un camaleón bromista escondido en la tribu.'
        de: '@@@session.user.name@@@ hat ein freches Chamäleon erwischt, das sich im Stamm versteckt hat.'
        it: '@@@session.user.name@@@ ha smascherato un camaleonte burlone nascosto nella tribù.'

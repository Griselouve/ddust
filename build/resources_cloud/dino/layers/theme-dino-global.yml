      butin_note_title:
        fr: Une note dans l'œuf
        en: A note in the egg
        es: Una nota en el huevo
        de: Eine Notiz im Ei
        it: Un biglietto nell'uovo
        pt: Uma nota no ovo
        br: Uma nota no ovo
        nl: Een briefje in het ei
      butin_note_hint:
        fr: "Cette note sera lue par toute la tribu quand l'œuf éclora. Personne ne la voit avant, pas même les autres chefs de la tribu. C'est l'endroit rêvé pour une annonce ou une surprise : « on va tous à un super parc d'attractions, vous l'avez mérité »."
        en: "This note will be read by the whole tribe when the egg hatches. Nobody sees it before then, not even the other tribe chiefs. It's the perfect place for an announcement or a surprise: “we're all going to an amazing amusement park, you've earned it.”"
        es: "Esta nota será leída por toda la tribu cuando se abra el huevo. Nadie la ve antes, ni siquiera los demás jefes de la tribu. Es el lugar perfecto para un anuncio o una sorpresa: «vamos todos a un parque de atracciones increíble, os lo habéis ganado»."
        it: "Questo biglietto sarà letto da tutta la tribù quando l'uovo si schiuderà. Nessuno lo vede prima, nemmeno gli altri capi della tribù. È il posto perfetto per un annuncio o una sorpresa: «andiamo tutti in un fantastico parco divertimenti, ve lo siete meritato»."
        de: "Diese Notiz wird vom ganzen Stamm gelesen, wenn das Ei aufspringt. Vorher sieht sie niemand, nicht einmal die anderen Stammes-Chefs. Der perfekte Ort für eine Ankündigung oder eine Überraschung: „Wir fahren alle in einen super Freizeitpark, ihr habt es euch verdient.“"
        pt: "Esta nota será lida pela tribo inteira quando o ovo se abrir. Ninguém a vê antes, nem sequer os outros chefes da tribo. É o sítio ideal para um anúncio ou uma surpresa: «vamos todos a um parque de diversões espetacular, vocês merecem»."
        br: "Esta nota será lida pela tribo inteira quando o ovo abrir. Ninguém a vê antes, nem mesmo os outros chefes da tribo. É o lugar ideal para um anúncio ou uma surpresa: \"vamos todos a um parque de diversões incrível, vocês merecem\"."
        nl: "Dit briefje wordt door de hele stam gelezen als het ei uitkomt. Niemand ziet het eerder, zelfs de andere stamhoofden niet. De perfecte plek voor een aankondiging of een verrassing: ‘we gaan allemaal naar een supergaaf pretpark, jullie hebben het verdiend’."
      butin_money_warning:
        fr: 'Attention : c''est une promesse d''argent RÉEL, à distribuer entre les joueurs le jour où l''œuf éclora.
          Prévois une tirelire ou une vraie boîte où déposer cet argent au fur et à mesure : le jour de l''éclosion,
          la distribution sera immédiate.'
        en: 'Careful: this is a promise of REAL money, to be shared among the players on the day the egg hatches.
          Keep a piggy bank or a real box and put the money in as you go: on hatching day, sharing it out will be
          immediate.'
        es: 'Atención: es una promesa de dinero REAL, para repartir entre los jugadores el día en que se abra el
          huevo. Ten una hucha o una caja de verdad donde ir metiendo ese dinero: el día de la apertura, el reparto
          será inmediato.'
        de: 'Achtung: Das ist ein Versprechen von ECHTEM Geld, das an dem Tag, an dem das Ei aufspringt, unter den
          Spielern aufgeteilt wird. Leg dir ein Sparschwein oder eine echte Kiste zu und steck das Geld nach und
          nach hinein: An diesem Tag wird dann sofort verteilt.'
        it: 'Attenzione: è una promessa di soldi VERI, da dividere tra i giocatori il giorno in cui l''uovo si schiuderà.
          Tieni un salvadanaio o una vera scatola dove mettere quei soldi man mano: il giorno della schiusa la distribuzione
          sarà immediata.'
        pt: 'Atenção: é uma promessa de dinheiro A SÉRIO, para repartir entre os jogadores no dia em que o ovo se
          abrir. Arranja um mealheiro ou uma caixa verdadeira onde ir pondo esse dinheiro: no dia da abertura, a
          distribuição será imediata.'
        br: 'Atenção: é uma promessa de dinheiro DE VERDADE, para dividir entre os jogadores no dia em que o ovo
          abrir. Arrume um cofrinho ou uma caixa de verdade para ir guardando esse dinheiro: no dia da abertura,
          a distribuição será imediata.'
        nl: 'Let op: dit is een belofte van ECHT geld, dat verdeeld wordt onder de spelers op de dag dat het ei
          uitkomt. Zet een spaarpot of een echte doos klaar en stop het geld er gaandeweg in: op die dag kan het
          meteen worden uitgedeeld.'

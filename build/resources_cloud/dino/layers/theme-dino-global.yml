          ALIAS_DESCRIPTION: <segunda descrição, de 1 a 2 frases curtas>
          NOM: <nome de guardião, uma só palavra>
          DESCRIPTION: <descrição da personagem, de 1 a 2 frases curtas>
          Todo o conteúdo deve ser redigido em @@@worker.inspire_lang@@@, com palavras simples que uma criança de 3 anos perceba.

          REGISTO OBRIGATÓRIO. Este texto vai ser lido por crianças dos 3 aos 7 anos.

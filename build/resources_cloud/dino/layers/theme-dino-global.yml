      tuto_clan_menu_admin_title:
        fr: "Les options réservées aux chefs de la tribu"
        en: "Options for tribe chiefs only"
        es: "Opciones reservadas a los jefes de la tribu"
        it: "Opzioni riservate ai capi della tribù"
        de: "Optionen nur für Stammes-Chefs"
        pt: "Opções reservadas aos chefes da tribo"
        br: "Opções reservadas aos chefes da tribo"
        nl: "Opties voor stamhoofden"
      clan_menu_log_desc:
        fr: "Voir le journal de toute la tribu."
        en: "View the whole tribe's log."
        es: "Ver el registro de toda la tribu."
        it: "Vedere il diario di tutta la tribù."
        de: "Das Tagebuch des ganzen Stammes ansehen."
        pt: "Ver o diário de toda a tribo."
        br: "Ver o diário de toda a tribo."
        nl: "Het dagboek van de hele stam bekijken."
      tuto_combat_tasks_grey:
        fr: "Une tâche grisée n'est pas disponible pour l'instant : elle est déjà prise, en repos, ou réservée aux chefs de la tribu."
        en: "A greyed-out task isn't available right now: it's already taken, resting, or reserved for tribe chiefs."
        es: "Una tarea en gris no está disponible por ahora: ya está tomada, en reposo, o reservada a los jefes de la tribu."
        it: "Un compito in grigio non è disponibile per ora: è già preso, a riposo, o riservato ai capi della tribù."
        de: "Eine ausgegraute Aufgabe ist gerade nicht verfügbar: Sie ist schon vergeben, ruht oder ist den Stammes-Chefs vorbehalten."
        pt: "Uma tarefa a cinzento não está disponível de momento: já está ocupada, em repouso ou reservada aos chefes da tribo."
        br: "Uma tarefa em cinza não está disponível no momento: já está ocupada, em repouso ou reservada aos chefes da tribo."
        nl: "Een grijze taak is nu niet beschikbaar: hij is al bezet, rust uit of is voorbehouden aan stamhoofden."
      tuto_badge_hand_desc:
        fr: "La tâche est terminée et attend qu'un chef de la tribu la valide."
        en: "The task is done and waiting for a tribe chief to validate it."
        es: "La tarea está terminada y espera que un jefe de la tribu la valide."
        it: "Il compito è finito e aspetta che un capo della tribù lo convalidi."
        de: "Die Aufgabe ist erledigt und wartet darauf, dass ein Stammes-Chef sie bestätigt."
        pt: "A tarefa está terminada e espera que um chefe da tribo a valide."
        br: "A tarefa está terminada e espera que um chefe da tribo a valide."
        nl: "De taak is klaar en wacht tot een stamhoofd hem valideert."
      tuto_badge_xp_desc:
        fr: "Un chef de la tribu la met en avant : elle rapporte un bonus d'XP."
        en: "A tribe chief is highlighting it: it grants bonus XP."
        es: "Un jefe de la tribu la destaca: otorga XP extra."
        it: "Un capo della tribù lo mette in evidenza: dà un bonus di XP."
        de: "Ein Stammes-Chef hebt sie hervor: Sie bringt einen XP-Bonus."
        pt: "Um chefe da tribo destaca-a: dá um bónus de XP."
        br: "Um chefe da tribo a destacou: ela dá um bônus de XP."
        nl: "Een stamhoofd zet hem in de kijker: hij levert extra XP op."
      tuto_combat_active_given_back:
        fr: "Celle-ci, je te la rends : elle redevient libre pour ta tribu. À toi de choisir la tienne !"
        en: "This one, I'm giving back: it's free for your tribe again. Now pick your own!"
        es: "Esta te la devuelvo: vuelve a estar libre para tu tribu. ¡Ahora elige la tuya!"
        it: "Questo te lo restituisco: torna libero per la tua tribù. Ora scegli il tuo!"
        de: "Diese hier gebe ich dir zurück: Sie ist wieder frei für deinen Stamm. Jetzt wähl deine eigene!"
        pt: "Esta, devolvo-ta: volta a estar livre para a tua tribo. Agora escolhe a tua!"
        br: "Esta eu devolvo: ela volta a ficar livre para a sua tribo. Agora escolha a sua!"
        nl: "Deze geef ik je terug: hij is weer vrij voor je stam. Kies nu je eigen taak!"
      tuto_combat_active_none:
        fr: "Toutes les tâches de la tribu sont déjà prises ! Reviens lire ce guide quand tu en auras commencé une : il te montrera les boutons au fur et à mesure."
        en: "Every task in the tribe is already taken! Come back to this guide once you've started one: it will point out the buttons as you go."
        es: "¡Todas las tareas de la tribu ya están cogidas! Vuelve a esta guía cuando hayas empezado una: te mostrará los botones sobre la marcha."
        it: "Tutti i compiti della tribù sono già presi! Torna a leggere questa guida quando ne avrai iniziato uno: ti mostrerà i pulsanti man mano."
        de: "Alle Aufgaben des Stammes sind schon vergeben! Lies diese Anleitung noch einmal, wenn du eine begonnen hast: Sie zeigt dir die Knöpfe nach und nach."
        pt: "Todas as tarefas da tribo já estão ocupadas! Volta a este guia quando tiveres começado uma: vai mostrar-te os botões à medida que avanças."
        br: "Todas as tarefas da tribo já estão ocupadas! Volte a este guia quando tiver começado uma: ele vai mostrar os botões conforme você avança."
        nl: "Alle taken van de stam zijn al bezet! Lees deze gids opnieuw als je er een bent begonnen: hij wijst je de knoppen gaandeweg aan."
      tuto_combat_active_validate:
        fr: "Ensuite, va voir le chef de la tribu pour qu'il valide ta tâche. Tu peux lui montrer ta preuve. (Si tu es le seul chef de la tribu, tes tâches se valident toutes seules.)"
        en: "Then go to the tribe chief so they validate your task. You can show them your proof. (If you're the tribe's only chief, your tasks validate themselves.)"
        es: "Luego ve al jefe de la tribu para que valide tu tarea. Puedes mostrarle tu prueba. (Si eres el único jefe de la tribu, tus tareas se validan solas.)"
        it: "Poi vai dal capo della tribù perché convalidi il tuo compito. Puoi mostrargli la tua prova. (Se sei l'unico capo della tribù, i tuoi compiti si convalidano da soli.)"
        de: "Geh dann zum Stammes-Chef, damit er deine Aufgabe bestätigt. Du kannst ihm deinen Beweis zeigen. (Wenn du der einzige Stammes-Chef bist, werden deine Aufgaben automatisch bestätigt.)"
        pt: "Depois, vai ter com o chefe da tribo para ele validar a tua tarefa. Podes mostrar-lhe a tua prova. (Se fores o único chefe da tribo, as tuas tarefas validam-se sozinhas.)"
        br: "Depois, vá até o chefe da tribo para ele validar sua tarefa. Você pode mostrar sua prova a ele. (Se você for o único chefe da tribo, suas tarefas se validam sozinhas.)"
        nl: "Ga daarna naar het stamhoofd zodat die je taak valideert. Je kunt je bewijs laten zien. (Ben je het enige stamhoofd, dan worden je taken vanzelf gevalideerd.)"
      adm_menu_recommend_desc:
        fr: "Recommander cette tâche (bonus d'XP pour la tribu)."
        en: "Recommend this task (XP bonus for the tribe)."
        es: "Recomendar esta tarea (bono de XP para la tribu)."
        it: "Consigliare questo compito (bonus XP per la tribù)."
        de: "Diese Aufgabe empfehlen (XP-Bonus für den Stamm)."
        pt: "Recomendar esta tarefa (bónus de XP para a tribo)."
        br: "Recomendar esta tarefa (bônus de XP para a tribo)."
        nl: "Deze taak aanbevelen (XP-bonus voor de stam)."
      adm_menu_release_desc:
        fr: "Libérer la tâche : elle redevient disponible pour toute la tribu."
        en: "Release the task: it becomes available to the whole tribe again."
        es: "Liberar la tarea: vuelve a estar disponible para toda la tribu."
        it: "Liberare il compito: torna disponibile per tutta la tribù."
        de: "Die Aufgabe freigeben: Sie ist wieder für den ganzen Stamm verfügbar."
        pt: "Libertar a tarefa: volta a estar disponível para toda a tribo."
        br: "Liberar a tarefa: ela volta a ficar disponível para toda a tribo."
        nl: "De taak vrijgeven: hij is weer beschikbaar voor de hele stam."
      tuto_clan_menu:
        fr: "Le menu Tribu : diverses options pour gérer la tribu."
        en: "The Tribe menu: various options to manage the tribe."
        es: "El menú de la tribu: varias opciones para gestionar la tribu."
        it: "Il menu Tribù: diverse opzioni per gestire la tribù."
        de: "Das Stammes-Menü: verschiedene Optionen, um den Stamm zu verwalten."
        pt: "O menu Tribo: várias opções para gerir a tribo."
        br: "O menu Tribo: várias opções para gerenciar a tribo."
        nl: "Het menu Stam: diverse opties om de stam te beheren."
      reminder_recruit_clan:
        fr: "Ta tribu a besoin de héros ! Ouvre ce menu et touche « Accueillir un joueur » : adulte ou enfant, il te montre son QR code et tu le scannes."
        en: "Your tribe needs heroes! Open this menu and tap “Welcome a player”: adult or child, they show you their QR code and you scan it."
        es: "¡Tu tribu necesita héroes! Abre este menú y toca «Acoger a un jugador»: adulto o niño, te enseña su código QR y tú lo escaneas."
        it: "La tua tribù ha bisogno di eroi! Apri questo menu e tocca «Accogli un giocatore»: adulto o bambino, ti mostra il suo codice QR e tu lo scansioni."
        de: "Dein Stamm braucht Helden! Öffne dieses Menü und tippe auf „Einen Spieler aufnehmen“: Ob Erwachsener oder Kind, er zeigt dir seinen QR-Code und du scannst ihn."
        pt: "A tua tribo precisa de heróis! Abre este menu e toca em «Acolher um jogador»: adulto ou criança, mostra-te o código QR e tu digitalizas."
        br: "Sua tribo precisa de heróis! Abra este menu e toque em “Acolher um jogador”: adulto ou criança, a pessoa mostra o QR Code e você escaneia."
        nl: "Je stam heeft helden nodig! Open dit menu en tik op ‘Een speler verwelkomen’: volwassene of kind, hij laat je zijn QR-code zien en jij scant hem."
      reminder_safety_curate:
        fr: "C'est vous qui décidez des tâches proposées à votre tribu. Désactivez à tout moment, depuis le mode administration de la liste des tâches, celles qui ne conviennent pas à votre enfant."
        en: "You decide which chores your tribe is offered. From the administration mode of the task list, you can disable at any time those that do not suit your child."
        es: "Usted decide qué tareas se ofrecen a su tribu. Desde el modo de administración de la lista de tareas, puede desactivar en cualquier momento las que no convengan a su hijo."
        it: "È lei a decidere quali compiti vengono proposti alla sua tribù. Dalla modalità di amministrazione dell'elenco dei compiti, può disattivare in qualsiasi momento quelli non adatti a suo figlio."
        de: "Sie entscheiden, welche Aufgaben Ihrem Stamm angeboten werden. Im Verwaltungsmodus der Aufgabenliste können Sie jederzeit diejenigen deaktivieren, die nicht zu Ihrem Kind passen."
        pt: "Cabe-lhe a si decidir que tarefas são propostas à sua tribo. No modo de administração da lista de tarefas, pode desativar a qualquer momento as que não convêm ao seu filho."
        br: "Cabe a você decidir quais tarefas são oferecidas à sua tribo. No modo de administração da lista de tarefas, você pode desativar a qualquer momento as que não são adequadas para seu filho."
        nl: "U beslist welke taken uw stam krijgt aangeboden. In de beheermodus van de takenlijst kunt u op elk moment de taken uitschakelen die niet bij uw kind passen."
      tuto_impersonation_back:
        fr: "Vous jouez à la place d'un membre de la tribu. Touchez ce bandeau pour demander à revenir sur votre compte."
        en: "You are playing in place of a tribe member. Tap this banner to ask to return to your own account."
        es: "Estás jugando en lugar de un miembro de la tribu. Toca este letrero para pedir volver a tu cuenta."
        it: "Stai giocando al posto di un membro della tribù. Tocca questo banner per chiedere di tornare al tuo account."
        de: "Du spielst an Stelle eines Stammesmitglieds. Tippe auf dieses Banner, um die Rückkehr zu deinem Konto anzufordern."
        pt: "Estás a jogar no lugar de um membro da tribo. Toca nesta faixa para pedires para voltar à tua conta."
        br: "Você está jogando no lugar de um membro da tribo. Toque nesta faixa para pedir para voltar à sua conta."
        nl: "Je speelt in de plaats van een stamlid. Tik op deze banner om te vragen terug te gaan naar je eigen account."
      tuto_impersonation_idle:
        fr: "Cette leçon s'affiche quand un chef de la tribu prête son compte à un autre joueur."
        en: "This lesson appears when a tribe chief lends their account to another player."
        es: "Esta lección aparece cuando un jefe de la tribu presta su cuenta a otro jugador."
        it: "Questa lezione compare quando un capo della tribù presta il suo account a un altro giocatore."
        de: "Diese Lektion erscheint, wenn ein Stammes-Chef sein Konto einem anderen Spieler leiht."
        pt: "Esta lição aparece quando um chefe da tribo empresta a sua conta a outro jogador."
        br: "Esta lição aparece quando um chefe da tribo empresta sua conta a outro jogador."
        nl: "Deze les verschijnt wanneer een stamhoofd zijn account uitleent aan een andere speler."
      tuto_create_player_what:
        fr: "« Créer un joueur » ajoute à la tribu un personnage fictif : celui d'un enfant trop jeune pour avoir un compte, ou qui n'a pas de téléphone. Il n'a ni compte ni appareil à lui : il n'existe que dans ta tribu."
        en: "« Create a player » adds a make-believe character to the tribe: that of a child too young to have an account, or without a phone. They have no account and no device of their own: they only exist inside your tribe."
        es: "« Crear un jugador » añade a la tribu un personaje ficticio: el de un niño demasiado pequeño para tener una cuenta, o que no tiene teléfono. No tiene cuenta ni dispositivo propio: solo existe dentro de tu tribu."
        it: "«Crea un giocatore» aggiunge alla tribù un personaggio fittizio: quello di un bambino troppo piccolo per avere un account, o che non ha un telefono. Non ha né un account né un dispositivo suo: esiste solo nella tua tribù."
        de: "„Spieler erstellen“ fügt dem Stamm einen ausgedachten Charakter hinzu: den eines Kindes, das zu jung für ein Konto ist oder kein Handy hat. Er hat weder ein eigenes Konto noch ein eigenes Gerät: Er existiert nur in deinem Stamm."
        pt: "«Criar um jogador» acrescenta à tribo um personagem fictício: o de uma criança demasiado nova para ter conta, ou que não tem telemóvel. Não tem conta nem dispositivo próprio: só existe na tua tribo."
        br: "\"Criar um jogador\" adiciona à tribo um personagem fictício: o de uma criança nova demais para ter conta, ou que não tem celular. Ele não tem conta nem dispositivo próprio: só existe na sua tribo."
        nl: "‘Speler aanmaken’ voegt een verzonnen personage aan de stam toe: dat van een kind dat te jong is voor een account, of geen telefoon heeft. Het heeft geen eigen account of apparaat: het bestaat alleen in je stam."
      tuto_create_player_row_create_desc:
        fr: "Dans le menu de la tribu : crée le personnage de l'enfant (tu choisis son nom)."
        en: "In the tribe menu: creates the child's character (you choose their name)."
        es: "En el menú de la tribu: crea el personaje del niño (tú eliges su nombre)."
        it: "Nel menu della tribù: crea il personaggio del bambino (scegli tu il nome)."
        de: "Im Stammes-Menü: erstellt den Charakter des Kindes (du wählst seinen Namen)."
        pt: "No menu da tribo: cria o personagem da criança (tu escolhes o nome)."
        br: "No menu da tribo: crie o personagem da criança (você escolhe o nome)."
        nl: "In het stammenu: maakt het personage van het kind aan (jij kiest de naam)."
      store_dunning_farewell:
        fr: "Votre tribu sera effacée dans un mois. Touchez ici pour la garder."
        en: "Your tribe will be erased in a month. Tap here to keep it."
        es: "Vuestra tribu se borrará en un mes. Toca aquí para conservarla."
        it: "La vostra tribù sarà cancellata tra un mese. Tocca qui per tenerla."
        de: "Euer Stamm wird in einem Monat gelöscht. Tippe hier, um ihn zu behalten."
        pt: "A vossa tribo será apagada dentro de um mês. Toca aqui para a manter."
        br: "A tribo de vocês será apagada em um mês. Toque aqui para mantê-la."
        nl: "Jullie stam wordt over een maand gewist. Tik hier om hem te houden."

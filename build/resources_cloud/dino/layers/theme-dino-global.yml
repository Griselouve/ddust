      tuto_clan_edit:
        fr: "Touche le crayon pour modifier l'avatar et le nom de la tribu."
        en: "Tap the pencil to change the tribe's avatar and name."
        es: "Toca el lápiz para cambiar el avatar y el nombre de la tribu."
        it: "Tocca la matita per modificare l'avatar e il nome della tribù."
        de: "Tippe auf den Stift, um Avatar und Namen des Stammes zu ändern."
        pt: "Toca no lápis para alterares o avatar e o nome da tribo."
        br: "Toque no lápis para alterar o avatar e o nome da tribo."
        nl: "Tik op het potlood om de avatar en de naam van de stam te wijzigen."
      tuto_clan_level:
        fr: "Le niveau de la tribu : il monte quand ses membres accomplissent des tâches."
        en: "The tribe level: it rises as its members complete tasks."
        es: "El nivel de la tribu: sube cuando sus miembros completan tareas."
        it: "Il livello della tribù: sale quando i suoi membri completano i compiti."
        de: "Die Stufe des Stammes: Sie steigt, wenn seine Mitglieder Aufgaben erledigen."
        pt: "O nível da tribo: sobe quando os seus membros cumprem tarefas."
        br: "O nível da tribo: sobe quando seus membros cumprem tarefas."

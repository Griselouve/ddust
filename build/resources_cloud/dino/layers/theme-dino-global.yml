      parental_consent_notice:
        fr: "Conformément aux conditions générales d'utilisation, en créant un profil de joueur pour un enfant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "In accordance with the terms of service, by creating a player profile for a child you declare that you are their legal guardian and you consent to the collection of their data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "De conformidad con las condiciones generales de uso, al crear un perfil de jugador para un niño declaras ser su responsable legal y consientes la recogida de sus datos. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        it: "In conformità con le Condizioni d'uso, creando un profilo giocatore per un bambino dichiari di esserne il tutore legale e acconsenti alla raccolta dei suoi dati. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."

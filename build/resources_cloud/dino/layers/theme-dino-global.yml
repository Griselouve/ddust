      tuto_combat_active_demo:
        fr: 'J''ai choisi une tâche pour toi, histoire de te montrer. La voici : c''est le dino dont tu t''occupes
          en ce moment.'
        en: 'I picked a task for you, just to show you how it works. Here it is: the dino you''re looking after
          right now.'
        es: 'He elegido una tarea por ti, solo para enseñarte cómo funciona. Aquí la tienes: el dino que cuidas
          ahora.'
        de: 'Ich habe eine Aufgabe für dich ausgesucht, nur um es dir zu zeigen. Hier ist sie: Das ist der Dino,
          um den du dich gerade kümmerst.'
        it: 'Ho scelto un compito per te, giusto per mostrarti come funziona. Eccolo: è il dino di cui ti prendi
          cura adesso.'
        pt: 'Escolhi uma tarefa por ti, só para te mostrar como funciona. Aqui está: é o dino de que estás a cuidar
          agora.'
        br: 'Escolhi uma tarefa para você, só para mostrar como funciona. Aqui está: é o dino de que você está cuidando
          agora.'
        nl: 'Ik heb een taak voor je gekozen, gewoon om het je te laten zien. Hier is hij: de dino voor wie je nu
          zorgt.'
      tuto_combat_active_intro:
        fr: 'Tu as pris une tâche : la voici, c''est le dino dont tu t''occupes en ce moment.'
        en: 'You''ve taken on a task: here it is, the dino you''re looking after right now.'
        es: 'Has asumido una tarea: aquí está, el dino que cuidas ahora.'
        de: 'Du hast eine Aufgabe übernommen: Hier ist sie, das ist der Dino, um den du dich gerade kümmerst.'
        it: 'Hai preso un compito: eccolo, è il dino di cui ti prendi cura adesso.'
        pt: 'Pegaste numa tarefa: aqui está, é o dino de que estás a cuidar agora.'
        br: 'Você pegou uma tarefa: aqui está, é o dino de que você está cuidando agora.'
        nl: 'Je hebt een taak aangenomen: hier is hij, de dino voor wie je nu zorgt.'
      tuto_combat_active_criteria:
        fr: Voici ce qu'il faut faire pour rendre le dino tout content.
        en: Here's what to do to make the dino happy.
        es: Esto es lo que hay que hacer para que el dino esté feliz.
        de: Das musst du tun, um den Dino glücklich zu machen.
        it: Ecco cosa fare per rendere felice il dino.
        pt: Isto é o que tens de fazer para deixar o dino contente.
        br: Isto é o que você precisa fazer para deixar o dino feliz.
        nl: Dit moet je doen om de dino blij te maken.
      tuto_combat_active_done:
        fr: Une fois la tâche faite pour de vrai, touche « J'ai fini ! ». Tu prendras une photo, ou une courte vidéo
          sans son, comme preuve.
        en: Once you've truly completed the task, tap “I'm done!”. You'll take a photo, or a short silent video,
          as proof.
        es: Una vez completada la tarea de verdad, toca «¡He terminado!». Harás una foto, o un vídeo corto sin sonido,
          como prueba.
        de: Sobald die Aufgabe wirklich erledigt ist, tippe auf „Ich bin fertig!“. Als Beweis machst du ein Foto
          oder ein kurzes Video ohne Ton.
        it: Una volta portato a termine il compito per davvero, tocca «Ho finito!». Come prova scatterai una foto,
          o girerai un breve video senza audio.
        pt: Depois de cumprires a tarefa a sério, toca em «Acabei!». Vais tirar uma fotografia, ou gravar um vídeo
          curto sem som, como prova.
        br: Depois de cumprir a tarefa de verdade, toque em "Terminei!". Você vai tirar uma foto, ou gravar um vídeo
          curto sem som, como prova.
        nl: Heb je de taak echt voltooid, tik dan op ‘Ik ben klaar!’. Je maakt een foto, of een korte video zonder
          geluid, als bewijs.
      tuto_combat_active_wait:
        fr: Tant que ta tâche n'est pas validée, tu ne peux pas t'occuper d'un autre dino. Une fois validée, tu
          gagnes ton XP et un nouveau dino t'attend !
        en: Until your task is validated, you can't look after another dino. Once validated, you earn your XP and
          a new dino is waiting for you!
        es: Mientras tu tarea no esté validada, no puedes cuidar de otro dino. Una vez validada, ganas tu XP y ¡otro
          dino te espera!
        de: Solange deine Aufgabe nicht bestätigt ist, kannst du dich um keinen anderen Dino kümmern. Sobald sie
          bestätigt ist, bekommst du deine XP und ein neuer Dino wartet auf dich!
        it: Finché il tuo compito non è convalidato, non puoi prenderti cura di un altro dino. Una volta convalidato,
          guadagni i tuoi XP e un nuovo dino ti aspetta!
        pt: Enquanto a tua tarefa não for validada, não podes cuidar de outro dino. Depois de validada, ganhas o
          teu XP e um novo dino espera por ti!
        br: Enquanto sua tarefa não for validada, você não pode cuidar de outro dino. Depois de validada, você ganha
          seu XP e um novo dino espera por você!
        nl: Zolang je taak niet gevalideerd is, kun je niet voor een andere dino zorgen. Zodra hij gevalideerd is,
          krijg je je XP en wacht er een nieuwe dino op je!
      tuto_combat_active_retreat:
        fr: "Si tu ne peux pas la terminer, touche « Je reviens plus tard » : la tâche redevient libre pour la tribu."
        en: "If you can't finish it, tap “I'll come back later”: the task becomes free for the tribe again."
        es: "Si no puedes terminarla, toca «Vuelvo luego»: la tarea vuelve a quedar libre para la tribu."
        it: "Se non riesci a finirlo, tocca «Torno dopo»: il compito torna libero per la tribù."
        de: "Wenn du sie nicht beenden kannst, tippe auf „Ich komme später wieder“: Die Aufgabe ist dann wieder frei für den Stamm."
        pt: "Se não conseguires terminá-la, toca em «Volto mais tarde»: a tarefa volta a ficar livre para a tribo."
        br: "Se não conseguir terminá-la, toque em \"Volto depois\": a tarefa volta a ficar livre para a tribo."
        nl: "Kun je hem niet afmaken, tik dan op ‘Ik kom later terug’: de taak is weer vrij voor de stam."
      adm_menu_revive_desc:
        fr: Réveiller une tâche endormie.
        en: Wake up a sleeping task.
        es: Despertar una tarea dormida.
        de: Eine eingeschlafene Aufgabe aufwecken.
        it: Svegliare un compito addormentato.
        pt: Acordar uma tarefa adormecida.
        br: Acordar uma tarefa adormecida.
        nl: Een ingeslapen taak wakker maken.
      reminder_recruit_dashboard:
        fr: "Bravo, tu viens de créer ta tribu ! Il te faut maintenant une équipe de gardiens de dinos. Va dans l'onglet « Tribu » et invite tes héros."
        en: "Well done, you have just founded your tribe! Now you need a team of dino keepers. Go to the « Tribe » tab and invite your heroes."
        es: "¡Enhorabuena, acabas de fundar tu tribu! Ahora necesitas un equipo de cuidadores de dinos. Ve a la pestaña « Tribu » e invita a tus héroes."
        it: "Bravo, hai appena fondato la tua tribù! Ora ti serve una squadra di guardiani dei dino. Vai nella scheda «Tribù» e invita i tuoi eroi."
        de: "Bravo, du hast gerade deinen Stamm gegründet! Jetzt brauchst du ein Team von Dino-Hütern. Geh zum Reiter „Stamm“ und lade deine Helden ein."
        pt: "Parabéns, acabaste de fundar a tua tribo! Agora precisas de uma equipa de guardiões dos dinos. Vai ao separador «Tribo» e convida os teus heróis."
        br: "Parabéns, você acabou de fundar sua tribo! Agora você precisa de uma equipe de cuidadores de dinos. Vá até a aba \"Tribo\" e convide seus heróis."
        nl: "Goed gedaan, je hebt net je stam opgericht! Nu heb je een team dinoverzorgers nodig. Ga naar het tabblad ‘Stam’ en nodig je helden uit."
      reminder_safety_child:
        fr: Les dinos sont imaginaires, mais les tâches sont réelles. Préviens toujours tes parents avant de commencer
          une tâche, et demande de l'aide tout de suite si quelque chose ne va pas. Aucun point d'expérience ne
          vaut un bobo.
        en: The dinos are make-believe, but the chores are real. Always tell your parents before you start a chore,
          and ask for help straight away if anything goes wrong. No amount of XP is worth getting hurt.
        es: Los dinos son imaginarios, ¡pero las tareas son reales! Avisa siempre a tus padres antes de empezar
          una tarea y pide ayuda enseguida si algo va mal. Ningún punto de experiencia vale hacerte daño.
        de: Die Dinos sind ausgedacht, aber die Aufgaben sind echt! Sag immer deinen Eltern Bescheid, bevor du mit
          einer Aufgabe anfängst, und bitte sofort um Hilfe, wenn etwas nicht stimmt. Kein Erfahrungspunkt ist ein
          Aua wert.
        it: I dino sono immaginari, ma i compiti sono veri! Avvisa sempre i tuoi genitori prima di iniziare un compito
          e chiedi subito aiuto se qualcosa non va. Nessun punto esperienza vale farsi male.
        pt: Os dinos são imaginários, mas as tarefas são reais! Avisa sempre os teus pais antes de começares uma
          tarefa e pede logo ajuda se alguma coisa correr mal. Nenhum ponto de experiência vale um dói-dói.
        br: Os dinos são imaginários, mas as tarefas são reais! Sempre avise seus pais antes de começar uma tarefa
          e peça ajuda na hora se alguma coisa der errado. Nenhum ponto de experiência vale um machucado.
        nl: De dino's zijn verzonnen, maar de klusjes zijn echt! Zeg het altijd tegen je ouders voordat je aan een
          taak begint, en vraag meteen hulp als er iets misgaat. Geen enkel ervaringspunt is een au waard.
      store_dunning_firm:
        fr: 'La cotisation n''est pas passée. La Vallée Verte vous attend : touchez ici.'
        en: 'The dues didn''t go through. Green Valley awaits: tap here.'
        es: 'La cuota no ha pasado. El Valle Verde te espera: toca aquí.'
        de: 'Der Beitrag ging nicht durch. Das Grüne Tal wartet auf dich: Tippe hier.'
        it: 'La quota non è passata. La Valle Verde ti aspetta: tocca qui.'
        pt: 'A quota não foi paga. O Vale Verde espera-te: toca aqui.'
        br: 'A assinatura não foi paga. O Vale Verde espera por você: toque aqui.'
        nl: 'De bijdrage is niet gelukt. De Groene Vallei wacht op je: tik hier.'
      store_dunning_last:
        fr: La grotte va se refermer. Touchez ici pour continuer.
        en: The cave is about to close. Tap here to carry on.
        es: La cueva va a cerrarse. Toca aquí para continuar.
        de: Die Höhle schließt sich gleich. Tippe hier, um weiterzumachen.
        it: La grotta sta per chiudersi. Tocca qui per continuare.
        pt: A gruta vai fechar-se. Toca aqui para continuar.
        br: A caverna vai se fechar. Toque aqui para continuar.
        nl: De grot gaat bijna dicht. Tik hier om door te gaan.

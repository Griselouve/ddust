        de: Welcher Dino braucht Hilfe, und wie machen wir ihn glücklich?
        it: Quale dino ha bisogno d'aiuto, e come lo rendiamo felice?
        pt: Que dino precisa de ajuda, e como o deixamos contente?
        br: Qual dino precisa de ajuda, e como deixar ele feliz?
        nl: Welke dino heeft hulp nodig, en hoe maken we hem blij?
      revive_in:
        fr: Revient dans
        en: Back in
        es: Vuelve en
        de: Kommt wieder in

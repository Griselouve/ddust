        fr: Le soir au coin du feu, quelles histoires raconte-t-on sur ta tribu ?
        en: In the evening by the campfire, what stories are told about your tribe?
        es: Por la noche junto al fuego, ¿qué historias se cuentan de tu tribu?
        de: Welche Geschichten erzählt man abends am Lagerfeuer über deinen Stamm?
        it: La sera attorno al falò, che storie si raccontano sulla tua tribù?

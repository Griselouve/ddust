# Thème « gentils dinosaures » (2026-10-12) : pour les plus jeunes. La Vallée Verte, une tribu de
# Cro-Magnon et de gentils dinosaures ; mêmes mécaniques que donjon, autre habillage (glossaire :
# E:\Deva\tmp\dino\glossaire.md). Couche FORCÉE au-dessus de donjon : ce qu'elle ne redit pas
# retombe sur donjon (textes comme images, cf. theme.themes.theme-dino.manifests).
# GÉNÉRÉ par E:\Deva\tmp\_dino_06_assemble.py depuis E:\Deva\tmp\dino\textes et \fragments.
name: theme-dino
above: theme-donjon
strategy: force
tenant: global
tags: [theme-dino]
data:
  lang:
    translations:
      # --- L'ADHÉSION À UN CLAN (2026-10-18) : le candidat montre patte blanche (QR code +
      #     code), le chef l'accueille, le représentant décide en différé (worker_join.dart).
      join_show_intro_adult:
        fr: "Pour entrer dans une tribu, il faut montrer patte blanche ! Montre ce QR code au chef de la tribu : il le scanne, lit les règles et t'ouvre la grotte. S'il est loin, lis-lui ton code au téléphone."
        en: "To enter a tribe, you must show you're a friend! Show this QR code to the tribe chief: they scan it, read the rules and open the cave for you. If they are far away, read them your code over the phone."
        es: "¡Para entrar en una tribu hay que demostrar que eres de fiar! Enseña este código QR al jefe de la tribu: lo escanea, lee las reglas y te abre la cueva. Si está lejos, léele tu código por teléfono."
        de: "Wer in einen Stamm will, muss sich ausweisen! Zeig diesen QR-Code dem Stammes-Chef: Er scannt ihn, liest die Regeln und öffnet dir die Höhle. Ist er weit weg, lies ihm deinen Code am Telefon vor."
        it: "Per entrare in una tribù bisogna farsi riconoscere! Mostra questo codice QR al capo della tribù: lo scansiona, legge le regole e ti apre la grotta. Se è lontano, leggigli il tuo codice al telefono."
        pt: "Para entrar numa tribo, tens de mostrar que és de confiança! Mostra este código QR ao chefe da tribo: ele digitaliza-o, lê as regras e abre-te a gruta. Se estiver longe, lê-lhe o teu código ao telefone."
        br: "Para entrar em uma tribo, você precisa mostrar que é de confiança! Mostre este QR Code ao chefe da tribo: ele escaneia, lê as regras e abre a caverna para você. Se ele estiver longe, leia seu código para ele pelo telefone."
        nl: "Wie een stam in wil, moet laten zien wie hij is! Laat deze QR-code aan het stamhoofd zien: hij scant hem, leest de regels en doet de grot voor je open. Is hij ver weg, lees hem dan je code voor aan de telefoon."
      join_show_intro_kid:
        fr: "Pour entrer dans la tribu, il faut montrer patte blanche ! Montre ce QR code à tes parents : ils le scannent, lisent tes règles et t'ouvrent la grotte. S'ils sont loin, lis-leur ton code au téléphone."
        en: "To enter the tribe, you must show you're a friend! Show this QR code to your parents: they scan it, read your rules and open the cave for you. If they are far away, read them your code over the phone."
        es: "¡Para entrar en la tribu hay que demostrar que eres de fiar! Enseña este código QR a tus padres: lo escanean, leen tus reglas y te abren la cueva. Si están lejos, léeles tu código por teléfono."
        de: "Wer in den Stamm will, muss sich ausweisen! Zeig diesen QR-Code deinen Eltern: Sie scannen ihn, lesen deine Regeln und öffnen dir die Höhle. Sind sie weit weg, lies ihnen deinen Code am Telefon vor."
        it: "Per entrare nella tribù bisogna farsi riconoscere! Mostra questo codice QR ai tuoi genitori: lo scansionano, leggono le tue regole e ti aprono la grotta. Se sono lontani, leggi loro il tuo codice al telefono."
        pt: "Para entrar na tribo, tens de mostrar que és de confiança! Mostra este código QR aos teus pais: eles digitalizam-no, leem as tuas regras e abrem-te a gruta. Se estiverem longe, lê-lhes o teu código ao telefone."
        br: "Para entrar na tribo, você precisa mostrar que é de confiança! Mostre este QR Code para os seus pais: eles escaneiam, leem as suas regras e abrem a caverna para você. Se estiverem longe, leia o seu código para eles pelo telefone."
        nl: "Wie de stam in wil, moet laten zien wie hij is! Laat deze QR-code aan je ouders zien: zij scannen hem, lezen jouw regels en doen de grot voor je open. Zijn ze ver weg, lees hun dan je code voor aan de telefoon."
      join_show_family:
        fr: "La tribu « {clan} », menée par {chief}, t'accueille. C'est bien ta famille ?"
        en: "The tribe “{clan}”, led by {chief}, is welcoming you. Is this really your family?"
        es: "La tribu «{clan}», dirigida por {chief}, te acoge. ¿Es de verdad tu familia?"
        de: "Der Stamm „{clan}“, angeführt von {chief}, nimmt dich auf. Ist das wirklich deine Familie?"
        it: "La tribù «{clan}», guidata da {chief}, ti accoglie. È davvero la tua famiglia?"
        pt: "A tribo «{clan}», liderada por {chief}, está a acolher-te. É mesmo a tua família?"
        br: "A tribo “{clan}”, liderada por {chief}, está acolhendo você. É mesmo a sua família?"
        nl: "De stam ‘{clan}’, geleid door {chief}, verwelkomt je. Is dit echt je familie?"
      join_show_family_adult:
        fr: "La tribu « {clan} », menée par {chief}, t'accueille. C'est bien ta tribu ?"
        en: "The tribe “{clan}”, led by {chief}, is welcoming you. Is this really your tribe?"
        es: "La tribu «{clan}», dirigida por {chief}, te acoge. ¿Es de verdad tu tribu?"
        de: "Der Stamm „{clan}“, angeführt von {chief}, nimmt dich auf. Ist das wirklich dein Stamm?"
        it: "La tribù «{clan}», guidata da {chief}, ti accoglie. È davvero la tua tribù?"
        pt: "A tribo «{clan}», liderada por {chief}, está a acolher-te. É mesmo a tua tribo?"
        br: "A tribo “{clan}”, liderada por {chief}, está acolhendo você. É mesmo a sua tribo?"
        nl: "De stam ‘{clan}’, geleid door {chief}, verwelkomt je. Is dit echt je stam?"
      join_show_new_code:
        fr: "Voici un nouveau code : montre-le au chef de la tribu, ou lis-le-lui."
        en: "Here is a new code: show it to the tribe chief, or read it out to them."
        es: "Aquí tienes un código nuevo: enséñaselo al jefe de la tribu, o léeselo."
        de: "Hier ist ein neuer Code: Zeig ihn dem Stammes-Chef oder lies ihn ihm vor."
        it: "Ecco un nuovo codice: mostralo al capo della tribù, o leggiglielo."
        pt: "Aqui tens um código novo: mostra-o ao chefe da tribo, ou lê-lho."
        br: "Aqui está um código novo: mostre ao chefe da tribo, ou leia para ele."
        nl: "Hier is een nieuwe code: laat hem aan het stamhoofd zien, of lees hem voor."
      join_show_error:
        fr: "La tribu n'a pas pu t'ouvrir sa grotte. Voici un nouveau code : réessayez ensemble."
        en: "The tribe could not open its cave for you. Here is a new code: try again together."
        es: "La tribu no ha podido abrirte la cueva. Aquí tienes un código nuevo: volved a intentarlo juntos."
        de: "Der Stamm konnte dir die Höhle nicht öffnen. Hier ist ein neuer Code: Versucht es zusammen noch einmal."
        it: "La tribù non è riuscita ad aprirti la grotta. Ecco un nuovo codice: riprovate insieme."
        pt: "A tribo não conseguiu abrir-te a gruta. Aqui tens um código novo: tentem outra vez juntos."
        br: "A tribo não conseguiu abrir a caverna para você. Aqui está um código novo: tentem de novo juntos."
        nl: "De stam kon de grot niet voor je openen. Hier is een nieuwe code: probeer het samen opnieuw."
      join_show_leave:
        fr: "Revenir à ma tribu"
        en: "Back to my tribe"
        es: "Volver a mi tribu"
        de: "Zurück zu meinem Stamm"
        it: "Torna alla mia tribù"
        pt: "Voltar à minha tribo"
        br: "Voltar para a minha tribo"
        nl: "Terug naar mijn stam"
      join_guest_waiting:
        fr: "Ta demande est partie chez tes parents : tu entreras dans cette nouvelle tribu dès qu'ils auront dit oui."
        en: "Your request has gone to your parents: you will enter this new tribe as soon as they say yes."
        es: "Tu solicitud ha llegado a tus padres: entrarás en esta nueva tribu en cuanto digan que sí."
        de: "Deine Anfrage ist bei deinen Eltern: Du kommst in diesen neuen Stamm, sobald sie Ja sagen."
        it: "La tua richiesta è arrivata ai tuoi genitori: entrerai in questa nuova tribù appena diranno di sì."
        pt: "O teu pedido foi para os teus pais: vais entrar nesta nova tribo assim que eles disserem que sim."
        br: "Seu pedido foi para os seus pais: você vai entrar nesta nova tribo assim que eles disserem sim."
        nl: "Je verzoek is bij je ouders: je komt in deze nieuwe stam zodra zij ja zeggen."
      join_guest_refused:
        fr: "Tes parents n'ont pas accepté cette nouvelle tribu."
        en: "Your parents did not accept this new tribe."
        es: "Tus padres no han aceptado esta nueva tribu."
        de: "Deine Eltern haben diesen neuen Stamm nicht angenommen."
        it: "I tuoi genitori non hanno accettato questa nuova tribù."
        pt: "Os teus pais não aceitaram esta nova tribo."
        br: "Seus pais não aceitaram esta nova tribo."
        nl: "Je ouders hebben deze nieuwe stam niet geaccepteerd."
      join_guest_expired:
        fr: "Tes parents n'ont pas répondu à temps : demande au chef de cette tribu de t'accueillir de nouveau."
        en: "Your parents did not answer in time: ask the chief of that tribe to welcome you again."
        es: "Tus padres no han respondido a tiempo: pide al jefe de esa tribu que te acoja de nuevo."
        de: "Deine Eltern haben nicht rechtzeitig geantwortet: Bitte den Chef dieses Stammes, dich noch einmal aufzunehmen."
        it: "I tuoi genitori non hanno risposto in tempo: chiedi al capo di quella tribù di accoglierti di nuovo."
        pt: "Os teus pais não responderam a tempo: pede ao chefe dessa tribo que te acolha de novo."
        br: "Seus pais não responderam a tempo: peça ao chefe dessa tribo para acolher você de novo."
        nl: "Je ouders hebben niet op tijd geantwoord: vraag het hoofd van die stam om je opnieuw te verwelkomen."
      join_guest_lost:
        fr: "Tes parents ont dit oui, mais ta demande s'est perdue en route : demande au chef de cette tribu de t'accueillir de nouveau."
        en: "Your parents said yes, but your request got lost on the way: ask the chief of that tribe to welcome you again."
        es: "Tus padres dijeron que sí, pero tu solicitud se perdió por el camino: pide al jefe de esa tribu que te acoja de nuevo."
        de: "Deine Eltern haben Ja gesagt, aber deine Anfrage ist unterwegs verloren gegangen: Bitte den Chef dieses Stammes, dich noch einmal aufzunehmen."
        it: "I tuoi genitori hanno detto di sì, ma la tua richiesta si è persa per strada: chiedi al capo di quella tribù di accoglierti di nuovo."
        pt: "Os teus pais disseram que sim, mas o teu pedido perdeu-se pelo caminho: pede ao chefe dessa tribo que te acolha de novo."
        br: "Seus pais disseram sim, mas seu pedido se perdeu no caminho: peça ao chefe dessa tribo para acolher você de novo."
        nl: "Je ouders zeiden ja, maar je verzoek is onderweg zoekgeraakt: vraag het hoofd van die stam om je opnieuw te verwelkomen."
      clan_menu_welcome_desc:
        fr: "Un adulte ou ton enfant te montre son QR code (ou te lit son code) : tu le fais entrer dans la tribu"
        en: "An adult or your child shows you their QR code (or reads you their code): you let them into the tribe"
        es: "Un adulto o tu hijo te enseña su código QR (o te lee su código): lo haces entrar en la tribu"
        de: "Ein Erwachsener oder dein Kind zeigt dir seinen QR-Code (oder liest dir seinen Code vor): Du nimmst ihn in den Stamm auf"
        it: "Un adulto o tuo figlio ti mostra il suo codice QR (o ti legge il suo codice): lo fai entrare nella tribù"
        pt: "Um adulto ou o teu filho mostra-te o código QR (ou lê-te o código): fá-lo entrar na tribo"
        br: "Um adulto ou seu filho mostra o QR Code dele (ou lê o código para você): você o deixa entrar na tribo"
        nl: "Een volwassene of je kind laat je zijn QR-code zien (of leest zijn code voor): jij laat hem de stam in"
      welcome_intro:
        fr: "Installe le jeu sur son téléphone. Il touche « Rejoindre une tribu » et te montre son QR code (un enfant dit d'abord qu'il veut jouer).\n\nScanne-le : tu verras si c'est un adulte ou un enfant avant de décider."
        en: "Install the game on their phone. They tap “Join a tribe” and show you their QR code (a child first says they want to play).\n\nScan it: you will see whether it is an adult or a child before you decide."
        es: "Instala el juego en su teléfono. Toca «Unirse a una tribu» y te enseña su código QR (un niño dice primero que quiere jugar).\n\nEscanéalo: verás si es un adulto o un niño antes de decidir."
        de: "Installiere das Spiel auf seinem Handy. Er tippt auf „Einem Stamm beitreten“ und zeigt dir seinen QR-Code (ein Kind sagt zuerst, dass es spielen will).\n\nScanne ihn: Du siehst, ob es ein Erwachsener oder ein Kind ist, bevor du entscheidest."
        it: "Installa il gioco sul suo telefono. Tocca «Unisciti a una tribù» e ti mostra il suo codice QR (un bambino dice prima che vuole giocare).\n\nScansionalo: vedrai se è un adulto o un bambino prima di decidere."
        pt: "Instala o jogo no telemóvel dele. Toca em «Juntar-me a uma tribo» e mostra-te o código QR (uma criança diz primeiro que quer jogar).\n\nDigitaliza-o: vais ver se é um adulto ou uma criança antes de decidires."
        br: "Instale o jogo no celular dele. Ele toca em “Entrar em uma tribo” e mostra o QR Code para você (uma criança diz primeiro que quer jogar).\n\nEscaneie: você vai ver se é um adulto ou uma criança antes de decidir."
        nl: "Installeer het spel op zijn telefoon. Hij tikt op ‘Lid worden van een stam’ en laat je zijn QR-code zien (een kind zegt eerst dat het wil spelen).\n\nScan hem: je ziet of het een volwassene of een kind is voordat je beslist."
      welcome_not_join_qr:
        fr: "Ce QR code n'est pas celui d'un joueur qui demande à entrer. Il doit toucher « Rejoindre une tribu » et te montrer son écran."
        en: "This QR code is not from a player asking to join. They must tap “Join a tribe” and show you their screen."
        es: "Este código QR no es el de un jugador que pide entrar. Tiene que tocar «Unirse a una tribu» y enseñarte su pantalla."
        de: "Dieser QR-Code gehört keinem Spieler, der hinein möchte. Er muss auf „Einem Stamm beitreten“ tippen und dir seinen Bildschirm zeigen."
        it: "Questo codice QR non è di un giocatore che chiede di entrare. Deve toccare «Unisciti a una tribù» e mostrarti il suo schermo."
        pt: "Este código QR não é de um jogador que pede para entrar. Tem de tocar em «Juntar-me a uma tribo» e mostrar-te o ecrã."
        br: "Este QR Code não é de um jogador que pede para entrar. Ele precisa tocar em “Entrar em uma tribo” e mostrar a tela para você."
        nl: "Deze QR-code is niet van een speler die erin wil. Hij moet op ‘Lid worden van een stam’ tikken en je zijn scherm laten zien."
      welcome_sent:
        fr: "C'est fait ! Votre enfant va relier son compte, puis il entrera dans la tribu."
        en: "Done! Your child will link their account, then join the tribe."
        es: "¡Hecho! Tu hijo va a vincular su cuenta y después entrará en la tribu."
        de: "Erledigt! Dein Kind verknüpft jetzt sein Konto und kommt dann in den Stamm."
        it: "Fatto! Tuo figlio collegherà il suo account, poi entrerà nella tribù."
        pt: "Feito! O teu filho vai ligar a conta dele e depois entra na tribo."
        br: "Pronto! Seu filho vai vincular a conta dele e depois entrar na tribo."
        nl: "Klaar! Je kind koppelt nu zijn account en komt dan de stam in."
      welcome_sent_adult:
        fr: "C'est fait ! Il entre dans la tribu."
        en: "Done! They are entering the tribe."
        es: "¡Hecho! Ya entra en la tribu."
        de: "Erledigt! Er kommt jetzt in den Stamm."
        it: "Fatto! Sta entrando nella tribù."
        pt: "Feito! Está a entrar na tribo."
        br: "Pronto! Ele está entrando na tribo."
        nl: "Klaar! Hij komt de stam in."
      welcome_sent_guest:
        fr: "C'est fait ! Ses parents vont recevoir la demande : il entrera dès qu'ils auront dit oui."
        en: "Done! Their parents will receive the request: they will join as soon as the parents say yes."
        es: "¡Hecho! Sus padres recibirán la solicitud: entrará en cuanto digan que sí."
        de: "Erledigt! Seine Eltern bekommen die Anfrage: Es kommt herein, sobald sie Ja sagen."
        it: "Fatto! I suoi genitori riceveranno la richiesta: entrerà appena diranno di sì."
        pt: "Feito! Os pais vão receber o pedido: entra assim que disserem que sim."
        br: "Pronto! Os pais vão receber o pedido: a criança entra assim que eles disserem sim."
        nl: "Klaar! Zijn ouders krijgen het verzoek: hij komt erin zodra zij ja zeggen."
      welcome_sent_back:
        fr: "Retour à la tribu"
        en: "Back to the tribe"
        es: "Volver a la tribu"
        de: "Zurück zum Stamm"
        it: "Torna alla tribù"
        pt: "Voltar à tribo"
        br: "Voltar à tribo"
        nl: "Terug naar de stam"
      invite_consent_head_adult:
        fr: "Un adulte demande à entrer dans votre tribu."
        en: "An adult is asking to join your tribe."
        es: "Un adulto pide entrar en tu tribu."
        de: "Ein Erwachsener möchte in deinen Stamm."
        it: "Un adulto chiede di entrare nella tua tribù."
        pt: "Um adulto pede para entrar na tua tribo."
        br: "Um adulto está pedindo para entrar na sua tribo."
        nl: "Een volwassene vraagt om je stam in te mogen."
      invite_consent_assent_guest:
        fr: "Cet enfant fait déjà partie d'une autre tribu. Il a dit qu'il voulait rejoindre la vôtre, le {date}. Voici le texte qui lui a été montré :\n\n« {text} »"
        en: "This child already belongs to another tribe. They said they wanted to join yours, on {date}. Here is the text they were shown:\n\n“{text}”"
        es: "Este niño ya forma parte de otra tribu. Dijo que quería unirse a la tuya, el {date}. Este es el texto que se le mostró:\n\n«{text}»"
        de: "Dieses Kind gehört schon zu einem anderen Stamm. Es hat am {date} gesagt, dass es in deinen möchte. Dieser Text wurde ihm gezeigt:\n\n„{text}“"
        it: "Questo bambino fa già parte di un'altra tribù. Ha detto di voler entrare nella tua, il {date}. Ecco il testo che gli è stato mostrato:\n\n«{text}»"
        pt: "Esta criança já faz parte de outra tribo. Disse que queria juntar-se à tua, em {date}. Eis o texto que lhe foi mostrado:\n\n«{text}»"
        br: "Esta criança já faz parte de outra tribo. Ela disse que queria entrar na sua, em {date}. Este é o texto que foi mostrado a ela:\n\n“{text}”"
        nl: "Dit kind hoort al bij een andere stam. Het heeft op {date} gezegd dat het bij de jouwe wil. Dit is de tekst die het te zien kreeg:\n\n‘{text}’"
      invite_consent_notice_guest:
        fr: "Vous accueillez un enfant d'une autre tribu : vous ne décidez rien pour lui. Ses parents recevront la demande et décideront. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "You are welcoming a child from another tribe: you decide nothing for them. Their parents will receive the request and decide. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "Acoges a un niño de otra tribu: no decides nada por él. Sus padres recibirán la solicitud y decidirán. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        de: "Du nimmst ein Kind aus einem anderen Stamm auf: Du entscheidest nichts für es. Seine Eltern bekommen die Anfrage und entscheiden. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        it: "Accogli un bambino di un'altra tribù: non decidi nulla per lui. I suoi genitori riceveranno la richiesta e decideranno. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        pt: "Acolhes uma criança de outra tribo: não decides nada por ela. Os pais vão receber o pedido e decidir. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "Você está acolhendo uma criança de outra tribo: você não decide nada por ela. Os pais vão receber o pedido e decidir. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Je verwelkomt een kind uit een andere stam: jij beslist niets voor hem. Zijn ouders krijgen het verzoek en beslissen. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      invite_ack_guest:
        fr: "J'accueille un enfant d'une autre tribu : ses parents décideront"
        en: "I am welcoming a child from another tribe: their parents will decide"
        es: "Acojo a un niño de otra tribu: sus padres decidirán"
        de: "Ich nehme ein Kind aus einem anderen Stamm auf: Seine Eltern entscheiden"
        it: "Accolgo un bambino di un'altra tribù: decideranno i suoi genitori"
        pt: "Acolho uma criança de outra tribo: os pais dela vão decidir"
        br: "Estou acolhendo uma criança de outra tribo: os pais dela vão decidir"
        nl: "Ik verwelkom een kind uit een andere stam: zijn ouders beslissen"
      guardian_hub_guest_requests:
        fr: "Demandes d'autres tribus"
        en: "Requests from other tribes"
        es: "Solicitudes de otras tribus"
        de: "Anfragen anderer Stämme"
        it: "Richieste di altre tribù"
        pt: "Pedidos de outras tribos"
        br: "Pedidos de outras tribos"
        nl: "Verzoeken van andere stammen"
      ward_requests_hint:
        fr: "Un de tes enfants demande à rejoindre une autre tribu. Touche la demande pour la lire et décider."
        en: "One of your children is asking to join another tribe. Tap the request to read it and decide."
        es: "Uno de tus hijos pide unirse a otra tribu. Toca la solicitud para leerla y decidir."
        de: "Eines deiner Kinder möchte einem anderen Stamm beitreten. Tippe auf die Anfrage, um sie zu lesen und zu entscheiden."
        it: "Uno dei tuoi figli chiede di entrare in un'altra tribù. Tocca la richiesta per leggerla e decidere."
        pt: "Um dos teus filhos pede para se juntar a outra tribo. Toca no pedido para o leres e decidires."
        br: "Um dos seus filhos está pedindo para entrar em outra tribo. Toque no pedido para ler e decidir."
        nl: "Een van je kinderen vraagt om bij een andere stam te mogen. Tik op het verzoek om het te lezen en te beslissen."
      ward_request_head:
        fr: "{name} voudrait rejoindre la tribu « {clan} », menée par {chief}. Sa demande date du {date}. Voici le texte qui lui a été montré :\n\n« {text} »"
        en: "{name} would like to join the tribe “{clan}”, led by {chief}. The request dates from {date}. Here is the text they were shown:\n\n“{text}”"
        es: "{name} quiere unirse a la tribu «{clan}», dirigida por {chief}. La solicitud es del {date}. Este es el texto que se le mostró:\n\n«{text}»"

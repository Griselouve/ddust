      tuto_clan_roster:
        fr: "Les membres de la tribu sont listés ici."
        en: "The tribe members are listed here."
        es: "Los miembros de la tribu aparecen aquí."
        it: "Qui sono elencati i membri della tribù."
        de: "Hier sind die Mitglieder des Stammes aufgelistet."
        pt: "Os membros da tribo estão listados aqui."
        br: "Os membros da tribo estão listados aqui."
        nl: "Hier staan de leden van de stam."
      roster_menu_support_desc:
        fr: "Offrir de l'expérience à celui qui est le plus en retard dans la tribu : lui seul y a droit, et une fois tous les trois jours par chef de la tribu."
        en: "Give experience to whoever is furthest behind in the tribe: only they are eligible, and once every three days per tribe chief."
        es: "Dar experiencia a quien más atrasado va en la tribu: solo él puede recibirlo, y una vez cada tres días por jefe de la tribu."
        it: "Regalare esperienza a chi è più indietro nella tribù: solo lui ne ha diritto, e una volta ogni tre giorni per capo della tribù."
        de: "Dem Spieler, der im Stamm am weitesten zurückliegt, Erfahrung schenken: Nur er hat Anspruch darauf, und das einmal alle drei Tage pro Stammes-Chef."
        pt: "Oferecer experiência a quem está mais atrasado na tribo: só ele tem direito, e uma vez a cada três dias por chefe da tribo."
        br: "Dar experiência a quem está mais atrasado na tribo: só ele tem direito, e uma vez a cada três dias por chefe da tribo."
        nl: "Ervaring geven aan wie het verst achterloopt in de stam: alleen hij heeft er recht op, en één keer per drie dagen per stamhoofd."
      roster_menu_promote_chief_desc:
        fr: "Le nommer chef de la tribu."
        en: "Make them a tribe chief."
        es: "Nombrarlo jefe de la tribu."
        it: "Nominarlo capo della tribù."
        de: "Ihn zum Stammes-Chef ernennen."
        pt: "Nomeá-lo chefe da tribo."
        br: "Nomeá-lo chefe da tribo."
        nl: "Hem tot stamhoofd benoemen."
      roster_menu_nomore_chief_desc:
        fr: "Lui retirer son rôle de chef de la tribu."
        en: "Remove their tribe chief role."
        es: "Quitarle su rol de jefe de la tribu."
        it: "Togliergli il ruolo di capo della tribù."
        de: "Ihm die Rolle als Stammes-Chef entziehen."
        pt: "Retirar-lhe o papel de chefe da tribo."
        br: "Tirar dele o papel de chefe da tribo."
        nl: "Hem zijn rol als stamhoofd afnemen."
      roster_menu_revoke_desc:
        fr: "Le retirer de la tribu."
        en: "Remove them from the tribe."
        es: "Expulsarlo de la tribu."
        it: "Rimuoverlo dalla tribù."
        de: "Ihn aus dem Stamm entfernen."
        pt: "Retirá-lo da tribo."
        br: "Tirá-lo da tribo."
        nl: "Hem uit de stam verwijderen."
      roster_menu_withdraw_consent_desc:
        fr: "Cesser de traiter ses données. Il quitte le jeu ; un chef de la tribu peut revenir sur cette décision pendant 3 jours."
        en: "Stop processing their data. They leave the game; a tribe chief can reverse this for 3 days."
        es: "Dejar de tratar sus datos. Sale del juego; un jefe de la tribu puede revocarlo durante 3 días."
        it: "Smettere di trattare i suoi dati. Lascia il gioco; un capo della tribù può annullare questa decisione per 3 giorni."
        de: "Die Verarbeitung seiner Daten beenden. Er verlässt das Spiel; ein Stammes-Chef kann diese Entscheidung 3 Tage lang rückgängig machen."
        pt: "Deixar de tratar os seus dados. Sai do jogo; um chefe da tribo pode reverter esta decisão durante 3 dias."
        br: "Deixar de tratar os dados dele. Ele sai do jogo; um chefe da tribo pode reverter esta decisão durante 3 dias."
        nl: "Stoppen met het verwerken van zijn gegevens. Hij verlaat het spel; een stamhoofd kan dit besluit 3 dagen lang terugdraaien."

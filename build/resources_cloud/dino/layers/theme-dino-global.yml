        br: 'Jogo Donjons & Savons em família: as tarefas de casa viram dinos pra cuidar. Venha para a tribo!'
        nl: 'Ik speel Donjons & Savons met het gezin: huishoudelijke klusjes worden dino''s om te verzorgen. Kom
          bij de stam!'

          Verzin DAARNA een TWEEDE stamnaam, die dient als openbaar pseudoniem: dezelfde taal, dezelfde stijl en dezelfde lengte als de eerste, maar GEEN enkel woord gemeen met de eerste; het moet onmogelijk zijn om de eerste uit de tweede af te leiden. Schrijf op dezelfde manier een tweede beschrijving, die hetzelfde op een andere manier zegt, zonder de beelden of de kenmerkende woorden van de eerste over te nemen.
          Antwoord UITSLUITEND in precies dit formaat, IN DEZE VOLGORDE, en behoud de markeringen ALIAS:, ALIAS_DESCRIPTION:, NOM: en DESCRIPTION: zoals ze zijn (vertaal ze niet, verander hun volgorde niet):

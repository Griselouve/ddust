        br: À noite, na fogueira, que histórias contam sobre a sua tribo?
        nl: Welke verhalen vertelt men 's avonds bij het kampvuur over je stam?
      inspire_fallback_0_name:
        fr: La Tribu du Nid Douillet
        en: The Cozy Nest Tribe
        es: La Tribu del Nido Calentito
        de: Der Stamm vom Kuschelnest
        it: La Tribù del Nido Accogliente
        pt: A Tribo do Ninho Quentinho
        br: A Tribo do Ninho Quentinho
        nl: De Stam van het Knusse Nest
      inspire_fallback_0_desc:
        fr: 'Une famille qui s''entraide pour garder la grotte bien douillette. Leur devise : « Ensemble, on rend
          les dinos tout contents ! »'
        en: 'A family that helps each other keep the cave cozy. Their motto: “Together, we make the dinos happy!”'
        es: 'Una familia que se ayuda para que la cueva esté calentita. Su lema: «¡Juntos hacemos felices a los
          dinos!»'
        de: 'Eine Familie, die zusammenhilft, damit die Höhle gemütlich bleibt. Ihr Motto: „Zusammen machen wir
          die Dinos glücklich!“'
        it: 'Una famiglia che si aiuta per tenere la grotta accogliente. Il loro motto: «Insieme rendiamo felici
          i dino!»'
        pt: 'Uma família que se ajuda para manter a gruta quentinha. O lema deles: «Juntos, deixamos os dinos contentes!»'
        br: 'Uma família que se ajuda para deixar a caverna quentinha. O lema deles: “Juntos, deixamos os dinos
          felizes!”'
        nl: 'Een familie die elkaar helpt om de grot knus te houden. Hun motto: ‘Samen maken we de dino''s blij!’'
      inspire_fallback_1_name:
        fr: Les Amis du Matin
        en: The Morning Friends
        es: Los Amigos de la Mañana
        de: Die Morgenfreunde
        it: Gli Amici del Mattino
        pt: Os Amigos da Manhã
        br: Os Amigos da Manhã
        nl: De Ochtendvrienden
      inspire_fallback_1_desc:
        fr: Chaque matin est une nouvelle fête. Cette tribu s'occupe des dinos avec courage et le sourire, car pour
          elle, on n'abandonne jamais.
        en: Every morning is a new party. This tribe looks after the dinos with courage and a smile, because they
          never give up.
        es: Cada mañana es una nueva fiesta. Esta tribu cuida de los dinos con valor y una sonrisa, porque nunca
          se rinde.
        de: Jeder Morgen ist ein neues Fest. Dieser Stamm kümmert sich fleißig und fröhlich um die Dinos, denn aufgeben
          gibt es hier nicht.
        it: Ogni mattina è una nuova festa. Questa tribù si prende cura dei dino con coraggio e un sorriso, perché
          non si arrende mai.
        pt: Cada manhã é uma nova festa. Esta tribo cuida dos dinos com coragem e um sorriso, porque nunca desiste.
        br: Cada manhã é uma nova festa. Esta tribo cuida dos dinos com coragem e um sorriso, porque nunca desiste.
        nl: Elke ochtend is een nieuw feest. Deze stam zorgt dapper en vrolijk voor de dino's, want opgeven doen
          ze nooit.
      inspire_fallback_2_name:
        fr: Les Anciens du Feu
        en: The Elders of the Fire
        es: Los Ancianos del Fuego
        de: Die Alten vom Feuer
        it: Gli Anziani del Fuoco
        pt: Os Anciãos da Fogueira
        br: Os Anciões da Fogueira
        nl: De Ouden van het Vuur
      inspire_fallback_2_desc:
        fr: 'Ils connaissent tous les secrets de la vallée et apprennent aux petits à bien s''occuper des dinos.
          Leur feu ne s''éteint jamais : il réchauffe toute la tribu.'
        en: 'They know all the secrets of the valley and teach the little ones how to look after the dinos. Their
          fire never goes out: it warms the whole tribe.'
        es: 'Conocen todos los secretos del valle y enseñan a los peques a cuidar de los dinos. Su fuego nunca se
          apaga: calienta a toda la tribu.'
        de: 'Sie kennen alle Geheimnisse des Tals und zeigen den Kleinen, wie man sich um die Dinos kümmert. Ihr
          Feuer geht nie aus: Es wärmt den ganzen Stamm.'
        it: 'Conoscono tutti i segreti della valle e insegnano ai piccoli a prendersi cura dei dino. Il loro fuoco
          non si spegne mai: scalda tutta la tribù.'
        pt: 'Conhecem todos os segredos do vale e ensinam os miúdos a cuidar dos dinos. A fogueira deles nunca se
          apaga: aquece a tribo inteira.'
        br: 'Eles conhecem todos os segredos do vale e ensinam a criançada a cuidar dos dinos. A fogueira deles
          nunca se apaga: aquece a tribo inteira.'
        nl: 'Ze kennen alle geheimen van de vallei en leren de kleintjes hoe je voor de dino''s zorgt. Hun vuur
          gaat nooit uit: het verwarmt de hele stam.'
      inspire_fallback_3_name:
        fr: Les Copains du Balai
        en: The Broom Buddies
        es: Los Amigos de la Escoba
        de: Die Besenfreunde
        it: Gli Amici della Scopa
        pt: Os Amigos da Vassoura
        br: A Turma da Vassoura
        nl: De Bezemvriendjes
      inspire_fallback_3_desc:
        fr: Avec leurs balais et leur bonne humeur, ils font partir la poussière de grotte en grotte. Aucune toile
          d'araignée ne leur échappe.
        en: With their brooms and their good mood, they sweep the dust away from cave to cave. No cobweb ever gets
          past them.
        es: Con sus escobas y su buen humor, quitan el polvo de cueva en cueva. No se les escapa ni una telaraña.
        de: Mit Besen und guter Laune fegen sie den Staub von Höhle zu Höhle. Kein Spinnennetz entgeht ihnen.
        it: Con le loro scope e il loro buonumore, spazzano via la polvere di grotta in grotta. Nessuna ragnatela
          sfugge loro.
        pt: Com as vassouras e o bom humor, varrem o pó de gruta em gruta. Nenhuma teia de aranha lhes escapa.
        br: Com as vassouras e o bom humor, varrem a poeira de caverna em caverna. Nenhuma teia de aranha escapa
          deles.
        nl: Met hun bezems en hun goede humeur vegen ze het stof weg, van grot tot grot. Geen spinnenweb ontsnapt
          aan hen.
      inspire_fallback_4_name:
        fr: La Bande de l'Éponge
        en: The Sponge Bunch
        es: La Pandilla de la Esponja
        de: Die Schwamm-Bande
        it: La Banda della Spugna
        pt: O Bando da Esponja
        br: A Turma da Esponja
        nl: De Sponsbende
      inspire_fallback_4_desc:
        fr: 'Leur promesse : ne jamais laisser une assiette seule dans l''évier. Ensemble, ils font de la vaisselle
          une vraie fête.'
        en: 'Their promise: never leave a plate alone in the sink. Together, they turn the washing-up into a real
          party.'
        es: 'Su promesa: no dejar nunca un plato solo en el fregadero. Juntos, convierten fregar los platos en una
          fiesta.'
        de: 'Ihr Versprechen: nie einen Teller allein in der Spüle lassen. Zusammen machen sie aus dem Abwasch ein
          echtes Fest.'
        it: 'La loro promessa: non lasciare mai un piatto da solo nel lavandino. Insieme, trasformano i piatti in
          una vera festa.'
        pt: 'A promessa deles: nunca deixar um prato sozinho no lava-loiça. Juntos, fazem da loiça uma verdadeira
          festa.'
        br: 'A promessa deles: nunca deixar um prato sozinho na pia. Juntos, transformam a louça numa festa de verdade.'
        nl: 'Hun belofte: nooit een bord alleen in de gootsteen laten. Samen maken ze van de afwas een echt feestje.'
      inspire_fallback_5_name:
        fr: Les Veilleurs de la Grotte
        en: The Cave Watchers
        es: Los Vigilantes de la Cueva
        de: Die Höhlenwächter
        it: Le Sentinelle della Grotta
        pt: Os Vigias da Gruta
        br: Os Vigias da Caverna
        nl: De Grotwachters
      inspire_fallback_5_desc:
        fr: Rien ne traîne quand ils sont là. Ils passent dans chaque pièce et rangent le bazar avant qu'il ne s'installe.
        en: Nothing is left lying around when they're here. They visit every room and tidy the mess before it settles
          in.
        es: Nada se queda tirado cuando están ellos. Pasan por cada habitación y recogen el desorden antes de que
          se instale.
        de: Nichts bleibt liegen, wenn sie da sind. Sie gehen durch jedes Zimmer und räumen das Durcheinander weg,
          bevor es sich breitmacht.
        it: Niente resta in giro quando ci sono loro. Passano in ogni stanza e mettono in ordine prima che il disordine
          si sistemi.
        pt: Nada fica fora do sítio quando eles estão por perto. Passam por cada divisão e arrumam a confusão antes
          que ela se instale.
        br: Nada fica jogado quando eles estão por perto. Passam por cada cômodo e arrumam a bagunça antes que ela
          se instale.
        nl: Niets blijft rondslingeren als zij er zijn. Ze lopen elke kamer door en ruimen de rommel op voordat
          die blijft liggen.
      inspire_fallback_6_name:
        fr: Les Champions du Grand Rangement
        en: The Champions of the Big Tidy-Up
        es: Los Campeones del Gran Orden
        de: Die Meister vom Großen Aufräumen
        it: I Campioni del Grande Riordino
        pt: Os Campeões da Grande Arrumação
        br: Os Campeões da Grande Arrumação
        nl: De Kampioenen van de Grote Opruiming
      inspire_fallback_6_desc:
        fr: Une famille qui a promis de rendre à chaque objet sa place. Leur histoire grandit à chaque tiroir fermé.
        en: A family who promised to put every object back in its place. Their story grows with every drawer they
          close.
        es: Una familia que prometió devolver cada cosa a su sitio. Su historia crece con cada cajón cerrado.
        de: Eine Familie, die versprochen hat, jedem Ding seinen Platz zurückzugeben. Ihre Geschichte wächst mit
          jeder geschlossenen Schublade.
        it: Una famiglia che ha promesso di rimettere ogni cosa al suo posto. La loro storia cresce a ogni cassetto
          chiuso.
        pt: Uma família que prometeu pôr cada coisa no seu lugar. A história deles cresce a cada gaveta fechada.
        br: Uma família que prometeu colocar cada coisa no seu lugar. A história deles cresce a cada gaveta fechada.
        nl: Een familie die beloofd heeft elk ding terug op zijn plek te leggen. Hun verhaal groeit met elke dichte
          la.
      inspire_fallback_7_name:
        fr: La Tribu des Lève-Tôt
        en: The Early Bird Tribe
        es: La Tribu de los Madrugadores
        de: Der Frühaufsteher-Stamm
        it: La Tribù dei Mattinieri
        pt: A Tribo dos Madrugadores
        br: A Tribo dos Madrugadores
        nl: De Stam van de Vroege Vogels
      inspire_fallback_7_desc:
        fr: 'Debout avant le soleil, ils ont déjà fini trois corvées quand la vallée se réveille. Leur cri de joie
          : « Au travail, et en riant ! »'
        en: 'Up before the sun, they''ve already finished three chores when the valley wakes up. Their happy cheer:
          “Get to work, and laugh!”'
        es: 'En pie antes que el sol, ya han terminado tres tareas cuando el valle se despierta. Su grito de alegría:
          «¡A trabajar, y riendo!»'
        de: 'Schon vor der Sonne wach, haben sie drei Aufgaben erledigt, wenn das Tal aufwacht. Ihr Freudenruf:
          „An die Arbeit, und dabei lachen!“'
        it: 'In piedi prima del sole, hanno già finito tre faccende quando la valle si sveglia. Il loro grido di
          gioia: «Al lavoro, e ridendo!»'
        pt: 'De pé antes do sol, já acabaram três tarefas quando o vale acorda. O grito de alegria deles: «Ao trabalho,
          e a rir!»'
        br: 'De pé antes do sol, já terminaram três tarefas quando o vale acorda. O grito de alegria deles: “Ao
          trabalho, e rindo!”'
        nl: 'Al wakker voor de zon, hebben ze drie klusjes af als de vallei wakker wordt. Hun vrolijke kreet: ‘Aan
          het werk, en lachen maar!’'
      inspire_player_fallback_1_desc:
        fr: Calme, patient, et super bien organisé. Là où les autres foncent, il range, et les dinos l'adorent.
        en: Calm, patient and super organized. Where others rush, he tidies up, and the dinos love him.
        es: Tranquilo, paciente y superorganizado. Donde otros corren, él ordena, y los dinos lo adoran.
        de: Ruhig, geduldig und super ordentlich. Wo andere losrennen, räumt er auf, und die Dinos lieben ihn.
        it: Calmo, paziente e organizzatissimo. Dove gli altri corrono, lui mette in ordine, e i dino lo adorano.
        pt: Calmo, paciente e super organizado. Onde os outros correm, ele arruma, e os dinos adoram-no.
        br: Calmo, paciente e superorganizado. Onde os outros correm, ele arruma, e os dinos adoram ele.
        nl: Rustig, geduldig en supernetjes. Waar anderen rennen, ruimt hij op, en de dino's zijn dol op hem.
      inspire_player_fallback_2_desc:
        fr: Petit par la taille, immense par le cœur. Aucun dino tout poussiéreux n'attend longtemps quand il est
          là.
        en: Small in size, huge in heart. No dusty dino waits long when he's around.
        es: Pequeño de tamaño, enorme de corazón. Ningún dino polvoriento espera mucho si él está cerca.
        de: Klein an Größe, riesig an Herz. Kein staubiger Dino wartet lange, wenn er da ist.
        it: Piccolo di statura, immenso di cuore. Nessun dino impolverato aspetta a lungo quando c'è lui.
        pt: Pequeno no tamanho, enorme no coração. Nenhum dino cheio de pó espera muito quando ele está por perto.
        br: Pequeno no tamanho, enorme no coração. Nenhum dino empoeirado espera muito quando ele está por perto.
        nl: Klein van stuk, groot van hart. Geen stoffige dino hoeft lang te wachten als hij er is.
      inspire_player_fallback_5_desc:
        fr: Toujours partant, même pour la corvée la plus longue. Le linge sale file vite dans le panier quand il
          arrive.
        en: Always up for it, even the longest chore. Dirty laundry rushes into the basket when he arrives.
        es: Siempre dispuesto, incluso para la tarea más larga. La ropa sucia corre al cesto cuando él llega.
        de: Immer dabei, sogar bei der längsten Hausarbeit. Die schmutzige Wäsche flitzt in den Korb, wenn er kommt.
        it: Sempre pronto, anche per la faccenda più lunga. I panni sporchi corrono nel cesto quando arriva lui.
        pt: Sempre pronto, até para a tarefa mais comprida. A roupa suja corre para o cesto quando ele chega.
        br: Sempre topa tudo, até a tarefa mais comprida. A roupa suja corre para o cesto quando ele chega.
        nl: Altijd in voor alles, zelfs het langste klusje. De vuile was rent de mand in als hij eraan komt.
      inspire_player_fallback_7_desc:
        fr: Discret comme une plume, efficace comme dix. Personne ne l'entend arriver, mais la cuisine brille après
          son passage.
        en: Quiet as a feather, as handy as ten. Nobody hears him coming, but the kitchen shines once he's been.
        es: Discreto como una pluma, eficaz como diez. Nadie lo oye llegar, pero la cocina brilla cuando pasa.
        de: Leise wie eine Feder, fleißig für zehn. Niemand hört ihn kommen, aber die Küche glänzt, wenn er fertig
          ist.
        it: Discreto come una piuma, bravo come dieci. Nessuno lo sente arrivare, ma la cucina brilla dopo il suo
          passaggio.
        pt: Discreto como uma pena, eficaz como dez. Ninguém o ouve chegar, mas a cozinha brilha depois de ele passar.
        br: Discreto como uma pena, eficiente como dez. Ninguém ouve ele chegar, mas a cozinha brilha depois que
          ele passa.
        nl: Stil als een veertje, handig voor tien. Niemand hoort hem aankomen, maar de keuken glimt als hij klaar
          is.
      create_clan_confirm:
        fr: Vive la nouvelle tribu !
        en: Long live the tribe!
        es: ¡Viva la nueva tribu!
        de: Hoch lebe der Stamm!
        it: Viva la nuova tribù!
        pt: Viva a nova tribo!
        br: Viva a nova tribo!
        nl: Leve de nieuwe stam!
      task_description_hint:
        fr: Quel dino a besoin d'aide, et comment le rendre tout content ?
        en: Which dino needs help, and how do we make it happy?

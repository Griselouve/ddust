        fr: "Lisez-lui ses ((conditions d'utilisation|documents.open_doc?cgu@k)) à voix haute. En l'accueillant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données de jeu. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "Read their ((terms of use|documents.open_doc?cgu@k)) aloud to them. By welcoming them, you declare that you are their legal guardian and you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "Léele en voz alta sus ((condiciones de uso|documents.open_doc?cgu@k)). Al acogerlo, declaras ser su responsable legal y consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        it: "Leggigli ad alta voce le sue ((condizioni d'uso|documents.open_doc?cgu@k)). Accogliendolo, dichiari di esserne il tutore legale e acconsenti alla raccolta dei suoi dati di gioco. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        de: "Lies ihm seine ((Nutzungsbedingungen|documents.open_doc?cgu@k)) laut vor. Mit der Aufnahme erklärst du, dass du sein Erziehungsberechtigter bist, und willigst in die Erhebung seiner Spieldaten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        pt: "Lê-lhe em voz alta os seus ((termos de utilização|documents.open_doc?cgu@k)). Ao acolhê-lo, declaras ser o seu responsável legal e consentes a recolha dos seus dados de jogo. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "Leia em voz alta para ele os ((termos de uso|documents.open_doc?cgu@k)) dele. Ao acolher a criança, você declara ser o responsável legal por ela e consente com a coleta dos dados de jogo dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Lees hem zijn ((gebruiksvoorwaarden|documents.open_doc?cgu@k)) hardop voor. Door het te verwelkomen, verklaar je dat je zijn wettelijke voogd bent en stem je in met het verzamelen van zijn spelgegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      invite_consent_notice_reads:
        fr: "Faites-lui lire ses ((conditions d'utilisation|documents.open_doc?cgu@k)). En l'accueillant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données de jeu. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "Have them read their ((terms of use|documents.open_doc?cgu@k)). By welcoming them, you declare that you are their legal guardian and you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "Haz que lea sus ((condiciones de uso|documents.open_doc?cgu@k)). Al acogerlo, declaras ser su responsable legal y consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        it: "Fagli leggere le sue ((condizioni d'uso|documents.open_doc?cgu@k)). Accogliendolo, dichiari di esserne il tutore legale e acconsenti alla raccolta dei suoi dati di gioco. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        de: "Lass es seine ((Nutzungsbedingungen|documents.open_doc?cgu@k)) lesen. Mit der Aufnahme erklärst du, dass du sein Erziehungsberechtigter bist, und willigst in die Erhebung seiner Spieldaten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        pt: "Pede-lhe que leia os seus ((termos de utilização|documents.open_doc?cgu@k)). Ao acolhê-lo, declaras ser o seu responsável legal e consentes a recolha dos seus dados de jogo. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "Peça para ele ler os ((termos de uso|documents.open_doc?cgu@k)) dele. Ao acolher a criança, você declara ser o responsável legal por ela e consente com a coleta dos dados de jogo dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Laat het zijn ((gebruiksvoorwaarden|documents.open_doc?cgu@k)) lezen. Door het te verwelkomen, verklaar je dat je zijn wettelijke voogd bent en stem je in met het verzamelen van zijn spelgegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      invite_consent_yes:
        fr: "J'ai compris, accueillons-le !"
        en: "Understood, let's welcome them!"
        es: "Entendido, ¡acojámoslo!"
        it: "Ho capito, accogliamolo!"
        de: "Verstanden, nehmen wir ihn auf!"
        pt: "Percebi, vamos acolhê-lo!"
        br: "Entendi, vamos acolher!"
        nl: "Begrepen, welkom maar!"
      invite_needs_child_ack:
        fr: "Tes parents doivent t'accueillir eux-mêmes : montre-leur ton QR code."
        en: "Your parents must welcome you themselves: show them your QR code."
        es: "Tus padres tienen que acogerte ellos mismos: enséñales tu código QR."
        it: "Devono accoglierti i tuoi genitori: mostra loro il tuo codice QR."
        de: "Deine Eltern müssen dich selbst aufnehmen: Zeig ihnen deinen QR-Code."
        pt: "Têm de ser os teus pais a acolher-te: mostra-lhes o teu código QR."
        br: "Seus pais precisam acolher você: mostre o seu QR Code para eles."
        nl: "Je ouders moeten je zelf verwelkomen: laat hun je QR-code zien."
      join_clan_google_notice:
        fr: "Quand tes parents auront dit oui, tu te connecteras avec ton compte Google. Si un parent veille sur ce compte (Family Link), il devra autoriser le jeu : demande-lui d'être là, ou de le faire à l'avance."
        en: "Once your parents have said yes, you will sign in with your Google account. If a parent supervises that account (Family Link), they will have to allow the game: ask them to be there, or to do it in advance."
        es: "Cuando tus padres hayan dicho que sí, te conectarás con tu cuenta de Google. Si un adulto supervisa esa cuenta (Family Link), tendrá que autorizar el juego: pídele que esté presente, o que lo haga por adelantado."
        it: "Quando i tuoi genitori avranno detto di sì, accederai con il tuo account Google. Se un genitore controlla questo account (Family Link), dovrà autorizzare il gioco: chiedigli di essere presente, o di farlo in anticipo."
        de: "Sobald deine Eltern Ja gesagt haben, meldest du dich mit deinem Google-Konto an. Wenn ein Elternteil dieses Konto beaufsichtigt (Family Link), muss er das Spiel erlauben: Bitte ihn, dabei zu sein oder es vorher zu tun."
        pt: "Quando os teus pais disserem que sim, vais iniciar sessão com a tua conta Google. Se um dos pais supervisiona essa conta (Family Link), terá de autorizar o jogo: pede-lhe que esteja presente, ou que o faça antecipadamente."
        br: "Quando seus pais disserem sim, você vai entrar com sua conta Google. Se um dos pais supervisiona essa conta (Family Link), ele vai precisar autorizar o jogo: peça que ele esteja presente, ou que faça isso com antecedência."
        nl: "Zodra je ouders ja hebben gezegd, log je in met je Google-account. Als een ouder toezicht houdt op dat account (Family Link), moet die het spel toestaan: vraag of die erbij is, of het vooraf regelt."

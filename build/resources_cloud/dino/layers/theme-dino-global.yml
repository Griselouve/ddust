        pt: "Demasiado pequeno para a vossa tribo"
        br: "Pequeno demais para a tribo de vocês"
        nl: "Te klein voor jullie stam"
      store_locked_text:
        fr: "La bourse de la tribu est vide. Vos aventures vous attendent, intactes."
        en: "The tribe's purse is empty. Your adventures are waiting, untouched."
        es: "La bolsa de la tribu está vacía. Vuestras aventuras os esperan, intactas."
        it: "Il borsellino della tribù è vuoto. Le vostre avventure vi aspettano, intatte."
        de: "Der Geldbeutel des Stammes ist leer. Eure Abenteuer warten auf euch, unberührt."
        pt: "A bolsa da tribo está vazia. As vossas aventuras esperam-vos, intactas."
        br: "A bolsa da tribo está vazia. Suas aventuras esperam por vocês, intactas."
        nl: "De buidel van de stam is leeg. Jullie avonturen wachten op jullie, onaangeroerd."
      manage_ends:
        fr: "Résilié : la tribu en profite jusqu'au {date}"
        en: "Cancelled: the tribe keeps it until {date}"
        es: "Cancelada: la tribu la disfruta hasta el {date}"
        it: "Disdetto: la tribù ne approfitta fino al {date}"
        de: "Gekündigt: der Stamm behält es bis {date}"
        pt: "Cancelada: a tribo aproveita-a até {date}"
        br: "Cancelada: a tribo aproveita até {date}"
        nl: "Opgezegd: de stam houdt het tot {date}"
      giftcode_title:
        fr: "Un code pour la tribu"
        en: "A code for the tribe"
        es: "Un código para la tribu"
        it: "Un codice per la tribù"
        de: "Ein Code für den Stamm"
        pt: "Um código para a tribo"
        br: "Um código para a tribo"
        nl: "Een code voor de stam"
      giftcode_success:
        fr: "@@@months@@@ mois offerts à la tribu. Ils s'ajoutent à ce que vous avez déjà."
        en: "@@@months@@@ months given to the tribe. They add to what you already have."
        es: "@@@months@@@ meses de regalo para la tribu. Se suman a lo que ya tenéis."
        it: "@@@months@@@ mesi in regalo per la tribù. Si aggiungono a quelli che avete già."
        de: "@@@months@@@ Monate geschenkt für den Stamm. Sie kommen zu dem hinzu, was ihr schon habt."
        pt: "@@@months@@@ meses oferecidos à tribo. Somam-se ao que já têm."
        br: "@@@months@@@ meses de presente para a tribo. Eles se somam ao que vocês já têm."
        nl: "@@@months@@@ maanden cadeau voor de stam. Ze komen bovenop wat jullie al hebben."
      giftcode_success_one:
        fr: "Un mois offert à la tribu. Il s'ajoute à ce que vous avez déjà."
        en: "One month given to the tribe. It adds to what you already have."
        es: "Un mes de regalo para la tribu. Se suma a lo que ya tenéis."
        it: "Un mese in regalo per la tribù. Si aggiunge a quello che avete già."
        de: "Ein Monat geschenkt für den Stamm. Er kommt zu dem hinzu, was ihr schon habt."
        pt: "Um mês oferecido à tribo. Soma-se ao que já têm."
        br: "Um mês de presente para a tribo. Ele se soma ao que vocês já têm."
        nl: "Een maand cadeau voor de stam. Die komt bovenop wat jullie al hebben."
      store_cap_full:
        fr: "La tribu est au complet. Voici les paliers, et celui qui vous ouvrirait une place de plus."
        en: "The tribe is full. Here are the tiers, and the one that would open another seat for you."
        es: "La tribu está completa. Estos son los niveles, y el que os abriría una plaza más."
        it: "La tribù è al completo. Ecco le fasce, e quella che vi aprirebbe un posto in più."
        de: "Der Stamm ist voll. Hier sind die Tarife, und der, der euch einen Platz mehr öffnen würde."
        pt: "A tribo está completa. Aqui estão os escalões, e o que vos abriria mais um lugar."
        br: "A tribo está completa. Aqui estão os planos, e o que abriria mais uma vaga para vocês."
        nl: "De stam is vol. Hier zijn de pakketten, en het pakket dat jullie een plek extra zou geven."
      store_pitch_first:
        fr: "Votre tribu a pris le rythme. Pour qu'elle continue, il lui faut une cotisation : vous l'arrêtez quand vous voulez, et votre tribu reste intacte."
        en: "Your tribe has found its rhythm. To keep it going it needs dues: you can stop whenever you want, and your tribe stays intact."
        es: "Vuestra tribu ha cogido el ritmo. Para que continúe necesita una cuota: la paráis cuando queráis, y vuestra tribu queda intacta."
        it: "La vostra tribù ha preso il ritmo. Per continuare ha bisogno di una quota: potete fermarla quando volete, e la vostra tribù resta intatta."
        de: "Euer Stamm hat seinen Rhythmus gefunden. Damit es weitergeht, braucht er einen Beitrag: Ihr könnt jederzeit aufhören, und euer Stamm bleibt unversehrt."
        pt: "A vossa tribo apanhou o ritmo. Para continuar precisa de uma quota: podem pará-la quando quiserem, e a vossa tribo fica intacta."
        br: "A tribo de vocês pegou o ritmo. Para continuar, ela precisa de uma assinatura: vocês podem cancelar quando quiserem, e a tribo fica intacta."
        nl: "Jullie stam zit in het ritme. Om door te gaan is er een contributie nodig: jullie stoppen ermee wanneer jullie willen, en jullie stam blijft intact."
      guide_p2_c_desc:
        fr: "Rien ne vérifie qu'il a été fait. Il se joue devant la tribu, jamais seul, et votre enfant a le droit de le refuser."
        en: "Nothing checks that it was carried out. It is played in front of the tribe, never alone, and your child is free to refuse it."
        es: "Nada comprueba que se haya cumplido. Se juega ante la tribu, nunca a solas, y tu hijo tiene derecho a negarse."
        it: "Niente verifica che sia stata fatta. Si gioca davanti alla tribù, mai da soli, e tuo figlio ha il diritto di rifiutarla."
        de: "Nichts prüft, ob es erfüllt wurde. Es wird vor dem Stamm gespielt, nie allein, und dein Kind darf es ablehnen."
        pt: "Nada verifica se foi cumprido. Joga-se diante da tribo, nunca a sós, e o teu filho tem o direito de o recusar."
        br: "Nada verifica se ele foi cumprido. É feito diante da tribo, nunca a sós, e seu filho tem o direito de recusá-lo."
        nl: "Niets controleert of het is uitgevoerd. Het wordt gespeeld in het bijzijn van de stam, nooit alleen, en je kind mag het weigeren."
      guide_p4_a_desc:
        fr: "Vous continuez à faire progresser la tribu, mais vous sortez des comparaisons et des récompenses. La jauge des enfants se mesure au meilleur du cycle : ce serait vous."
        en: "You keep the tribe moving forward, but you step out of comparisons and rewards. The children's gauge is measured against the best of the cycle: that would be you."
        es: "Sigues haciendo avanzar a la tribu, pero sales de las comparaciones y las recompensas. El medidor de los niños se mide con el mejor del ciclo: serías tú."
        it: "Continui a far progredire la tribù, ma esci dai confronti e dalle ricompense. L'indicatore dei bambini si misura sul migliore del ciclo: saresti tu."
        de: "Du bringst den Stamm weiter voran, aber du trittst aus Vergleichen und Belohnungen heraus. Die Anzeige der Kinder misst sich am Besten des Zyklus: Das wärst du."
        pt: "Continuas a fazer a tribo avançar, mas sais das comparações e das recompensas. O medidor das crianças mede-se pelo melhor do ciclo: serias tu."
        br: "Você continua fazendo a tribo avançar, mas sai das comparações e das recompensas. O medidor das crianças se baseia no melhor do ciclo: seria você."
        nl: "Je helpt de stam nog steeds vooruit, maar je doet niet meer mee aan vergelijkingen en beloningen. De meter van de kinderen wordt afgemeten aan de beste van de cyclus: dat zou jij zijn."
      guide_k1_title:
        fr: "Ta tribu compte sur toi"
        en: "Your tribe is counting on you"
        es: "Tu tribu cuenta contigo"
        it: "La tua tribù conta su di te"
        de: "Dein Stamm zählt auf dich"
        pt: "A tua tribo conta contigo"
        br: "Sua tribo conta com você"
        nl: "Je stam rekent op je"
      guide_k1_a_desc:
        fr: "Tes points s'ajoutent à ceux de la tribu. Personne ne joue contre toi : il n'y a pas de classement."
        en: "Your points add to the tribe's. Nobody plays against you: there is no ranking."
        es: "Tus puntos se suman a los de la tribu. Nadie juega contra ti: no hay clasificación."
        it: "I tuoi punti si sommano a quelli della tribù. Nessuno gioca contro di te: non c'è classifica."
        de: "Deine Punkte kommen zu denen des Stammes dazu. Niemand spielt gegen dich: Es gibt keine Rangliste."
        pt: "Os teus pontos somam-se aos da tribo. Ninguém joga contra ti: não há classificação."
        br: "Seus pontos se somam aos da tribo. Ninguém joga contra você: não há ranking."
        nl: "Jouw punten tellen op bij die van de stam. Niemand speelt tegen jou: er is geen ranglijst."
      guide_k3_situation:
        fr: "Un chef de la tribu a refusé ta tâche. Ça arrive, et ça ne t'enlève rien du tout."
        en: "A tribe chief refused your task. It happens, and it takes nothing away from you."
        es: "Un jefe de la tribu ha rechazado tu tarea. Pasa, y no te quita nada."
        it: "Un capo della tribù ha rifiutato il tuo compito. Succede, e non ti toglie proprio niente."
        de: "Ein Stammes-Chef hat deine Aufgabe abgelehnt. Das kommt vor, und es nimmt dir überhaupt nichts weg."
        pt: "Um chefe da tribo recusou a tua tarefa. Acontece, e não te tira absolutamente nada."
        br: "Um chefe da tribo recusou sua tarefa. Acontece, e isso não tira absolutamente nada de você."
        nl: "Een stamhoofd heeft je taak geweigerd. Dat gebeurt, en het neemt je helemaal niets af."
      guide_k4_b_desc:
        fr: "Ta photo ou ta vidéo de preuve n'est jamais envoyée sur Internet : elle reste dans ton téléphone, et la vidéo n'enregistre jamais le son. Personne ne peut la regarder à distance, même pas un chef de la tribu."
        en: "Your proof photo or video is never sent over the Internet: it stays in your phone, and the video never records sound. Nobody can look at it from afar, not even a tribe chief."
        es: "Tu foto o vídeo de prueba nunca se envía por Internet: se queda en tu teléfono, y el vídeo nunca graba sonido. Nadie puede verlo a distancia, ni siquiera un jefe de la tribu."
        it: "La tua foto o il tuo video di prova non viene mai inviato su Internet: resta nel tuo telefono, e il video non registra mai l'audio. Nessuno può guardarli a distanza, nemmeno un capo della tribù."
        de: "Dein Beweisfoto oder -video wird nie über das Internet verschickt: Es bleibt in deinem Handy, und das Video nimmt nie Ton auf. Niemand kann es aus der Ferne ansehen, nicht einmal ein Stammes-Chef."
        pt: "A tua foto ou vídeo de prova nunca é enviado pela Internet: fica no teu telemóvel, e o vídeo nunca grava som. Ninguém os pode ver à distância, nem sequer um chefe da tribo."
        br: "Sua foto ou vídeo de prova nunca é enviado pela internet: fica no seu celular, e o vídeo nunca grava som. Ninguém pode vê-los a distância, nem mesmo um chefe da tribo."
        nl: "Je bewijsfoto of -video wordt nooit via internet verstuurd: hij blijft in je telefoon, en de video neemt nooit geluid op. Niemand kan hem op afstand bekijken, zelfs geen stamhoofd."
      guide_k4_c_desc:
        fr: "Ce que la tribu gagne se vit en famille, pas dans l'application."
        en: "What the tribe wins is lived with your family, not inside the app."
        es: "Lo que la tribu gana se vive en familia, no dentro de la aplicación."
        it: "Quello che la tribù vince si vive in famiglia, non dentro l'app."
        de: "Was der Stamm gewinnt, erlebt ihr als Familie, nicht in der App."
        pt: "O que a tribo ganha vive-se em família, não dentro da aplicação."
        br: "O que a tribo ganha é vivido em família, não dentro do aplicativo."
        nl: "Wat de stam wint, beleef je samen met je familie, niet in de app."
      clan_menu_my_clans:
        fr: "Mes tribus"
        en: "My tribes"
        es: "Mis tribus"
        it: "Le mie tribù"
        de: "Meine Stämme"
        pt: "As minhas tribos"
        br: "Minhas tribos"
        nl: "Mijn stammen"
      clan_menu_my_clans_desc:
        fr: "Changer de tribu, ou en rejoindre une autre."
        en: "Switch tribe, or join another one."
        es: "Cambiar de tribu, o unirte a otra."
        it: "Cambia tribù, o unisciti a un'altra."
        de: "Den Stamm wechseln oder einem anderen beitreten."
        pt: "Mudar de tribo, ou juntar-te a outra."
        br: "Trocar de tribo, ou entrar em outra."
        nl: "Van stam wisselen, of je bij een andere aansluiten."
      clan_menu_guardian_hub:
        fr: "Gérer les tribus de mes enfants"
        en: "Manage my children's tribes"
        es: "Gestionar las tribus de mis hijos"
        it: "Gestisci le tribù dei miei figli"
        de: "Stämme meiner Kinder verwalten"
        pt: "Gerir as tribos dos meus filhos"
        br: "Gerenciar as tribos dos meus filhos"
        nl: "Stammen van mijn kinderen beheren"
      clan_menu_guardian_hub_desc:
        fr: "Les tribus de tes enfants, et qui peut les accueillir."
        en: "Your children's tribes, and who can welcome them."
        es: "Las tribus de tus hijos, y quién puede acogerlos."
        it: "Le tribù dei tuoi figli, e chi può accoglierli."
        de: "Die Stämme deiner Kinder und wer sie aufnehmen darf."
        pt: "As tribos dos teus filhos, e quem os pode acolher."
        br: "As tribos dos seus filhos, e quem pode recebê-los."
        nl: "De stammen van je kinderen, en wie ze mag verwelkomen."
      my_clans_title:
        fr: "Mes tribus"
        en: "My tribes"
        es: "Mis tribus"
        it: "Le mie tribù"
        de: "Meine Stämme"
        pt: "As minhas tribos"
        br: "Minhas tribos"
        nl: "Mijn stammen"
      my_clans_hint:
        fr: "Touche une tribu pour y jouer. Ton personnage est différent dans chaque tribu ; ton nom et ton avatar te suivent partout."
        en: "Tap a tribe to play in it. Your character is different in each tribe; your name and avatar follow you everywhere."
        es: "Toca una tribu para jugar en ella. Tu personaje es distinto en cada tribu; tu nombre y tu avatar te siguen a todas partes."
        it: "Tocca una tribù per giocarci. Il tuo personaggio è diverso in ogni tribù; il tuo nome e il tuo avatar ti seguono ovunque."
        de: "Tippe auf einen Stamm, um dort zu spielen. Deine Figur ist in jedem Stamm anders; dein Name und dein Avatar begleiten dich überallhin."
        pt: "Toca numa tribo para jogar nela. A tua personagem é diferente em cada tribo; o teu nome e o teu avatar acompanham-te por todo o lado."
        br: "Toque em uma tribo para jogar nela. Seu personagem é diferente em cada tribo; seu nome e seu avatar vão com você para todo lado."
        nl: "Tik op een stam om erin te spelen. Je personage is in elke stam anders; je naam en je avatar gaan overal mee."
      my_clans_unnamed:
        fr: "Tribu sans nom"
        en: "Unnamed tribe"
        es: "Tribu sin nombre"
        it: "Tribù senza nome"
        de: "Stamm ohne Namen"
        pt: "Tribo sem nome"
        br: "Tribo sem nome"
        nl: "Naamloze stam"
      my_clans_join:
        fr: "Rejoindre une autre tribu"
        en: "Join another tribe"
        es: "Unirse a otra tribu"
        it: "Unirsi a un'altra tribù"
        de: "Einem anderen Stamm beitreten"
        pt: "Juntar-me a outra tribo"
        br: "Entrar em outra tribo"
        nl: "Bij een andere stam gaan"
      join_clans_cap:
        fr: "Tu fais déjà partie de 8 tribus : c'est le maximum."
        en: "You are already in 8 tribes: that is the maximum."
        es: "Ya formas parte de 8 tribus: es el máximo."
        it: "Fai già parte di 8 tribù: è il massimo."
        de: "Du bist schon in 8 Stämmen: Mehr geht nicht."
        pt: "Já fazes parte de 8 tribos: é o máximo."
        br: "Você já faz parte de 8 tribos: é o máximo."
        nl: "Je zit al in 8 stammen: meer kan niet."
      join_already_member:
        fr: "Tu fais déjà partie de cette tribu."
        en: "You are already in this tribe."
        es: "Ya formas parte de esta tribu."
        it: "Fai già parte di questa tribù."
        de: "Du bist schon in diesem Stamm."
        pt: "Já fazes parte desta tribo."
        br: "Você já faz parte desta tribo."
        nl: "Je zit al in deze stam."
      kid_needs_guardian_auth:
        fr: "Pour entrer dans cette tribu, un de tes parents doit d'abord dire oui."
        en: "To join this tribe, one of your parents must say yes first."
        es: "Para entrar en esta tribu, uno de tus padres tiene que decir que sí primero."
        it: "Per entrare in questa tribù, uno dei tuoi genitori deve prima dire di sì."
        de: "Um diesem Stamm beizutreten, muss zuerst einer deiner Eltern Ja sagen."
        pt: "Para entrares nesta tribo, um dos teus pais tem primeiro de dizer que sim."
        br: "Para entrar nesta tribo, um dos seus pais precisa primeiro dizer sim."
        nl: "Om bij deze stam te komen, moet een van je ouders eerst ja zeggen."
      back_to_my_clan:
        fr: "Revenir à ma tribu"
        en: "Back to my tribe"
        es: "Volver a mi tribu"
        it: "Torna alla mia tribù"
        de: "Zurück zu meinem Stamm"
        pt: "Voltar à minha tribo"
        br: "Voltar para a minha tribo"
        nl: "Terug naar mijn stam"
      guardian_hub_hint:
        fr: "Tu es responsable légal de ces enfants : c'est toi qui décides dans quelles tribus ils jouent. Un autre adulte ne peut accueillir ton enfant qu'après ton accord."
        en: "You are the legal guardian of these children: you decide which tribes they play in. Another adult can only welcome your child after you agree."
        es: "Eres el responsable legal de estos niños: tú decides en qué tribus juegan. Otro adulto solo puede acoger a tu hijo con tu permiso."
        it: "Sei il rappresentante legale di questi bambini: decidi tu in quali tribù giocano. Un altro adulto può accogliere tuo figlio solo dopo il tuo consenso."
        de: "Du bist gesetzlicher Vertreter dieser Kinder: Du entscheidest, in welchen Stämmen sie spielen. Ein anderer Erwachsener kann dein Kind erst nach deiner Zustimmung aufnehmen."
        pt: "És o representante legal destas crianças: és tu que decides em que tribos jogam. Outro adulto só pode acolher o teu filho depois do teu acordo."
        br: "Você é o responsável legal por estas crianças: é você quem decide em quais tribos elas jogam. Outro adulto só pode receber seu filho depois da sua autorização."
        nl: "Jij bent de wettelijke vertegenwoordiger van deze kinderen: jij beslist in welke stammen ze spelen. Een andere volwassene kan je kind pas verwelkomen nadat jij akkoord bent."
      guardian_hub_ward_clans:
        fr: "Les tribus de mes enfants"
        en: "My children's tribes"
        es: "Las tribus de mis hijos"
        it: "Le tribù dei miei figli"
        de: "Die Stämme meiner Kinder"
        pt: "As tribos dos meus filhos"
        br: "As tribos dos meus filhos"
        nl: "De stammen van mijn kinderen"
      guardian_hub_ward_clans_desc:
        fr: "Voir où joue chaque enfant, et le retirer d'une tribu."
        en: "See where each child plays, and remove them from a tribe."
        es: "Ver dónde juega cada niño, y sacarlo de una tribu."
        it: "Vedere dove gioca ogni bambino, e toglierlo da una tribù."
        de: "Sehen, wo jedes Kind spielt, und es aus einem Stamm herausnehmen."
        pt: "Ver onde joga cada criança, e retirá-la de uma tribo."
        br: "Ver onde cada criança joga, e tirá-la de uma tribo."
        nl: "Zien waar elk kind speelt, en het uit een stam halen."
      ward_pick_clans_hint:
        fr: "Choisis un enfant pour voir ses tribus."
        en: "Choose a child to see their tribes."
        es: "Elige un niño para ver sus tribus."
        it: "Scegli un bambino per vedere le sue tribù."
        de: "Wähle ein Kind aus, um seine Stämme zu sehen."
        pt: "Escolhe uma criança para ver as suas tribos."
        br: "Escolha uma criança para ver as tribos dela."
        nl: "Kies een kind om zijn stammen te zien."
      ward_clans_hint:
        fr: "Touche une tribu une fois pour préparer le retrait, une seconde fois pour retirer l'enfant de cette tribu. Sa tribu d'origine ne se retire pas."
        en: "Tap a tribe once to prepare the removal, a second time to remove the child from that tribe. Their home tribe cannot be removed."
        es: "Toca una tribu una vez para preparar la salida y otra vez para sacar al niño de esa tribu. Su tribu de origen no se puede quitar."
        it: "Tocca una tribù una volta per preparare l'uscita, una seconda volta per togliere il bambino da quella tribù. La sua tribù d'origine non si può togliere."
        de: "Tippe einmal auf einen Stamm, um das Herausnehmen vorzubereiten, und ein zweites Mal, um das Kind aus diesem Stamm zu nehmen. Sein Heimatstamm lässt sich nicht entfernen."
        pt: "Toca numa tribo uma vez para preparar a saída e outra vez para retirar a criança dessa tribo. A tribo de origem não pode ser retirada."
        br: "Toque em uma tribo uma vez para preparar a saída e outra vez para tirar a criança dessa tribo. A tribo de origem não pode ser removida."
        nl: "Tik één keer op een stam om het weghalen voor te bereiden, en nog eens om het kind uit die stam te halen. De thuisstam kan niet weg."
      ward_clans_origin:
        fr: "Tribu d'origine"
        en: "Home tribe"
        es: "Tribu de origen"
        it: "Tribù d'origine"
        de: "Heimatstamm"
        pt: "Tribo de origem"
        br: "Tribo de origem"
        nl: "Thuisstam"
      ward_clans_confirm:
        fr: "Touche encore pour retirer l'enfant de cette tribu."
        en: "Tap again to remove the child from this tribe."
        es: "Toca otra vez para sacar al niño de esta tribu."
        it: "Tocca di nuovo per togliere il bambino da questa tribù."
        de: "Tippe noch einmal, um das Kind aus diesem Stamm zu nehmen."
        pt: "Toca outra vez para retirar a criança desta tribo."
        br: "Toque de novo para tirar a criança desta tribo."
        nl: "Tik nog eens om het kind uit deze stam te halen."
      guardian_cog_declare:
        fr: "Je déclare être représentant légal de {name}. Je peux décider des tribus où joue cet enfant, retirer mon consentement et le déclarer majeur."
        en: "I declare that I am the legal guardian of {name}. I can decide which tribes this child plays in, withdraw my consent and declare them an adult."
        es: "Declaro que soy responsable legal de {name}. Puedo decidir en qué tribus juega este niño, retirar mi consentimiento y declararlo mayor de edad."
        it: "Dichiaro di essere rappresentante legale di {name}. Posso decidere in quali tribù gioca questo bambino, ritirare il mio consenso e dichiararlo maggiorenne."
        de: "Ich erkläre, gesetzlicher Vertreter von {name} zu sein. Ich kann entscheiden, in welchen Stämmen dieses Kind spielt, meine Einwilligung widerrufen und es für volljährig erklären."
        pt: "Declaro que sou representante legal de {name}. Posso decidir em que tribos esta criança joga, retirar o meu consentimento e declará-la maior de idade."
        br: "Declaro que sou responsável legal por {name}. Posso decidir em quais tribos esta criança joga, retirar meu consentimento e declará-la maior de idade."
        nl: "Ik verklaar dat ik de wettelijke vertegenwoordiger van {name} ben. Ik kan beslissen in welke stammen dit kind speelt, mijn toestemming intrekken en het meerderjarig verklaren."
      delete_account_sole_guardian:
        fr: "Tu es le seul représentant légal de : {name}. Avant de supprimer ton compte, ajoute un co-représentant (menu de la tribu, « Options avancées… », puis « Gérer les tribus de mes enfants ») ou supprime d'abord le compte de l'enfant."
        en: "You are the only legal guardian of: {name}. Before deleting your account, add a co-guardian (tribe menu, \"Advanced options…\", then \"Manage my children's tribes\") or delete the child's account first."
        es: "Eres el único responsable legal de: {name}. Antes de borrar tu cuenta, añade un corresponsable (menú de la tribu, «Opciones avanzadas…» y luego «Gestionar las tribus de mis hijos») o borra primero la cuenta del niño."
        it: "Sei l'unico rappresentante legale di: {name}. Prima di eliminare il tuo account, aggiungi un co-rappresentante (menu della tribù, «Opzioni avanzate…», poi «Gestisci le tribù dei miei figli») o elimina prima l'account del bambino."
        de: "Du bist der einzige gesetzliche Vertreter von: {name}. Bevor du dein Konto löschst, füge einen Mitvertreter hinzu (Stammes-Menü, „Erweiterte Optionen…“, dann „Stämme meiner Kinder verwalten“) oder lösche zuerst das Konto des Kindes."
        pt: "És o único representante legal de: {name}. Antes de apagar a tua conta, adiciona um corresponsável (menu da tribo, «Opções avançadas…» e depois «Gerir as tribos dos meus filhos») ou apaga primeiro a conta da criança."
        br: "Você é o único responsável legal por: {name}. Antes de excluir sua conta, adicione um corresponsável (menu da tribo, \"Opções avançadas…\" e depois \"Gerenciar as tribos dos meus filhos\") ou exclua primeiro a conta da criança."
        nl: "Je bent de enige wettelijke vertegenwoordiger van: {name}. Voeg voordat je je account verwijdert een medevertegenwoordiger toe (stammenu, \"Geavanceerde opties…\", dan \"Stammen van mijn kinderen beheren\") of verwijder eerst het account van het kind."
      my_clans_task_warn:
        fr: "Tu as une tâche en cours ici : changer de tribu l'abandonne. Touche encore pour confirmer."
        en: "You have a task in progress here: switching tribe abandons it. Tap again to confirm."
        es: "Tienes una tarea en curso aquí: cambiar de tribu la abandona. Vuelve a tocar para confirmar."
        it: "Hai un compito in corso qui: cambiare tribù lo abbandona. Tocca di nuovo per confermare."
        de: "Du hast hier eine laufende Aufgabe: Wenn du den Stamm wechselst, gibst du sie auf. Tippe noch einmal zum Bestätigen."
        pt: "Tens uma tarefa em curso aqui: mudar de tribo abandona-a. Toca outra vez para confirmar."
        br: "Você tem uma tarefa em andamento aqui: trocar de tribo a abandona. Toque de novo para confirmar."
        nl: "Je hebt hier een taak bezig: van stam wisselen breekt die af. Tik nog eens om te bevestigen."
      perso_menu_notif_clan_off:
        fr: "Ne pas me notifier pour cette tribu"
        en: "Do not notify me for this tribe"
        es: "No notificarme para esta tribu"
        it: "Non avvisarmi per questa tribù"
        de: "Für diesen Stamm nicht benachrichtigen"
        pt: "Não me notificar para esta tribo"
        br: "Não me notificar para esta tribo"
        nl: "Geen meldingen voor deze stam"
      perso_menu_notif_clan_off_desc:
        fr: "Ce téléphone ne recevra plus rien de cette tribu. Tes autres tribus continuent."
        en: "This phone will no longer receive anything from this tribe. Your other tribes carry on."
        es: "Este teléfono ya no recibirá nada de esta tribu. Tus otras tribus siguen igual."
        it: "Questo telefono non riceverà più niente da questa tribù. Le altre tue tribù continuano."
        de: "Dieses Handy bekommt von diesem Stamm nichts mehr. Deine anderen Stämme bleiben wie sie sind."
        pt: "Este telemóvel deixa de receber o que quer que seja desta tribo. As tuas outras tribos continuam."
        br: "Este celular não vai receber mais nada desta tribo. Suas outras tribos continuam."
        nl: "Deze telefoon krijgt niets meer van deze stam. Je andere stammen gaan gewoon door."
      perso_menu_notif_clan_on:
        fr: "Me notifier à nouveau pour cette tribu"
        en: "Notify me again for this tribe"
        es: "Volver a notificarme para esta tribu"
        it: "Avvisami di nuovo per questa tribù"
        de: "Für diesen Stamm wieder benachrichtigen"
        pt: "Voltar a notificar-me para esta tribo"
        br: "Voltar a me notificar para esta tribo"
        nl: "Weer meldingen voor deze stam"
      perso_menu_notif_clan_on_desc:
        fr: "Ce téléphone recevra de nouveau les messages de cette tribu."
        en: "This phone will receive this tribe's messages again."
        es: "Este teléfono volverá a recibir los mensajes de esta tribu."
        it: "Questo telefono riceverà di nuovo i messaggi di questa tribù."
        de: "Dieses Handy bekommt wieder die Nachrichten dieses Stammes."
        pt: "Este telemóvel volta a receber as mensagens desta tribo."
        br: "Este celular vai voltar a receber as mensagens desta tribo."
        nl: "Deze telefoon krijgt weer de berichten van deze stam."
      perso_menu_notif_all_off_desc:
        fr: "Ce téléphone ne recevra plus aucune notification du jeu, pour aucune tribu."
        en: "This phone will no longer receive any game notification, for any tribe."
        es: "Este teléfono ya no recibirá ninguna notificación del juego, de ninguna tribu."
        it: "Questo telefono non riceverà più alcuna notifica del gioco, per nessuna tribù."

      log_levelup:
        fr: '@@@session.user.name@@@ a grandi : niveau {level} ! Les dinos sont tout fiers.'
        en: '@@@session.user.name@@@ grew up: level {level}! The dinos are so proud.'
        es: '@@@session.user.name@@@ ha crecido: ¡nivel {level}! Los dinos están muy orgullosos.'
        de: '@@@session.user.name@@@ ist gewachsen: Stufe {level}! Die Dinos sind mächtig stolz.'
        it: '@@@session.user.name@@@ è cresciuto: livello {level}! I dino sono fierissimi.'
        pt: '@@@session.user.name@@@ cresceu: nível {level}! Os dinos estão todos orgulhosos.'
        br: '@@@session.user.name@@@ cresceu: nível {level}! Os dinos estão muito orgulhosos.'
        nl: '@@@session.user.name@@@ is gegroeid: level {level}! De dino''s zijn supertrots.'
      log_levelup_title:
        fr: '@@@session.user.name@@@ a grandi jusqu''au niveau {level} et peut prendre le surnom de {title} !'
        en: '@@@session.user.name@@@ grew to level {level} and can take the nickname {title}!'
        es: ¡@@@session.user.name@@@ ha crecido hasta el nivel {level} y puede llevar el apodo de {title}!
        de: '@@@session.user.name@@@ ist auf Stufe {level} gewachsen und darf den Spitznamen {title} tragen!'
        it: '@@@session.user.name@@@ è cresciuto fino al livello {level} e può prendere il soprannome di {title}!'
        pt: '@@@session.user.name@@@ cresceu até ao nível {level} e pode usar a alcunha de {title}!'
        br: '@@@session.user.name@@@ cresceu até o nível {level} e pode usar o apelido de {title}!'
        nl: '@@@session.user.name@@@ is gegroeid tot level {level} en mag de bijnaam {title} dragen!'
      log_clan_levelup:
        fr: La tribu a grandi jusqu'au niveau {level} et peut prendre le surnom de {title} !
        en: The tribe grew to level {level} and can take the nickname {title}!
        es: ¡La tribu ha crecido hasta el nivel {level} y puede llevar el apodo de {title}!
        de: Der Stamm ist auf Stufe {level} gewachsen und darf den Spitznamen {title} tragen!
        it: La tribù è cresciuta fino al livello {level} e può prendere il soprannome di {title}!
        pt: A tribo cresceu até ao nível {level} e pode usar a alcunha de {title}!
        br: A tribo cresceu até o nível {level} e pode usar o apelido de {title}!
        nl: De stam is gegroeid tot level {level} en mag de bijnaam {title} dragen!
      log_member_left:
        fr: '@@@session.user.name@@@ a quitté la tribu.'
        en: '@@@session.user.name@@@ left the tribe.'
        es: '@@@session.user.name@@@ ha dejado la tribu.'
        de: '@@@session.user.name@@@ hat den Stamm verlassen.'
        it: '@@@session.user.name@@@ ha lasciato la tribù.'
        pt: '@@@session.user.name@@@ saiu da tribo.'
        br: '@@@session.user.name@@@ saiu da tribo.'
        nl: '@@@session.user.name@@@ heeft de stam verlaten.'
      log_store_subscription:
        fr: 'La tribu s''est abonnée : toute la vallée s''ouvre à elle !'
        en: 'The tribe subscribed: the whole valley opens up to it!'
        es: 'La tribu se ha suscrito: ¡todo el valle se abre para ella!'
        de: 'Der Stamm hat ein Abo: Das ganze Tal steht ihm offen!'
        it: 'La tribù si è abbonata: tutta la valle si apre per lei!'
        pt: 'A tribo fez a assinatura: o vale inteiro abre-se para ela!'
        br: 'A tribo fez a assinatura: o vale inteiro se abre para ela!'
        nl: 'De stam heeft een abonnement: de hele vallei gaat voor hem open!'
      log_store_purchase:
        fr: La tribu a fait un nouvel achat à la boutique.
        en: The tribe made a new purchase at the shop.
        es: La tribu ha hecho una nueva compra en la tienda.
        de: Der Stamm hat im Laden etwas Neues gekauft.
        it: La tribù ha fatto un nuovo acquisto al negozio.
        pt: A tribo fez uma nova compra na loja.
        br: A tribo fez uma nova compra na loja.
        nl: De stam heeft iets nieuws gekocht in de winkel.
      log_store_renewed:
        fr: L'abonnement de la tribu a été reconduit pour la période à venir.
        en: The tribe's subscription was renewed for the coming period.
        es: La suscripción de la tribu se ha renovado para el próximo periodo.
        de: Das Abo des Stammes wurde für den nächsten Zeitraum verlängert.
        it: L'abbonamento della tribù è stato rinnovato per il prossimo periodo.
        pt: A assinatura da tribo foi renovada para o próximo período.
        br: A assinatura da tribo foi renovada para o próximo período.
        nl: Het abonnement van de stam is verlengd voor de komende periode.
      log_store_tier_changed:
        fr: La tribu a changé de formule d'abonnement.
        en: The tribe changed its subscription plan.
        es: La tribu ha cambiado de plan de suscripción.
        de: Der Stamm hat sein Abo-Paket gewechselt.
        it: La tribù ha cambiato piano di abbonamento.
        pt: A tribo mudou de plano de assinatura.
        br: A tribo mudou de plano de assinatura.
        nl: De stam heeft een ander abonnement gekozen.
      log_store_ended:
        fr: La tribu a arrêté son abonnement. La grotte reste ouverte.
        en: The tribe ended its subscription. The cave stays open.
        es: La tribu ha dejado su suscripción. La cueva sigue abierta.
        de: Der Stamm hat sein Abo beendet. Die Höhle bleibt offen.
        it: La tribù ha chiuso l'abbonamento. La grotta resta aperta.
        pt: A tribo terminou a assinatura. A gruta continua aberta.
        br: A tribo encerrou a assinatura. A caverna continua aberta.
        nl: De stam is gestopt met het abonnement. De grot blijft open.
      log_store_payment_default:
        fr: 'Petit caillou sur le chemin : le paiement de l''abonnement n''est pas arrivé.'
        en: 'A little pebble on the path: the subscription payment didn''t come through.'
        es: 'Una piedrecita en el camino: el pago de la suscripción no ha llegado.'
        de: 'Ein kleiner Stein im Weg: Die Abo-Zahlung ist nicht angekommen.'
        it: 'Un sassolino sul sentiero: il pagamento dell''abbonamento non è arrivato.'
        pt: 'Uma pedrinha no caminho: o pagamento da assinatura não chegou.'
        br: 'Uma pedrinha no caminho: o pagamento da assinatura não chegou.'
        nl: 'Een steentje op het pad: de betaling van het abonnement is niet binnengekomen.'
      log_store_payment_recovered:
        fr: 'Le paiement de l''abonnement est reparti : le chemin est dégagé.'
        en: 'The subscription payment is back on track: the path is clear.'
        es: 'El pago de la suscripción vuelve a funcionar: el camino está despejado.'
        de: 'Die Abo-Zahlung läuft wieder: Der Weg ist frei.'
        it: 'Il pagamento dell''abbonamento è ripartito: il sentiero è libero.'
        pt: 'O pagamento da assinatura voltou a funcionar: o caminho está livre.'
        br: 'O pagamento da assinatura voltou a funcionar: o caminho está livre.'
        nl: 'De betaling van het abonnement loopt weer: het pad is vrij.'
      log_store_locked:
        fr: La tribu fait une pause. Elle pourra retrouver les dinos quand elle voudra.
        en: The tribe is taking a break. It can come back to the dinos whenever it likes.
        es: La tribu se toma un descanso. Podrá volver con los dinos cuando quiera.
        de: Der Stamm macht eine Pause. Er kann jederzeit zu den Dinos zurückkommen.
        it: La tribù fa una pausa. Potrà tornare dai dino quando vorrà.
        pt: A tribo está a fazer uma pausa. Pode voltar aos dinos quando quiser.
        br: A tribo está fazendo uma pausa. Pode voltar para os dinos quando quiser.
        nl: De stam neemt een pauze. Hij kan terug naar de dino's wanneer hij wil.
      log_task_boss:
        fr: ({xp} XP, dont {bonus} du dino du jour !)
        en: ({xp} XP, including {bonus} from the dino of the day!)
        es: ({xp} XP, ¡incluidos {bonus} del dino del día!)
        de: ({xp} XP, davon {bonus} vom Dino des Tages!)
        it: ({xp} XP, di cui {bonus} dal dino del giorno!)
        pt: ({xp} XP, dos quais {bonus} do dino do dia!)
        br: ({xp} XP, sendo {bonus} do dino do dia!)
        nl: ({xp} XP, waarvan {bonus} van de dino van de dag!)
      log_butin_opened:
        fr: 'L''œuf a éclos : {amount} balles d''argent de poche et {items} objets partagés entre {players} gardiens
          de dinos.'
        en: 'The egg hatched: {amount} bucks of pocket money and {items} items shared among {players} dino keepers.'
        es: 'El huevo se abrió: {amount} pavos de dinero de bolsillo y {items} objetos repartidos entre {players}
          cuidadores de dinos.'
        de: 'Das Ei ist aufgesprungen: {amount} Mäuse Taschengeld und {items} Gegenstände, verteilt unter {players}
          Dino-Hütern.'
        it: 'L''uovo si è schiuso: {amount} dindini di paghetta e {items} oggetti divisi tra {players} guardiani
          dei dino.'
        pt: 'O ovo abriu-se: {amount} paus de mesada e {items} objetos repartidos entre {players} guardiões dos
          dinos.'
        br: 'O ovo se abriu: {amount} paus de mesada e {items} objetos repartidos entre {players} cuidadores de
          dinos.'
        nl: 'Het ei is uitgekomen: {amount} pegels zakgeld en {items} voorwerpen verdeeld onder {players} dinoverzorgers.'
      log_butin_opened_empty:
        fr: 'L''œuf a éclos : {items} objets partagés entre {players} gardiens de dinos.'
        en: 'The egg hatched: {items} items shared among {players} dino keepers.'
        es: 'El huevo se abrió: {items} objetos repartidos entre {players} cuidadores de dinos.'
        de: 'Das Ei ist aufgesprungen: {items} Gegenstände, verteilt unter {players} Dino-Hütern.'
        it: 'L''uovo si è schiuso: {items} oggetti divisi tra {players} guardiani dei dino.'
        pt: 'O ovo abriu-se: {items} objetos repartidos entre {players} guardiões dos dinos.'
        br: 'O ovo se abriu: {items} objetos repartidos entre {players} cuidadores de dinos.'
        nl: 'Het ei is uitgekomen: {items} voorwerpen verdeeld onder {players} dinoverzorgers.'
      log_tribute_paid:
        fr: '@@@session.user.name@@@ a reçu sa part : {amount} balles d''argent de poche bien réel.'
        en: '@@@session.user.name@@@ got their share: {amount} very real bucks of pocket money.'
        es: '@@@session.user.name@@@ ha recibido su parte: {amount} pavos de dinero de bolsillo bien real.'
        de: '@@@session.user.name@@@ hat seinen Anteil bekommen: {amount} Mäuse echtes Taschengeld.'
        it: '@@@session.user.name@@@ ha ricevuto la sua parte: {amount} dindini di paghetta vera e propria.'
        pt: '@@@session.user.name@@@ recebeu a sua parte: {amount} paus de mesada bem verdadeira.'
        br: '@@@session.user.name@@@ recebeu sua parte: {amount} paus de mesada de verdade.'
        nl: '@@@session.user.name@@@ heeft zijn deel gekregen: {amount} pegels echt zakgeld.'
      log_boss_summoned:
        fr: 'Le dino du jour arrive dans la vallée : {task} rapporte plein d''XP en plus.'
        en: 'The dino of the day arrives in the valley: {task} now gives lots of extra XP.'
        es: 'El dino del día llega al valle: {task} da un montón de XP extra.'
        de: 'Der Dino des Tages kommt ins Tal: {task} bringt jetzt viele Extra-XP.'
        it: 'Il dino del giorno arriva nella valle: {task} dà tanti XP in più.'
        pt: 'O dino do dia chegou ao vale: {task} dá muitos XP extra.'
        br: 'O dino do dia chegou ao vale: {task} dá muito XP extra.'
        nl: 'De dino van de dag komt de vallei in: {task} geeft veel extra XP.'
      evt_chase:
        fr: Faire partir
        en: Shoo away
        es: Espantar
        de: Verscheuchen
        it: Mandar via
        pt: Enxotar
        br: Espantar
        nl: Wegsturen
      evt_chase_desc:
        fr: Faire sortir le curieux de la tribu
        en: Send the snooper out of the tribe
        es: Sacar al curioso de la tribu
        de: Den Schnüffler aus dem Stamm schicken
        it: Mandare il curiosone fuori dalla tribù
        pt: Mandar o curioso para fora da tribo
        br: Tirar o xereta da tribo
        nl: De nieuwsgierige uit de stam sturen
      evt_souris:
        fr: 'Une petite souris passe la tête : « Merci gardien de dinos, c''est bien plus propre maintenant ! Voici
          une petite récompense. »'
        en: 'A little mouse pokes its head out: “Thank you, dino keeper, it''s so much cleaner now! Here''s a small
          reward.”'
        es: 'Un ratoncito asoma la cabeza: «¡Gracias, cuidador de dinos, ahora está mucho más limpio! Aquí tienes
          una pequeña recompensa.»'
        de: 'Eine kleine Maus steckt den Kopf heraus: „Danke, Dino-Hüter, jetzt ist es viel sauberer! Hier ist eine
          kleine Belohnung.“'
        it: 'Un topolino fa capolino: «Grazie, guardiano dei dino, ora è molto più pulito! Ecco una piccola ricompensa.»'
        pt: 'Um ratinho espreita: «Obrigado, guardião dos dinos, agora está muito mais limpo! Aqui tens uma pequena
          recompensa.»'
        br: 'Um ratinho coloca a cabeça para fora: “Valeu, cuidador de dinos, agora está bem mais limpo! Aqui vai
          uma pequena recompensa.”'
        nl: 'Een muisje steekt zijn kopje naar buiten: “Dank je, dinoverzorger, het is nu veel schoner! Hier is
          een kleine beloning.”'
      evt_piege:
        fr: Oups ! Un petit dino farceur t'a fait une blague. Tu perds 1 point de vie… mais tu le récupéreras dès
          que cette mission sera validée !
        en: Oops! A cheeky little dino played a prank on you. You lose 1 health point… but you'll get it back as
          soon as this mission is validated!
        es: ¡Uy! Un dino bromista te ha gastado una broma. Pierdes 1 punto de vida… ¡pero lo recuperarás en cuanto
          se valide esta misión!
        de: Hoppla! Ein frecher kleiner Dino hat dir einen Streich gespielt. Du verlierst 1 Lebenspunkt… aber du
          bekommst ihn zurück, sobald dieser Auftrag bestätigt ist!
        it: Ops! Un dino burlone ti ha fatto uno scherzo. Perdi 1 punto vita… ma lo recupererai appena questa missione
          sarà convalidata!
        pt: Ups! Um dino brincalhão pregou-te uma partida. Perdes 1 ponto de vida… mas vais recuperá-lo assim que
          esta missão for validada!
        br: Ops! Um dino brincalhão pregou uma peça em você. Você perde 1 ponto de vida… mas vai recuperá-lo assim
          que esta missão for validada!
        nl: Oeps! Een ondeugend dinootje heeft je een streek geleverd. Je verliest 1 levenspunt… maar je krijgt
          het terug zodra deze opdracht is goedgekeurd!
      evt_gobelin_name:
        fr: Ptérodactyle fouineur
        en: Nosy pterodactyl
        es: Pterodáctilo cotilla
        de: Neugieriger Flugsaurier
        it: Pterodattilo ficcanaso
        pt: Pterodáctilo bisbilhoteiro
        br: Pterodáctilo xereta
        nl: Nieuwsgierige pterodactylus
      evt_gobelin:
        fr: Ouste ! Le ptérodactyle fouineur s'envole sans demander son reste. La tribu est tranquille, et tu gagnes
          un peu d'expérience.
        en: Shoo! The nosy pterodactyl flaps off without a word. The tribe is at peace, and you earn a little experience.
        es: ¡Fuera! El pterodáctilo cotilla se va volando sin rechistar. La tribu está tranquila y ganas un poco
          de experiencia.
        de: Husch! Der neugierige Flugsaurier flattert schnell davon. Der Stamm hat seine Ruhe, und du bekommst
          ein bisschen Erfahrung.
        it: Sciò! Lo pterodattilo ficcanaso vola via senza fiatare. La tribù è tranquilla, e tu guadagni un po'
          di esperienza.
        pt: Xô! O pterodáctilo bisbilhoteiro foge a voar sem dizer nada. A tribo está sossegada e tu ganhas um pouco
          de experiência.
        br: Xô! O pterodáctilo xereta sai voando sem dizer nada. A tribo está tranquila, e você ganha um pouco de
          experiência.
        nl: Hup, weg jij! De nieuwsgierige pterodactylus fladdert er snel vandoor. De stam heeft rust, en jij krijgt
          een beetje ervaring.
      evt_gobelin_notif:
        fr: '{name} a fait partir un ptérodactyle fouineur de la tribu !'
        en: '{name} shooed a nosy pterodactyl out of the tribe!'
        es: ¡{name} ha espantado a un pterodáctilo cotilla de la tribu!
        de: '{name} hat einen neugierigen Flugsaurier aus dem Stamm verscheucht!'
        it: '{name} ha mandato via uno pterodattilo ficcanaso dalla tribù!'
        pt: '{name} enxotou um pterodáctilo bisbilhoteiro da tribo!'
        br: '{name} espantou um pterodáctilo xereta da tribo!'
        nl: '{name} heeft een nieuwsgierige pterodactylus uit de stam gestuurd!'
      evt_changelin:
        fr: Démasqué ! Ce n'était pas {name} mais un caméléon farceur, qui file en rigolant. {name} et toi gagnez
          un peu d'expérience.
        en: Unmasked! That wasn't {name} but a cheeky chameleon, who runs off giggling. {name} and you both earn
          a little experience.
        es: ¡Descubierto! No era {name}, sino un camaleón bromista, que se escapa riéndose. {name} y tú ganáis un
          poco de experiencia.
        de: Erwischt! Das war nicht {name}, sondern ein freches Chamäleon, das kichernd davonläuft. {name} und du
          bekommt ein bisschen Erfahrung.
        it: Smascherato! Non era {name} ma un camaleonte burlone, che scappa ridacchiando. {name} e tu guadagnate
          un po' di esperienza.
        pt: Desmascarado! Não era {name}, mas sim um camaleão brincalhão, que foge a rir-se. {name} e tu ganham
          um pouco de experiência.
        br: Desmascarado! Não era {name}, e sim um camaleão brincalhão, que sai correndo e rindo. {name} e você
          ganham um pouco de experiência.
        nl: Ontmaskerd! Dat was niet {name} maar een grappige kameleon, die giechelend wegrent. {name} en jij krijgen
          een beetje ervaring.
      evt_changelin_miss:
        fr: Oups, c'était le vrai {name} ! Pendant ce temps, le caméléon farceur a filé en rigolant. Il reviendra
          peut-être…
        en: Oops, that was the real {name}! Meanwhile, the cheeky chameleon ran off giggling. Maybe it will be back…
        es: ¡Uy, era {name} de verdad! Mientras tanto, el camaleón bromista se ha escapado riéndose. A lo mejor
          vuelve…
        de: Hoppla, das war wirklich {name}! Inzwischen ist das freche Chamäleon kichernd davongelaufen. Vielleicht
          kommt es wieder…
        it: Ops, era il vero {name}! Nel frattempo, il camaleonte burlone è scappato ridacchiando. Forse tornerà…
        pt: Ups, era mesmo {name}! Entretanto, o camaleão brincalhão fugiu a rir-se. Talvez volte…
        br: Ops, era {name} de verdade! Enquanto isso, o camaleão brincalhão saiu correndo e rindo. Talvez ele volte…
        nl: Oeps, dat was echt {name}! Ondertussen is de grappige kameleon giechelend weggerend. Misschien komt
          hij terug…
      evt_changelin_notif:
        fr: '{name} a démasqué un caméléon farceur dans la tribu !'
        en: '{name} unmasked a cheeky chameleon in the tribe!'
        es: ¡{name} ha descubierto a un camaleón bromista en la tribu!
        de: '{name} hat ein freches Chamäleon im Stamm erwischt!'
        it: '{name} ha smascherato un camaleonte burlone nella tribù!'
        pt: '{name} desmascarou um camaleão brincalhão na tribo!'
        br: '{name} desmascarou um camaleão brincalhão na tribo!'
        nl: '{name} heeft een grappige kameleon in de stam ontmaskerd!'
      evt_bienfaiteur:
        fr: Tiens ? Quelqu'un de gentil a glissé un jus de baies dans ton sac. Bois-le quand tu veux !
        en: Oh? Someone kind slipped a berry juice into your bag. Drink it whenever you like!
        es: ¿Anda? Alguien muy amable ha metido un zumo de bayas en tu bolsa. ¡Bébetelo cuando quieras!
        de: Nanu? Jemand Liebes hat dir einen Beerensaft in die Tasche gesteckt. Trink ihn, wann du willst!
        it: Toh! Qualcuno di gentile ha messo un succo di bacche nella tua borsa. Bevilo quando vuoi!
        pt: Olha só! Alguém simpático pôs um sumo de bagas no teu saco. Bebe-o quando quiseres!
        br: Ué? Alguém muito legal colocou um suco de frutinhas na sua bolsa. Beba quando quiser!
        nl: Hé? Iemand liefs heeft een bessensap in je tas gestopt. Drink het op wanneer je wilt!
      log_event_piege:
        fr: Un dino farceur a fait une blague à @@@session.user.name@@@.
        en: A cheeky dino played a prank on @@@session.user.name@@@.
        es: Un dino bromista le ha gastado una broma a @@@session.user.name@@@.

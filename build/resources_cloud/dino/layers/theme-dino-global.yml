      kid_assent_go:
        fr: Oui, je file voir les dinos !
        en: Yes, off to see the dinos!
        es: ¡Sí, me voy a ver a los dinos!
        de: Ja, ich will zu den Dinos!
        it: Sì, vado dai dino!
        pt: Sim, vou ver os dinos!
        br: Sim, vou ver os dinos!
        nl: Ja, naar de dino's!
      kid_claim_gone:
        fr: "Le gardien de dinos que tes parents avaient choisi pour toi n'est plus disponible. Voici un nouveau code : montre-le à tes parents."
        en: "The dino keeper your parents chose for you is no longer available. Here is a new code: show it to your parents."
        es: "El cuidador de dinos que tus padres eligieron para ti ya no está disponible. Aquí tienes un código nuevo: enséñaselo a tus padres."
        de: "Der Dino-Hüter, den deine Eltern für dich ausgewählt haben, ist nicht mehr verfügbar. Hier ist ein neuer Code: Zeig ihn deinen Eltern."
        it: "Il guardiano dei dino che i tuoi genitori avevano scelto per te non è più disponibile. Ecco un nuovo codice: mostralo ai tuoi genitori."
        pt: "O guardião dos dinos que os teus pais escolheram para ti já não está disponível. Aqui tens um código novo: mostra-o aos teus pais."
        br: "O cuidador de dinos que seus pais escolheram para você não está mais disponível. Aqui está um código novo: mostre para os seus pais."
        nl: "De dinoverzorger die je ouders voor je hadden gekozen, is niet meer beschikbaar. Hier is een nieuwe code: laat hem aan je ouders zien."
      invite_member_btn:
        fr: Inviter un gardien de dinos
        en: Invite a dino keeper
        es: Invitar a un cuidador de dinos
        de: Einen Dino-Hüter einladen
        it: Invita un guardiano dei dino
        pt: Convidar um guardião dos dinos
        br: Convidar um cuidador de dinos
        nl: Een dinoverzorger uitnodigen
      clan_invite_cta:
        fr: Ta tribu est encore vide ! Invite d'autres joueurs !
        en: Your tribe is still empty! Invite other players!
        es: ¡Tu tribu aún está vacía! ¡Invita a otros jugadores!
        de: Dein Stamm ist noch leer! Lade andere Spieler ein!
        it: La tua tribù è ancora vuota! Invita altri giocatori!
        pt: A tua tribo ainda está vazia! Convida outros jogadores!
        br: Sua tribo ainda está vazia! Convide outros jogadores!
        nl: Je stam is nog leeg! Nodig andere spelers uit!
      share_clan_invite_link:
        fr: 'Installe d''abord le jeu (lien plus bas), puis ouvre ce lien pour entrer dans la tribu :'
        en: 'Install the game first (link below), then open this link to join the tribe:'
        es: 'Instala primero el juego (enlace abajo) y luego abre este enlace para entrar en la tribu:'
        de: 'Installiere zuerst das Spiel (Link weiter unten) und öffne dann diesen Link, um dem Stamm beizutreten:'
        it: 'Installa prima il gioco (link più in basso), poi apri questo link per entrare nella tribù:'
        pt: 'Instala primeiro o jogo (ligação mais abaixo) e depois abre esta ligação para entrares na tribo:'
        br: 'Primeiro instale o jogo (link mais abaixo) e depois abra este link para entrar na tribo:'
        nl: 'Installeer eerst het spel (link hieronder) en open daarna deze link om bij de stam te komen:'
      invite_wrong_region:
        fr: Cette tribu est gardée dans une autre contrée du monde. Pour la rejoindre, il faut avoir choisi la même
          contrée qu'elle au tout début du jeu.

      referral_conditions:
        fr: "Comment ça marche\n• Partagez votre code avec une autre tribu. Elle le saisit dans « J'ai un parrain », avant son premier abonnement payé.\n• Quand cette tribu paie son premier abonnement et ne se fait pas rembourser dans les 3 jours, votre tribu gagne un mois : votre prochaine échéance est repoussée d'un mois, ou un mois offert s'ajoute si vous n'êtes pas abonnés.\n• Un seul mois par tribu parrainée, et seul le parrain direct le gagne. Les tribus parrainées par vos filleules font grandir vos titres.\n• Plafond : vos mois offerts en cours ne dépassent jamais 2 par tribu parrainée encore abonnée. Au-delà, le mois est perdu. Un mois gagné n'est jamais repris.\n• Un parrainage ne vaut qu'entre tribus d'une même région de serveurs.\n• Se parrainer soi-même est interdit. En cas d'abus, Donjons & Savons peut désactiver un code, annuler un parrainage ou suspendre l'offre."
        en: "How it works\n• Share your code with another tribe. They enter it in \"I have a sponsor\", before their first paid subscription.\n• When that tribe pays its first subscription and is not refunded within 3 days, your tribe earns a month: your next billing date moves one month later, or a free month is added if you are not subscribed.\n• Only one month per sponsored tribe, and only the direct sponsor earns it. Tribes sponsored by your own sponsored tribes make your titles grow.\n• Limit: your free months in progress never exceed 2 per sponsored tribe that is still subscribed. Beyond that, the month is lost. A month earned is never taken back.\n• Sponsorship only works between tribes of the same server region.\n• Sponsoring yourself is not allowed. In case of abuse, Dungeons & Dusting may deactivate a code, cancel a sponsorship or suspend the offer."
        es: "Cómo funciona\n• Compartid vuestro código con otra tribu. La introduce en «Tengo un padrino», antes de su primera suscripción de pago.\n• Cuando esa tribu paga su primera suscripción y no pide el reembolso en 3 días, vuestra tribu gana un mes: vuestro próximo cobro se retrasa un mes, o se añade un mes gratis si no tenéis suscripción.\n• Un solo mes por tribu apadrinada, y solo lo gana el padrino directo. Las tribus apadrinadas por vuestras ahijadas hacen crecer vuestros títulos.\n• Tope: vuestros meses gratis en curso nunca superan 2 por tribu apadrinada que siga suscrita. Por encima, el mes se pierde. Un mes ganado nunca se retira.\n• El padrinazgo solo vale entre tribus de una misma región de servidores.\n• Apadrinarse a uno mismo está prohibido. En caso de abuso, Calabozos & Jabones puede desactivar un código, anular un padrinazgo o suspender la oferta."
        it: "Come funziona\n• Condividete il vostro codice con un'altra tribù. Lo inserisce in «Ho un padrino», prima del suo primo abbonamento a pagamento.\n• Quando quella tribù paga il suo primo abbonamento e non chiede il rimborso entro 3 giorni, la vostra tribù guadagna un mese: il vostro prossimo addebito slitta di un mese, oppure si aggiunge un mese in regalo se non siete abbonati.\n• Un solo mese per tribù di cui siete padrini, e lo guadagna solo il padrino diretto. Le tribù portate dalle vostre figliocce fanno crescere i vostri titoli.\n• Tetto: i vostri mesi in regalo in corso non superano mai 2 per tribù figlioccia ancora abbonata. Oltre, il mese è perso. Un mese guadagnato non viene mai ripreso.\n• Il padrinato vale solo tra tribù della stessa regione di server.\n• Fare da padrino a se stessi è vietato. In caso di abuso, Donjons & Savons può disattivare un codice, annullare un padrinato o sospendere l'offerta."
        de: "So funktioniert es\n• Teilt euren Code mit einem anderen Stamm. Er gibt ihn unter „Wir haben einen Paten“ ein, vor seinem ersten bezahlten Abo.\n• Wenn dieser Stamm sein erstes Abo bezahlt und es nicht innerhalb von 3 Tagen erstattet bekommt, gewinnt euer Stamm einen Monat: eure nächste Abbuchung verschiebt sich um einen Monat, oder ein Gratismonat kommt hinzu, wenn ihr kein Abo habt.\n• Nur ein Monat pro geworbenem Stamm, und nur der direkte Pate bekommt ihn. Stämme, die von euren geworbenen Stämmen geworben werden, lassen eure Titel wachsen.\n• Obergrenze: eure laufenden Gratismonate übersteigen nie 2 pro geworbenem Stamm, der noch ein Abo hat. Darüber hinaus verfällt der Monat. Ein gewonnener Monat wird nie zurückgenommen.\n• Werben gilt nur zwischen Stämmen derselben Serverregion.\n• Sich selbst zu werben ist verboten. Bei Missbrauch kann Donjons & Savons einen Code deaktivieren, eine Werbung aufheben oder das Angebot aussetzen."
        pt: "Como funciona\n• Partilhem o vosso código com outra tribo. Ela introduz o código em «Tenho um padrinho», antes da primeira subscrição paga.\n• Quando essa tribo pagar a primeira subscrição e não for reembolsada nos 3 dias seguintes, a vossa tribo ganha um mês: a vossa próxima cobrança é adiada um mês, ou é acrescentado um mês oferecido se não tiverem subscrição.\n• Um só mês por tribo apadrinhada, e só o padrinho direto o ganha. As tribos apadrinhadas pelas vossas afilhadas fazem crescer os vossos títulos.\n• Limite: os vossos meses oferecidos em curso nunca passam de 2 por tribo apadrinhada ainda com subscrição. Acima disso, o mês perde-se. Um mês ganho nunca é retirado.\n• O apadrinhamento só vale entre tribos da mesma região de servidores.\n• Apadrinhar-se a si próprio é proibido. Em caso de abuso, Donjons & Savons pode desativar um código, anular um apadrinhamento ou suspender a oferta."
        br: "Como funciona\n• Compartilhem o código de vocês com outra tribo. Ela digita o código em \"Tenho um padrinho\", antes da primeira assinatura paga.\n• Quando essa tribo pagar a primeira assinatura e não pedir reembolso em 3 dias, a tribo de vocês ganha um mês: a próxima cobrança é adiada em um mês, ou um mês grátis é somado se vocês não forem assinantes.\n• Um só mês por tribo indicada, e só o padrinho direto ganha. As tribos indicadas pelas afilhadas de vocês fazem os títulos crescerem.\n• Limite: os meses grátis em andamento nunca passam de 2 por tribo indicada que continua assinante. Acima disso, o mês é perdido. Um mês ganho nunca é retirado.\n• A indicação só vale entre tribos da mesma região de servidores.\n• Indicar a si mesmo é proibido. Em caso de abuso, Donjons & Savons pode desativar um código, cancelar uma indicação ou suspender a oferta."
        nl: "Zo werkt het\n• Deel jullie code met een andere stam. Die voert hem in bij \"Ik heb een peetouder\", vóór het eerste betaalde abonnement.\n• Als die stam zijn eerste abonnement betaalt en binnen 3 dagen geen terugbetaling krijgt, wint jullie stam een maand: jullie volgende afschrijving schuift een maand op, of er komt een gratis maand bij als jullie geen abonnement hebben.\n• Eén maand per aangebrachte stam, en alleen de directe peetouder krijgt hem. Stammen die door jullie aangebrachte stammen worden aangebracht, laten jullie titels groeien.\n• Plafond: jullie lopende gratis maanden zijn nooit meer dan 2 per aangebrachte stam die nog een abonnement heeft. Daarboven vervalt de maand. Een verdiende maand wordt nooit teruggenomen.\n• Aanbrengen geldt alleen tussen stammen van dezelfde serverregio.\n• Jezelf aanbrengen is verboden. Bij misbruik kan Donjons & Savons een code uitschakelen, een aanbrenging annuleren of het aanbod opschorten."

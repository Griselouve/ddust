        it: '@@@session.user.name@@@ ha fondato la tribù {clan}. Tutto comincia qui.'
        pt: '@@@session.user.name@@@ fundou a tribo {clan}. Tudo começa aqui.'
        br: '@@@session.user.name@@@ fundou a tribo {clan}. Tudo começa aqui.'
        nl: '@@@session.user.name@@@ heeft de stam {clan} opgericht. Hier begint alles.'

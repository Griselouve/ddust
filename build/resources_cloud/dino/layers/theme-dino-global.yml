          Responda APENAS neste formato exato, NESTA ORDEM, mantendo os marcadores ALIAS:, ALIAS_DESCRIPTION:, NOM: e DESCRIPTION: exatamente como estão (não os traduza, não mude a ordem):
          ALIAS: <segundo nome de tribo, de 2 a 4 palavras>
          ALIAS_DESCRIPTION: <segunda descrição, de 2 a 3 frases curtas>
          NOM: <nome da tribo, de 2 a 4 palavras>
          DESCRIPTION: <descrição carinhosa, de 2 a 3 frases curtas>
          Todo o conteúdo deve ser escrito em @@@worker.inspire_lang@@@, com palavras simples que uma criança de 3 anos entenda.

          REGISTRO OBRIGATÓRIO. Este texto vai ser lido por crianças de 3 a 7 anos.
          - Todos os dinos são bonzinhos: os únicos problemas deles são a sujeira e a bagunça, engraçadas e inofensivas. Nenhuma violência contra pessoas ou animais, nenhuma arma, nada de sangue, ferimentos ou morte; nenhum dino come ninguém.

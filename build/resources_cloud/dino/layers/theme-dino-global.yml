        es: 'Lo que la aplicación espera de ti: el esfuerzo, la alerta, el huevo de dino y tu lugar en el juego.'
        de: 'Was die App von dir erwartet: die Mühe, die Warnung, das Dino-Ei und deinen eigenen Platz im Spiel.'
        it: 'Cosa si aspetta da te l''app: l''impegno, l''allarme, l''uovo di dino e il tuo posto nel gioco.'
        pt: 'O que a aplicação espera de ti: o esforço, o alerta, o ovo de dino e o teu lugar no jogo.'
        br: 'O que o aplicativo espera de você: o esforço, o alerta, o ovo de dino e o seu lugar no jogo.'
        nl: 'Wat de app van je verwacht: de moeite, de waarschuwing, het dino-ei en je eigen plek in het spel.'
      perso_menu_guide_enfant_desc:
        fr: 'Tes droits dans le jeu : recommencer, refuser le défi du réveil, garder ta photo ou ta vidéo.'
        en: 'Your rights in the game: start over, refuse the wake-up challenge, keep your photo or video.'
        es: 'Tus derechos en el juego: volver a empezar, rechazar el reto del despertar, guardar tu foto o tu vídeo.'
        de: 'Deine Rechte im Spiel: neu anfangen, das Aufwach-Spiel ablehnen, dein Foto oder Video behalten.'
        it: 'I tuoi diritti nel gioco: ricominciare, rifiutare la sfida del risveglio, tenere la tua foto o il tuo
          video.'
        pt: 'Os teus direitos no jogo: recomeçar, recusar o desafio do despertar, guardar a tua foto ou o teu vídeo.'
        br: 'Seus direitos no jogo: recomeçar, recusar o desafio de acordar, guardar sua foto ou seu vídeo.'
        nl: 'Jouw rechten in het spel: opnieuw beginnen, het wakker-word-spelletje weigeren, je foto of video houden.'
      guide_p_not_adult:
        fr: "Ce guide s'adresse aux adultes de la tribu. Le tien s'appelle « Guide du gardien de dinos » : il est juste en dessous dans cette liste."
        en: "This guide is for the grown-ups of the tribe. Yours is called « Dino keeper's guide »: it is just below in this list."
        es: "Esta guía es para los adultos de la tribu. La tuya se llama « Guía del cuidador de dinos »: está justo debajo en esta lista."
        it: "Questa guida è per gli adulti della tribù. La tua si chiama «Guida del guardiano dei dino»: è subito sotto in questo elenco."
        de: "Dieser Ratgeber ist für die Erwachsenen im Stamm. Deiner heißt „Ratgeber für Dino-Hüter“: Er steht direkt darunter in dieser Liste."
        pt: "Este guia é para os adultos da tribo. O teu chama-se «Guia do guardião dos dinos»: está logo abaixo nesta lista."
        br: "Este guia é para os adultos da tribo. O seu se chama \"Guia do cuidador de dinos\": está logo abaixo nesta lista."
        nl: "Deze gids is voor de volwassenen van de stam. De jouwe heet ‘Gids van de dinoverzorger’: die staat er in deze lijst net onder."
      guide_p1_a:
        fr: Trois verdicts, aucune sanction
        en: Three verdicts, no penalty
        es: Tres veredictos, ninguna sanción
        de: Drei Urteile, kein Tadel
        it: Tre verdetti, nessuna sanzione
        pt: Três veredictos, nenhuma sanção
        br: Três vereditos, nenhuma bronca
        nl: Drie oordelen, geen sanctie
      guide_p2_title:
        fr: Perte de PV, c'est une alerte
        en: Losing life points is an alert
        es: Perder puntos de vida es una alerta
        de: LP-Verlust ist ein Warnsignal
        it: Perdere PV è un campanello d'allarme
        pt: Perder PV é um alerta
        br: Perder PV é um alerta
        nl: LP verliezen is een waarschuwing
      guide_p2_situation:
        fr: 'Le personnage de votre enfant peut s''endormir d''ennui, et le défi du réveil l''attend alors. Ce n''est
          pas le jeu qui le sanctionne : c''est l''application qui vous rend la main.'
        en: 'Your child''s character may fall asleep from boredom, and the wake-up challenge then awaits. The game
          is not penalising them: the app is handing things back to you.'
        es: 'El personaje de tu hijo puede quedarse dormido de aburrimiento, y entonces le espera el reto del despertar.
          No es el juego que lo sanciona: es la aplicación que te devuelve la mano.'
        de: 'Der Charakter deines Kindes kann vor Langeweile einschlafen, und dann wartet das Aufwach-Spiel. Nicht
          das Spiel tadelt es: Die App gibt dir das Heft zurück in die Hand.'
        it: 'Il personaggio di tuo figlio può addormentarsi dalla noia, e allora lo aspetta la sfida del risveglio.
          Non è il gioco che lo sanziona: è l''app che ti restituisce la parola.'
        pt: 'O personagem do teu filho pode adormecer de tédio, e então espera-o o desafio do despertar. Não é o
          jogo que o sanciona: é a aplicação que te devolve as rédeas.'
        br: 'O personagem do seu filho pode pegar no sono de tédio, e aí o desafio de acordar espera por ele. Não
          é o jogo que dá bronca: é o aplicativo que devolve as rédeas a você.'
        nl: 'Het personage van je kind kan in slaap vallen van verveling, en dan wacht het wakker-word-spelletje.
          Het spel deelt geen sanctie uit: de app geeft het stuur aan jou terug.'
      guide_p2_a_desc:
        fr: 'La perte de PV vous dit d''aller voir pourquoi : de l''ennui ? des tâches trop dures ? Et au bout,
          il peut y avoir le défi du réveil : non pour sanctionner, votre enfant a le droit de refuser, mais pour
          dédramatiser et resserrer les liens.'
        en: 'Losing life points tells you to go and find out why: boredom? chores that are too hard? And there may
          be the wake-up challenge at the end: not as a penalty, your child is free to refuse it, but to lighten
          the mood and bring you closer.'
        es: 'Perder puntos de vida te dice que vayas a ver por qué: ¿aburrimiento? ¿tareas demasiado difíciles?
          Y al final puede estar el reto del despertar: no para sancionar, tu hijo puede negarse, sino para quitar
          dramatismo y estrechar los lazos.'
        de: 'Der LP-Verlust sagt dir, dass du nachsehen solltest, warum: Langeweile? Zu schwere Aufgaben? Und am
          Ende kann das Aufwach-Spiel stehen: nicht als Tadel (dein Kind darf es ablehnen), sondern um die Stimmung
          zu lockern und euch näherzubringen.'
        it: 'La perdita di PV ti dice di andare a vedere perché: noia? Compiti troppo difficili? E alla fine può
          esserci la sfida del risveglio: non per sanzionare (tuo figlio ha il diritto di rifiutarla), ma per sdrammatizzare
          e rinsaldare i legami.'
        pt: 'Perder PV diz-te para ires ver porquê: aborrecimento? Tarefas demasiado difíceis? E no fim pode haver
          o desafio do despertar: não para sancionar (o teu filho pode recusá-lo), mas para desdramatizar e estreitar
          os laços.'
        br: 'Perder PV avisa você para ir ver o porquê: tédio? Tarefas difíceis demais? E no fim pode haver o desafio
          de acordar: não para dar bronca (seu filho pode recusá-lo), mas para descontrair e fortalecer os laços.'
        nl: 'Het verlies van LP zegt je dat je moet gaan kijken waarom: verveling? Te moeilijke taken? En aan het
          eind kan het wakker-word-spelletje komen: niet als sanctie (je kind mag het weigeren), maar om de spanning
          weg te nemen en jullie band te versterken.'
      guide_p2_b_desc:
        fr: 'Terminer une tâche rend l''intégralité des points de vie. Rien ne s''accumule, rien ne se rattrape
          : une sanction ne s''effacerait pas si vite.'
        en: 'Finishing one task restores every life point. Nothing piles up, nothing has to be made up for: a penalty
          would not clear that easily.'
        es: 'Terminar una tarea devuelve todos los puntos de vida. Nada se acumula, nada hay que recuperar: una
          sanción no se borraría tan rápido.'
        de: 'Eine Aufgabe zu beenden gibt alle Lebenspunkte zurück. Nichts sammelt sich an, nichts muss nachgeholt
          werden: Ein Tadel wäre nicht so schnell vergessen.'
        it: 'Finire un compito restituisce tutti i punti vita. Niente si accumula, niente va recuperato: una sanzione
          non si cancellerebbe così in fretta.'
        pt: 'Terminar uma tarefa devolve todos os pontos de vida. Nada se acumula, nada tem de ser recuperado: uma
          sanção não se apagaria tão depressa.'
        br: 'Terminar uma tarefa devolve todos os pontos de vida. Nada se acumula, nada precisa ser recuperado:
          uma bronca não se apagaria tão rápido.'
        nl: 'Eén taak afmaken geeft alle levenspunten terug. Niets stapelt zich op, niets hoeft te worden ingehaald:
          een sanctie zou niet zo snel verdwijnen.'
      guide_p2_c:
        fr: Le défi du réveil est un jeu de famille
        en: The wake-up challenge is a family game
        es: El reto del despertar es un juego de familia
        de: Das Aufwach-Spiel ist ein Familienspiel
        it: La sfida del risveglio è un gioco di famiglia
        pt: O desafio do despertar é um jogo de família
        br: O desafio de acordar é uma brincadeira em família
        nl: Het wakker-word-spelletje is een gezinsspel
      guide_p3_title:
        fr: Que mettre dans l'œuf ?
        en: What goes into the egg?
        es: ¿Qué poner en el huevo?
        de: Was kommt ins Dino-Ei?
        it: Cosa mettere nell'uovo?
        pt: O que pôr no ovo?
        br: O que colocar no ovo?
        nl: Wat stop je in het dino-ei?
      guide_p3_situation:
        fr: "L'œuf de la tribu est plein et va éclore. Toute la famille se demande ce qu'il y a dedans."
        en: "The tribe egg is full and about to hatch. The whole family is wondering what is inside."
        es: "El huevo de la tribu está lleno y va a abrirse. Toda la familia se pregunta qué hay dentro."
        it: "L'uovo della tribù è pieno e sta per schiudersi. Tutta la famiglia si chiede cosa ci sia dentro."
        de: "Das Ei des Stammes ist voll und springt gleich auf. Die ganze Familie fragt sich, was drin ist."
        pt: "O ovo da tribo está cheio e vai abrir-se. A família toda pergunta-se o que estará lá dentro."
        br: "O ovo da tribo está cheio e vai se abrir. A família toda se pergunta o que haverá lá dentro."
        nl: "Het ei van de stam is vol en komt zo uit. De hele familie vraagt zich af wat erin zit."
      guide_p3_b_desc:
        fr: Les surprises de l'œuf ne sont pas un salaire. Et « pas de surprise tant que… » retourne le jeu contre
          lui-même.
        en: The egg surprises are not a wage. And « no surprise until… » turns the game against itself.
        es: Las sorpresas del huevo no son un sueldo. Y «no hay sorpresa hasta que…» vuelve el juego contra sí mismo.
        de: Die Ei-Überraschungen sind kein Lohn. Und „keine Überraschung, solange…“ dreht das Spiel gegen sich
          selbst.
        it: Le sorprese dell'uovo non sono uno stipendio. E «niente sorpresa finché…» rivolta il gioco contro sé
          stesso.
        pt: As surpresas do ovo não são um salário. E «não há surpresa enquanto…» vira o jogo contra si próprio.
        br: As surpresas do ovo não são um salário. E "sem surpresa enquanto…" vira o jogo contra ele mesmo.
        nl: De ei-verrassingen zijn geen loon. En ‘geen verrassing zolang…’ keert het spel tegen zichzelf.
      guide_k1_situation:
        fr: "Chaque dino que tu rends tout content, c'est une tâche faite à la maison. Tes points font grandir ton personnage, et toute ta tribu avec toi."
        en: "Every dino you make happy is a task done at home. Your points make your character grow, and your whole tribe with you."
        es: "Cada dino que haces feliz es una tarea hecha en casa. Tus puntos hacen crecer a tu personaje, y a toda tu tribu contigo."
        it: "Ogni dino che rendi felice è un compito fatto a casa. I tuoi punti fanno crescere il tuo personaggio, e tutta la tua tribù con te."
        de: "Jeder Dino, den du glücklich machst, ist eine erledigte Aufgabe zu Hause. Deine Punkte lassen deinen Charakter wachsen, und deinen ganzen Stamm mit dir."
        pt: "Cada dino que deixas contente é uma tarefa feita em casa. Os teus pontos fazem crescer o teu personagem, e toda a tua tribo contigo."
        br: "Cada dino que você deixa feliz é uma tarefa feita em casa. Seus pontos fazem seu personagem crescer, e toda a sua tribo junto com você."
        nl: "Elke dino die je blij maakt, is een klusje dat thuis gedaan is. Je punten laten je personage groeien, en je hele stam met je mee."
      guide_k1_b_desc:
        fr: "Tu prends le dino que tu veux, tu t'occupes de lui, puis un chef de la tribu valide."
        en: "You take whichever dino you want, you look after it, then a tribe chief validates it."
        es: "Coges el dino que quieras, lo cuidas y luego un jefe de la tribu lo valida."
        it: "Prendi il dino che vuoi, te ne prendi cura, poi un capo della tribù convalida."
        de: "Du nimmst dir den Dino, den du willst, kümmerst dich um ihn, und dann bestätigt ein Stammes-Chef."
        pt: "Escolhes o dino que quiseres, cuidas dele e depois um chefe da tribo valida."
        br: "Você escolhe o dino que quiser, cuida dele e depois um chefe da tribo valida."
        nl: "Je kiest de dino die je wilt, je zorgt voor hem, en dan valideert een stamhoofd."
      guide_k1_c:
        fr: Un dino à la fois
        en: One dino at a time
        es: Un dino cada vez
        de: Ein Dino nach dem anderen
        it: Un dino alla volta
        pt: Um dino de cada vez
        br: Um dino de cada vez
        nl: Eén dino tegelijk
      guide_k2_title:
        fr: Tes points de vie baissent ?
        en: Your life points going down?
        es: ¿Te bajan los puntos de vida?
        de: Deine Lebenspunkte sinken?
        it: I tuoi punti vita calano?
        pt: Os teus pontos de vida estão a baixar?
        br: Seus pontos de vida estão caindo?
        nl: Dalen je levenspunten?
      guide_k2_situation:
        fr: 'Tu as vu tes points de vie diminuer tout seuls ? Ce n''est pas ta faute : c''est juste le temps qui
          passe sans dino chouchouté.'
        en: 'Have you seen your life points go down on their own? It''s not your fault: it''s just time passing
          with no dino looked after.'
        es: '¿Has visto bajar tus puntos de vida solos? No es culpa tuya: es solo el tiempo que pasa sin cuidar
          dinos.'
        de: 'Hast du gesehen, dass deine Lebenspunkte von allein weniger werden? Das ist nicht deine Schuld: Es
          ist nur die Zeit, die vergeht, ohne dass ein Dino umsorgt wird.'
        it: 'Hai visto i tuoi punti vita calare da soli? Non è colpa tua: è solo il tempo che passa senza dino coccolati.'
        pt: 'Viste os teus pontos de vida a diminuir sozinhos? Não é culpa tua: é só o tempo a passar sem cuidares
          de dinos.'
        br: 'Viu seus pontos de vida diminuindo sozinhos? Não é culpa sua: é só o tempo passando sem você cuidar
          de dinos.'
        nl: 'Zag je je levenspunten vanzelf minder worden? Dat is niet jouw schuld: het is gewoon de tijd die voorbijgaat
          zonder dat je voor een dino zorgt.'
      guide_k2_a:
        fr: Un point de vie par jour sans tâche
        en: One life point per day without a task
        es: Un punto de vida por día sin tarea
        de: Ein Lebenspunkt pro Tag ohne Aufgabe
        it: Un punto vita al giorno senza compiti
        pt: Um ponto de vida por dia sem tarefa
        br: Um ponto de vida por dia sem tarefa
        nl: Eén levenspunt per dag zonder taak
      guide_k2_b_desc:
        fr: Rends un seul dino tout content et tu récupères tous tes points de vie d'un coup.
        en: Make a single dino happy and you get every life point back at once.
        es: Haz feliz a un solo dino y recuperas todos tus puntos de vida de golpe.
        de: Mach einen einzigen Dino glücklich und du bekommst alle Lebenspunkte auf einmal zurück.
        it: Rendi felice un solo dino e recuperi tutti i tuoi punti vita in un colpo.
        pt: Deixa um só dino contente e recuperas todos os teus pontos de vida de uma vez.
        br: Deixe um só dino feliz e você recupera todos os seus pontos de vida de uma vez.
        nl: Maak één dino blij en je krijgt al je levenspunten in één keer terug.
      guide_k2_c:
        fr: À zéro, un réveil rigolo
        en: At zero, a funny wake-up
        es: A cero, un despertar divertido
        de: Bei null ein lustiges Aufwachen
        it: A zero, un risveglio buffo
        pt: A zero, um despertar divertido
        br: No zero, um despertar divertido
        nl: Op nul een grappig wekmoment
      guide_k2_c_desc:
        fr: Ta famille te réveille en vrai, en rigolant. Tu as le droit de dire non, et personne ne vérifie.
        en: Your family wakes you up for real, with lots of giggles. You're allowed to say no, and nobody checks.
        es: Tu familia te despierta de verdad, entre risas. Tienes derecho a decir que no, y nadie lo comprueba.
        de: Deine Familie weckt dich in echt auf, mit viel Gekicher. Du darfst Nein sagen, und niemand prüft nach.
        it: La tua famiglia ti sveglia per davvero, ridendo. Hai il diritto di dire di no, e nessuno controlla.
        pt: A tua família acorda-te a sério, a rir. Tens o direito de dizer que não, e ninguém verifica.
        br: Sua família te acorda de verdade, dando risada. Você tem o direito de dizer não, e ninguém verifica.
        nl: Je familie maakt je echt wakker, met veel gegiechel. Je mag nee zeggen, en niemand controleert het.
      guide_k3_c_desc:
        fr: Le mur de la grotte ne garde pas tes « pas encore ». Personne n'en fait la liste.
        en: The cave wall doesn't tell of your misses. Nobody keeps a list of them.
        es: La pared de la cueva no cuenta tus fallos. Nadie guarda la lista.
        de: Die Höhlenwand erzählt nichts von deinen Patzern. Niemand führt eine Liste darüber.
        it: La parete della grotta non racconta i tuoi errori. Nessuno ne tiene la lista.
        pt: A parede da gruta não conta as tuas falhas. Ninguém guarda a lista.
        br: A parede da caverna não conta suas falhas. Ninguém guarda essa lista.
        nl: De grotmuur vertelt niets over je missers. Niemand houdt er een lijst van bij.
      guide_k4_title:
        fr: L'œuf
        en: The egg
        es: El huevo
        de: Das Ei
        it: L'uovo
        pt: O ovo
        br: O ovo
        nl: Het ei
      guide_k4_situation:
        fr: "Quand l'œuf de la tribu est plein, il éclot pour tout le monde en même temps."
        en: "When the tribe egg is full, it hatches for everyone at the same time."
        es: "Cuando el huevo de la tribu está lleno, se abre para todos a la vez."
        it: "Quando l'uovo della tribù è pieno, si schiude per tutti nello stesso momento."
        de: "Wenn das Ei des Stammes voll ist, springt es für alle gleichzeitig auf."
        pt: "Quando o ovo da tribo está cheio, abre-se para todos ao mesmo tempo."
        br: "Quando o ovo da tribo está cheio, ele se abre para todos ao mesmo tempo."
        nl: "Als het ei van de stam vol is, komt het voor iedereen tegelijk uit."
      guide_k4_a:
        fr: Les surprises se partagent
        en: The surprises are shared
        es: Las sorpresas se reparten
        de: Die Überraschungen werden geteilt
        it: Le sorprese si dividono
        pt: As surpresas são repartidas
        br: As surpresas são divididas
        nl: De verrassingen worden gedeeld
      giftcode_empty:
        fr: 'Il n''y a rien à faire éclore : l''œuf attend un code.'
        en: 'There is nothing to hatch: the egg is waiting for a code.'
        es: 'No hay nada que abrir: el huevo espera un código.'
        de: 'Hier springt nichts auf: Das Ei wartet auf einen Code.'
        it: 'Non c''è niente da schiudere: l''uovo aspetta un codice.'
        pt: 'Não há nada para abrir: o ovo está à espera de um código.'
        br: 'Não há nada para abrir: o ovo está esperando um código.'
        nl: 'Er komt niets uit: het ei wacht op een code.'
      giftcode_invalid:
        fr: Ce code ne fait éclore aucun œuf. Vérifiez les signes, un par un.
        en: This code hatches no egg. Check the characters, one by one.
        es: Este código no abre ningún huevo. Comprueba los signos, uno a uno.
        de: Dieser Code öffnet kein Ei. Prüf die Zeichen, eins nach dem anderen.
        it: Questo codice non schiude nessun uovo. Controlla i caratteri, uno per uno.
        pt: Este código não abre nenhum ovo. Verifica os caracteres, um a um.
        br: Este código não abre nenhum ovo. Confira os caracteres, um por um.
        nl: Met deze code komt geen enkel ei uit. Controleer de tekens, een voor een.
      giftcode_used:
        fr: "Votre tribu a déjà fait éclore cet œuf-là."
        en: "Your tribe has already hatched that egg."
        es: "Vuestra tribu ya ha abierto ese huevo."
        it: "La vostra tribù ha già schiuso quell'uovo."
        de: "Euer Stamm hat dieses Ei schon geöffnet."
        pt: "A vossa tribo já abriu esse ovo."
        br: "A tribo de vocês já abriu esse ovo."
        nl: "Jullie stam heeft dat ei al laten uitkomen."
      giftcode_exhausted:
        fr: "Les surprises de cet œuf ont été prises par d'autres tribus avant vous."
        en: "This egg's surprises were taken by other tribes before you."
        es: "Otras tribus se llevaron las sorpresas de este huevo antes que vosotros."
        it: "Altre tribù hanno preso le sorprese di questo uovo prima di voi."
        de: "Andere Stämme haben die Überraschungen dieses Eis schon vor euch geholt."
        pt: "Outras tribos levaram as surpresas deste ovo antes de vocês."
        br: "Outras tribos pegaram as surpresas deste ovo antes de vocês."
        nl: "Andere stammen hebben de verrassingen van dit ei al voor jullie gepakt."
      giftcode_expired:
        fr: 'Ce code a fait son temps : l''œuf ne peut plus éclore.'
        en: 'This code has had its day: the egg can no longer hatch.'
        es: 'Este código ya cumplió su tiempo: el huevo ya no puede abrirse.'
        de: 'Dieser Code hat ausgedient: Das Ei kann nicht mehr aufspringen.'
        it: 'Questo codice ha fatto il suo tempo: l''uovo non può più schiudersi.'
        pt: 'Este código já cumpriu o seu tempo: o ovo já não pode abrir-se.'
        br: 'Este código já cumpriu seu tempo: o ovo não pode mais se abrir.'
        nl: 'Deze code heeft zijn tijd gehad: het ei kan niet meer uitkomen.'
      giftcode_throttled:
        fr: Trop de codes essayés. L'œuf se repose ; revenez demain.
        en: Too many codes tried. The egg is resting; come back tomorrow.
        es: Demasiados códigos probados. El huevo descansa; vuelve mañana.
        de: Zu viele Codes ausprobiert. Das Ei ruht sich aus; komm morgen wieder.
        it: Troppi codici provati. L'uovo si riposa; torna domani.
        pt: Demasiados códigos experimentados. O ovo está a descansar; volta amanhã.
        br: Códigos demais testados. O ovo está descansando; volte amanhã.
        nl: Te veel codes geprobeerd. Het ei rust even uit; kom morgen terug.
      giftcode_not_admin:
        fr: "Seul un chef de la tribu peut faire éclore cet œuf."
        en: "Only a tribe chief can hatch this egg."
        es: "Solo un jefe de la tribu puede abrir este huevo."
        it: "Solo un capo della tribù può schiudere questo uovo."
        de: "Nur ein Stammes-Chef kann dieses Ei öffnen."
        pt: "Só um chefe da tribo pode abrir este ovo."
        br: "Só um chefe da tribo pode abrir este ovo."

      kid_assent_question:
        fr: "Ici, c'est d'abord à toi qu'on demande.\n\nAs-tu envie de jouer à Donjons & Savons avec ta famille ?\n\nSi tu dis oui, ton téléphone affichera un code à montrer à tes parents. Ce sont eux qui décideront ensuite."
        en: "Here, we ask you first.\n\nDo you want to play Donjons & Savons with your family?\n\nIf you say yes, your phone will show a code for your parents. They will decide after that."
        es: "Aquí te lo preguntamos primero a ti.\n\n¿Tienes ganas de jugar a Donjons & Savons con tu familia?\n\nSi dices que sí, tu teléfono mostrará un código para enseñárselo a tus padres. Después, decidirán ellos."
        it: "Qui lo chiediamo prima a te.\n\nHai voglia di giocare a Donjons & Savons con la tua famiglia?\n\nSe dici di sì, il tuo telefono mostrerà un codice da far vedere ai tuoi genitori. Poi decideranno loro."
        de: "Hier fragen wir zuerst dich.\n\nHast du Lust, mit deiner Familie Donjons & Savons zu spielen?\n\nWenn du Ja sagst, zeigt dein Handy einen Code, den du deinen Eltern zeigst. Danach entscheiden sie."
        pt: "Aqui, perguntamos primeiro a ti.\n\nTens vontade de jogar Donjons & Savons com a tua família?\n\nSe disseres que sim, o teu telemóvel vai mostrar um código para mostrares aos teus pais. Depois, são eles que decidem."
        br: "Aqui, a pergunta é primeiro para você.\n\nVocê está com vontade de jogar Donjons & Savons com a sua família?\n\nSe disser que sim, seu celular vai mostrar um código para você mostrar aos seus pais. Depois, são eles que decidem."
        nl: "Hier vragen we het eerst aan jou.\n\nHeb je zin om Donjons & Savons te spelen met je familie?\n\nAls je ja zegt, laat je telefoon een code zien voor je ouders. Daarna beslissen zij."

          ALIAS_DESCRIPTION: <segunda descripción, de 1 a 2 frases cortas>
          NOM: <nombre de cuidador, una sola palabra>
          DESCRIPTION: <descripción del personaje, de 1 a 2 frases cortas>
          Todo el contenido debe estar redactado en @@@worker.inspire_lang@@@, con palabras sencillas que entienda un niño de 3 años.


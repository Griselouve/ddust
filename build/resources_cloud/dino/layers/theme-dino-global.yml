      # --- VOCABULAIRE DINO (2026-10-21) : textes du commun et du framework réécrits pour la tribu.
      solo_chief_text:
        fr: "Dans Donjons & Savons, ce sont les enfants qui s'occupent des dinos et font les tâches. Toi, tu mènes la tribu : tu valides leurs exploits et tu partages les surprises de l'œuf. Ta tribu n'a encore aucun gardien de dinos : fais-les entrer !"
        en: "In Donjons & Savons, children are the ones who look after the dinos and take on the tasks. You lead the tribe: you approve their feats and share out the egg surprises. Your tribe has no dino keepers yet: bring them in!"
        es: "En Donjons & Savons, son los niños quienes cuidan de los dinos y se encargan de las tareas. Tú diriges la tribu: validas sus hazañas y repartes las sorpresas del huevo. Tu tribu aún no tiene cuidadores de dinos: ¡haz que entren!"
        it: "In Donjons & Savons sono i bambini a prendersi cura dei dino e ad affrontare i compiti. Tu guidi la tribù: convalidi le loro imprese e dividi le sorprese dell'uovo. La tua tribù non ha ancora guardiani dei dino: falli entrare!"
        de: "In Donjons & Savons kümmern sich die Kinder um die Dinos und übernehmen die Aufgaben. Du führst den Stamm: Du bestätigst ihre Heldentaten und verteilst die Ei-Überraschungen. Dein Stamm hat noch keine Dino-Hüter: Hol sie herein!"
        pt: "Em Donjons & Savons, são as crianças que cuidam dos dinos e fazem as tarefas. Tu lideras a tribo: validas as suas proezas e repartes as surpresas do ovo. A tua tribo ainda não tem guardiões dos dinos: fá-los entrar!"
        br: "Em Donjons & Savons, são as crianças que cuidam dos dinos e fazem as tarefas. Você lidera a tribo: valida as façanhas delas e divide as surpresas do ovo. Sua tribo ainda não tem cuidadores de dinos: chame-os para entrar!"
        nl: "In Donjons & Savons zorgen de kinderen voor de dino's en nemen zij de taken op zich. Jij leidt de stam: je keurt hun heldendaden goed en verdeelt de ei-verrassingen. Je stam heeft nog geen dinoverzorgers: haal ze binnen!"
      invite_consent_chief_check:

          Esse segundo nome tem de ser DIFERENTE do primeiro e não partilhar nenhuma sílaba característica com ele. São nomes de personagem: nunca escrevas um apelido, nem algarismos, nem sufixos.
          Escreve da mesma forma uma segunda descrição, que diga o mesmo de outra maneira, sem repetir as palavras características da primeira.
          Responde APENAS neste formato exato, NESTA ORDEM, mantendo os marcadores tal como estão (não os traduzas, não os reordenes):

      link_account_notice:
        fr: "Rien n'est enregistré tant que tu n'es pas connecté : si tu fermes le jeu maintenant, tu recommenceras depuis le début. Si un parent veille sur ton compte Google (Family Link), il devra autoriser la connexion."
        en: "Nothing is saved until you sign in: if you close the game now, you will start again from the beginning. If a parent supervises your Google account (Family Link), they will have to allow the sign-in."
        es: "No se guarda nada hasta que te conectes: si cierras el juego ahora, empezarás de nuevo desde el principio. Si un adulto supervisa tu cuenta de Google (Family Link), tendrá que autorizar la conexión."
        it: "Non viene salvato nulla finché non accedi: se chiudi il gioco ora, ricomincerai dall'inizio. Se un genitore controlla il tuo account Google (Family Link), dovrà autorizzare l'accesso."
        de: "Nichts wird gespeichert, bevor du angemeldet bist: Wenn du das Spiel jetzt schließt, fängst du wieder von vorne an. Wenn ein Elternteil dein Google-Konto beaufsichtigt (Family Link), muss er die Anmeldung erlauben."
        pt: "Nada fica guardado enquanto não iniciares sessão: se fechares o jogo agora, vais recomeçar do início. Se um dos pais supervisiona a tua conta Google (Family Link), terá de autorizar o início de sessão."
        br: "Nada é salvo enquanto você não fizer login: se fechar o jogo agora, vai recomeçar do início. Se um dos pais supervisiona sua conta Google (Family Link), ele vai precisar autorizar o login."
        nl: "Er wordt niets bewaard zolang je niet bent ingelogd: als je het spel nu sluit, begin je weer bij het begin. Als een ouder toezicht houdt op je Google-account (Family Link), moet die het inloggen toestaan."

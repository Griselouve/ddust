      parental_consent_notice:
        fr: "X Conformément aux conditions générales d'utilisation, en créant un profil de joueur pour un enfant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "X In accordance with the terms of service, by creating a player profile for a child you declare that you are their legal guardian and you consent to the collection of their data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "X De conformidad con las condiciones generales de uso, al crear un perfil de jugador para un niño declaras ser su responsable legal y consientes la recogida de sus datos. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        de: "X Gemäß den Nutzungsbedingungen erklärst du mit dem Erstellen eines Spielerprofils für ein Kind, dass du sein Erziehungsberechtigter bist, und willigst in die Erhebung seiner Daten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        it: "X In conformità con le Condizioni d'uso, creando un profilo giocatore per un bambino dichiari di esserne il tutore legale e acconsenti alla raccolta dei suoi dati. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        pt: "X Em conformidade com os Termos de utilização, ao criares um perfil de jogador para uma criança declaras ser o seu responsável legal e consentes a recolha dos seus dados. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "X De acordo com os Termos de uso, ao criar um perfil de jogador para uma criança, você declara ser o responsável legal por ela e consente com a coleta dos dados dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "X Overeenkomstig de Gebruiksvoorwaarden verklaar je, door een spelersprofiel voor een kind aan te maken, dat je zijn wettelijke voogd bent en stem je in met het verzamelen van zijn gegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      invite_consent_notice:
        fr: "X En invitant quelqu'un dans votre clan, vous déclarez de qui il s'agit. S'il s'agit d'un enfant dont vous êtes le responsable légal, vous consentez à la collecte de ses données de jeu. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "X By inviting someone into your clan, you declare who they are. If it is a child for whom you are the legal guardian, you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "X Al invitar a alguien a tu clan, declaras de quién se trata. Si es un niño del que eres el responsable legal, consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        de: "X Wenn du jemanden in deinen Clan einlädst, erklärst du, um wen es sich handelt. Handelt es sich um ein Kind, dessen Erziehungsberechtigter du bist, willigst du in die Erhebung seiner Spieldaten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        it: "X Invitando qualcuno nel tuo clan, dichiari di chi si tratta. Se si tratta di un bambino di cui sei il tutore legale, acconsenti alla raccolta dei suoi dati di gioco. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        pt: "X Ao convidares alguém para o teu clã, declaras de quem se trata. Se for uma criança de quem és o responsável legal, consentes a recolha dos seus dados de jogo. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "X Ao convidar alguém para o seu clã, você declara de quem se trata. Se for uma criança pela qual você é o responsável legal, você consente com a coleta dos dados de jogo dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "X Door iemand in je clan uit te nodigen, verklaar je om wie het gaat. Gaat het om een kind van wie je de wettelijke voogd bent, dan stem je in met het verzamelen van zijn spelgegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."

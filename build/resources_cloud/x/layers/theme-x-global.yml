        de: "X Absolut unauffällig, gefürchtet gründlich. Niemand hört es kommen, aber danach glänzt die Küche."
        it: "X Discrezione assoluta, efficacia temibile. Nessuno lo sente arrivare, ma la cucina brilla dopo il suo passaggio."

      inspire_player_fallback_4_desc:
        fr: "X Un cœur d'or et des mains habiles. Toujours prêt à tendre la main à un compagnon en difficulté."
        en: "X A heart of gold and skilful hands. Always ready to help a companion in trouble."
        es: "X Un corazón de oro y unas manos hábiles. Siempre dispuesto a ayudar a un compañero en apuros."
        de: "X Ein Herz aus Gold und geschickte Hände. Immer bereit, einem Gefährten in Not zu helfen."
        it: "X Un cuore d'oro e mani abili. Sempre pronto ad aiutare un compagno in difficoltà."
        pt: "X Um coração de ouro e mãos habilidosas. Sempre pronto a ajudar um companheiro em apuros."
        br: "X Um coração de ouro e mãos habilidosas. Sempre pronto para ajudar um companheiro em apuros."
        nl: "X Een hart van goud en handige handen. Altijd klaar om een makker in nood te helpen."

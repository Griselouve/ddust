      clan_title_19:
        fr: "X Très Sainte et Reluisante Dynastie du Foyer Éternel, Gardienne des Sept Pièces et des Trois Étages, Lignée Souveraine des Plaines de Linge et des Vallées d'Évier, Vainqueur des Hordes de Poussière depuis des Générations, Maison-dont-nul-Recoin-n'Échappe-au-Regard, Et sous le Toit de laquelle nulle Tache ne saurait survivre."
        en: "X Most Holy and Resplendent Dynasty of the Eternal Hearth, Keeper of the Seven Rooms and the Three Floors, Sovereign Lineage of the Plains of Laundry and the Valleys of the Sink, Vanquisher of the Hordes of Dust for Generations, House-from-Whose-Gaze-No-Nook-Escapes, and beneath Whose Roof no Stain may survive."
        es: "X Santísima y Reluciente Dinastía del Hogar Eterno, Guardiana de las Siete Habitaciones y los Tres Pisos, Linaje Soberano de las Llanuras de Ropa y los Valles del Fregadero, Vencedora de las Hordas de Polvo desde hace Generaciones, Casa-de-cuya-Mirada-ningún-Rincón-Escapa, y bajo cuyo Techo ninguna Mancha puede sobrevivir."
        de: "X Hochheilige und Strahlende Dynastie des Ewigen Herdes, Hüterin der Sieben Zimmer und der Drei Stockwerke, Herrschergeschlecht der Wäscheebenen und der Spülbeckentäler, Bezwingerin der Staubhorden seit Generationen, Haus-vor-dessen-Blick-kein-Winkel-entkommt, und unter dessen Dach kein Fleck überleben kann."
        it: "X Santissima e Splendente Dinastia del Focolare Eterno, Custode delle Sette Stanze e dei Tre Piani, Stirpe Sovrana delle Pianure del Bucato e delle Valli del Lavello, Vincitrice delle Orde di Polvere da Generazioni, Casata-al-cui-Sguardo-nessun-Angolo-Sfugge, e sotto il cui Tetto nessuna Macchia può sopravvivere."
        pt: "X Santíssima e Reluzente Dinastia do Lar Eterno, Guardiã das Sete Divisões e dos Três Andares, Linhagem Soberana das Planícies de Roupa e dos Vales do Lava-Loiça, Vencedora das Hordas de Pó há Gerações, Casa-a-cujo-Olhar-nenhum-Recanto-Escapa, e sob cujo Teto nenhuma Nódoa pode sobreviver."
        br: "X Santíssima e Reluzente Dinastia do Lar Eterno, Guardiã dos Sete Cômodos e dos Três Andares, Linhagem Soberana das Planícies de Roupa e dos Vales da Lava-Louças, Vencedora das Hordas de Poeira há Gerações, Casa-a-cujo-Olhar-nenhum-Canto-Escapa, e sob cujo Teto nenhuma Mancha pode sobreviver."
        nl: "X Allerheiligste en Stralende Dynastie van de Eeuwige Haard, Hoedster van de Zeven Kamers en de Drie Verdiepingen, Soeverein Geslacht van de Wasvlakten en de Gootsteendalen, Overwinnares van de Stofhordes sinds Generaties, Huis-aan-wiens-Blik-geen-Hoekje-Ontsnapt, en onder wier Dak geen Vlek kan overleven."

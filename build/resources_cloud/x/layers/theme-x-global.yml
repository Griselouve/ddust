        nl: "X Een bescheiden avonturier, altijd klaar om een handje te helpen.|X Een betrouwbare reisgenoot, die zich door niets laat ontmoedigen.|X Een nieuwsgierige ontdekkingsreiziger, die nooit met lege handen thuiskomt."

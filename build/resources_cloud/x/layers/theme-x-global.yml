      inspire_player_fallback_6_desc:
        fr: "X Esprit malin et sourire en coin. Trouve toujours l'astuce pour finir plus vite que prévu."
        en: "X A clever mind and a sly smile. Always finds the trick to finish sooner than planned."
        es: "X Mente astuta y sonrisa pícara. Siempre encuentra el truco para terminar antes de lo previsto."
        de: "X Ein schlauer Kopf und ein verschmitztes Lächeln. Findet immer den Trick, um früher fertig zu sein als geplant."
        it: "X Mente furba e sorriso sornione. Trova sempre il trucco per finire prima del previsto."
        pt: "X Espírito astuto e sorriso maroto. Encontra sempre o truque para acabar mais cedo do que o previsto."
        br: "X Mente esperta e sorriso maroto. Sempre acha o truque para terminar mais cedo do que o previsto."
        nl: "X Een slimme geest en een sluwe glimlach. Vindt altijd de truc om sneller klaar te zijn dan gepland."

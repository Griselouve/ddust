      inspire_fallback_0_name:
        fr: "X Les Gardiens du Foyer"
        en: "X The Hearth Guardians"
        es: "X Los Guardianes del Hogar"
        de: "X Die Hüter des Herdes"
        it: "X I Guardiani del Focolare"
        pt: "X Os Guardiões do Lar"
        br: "X Os Guardiões do Lar"
        nl: "X De Hoeders van de Haard"
      inspire_fallback_0_desc:
        fr: "X Une famille unie par le serment de vaincre le chaos du quotidien. Leur force réside dans l'entraide et leur devise : 'Ensemble, rien ne résiste !'"
        en: "X A family united by the oath to conquer the chaos of everyday life. Their strength lies in teamwork and their motto: 'Together, nothing can stop us!'"
        es: "X Una familia unida por el juramento de vencer el caos cotidiano. Su fuerza reside en la unión y su lema: '¡Juntos, nada puede detenernos!'"
        de: "X Eine Familie, vereint durch den Schwur, das Chaos des Alltags zu besiegen. Ihre Stärke liegt im Zusammenhalt und in ihrem Motto: „Gemeinsam hält uns nichts auf!“"
        it: "X Una famiglia unita dal giuramento di sconfiggere il caos quotidiano. La sua forza sta nell'aiuto reciproco e nel suo motto: «Insieme, niente ci ferma!»"
        pt: "X Uma família unida pelo juramento de vencer o caos do dia a dia. A sua força está na entreajuda e no seu lema: «Juntos, nada nos detém!»"
        br: "X Uma família unida pelo juramento de vencer o caos do dia a dia. Sua força está na ajuda mútua e no seu lema: \"Juntos, nada nos detém!\""
        nl: "X Een gezin verenigd door de eed om de chaos van alledag te verslaan. Hun kracht ligt in elkaar helpen en in hun motto: ‘Samen houdt niets ons tegen!’"
      inspire_fallback_1_name:
        fr: "X Les Conquérants de l'Aube"
        en: "X The Dawn Conquerors"
        es: "X Los Conquistadores del Alba"
        de: "X Die Eroberer der Morgenröte"
        it: "X I Conquistatori dell'Alba"
        pt: "X Os Conquistadores da Aurora"
        br: "X Os Conquistadores da Aurora"
        nl: "X De Veroveraars van de Dageraad"
      inspire_fallback_1_desc:
        fr: "X Chaque aube est une nouvelle victoire. Ce clan affronte les monstres du quotidien avec courage et détermination, car pour eux, capituler n'est pas une option."
        en: "X Every dawn heralds a new victory. This clan faces the monsters of daily life with courage and relentless determination: surrendering is simply not in their nature."
        es: "X Cada amanecer anuncia una nueva victoria. Este clan enfrenta los monstruos del día a día con valentía y determinación, pues rendirse no es una opción para ellos."
        de: "X Jede Morgendämmerung ist ein neuer Sieg. Dieser Clan stellt sich den Monstern des Alltags mit Mut und Entschlossenheit, denn Aufgeben kommt für ihn nicht infrage."
        it: "X Ogni alba è una nuova vittoria. Questo clan affronta i mostri di tutti i giorni con coraggio e determinazione, perché per loro arrendersi non è un'opzione."
        pt: "X Cada madrugada é uma nova vitória. Este clã enfrenta os monstros do dia a dia com coragem e determinação, porque, para eles, desistir não é opção."
        br: "X Cada madrugada é uma nova vitória. Este clã enfrenta os monstros do dia a dia com coragem e determinação, porque, para eles, desistir não é opção."
        nl: "X Elke dageraad is een nieuwe overwinning. Deze clan gaat de monsters van alledag met moed en vastberadenheid te lijf, want opgeven is voor hen geen optie."
      inspire_fallback_2_name:
        fr: "X Les Anciens de la Flamme"
        en: "X The Flame Elders"
        es: "X Los Antiguos de la Llama"
        de: "X Die Ältesten der Flamme"
        it: "X Gli Antichi della Fiamma"
        pt: "X Os Anciãos da Chama"
        br: "X Os Anciãos da Chama"
        nl: "X De Ouden van de Vlam"
      inspire_fallback_2_desc:
        fr: "X Gardiens d'une sagesse ancestrale, ils transmettent l'art de vaincre les tâches avec grâce et efficacité. Leur flamme ne s'éteint jamais, elle guide le clan vers la victoire."
        en: "X Keepers of ancient wisdom, they pass on the art of vanquishing household beasts with grace and efficiency. Their flame never dies — it guides the clan to victory."
        es: "X Guardianes de una sabiduría ancestral, transmiten el arte de vencer las tareas del hogar con gracia y eficacia. Su llama nunca se apaga, guía al clan hacia la victoria."
        de: "X Als Hüter uralter Weisheit geben sie die Kunst weiter, Aufgaben mit Anmut und Geschick zu besiegen. Ihre Flamme erlischt nie, sie führt den Clan zum Sieg."
        it: "X Custodi di una saggezza antica, tramandano l'arte di sconfiggere le faccende con grazia ed efficienza. La loro fiamma non si spegne mai e guida il clan verso la vittoria."
        pt: "X Guardiões de uma sabedoria ancestral, transmitem a arte de vencer as tarefas com graça e eficácia. A sua chama nunca se apaga e guia o clã rumo à vitória."
        br: "X Guardiões de uma sabedoria ancestral, eles transmitem a arte de vencer as tarefas com graça e eficiência. Sua chama nunca se apaga e guia o clã rumo à vitória."
        nl: "X Als hoeders van eeuwenoude wijsheid geven zij de kunst door om klusjes met gratie en doeltreffendheid te verslaan. Hun vlam dooft nooit, zij leidt de clan naar de overwinning."
      inspire_fallback_3_name:
        fr: "X Les Chevaliers du Balai"
        en: "X The Broom Knights"
        es: "X Los Caballeros de la Escoba"
        de: "X Die Ritter des Besens"
        it: "X I Cavalieri della Scopa"
        pt: "X Os Cavaleiros da Vassoura"
        br: "X Os Cavaleiros da Vassoura"
        nl: "X De Ridders van de Bezem"
      inspire_fallback_3_desc:
        fr: "X Armés de balais et de bonne humeur, ils chassent la poussière de royaume en royaume. Aucune toile d'araignée ne leur échappe."
        en: "X Armed with brooms and good cheer, they chase dust from kingdom to kingdom. No cobweb escapes them."
        es: "X Armados con escobas y buen humor, persiguen el polvo de reino en reino. Ninguna telaraña se les escapa."
        de: "X Mit Besen und guter Laune bewaffnet, jagen sie den Staub von Königreich zu Königreich. Kein Spinnennetz entkommt ihnen."
        it: "X Armati di scope e di buonumore, danno la caccia alla polvere di regno in regno. Nessuna ragnatela sfugge loro."
        pt: "X Armados de vassouras e de bom humor, perseguem o pó de reino em reino. Nenhuma teia de aranha lhes escapa."
        br: "X Armados de vassouras e de bom humor, eles caçam a poeira de reino em reino. Nenhuma teia de aranha escapa deles."
        nl: "X Gewapend met bezems en een goed humeur jagen zij het stof van koninkrijk naar koninkrijk. Geen spinnenweb ontsnapt aan hen."
      inspire_fallback_4_name:
        fr: "X La Confrérie de l'Éponge"
        en: "X The Fellowship of the Sponge"
        es: "X La Hermandad de la Esponja"
        de: "X Die Bruderschaft des Schwamms"
        it: "X La Confraternita della Spugna"
        pt: "X A Irmandade da Esponja"
        br: "X A Irmandade da Esponja"
        nl: "X De Broederschap van de Spons"
      inspire_fallback_4_desc:
        fr: "X Leur serment : ne jamais laisser une assiette seule dans l'évier. Ensemble, ils font de la vaisselle un champ de victoire."
        en: "X Their oath: never leave a plate alone in the sink. Together, they turn the dishes into a field of victory."
        es: "X Su juramento: no dejar nunca un plato solo en el fregadero. Juntos, convierten los platos en un campo de victoria."
        de: "X Ihr Schwur: Niemals einen Teller allein in der Spüle lassen. Gemeinsam machen sie den Abwasch zum Siegesfeld."
        it: "X Il loro giuramento: mai lasciare un piatto da solo nel lavello. Insieme, trasformano i piatti in un campo di vittoria."
        pt: "X O seu juramento: nunca deixar um prato sozinho no lava-loiça. Juntos, fazem da loiça um campo de vitória."
        br: "X O juramento deles: nunca deixar um prato sozinho na pia. Juntos, eles transformam a louça em um campo de vitória."
        nl: "X Hun eed: laat nooit een bord alleen in de gootsteen. Samen maken ze van de afwas een slagveld vol overwinningen."
      inspire_fallback_5_name:
        fr: "X Les Veilleurs du Donjon"
        en: "X The Dungeon Watch"
        es: "X Los Vigías de la Mazmorra"
        de: "X Die Wächter des Verlieses"
        it: "X Le Sentinelle del Dungeon"
        pt: "X Os Vigias da Masmorra"
        br: "X Os Vigias da Masmorra"
        nl: "X De Wachters van de Kerker"
      inspire_fallback_5_desc:
        fr: "X Rien ne traîne sous leur garde. Ils patrouillent chaque pièce et repoussent le désordre avant qu'il ne s'installe."
        en: "X Nothing lies around on their watch. They patrol every room and drive back the mess before it settles in."
        es: "X Nada queda tirado bajo su guardia. Patrullan cada habitación y rechazan el desorden antes de que se instale."
        de: "X Unter ihrer Wacht bleibt nichts herumliegen. Sie patrouillieren durch jedes Zimmer und vertreiben die Unordnung, bevor sie sich breitmacht."
        it: "X Sotto la loro guardia non resta niente in giro. Pattugliano ogni stanza e respingono il disordine prima che si installi."
        pt: "X Nada fica fora do lugar sob a sua guarda. Patrulham cada divisão e afastam a desarrumação antes que ela se instale."
        br: "X Nada fica jogado sob a guarda deles. Eles patrulham cada cômodo e expulsam a bagunça antes que ela se instale."
        nl: "X Onder hun wacht blijft niets rondslingeren. Ze patrouilleren door elke kamer en verdrijven de rommel voordat die zich nestelt."
      inspire_fallback_6_name:
        fr: "X Les Héritiers du Grand Rangement"
        en: "X The Heirs of the Great Tidy-Up"
        es: "X Los Herederos del Gran Orden"
        de: "X Die Erben der Großen Ordnung"
        it: "X Gli Eredi del Grande Riordino"
        pt: "X Os Herdeiros da Grande Arrumação"
        br: "X Os Herdeiros da Grande Arrumação"
        nl: "X De Erfgenamen van de Grote Opruiming"
      inspire_fallback_6_desc:
        fr: "X Une lignée de héros qui a juré de rendre à chaque objet sa place. Leur légende grandit à chaque tiroir fermé."
        en: "X A line of heroes sworn to return every object to its place. Their legend grows with every drawer they close."
        es: "X Un linaje de héroes que juró devolver cada objeto a su sitio. Su leyenda crece con cada cajón cerrado."
        de: "X Ein Geschlecht von Helden, das geschworen hat, jedem Ding seinen Platz zurückzugeben. Ihre Legende wächst mit jeder geschlossenen Schublade."
        it: "X Una stirpe di eroi che ha giurato di rimettere ogni oggetto al suo posto. La loro leggenda cresce a ogni cassetto chiuso."
        pt: "X Uma linhagem de heróis que jurou devolver cada objeto ao seu lugar. A sua lenda cresce a cada gaveta fechada."
        br: "X Uma linhagem de heróis que jurou devolver cada objeto ao seu lugar. A lenda deles cresce a cada gaveta fechada."
        nl: "X Een geslacht van helden dat zwoer elk voorwerp zijn plek terug te geven. Hun legende groeit met elke gesloten la."
      inspire_fallback_7_name:
        fr: "X La Horde des Lève-Tôt"
        en: "X The Early Risers Horde"
        es: "X La Horda de los Madrugadores"
        de: "X Die Horde der Frühaufsteher"
        it: "X L'Orda dei Mattinieri"
        pt: "X A Horda dos Madrugadores"
        br: "X A Horda dos Madrugadores"
        nl: "X De Horde van de Vroege Vogels"
      inspire_fallback_7_desc:
        fr: "X Debout avant le soleil, ils ont déjà vaincu trois corvées quand le reste du monde se réveille. Leur cri de guerre : « Au travail, et en riant ! »"
        en: "X Up before the sun, they have already defeated three chores when the rest of the world wakes up. Their battle cry: 'To work, and laughing!'"
        es: "X En pie antes que el sol, ya han vencido tres tareas cuando el resto del mundo despierta. Su grito de guerra: '¡A trabajar, y riendo!'"
        de: "X Vor der Sonne auf den Beinen, haben sie schon drei Pflichten besiegt, wenn der Rest der Welt erwacht. Ihr Schlachtruf: „An die Arbeit, und zwar lachend!“"
        it: "X In piedi prima del sole, hanno già sconfitto tre faccende quando il resto del mondo si sveglia. Il loro grido di battaglia: «Al lavoro, ridendo!»"
        pt: "X De pé antes do sol, já venceram três tarefas quando o resto do mundo acorda. O seu grito de guerra: «Ao trabalho, e a rir!»"
        br: "X De pé antes do sol, eles já venceram três tarefas quando o resto do mundo acorda. O grito de guerra deles: \"Ao trabalho, e rindo!\""
        nl: "X Al op voor de zon, hebben ze al drie klusjes verslagen als de rest van de wereld wakker wordt. Hun strijdkreet: 'Aan het werk, en lachend!'"
      inspire_player_fallback_0_name:
        fr: "X Sasha"
        en: "X Sasha"
        es: "X Sasha"
        de: "X Sasha"
        it: "X Sasha"
        pt: "X Sasha"
        br: "X Sasha"
        nl: "X Sasha"
      inspire_player_fallback_0_desc:
        fr: "X Toujours le premier debout, jamais le dernier à rire. Rien ne lui résiste, surtout pas une pile d'assiettes."
        en: "X Always the first one up, never the last to laugh. Nothing resists them, least of all a stack of plates."
        es: "X Siempre el primero en levantarse, nunca el último en reír. Nada se le resiste, y menos una pila de platos."
        de: "X Immer als Erstes auf den Beinen, nie als Letztes beim Lachen. Nichts hält hier stand, am wenigsten ein Stapel Teller."
        it: "X Sempre il primo ad alzarsi, mai l'ultimo a ridere. Niente gli resiste, tanto meno una pila di piatti."
        pt: "X Sempre o primeiro a levantar-se, nunca o último a rir. Nada lhe resiste, muito menos uma pilha de pratos."
        br: "X Sempre o primeiro a se levantar, nunca o último a rir. Nada resiste a ele, muito menos uma pilha de pratos."
        nl: "X Altijd als eerste op, nooit als laatste aan het lachen. Niets houdt stand, en al helemaal geen stapel borden."

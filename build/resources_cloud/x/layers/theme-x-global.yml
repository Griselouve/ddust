      invite_clan_pin_instructions:
        fr: "X Dicte ce code de vive voix à ton invité, puis partage-lui le lien. Le lien seul ne suffit pas : le code est nécessaire pour rejoindre."
        en: "X Read this code aloud to your guest, then share the link. The link alone isn't enough: the code is required to join."
        es: "X Dicta este código de viva voz a tu invitado y comparte el enlace. El enlace por sí solo no basta: se necesita el código para unirse."
        de: "X Sag diesen Code deinem Gast laut an und teile dann den Link mit ihm. Der Link allein reicht nicht: Der Code wird zum Beitreten benötigt."
        it: "X Detta questo codice a voce al tuo invitato, poi condividi con lui il link. Il link da solo non basta: serve il codice per unirsi."
        pt: "X Dita este código em voz alta ao teu convidado e depois partilha com ele a ligação. A ligação sozinha não chega: é preciso o código para entrar."
        br: "X Dite este código em voz alta para seu convidado e depois compartilhe o link com ele. O link sozinho não basta: é preciso o código para entrar."
        nl: "X Lees deze code hardop voor aan je gast en deel daarna de link. De link alleen is niet genoeg: de code is nodig om mee te doen."

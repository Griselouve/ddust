        fr: "X Montre ce code à tes parents : ils le scanneront dans le menu de leur clan (« Accueillir un enfant »). S'ils ne sont pas à côté de toi, envoie-leur ta réponse."
        en: "X Show this code to your parents: they will scan it from their clan menu (“Welcome a child”). If they are not next to you, send them your answer."
        es: "X Enseña este código a tus padres: lo escanearán desde el menú de su clan («Acoger a un niño»). Si no están a tu lado, envíales tu respuesta."
        de: "X Zeig diesen Code deinen Eltern: Sie scannen ihn im Menü ihres Clans („Ein Kind aufnehmen“). Sind sie nicht bei dir, schick ihnen deine Antwort."
        it: "X Mostra questo codice ai tuoi genitori: lo scansioneranno dal menu del loro clan («Accogli un bambino»). Se non sono accanto a te, mandagli la tua risposta."
        pt: "X Mostra este código aos teus pais: vão digitalizá-lo no menu do clã deles («Acolher uma criança»). Se não estiverem ao teu lado, envia-lhes a tua resposta."
        br: "X Mostre este código para seus pais: eles vão escaneá-lo no menu do clã deles (“Acolher uma criança”). Se não estiverem ao seu lado, envie sua resposta para eles."
        nl: "X Laat deze code aan je ouders zien: zij scannen hem in het menu van hun clan (‘Een kind verwelkomen’). Zijn ze niet bij je, stuur ze dan je antwoord."

      opening_master_text:
        fr: "X Le moment tant attendu est arrivé ! Il est temps d'ouvrir le coffre et découvrir son contenu. Faites-le bien :\n\n• Réunissez le clan, si possible pour de vrai, dans la même pièce\n• Chacun peut raconter son aventure, ce qu'il a accompli, ce dont il est fier, ce qui a été difficile. Vous pouvez même jouer des rôles\n• Utilisez une tirelire ou un coffre pour y mettre l'argent de poche et l'ouvrir en famille\n• Célébrez votre victoire, posez les écrans et faites un jeu en famille, vous l'avez bien mérité\n• Et celui qui a remporté le moins d'XP gagne un lot de consolation : « tout le monde lui fait un bisou ! »"
        en: "X The moment you have been waiting for is here! Time to open the chest and discover what is inside. Do it properly:\n\n• Gather the clan, in the same room if you can\n• Everyone can tell their story: what they achieved, what they are proud of, what was hard. You can even act it out\n• Use a piggy bank or a chest to hold the pocket money, and open it together\n• Celebrate your victory: put the screens down and play a family game, you have earned it\n• And whoever earned the least XP gets a consolation prize: “everyone gives them a kiss!”"
        es: "X ¡Ha llegado el momento tan esperado! Es hora de abrir el cofre y descubrir lo que hay dentro. Hacedlo bien:\n\n• Reunid al clan, a ser posible de verdad, en la misma habitación\n• Cada uno puede contar su aventura: lo que logró, lo que le enorgullece, lo que le costó. Incluso podéis interpretar papeles\n• Usad una hucha o un cofre para guardar la paga y abridlo en familia\n• Celebrad vuestra victoria: soltad las pantallas y jugad en familia, os lo habéis ganado\n• Y quien haya conseguido menos XP gana un premio de consolación: «¡todos le dan un beso!»"
        de: "X Der lang ersehnte Moment ist da! Zeit, die Truhe zu öffnen und zu entdecken, was drin ist. Macht es richtig:\n\n• Versammelt den Clan, am besten wirklich zusammen im selben Raum\n• Jeder kann sein Abenteuer erzählen: was er geschafft hat, worauf er stolz ist, was schwer war. Ihr könnt es sogar nachspielen\n• Nehmt ein Sparschwein oder eine Truhe für das Taschengeld und öffnet sie gemeinsam\n• Feiert euren Sieg: Legt die Bildschirme weg und spielt ein Familienspiel, ihr habt es euch verdient\n• Und wer die wenigsten XP geholt hat, bekommt einen Trostpreis: „Alle geben ihm einen Kuss!“"
        it: "X Il momento tanto atteso è arrivato! È ora di aprire lo scrigno e scoprire cosa contiene. Fatelo bene:\n\n• Riunite il clan, se possibile davvero, nella stessa stanza\n• Ognuno può raccontare la sua avventura: cosa ha fatto, di cosa va fiero, cosa è stato difficile. Potete anche recitare dei ruoli\n• Usate un salvadanaio o uno scrigno per metterci la paghetta e apritelo in famiglia\n• Festeggiate la vostra vittoria: mettete via gli schermi e fate un gioco in famiglia, ve lo siete meritato\n• E chi ha ottenuto meno XP vince un premio di consolazione: «tutti gli danno un bacio!»"
        pt: "X Chegou o momento tão esperado! Está na hora de abrir o baú e descobrir o que tem lá dentro. Façam-no bem:\n\n• Reúnam o clã, se possível a sério, na mesma divisão\n• Cada um pode contar a sua aventura: o que conseguiu, do que se orgulha, o que foi difícil. Podem até fazer teatro\n• Usem um mealheiro ou um baú para guardar a mesada e abram-no em família\n• Celebrem a vossa vitória: pousem os ecrãs e façam um jogo em família, vocês merecem\n• E quem ganhou menos XP recebe um prémio de consolação: «todos lhe dão um beijinho!»"
        br: "X Chegou o momento tão esperado! Está na hora de abrir o baú e descobrir o que tem dentro. Façam isso direito:\n\n• Reúnam o clã, se possível de verdade, no mesmo cômodo\n• Cada um pode contar sua aventura: o que conseguiu, do que se orgulha, o que foi difícil. Vocês podem até fazer teatro\n• Usem um cofrinho ou um baú para guardar a mesada e abram em família\n• Comemorem sua vitória: deixem as telas de lado e joguem um jogo em família, vocês merecem\n• E quem ganhou menos XP recebe um prêmio de consolação: \"todo mundo dá um beijinho nele!\""
        nl: "X Het langverwachte moment is daar! Tijd om de kist te openen en te ontdekken wat erin zit. Doe het goed:\n\n• Verzamel de clan, het liefst echt samen in dezelfde kamer\n• Iedereen mag zijn avontuur vertellen: wat hij bereikt heeft, waar hij trots op is, wat moeilijk was. Jullie kunnen het zelfs naspelen\n• Gebruik een spaarpot of een kist voor het zakgeld en open die samen\n• Vier jullie overwinning: leg de schermen weg en speel een spelletje met het gezin, jullie hebben het verdiend\n• En wie de minste XP heeft verdiend, krijgt een troostprijs: ‘iedereen geeft hem een kusje!’"
      opening_master_btn:
        fr: "X Prêt ! Ouvrons le coffre !"
        en: "X Ready! Let's open the chest!"
        es: "X ¡Listo! ¡Abramos el cofre!"
        de: "X Bereit! Öffnen wir die Truhe!"
        it: "X Pronti! Apriamo lo scrigno!"
        pt: "X Prontos! Vamos abrir o baú!"
        br: "X Prontos! Vamos abrir o baú!"
        nl: "X Klaar! Open de kist!"
      opening_player_text:
        fr: "X Le clan s'est bien battu contre la saleté, le désordre et le méchant linge sale. Après une épique bataille, il a vaincu le boss et remporté la victoire — et avec elle... un coffre rempli de pièces et de bijoux !"
        en: "X The clan fought well against filth, chaos and the wicked dirty laundry. After an epic battle, it defeated the boss and won the day — and with it... a chest full of coins and jewels!"
        es: "X El clan luchó bien contra la suciedad, el desorden y la malvada ropa sucia. Tras una batalla épica, venció al jefe final y se llevó la victoria... ¡y con ella un cofre lleno de monedas y joyas!"
        de: "X Der Clan hat tapfer gegen Dreck, Unordnung und die fiese Schmutzwäsche gekämpft. Nach einer epischen Schlacht hat er den Boss besiegt und den Sieg errungen, und mit ihm... eine Truhe voller Münzen und Juwelen!"
        it: "X Il clan ha combattuto bene contro lo sporco, il disordine e il perfido bucato sporco. Dopo un'epica battaglia ha sconfitto il boss e conquistato la vittoria, e con essa... uno scrigno pieno di monete e gioielli!"
        pt: "X O clã lutou bem contra a sujidade, a desarrumação e a malvada roupa suja. Depois de uma batalha épica, derrotou o boss e conquistou a vitória, e com ela... um baú cheio de moedas e joias!"
        br: "X O clã lutou bem contra a sujeira, a bagunça e a malvada roupa suja. Depois de uma batalha épica, derrotou o boss e conquistou a vitória, e com ela... um baú cheio de moedas e joias!"
        nl: "X De clan heeft dapper gevochten tegen vuil, rommel en de gemene vuile was. Na een epische strijd versloeg hij de boss en behaalde de overwinning, en daarmee... een kist vol munten en juwelen!"
      opening_player_btn:

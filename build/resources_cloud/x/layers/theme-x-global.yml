      inspire_player_fallback_5_desc:
        fr: "X Ne recule devant aucune corvée, même la plus redoutable. Le linge sale tremble à son approche."
        en: "X Never backs down from a chore, not even the most fearsome. Dirty laundry trembles at their approach."
        es: "X No retrocede ante ninguna tarea, ni siquiera la más temible. La ropa sucia tiembla a su paso."
        de: "X Weicht vor keiner Pflicht zurück, nicht einmal vor der gefürchtetsten. Die Schmutzwäsche zittert, wenn sie naht."
        it: "X Non si tira indietro davanti a nessuna faccenda, nemmeno la più temibile. I panni sporchi tremano al suo arrivo."
        pt: "X Não recua perante nenhuma tarefa, nem a mais temível. A roupa suja treme quando se aproxima."
        br: "X Não recua diante de nenhuma tarefa, nem da mais temível. A roupa suja treme quando se aproxima."
        nl: "X Deinst voor geen enkel klusje terug, zelfs niet voor het engste. De vuile was beeft bij elke stap."

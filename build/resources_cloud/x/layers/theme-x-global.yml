        pt: "X Nada fica guardado enquanto não iniciares sessão: se fechares o jogo agora, vais recomeçar do início. Se um dos pais supervisiona a tua conta Google (Family Link), terá de autorizar o início de sessão."
        br: "X Nada é salvo enquanto você não fizer login: se fechar o jogo agora, vai recomeçar do início. Se um dos pais supervisiona sua conta Google (Family Link), ele vai precisar autorizar o login."

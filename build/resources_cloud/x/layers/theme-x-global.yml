      inspire_player_fallback_1_desc:
        fr: "X Calme, patient, et redoutablement organisé. Là où les autres foncent, il range — et il gagne."
        en: "X Calm, patient, and formidably organised. Where others charge in, they tidy up, and they win."
        es: "X Tranquilo, paciente y temiblemente organizado. Donde otros se lanzan, ordena, y gana."
        de: "X Ruhig, geduldig und furchtbar gut organisiert. Wo andere losstürmen, wird erst mal aufgeräumt, und dann gewonnen."
        it: "X Calmo, paziente e tremendamente organizzato. Dove gli altri si lanciano, mette in ordine, e vince."
        pt: "X Calmo, paciente e temivelmente organizado. Onde os outros se atiram de cabeça, arruma, e ganha."
        br: "X Calmo, paciente e assustadoramente organizado. Onde os outros se jogam de cabeça, ele arruma, e vence."
        nl: "X Rustig, geduldig en angstaanjagend georganiseerd. Waar anderen erop af stormen, wordt er opgeruimd, en gewonnen."

      butin_money_warning:
        fr: "X Attention : c'est une promesse d'argent RÉEL, à distribuer entre les joueurs le jour où le butin sera ouvert. Prévois une tirelire ou un vrai coffre où déposer cet argent au fur et à mesure : le jour de l'ouverture, la distribution sera immédiate."
        en: "X Careful: this is a promise of REAL money, to be shared among the players on the day the loot is opened. Keep a piggy bank or a real chest and put the money in as you go: on opening day, sharing it out will be immediate."
        es: "X Atención: es una promesa de dinero REAL, para repartir entre los jugadores el día en que se abra el botín. Ten una hucha o un cofre de verdad donde ir metiendo ese dinero: el día de la apertura, el reparto será inmediato."
        de: "X Achtung: Das ist ein Versprechen von ECHTEM Geld, das am Tag der Beute-Öffnung unter den Spielern aufgeteilt wird. Leg dir ein Sparschwein oder eine echte Truhe zu und steck das Geld nach und nach hinein: Am Tag der Öffnung wird dann sofort verteilt."
        it: "X Attenzione: è una promessa di soldi VERI, da dividere tra i giocatori il giorno in cui si aprirà il bottino. Tieni un salvadanaio o un vero scrigno dove mettere quei soldi man mano: il giorno dell'apertura la distribuzione sarà immediata."
        pt: "X Atenção: é uma promessa de dinheiro A SÉRIO, para repartir entre os jogadores no dia em que o espólio for aberto. Arranja um mealheiro ou um baú verdadeiro onde ir pondo esse dinheiro: no dia da abertura, a distribuição será imediata."
        br: "X Atenção: é uma promessa de dinheiro DE VERDADE, para dividir entre os jogadores no dia em que o tesouro for aberto. Arrume um cofrinho ou um baú de verdade para ir guardando esse dinheiro: no dia da abertura, a distribuição será imediata."
        nl: "X Let op: dit is een belofte van ECHT geld, dat verdeeld wordt onder de spelers op de dag dat de buit opengaat. Zet een spaarpot of een echte kist klaar en stop het geld er gaandeweg in: op de dag van de opening kan het meteen worden uitgedeeld."

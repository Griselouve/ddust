      invite_consent_assent:
        fr: "X Votre enfant a dit qu'il voulait jouer, le {date}. Voici le texte qui lui a été montré :\n\n« {text} »"
        en: "X Your child said they wanted to play, on {date}. Here is the text they were shown:\n\n“{text}”"
        es: "X Tu hijo dijo que quería jugar, el {date}. Este es el texto que se le mostró:\n\n«{text}»"
        de: "X Dein Kind hat am {date} gesagt, dass es spielen möchte. Dieser Text wurde ihm gezeigt:\n\n„{text}“"
        it: "X Tuo figlio ha detto di voler giocare, il {date}. Ecco il testo che gli è stato mostrato:\n\n«{text}»"
        pt: "X O teu filho disse que queria jogar, em {date}. Eis o texto que lhe foi mostrado:\n\n«{text}»"
        br: "X Seu filho disse que queria jogar, em {date}. Este é o texto que foi mostrado a ele:\n\n“{text}”"
        nl: "X Je kind heeft op {date} gezegd dat het wil spelen. Dit is de tekst die het te zien kreeg:\n\n‘{text}’"
      invite_consent_assent_code:
        fr: "X Code de sa demande : [[{code}]]. Vérifiez que c'est le même que sur son écran."
        en: "X Code of their request: [[{code}]]. Check that it is the same as on their screen."
        es: "X Código de su solicitud: [[{code}]]. Comprueba que es el mismo que en su pantalla."
        de: "X Code seiner Anfrage: [[{code}]]. Prüfe, ob er derselbe ist wie auf seinem Bildschirm."
        it: "X Codice della sua richiesta: [[{code}]]. Controlla che sia lo stesso del suo schermo."
        pt: "X Código do pedido: [[{code}]]. Verifica se é o mesmo que aparece no ecrã da criança."
        br: "X Código do pedido: [[{code}]]. Confira se é o mesmo que aparece na tela da criança."
        nl: "X Code van de aanvraag: [[{code}]]. Controleer of het dezelfde is als op het scherm van je kind."
      invite_consent_claim:
        fr: "X Il retrouvera son joueur : [[{name}]]."
        en: "X They will get back their player: [[{name}]]."
        es: "X Recuperará su jugador: [[{name}]]."
        de: "X Es bekommt seinen Spieler zurück: [[{name}]]."
        it: "X Ritroverà il suo giocatore: [[{name}]]."
        pt: "X Vai recuperar o seu jogador: [[{name}]]."
        br: "X Vai recuperar o seu jogador: [[{name}]]."
        nl: "X Het krijgt zijn speler terug: [[{name}]]."
      claim_pick_hint:
        fr: "X Cet enfant jouait-il déjà sur votre téléphone ? Choisissez son joueur : il le retrouvera sur son propre téléphone, avec son expérience, ses objets et son histoire. Sinon, choisissez « C'est un nouveau joueur »."
        en: "X Was this child already playing on your phone? Choose their player: they will find it on their own phone, with their experience, items and story. Otherwise, choose “This is a new player”."
        es: "X ¿Este niño ya jugaba en tu teléfono? Elige su jugador: lo encontrará en su propio teléfono, con su experiencia, sus objetos y su historia. Si no, elige «Es un jugador nuevo»."
        de: "X Hat dieses Kind schon auf deinem Handy gespielt? Wähle seinen Spieler: Es findet ihn auf seinem eigenen Handy wieder, mit seiner Erfahrung, seinen Gegenständen und seiner Geschichte. Sonst wähle „Das ist ein neuer Spieler“."
        it: "X Questo bambino giocava già sul tuo telefono? Scegli il suo giocatore: lo ritroverà sul suo telefono, con la sua esperienza, i suoi oggetti e la sua storia. Altrimenti, scegli «È un nuovo giocatore»."
        pt: "X Esta criança já jogava no teu telemóvel? Escolhe o jogador dela: vai encontrá-lo no seu próprio telemóvel, com a experiência, os objetos e a história. Se não, escolhe «É um jogador novo»."
        br: "X Essa criança já jogava no seu celular? Escolha o jogador dela: ela vai encontrá-lo no próprio celular, com a experiência, os objetos e a história. Se não, escolha “É um jogador novo”."
        nl: "X Speelde dit kind al op jouw telefoon? Kies zijn speler: het vindt hem terug op zijn eigen telefoon, met zijn ervaring, voorwerpen en verhaal. Zo niet, kies dan ‘Dit is een nieuwe speler’."
      claim_pick_new:
        fr: "X C'est un nouveau joueur"
        en: "X This is a new player"
        es: "X Es un jugador nuevo"
        de: "X Das ist ein neuer Spieler"
        it: "X È un nuovo giocatore"
        pt: "X É um jogador novo"
        br: "X É um jogador novo"
        nl: "X Dit is een nieuwe speler"
      invite_consent_child_hint:
        fr: "X Pour inviter un enfant, c'est lui qui commence : il installe le jeu et dit qu'il veut jouer. Scannez ensuite le QR code qu'il affiche avec « Accueillir un enfant », dans le menu du clan. Ici, vous invitez un adulte."
        en: "X To invite a child, they go first: they install the game and say they want to play. Then scan the QR code they display with “Welcome a child”, in the clan menu. Here, you are inviting an adult."
        es: "X Para invitar a un niño, empieza él: instala el juego y dice que quiere jugar. Después escanea el código QR que muestra con «Acoger a un niño», en el menú del clan. Aquí invitas a un adulto."
        de: "X Um ein Kind einzuladen, fängt es selbst an: Es installiert das Spiel und sagt, dass es spielen will. Scanne danach den QR-Code, den es anzeigt, mit „Ein Kind aufnehmen“ im Clan-Menü. Hier lädst du einen Erwachsenen ein."
        it: "X Per invitare un bambino, comincia lui: installa il gioco e dice che vuole giocare. Poi scansiona il codice QR che mostra con «Accogli un bambino», nel menu del clan. Qui inviti un adulto."
        pt: "X Para convidar uma criança, é ela que começa: instala o jogo e diz que quer jogar. Depois digitaliza o código QR que ela mostra com «Acolher uma criança», no menu do clã. Aqui, convidas um adulto."
        br: "X Para convidar uma criança, é ela quem começa: instala o jogo e diz que quer jogar. Depois, escaneie o QR Code que ela mostra com “Acolher uma criança”, no menu do clã. Aqui, você está convidando um adulto."
        nl: "X Om een kind uit te nodigen, begint het zelf: het installeert het spel en zegt dat het wil spelen. Scan daarna de QR-code die het toont met ‘Een kind verwelkomen’ in het clanmenu. Hier nodig je een volwassene uit."
      invite_consent_not_assent:
        fr: "X Ce QR code n'est pas une demande d'enfant. Pour accueillir un enfant, scannez le QR code que son téléphone affiche après qu'il a dit oui. Ici, seul un adulte peut être invité."
        en: "X This QR code is not a child's request. To welcome a child, scan the QR code their phone displays after they have said yes. Here, only an adult can be invited."
        es: "X Este código QR no es una solicitud de un niño. Para acoger a un niño, escanea el código QR que muestra su teléfono después de que haya dicho que sí. Aquí solo se puede invitar a un adulto."
        de: "X Dieser QR-Code ist keine Anfrage eines Kindes. Um ein Kind aufzunehmen, scanne den QR-Code, den sein Handy anzeigt, nachdem es Ja gesagt hat. Hier kann nur ein Erwachsener eingeladen werden."
        it: "X Questo codice QR non è una richiesta di un bambino. Per accogliere un bambino, scansiona il codice QR che il suo telefono mostra dopo che ha detto di sì. Qui si può invitare solo un adulto."
        pt: "X Este código QR não é um pedido de uma criança. Para acolher uma criança, digitaliza o código QR que o telemóvel dela mostra depois de ela dizer que sim. Aqui, só um adulto pode ser convidado."
        br: "X Este QR Code não é um pedido de uma criança. Para acolher uma criança, escaneie o QR Code que o celular dela mostra depois que ela disse sim. Aqui, só um adulto pode ser convidado."

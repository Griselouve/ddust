      decisiontree_intro:
        fr: "X L'aubergiste a besoin de quelques infos pour préparer ta quête...\n\nCe qui se dit à la taverne reste à la taverne : tes réponses ne sont pas enregistrées, mais elles servent à améliorer ton aventure.\nTu ne le feras qu'une fois!"
        en: "X The innkeeper needs a few details to prepare your quest...\n\nWhat happens in the tavern stays in the tavern: your answers aren't recorded, but they help to improve your adventure\nYou'll do only one time!"
        es: "X El tabernero necesita algunos detalles para preparar tu misión...\n\nLo que pasa en la taberna, se queda en la taberna: tus respuestas no se guardan, pero ayudan a mejorar tu aventura\nLo haras solamente una vez!"
        de: "X Der Wirt braucht ein paar Angaben, um deine Quest vorzubereiten...\n\nWas in der Taverne gesagt wird, bleibt in der Taverne: Deine Antworten werden nicht gespeichert, aber sie helfen, dein Abenteuer zu verbessern.\nDu machst das nur ein einziges Mal!"
        it: "X L'oste ha bisogno di qualche informazione per preparare la tua missione...\n\nCiò che si dice in taverna resta in taverna: le tue risposte non vengono salvate, ma servono a migliorare la tua avventura.\nLo farai una volta sola!"
        pt: "X O estalajadeiro precisa de algumas informações para preparar a tua demanda...\n\nO que se diz na taberna fica na taberna: as tuas respostas não são guardadas, mas servem para melhorar a tua aventura.\nSó o farás uma vez!"
        br: "X O taverneiro precisa de algumas informações para preparar sua missão...\n\nO que se diz na taverna fica na taverna: suas respostas não são salvas, mas servem para melhorar sua aventura.\nVocê só vai fazer isso uma vez!"
        nl: "X De waard heeft wat informatie nodig om je queeste voor te bereiden...\n\nWat in de taverne gezegd wordt, blijft in de taverne: je antwoorden worden niet opgeslagen, maar ze helpen om je avontuur te verbeteren.\nJe doet dit maar één keer!"

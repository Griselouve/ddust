        br: "X Jogo Donjons & Savons em família: as tarefas de casa viram missões. Venha para a aventura!"
        nl: "X Ik speel Donjons & Savons met het gezin: huishoudelijke klusjes worden queestes. Doe mee met het avontuur!"

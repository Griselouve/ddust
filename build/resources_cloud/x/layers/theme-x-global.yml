      inspire_player_fallback_7_desc:
        fr: "X Discrétion absolue, efficacité redoutable. Personne ne l'entend arriver, mais la cuisine brille après son passage."
        en: "X Utterly discreet, fearsomely efficient. Nobody hears them coming, but the kitchen shines once they have passed."

      inspire_player_fallback_2_desc:
        fr: "X Petit par la taille, immense par le courage. Aucun monstre de poussière ne l'a jamais vu reculer."
        en: "X Small in size, immense in courage. No dust monster has ever seen them back down."
        es: "X Pequeño de tamaño, inmenso de valor. Ningún monstruo de polvo lo ha visto retroceder."
        de: "X Klein an Größe, riesig an Mut. Noch kein Staubmonster hat hier je jemanden zurückweichen sehen."
        it: "X Piccolo di statura, immenso di coraggio. Nessun mostro di polvere l'ha mai visto indietreggiare."
        pt: "X Pequeno no tamanho, imenso na coragem. Nenhum monstro de pó alguma vez o viu recuar."
        br: "X Pequeno no tamanho, imenso na coragem. Nenhum monstro de poeira jamais o viu recuar."
        nl: "X Klein van stuk, reusachtig van moed. Nog nooit heeft een stofmonster hier iemand zien terugdeinzen."

        fr: "X Si tu invites un enfant, préviens son parent : pour entrer, l'enfant se connectera avec son compte Google, et un compte surveillé par Family Link demande l'accord d'un parent."
        en: "X If you are inviting a child, warn their parent: to get in, the child signs in with their Google account, and an account supervised by Family Link needs a parent's approval."
        es: "X Si invitas a un niño, avisa a su padre o madre: para entrar, el niño se conectará con su cuenta de Google, y una cuenta supervisada por Family Link necesita la aprobación de un adulto."
        de: "X Wenn du ein Kind einlädst, sag seinen Eltern Bescheid: Zum Beitreten meldet sich das Kind mit seinem Google-Konto an, und ein von Family Link beaufsichtigtes Konto braucht die Zustimmung eines Elternteils."
        it: "X Se inviti un bambino, avvisa un suo genitore: per entrare il bambino accederà con il suo account Google, e un account controllato da Family Link richiede l'approvazione di un genitore."
        pt: "X Se convidares uma criança, avisa os pais dela: para entrar, a criança vai iniciar sessão com a sua conta Google, e uma conta supervisionada pelo Family Link precisa da autorização de um dos pais."
        br: "X Se você convidar uma criança, avise os pais dela: para entrar no clã, a criança vai fazer login com a conta Google dela, e uma conta supervisionada pelo Family Link precisa da autorização de um dos pais."
        nl: "X Als je een kind uitnodigt, waarschuw dan een ouder: om erbij te komen logt het kind in met zijn Google-account, en een account onder toezicht van Family Link heeft toestemming van een ouder nodig."

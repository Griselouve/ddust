      share_clan_invite_text:
        fr: "X Rejoins mon clan sur Donjons & Savons ! On transforme les corvées de la maison en monstres à abattre : chaque tâche accomplie rapporte de l'XP, et quand le coffre du clan est plein, on ouvre le butin."
        en: "X Join my clan on Donjons & Savons! We turn household chores into monsters to defeat: every task earns XP, and when the clan chest is full we open the loot."
        es: "X ¡Únete a mi clan en Donjons & Savons! Convertimos las tareas de casa en monstruos que derrotar: cada tarea da XP, y cuando el cofre del clan está lleno abrimos el botín."
        de: "X Tritt meinem Clan in Donjons & Savons bei! Wir verwandeln die Hausarbeiten in Monster, die besiegt werden müssen: Jede erledigte Aufgabe bringt XP, und wenn die Clantruhe voll ist, öffnen wir die Beute."
        it: "X Unisciti al mio clan su Donjons & Savons! Trasformiamo le faccende di casa in mostri da sconfiggere: ogni compito svolto fa guadagnare XP, e quando lo scrigno del clan è pieno apriamo il bottino."
        pt: "X Junta-te ao meu clã no Donjons & Savons! Transformamos as tarefas da casa em monstros para derrotar: cada tarefa cumprida dá XP, e quando o baú do clã está cheio, abrimos o espólio."
        br: "X Entre no meu clã no Donjons & Savons! Transformamos as tarefas de casa em monstros para derrotar: cada tarefa cumprida dá XP, e quando o baú do clã fica cheio, abrimos o tesouro."
        nl: "X Word lid van mijn clan in Donjons & Savons! We maken van de klusjes in huis monsters om te verslaan: elke voltooide taak levert XP op, en als de clankist vol is, openen we de buit."

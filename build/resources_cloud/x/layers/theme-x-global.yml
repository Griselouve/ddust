      butin_note_hint:
        fr: "X Cette note sera lue par tout le clan à l'ouverture du coffre. Personne ne la voit avant, pas même les autres chefs de clan. C'est l'endroit rêvé pour une annonce ou une surprise : « on va tous à un super parc d'attractions, vous l'avez mérité »."
        en: "X This note will be read by the whole clan when the chest is opened. Nobody sees it before then, not even the other clan chiefs. It's the perfect place for an announcement or a surprise: “we're all going to an amazing amusement park, you've earned it.”"
        es: "X Esta nota será leída por todo el clan al abrir el cofre. Nadie la ve antes, ni siquiera los demás jefes de clan. Es el lugar perfecto para un anuncio o una sorpresa: «vamos todos a un parque de atracciones increíble, os lo habéis ganado»."
        de: "X Diese Notiz wird vom ganzen Clan gelesen, wenn die Truhe geöffnet wird. Vorher sieht sie niemand, nicht einmal die anderen Clanchefs. Der perfekte Ort für eine Ankündigung oder eine Überraschung: „Wir fahren alle in einen super Freizeitpark, ihr habt es euch verdient.“"
        it: "X Questo biglietto sarà letto da tutto il clan all'apertura dello scrigno. Nessuno lo vede prima, nemmeno gli altri capi clan. È il posto perfetto per un annuncio o una sorpresa: «andiamo tutti in un fantastico parco divertimenti, ve lo siete meritato»."
        pt: "X Esta nota será lida pelo clã inteiro quando o baú for aberto. Ninguém a vê antes, nem sequer os outros chefes de clã. É o sítio ideal para um anúncio ou uma surpresa: «vamos todos a um parque de diversões espetacular, vocês merecem»."
        br: "X Esta nota será lida pelo clã inteiro quando o baú for aberto. Ninguém a vê antes, nem mesmo os outros chefes de clã. É o lugar ideal para um anúncio ou uma surpresa: \"vamos todos a um parque de diversões incrível, vocês merecem\"."
        nl: "X Dit briefje wordt door de hele clan gelezen als de kist opengaat. Niemand ziet het eerder, zelfs de andere clanhoofden niet. De perfecte plek voor een aankondiging of een verrassing: ‘we gaan allemaal naar een supergaaf pretpark, jullie hebben het verdiend’."

      share_clan_invite_pin_text:
        fr: "X Rejoins mon clan sur Donjons & Savons ! On transforme les corvées de la maison en monstres à abattre. Il te faudra le code à 6 chiffres que je t'ai donné de vive voix."
        en: "X Join my clan on Donjons & Savons! We turn household chores into monsters to defeat. You will need the 6-digit code I read out to you."
        es: "X ¡Únete a mi clan en Donjons & Savons! Convertimos las tareas de casa en monstruos que derrotar. Necesitarás el código de 6 cifras que te dicté."
        de: "X Tritt meinem Clan in Donjons & Savons bei! Wir verwandeln die Hausarbeiten in Monster, die besiegt werden müssen. Du brauchst den 6-stelligen Code, den ich dir mündlich gesagt habe."
        it: "X Unisciti al mio clan su Donjons & Savons! Trasformiamo le faccende di casa in mostri da sconfiggere. Ti servirà il codice a 6 cifre che ti ho detto a voce."
        pt: "X Junta-te ao meu clã no Donjons & Savons! Transformamos as tarefas da casa em monstros para derrotar. Vais precisar do código de 6 algarismos que te disse de viva voz."
        br: "X Entre no meu clã no Donjons & Savons! Transformamos as tarefas de casa em monstros para derrotar. Você vai precisar do código de 6 dígitos que eu falei para você em voz alta."
        nl: "X Word lid van mijn clan in Donjons & Savons! We maken van de klusjes in huis monsters om te verslaan. Je hebt de 6-cijferige code nodig die ik je heb verteld."

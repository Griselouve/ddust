      consent_withdraw_warn:
        fr: "X Vous retirez votre consentement pour {name}.\nIl quitte le jeu immédiatement.\nPendant 3 jours, un chef de son clan d'origine peut revenir sur cette décision. Passé ce délai, ses données de jeu sont supprimées.\nLa preuve de votre consentement n'est pas effacée : elle est close et datée.\nCela ne l'empêche pas d'être invité un jour dans un autre clan, par un adulte qui en répondra."
        en: "X You are withdrawing your consent for {name}.\nThey leave the game immediately.\nFor 3 days, a chief of their clan of origin may reverse this decision. After that, their game data is deleted.\nThe proof of your consent is not erased: it is closed and dated.\nThis does not prevent them from one day being invited into another clan, by an adult who answers for them."
        es: "X Retiras tu consentimiento para {name}.\nSale del juego de inmediato.\nDurante 3 días, un jefe de su clan de origen puede revocar esta decisión. Pasado ese plazo, sus datos de juego se eliminan.\nLa prueba de tu consentimiento no se borra: queda cerrada y fechada.\nEsto no impide que algún día se le invite a otro clan, por un adulto que responda por él."
        de: "X Du widerrufst deine Einwilligung für {name}.\nDas Kind verlässt das Spiel sofort.\n3 Tage lang kann ein Chef seines Ursprungsclans diese Entscheidung rückgängig machen. Danach werden seine Spieldaten gelöscht.\nDer Nachweis deiner Einwilligung wird nicht gelöscht: Er wird abgeschlossen und datiert.\nDas hindert das Kind nicht daran, eines Tages in einen anderen Clan eingeladen zu werden, von einem Erwachsenen, der dann für es einsteht."
        it: "X Stai revocando il tuo consenso per {name}.\nLascia subito il gioco.\nPer 3 giorni, un capo del suo clan d'origine può annullare questa decisione. Trascorso questo termine, i suoi dati di gioco vengono eliminati.\nLa prova del tuo consenso non viene cancellata: viene chiusa e datata.\nQuesto non gli impedisce di essere invitato un giorno in un altro clan, da un adulto che ne risponderà."
        pt: "X Estás a retirar o teu consentimento para {name}.\nSai do jogo de imediato.\nDurante 3 dias, um chefe do seu clã de origem pode reverter esta decisão. Findo esse prazo, os seus dados de jogo são eliminados.\nA prova do teu consentimento não é apagada: fica encerrada e datada.\nIsto não impede que um dia seja convidado para outro clã, por um adulto que responda por ele."
        br: "X Você está retirando seu consentimento para {name}.\nEle sai do jogo imediatamente.\nDurante 3 dias, um chefe do clã de origem dele pode reverter essa decisão. Depois desse prazo, os dados de jogo dele são excluídos.\nA prova do seu consentimento não é apagada: fica arquivada e datada.\nIsso não impede que um dia ele seja convidado para outro clã, por um adulto que responda por ele."
        nl: "X Je trekt je toestemming voor {name} in.\nHet kind verlaat het spel meteen.\nGedurende 3 dagen kan een hoofd van de oorspronkelijke clan dit besluit terugdraaien. Daarna worden de spelgegevens verwijderd.\nHet bewijs van je toestemming wordt niet gewist: het wordt afgesloten en gedateerd.\nDit belet niet dat het kind ooit in een andere clan wordt uitgenodigd, door een volwassene die ervoor instaat."

      player_title_19:
        fr: "X Sa Splendeur l'Immaculé, Empereur Éternel de la Maison du Plumeau d'Or, Suzerain des Éviers-Hauts et des Basses-Vaisselles, Vainqueur du Tartre Millénaire et Briseur de Moisissures, Grand Khan des Plaines de Linge et des Steppes du Repassage, Celui-dont-le-Reflet-se-Mire-dans-Chaque-Carreau, Premier et Dernier Rempart contre le Chaos Poussiéreux, Protecteur du Foyer jusqu'à la Dernière Lessive"
        en: "X His Splendour the Immaculate, Eternal Emperor of the House of the Golden Feather-Duster, Suzerain of the High Sinks and the Low Dishes, Vanquisher of the Thousand-Year Limescale and Breaker of Moulds, Great Khan of the Plains of Laundry and the Steppes of Ironing, He-Whose-Reflection-Shines-in-Every-Tile, First and Last Bulwark against the Dusty Chaos, Protector of the Home unto the Last Wash"
        es: "X Su Esplendor el Inmaculado, Emperador Eterno de la Casa del Plumero de Oro, Soberano de los Fregaderos Altos y las Vajillas Bajas, Vencedor de la Cal Milenaria y Quebrantador de Mohos, Gran Kan de las Llanuras de Ropa y las Estepas del Planchado, Aquel-cuyo-Reflejo-se-Mira-en-Cada-Baldosa, Primer y Último Baluarte contra el Caos Polvoriento, Protector del Hogar hasta la Última Colada"
        de: "X Seine Pracht der Makellose, Ewiger Kaiser des Hauses vom Goldenen Staubwedel, Lehnsherr der Hohen Spülbecken und des Niederen Geschirrs, Bezwinger des Tausendjährigen Kalks und Brecher der Schimmelpilze, Großkhan der Wäscheebenen und der Bügelsteppen, Der-dessen-Spiegelbild-in-jeder-Fliese-glänzt, Erstes und Letztes Bollwerk gegen das Staubige Chaos, Beschützer des Heims bis zur Letzten Wäsche"
        it: "X Sua Splendidezza l'Immacolato, Imperatore Eterno della Casata del Piumino d'Oro, Sovrano degli Alti Lavelli e delle Basse Stoviglie, Vincitore del Calcare Millenario e Distruttore di Muffe, Gran Khan delle Pianure del Bucato e delle Steppe della Stiratura, Colui-il-cui-Riflesso-si-Specchia-in-Ogni-Piastrella, Primo e Ultimo Baluardo contro il Caos Polveroso, Protettore del Focolare fino all'Ultimo Bucato"
        pt: "X Sua Esplendência o Imaculado, Imperador Eterno da Casa do Espanador de Ouro, Suserano dos Lava-Loiças Altos e das Loiças Baixas, Vencedor do Calcário Milenar e Quebrador de Bolores, Grande Khan das Planícies de Roupa e das Estepes do Engomar, Aquele-cujo-Reflexo-se-Mira-em-Cada-Azulejo, Primeiro e Último Baluarte contra o Caos Poeirento, Protetor do Lar até à Última Barrela"
        br: "X Sua Esplendência o Imaculado, Imperador Eterno da Casa do Espanador de Ouro, Suserano das Pias Altas e das Louças Baixas, Vencedor do Calcário Milenar e Quebrador de Mofos, Grande Khan das Planícies de Roupa e das Estepes do Ferro de Passar, Aquele-cujo-Reflexo-se-Vê-em-Cada-Azulejo, Primeiro e Último Baluarte contra o Caos Poeirento, Protetor do Lar até a Última Faxina"
        nl: "X Zijne Pracht de Smetteloze, Eeuwige Keizer van het Huis van de Gouden Plumeau, Leenheer van de Hoge Gootstenen en de Lage Vaat, Overwinnaar van de Duizendjarige Kalk en Breker van Schimmels, Grootkan van de Wasvlakten en de Strijksteppen, Hij-wiens-Spiegelbeeld-in-Elke-Tegel-Schittert, Eerste en Laatste Bolwerk tegen de Stoffige Chaos, Beschermer van de Haard tot de Laatste Was"

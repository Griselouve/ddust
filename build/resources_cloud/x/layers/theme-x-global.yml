      inspire_player_fallback_3_desc:
        fr: "X Rapide comme l'éclair. Capable de ranger une chambre entière avant la fin d'une chanson."
        en: "X Quick as lightning. Able to tidy a whole bedroom before the end of a song."
        es: "X Rápido como un rayo. Capaz de ordenar una habitación entera antes de que acabe una canción."
        de: "X Schnell wie der Blitz. Schafft ein ganzes Zimmer, bevor ein Lied zu Ende ist."
        it: "X Veloce come un fulmine. Capace di riordinare un'intera camera prima della fine di una canzone."
        pt: "X Rápido como um relâmpago. Capaz de arrumar um quarto inteiro antes do fim de uma canção."
        br: "X Rápido como um raio. Capaz de arrumar um quarto inteiro antes do fim de uma música."
        nl: "X Snel als de bliksem. Ruimt een hele kamer op voordat een liedje afgelopen is."

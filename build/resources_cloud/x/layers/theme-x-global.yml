      kid_assent_question:
        fr: "X Ici, c'est d'abord à toi qu'on demande.\n\nAs-tu envie de jouer à Donjons & Savons avec ta famille ?\n\nSi tu dis oui, ton téléphone préparera un message pour tes parents. Ce sont eux qui décideront ensuite."
        en: "X Here, we ask you first.\n\nDo you want to play Donjons & Savons with your family?\n\nIf you say yes, your phone will prepare a message for your parents. They will decide after that."
        es: "X Aquí te lo preguntamos primero a ti.\n\n¿Tienes ganas de jugar a Donjons & Savons con tu familia?\n\nSi dices que sí, tu teléfono preparará un mensaje para tus padres. Después, decidirán ellos."
        de: "X Hier fragen wir zuerst dich.\n\nHast du Lust, mit deiner Familie Donjons & Savons zu spielen?\n\nWenn du Ja sagst, bereitet dein Handy eine Nachricht für deine Eltern vor. Danach entscheiden sie."
        it: "X Qui lo chiediamo prima a te.\n\nHai voglia di giocare a Donjons & Savons con la tua famiglia?\n\nSe dici di sì, il tuo telefono preparerà un messaggio per i tuoi genitori. Poi decideranno loro."
        pt: "X Aqui, perguntamos primeiro a ti.\n\nTens vontade de jogar Donjons & Savons com a tua família?\n\nSe disseres que sim, o teu telemóvel vai preparar uma mensagem para os teus pais. Depois, são eles que decidem."
        br: "X Aqui, a pergunta é primeiro para você.\n\nVocê está com vontade de jogar Donjons & Savons com a sua família?\n\nSe disser que sim, seu celular vai preparar uma mensagem para seus pais. Depois, são eles que decidem."
        nl: "X Hier vragen we het eerst aan jou.\n\nHeb je zin om Donjons & Savons te spelen met je familie?\n\nAls je ja zegt, maakt je telefoon een bericht klaar voor je ouders. Daarna beslissen zij."

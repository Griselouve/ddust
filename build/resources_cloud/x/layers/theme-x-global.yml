      substitute_bank_player_descs:
        fr: "X Un aventurier discret, toujours prêt à donner un coup de main.|X Un compagnon de route fiable, que rien ne décourage.|X Un explorateur curieux, qui ne rentre jamais les mains vides."
        en: "X A discreet adventurer, always ready to lend a hand.|X A reliable companion, whom nothing discourages.|X A curious explorer, who never comes home empty-handed."
        es: "X Un aventurero discreto, siempre listo para echar una mano.|X Un compañero de viaje fiable, al que nada desanima.|X Un explorador curioso, que nunca vuelve con las manos vacías."
        de: "X Ein diskreter Abenteurer, immer bereit, mit anzupacken.|X Ein verlässlicher Weggefährte, den nichts entmutigt.|X Ein neugieriger Entdecker, der nie mit leeren Händen heimkehrt."
        it: "X Un avventuriero discreto, sempre pronto a dare una mano.|X Un compagno di viaggio affidabile, che nulla scoraggia.|X Un esploratore curioso, che non torna mai a mani vuote."

        fr: "X Des traces de doigts et de la crasse maculent les portes. Nettoie-les jusqu'à des battants nets."
        en: "X Fingerprints and grime stain the doors. Clean them until the panels are spotless."
        es: "X Huellas y mugre manchan las puertas. Límpialas hasta dejar las hojas impecables."
        de: "X Fingerabdrücke und Dreck verschmieren die Türen. Putz sie, bis sie wieder sauber sind."
        it: "X Impronte di dita e sporco macchiano le porte. Puliscile finché sono impeccabili."
        pt: "X Dedadas e sujidade mancham as portas. Limpa-as até ficarem impecáveis."
        br: "X Marcas de dedos e sujeira mancham as portas. Limpe até ficarem impecáveis."
        nl: "X Vingerafdrukken en vuil besmeuren de deuren. Maak ze schoon tot ze weer smetteloos zijn."
      dt_d_extras_06:
        fr: "X @@@session.user.name@@@ vient d'effacer les traces des portes !"
        en: "X @@@session.user.name@@@ has just wiped the marks off the doors!"
        es: "X ¡@@@session.user.name@@@ acaba de borrar las marcas de las puertas!"
        de: "X @@@session.user.name@@@ hat gerade die Spuren von den Türen gewischt!"
        it: "X @@@session.user.name@@@ ha appena cancellato le impronte dalle porte!"
        pt: "X @@@session.user.name@@@ acabou de apagar as marcas das portas!"
        br: "X @@@session.user.name@@@ acabou de apagar as marcas das portas!"
        nl: "X @@@session.user.name@@@ heeft zojuist de sporen van de deuren geveegd!"
      dt_c_extras_06:
        fr: "X @@@session.user.name@@@ a bataillé pour nettoyer les portes, mais un dragon est passé par là au mauvais moment !"
        en: "X @@@session.user.name@@@ battled away at cleaning the doors, but a dragon flew past at the worst moment!"
        es: "X ¡@@@session.user.name@@@ batalló para limpiar las puertas, pero pasó un dragón en el peor momento!"
        de: "X @@@session.user.name@@@ hat sich abgemüht, die Türen zu putzen, aber im dümmsten Moment kam ein Drache vorbei!"
        it: "X @@@session.user.name@@@ ha lottato per pulire le porte, ma un drago è passato proprio nel momento peggiore!"
        pt: "X @@@session.user.name@@@ batalhou para limpar as portas, mas passou um dragão no pior momento!"
        br: "X @@@session.user.name@@@ batalhou para limpar as portas, mas passou um dragão na pior hora!"
        nl: "X @@@session.user.name@@@ heeft gezwoegd om de deuren schoon te maken, maar op het slechtste moment kwam er een draak langs!"
      dt_t_extras_07:
        fr: "X Aérer la maison"
        en: "X Air out the house"
        es: "X Ventilar la casa"
        de: "X Haus lüften"
        it: "X Arieggiare la casa"
        pt: "X Arejar a casa"
        br: "X Arejar a casa"
        nl: "X Het huis luchten"
      dt_a_extras_07:
        fr: "X L'air vicié et les miasmes stagnent dans les pièces. Aère pour chasser l'air corrompu."
        en: "X Stale air and miasmas stagnate in the rooms. Air them out to drive off the corrupted air."
        es: "X El aire viciado y los miasmas se estancan en las habitaciones. Ventila para expulsar el aire corrompido."
        de: "X Verbrauchte Luft und üble Dünste hängen in den Zimmern. Lüfte, um die verdorbene Luft zu vertreiben."
        it: "X Aria viziata e miasmi ristagnano nelle stanze. Arieggia per scacciare l'aria corrotta."
        pt: "X O ar viciado e os miasmas estagnam nas divisões. Areja para expulsar o ar corrompido."
        br: "X O ar abafado e os miasmas estagnam nos cômodos. Abra as janelas para expulsar o ar corrompido."
        nl: "X Muffe lucht en vieze dampen blijven in de kamers hangen. Lucht ze om de bedorven lucht te verdrijven."
      dt_d_extras_07:
        fr: "X @@@session.user.name@@@ vient de chasser l'air vicié des pièces !"
        en: "X @@@session.user.name@@@ has just driven the stale air from the rooms!"
        es: "X ¡@@@session.user.name@@@ acaba de expulsar el aire viciado de las habitaciones!"
        de: "X @@@session.user.name@@@ hat gerade die verbrauchte Luft aus den Zimmern vertrieben!"
        it: "X @@@session.user.name@@@ ha appena scacciato l'aria viziata dalle stanze!"
        pt: "X @@@session.user.name@@@ acabou de expulsar o ar viciado das divisões!"
        br: "X @@@session.user.name@@@ acabou de expulsar o ar abafado dos cômodos!"
        nl: "X @@@session.user.name@@@ heeft zojuist de muffe lucht uit de kamers verdreven!"
      dt_c_extras_07:
        fr: "X @@@session.user.name@@@ a retroussé ses manches pour aérer les pièces, mais la tâche a tenu bon cette fois !"
        en: "X @@@session.user.name@@@ rolled up both sleeves for airing out the rooms, but the task held out this time!"
        es: "X ¡@@@session.user.name@@@ se remangó para ventilar las habitaciones, pero la tarea aguantó esta vez!"
        de: "X @@@session.user.name@@@ hat die Ärmel hochgekrempelt, um die Zimmer zu lüften, aber die Aufgabe hat diesmal standgehalten!"
        it: "X @@@session.user.name@@@ ha tirato su le maniche per arieggiare le stanze, ma la faccenda ha resistito, stavolta!"
        pt: "X @@@session.user.name@@@ arregaçou as mangas para arejar as divisões, mas a tarefa resistiu desta vez!"
        br: "X @@@session.user.name@@@ arregaçou as mangas para arejar os cômodos, mas a tarefa resistiu desta vez!"
        nl: "X @@@session.user.name@@@ heeft de mouwen opgestroopt om de kamers te luchten, maar de taak hield deze keer stand!"
      dt_t_extras_08:
        fr: "X Rendre un service"
        en: "X Do a favour"
        es: "X Hacer un favor"
        de: "X Einen Gefallen tun"
        it: "X Fare un favore"
        pt: "X Fazer um favor"
        br: "X Fazer um favor"
        nl: "X Iemand een plezier doen"
      dt_a_extras_08:
        fr: "X Quelqu'un de ta famille est dans l'embarras et guette ton aide. Rends-lui le service qu'il attend avant que la détresse ne s'installe."
        en: "X Someone in your family is in a bind and awaits your help. Do them the favour they need before the distress sets in."
        es: "X Alguien de tu familia está en apuros y espera tu ayuda. Hazle el favor que necesita antes de que se instale la angustia."
        de: "X Jemand aus deiner Familie steckt in der Klemme und hofft auf deine Hilfe. Tu ihm den Gefallen, bevor die Not zu groß wird."
        it: "X Qualcuno della tua famiglia è in difficoltà e aspetta il tuo aiuto. Fagli il favore che gli serve prima che l'angoscia prenda il sopravvento."
        pt: "X Alguém da tua família está em apuros e espera a tua ajuda. Faz-lhe o favor de que precisa antes que a aflição se instale."
        br: "X Alguém da sua família está em apuros e espera sua ajuda. Faça o favor de que ele precisa antes que a aflição se instale."
        nl: "X Iemand uit je gezin zit in de knel en wacht op je hulp. Doe diegene het plezier dat nodig is voordat de nood toeslaat."
      dt_d_extras_08:
        fr: "X @@@session.user.name@@@ vient de rendre le service attendu !"
        en: "X @@@session.user.name@@@ has just done the awaited favour!"
        es: "X ¡@@@session.user.name@@@ acaba de hacer el favor esperado!"
        de: "X @@@session.user.name@@@ hat gerade den erhofften Gefallen getan!"
        it: "X @@@session.user.name@@@ ha appena fatto il favore atteso!"
        pt: "X @@@session.user.name@@@ acabou de fazer o favor esperado!"
        br: "X @@@session.user.name@@@ acabou de fazer o favor esperado!"
        nl: "X @@@session.user.name@@@ heeft zojuist het verwachte plezier gedaan!"
      dt_c_extras_08:
        fr: "X @@@session.user.name@@@ a bataillé pour rendre le service, mais l'aventure demandera un second passage !"
        en: "X @@@session.user.name@@@ battled away at doing the favour, but the adventure will need a second run!"
        es: "X ¡@@@session.user.name@@@ batalló para hacer el favor, pero la aventura pedirá una segunda vuelta!"
        de: "X @@@session.user.name@@@ hat sich abgemüht, den Gefallen zu tun, aber das Abenteuer braucht eine zweite Runde!"
        it: "X @@@session.user.name@@@ ha lottato per fare il favore, ma l'avventura richiederà un secondo giro!"
        pt: "X @@@session.user.name@@@ batalhou para fazer o favor, mas a aventura vai pedir uma segunda volta!"
        br: "X @@@session.user.name@@@ batalhou para fazer o favor, mas a aventura vai pedir uma segunda rodada!"
        nl: "X @@@session.user.name@@@ heeft gezwoegd om iemand een plezier te doen, maar het avontuur vraagt om een tweede ronde!"

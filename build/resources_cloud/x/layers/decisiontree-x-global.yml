        de: "X Ein verstopfter Filter-Golem bremst die Spülmaschine. Reinige den Filter und lass ein Programm leer laufen, bis das Gerät wieder frisch ist."
        it: "X Un golem del filtro intasato rallenta la lavastoviglie. Pulisci il filtro e avvia un lavaggio a vuoto finché la macchina non è sana."
        pt: "X Um golem do filtro entupido abranda a máquina da loiça. Limpa o filtro e liga um programa em vazio até a máquina ficar saudável."
        br: "X Um golem do filtro entupido deixa a lava-louças lenta. Limpe o filtro e ligue um ciclo vazio até a máquina ficar saudável."
        nl: "X Een verstopte filtergolem vertraagt de vaatwasser. Maak het filter schoon en laat een leeg programma draaien tot het apparaat weer fris is."

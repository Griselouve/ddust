        de: "X Das saubere, trockene Geschirr stapelt sich wackelig auf dem Abtropfgestell. Räum jedes Teil in die Schränke, bis die Arbeitsplatte frei ist."
        it: "X Le stoviglie pulite e asciutte si ammucchiano in una pila traballante sullo scolapiatti. Riponi ogni pezzo nei pensili finché il piano di lavoro non è libero."

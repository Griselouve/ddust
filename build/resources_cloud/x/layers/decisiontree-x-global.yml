        it: "X @@@session.user.name@@@ ha appena eliminato i blob-spazzatura della casa!"
        pt: "X @@@session.user.name@@@ acabou de eliminar os blobs de lixo da casa!"
        br: "X @@@session.user.name@@@ acabou de eliminar os blobs de lixo da casa!"
        nl: "X @@@session.user.name@@@ heeft zojuist de afvalblobs uit het huis verjaagd!"

      dt_a_vaisselle_07:
        fr: "X Le festin approche et la table est nue. Dresse-la complètement : couverts, assiettes et verres pour chaque convive."
        en: "X The feast is coming and the table is bare. Set it fully: cutlery, plates and glasses for every guest."
        es: "X El festín se acerca y la mesa está desnuda. Ponla por completo: cubiertos, platos y vasos para cada comensal."
        de: "X Das Festmahl naht und der Tisch ist leer. Deck ihn komplett: Besteck, Teller und Gläser für jeden Gast."
        it: "X Il banchetto si avvicina e la tavola è vuota. Apparecchiala per bene: posate, piatti e bicchieri per ogni commensale."
        pt: "X O festim aproxima-se e a mesa está vazia. Põe-na por completo: talheres, pratos e copos para cada conviva."
        br: "X O banquete está chegando e a mesa está vazia. Arrume a mesa por completo: talheres, pratos e copos para cada convidado."
        nl: "X Het feestmaal komt eraan en de tafel is leeg. Dek hem helemaal: bestek, borden en glazen voor elke gast."

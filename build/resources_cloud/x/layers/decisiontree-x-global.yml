        nl: "X De schone vaat druipt nog, gevangen door een druppelzwerm. Droog elk stuk af met de theedoek tot alles droog en opgeruimd is."
      dt_d_vaisselle_05:
        fr: "X @@@session.user.name@@@ vient de chasser la nuée de gouttes de la vaisselle !"

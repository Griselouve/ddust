        br: "X @@@session.user.name@@@ resistiu firme contra o golem do filtro da lava-louças, mas o tempo acabou: a aventura vai continuar!"
        nl: "X @@@session.user.name@@@ hield stand tegen de filtergolem van de vaatwasser, maar de tijd was op: het avontuur gaat verder!"

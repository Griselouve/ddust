        de: "X @@@session.user.name@@@ hat den Tropfenschwarm gerade vom Geschirr vertrieben!"
        it: "X @@@session.user.name@@@ ha appena scacciato lo sciame di gocce dalle stoviglie!"
        pt: "X @@@session.user.name@@@ acabou de afugentar o enxame de gotas da loiça!"
        br: "X @@@session.user.name@@@ acabou de espantar o enxame de gotas da louça!"
        nl: "X @@@session.user.name@@@ heeft zojuist de druppelzwerm van de vaat verjaagd!"

        br: "X @@@session.user.name@@@ colocou toda a energia para pôr a mesa do banquete, mas passou um dragão na pior hora!"
        nl: "X @@@session.user.name@@@ stak alle energie in het dekken van de feesttafel, maar er vloog een draak voorbij op het slechtste moment!"

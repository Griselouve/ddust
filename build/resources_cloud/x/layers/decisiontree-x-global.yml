        it: "X @@@session.user.name@@@ ha appena apparecchiato la tavola per il banchetto!"
        pt: "X @@@session.user.name@@@ acabou de pôr a mesa para o festim!"
        br: "X @@@session.user.name@@@ acabou de pôr a mesa para o banquete!"
        nl: "X @@@session.user.name@@@ heeft zojuist de tafel gedekt voor het feestmaal!"

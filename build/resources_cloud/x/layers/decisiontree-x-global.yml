        de: "X Saugen oder fegen"
        it: "X Aspirare o spazzare"
        pt: "X Aspirar ou varrer"
        br: "X Aspirar ou varrer"
        nl: "X Stofzuigen of vegen"
      dt_a_salon_01:
        fr: "X Les moutons-gobelins de poussière envahissent le salon ! Aspire ou balaie jusqu'à ce que le sol soit net, recoins et dessous des meubles compris."
        en: "X Dust-bunny goblins are overrunning the living room! Vacuum or sweep until the floor is spotless, corners and under the furniture included."
        es: "X ¡Los duendes de pelusa invaden el salón! Aspira o barre hasta que el suelo quede impecable, rincones y debajo de los muebles incluidos."
        de: "X Die Wollmaus-Kobolde überrennen das Wohnzimmer! Sauge oder fege, bis der Boden blitzblank ist, Ecken und unter den Möbeln inklusive."
        it: "X I goblin-batuffolo di polvere invadono il soggiorno! Aspira o spazza finché il pavimento non è pulito, angoli e sotto i mobili compresi."
        pt: "X Os duendes de cotão invadem a sala! Aspira ou varre até o chão ficar impecável, cantos e debaixo dos móveis incluídos."
        br: "X Os duendes de fiapos invadem a sala! Aspire ou varra até o chão ficar impecável, incluindo os cantos e embaixo dos móveis."
        nl: "X De stofpluiskobolden overspoelen de woonkamer! Zuig of veeg tot de vloer brandschoon is, hoekjes en onder de meubels inbegrepen."
      dt_d_salon_01:
        fr: "X @@@session.user.name@@@ vient de pulvériser les moutons-gobelins du salon !"
        en: "X @@@session.user.name@@@ has just crushed the dust-bunny goblins of the living room!"
        es: "X ¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa del salón!"
        de: "X @@@session.user.name@@@ hat gerade die Wollmaus-Kobolde im Wohnzimmer pulverisiert!"
        it: "X @@@session.user.name@@@ ha appena polverizzato i goblin-batuffolo del soggiorno!"
        pt: "X @@@session.user.name@@@ acabou de pulverizar os duendes de cotão da sala!"
        br: "X @@@session.user.name@@@ acabou de pulverizar os duendes de fiapos da sala!"
        nl: "X @@@session.user.name@@@ heeft net de stofpluiskobolden in de woonkamer verpulverd!"
      dt_c_salon_01:
        fr: "X @@@session.user.name@@@ a chargé les moutons-gobelins du salon tête baissée, mais le temps a manqué : l'aventure continuera !"
        en: "X @@@session.user.name@@@ charged straight at the dust-bunny goblins of the living room, but time ran out: the adventure will go on!"
        es: "X ¡@@@session.user.name@@@ cargó de frente contra los duendes de pelusa del salón, pero se acabó el tiempo: la aventura continuará!"
        de: "X @@@session.user.name@@@ stürzte sich kopfüber auf die Wollmaus-Kobolde im Wohnzimmer, aber die Zeit reichte nicht: Das Abenteuer geht weiter!"
        it: "X @@@session.user.name@@@ ha caricato a testa bassa i goblin-batuffolo del soggiorno, ma il tempo è finito: l'avventura continuerà!"
        pt: "X @@@session.user.name@@@ carregou de cabeça baixa contra os duendes de cotão da sala, mas o tempo acabou: a aventura vai continuar!"
        br: "X @@@session.user.name@@@ avançou de cabeça baixa contra os duendes de fiapos da sala, mas o tempo acabou: a aventura vai continuar!"
        nl: "X @@@session.user.name@@@ stormde blindelings af op de stofpluiskobolden in de woonkamer, maar de tijd was op: het avontuur gaat verder!"
      dt_t_salon_02:
        fr: "X Faire les poussières"
        en: "X Dust"
        es: "X Quitar el polvo"
        de: "X Staub wischen"
        it: "X Spolverare"
        pt: "X Limpar o pó"
        br: "X Tirar o pó"
        nl: "X Afstoffen"
      dt_a_salon_02:
        fr: "X Des spectres de poussière se posent sur chaque surface du salon. Dépoussière étagères, meubles et bibelots jusqu'à les faire disparaître."
        en: "X Dust wraiths settle on every surface of the living room. Dust the shelves, furniture and trinkets until they vanish."
        es: "X Espectros de polvo se posan en cada superficie del salón. Quita el polvo de estantes, muebles y adornos hasta hacerlos desaparecer."
        de: "X Staubgespenster lassen sich auf jeder Fläche im Wohnzimmer nieder. Wische Regale, Möbel und Nippes ab, bis sie verschwinden."
        it: "X Spettri di polvere si posano su ogni superficie del soggiorno. Spolvera mensole, mobili e soprammobili finché non spariscono."
        pt: "X Espectros de pó pousam em cada superfície da sala. Limpa o pó das prateleiras, móveis e bibelôs até os fazeres desaparecer."
        br: "X Espectros de poeira pousam em cada superfície da sala. Tire o pó das prateleiras, móveis e bibelôs até fazê-los desaparecer."
        nl: "X Stofspoken strijken neer op elk oppervlak in de woonkamer. Stof planken, meubels en snuisterijen af tot ze verdwijnen."
      dt_d_salon_02:
        fr: "X @@@session.user.name@@@ vient de dissiper les spectres de poussière du salon !"
        en: "X @@@session.user.name@@@ has just banished the dust wraiths of the living room!"
        es: "X ¡@@@session.user.name@@@ acaba de disipar los espectros de polvo del salón!"
        de: "X @@@session.user.name@@@ hat gerade die Staubgespenster im Wohnzimmer vertrieben!"
        it: "X @@@session.user.name@@@ ha appena dissolto gli spettri di polvere del soggiorno!"
        pt: "X @@@session.user.name@@@ acabou de dissipar os espectros de pó da sala!"
        br: "X @@@session.user.name@@@ acabou de dissipar os espectros de poeira da sala!"
        nl: "X @@@session.user.name@@@ heeft net de stofspoken in de woonkamer verdreven!"
      dt_c_salon_02:
        fr: "X @@@session.user.name@@@ a tenu bon face aux spectres de poussière du salon, et le combat a duré plus longtemps que prévu !"
        en: "X @@@session.user.name@@@ held the line against the dust wraiths of the living room, and the fight lasted longer than expected!"
        es: "X ¡@@@session.user.name@@@ aguantó firme frente a los espectros de polvo del salón, y el combate duró más de lo previsto!"
        de: "X @@@session.user.name@@@ hielt tapfer stand gegen die Staubgespenster im Wohnzimmer, und der Kampf dauerte länger als gedacht!"
        it: "X @@@session.user.name@@@ ha tenuto duro contro gli spettri di polvere del soggiorno, e la battaglia è durata più del previsto!"
        pt: "X @@@session.user.name@@@ aguentou firme contra os espectros de pó da sala, e o combate durou mais do que o previsto!"
        br: "X @@@session.user.name@@@ aguentou firme contra os espectros de poeira da sala, e o combate durou mais do que o previsto!"
        nl: "X @@@session.user.name@@@ hield stand tegen de stofspoken in de woonkamer, en het gevecht duurde langer dan gedacht!"
      dt_t_salon_03:
        fr: "X Laver le sol"
        en: "X Mop the floor"
        es: "X Fregar el suelo"
        de: "X Boden wischen"
        it: "X Lavare il pavimento"
        pt: "X Lavar o chão"
        br: "X Lavar o chão"
        nl: "X De vloer dweilen"
      dt_a_salon_03:
        fr: "X Des limaces de crasse laissent des traînées sur le sol du salon. Lave jusqu'à ce que le sol brille, sans auréole ni trace collante."
        en: "X Grime slugs leave trails across the living room floor. Mop until the floor shines, with no streaks or sticky patches."
        es: "X Babosas de mugre dejan rastros en el suelo del salón. Friega hasta que el suelo brille, sin cercos ni zonas pegajosas."
        de: "X Schmutzschnecken hinterlassen Spuren auf dem Wohnzimmerboden. Wische, bis der Boden glänzt, ohne Schlieren oder klebrige Stellen."
        it: "X Lumache di sporco lasciano scie sul pavimento del soggiorno. Lava finché il pavimento non brilla, senza aloni né zone appiccicose."
        pt: "X Lesmas de sujidade deixam rastos no chão da sala. Lava até o chão brilhar, sem manchas nem zonas peganhentas."
        br: "X Lesmas de sujeira deixam rastros no chão da sala. Lave até o chão brilhar, sem manchas nem partes grudentas."
        nl: "X Vuilslakken laten sporen achter op de woonkamervloer. Dweil tot de vloer glanst, zonder strepen of plakkerige plekken."
      dt_d_salon_03:
        fr: "X @@@session.user.name@@@ vient d'écraser les limaces de crasse du salon !"
        en: "X @@@session.user.name@@@ has just squashed the grime slugs of the living room!"
        es: "X ¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre del salón!"
        de: "X @@@session.user.name@@@ hat gerade die Schmutzschnecken im Wohnzimmer zerquetscht!"
        it: "X @@@session.user.name@@@ ha appena schiacciato le lumache di sporco del soggiorno!"
        pt: "X @@@session.user.name@@@ acabou de esmagar as lesmas de sujidade da sala!"
        br: "X @@@session.user.name@@@ acabou de esmagar as lesmas de sujeira da sala!"
        nl: "X @@@session.user.name@@@ heeft net de vuilslakken in de woonkamer geplet!"
      dt_c_salon_03:
        fr: "X @@@session.user.name@@@ a croisé le fer avec les limaces de crasse du salon, mais le sortilège a mal tourné au dernier moment !"
        en: "X @@@session.user.name@@@ crossed swords with the grime slugs of the living room, but the spell went wrong at the last moment!"
        es: "X ¡@@@session.user.name@@@ cruzó el acero con las babosas de mugre del salón, pero el hechizo salió mal en el último momento!"
        de: "X @@@session.user.name@@@ kreuzte die Klingen mit den Schmutzschnecken im Wohnzimmer, aber der Zauber ging im letzten Moment schief!"
        it: "X @@@session.user.name@@@ ha incrociato le spade con le lumache di sporco del soggiorno, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "X @@@session.user.name@@@ cruzou espadas com as lesmas de sujidade da sala, mas o feitiço correu mal no último momento!"
        br: "X @@@session.user.name@@@ cruzou espadas com as lesmas de sujeira da sala, mas o feitiço deu errado no último momento!"
        nl: "X @@@session.user.name@@@ kruiste de degens met de vuilslakken in de woonkamer, maar de spreuk ging op het laatste moment mis!"
      dt_t_salon_04:
        fr: "X Nettoyer les vitres"
        en: "X Clean the windows"
        es: "X Limpiar las ventanas"
        de: "X Fenster putzen"
        it: "X Pulire i vetri"
        pt: "X Limpar os vidros"
        br: "X Limpar os vidros"
        nl: "X Ramen lappen"
      dt_a_salon_04:
        fr: "X Des lutins de traces grasses brouillent les vitres du salon. Nettoie jusqu'à une transparence parfaite, sans trace ni coulure."
        en: "X Greasy-smudge imps blur the living room windows. Clean until perfectly clear, with no smears or drips."
        es: "X Duendes de manchas grasientas empañan las ventanas del salón. Limpia hasta una transparencia perfecta, sin marcas ni regueros."
        de: "X Schmierwichtel trüben die Wohnzimmerfenster. Putze, bis alles perfekt durchsichtig ist, ohne Schlieren oder Tropfspuren."
        it: "X Folletti delle ditate appannano i vetri del soggiorno. Pulisci fino a una trasparenza perfetta, senza aloni né colature."
        pt: "X Duendes das dedadas embaciam os vidros da sala. Limpa até ficarem perfeitamente transparentes, sem marcas nem escorridos."
        br: "X Duendes dos dedos sujos embaçam os vidros da sala. Limpe até ficarem perfeitamente transparentes, sem marcas nem riscos."
        nl: "X Vetvlekkabouters maken de ramen van de woonkamer wazig. Lap tot ze perfect doorzichtig zijn, zonder strepen of druipers."
      dt_d_salon_04:
        fr: "X @@@session.user.name@@@ vient de chasser les lutins des vitres du salon !"
        en: "X @@@session.user.name@@@ has just driven off the smudge imps from the living room windows!"
        es: "X ¡@@@session.user.name@@@ acaba de ahuyentar a los duendes de las ventanas del salón!"
        de: "X @@@session.user.name@@@ hat gerade die Schmierwichtel von den Wohnzimmerfenstern verjagt!"
        it: "X @@@session.user.name@@@ ha appena scacciato i folletti dai vetri del soggiorno!"
        pt: "X @@@session.user.name@@@ acabou de afugentar os duendes dos vidros da sala!"
        br: "X @@@session.user.name@@@ acabou de espantar os duendes dos vidros da sala!"
        nl: "X @@@session.user.name@@@ heeft net de vetvlekkabouters van de woonkamerramen verjaagd!"
      dt_c_salon_04:
        fr: "X @@@session.user.name@@@ a tenu tête aux lutins des vitres du salon, mais la nuit est tombée sur le donjon avant la fin !"
        en: "X @@@session.user.name@@@ stood up to the smudge imps of the living room windows, but night fell on the dungeon before the end!"
        es: "X ¡@@@session.user.name@@@ le plantó cara a los duendes de las ventanas del salón, pero cayó la noche sobre la mazmorra antes del final!"
        de: "X @@@session.user.name@@@ bot den Schmierwichteln an den Wohnzimmerfenstern die Stirn, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "X @@@session.user.name@@@ ha tenuto testa ai folletti dei vetri del soggiorno, ma la notte è calata sul dungeon prima della fine!"
        pt: "X @@@session.user.name@@@ enfrentou os duendes dos vidros da sala, mas a noite caiu sobre a masmorra antes do fim!"

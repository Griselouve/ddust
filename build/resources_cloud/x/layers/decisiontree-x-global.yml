        pt: "X @@@session.user.name@@@ acabou de derrotar o golem do filtro da máquina da loiça!"
        br: "X @@@session.user.name@@@ acabou de derrotar o golem do filtro da lava-louças!"
        nl: "X @@@session.user.name@@@ heeft zojuist de filtergolem van de vaatwasser verslagen!"
      dt_c_vaisselle_09:
        fr: "X @@@session.user.name@@@ a tenu bon face au golem de filtre du lave-vaisselle, mais le temps a manqué : l'aventure continuera !"

        pt: "X Levar o lixo à rua"
        br: "X Levar o lixo para fora"
        nl: "X Vuilnis buiten zetten"
      dt_a_dechets_01:
        fr: "X Les nauséabonds blob-ordures contaminent la maison ! Sors les poubelles et remets un sac neuf. Attention aux petits déchets qu'ils laissent derrière, ce sont des pièges."
        en: "X The stinking garbage blobs are contaminating the house! Take out the bins and fit a new bag. Beware the little scraps they leave behind, they are traps."
        es: "X ¡Los apestosos blobs de basura contaminan la casa! Saca la basura y pon una bolsa nueva. Cuidado con los pequeños restos que dejan, son trampas."
        de: "X Die stinkenden Müll-Blobs verseuchen das Haus! Bring den Müll raus und leg einen neuen Beutel ein. Pass auf die kleinen Reste auf, die sie zurücklassen: Das sind Fallen."
        it: "X I puzzolenti blob-spazzatura contaminano la casa! Porta fuori la spazzatura e metti un sacchetto nuovo. Attento ai piccoli rifiuti che lasciano dietro di sé, sono trappole."
        pt: "X Os fedorentos blobs de lixo estão a contaminar a casa! Leva o lixo à rua e põe um saco novo. Cuidado com os restinhos que deixam para trás, são armadilhas."
        br: "X Os fedorentos blobs de lixo estão contaminando a casa! Leve o lixo para fora e coloque um saco novo. Cuidado com os restinhos que ficam para trás, são armadilhas."
        nl: "X De stinkende afvalblobs besmetten het huis! Zet het vuilnis buiten en doe er een nieuwe zak in. Pas op voor de kleine restjes die ze achterlaten, dat zijn vallen."

name: shop-base
above: conf
strategy: default
tenant: global
data:

  # ===========================================================================
  # BOUTIQUE (dvshop) — interface et libellés
  # ---------------------------------------------------------------------------
  # Écrit par E:\Deva\tmp\dvshop\gen_shop_base.py (jetable) ; à retoucher ici
  # directement désormais. Le catalogue : build.yml de la suite (`shop.catalog`).
  # ===========================================================================
  shop:
    # La boutique : interface (le CATALOGUE vient du build.yml de la suite, couche
    # shop-catalog-global.yml ; l'HABILLAGE vient de chaque thème, `shop.style`).
    ui:
      # Page portant le DvShopStore : `shop.open.<boutique>` y mène.
      page: shop_store_page
      display:
        columns: 3
        highlight_height: 310
        confirm_seconds: 4
        min_discount: 0.05
        min_advantage: 0.05
        # Produit Play que Play ne sert pas (produits encore `enabled: false`) : la carte
        # dit « Bientôt » plutôt que de disparaître.
        unpriced: soon

      # PAGE D'ENTRÉE : l'écran Boutique (fond du thème, échoppe, enseigne), dont le corps
      # est une grille de tuiles. Plus de kebab : code cadeau et abonnement sont des tuiles.
      # Un joueur qui ne voit aucune tuile lit `empty` (« Bientôt »), jamais un écran vide.
      hub:
        empty: "@@@T:shop_hub_empty@@@"
        # Une boutique SANS ITEM garde sa tuile : elle dit seulement « Bientôt ». C'est le cas
        # tant qu'un contenu n'est pas livré (on ne montre que ce qui existe vraiment).
        soon: "@@@T:shop_hub_empty@@@"
        badges: [free, new, discount, advantage]
        tile_height_ratio: 0.46
        tiles:
          - { id: t_themes, shop: themes, art: vitrine, toggle_group: theme, tags: [chef],
              label: "@@@T:shop_tile_themes@@@", subtitle: "@@@T:shop_tile_themes_sub@@@" }
          - { id: t_achats, shop: achats, art: stack, tags: [chef],
              label: "@@@T:shop_tile_achats@@@", subtitle: "@@@T:shop_tile_achats_sub@@@" }
          # L'échoppe des objets du jeu (payés en or, avec l'extension loots), pour TOUT le clan.
          # Vide d'ici là : la tuile garde sa place et dit « Bientôt ». Aucun mot sur l'or.
          - { id: t_objets, shop: objets, art: row, span: 2,
              label: "@@@T:shop_tile_objets@@@", subtitle: "@@@T:shop_tile_objets_sub@@@" }
          - { id: t_cadeau, action: navigate_new.giftcode_page, art: giftwrap, tags: [chef, majeur],
              label: "@@@T:shop_tile_cadeau@@@", subtitle: "@@@T:shop_tile_cadeau_sub@@@" }
          - { id: t_abo, action: worker.store_manage_or_tiers, art: crown, tags: [chef, majeur],
              label: "@@@T:shop_tile_abo@@@", subtitle: "@@@T:shop_tile_abo_sub@@@" }
          # Faux store (cible d'essai seulement) : l'identifiant à donner au pilotage.
          - { id: t_essai, action: worker.on_store_mock_id, art: crown, span: 2, tags: [essai],
              label: "@@@T:shop_tile_essai@@@", subtitle: "@@@T:shop_tile_essai_sub@@@" }

      # Une boutique sans item n'est PAS retirée : sa tuile dit « Bientôt ». Ses sections restent
      # déclarées, un item qui arrive au catalogue s'y range de lui-même.
      shops:
        themes:
          title: "@@@T:shop_title_themes@@@"
          sections: [themes, mascottes]
          highlights: []
          # Une puce sans item visible se cache d'elle-même : « Mascottes » n'apparaît
          # qu'avec la première mascotte en vente (futur pack « mascottes »).
          selectors:
            - { id: all,       label: "@@@T:shop_sel_all@@@",       sections: "*" }
            - { id: themes,    label: "@@@T:shop_sel_themes@@@",    sections: [themes] }
            - { id: mascottes, label: "@@@T:shop_sel_mascottes@@@", sections: [mascottes] }
        achats:
          title: "@@@T:shop_title_achats@@@"
          sections: [extensions, packs, gratuits]
          highlights: []
          selectors: []
        objets:
          title: "@@@T:shop_title_objets@@@"
          sections: [potions]
          highlights: []
          currency: gold
          selectors: []

      # `layout: showcase` = grandes vitrines pleine largeur ; sinon grille de cartes.
      sections:
        - { id: extensions, rank: 10, label: "@@@T:shop_sec_extensions@@@", tags: [chef] }
        - { id: packs,      rank: 20, label: "@@@T:shop_sec_packs@@@",      tags: [chef] }
        - { id: gratuits,   rank: 25, label: "@@@T:shop_sec_gratuits@@@",   tags: [chef] }
        - { id: themes,     rank: 30, label: "@@@T:shop_sec_themes@@@",     tags: [chef], layout: showcase }
        - { id: mascottes,  rank: 40, label: "@@@T:shop_sec_mascottes@@@",  tags: [chef] }
        - { id: potions,    rank: 50, label: "@@@T:shop_sec_potions@@@" }

      # Panneaux du carrousel : 1 à n items, qui remplissent tout le panneau. Aucun pour
      # l'instant : un carrousel qui redit une vitrine de la page est redondant.
      highlights: []


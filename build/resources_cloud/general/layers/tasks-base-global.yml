  tasks:
    # =====================================================================
    # REGLE DE COTATION DE L'EFFORT (a maintenir pour toute nouvelle tache)
    # effort = complexite de la tache (~ temps passe) + un modificateur :
    #   +2 : tache TRES penible et/ou TRES ingrate (ex. cuvette, litiere, poubelle)
    #   +1 : tache un peu plus penible et/ou ingrate que la moyenne (ex. sortir les poubelles)
    #
    # REGLE DE COTATION DU RESPAWN
    # L'XP d'une tache = (10 + respawn_h / 12) x effort  (cf. worker.xp_per_effort et
    # worker.xp_respawn_div). respawn_h n'est donc PAS la frequence reelle du besoin du foyer :
    # c'est le POIDS donne a la tache. Une corvee rare et lourde doit bien payer a l'unite
    # (nettoyer le four, 720h : 350 XP) sans devenir rentable a la semaine.
    # Corollaire a garder en tete : joue en boucle, le plafond hebdomadaire d'une tache vaut
    #   112 x XP / respawn_h = 1120 x effort / respawn_h + 9,3 x effort
    # (112 h = 16 h eveillees x 7 jours). Passe 120 h de respawn le second terme domine et le
    # rendement ne depend plus que de l'effort : c'est la zone equilibree. En dessous de 24 h une
    # tache devient tres lucrative a la semaine, a n'utiliser que pour les corvees vraiment
    # pluriquotidiennes (repas, vaisselle).
    # Outil d'analyse : build/tools/gen_tasks_balance.py -> tasks_balance.db
    # =====================================================================

      # Conte du butin (worker._narrateClanStory), déclenché depuis butin_tale_page. Contrairement
      # aux prompts « inspire » ci-dessus (sortie contrainte NOM:/DESCRIPTION:), celui-ci produit un
      # texte libre — d'où les consignes de STYLE détaillées : sans elles, un modèle générique verse
      # vite dans le lyrisme creux (« Dans un monde où… ») que ce récit doit justement éviter pour
      # sonner comme une vraie chronique de famille, pas comme une réponse d'IA.
      # Le LECTEUR VISÉ est explicitement redéfini dans ce prompt : ce ne sont PAS les membres du
      # clan (qui ont déjà vécu la scène), ce sont D'AUTRES FAMILLES qui ne jouent pas encore — le
      # texte doit leur montrer des enfants qui jouent ensemble, pour leur donner envie de commencer.
      # Le texte doit rester COURT (format partage WhatsApp, pas un article) : une phrase d'accroche
      # puis 3-4 phrases sur UN SEUL moment. Un premier jet, nourri d'agrégats détaillés (XP par
      # joueur), avait produit un INVENTAIRE reformulé du journal (« a nettoyé le couloir (432 XP)… »)
      # au lieu d'un récit — d'où les interdits explicites ci-dessous ET l'appauvrissement volontaire
      # des agrégats transmis (cf. worker._narrateClanStory : un seul total d'XP, jamais un par
      # joueur). L'argent de poche n'est PAS mentionné par l'IA : une phrase de clôture FIXE
      # (share_tale_outro, cf. worker.on_log_appear) en parle après coup, hors du texte généré.
      # @@@worker.narrate_clan@@@ = nom INTERNE du clan (celui choisi par la famille, jamais le nom
      # externe généré) + sa description. @@@worker.narrate_input@@@ = le journal du clan, DÉJÀ
      # résolu et localisé. @@@worker.narrate_totals@@@ = agrégats PAUVRES calculés EN DART (pseudonymes,
      # XP totale du clan — jamais un détail par joueur, jamais laissés au modèle qui ferait mal les
      # sommes).
      prompt_narrate_clan:
        fr: |
          Tu es le chroniqueur d'une guilde, dans le jeu Donjons & Savons où les tâches ménagères d'une famille sont vécues comme des quêtes de clan.

          Ce texte n'est PAS destiné à la famille qui l'a vécu : il sera lu par D'AUTRES familles, qui ne jouent pas encore à Donjons & Savons. Ton but est de leur donner envie de s'y mettre, en leur montrant des enfants qui jouent ensemble.

          Voici le nom du clan et sa description :
          ---
          @@@worker.narrate_clan@@@
          ---
          Voici son journal (chronologique, du plus récent au plus ancien) :
          ---
          @@@worker.narrate_input@@@
          ---
          Quelques chiffres, à citer au plus UNE fois dans tout le texte (n'en invente ni n'en arrondis d'autres) :
          ---
          @@@worker.narrate_totals@@@
          ---

          Ce texte est un message COURT, fait pour être partagé sur WhatsApp — pas un article. Écris D'ABORD une phrase d'accroche enthousiaste sur la forme du clan, PUIS 3 à 4 phrases maximum qui racontent UN SEUL moment marquant de ce journal — le reste sert de toile de fond, tu n'as pas à tout mentionner. Au total : 5 phrases maximum, 60 à 90 mots.

          INTERDITS stricts :
          - Tu ne connais le genre d'AUCUN enfant : le nom qu'il s'est choisi ne te le dit pas. N'utilise donc JAMAIS « il » ou « elle » pour désigner un enfant, ni aucun adjectif ou participe accordé en genre à son sujet (proscris « petit »/« petite », « motivé »/« motivée »… accolés à un nom de personnage) — répète le nom qu'il s'est choisi à la place, ou formule la phrase sans accord de genre.
          - N'énumère JAMAIS les tâches une par une ; ce texte n'est pas un inventaire du journal.
          - N'accole JAMAIS un nombre d'XP à une action précise (proscris toute forme « a fait X (N XP) »).
          - Pas de phrase-bilan qui résume des totaux en fin de texte (« le coffre a été ouvert N fois, rapportant… »).
          - Pas plus d'UN chiffre dans tout le texte.
          - Pas d'ouverture toute faite du type « Dans un monde où… », « Il était une fois… », « À l'heure où… ».
          - Aucune phrase méta sur toi-même ou sur le texte (« Voici le récit… », « Cette histoire montre que… »).
          - Pas de superlatifs vides (« incroyable », « exceptionnel », « légendaire ») sans un fait concret derrière.
          - Pas de tirade moralisatrice ni de conclusion qui fait la leçon.
          - Pas d'émojis en rafale (un ou deux maximum, ou aucun).
          - Ne parle JAMAIS de la création, de la fondation ni des débuts du clan : on raconte ce qu'une famille vit, pas son acte de naissance.
          - N'emploie JAMAIS les mots « pièces », « or », « monnaie », « argent » ou « argent de poche », et ne mentionne JAMAIS le coffre ni une récompense : ce sujet est traité ailleurs, pas dans ce texte.

          À FAIRE :
          - Ne raconte QUE des faits présents dans le journal ci-dessus ; n'invente aucun événement.
          - Phrases courtes, ton chaleureux et un peu drôle, comme un parent qui raconte sa semaine — pas une chronique de guilde ni une fantasy pompeuse.
          - Nomme les enfants par le nom qu'ils se sont choisi.
          - Termine sur ce que le clan a concrètement vécu, jamais sur un appel à l'action ni un slogan publicitaire.
          - Rédige entièrement en @@@worker.inspire_lang@@@.

          REGISTRE IMPOSÉ — ce texte sera lu par des enfants :
          - Les seuls « monstres » sont des créatures de saleté et de désordre, drôles et inoffensives. Aucune violence envers une personne ou un animal, aucune arme réelle, aucun sang, aucune blessure, aucune mort.
          - Rien qui fasse peur : ni horreur, ni menace, ni punition, ni humiliation, ni moquerie visant quelqu'un.
          - Aucun thème d'adulte : sexualité, séduction, alcool, tabac, drogues, jeux d'argent, politique, religion, maladie.
          - Aucune insulte, aucun juron, aucun mot grossier, même atténué.
          - N'invente aucune donnée personnelle : ni nom de famille, ni adresse, ni école, ni ville, ni âge.
          - Dans le doute, choisis toujours la formulation la plus douce.
        en: |
          You are the chronicler of a guild, in the game Dungeons & Soaps where a family's household chores play out as clan quests.

          This text is NOT for the family that lived it: it will be read by OTHER families, who don't play Dungeons & Soaps yet. Your goal is to make them want to start, by showing children playing together.

          Here is the clan's name and description:
          ---
          @@@worker.narrate_clan@@@
          ---
          Here is its log (chronological, most recent first):
          ---
          @@@worker.narrate_input@@@
          ---
          A few figures, to be cited AT MOST once in the whole text (invent or round no others):
          ---
          @@@worker.narrate_totals@@@
          ---

          This text is a SHORT message, made to be shared on WhatsApp — not an article. Write FIRST one enthusiastic hook sentence about how well the clan is doing, THEN 3 to 4 sentences at most telling ONE single memorable moment from this log — the rest is backdrop, you don't have to mention everything. Total: 5 sentences max, 60-90 words.

          Strict BANS:
          - You do NOT know any child's gender: the name they chose for themselves doesn't tell you. NEVER use "he" or "she" for a child, and never use a gendered word to describe them — repeat the name they chose instead, or phrase the sentence so it needs no gender.
          - NEVER list tasks one by one; this is not an inventory of the log.
          - NEVER attach an XP number to a specific action (ban any form of "did X (N XP)").
          - No summary sentence tallying totals at the end ("the chest was opened N times, yielding…").
          - No more than ONE number in the whole text.
          - No stock opening like "In a world where…", "Once upon a time…", "At a time when…".
          - No meta-commentary about yourself or the text ("Here is the tale…", "This story shows that…").
          - No empty superlatives ("incredible", "exceptional", "legendary") without a concrete fact behind them.
          - No moralizing tirade or lesson-teaching conclusion.
          - No emoji spam (one or two at most, or none).
          - NEVER mention the clan's creation, founding or early days: we tell what a family lives, not its birth certificate.
          - NEVER use the words "coins", "gold", "currency", "money" or "pocket money", and never mention the chest or any reward: that topic is handled elsewhere, not in this text.

          TO DO:
          - Tell ONLY facts present in the log above; invent no event.
          - Short sentences, warm and lightly funny tone, like a parent telling their week — not a guild chronicle nor pompous fantasy.
          - Name the children by the name they chose for themselves.
          - End on what the clan actually experienced, never on a call to action or an ad slogan.
          - Write entirely in @@@worker.inspire_lang@@@.

          MANDATORY REGISTER - this text will be read by children:
          - The only "monsters" are creatures of dirt and mess, funny and harmless. No violence towards any person or animal, no real weapons, no blood, no injury, no death.
          - Nothing frightening: no horror, no threat, no punishment, no humiliation, no mockery aimed at anyone.
          - No adult themes: sexuality, seduction, alcohol, tobacco, drugs, gambling, politics, religion, illness.
          - No insults, no swearing, no coarse language, not even mild.
          - Do not invent any personal data: no surname, no address, no school, no town, no age.
          - When in doubt, always choose the gentler wording.
        es: |
          Eres el cronista de un gremio, en el juego Mazmorras y Jabones donde las tareas domésticas de una familia se viven como misiones de clan.

          Este texto NO es para la familia que lo vivió: lo leerán OTRAS familias, que todavía no juegan a Mazmorras y Jabones. Tu objetivo es darles ganas de empezar, mostrando niños que juegan juntos.

          Aquí están el nombre del clan y su descripción:
          ---
          @@@worker.narrate_clan@@@
          ---
          Aquí está su registro (cronológico, del más reciente al más antiguo):
          ---
          @@@worker.narrate_input@@@
          ---
          Algunas cifras, a citar como MÁXIMO una vez en todo el texto (no inventes ni redondees otras):
          ---
          @@@worker.narrate_totals@@@
          ---

          Este texto es un mensaje CORTO, hecho para compartirse por WhatsApp — no un artículo. Escribe PRIMERO una frase de apertura entusiasta sobre cómo le va al clan, LUEGO 3 a 4 frases como máximo que cuenten UN ÚNICO momento memorable de este registro — el resto es telón de fondo, no tienes que mencionarlo todo. En total: 5 frases máximo, 60 a 90 palabras.

          PROHIBICIONES estrictas:
          - No conoces el género de NINGÚN niño: su nombre solo no te lo dice. NUNCA uses «él» o «ella» para referirte a un niño, ni ningún adjetivo o participio con concordancia de género sobre él — repite su nombre en su lugar, o formula la frase sin necesidad de concordancia de género.
          - NUNCA enumeres las tareas una por una; esto no es un inventario del registro.
          - NUNCA añadas un número de XP a una acción concreta (prohibida toda forma «hizo X (N XP)»).
          - Sin frase-balance que resuma totales al final («el cofre se abrió N veces, aportando…»).
          - No más de UNA cifra en todo el texto.
          - Sin aperturas trilladas como «En un mundo donde…», «Érase una vez…», «En una época en que…».
          - Sin comentarios meta sobre ti mismo o el texto («Aquí está el relato…», «Esta historia muestra que…»).
          - Sin superlativos vacíos («increíble», «excepcional», «legendario») sin un hecho concreto detrás.
          - Sin discurso moralizante ni conclusión aleccionadora.
          - Sin avalancha de emojis (uno o dos como máximo, o ninguno).
          - NUNCA hables de la creación, la fundación ni los inicios del clan: se cuenta lo que vive una familia, no su acta de nacimiento.
          - NUNCA uses las palabras «monedas», «oro», «dinero del juego» ni «dinero de bolsillo», y nunca menciones el cofre ni ninguna recompensa: ese tema se trata en otro lugar, no en este texto.

          QUÉ HACER:
          - Cuenta SOLO hechos presentes en el registro anterior; no inventes ningún evento.
          - Frases cortas, tono cálido y algo divertido, como un padre contando su semana — no una crónica de gremio ni fantasía pomposa.
          - Nombra a los niños por el nombre que se han elegido.
          - Termina con lo que el clan realmente vivió, nunca con una llamada a la acción ni un eslogan publicitario.
          - Redacta todo en @@@worker.inspire_lang@@@.

          REGISTRO OBLIGATORIO. Este texto lo leerán niños.
          - Los únicos «monstruos» son criaturas de suciedad y desorden, divertidas e inofensivas. Ninguna violencia hacia una persona o un animal, ninguna arma real, nada de sangre, heridas ni muerte.
          - Nada que dé miedo: ni horror, ni amenazas, ni castigos, ni humillación, ni burlas hacia nadie.
          - Ningún tema de adultos: sexualidad, seducción, alcohol, tabaco, drogas, juegos de azar, política, religión, enfermedad.
          - Ningún insulto, ninguna palabrota, ningún lenguaje grosero, ni siquiera suave.
          - No inventes ningún dato personal: ni apellido, ni dirección, ni colegio, ni ciudad, ni edad.
          - En caso de duda, elige siempre la formulación más suave.
      #------------- Join Clan ------------------------------------

      join_clan_title:
        fr: "Par pigeon voyageur"
        en: "By carrier pigeon"
        es: "Por paloma mensajera"

      # Révélé au MINEUR seulement. La connexion Google est la toute dernière étape, après
      # l'admission : autant l'annoncer pendant que le chef de clan est encore là.
      join_clan_google_notice:
        fr: "Une fois accepté dans le clan, tu te connecteras avec ton compte Google. Si un parent veille sur ce compte, demande-lui d'être là — ou d'autoriser le jeu à l'avance dans Family Link."
        en: "Once you are accepted into the clan, you will sign in with your Google account. If a parent supervises that account, ask them to be there — or to allow the game in advance in Family Link."
        es: "Cuando te acepten en el clan, te conectarás con tu cuenta de Google. Si un padre supervisa esa cuenta, pídele que esté presente, o que autorice el juego por adelantado en Family Link."

      accept_invitation_clan_title:
        fr: "Tu es attendu !"
        en: "You are expected!"
        es: "¡Te esperan!"

      scan_qr_btn:
        fr: "Demande à ton chef de clan de t'inviter avec un QR code !"
        en: "Ask your clan chief to invite you with a QR code!"
        es: "¡Pide a tu jefe de clan que te invite con un código QR!"

      send_request_btn:
        fr: "Je n'ai pas le QR code"
        en: "I don't have the QR code"
        es: "No tengo el código QR"

      share_clan_request_text:
        fr: "Je voudrais rejoindre ton clan !"
        en: "I'd like to join your clan!"
        es: "¡Me gustaría unirme a tu clan!"

      #------------- Accept Invite Clan ------------------------------------

      accept_invitation_title:
        fr: "Un clan t'ouvre ses portes !"
        en: "A clan is opening its doors to you!"
        es: "¡Un clan te abre sus puertas!"

      accept_invitation_confirm:
        fr: "Rejoindre l'aventure !"
        en: "Join the adventure!"
        es: "¡Unirse a la aventura!"

      #------------- Invite Clan ------------------------------------

      invite_clan_title:
        fr: "Par pigeon voyageur"
        en: "By carrier pigeon"
        es: "Por paloma mensajera"

      invite_member_btn:
        fr: "Recruter un aventurier"
        en: "Recruit an adventurer"
        es: "Reclutar un aventurero"

      # Bannière d'appel au recrutement (clan_page/invite_cta), révélée au chef tant que le clan
      # n'a qu'un membre. Elle dit les DEUX choses que le parent ignore : que sa famille doit
      # installer le jeu, et qu'un QR code l'attend ici.
      clan_invite_cta:
        fr: "Ton clan est encore vide !\nFais installer le jeu à ta famille, puis montre-leur ton QR code."
        en: "Your clan is still empty!\nHave your family install the game, then show them your QR code."
        es: "¡Tu clan aún está vacío!\nQue tu familia instale el juego y luego enséñales tu código QR."

      share_invite_btn:
        fr: "Afficher le sceau du clan"
        en: "Display the clan seal"
        es: "Mostrar el sello del clan"

      # Texte du partage d'invitation. Il s'adresse à quelqu'un qui n'a PAS le jeu — sinon on ne
      # l'inviterait pas. « Rejoins mon clan ! » seul ne disait ni de quoi il s'agit, ni qu'il faut
      # installer quelque chose : le destinataire recevait trois mots et une URL qui ne s'ouvre pas.
      share_clan_invite_text:
        fr: "Rejoins mon clan sur Donjons & Savons ! On transforme les corvées de la maison en monstres à abattre : chaque tâche accomplie rapporte de l'XP, et quand le coffre du clan est plein, on ouvre le butin."
        en: "Join my clan on Donjons & Savons! We turn household chores into monsters to defeat: every task earns XP, and when the clan chest is full we open the loot."
        es: "¡Únete a mi clan en Donjons & Savons! Convertimos las tareas de casa en monstruos que derrotar: cada tarea da XP, y cuando el cofre del clan está lleno abrimos el botín."
      # Consigne commune aux deux invitations (QR/lien et lien+code) : l'ordre des opérations, parce
      # que suivre le lien AVANT d'installer le jeu ne produit rien et laisse croire à une panne.
      share_clan_invite_link:
        fr: "Installe d'abord le jeu (lien plus bas), puis ouvre ce lien pour entrer dans le clan :"
        en: "Install the game first (link below), then open this link to enter the clan:"
        es: "Instala primero el juego (enlace abajo) y luego abre este enlace para entrar en el clan:"

      #------------- Invite Clan (à distance, PIN) ------------------------

      invite_clan_pin_title:
        fr: "Invitation à distance"
        en: "Remote invitation"
        es: "Invitación a distancia"

      invite_clan_pin_instructions:
        fr: "Dicte ce code de vive voix à ton invité, puis partage-lui le lien. Le lien seul ne suffit pas : le code est nécessaire pour rejoindre."
        en: "Read this code aloud to your guest, then share the link. The link alone isn't enough: the code is required to join."
        es: "Dicta este código de viva voz a tu invitado y comparte el enlace. El enlace por sí solo no basta: se necesita el código para unirse."

      share_invite_pin_btn:
        fr: "Partager le lien"
        en: "Share the link"
        es: "Compartir el enlace"

      share_clan_invite_pin_text:
        fr: "Rejoins mon clan sur Donjons & Savons ! On transforme les corvées de la maison en monstres à abattre. Il te faudra le code à 6 chiffres que je t'ai donné de vive voix."
        en: "Join my clan on Donjons & Savons! We turn household chores into monsters to defeat. You will need the 6-digit code I read out to you."
        es: "¡Únete a mi clan en Donjons & Savons! Convertimos las tareas de casa en monstruos que derrotar. Necesitarás el código de 6 cifras que te dicté."

      # Écran d'invitation à distance, côté chef. Avec le QR il est dans la pièce ; ici non, et
      # personne d'autre ne peut prévenir l'invité que la connexion Google l'attend au bout.
      invite_pin_family_notice:
        fr: "Si tu invites un enfant, préviens son parent : à la fin, l'enfant se connectera avec son compte Google, et un compte surveillé par Family Link demande l'accord d'un parent."
        en: "If you are inviting a child, warn their parent: at the end, the child signs in with their Google account, and an account supervised by Family Link needs a parent's approval."
        es: "Si invitas a un niño, avisa a su padre o madre: al final, el niño se conectará con su cuenta de Google, y una cuenta supervisada por Family Link necesita la aprobación de un adulto."

      enter_invite_pin_title:
        fr: "Rejoindre avec un code"
        en: "Join with a code"
        es: "Unirse con un código"

      enter_invite_pin_token_hint:
        fr: "Colle ici le lien reçu"
        en: "Paste the link you received"
        es: "Pega aquí el enlace recibido"

      enter_invite_pin_pin_hint:
        fr: "Code à 6 chiffres"
        en: "6-digit code"
        es: "Código de 6 cifras"

      enter_invite_pin_confirm:
        fr: "Rejoindre"
        en: "Join"
        es: "Unirse"

      pin_wrong:
        fr: "Code incorrect ou lien expiré"
        en: "Wrong code or expired link"
        es: "Código incorrecto o enlace caducado"

      # Invitation émise dans une autre région de stockage. Le lien est valide, mais le clan
      # n'existe pas dans la région du candidat et rien ne circule d'une région à l'autre.
      invite_wrong_region:
        fr: "Ce clan est gardé dans une autre contrée du monde. Pour le rejoindre, il faut avoir choisi la même contrée que lui au tout début de l'aventure."
        en: "This clan is kept in another land. To join it, you must have chosen the same land as it did at the very start of the adventure."
        es: "Este clan se guarda en otra tierra. Para unirte a él, debes haber elegido la misma tierra que él al comienzo de la aventura."

      #------------- Accept Join Clan ------------------------------------

      accept_request_clan_title:
        fr: "Toc toc !"
        en: "Knock knock!"
        es: "¡Toc toc!"

      accept_request_title:
        fr: "Un aventurier frappe à ta porte !"
        en: "An adventurer is knocking at your door!"
        es: "¡Un aventurero llama a tu puerta!"

      accept_request_confirm:
        fr: "Qu'il entre, il est des nôtres !"
        en: "Let them in, they are one of us!"
        es: "¡Que entre, es uno de los nuestros!"

      accept_request_reject:
        fr: "Qu'il retourne d'où il vient ce gueux !"
        en: "Send this wretch back where they came from!"
        es: "¡Que vuelva de donde vino este pordiosero!"

      #------------- Dashboard (écran "home") ------------------------------------

      dashboard:
        fr: "L'aventure commence..."
        en: "The journey begins..."
        es: "La aventura comienza..."

      Boutique:
        fr: "Boutique"
        en: "Shop"
        es: "Tienda"

      Clan:
        fr: "Clan"
        en: "Clan"
        es: "Clan"

      Combat:
        fr: "Au ménage !"
        en: "Time to clean !"
        es: "A limpiar !"

      Personnage:
        fr: "Moi"
        en: "Me"
        es: "Yo"

      Items:
        fr: "Items"
        en: "Items"
        es: "Items"

      #------------- Dashboard Splashes ------------------------------------

      created_clan_splash:
        fr: "Longue vie\n@@@session.clan.name@@@ !!!"
        en: "Long live\n@@@session.clan.name@@@ !!!"
        es: "¡Larga vida\n@@@session.clan.name@@@ !!!"

      joined_clan_splash:
        fr: "Bienvenue chez\n@@@session.clan.name@@@ !!!"
        en: "Welcome to\n@@@session.clan.name@@@ !!!"
        es: "¡Bienvenido a\n@@@session.clan.name@@@ !!!"

      new_member_notif:
        fr: "Un nouvel aventurier a rejoint l'aventure ! Faites place à {name} ! La poussière tremble déjà."
        en: "A new adventurer has joined the quest! Make way for {name}! The dust is already trembling."
        es: "¡Un nuevo aventurero se ha unido a la aventura! ¡Abrid paso a {name}! El polvo ya tiembla."

      # Notification « boss » : envoyée à tout le clan quand un chef recommande une tâche (worker._notifyClanBoss).
      boss_notif:
        fr: "Un boss vient d'apparaître ! Celui qui le vaincra aura des XP extra !"
        en: "A boss has appeared! Whoever defeats it will earn extra XP!"
        es: "¡Ha aparecido un jefe! ¡Quien lo derrote ganará XP extra!"

      #------------- Dépôt dans le coffre du butin (notif clan) ------
      # Envoyée à tout le clan, admins compris, sauf à celui qui dépose (worker._notifyClanChest).
      # Le message est `chest_notif`, éventuellement SUIVI d'un des deux suffixes — collé à la fin
      # après une espace, jamais inséré au milieu. Le suffixe dépend de la valeur déposée comparée
      # à la moyenne des 20 derniers butins ouverts (seuils worker.chest_low_pct/chest_high_pct) :
      # aucun historique = aucun suffixe, le message part nu.
      chest_notif:
        fr: "Le Big Boss du niveau a encore fait des ravages, j'entends d'ici l'argent sonnant et trébuchant qu'il ajoute dans son coffre !"
        en: "The level's Big Boss has been wreaking havoc again — I can hear the coins jingling as he drops them into his chest!"
        es: "¡El Gran Jefe del nivel ha vuelto a hacer estragos, ya oigo desde aquí el dinero contante y sonante que echa en su cofre!"
      chest_notif_low:
        fr: "Pas de quoi fouetter un chat..."
        en: "Nothing to write home about..."
        es: "No es para tanto..."
      chest_notif_high:
        fr: "La légende dit que c'est un trésor exceptionnel !"
        en: "Legend says this is an exceptional treasure!"
        es: "¡La leyenda dice que es un tesoro excepcional!"
      # Notif spéciale d'un chef qui dépose une NOTE (worker.on_butin_note_ok) : même canal que
      # le dépôt d'un objet/d'argent, mais sans rien dévoiler — c'est justement le principe.
      chest_notif_note:
        fr: "Une surprise vous attend dans le coffre du clan !"
        en: "A surprise is waiting for you in the clan's chest!"
        es: "¡Una sorpresa os espera en el cofre del clan!"

      #------------- Promotion chef de clan (notif au promu / au clan) ------
      # {name} = nom du joueur promu. Substitution faite en code (worker._notifyChiefPromotion).
      promote_chief_self:
        fr: "Les anciens ont reconnu ta valeur, tu es maintenant chef de clan !"
        en: "The elders have recognized your worth — you are now a clan chief!"
        es: "¡Los ancianos han reconocido tu valía: ahora eres jefe del clan!"
      promote_chief_clan:
        fr: "{name} a prouvé sa valeur et ouvert la voie des anciens, il est maintenant chef de clan !"
        en: "{name} has proven their worth and walked the path of the elders — now a clan chief!"
        es: "¡{name} ha demostrado su valía y abierto la senda de los ancianos: ahora es jefe del clan!"

      #------------- Montée de niveau (notif clan + célébration) ------
      # {name} = nom du joueur qui monte, {level} = nouveau niveau, {title} = titre débloqué.
      # Substitutions faites en code (worker._notifyClanLevelUp / _showLevelUpAnimation).
      levelup_notif:
        fr: "{name} a monté de niveau ! La poussière tremble."
        en: "{name} has leveled up! The dust trembles."
        es: "¡{name} ha subido de nivel! El polvo tiembla."
      levelup_notif_title:
        fr: "{name} a monté de niveau ! Il peut maintenant prétendre au titre de {title}."
        en: "{name} has leveled up! They can now claim the title of {title}."
        es: "¡{name} ha subido de nivel! ¡Ahora puede reclamar el título de {title}!"
      levelup_anim:
        fr: "Félicitations aventurier ! Tu es maintenant niveau {level} ! La poussière tremble sous tes pas."
        en: "Congratulations adventurer! You are now level {level}! The dust trembles beneath your feet."
        es: "¡Felicidades aventurero! ¡Ahora eres nivel {level}! El polvo tiembla bajo tus pies."
      levelup_anim_title:
        fr: "Félicitations aventurier ! Tu es maintenant niveau {level} ! Tu peux prétendre au titre de {title}."
        en: "Congratulations adventurer! You are now level {level}! You can claim the title of {title}."
        es: "¡Felicidades aventurero! ¡Ahora eres nivel {level}! ¡Puedes reclamar el título de {title}!"
      # Message de l'animation "cadeau d'XP de la guilde" (worker._showGiftAnimation) : affiché en
      # noir, entouré d'une pluie de "XP" rouges ajoutée par le worker.
      giftxp_anim:
        fr: "Un petit coup de main de la guilde... chut... c'est un secret"
        en: "A little help from the guild... shh... it's a secret"
        es: "Una pequeña ayuda del gremio... shh... es un secreto"
      # Message de l'animation "cadeau d'or de la guilde" (worker._showGiftGoldAnimation) : affiché
      # en noir sur l'or, {gold} = nombre de pièces reçues, substitué en [[…]] (rouge) par le worker.
      giftgold_anim:
        fr: "{gold} pièces d'or ! (ça ferait beaucoup de bonbons...)"
        en: "{gold} gold coins! (that would buy a lot of candy...)"
        es: "¡{gold} monedas de oro! (eso daría para muchos dulces...)"
      # Message de l'animation d'ouverture du butin (worker._celebrateButin) : affiché en or sur le
      # voile violet pendant l'éclatement du coffre. Le mot encadré [[…]] ressort en magenta.
      butin_anim:
        fr: "Le [[butin]] du clan est ouvert !"
        en: "The clan [[loot]] is open!"
        es: "¡El [[botín]] del clan está abierto!"
      # Écran de récompenses (worker.on_butin_rewards_appear) : titre et liste vide. L'argent n'a pas
      # de phrase à lui, il paraît en tête de liste sous la forme de la bourse. Chaque joueur ne
      # voit QUE sa part.
      butin_rewards_title:
        fr: "Ta part du butin"
        en: "Your share of the loot"
        es: "Tu parte del botín"
      butin_rewards_empty:
        fr: "Pas d'objet pour toi cette fois-ci."
        en: "No item for you this time."
        es: "Ningún objeto para ti esta vez."
      #------------- Notes des chefs, révélées (butin_notes_page) -------------
      # Intercalé entre « ta part du butin » et le conte, seulement si un chef a écrit. Le bouton
      # ne paraît qu'après 10 s de lecture forcée (worker.on_butin_notes_appear).
      butin_notes_title:
        fr: "Un mot de vos chefs"
        en: "A word from your chiefs"
        es: "Unas palabras de vuestros jefes"
      butin_notes_ok:
        fr: "ok"
        en: "ok"
        es: "ok"
      #------------- Le conte du butin (butin_tale_page) -------------
      # Dernière marche de la cérémonie : on propose au clan de raconter ce qu'il vient de vivre.
      # L'icône de partage sous ce texte est montrée à TOUT joueur (l'écran n'a aucun handler
      # d'apparition : rien n'y est posé à chaud, cf. config.yml butin_tale_page).
      butin_tale_title:
        fr: "Partagez votre aventure"
        en: "Share your adventure"
        es: "Comparte su aventura"
      butin_tale_text:
        fr: "Les mérites de votre clan méritent d'être contés."
        en: "Your clan's deeds deserve to be told."
        es: "Las hazañas de vuestro clan merecen ser contadas."
      butin_tale_ok:
        fr: "Plus tard"
        en: "Later"
        es: "Más tarde"
      # L'attaque de bisous. Le jeton @@@name@@@ est substitué par le worker (_prepareButinKiss) et
      # NON résolu par le moteur de traduction : le nom vient de la base, pas de la conf. Le message
      # n'est jamais affiché à celui qu'il nomme.
      butin_kiss:
        fr: "@@@name@@@ était en difficulté. Montrez-lui que vous l'aimez : Attaque de bisous !!!!"
        en: "@@@name@@@ was having a hard time. Show them some love: Kiss attack!!!!"
        es: "@@@name@@@ lo estaba pasando mal. ¡Demostradle que le queréis: ataque de besos!!!!"

      #------------- Cérémonie d'ouverture du butin (butin_open_page) ----------
      # Un seul écran, deux rôles. Le MAÎTRE (le chef qui a touché le coffre plein) lit le rituel ;
      # les JOUEURS, appelés par lui, lisent le récit de la bataille. Le worker choisit le couple
      # texte + bouton selon le rôle.
      opening_title:
        fr: "Ouvrir le butin"
        en: "Open the loot"
        es: "Abrir el botín"
      # Le rituel. C'est le cœur du moment : sans lui l'ouverture n'est qu'un virement.
      opening_master_text:
        fr: "Le moment tant attendu est arrivé ! Il est temps d'ouvrir le coffre et découvrir son contenu. Faites-le bien :\n\n• Réunissez le clan, si possible pour de vrai, dans la même pièce\n• Chacun peut raconter son aventure, ce qu'il a accompli, ce dont il est fier, ce qui a été difficile. Vous pouvez même jouer des rôles\n• Utilisez une tirelire ou un coffre pour y mettre l'argent de poche et l'ouvrir en famille\n• Célébrez votre victoire, posez les écrans et faites un jeu en famille, vous l'avez bien mérité\n• Et celui qui a remporté le moins d'XP gagne un lot de consolation : « tout le monde lui fait un bisou ! »"
        en: "The moment you have been waiting for is here! Time to open the chest and discover what is inside. Do it properly:\n\n• Gather the clan, in the same room if you can\n• Everyone can tell their story: what they achieved, what they are proud of, what was hard. You can even act it out\n• Use a piggy bank or a chest to hold the pocket money, and open it together\n• Celebrate your victory: put the screens down and play a family game, you have earned it\n• And whoever earned the least XP gets a consolation prize: “everyone gives them a kiss!”"
        es: "¡Ha llegado el momento tan esperado! Es hora de abrir el cofre y descubrir lo que hay dentro. Hacedlo bien:\n\n• Reunid al clan, a ser posible de verdad, en la misma habitación\n• Cada uno puede contar su aventura: lo que logró, lo que le enorgullece, lo que le costó. Incluso podéis interpretar papeles\n• Usad una hucha o un cofre para guardar la paga y abridlo en familia\n• Celebrad vuestra victoria: soltad las pantallas y jugad en familia, os lo habéis ganado\n• Y quien haya conseguido menos XP gana un premio de consolación: «¡todos le dan un beso!»"
      opening_master_btn:
        fr: "Prêt ! Ouvrons le coffre !"
        en: "Ready! Let's open the chest!"
        es: "¡Listo! ¡Abramos el cofre!"
      # Le récit, servi aux joueurs appelés par le maître.
      opening_player_text:
        fr: "Le clan s'est bien battu contre la saleté, le désordre et le méchant linge sale. Après une épique bataille, il a vaincu le boss et remporté la victoire — et avec elle... un coffre rempli de pièces et de bijoux !"
        en: "The clan fought well against filth, chaos and the wicked dirty laundry. After an epic battle, it defeated the boss and won the day — and with it... a chest full of coins and jewels!"
        es: "El clan luchó bien contra la suciedad, el desorden y la malvada ropa sucia. Tras una batalla épica, venció al jefe y se llevó la victoria... ¡y con ella un cofre lleno de monedas y joyas!"
      opening_player_btn:
        fr: "J'ouvre le coffre !"
        en: "I'm opening the chest!"
        es: "¡Abro el cofre!"
      # Liste d'attente du maître : jamais vide en pratique (il s'y compte lui-même), mais une liste
      # sans empty_label se dessinerait creuse si le clan se réduisait à lui.
      opening_wait_empty:
        fr: "Personne à attendre."
        en: "Nobody to wait for."
        es: "Nadie a quien esperar."
      # Sous-titre de ligne : ce qu'on attend du joueur, et ce qu'on peut faire d'un absent.
      opening_wait_row:
        fr: "On l'attend... (touchez pour ouvrir sans lui)"
        en: "Waiting for them... (tap to open without them)"
        es: "Le esperamos... (toca para abrir sin él)"
      opening_ready_row:
        fr: "Prêt !"
        en: "Ready!"
        es: "¡Listo!"
      # Notification d'appel à la cérémonie (worker._notifyOpeningCall), envoyée aux joueurs quand le
      # meneur appelle le clan. App ouverte : jamais affichée, elle empile l'écran toute seule
      # (foreground: silent). App fermée : c'est ce texte qui apparaît, et le tap amène au coffre.
      opening_notif:
        fr: "Le clan est appelé : viens ouvrir le coffre !"
        en: "The clan is called: come and open the chest!"
        es: "¡El clan está convocado: ven a abrir el cofre!"
      # Notification de fin de cérémonie (worker._notifyButinReady) : la part de chacun est prête.
      # Même mécanique — silencieuse app ouverte, bandeau app fermée.
      butin_notif:
        fr: "Le coffre est ouvert ! Viens voir ta part du butin."
        en: "The chest is open! Come and see your share of the loot."
        es: "¡El cofre está abierto! Ven a ver tu parte del botín."
      # Naissance du clan (worker._logLine, event ClanCreated) : la première ligne du récit.
      # @@@session.user.name@@@ = le fondateur, {clan} = son nom, {desc} = la description SAISIE
      # À LA CRÉATION (figée dans le log). Deux variantes : sans description pour les clans créés
      # avant que le champ ne soit journalisé — jamais de « {desc} » nu à l'écran.
      log_clan_created:
        fr: "@@@session.user.name@@@ a fondé le clan {clan}. Tout commence ici."
        en: "@@@session.user.name@@@ founded the clan {clan}. It all starts here."
        es: "@@@session.user.name@@@ fundó el clan {clan}. Todo empieza aquí."
      log_clan_created_desc:
        fr: "@@@session.user.name@@@ a fondé le clan {clan} : « {desc} »"
        en: "@@@session.user.name@@@ founded the clan {clan}: \"{desc}\""
        es: "@@@session.user.name@@@ fundó el clan {clan}: «{desc}»"
      # Ligne de récit du journal de clan (worker._logLine, event PlayerLeveledUp).
      # @@@session.user.name@@@ substitué par _resolveDesc ; {level}/{title} substitués en code.
      log_levelup:
        fr: "@@@session.user.name@@@ a atteint le niveau {level} ! La poussière tremble."
        en: "@@@session.user.name@@@ reached level {level}! The dust trembles."
        es: "¡@@@session.user.name@@@ alcanzó el nivel {level}! El polvo tiembla."
      log_levelup_title:
        fr: "@@@session.user.name@@@ a atteint le niveau {level} et peut prétendre au titre de {title} !"
        en: "@@@session.user.name@@@ reached level {level} and can claim the title of {title}!"
        es: "¡@@@session.user.name@@@ alcanzó el nivel {level} y puede reclamar el título de {title}!"
      # Palier de CLAN franchi (event ClanLeveledUp, worker._creditClanXp). Le clan gagne l'item
      # titre, il ne le porte pas — un chef doit l'appliquer. {level}/{title} substitués en code.
      log_clan_levelup:
        fr: "Le clan a atteint le niveau {level} et peut prétendre au titre de {title} !"
        en: "The clan reached level {level} and can claim the title of {title}!"
        es: "¡El clan alcanzó el nivel {level} y puede reclamar el título de {title}!"
      log_member_left:
        fr: "@@@session.user.name@@@ a quitté le clan."
        en: "@@@session.user.name@@@ left the clan."
        es: "@@@session.user.name@@@ dejó el clan."
      # --- Vie de la cotisation, racontée au journal du clan ------------------
      # (worker_log._logLine, événements Store* écrits par worker_store._logStoreEvent).
      # Ces lignes ont remplacé l'écran « Mes achats » : le clan lit son histoire
      # commerciale au même endroit que le reste de son histoire.
      #
      # Ton du reste du jeu — elles sont lues par des ENFANTS. Aucun montant, aucun
      # nom de produit (« ddust_clan » ne veut rien dire pour une famille), et
      # surtout aucun reproche sur les incidents de paiement : ni dette, ni retard,
      # ni menace. La porte reste ouverte, toujours.
      log_store_subscription:
        fr: "Le clan a rejoint la guilde : le donjon s'ouvre à toute la troupe !"
        en: "The clan joined the guild: the dungeon opens to the whole troop!"
        es: "El clan se unió al gremio: ¡la mazmorra se abre a toda la tropa!"
      log_store_purchase:
        fr: "Le clan s'est procuré un nouvel équipement auprès du marchand."
        en: "The clan acquired new gear from the merchant."
        es: "El clan consiguió un nuevo equipo del mercader."
      log_store_renewed:
        fr: "La cotisation de guilde a été reconduite pour la période à venir."
        en: "The guild dues were renewed for the coming period."
        es: "La cuota de gremio se renovó para el próximo período."
      log_store_tier_changed:
        fr: "Le clan a changé de rang dans la guilde."
        en: "The clan changed rank within the guild."
        es: "El clan cambió de rango en el gremio."
      log_store_ended:
        fr: "Le clan a quitté la guilde. La porte du donjon reste ouverte."
        en: "The clan left the guild. The dungeon door stays open."
        es: "El clan dejó el gremio. La puerta de la mazmorra sigue abierta."
      log_store_payment_default:
        fr: "Le dragon de la banque a sommeillé : la cotisation n'est pas arrivée."
        en: "The bank dragon dozed off: the dues didn't come through."
        es: "El dragón del banco se durmió: la cuota no llegó."
      log_store_payment_recovered:
        fr: "La cotisation est repartie : le dragon de la banque s'est rendormi."
        en: "The dues are flowing again: the bank dragon went back to sleep."
        es: "La cuota vuelve a fluir: el dragón del banco se durmió de nuevo."
      log_store_locked:
        fr: "Le clan s'est mis au repos. Il pourra reprendre l'aventure quand il voudra."
        en: "The clan went to rest. It can pick the adventure back up whenever it likes."
        es: "El clan se puso a descansar. Podrá retomar la aventura cuando quiera."
      # Don d'un objet d'inventaire à un joueur (worker._logLine, event ItemGiven).
      # @@@session.user.name@@@ = le DONNEUR (acteur du log), {item} = l'objet (nom propre ou
      # libellé de son type, résolu dans la langue du LECTEUR), {to} = le destinataire.
      log_item_given:
        fr: "@@@session.user.name@@@ a fait un don généreux de {item} à {to}."
        en: "@@@session.user.name@@@ generously gave {item} to {to}."
        es: "@@@session.user.name@@@ hizo un generoso donativo de {item} a {to}."
      # Suffixe de la ligne d'une tâche RECOMMANDÉE validée (worker._logLine) : sans lui, le
      # journal annonçait un total sans dire d'où venait l'écart avec l'XP habituelle de la tâche.
      # {xp} = ce qui a été réellement crédité, {bonus} = la part due à la recommandation.
      log_task_boss:
        fr: "({xp} XP, dont {bonus} de boss !)"
        en: "({xp} XP, including {bonus} boss bonus!)"
        es: "(¡{xp} XP, de los cuales {bonus} de jefe!)"
      # Ouverture du coffre (worker._logLine, event ButinOpened) : événement de CLAN, sans acteur —
      # aucun @@@session.user.name@@@ ici. {amount} = argent de poche distribué, {items} = objets
      # partagés, {players} = participants. Variante « empty » quand le coffre n'avait pas d'argent.
      # JAMAIS « pièces » : ces lignes nourrissent aussi le conte IA (worker._buildLogStory → `plain`),
      # et le lecteur doit comprendre que la récompense est de l'ARGENT DE POCHE réel, pas de l'or de
      # jeu. Terme repris tel quel de l'item officiel it_t_argent.
      # Unité d'argot agnostique de la devise (balles/bucks/pavos, cf. worker._narrateClanStory) :
      # sans elle, {amount} seul sonnait comme un nombre sans unité, y compris dans le récit de l'IA.
      log_butin_opened:
        fr: "Le coffre s'est ouvert : {amount} balles d'argent de poche et {items} objets partagés entre {players} aventuriers."
        en: "The chest was opened: {amount} bucks of pocket money and {items} items shared among {players} adventurers."
        es: "El cofre se abrió: {amount} pavos de dinero de bolsillo y {items} objetos repartidos entre {players} aventureros."
      log_butin_opened_empty:
        fr: "Le coffre s'est ouvert : {items} objets partagés entre {players} aventuriers."
        en: "The chest was opened: {items} items shared among {players} adventurers."
        es: "El cofre se abrió: {items} objetos repartidos entre {players} aventureros."
      # Tribut versé par un chef : l'argent gagné en jeu, remis pour de vrai. {amount} = la somme.
      # Même règle que log_butin_opened : « argent de poche », jamais « pièces », et même unité
      # d'argot (balles/bucks/pavos) pour que {amount} ne sonne pas comme un nombre nu.
      log_tribute_paid:
        fr: "@@@session.user.name@@@ a touché son tribut : {amount} balles d'argent de poche bien réel."
        en: "@@@session.user.name@@@ collected their tribute: {amount} very real bucks of pocket money."
        es: "@@@session.user.name@@@ cobró su tributo: {amount} pavos de dinero de bolsillo bien real."
      # Boss convoqué par le donjon lui-même (balayage serveur pulse_sweeper), et non
      # recommandé par un chef — celle-là ne passe par personne, d'où la ligne de journal :
      # un bonus d'XP apparu tout seul doit pouvoir se justifier. Événement de CLAN, sans
      # acteur : pas de @@@session.user.name@@@ ici. {task} = l'intitulé de la tâche.
      log_boss_summoned:
        fr: "Un monstre de poussière a surgi du donjon : {task} garde un trésor d'expérience."
        en: "A dust monster rose from the dungeon: {task} now guards a hoard of experience."
        es: "Un monstruo de polvo surgió de la mazmorra: {task} guarda un tesoro de experiencia."

      #------------- La fée -----------------------------------------
      # Elle prend la place d'une monstre-tâche pendant dix minutes, au plus une fois par mois,
      # et PERSONNE n'est prévenu tant qu'elle est là : la trouver EST la récompense. Rien de ce
      # bloc ne s'affiche donc avant que quelqu'un ne l'ait touchée — sauf `fairy_tile`, le
      # libellé sous sa tuile dans le tiroir.
      #
      # Libellé de la tuile : volontairement muet sur ce qu'elle est. Il faut la reconnaître à
      # son image, pas la lire.
      fairy_tile:
        fr: "?"
        en: "?"
        es: "?"

      # Les deux cadeaux, écrits en vert lumineux dans les mains de la fée (fairy_page). Courts
      # par nécessité : ils tiennent dans une main. Le montant n'est JAMAIS annoncé — on choisit
      # une promesse, pas un chiffre.
      fairy_gift_xp_self:
        fr: "De l'expérience\npour toi"
        en: "Experience\nfor you"
        es: "Experiencia\npara ti"
      fairy_gift_xp_other:
        fr: "De l'expérience\npour un autre"
        en: "Experience\nfor another"
        es: "Experiencia\npara otro"
      fairy_gift_xp_clan:
        fr: "De l'expérience\npour tout le clan"
        en: "Experience\nfor the whole clan"
        es: "Experiencia\npara todo el clan"
      fairy_gift_heal_self:
        fr: "La santé\npour toi"
        en: "Health\nfor you"
        es: "Salud\npara ti"
      fairy_gift_heal_other:
        fr: "La santé\npour un autre"
        en: "Health\nfor another"
        es: "Salud\npara otro"
      fairy_gift_heal_clan:
        fr: "La santé\npour tout le clan"
        en: "Health\nfor the whole clan"
        es: "Salud\npara todo el clan"
      fairy_gift_boss:
        fr: "Réveiller\nun boss"
        en: "Wake\na boss"
        es: "Despertar\na un jefe"

      # Notification envoyée à tout le clan SAUF à l'intéressé, une fois le cadeau choisi
      # (worker._notifyClanFairy). {name} = le joueur, substitué en code.
      # Elle ne dit PAS quel cadeau a été pris : c'est le journal du clan qui le raconte.
      fairy_notif:
        fr: "{name} a rencontré une fée !"
        en: "{name} has met a fairy!"
        es: "¡{name} se ha encontrado con un hada!"

      # Journal du clan. {gift} = le libellé du cadeau reçu (les \n des libellés ci-dessus sont
      # remplacés par une espace avant substitution — une ligne de récit ne se coupe pas).
      # L'APPARITION de la fée ne s'écrit jamais au journal : la ligne la trahirait en temps réel
      # à qui l'ouvre. Une fée qui repart sans être touchée ne laisse donc aucune trace.
      log_fairy_gift:
        fr: "Une fée est apparue au détour d'une corvée, et @@@session.user.name@@@ l'a touchée. Elle a offert : {gift}."
        en: "A fairy appeared in the middle of a chore, and @@@session.user.name@@@ reached out. Her gift: {gift}."
        es: "Un hada apareció en plena faena, y @@@session.user.name@@@ la tocó. Su regalo: {gift}."

      # Kebab de la boutique, mode test seulement (store.debug.test_mode). Le bucket de
      # production ne pose pas ce drapeau : l'option n'existe pas chez les joueurs.
      fairy_test:
        fr: "Faire venir la fée"
        en: "Summon the fairy"
        es: "Invocar al hada"
      fairy_test_desc:
        fr: "Banc d'essai : fait apparaître la fée tout de suite, dans un domaine au hasard."
        en: "Test bench: makes the fairy appear right now, in a random domain."
        es: "Banco de pruebas: hace aparecer al hada ahora mismo, en un dominio al azar."

      #------------- Soin (célébration de guérison) ------------------
      # {name} = joueur soigné, {healer} = soigneur — tous deux encadrés [[…]] par le worker
      # (surbrillance). Affichés sur le voile blanc de la scène "heal" (worker._showHealAnimation).
      # healed_by_anim : soigneur identifié (revive_player / resurrect_self via clans_logs).
      healed_by_anim:
        fr: "Ouf {name}, tu viens d'être sauvé par {healer} ! La vie afflue de nouveau."
        en: "Phew {name}, you were just saved by {healer}! Life flows through you once more."
        es: "¡Uf {name}, acabas de ser salvado por {healer}! La vida vuelve a fluir en ti."
      # healed_anim : repli générique quand aucun soigneur n'est identifié (ex. soin par
      # accomplissement d'une tâche qui restaure les PV).
      healed_anim:
        fr: "Ouf {name}, te voilà de nouveau sur pied ! Tes blessures se referment, la vie afflue de nouveau."
        en: "Phew {name}, you're back on your feet! Your wounds close, life flows through you once more."
        es: "¡Uf {name}, ya estás de nuevo en pie! Tus heridas se cierran, la vida vuelve a fluir en ti."


      # ⚠️ Le seul garde-fou contre le clan en double, et il est DÉFINITIF : on ne quitte pas un clan
      # une fois dedans, et le fondateur en reste chef à vie. Deux parents qui créent chacun le leur
      # coupent la famille en deux, avec deux cotisations. Le message dit donc la conséquence, et
      # surtout il indique le bon geste : le second parent ne crée rien, il rejoint et se fait
      # nommer chef — il a alors exactement les mêmes droits.
      confirm_create_clan_msg:
        fr: "Un seul clan par famille !\n\nSi un autre adulte de ton foyer a déjà créé le clan, ne crée pas le tien : rejoins le sien avec son QR code, il te nommera chef de clan et tu auras exactement les mêmes pouvoirs.\n\nOn ne peut pas changer de clan par la suite."
        en: "One clan per family!\n\nIf another adult in your household has already created the clan, do not create yours: join theirs with their QR code and they will make you a clan chief, with exactly the same powers.\n\nYou cannot switch clans afterwards."
        es: "¡Un solo clan por familia!\n\nSi otro adulto de tu hogar ya ha creado el clan, no crees el tuyo: únete al suyo con su código QR y te nombrará jefe de clan, con exactamente los mismos poderes.\n\nDespués no se puede cambiar de clan."
        de: "Nur ein Clan pro Familie!\n\nWenn ein anderer Erwachsener aus deinem Haushalt den Clan schon erstellt hat, erstelle nicht deinen eigenen: Tritt seinem mit seinem QR-Code bei, er ernennt dich zum Clanchef und du hast genau dieselben Befugnisse.\n\nDer Clan kann später nicht gewechselt werden."
        it: "Un solo clan per famiglia!\n\nSe un altro adulto di casa tua ha già creato il clan, non creare il tuo: unisciti al suo con il suo codice QR, ti nominerà capo clan e avrai esattamente gli stessi poteri.\n\nIn seguito non si può cambiare clan."
        pt: "Um só clã por família!\n\nSe outro adulto da tua casa já criou o clã, não cries o teu: junta-te ao dele com o código QR dele, ele nomeia-te chefe de clã e terás exatamente os mesmos poderes.\n\nDepois não é possível mudar de clã."
        br: "Um só clã por família!\n\nSe outro adulto da sua casa já criou o clã, não crie o seu: entre no dele com o QR Code dele, ele nomeia você chefe de clã e você terá exatamente os mesmos poderes.\n\nDepois não é possível mudar de clã."
        nl: "Maar één clan per gezin!\n\nAls een andere volwassene in je huishouden de clan al heeft opgericht, maak dan geen eigen clan: word lid van de zijne met zijn QR-code, hij benoemt je tot clanhoofd en je krijgt precies dezelfde rechten.\n\nJe kunt later niet meer van clan wisselen."

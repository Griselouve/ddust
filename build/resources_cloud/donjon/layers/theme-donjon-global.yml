name: theme-donjon
above: conf
strategy: default
tenant: global
data:
  lang:
    fallback: "fr"
    default: "fr"
    options:
      fr: "Français"
      en: "English"
      es: "Español"
    translations:
      #------------- General ------------------------------------

      application_name:
        fr: "Donjons & Savons"
        en: "Dungeons & Dusting"
        es: "Calabozos & Jabones"

      #------------- Gages de mort (0 PV) ------------------------------------

      gage_01:
        fr: "Que justice soit faite ! Pour t'être laissé avoir par la saleté, le bourreau du donjon va te torturer jusqu'à la mort … de rire\n\nFaire un défi en famille : TU désignes ton bourreau et TU choisis le supplice — chatouilles, grimaces ou blagues. Tu dis « pouce » quand tu veux, et tout s'arrête aussitôt."
        en: "Let justice be done! For letting the filth get the better of you, the dungeon's executioner will torture you to death... from laughing\n\nTake on a family challenge: YOU pick your executioner and YOU pick the torment — tickles, funny faces or jokes. Say \"pax\" whenever you like, and everything stops at once."
        es: "¡Que se haga justicia! Por dejarte vencer por la suciedad, el verdugo del calabozo te torturará hasta morir... de risa\n\nHaz un desafío en familia: TÚ eliges a tu verdugo y TÚ eliges el suplicio: cosquillas, muecas o chistes. Di «pido paz» cuando quieras y todo se detiene al instante."
      gage_02:
        fr: "Tu as grimacé de dégout devant la saleté ? Voyons si tu peux apprendre aux vieux mages à faire la grimace\n\nFaire un défi en famille : tu dois grimacer devant ton clan jusqu'à ce que l'un d'eux rigole."
        en: "Grimacing in disgust at the filth? Let's see if you can teach the old mages how to pull a face\n\nTake on a family challenge: make faces at your clan until one of them laughs."
        es: "¿Hiciste una mueca de asco ante la suciedad? Veamos si puedes enseñar a los viejos magos a hacer muecas\n\nHaz un desafío en familia: haz muecas ante tu clan hasta que alguno se ría."
      gage_03:
        fr: "Pffff…. Tué par des chaussettes… tu as le droit de garder le silence\n\nFaire un défi en famille : chaque membre du clan te dit un mot que tu dois faire deviner aux autres sans parler ni écrire ni signer."
        en: "Pffff.... Killed by socks... you have the right to remain silent\n\nTake on a family challenge: each clan member gives you a word you must get the others to guess, without speaking, writing or signing."
        es: "Pffff.... Muerto por unos calcetines... tienes derecho a guardar silencio\n\nHaz un desafío en familia: cada miembro del clan te da una palabra que debes hacer adivinar a los demás sin hablar, escribir ni hacer señas."
      gage_04:
        fr: "Tu as laissé la saleté se répandre, le monde court à sa perte ! Le clan attend une promesse, pas des excuses !\n\nFaire un défi en famille : une main sur le balai, jure solennellement devant tout le clan réuni une chose que tu feras avant demain soir."
        en: "You let the filth spread, the world is doomed! The clan wants a promise, not excuses!\n\nTake on a family challenge: one hand on the broom, solemnly swear before the whole assembled clan one thing you will do before tomorrow evening."
        es: "¡Dejaste que la suciedad se propagara, el mundo corre a su perdición! ¡El clan espera una promesa, no excusas!\n\nHaz un desafío en familia: con una mano sobre la escoba, jura solemnemente ante todo el clan reunido una cosa que harás antes de mañana por la noche."
      gage_05:
        fr: "Tu dois récupérer tes forces brave aventurier, mais le remède a un goût de chiottes\n\nFaire un défi en famille : le clan prépare UNE potion de soin devant toi, en montrant chaque ingrédient avant de le verser. Goûte, puis devine tout ce qu'il y a dedans."
        en: "You must recover your strength, brave adventurer, but the remedy tastes like crap\n\nTake on a family challenge: the clan brews ONE healing potion in front of you, holding up every ingredient before it goes in. Take a sip, then guess everything that is in it."
        es: "Debes recuperar tus fuerzas, valiente aventurero, pero el remedio sabe fatal\n\nHaz un desafío en familia: el clan prepara UNA poción curativa delante de ti, mostrando cada ingrediente antes de echarlo. Da un sorbo y adivina todo lo que lleva."
      gage_06:
        fr: "Le foyer s'écroule sous le désordre et la saleté. Ça te fait rire morveux ?\n\nFaire un défi en famille : simuler un rire pendant 45 secondes."
        en: "The home is collapsing under mess and filth. Think it's funny, brat?\n\nTake on a family challenge: fake a laugh for 45 seconds."
        es: "El hogar se derrumba bajo el desorden y la suciedad. ¿Te hace gracia, mocoso?\n\nHaz un desafío en familia: simula una risa durante 45 segundos."
      gage_07:
        fr: "Ta frêle armure n'a pas tenu longtemps face aux attaques de linge sale et la poussière venimeuse. Tu dois en trouver une autre.\n\nFaire un défi en famille : faire un défilé en revêtant 3 tenues épiques et drôles."
        en: "Your flimsy armor didn't last long against the assaults of dirty laundry and venomous dust. You must find another.\n\nTake on a family challenge: put on a fashion show wearing 3 epic and funny outfits."
        es: "Tu frágil armadura no aguantó mucho ante los ataques de la ropa sucia y el polvo venenoso. Debes encontrar otra.\n\nHaz un desafío en familia: haz un desfile luciendo 3 atuendos épicos y graciosos."
      gage_08:
        fr: "La prochaine fois qu'une meute de mauvaises hig-hyènes s'approche, ne bouge pas, fais le mort.\n\nFaire un défi en famille : tu ne peux pas rire ni sourire pendant 3 minutes, malgré tout ce que peut faire ton clan."
        en: "Next time a pack of nasty giggle-hyenas comes near, don't move, play dead.\n\nTake on a family challenge: you can't laugh or smile for 3 minutes, whatever your clan does."
        es: "La próxima vez que se acerque una manada de malvadas ji-hienas, no te muevas, hazte el muerto.\n\nHaz un desafío en familia: no puedes reír ni sonreír durante 3 minutos, haga lo que haga tu clan."
      gage_09:
        fr: "C'était une bataille épique ! Il y avait un énorme dragon de linge sale qui crachait du feu et de la saleté partout, j'étais encerclé par des crocomoisi et je n'ai rien pu faire ! …\n\nFaire un défi en famille : raconte une histoire complètement fictive pendant au moins 3 minutes."
        en: "It was an epic battle! There was a huge dragon of dirty laundry spitting fire and filth everywhere, I was surrounded by moldy-crocs and there was nothing I could do! ...\n\nTake on a family challenge: tell a completely made-up story for at least 3 minutes."
        es: "¡Fue una batalla épica! Había un enorme dragón de ropa sucia que escupía fuego y suciedad por todas partes, estaba rodeado de cocodrimohos y no pude hacer nada! ...\n\nHaz un desafío en familia: cuenta una historia totalmente inventada durante al menos 3 minutos."
      gage_10:
        fr: "Il est encore temps de t'échapper du donjon, mais attention il y a des pièges partout. Des pièges verticaux et des pièges horizontaux.\n\nFaire un défi en famille : tu ne peux dire ni oui ni non pendant au moins 3 minutes."
        en: "There's still time to escape the dungeon, but beware, there are traps everywhere. Vertical traps and horizontal traps.\n\nTake on a family challenge: you can't say yes or no for at least 3 minutes."
        es: "Aún estás a tiempo de escapar del calabozo, pero cuidado, hay trampas por todas partes. Trampas verticales y trampas horizontales.\n\nHaz un desafío en familia: no puedes decir ni sí ni no durante al menos 3 minutos."
      gage_11:
        fr: "Pourquoi l'aventurier aime les escaliers ? Parce qu'il adore monter de niveau… sauf toi apparemment.\n\nFaire un défi en famille : raconter des blagues jusqu'à faire rire au moins un membre du clan."
        en: "Why does the adventurer love stairs? Because he loves leveling up... except you, apparently.\n\nTake on a family challenge: tell jokes until at least one clan member laughs."
        es: "¿Por qué al aventurero le gustan las escaleras? Porque le encanta subir de nivel... salvo a ti, por lo visto.\n\nHaz un desafío en familia: cuenta chistes hasta hacer reír al menos a un miembro del clan."
      gage_12:
        fr: "Tu as vu la créature de bien trop près, et te voilà par terre. Au moins, tu sais à quoi elle ressemble.\n\nFaire un défi en famille : dessine en 2 minutes la créature qui t'a vaincu, montre ton chef-d'œuvre, et le clan doit deviner de quelle pièce elle sortait."
        en: "You saw the creature far too close up, and down you went. At least you know what it looks like.\n\nTake on a family challenge: draw in 2 minutes the creature that beat you, show off your masterpiece, and the clan must guess which room it crawled out of."
        es: "Viste a la criatura demasiado de cerca, y ahí estás, por los suelos. Al menos sabes qué aspecto tiene.\n\nHaz un desafío en familia: dibuja en 2 minutos a la criatura que te venció, enseña tu obra maestra y el clan tiene que adivinar de qué habitación salió."
      gage_13:
        fr: "Les murs du donjon renvoient tout ce qu'on leur dit. Toi aussi, maintenant.\n\nFaire un défi en famille : pendant 3 minutes, tu répètes en écho, tout bas, le dernier mot de chaque phrase prononcée par un membre du clan."
        en: "The dungeon walls send back everything said to them. So do you, from now on.\n\nTake on a family challenge: for 3 minutes, echo back in a whisper the last word of every sentence a clan member says."
        es: "Los muros del calabozo devuelven todo lo que se les dice. Tú también, a partir de ahora.\n\nHaz un desafío en familia: durante 3 minutos, repite en voz baja, como un eco, la última palabra de cada frase que diga un miembro del clan."
      gage_14:
        fr: "Un héros tombé n'a plus de titre. Mais rien ne t'empêche d'en distribuer aux autres.\n\nFaire un défi en famille : invente un nom épique à chaque membre du clan — demande-lui son accord, un nom qui ne lui plaît pas ne compte pas — et chacun répond au sien jusqu'à la fin de la journée. Toi, tu gardes ton nom."
        en: "A fallen hero has no title left. Nothing stops you handing titles out to everyone else, though.\n\nTake on a family challenge: invent an epic name for each clan member - ask them first, a name they don't like doesn't count - and each of them answers to theirs until the end of the day. You keep your own name."
        es: "Un héroe caído ya no tiene título. Pero nada te impide repartirlos entre los demás.\n\nHaz un desafío en familia: inventa un nombre épico para cada miembro del clan (pídele permiso, un nombre que no le guste no vale) y cada uno responderá al suyo hasta el final del día. Tú conservas tu nombre."
      gage_15:
        fr: "Tu ne tiens plus bien droit sur tes jambes ? Qu'à cela ne tienne : les crabes du donjon s'en sortent très bien.\n\nFaire un défi en famille : pendant 15 minutes, tu ne te déplaces plus qu'en crabe — sur le côté, jamais de face."
        en: "Not steady on your feet any more? Never mind: the dungeon crabs manage just fine.\n\nTake on a family challenge: for 15 minutes, you only move like a crab - sideways, never facing forward."
        es: "¿Ya no te sostienes derecho? No pasa nada: los cangrejos del calabozo se apañan de maravilla.\n\nHaz un desafío en familia: durante 15 minutos, solo te desplazas como un cangrejo: de lado, nunca de frente."

      #------------- Réalisation des gages (rédemption après soin) -----------
      # Texte dédié décrivant l'accomplissement du gage correspondant (cf. dt_d_ des tâches).
      # @@@session.user.name@@@ = nom du joueur. Non affiché pour l'instant (feature à venir).

      gage_d_01:
        fr: "Le bourreau était choisi, le supplice aussi — et par @@@session.user.name@@@ en personne, qui a tenu bon jusqu'à décider que c'était assez. Après moult accolades et bisous baveux, le clan reprend son protégé sous son aile et repart pour de plus belles aventures."
        en: "The executioner was chosen, and so was the torment - by @@@session.user.name@@@ in person, who held firm right up to deciding that was enough. After many hugs and slobbery kisses, the clan takes its protégé back under its wing and sets off for greater adventures."
        es: "El verdugo estaba elegido, y el suplicio también, por @@@session.user.name@@@ en persona, que aguantó firme hasta decidir que ya bastaba. Tras muchos abrazos y besos babosos, el clan acoge de nuevo a su protegido bajo su ala y parte hacia mayores aventuras."
      gage_d_02:
        fr: "À force de grimaces plus hideuses les unes que les autres, @@@session.user.name@@@ a fini par arracher un fou rire aux vieux mages eux-mêmes. La malédiction est levée : le clan, hilare, accueille de nouveau son champion des affreux visages."
        en: "With one hideous face after another, @@@session.user.name@@@ finally wrung a burst of laughter from the old mages themselves. The curse is lifted: the clan, in stitches, welcomes back its champion of ghastly grimaces."
        es: "A base de muecas cada cual más horrenda, @@@session.user.name@@@ acabó arrancando una carcajada a los mismísimos viejos magos. La maldición se ha roto: el clan, muerto de risa, recibe de nuevo a su campeón de las caras espantosas."
      gage_d_03:
        fr: "Sans un mot, sans un geste écrit, @@@session.user.name@@@ a mimé l'impossible et fait deviner chaque énigme au clan ébahi. Le vœu de silence est rompu par les applaudissements : le donjon rend sa voix — et sa place — à son mime légendaire."
        en: "Not a word, not a written sign — @@@session.user.name@@@ mimed the impossible and got the astonished clan to guess every riddle. The vow of silence breaks under the applause: the dungeon gives its legendary mime back both voice and place."
        es: "Sin una palabra, sin un solo gesto escrito, @@@session.user.name@@@ mimó lo imposible e hizo adivinar cada enigma al clan atónito. El voto de silencio se rompe entre aplausos: el calabozo devuelve a su mimo legendario la voz — y su lugar."
      gage_d_04:
        fr: "Une main sur le balai et l'autre sur le cœur, @@@session.user.name@@@ a prononcé son serment devant le clan réuni — et personne n'a osé rire. Le monde est sauvé d'un cheveu (et de quelques moutons de poussière) : le clan salue son héraut et l'accueille en grande pompe."
        en: "One hand on the broom and the other on their heart, @@@session.user.name@@@ spoke the oath before the assembled clan - and nobody dared laugh. The world is saved by a hair (and a few dust bunnies): the clan hails its herald and welcomes them with great fanfare."
        es: "Con una mano sobre la escoba y la otra en el corazón, @@@session.user.name@@@ pronunció su juramento ante el clan reunido, y nadie se atrevió a reír. El mundo se salva por un pelo (y unas cuantas pelusas): el clan aclama a su heraldo y lo recibe por todo lo alto."
      gage_d_05:
        fr: "Sans broncher (ou presque), @@@session.user.name@@@ a goûté la potion que le clan avait préparée au grand jour, et en a nommé les ingrédients un à un — même celui que personne n'assumait. Les forces reviennent, le teint aussi : le remède a opéré, et le clan porte son survivant en triomphe."
        en: "Without flinching (well, almost), @@@session.user.name@@@ tasted the potion the clan had brewed in plain sight, and named its ingredients one by one - even the one nobody would own up to. Strength returns, and so does the color in their cheeks: the remedy worked, and the clan carries its survivor in triumph."
        es: "Sin pestañear (o casi), @@@session.user.name@@@ probó la poción que el clan había preparado a la vista de todos, y nombró sus ingredientes uno a uno, incluso el que nadie quería reconocer. Las fuerzas vuelven, y el color también: el remedio funcionó, y el clan lleva a su superviviente a hombros."
      gage_d_06:
        fr: "« Ha… ha… HA ! » — quarante-cinq secondes d'un rire aussi forcé qu'héroïque, et @@@session.user.name@@@ a fait fuir le désordre et la morosité. Le foyer se redresse : le clan, conquis, reprend son bouffon courageux dans ses rangs."
        en: "\"Ha... ha... HA!\" — forty-five seconds of a laugh as forced as it was heroic, and @@@session.user.name@@@ chased off the mess and the gloom. The home stands tall again: the clan, won over, takes its brave jester back into its ranks."
        es: "«¡Ja... ja... JA!» — cuarenta y cinco segundos de una risa tan forzada como heroica, y @@@session.user.name@@@ ahuyentó el desorden y la tristeza. El hogar se yergue de nuevo: el clan, conquistado, recupera a su valiente bufón entre sus filas."
      gage_d_07:
        fr: "Trois tenues plus épiques et loufoques les unes que les autres ont défilé sous les vivats du clan, et @@@session.user.name@@@ s'est trouvé une armure digne de sa légende. Rhabillé de pied en cap, notre aventurier reprend la route, plus flamboyant que jamais."
        en: "Three outfits, each more epic and outlandish than the last, paraded to the clan's cheers, and @@@session.user.name@@@ found armor worthy of the legend. Dressed head to toe, our adventurer hits the road again, more dazzling than ever."
        es: "Tres atuendos, cada cual más épico y estrafalario, desfilaron entre los vítores del clan, y @@@session.user.name@@@ encontró una armadura digna de su leyenda. Vestido de pies a cabeza, nuestro aventurero retoma el camino, más deslumbrante que nunca."
      gage_d_08:
        fr: "Immobile, impassible, insensible aux pires pitreries du clan, @@@session.user.name@@@ a fait le mort trois minutes durant sans esquisser le moindre sourire. Les hig-hyènes déçues sont reparties bredouilles : le clan récupère son plus imperturbable des guerriers."
        en: "Still, stone-faced, immune to the clan's worst antics, @@@session.user.name@@@ played dead for three whole minutes without cracking the faintest smile. The giggle-hyenas slink off empty-handed: the clan reclaims its most unflappable of warriors."
        es: "Inmóvil, impasible, inmune a las peores payasadas del clan, @@@session.user.name@@@ se hizo el muerto durante tres minutos enteros sin esbozar la más mínima sonrisa. Las ji-hienas se marchan con las manos vacías: el clan recupera a su más imperturbable guerrero."
      gage_d_09:
        fr: "Pendant de longues minutes, @@@session.user.name@@@ a tissé une épopée si folle — dragons de linge sale et crocomoisi compris — que le clan en est resté bouche bée. Conteur consacré, notre aventurier regagne sa place au coin du feu sous les acclamations."
        en: "For long minutes, @@@session.user.name@@@ spun a tale so wild — dragons of dirty laundry and moldy-crocs included — that the clan was left speechless. Crowned storyteller, our adventurer reclaims a seat by the fire to roaring applause."
        es: "Durante largos minutos, @@@session.user.name@@@ tejió una epopeya tan disparatada — dragones de ropa sucia y cocodrimohos incluidos — que el clan se quedó boquiabierto. Consagrado narrador, nuestro aventurero recupera su sitio junto al fuego entre aplausos."
      gage_d_10:
        fr: "Slalomant entre les pièges verticaux et horizontaux, @@@session.user.name@@@ a tenu trois minutes sans lâcher le moindre « oui » ni « non ». Sain et sauf à la sortie du donjon, notre finaud est accueilli par un clan admiratif… et un peu jaloux."
        en: "Weaving between the vertical and horizontal traps, @@@session.user.name@@@ held out three minutes without letting slip a single \"yes\" or \"no.\" Safe and sound at the dungeon's exit, our sly one is greeted by an admiring — and slightly jealous — clan."
        es: "Sorteando las trampas verticales y horizontales, @@@session.user.name@@@ aguantó tres minutos sin soltar un solo «sí» ni «no». Sano y salvo a la salida del calabozo, nuestro astuto es recibido por un clan admirado… y un poco celoso."
      gage_d_11:
        fr: "Blague après blague, @@@session.user.name@@@ a fini par décrocher le rire salvateur d'un membre du clan (le calembour sur les escaliers y est sûrement pour quelque chose). Sacré roi du bon mot, notre aventurier remonte enfin de niveau et repart à l'aventure."
        en: "Joke after joke, @@@session.user.name@@@ finally landed the saving laugh from a clan member (the stairs pun surely helped). Crowned king of the punchline, our adventurer levels up at last and heads back out on the adventure."
        es: "Chiste tras chiste, @@@session.user.name@@@ acabó arrancando la risa salvadora de un miembro del clan (el juego de palabras con las escaleras algo tuvo que ver). Coronado rey del chascarrillo, nuestro aventurero por fin sube de nivel y vuelve a la aventura."
      gage_d_12:
        fr: "Deux minutes de crayon auront suffi : la créature qui avait terrassé @@@session.user.name@@@ trône désormais sur le papier, avec bien trop de dents pour être honnête. Le clan a deviné d'où elle sortait, et son artiste revient parmi les vivants sous les applaudissements."
        en: "Two minutes of pencil work was all it took: the creature that had felled @@@session.user.name@@@ now sits enthroned on paper, with far too many teeth to be honest. The clan guessed where it came from, and its artist returns among the living to applause."
        es: "Bastaron dos minutos de lápiz: la criatura que había derribado a @@@session.user.name@@@ reina ahora sobre el papel, con demasiados dientes para ser honesta. El clan adivinó de dónde salió, y su artista vuelve entre los vivos entre aplausos."
      gage_d_13:
        fr: "Trois minutes durant, @@@session.user.name@@@ a renvoyé au clan chacun de ses derniers mots, tout bas, jusqu'à ce que plus personne n'ose finir une phrase. L'écho s'est tu, le donjon a rendu son prisonnier, et le clan le ramène chez les vivants."
        en: "For three minutes @@@session.user.name@@@ whispered the clan's every last word back at it, until nobody dared finish a sentence any more. The echo fell silent, the dungeon gave up its prisoner, and the clan brings them back among the living."
        es: "Durante tres minutos, @@@session.user.name@@@ le devolvió al clan cada una de sus últimas palabras, en voz baja, hasta que ya nadie se atrevía a terminar una frase. El eco calló, el calabozo soltó a su prisionero, y el clan lo trae de vuelta entre los vivos."
      gage_d_14:
        fr: "Le grimoire est rempli : chaque membre du clan porte désormais le titre que @@@session.user.name@@@ lui a taillé sur mesure, et qu'il a accepté de bon cœur. Une journée entière à répondre à ces noms-là, et le clan, rebaptisé de pied en cap, ramène son parrain parmi les vivants."
        en: "The grimoire is full: every clan member now bears the title @@@session.user.name@@@ tailored for them, and gladly agreed to. A whole day answering to those names, and the clan, renamed from head to toe, brings its name-giver back among the living."
        es: "El grimorio está lleno: cada miembro del clan lleva ahora el título que @@@session.user.name@@@ le hizo a medida, y que aceptó de buen grado. Un día entero respondiendo a esos nombres, y el clan, rebautizado de arriba abajo, trae de vuelta a su padrino entre los vivos."
      gage_d_15:
        fr: "Un quart d'heure durant, @@@session.user.name@@@ n'a plus traversé une seule pièce autrement que de côté, pinces levées, au grand désarroi des portes trop étroites. Les crabes du donjon saluent leur pair : le clan récupère son aventurier, un peu de travers mais bien vivant."
        en: "For a full quarter of an hour @@@session.user.name@@@ crossed no room except sideways, claws up, to the dismay of every narrow doorway. The dungeon crabs salute one of their own: the clan gets its adventurer back, a little sideways but very much alive."
        es: "Durante un cuarto de hora, @@@session.user.name@@@ no cruzó una sola habitación si no era de lado, con las pinzas en alto, ante la desesperación de las puertas estrechas. Los cangrejos del calabozo saludan a su igual: el clan recupera a su aventurero, algo torcido pero bien vivo."

      # Ajouté automatiquement à la suite de chaque gage (espace + cette phrase),
      # dans le même paragraphe que la consigne « Faire un défi en famille : … ».
      gage_heal:
        fr: "Seulement si tes chefs de clan considèrent que tu as réussi, alors ils pourront te soigner."
        en: "Only if your clan leaders consider that you succeeded will they be able to heal you."
        es: "Solo si tus jefes de clan consideran que lo has conseguido podrán curarte."

      # Bouton de l'écran de mort, réservé à l'admin solo (worker.resurrect_self).
      resurrection:
        fr: "Résurrection"
        en: "Resurrection"
        es: "Resurrección"

      # -- Édition du personnage (avatar + nom) --
      choose_avatar:
        fr: "Choisis ton avatar"
        en: "Choose your avatar"
        es: "Elige tu avatar"


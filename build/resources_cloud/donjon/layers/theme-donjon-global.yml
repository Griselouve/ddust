      # Libellés des PAYS proposés à l'ouverture de session. Ils vivent ici et non
      # dans dvdocuments : le module fournit la mécanique, le catalogue juridique et
      # la clef (`country_<iso>`), mais ne sait pas qu'un pays s'appelle un
      # « royaume » chez nous. Un pays ouvert en plus, c'est une entrée de plus ici —
      # et seulement une fois son corpus légal rédigé, faute de quoi le build
      # refusera d'ouvrir son marché.
      # ⚠ `country_fr` EST LA FRANCE, pas la langue française : le suffixe est un
      #   code PAYS ISO-3166. Le jour où l'Allemagne s'ouvre, ce sera `country_de`,
      #   à traduire dans toutes nos langues — pas seulement en allemand.
      # ⚠ LE PAYS D'ABORD, LE DATACENTER ENTRE PARENTHESES. « Royaume de France » etait
      #   du decor : joli, mais muet sur ce que le choix engage. Ce qu'il engage, c'est
      #   OU VIVRONT LES DONNEES — et c'est precisement ce qu'un joueur a le droit de
      #   savoir avant de choisir, pas apres. Le drapeau affiche a cote est d'ailleurs
      #   celui du DATACENTER (`eu`) et non celui du pays : le libelle le dit maintenant
      #   en toutes lettres, au lieu de laisser croire a un drapeau francais mal dessine.
      #
      #   Le mot « royaume » reste partout ailleurs — titre, question, bandeau : c'est le
      #   monde du jeu. Ici, dans la liste ou l'on tranche, on nomme les choses.
      country_fr:
        fr: "France - serveurs EU"
        en: "France - EU servers"
        es: "Francia - servidores EU"
        de: "Frankreich - EU-Server"
        it: "Francia - server UE"
        pt: "França - servidores UE"
        br: "França - servidores UE"
        nl: "Frankrijk - EU-servers"


        en: "Share the link"
        es: "Compartir el enlace"
        de: "Link teilen"
        it: "Condividi il link"
        pt: "Partilhar a ligação"
        br: "Compartilhar o link"
        nl: "Link delen"

      share_clan_invite_pin_text:
        fr: "Rejoins mon clan sur Donjons & Savons ! On transforme les corvées de la maison en monstres à abattre. Il te faudra le code à 6 chiffres que je t'ai donné de vive voix."
        en: "Join my clan on Donjons & Savons! We turn household chores into monsters to defeat. You will need the 6-digit code I read out to you."
        es: "¡Únete a mi clan en Donjons & Savons! Convertimos las tareas de casa en monstruos que derrotar. Necesitarás el código de 6 cifras que te dicté."
        de: "Tritt meinem Clan in Donjons & Savons bei! Wir verwandeln die Hausarbeiten in Monster, die besiegt werden müssen. Du brauchst den 6-stelligen Code, den ich dir mündlich gesagt habe."
        it: "Unisciti al mio clan su Donjons & Savons! Trasformiamo le faccende di casa in mostri da sconfiggere. Ti servirà il codice a 6 cifre che ti ho detto a voce."
        pt: "Junta-te ao meu clã no Donjons & Savons! Transformamos as tarefas da casa em monstros para derrotar. Vais precisar do código de 6 algarismos que te disse de viva voz."
        br: "Entre no meu clã no Donjons & Savons! Transformamos as tarefas de casa em monstros para derrotar. Você vai precisar do código de 6 dígitos que eu falei para você em voz alta."
        nl: "Word lid van mijn clan in Donjons & Savons! We maken van de klusjes in huis monsters om te verslaan. Je hebt de 6-cijferige code nodig die ik je heb verteld."

      # Écran d'invitation à distance, côté chef. Avec le QR il est dans la pièce ; ici non, et
      # personne d'autre ne peut prévenir l'invité que la connexion Google l'attend, juste avant
      # d'entrer (le mineur se connecte avant d'être admis, depuis le 2026-09-22).
      invite_pin_family_notice:
        fr: "Si tu invites un enfant, préviens son parent : pour entrer, l'enfant se connectera avec son compte Google, et un compte surveillé par Family Link demande l'accord d'un parent."
        en: "If you are inviting a child, warn their parent: to get in, the child signs in with their Google account, and an account supervised by Family Link needs a parent's approval."
        es: "Si invitas a un niño, avisa a su padre o madre: para entrar, el niño se conectará con su cuenta de Google, y una cuenta supervisada por Family Link necesita la aprobación de un adulto."
        de: "Wenn du ein Kind einlädst, sag seinen Eltern Bescheid: Zum Beitreten meldet sich das Kind mit seinem Google-Konto an, und ein von Family Link beaufsichtigtes Konto braucht die Zustimmung eines Elternteils."
        it: "Se inviti un bambino, avvisa un suo genitore: per entrare il bambino accederà con il suo account Google, e un account controllato da Family Link richiede l'approvazione di un genitore."
        pt: "Se convidares uma criança, avisa os pais dela: para entrar, a criança vai iniciar sessão com a sua conta Google, e uma conta supervisionada pelo Family Link precisa da autorização de um dos pais."
        br: "Se você convidar uma criança, avise os pais dela: para entrar no clã, a criança vai fazer login com a conta Google dela, e uma conta supervisionada pelo Family Link precisa da autorização de um dos pais."
        nl: "Als je een kind uitnodigt, waarschuw dan een ouder: om erbij te komen logt het kind in met zijn Google-account, en een account onder toezicht van Family Link heeft toestemming van een ouder nodig."


        es: "¡Felicidades aventurero! ¡Ahora eres nivel {level}! El polvo tiembla bajo tus pies."
        de: "Glückwunsch, Abenteurer! Du bist jetzt auf Stufe {level}! Der Staub zittert unter deinen Schritten."
        it: "Congratulazioni, avventuriero! Ora sei al livello {level}! La polvere trema sotto i tuoi passi."
        pt: "Parabéns, aventureiro! Agora estás no nível {level}! O pó treme sob os teus passos."
        br: "Parabéns, aventureiro! Agora você está no nível {level}! A poeira treme sob seus passos."
        nl: "Gefeliciteerd, avonturier! Je bent nu niveau {level}! Het stof beeft onder je voeten."
      levelup_anim_title:
        fr: "Félicitations aventurier ! Tu es maintenant niveau {level} ! Tu peux prétendre au titre de {title}."
        en: "Congratulations adventurer! You are now level {level}! You can claim the title of {title}."
        es: "¡Felicidades aventurero! ¡Ahora eres nivel {level}! ¡Puedes reclamar el título de {title}!"
        de: "Glückwunsch, Abenteurer! Du bist jetzt auf Stufe {level}! Du kannst den Titel {title} beanspruchen."
        it: "Congratulazioni, avventuriero! Ora sei al livello {level}! Puoi ambire al titolo di {title}."
        pt: "Parabéns, aventureiro! Agora estás no nível {level}! Podes reclamar o título de {title}."
        br: "Parabéns, aventureiro! Agora você está no nível {level}! Você pode reivindicar o título de {title}."
        nl: "Gefeliciteerd, avonturier! Je bent nu niveau {level}! Je mag nu de titel {title} dragen."
      # Message de l'animation "cadeau d'XP de la guilde" (worker._showGiftAnimation) : affiché en
      # noir, entouré d'une pluie de "XP" rouges ajoutée par le worker.
      giftxp_anim:
        fr: "Un petit coup de main de la guilde... chut... c'est un secret"
        en: "A little help from the guild... shh... it's a secret"
        es: "Una pequeña ayuda del gremio... shh... es un secreto"
        de: "Ein kleiner Schubs von der Gilde... pssst... das ist ein Geheimnis"
        it: "Un piccolo aiuto dalla gilda... sst... è un segreto"
        pt: "Uma pequena ajuda da guilda... chiu... é segredo"
        br: "Uma pequena ajuda da guilda... psiu... é segredo"
        nl: "Een handje hulp van het gilde... sst... het is een geheim"
      # Message de l'animation "cadeau d'or de la guilde" (worker._showGiftGoldAnimation) : affiché
      # en noir sur l'or, {gold} = nombre de pièces reçues, substitué en [[…]] (rouge) par le worker.
      giftgold_anim:
        fr: "{gold} pièces d'or ! (ça ferait beaucoup de bonbons...)"
        en: "{gold} gold coins! (that would buy a lot of candy...)"
        es: "¡{gold} monedas de oro! (eso daría para muchos dulces...)"
        de: "{gold} Goldmünzen! (Das wären ganz schön viele Süßigkeiten...)"
        it: "{gold} monete d'oro! (Sarebbero un sacco di caramelle...)"
        pt: "{gold} moedas de ouro! (Dava para muitos rebuçados...)"
        br: "{gold} moedas de ouro! (Dava para comprar muita bala...)"
        nl: "{gold} goudstukken! (Dat zijn een hoop snoepjes...)"
      # Message de l'animation d'ouverture du butin (worker._celebrateButin) : affiché en or sur le
      # voile violet pendant l'éclatement du coffre. Le mot encadré [[…]] ressort en magenta.
      butin_anim:
        fr: "Le [[butin]] du clan est ouvert !"
        en: "The clan [[loot]] is open!"
        es: "¡El [[botín]] del clan está abierto!"
        de: "Die [[Beute]] des Clans ist offen!"
        it: "Il [[bottino]] del clan è aperto!"
        pt: "O [[espólio]] do clã está aberto!"
        br: "O [[tesouro]] do clã está aberto!"
        nl: "De [[buit]] van de clan is open!"
      # Écran de récompenses (worker.on_butin_rewards_appear) : titre et liste vide. L'argent n'a pas
      # de phrase à lui, il paraît en tête de liste sous la forme de la bourse. Chaque joueur ne
      # voit QUE sa part.
      butin_rewards_title:
        fr: "Ta part du butin"
        en: "Your share of the loot"
        es: "Tu parte del botín"
        de: "Dein Anteil an der Beute"
        it: "La tua parte del bottino"
        pt: "A tua parte do espólio"
        br: "Sua parte do tesouro"
        nl: "Jouw deel van de buit"
      butin_rewards_empty:
        fr: "Pas d'objet pour toi cette fois-ci."
        en: "No item for you this time."
        es: "Ningún objeto para ti esta vez."
        de: "Diesmal kein Gegenstand für dich."
        it: "Nessun oggetto per te questa volta."
        pt: "Nenhum objeto para ti desta vez."
        br: "Nenhum objeto para você desta vez."
        nl: "Deze keer geen voorwerp voor jou."
      #------------- Notes des chefs, révélées (butin_notes_page) -------------
      # Intercalé entre « ta part du butin » et le conte, seulement si un chef a écrit. Le bouton
      # ne paraît qu'après 10 s de lecture forcée (worker.on_butin_notes_appear).
      butin_notes_title:
        fr: "Un mot de vos chefs de clan"
        en: "A word from your clan chiefs"
        es: "Unas palabras de vuestros jefes de clan"
        de: "Ein Wort eurer Clanchefs"
        it: "Una parola dai vostri capi clan"
        pt: "Uma palavra dos vossos chefes de clã"
        br: "Uma palavra dos seus chefes de clã"
        nl: "Een woordje van jullie clanhoofden"
      butin_notes_ok:
        fr: "ok"
        en: "ok"
        es: "ok"
        de: "ok"
        it: "ok"
        pt: "ok"
        br: "ok"
        nl: "ok"
      #------------- Le conte du butin (butin_tale_page) -------------
      # Dernière marche de la cérémonie : on propose au clan de raconter ce qu'il vient de vivre.
      # L'icône de partage sous ce texte est montrée à TOUT joueur (l'écran n'a aucun handler
      # d'apparition : rien n'y est posé à chaud, cf. config.yml butin_tale_page).
      butin_tale_title:
        fr: "Partagez votre aventure"
        en: "Share your adventure"
        es: "Comparte su aventura"
        de: "Teilt euer Abenteuer"
        it: "Condividete la vostra avventura"
        pt: "Partilhem a vossa aventura"
        br: "Compartilhem sua aventura"
        nl: "Deel jullie avontuur"
      butin_tale_text:
        fr: "Les mérites de votre clan méritent d'être contés."
        en: "Your clan's deeds deserve to be told."
        es: "Las hazañas de vuestro clan merecen ser contadas."
        de: "Die Heldentaten eures Clans verdienen es, erzählt zu werden."
        it: "Le imprese del vostro clan meritano di essere raccontate."
        pt: "As proezas do vosso clã merecem ser contadas."
        br: "As proezas do seu clã merecem ser contadas."
        nl: "De heldendaden van jullie clan verdienen het om verteld te worden."
      butin_tale_ok:
        fr: "Plus tard"
        en: "Later"
        es: "Más tarde"
        de: "Später"
        it: "Più tardi"
        pt: "Mais tarde"
        br: "Mais tarde"
        nl: "Later"
      # L'attaque de bisous. Les jetons @@@name@@@, @@@name1@@@ et @@@name2@@@ sont substitués par le
      # worker (_prepareButinKiss) et NON résolus par le moteur de traduction : les noms viennent de
      # la base, pas de la conf. Le message n'est jamais affiché à AUCUN de ceux qu'il nomme.
      # ⚠ DEUX NOMS DEPUIS LE 2026-09-24 (_kissTargets) : le joueur qui a le moins contribué et un
      #   autre tiré au sort, dans un ordre tiré au sort. Un seul nom désigné à chaque coffre se
      #   lisait comme une dernière place. `butin_kiss` ne sert plus qu'au clan qui ne compte qu'un
      #   joueur éligible. Les deux textes parlent de difficultés, jamais de perdants.
      butin_kiss:
        fr: "@@@name@@@ était en difficulté. Montrez-lui que vous l'aimez : Attaque de bisous !!!!"
        en: "@@@name@@@ was having a hard time. Show them some love: Kiss attack!!!!"
        es: "@@@name@@@ lo estaba pasando mal. ¡Demostradle que le queréis: ataque de besos!!!!"
        de: "@@@name@@@ hatte es schwer. Zeigt eure ganze Liebe: Kussattacke!!!!"
        it: "@@@name@@@ era in difficoltà. Mostrate tutto il vostro affetto: attacco di baci!!!!"
        pt: "@@@name@@@ estava a passar um mau bocado. Mostrem todo o vosso carinho: ataque de beijinhos!!!!"
        br: "@@@name@@@ estava passando por um momento difícil. Mostrem todo o carinho de vocês: ataque de beijinhos!!!!"
        nl: "@@@name@@@ had het moeilijk. Laat jullie liefde zien: kusjesaanval!!!!"
      butin_kiss_two:
        fr: "@@@name1@@@ et @@@name2@@@ étaient en difficulté. Montrez-leur que vous les aimez : Attaque de bisous !!!!"
        en: "@@@name1@@@ and @@@name2@@@ were having a hard time. Show them some love: Kiss attack!!!!"
        es: "@@@name1@@@ y @@@name2@@@ lo estaban pasando mal. ¡Demostradles que les queréis: ataque de besos!!!!"
        de: "@@@name1@@@ und @@@name2@@@ hatten es schwer. Zeigt ihnen eure ganze Liebe: Kussattacke!!!!"
        it: "@@@name1@@@ e @@@name2@@@ erano in difficoltà. Mostrate loro tutto il vostro affetto: attacco di baci!!!!"
        pt: "@@@name1@@@ e @@@name2@@@ estavam a passar um mau bocado. Mostrem-lhes todo o vosso carinho: ataque de beijinhos!!!!"
        br: "@@@name1@@@ e @@@name2@@@ estavam passando por um momento difícil. Mostrem todo o carinho de vocês: ataque de beijinhos!!!!"
        nl: "@@@name1@@@ en @@@name2@@@ hadden het moeilijk. Laat ze jullie liefde zien: kusjesaanval!!!!"

      #------------- Cérémonie d'ouverture du butin (butin_open_page) ----------
      # Un seul écran, deux rôles. Le MAÎTRE (le chef qui a touché le coffre plein) lit le rituel ;
      # les JOUEURS, appelés par lui, lisent le récit de la bataille. Le worker choisit le couple
      # texte + bouton selon le rôle.
      opening_title:
        fr: "Ouvrir le butin"
        en: "Open the loot"
        es: "Abrir el botín"
        de: "Beute öffnen"
        it: "Apri il bottino"
        pt: "Abrir o espólio"
        br: "Abrir o tesouro"
        nl: "Buit openen"
      # Le rituel. C'est le cœur du moment : sans lui l'ouverture n'est qu'un virement.
      opening_master_text:
        fr: "Le moment tant attendu est arrivé ! Il est temps d'ouvrir le coffre et découvrir son contenu. Faites-le bien :\n\n• Réunissez le clan, si possible pour de vrai, dans la même pièce\n• Chacun peut raconter son aventure, ce qu'il a accompli, ce dont il est fier, ce qui a été difficile. Vous pouvez même jouer des rôles\n• Utilisez une tirelire ou un coffre pour y mettre l'argent de poche et l'ouvrir en famille\n• Célébrez votre victoire, posez les écrans et faites un jeu en famille, vous l'avez bien mérité\n• Et celui qui a remporté le moins d'XP gagne un lot de consolation : « tout le monde lui fait un bisou ! »"
        en: "The moment you have been waiting for is here! Time to open the chest and discover what is inside. Do it properly:\n\n• Gather the clan, in the same room if you can\n• Everyone can tell their story: what they achieved, what they are proud of, what was hard. You can even act it out\n• Use a piggy bank or a chest to hold the pocket money, and open it together\n• Celebrate your victory: put the screens down and play a family game, you have earned it\n• And whoever earned the least XP gets a consolation prize: “everyone gives them a kiss!”"
        es: "¡Ha llegado el momento tan esperado! Es hora de abrir el cofre y descubrir lo que hay dentro. Hacedlo bien:\n\n• Reunid al clan, a ser posible de verdad, en la misma habitación\n• Cada uno puede contar su aventura: lo que logró, lo que le enorgullece, lo que le costó. Incluso podéis interpretar papeles\n• Usad una hucha o un cofre para guardar la paga y abridlo en familia\n• Celebrad vuestra victoria: soltad las pantallas y jugad en familia, os lo habéis ganado\n• Y quien haya conseguido menos XP gana un premio de consolación: «¡todos le dan un beso!»"
        de: "Der lang ersehnte Moment ist da! Zeit, die Truhe zu öffnen und zu entdecken, was drin ist. Macht es richtig:\n\n• Versammelt den Clan, am besten wirklich zusammen im selben Raum\n• Jeder kann sein Abenteuer erzählen: was er geschafft hat, worauf er stolz ist, was schwer war. Ihr könnt es sogar nachspielen\n• Nehmt ein Sparschwein oder eine Truhe für das Taschengeld und öffnet sie gemeinsam\n• Feiert euren Sieg: Legt die Bildschirme weg und spielt ein Familienspiel, ihr habt es euch verdient\n• Und wer die wenigsten XP geholt hat, bekommt einen Trostpreis: „Alle geben ihm einen Kuss!“"
        it: "Il momento tanto atteso è arrivato! È ora di aprire lo scrigno e scoprire cosa contiene. Fatelo bene:\n\n• Riunite il clan, se possibile davvero, nella stessa stanza\n• Ognuno può raccontare la sua avventura: cosa ha fatto, di cosa va fiero, cosa è stato difficile. Potete anche recitare dei ruoli\n• Usate un salvadanaio o uno scrigno per metterci la paghetta e apritelo in famiglia\n• Festeggiate la vostra vittoria: mettete via gli schermi e fate un gioco in famiglia, ve lo siete meritato\n• E chi ha ottenuto meno XP vince un premio di consolazione: «tutti gli danno un bacio!»"
        pt: "Chegou o momento tão esperado! Está na hora de abrir o baú e descobrir o que tem lá dentro. Façam-no bem:\n\n• Reúnam o clã, se possível a sério, na mesma divisão\n• Cada um pode contar a sua aventura: o que conseguiu, do que se orgulha, o que foi difícil. Podem até fazer teatro\n• Usem um mealheiro ou um baú para guardar a mesada e abram-no em família\n• Celebrem a vossa vitória: pousem os ecrãs e façam um jogo em família, vocês merecem\n• E quem ganhou menos XP recebe um prémio de consolação: «todos lhe dão um beijinho!»"
        br: "Chegou o momento tão esperado! Está na hora de abrir o baú e descobrir o que tem dentro. Façam isso direito:\n\n• Reúnam o clã, se possível de verdade, no mesmo cômodo\n• Cada um pode contar sua aventura: o que conseguiu, do que se orgulha, o que foi difícil. Vocês podem até fazer teatro\n• Usem um cofrinho ou um baú para guardar a mesada e abram em família\n• Comemorem sua vitória: deixem as telas de lado e joguem um jogo em família, vocês merecem\n• E quem ganhou menos XP recebe um prêmio de consolação: \"todo mundo dá um beijinho nele!\""
        nl: "Het langverwachte moment is daar! Tijd om de kist te openen en te ontdekken wat erin zit. Doe het goed:\n\n• Verzamel de clan, het liefst echt samen in dezelfde kamer\n• Iedereen mag zijn avontuur vertellen: wat hij bereikt heeft, waar hij trots op is, wat moeilijk was. Jullie kunnen het zelfs naspelen\n• Gebruik een spaarpot of een kist voor het zakgeld en open die samen\n• Vier jullie overwinning: leg de schermen weg en speel een spelletje met het gezin, jullie hebben het verdiend\n• En wie de minste XP heeft verdiend, krijgt een troostprijs: ‘iedereen geeft hem een kusje!’"
      opening_master_btn:
        fr: "Prêt ! Ouvrons le coffre !"
        en: "Ready! Let's open the chest!"
        es: "¡Listo! ¡Abramos el cofre!"
        de: "Bereit! Öffnen wir die Truhe!"
        it: "Pronti! Apriamo lo scrigno!"
        pt: "Prontos! Vamos abrir o baú!"
        br: "Prontos! Vamos abrir o baú!"
        nl: "Klaar! Open de kist!"
      # Le récit, servi aux joueurs appelés par le maître.
      opening_player_text:
        fr: "Le clan s'est bien battu contre la saleté, le désordre et le méchant linge sale. Après une épique bataille, il a vaincu le boss et remporté la victoire — et avec elle... un coffre rempli de pièces et de bijoux !"
        en: "The clan fought well against filth, chaos and the wicked dirty laundry. After an epic battle, it defeated the boss and won the day — and with it... a chest full of coins and jewels!"
        es: "El clan luchó bien contra la suciedad, el desorden y la malvada ropa sucia. Tras una batalla épica, venció al jefe final y se llevó la victoria... ¡y con ella un cofre lleno de monedas y joyas!"
        de: "Der Clan hat tapfer gegen Dreck, Unordnung und die fiese Schmutzwäsche gekämpft. Nach einer epischen Schlacht hat er den Boss besiegt und den Sieg errungen, und mit ihm... eine Truhe voller Münzen und Juwelen!"
        it: "Il clan ha combattuto bene contro lo sporco, il disordine e il perfido bucato sporco. Dopo un'epica battaglia ha sconfitto il boss e conquistato la vittoria, e con essa... uno scrigno pieno di monete e gioielli!"
        pt: "O clã lutou bem contra a sujidade, a desarrumação e a malvada roupa suja. Depois de uma batalha épica, derrotou o boss e conquistou a vitória, e com ela... um baú cheio de moedas e joias!"
        br: "O clã lutou bem contra a sujeira, a bagunça e a malvada roupa suja. Depois de uma batalha épica, derrotou o boss e conquistou a vitória, e com ela... um baú cheio de moedas e joias!"
        nl: "De clan heeft dapper gevochten tegen vuil, rommel en de gemene vuile was. Na een epische strijd versloeg hij de boss en behaalde de overwinning, en daarmee... een kist vol munten en juwelen!"
      opening_player_btn:
        fr: "J'ouvre le coffre !"
        en: "I'm opening the chest!"
        es: "¡Abro el cofre!"
        de: "Ich öffne die Truhe!"
        it: "Apro lo scrigno!"
        pt: "Eu abro o baú!"
        br: "Eu abro o baú!"
        nl: "Ik open de kist!"
      # Liste d'attente du maître : jamais vide en pratique (il s'y compte lui-même), mais une liste
      # sans empty_label se dessinerait creuse si le clan se réduisait à lui.
      opening_wait_empty:
        fr: "Personne à attendre."
        en: "Nobody to wait for."
        es: "Nadie a quien esperar."
        de: "Niemand, auf den man warten muss."
        it: "Nessuno da aspettare."
        pt: "Ninguém por quem esperar."
        br: "Ninguém para esperar."
        nl: "Niemand om op te wachten."
      # Sous-titre de ligne : ce qu'on attend du joueur, et ce qu'on peut faire d'un absent.
      opening_wait_row:
        fr: "On l'attend... (touchez pour ouvrir sans lui)"
        en: "Waiting for them... (tap to open without them)"
        es: "Le esperamos... (toca para abrir sin él)"
        de: "Wir warten... (tippe, um ohne ihn zu öffnen)"
        it: "Lo aspettiamo... (tocca per aprire senza di lui)"
        pt: "Estamos à espera... (toca para abrir sem ele)"
        br: "Estamos esperando... (toque para abrir sem ele)"
        nl: "We wachten... (tik om zonder hem te openen)"
      opening_ready_row:
        fr: "Prêt !"
        en: "Ready!"
        es: "¡Listo!"
        de: "Bereit!"
        it: "Pronto!"
        pt: "Pronto!"
        br: "Pronto!"
        nl: "Klaar!"
      # Notification d'appel à la cérémonie (worker._notifyOpeningCall), envoyée aux joueurs quand le
      # meneur appelle le clan. App ouverte : jamais affichée, elle empile l'écran toute seule
      # (foreground: silent). App fermée : c'est ce texte qui apparaît, et le tap amène au coffre.
      opening_notif:
        fr: "Le clan est appelé : viens ouvrir le coffre !"
        en: "The clan is called: come and open the chest!"
        es: "¡El clan está convocado: ven a abrir el cofre!"
        de: "Der Clan wird gerufen: Komm und öffne die Truhe!"
        it: "Il clan è convocato: vieni ad aprire lo scrigno!"
        pt: "O clã foi convocado: vem abrir o baú!"
        br: "O clã foi convocado: venha abrir o baú!"
        nl: "De clan wordt opgeroepen: kom de kist openen!"
      # Notification de fin de cérémonie (worker._notifyButinReady) : la part de chacun est prête.
      # Même mécanique — silencieuse app ouverte, bandeau app fermée.
      butin_notif:
        fr: "Le coffre est ouvert ! Viens voir ta part du butin."
        en: "The chest is open! Come and see your share of the loot."
        es: "¡El cofre está abierto! Ven a ver tu parte del botín."
        de: "Die Truhe ist offen! Komm und sieh dir deinen Anteil an der Beute an."
        it: "Lo scrigno è aperto! Vieni a vedere la tua parte del bottino."
        pt: "O baú está aberto! Vem ver a tua parte do espólio."
        br: "O baú está aberto! Venha ver sua parte do tesouro."
        nl: "De kist is open! Kom je deel van de buit bekijken."
      # Naissance du clan (worker._logLine, event ClanCreated) : la première ligne du récit.
      # @@@session.user.name@@@ = le fondateur, {clan} = son nom, {desc} = la description SAISIE
      # À LA CRÉATION (figée dans le log). Deux variantes : sans description pour les clans créés
      # avant que le champ ne soit journalisé — jamais de « {desc} » nu à l'écran.
      log_clan_created:
        fr: "@@@session.user.name@@@ a fondé le clan {clan}. Tout commence ici."
        en: "@@@session.user.name@@@ founded the clan {clan}. It all starts here."
        es: "@@@session.user.name@@@ fundó el clan {clan}. Todo empieza aquí."
        de: "@@@session.user.name@@@ hat den Clan {clan} gegründet. Hier beginnt alles."
        it: "@@@session.user.name@@@ ha fondato il clan {clan}. Tutto comincia qui."
        pt: "@@@session.user.name@@@ fundou o clã {clan}. Tudo começa aqui."
        br: "@@@session.user.name@@@ fundou o clã {clan}. Tudo começa aqui."
        nl: "@@@session.user.name@@@ heeft de clan {clan} gesticht. Hier begint alles."
      log_clan_created_desc:
        fr: "@@@session.user.name@@@ a fondé le clan {clan} : « {desc} »"
        en: "@@@session.user.name@@@ founded the clan {clan}: \"{desc}\""
        es: "@@@session.user.name@@@ fundó el clan {clan}: «{desc}»"
        de: "@@@session.user.name@@@ hat den Clan {clan} gegründet: „{desc}“"
        it: "@@@session.user.name@@@ ha fondato il clan {clan}: «{desc}»"
        pt: "@@@session.user.name@@@ fundou o clã {clan}: «{desc}»"
        br: "@@@session.user.name@@@ fundou o clã {clan}: \"{desc}\""
        nl: "@@@session.user.name@@@ heeft de clan {clan} gesticht: ‘{desc}’"
      # Ligne de récit du journal de clan (worker._logLine, event PlayerLeveledUp).
      # @@@session.user.name@@@ substitué par _resolveDesc ; {level}/{title} substitués en code.
      log_levelup:
        fr: "@@@session.user.name@@@ a atteint le niveau {level} ! La poussière tremble."
        en: "@@@session.user.name@@@ reached level {level}! The dust trembles."
        es: "¡@@@session.user.name@@@ alcanzó el nivel {level}! El polvo tiembla."
        de: "@@@session.user.name@@@ hat Stufe {level} erreicht! Der Staub zittert."
        it: "@@@session.user.name@@@ ha raggiunto il livello {level}! La polvere trema."
        pt: "@@@session.user.name@@@ alcançou o nível {level}! O pó treme."
        br: "@@@session.user.name@@@ alcançou o nível {level}! A poeira treme."
        nl: "@@@session.user.name@@@ heeft niveau {level} bereikt! Het stof beeft."
      log_levelup_title:
        fr: "@@@session.user.name@@@ a atteint le niveau {level} et peut prétendre au titre de {title} !"
        en: "@@@session.user.name@@@ reached level {level} and can claim the title of {title}!"
        es: "¡@@@session.user.name@@@ alcanzó el nivel {level} y puede reclamar el título de {title}!"
        de: "@@@session.user.name@@@ hat Stufe {level} erreicht und darf den Titel {title} beanspruchen!"
        it: "@@@session.user.name@@@ ha raggiunto il livello {level} e può aspirare al titolo di {title}!"
        pt: "@@@session.user.name@@@ alcançou o nível {level} e pode reclamar o título de {title}!"
        br: "@@@session.user.name@@@ alcançou o nível {level} e pode reivindicar o título de {title}!"
        nl: "@@@session.user.name@@@ heeft niveau {level} bereikt en mag de titel {title} opeisen!"
      # Palier de CLAN franchi (event ClanLeveledUp, worker._creditClanXp). Le clan gagne l'item
      # titre, il ne le porte pas — un chef doit l'appliquer. {level}/{title} substitués en code.
      log_clan_levelup:
        fr: "Le clan a atteint le niveau {level} et peut prétendre au titre de {title} !"
        en: "The clan reached level {level} and can claim the title of {title}!"
        es: "¡El clan alcanzó el nivel {level} y puede reclamar el título de {title}!"
        de: "Der Clan hat Stufe {level} erreicht und darf den Titel {title} beanspruchen!"
        it: "Il clan ha raggiunto il livello {level} e può aspirare al titolo di {title}!"
        pt: "O clã alcançou o nível {level} e pode reclamar o título de {title}!"
        br: "O clã alcançou o nível {level} e pode reivindicar o título de {title}!"
        nl: "De clan heeft niveau {level} bereikt en mag de titel {title} opeisen!"
      log_member_left:
        fr: "@@@session.user.name@@@ a quitté le clan."
        en: "@@@session.user.name@@@ left the clan."
        es: "@@@session.user.name@@@ dejó el clan."
        de: "@@@session.user.name@@@ hat den Clan verlassen."
        it: "@@@session.user.name@@@ ha lasciato il clan."
        pt: "@@@session.user.name@@@ saiu do clã."
        br: "@@@session.user.name@@@ saiu do clã."
        nl: "@@@session.user.name@@@ heeft de clan verlaten."
      log_member_claimed:
        fr: "@@@session.user.name@@@ a maintenant son propre téléphone."
        en: "@@@session.user.name@@@ now has their own phone."
        es: "@@@session.user.name@@@ ya tiene su propio teléfono."
        de: "@@@session.user.name@@@ hat jetzt ein eigenes Handy."
        it: "@@@session.user.name@@@ ora ha il suo telefono."
        pt: "@@@session.user.name@@@ já tem o seu próprio telemóvel."
        br: "@@@session.user.name@@@ agora tem o próprio celular."
        nl: "@@@session.user.name@@@ heeft nu een eigen telefoon."
      # --- Vie de la cotisation, racontée au journal du clan ------------------
      # (worker_log._logLine, événements Store* écrits par worker_store._logStoreEvent).
      # Ces lignes ont remplacé l'écran « Mes achats » : le clan lit son histoire
      # commerciale au même endroit que le reste de son histoire.
      #
      # Ton du reste du jeu — elles sont lues par des ENFANTS. Aucun montant, aucun
      # nom de produit (« ddust_clan » ne veut rien dire pour une famille), et
      # surtout aucun reproche sur les incidents de paiement : ni dette, ni retard,
      # ni menace. La porte reste ouverte, toujours.
      log_store_subscription:
        fr: "Le clan a rejoint la guilde : le donjon s'ouvre à toute la troupe !"
        en: "The clan joined the guild: the dungeon opens to the whole troop!"
        es: "El clan se unió al gremio: ¡la mazmorra se abre a toda la tropa!"
        de: "Der Clan ist der Gilde beigetreten: Der Kerker öffnet sich für die ganze Truppe!"
        it: "Il clan si è unito alla gilda: il dungeon si apre a tutta la truppa!"
        pt: "O clã juntou-se à guilda: a masmorra abre-se a toda a tropa!"
        br: "O clã entrou para a guilda: a masmorra se abre para toda a tropa!"
        nl: "De clan is lid geworden van het gilde: de kerker gaat open voor de hele troep!"
      log_store_purchase:
        fr: "Le clan s'est procuré un nouvel équipement auprès du marchand."
        en: "The clan acquired new gear from the merchant."
        es: "El clan consiguió un nuevo equipo del mercader."
        de: "Der Clan hat sich beim Händler neue Ausrüstung besorgt."
        it: "Il clan si è procurato un nuovo equipaggiamento dal mercante."
        pt: "O clã arranjou equipamento novo junto do mercador."
        br: "O clã conseguiu equipamento novo com o mercador."
        nl: "De clan heeft nieuwe uitrusting gekocht bij de koopman."
      log_store_renewed:
        fr: "La cotisation de guilde a été reconduite pour la période à venir."
        en: "The guild dues were renewed for the coming period."
        es: "La cuota de gremio se renovó para el próximo período."
        de: "Der Gildenbeitrag wurde für die kommende Zeit verlängert."
        it: "La quota della gilda è stata rinnovata per il prossimo periodo."
        pt: "A quota da guilda foi renovada para o próximo período."
        br: "A cota da guilda foi renovada para o próximo período."
        nl: "De gildecontributie is verlengd voor de komende periode."
      log_store_tier_changed:
        fr: "Le clan a changé de rang dans la guilde."
        en: "The clan changed rank within the guild."
        es: "El clan cambió de rango en el gremio."
        de: "Der Clan hat seinen Rang in der Gilde gewechselt."
        it: "Il clan ha cambiato grado nella gilda."
        pt: "O clã mudou de posto na guilda."
        br: "O clã mudou de posto na guilda."
        nl: "De clan is van rang veranderd in het gilde."
      log_store_ended:
        fr: "Le clan a quitté la guilde. La porte du donjon reste ouverte."
        en: "The clan left the guild. The dungeon door stays open."
        es: "El clan dejó el gremio. La puerta de la mazmorra sigue abierta."
        de: "Der Clan hat die Gilde verlassen. Die Tür zum Kerker bleibt offen."
        it: "Il clan ha lasciato la gilda. La porta del dungeon resta aperta."
        pt: "O clã saiu da guilda. A porta da masmorra continua aberta."
        br: "O clã saiu da guilda. A porta da masmorra continua aberta."
        nl: "De clan heeft het gilde verlaten. De deur van de kerker blijft open."
      log_store_payment_default:
        fr: "Le dragon de la banque a sommeillé : la cotisation n'est pas arrivée."
        en: "The bank dragon dozed off: the dues didn't come through."
        es: "El dragón del banco se durmió: la cuota no llegó."
        de: "Der Bankdrache ist eingenickt: Der Beitrag ist nicht angekommen."
        it: "Il drago della banca si è appisolato: la quota non è arrivata."
        pt: "O dragão do banco adormeceu: a quota não chegou."
        br: "O dragão do banco adormeceu: a cota não chegou."
        nl: "De bankdraak is ingedommeld: de contributie is niet aangekomen."
      log_store_payment_recovered:
        fr: "La cotisation est repartie : le dragon de la banque s'est rendormi."
        en: "The dues are flowing again: the bank dragon went back to sleep."
        es: "La cuota vuelve a fluir: el dragón del banco se durmió de nuevo."
        de: "Der Beitrag fließt wieder: Der Bankdrache schläft weiter."
        it: "La quota è ripartita: il drago della banca si è riaddormentato."
        pt: "A quota voltou a chegar: o dragão do banco voltou a adormecer."
        br: "A cota voltou a chegar: o dragão do banco adormeceu de novo."
        nl: "De contributie stroomt weer: de bankdraak slaapt weer verder."
      log_store_locked:
        fr: "Le clan s'est mis au repos. Il pourra reprendre l'aventure quand il voudra."
        en: "The clan went to rest. It can pick the adventure back up whenever it likes."
        es: "El clan se puso a descansar. Podrá retomar la aventura cuando quiera."
        de: "Der Clan ruht sich aus. Er kann das Abenteuer fortsetzen, wann immer er will."
        it: "Il clan si è messo a riposo. Potrà riprendere l'avventura quando vorrà."
        pt: "O clã foi descansar. Poderá retomar a aventura quando quiser."
        br: "O clã foi descansar. Poderá retomar a aventura quando quiser."
        nl: "De clan neemt rust. Hij kan het avontuur hervatten wanneer hij maar wil."
      # Don d'un objet d'inventaire à un joueur (worker._logLine, event ItemGiven).
      # @@@session.user.name@@@ = le DONNEUR (acteur du log), {item} = l'objet (nom propre ou
      # libellé de son type, résolu dans la langue du LECTEUR), {to} = le destinataire.
      log_item_given:
        fr: "@@@session.user.name@@@ a fait un don généreux de {item} à {to}."
        en: "@@@session.user.name@@@ generously gave {item} to {to}."
        es: "@@@session.user.name@@@ hizo un generoso donativo de {item} a {to}."
        de: "@@@session.user.name@@@ hat {to} großzügig {item} geschenkt."
        it: "@@@session.user.name@@@ ha generosamente donato {item} a {to}."
        pt: "@@@session.user.name@@@ fez uma oferta generosa de {item} a {to}."
        br: "@@@session.user.name@@@ fez uma oferta generosa de {item} para {to}."
        nl: "@@@session.user.name@@@ heeft {to} gul {item} geschonken."
      # Suffixe de la ligne d'une tâche RECOMMANDÉE validée (worker._logLine) : sans lui, le
      # journal annonçait un total sans dire d'où venait l'écart avec l'XP habituelle de la tâche.
      # {xp} = ce qui a été réellement crédité, {bonus} = la part due à la recommandation.
      log_task_boss:
        fr: "({xp} XP, dont {bonus} de boss !)"
        en: "({xp} XP, including {bonus} boss bonus!)"
        es: "(¡{xp} XP, de los cuales {bonus} por el jefe final!)"
        de: "({xp} XP, davon {bonus} vom Boss!)"
        it: "({xp} XP, di cui {bonus} dal boss!)"
        pt: "({xp} XP, dos quais {bonus} do boss!)"
        br: "({xp} XP, sendo {bonus} do boss!)"
        nl: "({xp} XP, waarvan {bonus} van de boss!)"
      # Ouverture du coffre (worker._logLine, event ButinOpened) : événement de CLAN, sans acteur —
      # aucun @@@session.user.name@@@ ici. {amount} = argent de poche distribué, {items} = objets
      # partagés, {players} = participants. Variante « empty » quand le coffre n'avait pas d'argent.
      # JAMAIS « pièces » : ces lignes nourrissent aussi le conte IA (worker._buildLogStory → `plain`),
      # et le lecteur doit comprendre que la récompense est de l'ARGENT DE POCHE réel, pas de l'or de
      # jeu. Terme repris tel quel de l'item officiel it_t_argent.
      # Unité d'argot agnostique de la devise (balles/bucks/pavos, cf. worker._narrateClanStory) :
      # sans elle, {amount} seul sonnait comme un nombre sans unité, y compris dans le récit de l'IA.
      log_butin_opened:
        fr: "Le coffre s'est ouvert : {amount} balles d'argent de poche et {items} objets partagés entre {players} aventuriers."
        en: "The chest was opened: {amount} bucks of pocket money and {items} items shared among {players} adventurers."
        es: "El cofre se abrió: {amount} pavos de dinero de bolsillo y {items} objetos repartidos entre {players} aventureros."
        de: "Die Truhe wurde geöffnet: {amount} Mäuse Taschengeld und {items} Gegenstände, verteilt unter {players} Abenteurern."
        it: "Lo scrigno si è aperto: {amount} dindini di paghetta e {items} oggetti divisi tra {players} avventurieri."
        pt: "O baú abriu-se: {amount} paus de mesada e {items} objetos repartidos entre {players} aventureiros."
        br: "O baú se abriu: {amount} paus de mesada e {items} objetos repartidos entre {players} aventureiros."
        nl: "De kist is geopend: {amount} pegels zakgeld en {items} voorwerpen verdeeld onder {players} avonturiers."
      log_butin_opened_empty:
        fr: "Le coffre s'est ouvert : {items} objets partagés entre {players} aventuriers."
        en: "The chest was opened: {items} items shared among {players} adventurers."
        es: "El cofre se abrió: {items} objetos repartidos entre {players} aventureros."
        de: "Die Truhe wurde geöffnet: {items} Gegenstände, verteilt unter {players} Abenteurern."
        it: "Lo scrigno si è aperto: {items} oggetti divisi tra {players} avventurieri."
        pt: "O baú abriu-se: {items} objetos repartidos entre {players} aventureiros."
        br: "O baú se abriu: {items} objetos repartidos entre {players} aventureiros."
        nl: "De kist is geopend: {items} voorwerpen verdeeld onder {players} avonturiers."
      # Tribut versé par un chef : l'argent gagné en jeu, remis pour de vrai. {amount} = la somme.
      # Même règle que log_butin_opened : « argent de poche », jamais « pièces », et même unité
      # d'argot (balles/bucks/pavos) pour que {amount} ne sonne pas comme un nombre nu.
      log_tribute_paid:
        fr: "@@@session.user.name@@@ a touché son tribut : {amount} balles d'argent de poche bien réel."
        en: "@@@session.user.name@@@ collected their tribute: {amount} very real bucks of pocket money."
        es: "@@@session.user.name@@@ cobró su tributo: {amount} pavos de dinero de bolsillo bien real."
        de: "@@@session.user.name@@@ hat seinen Tribut kassiert: {amount} Mäuse echtes Taschengeld."
        it: "@@@session.user.name@@@ ha riscosso il suo tributo: {amount} dindini di paghetta vera e propria."
        pt: "@@@session.user.name@@@ recebeu o seu tributo: {amount} paus de mesada bem verdadeira."
        br: "@@@session.user.name@@@ recebeu seu tributo: {amount} paus de mesada de verdade."
        nl: "@@@session.user.name@@@ heeft zijn tribuut geïnd: {amount} pegels echt zakgeld."
      # Boss convoqué par le donjon lui-même (balayage serveur pulse_sweeper), et non
      # recommandé par un chef — celle-là ne passe par personne, d'où la ligne de journal :
      # un bonus d'XP apparu tout seul doit pouvoir se justifier. Événement de CLAN, sans
      # acteur : pas de @@@session.user.name@@@ ici. {task} = l'intitulé de la tâche.
      log_boss_summoned:
        fr: "Un monstre de poussière a surgi du donjon : {task} garde un trésor d'expérience."
        en: "A dust monster rose from the dungeon: {task} now guards a hoard of experience."
        es: "Un monstruo de polvo surgió de la mazmorra: {task} guarda un tesoro de experiencia."
        de: "Ein Staubmonster ist aus dem Kerker aufgetaucht: {task} bewacht einen Erfahrungsschatz."
        it: "Un mostro di polvere è sbucato dal dungeon: {task} custodisce un tesoro di esperienza."
        pt: "Um monstro de pó surgiu da masmorra: {task} guarda um tesouro de experiência."
        br: "Um monstro de poeira surgiu da masmorra: {task} guarda um tesouro de experiência."
        nl: "Een stofmonster is uit de kerker opgedoken: {task} bewaakt een schat aan ervaring."

      #------------- La fée -----------------------------------------
      # Elle prend la place d'une monstre-tâche pendant dix minutes, au plus une fois par mois,
      # et PERSONNE n'est prévenu tant qu'elle est là : la trouver EST la récompense. Rien de ce
      # bloc ne s'affiche donc avant que quelqu'un ne l'ait touchée — sauf `fairy_tile`, le
      # libellé sous sa tuile dans le tiroir.
      #
      # Libellé de la tuile : volontairement muet sur ce qu'elle est. Il faut la reconnaître à
      # son image, pas la lire.
      fairy_tile:
        fr: "?"
        en: "?"
        es: "?"
        de: "?"
        it: "?"
        pt: "?"
        br: "?"
        nl: "?"

      # Les deux cadeaux, écrits en vert lumineux dans les mains de la fée (fairy_page). Courts
      # par nécessité : ils tiennent dans une main. Le montant n'est JAMAIS annoncé — on choisit
      # une promesse, pas un chiffre.
      fairy_gift_xp_self:
        fr: "De l'expérience\npour toi"
        en: "Experience\nfor you"
        es: "Experiencia\npara ti"
        de: "Erfahrung\nfür dich"
        it: "Esperienza\nper te"
        pt: "Experiência\npara ti"
        br: "Experiência\npara você"
        nl: "Ervaring\nvoor jou"
      fairy_gift_xp_other:
        fr: "De l'expérience\npour un autre"
        en: "Experience\nfor another"
        es: "Experiencia\npara otro"
        de: "Erfahrung\nfür jemand anderen"
        it: "Esperienza\nper un altro"
        pt: "Experiência\npara outro"
        br: "Experiência\npara outro"
        nl: "Ervaring\nvoor een ander"
      fairy_gift_xp_clan:
        fr: "De l'expérience\npour tout le clan"
        en: "Experience\nfor the whole clan"
        es: "Experiencia\npara todo el clan"
        de: "Erfahrung\nfür den ganzen Clan"
        it: "Esperienza\nper tutto il clan"
        pt: "Experiência\npara todo o clã"
        br: "Experiência\npara todo o clã"
        nl: "Ervaring\nvoor de hele clan"
      fairy_gift_heal_self:
        fr: "La santé\npour toi"
        en: "Health\nfor you"
        es: "Salud\npara ti"
        de: "Gesundheit\nfür dich"
        it: "Salute\nper te"
        pt: "Saúde\npara ti"
        br: "Saúde\npara você"
        nl: "Gezondheid\nvoor jou"
      fairy_gift_heal_other:
        fr: "La santé\npour un autre"
        en: "Health\nfor another"
        es: "Salud\npara otro"
        de: "Gesundheit\nfür jemand anderen"
        it: "Salute\nper un altro"
        pt: "Saúde\npara outro"
        br: "Saúde\npara outro"
        nl: "Gezondheid\nvoor een ander"
      fairy_gift_heal_clan:
        fr: "La santé\npour tout le clan"
        en: "Health\nfor the whole clan"
        es: "Salud\npara todo el clan"
        de: "Gesundheit\nfür den ganzen Clan"
        it: "Salute\nper tutto il clan"
        pt: "Saúde\npara todo o clã"
        br: "Saúde\npara todo o clã"
        nl: "Gezondheid\nvoor de hele clan"
      fairy_gift_boss:
        fr: "Réveiller\nun boss"
        en: "Wake\na boss"
        es: "Despertar\na un jefe final"
        de: "Einen Boss\nwecken"
        it: "Svegliare\nun boss"
        pt: "Acordar\num boss"
        br: "Acordar\num boss"
        nl: "Een boss\nwekken"

      # Notification envoyée à tout le clan SAUF à l'intéressé, une fois le cadeau choisi
      # (worker._notifyClanFairy). {name} = le joueur, substitué en code.
      # Elle ne dit PAS quel cadeau a été pris : c'est le journal du clan qui le raconte.
      fairy_notif:
        fr: "{name} a rencontré une fée !"
        en: "{name} has met a fairy!"
        es: "¡{name} se ha encontrado con un hada!"
        de: "{name} hat eine Fee getroffen!"
        it: "{name} ha incontrato una fata!"
        pt: "{name} encontrou uma fada!"
        br: "{name} encontrou uma fada!"
        nl: "{name} heeft een fee ontmoet!"

      # Journal du clan. {gift} = le libellé du cadeau reçu (les \n des libellés ci-dessus sont
      # remplacés par une espace avant substitution — une ligne de récit ne se coupe pas).
      # L'APPARITION de la fée ne s'écrit jamais au journal : la ligne la trahirait en temps réel
      # à qui l'ouvre. Une fée qui repart sans être touchée ne laisse donc aucune trace.
      log_fairy_gift:
        fr: "Une fée est apparue au détour d'une corvée, et @@@session.user.name@@@ l'a touchée. Elle a offert : {gift}."
        en: "A fairy appeared in the middle of a chore, and @@@session.user.name@@@ reached out. Her gift: {gift}."
        es: "Un hada apareció en plena faena, y @@@session.user.name@@@ la tocó. Su regalo: {gift}."
        de: "Mitten in einer Hausarbeit ist eine Fee erschienen, und @@@session.user.name@@@ hat sie berührt. Ihr Geschenk: {gift}."
        it: "Una fata è apparsa nel bel mezzo di una faccenda, e @@@session.user.name@@@ l'ha toccata. Il suo dono: {gift}."
        pt: "Uma fada apareceu a meio de uma tarefa, e @@@session.user.name@@@ tocou-lhe. O seu presente: {gift}."
        br: "Uma fada apareceu no meio de uma tarefa, e @@@session.user.name@@@ tocou nela. O presente dela: {gift}."
        nl: "Midden in een klusje verscheen een fee, en @@@session.user.name@@@ raakte haar aan. Haar geschenk: {gift}."

      # --- Événements aléatoires (layers/events-base-global.yml, worker_events.dart) -------
      # Ton drôle, jamais culpabilisant. Aucun montant dans le journal ni dans les notifications :
      # le récit raconte une rencontre, pas un score (même règle que la fée).
      evt_ok:
        fr: "Merci !"
        en: "Thanks!"
        es: "¡Gracias!"
        de: "Danke!"
        it: "Grazie!"
        pt: "Obrigado!"
        br: "Valeu!"
        nl: "Bedankt!"
      evt_chase:
        fr: "Chasser"
        en: "Chase away"
        es: "Echar"
        de: "Verjagen"
        it: "Scaccia"
        pt: "Expulsar"
        br: "Expulsar"
        nl: "Wegjagen"
      evt_chase_desc:
        fr: "Mettre l'intrus à la porte du clan"
        en: "Kick the intruder out of the clan"
        es: "Echar al intruso del clan"
        de: "Den Eindringling aus dem Clan werfen"
        it: "Cacciare l'intruso dal clan"
        pt: "Pôr o intruso fora do clã"
        br: "Colocar o intruso para fora do clã"
        nl: "De indringer de clan uit zetten"
      evt_souris:
        fr: "Une petite souris passe la tête : « Merci aventurier, c'est bien plus propre maintenant ! Voici une petite récompense. »"
        en: "A little mouse pokes its head out: \"Thank you, adventurer, it's so much cleaner now! Here's a small reward.\""
        es: "Un ratoncito asoma la cabeza: «¡Gracias, aventurero, ahora está mucho más limpio! Aquí tienes una pequeña recompensa.»"
        de: "Eine kleine Maus steckt den Kopf heraus: „Danke, Abenteurer, jetzt ist es viel sauberer! Hier ist eine kleine Belohnung.“"
        it: "Un topolino fa capolino: «Grazie, avventuriero, ora è molto più pulito! Ecco una piccola ricompensa.»"
        pt: "Um ratinho espreita: «Obrigado, aventureiro, agora está muito mais limpo! Aqui tens uma pequena recompensa.»"
        br: "Um ratinho coloca a cabeça para fora: \"Valeu, aventureiro, agora está bem mais limpo! Aqui vai uma pequena recompensa.\""
        nl: "Een muisje steekt zijn kopje naar buiten: \"Dank je, avonturier, het is nu veel schoner! Hier is een kleine beloning.\""
      evt_souris_notif:
        fr: "{name} a reçu les remerciements d'une petite souris !"
        en: "{name} was thanked by a little mouse!"
        es: "¡Un ratoncito le ha dado las gracias a {name}!"
        de: "{name} hat sich den Dank einer kleinen Maus verdient!"
        it: "Un topolino ha ringraziato {name}!"
        pt: "Um ratinho agradeceu a {name}!"
        br: "Um ratinho agradeceu {name}!"
        nl: "Een muisje heeft {name} bedankt!"
      evt_piege:
        fr: "Clac ! Les vilains monstres t'avaient tendu un piège. Tu perds 1 point de vie… mais tu le récupéreras dès que cette quête sera validée !"
        en: "Snap! The nasty monsters had set a trap for you. You lose 1 health point… but you'll get it back as soon as this quest is validated!"
        es: "¡Clac! Los monstruos malvados te habían tendido una trampa. Pierdes 1 punto de vida… ¡pero lo recuperarás en cuanto se valide esta misión!"
        de: "Schnapp! Die fiesen Monster haben dir eine Falle gestellt. Du verlierst 1 Lebenspunkt … aber du bekommst ihn zurück, sobald diese Quest bestätigt ist!"
        it: "Clac! I mostri cattivi ti avevano teso una trappola. Perdi 1 punto vita… ma lo recupererai appena questa missione sarà convalidata!"
        pt: "Zás! Os monstros malvados montaram-te uma armadilha. Perdes 1 ponto de vida… mas recuperas-o assim que esta missão for validada!"
        br: "Clac! Os monstros malvados armaram uma armadilha para você. Você perde 1 ponto de vida… mas recupera assim que esta missão for validada!"
        nl: "Klap! De gemene monsters hadden een val voor je gezet. Je verliest 1 levenspunt… maar je krijgt het terug zodra deze queeste is goedgekeurd!"
      evt_gobelin_name:
        fr: "Gobelin espion"
        en: "Spy goblin"
        es: "Duende espía"
        de: "Spionkobold"
        it: "Goblin spia"
        pt: "Goblin espião"
        br: "Goblin espião"
        nl: "Spionnerende goblin"
      evt_gobelin:
        fr: "Ouste ! Le gobelin espion détale sans demander son reste. Le clan est à l'abri, et tu gagnes un peu d'expérience."
        en: "Shoo! The spy goblin scurries off without a word. The clan is safe, and you earn a little experience."
        es: "¡Fuera! El duende espía sale corriendo sin rechistar. El clan está a salvo y ganas un poco de experiencia."
        de: "Husch! Der Spionkobold ergreift wortlos die Flucht. Der Clan ist in Sicherheit, und du bekommst ein wenig Erfahrung."
        it: "Sciò! Il goblin spia se la dà a gambe senza fiatare. Il clan è al sicuro e guadagni un po' di esperienza."
        pt: "Xô! O goblin espião foge sem dizer palavra. O clã está a salvo e ganhas um pouco de experiência."
        br: "Xô! O goblin espião foge sem dizer nada. O clã está protegido, e você ganha um pouco de experiência."
        nl: "Wegwezen! De spionnerende goblin gaat er zonder een woord vandoor. De clan is veilig en je krijgt wat ervaring."
      evt_gobelin_notif:
        fr: "{name} a chassé un gobelin espion du clan !"
        en: "{name} chased a spy goblin out of the clan!"
        es: "¡{name} ha echado a un duende espía del clan!"
        de: "{name} hat einen Spionkobold aus dem Clan gejagt!"
        it: "{name} ha cacciato un goblin spia dal clan!"
        pt: "{name} expulsou um goblin espião do clã!"

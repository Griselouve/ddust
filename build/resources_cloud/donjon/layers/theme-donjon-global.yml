    # Intitulés de formulaire (royaume, nom du joueur, date de naissance, nom/description du clan,
    # somme). opacity: 1.0 annule le 0.6 hérité de commons/nobordershape : DvImageView applique
    # shape.opacity au TEXTE, et ces libellés sortaient donc en or éteint à côté des boutons qu'ils
    # annoncent (documents/region_button & co, qui n'ont pas d'opacité). Un seul or dans l'app.
    commons/label_label:
      shape:
        font_size: 13.0
        opacity: 1.0

    region_screen/lang_flag:
      shape:
        font_size: 14.0
        background_color: "transparent"

    region_screen/lang_text:
      shape:
        opacity: 0.6
        font_size: 14.0
        font_color: "amber_200"
        background_color: "transparent"

    # Bouton de choix du royaume : texte ambre aligné à gauche (le drapeau ouvre la ligne),
    # le cadre venant de `button_style: commons/donjon_button`.
    documents/region_button:
      shape:
        font_color: "amber_200"
        font_size: 15.0
        text_align: LEFT

    # Menu des royaumes : MÊME habillage que le kebab Personnage — c'est le même widget, il
    # doit se voir pareil. L'alpha est dans le hex : DvMenuView lit `background_color` brut et

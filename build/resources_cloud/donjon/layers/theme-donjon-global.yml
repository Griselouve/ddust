        pt: "Não foi possível começar a tua aventura por agora. Verifica a tua ligação e tenta de novo."
        br: "Não foi possível começar sua aventura agora. Verifique sua conexão e tente de novo."
        nl: "Je avontuur kan nu niet worden gestart. Controleer je verbinding en probeer het opnieuw."


        en: "{name} has leveled up! The dust trembles."
        es: "¡{name} ha subido de nivel! El polvo tiembla."
        de: "{name} ist eine Stufe aufgestiegen! Der Staub zittert."
        it: "{name} è salito di livello! La polvere trema."
        pt: "{name} subiu de nível! O pó treme."
        br: "{name} subiu de nível! A poeira treme."
        nl: "{name} is een niveau gestegen! Het stof beeft."
      levelup_notif_title:
        fr: "{name} a monté de niveau ! Il peut maintenant prétendre au titre de {title}."
        en: "{name} has leveled up! They can now claim the title of {title}."
        es: "¡{name} ha subido de nivel! ¡Ahora puede reclamar el título de {title}!"
        de: "{name} ist eine Stufe aufgestiegen! Jetzt winkt der Titel {title}."
        it: "{name} è salito di livello! Ora può ambire al titolo di {title}."
        pt: "{name} subiu de nível! Agora pode reclamar o título de {title}."
        br: "{name} subiu de nível! Agora pode reivindicar o título de {title}."
        nl: "{name} is een niveau gestegen! Nu lonkt de titel {title}."
      levelup_anim:

      #------------- Avis du mineur (kid_assent_screen) ------------
      # La question est POSÉE, et le bouton est la réponse de l'enfant, pas un « Continuer ».
      # ⚠ L'ENFANT PARLE LE PREMIER (2026-09-22). Le texte disait « tes parents ont accepté,
      #   et toi ? » : il suivait l'ordre inverse de celui du Decreto 1377 de 2013 (art. 12),
      #   qui veut que l'enfant s'exprime AVANT la décision de son représentant. Sa réponse
      #   voyage désormais jusqu'au parent (kid_assent_share), qui décide ensuite. Le texte le
      #   dit, pour que l'enfant sache à quoi sert son oui.
      # ⚠ `kid_assent_question_again` A DISPARU (2026-09-22), avec la reconfirmation qu'il
      #   posait (« c'est toujours ce que tu veux ? ») à l'enfant arrivé par un lien d'invitation
      #   application fermée. Une invitation porte désormais le code de la demande à laquelle
      #   elle répond, et ce code ne survit pas à la fermeture de l'application : l'enfant
      #   envoie une nouvelle demande.
      # Formulations sans accord de genre : l'application ne connaît pas celui du joueur.
      # ⚠ CE TEXTE EST CELUI QUE LE CHEF VOIT citer dans sa déclaration (text_key de l'accord,
      #   invite_consent_assent) : le reformuler, c'est changer ce qu'on lui montre.


      #------------- Soin (célébration de guérison) ------------------
      # {name} = joueur soigné, {healer} = soigneur — tous deux encadrés [[…]] par le worker
      # (surbrillance). Affichés sur le voile blanc de la scène "heal" (worker._showHealAnimation).
      # healed_by_anim : soigneur identifié (revive_player / resurrect_self via clans_logs).
      healed_by_anim:
        fr: "Ouf {name}, tu viens d'être sauvé par {healer} ! La vie afflue de nouveau."
        en: "Phew {name}, you were just saved by {healer}! Life flows through you once more."
        es: "¡Uf {name}, acabas de ser salvado por {healer}! La vida vuelve a fluir en ti."
        de: "Puh, {name}, du wurdest gerade von {healer} gerettet! Das Leben strömt wieder durch dich."
        it: "Uff, {name}, sei appena stato salvato da {healer}! La vita torna a scorrere in te."
        pt: "Ufa, {name}, acabaste de ser salvo por {healer}! A vida volta a correr em ti."
        br: "Ufa, {name}, você acabou de ser salvo por {healer}! A vida volta a correr em você."
        nl: "Pff, {name}, je bent net gered door {healer}! Het leven stroomt weer door je heen."
      # healed_anim : repli générique quand aucun soigneur n'est identifié (ex. soin par
      # accomplissement d'une tâche qui restaure les PV).
      healed_anim:
        fr: "Ouf {name}, te voilà de nouveau sur pied ! Tes blessures se referment, la vie afflue de nouveau."
        en: "Phew {name}, you're back on your feet! Your wounds close, life flows through you once more."
        es: "¡Uf {name}, ya estás de nuevo en pie! Tus heridas se cierran, la vida vuelve a fluir en ti."
        de: "Puh, {name}, du stehst wieder auf den Beinen! Deine Wunden schließen sich, das Leben strömt wieder durch dich."
        it: "Uff, {name}, eccoti di nuovo in piedi! Le tue ferite si chiudono, la vita torna a scorrere in te."
        pt: "Ufa, {name}, estás de novo de pé! As tuas feridas fecham-se, a vida volta a correr em ti."
        br: "Ufa, {name}, você está de pé de novo! Suas feridas se fecham, a vida volta a correr em você."
        nl: "Pff, {name}, je staat weer op je benen! Je wonden sluiten zich, het leven stroomt weer door je heen."


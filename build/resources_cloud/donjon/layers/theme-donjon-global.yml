  # --- Interludes : ce qu'ils SONT --------------------------------------------------
  # Le contenu des célébrations déclarées dans config.yml : quelle scène, quel son, quelle
  # vibration. Les définitions elles-mêmes suivent plus bas (vibrations, flame) — tout ce qui
  # fait l'identité sensorielle du jeu est ici, et nulle part ailleurs.
  # Un interlude confisque l'écran : le son et la vibration partent 0,5 s AVANT le visuel (le temps
  # que le joueur lève les yeux), la musique d'ambiance se tait, et tout est rendu à la fin.
  interludes:
    # Accueil du nouveau joueur — le seul interlude joue AVANT le reseau, et le seul
    # sans vibration : un telephone qui vibre dans la main de quelqu'un qui vient
    # d'ouvrir l'application pour la premiere fois alarme au lieu d'annoncer.
    intro:
      scene: intro
      # PAS DE `sound:` — lyria refuse le lit sonore (cf. build_assets.yml, etape
      # `intro_sources`). Un interlude sans son est parfaitement valide : dvinterlude
      # ne joue alors rien et le `lead` ne fait qu'attendre. La voix du conteur, elle,
      # est chargee par le worker beat apres beat, et ne passe pas par ici.
    # ⚠ UN INTERLUDE PAR TRANSITION, TOUS SUR LA MEME SCENE. C'est ce qui rend les
    #   passages entièrement déclaratifs : chacun porte SA destination dans `on_covered`,
    #   et l'application n'a plus rien à mémoriser entre le moment où le rideau tombe et
    #   celui où il faut basculer. Le worker de ddust portait cet état ; il n'en porte
    #   plus, et les navigations fantômes qui allaient avec ont disparu avec lui.
    #
    # ⚠ `on_covered` ET NON `on_finished` POUR LA NAVIGATION. La bascule a lieu quand le
    #   rideau est complet, pas quand la scène s'achève : entre les deux il y a la tenue
    #   du noir (`d2_tenue`), pendant laquelle la page d'arrivée se monte et lève son
    #   propre voile. Naviguer sur `on_finished` ferait réapparaître l'ancien écran le
    #   temps du fondu.
    passage_region:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "steps.navigate.region" }

    # Le royaume : la bascule n'est PAS une navigation mais l'ouverture de la session
    # anonyme, qui navigue elle-même quand le réseau a répondu. Le rideau tient donc le
    # temps qu'il faut — et s'il tombe avant, l'écran suivant lève son propre voile.
    passage_royaume:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "documents.do_region_confirm" }

    # ⚠ UN INTERLUDE PAR DESTINATION, ET NON UN SEUL PARAMETRABLE. La destination est
    #   posee dans `on_covered`, donc dans la CONF : c'est ce qui permet a un bouton de
    #   n'appeler qu'une action et de ne rien retenir entre le moment ou le rideau tombe
    #   et celui ou il faut basculer. Un interlude unique aurait exige que quelqu'un porte
    #   cet etat — et c'est exactement ce qui produisait des navigations fantomes quand le
    #   worker s'en chargeait.

    # L'avis du mineur donne : on passe a la transmission de sa reponse au parent. La route
    # demandee est `go`, mais c'est le routeur du pas (worker.kid_assent_route) qui tranche : une
    # invitation deja recue mene droit a la saisie du code ou a la connexion.
    passage_assent:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "steps.navigate.go" }

    # Le nom du personnage, le nom du clan : le pas courant sait ou aller.
    passage_suite:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "steps.navigate" }

    # « Rejoindre les miens » depuis l'ecran du clan.
    passage_join:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "steps.navigate.join" }

    # « Fonder mon clan » : c'est le worker qui tranche, il navigue lui-meme.
    passage_creation:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "worker.on_confirm_create_clan_choice" }

    # La quete preparee : on enregistre les taches choisies, PUIS on entre en jeu.
    # L'ordre compte — naviguer avant d'ecrire laisserait le dashboard se peindre sur un
    # clan sans taches.
    passage_quete:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        store: { order: 1, action: "worker.storetasks" }
        nav: { order: 2, action: "steps.navigate" }

    # L'âge : dvdocuments valide la date puis laisse le pas router vers les conditions.
    passage_age:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "documents.do_confirm" }

    # Le passage d'une étape à la suivante : le rideau qui tombe. JOUE PAR DVINTERLUDE
    # et non par un `dvflame.start` suivi d'une attente, comme on l'avait d'abord écrit.
    #
    # ⚠ LA RAISON EST EXPERIMENTALE, ET ELLE VAUT D'ETRE ECRITE. Lancée à la main, la
    #   scène démarrait bel et bien — le registre la trouvait, une vue lui était attachée,
    #   aucune erreur n'était journalisée — et pourtant rien ne se peignait. Le même
    #   fichier de scène, joué par dvinterlude, s'affiche. dvinterlude fait deux choses
    #   qu'un appel nu ne fait pas : il pose un gel `quiet` sur la page AVANT de lancer,
    #   et il attend la fin par `on_finished` au lieu d'un délai deviné.
    #
    #   Le second point suffirait à préférer cette voie : le worker n'a plus à connaître
    #   la durée du fondu. Une scène rallongée au thème n'oblige plus à retoucher une
    #   constante dans le code, qui dérivait silencieusement.
    # Le pacte : la sortie des conditions. Pas de `sound:` — les deux chocs et la voix
    # sont poses par le worker au fil de la scene, exactement comme pour l'accueil.
    pacte:
      scene: pacte
      vibration: cue_burn
      # La bascule a lieu sous le noir (`q7_fin_ecu`), pas à la fin : voir le commentaire
      # de la scène. `steps.navigate` sans argument suit le routeur du pas courant —
      # `documents_acceptance_screen`, dont `worker.legalstate` décide de la suite.
      on_covered:
        nav: { order: 1, action: "steps.navigate" }
    levelup:
      scene: burn
      sound: anim_burn
      vibration: cue_burn
    # Passage à l'âge adulte : la célébration (même scène que le level-up), puis le rideau
    # sous lequel la CGU adulte s'ouvre. Même idiome que les passages de l'onboarding.
    adulthood:
      scene: burn
      sound: anim_burn
      vibration: cue_burn
    passage_adulthood:
      scene: depart
      music: keep
      guard: 6
      on_covered:
        nav: { order: 1, action: "worker.on_adulthood_covered" }
    # Multiclan : le changement de clan, depuis « Mes clans ». La bascule (lectures, écritures,
    # entrée dans l'autre clan) a lieu sous le noir, puis le tableau de bord de l'autre clan.
    passage_switch:
      scene: depart
      music: keep
      guard: 8
      on_covered:
        nav: { order: 1, action: "worker.on_switch_covered" }
    giftxp:
      scene: giftxp
      sound: anim_gift
      vibration: cue_gift
    giftgold:
      scene: giftgold
      sound: anim_gift
      vibration: cue_gift
    heal:
      scene: heal
      sound: anim_heal
      vibration: cue_heal
    gameover:
      scene: gameover
      sound: anim_dead
      vibration: cue_death
    # Victoire de tâche accomplie/validée : image en fondu + son unique. Pas de vibration (voulu sobre).
    victory:
      scene: victory
      sound: anim_victory
    # Ouverture du butin : LA grande célébration du clan. Le morceau porte ~11,5 s de son audible
    # (le fichier en fait ~13, la fin est du silence) pour une scène de 9,95 s : la musique DÉBORDE
    # le visuel, et c'est voulu — elle accompagne la découverte de la part sur butin_rewards_page.
    #
    # `music: hold` : l'ambiance du donjon se tait comme partout ailleurs, mais elle n'est PAS rendue
    # à la fin de la scène — sans quoi elle repartait par-dessus la dernière seconde encore audible
    # du morceau, pile au moment où le joueur découvre son butin. C'est worker.on_butin_rewards_ok
    # (bouton « ok » de l'écran de récompenses) qui la rend.
    # `lead: 1.0` : le son part une seconde avant le coffre, soit une demi-seconde plus tôt que le
    # défaut du module — il annonce la cérémonie au lieu de l'accompagner.
    butin:
      scene: butin
      sound: anim_butin
      vibration: cue_butin
      lead: 1.0
      music: hold

  sound:
    preload:
      home: "music/ambiant1.mp3"
      # Le lit sonore de l'accueil est EN ATTENTE (lyria le refuse, cf. build_assets.yml).
      # Il serait EMBARQUE — chemin nu sous `intro/` — parce que c'est le seul son du jeu
      # qui doive etre jouable sans reseau. Tous les autres vivent dans le bucket et
      # arrivent avec la vague `critical`.
      # intro_ambiance: "intro/sounds/intro_ambiance.mp3"
      anim_burn: "sounds/anim_burn.mp3"
      anim_dead: "sounds/anim_dead.mp3"
      anim_heal: "sounds/anim_heal.mp3"
      anim_gift: "sounds/effect_xp.mp3"
      anim_victory: "sounds/tatadaa.mp3"
      anim_butin: "music/win.mp3" # ouverture du butin (~11,5 s audibles + silence, fichier ~13 s)
      batte_swords: "sounds/batte_swords.mp3" # boucle jouée pendant le combat (mur de flammes)
      # Venue de la fée. Jouée EN BOUCLE (dvsound.loop), et non en one-shot : contrairement à
      # toutes les autres célébrations, celle-ci ne se termine pas toute seule — elle dure
      # aussi longtemps que le joueur met à choisir entre les deux cadeaux.
      anim_fairy: "music/fairy.mp3"
      # Le choc des lames du pacte. CHEMIN NU, sans `assets/` : le fichier descend avec
      # la vague `ante` dans le bucket public, et c'est sous ce chemin que le cache le
      # range.
      pacte_clang: "intro/pacte/swords.mp3"
      # ⚠ PAS DE `seuil_music` ICI, ET C'EST DELIBERE. La musique du seuil est le seul son
      #   qui doive jouer AVANT que ce fichier-ci ne soit a jour : le declarer ici
      #   reviendrait a la faire dependre de ce qu'elle doit precisement precedes. Le
      #   worker la charge par son chemin (`worker_onboarding._musiqueDuSeuil`), ce qui
      #   ne consulte aucun catalogue.
      #
      # ⚠ CE N'EST PAS LA PLAYLIST `ambiant` NON PLUS. Celle-ci vit dans le bucket et ne
      #   descend qu'avec la vague `critical`, c'est-a-dire apres le choix du royaume —
      #   trois ecrans trop tard. Les deux ne se chevauchent jamais : le worker coupe la
      #   premiere au moment exact ou la seconde prend le relais (sortie de l'ecran de
      #   l'age, `worker.on_ambiance_relais`).

    playlists:
      ambiant:
        mode: linear
        sounds:
          - music/ambiant1.mp3
          - music/ambiant2.mp3
          - music/ambiant3.mp3
          - music/ambiant4.mp3
      # Ambiance jouée tant que le personnage est mort (une seule piste pour l'instant). Le worker
      # la déclare (dvsound.ambiance.ambiant_dead) au moment où il détecte la mort — pendant que
      # l'interlude a fait taire la musique : dvsound la mémorise et la joue à la reprise.
      ambiant_dead:
        mode: linear
        sounds:
          - music/ambiant_dead.mp3

    # Niveaux declares (0-200 %). La musique du theme joue a 50 % partout (arbitrage du
    # 2026-09-25) ; seul le seuil de l'onboarding commence plus bas (40 %, puis 50 % sur
    # l'ecran des deux portes), et lui est regle par le worker (`_musiqueDuSeuil`).
    volumes:
      ambiant: 50
      ambiant_dead: 50

  # --- Vibrations dvvibrations ------------------------------------------------------
  # Ce que les célébrations font SENTIR. Chaque composite est tiré par un hook `on_end` posé sur un
  # effet de la scène correspondante (cf. flame.scenes plus bas) → le beat est calé sur les ACTES
  # de l'animation : si la durée d'un acte change, la vibration suit toute seule.
  # Les atomiques du module (gentle 100/64, medium 200/128, strong 400/255, short_strong 80/200,
  # pause_50 50/0) restent disponibles : ce bloc est FUSIONNÉ par-dessus dvvibrations/config.yml.
  #
  # >>> RÈGLE D'OR : la durée totale d'un composite doit rester INFÉRIEURE à l'écart jusqu'au
  # beat suivant. Le moteur n'a pas de file d'attente — deux vibrations qui se chevauchent se
  # disputent le vibreur (la seconde écrase la première). Les durées sont annotées ci-dessous.
  # La clef réservée `splash` (vibration au démarrage de l'app) est volontairement absente.

  vibrations:
    # -- Atomiques ddust -------------------------------------------------------------
    tick: { duration: 30, intensity: 90 } # grain sec (cendre qui tombe, pièce qui claque)
    tap: { duration: 60, intensity: 140 }
    thud: { duration: 250, intensity: 200 } # coup sourd (glas)
    boom: { duration: 600, intensity: 255 } # impact plein
    rumble_lo: { duration: 150, intensity: 80 } # grondement — 3 étages pour le crescendo
    rumble_mid: { duration: 150, intensity: 150 }
    rumble_hi: { duration: 150, intensity: 220 }
    pause_100: { duration: 100, intensity: 0 } # silences (intensity 0 = attente pure)
    pause_200: { duration: 200, intensity: 0 }
    pause_400: { duration: 400, intensity: 0 }

    # -- Cues de pré-roll (t = -0,5 s) ------------------------------------------------
    # Joués par dvinterlude AVEC le son, une demi-seconde avant que le visuel démarre : ils annoncent
    # la célébration. C'est le bloc `interludes` ci-dessus qui associe un composite à un interlude
    # (interludes.<id>.vibration) — ici on ne fait que décrire les partitions.
    # La règle d'or ci-dessus les borne à 0,5 s : au-delà, le cue mordrait sur l'haptique d'ouverture
    # de la scène (burn_ignite, death_toll…) qui part à t=0. D'où `strong` (0,40 s) et non `boom`
    # (0,60 s) pour la mort.
    cue_burn: { children: [thud] } # 0,25 s — un coup sourd : quelque chose s'embrase
    cue_death: { children: [strong] } # 0,40 s — la sentence tombe
    cue_heal: { children: [gentle, pause_100, gentle] } # 0,30 s — deux battements doux
    cue_gift: { children: [tick, pause_50, tap] } # 0,14 s — un scintillement
    cue_butin: { children: [tick, pause_50, tick, pause_50, thud] } # 0,41 s — deux grains puis le coup : le coffre bouge

    # -- Scène "burn" (montée de niveau / bienvenue clan) -----------------------------
    # 1,70 s de crescendo pendant la combustion (acte 1 = 2,0 s) : le feu monte.
    burn_ignite:
      children:
        [
          rumble_lo,
          pause_200,
          rumble_lo,
          pause_200,
          rumble_mid,
          pause_200,
          rumble_mid,
          pause_100,
          rumble_hi,
          pause_100,
          rumble_hi,
        ]
    burn_impact: { children: [boom] } # 0,60 s — l'écran vient de virer au noir
    # 0,69 s — l'effritement commence : quelques grains de cendre.
    burn_crumble: { children: [tick, pause_200, tick, pause_400, tick] }

    # -- Scène "gameover" (mort à 0 PV) ----------------------------------------------
    # 2,55 s de glas pendant que l'écran noircit (acte 1 = 3,0 s), qui s'achève sur la chute.
    death_toll:
      children: [thud, pause_400, thud, pause_400, thud, pause_400, boom]
    death_burst: { children: [boom, pause_50, strong] } # 1,05 s — le noir se brise en cendres

    # -- Scène "heal" (soin / résurrection) ------------------------------------------
    heal_pulse: { children: [gentle, pause_100, gentle] } # 0,30 s — éclosion des croix
    heal_relief: { children: [medium, pause_100, gentle] } # 0,40 s — l'écran est blanc : soulagement

    # -- Scène "fairy" (venue de la fée) ----------------------------------------------
    # Deux beats seulement, et tous deux DOUX : la fée n'est ni un combat ni une mort, elle
    # ne cogne pas. Le premier est le frisson du froid quand l'écran se ferme ; le second,
    # l'éblouissement quand la lumière a tout inondé — juste avant qu'elle ne paraisse.
    fairy_chill: { children: [tick, pause_100, tick, pause_100, gentle] } # 0,36 s — le froid qui prend
    fairy_reveal: { children: [gentle, pause_100, medium] } # 0,40 s — la lumière éblouit

    # -- Scène "giftxp" (cadeau d'XP) -------------------------------------------------
    gift_sparkle: { children: [tick, pause_50, tick, pause_50, tick, pause_50, tap] } # 0,30 s
    gift_chime: { children: [medium, pause_50, short_strong] } # 0,33 s — écran doré plein

    # -- Scène "giftgold" (cadeau d'or) ----------------------------------------------
    # 1,46 s de pièces qui claquent pendant la pluie (acte 1 = 2,0 s) : staccato régulier.
    coins_rain:
      children:
        [
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
          pause_100,
          tick,
        ]
    coins_settle: { children: [thud, pause_50, medium] } # 0,50 s — la nappe d'or est pleine

    # -- Scène "butin" (ouverture du coffre) -----------------------------------------
    # Deux beats seulement, calés sur les actes : la CHARGE (le coffre force, crescendo de
    # grondements pendant l'acte 2, qui dure 2,0 s) et l'ÉCLAT (il cède). La nappe d'or finale
    # réutilise coins_settle.
    butin_charge:
      children: [rumble_lo, pause_100, rumble_mid, pause_100, rumble_hi] # 0,65 s
    butin_burst: { children: [boom, pause_50, short_strong] } # 0,73 s — le coffre éclate

  # --- Animations dvflame ---------------------------------------------------------
  # Ce que les célébrations donnent à VOIR. Les cinq scènes portent les identifiants attendus par
  # les vues du registry (commons/levelup_view & co, déclarées dans config.yml) : un thème réécrit
  # librement ce qu'elles CONTIENNENT, pas comment elles s'appellent.
  #
  # Scène "burn" : l'écran se consume — 3 actes pilotés par la timeline (order) :
  #   1. combustion (2s)   : le rideau noir 'carbone' monte du bas, front de flammes
  #   2. carbonisation (2s): écran noir, braises discrètes (hold)
  #   3. effritement (2s)  : le bord bas du noir remonte (bord haut épinglé), pluie de
  #                          cendres, l'écran réapparaît par le bas
  # Scène mortelle, rejouable (dvflame.start.burn), monde = pixels de la vue.

  flame:
    scenes:
      # Mur de flammes permanent posé sur la frontière taskbar (bas de la vue combat/flamewall,
      # y=88% écran) et joué tant que le joueur est en combat (boutons "vaincu"/"retraite" affichés).
      # immortal = boucle sans fin, AUCUN `effects` → l'émission ne s'éteint jamais. Reprend le
      # preset `flame` et l'émetteur-ligne de `burn.front_flammes`. Le worker pilote start/stop
      # (dvflame.start.flamewall / dvflame.stop.flamewall) — d'où autostart:false.
      flamewall:
        lifecycle: immortal
        autostart: false
        objects:
          mur:
            type: particles
            preset: flame
            position: { x: "50%", y: "100%" } # bas de la vue = ligne y=88% écran
            emission: { rate: 220, zone: { shape: line, w: "100%", h: 0 } }
            velocity: { angle: -90, angle_var: 12, speed: 90, speed_var: 35 }
            particle_size: { start: 24, end: 4 }

      # Aura du coffre plein (écran Clan, vue clan_page/butin_aura) : elle dit au chef que la
      # cérémonie d'ouverture est possible, et elle le dit SANS S'ARRÊTER tant qu'il n'a pas touché
      # le coffre. Même montage que flamewall : immortal + autostart:false, le worker pilote
      # start/stop (dvflame.start.chestaura / dvflame.stop.chestaura).
      #
      # Deux objets, aucun `effects` de scène — donc aucune timeline, donc rien qui puisse finir :
      #   - `halo`  : disque doré qui respire (oscillate SANS duration = infini, cf. readme dvflame) ;
      #   - `rayons`: croix lumineuses tirées du centre dans TOUS les azimuts (angle_var 180 couvre
      #               le tour complet), qui grossissent puis s'éteignent — les rayons de lumière.
      # La vue déborde le coffre de tous les côtés : c'est là que les rayons vont mourir.
      chestaura:
        lifecycle: immortal
        autostart: false
        objects:
          halo:
            type: fill
            shape: circle
            order: 10
            color: "#D4AF37"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "70%", h: "70%" }
            opacity: 0.35
            effects:
              souffle:  { type: oscillate, target: opacity, from: 0.12, to: 0.5,   period: 1.8 }
              gonfle_w: { type: oscillate, target: size.w,  from: "55%", to: "95%", period: 1.8 }
              gonfle_h: { type: oscillate, target: size.h,  from: "55%", to: "95%", period: 1.8 }

          rayons:
            type: particles
            order: 20
            particle_shape: cross
            position: { x: "50%", y: "50%" }
            emission: { rate: 14, zone: { shape: point, w: 0, h: 0 } }
            velocity: { angle: 0, angle_var: 180, speed: 34, speed_var: 12 }
            lifetime: { min: 0.9, max: 1.4 }
            particle_size: { start: 2, peak: 16, end: 0, peak_at: 0.35 }
            opacity_var: 0.4
            blur: 2
            colors:
              clair: { order: 1, color: "#FFE9A8" }
              fondu: { order: 2, color: "#00D4AF37" }

      # Halo des notes des chefs (butin_notes_page) : même procédé que chestaura (disque doré qui
      # respire, immortal + autostart:false, piloté par le worker via dvflame.start/stop.notehalo),
      # mais une respiration plus lente et plus sourde — c'est un halo de veillée qui accompagne une
      # lecture, pas l'aura d'un coffre qui appelle. Un seul objet, aucun rayon : rien ici ne doit
      # attirer l'œil hors du texte qu'il encadre.
      notehalo:
        lifecycle: immortal
        autostart: false
        objects:
          halo:
            type: fill
            shape: circle
            order: 10
            color: "#D4AF37"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "80%", h: "80%" }
            opacity: 0.2
            effects:
              souffle:  { type: oscillate, target: opacity, from: 0.10, to: 0.32,  period: 2.5 }
              gonfle_w: { type: oscillate, target: size.w,  from: "70%", to: "90%", period: 2.5 }
              gonfle_h: { type: oscillate, target: size.h,  from: "70%", to: "90%", period: 2.5 }

      burn:
        lifecycle: mortal
        autostart: false
        # Fin de la timeline → dvinterlude dégèle l'écran et rend la musique d'ambiance (coupée au
        # démarrage du son, 0,5 s avant le visuel). Même hook sur les 5 scènes : c'est le SEUL signal
        # exact de fin — les durées vont de 6,2 s (cadeaux) à 14,7 s (mort). dvflame ne connaît pas
        # dvinterlude : il annonce juste « j'ai fini », c'est la conf qui les relie.
        on_finished:
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          carbone:
            type: fill
            order: 10
            color: "#000000"
            position: { x: "50%", y: "100%" }
            anchor: bottom_center
            size: { w: "100%", h: 0 }

          braises:
            type: particles
            order: 15
            preset: sparkles
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "96%", h: "96%" } }
            lifetime: { min: 0.6, max: 1.6 }
            velocity: { angle: -90, angle_var: 40, speed: 10, speed_var: 8 }
            particle_size: { start: 6, end: 1 }
            blur: 3
            opacity_var: 0.75 # certaines lueurs bien vives, d'autres à peine (scintillement)
            colors:
              c1: { order: 1, color: "#FFFFECB3" } # blanc-chaud vif (naissance)
              c2: { order: 2, color: "#FFFF9800" } # orange saturé
              c3: { order: 3, color: "#00E65100" } # fondu transparent (mort)

          front_flammes:
            type: particles
            order: 20
            preset: flame
            position: { x: "50%", y: "100%" }
            emission: { rate: 260, zone: { shape: line, w: "100%", h: 0 } }
            particle_size: { start: 26, end: 5 }
            velocity: { angle: -90, angle_var: 14, speed: 110, speed_var: 45 }

          front_cendres:
            type: particles
            order: 20
            preset: ashes
            position: { x: "50%", y: "100%" }
            emission: { rate: 0, zone: { shape: line, w: "100%", h: 0 } }
            # Surcharges du preset "ashes" (défauts : speed 45/25, accel.y 70, lifetime 1.2-2.2) :
            velocity: { speed: 45, speed_var: 25 } # chute 1,5× plus rapide (rapproche cendres/rideau)
            acceleration: { y: 70 } # gravité 1,5× plus forte
            lifetime: { min: 2.3, max: 4.3 } # vivent longtemps → tombent loin

        effects:
          # -- Acte 1 : combustion --------------------------------------------------
          # Beat haptique t=0 : hold PARALLÈLE de 0,05 s dans le groupe order:1. Il ne décale
          # rien (le groupe attend de toute façon act1_carbone / act1_flammes, 2 s : un groupe
          # n'avance que quand TOUS ses effets finis sont terminés) — il ne sert qu'à porter le
          # on_end qui déclenche la vibration au démarrage de la scène. Même idiome dans les
          # 4 autres scènes. (cf. conf.vibrations)
          act1_haptic:
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.burn_ignite" } },
            }
          act1_carbone:
            {
              order: 1,
              target: carbone.size.h,
              from: 0,
              to: "100%",
              duration: 2.0,
              # L'écran vient de virer au noir → impact.
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.burn_impact" } },
            }
          act1_flammes:
            {
              order: 1,
              target: front_flammes.position.y,
              from: "100%",
              to: 0,
              duration: 2.0,
            }
          # -- Transition : extinction des flammes, allumage des braises ------------
          act2_flammes:
            {
              order: 2,
              target: front_flammes.emission.rate,
              to: 0,
              duration: 0.3,
            }
          act2_braises:
            { order: 2, target: braises.emission.rate, to: 60, duration: 0.3 }
          # -- Acte 2 : carbonisation (noir + braises) ------------------------------
          # Sa fin = début de l'effritement → grains de cendre sous les doigts.
          act3_hold:
            {
              order: 3,
              type: hold,
              duration: 2.7,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.burn_crumble" } },
            }
          # -- Acte 3 : effritement en cendres, DU BAS VERS LE HAUT ------------------
          # carbone est ancré bottom_center → position.y = bord BAS, bord HAUT = position.y - h.
          # On épingle le bord haut à 0 en animant position.y ET size.h ensemble (position.y = h) :
          # le bord bas remonte de 100% à 0 → l'écran réapparaît par le bas. Le front de cendres
          # suit ce bord bas qui remonte (100% → 0).
          #
          # >>> RATIO DE VITESSE (clef du rendu « désintégration ») : la `duration` ci-dessous fixe
          # la vitesse de MONTÉE du rideau noir. Trop rapide vs la chute des cendres → on voit un
          # bandeau qui défile vers le haut, décorrélé des cendres. On la ralentit (2.6 → 4.0) pour
          # rapprocher la vitesse de disparition du noir de la vitesse/quantité de cendres générées,
          # afin que la surface noire semble vraiment SE TRANSFORMER en cendres. Augmenter encore
          # cette durée ralentit davantage le rideau (couplage plus fort) ; la diminuer l'accélère.
          # (act4_carbone / act4_carbone_top / act4_cendres / act4_pluie DOIVENT partager la même durée.)
          act4_carbone:
            {
              order: 4,
              target: carbone.size.h,
              from: "100%",
              to: 0,
              duration: 8.0,
            }
          act4_carbone_top:
            {
              order: 4,
              target: carbone.position.y,
              from: "100%",
              to: 0,
              duration: 8.0,
            }
          act4_cendres:
            {
              order: 4,
              target: front_cendres.position.y,
              from: "100%",
              to: 0,
              duration: 8.0,
            }
          act4_pluie:
            {
              order: 4,
              target: front_cendres.emission.rate,
              from: 720,
              to: 720,
              duration: 8.0,
            }
          act4_braises:
            { order: 4, target: braises.emission.rate, to: 0, duration: 0.4 }
          # -- Rideau final : plus aucune émission ----------------------------------
          act5_cendres:
            {
              order: 5,
              target: front_cendres.emission.rate,
              to: 0,
              duration: 0.1,
            }

      # Scène "heal" : célébration de soin — une onde de petites croix vertes (tailles
      # et éclats variés : size_var / opacity_var) naît au centre de l'écran, chaque croix
      # grossit puis rétrécit et s'efface (particle_size en cloche via peak). L'onde part
      # en cercle (zone ring animée) et dévore tout l'écran ; derrière elle, un voile
      # blanc circulaire (fill shape: circle) blanchit tout, tient 2 s écran blanc, puis
      # s'efface en fondu de 2 s (canal opacity) pour rendre l'écran précédent.
      # Scène mortelle, rejouable (dvflame.start.heal), monde = pixels de la vue.
      heal:
        lifecycle: mortal
        autostart: false
        on_finished: # cf. burn : dégel de l'écran + reprise de la musique (playlist `ambiant`)
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          voile:
            type: fill
            shape: circle
            order: 10
            color: "#FFFFFF"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: 0, h: 0 }

          croix:
            type: particles
            order: 20
            particle_shape: cross
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: ring, w: 0, h: 110 } }
            lifetime: { min: 1.0, max: 2.0 }
            velocity: { angle: -90, angle_var: 180, speed: 9, speed_var: 7 }
            particle_size: { start: 3, peak: 22, end: 0, peak_at: 0.35 }
            size_var: 0.55 # petites et grandes croix mêlées
            opacity_var: 0.7 # certaines bien vives, d'autres discrètes
            colors:
              c1: { order: 1, color: "#1B5E20" } # vert profond (naissance)
              c2: { order: 2, color: "#4CAF50" } # vert franc (sommet)
              c3: { order: 3, color: "#0081C784" } # fondu transparent (mort)

        effects:
          # -- Acte 1 : éclosion des croix au centre ---------------------------------
          act1_haptic: # beat t=0 (hold parallèle, cf. scène burn) : double pulse doux
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.heal_pulse" } },
            }
          act1_croix:
            { order: 1, target: croix.emission.rate, to: 320, duration: 0.15 }
          act2_amorce:
            {
              order: 2,
              target: croix.emission.zone.w,
              from: 0,
              to: "30%",
              duration: 0.4,
            }
          # -- Acte 2 : l'onde dévore l'écran, le voile blanc suit -------------------
          # Les trois effets 'order: 3' partagent la même durée : le front de croix
          # (anneau 260% de large) garde une longueur d'avance sur le bord du voile
          # (230% / 130% ≈ ellipse qui atteint tous les bords d'écran en même temps).
          act3_onde:
            {
              order: 3,
              target: croix.emission.zone.w,
              from: "30%",
              to: "260%",
              duration: 3.3,
            }
          act3_voile_w:
            {
              order: 3,
              target: voile.size.w,
              from: 0,
              to: "230%",
              duration: 3.3,
              # Le voile blanc recouvre tout l'écran (~3,85 s) → soulagement, ET c'est L'INSTANT où
              # l'on retire le crâne : masqué par le blanc, il ne « saute » pas à l'écran ; quand le
              # voile se dissipe c'est la page normale qui paraît. Le retrait est ancré sur l'ACTE,
              # pas sur un délai en dur côté worker — si la scène est retouchée, il suit tout seul.
              on_end:
                {
                  vib: { order: 1, action: "dvvibrations.start.heal_relief" },
                  skull: { order: 2, action: "worker.hide_skull" },
                },
            }
          act3_voile_h:
            {
              order: 3,
              target: voile.size.h,
              from: 0,
              to: "130%",
              duration: 3.3,
            }
          # -- Extinction de l'émission (les croix déjà nées finissent leur vie) -----
          act4_croix:
            { order: 4, target: croix.emission.rate, to: 0, duration: 0.2 }
          # -- Acte 3 : écran totalement blanc, maintien 2 s -------------------------
          act5_hold: { order: 5, type: hold, duration: 2.0 }
          # -- Acte 4 : le voile s'efface en 2 s, l'écran précédent réapparaît -------
          act6_fade:
            { order: 6, target: voile.opacity, from: 1, to: 0, duration: 2.0 }

      # Scène "giftxp" : célébration d'un CADEAU d'XP de la guilde (bonus offert sans
      # tâche finie). Plein de petits symboles dorés (croix "+") éclosent aléatoirement sur
      # TOUT l'écran (zone rect 100%) tandis qu'un voile doré plein écran monte de l'opacité
      # 0 à 1 en 2 s → l'écran devient complètement doré. Maintien, extinction des symboles,
      # puis le doré s'estompe en fondu (opacity 1→0) pour rendre l'écran précédent.
      # Scène mortelle, rejouable (dvflame.start.giftxp). Pilotée par worker._showGiftAnimation.
      giftxp:
        lifecycle: mortal
        autostart: false
        on_finished: # cf. burn : dégel de l'écran + reprise de la musique
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Voile doré plein écran : opacité 0 → 1 en 2 s (écran "complètement doré").
          dore:
            type: fill
            order: 10
            color: "#D4AF37" # or (tunable : #FFC107 / #FFB300 pour un or plus chaud)
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0
          # Symboles dorés apparaissant aléatoirement sur TOUT l'écran (zone rect 100%),
          # rendus AU-DESSUS du voile (order plus grand) pour rester visibles sur le doré.
          symboles:
            type: particles
            order: 20
            particle_shape: cross # petit "+" doré (le moteur ne fait que circle/cross)
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "100%", h: "100%" } }
            lifetime: { min: 0.6, max: 1.4 }
            velocity: { angle: -90, angle_var: 180, speed: 8, speed_var: 6 }
            particle_size: { start: 4, peak: 18, end: 0, peak_at: 0.4 }
            size_var: 0.6 # petits et grands symboles mêlés
            opacity_var: 0.7 # éclats variés
            colors:
              c1: { order: 1, color: "#FFF59D" } # or clair (naissance)
              c2: { order: 2, color: "#FFC107" } # or franc (sommet)
              c3: { order: 3, color: "#00FFB300" } # fondu transparent (mort)

        effects:
          # -- Acte 1 : éclosion des symboles partout + montée du voile doré (2 s) ---
          act1_haptic: # beat t=0 (hold parallèle, cf. scène burn) : scintillement léger
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.gift_sparkle" } },
            }
          act1_symboles:
            {
              order: 1,
              target: symboles.emission.rate,
              to: 240,
              duration: 0.15,
            }
          act1_dore:
            {
              order: 1,
              target: dore.opacity,
              from: 0,
              to: 1,
              duration: 2.0,
              # L'écran est complètement doré → carillon.
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.gift_chime" } },
            }
          # -- Acte 2 : maintien écran doré (le splash est lisible) ------------------
          act2_hold: { order: 2, type: hold, duration: 1.5 }
          # -- Acte 3 : extinction de l'émission (les symboles nés finissent leur vie) -
          act3_symboles:
            { order: 3, target: symboles.emission.rate, to: 0, duration: 0.2 }
          # -- Acte 4 : le doré s'efface en 2 s, l'écran précédent réapparaît --------
          act4_fade:
            { order: 4, target: dore.opacity, from: 1, to: 0, duration: 2.0 }

      # Scène "giftgold" : célébration « cadeau d'or de la guilde » — une pluie de pièces
      # dorées (petits cercles) tombe du haut pendant ~2 s pendant qu'une nappe d'or monte du
      # bas et remplit l'écran ; les pièces semblent s'empiler sur l'or (pas de collision réelle :
      # leur lifetime les fait « mourir » à hauteur de la nappe montante, cf. ratio de vitesse du
      # burn). Écran maintenu doré (splash lisible), puis le doré s'efface en fondu (opacity 1 → 0)
      # pour rendre l'écran précédent. Même mécanique que giftxp (worker._showGiftGoldAnimation).
      giftgold:
        lifecycle: mortal
        autostart: false
        on_finished: # cf. burn : dégel de l'écran + reprise de la musique
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Nappe d'or qui MONTE DU BAS : anchré bottom_center, size.h 0 → 100% (idiome flood
          # du burn/carbone). opacity plein (défaut) pendant la montée, puis fondu à l'acte 4.
          dore:
            type: fill
            order: 10
            color: "#D4AF37" # or (même teinte que giftxp)
            position: { x: "50%", y: "100%" }
            anchor: bottom_center
            size: { w: "100%", h: 0 }
          # Pièces dorées qui TOMBENT : émises depuis une ligne en haut de l'écran, vers le bas
          # (angle 90) avec gravité (acceleration.y). Rendues AU-DESSUS de la nappe (order plus
          # grand) → visibles sur la zone pas encore dorée, avalées par l'or à mesure qu'il monte.
          pieces:
            type: particles
            order: 20
            particle_shape: circle # pièces = petits cercles (le moteur ne fait que circle/cross)
            position: { x: "50%", y: 0 }
            emission: { rate: 0, zone: { shape: line, w: "100%", h: 0 } }
            lifetime: { min: 1.6, max: 2.4 } # ~temps de chute : réglé pour mourir vers la nappe d'or
            velocity: { angle: 90, angle_var: 12, speed: 60, speed_var: 25 }
            acceleration: { y: 120 } # gravité (chute qui s'accélère)
            particle_size: { start: 13, end: 11 } # pièces d'un calibre régulier
            size_var: 0.4 # quelques pièces plus grosses/petites
            opacity_var: 0.3
            colors:
              c1: { order: 1, color: "#FFF59D" } # or clair (naissance)
              c2: { order: 2, color: "#FFC107" } # or franc
              c3: { order: 3, color: "#FFB300" } # or chaud (mort, reste opaque = fond doré)

        effects:
          # -- Acte 1 : la pluie démarre + la nappe d'or monte du bas (~2 s) ----------
          act1_haptic: # beat t=0 (hold parallèle, cf. scène burn) : les pièces claquent
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.coins_rain" } },
            }
          act1_pieces:
            { order: 1, target: pieces.emission.rate, to: 200, duration: 0.15 }
          act1_dore:
            {
              order: 1,
              target: dore.size.h,
              from: 0,
              to: "100%",
              duration: 2.0,
              curve: ease_in,
              # La nappe d'or a rempli l'écran → l'or se pose.
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.coins_settle" } },
            }
          # -- Acte 2 : maintien écran doré (le splash est lisible) ------------------
          act2_hold: { order: 2, type: hold, duration: 1.5 }
          # -- Acte 3 : extinction de la pluie (les pièces nées finissent leur chute) -
          act3_pieces:
            { order: 3, target: pieces.emission.rate, to: 0, duration: 0.2 }
          # -- Acte 4 : le doré s'efface en 2 s, l'écran précédent réapparaît --------
          act4_fade:
            { order: 4, target: dore.opacity, from: 1, to: 0, duration: 2.0 }

      # Scène "gameover" : célébration de MORT (0 PV) — MIROIR de la scène "heal". Elle masque la
      # transition écran de jeu → écran de mort (le soin masque la transition inverse). 3 temps :
      #   1. l'écran devient NOIR progressivement (voile noir, opacity 0 → 1) — PAS de cendres.
      #   2. écran noir stable : SEULEMENT ALORS worker._celebrateDeath pose le splash "GAME OVER"
      #      (blanc + squelette sur fond noir) et applique le crâne SOUS le noir (à ~4 s) ; on attend.
      #   3. SORTIE : le noir s'efface PROGRESSIVEMENT en 1 s (pas de bascule sèche) et, dès le début
      #      de ce fondu, une pluie SOUTENUE de cendres NOIRES est produite pendant ~2 s, tombant
      #      VERTICALEMENT (angle 90 + gravité) → l'écran de mort (crâne + gage) se dévoile derrière la
      #      pluie, qui dure longtemps avant de se dissoudre (lifetime long + fondu transparent).
      # Scène mortelle, rejouable (dvflame.start.gameover). Pilotée par worker._celebrateDeath.
      gameover:
        lifecycle: mortal
        autostart: false
        # cf. burn. L'ambiance reprise sera `ambiant_dead` : le worker l'a déclarée pendant que la
        # musique était coupée, dvsound la joue à la reprise. dvinterlude n'a pas à savoir mourir.
        on_finished:
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Voile NOIR plein écran : opacité 0 → 1 (l'écran devient noir), puis 1 → 0 PROGRESSIVEMENT
          # en 1 s à la sortie (révèle l'écran de mort en douceur, derrière les cendres). Sous les cendres.
          noir:
            type: fill
            order: 5
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0
          # Cendres NOIRES : pluie SOUTENUE depuis TOUT l'écran (zone rect 100%), produite en CONTINU
          # pendant ~2 s à la sortie (pas un burst d'un coup → moins éphémère), tombant VERTICALEMENT
          # vers le bas (angle 90, faible dispersion) avec gravité. Lifetime LONG → elles tombent
          # longtemps avant de se dissoudre (couleur → transparent en fin de vie). Au-DESSUS du noir.
          cendres:
            type: particles
            order: 20
            particle_shape: circle
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "100%", h: "100%" } }
            velocity: { angle: 90, angle_var: 10, speed: 40, speed_var: 20 } # chute quasi VERTICALE
            acceleration: { x: 0, y: 90 } # gravité (la chute s'accélère)
            lifetime: { min: 3.5, max: 5.5 } # durent LONGTEMPS avant de se dissoudre
            particle_size: { start: 9, end: 4 }
            size_var: 0.5
            opacity_var: 0.5
            blur: 1
            colors:
              c1: { order: 1, color: "#000000" } # cendre NOIRE (naissance)
              c2: { order: 2, color: "#000000" } # noir (opaque quasi toute la vie)
              c3: { order: 3, color: "#00000000" } # fondu transparent (dissolution en fin de vie)

        effects:
          # Timeline PHASÉE (rythme du soin) :
          #   phase 1 (act1, 3 s) : l'écran devient NOIR progressivement (sans cendres).
          #   phase 2 (act2, hold) : écran noir ; c'est SEULEMENT LÀ que le splash « GAME OVER » et le
          #     crâne sont posés (worker.show_gameover, tiré par la fin de l'acte 1).
          #   phase 3 (act3+) : SORTIE — le noir s'efface PROGRESSIVEMENT (1 s) et, dès le début du
          #     fondu, les cendres sont produites en CONTINU ~2 s (act3 démarre, act4 maintient, act5
          #     coupe) → écran de mort révélé en douceur ; la pluie tombe (act6) avant de se dissoudre.
          # -- Acte 1 : l'écran devient NOIR progressivement (opacity 0 → 1), SANS cendres --------
          # Beat t=0 (hold parallèle, cf. scène burn) : glas de 2,55 s — trois coups sourds
          # espacés puis la chute (boom), pendant que l'écran noircit (3 s).
          act1_haptic:
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.death_toll" } },
            }
          # Sa fin = L'INSTANT où le noir est plein : on y pose le splash « GAME OVER » et on applique
          # le crâne SOUS le noir (il reste masqué jusqu'au burst de cendres qui le révèle). Miroir du
          # retrait du crâne sous le blanc dans le soin — ancré sur l'ACTE, pas sur un délai en dur.
          act1_noir:
            {
              order: 1,
              target: noir.opacity,
              from: 0,
              to: 1,
              duration: 3.0,
              on_end: { death: { order: 1, action: "worker.show_gameover" } },
            }
          # -- Acte 2 : maintien écran noir (le splash « GAME OVER » y vit sa vie) ----------------
          # Long (4,5 s) : laisse le splash faire fondu-entrant / lecture / fondu-sortant AVANT la
          # sortie (cf. gameover_label fadein/duration/fadeout).
          # Sa fin (~7,5 s) = la SORTIE : le noir se brise en cendres → burst haptique.
          act2_hold:
            {
              order: 2,
              type: hold,
              duration: 4.5,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.death_burst" } },
            }
          # -- Acte 3 : SORTIE — le noir DISPARAÎT PROGRESSIVEMENT en 1 s, et l'émission de cendres
          # DÉMARRE au même instant (dès le début du fondu). Pas de bascule sèche vers l'écran de mort :
          # il se dévoile pendant que le noir s'efface, derrière la pluie de cendres.
          act3_noir:
            { order: 3, target: noir.opacity, from: 1, to: 0, duration: 1.0 }
          act3_cendres:
            { order: 3, target: cendres.emission.rate, to: 2500, duration: 0.2 }
          # -- Acte 4 : on MAINTIENT l'émission (hold) → cendres produites en CONTINU, pas d'un coup :
          # émission ON de act3 (1 s) + ce hold (1 s) ≈ 2 s de production DEPUIS le début du fadeout.
          act4_hold: { order: 4, type: hold, duration: 1.0 }
          # -- Extinction de l'émission après ~2 s (les cendres déjà nées finissent de tomber) -------
          act5_cendres:
            { order: 5, target: cendres.emission.rate, to: 0, duration: 0.2 }
          # -- Acte 5 : on laisse la pluie de cendres tomber et se dissoudre (lifetime long) -------
          act6_hold: { order: 6, type: hold, duration: 4.5 }

      # Scène "victory" : célébration « tâche accomplie et validée ». Une simple image
      # (victory_nobg.png) en fondu — apparition 1 s (opacity 0 → 1), maintien 1 s, disparition 1 s —
      # jouée par-dessus l'écran courant (le tiroir), sur un son unique (tatadaa.mp3, joué par
      # dvinterlude 0,5 s avant le visuel). Aucun voile ni particule : c'est une victoire nette, pas un
      # cadeau doré (cf. worker._showVictoryAnimation, à ne pas confondre avec giftxp).
      victory:
        lifecycle: mortal
        autostart: false
        on_finished: # cf. burn : dégel de l'écran + reprise de la musique
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Image plein cadre, centrée, opacité 0 au départ (le fondu la révèle). sprite_static rend
          # l'image et anime son canal opacity (cf. dvspritestatic_motor). size = la BOÎTE (96 % de
          # l'écran, une marge tout autour) et stretch RATIO_IN cadre l'image DEDANS à son ratio
          # natif, centrée : l'image est carrée, l'écran est en portrait — sans RATIO_IN elle serait
          # étirée à la boîte (deux fois plus haute que large). Valeurs identiques à DvImage.
          img:
            type: sprite_static
            order: 10
            image: "images/big/victory_nobg.png"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "96%", h: "96%" }
            stretch: "RATIO_IN"
            opacity: 0
        effects:
          # -- Acte 1 : apparition (opacity 0 → 1) en 1 s -----------------------------
          act1_fadein:
            { order: 1, target: img.opacity, from: 0, to: 1, duration: 1.0 }
          # -- Acte 2 : maintien de l'image 1 s ---------------------------------------
          act2_hold: { order: 2, type: hold, duration: 1.0 }
          # -- Acte 3 : disparition (opacity 1 → 0) en 1 s → l'écran (tiroir) réapparaît -
          act3_fadeout:
            { order: 3, target: img.opacity, from: 1, to: 0, duration: 1.0 }

      # Scène "butin" : ouverture du coffre du clan — la plus longue et la plus fournie des
      # célébrations (9,95 s). Le morceau, lui, dure ~11,5 s audibles : il DÉBORDE volontairement le
      # visuel et se poursuit sur l'écran de récompenses (cf. `music: hold` de l'interlude). Huit actes :
      #   1. (0,9 s) nuit chaude + le coffre SURGIT au centre (elastic_out) dans un halo doré
      #   2. (2,0 s) il se CHARGE : le halo monte, des braises fuient déjà par les jointures
      #   3. (0,35 s) il ÉCLATE : flash d'or + fontaine de pièces, confettis et gerbe de braises
      #   4. (2,6 s) le SPECTACLE : les papillons de lumière montent, le splash y vit sa vie
      #   5. (1,2 s) une nappe d'or INONDE l'écran par le bas (idiome flood du burn/giftgold)
      #   6. (1,1 s) maintien COUVERT : c'est LÀ que le worker navigue vers l'écran de récompenses
      #   7. extinction des émissions
      #   8. (1,6 s) l'or se dissipe et découvre l'écran de récompenses
      #
      # >>> Les actes 5 et 6 sont un mécanisme, pas une décoration : worker.butin_reveal est tiré à
      # la FIN de l'acte 5 (écran plein or) et empile la page de récompenses SOUS la nappe, que
      # l'acte 8 dissout. Aucune bascule sèche n'est visible.
      # >>> L'acte 6 pilote la nappe par des tweens CONSTANTS (100% → 100%) et non par un hold :
      # la vue de la page qui vient d'être empilée s'attache à la scène EN COURS et ne connaît que
      # les canaux activement pilotés — un hold la laisserait naître avec une nappe à zéro, donc
      # transparente, et la bascule se verrait.
      butin:
        lifecycle: mortal
        autostart: false
        on_finished: # cf. burn : dégel de l'écran + reprise de la musique
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Nuit du donjon : un noir CHAUD, à peine brun — la torche au loin. Cette célébration ne
          # se distingue pas par une couleur à part (l'or, le feu et la cendre sont la palette de
          # l'app), mais par sa LUMIÈRE : c'est la plus claire des six.
          voile:
            type: fill
            order: 5
            color: "#0F0805"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0
          # Halo doré derrière le coffre : grandit avec lui, puis monte en intensité pendant la
          # charge et s'éteint dans le flash.
          lueur:
            type: fill
            shape: circle
            order: 8
            color: "#FFD54F"
            position: { x: "50%", y: "52%" }
            anchor: center
            size: { w: 0, h: 0 }
            opacity: 0.5
          # Le coffre : l'image du catalogue d'items (déjà téléchargée, vague major). sprite_static
          # n'anime que size/opacity — il ne bouge donc pas, il GRANDIT depuis le centre (anchor).
          coffre:
            type: sprite_static
            order: 10
            image: "images/big/chest_item_nobg.png"
            position: { x: "50%", y: "52%" }
            anchor: center
            size: { w: 0, h: 0 }
            stretch: "RATIO_IN"
          # Flash de l'éclatement : un disque d'or clair (et non blanc : le donjon n'a pas de blanc
          # froid) qui avale l'écran en 0,35 s puis se dissout.
          eclat:
            type: fill
            shape: circle
            order: 30
            color: "#FFF3D0"
            position: { x: "50%", y: "52%" }
            anchor: center
            size: { w: 0, h: 0 }
          # Fontaine de pièces : la recette de giftgold INVERSÉE — elles jaillissent du coffre vers
          # le haut (angle -90) et la gravité les fait retomber en gerbe.
          pieces:
            type: particles
            order: 40
            particle_shape: circle
            position: { x: "50%", y: "52%" }
            emission: { rate: 0, zone: { shape: point, w: 0, h: 0 } }
            lifetime: { min: 1.4, max: 2.4 }
            velocity: { angle: -90, angle_var: 40, speed: 300, speed_var: 120 }
            acceleration: { y: 550 } # gravité franche : la gerbe retombe vite
            particle_size: { start: 13, end: 10 }
            size_var: 0.4
            colors:
              c1: { order: 1, color: "#FFF59D" } # or clair (naissance)
              c2: { order: 2, color: "#FFC107" } # or franc
              c3: { order: 3, color: "#00FFB300" } # transparent : la pièce s'efface en tombant
          # Confettis : de vrais petits PAPIERS qui virevoltent, pas des taches de couleur. Trois
          # matières, celles du donjon — parchemin, or vieilli, cuivre. Ils jaillissent du coffre et
          # retombent (gravité franche), le preset `confetti` de dvflame étant, lui, multicolore.
          confettis:
            type: particles
            order: 45
            particle_shape: cross
            position: { x: "50%", y: "52%" }
            emission: { rate: 0, zone: { shape: point, w: 0, h: 0 } }
            lifetime: { min: 2.0, max: 3.2 }
            velocity: { angle: -90, angle_var: 60, speed: 260, speed_var: 110 }
            acceleration: { y: 320 } # le papier retombe, plus lentement que l'or
            particle_size: { start: 11, end: 9 }
            size_var: 0.5
            opacity_var: 0.3
            colors:
              c1: { order: 1, color: "#F5E6C8" } # parchemin
              c2: { order: 2, color: "#E0A83C" } # or vieilli
              c3: { order: 3, color: "#00B87333" } # cuivre, transparent en fin de chute
          # Papillons de lumière : la seule douceur de la scène. Ils MONTENT du bas en dérivant
          # (gravité négative), leur taille bat en cloche — des ailes —, et un léger flou les rend
          # vaporeux. Peu nombreux : c'est une apparition, pas une nuée.
          papillons:
            type: particles
            order: 45
            particle_shape: cross
            position: { x: "50%", y: "100%" }
            emission: { rate: 0, zone: { shape: line, w: "100%", h: 0 } }
            lifetime: { min: 2.4, max: 4.0 }
            velocity: { angle: -90, angle_var: 45, speed: 60, speed_var: 30 }
            acceleration: { y: -30 }
            particle_size: { start: 4, peak: 14, end: 4, peak_at: 0.5 }
            size_var: 0.6
            opacity_var: 0.4
            blur: 1
            colors:
              c1: { order: 1, color: "#FFF3C4" } # lumière pâle
              c2: { order: 2, color: "#FFD54F" } # or vif
              c3: { order: 3, color: "#00FFB300" } # s'éteint en montant
          # Braises : le donjon respire. Elles fuient par les jointures du coffre pendant la charge,
          # puis partent en gerbe à l'éclatement. Miroir des cendres du game over — ici ça monte,
          # c'est chaud, et c'est vivant.
          braises:
            type: particles
            order: 50
            particle_shape: circle
            position: { x: "50%", y: "52%" }
            emission: { rate: 0, zone: { shape: point, w: 0, h: 0 } }
            lifetime: { min: 0.9, max: 2.0 }
            velocity: { angle: -90, angle_var: 70, speed: 140, speed_var: 70 }
            acceleration: { y: -60 } # l'air chaud les emporte vers le haut
            particle_size: { start: 7, peak: 9, end: 0, peak_at: 0.2 }
            size_var: 0.6
            opacity_var: 0.5
            blur: 1
            colors:
              c1: { order: 1, color: "#FFE0B2" } # cœur clair
              c2: { order: 2, color: "#FF6D00" } # braise franche
              c3: { order: 3, color: "#00B71C1C" } # rouge sombre, éteinte
          # Nappe d'or finale : idiome flood (anchor bottom_center, size.h 0 → 100%) du burn et de
          # giftgold. C'est elle qui couvre la navigation vers l'écran de récompenses.
          nappe:
            type: fill
            order: 60
            color: "#D4AF37"
            position: { x: "50%", y: "100%" }
            anchor: bottom_center
            size: { w: "100%", h: 0 }
        effects:
          # -- Acte 1 (0,9 s) : le coffre SURGIT dans son halo ------------------------
          act1_haptic: # beat t=0 (hold parallèle, cf. scène burn) : le coffre force
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.butin_charge" } },
            }
          act1_voile:
            { order: 1, target: voile.opacity, from: 0, to: 0.85, duration: 0.6 }
          # elastic_out : le coffre dépasse sa taille puis se cale — il ARRIVE, il n'apparaît pas.
          act1_coffre_w:
            {
              order: 1,
              target: coffre.size.w,
              from: 0,
              to: "60%",
              duration: 0.9,
              curve: elastic_out,
            }
          act1_coffre_h:
            {
              order: 1,
              target: coffre.size.h,
              from: 0,
              to: "42%",
              duration: 0.9,
              curve: elastic_out,
            }
          act1_lueur_w:
            { order: 1, target: lueur.size.w, from: 0, to: "70%", duration: 0.9 }
          act1_lueur_h:
            { order: 1, target: lueur.size.h, from: 0, to: "45%", duration: 0.9 }
          # -- Acte 2 (2,0 s) : la CHARGE — le halo monte, les braises fuient du coffre -
          act2_lueur:
            { order: 2, target: lueur.opacity, from: 0.5, to: 1, duration: 2.0 }
          act2_braises:
            { order: 2, target: braises.emission.rate, to: 50, duration: 2.0 }
          # -- Acte 3 (0,35 s) : l'ÉCLAT — flash + tout part en même temps -----------
          act3_eclat_w:
            {
              order: 3,
              target: eclat.size.w,
              from: 0,
              to: "320%",
              duration: 0.35,
              curve: ease_out,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.butin_burst" } },
            }
          act3_eclat_h:
            {
              order: 3,
              target: eclat.size.h,
              from: 0,
              to: "320%",
              duration: 0.35,
              curve: ease_out,
            }
          act3_pieces:
            { order: 3, target: pieces.emission.rate, to: 320, duration: 0.1 }
          act3_conf:
            { order: 3, target: confettis.emission.rate, to: 200, duration: 0.1 }
          # Les papillons ne jaillissent pas : ils s'invitent, en petit nombre, et tiennent l'écran
          # pendant que le reste retombe.
          act3_papillons:
            { order: 3, target: papillons.emission.rate, to: 30, duration: 0.1 }
          act3_braises:
            { order: 3, target: braises.emission.rate, to: 120, duration: 0.1 }
          act3_lueur:
            { order: 3, target: lueur.opacity, from: 1, to: 0, duration: 0.3 }
          # -- Acte 4 (2,6 s) : le SPECTACLE (le splash y vit sa vie) ----------------
          act4_hold: { order: 4, type: hold, duration: 2.6 }
          act4_eclat:
            { order: 4, target: eclat.opacity, from: 1, to: 0, duration: 0.8 }
          # -- Acte 5 (1,2 s) : la nappe d'or INONDE → navigation SOUS l'or ----------
          # worker.butin_reveal empile l'écran de récompenses pendant que l'or couvre tout.
          act5_nappe:
            {
              order: 5,
              target: nappe.size.h,
              from: 0,
              to: "100%",
              duration: 1.2,
              curve: ease_in,
              on_end:
                {
                  vib: { order: 1, action: "dvvibrations.start.coins_settle" },
                  reveal: { order: 2, action: "worker.butin_reveal" },
                },
            }
          # -- Acte 6 (1,1 s) : maintien COUVERT (tweens constants, cf. en-tête) -----
          act6_nappe_h:
            {
              order: 6,
              target: nappe.size.h,
              from: "100%",
              to: "100%",
              duration: 1.1,
            }
          act6_nappe_o:
            { order: 6, target: nappe.opacity, from: 1, to: 1, duration: 1.1 }
          # -- Acte 7 : extinction des émissions (les particules nées finissent leur vie) --
          act7_pieces:
            { order: 7, target: pieces.emission.rate, to: 0, duration: 0.2 }
          act7_conf:
            { order: 7, target: confettis.emission.rate, to: 0, duration: 0.2 }
          act7_papillons:
            { order: 7, target: papillons.emission.rate, to: 0, duration: 0.2 }
          act7_braises:
            { order: 7, target: braises.emission.rate, to: 0, duration: 0.2 }
          # -- Acte 8 (1,6 s) : l'or se dissipe → l'écran de récompenses paraît ------
          act8_nappe:
            { order: 8, target: nappe.opacity, from: 1, to: 0, duration: 1.6 }
          act8_voile:
            { order: 8, target: voile.opacity, from: 0.85, to: 0, duration: 1.6 }

      # ---------------------------------------------------------------------------------
      # -- Scène "intro" (accueil du nouveau joueur) ------------------------------------
      # La plus longue du jeu (~29 s) et la seule qui se joue AVANT le réseau : quatre
      # tableaux embarqués dans le paquet, sur un lit d'ambiance et la voix du conteur.
      # À cet instant aucun royaume n'a été choisi, donc aucun datacenter n'est connu et
      # rien ne peut être téléchargé — tout ce qu'on voit et entend ici vient du bundle
      # (cf. build_assets.yml, étape `intro`).
      #
      # ⚠ CHEMINS D'IMAGE NUS, SANS PRÉFIXE `assets/`. DvImage et DvSplash tolèrent les
      #   deux (ils retirent le préfixe avant de résoudre), dvflame NON : il passe la
      #   chaîne telle quelle à deva_asset. « assets/intro/big/t1_maison.png » ne
      #   résoudrait rien, et la scène s'ouvrirait sur du vide.
      #
      # ⚠ CHAQUE TABLEAU OUVRE SUR UN BEAT. Le `hold` de 0,05 s posé en PARALLÈLE de son
      #   groupe ne décale rien (un groupe n'avance que quand tous ses effets finis sont
      #   terminés) : il ne sert qu'à porter le on_end qui prévient le worker. C'est lui
      #   qui pose le texte du splash et lance la réplique. Ancré sur l'ACTE, jamais sur
      #   un délai en dur côté Dart : retoucher le rythme d'un tableau ne demande alors
      #   pas une ligne de code. Même idiome que act1_haptic de `burn`.
      #
      # ⚠ LE MAINTIEN ATTEND LA VOIX (`wait_sound`), il ne la devine pas. Une replique
      #   dure ce qu'elle dure — et cette duree n'est connue que du fichier audio, qui
      #   change des qu'on regenere la voix ou qu'on traduit le texte. On l'a recopiee a
      #   la main deux fois, et deux fois elle etait fausse : des repliques de 8,5 s puis
      #   de 20 s tranchees par des actes de 7,3 s. Le `duration` ci-dessous n'est plus
      #   qu'un PLANCHER — ce que dure le tableau si personne ne parle — et `wait_max`
      #   borne l'attente pour qu'un son qui ne finit jamais ne fige pas la scene.
      #
      # Rythme d'un tableau : fondu entrant 1 s → maintien 3 s AU MOINS, PENDANT lequel
      # l'image dérive lentement (scale 1,00 → 1,06) → fondu sortant 0,8 s. Soit 30,6 s
      # rideaux compris. Le maintien est calé sur la VOIX, pas sur l'œil : une réplique
      # de conteur tient en 6 à 7 s, et le fondu croisé qui suit (1,8 s) lui laisse de
      # quoi finir sa phrase par-dessus le tableau suivant.
      #
      # ⚠ LE ZOOM APPARTIENT AU GROUPE DE MAINTIEN, et pas à celui de l'entrée : un
      #   groupe d'`order` n'avance que quand TOUS ses effets finis sont terminés. Un
      #   zoom de 6,8 s posé avec le fondu faisait durer l'entrée 6,8 s, puis le
      #   maintien s'y ajoutait : 12,6 s par tableau, 51 s d'interlude. Une durée ne
      #   se lit jamais effet par effet ici, toujours groupe par groupe.
      intro:
        lifecycle: mortal
        autostart: false
        on_finished:
          end: { order: 1, action: "dvinterlude.finished" }
        objects:
          # Le rideau. Naît transparent (contrairement au `noir` de la fée) : l'écran
          # d'accueil doit rester visible une fraction de seconde, le temps que le tap
          # du joueur se lise comme la CAUSE de ce qui arrive.
          nuit:
            type: fill
            order: 5
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0

          # Les quatre tableaux, tous nés invisibles et empilés dans l'ordre du récit.
          # RATIO_OUT et non RATIO_IN : ces images sont cadrées pour le téléphone (9:16),
          # on veut qu'elles REMPLISSENT l'écran quitte à déborder — une bande noire en
          # haut et en bas ruinerait l'immersion qu'on est venu chercher.
          t1:
            type: sprite_static
            order: 10
            image: "intro/big/t1_maison.webp"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "100%", h: "100%" }
            stretch: "RATIO_OUT"
            opacity: 0

          t2:
            type: sprite_static
            order: 11
            image: "intro/big/t2_monstres.webp"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "100%", h: "100%" }
            stretch: "RATIO_OUT"
            opacity: 0

          t3:
            type: sprite_static
            order: 12
            image: "intro/big/t3_clan.webp"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "100%", h: "100%" }
            stretch: "RATIO_OUT"
            opacity: 0

          t4:
            type: sprite_static
            order: 13
            image: "intro/big/t4_coffre.webp"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "100%", h: "100%" }
            stretch: "RATIO_OUT"
            opacity: 0

          # Poussière du donjon : ouverte sur le 1er tableau, coupée au 3e — c'est
          # exactement le moment où le récit cesse de parler de l'abandon.
          poussiere:
            type: particles
            order: 20
            preset: ashes
            position: { x: "50%", y: "0%" }
            emission: { rate: 0, zone: { shape: line, w: "100%", h: 0 } }
            lifetime: { min: 2.5, max: 5.0 }
            velocity: { speed: 18, speed_var: 12 }
            acceleration: { y: 12 } # elle FLOTTE, elle ne tombe pas : c'est de la poussière
            opacity_var: 0.6

          # Éclat du coffre : n'existe que sur le dernier tableau.
          etincelles:
            type: particles
            order: 21
            preset: sparkles
            position: { x: "50%", y: "62%" }
            emission: { rate: 0, zone: { shape: rect, w: "80%", h: "36%" } }
            lifetime: { min: 0.8, max: 1.8 }
            velocity: { angle: -90, angle_var: 55, speed: 22, speed_var: 14 }
            particle_size: { start: 7, end: 1 }
            blur: 3
            opacity_var: 0.7
            colors:
              c1: { order: 1, color: "#FFFFF3C4" } # or clair (naissance)
              c2: { order: 2, color: "#FFD4AF37" } # or franc
              c3: { order: 3, color: "#00A08736" } # fondu transparent (mort)

        effects:
          # -- Rideau ---------------------------------------------------------------
          a0_nuit: { order: 1, target: nuit.opacity, from: 0, to: 1, duration: 0.6 }

          # -- Tableau 1 : la maison devient donjon ---------------------------------
          b1_beat:
            {
              order: 2,
              type: hold,
              duration: 0.05,
              on_end: { w: { order: 1, action: "worker.on_intro_beat" } },
            }
          b1_in: { order: 2, target: t1.opacity, from: 0, to: 1, duration: 1.0, curve: ease_out }
          b1_dust: { order: 2, target: poussiere.emission.rate, from: 0, to: 26, duration: 1.0 }
          b1_hold:
            {
              order: 3,
              type: hold,
              duration: 3.0,
              wait_sound: intro_voice,
              wait_max: 22.0,
            }
          b1_zoom: { order: 3, target: t1.scale, from: 1.0, to: 1.06, duration: 3.0 }
          b1_out: { order: 4, target: t1.opacity, from: 1, to: 0, duration: 0.8 }

          # -- Tableau 2 : les corvées sont des monstres ----------------------------
          b2_beat:
            {
              order: 5,
              type: hold,
              duration: 0.05,
              on_end: { w: { order: 1, action: "worker.on_intro_beat" } },
            }
          b2_in: { order: 5, target: t2.opacity, from: 0, to: 1, duration: 1.0, curve: ease_out }
          b2_hold:
            {
              order: 6,
              type: hold,
              duration: 3.0,
              wait_sound: intro_voice,
              wait_max: 22.0,
            }
          b2_zoom: { order: 6, target: t2.scale, from: 1.06, to: 1.0, duration: 3.0 }
          b2_out: { order: 7, target: t2.opacity, from: 1, to: 0, duration: 0.8 }
          # La poussière s'éteint AVEC le tableau des monstres : à partir d'ici, la
          # famille reprend la main, et le décor cesse de dire l'abandon.
          b2_dust: { order: 7, target: poussiere.emission.rate, to: 0, duration: 0.8 }

          # -- Tableau 3 : la famille est un clan -----------------------------------
          b3_beat:
            {
              order: 8,
              type: hold,
              duration: 0.05,
              on_end: { w: { order: 1, action: "worker.on_intro_beat" } },
            }
          b3_in: { order: 8, target: t3.opacity, from: 0, to: 1, duration: 1.0, curve: ease_out }
          b3_hold:
            {
              order: 9,
              type: hold,
              duration: 3.0,
              wait_sound: intro_voice,
              wait_max: 22.0,
            }
          b3_zoom: { order: 9, target: t3.scale, from: 1.0, to: 1.06, duration: 3.0 }
          b3_out: { order: 10, target: t3.opacity, from: 1, to: 0, duration: 0.8 }

          # -- Tableau 4 : le coffre --------------------------------------------------
          b4_beat:
            {
              order: 11,
              type: hold,
              duration: 0.05,
              on_end: { w: { order: 1, action: "worker.on_intro_beat" } },
            }
          b4_in: { order: 11, target: t4.opacity, from: 0, to: 1, duration: 1.0, curve: ease_out }
          b4_gold: { order: 11, target: etincelles.emission.rate, from: 0, to: 70, duration: 1.0 }
          b4_hold:
            {
              order: 12,
              type: hold,
              duration: 3.0,
              wait_sound: intro_voice,
              wait_max: 22.0,
            }
          b4_zoom: { order: 12, target: t4.scale, from: 1.06, to: 1.0, duration: 3.0 }
          # La fin de ce fondu est le seul instant de toute la scene ou l'ecran est
          # ENTIEREMENT couvert : le dernier tableau s'est efface, le rideau noir est
          # encore opaque, et rien ne se voit. C'est donc la, et nulle part ailleurs,
          # qu'on change de page — l'acte suivant decouvre l'ecran d'apres, deja en
          # place. Meme mecanique que l'ouverture du butin.
          b4_out:
            {
              order: 13,
              target: t4.opacity,
              from: 1,
              to: 0,
              duration: 0.8,
              on_end: { w: { order: 1, action: "worker.on_intro_reveal" } },
            }
          b4_gold_out: { order: 13, target: etincelles.emission.rate, to: 0, duration: 0.8 }

          # -- Lever du rideau : l'écran d'accueil réapparaît une seconde, puis le
          #    worker navigue vers le royaume (on_finished de l'interlude).
          z_out: { order: 14, target: nuit.opacity, from: 1, to: 0, duration: 0.8 }

      # -- Scène "pacte" (les conditions viennent d'être acceptées) ----------------------
      # Quatre secondes de célébration, et la seule du tunnel : un bouclier qui se pose,
      # deux épées qui claquent dessus, « c'est parti ». Elle tombe juste après le seul
      # écran aride du parcours — ce n'est pas une récompense décorative, c'est ce qui
      # dit que la partie administrative est finie.
      #
      # ⚠ LES ÉPÉES NE SE DÉPLACENT PAS, ELLES SE RAPPROCHENT. Animer `position.x`
      #   demanderait des pixels monde — un effet pose une valeur absolue, pas un
      #   pourcentage —, donc une scène qui ne tiendrait que sur un format d'écran. Une
      #   échelle qui tombe de 2,4 à 1 donne la même lecture (l'objet vient vers nous et
      #   s'arrête net) et se moque de la taille de l'appareil.
      #
      # ⚠ LE CHOC SONNE À LA FIN DU RAPPROCHEMENT, pas à son début : le `hold` porteur du
      #   hook dure exactement le temps de l'échelle. Un son joué au lancement du groupe
      #   se serait entendu une demi-seconde avant que les lames ne se touchent.
      pacte:
        lifecycle: mortal
        autostart: false
        objects:
          nuit:
            type: fill
            order: 1
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0

          # ⚠ `w` ET `h` : UNE SEULE DES DEUX NE SUFFIT PAS. Le cadrage passe par
          #   `fitRect`, qui calcule `min(boiteL/imageL, boiteH/imageH)` en `RATIO_IN`.
          #   Sans hauteur, le second rapport vaut zero, le facteur aussi, et le sprite
          #   est dessine en taille nulle — invisible, sans le moindre message. C'est ce
          #   qui a rendu ce tableau entierement vide alors que sa timeline se deroulait
          #   normalement, beats et voix compris.
          #
          # ⚠ LA BOITE DOIT AVOIR L'ORIENTATION DE L'IMAGE. En `RATIO_IN`, c'est la plus
          #   petite des deux contraintes qui l'emporte : une epee VERTICALE dans une
          #   boite plus large que haute se voit reduite a la hauteur de la boite, donc
          #   rapetissee — et, une fois pivotee, elle paraissait couchee. Les epees ont
          #   desormais des boites hautes, le bouclier une boite large.
          bouclier:
            type: sprite_static
            order: 5
            image: "intro/pacte/shield.webp"
            position: { x: "50%", y: "46%" }
            anchor: center
            size: { w: "86%", h: "48%" }
            opacity: 0
            scale: 0.5

          # ⚠ `w` ET `h` : UNE SEULE DES DEUX NE SUFFIT PAS. Le cadrage passe par
          #   `fitRect`, qui calcule `min(boiteL/imageL, boiteH/imageH)` en `RATIO_IN`.
          #   Sans hauteur, le second rapport vaut zero, le facteur aussi, et le sprite
          #   est dessine en taille nulle — invisible, sans le moindre message. C'est ce
          #   qui a rendu ce tableau entierement vide alors que sa timeline se deroulait
          #   normalement, beats et voix compris.
          epee_g:
            type: sprite_static
            order: 8
            image: "intro/pacte/sword_left.webp"
            position: { x: "50%", y: "46%" }
            anchor: center
            # ⚠ LA LARGEUR DOIT DEPASSER 100 %, ET CE N'EST PAS UNE ERREUR. L'image est
            #   CARREE (le `trim` la rend telle), et `RATIO_IN` retient la plus petite des
            #   deux contraintes : a 58 % de large, c'est la largeur qui bornait, et l'epee
            #   sortait a 231 px quand le bouclier en faisait 336 — une lame plus courte
            #   que l'ecu qu'elle croise. Pour qu'une hauteur de 98 % soit la contrainte
            #   qui gagne, il faut lui laisser de la marge en largeur.
            #
            #   Ce que cette boite deborde est TRANSPARENT : l'epee n'occupe que 100 px des
            #   384 de son carre. Seules la pointe et le pommeau mordent legerement le
            #   cadre apres la rotation, ce qui sert le propos.
            #
            #   Resultat : 672 px de lame contre 336 de bouclier, soit le double demande —
            #   et le rapport tient quel que soit le format de l'ecran, les deux etant
            #   bornes par la meme hauteur.
            size: { w: "175%", h: "98%" }
            # ⚠ 22° ET NON 34° : les epees sont rendues VERTICALES, et la rotation
            #   s'ajoute a leur inclinaison propre. A 34 de chaque cote, les lames
            #   se croisaient presque a l'horizontale — un X couche au lieu du X
            #   dresse qu'on attend au-dessus d'un bouclier.
            rotation: -22
            opacity: 0
            scale: 2.4

          # ⚠ `w` ET `h` : UNE SEULE DES DEUX NE SUFFIT PAS. Le cadrage passe par
          #   `fitRect`, qui calcule `min(boiteL/imageL, boiteH/imageH)` en `RATIO_IN`.
          #   Sans hauteur, le second rapport vaut zero, le facteur aussi, et le sprite
          #   est dessine en taille nulle — invisible, sans le moindre message. C'est ce
          #   qui a rendu ce tableau entierement vide alors que sa timeline se deroulait
          #   normalement, beats et voix compris.
          epee_d:
            type: sprite_static
            order: 9
            image: "intro/pacte/sword_right.webp"
            position: { x: "50%", y: "46%" }
            anchor: center
            size: { w: "175%", h: "98%" }
            rotation: 22
            opacity: 0
            scale: 2.4

          # L'ANNEAU DE FEU qui part du centre et devore l'ecran. Meme matiere que la
          # montee de niveau (`burn`), mais en expansion circulaire : une zone d'emission
          # `ring` dont on fait croitre le diametre. Les particules naissent donc TOUJOURS
          # sur le front, jamais derriere lui — c'est ce qui donne le mur de flammes plutot
          # qu'un nuage qui grossit.
          #
          # ⚠ `order` AU-DESSUS DES SPRITES (20 contre 5-9) : le feu passe DEVANT le
          #   bouclier et les epees. C'est lui qui les emporte a la fin du tableau.
          brasier:
            type: particles
            order: 20
            preset: flame
            position: { x: "50%", y: "46%" }
            emission: { rate: 0, zone: { shape: ring, w: 0, h: 0 } }
            particle_size: { start: 38, end: 8 }
            velocity: { angle: -90, angle_var: 180, speed: 34, speed_var: 26 }
            lifetime: { min: 0.8, max: 1.8 }

          # Les cendres que le front laisse derriere lui, qui retombent.
          cendres:
            type: particles
            order: 21
            preset: ashes
            position: { x: "50%", y: "46%" }
            emission: { rate: 0, zone: { shape: ring, w: 0, h: 0 } }
            velocity: { speed: 30, speed_var: 20 }
            acceleration: { y: 60 }
            lifetime: { min: 1.6, max: 3.2 }

          etincelles:
            type: particles
            order: 12
            preset: sparkles
            position: { x: "50%", y: "46%" }
            emission: { rate: 0, zone: { shape: rect, w: "40%", h: "26%" } }
            lifetime: { min: 0.4, max: 1.1 }
            velocity: { angle: -90, angle_var: 180, speed: 55, speed_var: 30 }
            particle_size: { start: 6, end: 1 }
            blur: 2
            opacity_var: 0.6
            colors:
              c1: { order: 1, color: "#FFFFF3C4" }
              c2: { order: 2, color: "#FFD4AF37" }
              c3: { order: 3, color: "#00A08736" }

        effects:
          q1_nuit: { order: 1, target: nuit.opacity, from: 0, to: 1, duration: 0.35, curve: ease_in }

          q2_ecu: { order: 2, target: bouclier.opacity, from: 0, to: 1, duration: 0.30 }
          q2_pose: { order: 2, target: bouclier.scale, from: 0.5, to: 1.0, duration: 0.45, curve: back_out }

          q3_g: { order: 3, target: epee_g.opacity, from: 0, to: 1, duration: 0.10 }
          q3_g_vient: { order: 3, target: epee_g.scale, from: 2.4, to: 1.0, duration: 0.28, curve: ease_in }
          # ⚠ 0,03 s ET NON 0,28 : LE SON PART AVEC LE MOUVEMENT, pas a son terme. Le
          #   commentaire d'origine visait juste — un choc sonne quand les lames se
          #   touchent — mais comptait sans le temps d'attaque : entre le declenchement,
          #   le mixage et l'enveloppe du fichier, ce qu'on entend arrive toujours apres
          #   ce qu'on a demande. Cale sur la fin du rapprochement, le choc tombait une
          #   demi-seconde apres l'image.
          q3_choc:
            {
              order: 3,
              type: hold,
              duration: 0.03,
              on_end: { w: { order: 1, action: "worker.on_pacte_beat" } },
            }

          q4_d: { order: 4, target: epee_d.opacity, from: 0, to: 1, duration: 0.10 }
          q4_d_vient: { order: 4, target: epee_d.scale, from: 2.4, to: 1.0, duration: 0.28, curve: ease_in }
          q4_choc:
            {
              order: 4,
              type: hold,
              duration: 0.03,
              on_end: { w: { order: 1, action: "worker.on_pacte_beat" } },
            }
          q4_feu: { order: 4, target: etincelles.emission.rate, from: 0, to: 110, duration: 0.25 }

          # La replique, lancee des que les lames sont croisees.
          q5_voix:
            {
              order: 5,
              type: hold,
              duration: 0.05,
              on_end: { w: { order: 1, action: "worker.on_pacte_beat" } },
            }
          q5_calme: { order: 5, target: etincelles.emission.rate, to: 0, duration: 0.6 }

          # On tient tant que la voix parle — jamais moins d'une seconde et demie, jamais
          # plus de huit : meme mecanique que les tableaux de l'accueil.
          q6_tenue:
            {
              order: 6,
              type: hold,
              duration: 1.5,
              wait_sound: onb_voice,
              wait_max: 8.0,
            }

          # ⚠ LA FIN DE CE GROUPE EST L'INSTANT DE LA BASCULE. Les trois objets viennent
          #   de s'effacer, le voile noir est encore à 1 : l'écran est ENTIÈREMENT
          #   couvert, et il le restera le temps de `q8_jour`. C'est là, et nulle part
          #   ailleurs, qu'on peut changer de page sans que personne ne le voie.
          #
          #   Naviguer sur `on_finished` — ce qu'on faisait — plaçait le changement APRÈS
          #   la remontée du voile : l'ancien écran réapparaissait une fraction de
          #   seconde avant de céder la place. C'est exactement ce que `on_covered`
          #   existe pour éviter.
          # ⚠ LE FEU S'ALLUME AVEC SON ONDE, dans le MEME acte. Allume un acte plus tot, il
          #   serait reste un point au centre de l'ecran pendant toute la replique — sa
          #   zone d'emission etant encore nulle — avant de s'ouvrir d'un coup. Le rythme
          #   d'un embrasement, c'est l'allumage ET l'expansion ensemble.
          q7_brasier: { order: 7, target: brasier.emission.rate, from: 0, to: 460, duration: 0.5 }
          q7_feu_son:
            {
              order: 7,
              type: hold,
              duration: 0.05,
              on_end: { son: { order: 1, action: "worker.on_pacte_flammes" } },
            }

          # Le front s'ouvre : de rien a une fois et demie la largeur de l'ecran, pour
          # sortir du cadre par tous les cotes.
          q7_onde: { order: 7, target: brasier.emission.zone.w, from: 0, to: "150%", duration: 2.2 }
          q7_cendres_zone: { order: 7, target: cendres.emission.zone.w, from: 0, to: "150%", duration: 2.2 }
          q7_cendres: { order: 7, target: cendres.emission.rate, from: 0, to: 190, duration: 0.7 }

          q7_fin_ecu:
            {
              order: 7,
              target: bouclier.opacity,
              from: 1,
              to: 0,
              duration: 2.2,
              on_end: { nav: { order: 1, action: "dvinterlude.covered" } },
            }
          q7_fin_g: { order: 7, target: epee_g.opacity, from: 1, to: 0, duration: 2.2 }
          q7_fin_d: { order: 7, target: epee_d.opacity, from: 1, to: 0, duration: 2.2 }
          q8_feu_fin: { order: 8, target: brasier.emission.rate, to: 0, duration: 0.4 }
          q8_cendres_fin: { order: 8, target: cendres.emission.rate, to: 0, duration: 0.4 }
          q8_jour: { order: 8, target: nuit.opacity, from: 1, to: 0, duration: 0.6, curve: ease_out }

        # Cf. `depart` : sans cette ligne, l'interlude ne se terminait que par son
        # garde-fou, quinze secondes après — écran gelé, joueur bloqué.
        on_finished:
          end: { order: 1, action: "dvinterlude.finished" }

      # -- Scène "depart" (on quitte un écran du tunnel) ---------------------------------
      # La moitié manquante d'`arrive` : un rideau noir qui tombe en moins d'une demi-
      # seconde. Le worker la lance, laisse le rideau descendre, PUIS navigue — si bien
      # que le changement d'écran a lieu derrière un noir complet et ne se voit pas.
      # L'écran d'après lève ce même noir avec `arrive`, et l'ensemble se lit comme une
      # seule respiration plutôt que comme deux formulaires qui se succèdent.
      #
      # ⚠ NI `on_end` NI `on_finished`, pour la raison exposée sur `arrive` : la
      #   navigation en `reset` fait coexister deux vues le temps d'une frame, et un hook
      #   posé ici serait tiré par la page qui meurt. C'est le WORKER qui compte le temps
      #   — il sait ce qu'il attend, la scène non.
      #
      # ⚠ LA VUE N'EST MONTÉE QUE SUR LES ÉCRANS QUI PARTENT (`home`, `region_screen`,
      #   `age_screen`), jamais par le masque `page_onboarding`. Une scène mortelle garde
      #   sa dernière pose tant qu'une vue lui est attachée : présente des deux côtés,
      #   elle laisserait l'écran d'arrivée noir pour toujours. Montée du seul côté qui
      #   part, elle meurt avec sa page — et le relais est déjà pris.
      depart:
        lifecycle: mortal
        autostart: false
        objects:
          rideau:
            type: fill
            order: 50
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 0

        # ⚠ LES DEUX NOTIFICATIONS SONT OBLIGATOIRES, et leur absence est ce qui a fait
        #   échouer cette scène pendant tout un après-midi. dvinterlude NE DEVINE RIEN :
        #   il ne sait ni qu'une scène a couvert l'écran, ni qu'elle est terminée. Sans
        #   `dvinterlude.finished`, l'interlude ne s'achevait jamais autrement que par son
        #   garde-fou — plusieurs secondes plus tard, souvent alors que le joueur était
        #   déjà ailleurs. Toutes les scènes d'interlude du thème portent cette ligne ;
        #   celle-ci ne l'avait pas.
        on_finished:
          end: { order: 1, action: "dvinterlude.finished" }

        effects:
          # Le rideau tombe. Sa fin EST le moment de la bascule : l'écran est noir, la
          # page peut changer dessous sans que personne ne le voie.
          d1_nuit:
            {
              order: 1,
              target: rideau.opacity,
              from: 0,
              to: 1,
              duration: 0.45,
              curve: ease_in,
              on_end: { nav: { order: 1, action: "dvinterlude.covered" } },
            }
          # Puis on TIENT le noir, le temps que la page d'arrivée se monte et lève son
          # propre voile (`arrive`). Sans cette tenue, la scène s'achèverait dans la
          # seconde et le rideau disparaîtrait avant que quoi que ce soit n'ait pris le
          # relais — on verrait le changement d'écran, c'est-à-dire exactement ce qu'on
          # cache.
          d2_tenue: { order: 2, type: hold, duration: 0.7 }

      # -- Scène "arrive" (arrivée sur un écran d'onboarding) ----------------------------
      # Deux secondes et demie, AUCUNE image : un voile qui se lève et une volée
      # d'étincelles. Injectée par le masque `page_onboarding` sur les huit écrans du
      # tunnel, elle fait de chaque étape une porte qu'on franchit plutôt qu'un
      # formulaire qui s'affiche.
      #
      # ⚠ NI `on_finished` NI `on_end` — et c'est délibéré. Les écrans d'onboarding
      #   s'enchaînent en `navigate: reset` : deux vues de la même scène coexistent le
      #   temps d'une frame, et la vue PRIMAIRE peut être celle de la page qui meurt.
      #   Un hook posé ici serait tiré par la mauvaise page, ou pas du tout. Ce décor
      #   n'a rien à annoncer à personne : c'est ce qui le rend sûr.
      arrive:
        lifecycle: mortal
        # ⚠ `autostart: true`, ET C'EST CE QUI LA REND FIABLE. Elle etait lancee a la main
        #   par `worker.on_onboarding_appear` — or l'`appear` d'une page est emis AVANT que
        #   ses shapes ne soient montees : au moment du `dvflame.start`, la DvSceneView qui
        #   doit peindre la scene n'existe pas encore. Elle tournait donc sans etre vue.
        #
        #   Avec `autostart`, c'est l'ATTACHEMENT DE LA VUE qui declenche le depart
        #   (`DvScene.attachView`) : par construction, il ne peut plus y avoir de decalage.
        #   L'application n'a plus rien a lancer — elle declare la vue, le voile se leve.
        #
        #   Rejouable : la scene est `mortal`, donc liberee des que sa derniere vue se
        #   detache ; l'ecran suivant en recree une, a l'etat `idle`, qui redemarre.
        autostart: true
        objects:
          voile:
            type: fill
            order: 5
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            # ⚠ NOIR COMPLET, ET NON 0,72. C'est ce qui raccorde `arrive` a `depart` :
            #   l'ecran precedent s'eteint jusqu'au noir, la page change dessous, et
            #   c'est de ce meme noir que le suivant se leve. A 0,72 on voyait le
            #   changement se produire a travers le voile — exactement ce qu'on cache.
            opacity: 1.0

          etincelles:
            type: particles
            order: 10
            preset: sparkles
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "92%", h: "64%" } }
            lifetime: { min: 0.6, max: 1.4 }
            velocity: { angle: -90, angle_var: 70, speed: 16, speed_var: 12 }
            particle_size: { start: 5, end: 1 }
            blur: 2
            opacity_var: 0.7
            colors:
              c1: { order: 1, color: "#FFFFF3C4" }
              c2: { order: 2, color: "#FFD4AF37" }
              c3: { order: 3, color: "#00A08736" }

        effects:
          a1_leve: { order: 1, target: voile.opacity, from: 1.0, to: 0, duration: 1.2, curve: ease_out }
          a1_feu: { order: 1, target: etincelles.emission.rate, from: 0, to: 80, duration: 0.3 }
          a2_fin: { order: 2, target: etincelles.emission.rate, to: 0, duration: 0.9 }

      # Scène "fairy" : la venue de la fée. Elle est L'EXCEPTION du fichier — toutes les
      # autres scènes sont des PARENTHÈSES qui rendent l'écran ; celle-ci ne le rend pas.
      # Quand sa timeline est finie, la fée RESTE, la neige continue de flotter, la musique
      # tourne, et l'écran attend que le joueur choisisse l'une des deux mains.
      #
      # >>> Ce n'est pas un effet de bord, c'est le contrat du moteur : `reportSequenceEnd`
      # marque la scène `finished` mais ne met JAMAIS le game en pause — seul `dvflame.stop`
      # appelle `pauseEngine()` (dvscene_motor). Une scène mortelle finie garde donc sa
      # dernière pose ET continue de tourner tant qu'une vue lui est attachée : les émissions
      # laissées à un taux non nul continuent d'émettre. C'est exactement ce qu'on veut ici,
      # et c'est pourquoi les actes n'ÉTEIGNENT PAS la neige à la fin (contrairement à
      # `gameover.act5_cendres` ou `butin.act7_*`, qui sont des parenthèses, eux).
      #
      # Le fondu de sortie n'est donc pas dans la timeline : il est tiré à la demande, quand
      # le cadeau est choisi, par des `dvflame.trigger` (effets ponctuels hors timeline, qui
      # fonctionnent sur une scène finie puisque le game tourne toujours).
      #
      # Cinq actes, 8,8 s en tout :
      #   1. (2,0 s) NOIR — l'écran se ferme, rien d'autre
      #   2. (0,3 s) la neige se lève : éclats de cristal qui FLOTTENT (aucune gravité)
      #   3. (1,5 s / 3,0 s) les bords se givrent PENDANT que la lumière centrale inonde tout
      #   4. (2,0 s) la fée paraît en fondu par-dessus la lumière
      fairy:
        lifecycle: mortal
        autostart: false
        # Pas de `dvinterlude.finished` ici : la fée n'est pas un interlude. Rien à rendre,
        # rien à dégeler — l'écran lui appartient jusqu'au choix du joueur.
        objects:
          # Le noir naît OPAQUE (opacity: 1, pas d'acte pour l'y amener) : la page s'ouvre déjà
          # fermée. Un fondu au noir aurait laissé voir le tiroir une fraction de seconde.
          noir:
            type: fill
            order: 5
            color: "#000000"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            opacity: 1

          # Éclats de cristal / neige. `acceleration` à ZÉRO et vitesse minuscule : ils
          # FLOTTENT, ils ne tombent pas — c'est toute la différence avec les cendres de
          # `gameover` (qui, elles, portent acceleration.y = 90). `angle_var: 180` couvre le
          # tour complet : la dérive n'a aucune direction privilégiée.
          # Émission à 0 au départ : l'acte 2 l'ouvre, et PLUS RIEN ne la referme.
          neige:
            type: particles
            order: 40
            particle_shape: cross
            position: { x: "50%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "100%", h: "100%" } }
            lifetime: { min: 6.0, max: 11.0 }
            velocity: { angle: -90, angle_var: 180, speed: 7, speed_var: 5 }
            acceleration: { x: 0, y: 0 }
            particle_size: { start: 2, peak: 13, end: 2, peak_at: 0.5 }
            size_var: 0.6
            opacity_var: 0.65
            blur: 1
            colors:
              c1: { order: 1, color: "#00E1F5FF" } # naît transparent (apparition douce)
              c2: { order: 2, color: "#FFFFFF" }   # scintille en plein
              c3: { order: 3, color: "#00BBDEFB" } # s'éteint en bleu glacé transparent

          # Le cadre givré. Image PORTRAIT étirée à l'écran (STRETCH et non RATIO_IN) : le
          # givre est une texture organique, l'étirement ne se voit pas, et c'est le seul
          # cadrage qui garantit que les quatre bords soient couverts sur tous les formats.
          givre:
            type: sprite_static
            order: 30
            image: "images/big/frost_frame_nobg.png"
            position: { x: 0, y: 0 }
            anchor: top_left
            size: { w: "100%", h: "100%" }
            stretch: "STRETCH"
            opacity: 0

          # Ce qui fait VIVRE le givre : quatre bandes de particules le long des bords, très
          # lentes, qui scintillent sur le PNG. Zone `rect` large et plate (ou haute et fine)
          # centrée sur chaque bord.
          givre_haut:
            type: particles
            order: 31
            particle_shape: cross
            position: { x: "50%", y: "4%" }
            emission: { rate: 0, zone: { shape: rect, w: "100%", h: "12%" } }
            lifetime: { min: 1.6, max: 3.2 }
            velocity: { angle: -90, angle_var: 180, speed: 4, speed_var: 3 }
            acceleration: { x: 0, y: 0 }
            particle_size: { start: 1, peak: 8, end: 1, peak_at: 0.5 }
            size_var: 0.5
            opacity_var: 0.6
            blur: 1
            colors:
              c1: { order: 1, color: "#00FFFFFF" }
              c2: { order: 2, color: "#E1F5FE" }
              c3: { order: 3, color: "#00E1F5FE" }
          givre_bas:
            type: particles
            order: 31
            particle_shape: cross
            position: { x: "50%", y: "96%" }
            emission: { rate: 0, zone: { shape: rect, w: "100%", h: "12%" } }
            lifetime: { min: 1.6, max: 3.2 }
            velocity: { angle: -90, angle_var: 180, speed: 4, speed_var: 3 }
            acceleration: { x: 0, y: 0 }
            particle_size: { start: 1, peak: 8, end: 1, peak_at: 0.5 }
            size_var: 0.5
            opacity_var: 0.6
            blur: 1
            colors:
              c1: { order: 1, color: "#00FFFFFF" }
              c2: { order: 2, color: "#E1F5FE" }
              c3: { order: 3, color: "#00E1F5FE" }
          givre_gauche:
            type: particles
            order: 31
            particle_shape: cross
            position: { x: "3%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "10%", h: "100%" } }
            lifetime: { min: 1.6, max: 3.2 }
            velocity: { angle: -90, angle_var: 180, speed: 4, speed_var: 3 }
            acceleration: { x: 0, y: 0 }
            particle_size: { start: 1, peak: 8, end: 1, peak_at: 0.5 }
            size_var: 0.5
            opacity_var: 0.6
            blur: 1
            colors:
              c1: { order: 1, color: "#00FFFFFF" }
              c2: { order: 2, color: "#E1F5FE" }
              c3: { order: 3, color: "#00E1F5FE" }
          givre_droite:
            type: particles
            order: 31
            particle_shape: cross
            position: { x: "97%", y: "50%" }
            emission: { rate: 0, zone: { shape: rect, w: "10%", h: "100%" } }
            lifetime: { min: 1.6, max: 3.2 }
            velocity: { angle: -90, angle_var: 180, speed: 4, speed_var: 3 }
            acceleration: { x: 0, y: 0 }
            particle_size: { start: 1, peak: 8, end: 1, peak_at: 0.5 }
            size_var: 0.5
            opacity_var: 0.6
            blur: 1
            colors:
              c1: { order: 1, color: "#00FFFFFF" }
              c2: { order: 2, color: "#E1F5FE" }
              c3: { order: 3, color: "#00E1F5FE" }

          # L'étoile lointaine. Même montage que le voile de `heal` (fill circle ancré au
          # centre dont on anime la taille), mais pris à l'envers : là-bas le blanc SOULAGE,
          # ici il RÉVÈLE. Ellipse 220 % × 140 % : elle atteint les quatre bords d'un écran
          # portrait au même instant. `order: 20` → sous la fée, au-dessus du noir.
          lumiere:
            type: fill
            shape: circle
            order: 20
            color: "#FFFFFF"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: 0, h: 0 }
            opacity: 0.15

          # La fée. RATIO_IN : l'image est carrée, l'écran est portrait — sans lui elle serait
          # étirée en hauteur. Elle occupe donc toute la largeur, centrée verticalement.
          # `order: 50` : au-dessus de tout, y compris de la neige, qui passe derrière elle.
          fee:
            type: sprite_static
            order: 50
            image: "images/big/fairy_nobg.png"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "100%", h: "100%" }
            stretch: "RATIO_IN"
            opacity: 0

        effects:
          # -- Acte 1 (2,0 s) : le noir, et rien d'autre -----------------------------
          act1_haptic: # beat t=0 (hold parallèle, cf. burn/heal) : le frisson du froid
            {
              order: 1,
              type: hold,
              duration: 0.05,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.fairy_chill" } },
            }
          act1_noir: { order: 1, type: hold, duration: 2.0 }

          # -- Acte 2 (0,3 s) : la neige se lève, et ne se recouchera pas -------------
          act2_neige:
            { order: 2, target: neige.emission.rate, to: 55, duration: 0.3 }
          act2_givre_haut:
            { order: 2, target: givre_haut.emission.rate, to: 26, duration: 0.3 }
          act2_givre_bas:
            { order: 2, target: givre_bas.emission.rate, to: 26, duration: 0.3 }
          act2_givre_gauche:
            { order: 2, target: givre_gauche.emission.rate, to: 30, duration: 0.3 }
          act2_givre_droite:
            { order: 2, target: givre_droite.emission.rate, to: 30, duration: 0.3 }

          # -- Acte 3 : les bords se givrent PENDANT que la lumière monte -------------
          # Les deux vivent dans le même cran d'`order` (donc en parallèle) mais pas sur la
          # même durée : le givre se pose vite (1,5 s), la lumière prend ses 3 s pleines. Le
          # cran ne s'achève qu'au dernier effet fini — c'est bien 3 s au total.
          # `ease_in` : elle démarre à peine (l'étoile lointaine) et finit par tout avaler.
          act3_givre:
            { order: 3, target: givre.opacity, from: 0, to: 1, duration: 1.5 }
          act3_lum_w:
            {
              order: 3,
              target: lumiere.size.w,
              from: 0,
              to: "220%",
              duration: 3.0,
              curve: ease_in,
            }
          act3_lum_h:
            {
              order: 3,
              target: lumiere.size.h,
              from: 0,
              to: "140%",
              duration: 3.0,
              curve: ease_in,
            }
          act3_lum_op:
            {
              order: 3,
              target: lumiere.opacity,
              from: 0.15,
              to: 1,
              duration: 3.0,
              curve: ease_in,
              on_end:
                { vib: { order: 1, action: "dvvibrations.start.fairy_reveal" } },
            }

          # -- Acte 4 (2,0 s) : la fée paraît, et RESTE ------------------------------
          # `on_end` révèle les deux cadeaux. Ancré sur l'ACTE et non sur un délai en dur :
          # si l'on retouche les durées ci-dessus, la révélation suit toute seule.
          act4_fee:
            {
              order: 4,
              target: fee.opacity,
              from: 0,
              to: 1,
              duration: 2.0,
              on_end: { ready: { order: 1, action: "worker.on_fairy_ready" } },
            }

      # Halo vert des deux cadeaux (une vue par main, MÊME scène — dvflame partage une scène
      # entre toutes ses vues). Copie de `notehalo` en vert lumineux : c'est ce qui fait
      # « briller » le libellé du cadeau au lieu de le poser à plat sur l'image.
      # Immortelle et SANS `effects` de scène : rien qui puisse finir, elle respire tant que
      # l'écran est là.
      fairyglow:
        lifecycle: immortal
        objects:
          halo:
            type: fill
            shape: circle
            order: 10
            color: "#69F0AE"
            position: { x: "50%", y: "50%" }
            anchor: center
            size: { w: "80%", h: "80%" }
            opacity: 0.3
            effects:
              souffle:  { type: oscillate, target: opacity, from: 0.16, to: 0.46,  period: 2.2 }
              gonfle_w: { type: oscillate, target: size.w,  from: "68%", to: "94%", period: 2.2 }
              gonfle_h: { type: oscillate, target: size.h,  from: "68%", to: "94%", period: 2.2 }


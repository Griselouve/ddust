      #------------- Prompts IA (dvvertexai) ----------------------
      # Corps des trois prompts, DÉPLACÉS ICI depuis client/config/lang.yml le 2026-09-09.
      # Dans la conf compilée, ajuster une contrainte de ton exigeait un build et une
      # release ; dans ce layer, un push suffit. C'est ce qui rend le garde-fou utile :
      # une contrainte qui se révèle insuffisante en production se corrige le jour même.
      # Résolus par dvprompts.get_prompt via les renvois @@@T:...@@@ de
      # resources_cloud/general/prompts/prompts_General_V1.yml (repli fr).
      # NE PAS traduire les marqueurs NOM: / DESCRIPTION: / ALIAS: — le worker les parse.
      #
      # NE PAS RÉORDONNER NON PLUS : le bloc ALIAS vient EN TÊTE, le texte libre EN DERNIER.
      # Les binaires déjà installés n'ont qu'un parseur naïf, qui avale tout ce qui suit
      # DESCRIPTION: — un layer poussé avec ALIAS en tête leur reste inerte, le même layer avec
      # ALIAS en queue leur ferait afficher le pseudonyme public dans la description. C'est la
      # seule raison de cet ordre, et elle vaut pour tout marqueur ajouté plus tard.
      #
      # Chaque corps se termine par le REGISTRE IMPOSÉ. Il double les filtres de sécurité
      # du modèle (dvvertexai `aimodels.safety`, seuil BLOCK_LOW_AND_ABOVE, reposés par la
      # Cloud Function) et ne les remplace pas : un filtre bloque ce qui est produit, le
      # registre dit ce qu'on demande. Les deux échouent différemment, c'est l'intérêt.

      # Prompts « inspire » (VertexAI) rédigés nativement par langue. Résolus par
      # dvprompts.get_prompt via @@@T:...@@@ (repli fr pour toute langue non traduite).
      # NE PAS traduire les marqueurs NOM: / DESCRIPTION: (le worker les parse).
      prompt_inspire_clan:
        fr: |
          Tu es un assistant créatif pour le jeu Donjons & Savons, où les clans sont des familles qui combattent courageusement des monstres (les tâches ménagères).
          Invente un nom épique et une description engageante pour un clan, en te basant sur ce nom et cette description : '@@@worker.inspire_input@@@'.
          Invente ENSUITE un SECOND nom de clan, qui servira de pseudonyme public : même langue, même style et même longueur que le premier, mais AUCUN mot en commun avec lui — il doit être impossible de deviner le premier à partir du second. Écris de même une seconde description, qui dit la même chose autrement, sans reprendre les images ni les mots caractéristiques de la première.
          Réponds UNIQUEMENT dans ce format exact, DANS CET ORDRE, en conservant les marqueurs ALIAS:, ALIAS_DESCRIPTION:, NOM: et DESCRIPTION: tels quels (ne les traduis pas, ne les réordonne pas) :
          ALIAS: <second nom de clan, 2 à 4 mots>
          ALIAS_DESCRIPTION: <seconde description, 2 à 3 phrases>
          NOM: <nom du clan, 2 à 4 mots>
          DESCRIPTION: <description épique en 2 à 3 phrases>
          Tous les contenus doivent être rédigés en @@@worker.inspire_lang@@@.

          REGISTRE IMPOSÉ — ce texte sera lu par des enfants :
          - Les seuls « monstres » sont des créatures de saleté et de désordre, drôles et inoffensives. Aucune violence envers une personne ou un animal, aucune arme réelle, aucun sang, aucune blessure, aucune mort.
          - Rien qui fasse peur : ni horreur, ni menace, ni punition, ni humiliation, ni moquerie visant quelqu'un.
          - Aucun thème d'adulte : sexualité, séduction, alcool, tabac, drogues, jeux d'argent, politique, religion, maladie.
          - Aucune insulte, aucun juron, aucun mot grossier, même atténué.
          - N'invente aucune donnée personnelle : ni nom de famille, ni adresse, ni école, ni ville, ni âge.
          - Dans le doute, choisis toujours la formulation la plus douce.
        en: |
          You are a creative assistant for the game Dungeons & Soaps, where clans are families who bravely battle monsters (household chores).
          Invent an epic name and an engaging description for a clan, based on this name and description: '@@@worker.inspire_input@@@'.
          THEN invent a SECOND clan name, to be used as a public pseudonym: same language, same style and same length as the first one, but NO word in common with it — it must be impossible to guess the first from the second. Write a second description in the same way, saying the same thing differently, without reusing the images or the distinctive words of the first.
          Reply ONLY in this exact format, IN THIS ORDER, keeping the markers ALIAS:, ALIAS_DESCRIPTION:, NOM: and DESCRIPTION: unchanged (do not translate them, do not reorder them):
          ALIAS: <second clan name, 2 to 4 words>
          ALIAS_DESCRIPTION: <second description, 2 to 3 sentences>
          NOM: <clan name, 2 to 4 words>
          DESCRIPTION: <epic description, 2 to 3 sentences>
          All content must be written in @@@worker.inspire_lang@@@.

          MANDATORY REGISTER - this text will be read by children:
          - The only "monsters" are creatures of dirt and mess, funny and harmless. No violence towards any person or animal, no real weapons, no blood, no injury, no death.
          - Nothing frightening: no horror, no threat, no punishment, no humiliation, no mockery aimed at anyone.

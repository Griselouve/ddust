      # --- Écrans de la boutique -------------------------------------------




      # store_row_subscribe / _desc / store_row_subscription : SUPPRIMÉS. Ils
      # habillaient la ligne « Ma cotisation / Cotisation à jour » qui ouvrait la
      # boutique — un état de compte, là où l'on attend un étal. Les paliers ne
      # vivent plus dans la boutique du tout : ils ont leur page (tiers_page), et
      # leurs noms viennent du catalogue (store_essentiel … store_royaume).

      # --- Lignes de palier : plus aucun libellé de MONTÉE ici -----------------
      # Il a existé ici des libellés « Passer à… » distincts des noms de paliers,
      # pour qu'un clan déjà abonné ne lise pas un tarif comme une dépense de plus.
      # Ils sont supprimés : la page des paliers montre les cinq lignes ensemble, et
      # c'est la MISE EN FORME qui dit où l'on en est (le palier courant coché, le
      # palier suivant fléché). Un nom qui changerait selon celui qui le regarde
      # rendrait la comparaison illisible — or c'est tout ce qu'on demande à cette
      # page.
      #
      # Les libellés de structure de la page (« Par mois », « Par an », « Palier
      # actuel », « X joueurs ») sont EMBARQUÉS dans client/config/lang.yml, pas ici :
      # c'est de la mécanique, elle doit rendre même si ce layer est en retard.









      # États. Le vocabulaire évite soigneusement la dette et le reproche : ces
      # écrans sont vus par des enfants, et un incident de prélèvement ne doit
      # jamais ressembler à une punition.







      # Distinct de `none` : il y a EU une cotisation, et le dire évite qu'un chef
      # dont le droit vient de s'éteindre lise « aucune cotisation en cours » et
      # croie n'avoir jamais rien souscrit. État TERMINAL d'un abonnement à
      # reconduction automatique (résiliation échue, remboursement, réserve de mois
      # offerts épuisée) — rien à voir avec une offre à durée déterminée.

      # SEUL écran qui ferme le jeu, et il est vu par des ENFANTS : ni dette, ni
      # retard, ni reproche. La troupe se repose, c'est tout.
      #
      # La promesse de conservation est écrite noir sur blanc, parce qu'elle est
      # vraie et que c'est la seule inquiétude réelle d'une famille à cet instant :
      # plus rien ne se supprime au terme du calendrier (purge_day: 0), un clan
      # retrouvé six mois plus tard l'est intact.
      # UNE ligne, et elle s'adresse d'abord à l'ENFANT : le bouton lui est masqué,
      # sans elle il ne verrait qu'une image et n'aurait aucun moyen de comprendre
      # pourquoi le donjon ne s'ouvre plus. Ni dette, ni retard, ni reproche.
      #
      # La seconde proposition est la seule inquiétude réelle d'une famille à cet
      # instant, et elle est vraie : plus rien ne se supprime au terme du calendrier
      # (purge_day: 0), un clan retrouvé des mois plus tard l'est intact.

      # Le SEUL bouton de l'ecran de gel. « Se reabonner » et non « Revivre le clan » :
      # rien n'est mort, et le geste demande est une reprise de cotisation, pas une
      # resurrection. Dire l'acte reel evite la mauvaise surprise au moment ou la
      # feuille de paiement Play s'ouvre.

      # Affiché à qui n'administre pas le clan. On ne cache pas l'offre — un
      # enfant a le droit de comprendre pourquoi le donjon est fermé — mais on ne
      # lui propose jamais de payer.

      # Première phase de tarification d'une offre, quand elle diffère du tarif
      # reconduit — c'est ainsi que l'essai gratuit s'annonce. Ni durée ni montant
      # ici : Play fournit les deux, les recopier garantirait qu'ils divergent.

      # ------------- Paywall (absence d'abonnement actif) -------------------
      # Repris des CGU v5 : l'accès est suspendu, les données sont CONSERVÉES et
      # tout revient au réabonnement. Le ton reste celui du donjon — un enfant
      # peut tomber sur cet écran, il n'a pas à se sentir en faute.

      # Plafonds de membres atteints. Le message n'annonce pas un refus, il
      # annonce la sortie : c'est l'écran d'abonnement qui s'ouvre, avec le
      # palier illimité sous les yeux.



      # Vu par un candidat qui arrive dans un clan déjà plein : il n'a rien à
      # payer et rien à corriger, on le lui dit sans le renvoyer vers une offre.

      # Clan actif grâce à des mois offerts (offre fondateurs, parrainage,
      # compensation des familles du test fermé) et non à un prélèvement.

      # ------------- Journal de facturation (« Mes achats ») ----------------
      # Une ligne par événement écrit par le serveur. Vocabulaire de guilde, mais
      # sans ambiguïté sur ce qui s'est passé : c'est la pièce qu'on présente en
      # cas de litige.









      # incluses, et un prix en dur deviendrait faux au premier changement de pays.
      # CINQ PALIERS, une seule différence entre eux : le nombre de places autour de la
      # table. Aucune description ne promet un bénéfice de jeu réservé — il n'y en a
      # aucun, et en laisser croire un contredirait la fiche du store comme les CGU
      # enfants (« rien de ce qui s'achète ne te rend plus fort »).
      #
      # Les descriptions ne répètent PAS le décompte chiffré : la page des paliers
      # l'affiche déjà sur chaque ligne, à partir de `grants.max_players`. Le répéter
      # ici, c'est deux endroits à corriger le jour où la grille bouge — et le catalogue
      # est le seul qui fasse foi.

      # Les NOMS sont ceux de la grille commerciale, tels quels : Essentiel, Clan,
      # Tribu, Guilde, Royaume. Pas de vocabulaire parallèle inventé pour le décor —

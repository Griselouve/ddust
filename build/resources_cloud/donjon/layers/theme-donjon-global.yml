      new_member_notif:
        fr: "Un nouvel aventurier a rejoint l'aventure ! Faites place à {name} ! La poussière tremble déjà."
        en: "A new adventurer has joined the quest! Make way for {name}! The dust is already trembling."
        es: "¡Un nuevo aventurero se ha unido a la aventura! ¡Abrid paso a {name}! El polvo ya tiembla."
        de: "Ein neuer Abenteurer hat sich dem Abenteuer angeschlossen! Macht Platz für {name}! Der Staub zittert schon."
        it: "Un nuovo avventuriero si è unito all'avventura! Fate largo a {name}! La polvere trema già."
        pt: "Um novo aventureiro juntou-se à aventura! Abram alas para {name}! O pó já treme."
        br: "Um novo aventureiro entrou na aventura! Abram caminho para {name}! A poeira já treme."
        nl: "Een nieuwe avonturier sluit zich aan bij het avontuur! Maak plaats voor {name}! Het stof beeft al."

      # Notification « boss » : envoyée à tout le clan quand un chef recommande une tâche (worker._notifyClanBoss).
      boss_notif:
        fr: "Un boss vient d'apparaître ! Celui qui le vaincra aura des XP extra !"
        en: "A boss has appeared! Whoever defeats it will earn extra XP!"
        es: "¡Ha aparecido un jefe final! ¡Quien lo derrote ganará XP extra!"
        de: "Ein Boss ist gerade aufgetaucht! Wer ihn besiegt, bekommt extra XP!"
        it: "È appena apparso un boss! Chi lo sconfiggerà otterrà XP extra!"
        pt: "Acabou de aparecer um boss! Quem o vencer ganha XP extra!"
        br: "Acabou de aparecer um boss! Quem vencê-lo ganha XP extra!"
        nl: "Er is net een eindbaas verschenen! Wie hem verslaat, krijgt extra XP!"

      #------------- Dépôt dans le coffre du butin (notif clan) ------
      # Envoyée à tout le clan, admins compris, sauf à celui qui dépose (worker._notifyClanChest).
      # Le message est `chest_notif`, éventuellement SUIVI d'un des deux suffixes — collé à la fin
      # après une espace, jamais inséré au milieu. Le suffixe dépend de la valeur déposée comparée
      # à la moyenne des 20 derniers butins ouverts (seuils worker.chest_low_pct/chest_high_pct) :
      # aucun historique = aucun suffixe, le message part nu.
      chest_notif:
        fr: "Le Big Boss du niveau a encore fait des ravages, j'entends d'ici l'argent sonnant et trébuchant qu'il ajoute dans son coffre !"
        en: "The level's Big Boss has been wreaking havoc again — I can hear the coins jingling as he drops them into his chest!"
        es: "¡El Gran Jefe Final del nivel ha vuelto a hacer estragos, ya oigo desde aquí el dinero contante y sonante que echa en su cofre!"
        de: "Der große Boss dieser Stufe hat wieder gewütet, ich höre bis hierher die klingenden Münzen, die er in seine Truhe wirft!"
        it: "Il Grande Capo del livello ha di nuovo seminato scompiglio, sento da qui il tintinnio delle monete che getta nel suo scrigno!"
        pt: "O Grande Chefe do nível voltou a fazer estragos, já daqui ouço o tilintar das moedas que ele deita no seu baú!"
        br: "O Grande Chefe do nível voltou a aprontar, daqui já ouço o tilintar das moedas que ele joga no seu baú!"
        nl: "De grote baas van dit niveau heeft weer flink huisgehouden, ik hoor hier al het geld rinkelen dat hij in zijn kist gooit!"
      chest_notif_low:
        fr: "Pas de quoi fouetter un chat..."
        en: "Nothing to write home about..."
        es: "No es para tanto..."
        de: "Nichts Weltbewegendes..."
        it: "Niente di che..."
        pt: "Nada do outro mundo..."
        br: "Nada de outro mundo..."
        nl: "Niets om over naar huis te schrijven..."
      chest_notif_high:
        fr: "La légende dit que c'est un trésor exceptionnel !"
        en: "Legend says this is an exceptional treasure!"
        es: "¡La leyenda dice que es un tesoro excepcional!"
        de: "Die Legende sagt, es sei ein außergewöhnlicher Schatz!"
        it: "La leggenda narra che sia un tesoro eccezionale!"
        pt: "Diz a lenda que é um tesouro excecional!"
        br: "Diz a lenda que é um tesouro excepcional!"
        nl: "De legende zegt dat het een uitzonderlijke schat is!"
      # Notif spéciale d'un chef qui dépose une NOTE (worker.on_butin_note_ok) : même canal que
      # le dépôt d'un objet/d'argent, mais sans rien dévoiler — c'est justement le principe.
      chest_notif_note:
        fr: "Une surprise vous attend dans le coffre du clan !"
        en: "A surprise is waiting for you in the clan's chest!"
        es: "¡Una sorpresa os espera en el cofre del clan!"
        de: "Eine Überraschung erwartet euch in der Clantruhe!"
        it: "Una sorpresa vi aspetta nello scrigno del clan!"
        pt: "Uma surpresa espera-vos no baú do clã!"
        br: "Uma surpresa espera vocês no baú do clã!"
        nl: "Er wacht jullie een verrassing in de clankist!"

      #------------- Promotion chef de clan (notif au promu / au clan) ------
      # {name} = nom du joueur promu. Substitution faite en code (worker._notifyChiefPromotion).
      promote_chief_self:
        fr: "Les anciens ont reconnu ta valeur, tu es maintenant chef de clan !"
        en: "The elders have recognized your worth — you are now a clan chief!"
        es: "¡Los ancianos han reconocido tu valía: ahora eres jefe del clan!"
        de: "Die Ältesten haben deinen Wert erkannt: Du bist jetzt Clanchef!"
        it: "Gli anziani hanno riconosciuto il tuo valore: ora sei capo clan!"
        pt: "Os anciãos reconheceram o teu valor: agora és chefe de clã!"
        br: "Os anciãos reconheceram seu valor: agora você é chefe de clã!"
        nl: "De ouden hebben je waarde erkend: je bent nu clanhoofd!"
      promote_chief_clan:
        fr: "{name} a prouvé sa valeur et ouvert la voie des anciens, il est maintenant chef de clan !"
        en: "{name} has proven their worth and walked the path of the elders — now a clan chief!"
        es: "¡{name} ha demostrado su valía y abierto la senda de los ancianos: ahora es jefe del clan!"
        de: "{name} hat sich bewährt und den Weg der Ältesten beschritten: jetzt Clanchef!"
        it: "{name} ha dimostrato il suo valore e aperto la via degli anziani: ora è capo clan!"
        pt: "{name} provou o seu valor e abriu o caminho dos anciãos: agora é chefe de clã!"
        br: "{name} provou seu valor e abriu o caminho dos anciãos: agora é chefe de clã!"
        nl: "{name} heeft zich bewezen en het pad van de ouden geopend: nu clanhoofd!"


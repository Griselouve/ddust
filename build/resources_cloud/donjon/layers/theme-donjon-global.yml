        de: "Eine Familie, vereint durch den Schwur, das Chaos des Alltags zu besiegen. Ihre Stärke liegt im Zusammenhalt und in ihrem Motto: „Gemeinsam hält uns nichts auf!“"
        it: "Una famiglia unita dal giuramento di sconfiggere il caos quotidiano. La sua forza sta nell'aiuto reciproco e nel suo motto: «Insieme, niente ci ferma!»"
        pt: "Uma família unida pelo juramento de vencer o caos do dia a dia. A sua força está na entreajuda e no seu lema: «Juntos, nada nos detém!»"
        br: "Uma família unida pelo juramento de vencer o caos do dia a dia. Sua força está na ajuda mútua e no seu lema: \"Juntos, nada nos detém!\""
        nl: "Een gezin verenigd door de eed om de chaos van alledag te verslaan. Hun kracht ligt in elkaar helpen en in hun motto: ‘Samen houdt niets ons tegen!’"
      inspire_fallback_1_name:
        fr: "Les Conquérants de l'Aube"
        en: "The Dawn Conquerors"
        es: "Los Conquistadores del Alba"
        de: "Die Eroberer der Morgenröte"
        it: "I Conquistatori dell'Alba"
        pt: "Os Conquistadores da Aurora"
        br: "Os Conquistadores da Aurora"
        nl: "De Veroveraars van de Dageraad"
      inspire_fallback_1_desc:
        fr: "Chaque aube est une nouvelle victoire. Ce clan affronte les monstres du quotidien avec courage et détermination, car pour eux, capituler n'est pas une option."
        en: "Every dawn heralds a new victory. This clan faces the monsters of daily life with courage and relentless determination: surrendering is simply not in their nature."
        es: "Cada amanecer anuncia una nueva victoria. Este clan enfrenta los monstruos del día a día con valentía y determinación, pues rendirse no es una opción para ellos."
        de: "Jede Morgendämmerung ist ein neuer Sieg. Dieser Clan stellt sich den Monstern des Alltags mit Mut und Entschlossenheit, denn Aufgeben kommt für ihn nicht infrage."
        it: "Ogni alba è una nuova vittoria. Questo clan affronta i mostri di tutti i giorni con coraggio e determinazione, perché per loro arrendersi non è un'opzione."
        pt: "Cada madrugada é uma nova vitória. Este clã enfrenta os monstros do dia a dia com coragem e determinação, porque, para eles, desistir não é opção."
        br: "Cada madrugada é uma nova vitória. Este clã enfrenta os monstros do dia a dia com coragem e determinação, porque, para eles, desistir não é opção."
        nl: "Elke dageraad is een nieuwe overwinning. Deze clan gaat de monsters van alledag met moed en vastberadenheid te lijf, want opgeven is voor hen geen optie."
      inspire_fallback_2_name:
        fr: "Les Anciens de la Flamme"
        en: "The Flame Elders"
        es: "Los Antiguos de la Llama"
        de: "Die Ältesten der Flamme"
        it: "Gli Antichi della Fiamma"
        pt: "Os Anciãos da Chama"
        br: "Os Anciãos da Chama"
        nl: "De Ouden van de Vlam"
      inspire_fallback_2_desc:
        fr: "Gardiens d'une sagesse ancestrale, ils transmettent l'art de vaincre les tâches avec grâce et efficacité. Leur flamme ne s'éteint jamais, elle guide le clan vers la victoire."
        en: "Keepers of ancient wisdom, they pass on the art of vanquishing household beasts with grace and efficiency. Their flame never dies — it guides the clan to victory."
        es: "Guardianes de una sabiduría ancestral, transmiten el arte de vencer las tareas del hogar con gracia y eficacia. Su llama nunca se apaga, guía al clan hacia la victoria."
        de: "Als Hüter uralter Weisheit geben sie die Kunst weiter, Aufgaben mit Anmut und Geschick zu besiegen. Ihre Flamme erlischt nie, sie führt den Clan zum Sieg."
        it: "Custodi di una saggezza antica, tramandano l'arte di sconfiggere le faccende con grazia ed efficienza. La loro fiamma non si spegne mai e guida il clan verso la vittoria."
        pt: "Guardiões de uma sabedoria ancestral, transmitem a arte de vencer as tarefas com graça e eficácia. A sua chama nunca se apaga e guia o clã rumo à vitória."
        br: "Guardiões de uma sabedoria ancestral, eles transmitem a arte de vencer as tarefas com graça e eficiência. Sua chama nunca se apaga e guia o clã rumo à vitória."
        nl: "Als hoeders van eeuwenoude wijsheid geven zij de kunst door om klusjes met gratie en doeltreffendheid te verslaan. Hun vlam dooft nooit, zij leidt de clan naar de overwinning."
      # 3 à 7 : la réserve élargie pour l'IA coupée (2026-09-25). Le tirage compte les
      # variantes présentes (worker._fallbackCount) : en ajouter une ici suffit.
      inspire_fallback_3_name:
        fr: "Les Chevaliers du Balai"
        en: "The Broom Knights"
        es: "Los Caballeros de la Escoba"
        de: "Die Ritter des Besens"
        it: "I Cavalieri della Scopa"
        pt: "Os Cavaleiros da Vassoura"
        br: "Os Cavaleiros da Vassoura"
        nl: "De Ridders van de Bezem"
      inspire_fallback_3_desc:
        fr: "Armés de balais et de bonne humeur, ils chassent la poussière de royaume en royaume. Aucune toile d'araignée ne leur échappe."
        en: "Armed with brooms and good cheer, they chase dust from kingdom to kingdom. No cobweb escapes them."
        es: "Armados con escobas y buen humor, persiguen el polvo de reino en reino. Ninguna telaraña se les escapa."
        de: "Mit Besen und guter Laune bewaffnet, jagen sie den Staub von Königreich zu Königreich. Kein Spinnennetz entkommt ihnen."
        it: "Armati di scope e di buonumore, danno la caccia alla polvere di regno in regno. Nessuna ragnatela sfugge loro."
        pt: "Armados de vassouras e de bom humor, perseguem o pó de reino em reino. Nenhuma teia de aranha lhes escapa."
        br: "Armados de vassouras e de bom humor, eles caçam a poeira de reino em reino. Nenhuma teia de aranha escapa deles."
        nl: "Gewapend met bezems en een goed humeur jagen zij het stof van koninkrijk naar koninkrijk. Geen spinnenweb ontsnapt aan hen."
      inspire_fallback_4_name:
        fr: "La Confrérie de l'Éponge"
        en: "The Fellowship of the Sponge"
        es: "La Hermandad de la Esponja"
        de: "Die Bruderschaft des Schwamms"
        it: "La Confraternita della Spugna"
        pt: "A Irmandade da Esponja"
        br: "A Irmandade da Esponja"
        nl: "De Broederschap van de Spons"
      inspire_fallback_4_desc:
        fr: "Leur serment : ne jamais laisser une assiette seule dans l'évier. Ensemble, ils font de la vaisselle un champ de victoire."
        en: "Their oath: never leave a plate alone in the sink. Together, they turn the dishes into a field of victory."
        es: "Su juramento: no dejar nunca un plato solo en el fregadero. Juntos, convierten los platos en un campo de victoria."
        de: "Ihr Schwur: Niemals einen Teller allein in der Spüle lassen. Gemeinsam machen sie den Abwasch zum Siegesfeld."
        it: "Il loro giuramento: mai lasciare un piatto da solo nel lavello. Insieme, trasformano i piatti in un campo di vittoria."
        pt: "O seu juramento: nunca deixar um prato sozinho no lava-loiça. Juntos, fazem da loiça um campo de vitória."
        br: "O juramento deles: nunca deixar um prato sozinho na pia. Juntos, eles transformam a louça em um campo de vitória."
        nl: "Hun eed: laat nooit een bord alleen in de gootsteen. Samen maken ze van de afwas een slagveld vol overwinningen."
      inspire_fallback_5_name:
        fr: "Les Veilleurs du Donjon"
        en: "The Dungeon Watch"
        es: "Los Vigías de la Mazmorra"
        de: "Die Wächter des Verlieses"
        it: "Le Sentinelle del Dungeon"
        pt: "Os Vigias da Masmorra"
        br: "Os Vigias da Masmorra"
        nl: "De Wachters van de Kerker"
      inspire_fallback_5_desc:
        fr: "Rien ne traîne sous leur garde. Ils patrouillent chaque pièce et repoussent le désordre avant qu'il ne s'installe."
        en: "Nothing lies around on their watch. They patrol every room and drive back the mess before it settles in."
        es: "Nada queda tirado bajo su guardia. Patrullan cada habitación y rechazan el desorden antes de que se instale."
        de: "Unter ihrer Wacht bleibt nichts herumliegen. Sie patrouillieren durch jedes Zimmer und vertreiben die Unordnung, bevor sie sich breitmacht."
        it: "Sotto la loro guardia non resta niente in giro. Pattugliano ogni stanza e respingono il disordine prima che si installi."
        pt: "Nada fica fora do lugar sob a sua guarda. Patrulham cada divisão e afastam a desarrumação antes que ela se instale."
        br: "Nada fica jogado sob a guarda deles. Eles patrulham cada cômodo e expulsam a bagunça antes que ela se instale."
        nl: "Onder hun wacht blijft niets rondslingeren. Ze patrouilleren door elke kamer en verdrijven de rommel voordat die zich nestelt."
      inspire_fallback_6_name:
        fr: "Les Héritiers du Grand Rangement"
        en: "The Heirs of the Great Tidy-Up"
        es: "Los Herederos del Gran Orden"
        de: "Die Erben der Großen Ordnung"
        it: "Gli Eredi del Grande Riordino"
        pt: "Os Herdeiros da Grande Arrumação"
        br: "Os Herdeiros da Grande Arrumação"
        nl: "De Erfgenamen van de Grote Opruiming"
      inspire_fallback_6_desc:
        fr: "Une lignée de héros qui a juré de rendre à chaque objet sa place. Leur légende grandit à chaque tiroir fermé."
        en: "A line of heroes sworn to return every object to its place. Their legend grows with every drawer they close."
        es: "Un linaje de héroes que juró devolver cada objeto a su sitio. Su leyenda crece con cada cajón cerrado."
        de: "Ein Geschlecht von Helden, das geschworen hat, jedem Ding seinen Platz zurückzugeben. Ihre Legende wächst mit jeder geschlossenen Schublade."
        it: "Una stirpe di eroi che ha giurato di rimettere ogni oggetto al suo posto. La loro leggenda cresce a ogni cassetto chiuso."
        pt: "Uma linhagem de heróis que jurou devolver cada objeto ao seu lugar. A sua lenda cresce a cada gaveta fechada."
        br: "Uma linhagem de heróis que jurou devolver cada objeto ao seu lugar. A lenda deles cresce a cada gaveta fechada."
        nl: "Een geslacht van helden dat zwoer elk voorwerp zijn plek terug te geven. Hun legende groeit met elke gesloten la."
      inspire_fallback_7_name:
        fr: "La Horde des Lève-Tôt"
        en: "The Early Risers Horde"
        es: "La Horda de los Madrugadores"
        de: "Die Horde der Frühaufsteher"
        it: "L'Orda dei Mattinieri"
        pt: "A Horda dos Madrugadores"
        br: "A Horda dos Madrugadores"
        nl: "De Horde van de Vroege Vogels"
      inspire_fallback_7_desc:
        fr: "Debout avant le soleil, ils ont déjà vaincu trois corvées quand le reste du monde se réveille. Leur cri de guerre : « Au travail, et en riant ! »"
        en: "Up before the sun, they have already defeated three chores when the rest of the world wakes up. Their battle cry: 'To work, and laughing!'"
        es: "En pie antes que el sol, ya han vencido tres tareas cuando el resto del mundo despierta. Su grito de guerra: '¡A trabajar, y riendo!'"
        de: "Vor der Sonne auf den Beinen, haben sie schon drei Pflichten besiegt, wenn der Rest der Welt erwacht. Ihr Schlachtruf: „An die Arbeit, und zwar lachend!“"
        it: "In piedi prima del sole, hanno già sconfitto tre faccende quando il resto del mondo si sveglia. Il loro grido di battaglia: «Al lavoro, ridendo!»"
        pt: "De pé antes do sol, já venceram três tarefas quando o resto do mundo acorda. O seu grito de guerra: «Ao trabalho, e a rir!»"
        br: "De pé antes do sol, eles já venceram três tarefas quando o resto do mundo acorda. O grito de guerra deles: \"Ao trabalho, e rindo!\""
        nl: "Al op voor de zon, hebben ze al drie klusjes verslagen als de rest van de wereld wakker wordt. Hun strijdkreet: 'Aan het werk, en lachend!'"
      # Replis statiques du bouton « Inspire moi » sur les écrans de PERSONNAGE (les
      # inspire_fallback_* ci-dessus parlent d'un clan : ils n'y conviennent pas). Servis quand
      # l'IA dépasse les 3 secondes, refuse de répondre, ou que le chef l'a coupée pour le clan.
      inspire_player_fallback_0_name:
        fr: "Sasha"
        en: "Sasha"
        es: "Sasha"
        de: "Sasha"
        it: "Sasha"
        pt: "Sasha"
        br: "Sasha"
        nl: "Sasha"
      inspire_player_fallback_0_desc:
        fr: "Toujours le premier debout, jamais le dernier à rire. Rien ne lui résiste, surtout pas une pile d'assiettes."
        en: "Always the first one up, never the last to laugh. Nothing resists them, least of all a stack of plates."
        es: "Siempre el primero en levantarse, nunca el último en reír. Nada se le resiste, y menos una pila de platos."
        de: "Immer als Erstes auf den Beinen, nie als Letztes beim Lachen. Nichts hält hier stand, am wenigsten ein Stapel Teller."
        it: "Sempre il primo ad alzarsi, mai l'ultimo a ridere. Niente gli resiste, tanto meno una pila di piatti."
        pt: "Sempre o primeiro a levantar-se, nunca o último a rir. Nada lhe resiste, muito menos uma pilha de pratos."
        br: "Sempre o primeiro a se levantar, nunca o último a rir. Nada resiste a ele, muito menos uma pilha de pratos."
        nl: "Altijd als eerste op, nooit als laatste aan het lachen. Niets houdt stand, en al helemaal geen stapel borden."
      inspire_player_fallback_1_name:
        fr: "Camille"
        en: "Camille"
        es: "Camille"
        de: "Camille"
        it: "Camille"
        pt: "Camille"
        br: "Camille"
        nl: "Camille"
      inspire_player_fallback_1_desc:
        fr: "Calme, patient, et redoutablement organisé. Là où les autres foncent, il range — et il gagne."
        en: "Calm, patient, and formidably organised. Where others charge in, they tidy up, and they win."
        es: "Tranquilo, paciente y temiblemente organizado. Donde otros se lanzan, ordena, y gana."
        de: "Ruhig, geduldig und furchtbar gut organisiert. Wo andere losstürmen, wird erst mal aufgeräumt, und dann gewonnen."
        it: "Calmo, paziente e tremendamente organizzato. Dove gli altri si lanciano, mette in ordine, e vince."
        pt: "Calmo, paciente e temivelmente organizado. Onde os outros se atiram de cabeça, arruma, e ganha."
        br: "Calmo, paciente e assustadoramente organizado. Onde os outros se jogam de cabeça, ele arruma, e vence."
        nl: "Rustig, geduldig en angstaanjagend georganiseerd. Waar anderen erop af stormen, wordt er opgeruimd, en gewonnen."
      inspire_player_fallback_2_name:
        fr: "Noa"
        en: "Noa"
        es: "Noa"
        de: "Noa"
        it: "Noa"
        pt: "Noa"
        br: "Noa"
        nl: "Noa"
      inspire_player_fallback_2_desc:
        fr: "Petit par la taille, immense par le courage. Aucun monstre de poussière ne l'a jamais vu reculer."
        en: "Small in size, immense in courage. No dust monster has ever seen them back down."
        es: "Pequeño de tamaño, inmenso de valor. Ningún monstruo de polvo lo ha visto retroceder."
        de: "Klein an Größe, riesig an Mut. Noch kein Staubmonster hat hier je jemanden zurückweichen sehen."
        it: "Piccolo di statura, immenso di coraggio. Nessun mostro di polvere l'ha mai visto indietreggiare."
        pt: "Pequeno no tamanho, imenso na coragem. Nenhum monstro de pó alguma vez o viu recuar."
        br: "Pequeno no tamanho, imenso na coragem. Nenhum monstro de poeira jamais o viu recuar."
        nl: "Klein van stuk, reusachtig van moed. Nog nooit heeft een stofmonster hier iemand zien terugdeinzen."
      # 3 à 7 : la réserve élargie pour l'IA coupée (2026-09-25). Prénoms qui se lisent dans
      # les huit langues, comme les trois premiers.
      inspire_player_fallback_3_name:
        fr: "Alex"
        en: "Alex"
        es: "Alex"
        de: "Alex"
        it: "Alex"
        pt: "Alex"
        br: "Alex"
        nl: "Alex"
      inspire_player_fallback_3_desc:
        fr: "Rapide comme l'éclair. Capable de ranger une chambre entière avant la fin d'une chanson."
        en: "Quick as lightning. Able to tidy a whole bedroom before the end of a song."
        es: "Rápido como un rayo. Capaz de ordenar una habitación entera antes de que acabe una canción."
        de: "Schnell wie der Blitz. Schafft ein ganzes Zimmer, bevor ein Lied zu Ende ist."
        it: "Veloce come un fulmine. Capace di riordinare un'intera camera prima della fine di una canzone."
        pt: "Rápido como um relâmpago. Capaz de arrumar um quarto inteiro antes do fim de uma canção."
        br: "Rápido como um raio. Capaz de arrumar um quarto inteiro antes do fim de uma música."
        nl: "Snel als de bliksem. Ruimt een hele kamer op voordat een liedje afgelopen is."
      inspire_player_fallback_4_name:
        fr: "Robin"
        en: "Robin"
        es: "Robin"
        de: "Robin"
        it: "Robin"
        pt: "Robin"
        br: "Robin"
        nl: "Robin"
      inspire_player_fallback_4_desc:
        fr: "Un cœur d'or et des mains habiles. Toujours prêt à tendre la main à un compagnon en difficulté."
        en: "A heart of gold and skilful hands. Always ready to help a companion in trouble."
        es: "Un corazón de oro y unas manos hábiles. Siempre dispuesto a ayudar a un compañero en apuros."
        de: "Ein Herz aus Gold und geschickte Hände. Immer bereit, einem Gefährten in Not zu helfen."
        it: "Un cuore d'oro e mani abili. Sempre pronto ad aiutare un compagno in difficoltà."
        pt: "Um coração de ouro e mãos habilidosas. Sempre pronto a ajudar um companheiro em apuros."
        br: "Um coração de ouro e mãos habilidosas. Sempre pronto para ajudar um companheiro em apuros."
        nl: "Een hart van goud en handige handen. Altijd klaar om een makker in nood te helpen."
      inspire_player_fallback_5_name:
        fr: "Sam"
        en: "Sam"
        es: "Sam"
        de: "Sam"
        it: "Sam"
        pt: "Sam"
        br: "Sam"
        nl: "Sam"
      inspire_player_fallback_5_desc:
        fr: "Ne recule devant aucune corvée, même la plus redoutable. Le linge sale tremble à son approche."
        en: "Never backs down from a chore, not even the most fearsome. Dirty laundry trembles at their approach."
        es: "No retrocede ante ninguna tarea, ni siquiera la más temible. La ropa sucia tiembla a su paso."
        de: "Weicht vor keiner Pflicht zurück, nicht einmal vor der gefürchtetsten. Die Schmutzwäsche zittert, wenn sie naht."
        it: "Non si tira indietro davanti a nessuna faccenda, nemmeno la più temibile. I panni sporchi tremano al suo arrivo."
        pt: "Não recua perante nenhuma tarefa, nem a mais temível. A roupa suja treme quando se aproxima."
        br: "Não recua diante de nenhuma tarefa, nem da mais temível. A roupa suja treme quando se aproxima."
        nl: "Deinst voor geen enkel klusje terug, zelfs niet voor het engste. De vuile was beeft bij elke stap."
      inspire_player_fallback_6_name:
        fr: "Lou"
        en: "Lou"
        es: "Lou"
        de: "Lou"
        it: "Lou"
        pt: "Lou"
        br: "Lou"
        nl: "Lou"
      inspire_player_fallback_6_desc:
        fr: "Esprit malin et sourire en coin. Trouve toujours l'astuce pour finir plus vite que prévu."
        en: "A clever mind and a sly smile. Always finds the trick to finish sooner than planned."
        es: "Mente astuta y sonrisa pícara. Siempre encuentra el truco para terminar antes de lo previsto."
        de: "Ein schlauer Kopf und ein verschmitztes Lächeln. Findet immer den Trick, um früher fertig zu sein als geplant."
        it: "Mente furba e sorriso sornione. Trova sempre il trucco per finire prima del previsto."
        pt: "Espírito astuto e sorriso maroto. Encontra sempre o truque para acabar mais cedo do que o previsto."
        br: "Mente esperta e sorriso maroto. Sempre acha o truque para terminar mais cedo do que o previsto."
        nl: "Een slimme geest en een sluwe glimlach. Vindt altijd de truc om sneller klaar te zijn dan gepland."
      inspire_player_fallback_7_name:
        fr: "Eden"
        en: "Eden"
        es: "Eden"
        de: "Eden"
        it: "Eden"
        pt: "Eden"
        br: "Eden"
        nl: "Eden"
      inspire_player_fallback_7_desc:
        fr: "Discrétion absolue, efficacité redoutable. Personne ne l'entend arriver, mais la cuisine brille après son passage."
        en: "Utterly discreet, fearsomely efficient. Nobody hears them coming, but the kitchen shines once they have passed."
        es: "Discreción absoluta, eficacia temible. Nadie lo oye llegar, pero la cocina brilla después de su paso."
        de: "Absolut unauffällig, gefürchtet gründlich. Niemand hört es kommen, aber danach glänzt die Küche."
        it: "Discrezione assoluta, efficacia temibile. Nessuno lo sente arrivare, ma la cucina brilla dopo il suo passaggio."
        pt: "Discrição absoluta, eficácia temível. Ninguém o ouve chegar, mas a cozinha brilha depois da sua passagem."
        br: "Discrição absoluta, eficiência temível. Ninguém ouve chegar, mas a cozinha brilha depois que passa."
        nl: "Volkomen onopvallend, angstaanjagend efficiënt. Niemand hoort het aankomen, maar daarna glanst de keuken."

      # BANQUE DE SUBSTITUTION — repli quand l'IA échoue ou dépasse le délai. Le worker tire une
      # entrée au hasard et, pour un joueur, lui accole cinq chiffres (« Benji12312 ») ; pour un
      # clan, c'est le suffixe « -region-compteur » qui distingue déjà.
      # Elle ne retombe JAMAIS sur le nom interne : c'est ce qui remplace le défaut d'origine,
      # où le pseudonyme public valait celui que la famille voit.
      # Noms volontairement NEUTRES en genre : ce repli ne sait rien du nom d'origine, il ne
      # peut donc pas en respecter le genre — mieux vaut ne rien dire que dire le contraire.
      # Séparateur « | » (les virgules apparaissent dans les descriptions).
      substitute_bank_player_names:
        fr: "Benji|Sasha|Camille|Andrea|Charlie|Noa|Alix|Swann|Maël|Lou"
        en: "Benji|Sasha|Charlie|Alex|Robin|Jamie|Sam|Riley|Jules|Quinn"
        es: "Benji|Sasha|Alex|Cruz|Noa|Yael|Ariel|Trini|Reyes|Chris"
        de: "Benji|Sasha|Kim|Alex|Robin|Charlie|Toni|Mika|Sam|Nicky"
        it: "Benji|Sasha|Alex|Sam|Vale|Fede|Ale|Charlie|Robin|Simo"
        pt: "Benji|Sasha|Alex|Sam|Cris|Dani|Gabi|Noa|Charlie|Ari"
        br: "Benji|Sasha|Alex|Sam|Cris|Dani|Gabi|Noa|Charlie|Ari"
        nl: "Benji|Sasha|Kim|Robin|Sam|Charlie|Noa|Lou|Jip|Senna"
      substitute_bank_player_descs:
        fr: "Un aventurier discret, toujours prêt à donner un coup de main.|Un compagnon de route fiable, que rien ne décourage.|Un explorateur curieux, qui ne rentre jamais les mains vides."
        en: "A discreet adventurer, always ready to lend a hand.|A reliable companion, whom nothing discourages.|A curious explorer, who never comes home empty-handed."
        es: "Un aventurero discreto, siempre listo para echar una mano.|Un compañero de viaje fiable, al que nada desanima.|Un explorador curioso, que nunca vuelve con las manos vacías."

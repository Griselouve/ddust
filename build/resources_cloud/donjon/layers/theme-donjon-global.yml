      invite_consent_child_hint:
        fr: "Pour inviter un enfant, c'est lui qui commence : il installe le jeu et dit qu'il veut jouer. Scannez ensuite le QR code qu'il affiche avec « Accueillir un enfant », dans le menu du clan. Ici, vous invitez un adulte."
        en: "To invite a child, they go first: they install the game and say they want to play. Then scan the QR code they display with “Welcome a child”, in the clan menu. Here, you are inviting an adult."
        es: "Para invitar a un niño, empieza él: instala el juego y dice que quiere jugar. Después escanea el código QR que muestra con «Acoger a un niño», en el menú del clan. Aquí invitas a un adulto."
        de: "Um ein Kind einzuladen, fängt es selbst an: Es installiert das Spiel und sagt, dass es spielen will. Scanne danach den QR-Code, den es anzeigt, mit „Ein Kind aufnehmen“ im Clan-Menü. Hier lädst du einen Erwachsenen ein."
        it: "Per invitare un bambino, comincia lui: installa il gioco e dice che vuole giocare. Poi scansiona il codice QR che mostra con «Accogli un bambino», nel menu del clan. Qui inviti un adulto."
        pt: "Para convidar uma criança, é ela que começa: instala o jogo e diz que quer jogar. Depois digitaliza o código QR que ela mostra com «Acolher uma criança», no menu do clã. Aqui, convidas um adulto."
        br: "Para convidar uma criança, é ela quem começa: instala o jogo e diz que quer jogar. Depois, escaneie o QR Code que ela mostra com “Acolher uma criança”, no menu do clã. Aqui, você está convidando um adulto."
        nl: "Om een kind uit te nodigen, begint het zelf: het installeert het spel en zegt dat het wil spelen. Scan daarna de QR-code die het toont met ‘Een kind verwelkomen’ in het clanmenu. Hier nodig je een volwassene uit."
      invite_consent_not_assent:
        fr: "Ce QR code n'est pas une demande d'enfant. Pour accueillir un enfant, scannez le QR code que son téléphone affiche après qu'il a dit oui. Ici, seul un adulte peut être invité."
        en: "This QR code is not a child's request. To welcome a child, scan the QR code their phone displays after they have said yes. Here, only an adult can be invited."
        es: "Este código QR no es una solicitud de un niño. Para acoger a un niño, escanea el código QR que muestra su teléfono después de que haya dicho que sí. Aquí solo se puede invitar a un adulto."
        de: "Dieser QR-Code ist keine Anfrage eines Kindes. Um ein Kind aufzunehmen, scanne den QR-Code, den sein Handy anzeigt, nachdem es Ja gesagt hat. Hier kann nur ein Erwachsener eingeladen werden."
        it: "Questo codice QR non è una richiesta di un bambino. Per accogliere un bambino, scansiona il codice QR che il suo telefono mostra dopo che ha detto di sì. Qui si può invitare solo un adulto."
        pt: "Este código QR não é um pedido de uma criança. Para acolher uma criança, digitaliza o código QR que o telemóvel dela mostra depois de ela dizer que sim. Aqui, só um adulto pode ser convidado."
        br: "Este QR Code não é um pedido de uma criança. Para acolher uma criança, escaneie o QR Code que o celular dela mostra depois que ela disse sim. Aqui, só um adulto pode ser convidado."
        nl: "Deze QR-code is geen verzoek van een kind. Om een kind te verwelkomen, scan je de QR-code die zijn telefoon toont nadat het ja heeft gezegd. Hier kan alleen een volwassene worden uitgenodigd."

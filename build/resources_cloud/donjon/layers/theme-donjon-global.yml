name: theme-donjon
above: conf
strategy: default
tenant: global
data:
  lang:
    fallback: "fr"
    default: "fr"
    options:
      fr: "Français"
      en: "English"
      es: "Español"
      de: "Deutsch"
      it: "Italiano"
      pt: "Português (Portugal)"
      br: "Português (Brasil)"
      nl: "Nederlands"
    translations:
      #------------- General ------------------------------------

      application_name:
        fr: "Donjons & Savons"
        en: "Dungeons & Dusting"
        es: "Calabozos & Jabones"
        de: "Donjons & Savons"
        it: "Donjons & Savons"
        pt: "Donjons & Savons"
        br: "Donjons & Savons"
        nl: "Donjons & Savons"

      #------------- Gages de mort (0 PV) ------------------------------------

      gage_01:
        fr: "Que justice soit faite ! Pour t'être laissé avoir par la saleté, le bourreau du donjon va te torturer jusqu'à la mort … de rire\n\nFaire un défi en famille : TU désignes ton bourreau et TU choisis le supplice — chatouilles, grimaces ou blagues. Tu dis « pouce » quand tu veux, et tout s'arrête aussitôt."
        en: "Let justice be done! For letting the filth get the better of you, the dungeon's executioner will torture you to death... from laughing\n\nTake on a family challenge: YOU pick your executioner and YOU pick the torment — tickles, funny faces or jokes. Say \"pax\" whenever you like, and everything stops at once."
        es: "¡Que se haga justicia! Por dejarte vencer por la suciedad, el verdugo del calabozo te torturará hasta morir... de risa\n\nHaz un desafío en familia: TÚ eliges a tu verdugo y TÚ eliges el suplicio: cosquillas, muecas o chistes. Di «pido paz» cuando quieras y todo se detiene al instante."
        de: "Gerechtigkeit muss sein! Weil du dich vom Dreck hast besiegen lassen, wird der Henker des Kerkers dich foltern, bis du stirbst… vor Lachen\n\nMach eine Familien-Mutprobe: DU wählst deinen Henker und DU wählst die Folter: Kitzeln, Grimassen oder Witze. Sag „Gnade!“, wann immer du willst, und alles hört sofort auf."
        it: "Giustizia sia fatta! Per esserti fatto battere dallo sporco, il boia del dungeon ti torturerà fino alla morte… dal ridere\n\nFai una sfida in famiglia: sei TU a scegliere il tuo boia e TU a scegliere il supplizio: solletico, smorfie o barzellette. Di' «pietà» quando vuoi, e tutto si ferma subito."
        pt: "Que se faça justiça! Por te deixares vencer pela sujidade, o carrasco da masmorra vai torturar-te até morreres… de riso\n\nFaz um desafio em família: és TU que escolhes o teu carrasco e TU que escolhes o suplício: cócegas, caretas ou piadas. Diz «tréguas» quando quiseres e tudo para logo."
        br: "Que se faça justiça! Por ter se deixado vencer pela sujeira, o carrasco da masmorra vai torturar você até a morte… de rir\n\nFaça um desafio em família: é VOCÊ quem escolhe seu carrasco e VOCÊ quem escolhe o suplício: cócegas, caretas ou piadas. Diga \"trégua\" quando quiser e tudo para na hora."
        nl: "Het recht moet zegevieren! Omdat je je door de viezigheid hebt laten verslaan, gaat de beul van de kerker je martelen tot je doodgaat… van het lachen\n\nDoe een gezinsuitdaging: JIJ kiest je beul en JIJ kiest de marteling: kietelen, gekke gezichten of moppen. Roep ‘genade’ wanneer je wilt, en alles stopt meteen."
      gage_02:
        fr: "Tu as grimacé de dégout devant la saleté ? Voyons si tu peux apprendre aux vieux mages à faire la grimace\n\nFaire un défi en famille : tu dois grimacer devant ton clan jusqu'à ce que l'un d'eux rigole."
        en: "Grimacing in disgust at the filth? Let's see if you can teach the old mages how to pull a face\n\nTake on a family challenge: make faces at your clan until one of them laughs."
        es: "¿Hiciste una mueca de asco ante la suciedad? Veamos si puedes enseñar a los viejos magos a hacer muecas\n\nHaz un desafío en familia: haz muecas ante tu clan hasta que alguno se ría."
        de: "Du hast vor Ekel über den Dreck das Gesicht verzogen? Mal sehen, ob du den alten Magiern Grimassen beibringen kannst\n\nMach eine Familien-Mutprobe: Schneide vor deinem Clan Grimassen, bis einer von ihnen lacht."
        it: "Hai fatto una smorfia di disgusto davanti allo sporco? Vediamo se riesci a insegnare le smorfie ai vecchi maghi\n\nFai una sfida in famiglia: fai smorfie davanti al tuo clan finché qualcuno non ride."
        pt: "Fizeste uma careta de nojo diante da sujidade? Vamos ver se consegues ensinar os velhos magos a fazer caretas\n\nFaz um desafio em família: faz caretas diante do teu clã até alguém se rir."
        br: "Fez uma careta de nojo diante da sujeira? Vamos ver se você consegue ensinar os velhos magos a fazer caretas\n\nFaça um desafio em família: faça caretas para o seu clã até alguém rir."
        nl: "Trok je een vies gezicht van de viezigheid? Eens kijken of je de oude magiërs gekke gezichten kunt leren trekken\n\nDoe een gezinsuitdaging: trek gekke gezichten naar je clan tot er iemand lacht."
      gage_03:
        fr: "Pffff…. Tué par des chaussettes… tu as le droit de garder le silence\n\nFaire un défi en famille : chaque membre du clan te dit un mot que tu dois faire deviner aux autres sans parler ni écrire ni signer."
        en: "Pffff.... Killed by socks... you have the right to remain silent\n\nTake on a family challenge: each clan member gives you a word you must get the others to guess, without speaking, writing or signing."
        es: "Pffff.... Muerto por unos calcetines... tienes derecho a guardar silencio\n\nHaz un desafío en familia: cada miembro del clan te da una palabra que debes hacer adivinar a los demás sin hablar, escribir ni hacer señas."
        de: "Pfff…. Von Socken getötet… du hast das Recht zu schweigen\n\nMach eine Familien-Mutprobe: Jedes Clanmitglied sagt dir ein Wort, das du die anderen erraten lassen musst, ohne zu sprechen, zu schreiben oder Zeichensprache zu benutzen."
        it: "Pffff…. Ucciso dai calzini… hai il diritto di restare in silenzio\n\nFai una sfida in famiglia: ogni membro del clan ti dice una parola che devi far indovinare agli altri senza parlare, scrivere o fare segni."
        pt: "Pffff…. Morto por umas meias… tens o direito de permanecer em silêncio\n\nFaz um desafio em família: cada membro do clã diz-te uma palavra que tens de fazer adivinhar aos outros sem falar, escrever nem fazer sinais."
        br: "Pffff…. Morto por umas meias… você tem o direito de permanecer em silêncio\n\nFaça um desafio em família: cada membro do clã fala uma palavra para você, e você tem que fazer os outros adivinharem sem falar, escrever nem fazer sinais."
        nl: "Pffff…. Gedood door sokken… je hebt het recht om te zwijgen\n\nDoe een gezinsuitdaging: elk clanlid geeft je een woord dat je de anderen moet laten raden zonder te praten, te schrijven of gebaren te maken."
      gage_04:
        fr: "Tu as laissé la saleté se répandre, le monde court à sa perte ! Le clan attend une promesse, pas des excuses !\n\nFaire un défi en famille : une main sur le balai, jure solennellement devant tout le clan réuni une chose que tu feras avant demain soir."
        en: "You let the filth spread, the world is doomed! The clan wants a promise, not excuses!\n\nTake on a family challenge: one hand on the broom, solemnly swear before the whole assembled clan one thing you will do before tomorrow evening."
        es: "¡Dejaste que la suciedad se propagara, el mundo corre a su perdición! ¡El clan espera una promesa, no excusas!\n\nHaz un desafío en familia: con una mano sobre la escoba, jura solemnemente ante todo el clan reunido una cosa que harás antes de mañana por la noche."
        de: "Du hast den Dreck sich ausbreiten lassen, die Welt steuert auf den Untergang zu! Der Clan will ein Versprechen, keine Ausreden!\n\nMach eine Familien-Mutprobe: Eine Hand auf dem Besen, schwöre feierlich vor dem versammelten Clan eine Sache, die du bis morgen Abend erledigen wirst."
        it: "Hai lasciato che lo sporco dilagasse, il mondo corre verso la rovina! Il clan vuole una promessa, non delle scuse!\n\nFai una sfida in famiglia: con una mano sulla scopa, giura solennemente davanti a tutto il clan riunito una cosa che farai entro domani sera."
        pt: "Deixaste a sujidade espalhar-se, o mundo caminha para a perdição! O clã quer uma promessa, não desculpas!\n\nFaz um desafio em família: com uma mão na vassoura, jura solenemente diante do clã inteiro reunido uma coisa que vais fazer antes de amanhã à noite."
        br: "Você deixou a sujeira se espalhar, o mundo está caminhando para a perdição! O clã quer uma promessa, não desculpas!\n\nFaça um desafio em família: com uma mão na vassoura, jure solenemente diante do clã inteiro reunido uma coisa que você vai fazer antes de amanhã à noite."
        nl: "Je hebt de viezigheid laten verspreiden, de wereld gaat ten onder! De clan wil een belofte, geen excuses!\n\nDoe een gezinsuitdaging: met één hand op de bezem zweer je plechtig voor de hele verzamelde clan één ding dat je voor morgenavond gaat doen."
      gage_05:
        fr: "Tu dois récupérer tes forces brave aventurier, mais le remède a un goût de chiottes\n\nFaire un défi en famille : le clan prépare UNE potion de soin devant toi, en montrant chaque ingrédient avant de le verser. Goûte, puis devine tout ce qu'il y a dedans."
        en: "You must recover your strength, brave adventurer, but the remedy tastes like crap\n\nTake on a family challenge: the clan brews ONE healing potion in front of you, holding up every ingredient before it goes in. Take a sip, then guess everything that is in it."
        es: "Debes recuperar tus fuerzas, valiente aventurero, pero el remedio sabe fatal\n\nHaz un desafío en familia: el clan prepara UNA poción curativa delante de ti, mostrando cada ingrediente antes de echarlo. Da un sorbo y adivina todo lo que lleva."
        de: "Du musst wieder zu Kräften kommen, tapferer Abenteurer, aber die Medizin schmeckt scheußlich\n\nMach eine Familien-Mutprobe: Der Clan braut vor deinen Augen EINEN Heiltrank und zeigt jede Zutat, bevor sie hineinkommt. Probier einen Schluck und errate dann alles, was drin ist."
        it: "Devi recuperare le forze, prode avventuriero, ma il rimedio ha un sapore disgustoso\n\nFai una sfida in famiglia: il clan prepara UNA pozione curativa davanti a te, mostrando ogni ingrediente prima di versarlo. Assaggia, poi indovina tutto quello che c'è dentro."
        pt: "Tens de recuperar as forças, bravo aventureiro, mas o remédio sabe horrivelmente mal\n\nFaz um desafio em família: o clã prepara UMA poção de cura à tua frente, mostrando cada ingrediente antes de o deitar. Prova e depois adivinha tudo o que lá está dentro."
        br: "Você precisa recuperar as forças, bravo aventureiro, mas o remédio tem um gosto horrível\n\nFaça um desafio em família: o clã prepara UMA poção de cura na sua frente, mostrando cada ingrediente antes de colocá-lo. Prove e depois adivinhe tudo o que tem dentro."
        nl: "Je moet weer op krachten komen, dappere avonturier, maar het medicijn smaakt smerig\n\nDoe een gezinsuitdaging: de clan brouwt voor je ogen ÉÉN genezingsdrankje en laat elk ingrediënt zien voordat het erin gaat. Neem een slokje en raad dan alles wat erin zit."
      gage_06:
        fr: "Le foyer s'écroule sous le désordre et la saleté. Ça te fait rire morveux ?\n\nFaire un défi en famille : simuler un rire pendant 45 secondes."
        en: "The home is collapsing under mess and filth. Think it's funny, brat?\n\nTake on a family challenge: fake a laugh for 45 seconds."
        es: "El hogar se derrumba bajo el desorden y la suciedad. ¿Te hace gracia, mocoso?\n\nHaz un desafío en familia: simula una risa durante 45 segundos."
        de: "Das Zuhause bricht unter Unordnung und Dreck zusammen. Findest du das lustig, du Rotznase?\n\nMach eine Familien-Mutprobe: 45 Sekunden lang ein Lachen vortäuschen."
        it: "La casa crolla sotto il disordine e lo sporco. Ti fa ridere, moccioso?\n\nFai una sfida in famiglia: fingi una risata per 45 secondi."
        pt: "O lar está a desabar debaixo da desarrumação e da sujidade. Achas graça, fedelho?\n\nFaz um desafio em família: finge uma gargalhada durante 45 segundos."
        br: "O lar está desabando debaixo da bagunça e da sujeira. Achou graça, pirralho?\n\nFaça um desafio em família: finja uma gargalhada durante 45 segundos."
        nl: "Het huis stort in onder de rommel en de viezigheid. Vind je dat grappig, snotneus?\n\nDoe een gezinsuitdaging: doe 45 seconden lang alsof je lacht."
      gage_07:
        fr: "Ta frêle armure n'a pas tenu longtemps face aux attaques de linge sale et la poussière venimeuse. Tu dois en trouver une autre.\n\nFaire un défi en famille : faire un défilé en revêtant 3 tenues épiques et drôles."
        en: "Your flimsy armor didn't last long against the assaults of dirty laundry and venomous dust. You must find another.\n\nTake on a family challenge: put on a fashion show wearing 3 epic and funny outfits."
        es: "Tu frágil armadura no aguantó mucho ante los ataques de la ropa sucia y el polvo venenoso. Debes encontrar otra.\n\nHaz un desafío en familia: haz un desfile luciendo 3 atuendos épicos y graciosos."
        de: "Deine dünne Rüstung hat den Angriffen der Schmutzwäsche und des giftigen Staubs nicht lange standgehalten. Du musst eine neue finden.\n\nMach eine Familien-Mutprobe: Veranstalte eine Modenschau mit 3 epischen und lustigen Outfits."
        it: "La tua fragile armatura non ha resistito a lungo agli attacchi dei panni sporchi e della polvere velenosa. Devi trovarne un'altra.\n\nFai una sfida in famiglia: fai una sfilata indossando 3 costumi epici e buffi."
        pt: "A tua frágil armadura não aguentou muito tempo os ataques da roupa suja e do pó venenoso. Tens de arranjar outra.\n\nFaz um desafio em família: faz um desfile com 3 fatiotas épicas e divertidas."
        br: "Sua frágil armadura não aguentou muito tempo os ataques da roupa suja e da poeira venenosa. Você precisa arrumar outra.\n\nFaça um desafio em família: faça um desfile com 3 roupas épicas e divertidas."
        nl: "Je dunne harnas hield het niet lang vol tegen de aanvallen van vuile was en giftig stof. Je moet een nieuw vinden.\n\nDoe een gezinsuitdaging: houd een modeshow in 3 epische en grappige outfits."
      gage_08:
        fr: "La prochaine fois qu'une meute de mauvaises hig-hyènes s'approche, ne bouge pas, fais le mort.\n\nFaire un défi en famille : tu ne peux pas rire ni sourire pendant 3 minutes, malgré tout ce que peut faire ton clan."
        en: "Next time a pack of nasty giggle-hyenas comes near, don't move, play dead.\n\nTake on a family challenge: you can't laugh or smile for 3 minutes, whatever your clan does."
        es: "La próxima vez que se acerque una manada de malvadas ji-hienas, no te muevas, hazte el muerto.\n\nHaz un desafío en familia: no puedes reír ni sonreír durante 3 minutos, haga lo que haga tu clan."
        de: "Wenn sich das nächste Mal ein Rudel fieser Kicher-Hyänen nähert, beweg dich nicht, stell dich tot.\n\nMach eine Familien-Mutprobe: Du darfst 3 Minuten lang weder lachen noch lächeln, egal was dein Clan anstellt."
        it: "La prossima volta che si avvicina un branco di perfide ih-ihene, non muoverti, fingiti morto.\n\nFai una sfida in famiglia: non puoi ridere né sorridere per 3 minuti, qualunque cosa faccia il tuo clan."
        pt: "Da próxima vez que se aproximar uma matilha de malvadas hi-hienas, não te mexas, finge-te de morto.\n\nFaz um desafio em família: não podes rir nem sorrir durante 3 minutos, faça o teu clã o que fizer."
        br: "Da próxima vez que uma matilha de malvadas hi-hienas se aproximar, não se mexa, finja que está morto.\n\nFaça um desafio em família: você não pode rir nem sorrir durante 3 minutos, não importa o que seu clã faça."
        nl: "Als er de volgende keer een roedel gemene gniffelhyena's aankomt, verroer je niet en speel dood.\n\nDoe een gezinsuitdaging: je mag 3 minuten lang niet lachen of glimlachen, wat je clan ook doet."
      gage_09:
        fr: "C'était une bataille épique ! Il y avait un énorme dragon de linge sale qui crachait du feu et de la saleté partout, j'étais encerclé par des crocomoisi et je n'ai rien pu faire ! …\n\nFaire un défi en famille : raconte une histoire complètement fictive pendant au moins 3 minutes."
        en: "It was an epic battle! There was a huge dragon of dirty laundry spitting fire and filth everywhere, I was surrounded by moldy-crocs and there was nothing I could do! ...\n\nTake on a family challenge: tell a completely made-up story for at least 3 minutes."
        es: "¡Fue una batalla épica! Había un enorme dragón de ropa sucia que escupía fuego y suciedad por todas partes, estaba rodeado de cocodrimohos y no pude hacer nada! ...\n\nHaz un desafío en familia: cuenta una historia totalmente inventada durante al menos 3 minutos."
        de: "Es war eine epische Schlacht! Da war ein riesiger Drache aus Schmutzwäsche, der überall Feuer und Dreck spuckte, ich war von Schimmelodilen umzingelt und konnte nichts tun! …\n\nMach eine Familien-Mutprobe: Erzähl mindestens 3 Minuten lang eine komplett erfundene Geschichte."
        it: "È stata una battaglia epica! C'era un enorme drago di panni sporchi che sputava fuoco e sporcizia dappertutto, ero circondato dai muffodrilli e non ho potuto fare niente! …\n\nFai una sfida in famiglia: racconta una storia completamente inventata per almeno 3 minuti."
        pt: "Foi uma batalha épica! Havia um enorme dragão de roupa suja que cuspia fogo e sujidade por todo o lado, eu estava cercado de crocobolores e não pude fazer nada! …\n\nFaz um desafio em família: conta uma história completamente inventada durante pelo menos 3 minutos."
        br: "Foi uma batalha épica! Tinha um enorme dragão de roupa suja que cuspia fogo e sujeira para todo lado, eu estava cercado de crocobolores e não pude fazer nada! …\n\nFaça um desafio em família: conte uma história completamente inventada durante pelo menos 3 minutos."
        nl: "Het was een epische strijd! Er was een enorme draak van vuile was die overal vuur en viezigheid spuwde, ik was omsingeld door schimmelodillen en kon niets doen! …\n\nDoe een gezinsuitdaging: vertel minstens 3 minuten lang een helemaal verzonnen verhaal."
      gage_10:
        fr: "Il est encore temps de t'échapper du donjon, mais attention il y a des pièges partout. Des pièges verticaux et des pièges horizontaux.\n\nFaire un défi en famille : tu ne peux dire ni oui ni non pendant au moins 3 minutes."
        en: "There's still time to escape the dungeon, but beware, there are traps everywhere. Vertical traps and horizontal traps.\n\nTake on a family challenge: you can't say yes or no for at least 3 minutes."
        es: "Aún estás a tiempo de escapar del calabozo, pero cuidado, hay trampas por todas partes. Trampas verticales y trampas horizontales.\n\nHaz un desafío en familia: no puedes decir ni sí ni no durante al menos 3 minutos."
        de: "Noch kannst du aus dem Kerker fliehen, aber Vorsicht, überall sind Fallen. Senkrechte Fallen und waagerechte Fallen.\n\nMach eine Familien-Mutprobe: Du darfst mindestens 3 Minuten lang weder Ja noch Nein sagen."
        it: "Sei ancora in tempo per fuggire dal dungeon, ma attenzione, ci sono trappole ovunque. Trappole verticali e trappole orizzontali.\n\nFai una sfida in famiglia: non puoi dire né sì né no per almeno 3 minuti."
        pt: "Ainda vais a tempo de fugir da masmorra, mas cuidado, há armadilhas por todo o lado. Armadilhas verticais e armadilhas horizontais.\n\nFaz um desafio em família: não podes dizer nem sim nem não durante pelo menos 3 minutos."
        br: "Você ainda tem tempo de fugir da masmorra, mas cuidado, tem armadilhas por todo lado. Armadilhas verticais e armadilhas horizontais.\n\nFaça um desafio em família: você não pode dizer nem sim nem não durante pelo menos 3 minutos."
        nl: "Je kunt nog uit de kerker ontsnappen, maar pas op, er zijn overal vallen. Verticale vallen en horizontale vallen.\n\nDoe een gezinsuitdaging: je mag minstens 3 minuten lang geen ja en geen nee zeggen."
      gage_11:
        fr: "Pourquoi l'aventurier aime les escaliers ? Parce qu'il adore monter de niveau… sauf toi apparemment.\n\nFaire un défi en famille : raconter des blagues jusqu'à faire rire au moins un membre du clan."
        en: "Why does the adventurer love stairs? Because he loves leveling up... except you, apparently.\n\nTake on a family challenge: tell jokes until at least one clan member laughs."
        es: "¿Por qué al aventurero le gustan las escaleras? Porque le encanta subir de nivel... salvo a ti, por lo visto.\n\nHaz un desafío en familia: cuenta chistes hasta hacer reír al menos a un miembro del clan."
        de: "Warum liebt der Abenteurer Treppen? Weil er so gern Stufen aufsteigt… nur du anscheinend nicht.\n\nMach eine Familien-Mutprobe: Erzähl Witze, bis mindestens ein Clanmitglied lacht."
        it: "Perché l'avventuriero ama le scale? Perché adora salire di livello… tranne te, a quanto pare.\n\nFai una sfida in famiglia: racconta barzellette finché almeno un membro del clan non ride."
        pt: "Porque é que o aventureiro gosta de escadas? Porque adora subir de nível… menos tu, pelos vistos.\n\nFaz um desafio em família: conta piadas até fazeres rir pelo menos um membro do clã."
        br: "Por que o aventureiro gosta de escadas? Porque adora subir de nível… menos você, pelo visto.\n\nFaça um desafio em família: conte piadas até fazer pelo menos um membro do clã rir."
        nl: "Waarom houdt de avonturier van trappen? Omdat hij dol is op een niveau omhoog gaan… behalve jij, zo te zien.\n\nDoe een gezinsuitdaging: vertel moppen tot minstens één clanlid lacht."
      gage_12:
        fr: "Tu as vu la créature de bien trop près, et te voilà par terre. Au moins, tu sais à quoi elle ressemble.\n\nFaire un défi en famille : dessine en 2 minutes la créature qui t'a vaincu, montre ton chef-d'œuvre, et le clan doit deviner de quelle pièce elle sortait."
        en: "You saw the creature far too close up, and down you went. At least you know what it looks like.\n\nTake on a family challenge: draw in 2 minutes the creature that beat you, show off your masterpiece, and the clan must guess which room it crawled out of."
        es: "Viste a la criatura demasiado de cerca, y ahí estás, por los suelos. Al menos sabes qué aspecto tiene.\n\nHaz un desafío en familia: dibuja en 2 minutos a la criatura que te venció, enseña tu obra maestra y el clan tiene que adivinar de qué habitación salió."
        de: "Du hast das Wesen viel zu nah gesehen, und schon liegst du am Boden. Immerhin weißt du jetzt, wie es aussieht.\n\nMach eine Familien-Mutprobe: Zeichne in 2 Minuten das Wesen, das dich besiegt hat, zeig dein Meisterwerk, und der Clan muss erraten, aus welchem Zimmer es gekrochen kam."
        it: "Hai visto la creatura troppo da vicino, ed eccoti a terra. Almeno sai che aspetto ha.\n\nFai una sfida in famiglia: disegna in 2 minuti la creatura che ti ha sconfitto, mostra il tuo capolavoro, e il clan deve indovinare da quale stanza è uscita."
        pt: "Viste a criatura demasiado de perto, e aqui estás tu, no chão. Ao menos já sabes como ela é.\n\nFaz um desafio em família: desenha em 2 minutos a criatura que te venceu, mostra a tua obra-prima, e o clã tem de adivinhar de que divisão ela saiu."
        br: "Você viu a criatura de perto demais, e aqui está você, no chão. Pelo menos agora sabe como ela é.\n\nFaça um desafio em família: desenhe em 2 minutos a criatura que venceu você, mostre sua obra-prima, e o clã tem que adivinhar de qual cômodo ela saiu."
        nl: "Je zag het wezen veel te dichtbij, en daar lig je. Nu weet je tenminste hoe het eruitziet.\n\nDoe een gezinsuitdaging: teken in 2 minuten het wezen dat je verslagen heeft, laat je meesterwerk zien, en de clan moet raden uit welke kamer het kwam."
      gage_13:
        fr: "Les murs du donjon renvoient tout ce qu'on leur dit. Toi aussi, maintenant.\n\nFaire un défi en famille : pendant 3 minutes, tu répètes en écho, tout bas, le dernier mot de chaque phrase prononcée par un membre du clan."
        en: "The dungeon walls send back everything said to them. So do you, from now on.\n\nTake on a family challenge: for 3 minutes, echo back in a whisper the last word of every sentence a clan member says."
        es: "Los muros del calabozo devuelven todo lo que se les dice. Tú también, a partir de ahora.\n\nHaz un desafío en familia: durante 3 minutos, repite en voz baja, como un eco, la última palabra de cada frase que diga un miembro del clan."
        de: "Die Mauern des Kerkers werfen alles zurück, was man ihnen sagt. Du jetzt auch.\n\nMach eine Familien-Mutprobe: 3 Minuten lang wiederholst du ganz leise wie ein Echo das letzte Wort jedes Satzes, den ein Clanmitglied sagt."
        it: "Le mura del dungeon ripetono tutto quello che gli si dice. Adesso anche tu.\n\nFai una sfida in famiglia: per 3 minuti ripeti come un'eco, sottovoce, l'ultima parola di ogni frase detta da un membro del clan."
        pt: "As paredes da masmorra devolvem tudo o que se lhes diz. Agora tu também.\n\nFaz um desafio em família: durante 3 minutos, repetes em eco, baixinho, a última palavra de cada frase dita por um membro do clã."
        br: "As paredes da masmorra devolvem tudo o que se diz a elas. Agora você também.\n\nFaça um desafio em família: durante 3 minutos, repita como um eco, baixinho, a última palavra de cada frase dita por um membro do clã."
        nl: "De muren van de kerker kaatsen alles terug wat je tegen ze zegt. Jij nu ook.\n\nDoe een gezinsuitdaging: 3 minuten lang herhaal je fluisterend als een echo het laatste woord van elke zin die een clanlid zegt."
      gage_14:
        fr: "Un héros tombé n'a plus de titre. Mais rien ne t'empêche d'en distribuer aux autres.\n\nFaire un défi en famille : invente un nom épique à chaque membre du clan — demande-lui son accord, un nom qui ne lui plaît pas ne compte pas — et chacun répond au sien jusqu'à la fin de la journée. Toi, tu gardes ton nom."
        en: "A fallen hero has no title left. Nothing stops you handing titles out to everyone else, though.\n\nTake on a family challenge: invent an epic name for each clan member - ask them first, a name they don't like doesn't count - and each of them answers to theirs until the end of the day. You keep your own name."
        es: "Un héroe caído ya no tiene título. Pero nada te impide repartirlos entre los demás.\n\nHaz un desafío en familia: inventa un nombre épico para cada miembro del clan (pídele permiso, un nombre que no le guste no vale) y cada uno responderá al suyo hasta el final del día. Tú conservas tu nombre."
        de: "Ein gefallener Held hat keinen Titel mehr. Aber nichts hindert dich daran, den anderen welche zu verleihen.\n\nMach eine Familien-Mutprobe: Erfinde für jedes Clanmitglied einen epischen Namen (frag vorher, ob es einverstanden ist, ein Name, der ihm nicht gefällt, zählt nicht), und jeder hört bis zum Ende des Tages auf seinen. Du behältst deinen eigenen Namen."
        it: "Un eroe caduto non ha più titoli. Ma niente ti impedisce di distribuirne agli altri.\n\nFai una sfida in famiglia: inventa un nome epico per ogni membro del clan (chiedigli il permesso, un nome che non gli piace non vale) e ognuno risponde al suo fino alla fine della giornata. Tu tieni il tuo nome."
        pt: "Um herói caído já não tem título. Mas nada te impede de os distribuir pelos outros.\n\nFaz um desafio em família: inventa um nome épico para cada membro do clã (pede-lhe autorização, um nome de que não goste não conta) e cada um responde pelo seu até ao fim do dia. Tu ficas com o teu nome."
        br: "Um herói caído não tem mais título. Mas nada impede você de distribuir títulos para os outros.\n\nFaça um desafio em família: invente um nome épico para cada membro do clã (peça autorização, um nome de que a pessoa não goste não vale) e cada um responde pelo seu até o fim do dia. Você fica com o seu nome."
        nl: "Een gevallen held heeft geen titel meer. Maar niets houdt je tegen om er aan de anderen uit te delen.\n\nDoe een gezinsuitdaging: verzin een epische naam voor elk clanlid (vraag eerst toestemming, een naam die iemand niet leuk vindt telt niet) en iedereen luistert tot het eind van de dag naar die naam. Jij houdt je eigen naam."
      gage_15:
        fr: "Tu ne tiens plus bien droit sur tes jambes ? Qu'à cela ne tienne : les crabes du donjon s'en sortent très bien.\n\nFaire un défi en famille : pendant 15 minutes, tu ne te déplaces plus qu'en crabe — sur le côté, jamais de face."
        en: "Not steady on your feet any more? Never mind: the dungeon crabs manage just fine.\n\nTake on a family challenge: for 15 minutes, you only move like a crab - sideways, never facing forward."
        es: "¿Ya no te sostienes derecho? No pasa nada: los cangrejos del calabozo se apañan de maravilla.\n\nHaz un desafío en familia: durante 15 minutos, solo te desplazas como un cangrejo: de lado, nunca de frente."
        de: "Du stehst nicht mehr fest auf deinen Beinen? Macht nichts: Die Krabben im Kerker kommen prima zurecht.\n\nMach eine Familien-Mutprobe: 15 Minuten lang bewegst du dich nur noch wie eine Krabbe fort, seitwärts, nie nach vorn."
        it: "Non ti reggi più bene sulle gambe? Poco male: i granchi del dungeon se la cavano benissimo.\n\nFai una sfida in famiglia: per 15 minuti ti sposti solo come un granchio, di lato, mai in avanti."
        pt: "Já não te aguentas bem de pé? Não faz mal: os caranguejos da masmorra desenrascam-se muito bem.\n\nFaz um desafio em família: durante 15 minutos só te deslocas como um caranguejo, de lado, nunca de frente."
        br: "Não está mais conseguindo ficar de pé? Tudo bem: os caranguejos da masmorra se viram muito bem.\n\nFaça um desafio em família: durante 15 minutos, você só se desloca como um caranguejo, de lado, nunca de frente."
        nl: "Sta je niet meer stevig op je benen? Geeft niks: de krabben in de kerker redden zich prima.\n\nDoe een gezinsuitdaging: 15 minuten lang beweeg je alleen nog als een krab, zijwaarts, nooit naar voren."

      #------------- Réalisation des gages (rédemption après soin) -----------
      # Texte dédié décrivant l'accomplissement du gage correspondant (cf. dt_d_ des tâches).
      # @@@session.user.name@@@ = nom du joueur. Non affiché pour l'instant (feature à venir).

      gage_d_01:
        fr: "Le bourreau était choisi, le supplice aussi — et par @@@session.user.name@@@ en personne, qui a tenu bon jusqu'à décider que c'était assez. Après moult accolades et bisous baveux, le clan reprend son protégé sous son aile et repart pour de plus belles aventures."
        en: "The executioner was chosen, and so was the torment - by @@@session.user.name@@@ in person, who held firm right up to deciding that was enough. After many hugs and slobbery kisses, the clan takes its protégé back under its wing and sets off for greater adventures."
        es: "El verdugo estaba elegido, y el suplicio también, por @@@session.user.name@@@ en persona, que aguantó firme hasta decidir que ya bastaba. Tras muchos abrazos y besos babosos, el clan acoge de nuevo a su protegido bajo su ala y parte hacia mayores aventuras."
        de: "Der Henker war gewählt, die Folter auch, und zwar von @@@session.user.name@@@ höchstpersönlich, der tapfer durchhielt, bis er entschied, dass es genug war. Nach vielen Umarmungen und sabbrigen Küssen nimmt der Clan seinen Schützling wieder unter seine Fittiche und bricht zu noch größeren Abenteuern auf."
        it: "Il boia era stato scelto, e anche il supplizio, da @@@session.user.name@@@ in persona, che ha tenuto duro fino a decidere che bastava. Dopo tanti abbracci e baci bavosi, il clan riprende il suo protetto sotto la sua ala e riparte verso avventure ancora più belle."
        pt: "O carrasco estava escolhido, e o suplício também, por @@@session.user.name@@@ em pessoa, que aguentou firme até decidir que já chegava. Depois de muitos abraços e beijos babados, o clã volta a acolher o seu protegido debaixo da asa e parte para aventuras ainda maiores."
        br: "O carrasco foi escolhido, e o suplício também, por @@@session.user.name@@@ em pessoa, que aguentou firme até decidir que já bastava. Depois de muitos abraços e beijos babados, o clã acolhe de novo seu protegido debaixo da asa e parte para aventuras ainda maiores."
        nl: "De beul was gekozen, en de marteling ook, door @@@session.user.name@@@ zelf, die dapper volhield tot die besloot dat het genoeg was. Na heel veel knuffels en natte zoenen neemt de clan zijn beschermeling weer onder zijn vleugels en trekt hij verder naar nog grotere avonturen."
      gage_d_02:
        fr: "À force de grimaces plus hideuses les unes que les autres, @@@session.user.name@@@ a fini par arracher un fou rire aux vieux mages eux-mêmes. La malédiction est levée : le clan, hilare, accueille de nouveau son champion des affreux visages."
        en: "With one hideous face after another, @@@session.user.name@@@ finally wrung a burst of laughter from the old mages themselves. The curse is lifted: the clan, in stitches, welcomes back its champion of ghastly grimaces."
        es: "A base de muecas cada cual más horrenda, @@@session.user.name@@@ acabó arrancando una carcajada a los mismísimos viejos magos. La maldición se ha roto: el clan, muerto de risa, recibe de nuevo a su campeón de las caras espantosas."
        de: "Mit einer Grimasse scheußlicher als die andere hat @@@session.user.name@@@ sogar den alten Magiern einen Lachanfall entlockt. Der Fluch ist gebrochen: Der Clan, der sich vor Lachen biegt, empfängt seinen Meister der schaurigen Fratzen wieder in seiner Mitte."
        it: "A furia di smorfie una più orrenda dell'altra, @@@session.user.name@@@ è riuscito a strappare una risata perfino ai vecchi maghi. La maledizione è spezzata: il clan, piegato dalle risate, riaccoglie il suo campione delle facce spaventose."
        pt: "À força de caretas cada qual mais horrenda, @@@session.user.name@@@ acabou por arrancar uma gargalhada aos próprios velhos magos. A maldição foi quebrada: o clã, morto de riso, volta a receber o seu campeão das caras medonhas."
        br: "À força de caretas, uma mais horrenda que a outra, @@@session.user.name@@@ acabou arrancando uma gargalhada dos próprios velhos magos. A maldição foi quebrada: o clã, morrendo de rir, recebe de volta seu campeão das caras medonhas."
        nl: "Met de ene afzichtelijke grimas na de andere heeft @@@session.user.name@@@ zelfs de oude magiërs een lachbui ontlokt. De vloek is verbroken: de clan, slap van het lachen, verwelkomt zijn kampioen van de gruwelijke gezichten terug."
      gage_d_03:
        fr: "Sans un mot, sans un geste écrit, @@@session.user.name@@@ a mimé l'impossible et fait deviner chaque énigme au clan ébahi. Le vœu de silence est rompu par les applaudissements : le donjon rend sa voix — et sa place — à son mime légendaire."
        en: "Not a word, not a written sign — @@@session.user.name@@@ mimed the impossible and got the astonished clan to guess every riddle. The vow of silence breaks under the applause: the dungeon gives its legendary mime back both voice and place."
        es: "Sin una palabra, sin un solo gesto escrito, @@@session.user.name@@@ mimó lo imposible e hizo adivinar cada enigma al clan atónito. El voto de silencio se rompe entre aplausos: el calabozo devuelve a su mimo legendario la voz — y su lugar."
        de: "Ohne ein Wort, ohne ein geschriebenes Zeichen hat @@@session.user.name@@@ das Unmögliche pantomimisch dargestellt und den staunenden Clan jedes Rätsel erraten lassen. Das Schweigegelübde bricht im Applaus: Der Kerker gibt seinem legendären Pantomimen die Stimme zurück (und seinen Platz)."
        it: "Senza una parola, senza un solo gesto scritto, @@@session.user.name@@@ ha mimato l'impossibile e ha fatto indovinare ogni enigma al clan sbalordito. Il voto del silenzio si spezza tra gli applausi: il dungeon restituisce al suo mimo leggendario la voce (e il suo posto)."
        pt: "Sem uma palavra, sem um único gesto escrito, @@@session.user.name@@@ fez mímica do impossível e pôs o clã, boquiaberto, a adivinhar cada enigma. O voto de silêncio quebra-se entre aplausos: a masmorra devolve ao seu mimo lendário a voz (e o seu lugar)."
        br: "Sem uma palavra, sem um único gesto escrito, @@@session.user.name@@@ fez mímica do impossível e deixou o clã, boquiaberto, adivinhando cada enigma. O voto de silêncio se quebra entre aplausos: a masmorra devolve ao seu mímico lendário a voz (e o seu lugar)."
        nl: "Zonder een woord, zonder één geschreven teken heeft @@@session.user.name@@@ het onmogelijke uitgebeeld en de verbaasde clan elk raadsel laten raden. De gelofte van stilte wordt verbroken door applaus: de kerker geeft zijn legendarische mime zijn stem terug (en zijn plek)."
      gage_d_04:
        fr: "Une main sur le balai et l'autre sur le cœur, @@@session.user.name@@@ a prononcé son serment devant le clan réuni — et personne n'a osé rire. Le monde est sauvé d'un cheveu (et de quelques moutons de poussière) : le clan salue son héraut et l'accueille en grande pompe."
        en: "One hand on the broom and the other on their heart, @@@session.user.name@@@ spoke the oath before the assembled clan - and nobody dared laugh. The world is saved by a hair (and a few dust bunnies): the clan hails its herald and welcomes them with great fanfare."
        es: "Con una mano sobre la escoba y la otra en el corazón, @@@session.user.name@@@ pronunció su juramento ante el clan reunido, y nadie se atrevió a reír. El mundo se salva por un pelo (y unas cuantas pelusas): el clan aclama a su heraldo y lo recibe por todo lo alto."
        de: "Eine Hand auf dem Besen, die andere auf dem Herzen, hat @@@session.user.name@@@ vor dem versammelten Clan seinen Schwur gesprochen, und niemand wagte zu lachen. Die Welt ist um Haaresbreite gerettet (und von ein paar Wollmäusen befreit): Der Clan jubelt seinem Herold zu und empfängt ihn mit Pauken und Trompeten."
        it: "Una mano sulla scopa e l'altra sul cuore, @@@session.user.name@@@ ha pronunciato il suo giuramento davanti al clan riunito, e nessuno ha osato ridere. Il mondo è salvo per un pelo (e per qualche batuffolo di polvere): il clan acclama il suo araldo e lo accoglie in pompa magna."
        pt: "Com uma mão na vassoura e a outra no coração, @@@session.user.name@@@ pronunciou o seu juramento perante o clã reunido, e ninguém se atreveu a rir. O mundo salvou-se por um fio (e por uns quantos cotões): o clã aclama o seu arauto e recebe-o com toda a pompa."
        br: "Com uma mão na vassoura e a outra no coração, @@@session.user.name@@@ fez seu juramento diante do clã reunido, e ninguém se atreveu a rir. O mundo se salvou por um fio (e por umas bolinhas de poeira): o clã aclama seu arauto e o recebe com toda a pompa."
        nl: "Met één hand op de bezem en de andere op het hart heeft @@@session.user.name@@@ de eed afgelegd voor de voltallige clan, en niemand durfde te lachen. De wereld is op het nippertje gered (en van een paar stofnesten verlost): de clan juicht zijn heraut toe en onthaalt hem met veel toeters en bellen."
      gage_d_05:
        fr: "Sans broncher (ou presque), @@@session.user.name@@@ a goûté la potion que le clan avait préparée au grand jour, et en a nommé les ingrédients un à un — même celui que personne n'assumait. Les forces reviennent, le teint aussi : le remède a opéré, et le clan porte son survivant en triomphe."
        en: "Without flinching (well, almost), @@@session.user.name@@@ tasted the potion the clan had brewed in plain sight, and named its ingredients one by one - even the one nobody would own up to. Strength returns, and so does the color in their cheeks: the remedy worked, and the clan carries its survivor in triumph."
        es: "Sin pestañear (o casi), @@@session.user.name@@@ probó la poción que el clan había preparado a la vista de todos, y nombró sus ingredientes uno a uno, incluso el que nadie quería reconocer. Las fuerzas vuelven, y el color también: el remedio funcionó, y el clan lleva a su superviviente a hombros."
        de: "Ohne mit der Wimper zu zucken (na ja, fast), hat @@@session.user.name@@@ den Trank gekostet, den der Clan vor aller Augen gebraut hatte, und seine Zutaten eine nach der anderen genannt, sogar die, zu der sich niemand bekennen wollte. Die Kräfte kehren zurück, die Farbe im Gesicht auch: Das Heilmittel hat gewirkt, und der Clan trägt seinen Überlebenden im Triumph auf den Schultern."
        it: "Senza battere ciglio (o quasi), @@@session.user.name@@@ ha assaggiato la pozione che il clan aveva preparato sotto gli occhi di tutti, e ne ha nominato gli ingredienti uno a uno, persino quello che nessuno voleva ammettere. Le forze tornano, e anche il colorito: il rimedio ha funzionato, e il clan porta in trionfo il suo sopravvissuto."
        pt: "Sem pestanejar (ou quase), @@@session.user.name@@@ provou a poção que o clã tinha preparado à vista de todos, e nomeou os ingredientes um a um, até aquele que ninguém queria admitir. As forças voltam, e a cor também: o remédio resultou, e o clã leva o seu sobrevivente em ombros."
        br: "Sem piscar (ou quase), @@@session.user.name@@@ provou a poção que o clã tinha preparado à vista de todos, e nomeou os ingredientes um por um, até aquele que ninguém queria admitir. As forças voltam, e a cor também: o remédio funcionou, e o clã carrega seu sobrevivente nos ombros."
        nl: "Zonder een spier te vertrekken (nou ja, bijna) heeft @@@session.user.name@@@ het drankje geproefd dat de clan waar iedereen bij was had gebrouwen, en de ingrediënten één voor één genoemd, zelfs het ingrediënt waar niemand voor wilde uitkomen. De krachten keren terug, de kleur op de wangen ook: het middel heeft gewerkt, en de clan draagt zijn overlevende op handen."
      gage_d_06:
        fr: "« Ha… ha… HA ! » — quarante-cinq secondes d'un rire aussi forcé qu'héroïque, et @@@session.user.name@@@ a fait fuir le désordre et la morosité. Le foyer se redresse : le clan, conquis, reprend son bouffon courageux dans ses rangs."
        en: "\"Ha... ha... HA!\" — forty-five seconds of a laugh as forced as it was heroic, and @@@session.user.name@@@ chased off the mess and the gloom. The home stands tall again: the clan, won over, takes its brave jester back into its ranks."
        es: "«¡Ja... ja... JA!» — cuarenta y cinco segundos de una risa tan forzada como heroica, y @@@session.user.name@@@ ahuyentó el desorden y la tristeza. El hogar se yergue de nuevo: el clan, conquistado, recupera a su valiente bufón entre sus filas."
        de: "„Ha… ha… HA!“: fünfundvierzig Sekunden eines Lachens, so gezwungen wie heldenhaft, und @@@session.user.name@@@ hat Unordnung und Trübsal vertrieben. Das Heim erhebt sich wieder: Der Clan, ganz hingerissen, nimmt seinen mutigen Hofnarren wieder in seine Reihen auf."
        it: "«Ah… ah… AH!»: quarantacinque secondi di una risata tanto forzata quanto eroica, e @@@session.user.name@@@ ha scacciato il disordine e la malinconia. La casa rialza la testa: il clan, conquistato, riaccoglie tra le sue file il suo coraggioso giullare."
        pt: "«Ah… ah… AH!»: quarenta e cinco segundos de um riso tão forçado quanto heroico, e @@@session.user.name@@@ afugentou a desarrumação e a tristeza. O lar volta a erguer-se: o clã, conquistado, recebe de novo nas suas fileiras o seu corajoso bobo."
        br: "\"Ah… ah… AH!\": quarenta e cinco segundos de uma risada tão forçada quanto heroica, e @@@session.user.name@@@ espantou a bagunça e a tristeza. O lar se reergue: o clã, conquistado, recebe de novo em suas fileiras seu corajoso bobo da corte."
        nl: "‘Ha… ha… HA!’: vijfenveertig seconden lang een lach, even geforceerd als heldhaftig, en @@@session.user.name@@@ heeft de rommel en de somberheid verjaagd. Het huis staat weer recht: de clan, helemaal gewonnen, neemt zijn dappere nar weer op in zijn rijen."
      gage_d_07:
        fr: "Trois tenues plus épiques et loufoques les unes que les autres ont défilé sous les vivats du clan, et @@@session.user.name@@@ s'est trouvé une armure digne de sa légende. Rhabillé de pied en cap, notre aventurier reprend la route, plus flamboyant que jamais."
        en: "Three outfits, each more epic and outlandish than the last, paraded to the clan's cheers, and @@@session.user.name@@@ found armor worthy of the legend. Dressed head to toe, our adventurer hits the road again, more dazzling than ever."
        es: "Tres atuendos, cada cual más épico y estrafalario, desfilaron entre los vítores del clan, y @@@session.user.name@@@ encontró una armadura digna de su leyenda. Vestido de pies a cabeza, nuestro aventurero retoma el camino, más deslumbrante que nunca."
        de: "Drei Outfits, eines epischer und verrückter als das andere, defilierten unter dem Jubel des Clans, und @@@session.user.name@@@ hat eine Rüstung gefunden, die seiner Legende würdig ist. Von Kopf bis Fuß neu eingekleidet, zieht unser Abenteurer wieder los, strahlender als je zuvor."
        it: "Tre tenute, una più epica e stravagante dell'altra, hanno sfilato tra le ovazioni del clan, e @@@session.user.name@@@ ha trovato un'armatura degna della sua leggenda. Rivestito da capo a piedi, il nostro avventuriero riprende il cammino, più sfavillante che mai."
        pt: "Três fatiotas, cada qual mais épica e extravagante, desfilaram entre os vivas do clã, e @@@session.user.name@@@ encontrou uma armadura digna da sua lenda. Vestido dos pés à cabeça, o nosso aventureiro retoma o caminho, mais deslumbrante do que nunca."
        br: "Três roupas, uma mais épica e extravagante que a outra, desfilaram entre os vivas do clã, e @@@session.user.name@@@ encontrou uma armadura digna da sua lenda. Vestido dos pés à cabeça, nosso aventureiro retoma o caminho, mais deslumbrante do que nunca."
        nl: "Drie outfits, de ene nog epischer en gekker dan de andere, paradeerden onder het gejuich van de clan, en @@@session.user.name@@@ vond een harnas dat zijn legende waardig is. Van top tot teen opnieuw aangekleed trekt onze avonturier weer op pad, stralender dan ooit."
      gage_d_08:
        fr: "Immobile, impassible, insensible aux pires pitreries du clan, @@@session.user.name@@@ a fait le mort trois minutes durant sans esquisser le moindre sourire. Les hig-hyènes déçues sont reparties bredouilles : le clan récupère son plus imperturbable des guerriers."
        en: "Still, stone-faced, immune to the clan's worst antics, @@@session.user.name@@@ played dead for three whole minutes without cracking the faintest smile. The giggle-hyenas slink off empty-handed: the clan reclaims its most unflappable of warriors."
        es: "Inmóvil, impasible, inmune a las peores payasadas del clan, @@@session.user.name@@@ se hizo el muerto durante tres minutos enteros sin esbozar la más mínima sonrisa. Las ji-hienas se marchan con las manos vacías: el clan recupera a su más imperturbable guerrero."
        de: "Reglos, ungerührt, immun gegen die schlimmsten Faxen des Clans hat sich @@@session.user.name@@@ drei Minuten lang tot gestellt, ohne auch nur den Hauch eines Lächelns. Die enttäuschten Kicher-Hyänen ziehen mit leeren Pfoten ab: Der Clan bekommt seinen unerschütterlichsten Krieger zurück."
        it: "Immobile, impassibile, insensibile alle peggiori buffonate del clan, @@@session.user.name@@@ ha fatto il morto per tre minuti interi senza accennare il minimo sorriso. Le iene-ih-ih, deluse, se ne vanno a mani vuote: il clan ritrova il più imperturbabile dei suoi guerrieri."
        pt: "Imóvel, impassível, imune às piores palhaçadas do clã, @@@session.user.name@@@ fingiu-se de morto durante três minutos inteiros sem esboçar o mais pequeno sorriso. As hi-hienas, desiludidas, vão-se embora de mãos a abanar: o clã recupera o mais imperturbável dos seus guerreiros."
        br: "Imóvel, impassível, imune às piores palhaçadas do clã, @@@session.user.name@@@ se fingiu de morto durante três minutos inteiros sem esboçar o menor sorriso. As hi-hienas, decepcionadas, vão embora de mãos abanando: o clã recupera o mais imperturbável de seus guerreiros."
        nl: "Roerloos, onverstoorbaar, immuun voor de ergste capriolen van de clan heeft @@@session.user.name@@@ drie minuten lang voor dood gelegen zonder ook maar één glimlach. De teleurgestelde hihi-hyena's dropen met lege poten af: de clan krijgt zijn kalmste krijger terug."
      gage_d_09:
        fr: "Pendant de longues minutes, @@@session.user.name@@@ a tissé une épopée si folle — dragons de linge sale et crocomoisi compris — que le clan en est resté bouche bée. Conteur consacré, notre aventurier regagne sa place au coin du feu sous les acclamations."
        en: "For long minutes, @@@session.user.name@@@ spun a tale so wild — dragons of dirty laundry and moldy-crocs included — that the clan was left speechless. Crowned storyteller, our adventurer reclaims a seat by the fire to roaring applause."
        es: "Durante largos minutos, @@@session.user.name@@@ tejió una epopeya tan disparatada — dragones de ropa sucia y cocodrimohos incluidos — que el clan se quedó boquiabierto. Consagrado narrador, nuestro aventurero recupera su sitio junto al fuego entre aplausos."
        de: "Minutenlang hat @@@session.user.name@@@ ein so verrücktes Epos gesponnen (samt Drachen aus Schmutzwäsche und Schimmelodilen), dass dem Clan die Spucke wegblieb. Als gefeierter Erzähler kehrt unser Abenteurer unter Beifall an seinen Platz am Kaminfeuer zurück."
        it: "Per lunghi minuti, @@@session.user.name@@@ ha intessuto un'epopea così folle (draghi di panni sporchi e muffodrilli compresi) che il clan è rimasto a bocca aperta. Consacrato cantastorie, il nostro avventuriero torna al suo posto accanto al fuoco tra le acclamazioni."
        pt: "Durante longos minutos, @@@session.user.name@@@ teceu uma epopeia tão disparatada (dragões de roupa suja e crocobolores incluídos) que o clã ficou de boca aberta. Consagrado contador de histórias, o nosso aventureiro regressa ao seu lugar junto à lareira entre aclamações."
        br: "Durante longos minutos, @@@session.user.name@@@ teceu uma epopeia tão maluca (dragões de roupa suja e crocobolores incluídos) que o clã ficou de boca aberta. Consagrado contador de histórias, nosso aventureiro volta ao seu lugar perto da lareira entre aclamações."
        nl: "Minutenlang heeft @@@session.user.name@@@ een zo waanzinnig epos gesponnen (draken van vuile was en schimmelodillen inbegrepen) dat de clan met open mond bleef zitten. Als gevierd verteller keert onze avonturier onder luid applaus terug naar zijn plek bij het haardvuur."
      gage_d_10:
        fr: "Slalomant entre les pièges verticaux et horizontaux, @@@session.user.name@@@ a tenu trois minutes sans lâcher le moindre « oui » ni « non ». Sain et sauf à la sortie du donjon, notre finaud est accueilli par un clan admiratif… et un peu jaloux."
        en: "Weaving between the vertical and horizontal traps, @@@session.user.name@@@ held out three minutes without letting slip a single \"yes\" or \"no.\" Safe and sound at the dungeon's exit, our sly one is greeted by an admiring — and slightly jealous — clan."
        es: "Sorteando las trampas verticales y horizontales, @@@session.user.name@@@ aguantó tres minutos sin soltar un solo «sí» ni «no». Sano y salvo a la salida del calabozo, nuestro astuto es recibido por un clan admirado… y un poco celoso."
        de: "Im Slalom zwischen senkrechten und waagrechten Fallen hat @@@session.user.name@@@ drei Minuten durchgehalten, ohne ein einziges „Ja“ oder „Nein“ herauszulassen. Heil am Ausgang des Kerkers angekommen, wird unser Schlaufuchs von einem bewundernden… und etwas neidischen Clan empfangen."
        it: "Zigzagando tra le trappole verticali e orizzontali, @@@session.user.name@@@ ha resistito tre minuti senza lasciarsi scappare un solo «sì» né «no». Sano e salvo all'uscita del dungeon, il nostro furbetto viene accolto da un clan ammirato… e un po' invidioso."
        pt: "Contornando as armadilhas verticais e horizontais, @@@session.user.name@@@ aguentou três minutos sem deixar escapar um único «sim» nem «não». São e salvo à saída da masmorra, o nosso espertalhão é recebido por um clã admirado… e um pouco invejoso."
        br: "Desviando das armadilhas verticais e horizontais, @@@session.user.name@@@ aguentou três minutos sem deixar escapar um único \"sim\" nem \"não\". São e salvo na saída da masmorra, nosso espertinho é recebido por um clã admirado… e um pouco invejoso."
        nl: "Slalommend tussen de verticale en horizontale vallen hield @@@session.user.name@@@ het drie minuten vol zonder één keer ‘ja’ of ‘nee’ te zeggen. Veilig en wel bij de uitgang van de kerker wordt onze slimmerik onthaald door een bewonderende… en ietwat jaloerse clan."
      gage_d_11:
        fr: "Blague après blague, @@@session.user.name@@@ a fini par décrocher le rire salvateur d'un membre du clan (le calembour sur les escaliers y est sûrement pour quelque chose). Sacré roi du bon mot, notre aventurier remonte enfin de niveau et repart à l'aventure."
        en: "Joke after joke, @@@session.user.name@@@ finally landed the saving laugh from a clan member (the stairs pun surely helped). Crowned king of the punchline, our adventurer levels up at last and heads back out on the adventure."
        es: "Chiste tras chiste, @@@session.user.name@@@ acabó arrancando la risa salvadora de un miembro del clan (el juego de palabras con las escaleras algo tuvo que ver). Coronado rey del chascarrillo, nuestro aventurero por fin sube de nivel y vuelve a la aventura."
        de: "Witz um Witz hat @@@session.user.name@@@ einem Clanmitglied endlich das erlösende Lachen entlockt (das Wortspiel über die Treppe hatte bestimmt etwas damit zu tun). Zum König der Pointe gekrönt, steigt unser Abenteurer endlich eine Stufe auf und zieht wieder los ins Abenteuer."
        it: "Barzelletta dopo barzelletta, @@@session.user.name@@@ è riuscito a strappare la risata salvatrice a un membro del clan (il gioco di parole sulle scale c'entra di sicuro qualcosa). Incoronato re della battuta, il nostro avventuriero sale finalmente di livello e riparte all'avventura."
        pt: "Piada após piada, @@@session.user.name@@@ acabou por arrancar o riso salvador a um membro do clã (o trocadilho com as escadas deve ter ajudado). Coroado rei da piada, o nosso aventureiro sobe finalmente de nível e parte de novo à aventura."
        br: "Piada após piada, @@@session.user.name@@@ acabou arrancando a risada salvadora de um membro do clã (o trocadilho das escadas deve ter ajudado). Coroado rei da piada, nosso aventureiro finalmente sobe de nível e parte de novo para a aventura."
        nl: "Grap na grap heeft @@@session.user.name@@@ eindelijk een verlossende lach losgekregen bij een clanlid (de woordgrap over de trap had er vast iets mee te maken). Gekroond tot koning van de clou stijgt onze avonturier eindelijk een niveau en trekt weer op avontuur."
      gage_d_12:
        fr: "Deux minutes de crayon auront suffi : la créature qui avait terrassé @@@session.user.name@@@ trône désormais sur le papier, avec bien trop de dents pour être honnête. Le clan a deviné d'où elle sortait, et son artiste revient parmi les vivants sous les applaudissements."
        en: "Two minutes of pencil work was all it took: the creature that had felled @@@session.user.name@@@ now sits enthroned on paper, with far too many teeth to be honest. The clan guessed where it came from, and its artist returns among the living to applause."
        es: "Bastaron dos minutos de lápiz: la criatura que había derribado a @@@session.user.name@@@ reina ahora sobre el papel, con demasiados dientes para ser honesta. El clan adivinó de dónde salió, y su artista vuelve entre los vivos entre aplausos."
        de: "Zwei Minuten mit dem Bleistift haben gereicht: Die Kreatur, die @@@session.user.name@@@ niedergestreckt hatte, thront nun auf dem Papier, mit viel zu vielen Zähnen, um vertrauenswürdig zu sein. Der Clan hat erraten, woher sie kam, und sein Künstler kehrt unter Applaus zu den Lebenden zurück."
        it: "Sono bastati due minuti di matita: la creatura che aveva abbattuto @@@session.user.name@@@ ora troneggia sul foglio, con decisamente troppi denti per essere onesta. Il clan ha indovinato da dove era sbucata, e il suo artista torna tra i vivi tra gli applausi."
        pt: "Bastaram dois minutos de lápis: a criatura que tinha derrubado @@@session.user.name@@@ reina agora sobre o papel, com dentes a mais para ser honesta. O clã adivinhou de onde ela saiu, e o seu artista regressa ao mundo dos vivos entre aplausos."
        br: "Bastaram dois minutos de lápis: a criatura que tinha derrubado @@@session.user.name@@@ agora reina sobre o papel, com dentes demais para ser honesta. O clã adivinhou de onde ela saiu, e seu artista volta ao mundo dos vivos entre aplausos."
        nl: "Twee minuten tekenen was genoeg: het wezen dat @@@session.user.name@@@ had geveld, troont nu op papier, met veel te veel tanden om te vertrouwen. De clan raadde waar het vandaan kwam, en zijn kunstenaar keert onder applaus terug bij de levenden."
      gage_d_13:
        fr: "Trois minutes durant, @@@session.user.name@@@ a renvoyé au clan chacun de ses derniers mots, tout bas, jusqu'à ce que plus personne n'ose finir une phrase. L'écho s'est tu, le donjon a rendu son prisonnier, et le clan le ramène chez les vivants."
        en: "For three minutes @@@session.user.name@@@ whispered the clan's every last word back at it, until nobody dared finish a sentence any more. The echo fell silent, the dungeon gave up its prisoner, and the clan brings them back among the living."
        es: "Durante tres minutos, @@@session.user.name@@@ le devolvió al clan cada una de sus últimas palabras, en voz baja, hasta que ya nadie se atrevía a terminar una frase. El eco calló, el calabozo soltó a su prisionero, y el clan lo trae de vuelta entre los vivos."
        de: "Drei Minuten lang hat @@@session.user.name@@@ dem Clan jedes seiner letzten Worte leise zurückgeflüstert, bis niemand mehr wagte, einen Satz zu Ende zu sprechen. Das Echo ist verstummt, der Kerker hat seinen Gefangenen freigegeben, und der Clan holt ihn zurück zu den Lebenden."
        it: "Per tre minuti, @@@session.user.name@@@ ha rimandato al clan ognuna delle sue ultime parole, sottovoce, finché nessuno ha più osato finire una frase. L'eco si è spenta, il dungeon ha liberato il suo prigioniero, e il clan lo riporta tra i vivi."
        pt: "Durante três minutos, @@@session.user.name@@@ devolveu ao clã cada uma das suas últimas palavras, em voz baixa, até ninguém se atrever a acabar uma frase. O eco calou-se, a masmorra libertou o seu prisioneiro, e o clã trá-lo de volta ao mundo dos vivos."
        br: "Durante três minutos, @@@session.user.name@@@ devolveu ao clã cada uma de suas últimas palavras, em voz baixa, até ninguém mais se atrever a terminar uma frase. O eco se calou, a masmorra libertou seu prisioneiro, e o clã o traz de volta ao mundo dos vivos."
        nl: "Drie minuten lang fluisterde @@@session.user.name@@@ elk laatste woord van de clan zachtjes terug, tot niemand nog een zin durfde af te maken. De echo is verstomd, de kerker heeft zijn gevangene vrijgelaten, en de clan haalt hem terug bij de levenden."
      gage_d_14:
        fr: "Le grimoire est rempli : chaque membre du clan porte désormais le titre que @@@session.user.name@@@ lui a taillé sur mesure, et qu'il a accepté de bon cœur. Une journée entière à répondre à ces noms-là, et le clan, rebaptisé de pied en cap, ramène son parrain parmi les vivants."
        en: "The grimoire is full: every clan member now bears the title @@@session.user.name@@@ tailored for them, and gladly agreed to. A whole day answering to those names, and the clan, renamed from head to toe, brings its name-giver back among the living."
        es: "El grimorio está lleno: cada miembro del clan lleva ahora el título que @@@session.user.name@@@ le hizo a medida, y que aceptó de buen grado. Un día entero respondiendo a esos nombres, y el clan, rebautizado de arriba abajo, trae de vuelta a su padrino entre los vivos."
        de: "Das Zauberbuch ist voll: Jedes Clanmitglied trägt nun den Titel, den @@@session.user.name@@@ ihm auf den Leib geschneidert hat, und hat ihn gern angenommen. Einen ganzen Tag lang auf diese Namen hören, und der Clan, von Kopf bis Fuß umgetauft, holt seinen Namensgeber zurück zu den Lebenden."
        it: "Il grimorio è pieno: ogni membro del clan porta ora il titolo che @@@session.user.name@@@ gli ha cucito su misura, e che ha accettato di buon grado. Un giorno intero a rispondere a quei nomi, e il clan, ribattezzato da capo a piedi, riporta tra i vivi il suo padrino."
        pt: "O grimório está cheio: cada membro do clã tem agora o título que @@@session.user.name@@@ lhe talhou à medida, e que aceitou de bom grado. Um dia inteiro a responder por esses nomes, e o clã, rebatizado dos pés à cabeça, traz de volta ao mundo dos vivos o seu padrinho."
        br: "O grimório está cheio: cada membro do clã agora tem o título que @@@session.user.name@@@ criou sob medida para ele, e que aceitou de bom grado. Um dia inteiro respondendo por esses nomes, e o clã, rebatizado dos pés à cabeça, traz de volta ao mundo dos vivos seu padrinho."
        nl: "Het toverboek is vol: elk clanlid draagt nu de titel die @@@session.user.name@@@ op maat voor hem heeft bedacht, en die hij met plezier heeft aanvaard. Een hele dag naar die namen luisteren, en de clan, van top tot teen herdoopt, haalt zijn naamgever terug bij de levenden."
      gage_d_15:
        fr: "Un quart d'heure durant, @@@session.user.name@@@ n'a plus traversé une seule pièce autrement que de côté, pinces levées, au grand désarroi des portes trop étroites. Les crabes du donjon saluent leur pair : le clan récupère son aventurier, un peu de travers mais bien vivant."
        en: "For a full quarter of an hour @@@session.user.name@@@ crossed no room except sideways, claws up, to the dismay of every narrow doorway. The dungeon crabs salute one of their own: the clan gets its adventurer back, a little sideways but very much alive."
        es: "Durante un cuarto de hora, @@@session.user.name@@@ no cruzó una sola habitación si no era de lado, con las pinzas en alto, ante la desesperación de las puertas estrechas. Los cangrejos del calabozo saludan a su igual: el clan recupera a su aventurero, algo torcido pero bien vivo."
        de: "Eine volle Viertelstunde lang hat @@@session.user.name@@@ jeden Raum nur seitwärts durchquert, die Scheren erhoben, zum Leidwesen aller zu schmalen Türen. Die Kerkerkrabben grüßen einen der Ihren: Der Clan bekommt seinen Abenteurer zurück, ein bisschen schief, aber quicklebendig."
        it: "Per un quarto d'ora, @@@session.user.name@@@ non ha attraversato una sola stanza se non di lato, chele alzate, con grande sconforto delle porte troppo strette. I granchi del dungeon salutano un loro simile: il clan ritrova il suo avventuriero, un po' storto ma vivo e vegeto."
        pt: "Durante um quarto de hora, @@@session.user.name@@@ não atravessou uma única divisão senão de lado, com as pinças no ar, para desespero das portas demasiado estreitas. Os caranguejos da masmorra saúdam um dos seus: o clã recupera o seu aventureiro, um pouco torto mas bem vivo."
        br: "Durante quinze minutos, @@@session.user.name@@@ não atravessou um único cômodo a não ser de lado, com as pinças no ar, para desespero das portas estreitas demais. Os caranguejos da masmorra saúdam um dos seus: o clã recupera seu aventureiro, meio torto mas bem vivo."
        nl: "Een kwartier lang stak @@@session.user.name@@@ geen enkele kamer anders dan zijwaarts over, scharen omhoog, tot wanhoop van alle te smalle deuren. De kerkerkrabben groeten een van hen: de clan krijgt zijn avonturier terug, een beetje scheef maar springlevend."

      # Ajouté automatiquement à la suite de chaque gage (espace + cette phrase),
      # dans le même paragraphe que la consigne « Faire un défi en famille : … ».
      gage_heal:
        fr: "Seulement si tes chefs de clan considèrent que tu as réussi, alors ils pourront te soigner."
        en: "Only if your clan chiefs consider that you succeeded will they be able to heal you."
        es: "Solo si tus jefes de clan consideran que lo has conseguido podrán curarte."
        de: "Nur wenn deine Clanchefs finden, dass du es geschafft hast, können sie dich heilen."
        it: "Solo se i tuoi capi clan riterranno che ce l'hai fatta, potranno curarti."
        pt: "Só se os teus chefes de clã considerarem que conseguiste é que te poderão curar."
        br: "Seus chefes de clã só poderão curar você se considerarem que você conseguiu."
        nl: "Alleen als je clanhoofden vinden dat het je gelukt is, kunnen ze je genezen."


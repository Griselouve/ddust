      # Consentement parental — mention INCONDITIONNELLE, réservée à l'écran de CRÉATION d'un
      # profil de joueur enfant (create_player_screen). Là, et là seulement, le déclarant est
      # forcément le responsable légal : il crée de toutes pièces un enfant sans compte
      # (legal_state "k", no_account), dont ce clan devient le clan d'origine.
      # Ne PAS la réutiliser pour une invitation : celui qui scanne le QR peut être un adulte,
      # ou un enfant déjà membre d'un clan dont le chef d'ICI n'est pas le responsable —
      # c'est à quoi sert invite_consent_notice ci-dessous.
      # Le segment entre (( … | … )) est un lien inline : il ouvre les CGU adulte de la région
      # et de la langue de la session dans le navigateur (cf. commons/parental_consent).
      parental_consent_notice:
        fr: "Conformément aux conditions générales d'utilisation, en créant un profil de joueur pour un enfant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "In accordance with the terms of service, by creating a player profile for a child you declare that you are their legal guardian and you consent to the collection of their data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "De conformidad con las condiciones generales de uso, al crear un perfil de jugador para un niño declaras ser su responsable legal y consientes la recogida de sus datos. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        de: "Gemäß den Nutzungsbedingungen erklärst du mit dem Erstellen eines Spielerprofils für ein Kind, dass du sein Erziehungsberechtigter bist, und willigst in die Erhebung seiner Daten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        it: "In conformità con le Condizioni d'uso, creando un profilo giocatore per un bambino dichiari di esserne il tutore legale e acconsenti alla raccolta dei suoi dati. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        pt: "Em conformidade com os Termos de utilização, ao criares um perfil de jogador para uma criança declaras ser o seu responsável legal e consentes a recolha dos seus dados. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "De acordo com os Termos de uso, ao criar um perfil de jogador para uma criança, você declara ser o responsável legal por ela e consente com a coleta dos dados dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Overeenkomstig de Gebruiksvoorwaarden verklaar je, door een spelersprofiel voor een kind aan te maken, dat je zijn wettelijke voogd bent en stem je in met het verzamelen van zijn gegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      # Mention de l'overlay d'INVITATION : à cet instant on ne sait pas qui viendra. Le chef
      # DÉCLARE donc le cas qui s'applique, en cochant l'une des options ci-dessous — c'est le
      # bloc documents.acknowledgements.guardian (screens_meta.yml), et sa déclaration part avec
      # l'invitation pour se coller à la preuve d'acceptation des CGU du nouveau venu.
      # Un enfant déjà membre d'un clan garde son clan d'ORIGINE pour responsable (original_clan
      # est gelé, cf. _writeClanPlayer) : rejoindre un second clan ne transfère rien. Cf. CGU art. 6.
      # ⚠ Cette mention INTRODUIT les cases, elle ne les redit pas : énoncer les trois cas en
      #   prose puis les faire cocher juste en dessous ferait lire deux fois la même chose, et la
      #   seconde lecture est celle qui engage.
      invite_consent_notice:
        fr: "En invitant quelqu'un dans votre clan, vous déclarez de qui il s'agit. S'il s'agit d'un enfant dont vous êtes le responsable légal, vous consentez à la collecte de ses données de jeu. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "By inviting someone into your clan, you declare who they are. If it is a child for whom you are the legal guardian, you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "Al invitar a alguien a tu clan, declaras de quién se trata. Si es un niño del que eres el responsable legal, consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
        de: "Wenn du jemanden in deinen Clan einlädst, erklärst du, um wen es sich handelt. Handelt es sich um ein Kind, dessen Erziehungsberechtigter du bist, willigst du in die Erhebung seiner Spieldaten ein. Mehr Details in ((den Nutzungsbedingungen|documents.open_doc?cgu@a))."
        it: "Invitando qualcuno nel tuo clan, dichiari di chi si tratta. Se si tratta di un bambino di cui sei il tutore legale, acconsenti alla raccolta dei suoi dati di gioco. Maggiori dettagli nelle ((Condizioni d'uso|documents.open_doc?cgu@a))."
        pt: "Ao convidares alguém para o teu clã, declaras de quem se trata. Se for uma criança de quem és o responsável legal, consentes a recolha dos seus dados de jogo. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a))."
        br: "Ao convidar alguém para o seu clã, você declara de quem se trata. Se for uma criança pela qual você é o responsável legal, você consente com a coleta dos dados de jogo dela. Mais detalhes nos ((Termos de uso|documents.open_doc?cgu@a))."
        nl: "Door iemand in je clan uit te nodigen, verklaar je om wie het gaat. Gaat het om een kind van wie je de wettelijke voogd bent, dan stem je in met het verzamelen van zijn spelgegevens. Meer details in de ((Gebruiksvoorwaarden|documents.open_doc?cgu@a))."
      # Les trois cas, à COCHER (une seule option : choice "one"). Le libellé retenu est
      # enregistré TEL QUEL dans la preuve d'acceptation du nouveau venu, à côté de son id :
      # une déclaration se prouve par la phrase qu'on a mise sous les yeux du chef, et retrouver
      # cette phrase des années plus tard ne doit pas dépendre d'un fichier de traduction.
      # ⚠ Reformuler une option, c'est changer ce qui sera déclaré. Les preuves déjà écrites
      #   gardent l'ancienne phrase, et c'est exactement ce qu'on veut.
      invite_ack_adult:
        fr: "Il s'agit d'un adulte"
        en: "This is an adult"
        es: "Se trata de un adulto"
        de: "Das ist ein Erwachsener"
        it: "Si tratta di un adulto"
        pt: "Trata-se de um adulto"
        br: "É um adulto"
        nl: "Het gaat om een volwassene"
      invite_ack_child_reads:
        fr: "Mon enfant sait lire : je lui présente ses conditions d'utilisation"
        en: "My child can read: I am showing them their terms of use"
        es: "Mi hijo sabe leer: le presento sus condiciones de uso"
        de: "Mein Kind kann lesen: Ich zeige ihm seine Nutzungsbedingungen"
        it: "Mio figlio sa leggere: gli mostro le sue condizioni d'uso"
        pt: "O meu filho sabe ler: apresento-lhe os seus termos de utilização"
        br: "Meu filho sabe ler: vou mostrar a ele os termos de uso dele"
        nl: "Mijn kind kan lezen: ik laat het zijn gebruiksvoorwaarden zien"
      invite_ack_child_read_aloud:
        fr: "Mon enfant ne sait pas encore lire : je viens de lui lire ses conditions d'utilisation"
        en: "My child cannot read yet: I have just read them their terms of use"
        es: "Mi hijo aún no sabe leer: acabo de leerle sus condiciones de uso"
        de: "Mein Kind kann noch nicht lesen: Ich habe ihm gerade seine Nutzungsbedingungen vorgelesen"
        it: "Mio figlio non sa ancora leggere: gli ho appena letto le sue condizioni d'uso"
        pt: "O meu filho ainda não sabe ler: acabei de lhe ler os seus termos de utilização"
        br: "Meu filho ainda não sabe ler: acabei de ler para ele os termos de uso dele"
        nl: "Mijn kind kan nog niet lezen: ik heb het net zijn gebruiksvoorwaarden voorgelezen"
      # Panneau de tête de l'écran de déclaration (invite_consent_screen/assent), posé par
      # worker.on_invite_consent_appear. Même registre que invite_consent_notice (« vous » en
      # français, tutoiement ailleurs).
      #   * invite_consent_assent : un accord d'enfant est joint. {date} et {text} sont remplacés
      #     par le worker : la date du oui, et le texte montré à l'enfant (kid_assent_question),
      #     rendu dans la langue du chef ;
      #   * invite_consent_child_hint : pas d'accord joint (QR Code du clan, Inviter à distance) ;
      #   * invite_consent_not_assent : « Accueillir un enfant » a scanné autre chose qu'un accord.
      invite_consent_assent:
        fr: "Votre enfant a dit qu'il voulait jouer, le {date}. Voici le texte qui lui a été montré :\n\n« {text} »"
        en: "Your child said they wanted to play, on {date}. Here is the text they were shown:\n\n“{text}”"
        es: "Tu hijo dijo que quería jugar, el {date}. Este es el texto que se le mostró:\n\n«{text}»"
        de: "Dein Kind hat am {date} gesagt, dass es spielen möchte. Dieser Text wurde ihm gezeigt:\n\n„{text}“"
        it: "Tuo figlio ha detto di voler giocare, il {date}. Ecco il testo che gli è stato mostrato:\n\n«{text}»"
        pt: "O teu filho disse que queria jogar, em {date}. Eis o texto que lhe foi mostrado:\n\n«{text}»"
        br: "Seu filho disse que queria jogar, em {date}. Este é o texto que foi mostrado a ele:\n\n“{text}”"
        nl: "Je kind heeft op {date} gezegd dat het wil spelen. Dit is de tekst die het te zien kreeg:\n\n‘{text}’"
      #   * invite_consent_assent_code : première ligne du même panneau, en mode enfant. {code}
      #     est le code de la demande, que l'enfant affiche en grand (kid_assent_share_code) ;
      #     les marqueurs [[ ]] le font ressortir. L'invitation portera ce code, et l'appareil de
      #     l'enfant refusera toute invitation qui ne le porte pas.
      invite_consent_assent_code:
        fr: "Code de sa demande : [[{code}]]. Vérifiez que c'est le même que sur son écran."
        en: "Code of their request: [[{code}]]. Check that it is the same as on their screen."
        es: "Código de su solicitud: [[{code}]]. Comprueba que es el mismo que en su pantalla."
        de: "Code seiner Anfrage: [[{code}]]. Prüfe, ob er derselbe ist wie auf seinem Bildschirm."
        it: "Codice della sua richiesta: [[{code}]]. Controlla che sia lo stesso del suo schermo."
        pt: "Código do pedido: [[{code}]]. Verifica se é o mesmo que aparece no ecrã da criança."
        br: "Código do pedido: [[{code}]]. Confira se é o mesmo que aparece na tela da criança."
        nl: "Code van de aanvraag: [[{code}]]. Controleer of het dezelfde is als op het scherm van je kind."
      #   * invite_consent_claim : derniere ligne du meme panneau, quand le parent vient de designer
      #     le joueur sans telephone que l'enfant reprend (claim_pick_page). {name} = son nom.
      invite_consent_claim:
        fr: "Il retrouvera son joueur : [[{name}]]."
        en: "They will get back their player: [[{name}]]."
        es: "Recuperará su jugador: [[{name}]]."
        de: "Es bekommt seinen Spieler zurück: [[{name}]]."
        it: "Ritroverà il suo giocatore: [[{name}]]."
        pt: "Vai recuperar o seu jogador: [[{name}]]."
        br: "Vai recuperar o seu jogador: [[{name}]]."
        nl: "Het krijgt zijn speler terug: [[{name}]]."
      # Reprise d'un joueur sans telephone (claim_pick_page) : le chef accueille un enfant qui
      # jouait deja sur le telephone d'un parent. La derniere ligne de la liste garde le
      # parcours d'un nouveau joueur.
      claim_pick_hint:
        fr: "Cet enfant jouait-il déjà sur votre téléphone ? Choisissez son joueur : il le retrouvera sur son propre téléphone, avec son expérience, ses objets et son histoire. Sinon, choisissez « C'est un nouveau joueur »."
        en: "Was this child already playing on your phone? Choose their player: they will find it on their own phone, with their experience, items and story. Otherwise, choose “This is a new player”."
        es: "¿Este niño ya jugaba en tu teléfono? Elige su jugador: lo encontrará en su propio teléfono, con su experiencia, sus objetos y su historia. Si no, elige «Es un jugador nuevo»."
        de: "Hat dieses Kind schon auf deinem Handy gespielt? Wähle seinen Spieler: Es findet ihn auf seinem eigenen Handy wieder, mit seiner Erfahrung, seinen Gegenständen und seiner Geschichte. Sonst wähle „Das ist ein neuer Spieler“."
        it: "Questo bambino giocava già sul tuo telefono? Scegli il suo giocatore: lo ritroverà sul suo telefono, con la sua esperienza, i suoi oggetti e la sua storia. Altrimenti, scegli «È un nuovo giocatore»."
        pt: "Esta criança já jogava no teu telemóvel? Escolhe o jogador dela: vai encontrá-lo no seu próprio telemóvel, com a experiência, os objetos e a história. Se não, escolhe «É um jogador novo»."
        br: "Essa criança já jogava no seu celular? Escolha o jogador dela: ela vai encontrá-lo no próprio celular, com a experiência, os objetos e a história. Se não, escolha “É um jogador novo”."
        nl: "Speelde dit kind al op jouw telefoon? Kies zijn speler: het vindt hem terug op zijn eigen telefoon, met zijn ervaring, voorwerpen en verhaal. Zo niet, kies dan ‘Dit is een nieuwe speler’."
      claim_pick_new:
        fr: "C'est un nouveau joueur"
        en: "This is a new player"
        es: "Es un jugador nuevo"
        de: "Das ist ein neuer Spieler"

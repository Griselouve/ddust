      # de liaison. Il ne dit pas « réessaie dans un instant » (l'ancien link_failed), qui était
      # un mauvais conseil : sur un compte supervisé, réessayer ne changera rien tant qu'un
      # parent n'a pas autorisé. Et il ne peut pas être plus précis — Google remonte le même
      # code pour un refus parental et pour une feuille refermée par l'enfant.
      signin_failed_parent:
        fr: "La connexion n'a pas abouti. Si un parent veille sur ce compte Google, il doit d'abord autoriser Donjons & Savons depuis Family Link. Tu pourras réessayer ensuite."
        en: "Sign-in did not go through. If a parent supervises this Google account, they must first allow Dungeons & Dusting from Family Link. You can try again afterwards."
        es: "La conexión no se completó. Si un padre supervisa esta cuenta de Google, primero debe autorizar Calabozos & Jabones desde Family Link. Después podrás intentarlo de nuevo."
        de: "Die Anmeldung hat nicht geklappt. Wenn ein Elternteil dieses Google-Konto beaufsichtigt, muss es Donjons & Savons zuerst in Family Link erlauben. Danach kannst du es erneut versuchen."
        it: "L'accesso non è andato a buon fine. Se un genitore supervisiona questo account Google, deve prima autorizzare Donjons & Savons da Family Link. Poi potrai riprovare."
        pt: "O início de sessão não foi concluído. Se um dos pais supervisiona esta conta Google, tem primeiro de autorizar Donjons & Savons no Family Link. Depois poderás tentar de novo."
        br: "O login não foi concluído. Se um dos pais supervisiona esta conta Google, ele precisa primeiro autorizar Donjons & Savons no Family Link. Depois você poderá tentar de novo."
        nl: "Het inloggen is niet gelukt. Als een ouder toezicht houdt op dit Google-account, moet die eerst Donjons & Savons toestaan via Family Link. Daarna kun je het opnieuw proberen."


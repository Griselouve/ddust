        fr: "Ton nom"
        en: "Your name"
        es: "Tu nombre"

      edit_clan_name_title:
        fr: "Nom du clan"
        en: "Clan name"
        es: "Nombre del clan"

      cancel:
        fr: "Annuler"
        en: "Cancel"
        es: "Cancelar"

      ok:
        fr: "Valider"
        en: "OK"
        es: "Aceptar"


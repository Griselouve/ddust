        fr: "Prêt?"
        en: "Ready?"
        es: "Listo?"

      #------------- Clan roster menu ------------------------------------

      # Menu d'administration du tiroir (mode chef). Les libellés nomment l'ÉTAT D'ARRIVÉE,
      # comme les glyphes : « désactiver » est proposé depuis une tâche active ET depuis une
      # tâche cachée (dans les deux cas, elle finit désactivée).
      # Switch « Jeu | Admin » en bas du tiroir.
      mode_game:
        fr: "Jeu"
        en: "Play"
        es: "Juego"
      mode_admin:
        fr: "Admin"
        en: "Admin"
        es: "Admin"

      adm_menu_enable:
        fr: "Activer"
        en: "Enable"
        es: "Activar"
      adm_menu_disable:
        fr: "Désactiver"
        en: "Disable"
        es: "Desactivar"
      adm_menu_hide:
        fr: "Cacher aux joueurs"
        en: "Hide from players"
        es: "Ocultar a los jugadores"
      adm_menu_show:
        fr: "Montrer aux joueurs"
        en: "Show to players"
        es: "Mostrar a los jugadores"
      adm_menu_edit:
        fr: "Modifier"
        en: "Edit"
        es: "Modificar"
      adm_menu_tasks:
        fr: "Voir les tâches"
        en: "View tasks"
        es: "Ver las tareas"
      # Menu admin d'une tâche : remise à neuf immédiate (respawn à 100 %).
      adm_menu_revive:
        fr: "Ressusciter"
        en: "Revive"
        es: "Resucitar"
      # « Recommander » (menu admin du tiroir) : marque une feuille comme boss (XP bonus).
      adm_menu_recommend:
        fr: "Recommander"
        en: "Recommend"
        es: "Recomendar"
      # « Ne plus recommander » : retire le statut boss posé par adm_menu_recommend.
      adm_menu_unrecommend:
        fr: "Ne plus recommander"
        en: "Stop recommending"
        es: "Dejar de recomendar"
      # « Laisser tomber » (menu admin du tiroir) : libère une tâche tenue par un joueur.
      adm_menu_release:
        fr: "Laisser tomber"
        en: "Drop it"
        es: "Abandonar"
      # Libellé de la tuile « + » injectée en fin de grille en mode admin.
      adm_add:
        fr: "Ajouter"
        en: "Add"
        es: "Añadir"

      roster_menu_revive:
        fr: "Guérir le joueur"
        en: "Heal the player"
        es: "Curar al jugador"
      roster_menu_support:
        fr: "Coup de pouce"
        en: "Give a boost"
        es: "Un empujoncito"
      roster_menu_log:
        fr: "Consulter le journal"
        en: "View log"
        es: "Ver el registro"
      clan_menu_log:
        fr: "Journal du clan"
        en: "Clan log"
        es: "Registro del clan"
      clan_menu_qr:
        fr: "QR Code du clan"
        en: "Clan QR code"
        es: "Código QR del clan"
      clan_menu_invite_remote:
        fr: "Inviter à distance"
        en: "Invite remotely"
        es: "Invitar a distancia"
      clan_menu_invite_remote_desc:
        fr: "Envoyer un lien d'invitation protégé par un code dicté de vive voix"
        en: "Send an invite link protected by a spoken code"
        es: "Enviar un enlace de invitación protegido por un código dictado de viva voz"
      # « Créer un joueur » (menu clan, chef) : enfant sans téléphone ni compte Google.
      clan_menu_create_player:
        fr: "Créer un joueur"
        en: "Create a player"
        es: "Crear un jugador"
      clan_menu_create_player_desc:
        fr: "Pour un enfant trop jeune ou sans téléphone : tu crées son personnage et tu joues à sa place"
        en: "For a child too young or without a phone: you create their character and play in their place"
        es: "Para un niño demasiado pequeño o sin teléfono: creas su personaje y juegas en su lugar"
      # Écran de saisie du nom du nouveau joueur enfant.
      create_player_title:
        fr: "Nouveau joueur"
        en: "New player"
        es: "Nuevo jugador"
      create_player_description_label:
        fr: "Raconte son aventurier"
        en: "Tell us about their adventurer"
        es: "Cuenta quién es su aventurero"
      create_player_label:
        fr: "Donne-lui un nom"
        en: "Give them a name"
        es: "Dale un nombre"
      create_player_confirm:
        fr: "Créer"
        en: "Create"
        es: "Crear"
      # Consentement parental — mention INCONDITIONNELLE, réservée à l'écran de CRÉATION d'un
      # profil de joueur enfant (create_player_screen). Là, et là seulement, le déclarant est
      # forcément le responsable légal : il crée de toutes pièces un enfant sans compte
      # (legal_state "k", no_account), dont ce clan devient le clan d'origine.
      # Ne PAS la réutiliser pour une invitation : celui qui scanne le QR peut être un adulte,
      # ou un enfant déjà membre d'un clan dont le chef d'ICI n'est pas le responsable —
      # c'est à quoi sert invite_consent_notice ci-dessous.
      # Le segment entre (( … | … )) est un lien inline : il ouvre les CGU adulte de la région
      # et de la langue de la session dans le navigateur (cf. commons/parental_consent).
      parental_consent_notice:
        fr: "Conformément aux conditions générales d'utilisation, en créant un profil de joueur pour un enfant, vous déclarez être son responsable légal et vous consentez à la collecte de ses données. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "In accordance with the terms of service, by creating a player profile for a child you declare that you are their legal guardian and you consent to the collection of their data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "De conformidad con las condiciones generales de uso, al crear un perfil de jugador para un niño declaras ser su responsable legal y consientes la recogida de sus datos. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
      # Mention de l'overlay d'INVITATION : à cet instant on ne sait pas qui viendra. Le chef
      # DÉCLARE donc le cas qui s'applique, en cochant l'une des options ci-dessous — c'est le
      # bloc documents.acknowledgements.guardian (screens_meta.yml), et sa déclaration part avec
      # l'invitation pour se coller à la preuve d'acceptation des CGU du nouveau venu.
      # Un enfant déjà membre d'un clan garde son clan d'ORIGINE pour responsable (original_clan
      # est gelé, cf. _writeClanPlayer) : rejoindre un second clan ne transfère rien. Cf. CGU art. 6.
      # ⚠ Cette mention INTRODUIT les cases, elle ne les redit pas : énoncer les trois cas en
      #   prose puis les faire cocher juste en dessous ferait lire deux fois la même chose, et la
      #   seconde lecture est celle qui engage.
      invite_consent_notice:
        fr: "En invitant quelqu'un dans votre clan, vous déclarez de qui il s'agit. S'il s'agit d'un enfant dont vous êtes le responsable légal, vous consentez à la collecte de ses données de jeu. Plus de détails sur ((les conditions générales d'utilisation|documents.open_doc?cgu@a))."
        en: "By inviting someone into your clan, you declare who they are. If it is a child for whom you are the legal guardian, you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a))."
        es: "Al invitar a alguien a tu clan, declaras de quién se trata. Si es un niño del que eres el responsable legal, consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a))."
      # Les trois cas, à COCHER (une seule option : choice "one"). Le libellé retenu est
      # enregistré TEL QUEL dans la preuve d'acceptation du nouveau venu, à côté de son id :
      # une déclaration se prouve par la phrase qu'on a mise sous les yeux du chef, et retrouver
      # cette phrase des années plus tard ne doit pas dépendre d'un fichier de traduction.
      # ⚠ Reformuler une option, c'est changer ce qui sera déclaré. Les preuves déjà écrites
      #   gardent l'ancienne phrase, et c'est exactement ce qu'on veut.
      invite_ack_adult:
        fr: "Il s'agit d'un adulte"
        en: "This is an adult"
        es: "Se trata de un adulto"
      invite_ack_child_reads:
        fr: "Mon enfant sait lire — je lui présente ses conditions d'utilisation"
        en: "My child can read — I am showing them their terms of use"
        es: "Mi hijo sabe leer — le presento sus condiciones de uso"
      invite_ack_child_read_aloud:
        fr: "Mon enfant ne sait pas encore lire — je viens de lui lire ses conditions d'utilisation"
        en: "My child cannot read yet — I have just read them their terms of use"
        es: "Mi hijo aún no sabe leer — acabo de leerle sus condiciones de uso"
      # Boutons de l'overlay de consentement, révélé au chef quand il demande à recruter
      # (QR ou invitation à distance), AVANT que le lobby ne soit créé — cf. worker.on_invite_clan.
      # Le libellé n'assume AUCUNE responsabilité : la mention ci-dessus est conditionnelle, le
      # bouton ne peut donc qu'accuser réception (« J'en suis responsable » serait faux dès que
      # l'invité est un adulte ou un enfant déjà pris en charge ailleurs).
      invite_consent_yes:
        fr: "J'ai compris, invitons !"
        en: "Understood, let's invite!"
        es: "Entendido, ¡invitemos!"
      invite_consent_no:
        fr: "Pas maintenant"
        en: "Not now"
        es: "Ahora no"
      # Membre entré dans le clan mais dont le nom n'est pas encore saisi (il l'est après la
      # liaison du compte) : libellé d'attente, à la place de son identifiant technique.
      member_unnamed:
        fr: "Nouveau venu"
        en: "Newcomer"
        es: "Recién llegado"
      perso_menu_log:
        fr: "Mon Journal"
        en: "My log"
        es: "Mi registro"
      perso_menu_lang:
        fr: "Changer de langue"
        en: "Change language"
        es: "Cambiar idioma"
      perso_menu_lang_desc:
        fr: "Choisir la langue de l'application."
        en: "Choose the app language."
        es: "Elegir el idioma de la aplicación."
      roster_menu_offline:
        fr: "Déclarer hors ligne"
        en: "Mark as offline"
        es: "Marcar como desconectado"
      roster_menu_takeplace:
        fr: "Jouer à sa place"
        en: "Play in their place"
        es: "Jugar en su lugar"
      roster_menu_promote_chief:
        fr: "Promouvoir chef"
        en: "Promote to chief"
        es: "Promover a jefe"
      roster_menu_nomore_chief:
        fr: "Plus chef"
        en: "No longer chief"
        es: "Ya no es jefe"
      roster_menu_promote_adult:
        fr: "Déclarer majeur"
        en: "Declare adult"
        es: "Declarar adulto"
      roster_menu_pay_tribute:
        fr: "Payer son tribut"
        en: "Pay their tribute"
        es: "Pagar su tributo"
      roster_menu_revoke:
        fr: "A quitté le clan"
        en: "Left the clan"
        es: "Dejó el clan"
      # RETRAIT DU CONSENTEMENT PARENTAL. ⚠ Le libellé français et le libellé anglais sont
      # PUBLIÉS TELS QUELS au § 9 des 84 politiques de confidentialité adultes
      # (legal/documents/*-a-{fr,en}-privacy-v1.html) : les reformuler oblige à reprendre le
      # corpus. Long, et assumé : c'est le geste le plus lourd que l'application propose, et
      # un libellé court ne dirait pas ce qu'il fait.
      roster_menu_withdraw_consent:
        fr: "Retirer mon consentement et effacer les données de cet enfant"
        en: "Withdraw my consent and erase this child's data"
        es: "Retirar mi consentimiento y borrar los datos de este niño"
      roster_menu_restore_consent:
        fr: "Rétablir cet enfant"
        en: "Restore this child"
        es: "Restablecer a este niño"

      # ---- Retrait du consentement : overlay de confirmation (clan_page/consent_*) ----
      # {name} = nom du joueur visé, substitué en code (worker._setConsentLabel).
      # ⚠ Ce texte dit ce que le retrait FAIT et ce qu'il NE FAIT PAS. Les trois dernières
      # phrases ne sont pas du confort : elles reprennent trois engagements publiés au § 9
      # des politiques de confidentialité (délai de rétractation, preuve close et datée,
      # aucune liste d'enfants écartés). Les retirer ferait mentir le document.
      consent_withdraw_warn:
        fr: "Vous retirez votre consentement pour {name}.\nIl quitte le jeu immédiatement.\nPendant 3 jours, un chef de son clan d'origine peut revenir sur cette décision. Passé ce délai, ses données de jeu sont supprimées.\nLa preuve de votre consentement n'est pas effacée : elle est close et datée.\nCela ne l'empêche pas d'être invité un jour dans un autre clan, par un adulte qui en répondra."
        en: "You are withdrawing your consent for {name}.\nThey leave the game immediately.\nFor 3 days, a chief of their clan of origin may reverse this decision. After that, their game data is deleted.\nThe proof of your consent is not erased: it is closed and dated.\nThis does not prevent them from one day being invited into another clan, by an adult who answers for them."
        es: "Retiras tu consentimiento para {name}.\nSale del juego de inmediato.\nDurante 3 días, un jefe de su clan de origen puede revocar esta decisión. Pasado ese plazo, sus datos de juego se eliminan.\nLa prueba de tu consentimiento no se borra: queda cerrada y fechada.\nEsto no impide que algún día se le invite a otro clan, por un adulto que responda por él."
      consent_withdraw_confirm:
        fr: "Retirer mon consentement"
        en: "Withdraw my consent"
        es: "Retirar mi consentimiento"
      consent_withdraw_cancel:
        fr: "Annuler"
        en: "Cancel"
        es: "Cancelar"
      # Retour arrière pendant le délai. Le ton est délibérément banal : se raviser doit
      # coûter moins cher que décider, sans quoi la rétractation promise n'est pas réelle.
      consent_restore_warn:
        fr: "Vous rétablissez {name}.\nIl retrouve son personnage, ses niveaux et sa place dans le clan, intacts.\nVotre consentement reprend effet."
        en: "You are restoring {name}.\nThey get back their character, their levels and their place in the clan, untouched.\nYour consent takes effect again."
        es: "Restableces a {name}.\nRecupera su personaje, sus niveles y su lugar en el clan, intactos.\nTu consentimiento vuelve a surtir efecto."
      consent_restore_confirm:
        fr: "Rétablir"
        en: "Restore"
        es: "Restablecer"
      consent_restore_cancel:
        fr: "Annuler"
        en: "Cancel"
        es: "Cancelar"
      consent_working:
        fr: "Un instant..."
        en: "One moment..."
        es: "Un momento..."

      # ---- Porte close, côté ENFANT (commons/closed_msg) ----
      # ⚠ Lu par un enfant dont on vient de retirer le consentement, peut-être par erreur, et
      # peut-être pour trois jours seulement. Il ne dit ni « supprimé », ni « effacé », ni qui
      # a décidé : il constate que la porte est close et renvoie la main à la maison. Le même
      # parti que le seuil des dix jours sans tâche — l'application cesse de solliciter et
      # laisse un adulte aller voir.
      consent_closed_msg:
        fr: "Le donjon s'est refermé.\nParle à un adulte de ton clan."
        en: "The dungeon has closed.\nTalk to an adult in your clan."
        es: "La mazmorra se ha cerrado.\nHabla con un adulto de tu clan."

      # ---- Notification aux AUTRES chefs du clan d'origine ----
      # Sans elle, la fenêtre de rétractation promise par la politique de confidentialité
      # serait purement théorique pour un chef qui n'ouvre pas l'application. Ne part JAMAIS
      # à un enfant : les chefs sont nécessairement majeurs (promote_chief exige "a").
      notif_consent_withdrawn:
        fr: "Le consentement a été retiré pour {name}. Ses données seront supprimées dans 3 jours ; un chef du clan peut encore revenir sur cette décision."
        en: "Consent has been withdrawn for {name}. Their data will be deleted in 3 days; a clan chief can still reverse this decision."
        es: "Se ha retirado el consentimiento para {name}. Sus datos se eliminarán en 3 días; un jefe del clan aún puede revocar esta decisión."
      # Rappels de relance (pulse_sweeper). Deux libellés exclusifs : clan_selector n'en
      # propose jamais qu'un. Formulés du côté du DONJON et non du système — on ne coupe
      # pas « les notifications », on demande au donjon de ne plus faire signe.
      roster_menu_nudges_off:
        fr: "Ne plus faire signe"
        en: "Stop reaching out"
        es: "Dejar de avisar"
      roster_menu_nudges_off_desc:
        fr: "Le donjon cesse de lui donner de ses nouvelles quand il ne vient plus."
        en: "The dungeon stops sending them news when they stop coming."
        es: "La mazmorra deja de darle noticias cuando ya no viene."
      roster_menu_nudges_on:
        fr: "Refaire signe"
        en: "Reach out again"
        es: "Volver a avisar"
      roster_menu_nudges_on_desc:
        fr: "Le donjon pourra de nouveau lui donner de ses nouvelles."
        en: "The dungeon may send them news again."
        es: "La mazmorra podrá volver a darle noticias."
      roster_menu_hors_concours_on:
        fr: "Mettre hors concours"
        en: "Set out of the running"
        es: "Poner fuera de concurso"
      roster_menu_hors_concours_off:
        fr: "Remettre en jeu"
        en: "Bring them back in"
        es: "Volver a competir"

      #------------- Player log screen --------------------------------

      log_page_title:
        fr: "Journal"
        en: "Log"
        es: "Registro"
      log_page_loading:
        fr: "…"
        en: "…"
        es: "…"
      log_empty:
        fr: "Aucune histoire à raconter pour l'instant."
        en: "No story to tell yet."
        es: "Aún no hay ninguna historia que contar."
      share_log_intro:
        fr: "Découvre les exploits de mon aventurier dans Donjons & Savons ! ⚔️📜"
        en: "Check out my adventurer's deeds in Dungeons & Soaps! ⚔️📜"
        es: "¡Descubre las hazañas de mi aventurero en Mazmorras y Jabones! ⚔️📜"
      # Suffixe ajouté au partage quand le log est tronqué (> shareMax évènements).
      log_share_more:
        fr: "…et tant d'autres exploits !"
        en: "…and so many other deeds!"
        es: "¡…y muchas otras hazañas!"
      # Accroche du partage du CONTE (récit IA du clan, worker.on_log_appear en mode narratif) —
      # distincte de share_log_intro, qui parle « de mon aventurier » : ici c'est le clan entier,
      # et l'accroche fait la promotion de l'app auprès d'autres familles (cf. vision.md).
      share_tale_intro:
        fr: "Notre clan s'est lancé dans une aventure familiale sur Donjons & Savons — voici notre histoire ! ⚔️📜"
        en: "Our clan went on a family adventure in Dungeons & Soaps — here's our story! ⚔️📜"
        es: "¡Nuestro clan vivió una aventura familiar en Mazmorras y Jabones — aquí está nuestra historia! ⚔️📜"
      # Clôture FIXE (pas générée par l'IA), ajoutée après le conte par worker.on_log_appear : le
      # prompt narrate_clan interdit désormais toute mention d'argent au modèle, c'est donc cette
      # phrase qui porte le sujet de l'argent de poche et l'appel à l'action doux.
      share_tale_outro:
        fr: "Les enfants se sont bien amusés et, grâce à leurs efforts, ils ont récolté de l'argent de poche et bien d'autres surprises ! Ça vous tente ?"
        en: "The kids had a blast, and thanks to their efforts they earned pocket money and plenty of other surprises! Want to give it a try?"
        es: "¡Los niños se lo pasaron genial, y gracias a su esfuerzo consiguieron dinero de bolsillo y muchas otras sorpresas! ¿Te animas?"
      # Dernière ligne de TOUT partage social (journal ET conte) : le lien du site vitrine. Sans lui
      # le partage vante le jeu sans dire où le trouver — le destinataire n'a aucun moyen d'agir.
      # Une URL PAR LANGUE (le site a une arborescence fr/ en/ es/) : la racine redirige selon la
      # langue du NAVIGATEUR du destinataire, ce qui n'est pas forcément celle du partage.
      share_site_link:
        fr: "Découvrir le jeu : https://donjons.grisloup.com/fr/"
        en: "Discover the game: https://donjons.grisloup.com/en/"
        es: "Descubre el juego: https://donjons.grisloup.com/es/"
      # Attente affichée pendant que le modèle rédige le conte (aller-retour réseau, jusqu'à 30 s).
      log_narrating:
        fr: "Le conteur rassemble ses mots…"
        en: "The storyteller is gathering their words…"
        es: "El narrador está reuniendo sus palabras…"
      # Le modèle n'a pas répondu (hors ligne, budget IA coupé, timeout) : préfixe posé devant le
      # journal brut, qui sert alors de repli — jamais un écran vide.
      log_narrate_failed:
        fr: "Le conteur n'a pas pu se déplacer aujourd'hui. Voici le journal tel quel :"
        en: "The storyteller couldn't make it today. Here's the log as it stands:"
        es: "El narrador no pudo venir hoy. Aquí está el registro tal cual:"

      #------------- Home screen / liaison de compte -------------------

      start_adventure:
        fr: "Je pars à l'aventure (nouveau compte)"
        en: "Off on my adventure (new account)"
        es: "Me voy de aventura (cuenta nueva)"

      already_have_account:
        fr: "Retrouver mon héros (compte existant)"
        en: "Find my hero again (existing account)"
        es: "Recuperar mi héroe (cuenta existente)"

      link_account_title:
        fr: "Scelle ton pacte"
        en: "Seal your pact"
        es: "Sella tu pacto"

      link_account_google:
        fr: "Continuer avec Google"
        en: "Continue with Google"
        es: "Continuar con Google"

      # Message UNIQUE de tout sign-in Google qui n'aboutit pas — écran d'accueil comme écran
      # de liaison. Il ne dit pas « réessaie dans un instant » (l'ancien link_failed), qui était
      # un mauvais conseil : sur un compte supervisé, réessayer ne changera rien tant qu'un
      # parent n'a pas autorisé. Et il ne peut pas être plus précis — Google remonte le même
      # code pour un refus parental et pour une feuille refermée par l'enfant.
      signin_failed_parent:
        fr: "La connexion n'a pas abouti. Si un parent veille sur ce compte Google, il doit d'abord autoriser Donjons & Savons depuis Family Link. Tu pourras réessayer ensuite."
        en: "Sign-in did not go through. If a parent supervises this Google account, they must first allow Dungeons & Dusting from Family Link. You can try again afterwards."
        es: "La conexión no se completó. Si un padre supervisa esta cuenta de Google, primero debe autorizar Calabozos & Jabones desde Family Link. Después podrás intentarlo de nuevo."

      # « Je pars à l'aventure » : la session anonyme n'a pas pu s'ouvrir. Aucun compte Google
      # n'est en jeu sur cette porte — parler d'autorisation parentale ici n'aurait aucun sens.
      start_failed:
        fr: "Impossible d'ouvrir ton aventure pour l'instant. Vérifie ta connexion et réessaie."
        en: "Your adventure could not be started right now. Check your connection and try again."
        es: "No se pudo empezar tu aventura ahora mismo. Comprueba tu conexión e inténtalo de nuevo."

      # Écran de liaison, toujours visible : l'étape est bloquante mais reprenable, et un enfant
      # dont le parent n'est pas là doit savoir qu'il peut partir sans rien perdre.
      link_account_notice:
        fr: "Ta place dans le clan est déjà gardée. Si tu as besoin d'un parent pour te connecter, tu peux fermer le jeu et revenir ici plus tard."
        en: "Your place in the clan is already saved. If you need a parent to sign in, you can close the game and come back here later."
        es: "Tu lugar en el clan ya está guardado. Si necesitas a un padre para conectarte, puedes cerrar el juego y volver aquí más tarde."

      link_flush_failed:
        fr: "Impossible d'inscrire ton aventure dans les registres. Vérifie ta connexion et réessaie."
        en: "Your adventure could not be written into the records. Check your connection and try again."
        es: "No se pudo inscribir tu aventura en los registros. Comprueba tu conexión e inténtalo de nuevo."

      link_conflict_text:
        fr: "Ce compte Google est déjà lié à un autre héros. Veux-tu reprendre ce héros ? Le personnage que tu viens de créer sera abandonné."
        en: "This Google account is already linked to another hero. Do you want to take that hero back? The character you have just created will be abandoned."
        es: "Esta cuenta de Google ya está vinculada a otro héroe. ¿Quieres recuperar ese héroe? El personaje que acabas de crear será abandonado."

      link_conflict_confirm:
        fr: "Reprendre mon héros"
        en: "Take my hero back"
        es: "Recuperar mi héroe"

      link_conflict_cancel:
        fr: "Choisir un autre compte"
        en: "Pick another account"
        es: "Elegir otra cuenta"

      link_conflict_kid_blocked:
        fr: "Ce compte Google appartient déjà à un autre héros. Demande à ton chef de clan de libérer l'ancien personnage avant de recommencer."
        en: "This Google account already belongs to another hero. Ask your clan chief to free the old character before starting over."
        es: "Esta cuenta de Google ya pertenece a otro héroe. Pide a tu jefe de clan que libere al personaje antiguo antes de volver a empezar."

      # La 2e phrase n'est pas une politesse : le refus révoque l'autorisation OAuth du compte
      # (dvcloud _rollbackRejectedLogin → disconnect/revokeAccess). Un compte supervisé devra
      # donc repasser par l'accord du parent au moment de la liaison. Le taire, c'est laisser
      # croire à un bug quand la demande d'autorisation revient une seconde fois.
      link_no_account_found:
        fr: "Aucun héros n'est rattaché à ce compte Google. Si tu débutes, choisis « Je pars à l'aventure ». Si un parent veille sur ton compte, il devra autoriser le jeu à nouveau."
        en: "No hero is attached to this Google account. If you are new here, choose \"Off on my adventure\". If a parent supervises your account, they will have to allow the game again."
        es: "Ningún héroe está vinculado a esta cuenta de Google. Si empiezas, elige «Me voy de aventura». Si un padre supervisa tu cuenta, tendrá que autorizar el juego de nuevo."

      link_check_failed:
        fr: "Impossible de consulter les registres pour l'instant. Ton compte n'a pas été touché — réessaie dans un moment."
        en: "The records cannot be consulted right now. Your account has not been touched — try again in a moment."
        es: "Ahora mismo no se pueden consultar los registros. Tu cuenta no ha sido tocada: inténtalo de nuevo en un momento."

      link_rejected_close:
        fr: "Retour"
        en: "Back"
        es: "Volver"

      #------------- Region screen ------------------------------------

      region_screen_title:
        fr: "Bienvenue étranger"
        en: "Welcome stranger"
        es: "Bienvenido forastero"

      game_intro_text:
        fr: "Bienvenue dans Donjons & Savons !\nChoisis ta région pour commencer l'aventure."
        en: "Welcome to Dungeons & Dusting!\nChoose your region to start the adventure."
        es: "¡Bienvenido a Calabozos & Jabones!\nElige tu región para empezar la aventura."

      region_label:
        fr: "Choisis ton royaume !"
        en: "Choose your kingdom!"
        es: "¡Elige tu reino!"

      region_select_label:
        fr: "Consulter la carte..."
        en: "Consult the map..."
        es: "Consultar el mapa..."

      lang_label:
        fr: "Français !"
        en: "English !"
        es: "Español !"

      region_confirm:
        fr: "Je commence ici"
        en: "I start here"
        es: "Empiezo aquí"

      # Libellés des PAYS proposés à l'ouverture de session. Ils vivent ici et non
      # dans dvdocuments : le module fournit la mécanique, le catalogue juridique et
      # la clef (`country_<iso>`), mais ne sait pas qu'un pays s'appelle un
      # « royaume » chez nous. Un pays ouvert en plus, c'est une entrée de plus ici —
      # et seulement une fois son corpus légal rédigé, faute de quoi le build
      # refusera d'ouvrir son marché.
      # ⚠ `country_fr` EST LA FRANCE, pas la langue française : le suffixe est un
      #   code PAYS ISO-3166. Le jour où l'Allemagne s'ouvre, ce sera `country_de`,
      #   à traduire dans toutes nos langues — pas seulement en allemand.
      country_fr:
        fr: "Royaume de France"
        en: "Kingdom of France"
        es: "Reino de Francia"

      #------------- Age screen ------------------------------------

      age_screen_title:
        fr: "Qui es-tu, aventurier ?"
        en: "Who are you, adventurer?"
        es: "¿Quién eres, aventurero?"

      age_intro_text:
        fr: "L'aubergiste se méfie des petits avortons.\nQuand es-tu né ?"
        en: "The innkeeper is wary of little runts.\nWhen were you born?"
        es: "El tabernero desconfía de los mocosos.\n¿Cuándo naciste?"

      birthday_label:
        fr: "Ta date de naissance"
        en: "Your date of birth"
        es: "Tu fecha de nacimiento"

      confirm:
        fr: "C'est parti !"
        en: "Let's go!"
        es: "¡Vamos!"

      #------------- Player name screen ------------------------------------

      player_name_screen_title:
        fr: "L'appel de l'aventure"
        en: "The call of adventure"
        es: "El llamado de la aventura"
      player_name_label:
        fr: "Comment te nommes-tu aventurier ?"
        en: "What is your name, adventurer?"
        es: "¿Cómo te llamas, aventurero?"
      player_description_label:
        fr: "Raconte ton aventurier"
        en: "Tell us about your adventurer"
        es: "Cuenta quién es tu aventurero"
      player_name_confirm:
        fr: "En avant pour l'aventure !"
        en: "Onward to adventure!"
        es: "¡Adelante hacia la aventura!"

      #------------- Parentalgate ------------------------------------

      parentalgate_title:
        fr: "Le défi de la taverne"
        en: "The tavern challenge"
        es: "El desafío de la taberna"

      parentalgate_instruction:
        fr: "Prouve que tu es un brave,\nrésous l'énigme dans les temps !"
        en: "Prove you are brave,\nsolve the riddle in time!"
        es: "¡Demuestra que eres valiente,\nresuelve el enigma a tiempo!"

      #------------- Document-acceptance ------------------------------------

      documents_acceptance_title:
        fr: "Conditions"
        en: "Terms"
        es: "Condiciones"

      documents_checkbox_unchecked:
        fr: "☐ J'ai lu et j'accepte"
        en: "☐ I have read and accept"
        es: "☐ He leído y acepto"
      documents_checkbox_checked:
        fr: "☑ J'ai lu et j'accepte"
        en: "☑ I have read and accept"
        es: "☑ He leído y acepto"
      # Autorisation de transfert international — seconde case, affichée seulement sur un
      # marché dont le backend sort du territoire (`transfer: true` au catalogue de régions).
      # Aucun aujourd'hui : `fr` vit dans le cloud `eu`. Le libellé DIT le transfert, c'est
      # lui qui informe — une autorisation ne vaut que si elle est éclairée. Il ne nomme pas
      # le pays de destination : le corpus légal du marché le fait, et lui seul reste vrai
      # quand un marché change de datacenter.
      documents_transfer_unchecked:
        fr: "☐ J'autorise le transfert de nos données vers un serveur situé hors de mon pays, comme l'explique la politique de confidentialité"
        en: "☐ I authorise the transfer of our data to a server located outside my country, as explained in the privacy policy"
        es: "☐ Autorizo la transferencia de nuestros datos a un servidor situado fuera de mi país, tal como explica la política de privacidad"
      documents_transfer_checked:
        fr: "☑ J'autorise le transfert de nos données vers un serveur situé hors de mon pays, comme l'explique la politique de confidentialité"
        en: "☑ I authorise the transfer of our data to a server located outside my country, as explained in the privacy policy"
        es: "☑ Autorizo la transferencia de nuestros datos a un servidor situado fuera de mi país, tal como explica la política de privacidad"
      documents_accept:
        fr: "J'accepte et je continue"
        en: "I accept and continue"
        es: "Acepto y continúo"
      documents_scroll_hint:
        fr: "Faites défiler jusqu'en bas pour tout lire et accepter les conditions"
        en: "Scroll to the bottom to read everything and accept the terms"
        es: "Desplázate hasta abajo para leerlo todo y aceptar las condiciones"

      #------------- Decision tree ------------------------------------

      decisiontree_title:
        fr: "Prépare ton aventure"
        en: "Prepare your adventure"
        es: "Prepara tu aventura"
      decisiontree_intro:
        fr: "L'aubergiste a besoin de quelques infos pour préparer ta quête...\n\nCe qui se dit à la taverne reste à la taverne : tes réponses ne sont pas enregistrées, mais elles servent à améliorer ton aventure.\nTu ne le feras qu'une fois!"
        en: "The innkeeper needs a few details to prepare your quest...\n\nWhat happens in the tavern stays in the tavern: your answers aren't recorded, but they help to improve your adventure\nYou'll do only one time!"
        es: "El tabernero necesita algunos detalles para preparar tu misión...\n\nLo que pasa en la taberna, se queda en la taberna: tus respuestas no se guardan, pero ayudan a mejorar tu aventura\nLo haras solamente una vez!"
      decisiontree_start:
        fr: "Je n'ai pas peur, allons-y !"
        en: "I don't mind, let's go !"
        es: "No tengo miedo, vamos !"
      decisiontree_skip:
        fr: "Je passe"
        en: "I skip"
        es: "Salto"

      #------------- New or pick Clan ------------------------------------

      new_or_pick_clan_title:
        fr: "Choisis ton destin"
        en: "Choose your destiny"
        es: "Elige tu destino"

      join_clan:
        fr: "J'offre mes talents à un clan\n(rejoindre un clan)"
        en: "I offer my talents to a clan\n(join a clan)"
        es: "Ofrezco mis talentos a un clan\n(unirse a un clan)"
      create_clan_btn:
        fr: "Sous ma bannière, un nouveau clan s'élève !\n(Créer un clan)"
        en: "Under my banner, a new clan rises!\n(Create a clan)"
        es: "¡Bajo mi estandarte, un nuevo clan se alza!\n(Crear un clan)"

      # ⚠️ Le seul garde-fou contre le clan en double, et il est DÉFINITIF : on ne quitte pas un clan
      # une fois dedans, et le fondateur en reste chef à vie. Deux parents qui créent chacun le leur
      # coupent la famille en deux, avec deux cotisations. Le message dit donc la conséquence, et
      # surtout il indique le bon geste : le second parent ne crée rien, il rejoint et se fait
      # nommer chef — il a alors exactement les mêmes droits.
      confirm_create_clan_msg:
        fr: "Un seul clan par famille !\n\nSi un autre adulte de ton foyer a déjà créé le clan, ne crée pas le tien : rejoins le sien avec son QR code, il te nommera chef et tu auras exactement les mêmes pouvoirs.\n\nOn ne peut pas changer de clan par la suite."
        en: "One clan per family!\n\nIf another adult in your household has already created the clan, do not create yours: join theirs with their QR code and they will make you a chief, with exactly the same powers.\n\nYou cannot switch clans afterwards."
        es: "¡Un solo clan por familia!\n\nSi otro adulto de tu hogar ya ha creado el clan, no crees el tuyo: únete al suyo con su código QR y te nombrará jefe, con exactamente los mismos poderes.\n\nDespués no se puede cambiar de clan."
      # Vient EN PREMIER dans l'overlay : c'est la sortie, et elle doit se voir avant le « oui ».
      confirm_create_scan:
        fr: "Quelqu'un l'a déjà créé : je scanne son QR code"
        en: "Someone already created it: I'll scan their QR code"
        es: "Ya lo ha creado alguien: escaneo su código QR"
      confirm_create_yes:
        fr: "Personne ne l'a créé : je crée le clan de la famille"
        en: "Nobody created it: I'll create the family clan"
        es: "Nadie lo ha creado: creo el clan de la familia"
      confirm_create_no:
        fr: "Revenir"
        en: "Go back"
        es: "Volver"

      # Politique de confidentialité (option kebab Personnage → documents.open_doc?privacy)
      # Rappels de relance, vus du kebab Personnage : la MÊME bascule que celle du roster,
      # mais tournée à la première personne — ici on règle son propre cas, pas celui d'un
      # enfant. Deux clefs exclusives (perso_settings_selector n'en renvoie qu'une).
      perso_menu_nudges_off:
        fr: "Ne plus me faire signe"
        en: "Stop reaching out to me"
        es: "Dejar de avisarme"
      perso_menu_nudges_off_desc:
        fr: "Le donjon cessera de te donner de ses nouvelles quand tu ne viendras plus."
        en: "The dungeon will stop sending you news when you stop coming."
        es: "La mazmorra dejará de darte noticias cuando ya no vengas."
      perso_menu_nudges_on:
        fr: "Me refaire signe"
        en: "Reach out to me again"
        es: "Volver a avisarme"
      perso_menu_nudges_on_desc:
        fr: "Le donjon pourra de nouveau te donner de ses nouvelles."
        en: "The dungeon may send you news again."
        es: "La mazmorra podrá volver a darte noticias."
      perso_menu_privacy:
        fr: "Mes données"
        en: "My data"
        es: "Mis datos"
      perso_menu_privacy_desc:
        fr: "Lire la politique de confidentialité : ce que le jeu sait de toi, et tout ce qu'il ignore."
        en: "Read the privacy policy: what the game knows about you, and everything it does not."
        es: "Leer la política de privacidad: lo que el juego sabe de ti y todo lo que ignora."

      # Suppression de compte (option kebab Personnage + overlay d'avertissements répétés)
      perso_menu_delete:
        fr: "Supprimer mon compte"
        en: "Delete my account"
        es: "Eliminar mi cuenta"
      perso_menu_delete_desc:
        fr: "Effacer définitivement ton compte et toutes tes données."
        en: "Permanently erase your account and all your data."
        es: "Borrar definitivamente tu cuenta y todos tus datos."
      delete_account_warn1:
        fr: "Tu es sur le point de supprimer ton compte.\nEs-tu vraiment sûr ?"
        en: "You are about to delete your account.\nAre you really sure?"
        es: "Estás a punto de eliminar tu cuenta.\n¿Estás realmente seguro?"
      delete_account_warn2:
        fr: "Attention : tu vas TOUT perdre — ton personnage, tes niveaux, ton or et tes clans.\nC'est définitif et sans retour."
        en: "Careful: you will lose EVERYTHING — your character, levels, gold and clans.\nThis is final, with no way back."
        es: "Cuidado: lo perderás TODO — tu personaje, niveles, oro y clanes.\nEs definitivo y sin vuelta atrás."
      delete_account_warn3:
        fr: "Dernière chance ! Ce n'est vraiment pas une bonne idée.\nVeux-tu vraiment supprimer ton compte pour de bon ?"
        en: "Last chance! This really isn't a good idea.\nDo you truly want to delete your account for good?"
        es: "¡Última oportunidad! Esto no es una buena idea.\n¿De verdad quieres eliminar tu cuenta para siempre?"
      delete_account_continue:
        fr: "Oui, continuer"
        en: "Yes, continue"
        es: "Sí, continuar"
      delete_account_confirm:
        fr: "SUPPRIMER MON COMPTE"
        en: "DELETE MY ACCOUNT"
        es: "ELIMINAR MI CUENTA"
      delete_account_cancel:
        fr: "Non, garder mon compte"
        en: "No, keep my account"
        es: "No, conservar mi cuenta"
      delete_account_working:
        fr: "Suppression en cours…"
        en: "Deleting…"
        es: "Eliminando…"
      delete_account_error:
        fr: "Une erreur est survenue.\nRéessaie plus tard."
        en: "Something went wrong.\nPlease try again later."
        es: "Algo salió mal.\nInténtalo de nuevo más tarde."
      back_to_choice:
        fr: "← Revenir au choix"
        en: "← Back to choice"
        es: "← Volver a la elección"

      #------------- Create Clan ------------------------------------

      create_clan_screen_title:
        fr: "Naissance d'un clan"
        en: "Birth of a clan"
        es: "Nacimiento de un clan"
      create_clan_title:
        fr: "Crée ton clan"
        en: "Create your clan"
        es: "Crea tu clan"
      clan_name_label:
        fr: "Nom du clan"
        en: "Clan name"
        es: "Nombre del clan"
      clan_name_hint:
        fr: "Choisis un nom..."
        en: "Choose a name..."
        es: "Elige un nombre..."
      clan_description_label:
        fr: "Raconte la légende de ton clan"
        en: "Tell the legend of your clan"
        es: "Cuenta la leyenda de tu clan"
      clan_description_hint:
        fr: "Le soir au coin du feu, ton clan s'illustre dans quels contes ?"
        en: "By the fireside, what tales is your clan known for?"
        es: "Al calor del fuego, ¿en qué cuentos se distingue tu clan?"
      inspire_me:
        fr: "Inspire moi"
        en: "Inspire me"
        es: "Inspírame"
      replay:
        fr: "Autre chose !"
        en: "Something else!"
        es: "¡Otra cosa!"
      inspire_fallback_0_name:
        fr: "Les Gardiens du Foyer"
        en: "The Hearth Guardians"
        es: "Los Guardianes del Hogar"
      inspire_fallback_0_desc:
        fr: "Une famille unie par le serment de vaincre le chaos du quotidien. Leur force réside dans l'entraide et leur devise : 'Ensemble, rien ne résiste !'"
        en: "A family united by the oath to conquer the chaos of everyday life. Their strength lies in teamwork and their motto: 'Together, nothing can stop us!'"
        es: "Una familia unida por el juramento de vencer el caos cotidiano. Su fuerza reside en la unión y su lema: '¡Juntos, nada puede detenernos!'"
      inspire_fallback_1_name:
        fr: "Les Conquérants de l'Aube"
        en: "The Dawn Conquerors"
        es: "Los Conquistadores del Alba"
      inspire_fallback_1_desc:
        fr: "Chaque aube est une nouvelle victoire. Ce clan affronte les monstres du quotidien avec courage et détermination, car pour eux, capituler n'est pas une option."
        en: "Every dawn heralds a new victory. This clan faces the monsters of daily life with courage and relentless determination — surrendering is simply not in their nature."
        es: "Cada amanecer anuncia una nueva victoria. Este clan enfrenta los monstruos del día a día con valentía y determinación, pues rendirse no es una opción para ellos."
      inspire_fallback_2_name:
        fr: "Les Anciens de la Flamme"
        en: "The Flame Elders"
        es: "Los Antiguos de la Llama"
      inspire_fallback_2_desc:
        fr: "Gardiens d'une sagesse ancestrale, ils transmettent l'art de vaincre les tâches avec grâce et efficacité. Leur flamme ne s'éteint jamais, elle guide le clan vers la victoire."
        en: "Keepers of ancient wisdom, they pass on the art of vanquishing household beasts with grace and efficiency. Their flame never dies — it guides the clan to victory."
        es: "Guardianes de una sabiduría ancestral, transmiten el arte de vencer las tareas del hogar con gracia y eficacia. Su llama nunca se apaga, guía al clan hacia la victoria."
      # Replis statiques du bouton « Inspire moi » sur les écrans de PERSONNAGE (les
      # inspire_fallback_* ci-dessus parlent d'un clan : ils n'y conviennent pas). Servis quand
      # l'IA dépasse les 3 secondes ou refuse de répondre.
      inspire_player_fallback_0_name:
        fr: "Sasha"
        en: "Sasha"
        es: "Sasha"
      inspire_player_fallback_0_desc:
        fr: "Toujours le premier debout, jamais le dernier à rire. Rien ne lui résiste, surtout pas une pile d'assiettes."
        en: "Always the first one up, never the last to laugh. Nothing resists them, least of all a stack of plates."
        es: "Siempre el primero en levantarse, nunca el último en reír. Nada se le resiste, y menos una pila de platos."
      inspire_player_fallback_1_name:
        fr: "Camille"
        en: "Camille"
        es: "Camille"
      inspire_player_fallback_1_desc:
        fr: "Calme, patient, et redoutablement organisé. Là où les autres foncent, il range — et il gagne."
        en: "Calm, patient, and formidably organised. Where others charge in, they tidy up — and they win."
        es: "Tranquilo, paciente y temiblemente organizado. Donde otros se lanzan, ordena — y gana."
      inspire_player_fallback_2_name:
        fr: "Noa"
        en: "Noa"
        es: "Noa"
      inspire_player_fallback_2_desc:
        fr: "Petit par la taille, immense par le courage. Aucun monstre de poussière ne l'a jamais vu reculer."
        en: "Small in size, immense in courage. No dust monster has ever seen them back down."
        es: "Pequeño de tamaño, inmenso de valor. Ningún monstruo de polvo lo ha visto retroceder."

      # BANQUE DE SUBSTITUTION — repli quand l'IA échoue ou dépasse le délai. Le worker tire une
      # entrée au hasard et, pour un joueur, lui accole cinq chiffres (« Benji12312 ») ; pour un
      # clan, c'est le suffixe « -region-compteur » qui distingue déjà.
      # Elle ne retombe JAMAIS sur le nom interne : c'est ce qui remplace le défaut d'origine,
      # où le pseudonyme public valait celui que la famille voit.
      # Noms volontairement NEUTRES en genre : ce repli ne sait rien du nom d'origine, il ne
      # peut donc pas en respecter le genre — mieux vaut ne rien dire que dire le contraire.
      # Séparateur « | » (les virgules apparaissent dans les descriptions).
      substitute_bank_player_names:
        fr: "Benji|Sasha|Camille|Andrea|Charlie|Noa|Alix|Swann|Maël|Lou"
        en: "Benji|Sasha|Charlie|Alex|Robin|Jamie|Sam|Riley|Jules|Quinn"
        es: "Benji|Sasha|Alex|Cruz|Noa|Yael|Ariel|Trini|Reyes|Chris"
      substitute_bank_player_descs:
        fr: "Un aventurier discret, toujours prêt à donner un coup de main.|Un compagnon de route fiable, que rien ne décourage.|Un explorateur curieux, qui ne rentre jamais les mains vides."
        en: "A discreet adventurer, always ready to lend a hand.|A reliable companion, whom nothing discourages.|A curious explorer, who never comes home empty-handed."
        es: "Un aventurero discreto, siempre listo para echar una mano.|Un compañero de viaje fiable, al que nada desanima.|Un explorador curioso, que nunca vuelve con las manos vacías."
      substitute_bank_clan_names:
        fr: "Les Veilleurs|Les Lanternes|Le Cercle d'Argent|Les Sentinelles du Seuil|La Compagnie du Vent"
        en: "The Watchers|The Lanterns|The Silver Circle|The Threshold Sentinels|The Windward Company"
        es: "Los Vigías|Las Linternas|El Círculo de Plata|Los Centinelas del Umbral|La Compañía del Viento"
      substitute_bank_clan_descs:
        fr: "Un clan uni, qui avance sans faire de bruit.|Une compagnie soudée, fidèle à sa parole.|Une troupe joyeuse, que rien n'arrête bien longtemps."
        en: "A united clan, moving forward without a sound.|A close-knit company, true to its word.|A cheerful troop, that nothing stops for long."
        es: "Un clan unido, que avanza sin hacer ruido.|Una compañía muy unida, fiel a su palabra.|Una tropa alegre, a la que nada detiene por mucho tiempo."

      create_clan_confirm:
        fr: "Que la légende commence !"
        en: "Let the legend begin!"
        es: "¡Que comience la leyenda!"


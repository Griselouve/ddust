      # palier qu'on n'appelle pas partout pareil est un palier qu'on croit avoir
      # perdu. La couleur de donjon vit dans la description, pas dans le nom.
      #
      # ⚠ « Clan » et « Guilde » sont aussi des mots du décor générique (le clan est

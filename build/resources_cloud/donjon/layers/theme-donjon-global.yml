      #------------- Avis du mineur (kid_assent_screen) ------------
      # La question est POSÉE, et le bouton est la réponse de l'enfant — pas un « Continuer ».
      # Le texte dit d'abord ce que les parents ont fait, puis rend la main à l'enfant : c'est
      # l'ordre exact de la condition n° 3 du Decreto 1074 de 2015 (autorisation du représentant
      # légal, PUIS exercice du droit de l'enfant à être entendu). Formulations sans accord de
      # genre : l'application ne connaît pas celui du joueur.

      kid_assent_title:
        fr: "Et toi ?"
        en: "And you?"
        es: "¿Y tú?"

      kid_assent_question:
        fr: "Tes parents ont accepté que tu joues.\n\nEt toi, tu as envie de jouer ?"
        en: "Your parents have agreed to let you play.\n\nAnd you - do you want to play?"
        es: "Tus padres han aceptado que juegues.\n\nY tú, ¿tienes ganas de jugar?"

      kid_assent_go:
        fr: "Oui, je pars à l'aventure !"
        en: "Yes, I'm off on an adventure!"
        es: "¡Sí, me voy de aventura!"

      kid_assent_back:
        fr: "← Retour"
        en: "← Back"
        es: "← Volver"


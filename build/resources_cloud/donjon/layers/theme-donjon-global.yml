      rename_task_title:
        fr: "Modifier la tâche"
        en: "Edit the task"
        es: "Modificar la tarea"
      task_name_label:
        fr: "Nom de la tâche"
        en: "Task name"
        es: "Nombre de la tarea"
      task_name_hint:

      evt_changelin:
        fr: "Démasqué ! Ce n'était pas {name} mais un changelin, qui s'enfuit en ricanant. {name} et toi gagnez un peu d'expérience."
        en: "Unmasked! That wasn't {name} but a changeling, who runs off sniggering. You and {name} both earn a little experience."
        es: "¡Desenmascarado! No era {name} sino un trasgo cambiante, que huye riéndose. {name} y tú ganáis un poco de experiencia."
        de: "Entlarvt! Das war nicht {name}, sondern ein Wechselbalg, der kichernd davonläuft. {name} und du bekommt ein wenig Erfahrung."
        it: "Smascherato! Non era {name} ma un mutaforma, che scappa sghignazzando. Tu e {name} guadagnate un po' di esperienza."
        pt: "Desmascarado! Não era {name} mas um changeling, que foge a rir-se. Tu e {name} ganham um pouco de experiência."
        br: "Desmascarado! Não era {name}, e sim um changeling, que foge dando risada. Você e {name} ganham um pouco de experiência."
        nl: "Ontmaskerd! Dat was niet {name} maar een wisselkind, dat grinnikend wegrent. Jij en {name} krijgen allebei wat ervaring."
      evt_changelin_miss:
        fr: "Oups, c'était le vrai {name} ! Profitant de la confusion, le changelin s'est enfui en ricanant. Il reviendra peut-être…"
        en: "Oops, that was the real {name}! Taking advantage of the confusion, the changeling ran off sniggering. Maybe it will be back…"
        es: "¡Uy, era el verdadero {name}! Aprovechando la confusión, el trasgo cambiante huyó riéndose. Quizá vuelva…"
        de: "Hoppla, das war der echte {name}! Im Durcheinander ist der Wechselbalg kichernd entwischt. Vielleicht kommt er wieder …"
        it: "Ops, era il vero {name}! Approfittando della confusione, il mutaforma è scappato sghignazzando. Forse tornerà…"
        pt: "Ups, era o verdadeiro {name}! Aproveitando a confusão, o changeling fugiu a rir-se. Talvez volte…"
        br: "Opa, era o verdadeiro {name}! Aproveitando a confusão, o changeling fugiu dando risada. Talvez ele volte…"
        nl: "Oeps, dat was de echte {name}! Het wisselkind maakte van de verwarring gebruik en rende grinnikend weg. Misschien komt het terug…"

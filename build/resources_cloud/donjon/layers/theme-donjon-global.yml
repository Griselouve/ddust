        es: "Describe la tarea a cumplir"
      task_description_hint:
        fr: "Quel monstre affronte-t-on, et comment le vaincre ?"
        en: "What beast do we face, and how do we defeat it?"
        es: "¿Qué monstruo enfrentamos y cómo vencerlo?"
      rename_task_confirm:

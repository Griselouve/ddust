      dt_t_terrasse_01:
        fr: "Balayer la terrasse"
        en: "Sweep the terrace"
        es: "Barrer la terraza"
        de: "Terrasse fegen"
        it: "Spazzare la terrazza"
        pt: "Varrer o terraço"
        br: "Varrer o terraço"
        nl: "Terras vegen"
      dt_a_terrasse_01:
        fr: "Feuilles mortes et débris s'amassent en tas-gobelins sur la terrasse. Balaie jusqu'à un sol dégagé."
        en: "Dead leaves and debris pile into goblin-heaps on the terrace. Sweep until the floor is clear."
        es: "Hojas secas y restos se amontonan en montones-trasgo en la terraza. Barre hasta dejar el suelo despejado."
        de: "Laub und Dreck türmen sich auf der Terrasse zu Koboldhaufen. Fege, bis der Boden frei ist."
        it: "Foglie secche e detriti si ammucchiano in mucchi-goblin sulla terrazza. Spazza finché il pavimento non è sgombro."
        pt: "Folhas secas e detritos amontoam-se em montes-trasgo no terraço. Varre até o chão ficar desimpedido."
        br: "Folhas secas e detritos se amontoam em montes-trasgo no terraço. Varra até o chão ficar livre."
        nl: "Dorre bladeren en rommel stapelen zich op tot koboldhopen op het terras. Veeg tot de vloer vrij is."
      dt_d_terrasse_01:
        fr: "@@@session.user.name@@@ vient de balayer les tas-gobelins de la terrasse !"
        en: "@@@session.user.name@@@ has just swept away the goblin-heaps of the terrace!"
        es: "¡@@@session.user.name@@@ acaba de barrer los montones-trasgo de la terraza!"
        de: "@@@session.user.name@@@ hat gerade die Koboldhaufen von der Terrasse gefegt!"
        it: "@@@session.user.name@@@ ha appena spazzato via i mucchi-goblin dalla terrazza!"
        pt: "@@@session.user.name@@@ acabou de varrer os montes-trasgo do terraço!"
        br: "@@@session.user.name@@@ acabou de varrer os montes-trasgo do terraço!"
        nl: "@@@session.user.name@@@ heeft net de koboldhopen van het terras geveegd!"
      dt_c_terrasse_01:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les tas-gobelins de la terrasse, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ fought bravely against the goblin-heaps of the terrace, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra los montones-trasgo de la terraza, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat tapfer gegen die Koboldhaufen auf der Terrasse gekämpft, und die Laterne ging im dümmsten Moment aus!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro i mucchi-goblin della terrazza, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ lutou com bravura contra os montes-trasgo do terraço, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ lutou com bravura contra os montes-trasgo do terraço, e a lanterna apagou na pior hora!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de koboldhopen van het terras, en de lantaarn ging op het slechtste moment uit!"
      dt_t_terrasse_02:
        fr: "Laver la terrasse"
        en: "Wash the terrace"
        es: "Lavar la terraza"
        de: "Terrasse schrubben"
        it: "Lavare la terrazza"
        pt: "Lavar o terraço"
        br: "Lavar o terraço"
        nl: "Terras schrobben"
      dt_a_terrasse_02:
        fr: "Une croûte de crasse incrustée recouvre la terrasse. Lave à grande eau jusqu'à un sol propre."
        en: "An ingrained crust of grime coats the terrace. Wash it down until the floor is clean."
        es: "Una costra de mugre incrustada cubre la terraza. Lava con agua abundante hasta un suelo limpio."
        de: "Eine hartnäckige Schmutzkruste bedeckt die Terrasse. Spüle sie mit viel Wasser, bis der Boden sauber ist."
        it: "Una crosta di sporcizia incrostata ricopre la terrazza. Lava con tanta acqua finché il pavimento non è pulito."
        pt: "Uma crosta de sujidade entranhada cobre o terraço. Lava com muita água até o chão ficar limpo."
        br: "Uma crosta de sujeira grudada cobre o terraço. Lave com bastante água até o chão ficar limpo."
        nl: "Een vastgekoekte vuilkorst bedekt het terras. Spoel met veel water tot de vloer schoon is."
      dt_d_terrasse_02:
        fr: "@@@session.user.name@@@ vient de décaper la croûte de crasse de la terrasse !"
        en: "@@@session.user.name@@@ has just stripped the grime crust off the terrace!"
        es: "¡@@@session.user.name@@@ acaba de decapar la costra de mugre de la terraza!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzkruste von der Terrasse geschrubbt!"
        it: "@@@session.user.name@@@ ha appena scrostato la crosta di sporcizia della terrazza!"
        pt: "@@@session.user.name@@@ acabou de arrancar a crosta de sujidade do terraço!"
        br: "@@@session.user.name@@@ acabou de arrancar a crosta de sujeira do terraço!"
        nl: "@@@session.user.name@@@ heeft net de vuilkorst van het terras geschrobd!"
      dt_c_terrasse_02:
        fr: "@@@session.user.name@@@ a bravé la croûte de crasse de la terrasse sans faiblir, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ braved the grime crust of the terrace without flinching, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ desafió a la costra de mugre de la terraza sin flaquear, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ trotzte der Schmutzkruste auf der Terrasse ohne zu wanken, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha sfidato la crosta di sporcizia della terrazza senza cedere, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ desafiou a crosta de sujidade do terraço sem vacilar, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ desafiou a crosta de sujeira do terraço sem vacilar, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ trotseerde de vuilkorst van het terras zonder te wankelen, maar de vijand had een val gezet!"


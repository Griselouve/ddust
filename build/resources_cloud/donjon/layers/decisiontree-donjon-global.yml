        pt: "@@@session.user.name@@@ travou um belo combate contra os duendes dos vidros da cozinha, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ travou um belo combate contra os duendes dos vidros da cozinha, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de kabouters van de keukenramen, maar de nacht viel over de kerker voor het einde!"

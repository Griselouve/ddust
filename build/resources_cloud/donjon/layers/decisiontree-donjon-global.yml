        it: "@@@session.user.name@@@ ha caricato a testa bassa gli spettri di polvere della camera dei genitori, ma la notte è calata sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra os espectros de pó do quarto dos pais, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra os espectros de poeira do quarto dos pais, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ stormde blindelings af op de stofspoken in de ouderslaapkamer, maar de nacht viel over de kerker voor het einde!"
      dt_t_chambre_parentale_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "De vloer dweilen"
      dt_a_chambre_parentale_03:
        fr: "Des limaces de crasse traînent sur le sol de la chambre parentale. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the master bedroom floor. Mop until it shines, with no sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo del dormitorio principal. Friega hasta que brille, sin zonas pegajosas."
        de: "Schmutzschnecken kriechen über den Boden des Elternschlafzimmers. Wische, bis er glänzt, ohne klebrige Stellen."
        it: "Lumache di sporco strisciano sul pavimento della camera dei genitori. Lava finché non brilla, senza zone appiccicose."
        pt: "Lesmas de sujidade arrastam-se pelo chão do quarto dos pais. Lava até brilhar, sem zonas peganhentas."
        br: "Lesmas de sujeira se arrastam pelo chão do quarto dos pais. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken kruipen over de vloer van de ouderslaapkamer. Dweil tot hij glanst, zonder plakkerige plekken."
      dt_d_chambre_parentale_03:
        fr: "@@@session.user.name@@@ vient d'écraser les limaces de crasse de la chambre parentale !"
        en: "@@@session.user.name@@@ has just squashed the grime slugs of the master bedroom!"
        es: "¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre del dormitorio principal!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzschnecken im Elternschlafzimmer zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporco della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft net de vuilslakken in de ouderslaapkamer geplet!"
      dt_c_chambre_parentale_03:
        fr: "@@@session.user.name@@@ a chargé les limaces de crasse de la chambre parentale tête baissée, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ charged straight at the grime slugs of the master bedroom, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ cargó de frente contra las babosas de mugre del dormitorio principal, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ stürzte sich kopfüber auf die Schmutzschnecken im Elternschlafzimmer, und die Laterne gab im dümmsten Moment den Geist auf!"
        it: "@@@session.user.name@@@ ha caricato a testa bassa le lumache di sporco della camera dei genitori, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra as lesmas de sujidade do quarto dos pais, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra as lesmas de sujeira do quarto dos pais, e a lanterna se apagou na pior hora!"
        nl: "@@@session.user.name@@@ stormde blindelings af op de vuilslakken in de ouderslaapkamer, en de lantaarn gaf op het slechtste moment de geest!"
      dt_t_chambre_parentale_04:
        fr: "Nettoyer les vitres"
        en: "Clean the windows"
        es: "Limpiar las ventanas"
        de: "Fenster putzen"
        it: "Pulire i vetri"
        pt: "Limpar os vidros"
        br: "Limpar os vidros"
        nl: "Ramen lappen"
      dt_a_chambre_parentale_04:
        fr: "Des lutins de traces grasses brouillent les vitres de la chambre parentale. Nettoie jusqu'à une transparence parfaite."
        en: "Greasy-smudge imps blur the master bedroom windows. Clean until perfectly clear."
        es: "Duendes de manchas empañan las ventanas del dormitorio principal. Limpia hasta una transparencia perfecta."
        de: "Schmierwichtel trüben die Fenster des Elternschlafzimmers. Putze, bis alles perfekt durchsichtig ist."
        it: "Folletti delle ditate appannano i vetri della camera dei genitori. Pulisci fino a una trasparenza perfetta."
        pt: "Duendes das dedadas embaciam os vidros do quarto dos pais. Limpa até ficarem perfeitamente transparentes."
        br: "Duendes dos dedos sujos embaçam os vidros do quarto dos pais. Limpe até ficarem perfeitamente transparentes."
        nl: "Vetvlekkabouters maken de ramen van de ouderslaapkamer wazig. Lap tot ze perfect doorzichtig zijn."
      dt_d_chambre_parentale_04:
        fr: "@@@session.user.name@@@ vient de chasser les lutins des vitres de la chambre parentale !"
        en: "@@@session.user.name@@@ has just driven off the smudge imps from the master bedroom windows!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar a los duendes de las ventanas del dormitorio principal!"
        de: "@@@session.user.name@@@ hat gerade die Schmierwichtel von den Fenstern des Elternschlafzimmers verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de afugentar os duendes dos vidros do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de espantar os duendes dos vidros do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft net de vetvlekkabouters van de ramen van de ouderslaapkamer verjaagd!"
      dt_c_chambre_parentale_04:
        fr: "@@@session.user.name@@@ a bravé les lutins des vitres de la chambre parentale sans faiblir, et le grimoire manquait justement la bonne page !"
        en: "@@@session.user.name@@@ braved the smudge imps of the master bedroom windows without flinching, and the spellbook was missing exactly the right page!"
        es: "¡@@@session.user.name@@@ desafió a los duendes de las ventanas del dormitorio principal sin flaquear, y al grimorio le faltaba justo la página buena!"
        de: "@@@session.user.name@@@ trotzte den Schmierwichteln an den Fenstern des Elternschlafzimmers, ohne zu wanken, und im Zauberbuch fehlte ausgerechnet die richtige Seite!"
        it: "@@@session.user.name@@@ ha sfidato i folletti dei vetri della camera dei genitori senza cedere, e al grimorio mancava proprio la pagina giusta!"
        pt: "@@@session.user.name@@@ desafiou os duendes dos vidros do quarto dos pais sem vacilar, e ao grimório faltava justamente a página certa!"
        br: "@@@session.user.name@@@ desafiou os duendes dos vidros do quarto dos pais sem vacilar, e justamente a página certa faltava no grimório!"
        nl: "@@@session.user.name@@@ trotseerde de vetvlekkabouters van de ramen van de ouderslaapkamer zonder te wankelen, en in het toverboek ontbrak net de juiste bladzijde!"
      dt_t_chambre_parentale_05:
        fr: "Nettoyer le miroir"
        en: "Clean the mirror"
        es: "Limpiar el espejo"
        de: "Spiegel putzen"
        it: "Pulire lo specchio"
        pt: "Limpar o espelho"
        br: "Limpar o espelho"
        nl: "De spiegel poetsen"
      dt_a_chambre_parentale_05:
        fr: "Des reflets ternes obscurcissent le miroir de la chambre parentale. Nettoie-le jusqu'à un reflet clair et net."
        en: "Dull reflections cloud the master bedroom mirror. Clean it until the reflection is clear and sharp."
        es: "Reflejos turbios empañan el espejo del dormitorio principal. Límpialo hasta un reflejo claro y nítido."
        de: "Trübe Spiegelbilder verdunkeln den Spiegel im Elternschlafzimmer. Putze ihn, bis das Spiegelbild klar und scharf ist."
        it: "Riflessi opachi offuscano lo specchio della camera dei genitori. Puliscilo fino a un riflesso chiaro e nitido."
        pt: "Reflexos baços escurecem o espelho do quarto dos pais. Limpa-o até um reflexo claro e nítido."
        br: "Reflexos embaçados escurecem o espelho do quarto dos pais. Limpe até ter um reflexo claro e nítido."
        nl: "Doffe spiegelbeelden verduisteren de spiegel in de ouderslaapkamer. Poets hem tot het spiegelbeeld helder en scherp is."
      dt_d_chambre_parentale_05:
        fr: "@@@session.user.name@@@ vient de dissiper les reflets ternes du miroir de la chambre parentale !"
        en: "@@@session.user.name@@@ has just dispelled the dull reflections of the master bedroom mirror!"
        es: "¡@@@session.user.name@@@ acaba de disipar los reflejos turbios del espejo del dormitorio principal!"
        de: "@@@session.user.name@@@ hat gerade die trüben Spiegelbilder im Spiegel des Elternschlafzimmers vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto i riflessi opachi dello specchio della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de dissipar os reflexos baços do espelho do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de dissipar os reflexos embaçados do espelho do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft net de doffe spiegelbeelden van de spiegel in de ouderslaapkamer verdreven!"
      dt_c_chambre_parentale_05:
        fr: "@@@session.user.name@@@ a tenu bon face aux reflets ternes du miroir de la chambre parentale, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ held the line against the dull reflections of the master bedroom mirror, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a los reflejos turbios del espejo del dormitorio principal, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hielt tapfer stand gegen die trüben Spiegelbilder im Spiegel des Elternschlafzimmers, aber die Zeit reichte nicht: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha tenuto duro contro i riflessi opachi dello specchio della camera dei genitori, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ aguentou firme contra os reflexos baços do espelho do quarto dos pais, mas o tempo acabou: a aventura vai continuar!"
        br: "@@@session.user.name@@@ aguentou firme contra os reflexos embaçados do espelho do quarto dos pais, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ hield stand tegen de doffe spiegelbeelden van de spiegel in de ouderslaapkamer, maar de tijd was op: het avontuur gaat verder!"
      dt_t_chambre_parentale_06:
        fr: "Ranger"
        en: "Tidy"
        es: "Ordenar"
        de: "Aufräumen"
        it: "Riordinare"
        pt: "Arrumar"
        br: "Arrumar"
        nl: "Opruimen"
      dt_a_chambre_parentale_06:
        fr: "Les gobelins du désordre règnent sur la chambre parentale. Range chaque chose à sa place jusqu'à une pièce ordonnée."
        en: "Clutter goblins rule the master bedroom. Put everything back in its place until the room is tidy."
        es: "Los trasgos del desorden reinan en el dormitorio principal. Coloca cada cosa en su sitio hasta ordenar la habitación."
        de: "Die Chaos-Kobolde herrschen über das Elternschlafzimmer. Räume alles an seinen Platz, bis das Zimmer ordentlich ist."
        it: "I goblin del disordine regnano sulla camera dei genitori. Metti ogni cosa al suo posto finché la stanza non è in ordine."
        pt: "Os trasgos da desarrumação reinam no quarto dos pais. Arruma cada coisa no seu lugar até o quarto ficar arrumado."
        br: "Os trasgos da bagunça reinam no quarto dos pais. Coloque cada coisa no lugar até o quarto ficar arrumado."
        nl: "De rommelkobolden heersen over de ouderslaapkamer. Zet alles terug op zijn plek tot de kamer netjes is."
      dt_d_chambre_parentale_06:
        fr: "@@@session.user.name@@@ vient de mater les gobelins du désordre de la chambre parentale !"
        en: "@@@session.user.name@@@ has just subdued the clutter goblins of the master bedroom!"
        es: "¡@@@session.user.name@@@ acaba de someter a los trasgos del desorden del dormitorio principal!"
        de: "@@@session.user.name@@@ hat gerade die Chaos-Kobolde im Elternschlafzimmer gebändigt!"
        it: "@@@session.user.name@@@ ha appena domato i goblin del disordine della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de domar os trasgos da desarrumação do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de domar os trasgos da bagunça do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft net de rommelkobolden in de ouderslaapkamer getemd!"
      dt_c_chambre_parentale_06:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les gobelins du désordre de la chambre parentale, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ fought bravely against the clutter goblins of the master bedroom, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra los trasgos del desorden del dormitorio principal, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ kämpfte tapfer gegen die Chaos-Kobolde im Elternschlafzimmer, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha lottato con valore contro i goblin del disordine della camera dei genitori, ma è passato un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ lutou valentemente contra os trasgos da desarrumação do quarto dos pais, mas passou por ali um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ lutou com valentia contra os trasgos da bagunça do quarto dos pais, mas um dragão passou por ali e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de rommelkobolden in de ouderslaapkamer, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"

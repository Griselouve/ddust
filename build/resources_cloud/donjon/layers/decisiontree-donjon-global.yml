        fr: "Les acariens-vampires ont colonisé les draps de la chambre parentale. Change-les pour des draps propres et frais."
        en: "Mite-vampires have colonised the master bedroom sheets. Change them for clean, fresh sheets."
        es: "Ácaros vampiro han colonizado las sábanas del dormitorio principal. Cámbialas por sábanas limpias y frescas."
        de: "Vampirmilben haben die Bettlaken im Elternschlafzimmer besiedelt. Wechsle sie gegen saubere, frische Laken."
        it: "Gli acari-vampiro hanno colonizzato le lenzuola della camera dei genitori. Cambiale con lenzuola pulite e fresche."
        pt: "Os ácaros-vampiro colonizaram os lençóis do quarto dos pais. Muda-os por lençóis limpos e frescos."
        br: "Os ácaros-vampiro colonizaram os lençóis do quarto dos pais. Troque por lençóis limpos e cheirosos."
        nl: "Vampiermijten hebben de lakens in de ouderslaapkamer ingenomen. Vervang ze door schone, frisse lakens."

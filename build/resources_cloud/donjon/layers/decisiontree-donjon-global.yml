        de: "Die kleinen Mülleimer und Papierkörbe quellen in jedem Zimmer über. Leer sie alle, bis zum letzten."
        it: "Bidoncini e cestini traboccano in ogni stanza. Svuotali tutti, fino all'ultimo."
        pt: "Os caixotes pequenos e os cestos de papéis transbordam em cada divisão. Esvazia-os todos até ao último."
        br: "As lixeirinhas e os cestos de papel transbordam em cada cômodo. Esvazie todos até o último."
        nl: "De kleine afvalbakjes en prullenbakken puilen uit in elke kamer. Leeg ze allemaal, tot de laatste."

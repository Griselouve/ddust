      dt_t_jardin_01:
        fr: "Ramasser les feuilles mortes"
        en: "Rake up the dead leaves"
        es: "Recoger las hojas secas"
        de: "Laub rechen"
        it: "Raccogliere le foglie secche"
        pt: "Apanhar as folhas secas"
        br: "Recolher as folhas secas"
        nl: "Bladeren harken"
      dt_a_jardin_01:
        fr: "Feuilles mortes et brindilles s'amassent en tas-gobelins dans le jardin. Ramasse-les jusqu'à un sol net."
        en: "Dead leaves and twigs pile into goblin-heaps in the garden. Rake and gather them until the ground is clear."
        es: "Hojas secas y ramitas se amontonan en montones-trasgo en el jardín. Recógelas hasta un suelo despejado."
        de: "Laub und Zweige türmen sich im Garten zu Koboldhaufen. Sammle sie ein, bis der Boden frei ist."
        it: "Foglie secche e rametti si ammucchiano in mucchi-goblin nel giardino. Raccoglili finché il terreno non è sgombro."
        pt: "Folhas secas e raminhos amontoam-se em montes-trasgo no jardim. Apanha-os até o chão ficar desimpedido."
        br: "Folhas secas e galhinhos se amontoam em montes-trasgo no jardim. Recolha tudo até o chão ficar livre."
        nl: "Dorre bladeren en takjes stapelen zich op tot koboldhopen in de tuin. Hark ze bijeen tot de grond vrij is."

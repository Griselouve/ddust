        br: "@@@session.user.name@@@ enfrentou os diabinhos dos vidros do escritório, e justo a página certa estava faltando no grimório!"
        nl: "@@@session.user.name@@@ bood de vegenkabouters van de ramen van de werkkamer het hoofd, en in het toverboek ontbrak net de juiste bladzijde!"
      dt_t_bureau_05:
        fr: "Nettoyer le plan de travail"

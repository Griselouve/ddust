        pt: "@@@session.user.name@@@ cruzou espadas com as crostas da bancada do escritório, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ cruzou espadas com as crostas da bancada do escritório, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ kruiste de degens met de korsten van het werkblad van de werkkamer, en het gevecht duurde langer dan verwacht!"
      dt_t_bureau_06:
        fr: "Ranger"
        en: "Tidy"
        es: "Ordenar"
        de: "Aufräumen"
        it: "Riordinare"
        pt: "Arrumar"
        br: "Arrumar"
        nl: "Opruimen"
      dt_a_bureau_06:
        fr: "Les gobelins du désordre ont semé le chaos sur le bureau. Range papiers et objets jusqu'à un espace ordonné."
        en: "Clutter goblins have spread chaos across the office. Sort papers and objects until the space is tidy."
        es: "Los trasgos del desorden han sembrado el caos en el despacho. Ordena papeles y objetos hasta un espacio ordenado."
        de: "Chaoskobolde haben das Arbeitszimmer verwüstet. Räume Papiere und Sachen auf, bis alles ordentlich ist."
        it: "I goblin del disordine hanno seminato il caos nello studio. Riordina fogli e oggetti finché tutto non è in ordine."
        pt: "Os trasgos da desarrumação espalharam o caos no escritório. Arruma papéis e objetos até o espaço ficar arrumado."
        br: "Os trasgos da bagunça espalharam o caos no escritório. Organize papéis e objetos até o espaço ficar arrumado."
        nl: "Rommelkobolden hebben chaos gezaaid in de werkkamer. Ruim papieren en spullen op tot alles netjes is."

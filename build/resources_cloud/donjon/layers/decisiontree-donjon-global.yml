        de: "@@@session.user.name@@@ hat gerade die Schlierenwichtel von den Fenstern im Arbeitszimmer verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri dello studio!"
        pt: "@@@session.user.name@@@ acabou de expulsar os diabretes dos vidros do escritório!"

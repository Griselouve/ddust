        it: "@@@session.user.name@@@ ha appena domato i goblin del disordine della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de domar os trasgos da desarrumação do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de domar os trasgos da bagunça do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de rommelkobolden van de kinderkamer getemd!"
      dt_c_chambre_enfant_06:
        fr: "@@@session.user.name@@@ a tenu bon face aux gobelins du désordre de la chambre enfant, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ held the line against the clutter goblins of the children's bedroom, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a los trasgos del desorden de la habitación infantil, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat den Chaoskobolden im Kinderzimmer standgehalten, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha tenuto duro contro i goblin del disordine della cameretta dei bambini, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ aguentou firme contra os trasgos da desarrumação do quarto das crianças, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ aguentou firme contra os trasgos da bagunça do quarto das crianças, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ hield stand tegen de rommelkobolden van de kinderkamer, maar de vijand had een val gezet!"

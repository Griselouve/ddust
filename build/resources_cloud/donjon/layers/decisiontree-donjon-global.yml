        es: "Migas y polvo colonizan el interior del coche. Limpia el habitáculo hasta un interior impecable."
        de: "Krümel und Staub erobern das Innere des Autos. Putz den Innenraum, bis er blitzsauber ist."
        it: "Briciole e polvere colonizzano l'interno dell'auto. Pulisci l'abitacolo finché è impeccabile."
        pt: "Migalhas e pó colonizam o interior do carro. Limpa o habitáculo até ficar impecável."

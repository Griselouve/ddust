        es: "¡@@@session.user.name@@@ desafió a los duendes de pelusa del baño sin flaquear, y llegaron refuerzos del bando equivocado!"
        de: "@@@session.user.name@@@ trotzte den Wollmaus-Kobolden im WC ohne zu wanken, und Verstärkung kam von der falschen Seite!"
        it: "@@@session.user.name@@@ ha sfidato i goblin-batuffolo del gabinetto senza cedere, e sono arrivati rinforzi dalla parte sbagliata!"

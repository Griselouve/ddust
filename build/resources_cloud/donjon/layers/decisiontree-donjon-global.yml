        fr: "Les moutons-gobelins de poussière envahissent les toilettes ! Aspire ou balaie jusqu'à un sol net, recoins compris."
        en: "Dust-bunny goblins overrun the toilet! Vacuum or sweep until the floor is spotless, corners included."

        fr: "@@@session.user.name@@@ vient de dissiper les spectres de poussière de la chambre enfant !"
        en: "@@@session.user.name@@@ has just banished the dust wraiths of the children's bedroom!"
        es: "¡@@@session.user.name@@@ acaba de disipar los espectros de polvo de la habitación infantil!"
        de: "@@@session.user.name@@@ hat die Staubgespenster im Kinderzimmer gerade vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto gli spettri di polvere della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de dissipar os espectros de pó do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de dissipar os espectros de poeira do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofspoken van de kinderkamer verdreven!"
      dt_c_chambre_enfant_02:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les spectres de poussière de la chambre enfant, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ fought bravely against the dust wraiths of the children's bedroom, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra los espectros de polvo de la habitación infantil, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hat tapfer gegen die Staubgespenster im Kinderzimmer gekämpft, und der Kampf hat länger gedauert als gedacht!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro gli spettri di polvere della cameretta dei bambini, e il combattimento è durato più del previsto!"
        pt: "@@@session.user.name@@@ lutou com bravura contra os espectros de pó do quarto das crianças, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ lutou com bravura contra os espectros de poeira do quarto das crianças, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de stofspoken van de kinderkamer, en het gevecht duurde langer dan verwacht!"
      dt_t_chambre_enfant_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "Vloer dweilen"
      dt_a_chambre_enfant_03:
        fr: "Des limaces de crasse traînent sur le sol de la chambre enfant. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the children's bedroom floor. Mop until it shines, with no sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo de la habitación infantil. Friega hasta que brille, sin zonas pegajosas."
        de: "Schmutzschnecken ziehen ihre Spuren über den Boden im Kinderzimmer. Wisch, bis er glänzt und nichts mehr klebt."
        it: "Le lumache di sporco strisciano sul pavimento della cameretta dei bambini. Lava finché non brilla, senza punti appiccicosi."
        pt: "Lesmas de sujidade deixam rastos no chão do quarto das crianças. Lava até brilhar, sem zonas pegajosas."
        br: "Lesmas de sujeira deixam rastros no chão do quarto das crianças. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken laten sporen na op de vloer van de kinderkamer. Dweil tot hij glanst, zonder plakkerige plekken."

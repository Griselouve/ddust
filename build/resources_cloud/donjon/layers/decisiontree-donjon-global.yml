        br: "Lesmas de sujeira deixam rastros no chão do escritório. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken laten sporen na op de vloer van de werkkamer. Dweil tot hij glanst, zonder plakkerige plekken."

        pt: "@@@session.user.name@@@ acabou de esfregar as crostas gordurosas da bancada!"
        br: "@@@session.user.name@@@ acabou de esfregar as crostas gordurosas da bancada!"
        nl: "@@@session.user.name@@@ heeft zojuist de vetkorsten van het aanrecht geschrobd!"

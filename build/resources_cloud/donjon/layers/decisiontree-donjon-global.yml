      dt_a_bureau_03:
        fr: "Des limaces de crasse traînent sur le sol du bureau. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the office floor. Mop until it shines, with no sticky patches."

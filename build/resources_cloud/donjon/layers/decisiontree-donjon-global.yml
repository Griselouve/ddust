        pt: "Salpicos invisíveis mancham as paredes do WC. Limpa-os até as paredes ficarem impecáveis."
        br: "Respingos invisíveis mancham as paredes do lavabo. Limpe até as paredes ficarem impecáveis."
        nl: "Onzichtbare spetters bevlekken de wc-muren. Maak ze schoon tot de muren brandschoon zijn."

      dt_t_repas_06:
        fr: "Cuisiner un plat simple"
        en: "Cook a simple meal"
        es: "Cocinar un plato sencillo"
        de: "Ein einfaches Gericht kochen"
        it: "Cucinare un piatto semplice"
        pt: "Cozinhar um prato simples"
        br: "Cozinhar um prato simples"
        nl: "Een eenvoudig gerecht koken"
      dt_a_repas_06:
        fr: "La faim de la guilde gronde. Cuisine un plat simple et sers-le chaud à la tablée."
        en: "The guild's hunger growls. Cook a simple meal and serve it hot to the table."
        es: "El hambre del gremio ruge. Cocina un plato sencillo y sírvelo caliente a la mesa."
        de: "Der Hunger der Gilde knurrt. Koch ein einfaches Gericht und servier es heiß am Tisch."
        it: "La fame della gilda brontola. Cucina un piatto semplice e servilo caldo in tavola."
        pt: "A fome da guilda ronca. Cozinha um prato simples e serve-o quente à mesa."
        br: "A fome da guilda ronca. Cozinhe um prato simples e sirva quentinho à mesa."
        nl: "De honger van de gilde knort. Kook een eenvoudig gerecht en dien het warm op aan tafel."
      dt_d_repas_06:
        fr: "@@@session.user.name@@@ vient de cuisiner un plat pour rassasier la guilde !"
        en: "@@@session.user.name@@@ has just cooked a meal to feed the guild!"
        es: "¡@@@session.user.name@@@ acaba de cocinar un plato para saciar al gremio!"
        de: "@@@session.user.name@@@ hat gerade ein Gericht gekocht, um die Gilde satt zu machen!"
        it: "@@@session.user.name@@@ ha appena cucinato un piatto per sfamare la gilda!"
        pt: "@@@session.user.name@@@ acabou de cozinhar um prato para saciar a guilda!"
        br: "@@@session.user.name@@@ acabou de cozinhar um prato para matar a fome da guilda!"
        nl: "@@@session.user.name@@@ heeft zojuist een gerecht gekookt om de gilde te voeden!"
      dt_c_repas_06:
        fr: "@@@session.user.name@@@ a mis du cœur à cuisiner le plat de la guilde, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ put real heart into cooking the guild's meal, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ puso mucho empeño en cocinar el plato del gremio, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat mit ganzem Herzen das Gericht für die Gilde gekocht, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ci ha messo il cuore per cucinare il piatto della gilda, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ pôs todo o coração a cozinhar o prato da guilda, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ cozinhou o prato da guilda de todo o coração, e a lanterna se apagou antes do fim!"
        nl: "@@@session.user.name@@@ kookte met hart en ziel het gerecht van de gilde, en de lantaarn doofde voor het einde!"
      dt_t_repas_07:
        fr: "Réchauffer un plat"
        en: "Reheat a dish"
        es: "Calentar un plato"
        de: "Ein Gericht aufwärmen"
        it: "Riscaldare un piatto"
        pt: "Aquecer um prato"
        br: "Esquentar um prato"
        nl: "Een gerecht opwarmen"
      dt_a_repas_07:
        fr: "Un plat froid attend son sortilège de chaleur. Réchauffe-le et sers-le à bonne température."
        en: "A cold dish awaits its heat spell. Reheat it and serve it at the right temperature."
        es: "Un plato frío espera su hechizo de calor. Caliéntalo y sírvelo a la temperatura adecuada."
        de: "Ein kaltes Gericht wartet auf seinen Wärmezauber. Wärm es auf und servier es mit der richtigen Temperatur."
        it: "Un piatto freddo attende il suo incantesimo di calore. Riscaldalo e servilo alla giusta temperatura."
        pt: "Um prato frio espera pelo seu feitiço de calor. Aquece-o e serve-o à temperatura certa."
        br: "Um prato frio espera seu feitiço de calor. Esquente e sirva na temperatura certa."
        nl: "Een koud gerecht wacht op zijn warmtespreuk. Warm het op en dien het op de juiste temperatuur op."
      dt_d_repas_07:
        fr: "@@@session.user.name@@@ vient de réchauffer le plat d'un sortilège de chaleur !"
        en: "@@@session.user.name@@@ has just reheated the dish with a spell of warmth!"
        es: "¡@@@session.user.name@@@ acaba de calentar el plato con un hechizo de calor!"
        de: "@@@session.user.name@@@ hat das Gericht gerade mit einem Wärmezauber aufgewärmt!"
        it: "@@@session.user.name@@@ ha appena riscaldato il piatto con un incantesimo di calore!"
        pt: "@@@session.user.name@@@ acabou de aquecer o prato com um feitiço de calor!"
        br: "@@@session.user.name@@@ acabou de esquentar o prato com um feitiço de calor!"
        nl: "@@@session.user.name@@@ heeft zojuist het gerecht opgewarmd met een warmtespreuk!"
      dt_c_repas_07:
        fr: "@@@session.user.name@@@ a bataillé pour réchauffer le plat, et ce n'est pas encore tout à fait ça !"
        en: "@@@session.user.name@@@ battled away at reheating the dish, and it is not quite there yet!"
        es: "¡@@@session.user.name@@@ batalló para calentar el plato, y aún no está del todo!"
        de: "@@@session.user.name@@@ hat gekämpft, um das Gericht aufzuwärmen, und ganz fertig ist es noch nicht!"
        it: "@@@session.user.name@@@ ha lottato per riscaldare il piatto, e non è ancora proprio pronto!"
        pt: "@@@session.user.name@@@ batalhou para aquecer o prato, e ainda não está bem no ponto!"
        br: "@@@session.user.name@@@ batalhou para esquentar o prato, e ele ainda não está no ponto!"
        nl: "@@@session.user.name@@@ worstelde met het opwarmen van het gerecht, en het is nog niet helemaal goed!"
      dt_t_repas_10:

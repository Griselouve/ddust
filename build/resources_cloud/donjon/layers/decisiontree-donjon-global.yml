        pt: "Diabretes das dedadas embaciam os vidros do escritório. Limpa até ficarem perfeitamente transparentes."
        br: "Diabinhos das marcas de dedo embaçam os vidros do escritório. Limpe até ficarem perfeitamente transparentes."
        nl: "Vegenkabouters maken de ramen van de werkkamer wazig. Lap ze tot ze perfect doorzichtig zijn."

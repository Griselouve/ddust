      dt_a_chambre_enfant_04:
        fr: "Des lutins de traces grasses brouillent les vitres de la chambre enfant. Nettoie jusqu'à une transparence parfaite."
        en: "Greasy-smudge imps blur the children's bedroom windows. Clean until perfectly clear."

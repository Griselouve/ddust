        es: "¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre de la habitación infantil!"
        de: "@@@session.user.name@@@ hat die Schmutzschnecken im Kinderzimmer gerade zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporco della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de vuilslakken van de kinderkamer geplet!"
      dt_c_chambre_enfant_03:
        fr: "@@@session.user.name@@@ a tenu bon face aux limaces de crasse de la chambre enfant, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ held the line against the grime slugs of the children's bedroom, but the spell went wrong at the last moment!"

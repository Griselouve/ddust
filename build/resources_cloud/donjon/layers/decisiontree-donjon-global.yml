        br: "@@@session.user.name@@@ enfrentou as lesmas de sujeira do escritório, e chegaram reforços do lado errado!"
        nl: "@@@session.user.name@@@ bood de vuilslakken van de werkkamer het hoofd, en er kwamen versterkingen voor de verkeerde kant!"
      dt_t_bureau_04:

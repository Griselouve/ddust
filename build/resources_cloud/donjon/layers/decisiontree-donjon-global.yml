        nl: "@@@session.user.name@@@ heeft net de spetters van de wc-muren gepoetst!"
      dt_c_toilettes_06:
        fr: "@@@session.user.name@@@ a tenu bon face aux éclaboussures des murs des toilettes, mais ce n'était pas encore gagné !"
        en: "@@@session.user.name@@@ held the line against the splashes of the toilet walls, but it was not quite won yet!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a las salpicaduras de las paredes del baño, pero aún no estaba ganado!"

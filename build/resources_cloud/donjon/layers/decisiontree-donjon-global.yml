        fr: "@@@session.user.name@@@ vient de vider toutes les corbeilles de la maison !"
        en: "@@@session.user.name@@@ has just emptied every wastepaper basket in the house!"
        es: "¡@@@session.user.name@@@ acaba de vaciar todas las papeleras de la casa!"
        de: "@@@session.user.name@@@ hat gerade alle Papierkörbe im Haus geleert!"
        it: "@@@session.user.name@@@ ha appena svuotato tutti i cestini della casa!"
        pt: "@@@session.user.name@@@ acabou de esvaziar todos os cestos de papéis da casa!"
        br: "@@@session.user.name@@@ acabou de esvaziar todos os cestos de papel da casa!"
        nl: "@@@session.user.name@@@ heeft zojuist alle prullenbakken in huis geleegd!"
      dt_c_dechets_06:
        fr: "@@@session.user.name@@@ y a mis toute son énergie pour vider les corbeilles et petites poubelles, et il en restait encore un peu à la fin !"
        en: "@@@session.user.name@@@ threw every bit of energy into emptying the small bins and baskets, and a little was still left at the end!"

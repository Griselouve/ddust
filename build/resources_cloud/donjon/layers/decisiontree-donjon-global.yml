        fr: "@@@session.user.name@@@ vient de bannir les acariens-vampires des draps de la chambre parentale !"
        en: "@@@session.user.name@@@ has just banished the mite-vampires from the master bedroom sheets!"
        es: "¡@@@session.user.name@@@ acaba de desterrar a los ácaros vampiro de las sábanas del dormitorio principal!"
        de: "@@@session.user.name@@@ hat die Vampirmilben gerade aus den Laken des Elternschlafzimmers verbannt!"
        it: "@@@session.user.name@@@ ha appena bandito gli acari-vampiro dalle lenzuola della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de banir os ácaros-vampiro dos lençóis do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de banir os ácaros-vampiro dos lençóis do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft zojuist de vampiermijten uit de lakens van de ouderslaapkamer verbannen!"
      dt_c_chambre_parentale_08:
        fr: "@@@session.user.name@@@ a tenu bon face aux acariens-vampires de la chambre parentale, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ held the line against the mite-vampires of the master bedroom, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a los ácaros vampiro del dormitorio principal, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hat den Vampirmilben im Elternschlafzimmer standgehalten, und der Kampf hat länger gedauert als gedacht!"
        it: "@@@session.user.name@@@ ha tenuto duro contro gli acari-vampiro della camera dei genitori, e il combattimento è durato più del previsto!"
        pt: "@@@session.user.name@@@ aguentou firme contra os ácaros-vampiro do quarto dos pais, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ aguentou firme contra os ácaros-vampiro do quarto dos pais, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ hield stand tegen de vampiermijten van de ouderslaapkamer, en het gevecht duurde langer dan verwacht!"
      dt_t_chambre_parentale_09:
        fr: "Retourner ou aérer le matelas"

        de: "Chaoskobolde herrschen über das Kinderzimmer. Räum alles an seinen Platz, bis das Zimmer ordentlich ist."
        it: "I goblin del disordine regnano sulla cameretta dei bambini. Metti ogni cosa al suo posto finché la stanza non è in ordine."
        pt: "Os trasgos da desarrumação reinam no quarto das crianças. Põe cada coisa no seu lugar até o quarto ficar arrumado."

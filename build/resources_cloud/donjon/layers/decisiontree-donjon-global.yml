        fr: "@@@session.user.name@@@ y a mis toute son énergie pour nourrir le familier, mais la tâche a tenu bon cette fois !"
        en: "@@@session.user.name@@@ threw every bit of energy into feeding the familiar, but the task held out this time!"
        es: "¡@@@session.user.name@@@ echó toda su energía en alimentar al familiar, pero la tarea aguantó esta vez!"
        de: "@@@session.user.name@@@ hat alle Kraft hineingesteckt, das Zaubertier zu füttern, aber die Aufgabe hat diesmal standgehalten!"
        it: "@@@session.user.name@@@ ci ha messo tutta l'energia per sfamare il famiglio, ma la faccenda ha resistito, stavolta!"
        pt: "@@@session.user.name@@@ pôs toda a energia em alimentar o familiar, mas a tarefa resistiu desta vez!"
        br: "@@@session.user.name@@@ colocou toda a energia em alimentar o familiar, mas a tarefa resistiu desta vez!"
        nl: "@@@session.user.name@@@ heeft alles gegeven om het toverdier te voeren, maar de taak hield deze keer stand!"

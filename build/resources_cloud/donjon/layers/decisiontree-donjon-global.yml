        pt: "A água do familiar está turva e parada. Troca-a por água limpa e fresca."
        br: "A água do familiar está turva e parada. Troque por água limpa e fresca."
        nl: "Het water van het toverdier is troebel en muf. Ververs het met helder, fris water."

        en: "@@@session.user.name@@@ gave up against the charred crusts of the hob."
        es: "@@@session.user.name@@@ renunció ante las costras carbonizadas de la placa de cocción."
      dt_t_cuisine_13:
        fr: "Nettoyer l'intérieur du réfrigérateur"
        en: "Clean the inside of the fridge"
        es: "Limpiar el interior del frigorífico"
      dt_a_cuisine_13:
        fr: "Des créatures oubliées et des moisissures rampantes hantent l'intérieur du réfrigérateur. Vide, nettoie et désinfecte jusqu'à un frigo sain."
        en: "Forgotten creatures and creeping mould haunt the inside of the fridge. Empty, clean and disinfect until the fridge is wholesome."
        es: "Criaturas olvidadas y moho reptante acechan en el interior del frigorífico. Vacía, limpia y desinfecta hasta un frigorífico sano."
      dt_d_cuisine_13:
        fr: "@@@session.user.name@@@ vient de purger les créatures oubliées du réfrigérateur !"
        en: "@@@session.user.name@@@ has just purged the forgotten creatures of the fridge!"
        es: "¡@@@session.user.name@@@ acaba de purgar las criaturas olvidadas del frigorífico!"
      dt_c_cuisine_13:
        fr: "@@@session.user.name@@@ a battu en retraite devant les créatures oubliées du réfrigérateur."
        en: "@@@session.user.name@@@ retreated before the forgotten creatures of the fridge."
        es: "@@@session.user.name@@@ se retiró ante las criaturas olvidadas del frigorífico."
      dt_t_cuisine_15:
        fr: "Détartrer la bouilloire ou la cafetière"
        en: "Descale the kettle or coffee maker"
        es: "Descalcificar el hervidor o la cafetera"
      dt_a_cuisine_15:

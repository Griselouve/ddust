        pt: "@@@session.user.name@@@ lutou com bravura contra o monstro da sanita, mas ainda não estava ganho!"
        br: "@@@session.user.name@@@ lutou com bravura contra o monstro do vaso sanitário, mas a vitória ainda não estava garantida!"
        nl: "@@@session.user.name@@@ vocht dapper tegen het monster van de wc-pot, maar het was nog niet gewonnen!"
      dt_t_toilettes_06:
        fr: "Nettoyer les murs"
        en: "Clean the walls"
        es: "Limpiar las paredes"
        de: "Wände putzen"
        it: "Pulire i muri"
        pt: "Limpar as paredes"
        br: "Limpar as paredes"
        nl: "Muren schoonmaken"
      dt_a_toilettes_06:
        fr: "Des éclaboussures invisibles maculent les murs des toilettes. Nettoie-les jusqu'à des parois nettes."
        en: "Invisible splashes stain the toilet walls. Clean them until the walls are spotless."
        es: "Salpicaduras invisibles manchan las paredes del baño. Límpialas hasta dejar las paredes impecables."
        de: "Unsichtbare Spritzer verschmutzen die WC-Wände. Putze sie, bis die Wände blitzsauber sind."

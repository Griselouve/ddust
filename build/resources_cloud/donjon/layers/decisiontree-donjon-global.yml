        es: "El botín de la compra está esparcido por la encimera. Guarda cada artículo en su sitio, lo fresco en el frigorífico."
        de: "Die Einkaufsbeute liegt überall auf der Arbeitsplatte. Räum jeden Artikel an seinen Platz, Frisches in den Kühlschrank."
        it: "Il bottino della spesa è sparso sul piano di lavoro. Metti ogni articolo al suo posto, i freschi in frigo."
        pt: "O espólio das compras está espalhado pela bancada. Arruma cada artigo no seu lugar, os frescos no frigorífico."
        br: "O tesouro das compras está espalhado pelo balcão. Guarde cada item no seu lugar, os frescos na geladeira."
        nl: "De boodschappenbuit ligt verspreid over het aanrecht. Zet elk artikel op zijn plek, verse spullen in de koelkast."

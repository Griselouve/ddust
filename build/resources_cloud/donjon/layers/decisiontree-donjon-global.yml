        it: "@@@session.user.name@@@ ha appena compilato la lista della spesa completa!"
        pt: "@@@session.user.name@@@ acabou de fazer a lista de compras completa!"
        br: "@@@session.user.name@@@ acabou de fazer a lista de compras completa!"
        nl: "@@@session.user.name@@@ heeft zojuist het volledige boodschappenlijstje gemaakt!"

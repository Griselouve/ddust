        en: "@@@session.user.name@@@ has just dissolved the limescale golems of the kettle!"
        es: "¡@@@session.user.name@@@ acaba de disolver los gólems de cal del hervidor!"
      dt_c_cuisine_15:
        fr: "@@@session.user.name@@@ a renoncé face aux golems de tartre de la bouilloire."
        en: "@@@session.user.name@@@ gave up against the limescale golems of the kettle."
        es: "@@@session.user.name@@@ renunció ante los gólems de cal del hervidor."
      dt_t_cuisine_18:
        fr: "Détartrer la robinetterie"
        en: "Descale the taps"
        es: "Descalcificar la grifería"
      dt_a_cuisine_18:
        fr: "Des dépôts calcaires entartrent la robinetterie de la cuisine. Détartre jusqu'à une robinetterie brillante, sans trace blanche."
        en: "Limescale deposits crust the kitchen taps. Descale until the taps shine, with no white marks."
        es: "Depósitos de cal incrustan la grifería de la cocina. Descalcifica hasta una grifería brillante, sin marcas blancas."
      dt_d_cuisine_18:
        fr: "@@@session.user.name@@@ vient de briser les dépôts calcaires de la robinetterie de la cuisine !"
        en: "@@@session.user.name@@@ has just shattered the limescale deposits of the kitchen taps!"
        es: "¡@@@session.user.name@@@ acaba de romper los depósitos de cal de la grifería de la cocina!"
      dt_c_cuisine_18:
        fr: "@@@session.user.name@@@ a renoncé face aux dépôts calcaires de la robinetterie de la cuisine."
        en: "@@@session.user.name@@@ gave up against the limescale deposits of the kitchen taps."
        es: "@@@session.user.name@@@ renunció ante los depósitos de cal de la grifería de la cocina."
      dt_t_cuisine_19:
        fr: "Nettoyer l'extérieur du réfrigérateur"
        en: "Clean the outside of the fridge"
        es: "Limpiar el exterior del frigorífico"
      dt_a_cuisine_19:
        fr: "Des traces grasses ternissent l'extérieur du réfrigérateur. Nettoie portes et poignées jusqu'à une surface nette."
        en: "Greasy marks dull the outside of the fridge. Clean the doors and handles until the surface is spotless."
        es: "Marcas de grasa empañan el exterior del frigorífico. Limpia puertas y tiradores hasta una superficie impecable."
      dt_d_cuisine_19:
        fr: "@@@session.user.name@@@ vient d'effacer les traces grasses de l'extérieur du réfrigérateur !"
        en: "@@@session.user.name@@@ has just wiped away the greasy marks of the outside of the fridge!"
        es: "¡@@@session.user.name@@@ acaba de borrar las marcas de grasa del exterior del frigorífico!"
      dt_c_cuisine_19:
        fr: "@@@session.user.name@@@ a renoncé face aux traces grasses de l'extérieur du réfrigérateur."
        en: "@@@session.user.name@@@ gave up against the greasy marks of the outside of the fridge."
        es: "@@@session.user.name@@@ renunció ante las marcas de grasa del exterior del frigorífico."
      dt_t_cuisine_08:
        fr: "Vider les restes du frigo"
        en: "Clear out the fridge leftovers"
        es: "Vaciar las sobras del frigorífico"
      dt_a_cuisine_08:
        fr: "Des créatures oubliées prolifèrent au fond du frigo. Trie et vide les restes périmés jusqu'à un frigo sain."
        en: "Forgotten creatures multiply at the back of the fridge. Sort and clear out the expired leftovers until the fridge is wholesome."
        es: "Criaturas olvidadas se multiplican al fondo del frigorífico. Clasifica y retira las sobras caducadas hasta un frigorífico sano."
      dt_d_cuisine_08:
        fr: "@@@session.user.name@@@ vient de purger les restes oubliés du frigo !"
        en: "@@@session.user.name@@@ has just purged the forgotten leftovers from the fridge!"
        es: "¡@@@session.user.name@@@ acaba de purgar las sobras olvidadas del frigorífico!"
      dt_c_cuisine_08:
        fr: "@@@session.user.name@@@ a battu en retraite devant les restes oubliés du frigo."
        en: "@@@session.user.name@@@ retreated before the forgotten leftovers of the fridge."
        es: "@@@session.user.name@@@ se retiró ante las sobras olvidadas del frigorífico."

      #------------- Tâches — repas (plats) ----------------------------

      dt_t_repas_06:
        fr: "Cuisiner un plat simple"
        en: "Cook a simple meal"
        es: "Cocinar un plato sencillo"
      dt_a_repas_06:
        fr: "La faim de la guilde gronde. Cuisine un plat simple et sers-le chaud à la tablée."
        en: "The guild's hunger growls. Cook a simple meal and serve it hot to the table."
        es: "El hambre del gremio ruge. Cocina un plato sencillo y sírvelo caliente a la mesa."
      dt_d_repas_06:
        fr: "@@@session.user.name@@@ vient de cuisiner un plat pour rassasier la guilde !"
        en: "@@@session.user.name@@@ has just cooked a meal to feed the guild!"
        es: "¡@@@session.user.name@@@ acaba de cocinar un plato para saciar al gremio!"
      dt_c_repas_06:
        fr: "@@@session.user.name@@@ a renoncé à cuisiner le plat de la guilde."
        en: "@@@session.user.name@@@ gave up cooking the guild's meal."
        es: "@@@session.user.name@@@ renunció a cocinar el plato del gremio."
      dt_t_repas_07:
        fr: "Réchauffer un plat"
        en: "Reheat a dish"
        es: "Calentar un plato"
      dt_a_repas_07:
        fr: "Un plat froid attend son sortilège de chaleur. Réchauffe-le et sers-le à bonne température."
        en: "A cold dish awaits its heat spell. Reheat it and serve it at the right temperature."
        es: "Un plato frío espera su hechizo de calor. Caliéntalo y sírvelo a la temperatura adecuada."
      dt_d_repas_07:
        fr: "@@@session.user.name@@@ vient de réchauffer le plat d'un sortilège de chaleur !"
        en: "@@@session.user.name@@@ has just reheated the dish with a spell of warmth!"
        es: "¡@@@session.user.name@@@ acaba de calentar el plato con un hechizo de calor!"
      dt_c_repas_07:
        fr: "@@@session.user.name@@@ a renoncé à réchauffer le plat."
        en: "@@@session.user.name@@@ gave up reheating the dish."
        es: "@@@session.user.name@@@ renunció a calentar el plato."
      dt_t_repas_10:
        fr: "Faire un plat du quotidien"
        en: "Cook an everyday meal"
        es: "Cocinar un plato de diario"
      dt_a_repas_10:
        fr: "La faim quotidienne de la guilde réclame son dû. Prépare un plat du quotidien, sain et nourrissant, et sers-le chaud à la tablée."
        en: "The guild's daily hunger claims its due. Prepare a wholesome everyday meal and serve it hot to the table."
        es: "El hambre diaria del gremio reclama lo suyo. Prepara un plato de diario, sano y nutritivo, y sírvelo caliente a la mesa."
      dt_d_repas_10:
        fr: "@@@session.user.name@@@ vient de mitonner le plat du quotidien pour rassasier la guilde !"
        en: "@@@session.user.name@@@ has just cooked up the everyday meal to feed the guild!"
        es: "¡@@@session.user.name@@@ acaba de preparar el plato de diario para saciar al gremio!"
      dt_c_repas_10:
        fr: "@@@session.user.name@@@ a renoncé à préparer le plat du quotidien."
        en: "@@@session.user.name@@@ gave up preparing the everyday meal."
        es: "@@@session.user.name@@@ renunció a preparar el plato de diario."
      dt_t_repas_11:
        fr: "Faire un repas gastronomique"
        en: "Prepare a gourmet meal"
        es: "Preparar una comida gastronómica"
      dt_a_repas_11:
        fr: "Un festin de légende est attendu. Compose un repas gastronomique à plusieurs plats, digne d'un banquet, et dresse-le avec soin."
        en: "A legendary feast is expected. Compose a multi-course gourmet meal worthy of a banquet, and plate it with care."
        es: "Se espera un festín de leyenda. Compón una comida gastronómica de varios platos, digna de un banquete, y emplátala con esmero."
      dt_d_repas_11:
        fr: "@@@session.user.name@@@ vient de dresser un festin gastronomique digne des légendes !"
        en: "@@@session.user.name@@@ has just laid out a gourmet feast worthy of legend!"
        es: "¡@@@session.user.name@@@ acaba de servir un festín gastronómico digno de leyenda!"
      dt_c_repas_11:
        fr: "@@@session.user.name@@@ a renoncé face au festin gastronomique."
        en: "@@@session.user.name@@@ gave up on the gourmet feast."
        es: "@@@session.user.name@@@ renunció ante el festín gastronómico."

      #------------- Tâches — vaisselle --------------------------------

      dt_t_vaisselle_01:
        fr: "Faire une petite vaisselle"
        en: "Do a small washing-up"
        es: "Lavar unos pocos platos"
      dt_a_vaisselle_01:
        fr: "Une pile d'assiettes-golems crasseuses s'entasse dans l'évier. Fais la vaisselle jusqu'à ce que tout soit propre et rangé à sécher."
        en: "A stack of grimy plate-golems piles up in the sink. Do the washing-up until everything is clean and set to dry."
        es: "Una pila de platos-gólem mugrientos se amontona en el fregadero. Lava los platos hasta que todo quede limpio y puesto a secar."
      dt_d_vaisselle_01:
        fr: "@@@session.user.name@@@ vient de terrasser la pile d'assiettes-golems de l'évier !"
        en: "@@@session.user.name@@@ has just slain the stack of plate-golems in the sink!"
        es: "¡@@@session.user.name@@@ acaba de derrotar la pila de platos-gólem del fregadero!"
      dt_c_vaisselle_01:
        fr: "@@@session.user.name@@@ a battu en retraite devant la pile d'assiettes-golems de l'évier."
        en: "@@@session.user.name@@@ retreated before the stack of plate-golems in the sink."
        es: "@@@session.user.name@@@ se retiró ante la pila de platos-gólem del fregadero."
      dt_t_vaisselle_02:
        fr: "Faire une grosse vaisselle"
        en: "Do a big washing-up"
        es: "Lavar muchos platos"
      dt_a_vaisselle_02:
        fr: "Une montagne d'assiettes-golems crasseuses déborde de l'évier après le festin. Lave toute la grosse vaisselle jusqu'à ce que tout soit propre et rangé à sécher."
        en: "A mountain of grimy plate-golems overflows the sink after the feast. Tackle the whole big washing-up until everything is clean and set to dry."
        es: "Una montaña de platos-gólem mugrientos desborda el fregadero tras el festín. Lava toda la vajilla hasta que todo quede limpio y puesto a secar."
      dt_d_vaisselle_02:
        fr: "@@@session.user.name@@@ vient de terrasser la montagne d'assiettes-golems de l'évier !"
        en: "@@@session.user.name@@@ has just slain the mountain of plate-golems in the sink!"
        es: "¡@@@session.user.name@@@ acaba de derrotar la montaña de platos-gólem del fregadero!"
      dt_c_vaisselle_02:
        fr: "@@@session.user.name@@@ a battu en retraite devant la montagne d'assiettes-golems de l'évier."
        en: "@@@session.user.name@@@ retreated before the mountain of plate-golems in the sink."
        es: "@@@session.user.name@@@ se retiró ante la montaña de platos-gólem del fregadero."
      dt_t_vaisselle_03:
        fr: "Remplir le lave-vaisselle"
        en: "Load the dishwasher"
        es: "Llenar el lavavajillas"
      dt_a_vaisselle_03:
        fr: "La vaisselle sale s'amoncelle en horde devant le lave-vaisselle. Charge-le entièrement et lance le cycle."
        en: "Dirty dishes gather in a horde by the dishwasher. Load it fully and start the cycle."
        es: "Los platos sucios se reúnen en horda junto al lavavajillas. Cárgalo por completo y pon el ciclo."
      dt_d_vaisselle_03:
        fr: "@@@session.user.name@@@ vient d'enfermer la horde de vaisselle dans le lave-vaisselle !"
        en: "@@@session.user.name@@@ has just locked the horde of dishes into the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de encerrar la horda de platos en el lavavajillas!"
      dt_c_vaisselle_03:
        fr: "@@@session.user.name@@@ a renoncé devant la horde de vaisselle du lave-vaisselle."
        en: "@@@session.user.name@@@ gave up before the horde of dishes by the dishwasher."
        es: "@@@session.user.name@@@ renunció ante la horda de platos del lavavajillas."
      dt_t_vaisselle_04:
        fr: "Vider le lave-vaisselle"
        en: "Unload the dishwasher"
        es: "Vaciar el lavavajillas"
      dt_a_vaisselle_04:
        fr: "Le lave-vaisselle regorge de vaisselle propre prisonnière. Vide-le et range chaque pièce à sa place."
        en: "The dishwasher is full of trapped clean dishes. Unload it and put every piece back in its place."
        es: "El lavavajillas está lleno de vajilla limpia atrapada. Vacíalo y guarda cada pieza en su sitio."
      dt_d_vaisselle_04:
        fr: "@@@session.user.name@@@ vient de libérer la vaisselle prisonnière du lave-vaisselle !"
        en: "@@@session.user.name@@@ has just freed the trapped dishes from the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de liberar la vajilla atrapada del lavavajillas!"
      dt_c_vaisselle_04:
        fr: "@@@session.user.name@@@ a renoncé à vider le lave-vaisselle."
        en: "@@@session.user.name@@@ gave up unloading the dishwasher."
        es: "@@@session.user.name@@@ renunció a vaciar el lavavajillas."
      dt_t_vaisselle_05:
        fr: "Sécher la vaisselle"
        en: "Dry the dishes"
        es: "Secar los platos"
      dt_a_vaisselle_05:
        fr: "La vaisselle propre ruisselle encore, prisonnière d'une nuée de gouttes. Sèche chaque pièce au torchon jusqu'à ce que tout soit sec et rangé."
        en: "The clean dishes are still dripping, held captive by a swarm of droplets. Dry every piece with a cloth until everything is dry and put away."
        es: "La vajilla limpia aún chorrea, prisionera de un enjambre de gotas. Seca cada pieza con un paño hasta que todo quede seco y guardado."
      dt_d_vaisselle_05:
        fr: "@@@session.user.name@@@ vient de chasser la nuée de gouttes de la vaisselle !"
        en: "@@@session.user.name@@@ has just driven the swarm of droplets off the dishes!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar el enjambre de gotas de la vajilla!"
      dt_c_vaisselle_05:
        fr: "@@@session.user.name@@@ a renoncé à sécher la vaisselle ruisselante."
        en: "@@@session.user.name@@@ gave up drying the dripping dishes."
        es: "@@@session.user.name@@@ renunció a secar la vajilla chorreante."
      dt_t_vaisselle_06:
        fr: "Ranger la vaisselle"
        en: "Put away the dishes"
        es: "Guardar la vajilla"
      dt_a_vaisselle_06:
        fr: "La vaisselle propre et sèche s'entasse en pile branlante sur l'égouttoir. Range chaque pièce dans les placards jusqu'à un plan de travail dégagé."
        en: "The clean, dry dishes pile up in a wobbly stack on the rack. Put every piece away in the cupboards until the worktop is clear."
        es: "La vajilla limpia y seca se amontona en una pila tambaleante en el escurridor. Guarda cada pieza en los armarios hasta despejar la encimera."
      dt_d_vaisselle_06:
        fr: "@@@session.user.name@@@ vient de faire s'effondrer la pile de vaisselle dans les placards !"
        en: "@@@session.user.name@@@ has just cleared the wobbling stack of dishes into the cupboards!"
        es: "¡@@@session.user.name@@@ acaba de guardar la tambaleante pila de vajilla en los armarios!"
      dt_c_vaisselle_06:
        fr: "@@@session.user.name@@@ a renoncé à ranger la pile de vaisselle."
        en: "@@@session.user.name@@@ gave up putting away the stack of dishes."
        es: "@@@session.user.name@@@ renunció a guardar la pila de vajilla."
      dt_t_vaisselle_07:
        fr: "Mettre la table"
        en: "Set the table"
        es: "Poner la mesa"
      dt_a_vaisselle_07:
        fr: "Le festin approche et la table est nue. Dresse-la complètement : couverts, assiettes et verres pour chaque convive."
        en: "The feast is coming and the table is bare. Set it fully: cutlery, plates and glasses for every guest."
        es: "El festín se acerca y la mesa está desnuda. Ponla por completo: cubiertos, platos y vasos para cada comensal."
      dt_d_vaisselle_07:
        fr: "@@@session.user.name@@@ vient de dresser la table pour le festin !"
        en: "@@@session.user.name@@@ has just set the table for the feast!"
        es: "¡@@@session.user.name@@@ acaba de poner la mesa para el festín!"
      dt_c_vaisselle_07:
        fr: "@@@session.user.name@@@ a renoncé à dresser la table du festin."
        en: "@@@session.user.name@@@ gave up setting the table for the feast."
        es: "@@@session.user.name@@@ renunció a poner la mesa del festín."
      dt_t_vaisselle_08:
        fr: "Débarrasser la table"
        en: "Clear the table"
        es: "Quitar la mesa"
      dt_a_vaisselle_08:
        fr: "Après le festin, la table croule sous les reliefs. Débarrasse tout jusqu'à une table nette."
        en: "After the feast, the table is buried under leftovers. Clear everything until the table is bare and clean."
        es: "Tras el festín, la mesa se hunde bajo las sobras. Recógelo todo hasta dejar la mesa despejada y limpia."
      dt_d_vaisselle_08:
        fr: "@@@session.user.name@@@ vient de débarrasser la table du festin !"
        en: "@@@session.user.name@@@ has just cleared the table after the feast!"
        es: "¡@@@session.user.name@@@ acaba de recoger la mesa del festín!"
      dt_c_vaisselle_08:
        fr: "@@@session.user.name@@@ a renoncé à débarrasser la table du festin."
        en: "@@@session.user.name@@@ gave up clearing the table after the feast."
        es: "@@@session.user.name@@@ renunció a recoger la mesa del festín."
      dt_t_vaisselle_09:
        fr: "Entretenir le lave-vaisselle"
        en: "Maintain the dishwasher"
        es: "Mantener el lavavajillas"
      dt_a_vaisselle_09:
        fr: "Un golem de filtre encrassé ralentit le lave-vaisselle. Nettoie le filtre et lance un cycle à vide jusqu'à un appareil sain."
        en: "A clogged-filter golem slows the dishwasher. Clean the filter and run an empty cycle until the machine is fresh."
        es: "Un gólem de filtro atascado ralentiza el lavavajillas. Limpia el filtro y pon un ciclo en vacío hasta dejar la máquina sana."
      dt_d_vaisselle_09:
        fr: "@@@session.user.name@@@ vient de terrasser le golem de filtre du lave-vaisselle !"
        en: "@@@session.user.name@@@ has just slain the filter golem of the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de derrotar al gólem de filtro del lavavajillas!"
      dt_c_vaisselle_09:
        fr: "@@@session.user.name@@@ a renoncé face au golem de filtre du lave-vaisselle."
        en: "@@@session.user.name@@@ gave up against the filter golem of the dishwasher."
        es: "@@@session.user.name@@@ renunció ante el gólem de filtro del lavavajillas."

      #------------- Tâches — salle de bain ----------------------------

      dt_t_salle_de_bain_01:
        fr: "Aspirer ou balayer"
        en: "Vacuum or sweep"
        es: "Aspirar o barrer"
      dt_a_salle_de_bain_01:
        fr: "Les moutons-gobelins de poussière envahissent la salle de bain ! Aspire ou balaie jusqu'à un sol net, recoins compris."
        en: "Dust-bunny goblins overrun the bathroom! Vacuum or sweep until the floor is spotless, corners included."
        es: "¡Los duendes de pelusa invaden el cuarto de baño! Aspira o barre hasta dejar el suelo impecable, rincones incluidos."
      dt_d_salle_de_bain_01:
        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins de la salle de bain !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the bathroom!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa del cuarto de baño!"
      dt_c_salle_de_bain_01:
        fr: "@@@session.user.name@@@ a battu en retraite devant les moutons-gobelins de la salle de bain."

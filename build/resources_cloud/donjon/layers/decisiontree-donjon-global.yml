        fr: "@@@session.user.name@@@ vient de mater les gobelins du désordre du bureau !"
        en: "@@@session.user.name@@@ has just subdued the clutter goblins of the office!"
        es: "¡@@@session.user.name@@@ acaba de someter a los trasgos del desorden del despacho!"
        de: "@@@session.user.name@@@ hat gerade die Chaoskobolde im Arbeitszimmer gebändigt!"
        it: "@@@session.user.name@@@ ha appena domato i goblin del disordine dello studio!"
        pt: "@@@session.user.name@@@ acabou de domar os trasgos da desarrumação do escritório!"
        br: "@@@session.user.name@@@ acabou de domar os trasgos da bagunça do escritório!"
        nl: "@@@session.user.name@@@ heeft net de rommelkobolden van de werkkamer getemd!"
      dt_c_bureau_06:
        fr: "@@@session.user.name@@@ a tenu tête aux gobelins du désordre du bureau, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ stood up to the clutter goblins of the office, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ le plantó cara a los trasgos del desorden del despacho, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat den Chaoskobolden im Arbeitszimmer die Stirn geboten, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha tenuto testa ai goblin del disordine dello studio, ma è mancato il tempo: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ fez frente aos trasgos da desarrumação do escritório, mas faltou tempo: a aventura continuará!"
        br: "@@@session.user.name@@@ enfrentou os trasgos da bagunça do escritório, mas faltou tempo: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ bood de rommelkobolden van de werkkamer het hoofd, maar de tijd was op: het avontuur gaat verder!"


        br: "@@@session.user.name@@@ desafiou os duendes de fiapos do lavabo sem vacilar, e chegaram reforços do lado errado!"
        nl: "@@@session.user.name@@@ trotseerde de stofpluiskobolden van de wc zonder te wankelen, en er kwamen versterkingen voor de verkeerde kant!"
      dt_t_toilettes_02:
        fr: "Faire les poussières"
        en: "Dust"
        es: "Quitar el polvo"
        de: "Staub wischen"
        it: "Spolverare"
        pt: "Limpar o pó"
        br: "Tirar o pó"
        nl: "Afstoffen"
      dt_a_toilettes_02:
        fr: "Des spectres de poussière se posent partout dans les toilettes. Dépoussière chaque surface jusqu'à les faire disparaître."
        en: "Dust wraiths settle all over the toilet. Dust every surface until they vanish."
        es: "Espectros de polvo se posan por todo el baño. Quita el polvo de cada superficie hasta hacerlos desaparecer."
        de: "Staubgespenster lassen sich überall im WC nieder. Wische jede Fläche ab, bis sie verschwinden."
        it: "Spettri di polvere si posano ovunque nel gabinetto. Spolvera ogni superficie finché non spariscono."
        pt: "Espectros de pó pousam por todo o WC. Limpa o pó de cada superfície até desaparecerem."
        br: "Espectros de poeira pousam por todo o lavabo. Tire o pó de cada superfície até eles sumirem."
        nl: "Stofspoken strijken overal in de wc neer. Stof elk oppervlak af tot ze verdwijnen."
      dt_d_toilettes_02:
        fr: "@@@session.user.name@@@ vient de dissiper les spectres de poussière des toilettes !"
        en: "@@@session.user.name@@@ has just banished the dust wraiths of the toilet!"
        es: "¡@@@session.user.name@@@ acaba de disipar los espectros de polvo del baño!"
        de: "@@@session.user.name@@@ hat gerade die Staubgespenster im WC vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto gli spettri di polvere del gabinetto!"
        pt: "@@@session.user.name@@@ acabou de dissipar os espectros de pó do WC!"
        br: "@@@session.user.name@@@ acabou de dissipar os espectros de poeira do lavabo!"
        nl: "@@@session.user.name@@@ heeft net de stofspoken van de wc verdreven!"
      dt_c_toilettes_02:
        fr: "@@@session.user.name@@@ a tenu tête aux spectres de poussière des toilettes, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ stood up to the dust wraiths of the toilet, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ le plantó cara a los espectros de polvo del baño, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ hat den Staubgespenstern im WC die Stirn geboten, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha tenuto testa agli spettri di polvere del gabinetto, ma è passato un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ fez frente aos espectros de pó do WC, mas passou um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ enfrentou os espectros de poeira do lavabo, mas passou um dragão e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ bood de stofspoken van de wc het hoofd, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"
      dt_t_toilettes_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "Vloer dweilen"
      dt_a_toilettes_03:
        fr: "Des limaces de crasse traînent sur le sol des toilettes. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the toilet floor. Mop until it shines, with no sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo del baño. Friega hasta que brille, sin zonas pegajosas."
        de: "Schmutzschnecken ziehen Spuren über den WC-Boden. Wische, bis er glänzt, ohne klebrige Stellen."
        it: "Lumache di sporcizia strisciano sul pavimento del gabinetto. Lava finché non brilla, senza punti appiccicosi."
        pt: "Lesmas de sujidade deixam rastos no chão do WC. Lava até brilhar, sem zonas pegajosas."
        br: "Lesmas de sujeira deixam rastros no chão do lavabo. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken laten sporen na op de wc-vloer. Dweil tot hij glanst, zonder plakkerige plekken."
      dt_d_toilettes_03:
        fr: "@@@session.user.name@@@ vient d'écraser les limaces de crasse des toilettes !"
        en: "@@@session.user.name@@@ has just squashed the grime slugs of the toilet!"
        es: "¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre del baño!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzschnecken im WC zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporcizia del gabinetto!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade do WC!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira do lavabo!"
        nl: "@@@session.user.name@@@ heeft net de vuilslakken van de wc geplet!"
      dt_c_toilettes_03:
        fr: "@@@session.user.name@@@ a tenu tête aux limaces de crasse des toilettes, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ stood up to the grime slugs of the toilet, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ le plantó cara a las babosas de mugre del baño, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat den Schmutzschnecken im WC die Stirn geboten, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha tenuto testa alle lumache di sporcizia del gabinetto, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ fez frente às lesmas de sujidade do WC, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ enfrentou as lesmas de sujeira do lavabo, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ bood de vuilslakken van de wc het hoofd, maar de vijand had een val gezet!"
      dt_t_toilettes_04:
        fr: "Nettoyer la cuvette"
        en: "Clean the bowl"
        es: "Limpiar la taza del inodoro"
        de: "Kloschüssel putzen"
        it: "Pulire la tazza del water"
        pt: "Limpar a sanita"
        br: "Limpar o vaso sanitário"
        nl: "Wc-pot schoonmaken"
      dt_a_toilettes_04:
        fr: "Un monstre de tartre et de bactéries niche dans la cuvette. Récure jusqu'à une cuvette nette et désinfectée."
        en: "A monster of limescale and bacteria nests in the toilet bowl. Scrub until the bowl is clean and disinfected."
        es: "Un monstruo de cal y bacterias anida en la taza del inodoro. Frota hasta dejar la taza limpia y desinfectada."
        de: "Ein Monster aus Kalk und Bakterien nistet in der Kloschüssel. Schrubbe, bis die Schüssel sauber und desinfiziert ist."

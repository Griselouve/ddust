        de: "Schmierkobolde trüben die Fenster im Kinderzimmer. Putz, bis alles perfekt durchsichtig ist."
        it: "I folletti delle ditate appannano i vetri della cameretta dei bambini. Pulisci fino a una trasparenza perfetta."
        pt: "Duendes das dedadas embaciam os vidros do quarto das crianças. Limpa até ficarem perfeitamente transparentes."
        br: "Duendes dos dedos sujos embaçam os vidros do quarto das crianças. Limpe até ficarem perfeitamente transparentes."

        pt: "Duendes das dedadas embaciam os vidros da cozinha. Limpa até ficarem perfeitamente transparentes."
        br: "Duendes dos dedos sujos embaçam os vidros da cozinha. Limpe até ficarem perfeitamente transparentes."
        nl: "Vlekkenkabouters maken de keukenramen wazig. Lap tot ze perfect doorzichtig zijn."

        en: "The houseplants are withering with thirst. Water them all until the soil is well moistened."
        es: "Las plantas de interior se marchitan de sed. Riégalas todas hasta que la tierra quede bien húmeda."
        de: "Die Zimmerpflanzen verdursten. Gieß sie alle, bis die Erde schön feucht ist."
        it: "Le piante d'appartamento appassiscono di sete. Innaffiale tutte finché la terra è ben umida."
        pt: "As plantas de interior estão a murchar de sede. Rega-as todas até a terra ficar bem húmida."
        br: "As plantas de dentro de casa estão murchando de sede. Regue todas até a terra ficar bem úmida."
        nl: "De kamerplanten verdorren van de dorst. Geef ze allemaal water tot de aarde lekker vochtig is."

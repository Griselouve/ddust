        es: "¡@@@session.user.name@@@ acaba de ahuyentar a los duendes de las ventanas de la cocina!"
        de: "@@@session.user.name@@@ hat die Schmierkobolde gerade von den Küchenfenstern verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri della cucina!"
        pt: "@@@session.user.name@@@ acabou de afugentar os duendes dos vidros da cozinha!"
        br: "@@@session.user.name@@@ acabou de espantar os duendes dos vidros da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de kabouters van de keukenramen verjaagd!"
      dt_c_cuisine_04:
        fr: "@@@session.user.name@@@ a livré un beau combat contre les lutins des vitres de la cuisine, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ put up a fine fight against the smudge imps of the kitchen windows, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra los duendes de las ventanas de la cocina, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit den Schmierkobolden an den Küchenfenstern geliefert, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"

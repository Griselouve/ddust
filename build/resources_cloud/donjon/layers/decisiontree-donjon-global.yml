        es: "@@@session.user.name@@@ renunció a llevar la ropa a la lavandería."
      dt_t_linge_03:
        fr: "Étendre le linge"
        en: "Hang out the laundry"
        es: "Tender la ropa"
      dt_a_linge_03:
        fr: "Le linge mouillé sort du bain et risque le moisi. Étends-le entièrement pour qu'il sèche."
        en: "The wet laundry leaves the bath and risks mould. Hang it all out to dry."
        es: "La ropa mojada sale del baño y corre riesgo de moho. Tiéndela toda para que se seque."
      dt_d_linge_03:
        fr: "@@@session.user.name@@@ vient d'étendre le linge mouillé à sécher !"
        en: "@@@session.user.name@@@ has just hung out the wet laundry to dry!"
        es: "¡@@@session.user.name@@@ acaba de tender la ropa mojada para secar!"
      dt_c_linge_03:
        fr: "@@@session.user.name@@@ a renoncé à étendre le linge mouillé."
        en: "@@@session.user.name@@@ gave up hanging out the wet laundry."
        es: "@@@session.user.name@@@ renunció a tender la ropa mojada."
      dt_t_linge_04:
        fr: "Ramasser le linge sec"
        en: "Collect the dry laundry"
        es: "Recoger la ropa seca"
      dt_a_linge_04:
        fr: "Le linge sec attend sur le fil. Ramasse-le entièrement avant qu'il ne reprenne la poussière."
        en: "The dry laundry waits on the line. Collect it all before it gathers dust again."
        es: "La ropa seca espera en el tendedero. Recógela toda antes de que vuelva a coger polvo."
      dt_d_linge_04:
        fr: "@@@session.user.name@@@ vient de ramasser le linge sec du fil !"
        en: "@@@session.user.name@@@ has just collected the dry laundry from the line!"
        es: "¡@@@session.user.name@@@ acaba de recoger la ropa seca del tendedero!"
      dt_c_linge_04:
        fr: "@@@session.user.name@@@ a renoncé à ramasser le linge sec."
        en: "@@@session.user.name@@@ gave up collecting the dry laundry."
        es: "@@@session.user.name@@@ renunció a recoger la ropa seca."
      dt_t_linge_05:
        fr: "Plier le linge"
        en: "Fold the laundry"
        es: "Doblar la ropa"
      dt_a_linge_05:
        fr: "Le linge sec s'entasse en monticule chaotique. Plie chaque pièce jusqu'à des piles nettes."
        en: "The dry laundry piles into a chaotic mound. Fold every piece into neat stacks."
        es: "La ropa seca se amontona en un montón caótico. Dobla cada prenda en pilas ordenadas."
      dt_d_linge_05:
        fr: "@@@session.user.name@@@ vient de plier le monticule de linge sec !"
        en: "@@@session.user.name@@@ has just folded the mound of dry laundry!"
        es: "¡@@@session.user.name@@@ acaba de doblar el montón de ropa seca!"
      dt_c_linge_05:
        fr: "@@@session.user.name@@@ a renoncé à plier le linge sec."
        en: "@@@session.user.name@@@ gave up folding the dry laundry."
        es: "@@@session.user.name@@@ renunció a doblar la ropa seca."
      dt_t_linge_06:
        fr: "Ranger le linge"
        en: "Put away the laundry"
        es: "Guardar la ropa"
      dt_a_linge_06:
        fr: "Le linge plié attend d'être mis à l'abri. Range chaque pile dans son armoire ou tiroir."
        en: "The folded laundry waits to be stored. Put every stack away in its wardrobe or drawer."
        es: "La ropa doblada espera ser guardada. Coloca cada pila en su armario o cajón."
      dt_d_linge_06:
        fr: "@@@session.user.name@@@ vient de ranger tout le linge plié !"
        en: "@@@session.user.name@@@ has just put away all the folded laundry!"
        es: "¡@@@session.user.name@@@ acaba de guardar toda la ropa doblada!"
      dt_c_linge_06:
        fr: "@@@session.user.name@@@ a renoncé à ranger le linge plié."
        en: "@@@session.user.name@@@ gave up putting away the folded laundry."
        es: "@@@session.user.name@@@ renunció a guardar la ropa doblada."
      dt_t_linge_08:
        fr: "Repasser le linge"
        en: "Iron the laundry"
        es: "Planchar la ropa"
      dt_a_linge_08:
        fr: "Des plis-gremlins froissent le linge propre. Repasse jusqu'à un linge lisse et net."
        en: "Wrinkle-gremlins crease the clean laundry. Iron until the clothes are smooth and crisp."
        es: "Gremlins de arrugas estrujan la ropa limpia. Plancha hasta dejar la ropa lisa y nítida."
      dt_d_linge_08:
        fr: "@@@session.user.name@@@ vient d'écraser les plis-gremlins du linge !"
        en: "@@@session.user.name@@@ has just flattened the wrinkle-gremlins of the laundry!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los gremlins de arrugas de la ropa!"
      dt_c_linge_08:
        fr: "@@@session.user.name@@@ a renoncé face aux plis-gremlins du linge."
        en: "@@@session.user.name@@@ gave up against the wrinkle-gremlins of the laundry."
        es: "@@@session.user.name@@@ renunció ante los gremlins de arrugas de la ropa."
      dt_t_linge_09:
        fr: "Entretenir la machine à laver (joint, bac, cycle à vide)"
        en: "Maintain the washing machine (seal, tray, empty cycle)"
        es: "Mantener la lavadora (junta, cajón, ciclo en vacío)"
      dt_a_linge_09:
        fr: "Un golem de moisi s'installe dans le joint et le bac de la machine à laver. Nettoie et lance un cycle à vide."
        en: "A mould-golem settles in the seal and tray of the washing machine. Clean them and run an empty cycle."
        es: "Un gólem de moho se instala en la junta y el cajón de la lavadora. Límpialos y pon un ciclo en vacío."
      dt_d_linge_09:
        fr: "@@@session.user.name@@@ vient de purger le golem de moisi de la machine à laver !"
        en: "@@@session.user.name@@@ has just purged the mould-golem of the washing machine!"
        es: "¡@@@session.user.name@@@ acaba de purgar al gólem de moho de la lavadora!"
      dt_c_linge_09:
        fr: "@@@session.user.name@@@ a renoncé face au golem de moisi de la machine à laver."
        en: "@@@session.user.name@@@ gave up against the mould-golem of the washing machine."
        es: "@@@session.user.name@@@ renunció ante el gólem de moho de la lavadora."

      #------------- Tâches — déchets ----------------------------------

      dt_t_dechets_01:
        fr: "Sortir les poubelles"
        en: "Take out the bins"
        es: "Sacar la basura"
      dt_a_dechets_01:
        fr: "Les nauséabonds blob-ordures contaminent la maison ! Sors les poubelles et remets un sac neuf. Attention aux petits déchets qu'ils laissent derrière, ce sont des pièges."
        en: "The stinking garbage blobs are contaminating the house! Take out the bins and fit a new bag. Beware the little scraps they leave behind, they are traps."
        es: "¡Los apestosos blobs de basura contaminan la casa! Saca la basura y pon una bolsa nueva. Cuidado con los pequeños restos que dejan, son trampas."
      dt_d_dechets_01:
        fr: "@@@session.user.name@@@ vient d'éliminer les blob-ordures de la maison !"
        en: "@@@session.user.name@@@ has just wiped out the garbage blobs of the house!"
        es: "¡@@@session.user.name@@@ acaba de eliminar los blobs de basura de la casa!"
      dt_c_dechets_01:
        fr: "@@@session.user.name@@@ a dû sonner la retraite devant la puanteur extrême des blob-ordures."
        en: "@@@session.user.name@@@ had to sound the retreat before the foul stench of the garbage blobs."
        es: "@@@session.user.name@@@ tuvo que tocar retirada ante el hedor extremo de los blobs de basura."
      dt_t_dechets_02:
        fr: "Changer les sacs poubelle"
        en: "Change the bin bags"
        es: "Cambiar las bolsas de basura"
      dt_a_dechets_02:
        fr: "Les sacs pleins débordent et nourrissent les blob-ordures. Remplace-les par des sacs neufs bien fermés."
        en: "The full bags overflow and feed the garbage blobs. Replace them with fresh, well-tied bags."
        es: "Las bolsas llenas rebosan y alimentan a los blobs de basura. Sustitúyelas por bolsas nuevas bien cerradas."
      dt_d_dechets_02:
        fr: "@@@session.user.name@@@ vient de couper les vivres aux blob-ordures en changeant les sacs !"
        en: "@@@session.user.name@@@ has just starved the garbage blobs by changing the bags!"
        es: "¡@@@session.user.name@@@ acaba de cortar el suministro a los blobs de basura cambiando las bolsas!"
      dt_c_dechets_02:
        fr: "@@@session.user.name@@@ a renoncé à changer les sacs poubelle."
        en: "@@@session.user.name@@@ gave up changing the bin bags."
        es: "@@@session.user.name@@@ renunció a cambiar las bolsas de basura."
      dt_t_dechets_03:
        fr: "Trier les déchets"
        en: "Sort the recycling"
        es: "Separar los residuos"
      dt_a_dechets_03:
        fr: "Les déchets s'amassent en un magma indistinct. Trie-les par bac de recyclage jusqu'au dernier."
        en: "The waste gathers into an indistinct magma. Sort it into the right recycling bins, down to the last item."
        es: "Los residuos se acumulan en un magma indistinto. Sepáralos en los contenedores de reciclaje hasta el último."
      dt_d_dechets_03:
        fr: "@@@session.user.name@@@ vient de trier le magma de déchets !"
        en: "@@@session.user.name@@@ has just sorted the magma of waste!"
        es: "¡@@@session.user.name@@@ acaba de separar el magma de residuos!"
      dt_c_dechets_03:
        fr: "@@@session.user.name@@@ a renoncé à trier le magma de déchets."
        en: "@@@session.user.name@@@ gave up sorting the magma of waste."
        es: "@@@session.user.name@@@ renunció a separar el magma de residuos."
      dt_t_dechets_04:
        fr: "Descendre le verre ou le recyclage au point de collecte"
        en: "Take glass or recycling to the collection point"
        es: "Bajar el vidrio o el reciclaje al punto de recogida"
      dt_a_dechets_04:
        fr: "Verre et recyclage s'accumulent en pile branlante. Descends-les au point de collecte et vide tout."
        en: "Glass and recycling stack into a wobbling pile. Take them to the collection point and empty everything."
        es: "Vidrio y reciclaje se apilan en un montón tambaleante. Bájalos al punto de recogida y vacíalo todo."
      dt_d_dechets_04:
        fr: "@@@session.user.name@@@ vient de porter le verre et le recyclage au point de collecte !"
        en: "@@@session.user.name@@@ has just hauled the glass and recycling to the collection point!"
        es: "¡@@@session.user.name@@@ acaba de llevar el vidrio y el reciclaje al punto de recogida!"
      dt_c_dechets_04:
        fr: "@@@session.user.name@@@ a renoncé à descendre le verre et le recyclage."
        en: "@@@session.user.name@@@ gave up taking the glass and recycling down."
        es: "@@@session.user.name@@@ renunció a bajar el vidrio y el reciclaje."
      dt_t_dechets_05:
        fr: "Vider les bio-déchets dans le composteur"
        en: "Empty food waste into the compost bin"
        es: "Vaciar los residuos orgánicos en el compostador"
      dt_a_dechets_05:
        fr: "Les bio-déchets fermentent et attirent les mouches-lutins. Vide-les dans le composteur et referme bien."
        en: "The food waste ferments and draws fly-imps. Empty it into the compost bin and close it tight."
        es: "Los residuos orgánicos fermentan y atraen a los duendes-mosca. Vacíalos en el compostador y ciérralo bien."
      dt_d_dechets_05:
        fr: "@@@session.user.name@@@ vient de vider les bio-déchets dans le composteur !"
        en: "@@@session.user.name@@@ has just emptied the food waste into the compost bin!"
        es: "¡@@@session.user.name@@@ acaba de vaciar los residuos orgánicos en el compostador!"
      dt_c_dechets_05:
        fr: "@@@session.user.name@@@ a renoncé à vider les bio-déchets dans le composteur."
        en: "@@@session.user.name@@@ gave up emptying the food waste into the compost bin."
        es: "@@@session.user.name@@@ renunció a vaciar los residuos orgánicos en el compostador."
      dt_t_dechets_06:
        fr: "Vider les corbeilles et petites poubelles"
        en: "Empty the small bins and wastepaper baskets"
        es: "Vaciar las papeleras y cubos pequeños"
      dt_a_dechets_06:
        fr: "Les petites poubelles et corbeilles débordent dans chaque pièce. Vide-les toutes jusqu'à la dernière."
        en: "The small bins and wastepaper baskets overflow in every room. Empty them all, down to the last one."
        es: "Las papeleras y cubos pequeños rebosan en cada habitación. Vacíalos todos hasta el último."
      dt_d_dechets_06:
        fr: "@@@session.user.name@@@ vient de vider toutes les corbeilles de la maison !"
        en: "@@@session.user.name@@@ has just emptied every wastepaper basket in the house!"
        es: "¡@@@session.user.name@@@ acaba de vaciar todas las papeleras de la casa!"
      dt_c_dechets_06:
        fr: "@@@session.user.name@@@ a renoncé à vider les corbeilles et petites poubelles."
        en: "@@@session.user.name@@@ gave up emptying the small bins and baskets."
        es: "@@@session.user.name@@@ renunció a vaciar las papeleras y cubos pequeños."
      dt_t_dechets_07:
        fr: "Nettoyer la poubelle"
        en: "Clean the bin"
        es: "Limpiar el cubo de basura"
      dt_a_dechets_07:
        fr: "Les blob-ordures suintent dans la poubelle de cuisine. Vide, lave et désinfecte jusqu'à une poubelle propre et sans odeur."
        en: "Garbage blobs ooze in the kitchen bin. Empty, wash and disinfect until the bin is clean and odourless."
        es: "Los blobs de basura rezuman en el cubo de la cocina. Vacía, lava y desinfecta hasta un cubo limpio y sin olor."
      dt_d_dechets_07:
        fr: "@@@session.user.name@@@ vient de dissoudre les blob-ordures de la poubelle de cuisine !"
        en: "@@@session.user.name@@@ has just dissolved the garbage blobs of the kitchen bin!"
        es: "¡@@@session.user.name@@@ acaba de disolver los blobs de basura del cubo de la cocina!"
      dt_c_dechets_07:
        fr: "@@@session.user.name@@@ a battu en retraite devant les blob-ordures de la poubelle de cuisine."
        en: "@@@session.user.name@@@ retreated before the garbage blobs of the kitchen bin."
        es: "@@@session.user.name@@@ se retiró ante los blobs de basura del cubo de la cocina."

      #------------- Tâches — animaux ----------------------------------

      dt_t_animaux_01:
        fr: "Nourrir la bête"
        en: "Feed the beast"
        es: "Alimentar a la bestia"
      dt_a_animaux_01:
        fr: "Le familier de la maisonnée a faim et réclame sa pitance. Nourris-le avec la juste ration."
        en: "The household familiar is hungry and demands its meal. Feed it the right portion."
        es: "El familiar de la casa tiene hambre y reclama su comida. Dale la ración adecuada."
      dt_d_animaux_01:
        fr: "@@@session.user.name@@@ vient de nourrir le familier affamé !"
        en: "@@@session.user.name@@@ has just fed the hungry familiar!"
        es: "¡@@@session.user.name@@@ acaba de alimentar al familiar hambriento!"
      dt_c_animaux_01:
        fr: "@@@session.user.name@@@ a renoncé à nourrir le familier."
        en: "@@@session.user.name@@@ gave up feeding the familiar."
        es: "@@@session.user.name@@@ renunció a alimentar al familiar."
      dt_t_animaux_02:
        fr: "Changer l'eau de la bête"
        en: "Change the beast's water"
        es: "Cambiar el agua de la bestia"
      dt_a_animaux_02:
        fr: "L'eau du familier est trouble et croupie. Change-la pour une eau claire et fraîche."
        en: "The familiar's water is cloudy and stale. Change it for clean, fresh water."
        es: "El agua del familiar está turbia y estancada. Cámbiala por agua limpia y fresca."
      dt_d_animaux_02:
        fr: "@@@session.user.name@@@ vient de renouveler l'eau du familier !"
        en: "@@@session.user.name@@@ has just refreshed the familiar's water!"
        es: "¡@@@session.user.name@@@ acaba de renovar el agua del familiar!"
      dt_c_animaux_02:
        fr: "@@@session.user.name@@@ a renoncé à changer l'eau du familier."
        en: "@@@session.user.name@@@ gave up changing the familiar's water."
        es: "@@@session.user.name@@@ renunció a cambiar el agua del familiar."
      dt_t_animaux_03:
        fr: "Nettoyer l'antre de la bête"
        en: "Clean the beast's lair"
        es: "Limpiar la guarida de la bestia"
      dt_a_animaux_03:
        fr: "La litière, la cage ou l'aquarium du familier vire au repaire nauséabond. Nettoie jusqu'à un espace sain."
        en: "The familiar's litter box, cage or aquarium is turning into a foul lair. Clean it until the space is wholesome."
        es: "El arenero, la jaula o el acuario del familiar se vuelve una guarida apestosa. Limpia hasta un espacio sano."
      dt_d_animaux_03:
        fr: "@@@session.user.name@@@ vient d'assainir le repaire du familier !"
        en: "@@@session.user.name@@@ has just cleansed the familiar's lair!"
        es: "¡@@@session.user.name@@@ acaba de sanear la guarida del familiar!"
      dt_c_animaux_03:
        fr: "@@@session.user.name@@@ a battu en retraite devant le repaire nauséabond du familier."
        en: "@@@session.user.name@@@ retreated before the foul lair of the familiar."
        es: "@@@session.user.name@@@ se retiró ante la guarida apestosa del familiar."
      dt_t_animaux_05:
        fr: "Nettoyer ou brosser les poils de la bête"
        en: "Clean or brush the beast's fur"
        es: "Limpiar o cepillar el pelo de la bestia"
      dt_a_animaux_05:
        fr: "Le pelage du familier s'emmêle en nœuds-lutins. Brosse ou nettoie jusqu'à un poil net et démêlé."
        en: "The familiar's coat tangles into knot-imps. Brush or clean until the fur is clean and untangled."
        es: "El pelaje del familiar se enreda en duendes-nudo. Cepilla o limpia hasta un pelo limpio y desenredado."
      dt_d_animaux_05:
        fr: "@@@session.user.name@@@ vient de démêler les nœuds-lutins du familier !"
        en: "@@@session.user.name@@@ has just untangled the knot-imps of the familiar!"
        es: "¡@@@session.user.name@@@ acaba de desenredar los duendes-nudo del familiar!"
      dt_c_animaux_05:
        fr: "@@@session.user.name@@@ a renoncé à brosser le familier."
        en: "@@@session.user.name@@@ gave up brushing the familiar."
        es: "@@@session.user.name@@@ renunció a cepillar al familiar."

      #------------- Tâches — voiture ----------------------------------

      dt_t_voiture_01:
        fr: "Nettoyer l'intérieur de la voiture"
        en: "Clean the inside of the car"
        es: "Limpiar el interior del coche"
      dt_a_voiture_01:
        fr: "Miettes et poussières colonisent l'intérieur de la voiture. Nettoie l'habitacle jusqu'à un intérieur net."
        en: "Crumbs and dust colonise the inside of the car. Clean the cabin until the interior is spotless."
        es: "Migas y polvo colonizan el interior del coche. Limpia el habitáculo hasta un interior impecable."
      dt_d_voiture_01:
        fr: "@@@session.user.name@@@ vient de nettoyer l'intérieur de la voiture !"
        en: "@@@session.user.name@@@ has just cleaned the inside of the car!"
        es: "¡@@@session.user.name@@@ acaba de limpiar el interior del coche!"
      dt_c_voiture_01:
        fr: "@@@session.user.name@@@ a renoncé à nettoyer l'intérieur de la voiture."
        en: "@@@session.user.name@@@ gave up cleaning the inside of the car."
        es: "@@@session.user.name@@@ renunció a limpiar el interior del coche."
      dt_t_voiture_02:
        fr: "Nettoyer l'extérieur de la voiture"
        en: "Clean the outside of the car"
        es: "Limpiar el exterior del coche"
      dt_a_voiture_02:
        fr: "Une croûte de crasse et d'insectes recouvre la carrosserie. Lave l'extérieur de la voiture jusqu'à une carrosserie brillante."
        en: "A crust of grime and insects coats the bodywork. Wash the outside of the car until the bodywork shines."
        es: "Una costra de mugre e insectos cubre la carrocería. Lava el exterior del coche hasta una carrocería brillante."
      dt_d_voiture_02:
        fr: "@@@session.user.name@@@ vient de décaper la croûte de crasse de la voiture !"
        en: "@@@session.user.name@@@ has just stripped the grime crust off the car!"
        es: "¡@@@session.user.name@@@ acaba de decapar la costra de mugre del coche!"
      dt_c_voiture_02:
        fr: "@@@session.user.name@@@ a renoncé à laver l'extérieur de la voiture."

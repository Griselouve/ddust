        es: "¡@@@session.user.name@@@ acaba de borrar las salpicaduras de las paredes del baño!"
        de: "@@@session.user.name@@@ hat gerade die Spritzer von den WC-Wänden gewischt!"
        it: "@@@session.user.name@@@ ha appena cancellato gli schizzi dai muri del gabinetto!"
        pt: "@@@session.user.name@@@ acabou de apagar os salpicos das paredes do WC!"

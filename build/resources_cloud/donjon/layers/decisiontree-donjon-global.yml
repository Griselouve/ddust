        br: "@@@session.user.name@@@ aguentou firme contra as crostas gordurosas da bancada, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ hield stand tegen de vetkorsten van het aanrecht, maar de spreuk mislukte op het laatste moment!"

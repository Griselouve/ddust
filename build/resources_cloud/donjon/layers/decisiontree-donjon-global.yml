        es: "Gólems de cal y depósitos viscosos atascan el fregadero. Frota hasta dejar el fregadero limpio y brillante."
        de: "Kalk-Golems und schleimige Ablagerungen verstopfen die Spüle. Schrubb, bis die Spüle sauber ist und glänzt."
        it: "Golem di calcare e depositi viscidi intasano il lavello. Strofina finché il lavello non è pulito e brillante."
        pt: "Golems de calcário e depósitos viscosos entopem o lava-loiça. Esfrega até o lava-loiça ficar limpo e brilhante."
        br: "Golems de calcário e depósitos viscosos entopem a pia. Esfregue até a pia ficar limpa e brilhante."
        nl: "Kalkgolems en slijmerige aanslag verstoppen de gootsteen. Schrob tot de gootsteen schoon is en glanst."
      dt_d_cuisine_06:
        fr: "@@@session.user.name@@@ vient de briser les golems de calcaire de l'évier !"
        en: "@@@session.user.name@@@ has just shattered the limescale golems of the sink!"
        es: "¡@@@session.user.name@@@ acaba de romper los gólems de cal del fregadero!"
        de: "@@@session.user.name@@@ hat die Kalk-Golems der Spüle gerade zerschmettert!"
        it: "@@@session.user.name@@@ ha appena frantumato i golem di calcare del lavello!"
        pt: "@@@session.user.name@@@ acabou de despedaçar os golems de calcário do lava-loiça!"
        br: "@@@session.user.name@@@ acabou de despedaçar os golems de calcário da pia!"
        nl: "@@@session.user.name@@@ heeft zojuist de kalkgolems van de gootsteen verbrijzeld!"
      dt_c_cuisine_06:
        fr: "@@@session.user.name@@@ a tenu bon face aux golems de calcaire de l'évier, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ held the line against the limescale golems of the sink, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a los gólems de cal del fregadero, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat den Kalk-Golems der Spüle standgehalten, und die Laterne ist im ungünstigsten Moment ausgegangen!"
        it: "@@@session.user.name@@@ ha tenuto duro contro i golem di calcare del lavello, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ aguentou firme contra os golems de calcário do lava-loiça, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ aguentou firme contra os golems de calcário da pia, e a lanterna se apagou na pior hora!"
        nl: "@@@session.user.name@@@ hield stand tegen de kalkgolems van de gootsteen, en de lantaarn doofde op het slechtste moment!"
      dt_t_cuisine_07:
        fr: "Nettoyer les placards"
        en: "Clean the cupboards"
        es: "Limpiar los armarios"
        de: "Schränke putzen"
        it: "Pulire i pensili"
        pt: "Limpar os armários"
        br: "Limpar os armários"
        nl: "Kastjes schoonmaken"
      dt_a_cuisine_07:
        fr: "Des traces grasses maculent les placards de la cuisine. Nettoie portes et poignées jusqu'à des façades nettes."
        en: "Greasy marks stain the kitchen cupboards. Clean the doors and handles until the fronts are spotless."
        es: "Marcas de grasa manchan los armarios de la cocina. Limpia puertas y tiradores hasta dejar los frentes impecables."
        de: "Fettflecken verschmutzen die Küchenschränke. Putz Türen und Griffe, bis die Fronten blitzsauber sind."
        it: "Macchie di unto sporcano i pensili della cucina. Pulisci ante e maniglie finché non sono perfettamente pulite."
        pt: "Manchas de gordura sujam os armários da cozinha. Limpa portas e puxadores até as frentes ficarem impecáveis."
        br: "Manchas de gordura sujam os armários da cozinha. Limpe portas e puxadores até as frentes ficarem impecáveis."
        nl: "Vetvlekken bevuilen de keukenkastjes. Maak deurtjes en handgrepen schoon tot de fronten smetteloos zijn."
      dt_d_cuisine_07:
        fr: "@@@session.user.name@@@ vient d'effacer les traces grasses des placards de la cuisine !"
        en: "@@@session.user.name@@@ has just wiped away the greasy marks of the kitchen cupboards!"
        es: "¡@@@session.user.name@@@ acaba de borrar las marcas de grasa de los armarios de la cocina!"
        de: "@@@session.user.name@@@ hat die Fettflecken gerade von den Küchenschränken gewischt!"
        it: "@@@session.user.name@@@ ha appena cancellato le macchie di unto dai pensili della cucina!"
        pt: "@@@session.user.name@@@ acabou de apagar as manchas de gordura dos armários da cozinha!"
        br: "@@@session.user.name@@@ acabou de apagar as manchas de gordura dos armários da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de vetvlekken van de keukenkastjes geveegd!"
      dt_c_cuisine_07:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les traces grasses des placards de la cuisine, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ fought bravely against the greasy marks of the kitchen cupboards, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra las marcas de grasa de los armarios de la cocina, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat tapfer gegen die Fettflecken der Küchenschränke gekämpft, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro le macchie di unto dei pensili della cucina, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ lutou com bravura contra as manchas de gordura dos armários da cozinha, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ lutou com bravura contra as manchas de gordura dos armários da cozinha, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de vetvlekken van de keukenkastjes, maar de nacht viel over de kerker voor het einde!"
      dt_t_cuisine_09:
        fr: "Nettoyer le micro-ondes"
        en: "Clean the microwave"
        es: "Limpiar el microondas"
        de: "Mikrowelle putzen"
        it: "Pulire il microonde"
        pt: "Limpar o micro-ondas"
        br: "Limpar o micro-ondas"
        nl: "Magnetron schoonmaken"
      dt_a_cuisine_09:
        fr: "Des éclaboussures fossilisées tapissent le micro-ondes. Nettoie l'intérieur jusqu'à une cavité propre, sans projection ni odeur."
        en: "Fossilised splatters line the microwave. Clean the inside until the cavity is clean, with no splashes or smell."
        es: "Salpicaduras fosilizadas recubren el microondas. Limpia el interior hasta una cavidad limpia, sin salpicaduras ni olor."
        de: "Versteinerte Spritzer kleben überall in der Mikrowelle. Putz den Innenraum, bis er sauber ist, ohne Spritzer und ohne Geruch."
        it: "Schizzi fossilizzati tappezzano il microonde. Pulisci l'interno finché non è pulito, senza schizzi né odori."
        pt: "Salpicos fossilizados forram o micro-ondas. Limpa o interior até ficar limpo, sem salpicos nem cheiro."
        br: "Respingos fossilizados cobrem o micro-ondas. Limpe o interior até ficar limpo, sem respingos nem cheiro."
        nl: "Versteende spetters bedekken de binnenkant van de magnetron. Maak hem vanbinnen schoon, zonder spetters of geur."
      dt_d_cuisine_09:
        fr: "@@@session.user.name@@@ vient de pulvériser les éclaboussures fossilisées du micro-ondes !"
        en: "@@@session.user.name@@@ has just blasted the fossilised splatters of the microwave!"
        es: "¡@@@session.user.name@@@ acaba de pulverizar las salpicaduras fosilizadas del microondas!"
        de: "@@@session.user.name@@@ hat die versteinerten Spritzer der Mikrowelle gerade pulverisiert!"
        it: "@@@session.user.name@@@ ha appena polverizzato gli schizzi fossilizzati del microonde!"
        pt: "@@@session.user.name@@@ acabou de pulverizar os salpicos fossilizados do micro-ondas!"
        br: "@@@session.user.name@@@ acabou de pulverizar os respingos fossilizados do micro-ondas!"
        nl: "@@@session.user.name@@@ heeft zojuist de versteende spetters van de magnetron verpulverd!"
      dt_c_cuisine_09:
        fr: "@@@session.user.name@@@ a croisé le fer avec les éclaboussures fossilisées du micro-ondes, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ crossed swords with the fossilised splatters of the microwave, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ cruzó el acero con las salpicaduras fosilizadas del microondas, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat mit den versteinerten Spritzern der Mikrowelle die Klingen gekreuzt, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha incrociato la spada con gli schizzi fossilizzati del microonde, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ cruzou espadas com os salpicos fossilizados do micro-ondas, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ cruzou espadas com os respingos fossilizados do micro-ondas, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ kruiste de degens met de versteende spetters van de magnetron, maar de nacht viel over de kerker voor het einde!"
      dt_t_cuisine_10:
        fr: "Nettoyer la hotte"
        en: "Clean the extractor hood"
        es: "Limpiar la campana extractora"
        de: "Abzugshaube putzen"
        it: "Pulire la cappa"
        pt: "Limpar o exaustor"
        br: "Limpar a coifa"
        nl: "Afzuigkap schoonmaken"
      dt_a_cuisine_10:
        fr: "Un graisse-troll s'est incrusté dans la hotte de cuisine. Nettoie filtres et surfaces jusqu'à une hotte dégraissée."
        en: "A grease-troll has lodged in the kitchen extractor hood. Clean the filters and surfaces until the hood is degreased."
        es: "Un troll de grasa se ha incrustado en la campana de la cocina. Limpia filtros y superficies hasta desengrasar la campana."
        de: "Ein Fetttroll hat sich in der Abzugshaube der Küche festgesetzt. Putz Filter und Flächen, bis die Haube fettfrei ist."
        it: "Un troll dell'unto si è incrostato nella cappa della cucina. Pulisci filtri e superfici finché la cappa non è sgrassata."
        pt: "Um troll da gordura incrustou-se no exaustor da cozinha. Limpa os filtros e as superfícies até o exaustor ficar desengordurado."
        br: "Um troll da gordura se incrustou na coifa da cozinha. Limpe os filtros e as superfícies até a coifa ficar desengordurada."
        nl: "Een vettrol heeft zich in de afzuigkap van de keuken genesteld. Maak filters en oppervlakken schoon tot de kap vetvrij is."
      dt_d_cuisine_10:
        fr: "@@@session.user.name@@@ vient de terrasser le graisse-troll de la hotte de cuisine !"
        en: "@@@session.user.name@@@ has just slain the grease-troll of the kitchen hood!"
        es: "¡@@@session.user.name@@@ acaba de derrotar al troll de grasa de la campana de la cocina!"
        de: "@@@session.user.name@@@ hat den Fetttroll der Abzugshaube gerade besiegt!"
        it: "@@@session.user.name@@@ ha appena sconfitto il troll dell'unto della cappa della cucina!"
        pt: "@@@session.user.name@@@ acabou de derrotar o troll da gordura do exaustor da cozinha!"
        br: "@@@session.user.name@@@ acabou de derrotar o troll da gordura da coifa da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de vettrol van de afzuigkap verslagen!"
      dt_c_cuisine_10:
        fr: "@@@session.user.name@@@ a livré un beau combat contre le graisse-troll de la hotte de cuisine, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ put up a fine fight against the grease-troll of the kitchen hood, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra el troll de grasa de la campana de la cocina, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit dem Fetttroll der Abzugshaube geliefert, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha combattuto una bella battaglia contro il troll dell'unto della cappa della cucina, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ travou um belo combate contra o troll da gordura do exaustor da cozinha, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ travou um belo combate contra o troll da gordura da coifa da cozinha, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de vettrol van de afzuigkap, maar de vijand had een val gezet!"
      dt_t_cuisine_11:
        fr: "Nettoyer l'intérieur du four"
        en: "Clean the inside of the oven"
        es: "Limpiar el interior del horno"
        de: "Backofen innen putzen"
        it: "Pulire l'interno del forno"
        pt: "Limpar o interior do forno"
        br: "Limpar o interior do forno"
        nl: "Oven vanbinnen schoonmaken"
      dt_a_cuisine_11:
        fr: "Des démons de graisse carbonisée tapissent l'intérieur du four. Récure jusqu'à un four propre, sans dépôt brûlé."
        en: "Charred-grease demons coat the inside of the oven. Scrub until the oven is clean, with no burnt residue."
        es: "Demonios de grasa carbonizada recubren el interior del horno. Frota hasta un horno limpio, sin residuos quemados."
        de: "Dämonen aus verkohltem Fett bedecken das Innere des Backofens. Schrubb, bis der Ofen sauber ist, ohne angebrannte Reste."
        it: "Demoni di unto bruciato tappezzano l'interno del forno. Strofina finché il forno non è pulito, senza residui bruciati."
        pt: "Demónios de gordura queimada forram o interior do forno. Esfrega até o forno ficar limpo, sem restos queimados."
        br: "Demônios de gordura queimada cobrem o interior do forno. Esfregue até o forno ficar limpo, sem restos queimados."
        nl: "Demonen van aangekoekt vet bedekken de binnenkant van de oven. Schrob tot de oven schoon is, zonder aangebrande resten."
      dt_d_cuisine_11:
        fr: "@@@session.user.name@@@ vient d'exorciser les démons de graisse du four !"
        en: "@@@session.user.name@@@ has just exorcised the grease demons of the oven!"
        es: "¡@@@session.user.name@@@ acaba de exorcizar a los demonios de grasa del horno!"
        de: "@@@session.user.name@@@ hat die Fettdämonen des Backofens gerade ausgetrieben!"
        it: "@@@session.user.name@@@ ha appena esorcizzato i demoni dell'unto del forno!"
        pt: "@@@session.user.name@@@ acabou de exorcizar os demónios de gordura do forno!"
        br: "@@@session.user.name@@@ acabou de exorcizar os demônios de gordura do forno!"
        nl: "@@@session.user.name@@@ heeft zojuist de vetdemonen van de oven uitgedreven!"
      dt_c_cuisine_11:
        fr: "@@@session.user.name@@@ a croisé le fer avec les démons de graisse du four, mais ce n'était pas encore gagné !"
        en: "@@@session.user.name@@@ crossed swords with the grease demons of the oven, but it was not quite won yet!"
        es: "¡@@@session.user.name@@@ cruzó el acero con los demonios de grasa del horno, pero aún no estaba ganado!"
        de: "@@@session.user.name@@@ hat mit den Fettdämonen des Backofens die Klingen gekreuzt, aber gewonnen war es noch nicht!"
        it: "@@@session.user.name@@@ ha incrociato la spada con i demoni dell'unto del forno, ma non era ancora vinta!"
        pt: "@@@session.user.name@@@ cruzou espadas com os demónios de gordura do forno, mas ainda não estava ganho!"
        br: "@@@session.user.name@@@ cruzou espadas com os demônios de gordura do forno, mas a vitória ainda não estava garantida!"
        nl: "@@@session.user.name@@@ kruiste de degens met de vetdemonen van de oven, maar het was nog niet gewonnen!"
      dt_t_cuisine_12:
        fr: "Nettoyer la plaque de cuisson"
        en: "Clean the hob"
        es: "Limpiar la placa de cocción"
        de: "Kochfeld putzen"
        it: "Pulire il piano cottura"
        pt: "Limpar a placa"
        br: "Limpar o fogão"
        nl: "Kookplaat schoonmaken"
      dt_a_cuisine_12:
        fr: "Des croûtes carbonisées s'agrippent à la plaque de cuisson. Nettoie jusqu'à une plaque nette et brillante."
        en: "Charred crusts cling to the hob. Clean until the hob is spotless and shining."
        es: "Costras carbonizadas se aferran a la placa de cocción. Limpia hasta dejar la placa impecable y brillante."
        de: "Verkohlte Krusten klammern sich an das Kochfeld. Putz, bis das Kochfeld blitzsauber ist und glänzt."
        it: "Croste carbonizzate si aggrappano al piano cottura. Pulisci finché il piano non è perfetto e brillante."
        pt: "Crostas carbonizadas agarram-se à placa. Limpa até a placa ficar impecável e brilhante."
        br: "Crostas carbonizadas grudam no fogão. Limpe até o fogão ficar impecável e brilhante."
        nl: "Aangebrande korsten klampen zich vast aan de kookplaat. Maak schoon tot de kookplaat smetteloos is en glanst."
      dt_d_cuisine_12:
        fr: "@@@session.user.name@@@ vient de décrocher les croûtes carbonisées de la plaque de cuisson !"
        en: "@@@session.user.name@@@ has just scraped off the charred crusts of the hob!"
        es: "¡@@@session.user.name@@@ acaba de arrancar las costras carbonizadas de la placa de cocción!"
        de: "@@@session.user.name@@@ hat die verkohlten Krusten gerade vom Kochfeld gekratzt!"
        it: "@@@session.user.name@@@ ha appena staccato le croste carbonizzate dal piano cottura!"
        pt: "@@@session.user.name@@@ acabou de arrancar as crostas carbonizadas da placa!"
        br: "@@@session.user.name@@@ acabou de arrancar as crostas carbonizadas do fogão!"
        nl: "@@@session.user.name@@@ heeft zojuist de aangebrande korsten van de kookplaat geschraapt!"
      dt_c_cuisine_12:
        fr: "@@@session.user.name@@@ a livré un beau combat contre les croûtes carbonisées de la plaque de cuisson, mais la potion de courage était déjà vide !"
        en: "@@@session.user.name@@@ put up a fine fight against the charred crusts of the hob, but the courage potion was already empty!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra las costras carbonizadas de la placa de cocción, pero la poción de valor ya estaba vacía!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit den verkohlten Krusten des Kochfelds geliefert, aber der Mutrank war schon leer!"
        it: "@@@session.user.name@@@ ha combattuto una bella battaglia contro le croste carbonizzate del piano cottura, ma la pozione del coraggio era già vuota!"
        pt: "@@@session.user.name@@@ travou um belo combate contra as crostas carbonizadas da placa, mas a poção de coragem já estava vazia!"
        br: "@@@session.user.name@@@ travou um belo combate contra as crostas carbonizadas do fogão, mas a poção de coragem já estava vazia!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de aangebrande korsten van de kookplaat, maar het moeddrankje was al leeg!"
      dt_t_cuisine_13:
        fr: "Nettoyer l'intérieur du réfrigérateur"
        en: "Clean the inside of the fridge"
        es: "Limpiar el interior del frigorífico"
        de: "Kühlschrank innen putzen"
        it: "Pulire l'interno del frigo"
        pt: "Limpar o interior do frigorífico"
        br: "Limpar o interior da geladeira"
        nl: "Koelkast vanbinnen schoonmaken"
      dt_a_cuisine_13:
        fr: "Des créatures oubliées et des moisissures rampantes hantent l'intérieur du réfrigérateur. Vide, nettoie et désinfecte jusqu'à un frigo sain."
        en: "Forgotten creatures and creeping mould haunt the inside of the fridge. Empty, clean and disinfect until the fridge is wholesome."
        es: "Criaturas olvidadas y moho reptante acechan en el interior del frigorífico. Vacía, limpia y desinfecta hasta un frigorífico sano."
        de: "Vergessene Kreaturen und kriechender Schimmel spuken im Kühlschrank. Räum ihn aus, putz und desinfizier ihn, bis er wieder gesund ist."
        it: "Creature dimenticate e muffa strisciante infestano l'interno del frigo. Svuota, pulisci e disinfetta finché il frigo non è sano."
        pt: "Criaturas esquecidas e bolor rastejante assombram o interior do frigorífico. Esvazia, limpa e desinfeta até o frigorífico ficar saudável."
        br: "Criaturas esquecidas e mofo rastejante assombram o interior da geladeira. Esvazie, limpe e desinfete até a geladeira ficar saudável."
        nl: "Vergeten wezens en kruipende schimmel spoken rond in de koelkast. Leeg, maak schoon en ontsmet tot de koelkast weer gezond is."
      dt_d_cuisine_13:
        fr: "@@@session.user.name@@@ vient de purger les créatures oubliées du réfrigérateur !"
        en: "@@@session.user.name@@@ has just purged the forgotten creatures of the fridge!"
        es: "¡@@@session.user.name@@@ acaba de purgar las criaturas olvidadas del frigorífico!"
        de: "@@@session.user.name@@@ hat die vergessenen Kreaturen gerade aus dem Kühlschrank verbannt!"
        it: "@@@session.user.name@@@ ha appena ripulito il frigo dalle creature dimenticate!"
        pt: "@@@session.user.name@@@ acabou de purgar as criaturas esquecidas do frigorífico!"
        br: "@@@session.user.name@@@ acabou de expulsar as criaturas esquecidas da geladeira!"
        nl: "@@@session.user.name@@@ heeft zojuist de vergeten wezens uit de koelkast verbannen!"
      dt_c_cuisine_13:
        fr: "@@@session.user.name@@@ a croisé le fer avec les créatures oubliées du réfrigérateur, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ crossed swords with the forgotten creatures of the fridge, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ cruzó el acero con las criaturas olvidadas del frigorífico, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ hat mit den vergessenen Kreaturen des Kühlschranks die Klingen gekreuzt, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha incrociato la spada con le creature dimenticate del frigo, ma è passato di lì un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ cruzou espadas com as criaturas esquecidas do frigorífico, mas passou por ali um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ cruzou espadas com as criaturas esquecidas da geladeira, mas um dragão passou por ali e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ kruiste de degens met de vergeten wezens van de koelkast, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"
      dt_t_cuisine_15:
        fr: "Détartrer la bouilloire ou la cafetière"
        en: "Descale the kettle or coffee maker"
        es: "Descalcificar el hervidor o la cafetera"
        de: "Wasserkocher oder Kaffeemaschine entkalken"
        it: "Decalcificare bollitore o macchina del caffè"
        pt: "Descalcificar a chaleira ou a máquina de café"
        br: "Descalcificar a chaleira ou a cafeteira"
        nl: "Waterkoker of koffiezetapparaat ontkalken"
      dt_a_cuisine_15:
        fr: "Des golems de tartre durcissent dans la bouilloire ou la cafetière. Détartre jusqu'à un intérieur propre et clair."
        en: "Limescale golems harden inside the kettle or coffee maker. Descale until the inside is clean and clear."
        es: "Gólems de cal se endurecen en el hervidor o la cafetera. Descalcifica hasta un interior limpio y claro."
        de: "Kalk-Golems verhärten sich im Wasserkocher oder in der Kaffeemaschine. Entkalke, bis alles innen sauber und klar ist."
        it: "I golem di calcare si induriscono nel bollitore o nella macchina del caffè. Decalcifica finché l'interno non è pulito e limpido."
        pt: "Golems de calcário endurecem na chaleira ou na máquina de café. Descalcifica até o interior ficar limpo e claro."
        br: "Golems de calcário endurecem na chaleira ou na cafeteira. Descalcifique até o interior ficar limpo e claro."
        nl: "Kalkgolems worden hard in de waterkoker of het koffiezetapparaat. Ontkalk tot de binnenkant schoon en helder is."
      dt_d_cuisine_15:
        fr: "@@@session.user.name@@@ vient de dissoudre les golems de tartre de la bouilloire !"

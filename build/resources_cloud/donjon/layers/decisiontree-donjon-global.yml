        en: "@@@session.user.name@@@ has just dispelled the dull reflections of the children's bedroom mirror!"
        es: "¡@@@session.user.name@@@ acaba de disipar los reflejos turbios del espejo de la habitación infantil!"
        de: "@@@session.user.name@@@ hat die trüben Spiegelungen im Spiegel des Kinderzimmers gerade vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto i riflessi opachi dello specchio della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de dissipar os reflexos baços do espelho do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de dissipar os reflexos embaçados do espelho do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de doffe weerspiegelingen van de spiegel in de kinderkamer verdreven!"

        it: "@@@session.user.name@@@ ha appena messo a posto tutto il bottino della spesa!"
        pt: "@@@session.user.name@@@ acabou de arrumar todo o espólio das compras!"
        br: "@@@session.user.name@@@ acabou de guardar todo o tesouro das compras!"
        nl: "@@@session.user.name@@@ heeft zojuist de hele boodschappenbuit opgeruimd!"

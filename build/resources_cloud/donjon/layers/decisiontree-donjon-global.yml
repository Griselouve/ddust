        fr: "@@@session.user.name@@@ a tenu bon face aux limaces de crasse de la cuisine, et des renforts sont arrivés du mauvais côté !"
        en: "@@@session.user.name@@@ held the line against the grime slugs of the kitchen, and reinforcements turned up on the wrong side!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a las babosas de mugre de la cocina, y llegaron refuerzos del bando equivocado!"
        de: "@@@session.user.name@@@ hat den Schmutzschnecken in der Küche standgehalten, und Verstärkung kam für die falsche Seite!"
        it: "@@@session.user.name@@@ ha tenuto duro contro le lumache di sporco della cucina, e sono arrivati rinforzi dalla parte sbagliata!"
        pt: "@@@session.user.name@@@ aguentou firme contra as lesmas de sujidade da cozinha, e chegaram reforços do lado errado!"
        br: "@@@session.user.name@@@ aguentou firme contra as lesmas de sujeira da cozinha, e chegaram reforços do lado errado!"
        nl: "@@@session.user.name@@@ hield stand tegen de vuilslakken van de keuken, en er kwamen versterkingen voor de verkeerde kant!"

        br: "@@@session.user.name@@@ partiu para o ataque contra os montes-trasgo de folhas do jardim, mas a poção de coragem já estava vazia!"
        nl: "@@@session.user.name@@@ bestormde de koboldhopen van bladeren in de tuin, maar het moeddrankje was al op!"

        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de afugentar os duendes dos vidros do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de espantar os duendes dos vidros do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de kabouters van de ramen van de kinderkamer verjaagd!"
      dt_c_chambre_enfant_04:
        fr: "@@@session.user.name@@@ a bravé les lutins des vitres de la chambre enfant sans faiblir, mais le temps a manqué : l'aventure continuera !"

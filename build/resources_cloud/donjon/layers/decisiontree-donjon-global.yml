        fr: "@@@session.user.name@@@ a tenu bon face aux croûtes graisseuses du plan de travail, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ held the line against the greasy crusts of the worktop, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a las costras grasientas de la encimera, pero el hechizo salió mal en el último momento!"

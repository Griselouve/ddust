      dt_t_dechets_07:
        fr: "Nettoyer la poubelle"
        en: "Clean the bin"
        es: "Limpiar el cubo de basura"
        de: "Mülleimer putzen"
        it: "Pulire la pattumiera"
        pt: "Lavar o caixote do lixo"
        br: "Lavar a lixeira"
        nl: "Vuilnisbak schoonmaken"
      dt_a_dechets_07:
        fr: "Les blob-ordures suintent dans la poubelle de cuisine. Vide, lave et désinfecte jusqu'à une poubelle propre et sans odeur."
        en: "Garbage blobs ooze in the kitchen bin. Empty, wash and disinfect until the bin is clean and odourless."
        es: "Los blobs de basura rezuman en el cubo de la cocina. Vacía, lava y desinfecta hasta un cubo limpio y sin olor."
        de: "Müll-Blobs sickern im Küchenmülleimer. Leeren, auswaschen und desinfizieren, bis der Eimer sauber ist und nicht mehr riecht."
        it: "I blob-spazzatura colano nella pattumiera della cucina. Svuota, lava e disinfetta finché è pulita e senza odore."
        pt: "Os blobs de lixo escorrem no caixote da cozinha. Esvazia, lava e desinfeta até ficar limpo e sem cheiro."
        br: "Os blobs de lixo escorrem na lixeira da cozinha. Esvazie, lave e desinfete até ficar limpa e sem cheiro."
        nl: "Afvalblobs sijpelen in de vuilnisbak van de keuken. Leeg, was en ontsmet tot de bak schoon is en niet meer stinkt."

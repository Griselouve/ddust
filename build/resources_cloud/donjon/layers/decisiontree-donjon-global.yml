        pt: "@@@session.user.name@@@ acabou de esfregar as crostas da bancada do escritório!"
        br: "@@@session.user.name@@@ acabou de esfregar as crostas da bancada do escritório!"
        nl: "@@@session.user.name@@@ heeft net de korsten van het werkblad van de werkkamer geschrobd!"

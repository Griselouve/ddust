      #------------- Tâches — cuisine ----------------------------------

      dt_t_cuisine_01:
        fr: "Aspirer ou balayer"
        en: "Vacuum or sweep"
        es: "Aspirar o barrer"
        de: "Saugen oder fegen"
        it: "Aspirare o spazzare"
        pt: "Aspirar ou varrer"
        br: "Aspirar ou varrer"
        nl: "Stofzuigen of vegen"
      dt_a_cuisine_01:
        fr: "Les moutons-gobelins de poussière envahissent la cuisine ! Aspire ou balaie jusqu'à un sol net, recoins compris."
        en: "Dust-bunny goblins overrun the kitchen! Vacuum or sweep until the floor is spotless, corners included."
        es: "¡Los duendes de pelusa invaden la cocina! Aspira o barre hasta dejar el suelo impecable, rincones incluidos."
        de: "Wollmaus-Kobolde überrennen die Küche! Saug oder feg, bis der Boden blitzsauber ist, Ecken inklusive."
        it: "I goblin-batuffolo di polvere invadono la cucina! Passa l'aspirapolvere o scopa finché il pavimento non è pulitissimo, angoli compresi."
        pt: "Os duendes de cotão invadem a cozinha! Aspira ou varre até o chão ficar impecável, cantos incluídos."
        br: "Os duendes de fiapos invadem a cozinha! Aspire ou varra até o chão ficar impecável, incluindo os cantos."
        nl: "Stofpluiskobolden overspoelen de keuken! Stofzuig of veeg tot de vloer smetteloos is, hoekjes inbegrepen."
      dt_d_cuisine_01:
        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins de la cuisine !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the kitchen!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa de la cocina!"
        de: "@@@session.user.name@@@ hat die Wollmaus-Kobolde in der Küche gerade plattgemacht!"
        it: "@@@session.user.name@@@ ha appena polverizzato i goblin-batuffolo della cucina!"
        pt: "@@@session.user.name@@@ acabou de esmagar os duendes de cotão da cozinha!"
        br: "@@@session.user.name@@@ acabou de esmagar os duendes de fiapos da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofpluiskobolden van de keuken verpletterd!"
      dt_c_cuisine_01:
        fr: "@@@session.user.name@@@ a croisé le fer avec les moutons-gobelins de la cuisine, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ crossed swords with the dust-bunny goblins of the kitchen, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ cruzó el acero con los duendes de pelusa de la cocina, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat mit den Wollmaus-Kobolden in der Küche die Klingen gekreuzt, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha incrociato la spada con i goblin-batuffolo della cucina, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ cruzou espadas com os duendes de cotão da cozinha, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ cruzou espadas com os duendes de fiapos da cozinha, mas o tempo acabou: a aventura continuará!"
        nl: "@@@session.user.name@@@ kruiste de degens met de stofpluiskobolden van de keuken, maar de tijd was op: het avontuur gaat verder!"
      dt_t_cuisine_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "Vloer dweilen"
      dt_a_cuisine_03:
        fr: "Des limaces de crasse traînent sur le sol de la cuisine. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the kitchen floor. Mop until it shines, with no sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo de la cocina. Friega hasta que brille, sin zonas pegajosas."
        de: "Schmutzschnecken ziehen ihre Spuren über den Küchenboden. Wisch, bis er glänzt und nichts mehr klebt."
        it: "Le lumache di sporco strisciano sul pavimento della cucina. Lava finché non brilla, senza punti appiccicosi."
        pt: "Lesmas de sujidade deixam rastos no chão da cozinha. Lava até brilhar, sem zonas pegajosas."
        br: "Lesmas de sujeira deixam rastros no chão da cozinha. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken laten sporen na op de keukenvloer. Dweil tot hij glanst, zonder plakkerige plekken."

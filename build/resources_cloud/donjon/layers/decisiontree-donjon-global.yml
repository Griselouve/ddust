        fr: "Des reflets ternes obscurcissent le miroir de la chambre enfant. Nettoie-le jusqu'à un reflet clair et net."
        en: "Dull reflections cloud the children's bedroom mirror. Clean it until the reflection is clear and sharp."
        es: "Reflejos turbios empañan el espejo de la habitación infantil. Límpialo hasta un reflejo claro y nítido."
        de: "Trübe Spiegelungen vernebeln den Spiegel im Kinderzimmer. Putz ihn, bis das Spiegelbild klar und scharf ist."
        it: "Riflessi opachi offuscano lo specchio della cameretta dei bambini. Puliscilo finché il riflesso non è chiaro e nitido."
        pt: "Reflexos baços turvam o espelho do quarto das crianças. Limpa-o até o reflexo ficar claro e nítido."
        br: "Reflexos embaçados turvam o espelho do quarto das crianças. Limpe até o reflexo ficar claro e nítido."
        nl: "Doffe weerspiegelingen vertroebelen de spiegel van de kinderkamer. Poets hem tot het spiegelbeeld helder en scherp is."

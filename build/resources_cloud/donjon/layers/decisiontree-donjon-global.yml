        fr: "Détartrer la robinetterie"
        en: "Descale the taps"
        es: "Descalcificar la grifería"
        de: "Armaturen entkalken"
        it: "Decalcificare i rubinetti"
        pt: "Descalcificar as torneiras"
        br: "Descalcificar as torneiras"
        nl: "Kranen ontkalken"

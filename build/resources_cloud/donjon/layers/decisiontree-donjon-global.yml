        de: "Matratzen-Miasmen sammeln sich im Elternschlafzimmer. Wende oder lüfte die Matratze, bis sie frisch und gesund ist."
        it: "I miasmi del materasso si accumulano nella camera dei genitori. Gira o arieggia il materasso finché non è fresco e sano."
        pt: "Os miasmas do colchão acumulam-se no quarto dos pais. Vira ou areja o colchão até ficar fresco e saudável."
        br: "Os miasmas do colchão se acumulam no quarto dos pais. Vire ou areje o colchão até ficar fresco e saudável."
        nl: "Matrasmiasma's hopen zich op in de ouderslaapkamer. Keer of lucht de matras tot hij fris en gezond is."
      dt_d_chambre_parentale_09:
        fr: "@@@session.user.name@@@ vient de chasser les miasmes du matelas de la chambre parentale !"
        en: "@@@session.user.name@@@ has just driven off the mattress miasmas of the master bedroom!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar los miasmas del colchón del dormitorio principal!"
        de: "@@@session.user.name@@@ hat die Matratzen-Miasmen gerade aus dem Elternschlafzimmer vertrieben!"
        it: "@@@session.user.name@@@ ha appena scacciato i miasmi del materasso della camera dei genitori!"
        pt: "@@@session.user.name@@@ acabou de afugentar os miasmas do colchão do quarto dos pais!"
        br: "@@@session.user.name@@@ acabou de espantar os miasmas do colchão do quarto dos pais!"
        nl: "@@@session.user.name@@@ heeft zojuist de matrasmiasma's uit de ouderslaapkamer verjaagd!"
      dt_c_chambre_parentale_09:
        fr: "@@@session.user.name@@@ a donné l'assaut contre les miasmes du matelas de la chambre parentale, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ led the assault on the mattress miasmas of the master bedroom, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ dio el asalto contra los miasmas del colchón del dormitorio principal, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat die Matratzen-Miasmen im Elternschlafzimmer angegriffen, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha dato l'assalto ai miasmi del materasso della camera dei genitori, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ lançou o assalto contra os miasmas do colchão do quarto dos pais, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ partiu para o ataque contra os miasmas do colchão do quarto dos pais, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ bestormde de matrasmiasma's van de ouderslaapkamer, maar de nacht viel over de kerker voor het einde!"
      dt_t_chambre_parentale_10:
        fr: "Laver les murs"
        en: "Wash the walls"
        es: "Lavar las paredes"
        de: "Wände abwaschen"
        it: "Lavare le pareti"
        pt: "Lavar as paredes"
        br: "Lavar as paredes"
        nl: "Muren afwassen"
      dt_a_chambre_parentale_10:
        fr: "Des traces-fantômes et des éclaboussures maculent les murs de la chambre parentale. Lave-les jusqu'à des parois nettes."
        en: "Ghostly marks and splatters stain the master bedroom walls. Wash them until the walls are spotless."
        es: "Marcas fantasma y salpicaduras manchan las paredes del dormitorio principal. Lávalas hasta dejar las paredes impecables."
        de: "Geisterflecken und Spritzer verschmutzen die Wände im Elternschlafzimmer. Wasch sie ab, bis die Wände blitzsauber sind."
        it: "Macchie fantasma e schizzi sporcano le pareti della camera dei genitori. Lavale finché le pareti non sono perfettamente pulite."
        pt: "Marcas-fantasma e salpicos sujam as paredes do quarto dos pais. Lava-as até as paredes ficarem impecáveis."
        br: "Marcas-fantasma e respingos sujam as paredes do quarto dos pais. Lave até as paredes ficarem impecáveis."
        nl: "Spookvlekken en spetters bevuilen de muren van de ouderslaapkamer. Was ze af tot de muren smetteloos zijn."
      dt_d_chambre_parentale_10:

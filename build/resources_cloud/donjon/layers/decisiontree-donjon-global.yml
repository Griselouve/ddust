        en: "@@@session.user.name@@@ has just dissolved the garbage blobs of the kitchen bin!"
        es: "¡@@@session.user.name@@@ acaba de disolver los blobs de basura del cubo de la cocina!"
        de: "@@@session.user.name@@@ hat gerade die Müll-Blobs im Küchenmülleimer aufgelöst!"
        it: "@@@session.user.name@@@ ha appena dissolto i blob-spazzatura della pattumiera della cucina!"
        pt: "@@@session.user.name@@@ acabou de dissolver os blobs de lixo do caixote da cozinha!"
        br: "@@@session.user.name@@@ acabou de dissolver os blobs de lixo da lixeira da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de afvalblobs in de keukenvuilnisbak opgelost!"
      dt_c_dechets_07:
        fr: "@@@session.user.name@@@ a chargé les blob-ordures de la poubelle de cuisine tête baissée, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ charged straight at the garbage blobs of the kitchen bin, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ cargó de frente contra los blobs de basura del cubo de la cocina, pero el hechizo salió mal en el último momento!"
        de: "@@@session.user.name@@@ ist blindlings auf die Müll-Blobs im Küchenmülleimer losgestürmt, aber der Zauber ging im letzten Moment schief!"
        it: "@@@session.user.name@@@ ha caricato a testa bassa i blob-spazzatura della pattumiera della cucina, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra os blobs de lixo do caixote da cozinha, mas o feitiço correu mal no último momento!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra os blobs de lixo da lixeira da cozinha, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ is blindelings op de afvalblobs in de keukenvuilnisbak afgestormd, maar de spreuk ging op het laatste moment mis!"

      #------------- Tâches — animaux ----------------------------------

      dt_t_animaux_01:
        fr: "Nourrir la bête"
        en: "Feed the beast"
        es: "Alimentar a la bestia"
        de: "Das Biest füttern"
        it: "Dare da mangiare alla bestia"
        pt: "Alimentar a fera"
        br: "Alimentar a fera"
        nl: "Het beest voeren"
      dt_a_animaux_01:
        fr: "Le familier de la maisonnée a faim et réclame sa pitance. Nourris-le avec la juste ration."
        en: "The household familiar is hungry and demands its meal. Feed it the right portion."
        es: "El familiar de la casa tiene hambre y reclama su comida. Dale la ración adecuada."
        de: "Das Zaubertier des Hauses hat Hunger und verlangt sein Futter. Gib ihm die richtige Portion."
        it: "Il famiglio di casa ha fame e reclama la sua pappa. Dagli la giusta razione."
        pt: "O familiar da casa tem fome e reclama a sua comida. Dá-lhe a dose certa."
        br: "O familiar da casa está com fome e pede sua comida. Dê a ele a dose certa."
        nl: "Het toverdier van het huis heeft honger en eist zijn eten. Geef het de juiste portie."

      #------------- Tâches — salon ------------------------------------

      dt_t_salon_01:
        fr: "Aspirer ou balayer"
        en: "Vacuum or sweep"
        es: "Aspirar o barrer"
        de: "Saugen oder fegen"
        it: "Aspirare o spazzare"
        pt: "Aspirar ou varrer"
        br: "Aspirar ou varrer"
        nl: "Stofzuigen of vegen"
      dt_a_salon_01:
        fr: "Les moutons-gobelins de poussière envahissent le salon ! Aspire ou balaie jusqu'à ce que le sol soit net, recoins et dessous des meubles compris."
        en: "Dust-bunny goblins are overrunning the living room! Vacuum or sweep until the floor is spotless, corners and under the furniture included."
        es: "¡Los duendes de pelusa invaden el salón! Aspira o barre hasta que el suelo quede impecable, rincones y debajo de los muebles incluidos."
        de: "Die Wollmaus-Kobolde überrennen das Wohnzimmer! Sauge oder fege, bis der Boden blitzblank ist, Ecken und unter den Möbeln inklusive."
        it: "I goblin-batuffolo di polvere invadono il soggiorno! Aspira o spazza finché il pavimento non è pulito, angoli e sotto i mobili compresi."
        pt: "Os duendes de cotão invadem a sala! Aspira ou varre até o chão ficar impecável, cantos e debaixo dos móveis incluídos."
        br: "Os duendes de fiapos invadem a sala! Aspire ou varra até o chão ficar impecável, incluindo os cantos e embaixo dos móveis."
        nl: "De stofpluiskobolden overspoelen de woonkamer! Zuig of veeg tot de vloer brandschoon is, hoekjes en onder de meubels inbegrepen."
      dt_d_salon_01:
        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins du salon !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the living room!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa del salón!"
        de: "@@@session.user.name@@@ hat gerade die Wollmaus-Kobolde im Wohnzimmer pulverisiert!"
        it: "@@@session.user.name@@@ ha appena polverizzato i goblin-batuffolo del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de pulverizar os duendes de cotão da sala!"
        br: "@@@session.user.name@@@ acabou de pulverizar os duendes de fiapos da sala!"
        nl: "@@@session.user.name@@@ heeft net de stofpluiskobolden in de woonkamer verpulverd!"
      dt_c_salon_01:
        fr: "@@@session.user.name@@@ a chargé les moutons-gobelins du salon tête baissée, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ charged straight at the dust-bunny goblins of the living room, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ cargó de frente contra los duendes de pelusa del salón, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ stürzte sich kopfüber auf die Wollmaus-Kobolde im Wohnzimmer, aber die Zeit reichte nicht: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha caricato a testa bassa i goblin-batuffolo del soggiorno, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra os duendes de cotão da sala, mas o tempo acabou: a aventura vai continuar!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra os duendes de fiapos da sala, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ stormde blindelings af op de stofpluiskobolden in de woonkamer, maar de tijd was op: het avontuur gaat verder!"
      dt_t_salon_02:
        fr: "Faire les poussières"
        en: "Dust"
        es: "Quitar el polvo"
        de: "Staub wischen"
        it: "Spolverare"
        pt: "Limpar o pó"
        br: "Tirar o pó"
        nl: "Afstoffen"
      dt_a_salon_02:
        fr: "Des spectres de poussière se posent sur chaque surface du salon. Dépoussière étagères, meubles et bibelots jusqu'à les faire disparaître."
        en: "Dust wraiths settle on every surface of the living room. Dust the shelves, furniture and trinkets until they vanish."
        es: "Espectros de polvo se posan en cada superficie del salón. Quita el polvo de estantes, muebles y adornos hasta hacerlos desaparecer."
        de: "Staubgespenster lassen sich auf jeder Fläche im Wohnzimmer nieder. Wische Regale, Möbel und Nippes ab, bis sie verschwinden."
        it: "Spettri di polvere si posano su ogni superficie del soggiorno. Spolvera mensole, mobili e soprammobili finché non spariscono."
        pt: "Espectros de pó pousam em cada superfície da sala. Limpa o pó das prateleiras, móveis e bibelôs até os fazeres desaparecer."
        br: "Espectros de poeira pousam em cada superfície da sala. Tire o pó das prateleiras, móveis e bibelôs até fazê-los desaparecer."
        nl: "Stofspoken strijken neer op elk oppervlak in de woonkamer. Stof planken, meubels en snuisterijen af tot ze verdwijnen."
      dt_d_salon_02:
        fr: "@@@session.user.name@@@ vient de dissiper les spectres de poussière du salon !"
        en: "@@@session.user.name@@@ has just banished the dust wraiths of the living room!"
        es: "¡@@@session.user.name@@@ acaba de disipar los espectros de polvo del salón!"
        de: "@@@session.user.name@@@ hat gerade die Staubgespenster im Wohnzimmer vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto gli spettri di polvere del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de dissipar os espectros de pó da sala!"
        br: "@@@session.user.name@@@ acabou de dissipar os espectros de poeira da sala!"
        nl: "@@@session.user.name@@@ heeft net de stofspoken in de woonkamer verdreven!"
      dt_c_salon_02:
        fr: "@@@session.user.name@@@ a tenu bon face aux spectres de poussière du salon, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ held the line against the dust wraiths of the living room, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a los espectros de polvo del salón, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hielt tapfer stand gegen die Staubgespenster im Wohnzimmer, und der Kampf dauerte länger als gedacht!"
        it: "@@@session.user.name@@@ ha tenuto duro contro gli spettri di polvere del soggiorno, e la battaglia è durata più del previsto!"
        pt: "@@@session.user.name@@@ aguentou firme contra os espectros de pó da sala, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ aguentou firme contra os espectros de poeira da sala, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ hield stand tegen de stofspoken in de woonkamer, en het gevecht duurde langer dan gedacht!"
      dt_t_salon_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "De vloer dweilen"
      dt_a_salon_03:
        fr: "Des limaces de crasse laissent des traînées sur le sol du salon. Lave jusqu'à ce que le sol brille, sans auréole ni trace collante."
        en: "Grime slugs leave trails across the living room floor. Mop until the floor shines, with no streaks or sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo del salón. Friega hasta que el suelo brille, sin cercos ni zonas pegajosas."
        de: "Schmutzschnecken hinterlassen Spuren auf dem Wohnzimmerboden. Wische, bis der Boden glänzt, ohne Schlieren oder klebrige Stellen."
        it: "Lumache di sporco lasciano scie sul pavimento del soggiorno. Lava finché il pavimento non brilla, senza aloni né zone appiccicose."
        pt: "Lesmas de sujidade deixam rastos no chão da sala. Lava até o chão brilhar, sem manchas nem zonas peganhentas."
        br: "Lesmas de sujeira deixam rastros no chão da sala. Lave até o chão brilhar, sem manchas nem partes grudentas."
        nl: "Vuilslakken laten sporen achter op de woonkamervloer. Dweil tot de vloer glanst, zonder strepen of plakkerige plekken."
      dt_d_salon_03:
        fr: "@@@session.user.name@@@ vient d'écraser les limaces de crasse du salon !"
        en: "@@@session.user.name@@@ has just squashed the grime slugs of the living room!"
        es: "¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre del salón!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzschnecken im Wohnzimmer zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporco del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade da sala!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira da sala!"
        nl: "@@@session.user.name@@@ heeft net de vuilslakken in de woonkamer geplet!"
      dt_c_salon_03:
        fr: "@@@session.user.name@@@ a croisé le fer avec les limaces de crasse du salon, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ crossed swords with the grime slugs of the living room, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ cruzó el acero con las babosas de mugre del salón, pero el hechizo salió mal en el último momento!"
        de: "@@@session.user.name@@@ kreuzte die Klingen mit den Schmutzschnecken im Wohnzimmer, aber der Zauber ging im letzten Moment schief!"
        it: "@@@session.user.name@@@ ha incrociato le spade con le lumache di sporco del soggiorno, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "@@@session.user.name@@@ cruzou espadas com as lesmas de sujidade da sala, mas o feitiço correu mal no último momento!"
        br: "@@@session.user.name@@@ cruzou espadas com as lesmas de sujeira da sala, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ kruiste de degens met de vuilslakken in de woonkamer, maar de spreuk ging op het laatste moment mis!"
      dt_t_salon_04:
        fr: "Nettoyer les vitres"
        en: "Clean the windows"
        es: "Limpiar las ventanas"
        de: "Fenster putzen"
        it: "Pulire i vetri"
        pt: "Limpar os vidros"
        br: "Limpar os vidros"
        nl: "Ramen lappen"
      dt_a_salon_04:
        fr: "Des lutins de traces grasses brouillent les vitres du salon. Nettoie jusqu'à une transparence parfaite, sans trace ni coulure."
        en: "Greasy-smudge imps blur the living room windows. Clean until perfectly clear, with no smears or drips."
        es: "Duendes de manchas grasientas empañan las ventanas del salón. Limpia hasta una transparencia perfecta, sin marcas ni regueros."
        de: "Schmierwichtel trüben die Wohnzimmerfenster. Putze, bis alles perfekt durchsichtig ist, ohne Schlieren oder Tropfspuren."
        it: "Folletti delle ditate appannano i vetri del soggiorno. Pulisci fino a una trasparenza perfetta, senza aloni né colature."
        pt: "Duendes das dedadas embaciam os vidros da sala. Limpa até ficarem perfeitamente transparentes, sem marcas nem escorridos."
        br: "Duendes dos dedos sujos embaçam os vidros da sala. Limpe até ficarem perfeitamente transparentes, sem marcas nem riscos."
        nl: "Vetvlekkabouters maken de ramen van de woonkamer wazig. Lap tot ze perfect doorzichtig zijn, zonder strepen of druipers."
      dt_d_salon_04:
        fr: "@@@session.user.name@@@ vient de chasser les lutins des vitres du salon !"
        en: "@@@session.user.name@@@ has just driven off the smudge imps from the living room windows!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar a los duendes de las ventanas del salón!"
        de: "@@@session.user.name@@@ hat gerade die Schmierwichtel von den Wohnzimmerfenstern verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de afugentar os duendes dos vidros da sala!"
        br: "@@@session.user.name@@@ acabou de espantar os duendes dos vidros da sala!"
        nl: "@@@session.user.name@@@ heeft net de vetvlekkabouters van de woonkamerramen verjaagd!"
      dt_c_salon_04:
        fr: "@@@session.user.name@@@ a tenu tête aux lutins des vitres du salon, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ stood up to the smudge imps of the living room windows, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ le plantó cara a los duendes de las ventanas del salón, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ bot den Schmierwichteln an den Wohnzimmerfenstern die Stirn, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha tenuto testa ai folletti dei vetri del soggiorno, ma la notte è calata sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ enfrentou os duendes dos vidros da sala, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ enfrentou os duendes dos vidros da sala, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ bood de vetvlekkabouters van de woonkamerramen het hoofd, maar de nacht viel over de kerker voor het einde!"
      dt_t_salon_05:
        fr: "Laver les murs"
        en: "Wash the walls"
        es: "Lavar las paredes"
        de: "Wände abwaschen"
        it: "Lavare i muri"
        pt: "Lavar as paredes"
        br: "Lavar as paredes"
        nl: "Muren afwassen"
      dt_a_salon_05:
        fr: "Le moisi rampant gagne les murs du salon. Lave-les jusqu'à retrouver une surface propre et nette, sans tache ni voile gris."
        en: "Creeping mould spreads over the living room walls. Wash them until the surface is clean and clear, with no stains or grey film."
        es: "El moho reptante avanza por las paredes del salón. Lávalas hasta dejar la superficie limpia y nítida, sin manchas ni velo gris."
        de: "Kriechschimmel breitet sich an den Wohnzimmerwänden aus. Wasche sie ab, bis die Fläche wieder sauber und klar ist, ohne Flecken oder grauen Schleier."
        it: "La muffa strisciante avanza sui muri del soggiorno. Lavali finché la superficie non torna pulita e netta, senza macchie né patina grigia."
        pt: "O bolor rastejante avança pelas paredes da sala. Lava-as até a superfície ficar limpa e nítida, sem manchas nem véu cinzento."
        br: "O mofo rastejante avança pelas paredes da sala. Lave até a superfície ficar limpa e nítida, sem manchas nem véu cinza."
        nl: "Kruipschimmel verspreidt zich over de woonkamermuren. Was ze af tot het oppervlak weer schoon en helder is, zonder vlekken of grijze waas."
      dt_d_salon_05:
        fr: "@@@session.user.name@@@ vient de repousser le moisi rampant des murs du salon !"
        en: "@@@session.user.name@@@ has just pushed back the creeping mould of the living room walls!"
        es: "¡@@@session.user.name@@@ acaba de repeler el moho reptante de las paredes del salón!"
        de: "@@@session.user.name@@@ hat gerade den Kriechschimmel von den Wohnzimmerwänden zurückgedrängt!"
        it: "@@@session.user.name@@@ ha appena respinto la muffa strisciante dai muri del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de repelir o bolor rastejante das paredes da sala!"
        br: "@@@session.user.name@@@ acabou de repelir o mofo rastejante das paredes da sala!"
        nl: "@@@session.user.name@@@ heeft net de kruipschimmel van de woonkamermuren teruggedrongen!"
      dt_c_salon_05:
        fr: "@@@session.user.name@@@ a chargé le moisi rampant des murs du salon tête baissée, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ charged straight at the creeping mould of the living room walls, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ cargó de frente contra el moho reptante de las paredes del salón, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ stürzte sich kopfüber auf den Kriechschimmel an den Wohnzimmerwänden, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha caricato a testa bassa la muffa strisciante dei muri del soggiorno, ma la notte è calata sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra o bolor rastejante das paredes da sala, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra o mofo rastejante das paredes da sala, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ stormde blindelings af op de kruipschimmel van de woonkamermuren, maar de nacht viel over de kerker voor het einde!"
      dt_t_salon_06:
        fr: "Nettoyer le miroir"
        en: "Clean the mirror"
        es: "Limpiar el espejo"
        de: "Spiegel putzen"
        it: "Pulire lo specchio"
        pt: "Limpar o espelho"
        br: "Limpar o espelho"
        nl: "De spiegel poetsen"
      dt_a_salon_06:
        fr: "Des reflets ternes obscurcissent le miroir du salon. Nettoie-le jusqu'à un reflet clair et net, sans trace ni buée."
        en: "Dull reflections cloud the living room mirror. Clean it until the reflection is clear and sharp, with no smears or haze."
        es: "Reflejos turbios empañan el espejo del salón. Límpialo hasta un reflejo claro y nítido, sin marcas ni vaho."
        de: "Trübe Spiegelbilder verdunkeln den Wohnzimmerspiegel. Putze ihn, bis das Spiegelbild klar und scharf ist, ohne Schlieren oder Beschlag."
        it: "Riflessi opachi offuscano lo specchio del soggiorno. Puliscilo fino a un riflesso chiaro e nitido, senza aloni né condensa."
        pt: "Reflexos baços escurecem o espelho da sala. Limpa-o até um reflexo claro e nítido, sem marcas nem embaciado."
        br: "Reflexos embaçados escurecem o espelho da sala. Limpe até ter um reflexo claro e nítido, sem marcas nem embaçado."
        nl: "Doffe spiegelbeelden verduisteren de spiegel in de woonkamer. Poets hem tot het spiegelbeeld helder en scherp is, zonder strepen of waas."
      dt_d_salon_06:
        fr: "@@@session.user.name@@@ vient de dissiper les reflets ternes du miroir du salon !"
        en: "@@@session.user.name@@@ has just dispelled the dull reflections of the living room mirror!"
        es: "¡@@@session.user.name@@@ acaba de disipar los reflejos turbios del espejo del salón!"
        de: "@@@session.user.name@@@ hat gerade die trüben Spiegelbilder im Wohnzimmerspiegel vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto i riflessi opachi dello specchio del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de dissipar os reflexos baços do espelho da sala!"
        br: "@@@session.user.name@@@ acabou de dissipar os reflexos embaçados do espelho da sala!"
        nl: "@@@session.user.name@@@ heeft net de doffe spiegelbeelden van de woonkamerspiegel verdreven!"
      dt_c_salon_06:
        fr: "@@@session.user.name@@@ a chargé les reflets ternes du miroir du salon tête baissée, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ charged straight at the dull reflections of the living room mirror, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ cargó de frente contra los reflejos turbios del espejo del salón, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ stürzte sich kopfüber auf die trüben Spiegelbilder im Wohnzimmerspiegel, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha caricato a testa bassa i riflessi opachi dello specchio del soggiorno, ma è passato un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ carregou de cabeça baixa contra os reflexos baços do espelho da sala, mas passou por ali um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ avançou de cabeça baixa contra os reflexos embaçados do espelho da sala, mas um dragão passou por ali e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ stormde blindelings af op de doffe spiegelbeelden van de woonkamerspiegel, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"
      dt_t_salon_07:
        fr: "Ranger"
        en: "Tidy"
        es: "Ordenar"
        de: "Aufräumen"
        it: "Riordinare"
        pt: "Arrumar"
        br: "Arrumar"
        nl: "Opruimen"
      dt_a_salon_07:
        fr: "Les gobelins du désordre ont semé le chaos dans le salon. Range chaque objet à sa place jusqu'à un salon ordonné."
        en: "Clutter goblins have spread chaos through the living room. Put every object back in its place until the room is tidy."
        es: "Los trasgos del desorden han sembrado el caos en el salón. Coloca cada objeto en su sitio hasta dejar el salón ordenado."
        de: "Die Chaos-Kobolde haben im Wohnzimmer Unordnung gestiftet. Räume jeden Gegenstand an seinen Platz, bis das Wohnzimmer ordentlich ist."
        it: "I goblin del disordine hanno seminato il caos nel soggiorno. Metti ogni oggetto al suo posto finché il soggiorno non è in ordine."
        pt: "Os trasgos da desarrumação semearam o caos na sala. Arruma cada objeto no seu lugar até a sala ficar arrumada."
        br: "Os trasgos da bagunça espalharam o caos na sala. Coloque cada objeto no lugar até a sala ficar arrumada."
        nl: "De rommelkobolden hebben chaos gezaaid in de woonkamer. Zet elk voorwerp terug op zijn plek tot de woonkamer netjes is."
      dt_d_salon_07:
        fr: "@@@session.user.name@@@ vient de mater les gobelins du désordre du salon !"
        en: "@@@session.user.name@@@ has just subdued the clutter goblins of the living room!"
        es: "¡@@@session.user.name@@@ acaba de someter a los trasgos del desorden del salón!"
        de: "@@@session.user.name@@@ hat gerade die Chaos-Kobolde im Wohnzimmer gebändigt!"
        it: "@@@session.user.name@@@ ha appena domato i goblin del disordine del soggiorno!"
        pt: "@@@session.user.name@@@ acabou de domar os trasgos da desarrumação da sala!"
        br: "@@@session.user.name@@@ acabou de domar os trasgos da bagunça da sala!"
        nl: "@@@session.user.name@@@ heeft net de rommelkobolden in de woonkamer getemd!"
      dt_c_salon_07:
        fr: "@@@session.user.name@@@ a tenu tête aux gobelins du désordre du salon, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ stood up to the clutter goblins of the living room, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ le plantó cara a los trasgos del desorden del salón, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ bot den Chaos-Kobolden im Wohnzimmer die Stirn, aber die Zeit reichte nicht: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha tenuto testa ai goblin del disordine del soggiorno, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ enfrentou os trasgos da desarrumação da sala, mas o tempo acabou: a aventura vai continuar!"
        br: "@@@session.user.name@@@ enfrentou os trasgos da bagunça da sala, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ bood de rommelkobolden in de woonkamer het hoofd, maar de tijd was op: het avontuur gaat verder!"
      dt_t_salon_08:
        fr: "Aspirer ou dépoussiérer le canapé"
        en: "Vacuum or dust the sofa"
        es: "Aspirar o desempolvar el sofá"
        de: "Sofa saugen oder abstauben"
        it: "Aspirare o spolverare il divano"
        pt: "Aspirar ou limpar o pó do sofá"
        br: "Aspirar ou tirar o pó do sofá"
        nl: "Bank stofzuigen of afstoffen"
      dt_a_salon_08:
        fr: "Des miettes-rampantes se nichent dans le canapé. Aspire ou dépoussière coussins et recoins jusqu'à un canapé impeccable."
        en: "Crumb-crawlers nest in the sofa. Vacuum or dust the cushions and crevices until the sofa is spotless."
        es: "Migas reptantes anidan en el sofá. Aspira o desempolva cojines y rincones hasta dejar el sofá impecable."
        de: "Krümelkrabbler nisten im Sofa. Sauge oder staube Kissen und Ritzen ab, bis das Sofa makellos ist."
        it: "Briciole striscianti fanno il nido nel divano. Aspira o spolvera cuscini e fessure finché il divano non è impeccabile."
        pt: "Migalhas rastejantes fazem ninho no sofá. Aspira ou limpa o pó das almofadas e recantos até o sofá ficar impecável."
        br: "Migalhas rastejantes fazem ninho no sofá. Aspire ou tire o pó das almofadas e cantinhos até o sofá ficar impecável."
        nl: "Kruimelkruipers nestelen zich in de bank. Zuig of stof de kussens en kieren af tot de bank smetteloos is."
      dt_d_salon_08:
        fr: "@@@session.user.name@@@ vient de déloger les miettes-rampantes du canapé !"
        en: "@@@session.user.name@@@ has just dislodged the crumb-crawlers from the sofa!"
        es: "¡@@@session.user.name@@@ acaba de expulsar las migas reptantes del sofá!"
        de: "@@@session.user.name@@@ hat gerade die Krümelkrabbler aus dem Sofa vertrieben!"
        it: "@@@session.user.name@@@ ha appena stanato le briciole striscianti dal divano!"
        pt: "@@@session.user.name@@@ acabou de desalojar as migalhas rastejantes do sofá!"
        br: "@@@session.user.name@@@ acabou de desalojar as migalhas rastejantes do sofá!"
        nl: "@@@session.user.name@@@ heeft net de kruimelkruipers uit de bank verdreven!"
      dt_c_salon_08:
        fr: "@@@session.user.name@@@ a donné l'assaut contre les miettes-rampantes du canapé, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ led the assault on the crumb-crawlers of the sofa, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ dio el asalto contra las migas reptantes del sofá, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ stürmte gegen die Krümelkrabbler im Sofa, und der Kampf dauerte länger als gedacht!"
        it: "@@@session.user.name@@@ ha dato l'assalto alle briciole striscianti del divano, e la battaglia è durata più del previsto!"
        pt: "@@@session.user.name@@@ lançou o assalto contra as migalhas rastejantes do sofá, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ partiu para o ataque contra as migalhas rastejantes do sofá, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ bestormde de kruimelkruipers in de bank, en het gevecht duurde langer dan gedacht!"
      dt_t_salon_09:
        fr: "Shampouiner ou nettoyer le canapé"
        en: "Shampoo or clean the sofa"
        es: "Lavar o limpiar el sofá"
        de: "Sofa shampoonieren oder reinigen"
        it: "Lavare o pulire il divano"
        pt: "Lavar ou limpar o sofá"
        br: "Lavar ou limpar o sofá"
        nl: "Bank shampooën of reinigen"
      dt_a_salon_09:
        fr: "Des taches-trolls se sont incrustées dans le canapé. Shampouine ou nettoie jusqu'à un tissu propre, sans tache ni odeur."
        en: "Stain-trolls have lodged themselves in the sofa. Shampoo or clean until the fabric is clean, with no stains or smell."
        es: "Manchas-troles se han incrustado en el sofá. Lava o limpia hasta dejar la tela limpia, sin manchas ni olor."
        de: "Fleckentrolle haben sich im Sofa festgesetzt. Shampooniere oder reinige, bis der Stoff sauber ist, ohne Flecken oder Geruch."
        it: "Troll-macchia si sono incrostati nel divano. Lava o pulisci finché il tessuto non è pulito, senza macchie né odori."
        pt: "Manchas-trol incrustaram-se no sofá. Lava ou limpa até o tecido ficar limpo, sem nódoas nem cheiro."
        br: "Manchas-troll se incrustaram no sofá. Lave ou limpe até o tecido ficar limpo, sem sujeira nem cheiro."
        nl: "Vlekkentrollen hebben zich in de bank vastgezet. Shampooër of reinig tot de stof schoon is, zonder vlekken of geur."
      dt_d_salon_09:
        fr: "@@@session.user.name@@@ vient de terrasser les taches-trolls du canapé !"
        en: "@@@session.user.name@@@ has just slain the stain-trolls of the sofa!"
        es: "¡@@@session.user.name@@@ acaba de derrotar a las manchas-troles del sofá!"
        de: "@@@session.user.name@@@ hat gerade die Fleckentrolle im Sofa niedergestreckt!"
        it: "@@@session.user.name@@@ ha appena atterrato i troll-macchia del divano!"
        pt: "@@@session.user.name@@@ acabou de derrotar as manchas-trol do sofá!"
        br: "@@@session.user.name@@@ acabou de derrotar as manchas-troll do sofá!"
        nl: "@@@session.user.name@@@ heeft net de vlekkentrollen in de bank geveld!"
      dt_c_salon_09:
        fr: "@@@session.user.name@@@ a croisé le fer avec les taches-trolls du canapé, et le grimoire manquait justement la bonne page !"
        en: "@@@session.user.name@@@ crossed swords with the stain-trolls of the sofa, and the spellbook was missing exactly the right page!"
        es: "¡@@@session.user.name@@@ cruzó el acero con las manchas-troles del sofá, y al grimorio le faltaba justo la página buena!"
        de: "@@@session.user.name@@@ kreuzte die Klingen mit den Fleckentrollen im Sofa, und im Zauberbuch fehlte ausgerechnet die richtige Seite!"
        it: "@@@session.user.name@@@ ha incrociato le spade con i troll-macchia del divano, e al grimorio mancava proprio la pagina giusta!"
        pt: "@@@session.user.name@@@ cruzou espadas com as manchas-trol do sofá, e ao grimório faltava justamente a página certa!"
        br: "@@@session.user.name@@@ cruzou espadas com as manchas-troll do sofá, e justamente a página certa faltava no grimório!"
        nl: "@@@session.user.name@@@ kruiste de degens met de vlekkentrollen in de bank, en in het toverboek ontbrak net de juiste bladzijde!"


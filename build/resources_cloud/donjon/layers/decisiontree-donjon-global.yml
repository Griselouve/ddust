        pt: "Golens de calcário incrustam as torneiras da casa de banho. Descalcifica até as torneiras brilharem."
        br: "Golens de calcário se incrustam nas torneiras do banheiro. Tire o calcário até as torneiras brilharem."
        nl: "Kalkgolems zetten de badkamerkranen onder de kalk. Ontkalk tot de kranen glanzen."
      dt_d_salle_de_bain_12:
        fr: "@@@session.user.name@@@ vient de briser les golems de calcaire de la robinetterie de la salle de bain !"
        en: "@@@session.user.name@@@ has just shattered the limescale golems of the bathroom taps!"
        es: "¡@@@session.user.name@@@ acaba de romper los gólems de cal de la grifería del cuarto de baño!"
        de: "@@@session.user.name@@@ hat gerade die Kalkgolems an den Badarmaturen zerschmettert!"
        it: "@@@session.user.name@@@ ha appena frantumato i golem di calcare dei rubinetti del bagno!"
        pt: "@@@session.user.name@@@ acabou de despedaçar os golens de calcário das torneiras da casa de banho!"
        br: "@@@session.user.name@@@ acabou de despedaçar os golens de calcário das torneiras do banheiro!"
        nl: "@@@session.user.name@@@ heeft net de kalkgolems van de badkamerkranen verbrijzeld!"
      dt_c_salle_de_bain_12:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les golems de calcaire de la robinetterie de la salle de bain, mais le sortilège a mal tourné au dernier moment !"

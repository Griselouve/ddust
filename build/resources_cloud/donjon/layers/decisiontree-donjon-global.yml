        de: "@@@session.user.name@@@ hat die Schmutzschnecken in der Küche gerade zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporco della cucina!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade da cozinha!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de vuilslakken van de keuken geplet!"

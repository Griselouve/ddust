        br: "@@@session.user.name@@@ aguentou firme contra as lesmas de sujeira do quarto das crianças, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ hield stand tegen de vuilslakken van de kinderkamer, maar de spreuk mislukte op het laatste moment!"
      dt_t_chambre_enfant_04:

        en: "Vacuum or sweep"
        es: "Aspirar o barrer"
        de: "Saugen oder fegen"
        it: "Aspirare o spazzare"
        pt: "Aspirar ou varrer"
        br: "Aspirar ou varrer"
        nl: "Stofzuigen of vegen"
      dt_a_chambre_enfant_01:
        fr: "Les moutons-gobelins de poussière envahissent la chambre enfant ! Aspire ou balaie jusqu'à un sol net, recoins compris."
        en: "Dust-bunny goblins overrun the children's bedroom! Vacuum or sweep until the floor is spotless, corners included."
        es: "¡Los duendes de pelusa invaden la habitación infantil! Aspira o barre hasta dejar el suelo impecable, rincones incluidos."
        de: "Wollmaus-Kobolde überrennen das Kinderzimmer! Saug oder feg, bis der Boden blitzsauber ist, Ecken inklusive."
        it: "I goblin-batuffolo di polvere invadono la cameretta dei bambini! Passa l'aspirapolvere o scopa finché il pavimento non è pulitissimo, angoli compresi."
        pt: "Os duendes de cotão invadem o quarto das crianças! Aspira ou varre até o chão ficar impecável, cantos incluídos."
        br: "Os duendes de fiapos invadem o quarto das crianças! Aspire ou varra até o chão ficar impecável, incluindo os cantos."
        nl: "Stofpluiskobolden overspoelen de kinderkamer! Stofzuig of veeg tot de vloer smetteloos is, hoekjes inbegrepen."
      dt_d_chambre_enfant_01:
        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins de la chambre enfant !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the children's bedroom!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa de la habitación infantil!"
        de: "@@@session.user.name@@@ hat die Wollmaus-Kobolde im Kinderzimmer gerade plattgemacht!"
        it: "@@@session.user.name@@@ ha appena polverizzato i goblin-batuffolo della cameretta dei bambini!"
        pt: "@@@session.user.name@@@ acabou de esmagar os duendes de cotão do quarto das crianças!"
        br: "@@@session.user.name@@@ acabou de esmagar os duendes de fiapos do quarto das crianças!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofpluiskobolden van de kinderkamer verpletterd!"
      dt_c_chambre_enfant_01:
        fr: "@@@session.user.name@@@ a tenu tête aux moutons-gobelins de la chambre enfant, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ stood up to the dust-bunny goblins of the children's bedroom, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ le plantó cara a los duendes de pelusa de la habitación infantil, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat den Wollmaus-Kobolden im Kinderzimmer die Stirn geboten, und die Laterne ist im ungünstigsten Moment ausgegangen!"
        it: "@@@session.user.name@@@ ha tenuto testa ai goblin-batuffolo della cameretta dei bambini, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ fez frente aos duendes de cotão do quarto das crianças, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ enfrentou os duendes de fiapos do quarto das crianças, e a lanterna se apagou na pior hora!"
        nl: "@@@session.user.name@@@ bood de stofpluiskobolden van de kinderkamer het hoofd, en de lantaarn doofde op het slechtste moment!"
      dt_t_chambre_enfant_02:
        fr: "Faire les poussières"
        en: "Dust"
        es: "Quitar el polvo"
        de: "Staub wischen"
        it: "Spolverare"
        pt: "Limpar o pó"
        br: "Tirar o pó"
        nl: "Afstoffen"
      dt_a_chambre_enfant_02:
        fr: "Des spectres de poussière se posent partout dans la chambre enfant. Dépoussière chaque surface jusqu'à les faire disparaître."
        en: "Dust wraiths settle all over the children's bedroom. Dust every surface until they vanish."
        es: "Espectros de polvo se posan por toda la habitación infantil. Quita el polvo de cada superficie hasta hacerlos desaparecer."
        de: "Staubgespenster lassen sich überall im Kinderzimmer nieder. Wisch jede Fläche ab, bis sie verschwunden sind."
        it: "Gli spettri di polvere si posano ovunque nella cameretta dei bambini. Spolvera ogni superficie finché non spariscono."
        pt: "Espectros de pó pousam por todo o quarto das crianças. Limpa o pó de cada superfície até desaparecerem."
        br: "Espectros de poeira pousam por todo o quarto das crianças. Tire o pó de cada superfície até eles sumirem."
        nl: "Stofspoken strijken overal in de kinderkamer neer. Stof elk oppervlak af tot ze verdwenen zijn."

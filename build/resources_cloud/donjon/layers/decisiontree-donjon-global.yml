        pt: "@@@session.user.name@@@ acabou de preparar com carinho o prato do dia a dia para saciar a guilda!"
        br: "@@@session.user.name@@@ acabou de preparar com carinho o prato do dia a dia para saciar a guilda!"
        nl: "@@@session.user.name@@@ heeft zojuist het alledaagse gerecht klaargemaakt om de gilde te voeden!"
      dt_c_repas_10:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour préparer le plat du quotidien, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ took a deep breath and started preparing the everyday meal, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a preparar el plato de diario, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um das Alltagsgericht zuzubereiten, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ha preso coraggio per preparare il piatto di tutti i giorni, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ ganhou coragem para preparar o prato do dia a dia, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ tomou coragem para preparar o prato do dia a dia, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ verzamelde alle moed om het alledaagse gerecht te maken, en de lantaarn doofde voor het einde!"

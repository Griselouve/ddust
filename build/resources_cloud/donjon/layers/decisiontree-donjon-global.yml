        de: "@@@session.user.name@@@ hat gerade die Laub-Koboldhaufen im Garten eingesammelt!"
        it: "@@@session.user.name@@@ ha appena raccolto i mucchi-goblin di foglie del giardino!"
        pt: "@@@session.user.name@@@ acabou de apanhar os montes-trasgo de folhas do jardim!"
        br: "@@@session.user.name@@@ acabou de recolher os montes-trasgo de folhas do jardim!"
        nl: "@@@session.user.name@@@ heeft net de koboldhopen van bladeren in de tuin opgeruimd!"

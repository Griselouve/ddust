        es: "Cocinar un plato de diario"
        de: "Ein Alltagsgericht kochen"
        it: "Cucinare un piatto di tutti i giorni"
        pt: "Fazer um prato do dia a dia"
        br: "Fazer um prato do dia a dia"
        nl: "Een alledaags gerecht maken"

        fr: "Le garde-manger se vide et nul ne sait quoi acheter. Inspecte les réserves et dresse la liste des courses complète."
        en: "The pantry empties and no one knows what to buy. Check the stocks and draw up the full shopping list."
        es: "La despensa se vacía y nadie sabe qué comprar. Revisa las reservas y elabora la lista de la compra completa."
        de: "Die Vorratskammer leert sich und niemand weiß, was fehlt. Prüf die Vorräte und schreib die vollständige Einkaufsliste."
        it: "La dispensa si svuota e nessuno sa cosa comprare. Controlla le scorte e compila la lista della spesa completa."
        pt: "A despensa está a ficar vazia e ninguém sabe o que comprar. Verifica as reservas e faz a lista de compras completa."
        br: "A despensa está ficando vazia e ninguém sabe o que comprar. Confira o estoque e faça a lista de compras completa."
        nl: "De voorraadkast raakt leeg en niemand weet wat er gekocht moet worden. Controleer de voorraad en maak het volledige boodschappenlijstje."

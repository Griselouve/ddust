        fr: "@@@session.user.name@@@ vient de nourrir le familier affamé !"
        en: "@@@session.user.name@@@ has just fed the hungry familiar!"
        es: "¡@@@session.user.name@@@ acaba de alimentar al familiar hambriento!"
        de: "@@@session.user.name@@@ hat gerade das hungrige Zaubertier gefüttert!"
        it: "@@@session.user.name@@@ ha appena sfamato il famiglio affamato!"
        pt: "@@@session.user.name@@@ acabou de alimentar o familiar esfomeado!"
        br: "@@@session.user.name@@@ acabou de alimentar o familiar esfomeado!"
        nl: "@@@session.user.name@@@ heeft zojuist het hongerige toverdier gevoerd!"

        it: "Preparare un pasto gourmet"
        pt: "Preparar uma refeição gourmet"
        br: "Preparar uma refeição gourmet"
        nl: "Een feestmaal bereiden"
      dt_a_repas_11:
        fr: "Un festin de légende est attendu. Compose un repas gastronomique à plusieurs plats, digne d'un banquet, et dresse-le avec soin."
        en: "A legendary feast is expected. Compose a multi-course gourmet meal worthy of a banquet, and plate it with care."
        es: "Se espera un festín de leyenda. Compón una comida gastronómica de varios platos, digna de un banquete, y emplátala con esmero."
        de: "Ein legendäres Festmahl wird erwartet. Stell ein Gourmetmenü aus mehreren Gängen zusammen, eines Banketts würdig, und richte es liebevoll an."
        it: "È atteso un banchetto leggendario. Componi un pasto gourmet di più portate, degno di un banchetto, e impiattalo con cura."
        pt: "Espera-se um festim lendário. Compõe uma refeição gourmet com vários pratos, digna de um banquete, e emprata-a com esmero."
        br: "Um banquete lendário espera por você. Prepare uma refeição gourmet com vários pratos, digna de um festim, e capriche na apresentação."
        nl: "Er wordt een legendarisch feestmaal verwacht. Stel een gastronomische maaltijd met meerdere gangen samen, een banket waardig, en richt hem zorgvuldig aan."
      dt_d_repas_11:
        fr: "@@@session.user.name@@@ vient de dresser un festin gastronomique digne des légendes !"
        en: "@@@session.user.name@@@ has just laid out a gourmet feast worthy of legend!"
        es: "¡@@@session.user.name@@@ acaba de servir un festín gastronómico digno de leyenda!"
        de: "@@@session.user.name@@@ hat gerade ein legendäres Festmahl aufgetischt!"
        it: "@@@session.user.name@@@ ha appena servito un banchetto gourmet degno delle leggende!"
        pt: "@@@session.user.name@@@ acabou de servir um festim gourmet digno das lendas!"
        br: "@@@session.user.name@@@ acabou de servir um banquete gourmet digno das lendas!"
        nl: "@@@session.user.name@@@ heeft zojuist een gastronomisch feestmaal opgediend dat legendes waardig is!"
      dt_c_repas_11:
        fr: "@@@session.user.name@@@ a croisé le fer avec le festin gastronomique, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ crossed swords with the gourmet feast, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ cruzó el acero con el festín gastronómico, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat mit dem Festmahl die Klingen gekreuzt, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha incrociato la spada con il banchetto gourmet, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ cruzou espadas com o festim gourmet, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ cruzou espadas com o banquete gourmet, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ kruiste de degens met het gastronomische feestmaal, maar de tijd was op: het avontuur gaat verder!"

      #------------- Tâches — vaisselle --------------------------------

      dt_t_vaisselle_01:
        fr: "Faire une petite vaisselle"
        en: "Do a small washing-up"
        es: "Lavar unos pocos platos"
        de: "Ein bisschen abspülen"
        it: "Lavare pochi piatti"
        pt: "Lavar pouca loiça"
        br: "Lavar pouca louça"
        nl: "Een kleine afwas doen"
      dt_a_vaisselle_01:
        fr: "Une pile d'assiettes-golems crasseuses s'entasse dans l'évier. Fais la vaisselle jusqu'à ce que tout soit propre et rangé à sécher."
        en: "A stack of grimy plate-golems piles up in the sink. Do the washing-up until everything is clean and set to dry."
        es: "Una pila de platos-gólem mugrientos se amontona en el fregadero. Lava los platos hasta que todo quede limpio y puesto a secar."
        de: "Ein Stapel schmutziger Teller-Golems türmt sich in der Spüle. Spül ab, bis alles sauber ist und zum Trocknen steht."
        it: "Una pila di piatti-golem sudici si ammucchia nel lavello. Lava i piatti finché tutto non è pulito e messo ad asciugare."
        pt: "Uma pilha de pratos-golem sujos amontoa-se no lava-loiça. Lava a loiça até tudo ficar limpo e posto a secar."
        br: "Uma pilha de pratos-golem sujos se amontoa na pia. Lave a louça até tudo ficar limpo e escorrendo."
        nl: "Een stapel smoezelige bordgolems torent op in de gootsteen. Doe de afwas tot alles schoon is en staat te drogen."
      dt_d_vaisselle_01:
        fr: "@@@session.user.name@@@ vient de terrasser la pile d'assiettes-golems de l'évier !"
        en: "@@@session.user.name@@@ has just slain the stack of plate-golems in the sink!"
        es: "¡@@@session.user.name@@@ acaba de derrotar la pila de platos-gólem del fregadero!"
        de: "@@@session.user.name@@@ hat den Stapel Teller-Golems in der Spüle gerade besiegt!"
        it: "@@@session.user.name@@@ ha appena sconfitto la pila di piatti-golem del lavello!"
        pt: "@@@session.user.name@@@ acabou de derrotar a pilha de pratos-golem do lava-loiça!"
        br: "@@@session.user.name@@@ acabou de derrotar a pilha de pratos-golem da pia!"
        nl: "@@@session.user.name@@@ heeft zojuist de stapel bordgolems in de gootsteen verslagen!"
      dt_c_vaisselle_01:
        fr: "@@@session.user.name@@@ a croisé le fer avec la pile d'assiettes-golems de l'évier, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ crossed swords with the stack of plate-golems in the sink, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ cruzó el acero con la pila de platos-gólem del fregadero, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat mit dem Stapel Teller-Golems in der Spüle die Klingen gekreuzt, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha incrociato la spada con la pila di piatti-golem del lavello, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ cruzou espadas com a pilha de pratos-golem do lava-loiça, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ cruzou espadas com a pilha de pratos-golem da pia, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ kruiste de degens met de stapel bordgolems in de gootsteen, maar de vijand had een val gezet!"
      dt_t_vaisselle_02:
        fr: "Faire une grosse vaisselle"
        en: "Do a big washing-up"
        es: "Lavar muchos platos"
        de: "Einen großen Abwasch machen"
        it: "Lavare tanti piatti"
        pt: "Lavar muita loiça"
        br: "Lavar muita louça"
        nl: "Een grote afwas doen"
      dt_a_vaisselle_02:
        fr: "Une montagne d'assiettes-golems crasseuses déborde de l'évier après le festin. Lave toute la grosse vaisselle jusqu'à ce que tout soit propre et rangé à sécher."
        en: "A mountain of grimy plate-golems overflows the sink after the feast. Tackle the whole big washing-up until everything is clean and set to dry."
        es: "Una montaña de platos-gólem mugrientos desborda el fregadero tras el festín. Lava toda la vajilla hasta que todo quede limpio y puesto a secar."
        de: "Nach dem Festmahl quillt ein Berg schmutziger Teller-Golems aus der Spüle. Spül den ganzen großen Abwasch, bis alles sauber ist und zum Trocknen steht."
        it: "Dopo il banchetto, una montagna di piatti-golem sudici trabocca dal lavello. Lava tutte le stoviglie finché tutto non è pulito e messo ad asciugare."
        pt: "Depois do festim, uma montanha de pratos-golem sujos transborda do lava-loiça. Lava a loiça toda até tudo ficar limpo e posto a secar."
        br: "Depois do banquete, uma montanha de pratos-golem sujos transborda da pia. Lave toda a louça até tudo ficar limpo e escorrendo."
        nl: "Na het feestmaal puilt een berg smoezelige bordgolems uit de gootsteen. Doe de hele grote afwas tot alles schoon is en staat te drogen."
      dt_d_vaisselle_02:
        fr: "@@@session.user.name@@@ vient de terrasser la montagne d'assiettes-golems de l'évier !"
        en: "@@@session.user.name@@@ has just slain the mountain of plate-golems in the sink!"
        es: "¡@@@session.user.name@@@ acaba de derrotar la montaña de platos-gólem del fregadero!"
        de: "@@@session.user.name@@@ hat den Berg Teller-Golems in der Spüle gerade besiegt!"
        it: "@@@session.user.name@@@ ha appena sconfitto la montagna di piatti-golem del lavello!"
        pt: "@@@session.user.name@@@ acabou de derrotar a montanha de pratos-golem do lava-loiça!"
        br: "@@@session.user.name@@@ acabou de derrotar a montanha de pratos-golem da pia!"
        nl: "@@@session.user.name@@@ heeft zojuist de berg bordgolems in de gootsteen verslagen!"
      dt_c_vaisselle_02:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre la montagne d'assiettes-golems de l'évier, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ fought bravely against the mountain of plate-golems in the sink, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra la montaña de platos-gólem del fregadero, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat tapfer gegen den Berg Teller-Golems in der Spüle gekämpft, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro la montagna di piatti-golem del lavello, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ lutou com bravura contra a montanha de pratos-golem do lava-loiça, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ lutou com bravura contra a montanha de pratos-golem da pia, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de berg bordgolems in de gootsteen, maar de nacht viel over de kerker voor het einde!"
      dt_t_vaisselle_03:
        fr: "Remplir le lave-vaisselle"
        en: "Load the dishwasher"
        es: "Llenar el lavavajillas"
        de: "Spülmaschine einräumen"
        it: "Caricare la lavastoviglie"
        pt: "Encher a máquina da loiça"
        br: "Encher a lava-louças"
        nl: "Vaatwasser inruimen"
      dt_a_vaisselle_03:
        fr: "La vaisselle sale s'amoncelle en horde devant le lave-vaisselle. Charge-le entièrement et lance le cycle."
        en: "Dirty dishes gather in a horde by the dishwasher. Load it fully and start the cycle."
        es: "Los platos sucios se reúnen en horda junto al lavavajillas. Cárgalo por completo y pon el ciclo."
        de: "Schmutziges Geschirr sammelt sich als Horde vor der Spülmaschine. Räum sie ganz ein und starte das Programm."
        it: "Le stoviglie sporche si radunano in un'orda davanti alla lavastoviglie. Caricala tutta e avvia il lavaggio."
        pt: "A loiça suja junta-se em horda ao lado da máquina da loiça. Carrega-a por completo e liga o programa."
        br: "A louça suja se junta em horda ao lado da lava-louças. Encha a máquina por completo e ligue o programa."
        nl: "Vuile vaat verzamelt zich als een horde bij de vaatwasser. Ruim hem helemaal in en start het programma."
      dt_d_vaisselle_03:
        fr: "@@@session.user.name@@@ vient d'enfermer la horde de vaisselle dans le lave-vaisselle !"
        en: "@@@session.user.name@@@ has just locked the horde of dishes into the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de encerrar la horda de platos en el lavavajillas!"
        de: "@@@session.user.name@@@ hat die Geschirrhorde gerade in der Spülmaschine eingesperrt!"
        it: "@@@session.user.name@@@ ha appena rinchiuso l'orda di stoviglie nella lavastoviglie!"
        pt: "@@@session.user.name@@@ acabou de fechar a horda de loiça dentro da máquina!"
        br: "@@@session.user.name@@@ acabou de trancar a horda de louça dentro da máquina!"
        nl: "@@@session.user.name@@@ heeft zojuist de vaathorde in de vaatwasser opgesloten!"
      dt_c_vaisselle_03:
        fr: "@@@session.user.name@@@ a tenu tête à la horde de vaisselle du lave-vaisselle, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ stood up to the horde of dishes by the dishwasher, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ le plantó cara a la horda de platos del lavavajillas, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hat der Geschirrhorde vor der Spülmaschine die Stirn geboten, und der Kampf hat länger gedauert als gedacht!"
        it: "@@@session.user.name@@@ ha tenuto testa all'orda di stoviglie della lavastoviglie, e il combattimento è durato più del previsto!"
        pt: "@@@session.user.name@@@ fez frente à horda de loiça da máquina, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ enfrentou a horda de louça da máquina, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ bood de vaathorde bij de vaatwasser het hoofd, en het gevecht duurde langer dan verwacht!"
      dt_t_vaisselle_04:
        fr: "Vider le lave-vaisselle"
        en: "Unload the dishwasher"
        es: "Vaciar el lavavajillas"
        de: "Spülmaschine ausräumen"
        it: "Svuotare la lavastoviglie"
        pt: "Esvaziar a máquina da loiça"
        br: "Esvaziar a lava-louças"
        nl: "Vaatwasser uitruimen"
      dt_a_vaisselle_04:
        fr: "Le lave-vaisselle regorge de vaisselle propre prisonnière. Vide-le et range chaque pièce à sa place."
        en: "The dishwasher is full of trapped clean dishes. Unload it and put every piece back in its place."
        es: "El lavavajillas está lleno de vajilla limpia atrapada. Vacíalo y guarda cada pieza en su sitio."
        de: "In der Spülmaschine ist jede Menge sauberes Geschirr gefangen. Räum sie aus und stell jedes Teil an seinen Platz."
        it: "La lavastoviglie è piena di stoviglie pulite prigioniere. Svuotala e metti ogni pezzo al suo posto."
        pt: "A máquina da loiça está cheia de loiça limpa prisioneira. Esvazia-a e arruma cada peça no seu lugar."
        br: "A lava-louças está cheia de louça limpa prisioneira. Esvazie a máquina e guarde cada peça no lugar."
        nl: "De vaatwasser zit vol gevangen schone vaat. Ruim hem uit en zet elk stuk terug op zijn plek."
      dt_d_vaisselle_04:
        fr: "@@@session.user.name@@@ vient de libérer la vaisselle prisonnière du lave-vaisselle !"
        en: "@@@session.user.name@@@ has just freed the trapped dishes from the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de liberar la vajilla atrapada del lavavajillas!"
        de: "@@@session.user.name@@@ hat das gefangene Geschirr gerade aus der Spülmaschine befreit!"
        it: "@@@session.user.name@@@ ha appena liberato le stoviglie prigioniere della lavastoviglie!"
        pt: "@@@session.user.name@@@ acabou de libertar a loiça prisioneira da máquina!"
        br: "@@@session.user.name@@@ acabou de libertar a louça prisioneira da máquina!"
        nl: "@@@session.user.name@@@ heeft zojuist de gevangen vaat uit de vaatwasser bevrijd!"
      dt_c_vaisselle_04:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour vider le lave-vaisselle, mais le temps a manqué avant la victoire !"
        en: "@@@session.user.name@@@ took a deep breath and started unloading the dishwasher, but time ran out before victory!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a vaciar el lavavajillas, pero se acabó el tiempo antes de la victoria!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um die Spülmaschine auszuräumen, aber vor dem Sieg wurde die Zeit knapp!"
        it: "@@@session.user.name@@@ ha preso coraggio per svuotare la lavastoviglie, ma il tempo è finito prima della vittoria!"
        pt: "@@@session.user.name@@@ ganhou coragem para esvaziar a máquina da loiça, mas o tempo acabou antes da vitória!"
        br: "@@@session.user.name@@@ tomou coragem para esvaziar a lava-louças, mas o tempo acabou antes da vitória!"
        nl: "@@@session.user.name@@@ verzamelde alle moed om de vaatwasser uit te ruimen, maar de tijd was op voor de overwinning!"
      dt_t_vaisselle_05:
        fr: "Sécher la vaisselle"
        en: "Dry the dishes"
        es: "Secar los platos"
        de: "Geschirr abtrocknen"
        it: "Asciugare i piatti"
        pt: "Secar a loiça"
        br: "Secar a louça"
        nl: "Afdrogen"
      dt_a_vaisselle_05:
        fr: "La vaisselle propre ruisselle encore, prisonnière d'une nuée de gouttes. Sèche chaque pièce au torchon jusqu'à ce que tout soit sec et rangé."
        en: "The clean dishes are still dripping, held captive by a swarm of droplets. Dry every piece with a cloth until everything is dry and put away."
        es: "La vajilla limpia aún chorrea, prisionera de un enjambre de gotas. Seca cada pieza con un paño hasta que todo quede seco y guardado."
        de: "Das saubere Geschirr tropft noch, gefangen von einem Tropfenschwarm. Trockne jedes Teil mit dem Geschirrtuch ab, bis alles trocken und weggeräumt ist."
        it: "Le stoviglie pulite gocciolano ancora, prigioniere di uno sciame di gocce. Asciuga ogni pezzo con lo strofinaccio finché tutto non è asciutto e riposto."
        pt: "A loiça limpa ainda escorre, prisioneira de um enxame de gotas. Seca cada peça com o pano até tudo ficar seco e arrumado."
        br: "A louça limpa ainda escorre, prisioneira de um enxame de gotas. Seque cada peça com o pano até tudo ficar seco e guardado."
        nl: "De schone vaat druipt nog, gevangen door een druppelzwerm. Droog elk stuk af met de theedoek tot alles droog en opgeruimd is."
      dt_d_vaisselle_05:
        fr: "@@@session.user.name@@@ vient de chasser la nuée de gouttes de la vaisselle !"
        en: "@@@session.user.name@@@ has just driven the swarm of droplets off the dishes!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar el enjambre de gotas de la vajilla!"
        de: "@@@session.user.name@@@ hat den Tropfenschwarm gerade vom Geschirr vertrieben!"
        it: "@@@session.user.name@@@ ha appena scacciato lo sciame di gocce dalle stoviglie!"
        pt: "@@@session.user.name@@@ acabou de afugentar o enxame de gotas da loiça!"
        br: "@@@session.user.name@@@ acabou de espantar o enxame de gotas da louça!"
        nl: "@@@session.user.name@@@ heeft zojuist de druppelzwerm van de vaat verjaagd!"
      dt_c_vaisselle_05:
        fr: "@@@session.user.name@@@ a retroussé ses manches pour sécher la vaisselle ruisselante, et le donjon en redemande déjà !"
        en: "@@@session.user.name@@@ rolled up both sleeves for drying the dripping dishes, and the dungeon is already asking for more!"
        es: "¡@@@session.user.name@@@ se remangó para secar la vajilla chorreante, y la mazmorra ya pide más!"
        de: "@@@session.user.name@@@ hat die Ärmel hochgekrempelt, um das tropfende Geschirr abzutrocknen, und der Kerker will schon mehr!"
        it: "@@@session.user.name@@@ ha tirato su le maniche per asciugare le stoviglie gocciolanti, e il dungeon ne chiede già ancora!"
        pt: "@@@session.user.name@@@ arregaçou as mangas para secar a loiça a escorrer, e a masmorra já pede mais!"
        br: "@@@session.user.name@@@ arregaçou as mangas para secar a louça escorrendo, e a masmorra já pede mais!"
        nl: "@@@session.user.name@@@ stroopte de mouwen op om de druipende vaat af te drogen, en de kerker vraagt al om meer!"
      dt_t_vaisselle_06:
        fr: "Ranger la vaisselle"
        en: "Put away the dishes"
        es: "Guardar la vajilla"
        de: "Geschirr wegräumen"
        it: "Mettere via i piatti"
        pt: "Arrumar a loiça"
        br: "Guardar a louça"
        nl: "Vaat opruimen"
      dt_a_vaisselle_06:
        fr: "La vaisselle propre et sèche s'entasse en pile branlante sur l'égouttoir. Range chaque pièce dans les placards jusqu'à un plan de travail dégagé."
        en: "The clean, dry dishes pile up in a wobbly stack on the rack. Put every piece away in the cupboards until the worktop is clear."
        es: "La vajilla limpia y seca se amontona en una pila tambaleante en el escurridor. Guarda cada pieza en los armarios hasta despejar la encimera."
        de: "Das saubere, trockene Geschirr stapelt sich wackelig auf dem Abtropfgestell. Räum jedes Teil in die Schränke, bis die Arbeitsplatte frei ist."
        it: "Le stoviglie pulite e asciutte si ammucchiano in una pila traballante sullo scolapiatti. Riponi ogni pezzo nei pensili finché il piano di lavoro non è libero."
        pt: "A loiça limpa e seca amontoa-se numa pilha periclitante no escorredor. Arruma cada peça nos armários até a bancada ficar livre."
        br: "A louça limpa e seca se amontoa numa pilha bamba no escorredor. Guarde cada peça nos armários até a bancada ficar livre."
        nl: "De schone, droge vaat stapelt zich wankel op in het afdruiprek. Zet elk stuk in de kastjes tot het aanrecht leeg is."
      dt_d_vaisselle_06:
        fr: "@@@session.user.name@@@ vient de faire s'effondrer la pile de vaisselle dans les placards !"
        en: "@@@session.user.name@@@ has just cleared the wobbling stack of dishes into the cupboards!"
        es: "¡@@@session.user.name@@@ acaba de guardar la tambaleante pila de vajilla en los armarios!"
        de: "@@@session.user.name@@@ hat den wackeligen Geschirrstapel gerade in die Schränke verbannt!"
        it: "@@@session.user.name@@@ ha appena fatto sparire la pila traballante di stoviglie nei pensili!"
        pt: "@@@session.user.name@@@ acabou de arrumar a pilha periclitante de loiça nos armários!"
        br: "@@@session.user.name@@@ acabou de guardar a pilha bamba de louça nos armários!"
        nl: "@@@session.user.name@@@ heeft zojuist de wankele stapel vaat in de kastjes laten verdwijnen!"
      dt_c_vaisselle_06:
        fr: "@@@session.user.name@@@ a bataillé pour ranger la pile de vaisselle, et le donjon en redemande déjà !"
        en: "@@@session.user.name@@@ battled away at putting away the stack of dishes, and the dungeon is already asking for more!"
        es: "¡@@@session.user.name@@@ batalló para guardar la pila de vajilla, y la mazmorra ya pide más!"
        de: "@@@session.user.name@@@ hat gekämpft, um den Geschirrstapel wegzuräumen, und der Kerker will schon mehr!"
        it: "@@@session.user.name@@@ ha lottato per mettere via la pila di stoviglie, e il dungeon ne chiede già ancora!"
        pt: "@@@session.user.name@@@ batalhou para arrumar a pilha de loiça, e a masmorra já pede mais!"
        br: "@@@session.user.name@@@ batalhou para guardar a pilha de louça, e a masmorra já pede mais!"
        nl: "@@@session.user.name@@@ worstelde met het opruimen van de stapel vaat, en de kerker vraagt al om meer!"
      dt_t_vaisselle_07:
        fr: "Mettre la table"
        en: "Set the table"
        es: "Poner la mesa"
        de: "Tisch decken"
        it: "Apparecchiare la tavola"
        pt: "Pôr a mesa"
        br: "Pôr a mesa"
        nl: "Tafel dekken"
      dt_a_vaisselle_07:
        fr: "Le festin approche et la table est nue. Dresse-la complètement : couverts, assiettes et verres pour chaque convive."
        en: "The feast is coming and the table is bare. Set it fully: cutlery, plates and glasses for every guest."
        es: "El festín se acerca y la mesa está desnuda. Ponla por completo: cubiertos, platos y vasos para cada comensal."
        de: "Das Festmahl naht und der Tisch ist leer. Deck ihn komplett: Besteck, Teller und Gläser für jeden Gast."
        it: "Il banchetto si avvicina e la tavola è vuota. Apparecchiala per bene: posate, piatti e bicchieri per ogni commensale."
        pt: "O festim aproxima-se e a mesa está vazia. Põe-na por completo: talheres, pratos e copos para cada conviva."
        br: "O banquete está chegando e a mesa está vazia. Arrume a mesa por completo: talheres, pratos e copos para cada convidado."
        nl: "Het feestmaal komt eraan en de tafel is leeg. Dek hem helemaal: bestek, borden en glazen voor elke gast."
      dt_d_vaisselle_07:
        fr: "@@@session.user.name@@@ vient de dresser la table pour le festin !"
        en: "@@@session.user.name@@@ has just set the table for the feast!"
        es: "¡@@@session.user.name@@@ acaba de poner la mesa para el festín!"
        de: "@@@session.user.name@@@ hat gerade den Tisch für das Festmahl gedeckt!"
        it: "@@@session.user.name@@@ ha appena apparecchiato la tavola per il banchetto!"
        pt: "@@@session.user.name@@@ acabou de pôr a mesa para o festim!"
        br: "@@@session.user.name@@@ acabou de pôr a mesa para o banquete!"
        nl: "@@@session.user.name@@@ heeft zojuist de tafel gedekt voor het feestmaal!"
      dt_c_vaisselle_07:
        fr: "@@@session.user.name@@@ y a mis toute son énergie pour dresser la table du festin, mais un dragon est passé par là au mauvais moment !"
        en: "@@@session.user.name@@@ threw every bit of energy into setting the table for the feast, but a dragon flew past at the worst moment!"
        es: "¡@@@session.user.name@@@ echó toda su energía en poner la mesa del festín, pero pasó un dragón en el peor momento!"
        de: "@@@session.user.name@@@ hat alle Energie ins Tischdecken für das Festmahl gesteckt, aber im ungünstigsten Moment flog ein Drache vorbei!"
        it: "@@@session.user.name@@@ ci ha messo tutta l'energia per apparecchiare la tavola del banchetto, ma è passato un drago nel momento peggiore!"
        pt: "@@@session.user.name@@@ pôs toda a energia a pôr a mesa do festim, mas passou um dragão no pior momento!"
        br: "@@@session.user.name@@@ colocou toda a energia para pôr a mesa do banquete, mas passou um dragão na pior hora!"
        nl: "@@@session.user.name@@@ stak alle energie in het dekken van de feesttafel, maar er vloog een draak voorbij op het slechtste moment!"
      dt_t_vaisselle_08:
        fr: "Débarrasser la table"
        en: "Clear the table"
        es: "Quitar la mesa"
        de: "Tisch abräumen"
        it: "Sparecchiare la tavola"
        pt: "Levantar a mesa"
        br: "Tirar a mesa"
        nl: "Tafel afruimen"
      dt_a_vaisselle_08:
        fr: "Après le festin, la table croule sous les reliefs. Débarrasse tout jusqu'à une table nette."
        en: "After the feast, the table is buried under leftovers. Clear everything until the table is bare and clean."
        es: "Tras el festín, la mesa se hunde bajo las sobras. Recógelo todo hasta dejar la mesa despejada y limpia."
        de: "Nach dem Festmahl biegt sich der Tisch unter den Resten. Räum alles ab, bis der Tisch leer und sauber ist."
        it: "Dopo il banchetto, la tavola crolla sotto gli avanzi. Sparecchia tutto finché la tavola non è libera e pulita."
        pt: "Depois do festim, a mesa verga sob os restos. Levanta tudo até a mesa ficar livre e limpa."
        br: "Depois do banquete, a mesa verga sob os restos. Tire tudo até a mesa ficar livre e limpa."
        nl: "Na het feestmaal bezwijkt de tafel onder de restjes. Ruim alles af tot de tafel leeg en schoon is."
      dt_d_vaisselle_08:
        fr: "@@@session.user.name@@@ vient de débarrasser la table du festin !"
        en: "@@@session.user.name@@@ has just cleared the table after the feast!"
        es: "¡@@@session.user.name@@@ acaba de recoger la mesa del festín!"
        de: "@@@session.user.name@@@ hat gerade den Tisch nach dem Festmahl abgeräumt!"
        it: "@@@session.user.name@@@ ha appena sparecchiato la tavola del banchetto!"
        pt: "@@@session.user.name@@@ acabou de levantar a mesa do festim!"
        br: "@@@session.user.name@@@ acabou de tirar a mesa do banquete!"
        nl: "@@@session.user.name@@@ heeft zojuist de tafel na het feestmaal afgeruimd!"
      dt_c_vaisselle_08:
        fr: "@@@session.user.name@@@ a mis du cœur à débarrasser la table du festin, et il en restait encore un peu à la fin !"
        en: "@@@session.user.name@@@ put real heart into clearing the table after the feast, and a little was still left at the end!"
        es: "¡@@@session.user.name@@@ puso mucho empeño en recoger la mesa del festín, y todavía quedaba un poco al final!"
        de: "@@@session.user.name@@@ hat mit ganzem Herzen den Tisch nach dem Festmahl abgeräumt, und am Ende war noch ein bisschen übrig!"
        it: "@@@session.user.name@@@ ci ha messo il cuore per sparecchiare la tavola del banchetto, e alla fine restava ancora qualcosa!"
        pt: "@@@session.user.name@@@ pôs todo o coração a levantar a mesa do festim, e ainda sobrava um pouco no fim!"
        br: "@@@session.user.name@@@ colocou todo o coração para tirar a mesa do banquete, e ainda sobrou um pouco no fim!"
        nl: "@@@session.user.name@@@ ruimde met hart en ziel de tafel af na het feestmaal, en aan het eind was er nog een beetje over!"
      dt_t_vaisselle_09:
        fr: "Entretenir le lave-vaisselle"
        en: "Maintain the dishwasher"
        es: "Mantener el lavavajillas"
        de: "Spülmaschine pflegen"
        it: "Curare la lavastoviglie"
        pt: "Cuidar da máquina da loiça"
        br: "Cuidar da lava-louças"
        nl: "Vaatwasser onderhouden"
      dt_a_vaisselle_09:
        fr: "Un golem de filtre encrassé ralentit le lave-vaisselle. Nettoie le filtre et lance un cycle à vide jusqu'à un appareil sain."
        en: "A clogged-filter golem slows the dishwasher. Clean the filter and run an empty cycle until the machine is fresh."
        es: "Un gólem de filtro atascado ralentiza el lavavajillas. Limpia el filtro y pon un ciclo en vacío hasta dejar la máquina sana."
        de: "Ein verstopfter Filter-Golem bremst die Spülmaschine. Reinige den Filter und lass ein Programm leer laufen, bis das Gerät wieder frisch ist."
        it: "Un golem del filtro intasato rallenta la lavastoviglie. Pulisci il filtro e avvia un lavaggio a vuoto finché la macchina non è sana."
        pt: "Um golem do filtro entupido abranda a máquina da loiça. Limpa o filtro e liga um programa em vazio até a máquina ficar saudável."
        br: "Um golem do filtro entupido deixa a lava-louças lenta. Limpe o filtro e ligue um ciclo vazio até a máquina ficar saudável."
        nl: "Een verstopte filtergolem vertraagt de vaatwasser. Maak het filter schoon en laat een leeg programma draaien tot het apparaat weer fris is."
      dt_d_vaisselle_09:
        fr: "@@@session.user.name@@@ vient de terrasser le golem de filtre du lave-vaisselle !"
        en: "@@@session.user.name@@@ has just slain the filter golem of the dishwasher!"
        es: "¡@@@session.user.name@@@ acaba de derrotar al gólem de filtro del lavavajillas!"
        de: "@@@session.user.name@@@ hat den Filter-Golem der Spülmaschine gerade besiegt!"
        it: "@@@session.user.name@@@ ha appena sconfitto il golem del filtro della lavastoviglie!"
        pt: "@@@session.user.name@@@ acabou de derrotar o golem do filtro da máquina da loiça!"
        br: "@@@session.user.name@@@ acabou de derrotar o golem do filtro da lava-louças!"
        nl: "@@@session.user.name@@@ heeft zojuist de filtergolem van de vaatwasser verslagen!"
      dt_c_vaisselle_09:
        fr: "@@@session.user.name@@@ a tenu bon face au golem de filtre du lave-vaisselle, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ held the line against the filter golem of the dishwasher, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ aguantó firme frente al gólem de filtro del lavavajillas, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat dem Filter-Golem der Spülmaschine standgehalten, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha tenuto duro contro il golem del filtro della lavastoviglie, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ aguentou firme contra o golem do filtro da máquina da loiça, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ resistiu firme contra o golem do filtro da lava-louças, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ hield stand tegen de filtergolem van de vaatwasser, maar de tijd was op: het avontuur gaat verder!"

      #------------- Tâches — salle de bain ----------------------------

      dt_t_salle_de_bain_01:
        fr: "Aspirer ou balayer"
        en: "Vacuum or sweep"
        es: "Aspirar o barrer"
        de: "Saugen oder fegen"
        it: "Aspirare o spazzare"
        pt: "Aspirar ou varrer"
        br: "Aspirar ou varrer"
        nl: "Stofzuigen of vegen"
      dt_a_salle_de_bain_01:
        fr: "Les moutons-gobelins de poussière envahissent la salle de bain ! Aspire ou balaie jusqu'à un sol net, recoins compris."
        en: "Dust-bunny goblins overrun the bathroom! Vacuum or sweep until the floor is spotless, corners included."
        es: "¡Los duendes de pelusa invaden el cuarto de baño! Aspira o barre hasta dejar el suelo impecable, rincones incluidos."
        de: "Wollmaus-Kobolde überrennen das Badezimmer! Saug oder feg, bis der Boden blitzsauber ist, Ecken inklusive."
        it: "I goblin-batuffolo di polvere invadono il bagno! Passa l'aspirapolvere o scopa finché il pavimento non è pulitissimo, angoli compresi."
        pt: "Os duendes de cotão invadem a casa de banho! Aspira ou varre até o chão ficar impecável, cantos incluídos."
        br: "Os duendes de fiapos invadem o banheiro! Aspire ou varra até o chão ficar impecável, cantos incluídos."
        nl: "Stofpluiskobolden overspoelen de badkamer! Stofzuig of veeg tot de vloer smetteloos is, hoekjes inbegrepen."
      dt_d_salle_de_bain_01:
        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins de la salle de bain !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the bathroom!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa del cuarto de baño!"
        de: "@@@session.user.name@@@ hat die Wollmaus-Kobolde im Badezimmer gerade plattgemacht!"
        it: "@@@session.user.name@@@ ha appena polverizzato i goblin-batuffolo del bagno!"
        pt: "@@@session.user.name@@@ acabou de esmagar os duendes de cotão da casa de banho!"
        br: "@@@session.user.name@@@ acabou de esmagar os duendes de fiapos do banheiro!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofpluiskobolden van de badkamer verpletterd!"
      dt_c_salle_de_bain_01:
        fr: "@@@session.user.name@@@ a livré un beau combat contre les moutons-gobelins de la salle de bain, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ put up a fine fight against the dust-bunny goblins of the bathroom, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra los duendes de pelusa del cuarto de baño, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit den Wollmaus-Kobolden im Badezimmer geliefert, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha combattuto una bella battaglia contro i goblin-batuffolo del bagno, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ travou um belo combate contra os duendes de cotão da casa de banho, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ travou um belo combate contra os duendes de fiapos do banheiro, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de stofpluiskobolden van de badkamer, maar de vijand had een val gezet!"
      dt_t_salle_de_bain_02:
        fr: "Faire les poussières"
        en: "Dust"
        es: "Quitar el polvo"
        de: "Staub wischen"
        it: "Spolverare"
        pt: "Limpar o pó"
        br: "Tirar o pó"
        nl: "Afstoffen"
      dt_a_salle_de_bain_02:
        fr: "Des spectres de poussière se posent partout dans la salle de bain. Dépoussière chaque surface jusqu'à les faire disparaître."
        en: "Dust wraiths settle all over the bathroom. Dust every surface until they vanish."
        es: "Espectros de polvo se posan por todo el cuarto de baño. Quita el polvo de cada superficie hasta hacerlos desaparecer."
        de: "Staubgespenster lassen sich überall im Badezimmer nieder. Wisch jede Fläche ab, bis sie verschwunden sind."
        it: "Gli spettri di polvere si posano ovunque nel bagno. Spolvera ogni superficie finché non spariscono."
        pt: "Espectros de pó pousam por toda a casa de banho. Limpa o pó de cada superfície até desaparecerem."
        br: "Espectros de poeira pousam por todo o banheiro. Tire o pó de cada superfície até eles sumirem."
        nl: "Stofspoken strijken overal in de badkamer neer. Stof elk oppervlak af tot ze verdwenen zijn."
      dt_d_salle_de_bain_02:
        fr: "@@@session.user.name@@@ vient de dissiper les spectres de poussière de la salle de bain !"
        en: "@@@session.user.name@@@ has just banished the dust wraiths of the bathroom!"
        es: "¡@@@session.user.name@@@ acaba de disipar los espectros de polvo del cuarto de baño!"
        de: "@@@session.user.name@@@ hat die Staubgespenster im Badezimmer gerade vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto gli spettri di polvere del bagno!"
        pt: "@@@session.user.name@@@ acabou de dissipar os espectros de pó da casa de banho!"
        br: "@@@session.user.name@@@ acabou de dissipar os espectros de poeira do banheiro!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofspoken van de badkamer verdreven!"
      dt_c_salle_de_bain_02:
        fr: "@@@session.user.name@@@ a bravé les spectres de poussière de la salle de bain sans faiblir, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ braved the dust wraiths of the bathroom without flinching, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ desafió a los espectros de polvo del cuarto de baño sin flaquear, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat den Staubgespenstern im Badezimmer unerschrocken getrotzt, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha sfidato gli spettri di polvere del bagno senza cedere, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ desafiou os espectros de pó da casa de banho sem vacilar, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ desafiou os espectros de poeira do banheiro sem vacilar, mas o tempo acabou: a aventura vai continuar!"
        nl: "@@@session.user.name@@@ trotseerde de stofspoken van de badkamer zonder te wankelen, maar de tijd was op: het avontuur gaat verder!"
      dt_t_salle_de_bain_03:
        fr: "Laver le sol"
        en: "Mop the floor"
        es: "Fregar el suelo"
        de: "Boden wischen"
        it: "Lavare il pavimento"
        pt: "Lavar o chão"
        br: "Lavar o chão"
        nl: "Vloer dweilen"
      dt_a_salle_de_bain_03:
        fr: "Des limaces de crasse traînent sur le sol de la salle de bain. Lave jusqu'à ce qu'il brille, sans trace collante."
        en: "Grime slugs trail across the bathroom floor. Mop until it shines, with no sticky patches."
        es: "Babosas de mugre dejan rastros en el suelo del cuarto de baño. Friega hasta que brille, sin zonas pegajosas."
        de: "Schmutzschnecken ziehen ihre Spuren über den Badezimmerboden. Wisch, bis er glänzt und nichts mehr klebt."
        it: "Le lumache di sporco strisciano sul pavimento del bagno. Lava finché non brilla, senza punti appiccicosi."
        pt: "Lesmas de sujidade deixam rastos no chão da casa de banho. Lava até brilhar, sem zonas pegajosas."
        br: "Lesmas de sujeira deixam rastros no chão do banheiro. Lave até brilhar, sem partes grudentas."
        nl: "Vuilslakken laten sporen na op de badkamervloer. Dweil tot hij glanst, zonder plakkerige plekken."
      dt_d_salle_de_bain_03:
        fr: "@@@session.user.name@@@ vient d'écraser les limaces de crasse de la salle de bain !"
        en: "@@@session.user.name@@@ has just squashed the grime slugs of the bathroom!"
        es: "¡@@@session.user.name@@@ acaba de aplastar las babosas de mugre del cuarto de baño!"
        de: "@@@session.user.name@@@ hat die Schmutzschnecken im Badezimmer gerade zerquetscht!"
        it: "@@@session.user.name@@@ ha appena schiacciato le lumache di sporco del bagno!"
        pt: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujidade da casa de banho!"
        br: "@@@session.user.name@@@ acabou de esmagar as lesmas de sujeira do banheiro!"
        nl: "@@@session.user.name@@@ heeft zojuist de vuilslakken van de badkamer geplet!"
      dt_c_salle_de_bain_03:
        fr: "@@@session.user.name@@@ a livré un beau combat contre les limaces de crasse de la salle de bain, mais ce n'était pas encore gagné !"
        en: "@@@session.user.name@@@ put up a fine fight against the grime slugs of the bathroom, but it was not quite won yet!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra las babosas de mugre del cuarto de baño, pero aún no estaba ganado!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit den Schmutzschnecken im Bad geliefert, aber gewonnen war es noch nicht!"
        it: "@@@session.user.name@@@ ha combattuto una bella battaglia contro le lumache di sporcizia del bagno, ma non era ancora vinta!"
        pt: "@@@session.user.name@@@ travou um belo combate contra as lesmas de sujidade da casa de banho, mas ainda não estava ganho!"
        br: "@@@session.user.name@@@ travou um belo combate contra as lesmas de sujeira do banheiro, mas a vitória ainda não estava garantida!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de vuilslakken van de badkamer, maar het was nog niet gewonnen!"
      dt_t_salle_de_bain_04:
        fr: "Nettoyer les vitres"
        en: "Clean the windows"
        es: "Limpiar las ventanas"
        de: "Fenster putzen"
        it: "Pulire i vetri"
        pt: "Limpar os vidros"
        br: "Limpar os vidros"
        nl: "Ramen lappen"
      dt_a_salle_de_bain_04:
        fr: "Des lutins de traces grasses brouillent les vitres de la salle de bain. Nettoie jusqu'à une transparence parfaite."
        en: "Greasy-smudge imps blur the bathroom windows. Clean until perfectly clear."
        es: "Duendes de manchas empañan las ventanas del cuarto de baño. Limpia hasta una transparencia perfecta."
        de: "Schlierenwichtel verschmieren die Fenster im Bad. Putze, bis sie perfekt durchsichtig sind."
        it: "Folletti delle ditate appannano i vetri del bagno. Pulisci finché non sono perfettamente trasparenti."
        pt: "Diabretes das dedadas embaciam os vidros da casa de banho. Limpa até ficarem perfeitamente transparentes."
        br: "Diabinhos das marcas de dedo embaçam os vidros do banheiro. Limpe até ficarem perfeitamente transparentes."
        nl: "Vegenkabouters maken de badkamerramen wazig. Lap ze tot ze perfect doorzichtig zijn."
      dt_d_salle_de_bain_04:
        fr: "@@@session.user.name@@@ vient de chasser les lutins des vitres de la salle de bain !"
        en: "@@@session.user.name@@@ has just driven off the smudge imps from the bathroom windows!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar a los duendes de las ventanas del cuarto de baño!"
        de: "@@@session.user.name@@@ hat gerade die Schlierenwichtel von den Badfenstern verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i folletti dai vetri del bagno!"
        pt: "@@@session.user.name@@@ acabou de expulsar os diabretes dos vidros da casa de banho!"
        br: "@@@session.user.name@@@ acabou de expulsar os diabinhos dos vidros do banheiro!"
        nl: "@@@session.user.name@@@ heeft net de vegenkabouters van de badkamerramen verjaagd!"
      dt_c_salle_de_bain_04:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les lutins des vitres de la salle de bain, et des renforts sont arrivés du mauvais côté !"
        en: "@@@session.user.name@@@ fought bravely against the smudge imps of the bathroom windows, and reinforcements turned up on the wrong side!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra los duendes de las ventanas del cuarto de baño, y llegaron refuerzos del bando equivocado!"
        de: "@@@session.user.name@@@ hat tapfer gegen die Schlierenwichtel an den Badfenstern gekämpft, und Verstärkung kam von der falschen Seite!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro i folletti dei vetri del bagno, e sono arrivati rinforzi dalla parte sbagliata!"
        pt: "@@@session.user.name@@@ lutou com bravura contra os diabretes dos vidros da casa de banho, e chegaram reforços do lado errado!"
        br: "@@@session.user.name@@@ lutou com bravura contra os diabinhos dos vidros do banheiro, e chegaram reforços do lado errado!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de vegenkabouters van de badkamerramen, en er kwamen versterkingen voor de verkeerde kant!"
      dt_t_salle_de_bain_05:
        fr: "Nettoyer le lavabo"
        en: "Clean the washbasin"
        es: "Limpiar el lavabo"
        de: "Waschbecken putzen"
        it: "Pulire il lavandino"
        pt: "Limpar o lavatório"
        br: "Limpar a pia"
        nl: "Wastafel schoonmaken"
      dt_a_salle_de_bain_05:
        fr: "Des golems de calcaire encroûtent le lavabo. Récure cuvette et robinet jusqu'à un lavabo net et brillant."
        en: "Limescale golems crust the washbasin. Scrub the bowl and tap until the basin is clean and shining."
        es: "Gólems de cal incrustan el lavabo. Frota la pila y el grifo hasta dejar el lavabo limpio y brillante."
        de: "Kalkgolems verkrusten das Waschbecken. Schrubbe Becken und Wasserhahn, bis alles sauber glänzt."
        it: "Golem di calcare incrostano il lavandino. Strofina vasca e rubinetto finché il lavandino non è pulito e brillante."
        pt: "Golens de calcário incrustam o lavatório. Esfrega a bacia e a torneira até o lavatório ficar limpo e brilhante."
        br: "Golens de calcário se incrustam na pia. Esfregue a cuba e a torneira até a pia ficar limpa e brilhante."
        nl: "Kalkgolems zetten de wastafel onder de korsten. Schrob bak en kraan tot de wastafel schoon is en glanst."
      dt_d_salle_de_bain_05:
        fr: "@@@session.user.name@@@ vient de briser les golems de calcaire du lavabo !"
        en: "@@@session.user.name@@@ has just shattered the limescale golems of the washbasin!"
        es: "¡@@@session.user.name@@@ acaba de romper los gólems de cal del lavabo!"
        de: "@@@session.user.name@@@ hat gerade die Kalkgolems am Waschbecken zerschmettert!"
        it: "@@@session.user.name@@@ ha appena frantumato i golem di calcare del lavandino!"
        pt: "@@@session.user.name@@@ acabou de despedaçar os golens de calcário do lavatório!"
        br: "@@@session.user.name@@@ acabou de despedaçar os golens de calcário da pia!"
        nl: "@@@session.user.name@@@ heeft net de kalkgolems van de wastafel verbrijzeld!"
      dt_c_salle_de_bain_05:
        fr: "@@@session.user.name@@@ a donné l'assaut contre les golems de calcaire du lavabo, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ led the assault on the limescale golems of the washbasin, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ dio el asalto contra los gólems de cal del lavabo, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hat die Kalkgolems am Waschbecken angegriffen, und der Kampf dauerte länger als gedacht!"
        it: "@@@session.user.name@@@ ha dato l'assalto ai golem di calcare del lavandino, e il combattimento è durato più del previsto!"
        pt: "@@@session.user.name@@@ lançou o assalto contra os golens de calcário do lavatório, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ partiu para o ataque contra os golens de calcário da pia, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ bestormde de kalkgolems van de wastafel, en het gevecht duurde langer dan verwacht!"
      dt_t_salle_de_bain_06:
        fr: "Nettoyer le miroir"
        en: "Clean the mirror"
        es: "Limpiar el espejo"
        de: "Spiegel putzen"
        it: "Pulire lo specchio"
        pt: "Limpar o espelho"
        br: "Limpar o espelho"
        nl: "Spiegel schoonmaken"
      dt_a_salle_de_bain_06:
        fr: "Des buée-spectres ternissent le miroir de la salle de bain. Nettoie-le jusqu'à un reflet clair et net."
        en: "Steam-wraiths cloud the bathroom mirror. Clean it until the reflection is clear and sharp."
        es: "Espectros de vaho empañan el espejo del cuarto de baño. Límpialo hasta un reflejo claro y nítido."
        de: "Dampfgespenster trüben den Badspiegel. Putze ihn, bis dein Spiegelbild klar und scharf ist."
        it: "Spettri di vapore appannano lo specchio del bagno. Puliscilo finché il riflesso non è chiaro e nitido."
        pt: "Espectros de vapor embaciam o espelho da casa de banho. Limpa-o até o reflexo ficar claro e nítido."
        br: "Espectros de vapor embaçam o espelho do banheiro. Limpe até o reflexo ficar claro e nítido."
        nl: "Dampspoken maken de badkamerspiegel wazig. Maak hem schoon tot je spiegelbeeld helder en scherp is."
      dt_d_salle_de_bain_06:
        fr: "@@@session.user.name@@@ vient de dissiper les buée-spectres du miroir de la salle de bain !"
        en: "@@@session.user.name@@@ has just dispelled the steam-wraiths of the bathroom mirror!"
        es: "¡@@@session.user.name@@@ acaba de disipar los espectros de vaho del espejo del cuarto de baño!"
        de: "@@@session.user.name@@@ hat gerade die Dampfgespenster vom Badspiegel vertrieben!"
        it: "@@@session.user.name@@@ ha appena dissolto gli spettri di vapore dello specchio del bagno!"
        pt: "@@@session.user.name@@@ acabou de dissipar os espectros de vapor do espelho da casa de banho!"
        br: "@@@session.user.name@@@ acabou de dissipar os espectros de vapor do espelho do banheiro!"
        nl: "@@@session.user.name@@@ heeft net de dampspoken van de badkamerspiegel verdreven!"
      dt_c_salle_de_bain_06:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre les buée-spectres du miroir de la salle de bain, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ fought bravely against the steam-wraiths of the bathroom mirror, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra los espectros de vaho del espejo del cuarto de baño, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat tapfer gegen die Dampfgespenster am Badspiegel gekämpft, und die Laterne ging im dümmsten Moment aus!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro gli spettri di vapore dello specchio del bagno, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ lutou com bravura contra os espectros de vapor do espelho da casa de banho, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ lutou com bravura contra os espectros de vapor do espelho do banheiro, e a lanterna apagou na pior hora!"
        nl: "@@@session.user.name@@@ vocht dapper tegen de dampspoken van de badkamerspiegel, en de lantaarn ging op het slechtste moment uit!"
      dt_t_salle_de_bain_07:
        fr: "Nettoyer la douche"
        en: "Clean the shower"
        es: "Limpiar la ducha"
        de: "Dusche putzen"
        it: "Pulire la doccia"
        pt: "Limpar o duche"
        br: "Limpar o box do chuveiro"
        nl: "Douche schoonmaken"
      dt_a_salle_de_bain_07:
        fr: "Une hydre de calcaire et de moisi s'agrippe à la douche. Récure parois, joints et bonde jusqu'à une douche nette."
        en: "A hydra of limescale and mould clings to the shower. Scrub the walls, seals and drain until the shower is spotless."
        es: "Una hidra de cal y moho se aferra a la ducha. Frota paredes, juntas y desagüe hasta dejar la ducha impecable."
        de: "Eine Hydra aus Kalk und Schimmel klammert sich an die Dusche. Schrubbe Wände, Fugen und Abfluss, bis die Dusche blitzsauber ist."
        it: "Un'idra di calcare e muffa si aggrappa alla doccia. Strofina pareti, fughe e scarico finché la doccia non è impeccabile."
        pt: "Uma hidra de calcário e bolor agarra-se ao duche. Esfrega paredes, juntas e ralo até o duche ficar impecável."
        br: "Uma hidra de calcário e mofo se agarra ao box do chuveiro. Esfregue paredes, rejuntes e ralo até o box ficar impecável."
        nl: "Een hydra van kalk en schimmel klampt zich vast aan de douche. Schrob wanden, voegen en afvoer tot de douche brandschoon is."
      dt_d_salle_de_bain_07:
        fr: "@@@session.user.name@@@ vient de décapiter l'hydre de calcaire de la douche !"
        en: "@@@session.user.name@@@ has just beheaded the limescale hydra of the shower!"
        es: "¡@@@session.user.name@@@ acaba de decapitar a la hidra de cal de la ducha!"
        de: "@@@session.user.name@@@ hat gerade der Kalkhydra in der Dusche die Köpfe abgeschlagen!"
        it: "@@@session.user.name@@@ ha appena decapitato l'idra di calcare della doccia!"
        pt: "@@@session.user.name@@@ acabou de decapitar a hidra de calcário do duche!"
        br: "@@@session.user.name@@@ acabou de decapitar a hidra de calcário do chuveiro!"
        nl: "@@@session.user.name@@@ heeft net de kalkhydra van de douche onthoofd!"
      dt_c_salle_de_bain_07:
        fr: "@@@session.user.name@@@ a tenu tête à l'hydre de calcaire de la douche, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ stood up to the limescale hydra of the shower, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ le plantó cara a la hidra de cal de la ducha, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat der Kalkhydra in der Dusche die Stirn geboten, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha tenuto testa all'idra di calcare della doccia, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ fez frente à hidra de calcário do duche, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ enfrentou a hidra de calcário do chuveiro, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ bood de kalkhydra van de douche het hoofd, maar de nacht viel over de kerker voor het einde!"
      dt_t_salle_de_bain_08:
        fr: "Nettoyer la baignoire"
        en: "Clean the bathtub"
        es: "Limpiar la bañera"
        de: "Badewanne putzen"
        it: "Pulire la vasca"
        pt: "Limpar a banheira"
        br: "Limpar a banheira"
        nl: "Bad schoonmaken"
      dt_a_salle_de_bain_08:
        fr: "Des cernes-trolls encerclent la baignoire. Récure jusqu'à une baignoire nette, sans dépôt ni anneau."
        en: "Ring-trolls encircle the bathtub. Scrub until the tub is clean, with no deposits or rings."
        es: "Troles de cerco rodean la bañera. Frota hasta una bañera limpia, sin depósitos ni cercos."
        de: "Randtrolle umzingeln die Badewanne. Schrubbe, bis die Wanne sauber ist, ohne Ablagerungen und Ränder."
        it: "Troll degli aloni circondano la vasca. Strofina finché la vasca non è pulita, senza depositi né aloni."
        pt: "Trols das marcas cercam a banheira. Esfrega até a banheira ficar limpa, sem depósitos nem marcas."
        br: "Trolls das manchas cercam a banheira. Esfregue até a banheira ficar limpa, sem resíduos nem manchas."
        nl: "Randtrollen omsingelen het bad. Schrob tot het bad schoon is, zonder aanslag of randen."
      dt_d_salle_de_bain_08:
        fr: "@@@session.user.name@@@ vient de chasser les cernes-trolls de la baignoire !"
        en: "@@@session.user.name@@@ has just driven off the ring-trolls of the bathtub!"
        es: "¡@@@session.user.name@@@ acaba de ahuyentar a los troles de cerco de la bañera!"
        de: "@@@session.user.name@@@ hat gerade die Randtrolle aus der Badewanne verjagt!"
        it: "@@@session.user.name@@@ ha appena scacciato i troll degli aloni dalla vasca!"
        pt: "@@@session.user.name@@@ acabou de expulsar os trols das marcas da banheira!"
        br: "@@@session.user.name@@@ acabou de expulsar os trolls das manchas da banheira!"
        nl: "@@@session.user.name@@@ heeft net de randtrollen uit het bad verjaagd!"
      dt_c_salle_de_bain_08:
        fr: "@@@session.user.name@@@ a croisé le fer avec les cernes-trolls de la baignoire, mais la potion de courage était déjà vide !"
        en: "@@@session.user.name@@@ crossed swords with the ring-trolls of the bathtub, but the courage potion was already empty!"
        es: "¡@@@session.user.name@@@ cruzó el acero con los troles de cerco de la bañera, pero la poción de valor ya estaba vacía!"
        de: "@@@session.user.name@@@ hat mit den Randtrollen der Badewanne die Klingen gekreuzt, aber der Muttrank war schon leer!"
        it: "@@@session.user.name@@@ ha incrociato le spade con i troll degli aloni della vasca, ma la pozione del coraggio era già vuota!"
        pt: "@@@session.user.name@@@ cruzou espadas com os trols das marcas da banheira, mas a poção de coragem já estava vazia!"
        br: "@@@session.user.name@@@ cruzou espadas com os trolls das manchas da banheira, mas a poção de coragem já estava vazia!"
        nl: "@@@session.user.name@@@ kruiste de degens met de randtrollen van het bad, maar het moeddrankje was al op!"
      dt_t_salle_de_bain_10:
        fr: "Changer les serviettes"
        en: "Change the towels"
        es: "Cambiar las toallas"
        de: "Handtücher wechseln"
        it: "Cambiare gli asciugamani"
        pt: "Mudar as toalhas"
        br: "Trocar as toalhas"
        nl: "Handdoeken verwisselen"
      dt_a_salle_de_bain_10:
        fr: "Les serviettes-zombies humides traînent dans la salle de bain. Remplace-les par des serviettes propres et sèches."
        en: "Damp towel-zombies linger in the bathroom. Replace them with clean, dry towels."
        es: "Toallas-zombi húmedas pululan por el cuarto de baño. Sustitúyelas por toallas limpias y secas."
        de: "Feuchte Handtuch-Zombies lungern im Bad herum. Ersetze sie durch saubere, trockene Handtücher."
        it: "Asciugamani-zombi umidi ciondolano in bagno. Sostituiscili con asciugamani puliti e asciutti."
        pt: "Toalhas-zombie húmidas vagueiam pela casa de banho. Substitui-as por toalhas limpas e secas."
        br: "Toalhas-zumbi úmidas vagam pelo banheiro. Troque por toalhas limpas e secas."
        nl: "Vochtige handdoekzombies hangen rond in de badkamer. Vervang ze door schone, droge handdoeken."
      dt_d_salle_de_bain_10:
        fr: "@@@session.user.name@@@ vient de bannir les serviettes-zombies de la salle de bain !"
        en: "@@@session.user.name@@@ has just banished the towel-zombies of the bathroom!"
        es: "¡@@@session.user.name@@@ acaba de desterrar a las toallas-zombi del cuarto de baño!"
        de: "@@@session.user.name@@@ hat gerade die Handtuch-Zombies aus dem Bad verbannt!"
        it: "@@@session.user.name@@@ ha appena bandito gli asciugamani-zombi dal bagno!"
        pt: "@@@session.user.name@@@ acabou de banir as toalhas-zombie da casa de banho!"
        br: "@@@session.user.name@@@ acabou de banir as toalhas-zumbi do banheiro!"
        nl: "@@@session.user.name@@@ heeft net de handdoekzombies uit de badkamer verbannen!"
      dt_c_salle_de_bain_10:
        fr: "@@@session.user.name@@@ a tenu tête aux serviettes-zombies de la salle de bain, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ stood up to the towel-zombies of the bathroom, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ le plantó cara a las toallas-zombi del cuarto de baño, pero el hechizo salió mal en el último momento!"
        de: "@@@session.user.name@@@ hat den Handtuch-Zombies im Bad die Stirn geboten, aber der Zauber ging im letzten Moment schief!"
        it: "@@@session.user.name@@@ ha tenuto testa agli asciugamani-zombi del bagno, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "@@@session.user.name@@@ fez frente às toalhas-zombie da casa de banho, mas o feitiço correu mal no último momento!"
        br: "@@@session.user.name@@@ enfrentou as toalhas-zumbi do banheiro, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ bood de handdoekzombies van de badkamer het hoofd, maar de spreuk liep op het laatste moment mis!"
      dt_t_salle_de_bain_11:
        fr: "Nettoyer les joints et le carrelage"
        en: "Clean the tiles and grout"
        es: "Limpiar las juntas y los azulejos"
        de: "Fugen und Fliesen putzen"
        it: "Pulire fughe e piastrelle"
        pt: "Limpar juntas e azulejos"
        br: "Limpar rejuntes e azulejos"
        nl: "Voegen en tegels schoonmaken"
      dt_a_salle_de_bain_11:
        fr: "Une moisissure noire colonise les joints et le carrelage de la salle de bain. Récure jusqu'à des joints nets et clairs."
        en: "Black mould colonises the bathroom tiles and grout. Scrub until the grout is clean and bright."
        es: "Moho negro coloniza las juntas y los azulejos del cuarto de baño. Frota hasta dejar las juntas limpias y claras."
        de: "Schwarzer Schimmel breitet sich auf den Fugen und Fliesen im Bad aus. Schrubbe, bis die Fugen sauber und hell sind."
        it: "Una muffa nera colonizza le fughe e le piastrelle del bagno. Strofina finché le fughe non sono pulite e chiare."
        pt: "Um bolor negro coloniza as juntas e os azulejos da casa de banho. Esfrega até as juntas ficarem limpas e claras."
        br: "Um mofo negro coloniza os rejuntes e os azulejos do banheiro. Esfregue até os rejuntes ficarem limpos e claros."
        nl: "Zwarte schimmel verovert de voegen en tegels van de badkamer. Schrob tot de voegen schoon en licht zijn."
      dt_d_salle_de_bain_11:
        fr: "@@@session.user.name@@@ vient d'éradiquer la moisissure noire des joints de la salle de bain !"
        en: "@@@session.user.name@@@ has just eradicated the black mould of the bathroom grout!"
        es: "¡@@@session.user.name@@@ acaba de erradicar el moho negro de las juntas del cuarto de baño!"
        de: "@@@session.user.name@@@ hat gerade den schwarzen Schimmel aus den Badfugen ausgerottet!"
        it: "@@@session.user.name@@@ ha appena sradicato la muffa nera dalle fughe del bagno!"
        pt: "@@@session.user.name@@@ acabou de erradicar o bolor negro das juntas da casa de banho!"
        br: "@@@session.user.name@@@ acabou de erradicar o mofo negro dos rejuntes do banheiro!"
        nl: "@@@session.user.name@@@ heeft net de zwarte schimmel uit de badkamervoegen uitgeroeid!"
      dt_c_salle_de_bain_11:
        fr: "@@@session.user.name@@@ a tenu bon face à la moisissure noire des joints de la salle de bain, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ held the line against the black mould of the bathroom grout, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ aguantó firme frente al moho negro de las juntas del cuarto de baño, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ hielt dem schwarzen Schimmel in den Badfugen stand, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha resistito alla muffa nera delle fughe del bagno, ma è passato un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ aguentou firme perante o bolor negro das juntas da casa de banho, mas passou um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ resistiu firme diante do mofo negro dos rejuntes do banheiro, mas passou um dragão e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ hield stand tegen de zwarte schimmel in de badkamervoegen, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"

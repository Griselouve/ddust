        en: "@@@session.user.name@@@ has just refreshed the familiar's water!"
        es: "¡@@@session.user.name@@@ acaba de renovar el agua del familiar!"
        de: "@@@session.user.name@@@ hat gerade das Wasser des Zaubertiers erneuert!"
        it: "@@@session.user.name@@@ ha appena rinnovato l'acqua del famiglio!"
        pt: "@@@session.user.name@@@ acabou de renovar a água do familiar!"
        br: "@@@session.user.name@@@ acabou de renovar a água do familiar!"
        nl: "@@@session.user.name@@@ heeft zojuist het water van het toverdier ververst!"
      dt_c_animaux_02:
        fr: "@@@session.user.name@@@ a retroussé ses manches pour changer l'eau du familier, et ce n'est pas encore tout à fait ça !"
        en: "@@@session.user.name@@@ rolled up both sleeves for changing the familiar's water, and it is not quite there yet!"
        es: "¡@@@session.user.name@@@ se remangó para cambiar el agua del familiar, y aún no está del todo!"
        de: "@@@session.user.name@@@ hat die Ärmel hochgekrempelt, um das Wasser des Zaubertiers zu wechseln, und ganz fertig ist es noch nicht!"
        it: "@@@session.user.name@@@ ha tirato su le maniche per cambiare l'acqua del famiglio, e non è ancora del tutto a posto!"
        pt: "@@@session.user.name@@@ arregaçou as mangas para mudar a água do familiar, e ainda não está bem feito!"
        br: "@@@session.user.name@@@ arregaçou as mangas para trocar a água do familiar, e ainda não está bem feito!"
        nl: "@@@session.user.name@@@ heeft de mouwen opgestroopt om het water van het toverdier te verversen, en helemaal klaar is het nog niet!"
      dt_t_animaux_03:
        fr: "Nettoyer l'antre de la bête"
        en: "Clean the beast's lair"
        es: "Limpiar la guarida de la bestia"
        de: "Den Bau des Biests putzen"
        it: "Pulire la tana della bestia"
        pt: "Limpar o covil da fera"
        br: "Limpar o covil da fera"
        nl: "Het hol van het beest schoonmaken"
      dt_a_animaux_03:
        fr: "La litière, la cage ou l'aquarium du familier vire au repaire nauséabond. Nettoie jusqu'à un espace sain."
        en: "The familiar's litter box, cage or aquarium is turning into a foul lair. Clean it until the space is wholesome."
        es: "El arenero, la jaula o el acuario del familiar se vuelve una guarida apestosa. Limpia hasta un espacio sano."
        de: "Katzenklo, Käfig oder Aquarium des Zaubertiers wird zur stinkenden Höhle. Putz, bis alles wieder sauber und gesund ist."
        it: "La lettiera, la gabbia o l'acquario del famiglio si trasforma in un covo puzzolente. Pulisci finché lo spazio è sano."
        pt: "A caixa de areia, a gaiola ou o aquário do familiar está a virar um covil fedorento. Limpa até ficar um espaço saudável."
        br: "A caixa de areia, a gaiola ou o aquário do familiar está virando um covil fedorento. Limpe até virar um espaço saudável."
        nl: "De kattenbak, kooi of het aquarium van het toverdier wordt een stinkend hol. Maak schoon tot alles weer fris en gezond is."
      dt_d_animaux_03:
        fr: "@@@session.user.name@@@ vient d'assainir le repaire du familier !"
        en: "@@@session.user.name@@@ has just cleansed the familiar's lair!"
        es: "¡@@@session.user.name@@@ acaba de sanear la guarida del familiar!"
        de: "@@@session.user.name@@@ hat gerade die Höhle des Zaubertiers blitzsauber gemacht!"
        it: "@@@session.user.name@@@ ha appena risanato il covo del famiglio!"
        pt: "@@@session.user.name@@@ acabou de sanear o covil do familiar!"
        br: "@@@session.user.name@@@ acabou de higienizar o covil do familiar!"
        nl: "@@@session.user.name@@@ heeft zojuist het hol van het toverdier gezuiverd!"
      dt_c_animaux_03:
        fr: "@@@session.user.name@@@ a livré un beau combat contre le repaire nauséabond du familier, et le grimoire manquait justement la bonne page !"
        en: "@@@session.user.name@@@ put up a fine fight against the foul lair of the familiar, and the spellbook was missing exactly the right page!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra la guarida apestosa del familiar, y al grimorio le faltaba justo la página buena!"
        de: "@@@session.user.name@@@ hat sich tapfer gegen die stinkende Höhle des Zaubertiers geschlagen, und im Zauberbuch fehlte ausgerechnet die richtige Seite!"
        it: "@@@session.user.name@@@ ha combattuto con onore contro il covo puzzolente del famiglio, e al grimorio mancava proprio la pagina giusta!"
        pt: "@@@session.user.name@@@ travou um belo combate contra o covil fedorento do familiar, e ao grimório faltava justamente a página certa!"
        br: "@@@session.user.name@@@ travou um belo combate contra o covil fedorento do familiar, e justo a página certa faltava no grimório!"
        nl: "@@@session.user.name@@@ heeft flink gevochten tegen het stinkende hol van het toverdier, en in het toverboek ontbrak net de juiste bladzijde!"
      dt_t_animaux_05:
        fr: "Nettoyer ou brosser les poils de la bête"
        en: "Clean or brush the beast's fur"
        es: "Limpiar o cepillar el pelo de la bestia"
        de: "Das Fell des Biests putzen oder bürsten"
        it: "Pulire o spazzolare il pelo della bestia"
        pt: "Limpar ou escovar o pelo da fera"
        br: "Limpar ou escovar o pelo da fera"
        nl: "De vacht van het beest schoonmaken of borstelen"
      dt_a_animaux_05:
        fr: "Le pelage du familier s'emmêle en nœuds-lutins. Brosse ou nettoie jusqu'à un poil net et démêlé."
        en: "The familiar's coat tangles into knot-imps. Brush or clean until the fur is clean and untangled."
        es: "El pelaje del familiar se enreda en duendes-nudo. Cepilla o limpia hasta un pelo limpio y desenredado."
        de: "Das Fell des Zaubertiers verfilzt zu Knotenkobolden. Bürste oder putze es, bis es sauber und entwirrt ist."
        it: "Il pelo del famiglio si aggroviglia in folletti-nodo. Spazzola o pulisci finché è pulito e districato."
        pt: "O pelo do familiar enrola-se em duendes-nó. Escova ou limpa até ficar limpo e desembaraçado."
        br: "O pelo do familiar se enrola em duendes-nó. Escove ou limpe até ficar limpo e desembaraçado."
        nl: "De vacht van het toverdier raakt in de knoop door klittenkabouters. Borstel of maak schoon tot de vacht glad en klitvrij is."
      dt_d_animaux_05:
        fr: "@@@session.user.name@@@ vient de démêler les nœuds-lutins du familier !"
        en: "@@@session.user.name@@@ has just untangled the knot-imps of the familiar!"
        es: "¡@@@session.user.name@@@ acaba de desenredar los duendes-nudo del familiar!"
        de: "@@@session.user.name@@@ hat gerade die Knotenkobolde aus dem Fell des Zaubertiers gebürstet!"
        it: "@@@session.user.name@@@ ha appena districato i folletti-nodo del famiglio!"
        pt: "@@@session.user.name@@@ acabou de desembaraçar os duendes-nó do familiar!"
        br: "@@@session.user.name@@@ acabou de desembaraçar os duendes-nó do familiar!"
        nl: "@@@session.user.name@@@ heeft zojuist de klittenkabouters uit de vacht van het toverdier geborsteld!"
      dt_c_animaux_05:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour brosser le familier, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ took a deep breath and started brushing the familiar, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a cepillar al familiar, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um das Zaubertier zu bürsten, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ha preso il coraggio a due mani per spazzolare il famiglio, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ ganhou coragem para escovar o familiar, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ tomou coragem para escovar o familiar, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ heeft moed verzameld om het toverdier te borstelen, en de lantaarn ging voor het einde uit!"

      #------------- Tâches — voiture ----------------------------------

      dt_t_voiture_01:
        fr: "Nettoyer l'intérieur de la voiture"
        en: "Clean the inside of the car"
        es: "Limpiar el interior del coche"
        de: "Das Auto innen putzen"
        it: "Pulire l'interno dell'auto"
        pt: "Limpar o interior do carro"
        br: "Limpar o interior do carro"
        nl: "De auto vanbinnen schoonmaken"

      #------------- Tâches — courses ----------------------------------

      dt_t_courses_01:
        fr: "Faire les courses"
        en: "Do the shopping"
        es: "Hacer la compra"
        de: "Einkaufen gehen"
        it: "Fare la spesa"
        pt: "Fazer as compras"
        br: "Fazer as compras"
        nl: "Boodschappen doen"
      dt_a_courses_01:
        fr: "Le garde-manger se vide et la guilde gronde. Fais les courses selon la liste jusqu'au dernier article."
        en: "The pantry is running empty and the guild grumbles. Do the shopping from the list, down to the last item."
        es: "La despensa se vacía y el gremio refunfuña. Haz la compra según la lista hasta el último artículo."
        de: "Die Vorratskammer leert sich und die Gilde murrt. Kauf nach Liste ein, bis zum letzten Artikel."
        it: "La dispensa si svuota e la gilda brontola. Fai la spesa seguendo la lista fino all'ultimo articolo."
        pt: "A despensa está a ficar vazia e a guilda resmunga. Faz as compras pela lista até ao último artigo."
        br: "A despensa está ficando vazia e a guilda resmunga. Faça as compras seguindo a lista até o último item."
        nl: "De voorraadkast raakt leeg en het gilde moppert. Doe de boodschappen volgens het lijstje, tot het laatste artikel."

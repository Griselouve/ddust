        en: "Limescale golems harden inside the kettle or coffee maker. Descale until the inside is clean and clear."
        es: "Gólems de cal se endurecen en el hervidor o la cafetera. Descalcifica hasta un interior limpio y claro."
      dt_d_cuisine_15:

        es: "¡@@@session.user.name@@@ acaba de llevar todo el botín de la compra hasta la cocina!"
        de: "@@@session.user.name@@@ hat gerade die ganze Einkaufsbeute bis in die Küche geschleppt!"
        it: "@@@session.user.name@@@ ha appena portato tutto il bottino della spesa fino in cucina!"
        pt: "@@@session.user.name@@@ acabou de levar todo o espólio das compras até à cozinha!"
        br: "@@@session.user.name@@@ acabou de levar todo o tesouro das compras até a cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de hele boodschappenbuit naar de keuken gesjouwd!"

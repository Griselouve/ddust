        pt: "@@@session.user.name@@@ pôs muito empenho em carregar as compras, mas o tempo acabou antes da vitória!"
        br: "@@@session.user.name@@@ se empenhou muito em carregar as compras, mas o tempo acabou antes da vitória!"
        nl: "@@@session.user.name@@@ heeft er met hart en ziel aan gewerkt om de boodschappen te dragen, maar de tijd raakte op voor de overwinning!"

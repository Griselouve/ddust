        br: "Um monstro de calcário e bactérias faz ninho no vaso sanitário. Esfregue até o vaso ficar limpo e desinfetado."
        nl: "Een monster van kalk en bacteriën nestelt zich in de wc-pot. Schrob tot de pot schoon en ontsmet is."

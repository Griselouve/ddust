        fr: "@@@session.user.name@@@ a tenu tête aux lutins des vitres du bureau, et le grimoire manquait justement la bonne page !"
        en: "@@@session.user.name@@@ stood up to the smudge imps of the office windows, and the spellbook was missing exactly the right page!"

        it: "@@@session.user.name@@@ ha appena sconfitto il mostro della tazza del water!"
        pt: "@@@session.user.name@@@ acabou de derrotar o monstro da sanita!"
        br: "@@@session.user.name@@@ acabou de derrotar o monstro do vaso sanitário!"
        nl: "@@@session.user.name@@@ heeft net het monster van de wc-pot verslagen!"
      dt_c_toilettes_04:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre le monstre de la cuvette des toilettes, mais ce n'était pas encore gagné !"
        en: "@@@session.user.name@@@ fought bravely against the monster of the toilet bowl, but it was not quite won yet!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra el monstruo de la taza del inodoro, pero aún no estaba ganado!"
        de: "@@@session.user.name@@@ hat tapfer gegen das Monster der Kloschüssel gekämpft, aber gewonnen war es noch nicht!"

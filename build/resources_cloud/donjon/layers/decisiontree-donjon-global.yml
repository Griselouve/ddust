        it: "@@@session.user.name@@@ ha appena dissetato le piante d'appartamento assetate!"
        pt: "@@@session.user.name@@@ acabou de matar a sede às plantas de interior!"
        br: "@@@session.user.name@@@ acabou de matar a sede das plantas de dentro de casa!"
        nl: "@@@session.user.name@@@ heeft zojuist de dorstige kamerplanten gelaafd!"
      dt_c_extras_01:
        fr: "@@@session.user.name@@@ a retroussé ses manches pour arroser les plantes d'intérieur, mais la tâche a tenu bon cette fois !"
        en: "@@@session.user.name@@@ rolled up both sleeves for watering the houseplants, but the task held out this time!"
        es: "¡@@@session.user.name@@@ se remangó para regar las plantas de interior, pero la tarea aguantó esta vez!"
        de: "@@@session.user.name@@@ hat die Ärmel hochgekrempelt, um die Zimmerpflanzen zu gießen, aber die Aufgabe hat diesmal standgehalten!"
        it: "@@@session.user.name@@@ ha tirato su le maniche per innaffiare le piante d'appartamento, ma la faccenda ha resistito, stavolta!"
        pt: "@@@session.user.name@@@ arregaçou as mangas para regar as plantas de interior, mas a tarefa resistiu desta vez!"
        br: "@@@session.user.name@@@ arregaçou as mangas para regar as plantas de dentro de casa, mas a tarefa resistiu desta vez!"
        nl: "@@@session.user.name@@@ heeft de mouwen opgestroopt om de kamerplanten water te geven, maar de taak hield deze keer stand!"
      dt_t_extras_02:
        fr: "Ramasser le courrier"
        en: "Collect the post"
        es: "Recoger el correo"
        de: "Post holen"
        it: "Ritirare la posta"
        pt: "Ir buscar o correio"
        br: "Pegar a correspondência"
        nl: "De post ophalen"
      dt_a_extras_02:
        fr: "Le courrier s'entasse en pile chaotique dans la boîte. Ramasse-le et trie-le jusqu'à la boîte vide."
        en: "The post piles into a chaotic heap in the box. Collect and sort it until the box is empty."
        es: "El correo se amontona en un montón caótico en el buzón. Recógelo y clasifícalo hasta vaciar el buzón."
        de: "Die Post türmt sich chaotisch im Briefkasten. Hol sie heraus und sortiere sie, bis der Kasten leer ist."
        it: "La posta si accumula in una pila caotica nella cassetta. Ritirala e smistala finché la cassetta è vuota."
        pt: "O correio amontoa-se numa pilha caótica na caixa. Tira-o e organiza-o até a caixa ficar vazia."
        br: "A correspondência se amontoa numa pilha caótica na caixa. Tire tudo e organize até a caixa ficar vazia."
        nl: "De post stapelt zich chaotisch op in de brievenbus. Haal hem eruit en sorteer hem tot de bus leeg is."
      dt_d_extras_02:
        fr: "@@@session.user.name@@@ vient de ramasser et trier tout le courrier !"
        en: "@@@session.user.name@@@ has just collected and sorted all the post!"
        es: "¡@@@session.user.name@@@ acaba de recoger y clasificar todo el correo!"
        de: "@@@session.user.name@@@ hat gerade die ganze Post geholt und sortiert!"
        it: "@@@session.user.name@@@ ha appena ritirato e smistato tutta la posta!"
        pt: "@@@session.user.name@@@ acabou de ir buscar e organizar todo o correio!"
        br: "@@@session.user.name@@@ acabou de pegar e organizar toda a correspondência!"
        nl: "@@@session.user.name@@@ heeft zojuist alle post opgehaald en gesorteerd!"
      dt_c_extras_02:
        fr: "@@@session.user.name@@@ a mis du cœur à ramasser le courrier, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ put real heart into collecting the post, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ puso mucho empeño en recoger el correo, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat sich mit viel Herz daran gemacht, die Post zu holen, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ci ha messo il cuore per ritirare la posta, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ pôs muito empenho em ir buscar o correio, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ se empenhou muito em pegar a correspondência, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ heeft er met hart en ziel aan gewerkt om de post op te halen, en de lantaarn ging voor het einde uit!"
      dt_t_extras_03:
        fr: "Vider et nettoyer l'aspirateur"
        en: "Empty and clean the vacuum cleaner"
        es: "Vaciar y limpiar el aspirador"
        de: "Staubsauger leeren und reinigen"
        it: "Svuotare e pulire l'aspirapolvere"
        pt: "Esvaziar e limpar o aspirador"
        br: "Esvaziar e limpar o aspirador"
        nl: "Stofzuiger legen en schoonmaken"
      dt_a_extras_03:
        fr: "L'aspirateur, gavé de poussière, perd sa puissance. Vide et nettoie bac et filtre jusqu'à un appareil prêt."
        en: "The vacuum cleaner, gorged with dust, loses its power. Empty and clean the bin and filter until the device is ready."
        es: "El aspirador, atiborrado de polvo, pierde fuerza. Vacía y limpia el depósito y el filtro hasta dejarlo listo."
        de: "Der Staubsauger ist mit Staub vollgestopft und verliert seine Kraft. Leere und reinige Behälter und Filter, bis er wieder einsatzbereit ist."
        it: "L'aspirapolvere, rimpinzato di polvere, perde potenza. Svuota e pulisci contenitore e filtro finché è pronto."
        pt: "O aspirador, atulhado de pó, está a perder força. Esvazia e limpa o depósito e o filtro até ficar pronto."
        br: "O aspirador, entupido de poeira, está perdendo força. Esvazie e limpe o reservatório e o filtro até ficar pronto."
        nl: "De stofzuiger zit propvol stof en verliest zijn kracht. Leeg en reinig het reservoir en de filter tot hij weer klaar is voor gebruik."
      dt_d_extras_03:
        fr: "@@@session.user.name@@@ vient de revigorer l'aspirateur en le vidant !"
        en: "@@@session.user.name@@@ has just revived the vacuum cleaner by emptying it!"
        es: "¡@@@session.user.name@@@ acaba de revitalizar el aspirador vaciándolo!"
        de: "@@@session.user.name@@@ hat gerade den Staubsauger geleert und ihm neue Kraft gegeben!"
        it: "@@@session.user.name@@@ ha appena rinvigorito l'aspirapolvere svuotandolo!"
        pt: "@@@session.user.name@@@ acabou de revigorar o aspirador ao esvaziá-lo!"
        br: "@@@session.user.name@@@ acabou de revigorar o aspirador ao esvaziá-lo!"
        nl: "@@@session.user.name@@@ heeft zojuist de stofzuiger nieuwe kracht gegeven door hem te legen!"
      dt_c_extras_03:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour vider et nettoyer l'aspirateur, et le donjon en redemande déjà !"
        en: "@@@session.user.name@@@ took a deep breath and started emptying and cleaning the vacuum cleaner, and the dungeon is already asking for more!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a vaciar y limpiar el aspirador, y la mazmorra ya pide más!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um den Staubsauger zu leeren und zu reinigen, und der Kerker verlangt schon Nachschlag!"
        it: "@@@session.user.name@@@ ha preso il coraggio a due mani per svuotare e pulire l'aspirapolvere, e il dungeon ne vuole già di più!"
        pt: "@@@session.user.name@@@ ganhou coragem para esvaziar e limpar o aspirador, e a masmorra já pede mais!"
        br: "@@@session.user.name@@@ tomou coragem para esvaziar e limpar o aspirador, e a masmorra já pede mais!"
        nl: "@@@session.user.name@@@ heeft moed verzameld om de stofzuiger te legen en schoon te maken, en de kerker vraagt al om meer!"
      dt_t_extras_04:
        fr: "Changer une ampoule"
        en: "Change a light bulb"
        es: "Cambiar una bombilla"
        de: "Glühbirne wechseln"
        it: "Cambiare una lampadina"
        pt: "Mudar uma lâmpada"
        br: "Trocar uma lâmpada"
        nl: "Een lamp vervangen"
      dt_a_extras_04:
        fr: "Une ampoule a rendu l'âme et plonge la pièce dans l'ombre. Remplace-la pour rendre la lumière."
        en: "A light bulb has died and plunges the room into shadow. Replace it to restore the light."
        es: "Una bombilla se ha fundido y sume la habitación en la sombra. Cámbiala para devolver la luz."
        de: "Eine Glühbirne hat den Geist aufgegeben und taucht das Zimmer in Dunkelheit. Wechsle sie, damit es wieder hell wird."
        it: "Una lampadina ha esalato l'ultimo respiro e lascia la stanza nell'ombra. Sostituiscila per riportare la luce."
        pt: "Uma lâmpada fundiu-se e mergulha a divisão na sombra. Muda-a para trazer a luz de volta."
        br: "Uma lâmpada queimou e mergulha o cômodo na sombra. Troque para trazer a luz de volta."
        nl: "Een lamp heeft de geest gegeven en hult de kamer in duisternis. Vervang hem zodat het weer licht wordt."
      dt_d_extras_04:
        fr: "@@@session.user.name@@@ vient de rendre la lumière en changeant l'ampoule !"
        en: "@@@session.user.name@@@ has just restored the light by changing the bulb!"
        es: "¡@@@session.user.name@@@ acaba de devolver la luz cambiando la bombilla!"
        de: "@@@session.user.name@@@ hat gerade mit einer neuen Glühbirne das Licht zurückgebracht!"
        it: "@@@session.user.name@@@ ha appena riportato la luce cambiando la lampadina!"
        pt: "@@@session.user.name@@@ acabou de trazer a luz de volta ao mudar a lâmpada!"
        br: "@@@session.user.name@@@ acabou de trazer a luz de volta ao trocar a lâmpada!"
        nl: "@@@session.user.name@@@ heeft zojuist het licht teruggebracht door de lamp te vervangen!"
      dt_c_extras_04:
        fr: "@@@session.user.name@@@ a mis du cœur à changer l'ampoule, mais la tâche a tenu bon cette fois !"
        en: "@@@session.user.name@@@ put real heart into changing the light bulb, but the task held out this time!"
        es: "¡@@@session.user.name@@@ puso mucho empeño en cambiar la bombilla, pero la tarea aguantó esta vez!"
        de: "@@@session.user.name@@@ hat sich mit viel Herz daran gemacht, die Glühbirne zu wechseln, aber die Aufgabe hat diesmal standgehalten!"
        it: "@@@session.user.name@@@ ci ha messo il cuore per cambiare la lampadina, ma la faccenda ha resistito, stavolta!"
        pt: "@@@session.user.name@@@ pôs muito empenho em mudar a lâmpada, mas a tarefa resistiu desta vez!"
        br: "@@@session.user.name@@@ se empenhou muito em trocar a lâmpada, mas a tarefa resistiu desta vez!"
        nl: "@@@session.user.name@@@ heeft er met hart en ziel aan gewerkt om de lamp te vervangen, maar de taak hield deze keer stand!"
      dt_t_extras_05:
        fr: "Nettoyer les interrupteurs"
        en: "Clean light switches"
        es: "Limpiar los interruptores"
        de: "Lichtschalter putzen"
        it: "Pulire gli interruttori"
        pt: "Limpar os interruptores"
        br: "Limpar os interruptores"
        nl: "Lichtknoppen schoonmaken"
      dt_a_extras_05:
        fr: "Des germes-rampants couvrent interrupteurs. Nettoie et désinfecte chacun d'eux."
        en: "Crawling germs cover the light switches. Clean and disinfect every one."
        es: "Gérmenes reptantes cubren los interruptores. Limpia y desinfecta cada uno."
        de: "Krabbelkeime bedecken die Lichtschalter. Putz und desinfiziere jeden einzelnen."
        it: "Germi striscianti ricoprono gli interruttori. Pulisci e disinfetta ognuno di loro."
        pt: "Germes rastejantes cobrem os interruptores. Limpa e desinfeta cada um deles."
        br: "Germes rastejantes cobrem os interruptores. Limpe e desinfete cada um deles."
        nl: "Kruipkiemen bedekken de lichtknoppen. Maak ze allemaal schoon en ontsmet ze een voor een."
      dt_d_extras_05:
        fr: "@@@session.user.name@@@ vient d'éradiquer les germes-rampants des interrupteurs!"
        en: "@@@session.user.name@@@ has just eradicated the crawling germs of the switches!"
        es: "¡@@@session.user.name@@@ acaba de erradicar los gérmenes reptantes de interruptores!"
        de: "@@@session.user.name@@@ hat gerade die Krabbelkeime von den Lichtschaltern vertrieben!"
        it: "@@@session.user.name@@@ ha appena sterminato i germi striscianti degli interruttori!"
        pt: "@@@session.user.name@@@ acabou de erradicar os germes rastejantes dos interruptores!"
        br: "@@@session.user.name@@@ acabou de erradicar os germes rastejantes dos interruptores!"
        nl: "@@@session.user.name@@@ heeft zojuist de kruipkiemen van de lichtknoppen uitgeroeid!"
      dt_c_extras_05:
        fr: "@@@session.user.name@@@ a bataillé pour nettoyer les interrupteurs, mais un dragon est passé par là au mauvais moment !"
        en: "@@@session.user.name@@@ battled away at cleaning the switches, but a dragon flew past at the worst moment!"
        es: "¡@@@session.user.name@@@ batalló para limpiar los interruptores, pero pasó un dragón en el peor momento!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die Lichtschalter zu putzen, aber im dümmsten Moment kam ein Drache vorbei!"
        it: "@@@session.user.name@@@ ha lottato per pulire gli interruttori, ma un drago è passato proprio nel momento peggiore!"
        pt: "@@@session.user.name@@@ batalhou para limpar os interruptores, mas passou um dragão no pior momento!"
        br: "@@@session.user.name@@@ batalhou para limpar os interruptores, mas passou um dragão na pior hora!"
        nl: "@@@session.user.name@@@ heeft gezwoegd om de lichtknoppen schoon te maken, maar op het slechtste moment kwam er een draak langs!"
      dt_t_extras_06:
        fr: "Nettoyer les portes"
        en: "Clean the doors"
        es: "Limpiar las puertas"
        de: "Türen putzen"
        it: "Pulire le porte"
        pt: "Limpar as portas"
        br: "Limpar as portas"
        nl: "De deuren schoonmaken"
      dt_a_extras_06:
        fr: "Des traces de doigts et de la crasse maculent les portes. Nettoie-les jusqu'à des battants nets."
        en: "Fingerprints and grime stain the doors. Clean them until the panels are spotless."
        es: "Huellas y mugre manchan las puertas. Límpialas hasta dejar las hojas impecables."
        de: "Fingerabdrücke und Dreck verschmieren die Türen. Putz sie, bis sie wieder sauber sind."
        it: "Impronte di dita e sporco macchiano le porte. Puliscile finché sono impeccabili."
        pt: "Dedadas e sujidade mancham as portas. Limpa-as até ficarem impecáveis."
        br: "Marcas de dedos e sujeira mancham as portas. Limpe até ficarem impecáveis."
        nl: "Vingerafdrukken en vuil besmeuren de deuren. Maak ze schoon tot ze weer smetteloos zijn."
      dt_d_extras_06:
        fr: "@@@session.user.name@@@ vient d'effacer les traces des portes !"
        en: "@@@session.user.name@@@ has just wiped the marks off the doors!"
        es: "¡@@@session.user.name@@@ acaba de borrar las marcas de las puertas!"
        de: "@@@session.user.name@@@ hat gerade die Spuren von den Türen gewischt!"
        it: "@@@session.user.name@@@ ha appena cancellato le impronte dalle porte!"
        pt: "@@@session.user.name@@@ acabou de apagar as marcas das portas!"
        br: "@@@session.user.name@@@ acabou de apagar as marcas das portas!"
        nl: "@@@session.user.name@@@ heeft zojuist de sporen van de deuren geveegd!"
      dt_c_extras_06:
        fr: "@@@session.user.name@@@ a bataillé pour nettoyer les portes, mais un dragon est passé par là au mauvais moment !"
        en: "@@@session.user.name@@@ battled away at cleaning the doors, but a dragon flew past at the worst moment!"
        es: "¡@@@session.user.name@@@ batalló para limpiar las puertas, pero pasó un dragón en el peor momento!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die Türen zu putzen, aber im dümmsten Moment kam ein Drache vorbei!"
        it: "@@@session.user.name@@@ ha lottato per pulire le porte, ma un drago è passato proprio nel momento peggiore!"
        pt: "@@@session.user.name@@@ batalhou para limpar as portas, mas passou um dragão no pior momento!"
        br: "@@@session.user.name@@@ batalhou para limpar as portas, mas passou um dragão na pior hora!"
        nl: "@@@session.user.name@@@ heeft gezwoegd om de deuren schoon te maken, maar op het slechtste moment kwam er een draak langs!"
      dt_t_extras_07:
        fr: "Aérer la maison"
        en: "Air out the house"
        es: "Ventilar la casa"
        de: "Haus lüften"
        it: "Arieggiare la casa"
        pt: "Arejar a casa"
        br: "Arejar a casa"
        nl: "Het huis luchten"
      dt_a_extras_07:
        fr: "L'air vicié et les miasmes stagnent dans les pièces. Aère pour chasser l'air corrompu."
        en: "Stale air and miasmas stagnate in the rooms. Air them out to drive off the corrupted air."
        es: "El aire viciado y los miasmas se estancan en las habitaciones. Ventila para expulsar el aire corrompido."
        de: "Verbrauchte Luft und üble Dünste hängen in den Zimmern. Lüfte, um die verdorbene Luft zu vertreiben."
        it: "Aria viziata e miasmi ristagnano nelle stanze. Arieggia per scacciare l'aria corrotta."
        pt: "O ar viciado e os miasmas estagnam nas divisões. Areja para expulsar o ar corrompido."
        br: "O ar abafado e os miasmas estagnam nos cômodos. Abra as janelas para expulsar o ar corrompido."
        nl: "Muffe lucht en vieze dampen blijven in de kamers hangen. Lucht ze om de bedorven lucht te verdrijven."
      dt_d_extras_07:
        fr: "@@@session.user.name@@@ vient de chasser l'air vicié des pièces !"
        en: "@@@session.user.name@@@ has just driven the stale air from the rooms!"
        es: "¡@@@session.user.name@@@ acaba de expulsar el aire viciado de las habitaciones!"
        de: "@@@session.user.name@@@ hat gerade die verbrauchte Luft aus den Zimmern vertrieben!"
        it: "@@@session.user.name@@@ ha appena scacciato l'aria viziata dalle stanze!"
        pt: "@@@session.user.name@@@ acabou de expulsar o ar viciado das divisões!"
        br: "@@@session.user.name@@@ acabou de expulsar o ar abafado dos cômodos!"
        nl: "@@@session.user.name@@@ heeft zojuist de muffe lucht uit de kamers verdreven!"
      dt_c_extras_07:
        fr: "@@@session.user.name@@@ a retroussé ses manches pour aérer les pièces, mais la tâche a tenu bon cette fois !"
        en: "@@@session.user.name@@@ rolled up both sleeves for airing out the rooms, but the task held out this time!"
        es: "¡@@@session.user.name@@@ se remangó para ventilar las habitaciones, pero la tarea aguantó esta vez!"
        de: "@@@session.user.name@@@ hat die Ärmel hochgekrempelt, um die Zimmer zu lüften, aber die Aufgabe hat diesmal standgehalten!"
        it: "@@@session.user.name@@@ ha tirato su le maniche per arieggiare le stanze, ma la faccenda ha resistito, stavolta!"
        pt: "@@@session.user.name@@@ arregaçou as mangas para arejar as divisões, mas a tarefa resistiu desta vez!"
        br: "@@@session.user.name@@@ arregaçou as mangas para arejar os cômodos, mas a tarefa resistiu desta vez!"
        nl: "@@@session.user.name@@@ heeft de mouwen opgestroopt om de kamers te luchten, maar de taak hield deze keer stand!"
      dt_t_extras_08:
        fr: "Rendre un service"
        en: "Do a favour"
        es: "Hacer un favor"
        de: "Einen Gefallen tun"
        it: "Fare un favore"
        pt: "Fazer um favor"
        br: "Fazer um favor"
        nl: "Iemand een plezier doen"
      dt_a_extras_08:
        fr: "Quelqu'un de ta famille est dans l'embarras et guette ton aide. Rends-lui le service qu'il attend avant que la détresse ne s'installe."
        en: "Someone in your family is in a bind and awaits your help. Do them the favour they need before the distress sets in."
        es: "Alguien de tu familia está en apuros y espera tu ayuda. Hazle el favor que necesita antes de que se instale la angustia."
        de: "Jemand aus deiner Familie steckt in der Klemme und hofft auf deine Hilfe. Tu ihm den Gefallen, bevor die Not zu groß wird."
        it: "Qualcuno della tua famiglia è in difficoltà e aspetta il tuo aiuto. Fagli il favore che gli serve prima che l'angoscia prenda il sopravvento."
        pt: "Alguém da tua família está em apuros e espera a tua ajuda. Faz-lhe o favor de que precisa antes que a aflição se instale."
        br: "Alguém da sua família está em apuros e espera sua ajuda. Faça o favor de que ele precisa antes que a aflição se instale."
        nl: "Iemand uit je gezin zit in de knel en wacht op je hulp. Doe diegene het plezier dat nodig is voordat de nood toeslaat."
      dt_d_extras_08:
        fr: "@@@session.user.name@@@ vient de rendre le service attendu !"
        en: "@@@session.user.name@@@ has just done the awaited favour!"
        es: "¡@@@session.user.name@@@ acaba de hacer el favor esperado!"
        de: "@@@session.user.name@@@ hat gerade den erhofften Gefallen getan!"
        it: "@@@session.user.name@@@ ha appena fatto il favore atteso!"
        pt: "@@@session.user.name@@@ acabou de fazer o favor esperado!"
        br: "@@@session.user.name@@@ acabou de fazer o favor esperado!"
        nl: "@@@session.user.name@@@ heeft zojuist het verwachte plezier gedaan!"
      dt_c_extras_08:
        fr: "@@@session.user.name@@@ a bataillé pour rendre le service, mais l'aventure demandera un second passage !"
        en: "@@@session.user.name@@@ battled away at doing the favour, but the adventure will need a second run!"
        es: "¡@@@session.user.name@@@ batalló para hacer el favor, pero la aventura pedirá una segunda vuelta!"
        de: "@@@session.user.name@@@ hat sich abgemüht, den Gefallen zu tun, aber das Abenteuer braucht eine zweite Runde!"
        it: "@@@session.user.name@@@ ha lottato per fare il favore, ma l'avventura richiederà un secondo giro!"
        pt: "@@@session.user.name@@@ batalhou para fazer o favor, mas a aventura vai pedir uma segunda volta!"
        br: "@@@session.user.name@@@ batalhou para fazer o favor, mas a aventura vai pedir uma segunda rodada!"
        nl: "@@@session.user.name@@@ heeft gezwoegd om iemand een plezier te doen, maar het avontuur vraagt om een tweede ronde!"


        fr: "@@@session.user.name@@@ a donné l'assaut contre les reflets ternes du miroir de la chambre enfant, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ led the assault on the dull reflections of the children's bedroom mirror, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ dio el asalto contra los reflejos turbios del espejo de la habitación infantil, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ hat die trüben Spiegelungen im Kinderzimmer angegriffen, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha dato l'assalto ai riflessi opachi dello specchio della cameretta dei bambini, ma è passato di lì un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ lançou o assalto contra os reflexos baços do espelho do quarto das crianças, mas passou por ali um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ partiu para o ataque contra os reflexos embaçados do espelho do quarto das crianças, mas um dragão passou por ali e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ bestormde de doffe weerspiegelingen van de spiegel in de kinderkamer, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"

        fr: "Changer l'eau de la bête"
        en: "Change the beast's water"
        es: "Cambiar el agua de la bestia"
        de: "Dem Biest frisches Wasser geben"
        it: "Cambiare l'acqua alla bestia"
        pt: "Mudar a água da fera"
        br: "Trocar a água da fera"
        nl: "Het water van het beest verversen"

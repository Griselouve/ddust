        fr: "Les miasmes du matelas s'accumulent dans la chambre parentale. Retourne ou aère le matelas jusqu'à le rendre sain et frais."
        en: "Mattress miasmas build up in the master bedroom. Flip or air the mattress until it is fresh and healthy."

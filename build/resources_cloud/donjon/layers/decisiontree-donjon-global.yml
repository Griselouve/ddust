      dt_d_jardin_05:
        fr: "@@@session.user.name@@@ vient d'arracher les herbes-gobelines du jardin !"
        en: "@@@session.user.name@@@ has just torn out the weed-goblins of the garden!"
        es: "¡@@@session.user.name@@@ acaba de arrancar las hierbas-trasgo del jardín!"
        de: "@@@session.user.name@@@ hat gerade die Unkrautkobolde im Garten ausgerissen!"
        it: "@@@session.user.name@@@ ha appena estirpato le erbacce-goblin del giardino!"
        pt: "@@@session.user.name@@@ acabou de arrancar as ervas-trasgo do jardim!"
        br: "@@@session.user.name@@@ acabou de arrancar as ervas-trasgo do jardim!"
        nl: "@@@session.user.name@@@ heeft net de onkruidkobolden uit de tuin getrokken!"
      dt_c_jardin_05:
        fr: "@@@session.user.name@@@ a donné l'assaut contre les herbes-gobelines du jardin, mais la nuit est tombée sur le donjon avant la fin !"
        en: "@@@session.user.name@@@ led the assault on the weed-goblins of the garden, but night fell on the dungeon before the end!"
        es: "¡@@@session.user.name@@@ dio el asalto contra las hierbas-trasgo del jardín, pero cayó la noche sobre la mazmorra antes del final!"
        de: "@@@session.user.name@@@ hat die Unkrautkobolde im Garten angegriffen, aber die Nacht brach über den Kerker herein, bevor es vorbei war!"
        it: "@@@session.user.name@@@ ha dato l'assalto alle erbacce-goblin del giardino, ma è calata la notte sul dungeon prima della fine!"
        pt: "@@@session.user.name@@@ lançou o assalto contra as ervas-trasgo do jardim, mas a noite caiu sobre a masmorra antes do fim!"
        br: "@@@session.user.name@@@ partiu para o ataque contra as ervas-trasgo do jardim, mas a noite caiu sobre a masmorra antes do fim!"
        nl: "@@@session.user.name@@@ bestormde de onkruidkobolden in de tuin, maar de nacht viel over de kerker voor het einde!"
      dt_t_jardin_06:
        fr: "Tailler les haies ou les plantes"
        en: "Trim the hedges or plants"
        es: "Recortar los setos o las plantas"
        de: "Hecken oder Pflanzen schneiden"
        it: "Potare siepi o piante"
        pt: "Aparar sebes ou plantas"
        br: "Aparar cercas vivas ou plantas"
        nl: "Heggen of planten snoeien"
      dt_a_jardin_06:
        fr: "Les haies-trolls poussent en broussaille dans le jardin. Taille haies et plantes jusqu'à des formes nettes."
        en: "Hedge-trolls grow wild and bushy in the garden. Trim the hedges and plants until they are neatly shaped."
        es: "Los setos-trol crecen enmarañados en el jardín. Recorta setos y plantas hasta darles forma limpia."
        de: "Heckentrolle wuchern struppig im Garten. Schneide Hecken und Pflanzen, bis sie ordentlich in Form sind."
        it: "Le siepi-troll crescono arruffate nel giardino. Pota siepi e piante finché non hanno una forma ordinata."
        pt: "As sebes-trol crescem emaranhadas no jardim. Apara sebes e plantas até ficarem com uma forma bem definida."
        br: "As cercas-vivas-troll crescem emaranhadas no jardim. Apare cercas e plantas até ficarem com uma forma bem definida."
        nl: "Haagtrollen groeien wild en ruig in de tuin. Snoei heggen en planten tot ze netjes in vorm zijn."
      dt_d_jardin_06:
        fr: "@@@session.user.name@@@ vient de dompter les haies-trolls du jardin !"
        en: "@@@session.user.name@@@ has just tamed the hedge-trolls of the garden!"
        es: "¡@@@session.user.name@@@ acaba de domar a los setos-trol del jardín!"
        de: "@@@session.user.name@@@ hat gerade die Heckentrolle im Garten gezähmt!"
        it: "@@@session.user.name@@@ ha appena domato le siepi-troll del giardino!"
        pt: "@@@session.user.name@@@ acabou de domar as sebes-trol do jardim!"
        br: "@@@session.user.name@@@ acabou de domar as cercas-vivas-troll do jardim!"
        nl: "@@@session.user.name@@@ heeft net de haagtrollen in de tuin getemd!"
      dt_c_jardin_06:
        fr: "@@@session.user.name@@@ a tenu tête aux haies-trolls du jardin, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ stood up to the hedge-trolls of the garden, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ le plantó cara a los setos-trol del jardín, pero el hechizo salió mal en el último momento!"
        de: "@@@session.user.name@@@ hat den Heckentrollen im Garten die Stirn geboten, aber der Zauber ging im letzten Moment schief!"
        it: "@@@session.user.name@@@ ha tenuto testa alle siepi-troll del giardino, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "@@@session.user.name@@@ fez frente às sebes-trol do jardim, mas o feitiço correu mal no último momento!"
        br: "@@@session.user.name@@@ enfrentou as cercas-vivas-troll do jardim, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ bood de haagtrollen in de tuin het hoofd, maar de spreuk liep op het laatste moment mis!"

      #------------- Tâches — linge ------------------------------------

      dt_t_linge_01:
        fr: "Trier le linge sale"
        en: "Sort the dirty laundry"
        es: "Clasificar la ropa sucia"
        de: "Schmutzwäsche sortieren"
        it: "Dividere il bucato sporco"
        pt: "Separar a roupa suja"
        br: "Separar a roupa suja"
        nl: "Vuile was sorteren"
      dt_a_linge_01:
        fr: "Un tas-troll de linge sale grandit dans le panier. Trie blanc, couleur et délicat en piles distinctes."
        en: "A laundry-troll of dirty clothes grows in the basket. Sort whites, colours and delicates into separate piles."
        es: "Un troll de ropa sucia crece en el cesto. Clasifica blancos, colores y delicados en montones separados."
        de: "Ein Wäschetroll aus Schmutzwäsche wächst im Korb. Sortiere Weißes, Buntes und Feines auf getrennte Stapel."
        it: "Un troll del bucato sporco cresce nel cesto. Dividi bianchi, colorati e delicati in mucchi separati."
        pt: "Um trol de roupa suja cresce no cesto. Separa brancos, cores e delicados em montes diferentes."
        br: "Um troll de roupa suja cresce no cesto. Separe brancas, coloridas e delicadas em montes diferentes."
        nl: "Een wastrol van vuile kleren groeit in de mand. Sorteer wit, bont en fijn op aparte stapels."
      dt_d_linge_01:
        fr: "@@@session.user.name@@@ vient de trier le tas-troll de linge sale !"
        en: "@@@session.user.name@@@ has just sorted the laundry-troll of dirty clothes!"
        es: "¡@@@session.user.name@@@ acaba de clasificar el troll de ropa sucia!"
        de: "@@@session.user.name@@@ hat gerade den Wäschetroll aus Schmutzwäsche sortiert!"
        it: "@@@session.user.name@@@ ha appena diviso il troll del bucato sporco!"
        pt: "@@@session.user.name@@@ acabou de separar o trol de roupa suja!"
        br: "@@@session.user.name@@@ acabou de separar o troll de roupa suja!"
        nl: "@@@session.user.name@@@ heeft net de wastrol van vuile kleren gesorteerd!"
      dt_c_linge_01:
        fr: "@@@session.user.name@@@ a livré un beau combat contre le tas-troll de linge sale, mais le sortilège a mal tourné au dernier moment !"
        en: "@@@session.user.name@@@ put up a fine fight against the laundry-troll of dirty clothes, but the spell went wrong at the last moment!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra el troll de ropa sucia, pero el hechizo salió mal en el último momento!"
        de: "@@@session.user.name@@@ hat sich einen tollen Kampf mit dem Wäschetroll geliefert, aber der Zauber ging im letzten Moment schief!"
        it: "@@@session.user.name@@@ ha combattuto una bella battaglia contro il troll del bucato sporco, ma l'incantesimo è andato storto all'ultimo momento!"
        pt: "@@@session.user.name@@@ travou um belo combate contra o trol de roupa suja, mas o feitiço correu mal no último momento!"
        br: "@@@session.user.name@@@ travou um belo combate contra o troll de roupa suja, mas o feitiço deu errado no último momento!"
        nl: "@@@session.user.name@@@ leverde een mooi gevecht tegen de wastrol van vuile kleren, maar de spreuk liep op het laatste moment mis!"
      dt_t_linge_02:
        fr: "Lancer une machine à laver"
        en: "Run a washing machine cycle"
        es: "Poner una lavadora"
        de: "Waschmaschine anstellen"
        it: "Fare una lavatrice"
        pt: "Pôr a máquina a lavar"
        br: "Ligar a máquina de lavar"
        nl: "Wasmachine aanzetten"
      dt_a_linge_02:
        fr: "Le tas-troll de linge sale réclame le bain purificateur. Lance une machine à laver adaptée et démarre le cycle."
        en: "The laundry-troll of dirty clothes demands the cleansing bath. Start a suitable washing machine cycle."
        es: "El troll de ropa sucia reclama el baño purificador. Pon una lavadora adecuada y arranca el ciclo."
        de: "Der Wäschetroll verlangt nach dem reinigenden Bad. Wähle das passende Waschprogramm und starte die Maschine."
        it: "Il troll del bucato sporco reclama il bagno purificatore. Scegli il lavaggio adatto e avvia la lavatrice."
        pt: "O trol de roupa suja exige o banho purificador. Escolhe o programa certo e põe a máquina a trabalhar."
        br: "O troll de roupa suja exige o banho purificador. Escolha o programa certo e coloque a máquina para trabalhar."
        nl: "De wastrol eist het reinigende bad. Kies het juiste wasprogramma en zet de machine aan."
      dt_d_linge_02:
        fr: "@@@session.user.name@@@ vient de jeter le linge sale dans le bain purificateur !"
        en: "@@@session.user.name@@@ has just cast the dirty laundry into the cleansing bath!"
        es: "¡@@@session.user.name@@@ acaba de arrojar la ropa sucia al baño purificador!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzwäsche ins reinigende Bad geworfen!"
        it: "@@@session.user.name@@@ ha appena gettato il bucato sporco nel bagno purificatore!"
        pt: "@@@session.user.name@@@ acabou de atirar a roupa suja para o banho purificador!"
        br: "@@@session.user.name@@@ acabou de jogar a roupa suja no banho purificador!"
        nl: "@@@session.user.name@@@ heeft net de vuile was in het reinigende bad gegooid!"
      dt_c_linge_02:
        fr: "@@@session.user.name@@@ a donné de sa peine pour lancer la machine à laver, mais le temps a manqué avant la victoire !"
        en: "@@@session.user.name@@@ worked hard at starting the washing machine, but time ran out before victory!"
        es: "¡@@@session.user.name@@@ se esforzó para poner la lavadora, pero se acabó el tiempo antes de la victoria!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die Waschmaschine anzustellen, aber vor dem Sieg lief die Zeit ab!"
        it: "@@@session.user.name@@@ ha faticato per avviare la lavatrice, ma è mancato il tempo prima della vittoria!"
        pt: "@@@session.user.name@@@ esforçou-se para pôr a máquina a lavar, mas faltou tempo antes da vitória!"
        br: "@@@session.user.name@@@ se esforçou para ligar a máquina de lavar, mas faltou tempo antes da vitória!"
        nl: "@@@session.user.name@@@ sloofde zich uit om de wasmachine aan te zetten, maar de tijd raakte op voor de overwinning!"
      dt_t_linge_02_alt:
        fr: "Emporter le linge à la laverie"
        en: "Take the laundry to the launderette"
        es: "Llevar la ropa a la lavandería"
        de: "Wäsche in den Waschsalon bringen"
        it: "Portare il bucato in lavanderia"
        pt: "Levar a roupa à lavandaria"
        br: "Levar a roupa à lavanderia"
        nl: "Was naar de wasserette brengen"
      dt_a_linge_02_alt:
        fr: "Le tas-troll de linge sale doit voyager. Emporte-le à la laverie et lance le lavage."
        en: "The laundry-troll of dirty clothes must travel. Take it to the launderette and start the wash."
        es: "El troll de ropa sucia debe viajar. Llévalo a la lavandería y pon el lavado."
        de: "Der Wäschetroll muss auf Reisen gehen. Bring ihn in den Waschsalon und starte die Wäsche."
        it: "Il troll del bucato sporco deve mettersi in viaggio. Portalo in lavanderia e avvia il lavaggio."
        pt: "O trol de roupa suja tem de viajar. Leva-o à lavandaria e põe a lavagem a andar."
        br: "O troll de roupa suja tem que viajar. Leve-o à lavanderia e coloque a lavagem para rodar."
        nl: "De wastrol moet op reis. Breng hem naar de wasserette en start de was."
      dt_d_linge_02_alt:
        fr: "@@@session.user.name@@@ vient de porter le linge sale jusqu'à la laverie !"
        en: "@@@session.user.name@@@ has just carried the dirty laundry to the launderette!"
        es: "¡@@@session.user.name@@@ acaba de llevar la ropa sucia a la lavandería!"
        de: "@@@session.user.name@@@ hat gerade die Schmutzwäsche bis in den Waschsalon geschleppt!"
        it: "@@@session.user.name@@@ ha appena portato il bucato sporco fino in lavanderia!"
        pt: "@@@session.user.name@@@ acabou de levar a roupa suja até à lavandaria!"
        br: "@@@session.user.name@@@ acabou de levar a roupa suja até a lavanderia!"
        nl: "@@@session.user.name@@@ heeft net de vuile was naar de wasserette gesjouwd!"
      dt_c_linge_02_alt:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour porter le linge à la laverie, mais un dragon est passé par là au mauvais moment !"
        en: "@@@session.user.name@@@ took a deep breath and started taking the laundry to the launderette, but a dragon flew past at the worst moment!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a llevar la ropa a la lavandería, pero pasó un dragón en el peor momento!"
        de: "@@@session.user.name@@@ nahm allen Mut zusammen, um die Wäsche in den Waschsalon zu bringen, aber im dümmsten Moment flog ein Drache vorbei!"
        it: "@@@session.user.name@@@ ha preso il coraggio a due mani per portare il bucato in lavanderia, ma è passato un drago nel momento peggiore!"
        pt: "@@@session.user.name@@@ ganhou coragem para levar a roupa à lavandaria, mas passou um dragão no pior momento!"
        br: "@@@session.user.name@@@ tomou coragem para levar a roupa à lavanderia, mas passou um dragão na pior hora!"
        nl: "@@@session.user.name@@@ vatte moed om de was naar de wasserette te brengen, maar op het slechtste moment vloog er een draak voorbij!"
      dt_t_linge_03:
        fr: "Étendre le linge"
        en: "Hang out the laundry"
        es: "Tender la ropa"
        de: "Wäsche aufhängen"
        it: "Stendere il bucato"
        pt: "Estender a roupa"
        br: "Estender a roupa"
        nl: "Was ophangen"
      dt_a_linge_03:
        fr: "Le linge mouillé sort du bain et risque le moisi. Étends-le entièrement pour qu'il sèche."
        en: "The wet laundry leaves the bath and risks mould. Hang it all out to dry."
        es: "La ropa mojada sale del baño y corre riesgo de moho. Tiéndela toda para que se seque."
        de: "Die nasse Wäsche kommt aus dem Bad und droht zu schimmeln. Häng alles zum Trocknen auf."
        it: "Il bucato bagnato esce dal bagno e rischia la muffa. Stendilo tutto perché si asciughi."
        pt: "A roupa molhada sai do banho e corre o risco de ganhar bolor. Estende-a toda para secar."
        br: "A roupa molhada sai do banho e corre o risco de mofar. Estenda tudo para secar."
        nl: "De natte was komt uit het bad en dreigt te beschimmelen. Hang alles op om te drogen."
      dt_d_linge_03:
        fr: "@@@session.user.name@@@ vient d'étendre le linge mouillé à sécher !"
        en: "@@@session.user.name@@@ has just hung out the wet laundry to dry!"
        es: "¡@@@session.user.name@@@ acaba de tender la ropa mojada para secar!"
        de: "@@@session.user.name@@@ hat gerade die nasse Wäsche zum Trocknen aufgehängt!"
        it: "@@@session.user.name@@@ ha appena steso il bucato bagnato ad asciugare!"
        pt: "@@@session.user.name@@@ acabou de estender a roupa molhada a secar!"
        br: "@@@session.user.name@@@ acabou de estender a roupa molhada para secar!"
        nl: "@@@session.user.name@@@ heeft net de natte was te drogen gehangen!"
      dt_c_linge_03:
        fr: "@@@session.user.name@@@ a mis du cœur à étendre le linge mouillé, et le donjon en redemande déjà !"
        en: "@@@session.user.name@@@ put real heart into hanging out the wet laundry, and the dungeon is already asking for more!"
        es: "¡@@@session.user.name@@@ puso mucho empeño en tender la ropa mojada, y la mazmorra ya pide más!"
        de: "@@@session.user.name@@@ hat sich beim Aufhängen der nassen Wäsche richtig ins Zeug gelegt, und der Kerker will schon mehr!"
        it: "@@@session.user.name@@@ ha messo il cuore nello stendere il bucato bagnato, e il dungeon ne chiede già ancora!"
        pt: "@@@session.user.name@@@ empenhou-se a sério a estender a roupa molhada, e a masmorra já pede mais!"
        br: "@@@session.user.name@@@ se esforçou de verdade para estender a roupa molhada, e a masmorra já pede mais!"
        nl: "@@@session.user.name@@@ zette zich met hart en ziel in om de natte was op te hangen, en de kerker vraagt al om meer!"
      dt_t_linge_04:
        fr: "Ramasser le linge sec"
        en: "Collect the dry laundry"
        es: "Recoger la ropa seca"
        de: "Trockene Wäsche abnehmen"
        it: "Ritirare il bucato asciutto"
        pt: "Apanhar a roupa seca"
        br: "Recolher a roupa seca"
        nl: "Droge was afhalen"
      dt_a_linge_04:
        fr: "Le linge sec attend sur le fil. Ramasse-le entièrement avant qu'il ne reprenne la poussière."
        en: "The dry laundry waits on the line. Collect it all before it gathers dust again."
        es: "La ropa seca espera en el tendedero. Recógela toda antes de que vuelva a coger polvo."
        de: "Die trockene Wäsche wartet auf der Leine. Nimm alles ab, bevor sie wieder Staub fängt."
        it: "Il bucato asciutto aspetta sul filo. Ritiralo tutto prima che riprenda polvere."
        pt: "A roupa seca espera no estendal. Apanha-a toda antes que volte a ganhar pó."
        br: "A roupa seca espera no varal. Recolha tudo antes que junte poeira de novo."
        nl: "De droge was wacht aan de lijn. Haal alles af voordat hij weer stof vangt."
      dt_d_linge_04:
        fr: "@@@session.user.name@@@ vient de ramasser le linge sec du fil !"
        en: "@@@session.user.name@@@ has just collected the dry laundry from the line!"
        es: "¡@@@session.user.name@@@ acaba de recoger la ropa seca del tendedero!"
        de: "@@@session.user.name@@@ hat gerade die trockene Wäsche von der Leine genommen!"
        it: "@@@session.user.name@@@ ha appena ritirato il bucato asciutto dal filo!"
        pt: "@@@session.user.name@@@ acabou de apanhar a roupa seca do estendal!"
        br: "@@@session.user.name@@@ acabou de recolher a roupa seca do varal!"
        nl: "@@@session.user.name@@@ heeft net de droge was van de lijn gehaald!"
      dt_c_linge_04:
        fr: "@@@session.user.name@@@ a bataillé pour ramasser le linge sec, et le donjon en redemande déjà !"
        en: "@@@session.user.name@@@ battled away at collecting the dry laundry, and the dungeon is already asking for more!"
        es: "¡@@@session.user.name@@@ batalló para recoger la ropa seca, y la mazmorra ya pide más!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die trockene Wäsche abzunehmen, und der Kerker will schon mehr!"
        it: "@@@session.user.name@@@ ha battagliato per ritirare il bucato asciutto, e il dungeon ne chiede già ancora!"
        pt: "@@@session.user.name@@@ batalhou para apanhar a roupa seca, e a masmorra já pede mais!"
        br: "@@@session.user.name@@@ batalhou para recolher a roupa seca, e a masmorra já pede mais!"
        nl: "@@@session.user.name@@@ zwoegde om de droge was af te halen, en de kerker vraagt al om meer!"
      dt_t_linge_05:
        fr: "Plier le linge"
        en: "Fold the laundry"
        es: "Doblar la ropa"
        de: "Wäsche falten"
        it: "Piegare il bucato"
        pt: "Dobrar a roupa"
        br: "Dobrar a roupa"
        nl: "Was vouwen"
      dt_a_linge_05:
        fr: "Le linge sec s'entasse en monticule chaotique. Plie chaque pièce jusqu'à des piles nettes."
        en: "The dry laundry piles into a chaotic mound. Fold every piece into neat stacks."
        es: "La ropa seca se amontona en un montón caótico. Dobla cada prenda en pilas ordenadas."
        de: "Die trockene Wäsche türmt sich zu einem chaotischen Berg. Falte jedes Teil zu ordentlichen Stapeln."
        it: "Il bucato asciutto si ammucchia in una montagna caotica. Piega ogni capo in pile ordinate."
        pt: "A roupa seca amontoa-se numa pilha caótica. Dobra cada peça em montes arrumados."
        br: "A roupa seca se amontoa numa pilha caótica. Dobre cada peça em montes arrumados."
        nl: "De droge was stapelt zich op tot een chaotische berg. Vouw elk stuk tot nette stapels."
      dt_d_linge_05:
        fr: "@@@session.user.name@@@ vient de plier le monticule de linge sec !"
        en: "@@@session.user.name@@@ has just folded the mound of dry laundry!"
        es: "¡@@@session.user.name@@@ acaba de doblar el montón de ropa seca!"
        de: "@@@session.user.name@@@ hat gerade den Berg trockener Wäsche gefaltet!"
        it: "@@@session.user.name@@@ ha appena piegato la montagna di bucato asciutto!"
        pt: "@@@session.user.name@@@ acabou de dobrar a pilha de roupa seca!"
        br: "@@@session.user.name@@@ acabou de dobrar a pilha de roupa seca!"
        nl: "@@@session.user.name@@@ heeft net de berg droge was gevouwen!"
      dt_c_linge_05:
        fr: "@@@session.user.name@@@ y a mis toute son énergie pour plier le linge sec, mais l'aventure demandera un second passage !"
        en: "@@@session.user.name@@@ threw every bit of energy into folding the dry laundry, but the adventure will need a second run!"
        es: "¡@@@session.user.name@@@ echó toda su energía en doblar la ropa seca, pero la aventura pedirá una segunda vuelta!"
        de: "@@@session.user.name@@@ hat alles gegeben, um die trockene Wäsche zu falten, aber das Abenteuer braucht eine zweite Runde!"
        it: "@@@session.user.name@@@ ha dato il massimo per piegare il bucato asciutto, ma l'avventura richiederà un secondo giro!"
        pt: "@@@session.user.name@@@ deu tudo para dobrar a roupa seca, mas a aventura vai pedir uma segunda volta!"
        br: "@@@session.user.name@@@ deu tudo para dobrar a roupa seca, mas a aventura vai pedir uma segunda rodada!"
        nl: "@@@session.user.name@@@ gaf alles om de droge was te vouwen, maar het avontuur vraagt om een tweede ronde!"
      dt_t_linge_06:
        fr: "Ranger le linge"
        en: "Put away the laundry"
        es: "Guardar la ropa"
        de: "Wäsche wegräumen"
        it: "Mettere via il bucato"
        pt: "Arrumar a roupa"
        br: "Guardar a roupa"
        nl: "Was opruimen"
      dt_a_linge_06:
        fr: "Le linge plié attend d'être mis à l'abri. Range chaque pile dans son armoire ou tiroir."
        en: "The folded laundry waits to be stored. Put every stack away in its wardrobe or drawer."
        es: "La ropa doblada espera ser guardada. Coloca cada pila en su armario o cajón."
        de: "Die gefaltete Wäsche will in Sicherheit gebracht werden. Räume jeden Stapel in seinen Schrank oder seine Schublade."
        it: "Il bucato piegato aspetta di essere messo al sicuro. Metti ogni pila nel suo armadio o cassetto."
        pt: "A roupa dobrada espera ser posta a salvo. Arruma cada monte no seu armário ou gaveta."
        br: "A roupa dobrada espera ser guardada em segurança. Guarde cada monte no armário ou na gaveta."
        nl: "De gevouwen was wacht om opgeborgen te worden. Leg elke stapel in de juiste kast of lade."
      dt_d_linge_06:
        fr: "@@@session.user.name@@@ vient de ranger tout le linge plié !"
        en: "@@@session.user.name@@@ has just put away all the folded laundry!"
        es: "¡@@@session.user.name@@@ acaba de guardar toda la ropa doblada!"
        de: "@@@session.user.name@@@ hat gerade die ganze gefaltete Wäsche weggeräumt!"
        it: "@@@session.user.name@@@ ha appena messo via tutto il bucato piegato!"
        pt: "@@@session.user.name@@@ acabou de arrumar toda a roupa dobrada!"
        br: "@@@session.user.name@@@ acabou de guardar toda a roupa dobrada!"
        nl: "@@@session.user.name@@@ heeft net alle gevouwen was opgeruimd!"
      dt_c_linge_06:
        fr: "@@@session.user.name@@@ a donné de sa peine pour ranger le linge plié, mais le temps a manqué avant la victoire !"
        en: "@@@session.user.name@@@ worked hard at putting away the folded laundry, but time ran out before victory!"
        es: "¡@@@session.user.name@@@ se esforzó para guardar la ropa doblada, pero se acabó el tiempo antes de la victoria!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die gefaltete Wäsche wegzuräumen, aber vor dem Sieg lief die Zeit ab!"
        it: "@@@session.user.name@@@ ha faticato per mettere via il bucato piegato, ma è mancato il tempo prima della vittoria!"
        pt: "@@@session.user.name@@@ esforçou-se para arrumar a roupa dobrada, mas faltou tempo antes da vitória!"
        br: "@@@session.user.name@@@ se esforçou para guardar a roupa dobrada, mas faltou tempo antes da vitória!"
        nl: "@@@session.user.name@@@ sloofde zich uit om de gevouwen was op te ruimen, maar de tijd raakte op voor de overwinning!"
      dt_t_linge_08:
        fr: "Repasser le linge"
        en: "Iron the laundry"
        es: "Planchar la ropa"
        de: "Wäsche bügeln"
        it: "Stirare il bucato"
        pt: "Passar a roupa a ferro"
        br: "Passar roupa"
        nl: "Was strijken"
      dt_a_linge_08:
        fr: "Des plis-gremlins froissent le linge propre. Repasse jusqu'à un linge lisse et net."
        en: "Wrinkle-gremlins crease the clean laundry. Iron until the clothes are smooth and crisp."
        es: "Gremlins de arrugas estrujan la ropa limpia. Plancha hasta dejar la ropa lisa y nítida."
        de: "Knitter-Gremlins zerknautschen die saubere Wäsche. Bügle, bis alles glatt und ordentlich ist."
        it: "Gremlin delle pieghe stropicciano il bucato pulito. Stira finché i vestiti non sono lisci e in ordine."
        pt: "Gremlins dos vincos amarrotam a roupa lavada. Passa a ferro até a roupa ficar lisa e impecável."
        br: "Gremlins do amassado amarrotam a roupa lavada. Passe a roupa até ela ficar lisa e impecável."
        nl: "Kreukelgremlins verfrommelen de schone was. Strijk tot alles glad en netjes is."
      dt_d_linge_08:
        fr: "@@@session.user.name@@@ vient d'écraser les plis-gremlins du linge !"
        en: "@@@session.user.name@@@ has just flattened the wrinkle-gremlins of the laundry!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los gremlins de arrugas de la ropa!"
        de: "@@@session.user.name@@@ hat gerade die Knitter-Gremlins der Wäsche plattgemacht!"
        it: "@@@session.user.name@@@ ha appena schiacciato i gremlin delle pieghe del bucato!"
        pt: "@@@session.user.name@@@ acabou de esmagar os gremlins-vincos da roupa!"
        br: "@@@session.user.name@@@ acabou de esmagar os gremlins-amassado da roupa!"
        nl: "@@@session.user.name@@@ heeft zojuist de kreukelgremlins van de was platgestreken!"
      dt_c_linge_08:
        fr: "@@@session.user.name@@@ a livré un beau combat contre les plis-gremlins du linge, mais l'ennemi avait tendu un piège !"
        en: "@@@session.user.name@@@ put up a fine fight against the wrinkle-gremlins of the laundry, but the enemy had set a trap!"
        es: "¡@@@session.user.name@@@ libró un buen combate contra los gremlins de arrugas de la ropa, pero el enemigo había tendido una trampa!"
        de: "@@@session.user.name@@@ hat sich tapfer gegen die Knitter-Gremlins der Wäsche geschlagen, aber der Feind hatte eine Falle gestellt!"
        it: "@@@session.user.name@@@ ha combattuto con onore contro i gremlin delle pieghe del bucato, ma il nemico aveva teso una trappola!"
        pt: "@@@session.user.name@@@ travou um belo combate contra os gremlins-vincos da roupa, mas o inimigo tinha montado uma armadilha!"
        br: "@@@session.user.name@@@ travou um belo combate contra os gremlins-amassado da roupa, mas o inimigo tinha armado uma armadilha!"
        nl: "@@@session.user.name@@@ heeft flink gevochten tegen de kreukelgremlins van de was, maar de vijand had een val gezet!"
      dt_t_linge_09:
        fr: "Entretenir la machine à laver (joint, bac, cycle à vide)"
        en: "Maintain the washing machine (seal, tray, empty cycle)"
        es: "Mantener la lavadora (junta, cajón, ciclo en vacío)"
        de: "Waschmaschine pflegen (Dichtung, Fach, Leerwaschgang)"
        it: "Pulire la lavatrice (guarnizione, vaschetta, ciclo a vuoto)"
        pt: "Cuidar da máquina de lavar (borracha, gaveta, ciclo em vazio)"
        br: "Cuidar da máquina de lavar (borracha, gaveta, ciclo vazio)"
        nl: "Wasmachine onderhouden (rubber, bakje, lege wasbeurt)"
      dt_a_linge_09:
        fr: "Un golem de moisi s'installe dans le joint et le bac de la machine à laver. Nettoie et lance un cycle à vide."
        en: "A mould-golem settles in the seal and tray of the washing machine. Clean them and run an empty cycle."
        es: "Un gólem de moho se instala en la junta y el cajón de la lavadora. Límpialos y pon un ciclo en vacío."
        de: "Ein Schimmelgolem macht es sich in der Dichtung und im Fach der Waschmaschine gemütlich. Mach sie sauber und starte einen Leerwaschgang."
        it: "Un golem di muffa si piazza nella guarnizione e nella vaschetta della lavatrice. Puliscile e fai partire un ciclo a vuoto."
        pt: "Um golem de bolor instala-se na borracha e na gaveta da máquina de lavar. Limpa-as e põe um ciclo em vazio."
        br: "Um golem de mofo se instala na borracha e na gaveta da máquina de lavar. Limpe as duas e rode um ciclo vazio."
        nl: "Een schimmelgolem nestelt zich in het rubber en het bakje van de wasmachine. Maak ze schoon en start een lege wasbeurt."
      dt_d_linge_09:
        fr: "@@@session.user.name@@@ vient de purger le golem de moisi de la machine à laver !"
        en: "@@@session.user.name@@@ has just purged the mould-golem of the washing machine!"
        es: "¡@@@session.user.name@@@ acaba de purgar al gólem de moho de la lavadora!"
        de: "@@@session.user.name@@@ hat gerade den Schimmelgolem aus der Waschmaschine vertrieben!"
        it: "@@@session.user.name@@@ ha appena scacciato il golem di muffa dalla lavatrice!"
        pt: "@@@session.user.name@@@ acabou de expulsar o golem de bolor da máquina de lavar!"
        br: "@@@session.user.name@@@ acabou de expulsar o golem de mofo da máquina de lavar!"
        nl: "@@@session.user.name@@@ heeft zojuist de schimmelgolem uit de wasmachine verdreven!"
      dt_c_linge_09:
        fr: "@@@session.user.name@@@ a tenu tête au golem de moisi de la machine à laver, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ stood up to the mould-golem of the washing machine, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ le plantó cara al gólem de moho de la lavadora, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat dem Schimmelgolem der Waschmaschine die Stirn geboten, und die Laterne ist im dümmsten Moment ausgegangen!"
        it: "@@@session.user.name@@@ ha tenuto testa al golem di muffa della lavatrice, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ fez frente ao golem de bolor da máquina de lavar, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ enfrentou o golem de mofo da máquina de lavar, e a lanterna apagou na pior hora!"
        nl: "@@@session.user.name@@@ heeft de schimmelgolem van de wasmachine het hoofd geboden, en de lantaarn ging op het slechtste moment uit!"

      #------------- Tâches — déchets ----------------------------------

      dt_t_dechets_01:
        fr: "Sortir les poubelles"
        en: "Take out the bins"
        es: "Sacar la basura"
        de: "Müll rausbringen"
        it: "Portare fuori la spazzatura"
        pt: "Levar o lixo à rua"
        br: "Levar o lixo para fora"
        nl: "Vuilnis buiten zetten"
      dt_a_dechets_01:
        fr: "Les nauséabonds blob-ordures contaminent la maison ! Sors les poubelles et remets un sac neuf. Attention aux petits déchets qu'ils laissent derrière, ce sont des pièges."
        en: "The stinking garbage blobs are contaminating the house! Take out the bins and fit a new bag. Beware the little scraps they leave behind, they are traps."
        es: "¡Los apestosos blobs de basura contaminan la casa! Saca la basura y pon una bolsa nueva. Cuidado con los pequeños restos que dejan, son trampas."
        de: "Die stinkenden Müll-Blobs verseuchen das Haus! Bring den Müll raus und leg einen neuen Beutel ein. Pass auf die kleinen Reste auf, die sie zurücklassen: Das sind Fallen."
        it: "I puzzolenti blob-spazzatura contaminano la casa! Porta fuori la spazzatura e metti un sacchetto nuovo. Attento ai piccoli rifiuti che lasciano dietro di sé, sono trappole."
        pt: "Os fedorentos blobs de lixo estão a contaminar a casa! Leva o lixo à rua e põe um saco novo. Cuidado com os restinhos que deixam para trás, são armadilhas."
        br: "Os fedorentos blobs de lixo estão contaminando a casa! Leve o lixo para fora e coloque um saco novo. Cuidado com os restinhos que ficam para trás, são armadilhas."
        nl: "De stinkende afvalblobs besmetten het huis! Zet het vuilnis buiten en doe er een nieuwe zak in. Pas op voor de kleine restjes die ze achterlaten, dat zijn vallen."
      dt_d_dechets_01:
        fr: "@@@session.user.name@@@ vient d'éliminer les blob-ordures de la maison !"
        en: "@@@session.user.name@@@ has just wiped out the garbage blobs of the house!"
        es: "¡@@@session.user.name@@@ acaba de eliminar los blobs de basura de la casa!"
        de: "@@@session.user.name@@@ hat gerade die Müll-Blobs aus dem Haus vertrieben!"
        it: "@@@session.user.name@@@ ha appena eliminato i blob-spazzatura della casa!"
        pt: "@@@session.user.name@@@ acabou de eliminar os blobs de lixo da casa!"
        br: "@@@session.user.name@@@ acabou de eliminar os blobs de lixo da casa!"
        nl: "@@@session.user.name@@@ heeft zojuist de afvalblobs uit het huis verjaagd!"
      dt_c_dechets_01:
        fr: "@@@session.user.name@@@ a lutté vaillamment contre la puanteur extrême des blob-ordures, mais la potion de courage était déjà vide !"
        en: "@@@session.user.name@@@ fought bravely against the foul stench of the garbage blobs, but the courage potion was already empty!"
        es: "¡@@@session.user.name@@@ luchó valientemente contra el hedor extremo de los blobs de basura, pero la poción de valor ya estaba vacía!"
        de: "@@@session.user.name@@@ hat tapfer gegen den fürchterlichen Gestank der Müll-Blobs gekämpft, aber der Mutrank war schon leer!"
        it: "@@@session.user.name@@@ ha lottato con coraggio contro la puzza tremenda dei blob-spazzatura, ma la pozione del coraggio era già vuota!"
        pt: "@@@session.user.name@@@ lutou com bravura contra o fedor terrível dos blobs de lixo, mas a poção de coragem já estava vazia!"
        br: "@@@session.user.name@@@ lutou com bravura contra o fedor terrível dos blobs de lixo, mas a poção de coragem já estava vazia!"
        nl: "@@@session.user.name@@@ heeft dapper gevochten tegen de vreselijke stank van de afvalblobs, maar het moeddrankje was al leeg!"
      dt_t_dechets_02:
        fr: "Changer les sacs poubelle"
        en: "Change the bin bags"
        es: "Cambiar las bolsas de basura"
        de: "Müllbeutel wechseln"
        it: "Cambiare i sacchetti della spazzatura"
        pt: "Mudar os sacos do lixo"
        br: "Trocar os sacos de lixo"
        nl: "Vuilniszakken verwisselen"
      dt_a_dechets_02:
        fr: "Les sacs pleins débordent et nourrissent les blob-ordures. Remplace-les par des sacs neufs bien fermés."
        en: "The full bags overflow and feed the garbage blobs. Replace them with fresh, well-tied bags."
        es: "Las bolsas llenas rebosan y alimentan a los blobs de basura. Sustitúyelas por bolsas nuevas bien cerradas."
        de: "Die vollen Beutel quellen über und füttern die Müll-Blobs. Ersetze sie durch neue, gut verschlossene Beutel."
        it: "I sacchetti pieni traboccano e nutrono i blob-spazzatura. Sostituiscili con sacchetti nuovi ben chiusi."
        pt: "Os sacos cheios transbordam e alimentam os blobs de lixo. Substitui-os por sacos novos bem fechados."
        br: "Os sacos cheios transbordam e alimentam os blobs de lixo. Troque por sacos novos bem fechados."
        nl: "De volle zakken puilen uit en voeren de afvalblobs. Vervang ze door nieuwe, goed dichtgeknoopte zakken."
      dt_d_dechets_02:
        fr: "@@@session.user.name@@@ vient de couper les vivres aux blob-ordures en changeant les sacs !"
        en: "@@@session.user.name@@@ has just starved the garbage blobs by changing the bags!"
        es: "¡@@@session.user.name@@@ acaba de cortar el suministro a los blobs de basura cambiando las bolsas!"
        de: "@@@session.user.name@@@ hat den Müll-Blobs gerade das Futter gestrichen und die Beutel gewechselt!"
        it: "@@@session.user.name@@@ ha appena tagliato i viveri ai blob-spazzatura cambiando i sacchetti!"
        pt: "@@@session.user.name@@@ acabou de cortar os mantimentos aos blobs de lixo ao mudar os sacos!"
        br: "@@@session.user.name@@@ acabou de cortar os suprimentos dos blobs de lixo ao trocar os sacos!"
        nl: "@@@session.user.name@@@ heeft de afvalblobs zojuist uitgehongerd door de zakken te verwisselen!"
      dt_c_dechets_02:
        fr: "@@@session.user.name@@@ a bataillé pour changer les sacs poubelle, mais un dragon est passé par là au mauvais moment !"
        en: "@@@session.user.name@@@ battled away at changing the bin bags, but a dragon flew past at the worst moment!"
        es: "¡@@@session.user.name@@@ batalló para cambiar las bolsas de basura, pero pasó un dragón en el peor momento!"
        de: "@@@session.user.name@@@ hat sich abgemüht, die Müllbeutel zu wechseln, aber im dümmsten Moment kam ein Drache vorbei!"
        it: "@@@session.user.name@@@ ha lottato per cambiare i sacchetti della spazzatura, ma un drago è passato proprio nel momento peggiore!"
        pt: "@@@session.user.name@@@ batalhou para mudar os sacos do lixo, mas passou um dragão no pior momento!"
        br: "@@@session.user.name@@@ batalhou para trocar os sacos de lixo, mas passou um dragão na pior hora!"
        nl: "@@@session.user.name@@@ heeft gezwoegd om de vuilniszakken te verwisselen, maar op het slechtste moment kwam er een draak langs!"
      dt_t_dechets_03:
        fr: "Trier les déchets"
        en: "Sort the recycling"
        es: "Separar los residuos"
        de: "Müll trennen"
        it: "Fare la raccolta differenziata"
        pt: "Separar o lixo"
        br: "Separar o lixo"
        nl: "Afval scheiden"
      dt_a_dechets_03:
        fr: "Les déchets s'amassent en un magma indistinct. Trie-les par bac de recyclage jusqu'au dernier."
        en: "The waste gathers into an indistinct magma. Sort it into the right recycling bins, down to the last item."
        es: "Los residuos se acumulan en un magma indistinto. Sepáralos en los contenedores de reciclaje hasta el último."
        de: "Der Müll klumpt zu einem undurchschaubaren Magma zusammen. Trenn ihn bis zum letzten Stück in die richtigen Tonnen."
        it: "I rifiuti si ammassano in un magma confuso. Dividili nei bidoni della differenziata fino all'ultimo."
        pt: "O lixo acumula-se num magma confuso. Separa-o pelos ecopontos até ao último."
        br: "O lixo se acumula num magma confuso. Separe tudo para a reciclagem até o último item."
        nl: "Het afval klontert samen tot een onherkenbaar magma. Scheid het tot het laatste stuk in de juiste bakken."
      dt_d_dechets_03:
        fr: "@@@session.user.name@@@ vient de trier le magma de déchets !"
        en: "@@@session.user.name@@@ has just sorted the magma of waste!"
        es: "¡@@@session.user.name@@@ acaba de separar el magma de residuos!"
        de: "@@@session.user.name@@@ hat gerade das Müllmagma getrennt!"
        it: "@@@session.user.name@@@ ha appena smistato il magma di rifiuti!"
        pt: "@@@session.user.name@@@ acabou de separar o magma de lixo!"
        br: "@@@session.user.name@@@ acabou de separar o magma de lixo!"
        nl: "@@@session.user.name@@@ heeft zojuist het afvalmagma gescheiden!"
      dt_c_dechets_03:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour trier le magma de déchets, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ took a deep breath and started sorting the magma of waste, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a separar el magma de residuos, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um das Müllmagma zu trennen, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ha preso il coraggio a due mani per smistare il magma di rifiuti, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ ganhou coragem para separar o magma de lixo, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ tomou coragem para separar o magma de lixo, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ heeft moed verzameld om het afvalmagma te scheiden, en de lantaarn ging voor het einde uit!"
      dt_t_dechets_04:
        fr: "Descendre le verre ou le recyclage au point de collecte"
        en: "Take glass or recycling to the collection point"
        es: "Bajar el vidrio o el reciclaje al punto de recogida"
        de: "Glas oder Wertstoffe zum Container bringen"
        it: "Portare il vetro o la differenziata al punto di raccolta"
        pt: "Levar o vidro ou a reciclagem ao ecoponto"
        br: "Levar o vidro ou os recicláveis ao ponto de coleta"
        nl: "Glas of recyclebaar afval naar de container brengen"
      dt_a_dechets_04:
        fr: "Verre et recyclage s'accumulent en pile branlante. Descends-les au point de collecte et vide tout."
        en: "Glass and recycling stack into a wobbling pile. Take them to the collection point and empty everything."
        es: "Vidrio y reciclaje se apilan en un montón tambaleante. Bájalos al punto de recogida y vacíalo todo."
        de: "Glas und Wertstoffe stapeln sich zu einem wackeligen Turm. Bring sie zum Container und leer alles aus."
        it: "Vetro e differenziata si accumulano in una pila traballante. Portali al punto di raccolta e svuota tutto."
        pt: "Vidro e reciclagem empilham-se num monte a abanar. Leva-os ao ecoponto e despeja tudo."
        br: "Vidro e recicláveis se empilham num monte bambo. Leve tudo ao ponto de coleta e esvazie."
        nl: "Glas en recyclebaar afval stapelen zich op tot een wiebelige toren. Breng ze naar de container en maak alles leeg."
      dt_d_dechets_04:
        fr: "@@@session.user.name@@@ vient de porter le verre et le recyclage au point de collecte !"
        en: "@@@session.user.name@@@ has just hauled the glass and recycling to the collection point!"
        es: "¡@@@session.user.name@@@ acaba de llevar el vidrio y el reciclaje al punto de recogida!"
        de: "@@@session.user.name@@@ hat gerade Glas und Wertstoffe zum Container gebracht!"
        it: "@@@session.user.name@@@ ha appena portato vetro e differenziata al punto di raccolta!"
        pt: "@@@session.user.name@@@ acabou de levar o vidro e a reciclagem ao ecoponto!"
        br: "@@@session.user.name@@@ acabou de levar o vidro e os recicláveis ao ponto de coleta!"
        nl: "@@@session.user.name@@@ heeft zojuist het glas en het recyclebare afval naar de container gebracht!"
      dt_c_dechets_04:
        fr: "@@@session.user.name@@@ a donné de sa peine pour descendre le verre et le recyclage, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ worked hard at taking the glass and recycling down, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ se esforzó para bajar el vidrio y el reciclaje, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat sich mächtig ins Zeug gelegt, um Glas und Wertstoffe wegzubringen, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ha faticato parecchio per portare giù vetro e differenziata, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ esforçou-se muito para levar o vidro e a reciclagem, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ se esforçou muito para levar o vidro e os recicláveis, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ heeft hard gewerkt om het glas en het recyclebare afval weg te brengen, en de lantaarn ging voor het einde uit!"
      dt_t_dechets_05:
        fr: "Vider les bio-déchets dans le composteur"
        en: "Empty food waste into the compost bin"
        es: "Vaciar los residuos orgánicos en el compostador"
        de: "Biomüll in den Komposter leeren"
        it: "Svuotare l'umido nella compostiera"
        pt: "Despejar os restos orgânicos no compostor"
        br: "Jogar os restos orgânicos na composteira"

        pt: "@@@session.user.name@@@ pôs toda a energia em fazer a lista de compras, mas a aventura vai pedir uma segunda volta!"
        br: "@@@session.user.name@@@ colocou toda a energia em fazer a lista de compras, mas a aventura vai pedir uma segunda rodada!"
        nl: "@@@session.user.name@@@ heeft alles gegeven om het boodschappenlijstje te maken, maar het avontuur vraagt om een tweede ronde!"
      dt_t_courses_05:
        fr: "Faire une petite course"
        en: "Run a quick errand"
        es: "Hacer un pequeño recado"
        de: "Schnell etwas besorgen"
        it: "Fare una commissione veloce"
        pt: "Fazer um pequeno recado"
        br: "Fazer um pequeno recado"
        nl: "Een snelle boodschap doen"
      dt_a_courses_05:
        fr: "Un besoin pressant manque à l'appel et le garde-manger réclame son dû. File faire une petite course pour le combler."
        en: "A pressing need is missing and the pantry demands its due. Dash out on a quick errand to fill the gap."
        es: "Falta algo urgente y la despensa reclama lo suyo. Sal a hacer un pequeño recado para cubrirlo."
        de: "Etwas Dringendes fehlt und die Vorratskammer fordert ihren Tribut. Flitz los und besorg es schnell."
        it: "Manca qualcosa di urgente e la dispensa reclama il suo tributo. Corri a fare una commissione veloce per rimediare."
        pt: "Falta uma coisa urgente e a despensa exige o que lhe é devido. Corre a fazer um pequeno recado para resolver."
        br: "Falta uma coisa urgente e a despensa exige o que é dela. Corra fazer um pequeno recado para resolver."
        nl: "Er ontbreekt iets dringends en de voorraadkast eist zijn tribuut. Snel op pad voor een boodschapje om het gat te vullen."
      dt_d_courses_05:
        fr: "@@@session.user.name@@@ vient de rapporter la petite course manquante !"
        en: "@@@session.user.name@@@ has just brought back the missing errand!"
        es: "¡@@@session.user.name@@@ acaba de traer el recado que faltaba!"
        de: "@@@session.user.name@@@ hat gerade das Fehlende besorgt!"
        it: "@@@session.user.name@@@ ha appena riportato quello che mancava!"
        pt: "@@@session.user.name@@@ acabou de trazer o que faltava!"
        br: "@@@session.user.name@@@ acabou de trazer o que faltava!"
        nl: "@@@session.user.name@@@ heeft zojuist gehaald wat er ontbrak!"
      dt_c_courses_05:
        fr: "@@@session.user.name@@@ y a mis toute son énergie pour faire la petite course, mais la tâche a tenu bon cette fois !"
        en: "@@@session.user.name@@@ threw every bit of energy into the quick errand, but the task held out this time!"
        es: "¡@@@session.user.name@@@ echó toda su energía en hacer el pequeño recado, pero la tarea aguantó esta vez!"
        de: "@@@session.user.name@@@ hat alle Kraft hineingesteckt, schnell etwas zu besorgen, aber die Aufgabe hat diesmal standgehalten!"
        it: "@@@session.user.name@@@ ci ha messo tutta l'energia per fare la commissione, ma la faccenda ha resistito, stavolta!"
        pt: "@@@session.user.name@@@ pôs toda a energia em fazer o pequeno recado, mas a tarefa resistiu desta vez!"
        br: "@@@session.user.name@@@ colocou toda a energia em fazer o pequeno recado, mas a tarefa resistiu desta vez!"
        nl: "@@@session.user.name@@@ heeft alles gegeven om de snelle boodschap te doen, maar de taak hield deze keer stand!"


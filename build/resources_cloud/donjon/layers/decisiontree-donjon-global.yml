        pt: "Os duendes de cotão invadem o WC! Aspira ou varre até o chão ficar impecável, cantos incluídos."
        br: "Os duendes de fiapos invadem o lavabo! Aspire ou varra até o chão ficar impecável, cantos incluídos."
        nl: "Stofpluiskobolden overspoelen de wc! Zuig of veeg tot de vloer brandschoon is, hoekjes inbegrepen."

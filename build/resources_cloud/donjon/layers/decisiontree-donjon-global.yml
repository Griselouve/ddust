        fr: "@@@session.user.name@@@ vient de pulvériser les moutons-gobelins des toilettes !"
        en: "@@@session.user.name@@@ has just crushed the dust-bunny goblins of the toilet!"
        es: "¡@@@session.user.name@@@ acaba de aplastar a los duendes de pelusa del baño!"
        de: "@@@session.user.name@@@ hat gerade die Wollmaus-Kobolde im WC zermalmt!"

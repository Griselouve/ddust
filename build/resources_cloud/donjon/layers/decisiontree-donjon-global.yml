        fr: "@@@session.user.name@@@ vient de ravitailler la guilde en faisant les courses !"
        en: "@@@session.user.name@@@ has just resupplied the guild by doing the shopping!"
        es: "¡@@@session.user.name@@@ acaba de abastecer al gremio haciendo la compra!"
        de: "@@@session.user.name@@@ hat gerade die Gilde mit dem Einkauf neu versorgt!"
        it: "@@@session.user.name@@@ ha appena rifornito la gilda facendo la spesa!"
        pt: "@@@session.user.name@@@ acabou de reabastecer a guilda ao fazer as compras!"
        br: "@@@session.user.name@@@ acabou de reabastecer a guilda ao fazer as compras!"
        nl: "@@@session.user.name@@@ heeft zojuist het gilde bevoorraad door boodschappen te doen!"
      dt_c_courses_01:
        fr: "@@@session.user.name@@@ a pris son courage à deux mains pour faire les courses, et la lanterne a rendu l'âme avant la fin !"
        en: "@@@session.user.name@@@ took a deep breath and started doing the shopping, and the lantern burned out before the end!"
        es: "¡@@@session.user.name@@@ tomó aire y empezó a hacer la compra, y el farol se quedó sin aceite antes del final!"
        de: "@@@session.user.name@@@ hat allen Mut zusammengenommen, um einkaufen zu gehen, und die Laterne ist vor dem Ende ausgegangen!"
        it: "@@@session.user.name@@@ ha preso il coraggio a due mani per fare la spesa, e la lanterna si è spenta prima della fine!"
        pt: "@@@session.user.name@@@ ganhou coragem para fazer as compras, e a lanterna apagou-se antes do fim!"
        br: "@@@session.user.name@@@ tomou coragem para fazer as compras, e a lanterna apagou antes do fim!"
        nl: "@@@session.user.name@@@ heeft moed verzameld om boodschappen te doen, en de lantaarn ging voor het einde uit!"
      dt_t_courses_02:
        fr: "Porter les courses"
        en: "Carry the shopping"
        es: "Llevar la compra"
        de: "Einkäufe tragen"
        it: "Portare la spesa"
        pt: "Carregar as compras"
        br: "Carregar as compras"
        nl: "Boodschappen dragen"
      dt_a_courses_02:
        fr: "Le butin des courses pèse une tonne. Porte tous les sacs jusqu'à la cuisine."
        en: "The shopping haul weighs a ton. Carry all the bags up to the kitchen."
        es: "El botín de la compra pesa una tonelada. Lleva todas las bolsas hasta la cocina."
        de: "Die Einkaufsbeute wiegt eine Tonne. Trag alle Taschen bis in die Küche."
        it: "Il bottino della spesa pesa una tonnellata. Porta tutte le borse fino in cucina."
        pt: "O espólio das compras pesa uma tonelada. Leva todos os sacos até à cozinha."
        br: "O tesouro das compras pesa uma tonelada. Leve todas as sacolas até a cozinha."
        nl: "De boodschappenbuit weegt een ton. Draag alle tassen naar de keuken."

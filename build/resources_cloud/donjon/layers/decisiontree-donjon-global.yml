        es: "¡@@@session.user.name@@@ acaba de disolver los gólems de cal del hervidor!"
        de: "@@@session.user.name@@@ hat die Kalk-Golems des Wasserkochers gerade aufgelöst!"
        it: "@@@session.user.name@@@ ha appena dissolto i golem di calcare del bollitore!"
        pt: "@@@session.user.name@@@ acabou de dissolver os golems de calcário da chaleira!"
        br: "@@@session.user.name@@@ acabou de dissolver os golems de calcário da chaleira!"
        nl: "@@@session.user.name@@@ heeft zojuist de kalkgolems van de waterkoker opgelost!"
      dt_c_cuisine_15:
        fr: "@@@session.user.name@@@ a bravé les golems de tartre de la bouilloire sans faiblir, et le combat a duré plus longtemps que prévu !"
        en: "@@@session.user.name@@@ braved the limescale golems of the kettle without flinching, and the fight lasted longer than expected!"
        es: "¡@@@session.user.name@@@ desafió a los gólems de cal del hervidor sin flaquear, y el combate duró más de lo previsto!"
        de: "@@@session.user.name@@@ hat den Kalk-Golems des Wasserkochers unerschrocken getrotzt, und der Kampf hat länger gedauert als gedacht!"
        it: "@@@session.user.name@@@ ha sfidato i golem di calcare del bollitore senza cedere, e il combattimento è durato più del previsto!"
        pt: "@@@session.user.name@@@ desafiou os golems de calcário da chaleira sem vacilar, e o combate durou mais do que o previsto!"
        br: "@@@session.user.name@@@ desafiou os golems de calcário da chaleira sem vacilar, e o combate durou mais do que o previsto!"
        nl: "@@@session.user.name@@@ trotseerde de kalkgolems van de waterkoker zonder te wankelen, en het gevecht duurde langer dan verwacht!"
      dt_t_cuisine_18:
        fr: "Détartrer la robinetterie"
        en: "Descale the taps"
        es: "Descalcificar la grifería"
        de: "Armaturen entkalken"
        it: "Decalcificare i rubinetti"
        pt: "Descalcificar as torneiras"
        br: "Descalcificar as torneiras"
        nl: "Kranen ontkalken"
      dt_a_cuisine_18:
        fr: "Des dépôts calcaires entartrent la robinetterie de la cuisine. Détartre jusqu'à une robinetterie brillante, sans trace blanche."
        en: "Limescale deposits crust the kitchen taps. Descale until the taps shine, with no white marks."
        es: "Depósitos de cal incrustan la grifería de la cocina. Descalcifica hasta una grifería brillante, sin marcas blancas."
        de: "Kalkablagerungen verkrusten die Küchenarmaturen. Entkalke, bis die Armaturen glänzen, ohne weiße Flecken."
        it: "Depositi di calcare incrostano i rubinetti della cucina. Decalcifica finché i rubinetti non brillano, senza aloni bianchi."
        pt: "Depósitos de calcário incrustam as torneiras da cozinha. Descalcifica até as torneiras brilharem, sem marcas brancas."
        br: "Depósitos de calcário incrustam as torneiras da cozinha. Descalcifique até as torneiras brilharem, sem marcas brancas."
        nl: "Kalkaanslag zet zich vast op de keukenkranen. Ontkalk tot de kranen glanzen, zonder witte vlekken."
      dt_d_cuisine_18:
        fr: "@@@session.user.name@@@ vient de briser les dépôts calcaires de la robinetterie de la cuisine !"
        en: "@@@session.user.name@@@ has just shattered the limescale deposits of the kitchen taps!"
        es: "¡@@@session.user.name@@@ acaba de romper los depósitos de cal de la grifería de la cocina!"
        de: "@@@session.user.name@@@ hat die Kalkablagerungen der Küchenarmaturen gerade zerschmettert!"
        it: "@@@session.user.name@@@ ha appena frantumato i depositi di calcare dei rubinetti della cucina!"
        pt: "@@@session.user.name@@@ acabou de despedaçar os depósitos de calcário das torneiras da cozinha!"
        br: "@@@session.user.name@@@ acabou de despedaçar os depósitos de calcário das torneiras da cozinha!"
        nl: "@@@session.user.name@@@ heeft zojuist de kalkaanslag van de keukenkranen verbrijzeld!"
      dt_c_cuisine_18:
        fr: "@@@session.user.name@@@ a tenu tête aux dépôts calcaires de la robinetterie de la cuisine, mais un dragon est passé par là, et il a fallu se mettre à l'abri !"
        en: "@@@session.user.name@@@ stood up to the limescale deposits of the kitchen taps, but a dragon flew past, and cover had to be taken!"
        es: "¡@@@session.user.name@@@ le plantó cara a los depósitos de cal de la grifería de la cocina, pero pasó un dragón cerca y hubo que ponerse a cubierto!"
        de: "@@@session.user.name@@@ hat den Kalkablagerungen der Küchenarmaturen die Stirn geboten, aber ein Drache flog vorbei, und alle mussten in Deckung gehen!"
        it: "@@@session.user.name@@@ ha tenuto testa ai depositi di calcare dei rubinetti della cucina, ma è passato di lì un drago e bisognava mettersi al riparo!"
        pt: "@@@session.user.name@@@ fez frente aos depósitos de calcário das torneiras da cozinha, mas passou por ali um dragão e foi preciso abrigar-se!"
        br: "@@@session.user.name@@@ enfrentou os depósitos de calcário das torneiras da cozinha, mas um dragão passou por ali e foi preciso se abrigar!"
        nl: "@@@session.user.name@@@ bood de kalkaanslag van de keukenkranen het hoofd, maar er vloog een draak voorbij en iedereen moest dekking zoeken!"
      dt_t_cuisine_19:
        fr: "Nettoyer l'extérieur du réfrigérateur"
        en: "Clean the outside of the fridge"
        es: "Limpiar el exterior del frigorífico"
        de: "Kühlschrank außen putzen"
        it: "Pulire l'esterno del frigo"
        pt: "Limpar o exterior do frigorífico"
        br: "Limpar o exterior da geladeira"
        nl: "Koelkast vanbuiten schoonmaken"
      dt_a_cuisine_19:
        fr: "Des traces grasses ternissent l'extérieur du réfrigérateur. Nettoie portes et poignées jusqu'à une surface nette."
        en: "Greasy marks dull the outside of the fridge. Clean the doors and handles until the surface is spotless."
        es: "Marcas de grasa empañan el exterior del frigorífico. Limpia puertas y tiradores hasta una superficie impecable."
        de: "Fettflecken lassen den Kühlschrank von außen stumpf aussehen. Putz Türen und Griffe, bis die Oberfläche blitzsauber ist."
        it: "Macchie di unto opacizzano l'esterno del frigo. Pulisci sportelli e maniglie finché la superficie non è perfetta."
        pt: "Manchas de gordura embaciam o exterior do frigorífico. Limpa portas e puxadores até a superfície ficar impecável."
        br: "Manchas de gordura embaçam o exterior da geladeira. Limpe portas e puxadores até a superfície ficar impecável."
        nl: "Vetvlekken maken de buitenkant van de koelkast dof. Maak deuren en handgrepen schoon tot het oppervlak smetteloos is."
      dt_d_cuisine_19:
        fr: "@@@session.user.name@@@ vient d'effacer les traces grasses de l'extérieur du réfrigérateur !"
        en: "@@@session.user.name@@@ has just wiped away the greasy marks of the outside of the fridge!"
        es: "¡@@@session.user.name@@@ acaba de borrar las marcas de grasa del exterior del frigorífico!"
        de: "@@@session.user.name@@@ hat die Fettflecken gerade von der Außenseite des Kühlschranks gewischt!"
        it: "@@@session.user.name@@@ ha appena cancellato le macchie di unto dall'esterno del frigo!"
        pt: "@@@session.user.name@@@ acabou de apagar as manchas de gordura do exterior do frigorífico!"
        br: "@@@session.user.name@@@ acabou de apagar as manchas de gordura do exterior da geladeira!"
        nl: "@@@session.user.name@@@ heeft zojuist de vetvlekken van de buitenkant van de koelkast geveegd!"
      dt_c_cuisine_19:
        fr: "@@@session.user.name@@@ a tenu bon face aux traces grasses de l'extérieur du réfrigérateur, et la lanterne a rendu l'âme au plus mauvais moment !"
        en: "@@@session.user.name@@@ held the line against the greasy marks of the outside of the fridge, and the lantern burned out at the worst moment!"
        es: "¡@@@session.user.name@@@ aguantó firme frente a las marcas de grasa del exterior del frigorífico, y el farol se quedó sin aceite en el peor momento!"
        de: "@@@session.user.name@@@ hat den Fettflecken außen am Kühlschrank standgehalten, und die Laterne ist im ungünstigsten Moment ausgegangen!"
        it: "@@@session.user.name@@@ ha tenuto duro contro le macchie di unto dell'esterno del frigo, e la lanterna si è spenta nel momento peggiore!"
        pt: "@@@session.user.name@@@ aguentou firme contra as manchas de gordura do exterior do frigorífico, e a lanterna apagou-se no pior momento!"
        br: "@@@session.user.name@@@ aguentou firme contra as manchas de gordura do exterior da geladeira, e a lanterna se apagou na pior hora!"
        nl: "@@@session.user.name@@@ hield stand tegen de vetvlekken op de buitenkant van de koelkast, en de lantaarn doofde op het slechtste moment!"
      dt_t_cuisine_08:
        fr: "Vider les restes du frigo"
        en: "Clear out the fridge leftovers"
        es: "Vaciar las sobras del frigorífico"
        de: "Reste aus dem Kühlschrank räumen"
        it: "Svuotare gli avanzi dal frigo"
        pt: "Deitar fora os restos do frigorífico"
        br: "Jogar fora as sobras da geladeira"
        nl: "Restjes uit de koelkast halen"
      dt_a_cuisine_08:
        fr: "Des créatures oubliées prolifèrent au fond du frigo. Trie et vide les restes périmés jusqu'à un frigo sain."
        en: "Forgotten creatures multiply at the back of the fridge. Sort and clear out the expired leftovers until the fridge is wholesome."
        es: "Criaturas olvidadas se multiplican al fondo del frigorífico. Clasifica y retira las sobras caducadas hasta un frigorífico sano."
        de: "Vergessene Kreaturen vermehren sich hinten im Kühlschrank. Sortier die abgelaufenen Reste aus und entsorge sie, bis der Kühlschrank wieder gesund ist."
        it: "Creature dimenticate si moltiplicano in fondo al frigo. Controlla e butta via gli avanzi scaduti finché il frigo non è sano."
        pt: "Criaturas esquecidas multiplicam-se no fundo do frigorífico. Separa e deita fora os restos fora de prazo até o frigorífico ficar saudável."
        br: "Criaturas esquecidas se multiplicam no fundo da geladeira. Separe e jogue fora as sobras vencidas até a geladeira ficar saudável."
        nl: "Vergeten wezens vermenigvuldigen zich achter in de koelkast. Sorteer de verlopen restjes en gooi ze weg tot de koelkast weer gezond is."
      dt_d_cuisine_08:
        fr: "@@@session.user.name@@@ vient de purger les restes oubliés du frigo !"
        en: "@@@session.user.name@@@ has just purged the forgotten leftovers from the fridge!"
        es: "¡@@@session.user.name@@@ acaba de purgar las sobras olvidadas del frigorífico!"
        de: "@@@session.user.name@@@ hat die vergessenen Reste gerade aus dem Kühlschrank verbannt!"
        it: "@@@session.user.name@@@ ha appena eliminato gli avanzi dimenticati dal frigo!"
        pt: "@@@session.user.name@@@ acabou de purgar os restos esquecidos do frigorífico!"
        br: "@@@session.user.name@@@ acabou de expulsar as sobras esquecidas da geladeira!"
        nl: "@@@session.user.name@@@ heeft zojuist de vergeten restjes uit de koelkast verbannen!"
      dt_c_cuisine_08:
        fr: "@@@session.user.name@@@ a donné l'assaut contre les restes oubliés du frigo, mais le temps a manqué : l'aventure continuera !"
        en: "@@@session.user.name@@@ led the assault on the forgotten leftovers of the fridge, but time ran out: the adventure will go on!"
        es: "¡@@@session.user.name@@@ dio el asalto contra las sobras olvidadas del frigorífico, pero se acabó el tiempo: la aventura continuará!"
        de: "@@@session.user.name@@@ hat die vergessenen Reste im Kühlschrank angegriffen, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha dato l'assalto agli avanzi dimenticati del frigo, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ lançou o assalto contra os restos esquecidos do frigorífico, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ partiu para o ataque contra as sobras esquecidas da geladeira, mas o tempo acabou: a aventura continuará!"
        nl: "@@@session.user.name@@@ bestormde de vergeten restjes in de koelkast, maar de tijd was op: het avontuur gaat verder!"


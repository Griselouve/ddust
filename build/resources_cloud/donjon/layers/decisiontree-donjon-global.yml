        de: "@@@session.user.name@@@ hat den Schmierkobolden an den Fenstern im Kinderzimmer unerschrocken getrotzt, aber die Zeit wurde knapp: Das Abenteuer geht weiter!"
        it: "@@@session.user.name@@@ ha sfidato i folletti dei vetri della cameretta dei bambini senza cedere, ma il tempo è finito: l'avventura continuerà!"
        pt: "@@@session.user.name@@@ desafiou os duendes dos vidros do quarto das crianças sem vacilar, mas o tempo acabou: a aventura continuará!"
        br: "@@@session.user.name@@@ desafiou os duendes dos vidros do quarto das crianças sem vacilar, mas o tempo acabou: a aventura continuará!"
        nl: "@@@session.user.name@@@ trotseerde de kabouters van de ramen van de kinderkamer zonder te wankelen, maar de tijd was op: het avontuur gaat verder!"

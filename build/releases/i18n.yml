# =============================================================================
# LA PAGE « RELEASES » DU SITE VITRINE, en huit langues.
#
# Rédigé à la main, JAMAIS réécrit par le builder. Ce qu'il écrit, lui, c'est
# `releases.yml` (la liste des versions publiées) juste à côté ; les deux se
# rejoignent dans `template.html` au moment de la génération.
#
# ⚠ LES HUIT LANGUES SE MODIFIENT ENSEMBLE. Une langue absente d'ici ne fait pas
#   échouer la génération : elle produit une page au titre vide, ce qui est pire
#   qu'une erreur, parce que personne ne la voit avant un visiteur.
#
# ⚠ `br` EST LE PORTUGAIS DU BRÉSIL, et `pt` celui du Portugal : deux langues,
#   deux corpus. Le répertoire s'appelle `/br/`, mais la page s'annonce `pt-BR`,
#   parce que `br` seul désigne le breton pour un moteur de recherche.
#
# Les mois servent à dater une version sur la timeline. Date COMPLÈTE volontai-
# rement évitée : « 18 septembre 2026 » s'écrit de huit façons différentes, dont
# trois avec une préposition, alors que le mois et l'année se rendent avec une
# seule table.
# =============================================================================

html_langs:
  fr: fr
  en: en
  es: es
  it: it
  de: de
  pt: pt
  br: pt-BR
  nl: nl


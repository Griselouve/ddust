# Console d'administration de ddust. Le reste de la conf vient du modele
# (deva/suites/projects/console/config.yml).
#
# ⚠ CE FICHIER EST OBLIGATOIRE : la version n'est pas heritee d'une base, elle
#   appartient a l'app qui la porte (cf. readme du builder, « heritage d'items »).
conf:
  application:
    display_name: "Console ddust"
    version: "1.0.0"
    build: 1

  # ⚠ DECLAREES OU LE BUILD BLOQUE. La console ne lit aucune base (tout passe par
  #   store_admin, store_mint, store_revoke), mais elle monte dvcloud : le builder
  #   recoupe donc ses isolations avec celles du backend, et une base absente vaut
  #   `strict` cote client. Copie EXACTE de `cloud.firestore.databases` de
  #   client/config.yml : toute base ajoutee la-bas s'ajoute ici.
  cloud:
    firestore:
      databases:
        messaging:
          isolation: strict
        sessions:
          isolation: strict
        workers:
          isolation: strict
        locks:
          isolation: none
        store:
          isolation: none
        virtuallobby:
          isolation: none
        autover:
          isolation: none

  # --- Tableau de bord (brique dvdashboard, allumée par la suite projects/console) --
  # Ce qui est propre à ddust : le nom, le payeur (un clan), les sections du budget,
  # de l'usage et du coût de l'IA. Uniquement les fonctions du projet ddust, dans
  # les régions de cette console : jamais le Firestore d'un autre projet.
  # ⚠ budget_query et metrics_query ne sont pas encore déployées pour ddust (deva
  #   d206) : leurs sections le disent à l'écran, cause et geste, sans rien bloquer.
  dashboard:
    lang: fr
    project: "ddust"
    store:
      payer: clan
      payers: clans
    budget:
      function: budget_query
    usage:
      function: metrics_query
      series:
        abonnes:
          label: "Abonnés"
          source: store_kpis
          event_type: kpi_daily
          field: total.subscribers
          agg: last
    inference:
      # Clé du service d'IA dans le journal de pubudget (module puvertexai).
      service: vertexai
    # Usage de l'app : les événements de dvanalytics (client/config.yml, analytics.events).
    # ⚠ COUPÉE comme le module dans l'app : la section dit sa cause, rien n'est lu.
    #   Allumer avec `analytics.enabled` de l'app et `metrics.ingest.enabled` du déploiement.
    app:
      enabled: false
      function: metrics_query
      app: ddust
      cause: "le module d'analytics de ddust est coupé (analytics.enabled). C'est un nouveau traitement de données : il attend la politique de confidentialité, le registre des traitements et la durée de conservation des mesures (deva d196). Geste : répondre à d196, écrire le registre et la politique, puis allumer l'app, metrics_ingest et cette section ensemble."
      events:
        session_start:  { label: "Sessions ouvertes" }
        loot_received:  { label: "Parts de butin reçues" }
        loot_opened:    { label: "Butins ouverts" }
        member_joined:  { label: "Arrivées dans un clan" }
        member_left:    { label: "Départs d'un clan" }
        clan_created:   { label: "Clans créés" }
        member_created: { label: "Joueurs sans compte créés" }
        member_claimed: { label: "Joueurs repris par leur compte" }
        chief_promoted: { label: "Chefs nommés" }

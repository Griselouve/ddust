  #   et `politique`. Le critère : un paramètre vit dans un projet s'il entre
  #   dans le calcul de SON revenu. L'impôt et les dividendes n'y entrent pas —
  #   ils décrivent qui encaisse, pas ce qu'on vend. Les chiffres d'un projet
  #   sont donc des NETS AVANT IMPÔT.
  #
  # ⚠ CE SONT DES VALEURS DE DÉPART, PAS DES CONSTANTES. Chacune se modifie ici

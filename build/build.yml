revenus:

  # ===========================================================================
  # RIEN DE CHIFFRÉ NE VIT À CE NIVEAU
  # ===========================================================================
  # `churn`, `conversion`, `confiance`, `acquisition`, `panier` et `inference`
  # ont tous été déclarés ici jusqu'au 2026-08-25, PUIS recopiés dans les
  # cellules — deux sources pour la même valeur, donc une dérive certaine. Ils
  # n'existent plus qu'en `marches.<marché>.stores.<store>`.
  #
  # Ce qui reste ci-dessous ne se décline ni par marché ni par store : la nature
  # du produit, son livrable de référence, le type d'audience.
  # ===========================================================================
  canal: store
  modele: abonnement

  # Nom de colonne dans les tableaux consolidés (la place y est comptée).
  court: "Ddust"
  # Quel livrable du kpi donne la DATE de mise en service. La date elle-même
  # ne se saisit jamais ici : elle vient de roadmap.md.
  livrable: '37efb92085ab'
  # De nouveaux parents d'enfants de 6-12 ans arrivent chaque année : le bassin
  # se remplit tout seul.
  audience: renouvelable
  # ===========================================================================
  # LA CELLULE DU MODÈLE EST LE COUPLE (MARCHÉ x STORE)
  # ===========================================================================
  # Pas une moyenne pondérée : deux cellules d'un même marché sont traitées
  # comme deux marchés distincts. Un utilisateur iOS américain n'a ni la
  # conversion, ni la rétention, ni le coût d'inférence d'un utilisateur Android
  # brésilien — les mélanger effacerait précisément ce qu'on cherche à voir.
  #
  # Ce qui vit AU MARCHÉ (une juridiction, un backend) :
  #   tva         taxe incluse dans le prix affiché
  #   inference   part du brut consommée par l'IA — le backend décide, pas le
  #               store. Un marché servi par un modèle plus ancien, ou par un
  #               fournisseur local imposé, coûte davantage par unité utile.
  #   indice      CONTRÔLE DE COHÉRENCE seulement, jamais utilisé au calcul
  #
  # Ce qui vit À LA CELLULE (un public, une plateforme) :
  #   part        part de l'acquisition payante du projet, en courbe
  #   prix        multiplicateur du prix affiché, à devise convertie
  #   conversion  taux téléchargement -> payant, ABSOLU
  #   churn       fond et précoce, ABSOLUS
  #   confiance   probabilité d'atteindre le plateau SUR CETTE CELLULE
  #
  # ⚠ Les valeurs de tête (`churn`, `conversion`, `confiance`, `acquisition`,
  #   `inference`) restent la RÉFÉRENCE du projet : les lots les déplacent, et
  #   le script reporte le déplacement sur chaque cellule au prorata. Le mode
  #   `check` vérifie que le mélange des cellules les redonne.
  # ⚠ `acquisition` est en PAYANTS PAR MOIS, pas en part : on la lit sans
  #   calcul, et poser une cellule à zéro montre aussitôt ce qu'on perd. La
  #   somme des huit cellules doit redonner l'acquisition de référence du
  #   projet ; le mode `check` le vérifie.
  # ⚠ LA RÉPARTITION ENTRE STORES EST CELLE DES PAYANTS, PAS DES APPAREILS.
  #   Aux États-Unis, ~57 % du parc est iOS mais ~65 % des payants : l'écart EST
  #   le meilleur taux de conversion d'iOS. Prorater sur les appareils le
  #   compterait une seconde fois, `conversion` le portant déjà.
  # ===========================================================================
  # ⚠ `inference` N'EST PLUS UNE FRACTION DU BRUT, C'EST UN COÛT EN EUROS, par
  #   payant et par mois (changement du 2026-08-26). Une fraction rendait le
  #   ratio « revenu / coût d'inférence » constant, donc muet — alors que c'est
  #   lui qui dit si une app à IA tient sur un marché à faible pouvoir d'achat.
  #   Les valeurs de départ dérivent de l'ancienne fraction x le panier : aucun
  #   chiffre inventé, seule l'unité change. `déclaré`, à mesurer.
  # ⚠ `devise` et `change` servent à convertir les prix des offres. Le change est
  #   `déclaré` et vieillira : il ne pilote aucun prix réel, seulement la
  #   lecture en euros d'une grille libellée en monnaie locale.
  marches:
    fr:
      # FR et EU ont le même indice : ce qui les sépare n'est pas ce que paie un
      # abonné, c'est COMBIEN ON EN TROUVE. La France est le marché d'amorce, le
      # seul où le réseau du développeur existe déjà — cet écart est porté par
      # les parts d'acquisition, et par rien d'autre.
      # inference : le backend UE n'a pas accès aux dernières générations de
      #   modèles. Même prix au token, mais une génération de retard, donc un
      #   coût SUPÉRIEUR par unité de sortie utile. D'où +10 %.
      cloud: eu
      monnaies: { eur: 1.00 }
      tva: 0.20
      # Backend UE : une génération de modèles en retard sur les États-Unis.
      # Même prix au token, mais un coût SUPÉRIEUR par unité de sortie utile —
      # d'où la pénalité de 10 % déjà présente dans l'ancienne fraction.
      datacenter: europe-west1
      inference: 0.0000       # € par payant et par mois
      indice: 100
      confiance: 0.080
      stores:

        appstore:
          # iOS convertit ~1,6x mieux et retient ~15 % plus longtemps. C'est
          # l'écart connu entre les deux plateformes, et c'est lui qui fait que
          # l'App Store capte ~65 % de la dépense mondiale avec ~28 % du parc.
          # ⚠ AUCUN PROJET N'Y EST AUJOURD'HUI : ces lignes chiffrent ce que
          #   coûte cette absence. Poser son `acquisition` à 0 modélise le
          #   Play-only, et le manque à gagner se lit directement.
          # payants/mois — 12.50 % de l'acquisition du projet au plateau
          # ⚠ RECALIBRÉ le 2026-08-26. Les cellules `play` portent désormais
          #   L'ESTIMATION D'ORIGINE du projet — celle des revenus.md, écrite
          #   pour un lancement Play, seul store où le portefeuille sera présent
          #   avant longtemps. Elles n'en portaient que ~53 %, ce qui revenait à
          #   annoncer que le lancement réel ferait la moitié de ce qui avait
          #   été estimé pour lui.
          #   Les cellules `appstore` gardent leur rapport : elles chiffrent ce
          #   qu'iOS APPORTERAIT EN PLUS, et non une part qu'on se retire.
          acquisition: { m1_3: 36.492, an4_5: 13.033 }
          conversion: 0.03200
          churn:
            fond: 0.06800
            precoce: 0.13600

        play:
          # Référence : les facteurs de marché s'appliquent sans correction.
          # payants/mois — 12.50 % de l'acquisition du projet au plateau
          acquisition: { m1_3: 36.492, an4_5: 13.033 }
          conversion: 0.02000
          churn:
            fond: 0.08000
            precoce: 0.16000
    # ⚠ QUATRE MARCHÉS LÀ OÙ IL Y EN AVAIT UN, depuis le 2026-08-26. Le marché
    #   `eu` unique mettait l'Allemagne et le Portugal sur la même ligne, et
    #   comptait au taux de conversion allemand 34 M d'habitants dont aucune des
    #   sept langues n'est parlée. Le découpage suit LA LANGUE d'abord, le revenu
    #   ensuite : pour une app destinée à des enfants, la langue décide avant le
    #   pouvoir d'achat.
    # ⚠ Les quatre partagent le cloud `eu` — même RGPD, une seule grille de prix
    #   en euros, et surtout UNE SEULE BASE : leurs joueurs peuvent appartenir au
    #   même clan. Seuls la TVA, l'acquisition, le panier, le churn, la conversion
    #   et le corpus légal diffèrent. Ce corpus est recopié depuis `fr` et
    #   versionné séparément — depuis le 2026-08-27, chaque marché porte le sien.
    euo:
      # Europe de l'Ouest — DE AT NL BE LU IE MT
      # Tes sept langues y sont natives et le pouvoir d'achat y est le plus élevé de
      # la zone euro. C'est le marché de référence : ses valeurs sont celles de
      # l'ancien marché `eu`, dont il hérite le rôle.
      cloud: eu
      monnaies: { eur: 1.00 }
      # pouvoir d'achat le plus eleve de la zone euro : plus d'annuel, paliers plus hauts.
      mix_facteur: 1.056
      tva: 0.200
      datacenter: europe-west1
      inference: 0.0000
      indice: 100
      confiance: 0.08
      stores:
        appstore:
          acquisition: { m1_3: 5.062, an4_5: 8.865 }
          conversion: 0.032
          churn: { fond: 0.068, precoce: 0.136 }
        play:
          acquisition: { m1_3: 6.187, an4_5: 10.835 }
          conversion: 0.020
          churn: { fond: 0.080, precoce: 0.160 }
    eus:
      # Europe du Sud — ES IT PT
      # Langues couvertes (es, it, pt), mais 45 à 55 k$ de PIB par habitant en PPA
      # contre 68 k$ à l'ouest. Même prix affiché, mélange de paliers plus bas,
      # churn plus élevé, et Android nettement dominant.
      cloud: eu
      monnaies: { eur: 1.00 }
      # meme prix affiche, melange de paliers plus bas (PIB/hab en PPA 45-55 k$ contre 68 k$ a l'ouest).
      mix_facteur: 0.907
      tva: 0.217
      datacenter: europe-west1
      inference: 0.0000
      indice: 100
      confiance: 0.08
      stores:
        appstore:
          acquisition: { m1_3: 1.939, an4_5: 3.395 }
          conversion: 0.026
          churn: { fond: 0.078, precoce: 0.156 }
        play:
          acquisition: { m1_3: 3.600, an4_5: 6.305 }
          conversion: 0.017
          churn: { fond: 0.090, precoce: 0.180 }
    eun:
      # Europe du Nord — SE DK NO FI
      # ⚠ AUCUNE de tes langues n'y est native — l'anglais y supplée, ce qui n'est
      # vrai NULLE PART AILLEURS dans cette liste. Revenu le plus élevé, churn le
      # plus bas, iOS majoritaire.
      # ⚠ VOLUME RÉELLEMENT NOUVEAU : SE, DK et NO n'étaient vendables dans aucune
      #   devise avant le 2026-08-26. Il est pourtant pris sur le total existant et
      #   non ajouté — la redistribution reste à somme constante, volontairement.
      # ⚠ TVA à 25 %, contre 20 % en France. C'est le cas d'usage de la TVA par
      #   marché : même cloud, même droit de fond, fiscalité différente.
      cloud: eu
      # SE DK NO FI — la Finlande est le seul des quatre a l'euro.
      monnaies: { sek: 0.38, dkk: 0.22, nok: 0.20, eur: 0.20 }
      # revenu le plus eleve et churn le plus bas : plus d'annuel.
      mix_facteur: 1.057
      tva: 0.250
      datacenter: europe-west1
      inference: 0.0000
      indice: 100
      confiance: 0.08
      stores:
        appstore:
          acquisition: { m1_3: 1.816, an4_5: 3.180 }
          conversion: 0.038
          churn: { fond: 0.060, precoce: 0.120 }
        play:
          acquisition: { m1_3: 1.211, an4_5: 2.120 }
          conversion: 0.024
          churn: { fond: 0.070, precoce: 0.140 }
    eux:
      # Europe, le reste — GR SK SI EE LV LT CY HR
      # ⚠ NI TA LANGUE, NI L'ANGLAIS COURANT. Ils restent distribués parce qu'ils sont
      # déjà dans la devise `eur` : même monnaie, même cloud, corpus recopié de `fr`,
      # coût marginal nul. On n'ouvre pas un marché pour une langue qu'on n'a pas ;
      # on ne ferme pas un pays qui est déjà gratuit.
      # ⚠ SEUL MARCHÉ À CONFIANCE 0,05 au lieu de 0,08, et ce n'est pas du
      #   pessimisme sur le produit : un enfant grec ne peut pas lire l'app. C'est
      #   l'hypothèse « ça prend » qui est plus faible, exactement ce que la note de
      #   confiance sert à porter.
      cloud: eu
      monnaies: { eur: 1.00 }
      # ni ta langue ni l'anglais courant : ceux qui paient prennent l'entree de gamme.
      mix_facteur: 0.825
      tva: 0.225
      datacenter: europe-west1
      inference: 0.0000
      indice: 100
      confiance: 0.05
      stores:
        appstore:
          acquisition: { m1_3: 0.206, an4_5: 0.360 }
          conversion: 0.020
          churn: { fond: 0.090, precoce: 0.180 }
        play:
          acquisition: { m1_3: 0.822, an4_5: 1.440 }
          conversion: 0.013
          churn: { fond: 0.105, precoce: 0.210 }
    uk:
      # Royaume-Uni — GB
      # Anglophone natif, forte dépense applicative par habitant, et une culture du
      # jeu de rôle qui ne demande aucune traduction du décor. Copié du marché `us`,
      # dont il partage le profil : pas de réseau, pas de bouche-à-oreille.
      # tva : de nombreux États ne taxent pas le numérique. C'est le premier
      #   moteur du coefficient américain, avant même le prix.
      # inference : backend US, dernières générations de modèles disponibles.
      #   C'est la référence, sans pénalité.
      cloud: eu
      monnaies: { gbp: 1.00 }
      tva: 0.200
      # ⚠ CORRIGÉ LE 2026-08-27 : ce marché déclarait `us-central1` alors que son
      #   `cloud` est européen, ce qui n'était visible d'aucun côté tant que les
      #   deux découpages n'étaient pas rapprochés. Le UK GDPR bénéficie d'une
      #   décision d'adéquation européenne : héberger en Europe est le choix
      #   défendable, et le surcoût d'inférence est celui de toute la zone.
      datacenter: europe-west1
      inference: 0.0000       # € par payant et par mois
      indice: 167
      # ⚠ prix des cellules : calculé sur la grille RÉELLE de
      #   store.catalog — 1,99 € contre 2,19 $, soit 1,02 après
      #   change. Seul chiffre du portefeuille qui soit mesuré.
      confiance: 0.080
      stores:


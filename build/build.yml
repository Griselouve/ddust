# =============================================================================
# NOM COMMERCIAL — le nom qu'on lit, la ou le code est le nom qu'on tape
# =============================================================================
# Ecrit depuis la fiche du projet, dans la console deva.
#
# A LA RACINE DU build.yml, et non dans `conf.application.display_name` du
# client : la moitie du portefeuille n'a pas encore de partie Flutter, et son
# nom n'aurait alors eu aucun endroit ou se poser.
# =============================================================================
display_name: 'Donjons & Savons'


# =============================================================================
# ACCROCHE — une phrase, affichée sous le nom dans la console deva
# =============================================================================
# Ce qu'on répondrait à quelqu'un qui demande « c'est quoi ? ». Une seule
# phrase : au-delà, ce n'est plus une accroche, c'est la description.
#
# ⚠ SI LE PROJET A UN SITE, C'EST LA MÊME PHRASE. Celle de ddust est reprise
#   telle quelle de `hosting/web/fr/index.html` : elle est déjà publiée, et en
#   entretenir deux versions garantirait qu'elles divergent.
# =============================================================================
accroche: 'Vos enfants ne rangent pas leur chambre ? Transformez votre maison en donjon.'


# =============================================================================
# DESCRIPTION DU PROJET — affichée par la console deva (icône « œil »)
# =============================================================================
# Le CONCEPT du projet, écrit pour soi et pour dans six mois : ce qu'il est, à
# qui il s'adresse, ce qui le distingue. 2000 caractères au plus.
#
# ⚠ CE N'EST PAS `listing`. Celui-ci porte la fiche du store — écrite pour un
#   client, en trois langues, sous contrainte de longueur et de ton. Les deux
#   divergeraient aussitôt si on les confondait : l'une se réécrit à chaque
#   campagne, l'autre décrit une intention qui, elle, ne bouge presque pas.
#
# ⚠ SOURCE UNIQUE. La console la LIT et ne l'écrit jamais : elle se rédige ici,
#   dans le dépôt, versionnée avec le reste. Firestore n'en porte qu'une copie,
#   parce qu'Android n'a pas de build.yml sous la main.
# =============================================================================
description: |-
  Les corvées du foyer transformées en monstres, à abattre en famille. Application, abonnement, publiée sur le Play Store.

  Le foyer est un donjon poussiéreux ; les parents n'y arrivent plus et recrutent des aventuriers : les enfants. Chaque tâche ménagère est un monstre. Le vaincre rapporte de l'expérience au joueur ET au clan tout entier.

  Ce qui fait le jeu, c'est le BUTIN : quand le clan monte de niveau, les parents ouvrent un coffre dont ils ont eux-mêmes défini le contenu (argent de poche, sortie, privilèges) et il se répartit entre les joueurs au prorata de leur expérience acquise après avoir vaincu des monstres. La récompense est donc réelle, décidée par les parents, et le mérite s'y lit directement. Un coup de pouce en XP permet de relancer un retardataire sans fausser le compte du clan.


# =============================================================================
# ICÔNE DU PROJET — affichée par la console deva
# =============================================================================
# Chemin du PNG, relatif à la racine de la suite (là où vit ce fichier). La
# console le réduit à 256 px de large, l'encode en base64 et le range dans la
# collection `apps_icons` — c'est de là que l'app le relit, y compris sur
# Android, qui n'a aucun dépôt sous la main.
#
# ⚠ FACULTATIF. Sans cette clef, la console retombe sur la convention : le
#   dernier `<racine>/<paquet>/icon/icon.png` trouvé parmi les `build.resources`
#   de la partie Flutter. On ne la déclare donc que quand le fichier existe —
#   une clef qui désigne un fichier absent serait un mensonge de plus à
#   entretenir.
# =============================================================================
icon: 'resources/icon/icon.png'

# =============================================================================
# TYPE DE PROJET — lu par prompt_roadmap.py et prompt_revenus.py
# =============================================================================
# ⚠ C'EST LE TYPE QUI DÉCIDE DU TRAITEMENT, JAMAIS LE NOM. Les scripts n'ont
#   aucune connaissance des projets : ajouter une douzième application ou une
#   seconde société ne demande aucune ligne de code.
#
#   application  vend quelque chose. Plateau, cadence, marchés, note de
#                confiance, lots au catalogue.
#   structure    ne vend rien et porte les coûts communs (société, comptabilité,
#                comptes store). Ses lots se somment en euros NÉGATIFS : c'est du
#                revenu en moins, daté. Ni plateau ni note de confiance — un coût
#                est certain.
#   interne      livraison interne : ni revenu, ni coût propre. Coûte des sp.
# =============================================================================
type: application

# =============================================================================
# LANGUES SUPPORTÉES — décision du 2026-08-26
# =============================================================================
# ⚠ CETTE LISTE DÉCIDE DE QUATRE CHOSES À LA FOIS, et c'est pour ça qu'elle vit
#   en premier niveau plutôt que dans `listing:` :
#     - la fiche du store (titre, description, captures) par langue ;
#     - le contenu de l'app elle-même ;
#     - les DOCUMENTS LÉGAUX, qui se déclinent par région x état légal x langue ;
#     - les marchés réellement adressables — un enfant a besoin de SA langue,
#       l'anglais ne rattrape rien avant l'adolescence.
#
# ⚠ AJOUTER UNE LANGUE COÛTE PLUS QUE LA TRADUCTION. Les documents légaux se
#   multiplient : régions x états légaux x langues x documents. Passer de trois
#   à sept langues fait passer ddust de 24 à 56 familles de documents à rédiger
#   et à maintenir en version. C'est le poste le plus lourd, et le moins visible.
#
# ⚠ L'ORDRE EST CELUI DE LA PRIORITÉ, pas de l'alphabet. Le premier est la
#   langue par défaut : celle qui sert de repli quand la langue du système n'est
#   pas couverte, et celle dans laquelle les documents font foi.
# =============================================================================
langues:
  - fr      # langue par défaut et de référence
  - en
  - es
  - it
  - de
  - pt
  - nl

# =============================================================================
# DOCUMENTS LÉGAUX — les régions ouvertes. Décision du 2026-08-27.
# =============================================================================
# ⚠ LA NOTION DE « ZONE » A DISPARU, et c'est délibéré. Elle avait été introduite
#   la veille pour grouper les marchés partageant un droit ; elle imposait un
#   troisième découpage à tenir (zone / marché / datacenter) pour une économie
#   qui ne valait pas sa complexité. Un corpus recopié de `fr` vers `euo` ne
#   coûte rien ; un niveau d'indirection de plus se paie à chaque lecture.
#
# ⚠ UNE RÉGION EST UN MARCHÉ. Elle décide des documents légaux applicables et
#   déclare le datacenter qu'elle consomme. Rien d'autre — ni la langue (déclarée
#   au-dessus), ni le prix (fixé par devise).
#
# ⚠ RÉGION ≠ DATACENTER, et c'est tout l'intérêt du découplage. `fr` et `euo`
#   vivent tous deux dans le cloud `eu` : leurs joueurs partagent une base et
#   peuvent donc appartenir au même clan, tout en lisant des conditions
#   générales différentes. Le datacenter se déduit du catalogue de dvdocuments,
#   il ne se déclare pas ici.
#
# ⚠ CETTE LISTE, C'EST CE QUI EST OUVERT — pas ce qui est préparé. Le build
#   S'ARRÊTE si une région y figure sans corpus légal complet. C'est voulu :
#   `store.play.devises` tarifie déjà GBP, CHF, CAD, AUD, BRL, MXN et COP, mais
#   aucun de ces marchés n'a de documents. Les ouvrir ici avant de les avoir
#   rédigés servirait à un utilisateur des conditions qui ne sont pas les
#   siennes. Ajouter une région ici est donc le DERNIER geste d'une ouverture,
#   jamais le premier.
#
# ⚠ AUCUNE GÉOLOCALISATION. Le joueur déclare sa région au premier lancement et
#   cette déclaration fait foi — un Colombien vivant en France choisit la France,
#   parce que c'est le droit français qui s'applique à lui.
#
# ⚠ `layer.publish` : `regions` est la SEULE sous-clef qui parte au client. Le
#   reste de ce bloc est de la conf de déploiement.
# =============================================================================
documents:

  layer:
    publish:
      - regions

  # ⚠ LA FRANCE SEULE, et cette liste doit rester alignée sur ce qui est
  #   RÉELLEMENT VENDU : `store.play.devises.eur.publish` ne publie que "FR", et
  #   la piste fermée ne teste que la France. Ouvrir `euo` pour un testeur belge
  #   reviendrait à maintenir un second corpus — douze fichiers à re-versionner à
  #   chaque révision des CGU — pour un texte identique au mot près.
  #   Le jour où la Belgique ou l'Allemagne se vendent, `euo` s'ouvre ici et
  #   `tools/derive_market_corpus.py` produit son corpus. Pas avant.
  regions:
    - fr      # France — corpus de référence

# =============================================================================
# PRÉREQUIS — lus par prompt_roadmap.py
# =============================================================================
# ⚠ CE DONT CE PROJET A BESOIN, et qui est construit AILLEURS. Chaque entrée dit
#   « ce livrable-ci ne peut pas sortir avant ceux-là ». L'ordonnanceur insère
#   le prérequis juste avant son dépendant le plus précoce.
#
# ⚠ DÉCLARÉ CHEZ LE DÉPENDANT, JAMAIS CHEZ LA BRIQUE : un projet vendu seul ou
#   publié en open source doit emporter la liste de ce qu'il réclame. La brique
#   ne sait pas qui la consomme, et si elle le savait, retirer un projet du
#   portefeuille demanderait de l'éditer.
#
# ⚠ La contrainte est DURE : elle passe avant la cadence. Un lot de contenu peut
#   glisser d'un mois, un prérequis non livré rend son dépendant impossible.
# =============================================================================

requis:
  mvp:
    # ⚠ LA STRUCTURE PASSE AVANT LE LANCEMENT (décision 2026-08-28, câblée ici le
    #   2026-08-29). Ce n'est pas une préférence d'ordre : la micro-entreprise est
    #   ce qui ouvre le compte Play ORGANISATION, seul moyen de masquer l'adresse
    #   personnelle sur la fiche publique, et c'est elle qui fournit le SIREN que
    #   les 144 documents légaux doivent porter.
    #   Chaîne réelle : domiciliation → compte bancaire pro → immatriculation →
    #   DUNS → conversion du compte Play → nouvelle entrée d'app → CGU refaites.
    #   ⚠ `grisloup/mvp` ne pèse que 55rsp de DÉMARCHES, mais son délai réel est
    #     administratif et se compte en semaines : le modèle ne sait pas
    #     l'exprimer. C'est pour ça que le lot porte en plus une échéance
    #     `avant le` au 2026-11-07 dans la table `## livrables` — sans elle,
    #     l'ordonnanceur le liquiderait en trois jours.
    - grisloup/micro
  ios:
    # ⚠ LE PORTAGE VIENT APRÈS L'APP QU'IL PORTE, et ça n'était écrit nulle
    #   part. Sans cette ligne, l'ordonnanceur voyait un livrable de 13 sp dont
    #   le seul prérequis était `deva/ios` : il le plaçait donc très tôt, parfois
    #   AVANT le MVP. Chez Spirits, `ios` s'est retrouvé en tête du projet et,
    #   comme le livrable de référence se déduisait de la position, il a verrouillé
    #   la table à chaque exécution suivante — le MVP a glissé d'un an derrière
    #   son propre portage.
    - ddust/premierpas
    - deva/ios
  socle:
    - deva/dvorb
    - deva/dvcore
    - deva/dvassets
    - deva/dvcloudassets
    - deva/dvlayers
    - deva/dvtheme
    - deva/dvsound
  clan:
    - deva/dvcloud
    - deva/dvvirtuallobby
    - deva/dvqrcode
    - deva/dvqrcodereader
    - deva/dvparentalgate
  personnage:
    - deva/dvsession
    - deva/dvcamera
    - deva/dvdocuments
  taches:
    - deva/dvlock
    - deva/dvtaskbar
    - deva/dvsteps
  progression:
    - deva/dvorb
  notifications:
    - deva/dvmessaging
    - deva/pumessaging
    - deva/puscheduler
  journal:
    - deva/dvmarkdown
    - deva/dvsocialshare
  contenu_visuel:
    - deva/dvcloudassets
    - deva/puassets
  contenu_sonore:
    - deva/dvsound
  celebrations:
    - deva/dvflame
    - deva/dvinterlude
    - deva/dvvibrations
    - deva/dvpops
  administration:
    - deva/dvorb
  butin:
    - deva/dvorb
    - deva/dvcloudassets
  boutique:
    - deva/dvstore
    - deva/pustore
    - deva/pucatalog
  quetes_1:
    - ddust/loots
  quetes_2:
    - ddust/loots
  quetes_3:
    - ddust/loots
  potions_1:
    - ddust/loots
  potions_2:
    - ddust/loots
  potions_3:
    - ddust/loots
  devoirs:
    - ddust/loots
  Pack « Quêtes » I:
    - ddust/loots
  Pack « Potions » I:
    - ddust/loots
  Pack « Devoirs faits »:
    - ddust/loots
  Pack « Quêtes » II:
    - ddust/loots
  Pack « Potions » II:
    - ddust/loots
  Pack « Quêtes » III:
    - ddust/loots
  Pack « Potions » III:
    - ddust/loots
  quetes I:
    - ddust/loots
  potions I:
    - ddust/loots
  devoirs faits:
    - ddust/loots
  quêtes II:
    - ddust/loots
  potions II:
    - ddust/loots
  quêtes III:
    - ddust/loots
  potions III:
    - ddust/loots
  premier pas:
    - grisloup/micro
build:
  sequence:
  - backend
  - client
  # Verrou de production : a passer a true le jour ou l'app sert de vrais clans. Le mot-clef
  # reset reste tapable mais ne supprime plus rien (ni Firestore, ni GCS, ni Auth, ni les
  # caches locaux ci-dessous). Cle optionnelle : absente, le reset fonctionne normalement.
  production_on: false
  reset:
    local_paths:
      - "%APPDATA%/com.grisloup/ddust_client"
      - "%LOCALAPPDATA%/com.grisloup/ddust_client"
      - "{workspace}/client/assets"
      - "{workspace}/backend/assets"
    # Une entrée par région déclarée (backend/config.yml → conf.regions) : sans cela un
    # reset ne viderait que la moitié des données et laisserait des sessions fantômes
    # que le balayage multi-région du login retrouverait.
    # ⚠ LES BASES `us-*` ONT ÉTÉ RETIRÉES LE 2026-09-08 avec le datacenter qui les
    #   portait (backend/config.yml → regions). Les ancres YAML `&worker_collections`
    #   et consorts restent DÉFINIES bien que plus personne ne les référence : elles
    #   décrivent le contenu d'une base, pas le nombre de régions, et elles reprennent
    #   du service telles quelles le jour où une seconde région s'ouvre. Les effacer
    #   ferait perdre la liste au moment précis où on en aurait besoin.
    firestore:
      - project: dvddust
        database: eu-workers
        collections: &worker_collections
          - clans
          - clans_tasks
          - clans_items
          - clans_chest_history
          - clans_logs
          - clans_players
          # Un document par clan, écrit par pulse_sweeper (backend/config.yml, clans_pulse).
          # Absente de cette liste, elle survivrait au reset : le balayeur quotidien
          # continuerait de travailler sur des clans qui n'existent plus.
          - clans_pulse
          # Sans cette purge, un clan recréé après un reset retrouverait l'abonnement du
          # précédent : état payant, crédits de mois et timers de défaut de paiement
          # ressuscités sur des données de jeu vides.
          - clans_store
          - userindexes
          - users
      # Registre PERSONNEL des achats (base dédiée du module pustore) : un document par
      # achat, rangé par compte payeur, plus les verrous de jetons Play. À purger avec le
      # reste — sinon un jeton déjà réclamé refuserait d'être rejoué sur un clan neuf, et
      # le banc d'essai deviendrait inutilisable au deuxième passage.
      - project: dvddust
        database: eu-store
        collections: &store_collections
          - store_purchases
          - store_tokens
          # Codes cadeaux et compteurs d'essais. Même raison que les jetons : un code
          # déjà réclamé refuserait d'être rejoué sur un clan neuf, et le banc d'essai
          # deviendrait inutilisable au deuxième passage. La sous-collection `claims`
          # part avec son parent.
          - store_codes
          - store_code_attempts
      - project: dvddust
        database: eu-virtuallobby
        collections: &lobby_collections
          - virtuallobbylock
          - virtuallobbymanagement
          - virtuallobbysubmission
          - virtuallobbyexit
          - virtuallobbysecret
      # documents_sessions a pour doc-id l'uid Firebase, stable pour un compte Google donné :
      # sans cette purge un compte réutilisé après un reset retrouve sa région, son état légal
      # et ses CGU acceptées, et saute une partie de l'onboarding alors que son héros n'existe plus.
      - project: dvddust
        database: eu-documents
        collections: &documents_collections
          - documents_sessions
          - documents_acceptance
      - project: dvddust
        database: eu-messaging
        collections: &messaging_collections
          - msgregistry
          - msgindex
          - msgevents
          - msgdata
          - msgdesktops
      - project: dvddust
        database: eu-sessions
        collections: &sessions_collections
          - sessions
    # NEUTRALISE pour le grand reset d'avant-beta : ces buckets ne portent AUCUNE donnee
    # de joueur (layers YAML du catalogue, images, sons), seulement du contenu republie
    # par un build. Les vider sans enchainer un build+deploy laisserait l'app installee
    # incapable de charger ses assets. A decommenter pour retrouver le reset complet du
    # banc d'essai, qui lui est toujours suivi d'un build.
    # storage:
    #   - bucket: dvddust-eu-assets-storage
    # L'annuaire Firebase Auth : sans cette purge, le compte Google reste lié à l'uid de la
    # partie précédente et le prochain onboarding tombe sur l'écran de conflit « ce compte
    # Google est déjà lié à un autre héros » — alors que Firestore est vide.
    auth:
      - project: dvddust

# =============================================================================
# ÉDITEUR — L'IDENTITÉ JURIDIQUE, EN UN SEUL ENDROIT
# -----------------------------------------------------------------------------
# La même identité doit se retrouver, à l'identique, en six endroits : profil de
# paiement Play, déclaration de statut de vendeur (DSA), facturation GCP, éditeur
# déclaré aux CGU, mention « éditeur » du site, et responsable de traitement de
# stores/google/dpa.md §3. Un écart bloque la validation ou fragilise le dossier
# RGPD — d'où une source unique plutôt que six saisies.
#
# ⚠ RÉÉCRIT LE 2026-09-03 — L'IMMATRICULATION EST OBTENUE.
# SIREN 109354092, RNE du 2026-09-02, APE 58.29C. Ce bloc portait jusqu'ici
# l'identité d'une PERSONNE PRIVÉE (domicile de Courdimanche, mobile personnel,
# aucun numéro d'immatriculation) parce qu'il n'y avait rien d'autre à écrire. Il
# porte désormais celle d'une ENTREPRISE, dont l'adresse est FAITE pour être
# publique. C'était le motif central de toute la démarche : cf.
# grisloup/docs/plan-creation-micro-entreprise.md, dont le tableau d'identité en
# tête est la source unique que ce bloc recopie.
#
# ⚠ CE BLOC DÉCRIT LA CIBLE, PAS L'ÉTAT DE LA CONSOLE AUJOURD'HUI. Le compte Play
# est encore un compte PARTICULIER dont le profil de paiement, vérifié le
# 2026-08-20, porte la résidence réelle — et Google refuse une domiciliation sur
# un compte personnel. La bascule se fait en une fois, à la phase 4 du plan :
# D-U-N-S, second profil de paiement de type organisation, conversion, 72 h. Tant
# qu'elle n'a pas eu lieu, `saisie_compte.md` décrit des écrans qui n'accepteront
# pas encore ces valeurs. C'est voulu : la feuille de saisie sert le jour de la
# conversion, et une feuille qui porterait l'ancienne adresse ferait republier le
# domicile.
#
# ⚠ AUCUN bloc `layer:` ici, et c'est délibéré. builder._ingest_shared_conf ne
# donne la section entière qu'aux apps `pulumi` ; pour une app embarquée, une
# section sans `layer.publish` déclaré tombe dans un `continue` (« Aucun layer
# declare : rien ne part »). Rien de tout ceci ne descend donc dans l'APK ni dans
# le layer du bucket, que l'app lit sans authentification.
# La règle SURVIT au changement d'adresse : la domiciliation est publiable, mais
# une identité qui circule dans un binaire décompressable ne se corrige plus.
# L'éditeur est déjà annoncé aux utilisateurs là où c'est dû — corpus légal et
# pages du site — et ces textes-là, eux, se republient.
#
# Ce que la console rend PUBLIC, et quand : se déclarer « professionnel » au sens
# du DSA fait afficher nom + adresse complète + téléphone sur la fiche Play dans
# l'EEE. Pour un compte ORGANISATION, adresse et téléphone sont publiés même sans
# monétisation. C'est désormais sans conséquence : ce sont ceux de la structure.
# Détail : stores/google/compte.md, et stores/google/publication.md §6.1.
# =============================================================================

publisher:

  # Feuille de saisie des consoles, RENDUE au build depuis le gabarit : les valeurs
  # ci-dessous y sont injectées telles quelles. C'est ce qu'on ouvre devant le
  # formulaire — plus rien à recouper, plus aucune référence à résoudre de tête.
  # Une référence @@@C:...@@@ qui ne résout pas FAIT ÉCHOUER le build : un champ
  # vide dans une procédure de saisie, c'est une case remplie de mémoire.
  # Une saisie par section de conf partagée : `publisher` donne saisie_compte.md,
  # `store` donnera saisie_produits.md le jour où le catalogue en aura besoin.
  doc:
    template: ../stores/google/saisie_compte.tpl.md
    path: ../stores/google/saisie_compte.md

  # ===========================================================================
  # RÈGLE DE NOMMAGE DU PORTEFEUILLE — arrêtée le 2026-09-03
  # ---------------------------------------------------------------------------
  # UNE SEULE CHAÎNE, TENUE SUR TOUS LES FRONTS : D-U-N-S, profil de paiement
  # Google, compte bancaire, facturation Cloud, corpus légal, site. Sans
  # exception et sans variante. Ce champ en est la source.
  #
  # ⚠ IL N'EXISTE AUCUNE FORME OFFICIELLE À RECOPIER, et c'est ce qui rend la
  # règle nécessaire. Une entreprise individuelle n'a AUCUNE dénomination
  # sociale : ni l'INSEE ni le greffe ne stockent un « nom d'entreprise », mais
  # des champs séparés — nom, nom d'usage, prénoms — que chaque service
  # RECOMPOSE à sa façon. Il fallait choisir une écriture, puis s'y tenir.
  #
  # ⚠ ORDRE DU REGISTRE, pas l'ordre naturel. Le premier formulaire qui réclame
  # un « nom de l'entreprise » est celui du D-U-N-S, et c'est LUI qui fixe la
  # référence pour tout le reste : Google confronte le profil de paiement à la
  # fiche D&B, la banque au profil, la facturation Cloud à la banque. Autant que
  # la chaîne partie chez Altares soit celle du KBIS, qui est la pièce jointe.
  #
  # ⚠ CE QUI EST DÉLIBÉRÉMENT ABSENT DE LA CHAÎNE :
  #   - le TRAIT D'UNION de la pièce d'identité (« MARCHAL-DE GREEF ») : c'est
  #     l'extrait d'immatriculation que Google confronte en vérification
  #     ORGANISATION, pas la carte. Celle-ci ne ressert qu'aux contrôles
  #     d'identité de la personne physique, où l'écart s'explique ;
  #   - le SECOND PRÉNOM « Flavien » : le risque de vérification porte sur la
  #     chaîne du NOM DE FAMILLE, jamais sur les prénoms ;
  #   - la VIRGULE du Kbis (« Guillaume, Flavien ») : elle sépare les prénoms,
  #     elle n'appartient pas au nom ;
  #   - la mention « EI » : obligatoire sur les FACTURES et les MENTIONS LÉGALES
  #     seulement. Ici, deux lettres de plus fabriqueraient la divergence qu'on
  #     cherche justement à éviter.
  #
  # ⚠ LES CAPITALES SONT VOULUES. Convention des registres français, et elle
  # lève une ambiguïté réelle : « Marchal De Greef » est fait de trois mots dont
  # on ne devine pas, hors contexte, lesquels forment le patronyme.
  #
  # ⚠ SURTOUT PAS « Grisloup » NI « grisloup.com » ICI : c'est le nom commercial,
  # il vit dans `trade_name`. L'écart avec la pièce justificative est une cause
  # classique de blocage.
  #
  # ⚠ CE QUE CETTE RÈGLE A REMPLACÉ : jusqu'au 2026-09-03 le portefeuille
  # écrivait « Guillaume Marchal De Greef », forme validée par Google le
  # 2026-08-20 sur le profil de paiement PARTICULIER. Cette validation n'est pas
  # perdue : le profil organisation est un profil NEUF, vérifié de zéro. L'ancien
  # reste en place avec son ancienne écriture jusqu'à la conversion — deux
  # profils distincts, aucune conséquence.
  # ===========================================================================
  legal_name: "MARCHAL DE GREEF Guillaume"

  # ⚠ ADRESSE DE DOMICILIATION, ET C'EST TOUT L'OBJET DE L'OPÉRATION. Elle a
  # remplacé la résidence réelle le 2026-09-03, l'immatriculation ayant été
  # obtenue la veille. C'est l'adresse d'établissement inscrite au registre, et
  # c'est elle que publieront la fiche Play, les CGU et le site.
  # ⚠ CE QUI EST ACQUIS ICI NE L'EST PAS AU REGISTRE. L'extrait Kbis du 02/09
  # renseigne encore une rubrique « Domicile personnel ». Ce fichier-ci est
  # propre ; l'occultation INSEE, elle, reste à vérifier — cf. l'encadré rouge en
  # tête de grisloup/docs/plan-creation-micro-entreprise.md. Ne pas conclure de
  # ce bloc que l'adresse personnelle a disparu partout.
  #
  # ⚠ Google REFUSE une domiciliation sur un compte PERSONNEL. Cette adresse
  # n'est donc saisissable qu'après la bascule en compte organisation (phase 4 du
  # plan). D'ici là, la console porte encore l'ancienne — c'est l'unique écart
  # assumé entre ce fichier et l'écran, et il se referme en une seule fois.
  address:
    street: "20 rue Lavoisier"
    postal_code: "95300"
    city: "Pontoise"
    country: FR

  # ⚠ NUMÉRO DE LA STRUCTURE, PAS LE MOBILE PERSONNEL (échangé le 2026-09-03).
  # Le statut de vendeur DSA PUBLIE ce numéro sur la fiche Play dans l'EEE, et un
  # compte organisation le publie même sans monétisation. Y laisser le mobile
  # privé aurait rendu publique la donnée personnelle que la domiciliation venait
  # d'écarter. C'est déjà ce numéro que porte le corpus légal et les pages du
  # site depuis le 2026-08-31 : les six points de cohérence se rejoignent ici.
  phone: "+33744470944"

  # SIREN, attribué le 2026-09-02. `~` jusque-là, faute d'immatriculation.
  # ⚠ SIREN À NEUF CHIFFRES, PAS LE SIRET : les cinq chiffres d'établissement
  # sont à relever sur l'extrait et ne sont pas encore connus. Les formulaires
  # Google demandent le numéro d'immatriculation de l'ENTREPRISE — c'est bien
  # celui-ci. Le SIRET, lui, servira à la facturation Cloud et au SIE.
  # ⚠ Pas de numéro de TVA intracommunautaire : il n'existe pas encore (demande
  # au SIE, plan §2.1). Le champ n'est pas créé tant qu'il serait vide — une clé
  # vide dans une feuille de saisie, c'est une case remplie de mémoire.
  registration_number: "109354092"

  # SIRET de l'établissement — SIREN + clef NIC `00016`, relevé le 2026-09-03.
  # ⚠ AUCUN FORMULAIRE GOOGLE NE LE DEMANDE : les consoles veulent le numéro de
  # l'ENTREPRISE, donc `registration_number` ci-dessus. Ce champ existe pour la
  # FACTURATION GOOGLE CLOUD, le SIE et les déclarations — c'est-à-dire tout ce
  # qui identifie l'établissement et non la personne. Il est ici parce que ce
  # bloc est l'identité en un seul endroit, pas parce qu'un gabarit le lit.
  # ⚠ NE FIGURE PAS AU KBIS : c'est une donnée INSEE, pas greffe.
  siret: "10935409200016"

  # Numéro D-U-N-S, attribué par Altares/D&B après l'immatriculation.
  # ⚠ C'EST LA CLEF DU COMPTE ORGANISATION, et rien d'autre. Google l'exige pour
  # créer un profil de paiement de type organisation (phase 4.1 du plan) : c'est
  # lui qui débloque la conversion, donc la domiciliation sur la fiche publique.
  # Sans lui, tout le bloc ci-dessus décrit une cible que la console refuse.
  # ⚠ CE N'EST PAS UNE MENTION LÉGALE. Aucun texte français ne l'exige — ni la
  # LCEN, ni R123-237 du code de commerce, qui demandent le RCS. Il ne descend
  # donc ni dans le corpus légal, ni sur le site. Il est ici parce que ce bloc est
  # l'identité en un seul endroit, et parce que `saisie_compte.tpl.md` le lit.
  # ⚠ LA FICHE D&B EST CE QUE GOOGLE CONFRONTE au profil de paiement, et c'est
  # ELLE dont Apple tire l'adresse « trader » affichée sur l'App Store européen,
  # souvent sans correction possible ensuite. Le NOM y est vérifié conforme
  # (2026-09-06, « MARCHAL DE GREEF GUILLAUME ») ; l'ADRESSE reste à contrôler —
  # cf. grisloup/docs/plan-creation-micro-entreprise.md, phase 3.
  duns: "28-814-9658"

  # Code d'activité. Deux valeurs coexistent, et ce n'est PAS une divergence :
  # l'INSEE publie l'ancienne nomenclature et la NAF 2025 en parallèle pendant la
  # transition. `58.29C` est celui du champ « Code NAF/APE de l'établissement »,
  # et celui qu'attendent encore les administrations françaises — c'est donc lui
  # qu'on donne quand un formulaire n'en accepte qu'un.
  # ⚠ CE QUI COMPTE EST LA DIVISION 58, « Édition », qui se lit comme une
  # activité commerciale et fonde la position BIC. Les deux codes y sont. Un code
  # en 62 — « programmation informatique » — se lirait comme une prestation de
  # services et ruinerait l'argument : si l'un d'eux dérive un jour vers 62, ce
  # n'est pas une correction cosmétique, c'est un signal fiscal.
  ape: "58.29C"
  ape_naf2025: "58.29Y"

  # ---------------------------------------------------------------------------
  # DÉJÀ PUBLICS AILLEURS — regroupés ici pour que l'identité tienne d'un bloc
  # ---------------------------------------------------------------------------
  # ⚠ Trois « noms » distincts, que la console ne distingue pas clairement :
  #   legal_name     → le nom civil, pour le juridique et le paiement
  #   trade_name     → le nom commercial, éditeur déclaré aux CGU et au site
  #   developer_name → ce qui s'affiche sur la fiche Play, champ à part entière
  #                    des paramètres du compte
  # ⚠ « Grisloup », pas « grisloup.com » (corrigé le 2026-09-03). C'est le nom
  # commercial DÉCLARÉ AU RNE et confirmé sur l'extrait — un seul mot, une
  # majuscule. `grisloup.com` est le domaine, déclaré à côté ; le confondre avec
  # le nom commercial faisait diverger le build du registre et du corpus légal,
  # qui écrit « Grisloup » depuis le 2026-08-31.
  trade_name: Grisloup
  developer_name: Grisloup
  email: donjons@grisloup.com
  website: https://donjons.grisloup.com

# =============================================================================
# SOUS-TRAITANCE RGPD — CONTACTS ET ARCHIVAGE
# -----------------------------------------------------------------------------
# Les contrats d'adhésion de Google ne se signent plus : aucune case « j'accepte »
# n'existe dans les consoles récentes. La preuve d'adhésion, au titre de
# l'accountability (art. 5.2 RGPD), c'est l'ARCHIVE DATÉE du texte en vigueur,
# plus les contacts renseignés. À refaire à chaque version publiée par Google —
# donc exactement ce qu'une mémoire humaine ne tient pas, d'où l'automatisation.
#
# Des trois démarches de dpa.md §2, une seule reste manuelle (le contact Firebase,
# sans API) : les contacts essentiels GCP sont posés par puproject au déploiement,
# et l'archivage est fait par le build.
#
# Clés PLATES (`cdpa_*`, `dpst_*`) : le moteur de rendu des gabarits fait de la
# substitution sans boucle, une liste y rendrait son repr Python. `archive:` ne
# liste que les préfixes — c'est le code qui compose les noms de clés.
#
# Pas de bloc `layer:` : rien de tout ceci ne descend au client ni au bucket.
# =============================================================================

dpa:

  doc:
    template: ../stores/google/saisie_dpa.tpl.md
    path: ../stores/google/saisie_dpa.md
    # Filet : si l'archivage a échoué plusieurs builds de suite, le document sort
    # quand même mais le build le dit en jaune.
    expect:
      - legal/cdpa-*.pdf
      - legal/firebase-dpst-*.pdf

  # Chemin où le build écrit, relatif à build/ — c'est ce que le code consomme.
  archive_dir: legal/
  # Le MÊME endroit, vu depuis la feuille de saisie (qui vit dans stores/google/).
  # Les deux existent parce qu'ils ne s'adressent pas au même lecteur : afficher
  # `legal/` dans la feuille envoyait chercher dans `stores/google/legal/`, qui
  # n'existe pas.
  archive_dir_doc: ../../build/legal/
  archive: [cdpa, dpst]

  # Catégorie de contact essentiel GCP. La RESSOURCE est déclarée dans
  # backend/config.yml → conf.project.essential_contacts, et c'est elle qui fait
  # foi ; les deux clés ci-dessous n'existent que pour l'AFFICHER dans la feuille.
  #
  # Elles étaient une seconde source de vérité muette : changer la catégorie côté
  # backend aurait fait mentir la feuille sans que rien ne le signale. Le code du
  # builder recoupe désormais `contact_category_code` avec ce que déclare
  # réellement le backend et sort un avertissement jaune en cas d'écart.
  contact_category: Juridique       # libellé affiché par la console GCP (fr)
  contact_category_code: LEGAL      # code API — recoupé avec backend/config.yml

  # `_anchor` : fragment de texte qui doit être présent dans la page. Il ne vérifie
  # pas le PDF (le texte d'un PDF Chrome est compressé) mais qu'on est bien sur le
  # bon document avant d'archiver quoi que ce soit.
  cdpa_name: Cloud Data Processing Addendum
  cdpa_url: https://cloud.google.com/terms/data-processing-addendum
  cdpa_anchor: Cloud Data Processing Addendum
  cdpa_file: cdpa

  dpst_name: Firebase Data Processing and Security Terms
  dpst_url: https://firebase.google.com/terms/data-processing-terms
  dpst_anchor: Data Processing and Security Terms
  dpst_file: firebase-dpst

  # Second canal de veille, celui-là humain : la liste des sous-traitants Google se
  # suit par abonnement à la page, pas par notification contractuelle.
  subprocessors_url: https://cloud.google.com/terms/subprocessors

# =============================================================================
# FICHE PLAY STORE — TEXTES, RÉGLAGES ET ASSETS
# -----------------------------------------------------------------------------
# Les cinq formulaires de l'étape 8 (Sécurité des données, IARC, Public cible,
# Accès à l'app, fiche) sont tous obligatoires AVANT la première release, test
# fermé compris. Ce bloc porte ce qui s'y saisit ; playstore.md garde le pourquoi.
#
# `assets:` est une LISTE parce qu'elle est consommée par du code (la copie), pas
# par un gabarit — le moteur de rendu, lui, substitue sans boucle, d'où des clés
# plates pour tout ce que la feuille cite. Même partage des rôles que dpa.archive.
#
# L'ORDRE de la liste est l'ordre de téléversement : le build renomme en
# 01-icone / 02-feature / 03-capture-N, de sorte que le dossier de destination se
# lise sans se reporter ici.
#
# Pas de bloc `layer:` : rien ne descend au client.
# =============================================================================

listing:

  doc:
    template: ../stores/google/saisie_playstore.tpl.md
    path: ../stores/google/saisie_playstore.md

  assets_dir: ../stores/google/assets/
  assets:
    - kind: icon
      expect: 512x512
      source: hosting/web/icon-512.png
    - kind: feature
      expect: 1024x500
      source: hosting/web/assets/img/playstore.png
    # Captures : Play impose un intervalle (côté court ≥ 320 px, ratio ≤ 2:1) et
    # non une taille fixe — d'où l'absence d'`expect`, le contrôle est la règle.
    - kind: screenshot
      source: hosting/web/assets/img/04-welcome.png
    - kind: screenshot
      source: hosting/web/assets/img/21-birth-of-clan.png
    - kind: screenshot
      source: hosting/web/assets/img/40-time-to-clean.png
    - kind: screenshot
      source: hosting/web/assets/img/32-choose-avatar.png
    - kind: screenshot
      source: hosting/web/assets/img/33-me.png
    - kind: screenshot
      source: hosting/web/assets/img/54-pocket-money.png
    - kind: screenshot
      source: hosting/web/assets/img/59-loot-chest.png
    - kind: screenshot
      source: hosting/web/assets/img/67-clan.png

  # ---------------------------------------------------------------------------
  # TEXTES
  # ---------------------------------------------------------------------------
  name: Donjons & Savons

  short_fr: "Transformez les corvées en aventure familiale : tâches-monstres, XP et butins."
  short_en: "Turn chores into a family adventure: monster tasks, XP, levels and loot chests."
  short_es: "Convierte las tareas en una aventura familiar: monstruos, XP, niveles y botín."

  # ⚠ Copie COMMERCIALE, pas de la conf technique : elle se relit avant d'être
  # collée. Les versions EN et ES sont des ADAPTATIONS — la chute joue sur
  # épées/éponges, qui ne se traduit pas mot à mot. Les arguments de conformité
  # (pas de pub, pas de traceur, photos qui restent sur l'appareil, données en
  # Europe) sont conservés tels quels dans les trois : ce sont eux qui portent la
  # promesse, et ils doivent rester vrais.
  long_fr: |
    ⚔️ Les corvées sont des monstres. Abattez-les en famille !

    Donjons & Savons transforme la maison en donjon : la famille devient un clan, chaque tâche ménagère devient un monstre à vaincre, et chaque victoire rapporte de l'expérience au joueur comme au clan. Quand le coffre du clan est plein, la famille ouvre un butin — une vraie récompense, décidée à l'avance par les parents. Le jeu ne simule pas la récompense : il structure la promesse familiale.

    🛡️ Comment ça marche
    • Un parent fonde le clan et invite la famille (QR code ou lien sécurisé).
    • Chacun choisit son avatar et son nom d'aventurier.
    • Ranger sa chambre, sortir les poubelles, mettre la table : 19 domaines et plus de 150 tâches, ajustés à votre foyer — et vos propres tâches en plus.
    • Les parents valident les exploits (preuve photo possible — elle reste sur le téléphone).
    • XP, niveaux, titres, points de vie, journal du clan et cérémonies d'ouverture du butin.

    👨‍👩‍👧‍👦 Pensé pour les familles
    • Aucune publicité, aucun traceur, aucun achat surprise.
    • Les mineurs ne rejoignent un clan qu'avec le consentement d'un adulte responsable.
    • Les photos ne quittent jamais l'appareil ; les données restent hébergées en Europe.
    • Suppression de compte autonome, dans l'app ou sur le site.

    Le butin est la promesse tenue. À vos épées — et à vos éponges !

  long_en: |
    ⚔️ Chores are monsters. Defeat them as a family!

    Donjons & Savons turns your home into a dungeon: the family becomes a clan, every household chore becomes a monster to defeat, and every victory earns experience for the player and for the clan. When the clan chest is full, the family opens a loot chest — a real reward, agreed in advance by the parents. The game doesn't simulate the reward: it gives the family promise a structure.

    🛡️ How it works
    • A parent founds the clan and invites the family (QR code or secure link).
    • Everyone picks an avatar and an adventurer name.
    • Tidying a bedroom, taking out the bins, setting the table: 19 areas and more than 150 tasks, tuned to your household — plus any you add yourself.
    • Parents validate each feat (photo proof optional — it never leaves the phone).
    • XP, levels, titles, hit points, clan log and loot-opening ceremonies.

    👨‍👩‍👧‍👦 Built for families
    • No ads, no trackers, no surprise purchases.
    • Minors only join a clan with the consent of a responsible adult.
    • Photos never leave the device; data stays hosted in Europe.
    • Delete your account yourself, in the app or on the website.

    The loot is the promise kept. Grab your swords — and your sponges!

  long_es: |
    ⚔️ Las tareas del hogar son monstruos. ¡Derrotadlas en familia!

    Donjons & Savons convierte la casa en una mazmorra: la familia se convierte en un clan, cada tarea del hogar se convierte en un monstruo al que vencer, y cada victoria da experiencia al jugador y al clan. Cuando el cofre del clan está lleno, la familia abre un botín: una recompensa de verdad, acordada de antemano por los padres. El juego no simula la recompensa: da estructura a la promesa familiar.

    🛡️ Cómo funciona
    • Un adulto funda el clan e invita a la familia (código QR o enlace seguro).
    • Cada cual elige su avatar y su nombre de aventurero.
    • Ordenar la habitación, sacar la basura, poner la mesa: 19 ámbitos y más de 150 tareas, ajustadas a vuestro hogar, además de las que añadáis vosotros.
    • Los padres validan las hazañas (con foto opcional, que nunca sale del teléfono).
    • XP, niveles, títulos, puntos de vida, diario del clan y ceremonias de apertura del botín.

    👨‍👩‍👧‍👦 Pensado para familias
    • Sin publicidad, sin rastreadores, sin compras sorpresa.
    • Los menores solo entran en un clan con el consentimiento de un adulto responsable.
    • Las fotos nunca salen del dispositivo; los datos se alojan en Europa.
    • Puedes eliminar tu cuenta tú mismo, en la app o en la web.

    El botín es la promesa cumplida. ¡A por vuestras espadas... y vuestras esponjas!

  # ---------------------------------------------------------------------------
  # RÉGLAGES DE LA FICHE
  # ---------------------------------------------------------------------------
  category: "Application → Parentalité"
  tags: "famille, corvées, tâches, enfants, motivation, RPG"
  languages: "fr-FR (par défaut), en-US, es-ES"
  # ⚠ LA FRANCE SEULE, ET LA BELGIQUE EN A ÉTÉ RETIRÉE LE 2026-08-27. Elle était
  #   là du temps où un corpus `eu` unique couvrait toute l'Union : un testeur
  #   belge y trouvait des CGU faites pour lui. Depuis que les documents suivent
  #   le MARCHÉ et que seul `fr` est ouvert, il n'aurait plus qu'un « Royaume de
  #   France » à choisir — soit des conditions qui ne le visent pas.
  #   Rouvrir la Belgique, c'est ouvrir le marché `euo` : d'abord son corpus,
  #   ensuite ce pays. Le build refuse l'ordre inverse.
  countries_closed: "France"
  countries_prod: "France au lancement, le reste de l'UE ensuite"
  privacy_url: https://donjons.grisloup.com/fr/legal/
  delete_url: https://donjons.grisloup.com/delete-account/

  # ---------------------------------------------------------------------------
  # ACCÈS À L'APP (App access)
  # ---------------------------------------------------------------------------
  # L'app exige une connexion Google : sans compte fonctionnel, la revue rejette
  # pour « impossible d'accéder au contenu ». Les deux comptes sont aussi les
  # testeurs sous licence declares dans store.play.license_testers.
  #
  # ⚠ Mot de passe en clair, décision assumée : une feuille de saisie qui renvoie
  # ailleurs pour un seul champ cesse d'être une feuille de saisie. C'est ICI que
  # ces identifiants font foi, et nulle part ailleurs.
  app_access:
    adult_email: daddy.ddust@gmail.com
    adult_role: chef de clan adulte
    kid_email: kiddy.ddust@gmail.com
    kid_role: membre mineur
    password: "Ddust!12345678"
    instructions: "Le compte fourni a déjà un clan pour accéder immédiatement au jeu, et une connexion avec un compte Google neuf déroule le parcours complet de consentement."

# =============================================================================
# BOUTIQUE — LA SOURCE UNIQUE
# -----------------------------------------------------------------------------
# Ce bloc est ici, et pas dans le config.yml d'une app, parce que les MÊMES
# identifiants servent à trois endroits qui ne doivent jamais diverger :
#
#   - l'APP les affiche         (layer publié au bucket + conf embarquée)
#   - le BACKEND les vérifie    (TRIAL_OFFER_ID des trois fonctions de pustore)
#   - pucatalog les CRÉE        (chez Google, en Play Console)
#
# Trois copies, ce sont deux occasions de diverger. Et la divergence ne se voit
# pas : une variante d'orthographe sur `essai-14j` ne casse rien à l'écran, elle
# fait juste passer tous les essais pour des abonnements payants dans les
# chiffres. Un identifiant Play, lui, ne se corrige jamais — il se contourne.
#
# Le builder redistribue ce bloc : conf du client, config.yaml du backend, et le
# layer cloud déclaré ci-dessous. On n'écrit donc un identifiant qu'ICI.
# =============================================================================

store:
  # ===========================================================================
  # PAYS EXCLUS DE LA DISTRIBUTION — décision du 2026-08-26
  # ===========================================================================
  # ⚠ TROIS CRITÈRES, dans cet ordre : régime politique, existence d'un rail de
  #   paiement, état du droit (données personnelles, mineurs). Le premier est un
  #   choix, pas une contrainte technique — on ne vend pas à une dictature.
  #
  # ⚠ Un pays retiré ici ne doit jamais réapparaître dans
  #   `store.play.devises.*.countries`.
  #   Le motif est écrit pour que la décision se rediscute sur son fond, et non
  #   qu'elle se perde : un pays absent d'une liste, sans explication, finit
  #   rajouté par quelqu'un qui complète.
  pays_exclus:
    CU: "parti unique. Google Play y est de toute façon indisponible (sanctions)."
    VE: "régime autoritaire. Sanctions, et rails de paiement inopérants."
    NI: "régime autoritaire — société civile et presse démantelées."
    HT: "pas une dictature, mais pas d'État : aucun paiement viable."
    # ⚠ Les deux cas limites, tranchés le 2026-08-26. Ni l'un ni l'autre n'est
    #   un régime à parti unique — c'est du RECUL DÉMOCRATIQUE, et la ligne a
    #   été placée là volontairement. Les deux marchés sont minuscules : la
    #   décision ne coûte presque rien et évite d'avoir à retrancher à chaque
    #   élection.
    SV: "état d'exception prolongé — suspension continue des garanties."
    BO: "crise institutionnelle récurrente, droit des données faible."

  # Où publier la part du bloc que l'APP doit voir. Un layer au bucket se relit
  # sans nouvelle version sur le store : ouvrir un palier ou corriger un barème ne
  # coûte pas une release. `publish` restreint volontairement à ce qui regarde
  # l'app — la grille de prix par pays n'a aucune raison de voyager jusqu'aux
  # appareils.
  #
  # ⚠ Ce champ s'est d'abord appelé `keys`, ce qui cassait TOUT le chargement de la
  # conf : dvidle range les clefs en attributs Python, un champ nommé `keys` écrase
  # donc la méthode `keys()` et le premier `mask()` venu meurt sur « 'list' object is
  # not callable ». Noms à ne jamais employer dans une conf : keys, get, set, values,
  # mask, tojson, toyaml, fromjson, fromyamlfile, toyamlfile, to_repr.
  layer:
    path: resources_cloud/general/layers/store-catalog-global.yml
    publish:
      - catalog

  # ---------------------------------------------------------------------------
  # CE QUI N'EXISTE QUE POUR GOOGLE PLAY
  # ---------------------------------------------------------------------------
  play:

    package: com.grisloup.ddust_client

    # Référentiel des régions Play. Le figer évite qu'une mise à jour du
    # référentiel chez Google ne déplace des pays sous nos pieds au prochain build.
    regions_version: "2022/02"

    # Pas de `developer_id` ici : ce serait une action manuelle déguisée (aller lire
    # un nombre dans une URL pour le recopier). pucatalog le DÉCOUVRE — le champ
    # `name` d'un utilisateur du compte suit `developers/{id}/users/{email}` — puis le
    # range à côté de son marqueur de câblage. Introuvable, il ouvre l'URL générique
    # de la console : un clic de menu en plus, et rien à saisir.

    # Les deux identifiants d'offre que lisent store_verify, store_rtdn et
    # store_sweeper (cf. backend/config.yml). Ils ne sont plus écrits qu'ici : les
    # fonctions les reçoivent par référence @@@C:...@@@, et pucatalog crée chez
    # Google des offres portant exactement ces noms. Ils ne PEUVENT plus diverger.
    trial_offer:   essai-14j
    founder_offer: fondateur

    # --- Qui a droit à l'offre fondateurs ---------------------------------------
    # Play sait arbitrer lui-même l'essai « nouveaux clients ». L'offre de lancement,
    # non : son éligibilité est DÉLÉGUÉE au développeur, et tant que personne ne
    # tranche, personne n'en bénéficie. C'est cette date qui tranche.
    #
    # Un clan CRÉÉ AVANT cet instant est fondateur. Un clan dont la date de création
    # est illisible rend 0, donc l'est aussi — délibéré : les clans les plus anciens
    # sont précisément ceux d'avant que le champ n'existe, et l'offre de lancement
    # leur est due.
    #
    # pucatalog écrit ce couple dans {région}-store/store_config/founders, d'où
    # `store_eligibility` le relit à chaque achat. Sans ce document la fonction sort
    # sur `if (!conf.exists)` et AUCUN clan n'est jamais fondateur — l'offre existe
    # chez Google mais l'app ne la demande pour personne.
    #
    # LA CONF FAIT FOI : la retoucher en console dépanne, rejouer un build réaligne
    # le document sur la valeur ci-dessous (et le dit à l'écran).
    #
    # Fin de la période de lancement : couvre le test fermé et les premières semaines
    # de production. À avancer si les betas s'étirent — ce n'est qu'une date.
    founder_cutoff: "2026-09-30T23:59:59+02:00"

    # Réserve de mois offerts posée d'office sur le document. Rien ne la lit
    # aujourd'hui (les crédits s'accordent un par un via store_grant) : 0 est la
    # valeur qui respecte la forme documentée sans rien distribuer.
    founder_credit_months: 0

    # --- Les comptes qui achètent gratuitement, pour la recette ---------------
    # Leurs achats sont RÉELS côté Play — vraie commande, vrai RTDN, vraie
    # vérification par store_verify — mais GRATUITS. C'est ce qui fait apparaître
    # les moyens de paiement de test dans la feuille d'achat, dont « refuse
    # toujours » et « approuve puis rétrofacture » : les seuls moyens d'éprouver un
    # impayé et un remboursement sans payer pour de bon.
    #
    # À ne pas confondre avec le banc d'essai du client, qui fabrique des états
    # sans jamais parler à Play. Les deux se complètent.
    #
    # C'est un réglage du COMPTE développeur, pas de l'app, et aucune API Play ne
    # l'expose : pucatalog ne peut que guider le geste en console. Être testeur sous
    # licence n'ouvre AUCUN accès à l'app — il faut aussi être sur une piste.
    license_testers:
      - daddy.ddust@gmail.com
      - kiddy.ddust@gmail.com

    # --- Les deux offres, déclarées une fois, attachées à chaque base plan ----
    offers:

      # Quatorze jours et pas un mois : un mois complet laissait passer le pic
      # d'enthousiasme avant le premier paiement. Éligibilité « acquisition de
      # nouveaux clients » : Play vérifie lui-même qu'aucun abonnement n'a jamais
      # existé sur ce compte — rien à coder côté serveur.
      # ⚠ PROMESSE COMMERCIALE EMBARQUÉE : les quatorze jours sont annoncés dans
      # lang.yml. Les deux durées doivent bouger ensemble.
      essai-14j:
        eligibility: new_customers
        phases:
          - { duration: P14D, free: true }

      # Offre de lancement. Éligibilité DÉTERMINÉE PAR LE DÉVELOPPEUR : Play ne
      # filtre rien, c'est `store_eligibility` qui tranche à partir du cutoff posé
      # dans store_config/founders — voir `founder_cutoff` plus haut, dont pucatalog
      # fait ce document. C'est précisément ce qui permet de décaler la fenêtre sans
      # redéploiement — une offre de lancement dont la date est figée dans du code
      # ne sert pas à grand-chose.
      # Un mois offert, puis la première année à -30%.
      fondateur:
        eligibility: developer
        phases:
          - { duration: P1M, free: true }
          - { duration: P1Y, discount_percent: 30 }

    # --- Les deux défauts qu'exigent les produits à l'unité -------------------
    # Play réclame une `defaultLanguage` et un `defaultPrice` sur chaque produit à
    # l'unité — les abonnements, eux, s'en passent. Ils ne se devinent pas : prendre
    # « la première langue triée » ou « la première devise publiée » donnerait une
    # fiche juste par accident, et fausse le jour où l'ordre change. pucatalog exige
    # donc ces deux clés dès qu'un `type: product` existe, et échoue au build sinon.
    #
    # ⚠ `devise_defaut` N'A PAS À ÊTRE OUVERTE. Le prix par défaut est une référence
    #   de conversion pour Google, pas une mise en vente : fermer la France ne doit
    #   pas rendre le catalogue invalide. Chaque produit doit en revanche porter un
    #   prix dans cette devise, sinon il n'y a rien à poser.
    langue_defaut: fr-FR
    devise_defaut: eur

    # --- Grille de prix par devise -------------------------------------------
    # Play exige un prix par pays. On les groupe par devise : un pays absent de
    # toute devise n'est simplement pas servi — aucune conversion automatique,
    # aucun tarif décidé par Google dans notre dos.
    #
    # ⚠ CE FICHIER EST LA SOURCE DE VÉRITÉ DU PRIX. Ce commentaire disait
    # auparavant que « les prix EUR viennent de revenus.md », ce qui confondait
    # deux choses : revenus.md porte le RAISONNEMENT qui a fixé 1,99 € — la
    # démographie des foyers, l'ancrage, le panier moyen — mais la VALEUR vit
    # ici, et nulle part ailleurs. C'est la seule qui porte les devises et les
    # pays, et la seule que Google applique réellement. Le modèle de revenus lit
    # ce fichier ; l'inverse serait un prix décidé dans de la prose.
    #
    # Les autres devises sont une conversion arrondie au palier psychologique
    # local (le .99), pas un taux de change appliqué à la virgule : 2,15 £ n'est
    # pas un prix, c'est un résultat de calcul.
    #
    # ⚠ CE BLOC GROUPE LES PAYS PAR DEVISE, et ne décide que d'une colonne de
    # prix. Le modèle de revenus, lui, raisonne en MARCHÉS (voir `revenus:` en
    # fin de fichier) — et les deux découpages ne coïncident pas : la France et
    # l'Allemagne partagent l'euro mais pas le marché. Ne pas dériver l'un de
    # l'autre.
    #
    # ⚠ HISTORIQUE. Ce bloc s'appelait `zones` jusqu'au 2026-08-26, renommé pour
    #   libérer le mot au profit d'un découpage juridique de premier niveau —
    #   lui-même supprimé le 2026-08-27 au profit du seul MARCHÉ. Le mot « zone »
    #   ne désigne donc plus rien dans ce fichier : chaque marché porte ses
    #   documents légaux et déclare son `cloud`, et c'est tout.
    #
    # ⚠ `coefficient` est le prix réel visé, en multiple du prix européen. Il ne
    #   pilote rien à l'exécution : la grille de `catalog` est ÉCRITE, pas
    #   convertie. Il sert à la régénérer et à contrôler qu'elle reste cohérente.
    # ⚠ `change` = unités locales pour 1 €. Sert à relire la grille en euros pour
    #   la projection de revenus, et à rien d'autre. `déclaré`, il vieillira.
    #
    # --- `publish` : ce qui part réellement chez Google ------------------------
    # ⚠ ABSENT VAUT FAUX. Une monnaie sans `publish` n'est vendue nulle part. Le
    #   défaut ferme, il n'ouvre pas : un pays qu'on a oublié de déclarer ne doit
    #   pas se retrouver en vente parce que personne n'a rien dit.
    #
    # ⚠ LE PRIX RESTE DÉCLARÉ QUAND LE MARCHÉ EST FERMÉ, et c'est tout l'intérêt.
    #   Les treize grilles ci-dessous sont arrêtées ; `publish` ne dit pas ce qu'on
    #   a décidé de vendre, il dit ce qu'on a décidé d'OUVRIR. Le modèle de revenus
    #   (bloc `revenus:`) continue de chiffrer les treize marchés — un marché fermé
    #   est du revenu daté, pas du revenu absent. Effacer le prix pour fermer le
    #   marché aurait perdu la valeur en même temps que la vente.
    #
    # Trois formes :  publish: true      toute la monnaie
    #                 publish: ["FR"]    ces pays seulement (ils doivent figurer
    #                                    dans `countries`, sinon ils n'ont pas de prix)
    #                 publish: false     aucun — identique à l'absence
    #
    # ⚠ DÉCISION DU 2026-08-27 : LA FRANCE SEULE. La première beta commence, et
    #   ouvrir vingt-quatre pays pour l'éprouver reviendrait à faire porter les
    #   premiers défauts à des clients qu'on ne peut ni prévenir ni rembourser
    #   facilement. Les douze autres monnaies sont tarifées et attendent : ouvrir
    #   un marché coûtera un mot ici, et le différentiel de `pucatalog` montrera
    #   exactement les pays qui s'ajoutent avant d'écrire quoi que ce soit.
    devises:
      eur:
        currency: EUR
        coefficient: 1.00
        change: 1.00
        # ⚠ La France seule, alors que la monnaie en porte vingt. Le prix est le
        #   même pour les vingt — c'est l'OUVERTURE qui est restreinte, pas le tarif.
        publish: ["FR"]
        countries: ["FR", "DE", "ES", "IT", "BE", "NL", "PT", "IE", "AT", "LU", "FI", "GR", "SK", "SI", "EE", "LV", "LT", "CY", "MT", "HR"]
      sek:
        currency: SEK
        coefficient: 1.20
        change: 11.40
        countries: ["SE"]
      dkk:
        currency: DKK
        coefficient: 1.25
        change: 7.46
        countries: ["DK"]
      nok:
        currency: NOK
        coefficient: 1.35
        change: 11.70
        countries: ["NO"]
      gbp:
        currency: GBP
        coefficient: 1.10
        change: 0.85
        countries: ["GB"]
      chf:
        currency: CHF
        coefficient: 1.50
        change: 0.94
        countries: ["CH"]
      usd:
        currency: USD
        coefficient: 1.35
        change: 1.08
        countries: ["US"]
      cad:
        currency: CAD
        coefficient: 1.05
        change: 1.47
        countries: ["CA"]
      aud:
        currency: AUD
        coefficient: 1.15
        change: 1.63
        countries: ["AU"]
      nzd:
        currency: NZD
        coefficient: 1.05
        change: 1.78
        countries: ["NZ"]
      brl:
        currency: BRL
        coefficient: 0.64
        change: 6.20
        countries: ["BR"]
      mxn:
        currency: MXN
        coefficient: 0.65
        change: 19.60
        countries: ["MX"]
      cop:
        currency: COP
        coefficient: 0.60
        change: 4650
        countries: ["CO"]
  catalog:

    # --- LES CINQ PALIERS ----------------------------------------------------
    # Ils ne se distinguent QUE par le nombre de joueurs. Aucun bénéfice de jeu
    # n'est réservé à un palier : le jeu est le même pour tous, on ne paie jamais
    # pour être plus fort — c'est ce qu'annoncent les CGU enfants comme la fiche
    # du store.
    #
    # Le palier 1.99 € avait été supprimé en juillet 2026 au profit d'une entrée à
    # 2.99 €, pour l'ancrage de prix. Il revient : la grille à cinq paliers ne se
    # règle plus sur un ancrage mais sur la TAILLE DU FOYER. Et ce n'est pas un cas
    # limite — les 1-2 joueurs sont ~40% des clans, soit le palier le plus souscrit.
    #
    # Les bornes suivent la démographie réelle des foyers (révision 2026-08-20), pas
    # une progression régulière : c'est pourquoi Clan s'arrête à 4 et Tribu à 7. Les
    # décaler d'un cran déplacerait des milliers de foyers d'un palier à l'autre.

    # 1 à 2 joueurs — parent seul et un enfant, ou un couple sans enfant joueur.
    # ~40% des clans : c'est le cas le PLUS fréquent, pas un cas marginal.
    ddust_essentiel:
      type: subscription
      # ⚠ Drapeau de BUILDER : `false` = `pucatalog` ne crée rien en console.
      #   Ce n'est pas une intention produit.
      enabled: true
      order: 1
      base_plans:
        - essentiel-monthly
        - essentiel-yearly
      offers:
        - essai-14j
        - fondateur
      label: "@@@T:store_essentiel@@@"
      description: "@@@T:store_essentiel_desc@@@"
      price_hint: "1.99 €"
      price_hint_yearly: "19.99 €"
      grants:
        shop: true
        max_players: 2
      play:
        listings:
          fr-FR:
            title: "Essentiel — jusqu'à 2 joueurs"
            description: "Une petite escouade : un adulte et son aventurier, ou deux compagnons."
          en-US:
            title: "Essential — up to 2 players"
            description: "A small squad: one adult and their adventurer, or two companions."
          es-ES:
            title: "Esencial — hasta 2 jugadores"
            description: "Una pequeña escuadra: un adulto y su aventurero, o dos compañeros."
        plans:
          essentiel-monthly:
            period: P1M
            # Part de la base payante sur ce plan : 40 % du palier x 75 %
            # de mensuelles. La répartition entre paliers (40/30/25/4/1) suit la
            # DÉMOGRAPHIE RÉELLE DES FOYERS, pas une progression régulière —
            # déplacer une borne déplacerait des milliers de foyers.
            part_base: 0.3000
            prices: { eur: "1.99", sek: "29", dkk: "19", nok: "29", gbp: "1.99", chf: "2.90", usd: "2.99", cad: "2.99", aud: "3.49", nzd: "3.49", brl: "7.90", mxn: "25.49", cop: "5900" }
          essentiel-yearly:
            period: P1Y
            # ⚠ PAYS-BAS FERMÉS SUR L'ANNUEL, et sur l'annuel seulement.
            #   La Wet van Dam (art. 6:236 sub j BW) autorise un premier engagement
            #   ferme d'un an, mais interdit qu'une reconduction tacite en impose un
            #   SECOND : passé la première échéance, le consommateur néerlandais doit
            #   pouvoir sortir à tout moment, avec un mois de préavis au maximum. Or
            #   résilier sur Play arrête la reconduction SUIVANTE sans faire sortir de
            #   la période en cours — l'année 2 est donc verrouillée. Et la clause est
            #   sur la LISTE NOIRE de l'art. 6:236 : nulle d'office, pas seulement
            #   contestable. Le mensuel ne pose aucun problème et reste ouvert.
            #
            #   ⚠ SANS AUCUN EFFET AUJOURD'HUI, et c'est le but : `eur.publish` ne
            #     porte que "FR", donc la ligne ne retire rien. Elle est posée
            #     MAINTENANT pour agir toute seule le jour où `euo` s'ouvrira — un
            #     commentaire s'oublie, une exclusion non. Les exclusions ne peuvent
            #     que fermer, jamais rouvrir (`pucatalog._base_plan_payload`), donc
            #     la poser d'avance ne peut rien casser.
            #
            #   Alternative écartée : servir l'annuel aux Pays-Bas en plan PRÉPAYÉ
            #   Play, qui ne se reconduit pas du tout — correct, mais c'est une
            #   seconde forme d'offre à maintenir pour un seul pays, alors que
            #   l'annuel n'est qu'une remise. Le Néerlandais garde le mensuel.
            pays_exclus: [NL]
            # Part de la base payante sur ce plan : 40 % du palier x 25 %
            # de souscriptions annuelles. La répartition entre paliers (40/30/25/4/1) suit la
            # DÉMOGRAPHIE RÉELLE DES FOYERS, pas une progression régulière —
            # déplacer une borne déplacerait des milliers de foyers.
            part_base: 0.1000
            prices: { eur: "19.99", sek: "275", dkk: "185", nok: "315", gbp: "18.49", chf: "28.00", usd: "28.99", cad: "30.99", aud: "37.49", nzd: "37.49", brl: "78.90", mxn: "254.49", cop: "55900" }


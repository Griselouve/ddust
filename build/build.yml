  canaux:
    # Un store par ligne, et non un taux unique : les commissions divergeront,
    # et adresser un marché exotique demandera d'en ajouter un — pas de refaire
    # le modèle.
    stores:
      play:
        libelle: Google Play
        # Taux RÉEL depuis 2022 : Play Media Experience, et tout développeur
        # sous 1 M$/an.
        commission: 0.15
        # ⚠ `actif` dit si le store est RÉELLEMENT OUVERT aujourd'hui. Un store
        # inactif garde ses cellules et son chiffre : la projection l'affiche
        # ENTRE PARENTHÈSES — l'argent qu'on ne capte pas est plus utile à voir
        # qu'un zéro, qui donnerait l'illusion que le marché n'existe pas.
        actif: true
      appstore:
        libelle: Apple App Store
        # Small Business Program (< 1 M$/an) : 15 %. Un abonnement de plus d'un
        # an y retombe de toute façon.
        # ⚠ IDENTIQUE À PLAY AUJOURD'HUI — cette ligne ne change aucun chiffre.
        #   Elle existe pour que le jour où l'un des deux bouge, ou qu'un
        #   troisième store apparaisse, il n'y ait rien à réécrire.
        commission: 0.15
        # ⚠ LE STORE S'OUVRE À LA LIVRAISON DE CE LIVRABLE, et la DATE vient du
        # kpi de roadmap.md — jamais d'ici.
        # ⚠ C'EST LE LOT DE PORTAGE DE CETTE APP, pas `deva/ios`. Le passage iOS
        # du framework rend le portage POSSIBLE ; il ne publie rien et n'ouvre
        # l'App Store à personne. Ce sont la fiche App Store Connect, le
        # catalogue recréé côté Apple et la revue qui font entrer les
        # utilisateurs — donc ce lot-ci, avec sa propre date.
        # Avant lui, les colonnes App Store sont entre parenthèses : revenu non
        # capté. Après, elles entrent dans le total.
        actif_depuis: '0f3ce68de9ba'
        # ⚠ MONTÉE EN CHARGE À L'OUVERTURE, en mois. Une app qui ouvre un second
        # store n'est PAS une app qui naît : sa notoriété, son bouche-à-oreille
        # et son catalogue sont déjà là, et sa communauté relaie l'arrivée.
        # Mais le classement App Store, les avis et l'historique ASO repartent
        # de zéro, et les utilisateurs Android ne migrent pas.
        # Trois mois pour atteindre le rythme d'acquisition de régime — contre
        # les quarante-huit d'un lancement à froid. `déclaré`, à mesurer au
        # premier portage.
        montee_mois: 3
    direct:
      # Stripe. C'est ce taux qui donnait le coefficient de 0,778.
      frais: 0.051

# =============================================================================
# ORDRE DE LIVRAISON DES LOTS
# =============================================================================
# ⚠ SOURCE DE L'ORDRE. Il n'existait jusqu'ici que par la position des clés dans
#   `revenus.lots` — un ordre réel mais non déclaré, donc invérifiable : ranger
#   ce bloc par ordre alphabétique aurait changé le modèle sans un mot.
#
# ⚠ CE QUE `prompt_roadmap.py` EN FAIT. La table `## livrables` de roadmap.md
#   porte l'ordre GLOBAL, tous projets confondus, et intercale délibérément les
#   projets entre eux — l'espacement est l'instrument de fidélisation. Mais elle
#   ne doit JAMAIS inverser deux lots d'un même projet : cette liste-ci fait foi
#   pour l'ordre interne, la roadmap décide seulement de ce qui s'intercale.
#
# ⚠ CE N'EST PAS UN CALENDRIER. Les dates viennent du kpi, jamais d'ici. Cette
#   liste dit dans quel ordre, pas quand — et `revenus.cadence` dit à quel
#   intervalle on voudrait les voir tomber.
# =============================================================================

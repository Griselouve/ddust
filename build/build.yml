      #   1. LE CATALOGUE DE MODÈLES DÉCIDE, pas la latence.
      #      `southamerica-east1` reçoit les modèles Vertex tard, quand il les
      #      reçoit. Un modèle plus ancien consomme PLUS de tokens pour la même
      #      qualité — on paierait donc davantage sur le marché où le panier est
      #      déjà décoté de 40 %. C'est le pire endroit où accepter une pénalité.
      #   2. LA LATENCE EST DU BRUIT. Une génération prend 2 à 4 secondes ;
      #      130 ms de réseau, c'est 4 % du trajet. Aucune app du portefeuille
      #      n'est temps réel — Prompt To Kill est co-présent mais tour par tour.
      #      (À vol d'oiseau, São Paulo serait plus près de Santiago, et les US
      #      plus près de Mexico : la latence ne départage même pas la zone.)
      #   3. UN TROISIÈME BACKEND COÛTE EN PERMANENCE — base Firestore, pile
      #      Pulumi, entrées de reset, surveillance — pour ~9 % du revenu. La
      #      ressource rare est le temps du soir.
      #   4. RIEN NE L'IMPOSE : la LGPD autorise le transfert international avec
      #      garanties, sans obligation de résidence brésilienne.
      #
      # ⚠ LA ZONE RESTE UNE ZONE À PART, volontairement. Elle garde ses parts,
      #   son panier décoté et ses propres valeurs d'inférence — même si celles-ci
      #   recopient aujourd'hui celles des États-Unis. Basculer sur São Paulo
      #   redevient alors UNE LIGNE à changer, et le modèle recalcule tout seul.
      #   Si le Brésil impose un jour la localisation, c'est le seul geste à faire.
      #
      # ⚠ C'EST LE MARCHÉ OÙ LE RATIO PROCEEDS / INFÉRENCE EST LE PLUS TENDU : le
      #   panier y est décoté de 40 %, le coût d'un token ne l'est pas. Servir
      #   depuis les US ne le sauve pas, ça évite de l'aggraver.
      datacenter: us-central1
      inference: 0.0000       # € par payant et par mois — recopié des
      #   États-Unis, puisque c'est le backend qui sert la zone.
      indice: 45
      confiance: 0.080
      stores:

        appstore:
          # iOS convertit ~1,6x mieux et retient ~15 % plus longtemps. C'est
          # l'écart connu entre les deux plateformes, et c'est lui qui fait que
          # l'App Store capte ~65 % de la dépense mondiale avec ~28 % du parc.
          # ⚠ AUCUN PROJET N'Y EST AUJOURD'HUI : ces lignes chiffrent ce que
          #   coûte cette absence. Poser son `acquisition` à 0 modélise le
          #   Play-only, et le manque à gagner se lit directement.
          # payants/mois — 6.00 % de l'acquisition du projet au plateau
          acquisition: { m1_3: 0.626, an4_5: 2.502 }
          conversion: 0.02400
          churn:
            fond: 0.06800
            precoce: 0.13600

        play:
          # Référence : les facteurs de marché s'appliquent sans correction.
          # payants/mois — 14.00 % de l'acquisition du projet au plateau
          acquisition: { m1_3: 1.460, an4_5: 5.839 }
          conversion: 0.01500
          churn:
            fond: 0.08000
            precoce: 0.16000


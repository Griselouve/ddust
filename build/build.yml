            prices: { eur: "2.99", sek: "39", dkk: "29", nok: "49", gbp: "2.99", chf: "4.00", usd: "4.49", cad: "4.49", aud: "5.49", nzd: "5.49", brl: "11.90", mxn: "37.99", cop: "7900" }

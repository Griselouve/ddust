# =============================================================================
# MODÈLE DE REVENUS — contrat de saisie du 2026-08-25
# =============================================================================
# Lu par docs/prompt_revenus.py. Référence : docs/build_yml.md § bloc revenus.
#
# TROIS SOURCES, JAMAIS DUPLIQUÉES :
#   - les PRIX viennent de store.catalog (une seule source, celle qui part chez
#     Google) ; revenus.md porte le RAISONNEMENT qui les a fixés, pas la valeur ;
#   - les DATES et les STORY POINTS viennent de roadmap.md ;
#   - ce bloc ne déclare que ce qui n'est ni un prix ni une date.
# Le reste est CALCULÉ : coefficient, indice de prix, téléchargements requis,
# courbe mensuelle, espérance, €/sp par lot.
#
# ⚠ Chaque valeur porte ci-dessous l'hypothèse qui l'a fixée. Une valeur dont on
#   a perdu le pourquoi ne se corrige plus : on la recopie.
# ⚠ Hors de store.layer.publish : le modèle économique ne voyage pas jusqu'aux
#   appareils.
# ⚠ On dit "marches" et non "regions" : le backend appelle déjà "regions" la
#   RÉSIDENCE DES DONNÉES. Un Brésilien appartient au marché "latam" mais ses
#   données vivent dans la région US. Confondre les deux mots finirait par
#   router quelqu'un sur le mauvais backend.
# ⚠ Noms interdits par dvidle : keys, get, set, values, mask, tojson, toyaml,
#   fromjson, fromyamlfile, toyamlfile, to_repr.
# =============================================================================









    # -------------------------------------------------------------------------
    # LES QUINZE PRODUITS À L'UNITÉ
    # -------------------------------------------------------------------------
    # ⚠ TRANSCRITS DE vision.md § Extensions le 2026-08-26. Ils y étaient nommés,
    #   tarifés et rattachés à leur lot ; le catalogue n'en portait que six,
    #   génériques, avec les thèmes au mauvais prix. Un catalogue générique ne
    #   permet ni de tarifer un produit seul, ni de relier une vente à ce qui la
    #   fabrique.
    # ⚠ Une extension s'applique à UN SEUL CLAN — celui avec lequel l'adulte est
    #   connecté à l'achat. S'il en possède plusieurs, un écran confirme lequel.
    # ⚠ `attachement_mensuel` est DÉRIVÉ : le revenu direct du lot, partagé entre
    #   ses produits, divisé par le prix et la base. `déclaré` jusqu'à la 1re vente.
    #
    # ⚠ LES QUINZE SONT `enabled: false`, ET AUCUN N'EST PRÊT À NE PLUS L'ÊTRE.
    #   Chacun porte un `lot:` — le livrable qui le fabrique — et aucun de ces onze
    #   lots n'est développé. Publier le produit avant son lot mettrait en vente du
    #   contenu qui n'existe pas : l'acheteur paierait un pack vide, et l'identifiant
    #   Play, lui, serait créé pour toujours. Le prix, les treize devises et les
    #   fiches sont donc arrêtés et relus D'AVANCE — c'est du travail fait, pas du
    #   travail en attente —, mais rien ne part chez Google.
    #
    #   ON REPASSE À `true` PRODUIT PAR PRODUIT, quand son lot est livré, et jamais
    #   en bloc. `pucatalog` valide alors sa fiche et sa grille avant la première
    #   écriture, et son différentiel montre exactement ce qui s'ajoute.


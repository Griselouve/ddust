  # ===========================================================================
  # CADENCE SOUHAITÉE — un VŒU, pas un engagement
  # ===========================================================================
  # ⚠ LA ROADMAP TRANCHE. Si la bande passante ne permet pas cet intervalle,
  #   elle l'allonge, et le modèle en subit la conséquence : PLUS D'ÉROSION,
  #   jamais moins de contenu. Ce bloc dit ce qu'on voudrait, le kpi dit ce
  #   qu'on peut, et le mode `check` mesure l'écart entre les deux.
  #
  # Repères, mesurés et non supposés :
  #   - les jeux en service qui livrent toutes les 4 à 6 SEMAINES ont une
  #     rétention J90 supérieure de 25 à 35 % à ceux qui sont sur 8 à 12
  #     semaines (Game Growth Advisor, LiveOps 2026) ;
  #   - J30-J60 est la fenêtre de décrochage sérieux, J60-J90 celle où la
  #     réactivation s'effondre (AppFollow 2026). Un intervalle de plus de trois
  #     mois fait traverser les deux ;
  #   - le DLC AAA classique tourne autour de trois mois, un an durant.
  # ===========================================================================
    hispam:
      # ⚠ SCINDÉ DE `latam` LE 2026-08-26. Le marché unique portait le Brésil, le
      #   Mexique et la Colombie sous une TVA de 20 % recopiée d'Europe — fausse
      #   pour les trois. Deux marchés parce que deux DROITS : le Brésil a son
      #   régime fiscal, son autorité, et surtout une loi de protection des
      #   mineurs en ligne sans équivalent européen. C'est le seul marché dont une
      #   app à mineurs pourrait devoir sortir seule, et il doit donc pouvoir
      #   se retirer d'une ligne.
      # ⚠ UN SEUL CORPUS POUR LE MEXIQUE ET LA COLOMBIE : une politique de
      #   confidentialité sait nommer les deux autorités dans le même document.
      #   C'est ce qui dispense de savoir où se trouve précisément l'utilisateur.
      # ⚠ CORRIGÉ LE 2026-08-28 : cette note disait « l'INAI pour les Mexicains ».
      #   L'INAI N'EXISTE PLUS — la réforme constitutionnelle de décembre 2024 l'a
      #   supprimé, et la nouvelle LFPDPPP (DOF du 20 mars 2025) a transféré la
      #   protection des données à la Secretaría Anticorrupción y Buen Gobierno.
      #   Le corpus `hispam` nomme donc la SIC en Colombie et la Secretaría au
      #   Mexique. Changement institutionnel récent : à revérifier avant publication.
      # ⚠ La Colombie exige de DÉMONTRER l'intérêt supérieur de l'enfant — une
      #   note d'analyse écrite, pas une expertise. À produire avant d'ouvrir.
      # ⚠ MEXIQUE + COLOMBIE. La Colombie n'est pas là pour son revenu — ~30 €/mois
      #   au plateau — mais pour son VIVIER DE TESTEURS hispanophones. Pour un
      #   développeur seul, une beta qui remonte de vrais retours vaut plus que
      #   la ligne de revenu qu'elle porte. Ne pas la juger sur ce tableau.
      # ⚠ Chili, Argentine, Pérou et le reste : ÉCARTÉS, pas oubliés. Le Chili
      #   attend ses textes d'application (loi 21.719, fin 2026) et un signal de
      #   traction hispanophone. Cuba, Venezuela, Nicaragua, Haïti, Salvador et
      #   Bolivie sont exclus par `store.pays_exclus`, avec leur motif.
      # ⚠ Datacenter, latence, catalogue de modèles : voir le marché `bresil`,

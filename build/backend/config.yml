               "nl":{"onboarding_empty":"Je kerker wacht op je, maar hij is nog leeg. Voeg in dertig seconden je eerste taak toe.",
                     "onboarding_idle":"De taken staan klaar, de kerker ook. Er ontbreekt alleen nog een eerste avonturier die erin duikt.",
                     "onboarding_alone":"Je kerker draait, maar je bent er alleen. De QR-code waarmee je familie binnenkomt, wacht op je in het tabblad Clan.",

             "buttons":{"fr":{"ok":"Valider","partial":"À moitié","ko":"Refuser"},
                        "en":{"ok":"Approve","partial":"Halfway","ko":"Reject"},
                        "es":{"ok":"Validar","partial":"A medias","ko":"Rechazar"},
                        "de":{"ok":"Bestätigen","partial":"Zur Hälfte","ko":"Ablehnen"},
                        "it":{"ok":"Convalida","partial":"A metà","ko":"Rifiuta"},
                        "pt":{"ok":"Validar","partial":"A meio","ko":"Recusar"},
                        "br":{"ok":"Validar","partial":"Pela metade","ko":"Recusar"},

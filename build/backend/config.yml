conf:
  # Publication du catalogue dans la Play Console. Le catalogue lui-meme n'est PAS
  # ici : il vit dans le build.yml de la suite, d'ou le builder le redistribue (c'est
  # la meme table qui nourrit l'app, le backend et Google). Ne restent ici que les
  # reglages de PUBLICATION.
  #
  # Le catalogue s'ecrit avec l'IDENTITE DE BUILD (compte de service master), pas avec
  # celle de l'app : `deva-store` tourne dans des Cloud Functions appelables, et lui
  # donner le droit de modifier ce qui est en vente mettrait les prix a portee d'une
  # faille dans une fonction exposee. Meme raisonnement que le compte `pulse`,
  # volontairement separe de `backend` plus bas.
  #
  # dry_run : affiche le plan complet — creations, modifications, desactivations —
  # sans rien ecrire. C'est le seul moment ou une faute de frappe se rattrape encore,
  # un identifiant Play cree ne se supprimant JAMAIS.
  #
  # ⚠ NE PAS TOUCHER CE CHAMP POUR UN SIMPLE ESSAI. Depuis le 2026-08-27, le mot-clef
  #   `dryrun` passe au builder force la simulation du catalogue :
  #
  #       python builder.py suite=ddust upload dryrun
  #
  #   Le mot-clef ne peut qu'AJOUTER de la prudence — il ne desactive jamais un
  #   dry_run demande ici. Editer ce champ pour un essai, c'est prendre le risque
  #   d'oublier de le remettre : le catalogue annoncerait alors ses changements a
  #   chaque build sans jamais en ecrire un seul, et rien ne le signalerait.
  #
  # Passe a false le 2026-08-21, plan relu. Les cinq identifiants d'abonnement et les
  # dix base plans existent desormais chez Google : les remettre a true ne les
  # effacerait pas, cela ne ferait que suspendre les mises a jour. Ce champ ne se
  # rebascule donc que pour SUSPENDRE durablement les mises a jour du catalogue —
  # pour relire l'effet d'un changement de grille, c'est le mot-clef qui sert.
  catalog:
    enabled: true
    dry_run: false

  project:
    billing_id: 01C0A1-9CF02B-DB8CA8
    name: Ddust
    display_name: "Donjons & Savons"
    org_id: "136817027313"
    project_id: dvddust
    user_email: asura@grisloup.com

    # Canal par lequel Google previent des CHANGEMENTS DE SOUS-TRAITANTS et des
    # incidents — deux notifications que le responsable de traitement doit recevoir
    # (art. 28 RGPD). Pose par puproject au deploiement
    # plutot qu'a la main en console : un contact manuel ne survivrait pas a une
    # recreation de projet, et son absence ne se remarque que le jour ou l'on
    # aurait du etre prevenu.
    # `email` omis volontairement : il retombe sur publisher.email (build.yml de la
    # suite), pour que l'adresse de contact n'existe qu'a un seul endroit.
    essential_contacts:
      - categories: [LEGAL]

  # `regions:` N'EST PLUS DECLARE ICI. Il vit dans le build.yml de la suite, sous
  # `build.targets.<cible>.regions`, et le builder l'ecrit dans le layer `conf` des
  # DEUX apps apres tous les ingests (_apply_target_conf).
  #
  # Motif : ce bloc decidait a lui seul quelle pile est deployee, et il etait
  # recopie a la main dans build/client/config/screens_meta.yml. Deux copies d'une
  # decision pareille, c'est deux occasions de deployer une region que le client ne
  # balaye pas, ou l'inverse. La cible est desormais la seule a le dire, et elle le
  # dit aux deux.
  #
  # ⚠ NE PAS LE REINTRODUIRE ICI. `_apply_target_conf` REMPLACE la clef (par `set`,
  #   pas par `mask`, qui fusionne en profondeur), mais une valeur ecrite ici
  #   resterait visible de tout ce qui relit la conf du projet avant l'assemblage
  #   des layers, et donnerait a croire qu'elle agit.
  apis:
    list:
      - iap.googleapis.com
      - cloudresourcemanager.googleapis.com
      - iam.googleapis.com
      - serviceusage.googleapis.com
      - firestore.googleapis.com
      - cloudfunctions.googleapis.com
      - run.googleapis.com
      - cloudbuild.googleapis.com
      - artifactregistry.googleapis.com
      - firebasestorage.googleapis.com
      # Verification des achats et lecture de l'etat canonique des abonnements
      # (purchases.subscriptionsv2.get). L'etat Play fait autorite : le client transmet un
      # purchaseToken, jamais un etat d'abonnement.
      - androidpublisher.googleapis.com
      # Reception des Real-time Developer Notifications de Play. Le topic doit vivre dans
      # ce projet et accorder la publication a
      # google-play-developer-notifications@system.gserviceaccount.com.
      - pubsub.googleapis.com
      # Balayage quotidien des timers de defaut de paiement (grace 10j, gel j50,
      # suppression j780) : ces echeances doivent tomber meme si plus personne n'ouvre l'app.
      - cloudscheduler.googleapis.com
      # Contacts essentiels (project.essential_contacts) : sans cette API, la ressource
      # echoue au deploiement. Le compte de service master doit aussi porter
      # essentialcontacts.admin.
      - essentialcontacts.googleapis.com
  oauth:
    enabled: true
    visibility: public
    desktop:
      enabled: true
      apps:
        - client
    android:
      enabled: true
      apps:
        - client
      # Deux clients OAuth Android coexistent, meme package, empreintes differentes :
      # Play re-signe l'AAB avec SA cle, le certificat de l'app installee depuis le
      # Store n'est donc pas celui du keystore local. Google resout le bon client cote
      # serveur d'apres le certificat reel de l'APK : l'app n'envoie jamais de
      # client_id Android, il n'y a rien a arbitrer cote Flutter.
      #   - empreinte de la cle d'upload : derivee du keystore, automatique
      #   - empreinte ci-dessous        : relevee dans la Play Console apres le
      #     premier upload (Test et release -> Integrite de l'app -> Certificat de la
      #     cle de signature de l'app). Definitive, generee une seule fois.
      # Tant qu'elle est vide, le second client n'est pas demande.
      # Empreinte RELEVEE SUR L'APK REELLEMENT DISTRIBUE, pas lue dans la console :
      #   adb shell pm path <package> ; adb pull <base.apk> ; apksigner verify --print-certs
      # La lecture de la console avait donne une autre valeur (EA:A0:...), qui ne
      # correspondait a aucune installation — d'ou une authentification Google qui
      # echouait depuis le Store alors que tout etait vert cote consoles.
      play_sha1s:
        client: "33:1E:56:BC:46:5D:D4:5A:EE:B1:B9:A5:9E:4E:DA:C4:55:35:7F:3F"
    # Session anonyme : le joueur choisit son royaume, declare son age et accepte les CGU
    # AVANT que Firebase Auth ne detienne son email, son nom et sa photo. Le compte Google
    # est lie en fin de parcours (linkWithCredential conserve le meme UID). Sans ce bloc,
    # signInAnonymously repond ADMIN_ONLY_OPERATION.
    # autodelete : purge native des comptes anonymes inactifs 30+ jours.
    anonymous:
      enabled: true
      autodelete: true
  firebase:
    enabled: true
    android_package: com.grisloup.ddust_client
  firestore:
    databases:
      sessions:
        isolation: strict
        collections:
          # Traces de connexion écrites par dvcloud (cloud.auth.sessions) : un
          # document par utilisateur, doc-id = uid Firebase. Le TTL porte sur le champ
          # `expiration` (nom imposé par pufirestore) et fait la conservation limitée
          # exigée par le RGPD sur ces données.
          #
          # Aucune clé `isolation`/`rule` ici : la règle globale `strict` de la base
          # reste générée (cf. pufirestore/brick.py, has_collection_isolation).
          sessions:
            ttl: true
      secrets:
        isolation: strict
      workers:
        isolation: strict
        # LE VERROU DE MISE À JOUR D'UN CLAN (dvautover). La fonction `ddust_autover` pose
        # `locked_until` sur le doc clan le temps d'appliquer les étapes : tant qu'il est
        # dans le futur, AUCUNE écriture client ne passe sur les données du clan. C'est la
        # seule garantie qui ne dépende d'aucune application.
        #
        # ⚠ UN CLAN ABSENT N'EST PAS VERROUILLÉ. Un batch qui supprime le clan puis ses
        #   tâches (worker_session._deleteSession) évalue les tâches APRÈS la suppression :
        #   sans `!exists`, le `get` échouerait et le batch serait refusé.
        # ⚠ UN SECOND GET PAR ÉCRITURE (userindexes + clans). Firestore met en cache les
        #   accès au même document dans une requête : un batch sur UN clan n'en coûte que
        #   deux, loin de la limite de 20.
        functions: |
          function clanUnlocked(clanId) {
            let p = /databases/{database}/documents/clans/$(clanId);
            return !exists(p) || get(p).data.get('locked_until', timestamp.value(0)) < request.time;
          }
        collections:
          users:
            rule: |
              allow list: if false;
              allow create: if request.auth != null
                && request.auth.uid == request.resource.data.ownerId
                && docId == request.resource.data.userId;
              allow get: if request.auth != null
                && (resource == null || (request.auth.uid == resource.data.ownerId && docId == resource.data.userId));
              allow update, delete: if request.auth != null
                && request.auth.uid == resource.data.ownerId
                && docId == resource.data.userId;
          # userindexes/{firebaseUid} : table UID→userId ET coffre des clanSecret lus par
          # les règles des collections de clan (via get(), accès privilégié non soumis aux
          # règles — ce verrouillage ne les affecte donc pas). Règle explicite plutôt que
          # `isolation: strict` : le get généré par strict (`request.auth != null`) laissait
          # n'importe quel utilisateur authentifié lire les clanSecret d'autrui à partir de
          # son UID — or tout le modèle de sécurité clan repose sur le secret de ce champ.
          # Chacun ne lit/écrit QUE son propre index (docId == uid).
          userindexes:
            rule: |
              allow list: if false;
              allow get: if request.auth != null && request.auth.uid == docId;
              allow create: if request.auth != null && request.auth.uid == docId
                && request.resource.data.ownerId == request.auth.uid;
              allow update, delete: if request.auth != null && request.auth.uid == docId;
          # guardianship/{childId} : la REPRÉSENTATION d'un enfant (multiclan). Qui est son
          # représentant (`guardian_id`), ses co-représentants, les clans qu'il fréquente, les
          # autorisations d'y entrer et les gestes des représentants (consentement, majorité),
          # tracés dans `history`. Protégé COMME UN CLAN, par un secret : `ownerId` est le
          # secret de représentation, rangé dans l'index de chaque détenteur (l'enfant, son
          # représentant, ses co-représentants) sous `guardianships.{childId}.secret`. Même
          # forme de règle que les clans, donc aucun uid dans le document, et un représentant
          # d'une autre région y a accès par son index de CETTE région.
          # ⚠ JAMAIS SUPPRIMÉ PAR UN CLIENT : c'est une preuve (5 ans), seul delete_user_data
          #   l'efface à terme. Et plus aucune écriture client dès la majorité (`closed_at`).
          guardianship:
            rule: |
              allow list: if false;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.guardianships[docId].secret == request.resource.data.ownerId;
              allow get: if request.auth != null
                && (resource == null
                    || get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.guardianships[docId].secret == resource.data.ownerId);
              allow update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.guardianships[docId].secret == resource.data.ownerId
                && request.resource.data.ownerId == resource.data.ownerId
                && resource.data.get('closed_at', '') == '';
              allow delete: if false;
          # guardian_drops/{dropId} : la BOÎTE DE DÉPÔT d'un candidat co-représentant (multiclan).
          # Le candidat tire un identifiant (uuid) et une clef, les montre au représentant (QR
          # code, ou lien + code à distance) ; le représentant y dépose le secret de
          # représentation CHIFFRÉ par cette clef (sealInvite) ; le candidat le relit, puis
          # efface la boîte. L'identifiant ne se devine pas et le contenu est illisible sans la
          # clef : tout compte connecté peut créer, lire ou effacer, personne ne peut lister ni
          # réécrire. TTL sur `expiration` : une boîte oubliée disparaît seule.
          guardian_drops:
            ttl: true
            rule: |
              allow list, update: if false;
              allow get, create, delete: if request.auth != null;
          # Liste d'attente beta saisie sur le site vitrine (bouton « S'inscrire aux betas »
          # des pages accueil/concept/roadmap). Écrite UNIQUEMENT par la fonction beta_signup,
          # qui passe par l'admin SDK et ignore donc ces règles : le client n'y a aucun accès,
          # ni en lecture (la liste d'emails est une donnée personnelle) ni en écriture.
          # NB : volontairement ABSENTE de la liste de reset (build/build.yml, ancre
          # &worker_collections) — un reset de développement effacerait des prospects, qui ne
          # sont pas des données de jeu.
          beta_signups:
            rule: |
              allow read, write: if false;
          # ⚠ `locked_until` ET `data_version` N'APPARTIENENT PAS AU CLIENT. Le premier est le
          #   verrou de la fonction `ddust_autover` ; le second dit quelles étapes le clan a
          #   subies. Un client ne peut donc NI poser `locked_until` NI le modifier, et ne
          #   pose `data_version` qu'à la création ou tant qu'il est absent (clan né avant
          #   dvautover). Les réécritures de document complet (read-modify-write) restent
          #   acceptées : elles renvoient les deux champs à l'identique.
          clans:
            rule: |
              allow list: if false;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == request.resource.data.ownerId
                && !('locked_until' in request.resource.data);
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId;
              allow update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId
                && resource.data.get('locked_until', timestamp.value(0)) < request.time
                && request.resource.data.get('locked_until', null) == resource.data.get('locked_until', null)
                && (resource.data.get('data_version', null) == null
                    || request.resource.data.get('data_version', null) == resource.data.get('data_version', null));
              allow delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId
                && resource.data.get('locked_until', timestamp.value(0)) < request.time;
          clans_tasks:
            rule: |
              allow list: if false;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(docId);
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId;
              allow update, delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId
                && clanUnlocked(docId);
          clans_tasks/{clanId}/tasks:
            # Index composite pour `pulse_sweeper` : les taches en attente de verdict depuis
            # plus de deux jours (status == "validating" ET last < seuil). Portee COLLECTION,
            # donc valable pour la sous-collection `tasks` de tous les clans.
            indexes:
              - fields:
                  - field: status
                  - field: last
            rule: |
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow create, update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId
                && clanUnlocked(clanId);
          clans_tasks/{clanId}/domains:
            rule: |
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow create, update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId
                && clanUnlocked(clanId);
          clans_items:
            rule: |
              allow list: if false;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(docId);
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId;
              allow update, delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId
                && clanUnlocked(docId);
          clans_items/{clanId}/items:
            rule: |
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow create, update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId
                && clanUnlocked(clanId);
          clans_logs:
            rule: |
              allow list, get, create, update, delete: if false;
          clans_logs/{clanId}/logs:
            rule: |
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow update, delete: if false;
          # Historique des ouvertures du butin : une ligne par coffre ouvert (montant du
          # portefeuille, or, valeur des objets, nombre de joueurs, part du meilleur
          # contributeur). Append-only comme clans_logs : create seul, jamais update ni delete —
          # un historique qu'on peut réécrire ne vaut rien.
          # Le `list` est ouvert à tout membre du clan, comme celui de clans_items/{clanId}/items
          # (le filtrage métier est fait côté client). Les lignes ne portent que des agrégats
          # chiffrés, jamais un nom d'objet ni un identifiant de joueur : le contenu du coffre
          # reste une surprise.
          clans_chest_history:
            rule: |
              allow list, get, create, update, delete: if false;
          clans_chest_history/{clanId}/history:
            rule: |
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow create: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow update, delete: if false;
          clans_players/{clanId}/players:
            # `last_connected` (pose au login, cf. worker_clan._writeClanPlayer) est la SEULE
            # trace de vie d'un clan lisible sans ouvrir l'app. Le balayeur de relance
            # (`pulse_sweeper`) l'interroge en collectionGroup sur TOUS les clans a la fois,
            # borne des deux cotes : au-dela de 30 jours on considere le joueur parti et on
            # cesse de le relire — c'est le garde-fou « arret definitif », obtenu par la
            # requete plutot que par un compteur d'etat.
            # Index de GROUPE indispensable : les index automatiques de Firestore sont a
            # portee collection, un collectionGroup borne sur ce champ echoue sans lui.
            indexes:
              - query_scope: COLLECTION_GROUP
                fields:
                  - field: last_connected
            rule: |
              allow get: if request.auth != null
                && (resource == null
                    || get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId);
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow create, update: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == request.resource.data.ownerId
                && clanUnlocked(clanId);
              allow delete: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId
                && clanUnlocked(clanId);
          # Ce dont LE CLAN bénéficie : doc-id = clanId. C'est la PROJECTION métier des
          # achats, pas le registre des achats eux-mêmes — celui-là est personnel et vit
          # dans la base dédiée `store` (module pustore), rangé par compte payeur.
          #
          # La séparation n'est pas cosmétique, elle porte tout le modèle :
          #   - ACHETER est personnel. Un admin engage SON compte Google et SA carte pour
          #     l'abonnement ; un autre admin peut payer un pack avec le sien. Chaque achat
          #     reste attaché à son payeur (remboursement, litige, résiliation le suivent).
          #   - BÉNÉFICIER est collectif. Tout membre du clan lit ce document : le pack de
          #     thème acheté par un adulte habille l'écran de tous les enfants, sans que
          #     personne d'autre n'ait rien à acheter ni même à savoir qui a payé.
          # Un enfant n'achète jamais rien (contrôle côté app : administrateur + porte
          # parentale) mais gagne tout.
          #
          # L'entitlement ne peut PAS vivre dans `clans/{clanId}` : cette collection est
          # modifiable par tout membre détenant le clanSecret, donc un champ `tier` y serait
          # falsifiable depuis un client modifié. D'où une collection à part, en LECTURE
          # SEULE pour tout le monde — seul le SDK Admin (Cloud Functions, non soumis aux
          # règles) écrit ici, à partir de ce que dit l'API Google Play.
          #
          # Le `get` suit le motif habituel `== resource.data.ownerId` plutôt qu'un simple
          # `!= null` : les fonctions recopient le clanSecret du doc de clan dans `ownerId`,
          # ce qui exige du lecteur qu'il connaisse le secret de CE clan et pas seulement
          # qu'il soit membre d'un clan quelconque.
          #
          # Champs : tier (l'identifiant PRODUIT tel quel — `ddust_essentiel`, `ddust_clan`,
          # `ddust_tribu`, `ddust_guilde`, `ddust_royaume`, ou vide ; `store_verify` y recopie
          # `productId` sans le traduire, de sorte qu'ouvrir un palier au catalogue ne demande
          # aucun redéploiement backend), state (trial|active|grace|hold|locked),
          # products (map produit → {order_id, purchased_at, payer} pour les achats à
          # l'unité), expiry, auto_renewing, founder, credit_months (parrainage + offre
          # fondateurs, même moteur), credit_active + credit_until (mois offert EN COURS :
          # le clan est actif sans rien payer, et c'est ce couple qui le fait balayer par
          # le sweeper — sans lui, un clan crédité mais jamais abonné resterait invisible),
          # default_since, locked_at, purge_due, purged_at (horodatage de la dissolution
          # par clan_purge), test, last_rtdn_at, updated_at. Pas de purchase_token ici :
          # un jeton d'achat est une donnée personnelle du payeur, il reste dans la
          # base `store`.
          #
          # ⚠ UN CLAN QUI N'A JAMAIS RIEN PAYÉ N'A PAS DE DOCUMENT ICI. `resource` vaut alors
          #   null, `resource.data.ownerId` lève, et la règle refusait : la vigilance de
          #   dvstore journalisait un 403 à chaque sondage, pour un joueur parfaitement
          #   connecté et membre de son clan. Sur un document absent, on exige donc
          #   seulement d'être membre de CE clan : il n'y a rien à lire, la réponse est
          #   un « introuvable » propre au lieu d'un refus.
          clans_store:
            rule: |
              allow list: if false;
              allow get: if request.auth != null
                && ((resource == null
                     && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret != null)
                 || (resource != null
                     && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId));
              allow create, update, delete: if false;
          # Journal de facturation du clan : une ligne par événement Play (achat,
          # renouvellement, défaut, reprise, résiliation) et par octroi de crédit.
          # Append-only comme clans_logs et clans_chest_history, mais plus strict encore :
          # même le `create` est fermé au client. C'est la piste d'audit qui justifie l'état
          # courant du clan en cas de litige — elle ne vaut rien si un client peut y écrire.
          clans_store/{clanId}/events:
            rule: |
              allow list: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret != null;
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[clanId].clanSecret == resource.data.ownerId;
              allow create, update, delete: if false;
          # État de relance d'engagement du clan : doc-id = clanId. Écrit UNIQUEMENT par
          # `pulse_sweeper` (SDK Admin, non soumis aux règles), en LECTURE SEULE pour tout
          # le monde — même modèle que `clans_store`, et pour la même raison : un client
          # capable de réécrire son propre état de relance pourrait aussi bien s'en
          # exempter, ou pire, se le réarmer en boucle.
          #
          # Les marqueurs PAR MEMBRE (`members.<userId>`) vivent ici et pas sur le doc
          # `clans_players` correspondant, alors que ce serait leur place naturelle :
          # plusieurs écritures du client sur le doc membre sont des PATCH de document
          # COMPLET (même motif que _validateTask). Un champ serveur posé là serait effacé
          # au prochain login du joueur, et la relance repartirait de zéro indéfiniment.
          #
          # Champs : last_seen (max des clans_players.last_connected, calculé au balayage —
          # aucune écriture client, aucune migration), adult_stage + adult_at (cadence de la
          # piste chef), boss_at + boss_task (dernier boss convoqué par le serveur),
          # members.<userId>.{comeback_stage, comeback_at}, muted, updated_at.
          clans_pulse:
            rule: |
              allow list: if false;
              allow get: if request.auth != null
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[docId].clanSecret == resource.data.ownerId;
              allow create, update, delete: if false;
          # Invitation ouverte par un chef : doc-id = lobbyId (généré par le chef lui-même,
          # AVANT `virtuallobby.create_management`). Champs : ownerId (UID Firebase du chef
          # qui invite), clanId, ack (la déclaration scellée), kind, created_at, expires_at
          # (72 h, comme le lobby), published_at (posé quand le secret a été publié au
          # candidat), expiration (cf. TTL ci-dessous).
          #
          # POURQUOI UN DOCUMENT À PART. Un enregistrement de lobby `virtuallobby` peut être
          # créé et accepté par N'IMPORTE QUEL compte connecté qui connaît l'identifiant du
          # clan, et cet identifiant figure dans chaque QR code. La reprise des invitations
          # au redémarrage du chef ne publie donc le secret du clan que pour un lobby qui a
          # SON document ici, écrit par un chef : c'est ce document, et non l'enregistrement
          # de lobby, qui prouve qu'une invitation a réellement été ouverte.
          #
          # Règle explicite plutôt que `isolation: strict` nue, et pour la même raison que
          # `userindexes` : le `get` généré par strict (`request.auth != null`) laisserait
          # n'importe quel compte connecté lire la déclaration scellée d'autrui à partir du
          # seul lobbyId. On garde l'ÉCRITURE de strict (ownerId == UID de l'auteur, seul
          # l'auteur modifie ou supprime), et on resserre la LECTURE à l'auteur et aux
          # membres du clan visé (un second chef doit pouvoir reprendre l'invitation).
          #
          # ⚠ UN SECOND CHEF LIT, IL N'ÉCRIT PAS. S'il publie à la reprise, son écriture de
          #   `published_at` est refusée : la publication suivante se rejouera, ce qui est
          #   sans conséquence (le secret est réécrit à l'identique).
          #
          # ⚠ LE TTL PORTE SUR `expiration`, PAS SUR `expires_at`. pufirestore fige le nom
          #   du champ TTL (cf. pufirestore/brick.py), et Firestore n'efface que sur un
          #   champ de type TIMESTAMP. Le client doit donc écrire `expiration` (un DateTime,
          #   que dvcloud sérialise en timestamp) au même instant que `expires_at` (chaîne
          #   ISO, que le code relit). Sans lui, la politique serait posée et n'effacerait
          #   rien, sans que rien ne le signale.
          clans_invites:
            ttl: true
            rule: |
              allow list: if request.auth != null && resource.data.ownerId == request.auth.uid;
              allow get: if request.auth != null
                && (resource == null
                    || resource.data.ownerId == request.auth.uid
                    || get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[resource.data.clanId].clanSecret != null);
              allow create: if request.auth != null
                && request.resource.data.ownerId == request.auth.uid
                && get(/databases/{database}/documents/userindexes/$(request.auth.uid)).data.clans[request.resource.data.clanId].clanSecret != null
                && clanUnlocked(request.resource.data.clanId);
              allow update: if request.auth != null
                && resource.data.ownerId == request.auth.uid
                && request.resource.data.ownerId == request.auth.uid
                && request.resource.data.clanId == resource.data.clanId
                && clanUnlocked(resource.data.clanId);
              allow delete: if request.auth != null && resource.data.ownerId == request.auth.uid;

  svcaccounts:
    enabled: true
    accounts:
      backend:
        name: ddust-backend
        display_name: "Ddust Backend SA"
        roles:
          - roles/datastore.user
          - roles/logging.logWriter
      # Balayeur de relance d'engagement. Compte SÉPARÉ de `backend`, qui n'a ni FCM ni
      # invoker : lui accorder les deux pour une seule fonction élargirait les droits de
      # toutes les autres (delete_user_data, clan_purge — les deux qui suppriment des
      # données). Un compte de plus coûte zéro, un compte trop puissant coûte le jour où
      # il sert à autre chose que ce pour quoi on l'a élargi.
      pulse:
        name: ddust-pulse
        display_name: "Ddust Pulse SA"
        roles:
          # datastore.user : lire les signaux de décrochage, écrire clans_pulse, poser le
          #                  `recommended` du boss et sa ligne de journal.
          # firebase.admin : envoyer les relances par FCM (le balayage n'a pas de jeton
          #                  utilisateur, il ne peut donc pas passer par la fonction
          #                  `messaging` — cf. le helper notify() de pustore).
          #                  Aussi : effacer le compte Firebase Auth d'un compte
          #                  jamais admis dans un clan (piste ORPHELINS de
          #                  `pulse_sweeper`, getAuth().deleteUser) ; firebase.admin
          #                  porte firebaseauth.users.delete, rien à ajouter.
          # run.invoker    : Cloud Scheduler l'appelle en OIDC sous cette identité.
          - roles/datastore.user
          - roles/firebase.admin
          - roles/run.invoker
          - roles/logging.logWriter

  documents:
    enabled: true
    documents:
      - cgu
      - privacy
    legal_states:
      - a
      - k
    # /!\ `regions` N'EST PAS DECLARE ICI. La liste des regions ouvertes vit dans
    #     documents.regions du build.yml de la suite, d'ou le builder la redistribue
    #     au backend ET au client. Une valeur qui doit etre la meme des deux cotes
    #     n'a de sens que si personne ne peut la redefinir localement -- c'est tout
    #     l'interet de l'avoir remontee au projet.
    #
    # /!\ UNE REGION EST UN MARCHE. Elle decide des documents legaux applicables et
    #     rien d'autre ; le datacenter en est deduit par le catalogue de pudocuments.
    #     `fr` et `euo` vivent tous deux dans le cloud `eu`, donc un seul bucket de
    #     documents pour les deux.
    default_region: fr
    default_language: en
    # Ou le builder va chercher le corpus, relativement a la racine de la suite.
    # Sans cette cle, le controle de completude n'a lieu qu'au `pulumi up` -- trop
    # tard pour epargner un APK construit avec un marche sans documents.
    corpus_dir: legal/documents
    # Declaratif ici : pudocuments se contente de les tracer au deploiement. La conf
    # qui OPERE est celle du client, et les valeurs par defaut vivent desormais dans
    # le `regions_catalog` de dvdocuments -- ce bloc n'est plus qu'une surcharge.
    #
    # Un SEUL seuil opere : 18 ans, l'age de la majorite contractuelle. Tout mineur,
    # quel que soit son age, releve du consentement de son responsable legal : ddust
    # n'exploite jamais le consentement propre du mineur que l'article 8 du RGPD
    # autorise a partir de 13-16 ans selon l'Etat membre. COPPA (moins de 13 ans aux
    # Etats-Unis) est porte par la redaction des documents us-*, pas par un palier ici.
    # Le seuil bas reste declare a 0 : la cle `k` doit exister, car dvdocuments
    # initialise l'etat legal a la cle du plus petit seuil (_computeLegalState). La
    # supprimer ferait basculer le defaut sur `a` et rendrait adulte un enfant de cinq
    # ans.
    age_thresholds:
      fr:
        k: 0
        a: 18

  hosting:
    enabled: true
    # Page web de suppression de compte (exigence Play Store) servie sur https://donjons.grisloup.com.
    # site + directory prennent les defauts du module (project_id, "web").
    # custom_domain : donjons.grisloup.com est LE domaine public du site vitrine — c'est lui qui est
    # ecrit dans les documents legaux, la fiche Play Console et le partage social. Le domaine
    # d'origine dvddust.web.app reste servi par Firebase (meme site) et fait donc office d'alias
    # historique : les anciens liens ne cassent pas. Cablage manuel (DNS + Firebase) via la
    # checklist affichee par deploy_hosting a l'upload (cf. deva/pulumi/modules/puhosting/readme.md).
    custom_domain: "donjons.grisloup.com"
    rewrites:
      - glob: "/api/delete"
        function: delete_user_data
      # Inscription a la liste beta depuis le site vitrine. puhosting genere trois entrees
      # a partir de celle-ci : /api/beta/eu, /api/beta/us et le glob nu /api/beta -> premiere
      # region (eu). site.js appelle le glob NU, donc une seule region : la liste d'emails
      # doit rester dans une seule table, pas etre coupee en deux moities a recoller.
      - glob: "/api/beta"
        function: beta_signup

    # ⚠ SANS CE BLOC, UNE PUBLICATION MET UNE HEURE A ETRE VISIBLE, ET PEUT CASSER LE SITE.
    # Firebase pose `Cache-Control: max-age=3600` sur tout ce qu'il sert. Constate le
    # 2026-09-15 : apres le remplacement des captures du site, le navigateur a garde l'ANCIENNE
    # page presse, qui pointait les anciennes images deja supprimees du serveur, et l'ancien
    # zip : images cassees et telechargement « non disponible », alors que le site en ligne
    # etait correct.
    #
    # Les PAGES, la feuille de style et le script revalident donc a chaque visite. `no-cache`
    # ne veut pas dire « ne garde rien » mais « redemande avant de servir » : avec l'ETag que
    # Firebase envoie deja, c'est un 304 vide, quelques octets. (Contrairement a grisloup.com,
    # site.css et site.js n'ont pas d'empreinte dans leur URL : ils ne peuvent pas etre gardes
    # longtemps.) Les images gardent l'heure par defaut : une capture remplacee sous le meme
    # nom se voit au plus une heure en retard, sans rien casser.
    headers:
      - glob: "**/*.html"
        values:
          Cache-Control: "no-cache"
      - glob: "/assets/site.css"
        values:
          Cache-Control: "no-cache"
      - glob: "/assets/site.js"
        values:
          Cache-Control: "no-cache"
      # La police hebergee (Cinzel) : sa VERSION est dans le nom du fichier
      # (`cinzel-v26-latin.woff2`). Une nouvelle version = un nouveau nom, donc le cache
      # long ne peut jamais servir un fichier perime.
      - glob: "/assets/fonts/*.woff2"
        values:
          Cache-Control: "public, max-age=31536000, immutable"

  storage:
    enabled: true
    buckets:
      # LE SEUL BUCKET PUBLIC DU JEU, et il faut que ça reste vrai. Il porte la vague
      # `ante` : le décor des tout premiers écrans, servi SANS jeton à quelqu'un qui
      # n'a encore rien déclaré — ni royaume, ni âge, ni compte. À cet instant
      # l'application n'a aucune session, donc aucun moyen de lire le bucket d'assets,
      # qui exige une authentification.
      #
      # ⚠ N'Y METTRE QUE DU DÉCOR. Tout ce qui atterrit ici est lisible par n'importe
      #   qui, pour toujours : une image, un son, une voix de narration. Jamais un
      #   document légal versionné (ils ont leur propre bucket et leur propre index),
      #   jamais rien qui concerne un joueur.
      # ⚠ IL N'EXPOSE PAS LE JEU. C'est précisément pourquoi il existe : ouvrir le
      #   bucket `assets` en lecture publique aurait exposé ses 550 Mo pour en servir
      #   les trente premiers.
      # LES BINAIRES DE TEST, lus par le builder SEUL, jamais par l'application.
      #
      # Chaque `make-apk` y depose l'APK et en signe une URL de trois heures, envoyee
      # sur le canal Telegram du developpeur (cf. python/modules/dvtelegram). Le
      # builder ne garde que les cinq derniers ; la peremption ci-dessous est le
      # filet, pas la regle de menage.
      #
      # ⚠ `firebase: false` : ce bucket n'a rien a faire dans Firebase Storage. La
      #   liaison lui imposerait des regles de securite, une release de ruleset et une
      #   dependance a `firebasestorage.googleapis.com` pour un contenu auquel seul le
      #   builder accede, par URL signee.
      # ⚠ JAMAIS PUBLIC : un APK telechargeable par tous, c'est une version de test
      #   qui circule hors du Store, sans mise a jour et sans Play Protect.
      apk:
        public_read: false
        firebase: false
        force_destroy: true
        lifecycle_days: 30

      preload:
        public_read: true
        force_destroy: true
      assets:
        public_read: false
        # Intégralement reconstruit par la phase `upload` depuis general/ et donjon/ :
        # sa destruction ne coûte qu'un re-téléversement. Sans ce drapeau, fermer une
        # région cloud fait échouer le `pulumi up` sur un bucket plein — GCS refuse —
        # et il faut aller le vider à la main avant de pouvoir relancer.
        # ⚠ Ne prend effet qu'au déploiement SUIVANT : Pulumi lit l'option dans le
        #   programme, donc un bucket déjà sorti de la conf ne la verra jamais.
        force_destroy: true


  # Vague `ante` : le sous-ensemble des assets republie dans le bucket PUBLIC.
  # La liste elle-meme n'est pas ici — elle vit dans le layer du client
  # (`assets.ante` de general/layers/assets-global.yml), qui est deja la source de
  # toutes les autres vagues. Deux listes a tenir, c'est une liste qui divergera, et
  # le symptome serait un decor qui manque sans que rien ne le signale.
  preload:
    enabled: true
    bucket: "preload"
    wave_layer: "general/layers/assets-global.yml"
    probe: "ante.txt"
    # Les langues a publier pour un nom qui porte @@@lang@@@. Celles de l'app, pas
    # celles des marches : le client choisit sa langue AVANT son royaume.
    langs: ["fr", "en", "es", "de", "it", "pt", "br", "nl"]

  assets:
    enabled: true
    bucket: "assets"
    # Une racine par jeu d'assets. "general" porte ce qui ne dépend d'aucun thème
    # (structure des tâches, arbre de décision, prompts) ; "donjon" porte la saveur
    # (images, sons, musiques, vidéos, traductions et layers de thème).
    directories:
      - "general"
      - "donjon"
    # Un assets.yml par racine : le client ne charge que les thèmes qu'il utilise.
    # Un thème absent d'ici n'est ni indexé ni purgé — ajouter une racine ne met
    # jamais en danger les fichiers d'un thème livré séparément.
    manifests:
      - "general"
      - "donjon"
    pointers:
      general/prompts/prompts.yml: "general/prompts/prompts_General_V1.yml"
      donjon/images/splash-pirate.png: "donjon/images/splashs/pirates/splash.png"
      donjon/music/ambiant1.mp3: "donjon/music/Ambiant1_General_V1.mp3"
      donjon/music/ambiant2.mp3: "donjon/music/Ambiant2_General_V1.mp3"
      donjon/music/ambiant3.mp3: "donjon/music/Ambiant3_General_V1.mp3"
      donjon/music/ambiant4.mp3: "donjon/music/Ambiant4_General_V1.mp3"
      donjon/music/ambiant_dead.mp3: "donjon/music/AmbiantDead_General_V1.mp3"
      donjon/music/win.mp3: "donjon/music/Win_General_V1.mp3"
      donjon/music/fairy.mp3: "donjon/music/Fairy_General_V1.mp3"

  aimodel:
    enabled: true
    # ⚠ 2.5 RETIRE PAR GOOGLE (Flash-Lite coupe le 28/01/2027, Pro le 31/03/2027).
    #   Bascule sur 3.5 Flash-Lite le 2026-09-15, en test. 2.5 Flash-Lite reste
    #   autorise pour revenir en arriere cote client sans redeployer le backend.
    default_model: gemini-3.5-flash-lite
    models:
      - gemini-3.5-flash-lite
      - gemini-2.5-flash-lite
    # Une liste PAR RÉGION : le texte envoyé au modèle est saisi par l'utilisateur
    # (nom d'enfant, description de tâche), il doit être traité dans sa propre région.
    # Une liste unique enverrait les joueurs américains vers un modèle européen.
    #
    # EU : découplé de regions.EU.backend (europe-west9, petite région à faible
    # capacité Gemini, d'où les 429 « Resource exhausted » dès deux joueurs
    # simultanés). Les deux valeurs restent dans l'UE : « eu » est la
    # multi-région européenne (Google route vers le centre de données qui a de la
    # capacité), « europe-west4 » sert de repli sûr si la passerelle Firebase
    # n'accepte pas la forme multi-région.
    #
    # US : us-central1 est la région de référence Gemini (catalogue complet, forte
    # capacité), « us » est la multi-région américaine et sert de repli. Aucune des
    # deux ne sort du territoire.
    #
    # /!\ LA CLE `US` DORT DEPUIS LE 2026-09-08 et c'est voulu. Cette table est
    #     indexee par cle de REGION DEPLOYEE ; `regions` n'en declare plus qu'une, donc
    #     `US` n'est jamais lue. On la garde parce qu'elle repond a une question qui
    #     coute cher a re-instruire — quelle localisation Gemini pour l'Amerique, et
    #     dans quel ordre de repli — et qu'une reponse deja trouvee ne se jette pas
    #     avec l'infrastructure. Elle reprend du service le jour ou `US` revient dans
    #     `regions`, sans rien a re-decider.
    location:
      EU:
        - eu
        - europe-west4
      US:
        - us-central1
        - us

  budget:
    enabled: true
    check_interval_minutes: 5
    notification_email: "asura@grisloup.com"

    token_bucket:
      max_spike: 5.0
      length_spike: 600
      cost_restart: 0.0
      frac_restart: 0.06

    services:
      vertexai:
        monthly_limit: 5.00
        auto_disable: true
        price_input_per_million: 1.25
        price_output_per_million: 5.00
      cloudrun:
        monthly_limit: 8.00
        auto_disable: true

    telegram:
      status_interval_hours: 2

  cloudfunctions:
    enabled: true
    require_app_check: false
    functions:
      messaging:
        environment:
          BROADCAST_ENABLED: "true"
      # Paramétrage du module pustore. Le module fournit la mécanique (miroir Play,
      # vérification, verrou de jeton) ; ddust lui dit seulement ce qui, chez lui, tient
      # lieu de SCOPE et où en projeter le bénéfice.
      #
      # Le scope est le CLAN : son document `clans/{clanId}` porte le secret (`ownerId`)
      # qui prouve l'appartenance, et la liste `admins` de ceux qui peuvent engager leur
      # carte. L'enfant, lui, lit la projection comme tout le monde et profite de tout.
      #
      # ⚠ `admins` est une liste de RÔLE, pas une liste d'adultes. Rien ici ne garantit
      # qu'un mineur n'y figure pas : le fondateur promeut qui il veut, et une liste écrite
      # par un binaire antérieur peut contenir un enfant. Ne PAS écrire « un enfant n'y
      # figure jamais » — c'était l'assertion précédente, et elle était fausse.
      # Ce qui est vrai, et qui est la garde réelle : le client exige `admins` ET
      # `legal_state == "a"` pour afficher la moindre surface commerciale
      # (`_storeCanBuy` → `_ensureIsAdmin` + `_ensureIsAdult`), refuse de promouvoir un
      # non-adulte (`promote_chief`), et l'achat lui-même passe encore par le contrôle
      # parental. Un client modifié contourne tout cela — la protection est ici du ressort
      # du store (Play facture le compte Google porteur de l'appareil), pas de cette liste.
      # Les identifiants ci-dessous ne sont PAS écrits ici : ils sont lus dans
      # `store.play` (build.yml de la suite), qui est aussi ce que pucatalog crée chez
      # Google. Une référence @@@C:...@@@ non résolue fait échouer le build.
      #
      # Recopier "fondateur" à la main était le piège le plus coûteux du dispositif :
      # une variante d'orthographe ne casse rien de visible, elle fait juste passer
      # tous les clans de lancement pour des abonnés ordinaires, et fausse les
      # chiffres en silence, sans qu'aucun écran ne bronche.
      #
      # ⚠ `TRIAL_OFFER_ID` est VIDE depuis le 2026-09-16 : l'offre d'essai a été
      # retirée du catalogue (build.yml de la suite → store.play), le modèle demandant
      # désormais sa première cotisation à un USAGE et non à une date. Les trois
      # fonctions le tolèrent (`process.env.TRIAL_OFFER_ID || ''`) et plus aucun achat
      # n'est classé `trial` : l'état reste dans l'énumération, il n'est simplement
      # plus jamais atteint. La référence `TRIAL_OFFER_ID: "@@@C:store.play.trial_offer@@@"`
      # a donc été RETIRÉE des trois fonctions : pucloudfunction refuse, à dessein, une
      # référence qui résout sur une valeur vide (le déploiement échouait), et la
      # valeur par défaut de pustore est déjà "". Le jour où l'on rouvrirait un essai,
      # remplir `store.play.trial_offer` ET remettre cette ligne dans store_verify,
      # store_rtdn et store_sweeper.
      store_verify:
        environment:
          PACKAGE_NAME: "@@@C:store.play.package@@@"
          # Offre de lancement à éligibilité développeur : un achat qui la porte
          # marque durablement `clans_store.founder`. C'est la seule preuve qui
          # vaille — Play l'a appliquée ou non, on ne fait que le constater.
          FOUNDER_OFFER_ID: "@@@C:store.play.founder_offer@@@"
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_SECRET_FIELD: "ownerId"
          SCOPE_ADMIN_FIELD: "admins"
          # `clans.admins` contient des userId MÉTIER (UUID posés par le client, cf.
          # worker_session._resolveUserId), pas les UID Firebase. Sans cette traduction,
          # la comparaison porte sur deux espaces d'identifiants disjoints, ne rend
          # jamais vrai, et PLUS PERSONNE ne peut payer — pas même le fondateur du clan.
          # Même indirection que le helper resolveUserId de delete_user_data.
          IDENTITY_COLLECTION: "userindexes"
          IDENTITY_FIELD: "userId"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"

      # Qui a droit à l'offre fondateurs. Le cutoff n'est PAS ici : il vit dans
      # `store_config/founders` (base `store`), pour se décaler sans redéploiement —
      # une date d'éligibilité qu'il faut redéployer pour bouger n'est pas ajustable,
      # et une offre de lancement dont on ne peut pas prolonger la fenêtre ne sert
      # pas à grand-chose. Le document n'est plus posé à la main : `pucatalog`
      # l'écrit dans CHAQUE base régionale depuis `store.play.founder_cutoff` du
      # build.yml de la suite, au même passage qu'il crée l'offre chez Google.
      #
      #   {eu,us}-store / store_config / founders
      #     { cutoff: <Timestamp>, offer_id: "fondateur", default_credit_months: 0 }
      #
      # `clans.date` est l'horodatage ISO posé à la création du clan
      # (worker_clan._onConfirmCreateClan) : aucun champ nouveau à écrire.
      store_eligibility:
        environment:
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_SECRET_FIELD: "ownerId"
          SCOPE_CREATED_FIELD: "date"

      # Octroi de mois offerts — parrainage ET compensation des familles du test
      # fermé, dont les achats sous licence sont GRATUITS et qu'aucune offre Play ne
      # peut donc récompenser (cf. strategie.md). Un seul mécanisme, deux usages.
      #
      # GRANT_ADMINS est VIDE tant que l'UID d'exploitation n'est pas renseigné, et
      # la fonction est alors fermée à tout le monde : c'est le bon défaut pour une
      # fonction qui distribue de la valeur. À renseigner avec l'UID Firebase du
      # compte éditeur avant d'accorder le premier crédit.
      store_grant:
        environment:
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_SECRET_FIELD: "ownerId"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"
          GRANT_ADMINS: ""

      # Réclamation d'un CODE CADEAU — la seconde porte vers le même octroi.
      #
      # store_grant exige qu'on désigne le clan. Or quand on veut remercier une famille
      # on ne dispose que de son e-mail, et rien ne mène d'une adresse à un clan :
      # `clans` ne stocke aucune adresse et Firebase Auth ne connaît pas les clans.
      # Un code inverse l'identification — ce n'est plus nous qui désignons le clan,
      # c'est le clan qui se désigne en réclamant.
      #
      # MÊMES valeurs de scope que store_verify, et pour la même raison : la
      # récompense bénéficie au clan, seul un administrateur devrait la réclamer, et
      # `clans.admins` porte des userId MÉTIER qu'il faut traduire depuis l'UID
      # Firebase (sans quoi la comparaison ne rend jamais vrai — cf. store_verify).
      #
      # CODES_REGION: le registre des codes vit dans UNE base, pas une par région.
      # Sans ça, un même code serait réclamable une fois en EU et une fois en US.
      # C'est `eu` parce que c'est la région d'origine ; la fonction américaine y va
      # aussi, exactement comme store_rtdn balaye les deux bases depuis l'Europe.
      # ⚠ `CODES_REGION` ci-dessous DECRIT LA PRODUCTION. La cible d'essai le
      #   surcharge dans le build.yml de la suite (build.targets.test.conf) : sans
      #   cette surcharge, `eut-store-claim` consommerait de vrais codes dans eu-store.
      store_claim:
        environment:
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_SECRET_FIELD: "ownerId"
          SCOPE_ADMIN_FIELD: "admins"
          IDENTITY_COLLECTION: "userindexes"
          IDENTITY_FIELD: "userId"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"
          CODES_REGION: "eu"
          # Cinq codes faux par compte et par jour. Un code juste ne consomme rien :
          # une famille qui reçoit deux cadeaux n'est jamais bloquée.
          CLAIM_MAX_ATTEMPTS: "5"
          CLAIM_WINDOW_HOURS: "24"

      # Fabrication des codes. MÊME allowlist que store_grant, volontairement : offrir
      # des mois et fabriquer de quoi en offrir sont le même pouvoir, il n'y a qu'un
      # seul UID à renseigner. Vide = fermée, comme l'octroi.
      #
      # Elle s'appelle depuis l'app, en mode test, sous le compte éditeur : une
      # fonction callable exige un jeton d'UTILISATEUR authentifié, elle ne se joint
      # donc ni en curl avec un compte de service, ni depuis un script.
      # Surcharge par cible : cf. build.targets.test.conf dans le build.yml de la suite.
      store_mint:
        environment:
          CODES_REGION: "eu"
          GRANT_ADMINS: ""

      # Couper un code ou un lot entier. Le pendant indispensable de la fabrication :
      # un code publié sur un flyer et recopié sur un forum doit pouvoir s'arrêter
      # sans passer par la console Firestore, c'est-à-dire au pire moment et sous
      # pression. Ne supprime rien — pose `revoked`, et ce qui a déjà été donné reste
      # donné.
      # Surcharge par cible : cf. build.targets.test.conf dans le build.yml de la suite.
      store_revoke:
        environment:
          CODES_REGION: "eu"
          GRANT_ADMINS: ""

      # Banc d'essai : écrit la VRAIE projection clans_store au lieu de simuler dans
      # le coin de l'app. C'est ce qui fait qu'un scénario de test se comporte comme
      # la réalité — la vigilance temps réel réveille tous les appareils du clan, le
      # balayage quotidien voit un clan en défaut et envoie ses relances push, les
      # plafonds de membres s'appliquent. Une simulation purement locale ne trompait
      # que l'appareil qui simulait, et n'éprouvait donc jamais le système.
      #
      store_rtdn:
        environment:
          PACKAGE_NAME: "@@@C:store.play.package@@@"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"
          # Play n'accepte qu'un topic : seul eu-play-rtdn est renseigné en console,
          # la fonction européenne traite donc aussi les données américaines.
          # Surcharge par cible : cf. build.targets.test.conf dans le build.yml de la suite.
          STORE_REGIONS: "eu,us"
      # Règle du payeur à la demande : appelée par le client après revoke_player,
      # nomore_chief et la suppression de compte (worker_members, worker_session). Le
      # balayage quotidien applique la même règle en filet.
      store_payer_check:
        environment:
          PACKAGE_NAME: "@@@C:store.play.package@@@"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"
          # Règle du payeur (pustore, 2026-09-24) : l'abonnement est RÉSILIÉ (renouvellement
          # arrêté, rien de remboursé) dès que son payeur n'est plus chef actif du clan ou
          # que le clan est dissous. Couvre la dissolution (delete_user_data, clan_purge :
          # clans.enabled=false), le compte supprimé (userindexes.enabled=false, alors que
          # delete_user_data laisse l'identifiant dans clans.admins) et le chef qui quitte
          # le clan ou perd son rôle (retiré de clans.admins).
          PAYER_RULE: "on"
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_ADMIN_FIELD: "admins"
          SCOPE_ENABLED_FIELD: "enabled"
          IDENTITY_COLLECTION: "userindexes"
          IDENTITY_FIELD: "userId"
          IDENTITY_ENABLED_FIELD: "enabled"
      store_sweeper:
        environment:
          PACKAGE_NAME: "@@@C:store.play.package@@@"
          PROJECTION_DATABASE: "workers"
          PROJECTION_COLLECTION: "clans_store"
          # Règle du payeur (pustore, 2026-09-24) : l'abonnement est RÉSILIÉ (renouvellement
          # arrêté, rien de remboursé) dès que son payeur n'est plus chef actif du clan ou
          # que le clan est dissous. Couvre la dissolution (delete_user_data, clan_purge :
          # clans.enabled=false), le compte supprimé (userindexes.enabled=false, alors que
          # delete_user_data laisse l'identifiant dans clans.admins) et le chef qui quitte
          # le clan ou perd son rôle (retiré de clans.admins).
          PAYER_RULE: "on"
          SCOPE_DATABASE: "workers"
          SCOPE_COLLECTION: "clans"
          SCOPE_ADMIN_FIELD: "admins"
          SCOPE_ENABLED_FIELD: "enabled"
          IDENTITY_COLLECTION: "userindexes"
          IDENTITY_FIELD: "userId"
          IDENTITY_ENABLED_FIELD: "enabled"
          # Cycle de défaut de paiement (vision.md § « Les défauts de paiement »).
          # C'est un jeu familial et le design le rend rentable : on montre de la
          # compréhension. Le jeu ne se ferme JAMAIS pendant les 50 premiers jours —
          # ni pour l'enfant, ni pour l'adulte — et les relances ne s'adressent
          # qu'aux adultes, sur un ton qui n'inquiète personne.
          #
          # Les textes sont volontairement au serveur et non dans le thème : ils
          # doivent partir même quand l'app n'est jamais ouverte, donc sans le
          # dictionnaire de traductions du client.
          # `purge_day: 780` — DEUX ANS entre le gel et la suppression, au lieu de 40
          # jours. Le calendrier ne change pas avant : grâce 10 jours, relances jusqu'à
          # J50, gel du donjon à J50. C'est APRÈS que l'on desserre.
          #
          # ⚠ 780 ET NON 730, parce que le compteur ne part PAS du gel. `store_sweeper`
          # calcule `days` depuis `default_since`, c'est-à-dire depuis le PREMIER IMPAYÉ,
          # alors que le gel n'intervient qu'à J50. Écrire 730 laissait 680 jours entre le
          # gel et l'effacement — presque deux mois de moins que ce que ce commentaire
          # annonce, et que ce que la politique de confidentialité promet aux familles
          # (« deux ans à compter du blocage du clan »). Toute reprise de `locked_day` doit
          # se répercuter ici : c'est `locked_day + 730` qui fait foi, pas 730.
          #
          # Deux ans parce qu'une famille qui arrête n'a pas toujours renoncé : elle
          # déménage, l'enfant grandit, la rentrée passe. Ce qui coûte à reconstituer
          # n'est pas le clan mais son HISTOIRE — les tâches réglées, les niveaux, le
          # butin, le journal de chacun. Le conserver ne coûte, lui, presque rien : un
          # clan gelé ne fait plus aucune requête (le donjon est fermé), les preuves
          # photo n'ont jamais quitté les appareils, et il ne reste que quelques mégas
          # de Firestore par clan. Supprimer coûterait même des écritures.
          #
          # Une phase `farewell` (J750-780) prévient les adultes un mois avant. Sans
          # elle, deux ans de silence s'achèveraient sur une suppression qu'aucune
          # famille n'aurait vue venir — l'opportunité qu'on veut leur laisser ne vaut
          # que si on la leur rappelle. Aucun code pour cela : passé le gel, le
          # balayage retombe dans la branche des relances et sert les phases déclarées.
          STORE_LIFECYCLE: >-
            {"grace_days":10,
             "locked_day":50,
             "purge_day":780,
             "default_lang":"fr",
             "title":"Donjons & Savons",
             "notify":{"database":"messaging","collection":"msgregistry","match_field":"ownerId",
                       "scope_database":"workers","scope_collection":"clans","recipients_field":"admins",
                       "identity_collection":"userindexes","identity_field":"userId"},
             "phases":[{"key":"soft","from":10,"to":20},
                       {"key":"firm","from":20,"to":40},
                       {"key":"last","from":40,"to":50},
                       {"key":"farewell","from":750,"to":780}],
             "texts":{
               "fr":{"soft":"Votre bourse semble un peu légère aujourd'hui. Pas d'inquiétude : l'aventure continue dans Donjons & Savons, et vous pourrez régulariser cela plus tard.",
                     "firm":"Ne laissez pas un petit souci de bourse arrêter l'aventure : le donjon vous attend toujours.",
                     "last":"Le grimoire va se refermer. On a adoré jouer avec vous ! La porte du donjon restera toujours ouverte pour votre retour.",
                     "farewell":"Votre clan vous attend depuis deux ans. Ses données seront effacées dans un mois : reprenez la cotisation avant cette date et vous le retrouverez intact."},
               "en":{"soft":"Your purse looks a little light today. No worries: the adventure goes on in Dungeons & Dusting, and you can sort this out later.",
                     "firm":"Don't let a small purse problem stop the adventure: the dungeon is still waiting for you.",
                     "last":"The tome is about to close. We loved playing with you! The dungeon door will always stay open for your return.",
                     "farewell":"Your clan has been waiting for two years. Its data will be erased in a month: resume the subscription before then and you will find it intact."},
               "es":{"soft":"Tu bolsa parece un poco ligera hoy. Sin preocupaciones: la aventura continúa en Calabozos & Jabones, y podrás regularizarlo más tarde.",
                     "firm":"No dejes que un pequeño problema de bolsa detenga la aventura: la mazmorra todavía te espera.",
                     "last":"El grimorio va a cerrarse. ¡Nos encantó jugar con vosotros! La puerta de la mazmorra siempre quedará abierta para vuestro regreso.",
                     "farewell":"Vuestro clan lleva dos años esperando. Sus datos se borrarán dentro de un mes: retomad la cuota antes de esa fecha y lo recuperaréis intacto."},
               "de":{"soft":"Euer Geldbeutel wirkt heute etwas leicht. Keine Sorge: Das Abenteuer geht weiter in Donjons & Savons, und ihr könnt das später in Ordnung bringen.",
                     "firm":"Lasst ein kleines Problem mit dem Geldbeutel nicht das Abenteuer stoppen: Der Kerker wartet immer noch auf euch.",
                     "last":"Das Zauberbuch schließt sich gleich. Wir haben es geliebt, mit euch zu spielen! Die Tür des Kerkers bleibt für eure Rückkehr immer offen.",
                     "farewell":"Euer Clan wartet seit zwei Jahren auf euch. Seine Daten werden in einem Monat gelöscht: Nehmt das Abonnement vorher wieder auf, und ihr findet ihn unversehrt wieder."},
               "it":{"soft":"Il vostro borsellino sembra un po' leggero oggi. Nessuna preoccupazione: l'avventura continua in Donjons & Savons, e potrete sistemare tutto più tardi.",
                     "firm":"Non lasciate che un piccolo problema di borsellino fermi l'avventura: il dungeon vi aspetta ancora.",
                     "last":"Il grimorio sta per chiudersi. Ci è piaciuto tantissimo giocare con voi! La porta del dungeon resterà sempre aperta per il vostro ritorno.",
                     "farewell":"Il vostro clan vi aspetta da due anni. I suoi dati saranno cancellati tra un mese: riprendete l'abbonamento prima di quella data e lo ritroverete intatto."},
               "pt":{"soft":"A vossa bolsa parece um pouco leve hoje. Não se preocupem: a aventura continua em Donjons & Savons, e podem regularizar isto mais tarde.",
                     "firm":"Não deixem que um pequeno problema de bolsa trave a aventura: a masmorra continua à vossa espera.",
                     "last":"O grimório vai fechar-se. Adorámos jogar convosco! A porta da masmorra ficará sempre aberta para o vosso regresso.",
                     "farewell":"O vosso clã espera-vos há dois anos. Os seus dados serão apagados dentro de um mês: retomem a subscrição antes dessa data e voltarão a encontrá-lo intacto."},
               "br":{"soft":"A bolsa de vocês parece um pouco leve hoje. Não se preocupem: a aventura continua em Donjons & Savons, e vocês podem acertar isso mais tarde.",
                     "firm":"Não deixem um probleminha de bolsa parar a aventura: a masmorra continua esperando por vocês.",
                     "last":"O grimório vai se fechar. Adoramos jogar com vocês! A porta da masmorra vai estar sempre aberta para a volta de vocês.",
                     "farewell":"O clã de vocês está esperando há dois anos. Os dados dele serão apagados daqui a um mês: retomem a assinatura antes dessa data e vão encontrá-lo intacto."},
               "nl":{"soft":"Jullie buidel lijkt vandaag wat licht. Geen zorgen: het avontuur gaat door in Donjons & Savons, en jullie kunnen dit later in orde brengen.",
                     "firm":"Laat een klein probleempje met de buidel het avontuur niet stoppen: de kerker wacht nog altijd op jullie.",
                     "last":"Het toverboek gaat bijna dicht. We vonden het geweldig om met jullie te spelen! De deur van de kerker blijft altijd open voor jullie terugkeer.",
                     "farewell":"Jullie clan wacht al twee jaar. Zijn gegevens worden over een maand gewist: hervat het abonnement voor die datum en jullie vinden hem ongeschonden terug."}}}
      # --- dvautover : la mise à jour des données d'un clan ----------------------------
      # Appelée UNIQUEMENT par la fonction générique `autover` (brique puautover), qui a
      # vérifié la connexion et transmet l'UID Firebase. Fermée par IAM : `trigger: http`,
      # `invoker: autover`. Jamais `callable`, qui l'ouvrirait à tout Internet.
      #
      # Ce qu'elle fait, dans cet ordre :
      #   1. revérifie TOUT côté serveur : le secret du clan, l'appartenance (userindexes)
      #      et le statut de chef (`admins`, en identifiant MÉTIER) — le « chef ? » de
      #      l'application n'est qu'un aiguillage d'écran ;
      #   2. borne la cible par `target`, lu dans `<région>-autover` : on n'applique jamais
      #      une étape que le Store ne sert pas encore à tous ;
      #   3. prend le verrou `locked_until` par transaction (bail de 3 minutes, repoussé à
      #      chaque étape) : les règles de `workers` refusent alors toute écriture client
      #      sur le clan ;
      #   4. applique les étapes une à une, `data_version` écrite après CHACUNE ;
      #   5. libère le verrou.
      #
      # ⚠ SUR UNE PANNE EN COURS D'ÉTAPE, LE VERROU RESTE : les données peuvent être à
      #   moitié transformées. Il tombe seul à l'échéance du bail, et le chef suivant
      #   reprend à la dernière `data_version` écrite. Une étape doit donc pouvoir être
      #   rejouée sur des données qu'elle a déjà en partie traitées.
      # ⚠ UNE ÉTAPE PUBLIÉE EST GELÉE. Des clans l'ont peut-être déjà subie : une
      #   correction est une NOUVELLE étape, jamais une modification de celle-ci.
      # ⚠ LA TABLE `STEPS` ET `autover.steps` (build.yml de la suite) DOIVENT DIRE LA MÊME
      #   CHOSE : le builder refuse le déploiement sinon, dans les deux sens.
      ddust_autover:
        entry_point: ddust_autover
        trigger: http
        invoker: autover
        memory: 512
        service_account: backend
        timeout: 540
        environment:
          # Les régions vers lesquelles un clan peut déménager (op `migrate`). Les
          # mêmes pour les deux cibles : la production comme la beta (EUT).
          MIGRATION_REGIONS: "eu,eut"
          # La région de beta : la seule qu'on rejoint sans condition de pays.
          BETA_REGION: "eut"
          # Pays -> région de production (retour de beta). Aligné sur le catalogue des
          # marchés du client (dvdocuments, documents.regions_catalog : `fr` -> `eu`).
          COUNTRY_REGIONS: "FR:eu"
        code: |
          import { onRequest } from 'firebase-functions/v2/https';
          import * as admin from 'firebase-admin';
          import { getFirestore, Timestamp, FieldValue, Firestore, DocumentReference, BulkWriter } from 'firebase-admin/firestore';
          admin.initializeApp();

          const LEASE_MS = 3 * 60 * 1000;
          const REGION   = '@@@region@@@';
          const ALLOWED  = String(process.env.MIGRATION_REGIONS || '').split(',')
                             .map((s) => s.trim().toLowerCase()).filter((s) => !!s);
          const dbOf     = (region: string, name: string) => getFirestore(admin.app(), region + '-' + name);
          const autover  = () => dbOf(REGION, 'autover');

          type Step = (db: Firestore, clanId: string, secret: string) => Promise<void>;

          // Les étapes, indexées par le BUILD qui les exige. Chacune transforme les
          // données d'UN clan, du format de l'étape précédente au sien.
          const STEPS: Record<number, Step> = {
          };

          function lease(): Timestamp { return Timestamp.fromMillis(Date.now() + LEASE_MS); }

          // ---------------------------------------------------------------- droits

          // Revérifie TOUT côté serveur : le secret du clan, l'appartenance de l'appelant
          // (son index porte le même secret), puis son statut de chef (identifiant MÉTIER).
          // `region` : la région où vivent les données du clan (par défaut, celle de cette
          // fonction). Une migration peut être demandée à la fonction de PRODUCTION pour un
          // clan qui vit en beta : c'est la seule que toutes les applications savent appeler.
          async function authorize(msg: Record<string, any>, region: string = REGION): Promise<Record<string, any>> {
            const uid    = String(msg.uid    || '');
            const clanId = String(msg.scope  || '');
            const secret = String(msg.secret || '');
            const build  = Number(msg.build  || 0);
            if (!uid || !clanId || !secret || !(build > 0)) return { status: 'bad_request' };

            const db      = dbOf(region, 'workers');
            const clanRef = db.collection('clans').doc(clanId);
            const clan    = await clanRef.get();
            if (!clan.exists) return { status: 'not_found' };
            const c = clan.data() || {};
            if (String(c.ownerId || '') !== secret || c.enabled === false) return { status: 'forbidden' };

            const ix  = await db.collection('userindexes').doc(uid).get();
            const ixd = ix.data() || {};
            if (String(((ixd.clans || {})[clanId] || {}).clanSecret || '') !== secret) {
              return { status: 'forbidden' };
            }
            const userId = String(ixd.userId || '');
            const admins = Array.isArray(c.admins) ? c.admins : [];
            if (!userId || !admins.includes(userId)) return { status: 'not_chief' };
            return { db, clanRef, c, clanId, secret, build, admins };
          }

          // Le verrou, pris par transaction. Un bail échu (fonction morte en route) se
          // reprend : c'est ce qui fait qu'aucun clan ne reste bloqué.
          async function lock(db: Firestore, clanRef: DocumentReference): Promise<boolean> {
            const now = Date.now();
            return db.runTransaction(async (tx) => {
              const s  = await tx.get(clanRef);
              const lu = (s.data() || {}).locked_until;
              if (lu && typeof lu.toMillis === 'function' && lu.toMillis() > now) return false;
              tx.update(clanRef, { locked_until: lease() });
              return true;
            });
          }

          // ------------------------------------------------------- mise à jour (étapes)

          async function update(msg: Record<string, any>): Promise<Record<string, any>> {
            const a = await authorize(msg);
            if (a.status) return a;
            const { db, clanRef, clanId, secret, build } = a;

            const vdoc    = await autover().collection('autover').doc('version').get();
            const target  = Number((vdoc.data() || {}).target || 0);
            const plafond = Math.min(build, target);

            if (!(await lock(db, clanRef))) return { status: 'busy' };

            // Relu SOUS verrou : un autre chef a pu avancer le clan entre-temps.
            let current = Number(((await clanRef.get()).data() || {}).data_version || 0);
            const todo = Object.keys(STEPS).map(Number)
                               .filter((s) => s > current && s <= plafond)
                               .sort((a, b) => a - b);
            try {
              for (const s of todo) {
                await STEPS[s](db, clanId, secret);
                current = s;
                await clanRef.update({ data_version: s, locked_until: lease() });
              }
            } catch (e: any) {
              console.error('ddust_autover: clan ' + clanId + ', étape en échec après ' + current
                            + ' : ' + (e && e.message ? e.message : e));
              return { status: 'failed', data_version: current };
            }
            await clanRef.update({ locked_until: FieldValue.delete() });
            return { status: todo.length ? 'ok' : 'up_to_date', data_version: current };
          }

          // ------------------------------------------------------------ migration

          // Copie un document et TOUT ce qu'il porte en dessous, sous-collections comprises.
          // ⚠ LES PARENTS FANTÔMES : `clans_tasks/{clanId}` n'est jamais écrit, seules ses
          //   sous-collections existent. `listCollections()` et `listDocuments()` les voient
          //   quand même ; une requête sur la collection racine, non.
          async function copyTree(src: DocumentReference, dst: DocumentReference, w: BulkWriter,
                                  omit: string[] = []): Promise<number> {
            let n = 0;
            const snap = await src.get();
            if (snap.exists) {
              const d: Record<string, any> = Object.assign({}, snap.data());
              for (const k of omit) delete d[k];
              w.set(dst, d);
              n++;
            }
            for (const col of await src.listCollections()) {
              for (const ref of await col.listDocuments()) {
                n += await copyTree(ref, dst.collection(col.id).doc(ref.id), w);
              }
            }
            return n;
          }

          async function copyDoc(src: DocumentReference, dst: DocumentReference, w: BulkWriter): Promise<void> {
            const snap = await src.get();
            if (snap.exists) w.set(dst, snap.data() || {});
          }

          // Les membres du clan : identifiant métier, et UID Firebase pour ceux qui ont un
          // compte. Un enfant sans compte n'existe que dans clans_players.
          async function membersOf(db: Firestore, clanId: string): Promise<Array<{ userId: string, uid: string }>> {
            const out: Array<{ userId: string, uid: string }> = [];
            const players = await db.collection('clans_players').doc(clanId).collection('players').get();
            for (const p of players.docs) {
              const d = p.data() || {};
              if (d.no_account === true) { out.push({ userId: p.id, uid: '' }); continue; }
              const u = await db.collection('users').doc(p.id).get();
              out.push({ userId: p.id, uid: u.exists ? String((u.data() || {}).ownerId || '') : '' });
            }
            return out;
          }

          function chunks<T>(xs: T[], n: number): T[][] {
            const out: T[][] = [];
            for (let i = 0; i < xs.length; i += n) out.push(xs.slice(i, i + n));
            return out;
          }

          const CLAN_COLLECTIONS = ['clans_tasks', 'clans_items', 'clans_logs', 'clans_chest_history',
                                    'clans_players', 'clans_store', 'clans_pulse'];

          // La région de production d'un pays (`COUNTRY_REGIONS`, ex. "FR:eu"). La même table
          // que le catalogue des marchés du client (documents.regions_catalog) : à garder
          // alignée avec lui.
          const COUNTRY_REGIONS: Record<string, string> = {};
          for (const part of String(process.env.COUNTRY_REGIONS || '').split(',')) {
            const [pays, region] = part.split(':').map((s) => (s || '').trim());
            if (pays && region) COUNTRY_REGIONS[pays.toUpperCase()] = region.toLowerCase();
          }
          const BETA_REGION = String(process.env.BETA_REGION || '').toLowerCase();

          // Déménage un clan ENTIER de `from` (défaut : la région de cette fonction) vers `to`,
          // en trois phases rejouables :
          //   copy    : tout est copié vers l'arrivée (écrasant d'anciennes pierres tombales) ;
          //   switch  : les sessions de départ deviennent des pierres tombales, chef(s) en dernier ;
          //   cleanup : tout le reste est supprimé au départ, le verrou d'arrivée est levé.
          // L'état vit dans `<départ>-autover/migrations/{clanId}` : l'application le lit
          // (règle 0), la fonction reprend à la phase notée.
          //
          // ⚠ UN RETOUR EN PRODUCTION VA DANS LA RÉGION DU PAYS DU CHEF, relu ici dans sa
          //   session légale : l'application ne choisit pas où envoyer un clan. Seule la
          //   région de beta échappe à la règle (c'est elle qu'on rejoint en beta).
          async function migrate(msg: Record<string, any>): Promise<Record<string, any>> {
            const from = String(msg.from || REGION).toLowerCase();
            const to   = String(msg.to   || '').toLowerCase();
            if (!to || from === to || !ALLOWED.includes(to) || !ALLOWED.includes(from)) {
              return { status: 'bad_region' };
            }
            const a = await authorize(msg, from);
            if (a.status) return a;
            const { db, clanRef, clanId, c, admins } = a;

            if (to !== BETA_REGION) {
              const ds   = await dbOf(from, 'documents').collection('documents_sessions').doc(String(msg.uid)).get();
              const pays = String((ds.data() || {}).country || '').toUpperCase();
              if (!pays || COUNTRY_REGIONS[pays] !== to) return { status: 'bad_region' };
            }

            // L'arrivée doit savoir lire ces données : aucune étape déjà appliquée au clan ne
            // doit dépasser ce que son Store sert (`target`).
            const d        = Number(c.data_version || 0);
            const dversion = await dbOf(to, 'autover').collection('autover').doc('version').get();
            const dtarget  = Number((dversion.data() || {}).target || 0);
            if (Object.keys(STEPS).map(Number).some((s) => s > dtarget && s <= d)) return { status: 'dest_too_old' };

            const migRef = dbOf(from, 'autover').collection('migrations').doc(clanId);
            const mig    = (await migRef.get()).data() || {};
            if (mig.phase && mig.phase !== 'done' && mig.to && mig.to !== to) return { status: 'busy' };
            if (!(await lock(db, clanRef))) return { status: 'busy' };

            let phase = (mig.phase && mig.phase !== 'done' && mig.to === to) ? String(mig.phase) : 'copy';
            const now = new Date().toISOString();
            await migRef.set({ clanId, from, to, phase, updated_at: now,
                               started_at: (mig.phase && mig.phase !== 'done') ? (mig.started_at || now) : now });
            const setPhase = async (p: string) => {
              phase = p;
              await migRef.set({ phase: p, updated_at: new Date().toISOString() }, { merge: true });
            };

            const dw    = dbOf(to, 'workers');
            const srcD  = dbOf(from, 'documents'), dstD = dbOf(to, 'documents');
            const srcS  = dbOf(from, 'store'),     dstS = dbOf(to, 'store');
            const srcM  = dbOf(from, 'messaging'), dstM = dbOf(to, 'messaging');

            try {
              // Les membres se lisent au départ tant qu'il existe, à l'arrivée ensuite.
              const members = await membersOf(phase === 'copy' ? db : dw, clanId);
              const uids    = members.map((m) => m.uid).filter((u) => !!u);

              if (phase === 'copy') {
                const ww = dw.bulkWriter();
                await copyTree(db.collection('clans').doc(clanId), dw.collection('clans').doc(clanId), ww, ['locked_until']);
                for (const col of CLAN_COLLECTIONS) {
                  await copyTree(db.collection(col).doc(clanId), dw.collection(col).doc(clanId), ww);
                  await clanRef.update({ locked_until: lease() });
                }
                for (const m of members) {
                  if (!m.uid) continue;
                  await copyDoc(db.collection('users').doc(m.userId), dw.collection('users').doc(m.userId), ww);
                  await copyDoc(db.collection('userindexes').doc(m.uid), dw.collection('userindexes').doc(m.uid), ww);
                }
                await ww.close();
                // Le clan d'arrivée naît VERROUILLÉ : personne n'y écrit avant la fin.
                await dw.collection('clans').doc(clanId).set({ locked_until: lease() }, { merge: true });

                const wd = dstD.bulkWriter();
                for (const uid of uids) {
                  // La session légale suit le compte : son `cloud_region` est du ROUTAGE, pas une
                  // preuve. Recopié tel quel, il renvoyait l'application vers la région de
                  // départ, où l'écriture suivante était refusée (relevé le 2026-09-26).
                  const sess = await srcD.collection('documents_sessions').doc(uid).get();
                  if (sess.exists) {
                    wd.set(dstD.collection('documents_sessions').doc(uid),
                           Object.assign({}, sess.data(), { cloud_region: to }));
                  }
                  // Les preuves d'acceptation sont copiées TELLES QUELLES : ce sont des preuves.
                  const acc = await srcD.collection('documents_acceptance').where('ownerId', '==', uid).get();
                  for (const x of acc.docs) wd.set(dstD.collection('documents_acceptance').doc(x.id), x.data() || {});
                }
                await wd.close();

                // Facturation : les deux registres qui rattachent un achat au clan.
                const wsx = dstS.bulkWriter();
                for (const coll of ['store_tokens', 'store_purchases']) {
                  const q = await srcS.collection(coll).where('scope', '==', clanId).get();
                  for (const x of q.docs) wsx.set(dstS.collection(coll).doc(x.id), x.data() || {});
                }
                await wsx.close();

                // Les appareils des membres, sinon plus aucune relance à l'arrivée.
                const wm = dstM.bulkWriter();
                for (const part of chunks(uids, 30)) {
                  const q = await srcM.collection('msgregistry').where('ownerId', 'in', part).get();
                  for (const x of q.docs) wm.set(dstM.collection('msgregistry').doc(x.id), x.data() || {});
                }
                await wm.close();

                await setPhase('switch');
                await clanRef.update({ locked_until: lease() });
              }

              if (phase === 'switch') {
                // Pierres tombales SANS donnée personnelle : juste de quoi dire où est le joueur.
                // Les membres d'abord, les chefs en dernier : tant que la session d'un chef est
                // au départ, c'est lui qui peut reprendre la migration.
                const ordre = members.filter((m) => !admins.includes(m.userId))
                                     .concat(members.filter((m) => admins.includes(m.userId)));
                for (const m of ordre) {
                  if (!m.uid) continue;
                  await db.collection('users').doc(m.userId).set({
                    userId: m.userId, ownerId: m.uid, enabled: false, moved_to: to, moved_at: new Date().toISOString(),
                  });
                  await db.collection('userindexes').doc(m.uid).set({
                    userId: m.userId, ownerId: m.uid, enabled: false, moved_to: to,
                  });
                }
                await setPhase('cleanup');
              }

              if (phase === 'cleanup') {
                await db.recursiveDelete(db.collection('clans').doc(clanId));
                for (const col of CLAN_COLLECTIONS) await db.recursiveDelete(db.collection(col).doc(clanId));
                for (const uid of uids) {
                  await srcD.collection('documents_sessions').doc(uid).delete();
                  const acc = await srcD.collection('documents_acceptance').where('ownerId', '==', uid).get();
                  for (const x of acc.docs) await x.ref.delete();
                }
                for (const coll of ['store_tokens', 'store_purchases']) {
                  const q = await srcS.collection(coll).where('scope', '==', clanId).get();
                  for (const x of q.docs) await x.ref.delete();
                }
                for (const part of chunks(uids, 30)) {
                  const q = await srcM.collection('msgregistry').where('ownerId', 'in', part).get();
                  for (const x of q.docs) await x.ref.delete();
                }
                // Éphémères : purgés au départ, jamais déménagés (le secret du clan y circule).
                const inv = await db.collection('clans_invites').where('clanId', '==', clanId).get();
                for (const x of inv.docs) await x.ref.delete();
                try {
                  const vl = dbOf(from, 'virtuallobby');
                  const recs = await vl.collection('virtuallobbymanagement').doc(clanId).collection('records').get();
                  for (const r of recs.docs) await vl.collection('virtuallobbysecret').doc(r.id).delete();
                  await vl.recursiveDelete(vl.collection('virtuallobbymanagement').doc(clanId));
                } catch (e: any) {
                  console.warn('ddust_autover: purge virtuallobby incomplète : ' + (e && e.message ? e.message : e));
                }

                await dw.collection('clans').doc(clanId).update({ locked_until: FieldValue.delete() });
                await setPhase('done');
              }
            } catch (e: any) {
              // Verrou gardé : il tombe seul, et le chef reprend à la phase notée.
              console.error('ddust_autover: migration du clan ' + clanId + ' vers ' + to + ' en échec (phase '
                            + phase + ') : ' + (e && e.message ? e.message : e));
              return { status: 'failed', phase };
            }
            return { status: 'ok', to };
          }

          export const ddust_autover = onRequest(async (req, res) => {
            try {
              // Enveloppe `{data: ...}` posée par la fonction générique `autover`.
              const corps = req.body || {};
              const cles  = Object.keys(corps);
              const msg   = (cles.length === 1 && cles[0] === 'data' && corps.data
                             && typeof corps.data === 'object') ? corps.data : corps;
              const op    = String(msg.op || 'update');
              res.status(200).json(op === 'migrate' ? await migrate(msg) : await update(msg));
            } catch (e: any) {
              console.error('ddust_autover: ' + (e && e.message ? e.message : e));
              res.status(500).json({ status: 'error', message: String(e && e.message ? e.message : e) });
            }
          });

      count_sessions:
        entry_point: countSessions
        trigger: callable
        memory: 256
        service_account: backend
        timeout: 30
        code: |
          import { onCall, HttpsError } from 'firebase-functions/v2/https';
          import * as admin from 'firebase-admin';
          import { getFirestore } from 'firebase-admin/firestore';
          admin.initializeApp();
          export const countSessions = onCall(async (request) => {
            if (!request.auth) {
              throw new HttpsError('unauthenticated', 'Authentication required');
            }
            // La substitution @@@region@@@ nomme la BASE (eu-sessions aujourd'hui, une
            // par region deployee) ; la collection, elle, ne porte pas de prefixe de
            // region — la base l'est deja.
            // NB : aucun code n'alimente aujourd'hui cette collection, le compteur vaut
            // donc toujours 0 (tous les clans se nomment "{nom}-{region}-0"). A traiter
            // separement : c'est le nommage des clans qui est en cause, pas la region.
            const db = getFirestore(admin.app(), '@@@region@@@_sessions');
            const snap = await db.collection('sessions').count().get();
            return { count: snap.data().count };
          });
      beta_signup:
        entry_point: betaSignup
        trigger: callable
        memory: 256
        service_account: backend
        timeout: 30
        code: |
          import { onCall, HttpsError } from 'firebase-functions/v2/https';
          import * as admin from 'firebase-admin';
          import { getFirestore } from 'firebase-admin/firestore';
          import { createHash } from 'crypto';
          admin.initializeApp();

          // Inscription à la liste d'attente des betas, saisie sur le site vitrine
          // (build/hosting/web/assets/site.js, bloc #beta-signup).
          //
          // ENDPOINT VOLONTAIREMENT PUBLIC : contrairement à count_sessions et
          // delete_user_data, il n'y a PAS de garde `request.auth` — le visiteur du site
          // n'est pas connecté, c'est tout l'intérêt du formulaire. pucloudfunction pose
          // déjà le binding IAM allUsers sur tout trigger callable, la fonction est donc
          // joignable par n'importe qui : d'où la validation stricte ci-dessous et le
          // champ piège. Rien de sensible n'est lu, seule une adresse est écrite.
          //
          // La collection beta_signups est fermée au client par les règles Firestore
          // (allow read, write: if false) ; l'admin SDK les ignore.
          //
          // Une seule région alimentée : site.js appelle le glob NU /api/beta, que
          // puhosting route vers la première région (eu). La liste doit rester d'un seul
          // tenant. Ne pas « corriger » en appelant /api/beta/eu ET /api/beta/us comme le
          // fait la page delete-account : elle, cherche des données déjà réparties.
          export const betaSignup = onCall(async (request) => {
            const data = (request.data ?? {}) as Record<string, unknown>;

            // Champ piège : invisible à l'écran, donc rempli seulement par un robot.
            // On répond ok sans rien écrire — inutile de lui apprendre qu'il est repéré.
            if (String(data.website ?? '').trim() !== '') {
              return { ok: true };
            }

            const email = String(data.email ?? '').trim().toLowerCase();
            if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
              throw new HttpsError('invalid-argument', 'invalid email');
            }

            const rawLang = String(data.lang ?? '');
            // Liste blanche des langues : elle DOIT suivre `langues` du build.yml de
            // la suite. Une inscription italienne enregistree comme 'en' n'est pas un
            // defaut d'affichage, c'est une donnee fausse dans la liste.
            const lang = ['fr', 'en', 'es', 'it', 'de', 'pt', 'br', 'nl'].indexOf(rawLang) >= 0 ? rawLang : 'en';
            const source = String(data.source ?? '').slice(0, 32);

            const db = getFirestore(admin.app(), '@@@region@@@_workers');
            // doc-id = empreinte de l'adresse normalisée : une seule ligne par inscrit
            // (ré-inscription = mise à jour), sans écrire l'email dans un chemin de document.
            const docId = createHash('sha256').update(email).digest('hex');
            const ref = db.collection('beta_signups').doc(docId);
            const now = new Date().toISOString();

            await db.runTransaction(async (tx) => {
              const snap = await tx.get(ref);
              if (snap.exists) {
                // created_at n'est JAMAIS réécrite : c'est la date d'inscription.
                const prev = (snap.data() ?? {}) as Record<string, unknown>;
                const count = Number(prev.count ?? 1);
                tx.set(ref, {
                  updated_at: now, lang, source,
                  count: (Number.isFinite(count) ? count : 1) + 1,
                }, { merge: true });
              } else {
                tx.set(ref, {
                  email, created_at: now, updated_at: now, lang, source,
                  count: 1, enabled: true,
                });
              }
            });

            // Réponse identique qu'il s'agisse d'une première inscription ou d'une
            // relance : le formulaire est public, il ne doit pas révéler qui est inscrit.
            return { ok: true };
          });
      delete_user_data:
        entry_point: deleteUserData
        trigger: callable
        memory: 256
        service_account: backend
        timeout: 120
        code: |
          import { onCall, HttpsError } from 'firebase-functions/v2/https';
          import * as admin from 'firebase-admin';
          import { getFirestore } from 'firebase-admin/firestore';
          admin.initializeApp();

          // Suppression logique (soft delete) de toutes les données d'un utilisateur, en cascade.
          // enabled=false sur users/userindexes + tombstone clans_players (status=deleted). Si le
          // joueur est chef unique d'un clan (fondateur seul admin), le clan est dissous : tous ses
          // membres sont tombstonés, et ceux qui n'ont plus de responsable légal (mineur, clan
          // d'origine dissous) ou plus aucun autre clan actif sont eux-mêmes supprimés (récursif).
          // L'admin SDK ignore les règles Firestore.
          // NB : ownerId reçu = UID Firebase (auth) ; les docs users/ et clans_players sont keyés par
          // le userId MÉTIER, traduit via userindexes/{firebaseUid}.userId (cf. worker.dart _resolveUserId).
          //
          // DEUX PORTES D'ENTRÉE, UNE SEULE CASCADE.
          //   1. `ownerId`       — suppression de son PROPRE compte (in-app ou page web). Self-delete.
          //   2. `consentTarget` : RETRAIT DU CONSENTEMENT PARENTAL (art. 7(3) RGPD) : un représentant
          //      a retiré son consentement pour un enfant, le délai de rétractation de 3 jours est
          //      écoulé, et l'exécution est réclamée depuis un appareil. L'appelant n'est PAS la
          //      cible : l'autorisation ne peut donc pas venir de lui, elle est reconstruite ici à
          //      partir de faits vérifiables en base (voir la branche plus bas). Deux variantes :
          //        - enfant AVEC `guardianship` (multiclan) : la preuve est dans guardianship ;
          //        - enfant SANS téléphone (`clanId` fourni, pas de guardianship) : la preuve est
          //          `consent_due` sur sa fiche du clan d'origine, comme avant le multiclan.
          //
          // MULTICLAN. Un joueur a des fiches dans plusieurs clans, éventuellement dans plusieurs
          // régions (`users.clans.{id}.region`) : chaque fiche est traitée dans la base de SA
          // région. Et le SEUL représentant d'un enfant ne peut pas supprimer son compte (porte 1
          // refusée) : il doit d'abord ajouter un co-représentant ou supprimer le compte de
          // l'enfant. Un enfant qui garde un co-représentant n'est jamais emporté par la cascade.
          // La cascade, les pierres tombales et la clôture du consentement sont RIGOUREUSEMENT les
          // mêmes dans les deux cas — il n'y a qu'une implémentation de la suppression, et c'est le
          // point : elle est déjà dupliquée dans `clan_purge`, une troisième copie serait un danger.
          export const deleteUserData = onCall(async (request) => {
            if (!request.auth) {
              throw new HttpsError('unauthenticated', 'Authentication required');
            }
            const ownerId       = String((request.data ?? {}).ownerId ?? '');
            const consentTarget = String((request.data ?? {}).consentTarget ?? '');
            const consentClanId = String((request.data ?? {}).clanId ?? '');
            if (!ownerId && !consentTarget) {
              throw new HttpsError('invalid-argument', 'ownerId or consentTarget required');
            }
            // Porte 1 — self-delete, et self-delete seulement : personne ne supprime le compte
            // d'un autre par cette voie (allowlist admin à venir avec le back-office).
            if (ownerId && request.auth.uid !== ownerId) {
              throw new HttpsError('permission-denied', 'Can only delete own account');
            }

            const db  = getFirestore(admin.app(), '@@@region@@@_workers');
            const now = new Date().toISOString();

            // Coalescence des écritures par document (deep-merge JS) puis flush en lots < 500.
            const buffer = new Map();
            const deepMerge = (t: any, s: any): any => {
              for (const k of Object.keys(s)) {
                if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) {
                  t[k] = deepMerge((t[k] && typeof t[k] === 'object') ? t[k] : {}, s[k]);
                } else { t[k] = s[k]; }
              }
              return t;
            };
            const stage = (ref: any, data: any) => {
              const e = buffer.get(ref.path);
              if (e) { deepMerge(e.data, data); }
              else { buffer.set(ref.path, { ref, data: deepMerge({}, data) }); }
            };

            const usersCol   = db.collection('users');
            const indexesCol = db.collection('userindexes');
            const gshipCol   = db.collection('guardianship');

            // Base `workers` d'une AUTRE région (fiche d'un clan situé ailleurs que la maison du
            // joueur). Mono-région (RP vide) : tout est dans la même base.
            const RP = '@@@region@@@-';
            const HOME = RP ? RP.slice(0, -1) : '';
            const regionDbs = new Map<string, any>();
            const dbFor = (region: string): any => {
              if (!RP || !region || region === HOME) { return db; }
              if (!regionDbs.has(region)) { regionDbs.set(region, getFirestore(admin.app(), `${region}-workers`)); }
              return regionDbs.get(region);
            };
            // Région de la fiche `clanId` d'un joueur, lue dans son users (repli : maison).
            const clanRegion = (userData: any, clanId: string): string =>
              String((((userData || {}).clans || {})[clanId] || {}).region || HOME);
            const playerRef  = (clanId: string, uid: string, region: string = HOME) =>
              dbFor(region).collection('clans_players').doc(clanId).collection('players').doc(uid);

            // Représentants d'un enfant (guardian_id + co-représentants), lus dans guardianship.
            // Document absent ou clos (majeur) : aucun.
            const guardiansOf = async (childId: string): Promise<string[]> => {
              const g = await gshipCol.doc(childId).get();
              if (!g.exists) { return []; }
              const d: any = g.data() || {};
              if (String(d.closed_at || '')) { return []; }
              const all = [String(d.guardian_id || ''), ...(Array.isArray(d.guardians) ? d.guardians.map(String) : [])];
              return Array.from(new Set(all.filter((x) => !!x)));
            };

            // UID Firebase -> userId metier (via userindexes/{firebaseUid}.userId), repli sur
            // l'UID Firebase si aucun index (vieux comptes ou userId == firebaseUid).
            const resolveUserId = async (firebaseUid: string): Promise<string> => {
              try {
                const ix = await indexesCol.doc(firebaseUid).get();
                const mapped = ix.exists ? String((ix.data() || {}).userId || '') : '';
                return mapped || firebaseUid;
              } catch { return firebaseUid; }
            };

            // UID Firebase des comptes reellement supprimes (pour la purge du consentement).
            const fbUids = new Set<string>();

            // Desactive le(s) userindexes pointant vers ce userId metier (clef = UID Firebase,
            // retrouve par requete) et collecte l'UID Firebase correspondant.
            const disableAccountIndexes = async (uid: string) => {
              const snap = await indexesCol.where('userId', '==', uid).get();
              snap.forEach((d) => { fbUids.add(d.id); stage(d.ref, { enabled: false }); });
            };

            // Tombstone d'un membre (userId metier) dans un clan + desactivation du clan dans users.clans.
            // `region` = région du CLAN (sa fiche vit dans la base de cette région).
            const tombstone = (uid: string, clanId: string, region: string = HOME) => {
              stage(playerRef(clanId, uid, region), { id: uid, enabled: false, status: 'deleted', last_connected: now });
              stage(usersCol.doc(uid), { clans: { [clanId]: { enabled: false } } });
            };

            // La représentation d'un enfant supprimé est une PREUVE (5 ans) : on la clôt, jamais on
            // ne l'efface ici. `erase_after` dit quand elle pourra l'être.
            const closeGuardianship = async (childId: string) => {
              const ref = gshipCol.doc(childId);
              const g = await ref.get();
              if (!g.exists) { return; }
              const d: any = g.data() || {};
              const eraseAfter = new Date(Date.now() + 5 * 365 * 24 * 3600 * 1000).toISOString();
              stage(ref, String(d.closed_at || '')
                ? { deleted_at: now, erase_after: eraseAfter }
                : { closed_at: now, deleted_at: now, erase_after: eraseAfter });
            };

            const visited = new Set<string>();
            const queue: string[] = [];
            let rootSelfId = '';   // porte 1 : le compte qui se supprime lui-même

            // Un enfant garde-t-il un représentant après cette passe ? (représentant dont le
            // compte n'est pas en train d'être supprimé.) Si oui, la dissolution de son clan
            // d'origine ne l'emporte pas.
            const keepsGuardian = async (childId: string): Promise<boolean> => {
              const gs = await guardiansOf(childId);
              return gs.some((g) => !visited.has(g) && !queue.includes(g));
            };

            if (consentTarget) {
              // ==========================================================================
              // PORTE 2 : RETRAIT DU CONSENTEMENT PARENTAL, SUR UNE CIBLE UNIQUE.
              // ==========================================================================
              // L'appelant n'est pas la cible : son UID ne prouve rien. L'autorisation est
              // donc RECONSTRUITE ici, a partir de faits lus en base, et aucun n'est fourni
              // par le client. Deux variantes selon que l'enfant a une `guardianship`.
              const CONSENT_GRACE_DAYS = 3;   // miroir de _kConsentGraceDays (worker_members.dart)
              const callerIx = await indexesCol.doc(request.auth.uid).get();
              const callerData: any = callerIx.data() || {};
              const gSnap = await gshipCol.doc(consentTarget).get();

              if (gSnap.exists) {
                // ENFANT AVEC GUARDIANSHIP (multiclan). Quatre faits :
                //   1. l'appelant detient le secret de representation ET son userId est le
                //      representant ou un co-representant (le secret seul ne suffit pas :
                //      l'enfant le detient aussi) ;
                //   2. un retrait est pose (`consent.withdrawn_at`), non suivi d'un
                //      retablissement, et son delai de reflexion est ECHU ;
                //   3. l'enfant n'est pas majeur (`closed_at` vide) ;
                //   4. la date est lisible : sur un effacement irreversible, le doute
                //      profite toujours a l'attente.
                // Le retrait n'a PAS besoin d'avoir ete applique sur les fiches par l'app de
                // l'enfant : c'est tout l'objet de ce filet (l'enfant peut ne plus jamais
                // rouvrir le jeu).
                const g: any = gSnap.data() || {};
                const secret = String((((callerData.guardianships || {})[consentTarget]) || {}).secret || '');
                if (!callerIx.exists || callerData.enabled === false || !secret || secret !== String(g.ownerId || '')) {
                  throw new HttpsError('permission-denied', 'Not a guardian of this child');
                }
                const callerUserId = String(callerData.userId || '');
                const reps = [String(g.guardian_id || ''), ...(Array.isArray(g.guardians) ? g.guardians.map(String) : [])];
                if (!callerUserId || !reps.includes(callerUserId)) {
                  throw new HttpsError('permission-denied', 'Not a guardian of this child');
                }
                if (String(g.closed_at || '')) {
                  throw new HttpsError('permission-denied', 'Target is an adult');
                }
                const consent: any = g.consent || {};
                const withdrawnAt = Date.parse(String(consent.withdrawn_at || ''));
                const restoredAt  = Date.parse(String(consent.restored_at || '')) || 0;
                if (!Number.isFinite(withdrawnAt) || restoredAt >= withdrawnAt) {
                  throw new HttpsError('failed-precondition', 'No consent withdrawal pending');
                }
                if (withdrawnAt + CONSENT_GRACE_DAYS * 24 * 3600 * 1000 > Date.now()) {
                  throw new HttpsError('failed-precondition', 'Reflection period not elapsed');
                }
                // Le compte de l'enfant vit dans la region maison, celle de guardianship.
                const tUserSnap = await usersCol.doc(consentTarget).get();
                if (!tUserSnap.exists) {
                  return { ok: true, deleted: [], firebaseUids: [], skipped: 'not-in-region' };
                }
                queue.push(consentTarget);
              } else {
                // ENFANT SANS TELEPHONE (pas de guardianship, mono-clan) : la preuve reste
                // celle d'avant le multiclan, sur sa fiche du clan d'origine :
                //   1. l'appelant est bien membre actif de ce clan ;
                //   2. un retrait est reellement en cours sur la cible, et son delai de
                //      retractation est ECHU (le client ne fait que le signaler) ;
                //   3. ce clan est bien le clan d'ORIGINE de la cible ;
                //   4. la cible n'est pas majeure.
                if (!consentClanId) {
                  throw new HttpsError('invalid-argument', 'clanId required with consentTarget');
                }
                const callerClans: any = callerData.clans || {};
                const callerEntry: any = callerClans[consentClanId];
                if (!callerIx.exists || !callerEntry || callerEntry.enabled === false) {
                  throw new HttpsError('permission-denied', 'Not a member of this clan');
                }

                const tSnap = await playerRef(consentClanId, consentTarget).get();
                // Region etrangere (ou cible deja purgee) : meme sortie muette que le
                // garde-fou multi-region ci-dessous, et pour la meme raison.
                if (!tSnap.exists) {
                  return { ok: true, deleted: [], firebaseUids: [], skipped: 'not-in-region' };
                }
                const tdata: any = tSnap.data() || {};
                const due = String(tdata.consent_due || '');
                if (!due) {
                  throw new HttpsError('failed-precondition', 'No consent withdrawal pending');
                }
                const dueAt = Date.parse(due);
                if (!Number.isFinite(dueAt) || dueAt > Date.now()) {
                  throw new HttpsError('failed-precondition', 'Reflection period not elapsed');
                }
                if (String(tdata.original_clan || '') !== consentClanId) {
                  throw new HttpsError('permission-denied', 'Not the clan of origin');
                }
                if (String(tdata.legal_state || '') === 'a') {
                  throw new HttpsError('permission-denied', 'Target is an adult');
                }

                // ENFANT SANS COMPTE (`no_account`) : ni doc `users`, ni `userindexes`, ni
                // session de consentement. Ses donnees de jeu n'existent QU'au sein du clan. On
                // pose donc la pierre tombale a la main, sans passer par `tombstone()` qui
                // ecrirait aussi dans `users` : `set(..., {merge:true})` CREERAIT le document
                // absent, fabriquant un compte a un enfant qui n'en a jamais eu.
                const tUserSnap = await usersCol.doc(consentTarget).get();
                if (tUserSnap.exists) {
                  queue.push(consentTarget);
                } else {
                  stage(playerRef(consentClanId, consentTarget),
                        { id: consentTarget, enabled: false, status: 'deleted', last_connected: now });
                  visited.add(consentTarget);
                  await disableAccountIndexes(consentTarget);
                }
              }
            } else {
              const rootUserId = await resolveUserId(ownerId);

              // GARDE-FOU MULTI-REGION. Le site de suppression est unique alors que les
              // donnees sont partitionnees par region, et rien cote web ne dit ou vit
              // l'utilisateur : la page interroge donc CHAQUE region, dont la plupart
              // n'hebergent pas ce compte. Sans cette sortie anticipee, les
              // `batch.set(..., {merge: true})` plus bas CREERAIENT les documents absents
              // (users/{uid} avec enabled:false, documents_sessions/{uid}...) dans des
              // regions ou l'utilisateur n'a jamais mis les pieds.
              const [rootUserSnap, rootIndexSnap] = await Promise.all([
                usersCol.doc(rootUserId).get(),
                indexesCol.doc(ownerId).get(),
              ]);
              if (!rootUserSnap.exists && !rootIndexSnap.exists) {
                return { ok: true, deleted: [], firebaseUids: [], skipped: 'not-in-region' };
              }

              // SEUL REPRÉSENTANT D'UN ENFANT : suppression REFUSÉE. On ne désigne jamais un
              // représentant à la place de quelqu'un ; celui-ci doit d'abord ajouter un
              // co-représentant (échange en présence ou à distance) ou supprimer le compte de
              // l'enfant. L'app le dit avant ; ceci est la garde qui ne dépend d'aucune app.
              // Les enfants représentés sont ceux dont le secret est dans SON index (de cette
              // région : la page web interroge chaque région, chacune vérifie les siens).
              const ixData: any = rootIndexSnap.exists ? (rootIndexSnap.data() || {}) : {};
              const soleFor: string[] = [];
              for (const childId of Object.keys(ixData.guardianships || {})) {
                if (childId === rootUserId) { continue; }   // sa propre représentation d'enfant
                const gs = await guardiansOf(childId);
                if (gs.includes(rootUserId) && gs.every((x) => x === rootUserId)) { soleFor.push(childId); }
              }
              if (soleFor.length) {
                throw new HttpsError('failed-precondition', 'Sole guardian', { children: soleFor });
              }

              fbUids.add(ownerId);
              rootSelfId = rootUserId;
              queue.push(rootUserId);
            }

            while (queue.length) {
              const uid = queue.shift()!;
              if (visited.has(uid)) { continue; }
              visited.add(uid);

              const userSnap = await usersCol.doc(uid).get();
              const userData: any = userSnap.data() || {};
              const clans = Object.keys(userData.clans || {});

              // MULTICLAN, MULTI-RÉGION : un membre d'un clan d'ici peut avoir sa maison (son
              // `users`) dans une autre région. Son compte n'est pas dans cette base : on
              // n'y écrit RIEN (`set(..., {merge:true})` créerait un faux compte), le
              // tombstone de sa fiche d'ici suffit. Seule exception : la racine de la porte 1,
              // dont l'absence de `users` est déjà filtrée par le garde-fou multi-région.
              if (!userSnap.exists && uid !== rootSelfId) { continue; }

              // Désactive le compte lui-même (users + ses userindexes retrouves par requete).
              stage(usersCol.doc(uid), { enabled: false });
              await disableAccountIndexes(uid);
              // Enfant représenté : sa représentation est close et gardée comme preuve.
              await closeGuardianship(uid);

              for (const clanId of clans) {
                const region = clanRegion(userData, clanId);
                const cdb = dbFor(region);
                tombstone(uid, clanId, region);

                // Chef unique ? Le fondateur est admin à vie → seul admin ⇔ dissolution du clan.
                const clanSnap = await cdb.collection('clans').doc(clanId).get();
                const cdata: any = clanSnap.data() || {};
                const admins: any[] = Array.isArray(cdata.admins) ? cdata.admins : [];
                if (!(admins.includes(uid) && admins.length <= 1)) { continue; }

                // Le clan lui-meme. `clan_purge` pose deja ces deux champs (cf. sa fonction
                // `dissolve`) ; ce chemin-ci se contentait de LIRE le document pour tester
                // `admins`, et laissait donc `enabled: true` sur un clan qu'il venait de
                // vider. Le readme (section 16) dit pourtant `false` + `dissolved_at` = clan
                // dissous, et `pulse_sweeper` ecarte les clans sur ce booleen : sans cette
                // ecriture il reprend a chaque passe un clan dont plus personne n'est membre.
                stage(cdb.collection('clans').doc(clanId), { enabled: false, dissolved_at: now });

                // Dissolution : tombstone de TOUS les membres encore actifs, cascade si besoin.
                const players = await cdb.collection('clans_players').doc(clanId).collection('players').get();
                for (const p of players.docs) {
                  const pid = p.id;
                  if (pid === uid) { continue; }
                  const pdata = p.data() || {};
                  if (pdata.enabled === false) { continue; }

                  tombstone(pid, clanId, region);

                  // Cascade de suppression du membre si : mineur dont le clan d'origine est
                  // dissous et qui n'a plus aucun représentant (MULTICLAN : un co-représentant
                  // le garde, son app fera du clan de celui-ci son clan d'origine), OU plus
                  // aucun autre clan actif.
                  const isMinor      = String(pdata.legal_state ?? '') !== 'a';
                  const originalClan = String(pdata.original_clan ?? '');
                  let cascade = isMinor && originalClan === clanId && !(await keepsGuardian(pid));
                  if (!cascade) {
                    const pUser  = (await usersCol.doc(pid).get()).data() || {};
                    const pClans = pUser.clans || {};
                    // Un clan compte comme actif s'il ne l'était pas déjà désactivé à l'origine
                    // ET n'a pas été tombstoné plus tôt dans cette passe (ex. autre clan dissous).
                    const stagedEntry  = buffer.get(usersCol.doc(pid).path);
                    const stagedClans  = (stagedEntry && stagedEntry.data.clans) || {};
                    const otherActive = Object.keys(pClans).some(
                      (cid) => cid !== clanId
                            && (pClans[cid] || {}).enabled !== false
                            && (stagedClans[cid] || {}).enabled !== false,
                    );
                    cascade = !otherActive;
                  }
                  if (cascade && !visited.has(pid)) { queue.push(pid); }
                }
              }
            }

            // Flush : lots de 450 opérations (limite Firestore = 500).
            const entries = Array.from(buffer.values());
            const commits = [];
            for (let i = 0; i < entries.length; i += 450) {
              const batch = db.batch();
              for (const e of entries.slice(i, i + 450)) { batch.set(e.ref, e.data, { merge: true }); }
              commits.push(batch.commit());
            }
            await Promise.all(commits);

            // Retrait du consentement (base documents) pour chaque compte RÉELLEMENT supprimé par
            // la cascade (set `visited`, pas les simples tombstones de clan).
            // SOFT delete horodaté, et non plus effacement : la preuve de ce qui a été accepté doit
            // survivre au compte — c'est toute sa raison d'être, et la politique de confidentialité
            // la conserve 5 ans à ce titre. On la CLÔT (date_end) et on la désactive.
            // `enabled: false` est ce que la reprise de session relit pour ne PAS restaurer
            // accepted_versions : sans lui, un utilisateur qui revient sauterait l'écran CGU
            // (hasNewDocuments === false). Cf. _restoreSessionFromFirestore côté client.
            // ⚠ BLOC RECOPIÉ dans `pulse_sweeper` (piste ORPHELINS, `sweepOrphans`) : toute
            //   correction ici doit y être portée, et inversement.
            const docsDb = getFirestore(admin.app(), '@@@region@@@_documents');
            // Le consentement peut etre keye par UID Firebase OU par userId metier : on traite
            // l'union des deux ensembles (un id inexistant = simple no-op).
            const consentIds = new Set<string>([...Array.from(visited), ...Array.from(fbUids)]);
            const consentWrites = [];
            for (const cid of consentIds) {
              // JAMAIS en aveugle : `set(..., {merge:true})` CREE le document absent. Un
              // enfant sans compte (`no_account`) traverse la cascade sans avoir jamais
              // ouvert de session ni accepte quoi que ce soit — lui fabriquer une session
              // close inventerait une trace de consentement la ou il n'y en a jamais eu.
              const sref = docsDb.collection('documents_sessions').doc(cid);
              if ((await sref.get()).exists) {
                consentWrites.push({ ref: sref, data: { enabled: false, date_end: now } });
              }
              const acc = await docsDb.collection('documents_acceptance').where('ownerId', '==', cid).get();
              acc.forEach((d) => {
                // Ne jamais réécrire une date_end déjà posée : une acceptation close par une version
                // plus récente garde la date de SA fin, pas celle du retrait du compte.
                const already = String((d.data() || {}).date_end || '');
                consentWrites.push({
                  ref:  d.ref,
                  data: already ? { enabled: false } : { enabled: false, date_end: now },
                });
              });
            }
            for (let i = 0; i < consentWrites.length; i += 450) {
              const batch = docsDb.batch();
              for (const w of consentWrites.slice(i, i + 450)) { batch.set(w.ref, w.data, { merge: true }); }
              await batch.commit();
            }

            return { ok: true, deleted: Array.from(visited), firebaseUids: Array.from(fbUids) };
          });
      # -----------------------------------------------------------------------------
      # Purge des clans : défaut de paiement (J780) OU abandon (24 mois de silence)
      # -----------------------------------------------------------------------------
      # DEUX POSEURS DE DRAPEAU, UNE SEULE PURGE. `purge_due` est posé soit par le
      # balayage d'impayé de pustore, soit par la piste SOMMEIL de `pulse_sweeper`
      # (`purge_reason: 'idle'`, clan sans abonnement vivant dont plus aucun membre ne
      # s'est connecté depuis deux ans, préavis d'un mois envoyé aux adultes). Il ne doit
      # exister qu'un chemin qui dissout : une cascade irréversible écrite deux fois est
      # déjà un danger (cf. plus bas), trois fois serait une faute.
      #
      # `pustore` ne supprime JAMAIS une donnée métier : à J780 son balayage pose
      # `purge_due` et s'arrête là, par conception — définir ce que « supprimer »
      # veut dire chez soi est une décision applicative aux conséquences
      # irréversibles. C'est cette décision-ci, et elle est annoncée aux CGU
      # (article « Défaut de paiement », deux ans après le blocage).
      #
      # SUPPRESSION FONCTIONNELLE, comme delete_user_data et comme l'annonce la
      # politique de confidentialité (§ 8 : « suppression fonctionnelle immédiate,
      # puis conservation limitée hors du service, puis effacement définitif ») :
      # tombstones, `enabled: false`. L'effacement matériel à
      # 30 jours est une étape distincte, commune aux deux chemins de suppression, et
      # elle n'est pas plus livrée pour l'un que pour l'autre.
      #
      # ⚠ La cascade ci-dessous est un DOUBLON de celle de delete_user_data. Ce n'est
      # pas un choix : pucloudfunction déploie un `index.ts` par fonction, sans
      # bibliothèque partagée entre elles. Toute correction de l'une doit être portée
      # dans l'autre — c'est une suppression irréversible, deux implémentations qui
      # divergeraient seraient un vrai danger.
      clan_purge:
        entry_point: clanPurge
        trigger: http
        memory: 512
        service_account: backend
        timeout: 540
        code: |
          import { onRequest } from 'firebase-functions/v2/https';
          import * as admin from 'firebase-admin';
          import { getFirestore, Timestamp, FieldValue } from 'firebase-admin/firestore';
          admin.initializeApp();

          export const clanPurge = onRequest(async (_req, res) => {

            const db  = getFirestore(admin.app(), '@@@region@@@_workers');
            const now = new Date().toISOString();

            // Idempotence par `purged_at` et non en effaçant `purge_due` : le drapeau
            // est ce qui empêche le balayage de pustore de le reposer (sa garde est
            // `!d.purge_due`). L'effacer relancerait une purge par jour, indéfiniment.
            const snap    = await db.collection('clans_store').where('purge_due', '==', true).get();
            const pending = snap.docs.filter((d) => !(d.data() || {}).purged_at);

            // GARDE DE RÉVEIL, pour les seules purges d'abandon. Le drapeau est posé par
            // la passe horaire du pulse et honoré ici le soir : entre les deux, une famille
            // peut avoir rouvert le jeu, précisément parce que le préavis l'y a invitée.
            // L'effacer quand même, ce serait punir la seule réponse qu'on lui demandait.
            //
            // On compare à `idle_last_seen`, la dernière connexion OBSERVÉE au moment de
            // poser le drapeau, et non à un seuil de conf : la question n'est pas « le clan
            // dort-il assez ? », c'est « quelqu'un est-il revenu depuis ? ».
            //
            // ⚠ UNE LECTURE RATÉE N'EFFACE RIEN. L'erreur possible dans ce sens coûte une
            //   journée ; dans l'autre, elle détruit un clan vivant.
            const due: any[] = [];
            let woken = 0;
            for (const doc of pending) {
              const data = doc.data() || {};
              if (String(data.purge_reason || '') !== 'idle') { due.push(doc); continue; }
              try {
                const seenAt  = Date.parse(String(data.idle_last_seen || '')) || 0;
                const members = await db.collection('clans_players').doc(doc.id).collection('players').get();
                let lastSeen = 0;
                for (const m of members.docs) {
                  const md = m.data() || {};
                  if (md.enabled === false || md.status === 'deleted') { continue; }
                  const at = Date.parse(String(md.last_connected || '')) || 0;
                  if (at > lastSeen) { lastSeen = at; }
                }
                if (!seenAt || lastSeen > seenAt) {
                  await doc.ref.set({
                    purge_due: FieldValue.delete(), purge_reason: FieldValue.delete(),
                    idle_last_seen: FieldValue.delete(), updated_at: Timestamp.now(),
                  }, { merge: true });
                  woken++;
                  console.log('[clan_purge] réveillé avant effacement :', doc.id);
                  continue;
                }
                due.push(doc);
              } catch (e) {
                console.log('[clan_purge] garde de réveil illisible, purge reportée :', doc.id, String(e));
              }
            }

            if (!due.length) {
              res.status(200).json({ scanned: snap.size, purged: 0, woken });
              return;
            }

            // --- Helpers de cascade (miroir de delete_user_data) -----------------
            const buffer = new Map<string, any>();
            const deepMerge = (t: any, s: any): any => {
              for (const k of Object.keys(s)) {
                if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) {
                  t[k] = deepMerge((t[k] && typeof t[k] === 'object') ? t[k] : {}, s[k]);
                } else { t[k] = s[k]; }
              }
              return t;
            };
            const stage = (ref: any, data: any) => {
              const e = buffer.get(ref.path);
              if (e) { deepMerge(e.data, data); }
              else { buffer.set(ref.path, { ref, data: deepMerge({}, data) }); }
            };

            const usersCol   = db.collection('users');
            const indexesCol = db.collection('userindexes');
            const playerRef  = (clanId: string, uid: string) =>
              db.collection('clans_players').doc(clanId).collection('players').doc(uid);

            const tombstone = (uid: string, clanId: string) => {
              stage(playerRef(clanId, uid), { id: uid, enabled: false, status: 'deleted', last_connected: now });
              stage(usersCol.doc(uid), { clans: { [clanId]: { enabled: false } } });
            };

            // UID Firebase des comptes reellement supprimes. Le consentement peut etre
            // keye par l'un ou l'autre espace d'identifiants, et c'est ici, en traduisant
            // le userId metier, qu'on tient les deux a la fois — plus tard le document
            // `userindexes` sera desactive et la correspondance introuvable.
            const fbUids = new Set<string>();

            const disableAccountIndexes = async (uid: string) => {
              const snapIx = await indexesCol.where('userId', '==', uid).get();
              snapIx.forEach((d) => { fbUids.add(d.id); stage(d.ref, { enabled: false }); });
            };

            // MULTICLAN (miroir de delete_user_data) : un enfant dont le clan d'origine est
            // dissous n'est PAS supprimé s'il garde un représentant (guardianship non close,
            // représentant dont le compte n'est pas supprimé par cette passe). Sa représentation,
            // si l'enfant est supprimé, est close et gardée comme preuve (5 ans).
            const gshipCol = db.collection('guardianship');
            const keepsGuardian = async (childId: string): Promise<boolean> => {
              const g = await gshipCol.doc(childId).get();
              if (!g.exists) { return false; }
              const d: any = g.data() || {};
              if (String(d.closed_at || '')) { return false; }
              const gs = [String(d.guardian_id || ''), ...(Array.isArray(d.guardians) ? d.guardians.map(String) : [])]
                .filter((x) => !!x);
              return gs.some((x) => !deleted.has(x));
            };
            const closeGuardianship = async (childId: string) => {
              const ref = gshipCol.doc(childId);
              const g = await ref.get();
              if (!g.exists) { return; }
              const d: any = g.data() || {};
              const eraseAfter = new Date(Date.now() + 5 * 365 * 24 * 3600 * 1000).toISOString();
              stage(ref, String(d.closed_at || '')
                ? { deleted_at: now, erase_after: eraseAfter }
                : { closed_at: now, deleted_at: now, erase_after: eraseAfter });
            };

            // Dissout un clan : tous ses membres actifs sont tombstonés, et ceux qui
            // perdent leur responsable légal (mineur dont le clan d'origine est celui
            // qu'on dissout) ou leur dernier clan actif sont eux-mêmes supprimés — ce
            // qui peut dissoudre d'autres clans dont ils étaient chef unique, d'où la
            // file d'attente.
            const dissolved: string[] = [];
            const deleted   = new Set<string>();

            const dissolve = async (rootClanId: string) => {
              const clanQueue: string[] = [rootClanId];
              const seenClans = new Set<string>();

              while (clanQueue.length) {
                const clanId = clanQueue.shift()!;
                if (seenClans.has(clanId)) { continue; }
                seenClans.add(clanId);
                dissolved.push(clanId);

                // Le clan lui-même : marqué dissous, comme le fait delete_user_data.
                stage(db.collection('clans').doc(clanId), { enabled: false, dissolved_at: now });

                const players = await db.collection('clans_players').doc(clanId).collection('players').get();
                for (const p of players.docs) {
                  const pid   = p.id;
                  const pdata = p.data() || {};
                  if (pdata.enabled === false) { continue; }

                  tombstone(pid, clanId);

                  // Faut-il supprimer le COMPTE du membre, et pas seulement le retirer
                  // du clan ? Oui s'il n'a plus de responsable légal, ou plus aucun
                  // autre clan actif. Un enfant sans compte (no_account) n'a rien
                  // d'autre que ce clan : le tombstone ci-dessus suffit.
                  const isMinor      = String(pdata.legal_state ?? '') !== 'a';
                  const originalClan = String(pdata.original_clan ?? '');
                  // Compte d'une autre région (multiclan) : rien à supprimer ici, le
                  // tombstone de sa fiche suffit (`merge` créerait un faux compte).
                  const pUserSnap = await usersCol.doc(pid).get();
                  if (!pUserSnap.exists) { continue; }
                  let cascade = isMinor && originalClan === clanId && !(await keepsGuardian(pid));
                  if (!cascade) {
                    const pUser  = pUserSnap.data() || {};
                    const pClans = pUser.clans || {};
                    const stagedEntry = buffer.get(usersCol.doc(pid).path);
                    const stagedClans = (stagedEntry && stagedEntry.data.clans) || {};
                    const otherActive = Object.keys(pClans).some(
                      (cid) => cid !== clanId
                            && (pClans[cid] || {}).enabled !== false
                            && (stagedClans[cid] || {}).enabled !== false,
                    );
                    cascade = !otherActive;
                  }
                  if (!cascade || deleted.has(pid)) { continue; }

                  deleted.add(pid);
                  stage(usersCol.doc(pid), { enabled: false });
                  await disableAccountIndexes(pid);
                  await closeGuardianship(pid);

                  // Chef unique d'un autre clan ? Le fondateur est admin à vie, donc
                  // seul admin ⇔ dissolution de ce clan-là aussi.
                  const pUser2 = (await usersCol.doc(pid).get()).data() || {};
                  for (const cid of Object.keys(pUser2.clans || {})) {
                    if (seenClans.has(cid)) { continue; }
                    const c: any = (await db.collection('clans').doc(cid).get()).data() || {};
                    const admins: any[] = Array.isArray(c.admins) ? c.admins : [];
                    if (admins.includes(pid) && admins.length <= 1) { clanQueue.push(cid); }
                  }
                }
              }
            };

            for (const doc of due) { await dissolve(doc.id); }

            // Flush : lots de 450 opérations (limite Firestore = 500).
            const entries = Array.from(buffer.values());
            for (let i = 0; i < entries.length; i += 450) {
              const batch = db.batch();
              for (const e of entries.slice(i, i + 450)) { batch.set(e.ref, e.data, { merge: true }); }
              await batch.commit();
            }

            // Retrait du consentement (base documents), MIROIR de delete_user_data : ce
            // chemin-ci ne le faisait pas, et l'oubli ne se voyait qu'au retour du joueur.
            // `enabled: false` est ce que la reprise de session relit pour ne PAS restaurer
            // `accepted_versions` (cf. _restoreSessionFromFirestore) : sans lui, un compte
            // supprimé avec son clan qui revient un jour saute l'écran CGU — il rejoue sans
            // avoir réaccepté, et sans que le consentement parental soit à nouveau recueilli
            // s'il est mineur. La preuve, elle, n'est pas effacée mais CLOSE et datée : elle
            // doit survivre au compte, c'est sa raison d'être, et la politique de
            // confidentialité la conserve 5 ans à ce titre.
            const docsDb = getFirestore(admin.app(), '@@@region@@@_documents');
            const consentIds = new Set<string>([...Array.from(deleted), ...Array.from(fbUids)]);
            const consentWrites = [];
            for (const cid of consentIds) {
              // JAMAIS en aveugle : `set(..., {merge:true})` CREE le document absent. Un
              // enfant sans compte (`no_account`) traverse la cascade sans avoir jamais
              // ouvert de session ni accepte quoi que ce soit — lui fabriquer une session
              // close inventerait une trace de consentement la ou il n'y en a jamais eu.
              const sref = docsDb.collection('documents_sessions').doc(cid);
              if ((await sref.get()).exists) {
                consentWrites.push({ ref: sref, data: { enabled: false, date_end: now } });
              }
              const acc = await docsDb.collection('documents_acceptance').where('ownerId', '==', cid).get();
              acc.forEach((d) => {
                // Ne jamais réécrire une date_end déjà posée : une acceptation close par une
                // version plus récente garde la date de SA fin, pas celle de la purge.
                const already = String((d.data() || {}).date_end || '');
                consentWrites.push({
                  ref:  d.ref,
                  data: already ? { enabled: false } : { enabled: false, date_end: now },
                });
              });
            }
            for (let i = 0; i < consentWrites.length; i += 450) {
              const batchD = docsDb.batch();
              for (const w of consentWrites.slice(i, i + 450)) { batchD.set(w.ref, w.data, { merge: true }); }
              await batchD.commit();
            }

            // Marquage et journal de facturation.
            for (const doc of due) {
              const data    = doc.data() || {};
              const ownerId = String(data.ownerId || '');
              await doc.ref.set({ purged_at: Timestamp.now(), updated_at: Timestamp.now() }, { merge: true });
              // La RAISON au journal : une purge d'abandon n'a pas d'état commercial à
              // citer, et la confondre avec la fin d'un impayé fausserait la piste d'audit
              // le jour où une famille demanderait pourquoi son clan a disparu.
              await doc.ref.collection('events').add({
                ownerId, type: 'purge',
                reason: String(data.purge_reason || 'dunning'),
                state:  String(data.state || 'none'),
                created_at: Timestamp.now(),
              });
            }

            const report = { scanned: snap.size, purged: due.length, woken,
                             clans: dissolved.length, accounts: deleted.size,
                             consents: consentWrites.length };
            console.log('[clan_purge]', JSON.stringify(report));
            res.status(200).json(report);
          });

      # -----------------------------------------------------------------------------
      # Balayeur de relance d'engagement
      # -----------------------------------------------------------------------------
      # Une famille qui décroche est une famille que plus personne n'ouvre : aucun client
      # ne peut donc détecter son propre décrochage. C'est la même raison qui met le
      # balayage des impayés au serveur, et le même patron — `store_sweeper` de pustore.
      #
      # DEUX PRINCIPES portent tout le reste :
      #
      #  1. L'unité de relance est le CLAN, pas l'événement. Trois enfants avec trois
      #     validations en souffrance donnent UNE notification au parent, pas trois.
      #  2. La condition d'entrée est le SILENCE, pas l'événement. Un parent qui ouvre
      #     l'app tous les jours et laisse traîner une validation fait un choix ; le
      #     relancer serait du harcèlement, pas de la relance.
      #
      # Deux pistes, cloisonnées, une notification maximum par personne et par passe :
      #   - piste ADULTE  → les chefs (`clans.admins`). Onboarding, validation en
      #     souffrance, coffre oublié ou jamais rempli.
      #   - piste ENFANT  → les membres non-admins. JAMAIS d'administration de clan,
      #     JAMAIS rien de monétaire. Le boss (clan entièrement silencieux) et le retour
      #     du clan (clan reparti sans eux).
      #
      # Le « monstre de poussière » EXISTE : la fonction pose un vrai `recommended` sur
      # une vraie tâche dormante avant d'annoncer quoi que ce soit. Annoncer un monstre
      # qu'on ne crée pas, c'est mentir à un enfant qui va vérifier.
      #
      # ⚠ Le helper `notify()` est un PORTAGE de celui de pustore (config.yml du module,
      # fonction store_sweeper). Comme pour la cascade dupliquée de clan_purge, ce n'est
      # pas un choix : pucloudfunction déploie un `index.ts` par fonction, sans
      # bibliothèque partagée. Il en corrige en revanche un défaut — voir `push()`.
      pulse_sweeper:
        entry_point: pulseSweeper
        trigger: http
        memory: 512
        service_account: pulse
        timeout: 540
        # Le droit d'APPELER la fonction, nommé pour le compte d'exploitation — celui
        # que porte `build/tools/pulse_bench.py`.
        #
        # ⚠ CE N'EST PAS UNE OUVERTURE. `pucloudfunction` ne pose `allUsers` que si ce
        #   champ vaut littéralement "allUsers" ; ici il nomme une identité unique, et la
        #   fonction reste privée pour tout le reste du monde.
        #
        # ⚠ CE N'EST PAS NON PLUS L'ACCÈS DU PLANIFICATEUR. Cloud Scheduler entre par le
        #   rôle `run.invoker` du compte `pulse` (posé par `pusvcaccount`), pas par ici :
        #   le champ n'accepte qu'un seul membre, et les deux chemins coexistent.
        #
        # ⚠ ET CE N'EST PAS UN DÉBLOCAGE : le compte maître appelait DÉJÀ la fonction,
        #   par un octroi large au niveau du projet. C'est justement pourquoi la ligne a
        #   sa place ici — elle nomme le seul accès dont le banc a besoin, à l'endroit
        #   où on le cherchera. Le jour où l'octroi large sera resserré, ce qui doit
        #   arriver, le banc continuera de fonctionner et personne n'aura à deviner
        #   pourquoi il ne fonctionnait plus.
        invoker: "serviceAccount:asura-service@asura-888.iam.gserviceaccount.com"
        environment:
          # Interrupteur général. Une fonction qui va chercher des familles inactives doit
          # pouvoir être coupée sans redéploiement de code.
          PULSE_ENABLED: "true"
          # Mode simulation : la passe calcule tout, journalise tout, N'ENVOIE RIEN et
          # n'écrit aucun état.
          #
          # ⚠ C'EST LE DERNIER GESTE DU CHANTIER, ET IL SE FAIT APRÈS LA RECETTE. Passer
          #   à "false" ici met les relances en service au prochain déploiement, pour de
          #   bon. Rien ne presse : le banc d'essai n'a pas besoin qu'on y touche —
          #   `?dry=0` prime sur cette valeur, requête par requête
          #   (`build/tools/pulse_bench.py --send`). On éprouve d'abord, on ouvre ensuite.
          #
          # ⚠ IL Y AVAIT DEUX VERROUS ET NON UN, et c'est ce qui rendait celui-ci
          #   trompeur. Le défaut du code qui lit cette variable (`DRY_ENV`, plus bas)
          #   valait lui aussi 'true' : la retirer d'ici remettait la fonction en
          #   simulation SANS QUE RIEN NE LE DISE — même rapport, même allure, et plus
          #   une seule relance. Le défaut a été remis à 'false' le 2026-09-10 ; il ne
          #   reste donc plus ici qu'un seul interrupteur, et il dit ce qu'il fait.
          #
          # Pour couper les relances sans redéployer, c'est `PULSE_ENABLED` qu'il faut —
          # lui arrête la passe et le DIT dans sa réponse (`{skipped: 'disabled'}`).
          PULSE_DRY_RUN: "true"
          # Piste ORPHELINS : effacement des comptes connectés qui ne sont JAMAIS entrés
          # dans un clan, après `orphans.after_days` sans connexion (cf. le code).
          #
          # ⚠ SON PROPRE INTERRUPTEUR, ET IL EST FERMÉ. C'est la seule piste de cette
          #   fonction qui EFFACE pour de bon (compte de connexion compris), là où les
          #   autres envoient ou posent un drapeau. Elle suit en plus le mode simulation
          #   ci-dessus : l'ouvrir ici ne suffit pas tant que `PULSE_DRY_RUN` vaut "true".
          #   On l'éprouve d'abord à la demande (`?orphans=1`, simulation forcée tant que
          #   cet interrupteur est fermé), on l'ouvre ensuite.
          #
          # Absente, la variable vaut "false" dans le code aussi. Ce n'est PAS le second
          # verrou invisible dénoncé plus haut : la réponse de chaque passe le DIT
          # (`orphans: 'disabled'`), et se tromper dans ce sens retarde un effacement au
          # lieu d'en provoquer un.
          PULSE_ORPHANS_ENABLED: "false"
          # Heure UTC (celle du planificateur, cf. puscheduler) de l'UNIQUE passe
          # quotidienne de la piste orphelins. La fonction tourne toutes les heures ; un
          # effacement n'a aucune raison d'être tenté vingt-quatre fois par jour, et la
          # nuit européenne est l'heure où le moins de monde se connecte pendant qu'on
          # efface. Valeur illisible ou hors 0-23 : repli sur 3.
          PULSE_ORPHANS_HOUR: "3"
          # Calendrier entièrement déclaratif, sur le modèle de STORE_LIFECYCLE.
          #   silent_after_hours — en-deçà, le clan est vivant : silence total
          #   forget_days        — au-delà, le joueur est parti : on cesse de le relire.
          #                        C'est l'arrêt définitif, obtenu par la BORNE BASSE de la
          #                        requête plutôt que par un compteur — sans lui, la
          #                        population des dormants ne ferait que grossir
          #   young_days         — fenêtre pendant laquelle un clan relève de l'onboarding
          #   adult_cadence      — jours de silence déclenchant la 1re, 2e, 3e relance
          #                        adulte. Après le dernier palier : silence définitif.
          #                        Trois messages ignorés SONT une réponse
          #   comeback_cadence   — idem, piste « retour du clan » (membres non-chefs)
          #   boss_after_days    — silence minimum avant de convoquer un boss
          #   boss_every_days    — plafond entre deux boss serveur. `recommended` accorde
          #                        un BONUS D'XP RÉEL : un boss automatique tous les trois
          #                        jours déréglerait la progression et viderait de son sens
          #                        l'option « Recommander » du chef
          #   chest_idle_days    — coffre non ouvert depuis ce délai
          #   sleep              — CLAN ENDORMI, piste à part (décision du 2026-09-16).
          #                        Au-delà de `forget_days` les relances de jeu se taisent
          #                        pour de bon ; au-delà de `reminder_days[0]` commence une
          #                        autre histoire, qui n'est plus une relance mais le sort
          #                        des données d'un clan que plus personne n'ouvre :
          #                          reminder_days — jours de silence de CHAQUE rappel doux
          #                                          (6, 12, 18 mois). Un palier manqué ne
          #                                          se rattrape pas en rafale : on saute
          #                                          au dernier palier atteint, un seul
          #                                          message part
          #                          notice_days   — le PRÉAVIS d'effacement, un mois avant
          #                          purge_days    — pose `purge_due` sur clans_store, que
          #                                          `clan_purge` honore le soir même
          #                        Un clan ABONNÉ n'est jamais concerné (il paie, il a le
          #                        droit de dormir), ni un clan en défaut de paiement, qui
          #                        a son propre calendrier. `purge_days - notice_days` est
          #                        aussi le délai MINIMUM entre le préavis et l'effacement :
          #                        un clan découvert déjà très ancien reçoit d'abord son
          #                        préavis, et n'est effacé qu'un mois après
          #   windows            — fenêtre d'envoi LOCALE, par statut légal :
          #                        {minor|adult: {days, from, to}}. `days` en convention
          #                        JS (0 = dimanche … 6 = samedi), `from`/`to` en heures
          #                        locales, borne haute exclue
          #   tz_default_minutes — décalage de repli quand `tz_offset` manque sur le
          #                        document membre (compte antérieur au champ)
          #   orphans            — COMPTE JAMAIS ADMIS, piste à part (décision du
          #                        2026-09-22) :
          #                          after_days    — jours sans connexion avant effacement.
          #                                          C'est une PROMESSE des politiques de
          #                                          confidentialité (« après 30 jours sans
          #                                          connexion ») : ne pas la changer ici
          #                                          sans changer les documents légaux
          #                          lookback_days — largeur de la fenêtre de la requête
          #                                          principale, au-delà de `after_days`
          #
          # Les textes qui peuvent atteindre un enfant — le boss et le retour du clan —
          # obéissent à deux interdits, dans les sept langues : ne JAMAIS nommer ni
          # compter les autres membres (cela fabriquerait une comparaison entre frères et
          # sœurs à chaque relance), et parler de la place gardée, jamais de l'absence
          # remarquée.
          #
          # L'HEURE D'ENVOI SE CHOISIT SUR LE STATUT LÉGAL, JAMAIS SUR LE RÔLE.
          #
          #  - Un MINEUR n'est joint que le SAMEDI MATIN. En semaine, la fin d'après-midi
          #    est prise par les devoirs, le dîner et la douche : une notification de jeu
          #    n'y trouve pas de place, elle en déplace une. On attend le week-end plutôt
          #    que de s'inviter dans la routine d'un enfant.
          #  - Un MAJEUR est joint en fin d'après-midi, tous les jours : ni aux horaires
          #    de bureau, ni tard le soir — un verdict rendu à 17 h récompense l'enfant
          #    avant le coucher, rendu à 22 h il ne récompense plus personne.
          #
          # ⚠ « CHEF DE CLAN » N'EST PAS « ADULTE ». Un majeur peut être simple membre
          #   (second parent, adulte invité), et `clans.admins` est une liste de RÔLE :
          #   rien ne garantit qu'un binaire antérieur n'y ait pas inscrit un mineur —
          #   c'est écrit noir sur blanc dans l'avertissement de `clan_purge`. Le rôle
          #   décide QUEL motif part, le statut légal décide QUAND. Les confondre ferait
          #   tomber une notification chez un enfant à l'heure des adultes.
          #
          # ⚠ ET C'EST CE QUI SERT `tz_offset`. Le champ est collecté à chaque login
          #   depuis des mois, et les politiques de confidentialité publiées annoncent
          #   qu'il « ne sert qu'à une chose : envoyer les rappels destinés à un enfant à
          #   une heure raisonnable ». Sans ces fenêtres, la donnée était collectée pour
          #   une finalité qui n'était pas servie.
          PULSE_LIFECYCLE: >-
            {"silent_after_hours":48,
             "forget_days":30,
             "young_days":14,
             "adult_cadence":[2,5,12],
             "comeback_cadence":[7,21],
             "boss_after_days":7,
             "boss_every_days":14,
             "chest_idle_days":21,
             "sleep":{"reminder_days":[180,360,540],"notice_days":700,"purge_days":730},
             "windows":{"minor":{"days":[6],"from":9,"to":10},
                        "adult":{"days":[0,1,2,3,4,5,6],"from":17,"to":18}},
             "tz_default_minutes":60,
             "orphans":{"after_days":30,"lookback_days":30},
             "default_lang":"fr",
             "title":"Donjons & Savons",
             "notify":{"database":"messaging","collection":"msgregistry","match_field":"ownerId",
                       "identity_collection":"userindexes","identity_field":"userId"},
             "texts":{
               "fr":{"onboarding_empty":"Votre donjon vous attend, mais il est encore vide. Ajoutez votre première tâche en trente secondes.",
                     "onboarding_idle":"Les tâches sont prêtes, le donjon aussi. Il ne manque plus qu'un premier aventurier pour s'y lancer.",
                     "onboarding_alone":"Votre donjon tourne, mais vous y êtes seul. Le QR code qui fait entrer votre famille vous attend dans l'onglet Clan.",
                     "validation":"Une tâche a été menée à son terme et attend votre verdict pour être récompensée.",
                     "validation_open":"Une tâche a été menée à son terme et attend votre verdict. Touchez pour l'ouvrir.",
                     "chest_full":"Le coffre du clan déborde. Une cérémonie d'ouverture ferait des heureux.",
                     "chest_empty":"Le coffre du clan est vide. Un butin à y déposer donnerait un but aux prochaines tâches.",
                     "boss":"Un monstre de poussière vient d'apparaître dans votre donjon. Votre aide est nécessaire !",
                     "comeback":"Le donjon a rouvert ses portes. Votre place y est gardée au chaud.",
                     "sleep_reminder":"Votre clan vous attend toujours. Tout y est resté en place : les tâches, les niveaux, le butin.",
                     "sleep_notice":"Votre clan dort depuis près de deux ans. Sans retour d'ici un mois, il sera effacé. Ouvrir le jeu suffit à le garder."},
               "en":{"onboarding_empty":"Your dungeon awaits, but it is still empty. Add your first task in thirty seconds.",
                     "onboarding_idle":"The tasks are ready and so is the dungeon. All it needs is a first adventurer to set off.",
                     "onboarding_alone":"Your dungeon is running, but you are alone in it. The QR code that brings your family in is waiting in the Clan tab.",
                     "validation":"A task has been completed and is waiting for your verdict to be rewarded.",
                     "validation_open":"A task has been completed and is waiting for your verdict. Tap to open it.",
                     "chest_full":"The clan chest is overflowing. An opening ceremony would make someone very happy.",
                     "chest_empty":"The clan chest is empty. Some loot in it would give the next tasks a purpose.",
                     "boss":"A dust monster has just appeared in your dungeon. Your help is needed!",
                     "comeback":"The dungeon has opened its doors again. Your place is being kept warm.",
                     "sleep_reminder":"Your clan is still waiting for you. Everything is just as you left it: the tasks, the levels, the loot.",
                     "sleep_notice":"Your clan has been asleep for almost two years. If nobody comes back within a month, it will be erased. Opening the game is enough to keep it."},
               "es":{"onboarding_empty":"Tu mazmorra te espera, pero todavía está vacía. Añade tu primera tarea en treinta segundos.",
                     "onboarding_idle":"Las tareas están listas y la mazmorra también. Solo falta un primer aventurero que se lance.",
                     "onboarding_alone":"Tu mazmorra funciona, pero estás solo en ella. El código QR que hace entrar a tu familia te espera en la pestaña Clan.",
                     "validation":"Una tarea ha llegado a su fin y espera tu veredicto para ser recompensada.",

# ---------------------------------------------------------------------------
# --- Filiation des assets, marquee a la main par `bundles tag`
# ---------------------------------------------------------------------------
# Un TAG dit une PROVENANCE, jamais un procede : « anneau dore » decrit
# ce qu'on a fait a une image, pas ce dont elle descend.
#
# ⚠ UNE REFERENCE EST LA TETE D'UNE FAMILLE, pas de toutes celles
#   qu'elle porte. `intro_little_elfe.png` marquee `reference` et
#   taguee `elfe1` donne son parent a tout ce qui porte `elfe1`.
#   Une reference qui porte PLUSIEURS tags doit dire lesquels elle
#   mene, par `heads` — PLUSIEURS sont possibles, et « aucune »
#   aussi. `icon.png` porte un bouclier repris ailleurs ET un
#   nounours repris ailleurs : elle mene les deux familles. Les
#   tags non listes sont ceux dont elle DESCEND.
#   Sans quoi deux references qui se citent forment une boucle.
#
# Trois tags ne designent aucun parent : alone, capture, nepasclasser.
#
# ⚠ COPIE ≠ DERIVE. Une derivation a demande un travail ; une copie
#   n'a demande que de deposer le meme dessin ailleurs. La RACINE
#   d'un groupe de copies est l'exemplaire de MEILLEURE RESOLUTION,
#   les autres s'en recopient et ne se regenerent jamais.
#
# Editable a la main, mais `bundles tag` le reecrit : garder la forme.
tags:
  - "elfe1"
  - "guerrier1"
  - "bébé1"
  - "alone"
  - "capture"
  - "bouclier"
  - "coffre"
  - "nepasclasser"
  - "nounours"
  - "bandeau"
  - "clan1"
  - "clan1papa"
  - "clan1maman"
  - "clan1grand"
  - "clan1grande"
  - "clan1petit"
  - "couronne"
  - "splash"
# Les tags qui disent un TRAITEMENT et non une provenance : ils ne donnent
# aucun parent. `clan1` marque le passage par le cercle dore de
# `tools/iconify.py`, ce qui n'est pas un ancetre.
#
# ⚠ CE N'EST PLUS QUE LA MOITIE DE L'HISTOIRE, DEPUIS LE 2026-09-12. Ce tag etait un
#   CONTOURNEMENT : le modele d'assets ne savait pas dire qu'une image doit son aspect a
#   un outil, alors on l'a dit ici pour que le convertisseur de filiations cesse de
#   chercher une origine qui n'existe pas.
#
#   Le vrai endroit existe maintenant : `traitements:` dans `build_assets.yml`, ou les
#   items `avatars` et `clans` declarent `iconify`. C'est CELUI-LA qui est rejoue a la
#   regeneration ; celui-ci ne fait plus que taire le convertisseur.
#
#   On le garde tel quel : les deux ne disent pas la meme chose au meme public, et le
#   retirer ferait reapparaitre 46 parents fantomes dans le graphe.
traitements:
  - "clan1"

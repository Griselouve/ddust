          formats:
            # Embarque dans l'app. 720x720 comme la video d'onboarding actuelle, et
            # sous-titres INCRUSTES : DvVideo ne sait lire ni piste de sous-titres ni
            # piste audio multiple (cf. son readme, section limites).
            square:
              size: "720x720"
              out: "resources_cloud/donjon/videos/demo_v1_@@@lang@@@.mp4"
              subtitles: burned
            # Site et YouTube. Sous-titres en FICHIER a cote : c'est la seule forme
            # qu'un navigateur et YouTube savent lire, et elle laisse l'image intacte.
            landscape:
              size: "1920x1080"
              out: "hosting/web/assets/video/demo-@@@lang@@@.mp4"
              subtitles: sidecar
            # TikTok et Shorts : un fichier plat par langue, tout incruste. Ni l'un ni
            # l'autre n'accepte de piste separee.
            portrait:
              size: "1080x1920"
              out: "resources_others/video/out/demo-tiktok-@@@lang@@@.mp4"
              subtitles: burned

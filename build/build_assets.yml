    # =========================================================================
    - name: evenements
      enabled: true
      # LES ÉVÉNEMENTS ALÉATOIRES (layers/events-base-global.yml) : la souris, le piège, le
      # gobelin espion, le changelin, la potion du bienfaiteur. Cinq images seulement : un
      # événement de plus qui réutilise une image ne coûte AUCUNE génération.
      #
      # APRÈS `familles` ET `traitements_historiques`, et c'est l'ordre qui compte : la référence
      # est un monstre de tâche, et une référence doit pointer vers l'arrière. C'est d'elle que
      # ces images tiennent leur trait, leurs couleurs et leur humour : sans elle, on obtiendrait
      # cinq belles illustrations qui ne sont visiblement pas du même jeu.
      #
      # Fond UNI puis `unbg_flat` + `trim`, comme les épées du pacte : aucun modèle ne rend de
      # canal alpha, et demander « un fond transparent » dessine un damier.
      dir: "resources_cloud/donjon/images/medium"
      refs: [familles_dt_t_animaux_01]
      style: >-
        Illustration de jeu vidéo dans le style exact de l'image de référence : dessin animé
        détaillé, contours nets, couleurs vives, humour bon enfant, jamais effrayant pour un
        enfant. Un seul sujet, centré, en entier, sur un fond uni gris moyen parfaitement plat,
        sans motif, sans damier, sans ombre portée. Aucun texte, aucun logo, aucun cadre.
      items:
        evt_souris:
          kind: image
          aspect: "1:1"
          out: "evt_souris.png"
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            Une petite souris grise souriante, debout sur ses pattes arrière, avec un minuscule
            tablier de ménage et un plumeau coincé sous le bras, qui salue d'une patte et tend de
            l'autre une petite étoile scintillante.
        evt_piege:
          kind: image
          aspect: "1:1"
          out: "evt_piege.png"
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            Un piège à mâchoires en bois et en fer rouillé, tout juste refermé sur une serpillière,
            débordant de mousse de savon, et derrière un seau renversé deux petits monstres ronds et
            poilus qui ricanent en se cachant la bouche.
        evt_gobelin:
          kind: image
          aspect: "1:1"
          out: "evt_gobelin.png"
          # L'anneau doré des avatars : le gobelin s'invite dans la liste du clan, entre deux
          # membres, et doit avoir l'air de l'un d'eux au premier coup d'œil.
          traitements:
            - iconify
          prompt: >-
            Le portrait en buste d'un petit gobelin espion à la peau verte, grandes oreilles
            pointues, petit chapeau de détective, qui plisse un œil et regarde à travers une
            grosse loupe avec un sourire malicieux.
        evt_changelin:
          kind: image
          aspect: "1:1"
          out: "evt_changelin.png"
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            Une petite créature farceuse violette dont le corps se déforme comme de la guimauve à
            moitié changée en aventurier, un faux masque souriant à la main, qui s'enfuit en
            courant et en ricanant, laissant derrière elle un petit nuage de fumée étincelante.
        evt_potion:
          kind: image
          aspect: "1:1"
          out: "evt_potion.png"
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            Une fiole de verre en forme de cœur remplie d'un liquide rouge lumineux, fermée par un
            bouchon de liège et un petit ruban, avec une étiquette de parchemin, entourée de
            quelques étincelles dorées.

    # =========================================================================
    # THÈME « GENTILS DINOSAURES » : PLANCHE D'ESSAI (2026-10-12)
    # =========================================================================
    # Dix images seulement, pour valider le STYLE avant de payer la série entière
    # (~300 images). Les sorties sont les VRAIS fichiers du thème (mêmes noms que
    # donjon, sous resources_cloud/dino) : validées, elles restent et ne seront pas
    # refaites ; refusées, on les efface, on corrige le style, on relance.
    #
    # Public : les plus jeunes (3-7 ans). Moins chargé que donjon pour ne pas accaparer
    # l'attention, toujours ludique. Mêmes mécaniques que donjon : une tâche = s'occuper
    # d'un dinosaure, le butin = un œuf qui éclot, jamais de combat ni de peur.
    - name: dino_essai
      enabled: true
      dir: "resources_cloud/dino/images"
      style: >-
        Illustration pour un jeu d'enfants de 3 à 7 ans : dessin animé simple et doux, grandes
        formes rondes, contours épais et souples, aplats de couleurs pastel chaudes avec à peine
        d'ombrage, très peu de détails, beaucoup d'air. Préhistoire tendre : une famille de
        Cro-Magnon souriante vêtue de peaux et de feuilles, et de gentils dinosaures aux grands
        yeux brillants, aux joues roses, sans dents pointues ni griffes, jamais effrayants.
        Lisible même tout petit. Aucun texte, aucune lettre, aucun logo, aucun cadre.
      items:
        # --- les deux références de la série (hors bucket) ----------------------
        dino_ref_famille:
          kind: image
          aspect: "3:2"
          out: "../../../resources_others/dino/ref_famille.png"
          prompt: >-
            Planche de personnages sur fond uni crème : une famille de Cro-Magnon de quatre
            personnes, debout côte à côte, en pied, de face. Un papa barbu et costaud au grand
            sourire, une maman aux longs cheveux tressés avec une fleur, un petit garçon aux
            cheveux bruns en bataille et une petite fille aux couettes rousses. Tenues simples
            en peau beige, colliers de coquillages, pieds nus.
        dino_ref_diplo:
          kind: image
          aspect: "1:1"
          out: "../../../resources_others/dino/ref_diplo.png"
          prompt: >-
            Un bébé diplodocus vert tendre, tout rond et potelé, long cou et petite queue,
            grands yeux brillants, joues roses, petites taches vert clair sur le dos, assis et
            tourné de trois quarts, qui sourit. Seul, en entier, centré, sur un fond magenta
            uni parfaitement plat (#FF00FF), sans ombre portée.
        dino_diplo_marche_a:
          kind: image
          aspect: "1:1"
          refs: [dino_ref_diplo]
          out: "../../../resources_others/dino/diplo/marche_a.png"
          prompt: >-
            Exactement le même personnage que la référence, mêmes couleurs et mêmes
            proportions, vu de profil, en train de marcher vers la droite, une patte avant
            levée. Seul, en entier, sur le même fond magenta uni parfaitement plat (#FF00FF),
            sans ombre portée.

        # --- deux tâches (les « monstres » de donjon deviennent des dinos à chouchouter)
        dino_dt_t_animaux_01:
          kind: image
          aspect: "1:1"
          refs: [dino_ref_famille]
          out: "medium/dt_t_animaux_01.png"
          prompt: >-
            Le petit garçon de la référence verse des baies et des feuilles d'un panier tressé
            dans un grand bol en pierre, pour un bébé tricératops orange tout rond qui ouvre
            grand la bouche, ravi, les yeux fermés de bonheur. Fond uni crème.
        dino_dt_t_cuisine_01:
          kind: image
          aspect: "1:1"
          refs: [dino_ref_famille]
          out: "medium/dt_t_cuisine_01.png"
          prompt: >-
            La petite fille de la référence balaie le sol de la grotte avec un balai fait d'une
            branche feuillue, pendant qu'un bébé ankylosaure gris-bleu tout poussiéreux éternue
            un petit nuage de poussière en riant. Fond uni crème.

        # --- icône de domaine, avatar, œuf, victoire, splash ----------------------
        dino_task_animaux_nobg:
          kind: image
          aspect: "1:1"
          out: "medium/task_animaux_nobg.png"
          traitements:
            - { outil: remove_bg, fonction: remove_background }
          prompt: >-
            Une grosse tête de bébé dinosaure vert, ronde et souriante, qui croque une baie
            rouge, posée devant un médaillon rond en pierre claire gravé d'une feuille. Fond
            uni gris moyen parfaitement plat.
        dino_chest_item_nobg:
          kind: image
          aspect: "16:9"
          out: "big/chest_item_nobg.png"
          traitements:
            - { outil: remove_bg, fonction: remove_background }
          prompt: >-
            Un gros œuf de dinosaure crème à grosses taches vertes et orange, posé dans un nid
            douillet de paille et de feuilles, avec une petite fêlure d'où s'échappe une douce
            lumière dorée. Fond uni gris moyen parfaitement plat.
        dino_victory_nobg:
          kind: image
          aspect: "1:1"
          refs: [dino_ref_famille]
          out: "big/victory_nobg.png"
          # unbg_flat + trim et non remove_bg : sur ce dessin en aplats, remove_bg laissait des
          # taches sombres dans les personnages (planche d'essai du 2026-10-12).
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            La famille de la référence saute de joie, bras en l'air, avec un bébé diplodocus vert
            qui sautille au milieu d'eux, sous une pluie de petites feuilles et d'étoiles. Fond
            uni gris moyen parfaitement plat.
        dino_splash:
          kind: image
          aspect: "2:3"
          out: "splashs/splash.png"
          prompt: >-
            Une vallée préhistorique paisible au lever du soleil : de grandes fougères, une
            rivière bleue, une grotte accueillante avec un feu de camp qui fume doucement, deux
            longs cous de diplodocus au loin et un bébé tricératops qui joue près de l'eau. Ciel
            pastel, grandes formes simples, beaucoup de calme, place libre au centre pour un
            titre. Aucun personnage humain.


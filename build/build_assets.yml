    #   du traite et du non traite, et auxquels on ne peut donc pas attacher de chaine.
    #
    #   Un fichier revendique par deux items prend la declaration du DERNIER. C'est deja
    #   ainsi que les huit images de guide et les trois references d'intro l'emportent sur
    #   `big` et `medium` ; l'inventaire le SIGNALE desormais au lieu de le subir en
    #   silence. Deplacer cette etape plus haut la rendrait sans effet.

        # Item cree par `bundles apply` : un prompt ecrit depuis

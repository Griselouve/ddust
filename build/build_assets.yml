    - name: traitements_historiques
      enabled: true
      dir: "resources_cloud/donjon"
      items:
        # 7 + 12 images detourees. Le suffixe `_nobg` est la marque de `remove_bg.py`.
        big_detoures:
          kind: source
          out: "images/big/*_nobg.png"
          traitements:
            - { outil: remove_bg, fonction: remove_background }
        small_detoures:
          kind: source
          out: "images/small/*_nobg.png"
          traitements:
            - { outil: remove_bg, fonction: remove_background }
        # ⚠ NOMMES UN PAR UN, ET PAS `icon_*.png`. Ce joker-la recouvrirait aussi
        #   `icon_01_P_*` et `icon_01_C_*`, deja declares plus haut et plus precis : ils y
        #   perdraient leur item, donc leur identite dans l'inventaire, pour un gain nul.
        # En forme de BLOC et non en flux : un flux sur deux lignes n'est pas depliable
        # par `bundles apply`, qui doit pouvoir y inserer un `prompt:`.
        icone_marchand:
          kind: source
          out: "images/medium/icon_Marchand.png"
          traitements: [iconify]
          prompt: >-
            Une tente de cirque rayée violet et or, avec un panneau vierge au-dessus de l'entrée, abritant des outils de nettoyage comme un balai, des brosses, un seau en bois rempli de plumeaux et un linge plié. Le tout est présenté dans un style de jeu vidéo détaillé et coloré, avec des ombres douces et un éclairage uniforme, détouré sur fond transparent.
        icone_edit:
          kind: source
          out: "images/medium/icon_edit.png"
          traitements: [iconify]
          prompt: >-
            Un encrier en pierre de forme irrégulière, orné d'un petit bouclier gravé sur sa face avant, avec une plume d'oie beige et marron clair insérée dedans, émettant une légère lueur bleue à sa base. Le style est celui d'un jeu vidéo fantastique, avec des couleurs vives et des contours nets, le tout détouré sur fond transparent.
        ecu_combat:
          kind: source
          out: "images/medium/ecu_combat.png"
          traitements: [ecufy]
          prompt: >-
            Un blason de chevalier stylisé en or et marron, avec une hache de guerre et une épée médiévale croisées en son centre, et une chaussette sale et trouée pendue sur les armes. Illustration numérique de style fantasy, aux détails réalistes et aux couleurs terreuses, avec un éclairage doux et diffus, détourée sur fond transparent.


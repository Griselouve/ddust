# -----------------------------------------------------------------------------
# --- Assets generes, declaration lue par le builder (modules/builder/assetgen.py)
# -----------------------------------------------------------------------------
# Pose a cote du build.yml DE LA SUITE, et separe de lui a dessein : build.yml est
# deja tres charge, et ceci n'est pas de la construction, c'est de la MATIERE.
#
# Au niveau suite et non au niveau d'une app : ces fichiers n'appartiennent au client
# pas plus qu'a la montre, resources_cloud est mutualise, et c'est deja contre cette
# racine que build.resources resout ses chemins.
#
# TROIS REGLES, rappelees ici parce qu'elles decident de la facon de travailler :
#   1. un fichier declare qui manque et qu'on ne sait pas produire ARRETE le build ;
#   2. rien n'est jamais ecrase, une retouche a la main survit indefiniment et ne
#      declenche aucune cascade sur ce qui en derive ;
#   3. refaire un asset consiste a l'EFFACER et a relancer un build.
#
# `dir` est relatif au repertoire de CE fichier. On depose l'ORIGINAL en pleine
# resolution : c'est imgshaking qui ramene a 768 px la COPIE embarquee, et lui seul.
# -----------------------------------------------------------------------------
assets:

  # --- LES BUNDLES : la bibliotheque d'assets, telle que la console la montre ------
  #
  # Un bundle = un repertoire, un rang d'affichage, et une place dans le modele de
  # nommage. Un fichier HORS de tout bundle n'existe pas pour la bibliotheque, d'ou
  # l'avertissement que l'inventaire emet quand une sortie declaree tombe dehors.
  #
  # `root`    = la racine de manifeste cloud, celle que `dvcloudassets` retire pour
  #             obtenir le nom NU que l'application demande. Absente = pas de cascade.
  # `bundled` = embarque dans l'APK : l'application le nomme avec le prefixe `assets/`,
  #             et ce prefixe est ce qui distingue les deux mondes dans la conf.
  #
  # ⚠ PAS DE BUNDLE `media` (arbitre le 2026-09-11) : il n'existe aujourd'hui ni master
  #   YouTube ni video TikTok, et un bundle vide n'est que du bruit dans l'ecran
  #   Modules. Le format portrait de la video de demonstration ecrit pour l'instant
  #   dans `resources_others/video/out/`, donc hors bundle, l'inventaire le signale a
  #   chaque passe, et c'est ce qui rouvrira la question le jour ou il sortira.
  bundles:
    core:
      dir: "resources"
      order: 10
      bundled: true
    general:
      dir: "resources_cloud/general"
      order: 20
      root: "general"
    donjon:
      dir: "resources_cloud/donjon"
      order: 30
      root: "donjon"
    # ⚠ CES DEUX BUNDLES NE SE REGENERENT PAS, ET C'EST UNE PROPRIETE, PAS UN OUBLI.
    #   Ils portent des CAPTURES d'ecran de l'application et ce qui en derive. Les
    #   reproduire demanderait de rejouer l'application, pas de decrire une image : un
    #   prompt y promettrait une regeneration qui rendrait une ILLUSTRATION a la place
    #   d'une capture. Plausible, et fausse.
    #
    #   Le drapeau vit sur le BUNDLE et non sur chaque fichier : c'est une propriete de
    #   la matiere, la meme pour tous ses fichiers, et la poser une fois evite de la
    #   reposer a chaque capture ajoutee.
    #
    #   `showcase` : les prises de la vitrine (dvshowcase), refaites a chaque passage de
    #   `builder.py suite=ddust run-showcase`. Elles ont remplace `resources_others/screenshots/`
    #   le 2026-09-16 : le site, la fiche Play et les videos y puisent directement.
    # Le decor de l'accueil servi par le bucket PUBLIC (vague `ante`). Il n'a pas de
    # racine de manifeste : ces fichiers ne partent pas dans le bucket d'assets, ils
    # vivent sous leur chemin nu dans `preload`, c'est justement ce qui permet de les
    # lire avant qu'aucun manifeste n'ait ete charge.
    preload:
      dir: "resources_cloud/intro"
      order: 35

    showcase:
      dir: "resources_others/showcase"
      order: 40
      generable: false

    # Les SOURCES de l'accueil : ce que les modeles ont rendu, garde intact. Ni embarque
    # ni televerse, c'est la matiere dont les deux bundles ci-dessus sont derives. On
    # l'inventorie quand meme, et c'est tout l'interet : une derivation se refait, une
    # generation se repaie. Perdre la source de vue, c'est se condamner a redemander au
    # modele ce qu'on avait deja.
    intro_sources:
      dir: "resources_others/intro"
      order: 45
    # Le thème « gentils dinosaures » (2026-10-12) : mêmes chemins et mêmes noms de
    # fichiers que donjon sous sa propre racine ; ce qu'il ne redessine pas retombe sur
    # donjon par la cascade (theme.themes.theme-dino.manifests = general, donjon, dino).
    dino:
      dir: "resources_cloud/dino"
      order: 32
      root: "dino"
    # Les planches de référence du thème dino (famille, diplodocus, tricératops) et les poses
    # brutes des mascottes (diplo/, trixie/) : ni embarquées ni
    # téléversées, c'est la matière dont la série tient son trait.
    dino_sources:
      dir: "resources_others/dino"
      order: 46
    web:
      dir: "hosting/web/assets"
      order: 50
      generable: false

  # Les huit langues officielles (`br`, portugais du Bresil, depuis le 2026-09-16). Tout
  # `out` contenant @@@lang@@@ produit huit fichiers, et tout bloc `text:` doit porter ces
  # huit clefs, une langue oubliee est une erreur,
  # pas un repli silencieux : une video muette sur un marche passerait inapercue.
  langs: [fr, en, es, de, it, pt, br, nl]

  # GARDE-FOU DE DEPENSE D'UN BUILD (assetgen, 2026-10-12) : au-dela, le build s'arrete
  # AVANT l'appel suivant et liste ce qui reste ; le build suivant reprend la ou il
  # s'etait arrete. Estimation a 0,09 EUR l'image, mesuree (cf. `_PRIX` d'assetgen.py). Seul filet
  # pour Lyria et les sons, que pubudget ne voit pas.
  max_spend_eur: 60

  defaults:
    # MESURE, pas suppose (sondes des 2026-09-10 et 2026-09-11 sur asura-888) :
    #   - aucun modele Imagen n'est ouvert (404 « does not have access to it ») ;
    #   - gemini-2.5-flash-image repond partout et honore imageConfig.aspectRatio ;
    #   - Veo 3.1 / 3.0 / 2.0 ET Lyria repondent, us-central1 et europe-west4 ;
    #   - gemini-2.5-flash-tts repond en europe-west4 ; les variantes `-preview-tts`
    #     ne repondent QUE sur us-central1, donc n'en faites pas un defaut.
    image:
      model: "gemini-2.5-flash-image"
      aspect: "3:2"
      # `global` EN TETE (2026-10-12) : le point d'acces global repartit l'appel sur toute la
      # capacite de Google, la ou une region seule renvoyait des 429 en rafale pendant la serie
      # du theme dino (125 echecs sur 263). Les regions suivent en repli.
      locations: ["global", "europe-west4", "europe-west1", "us-central1", "us-east4"]
    clip:
      model: "veo-3.1-generate-preview"
      duration: 8
      aspect: "16:9"
      audio: false                 # la bande-son vient de Lyria + de la voix : un plan
                                   # muet se remonte, un plan sonore s'impose.
      locations: ["us-central1", "europe-west4"]
    music:
      model: "lyria-002"
      # ⚠ us-central1 SEULEMENT, mesure le 2026-09-13 : europe-west4 rend un 404
      #   « Publisher model lyria-002 was not found or your project does not have
      #   access to it ». Il y repondait le 2026-09-11, l'acces a donc ete retire
      #   entre les deux, ce qu'aucune annonce n'a dit. La laisser dans la liste ne
      #   coutait pas une erreur (la boucle de localisations aurait bascule) mais un
      #   aller-retour inutile a chaque generation, et un message trompeur dans le
      #   journal du build. L'y remettre demande de le remesurer, pas de l'esperer.
      locations: ["us-central1"]
    voice:
      # ⚠ ELEVENLABS ET NON gemini-tts, depuis le 2026-09-13. Ce dernier rend une
      #   LECTURE, reguliere, juste, sans intention, et deux reformulations du style
      #   n'y ont rien change : demander de la lenteur a seulement fait passer les
      #   repliques de 8,5 s a 20 s. On ne corrige pas un manque d'interpretation par
      #   une consigne de rythme. La declaration gemini est conservee plus bas, au cas
      #   ou l'on veuille y revenir pour du volume (elle est facturee a l'appel, la ou
      #   ElevenLabs l'est au caractere).
      #
      # ⚠ LA CLEF N'EST PAS ICI ET N'Y SERA JAMAIS. Elle vit dans le coffre du
      #   framework (`elevenlabs_apikey`), qui consulte d'abord les variables
      #   d'environnement, `ELEVENLABS_APIKEY` suffit donc, et la demande une seule
      #   fois si elle manque, avant de la ranger. Aucun fichier nouveau, aucune
      #   convention nouvelle : c'est le meme mecanisme que le passphrase Pulumi.
      tool: "eleven"
      model: "eleven_multilingual_v2"

      # UNE VOIX PAR LANGUE, a l'inverse de ce qu'on faisait chez Google ou l'on tenait
      # a un timbre unique. Une voix francaise qui lit de l'espagnol s'entend ; le
      # catalogue permet ici de choisir, par langue, quelqu'un qui sonne du pays.
      # On declare des NOMS : un `voice_id` opaque ne se relit pas, ne se discute pas,
      # et ne se verifie qu'en le collant dans un navigateur. Le module resout le nom
      # contre le catalogue, et un nom introuvable dit lesquels existent.
      #
      # ⚠ LE NOM EST CELUI DU CATALOGUE, EN ENTIER. Les voix de la bibliotheque publique
      #   portent un nom suivi de leur description (« Jenna - Warm, Soft, and Sultry ») :
      #   c'est ce libelle complet qui fait foi. Le module tolere un prefixe, « Jenna »
      #   suffirait tant qu'une seule voix commence ainsi, mais deux homonymes ajoutes
      #   plus tard rendraient le choix silencieusement arbitraire.
      voices:
        fr: "Souni"
        en: "Sylvie"
        es: "Alejandra"
        # Jenna couvre les QUATRE langues restantes. Le modele multilingue porte le timbre
        # d'une langue a l'autre, et rien n'oblige a un locuteur different par marche quand
        # le rendu tient la route : une voix dont on a valide qu'elle va aux quatre vaut
        # mieux que quatre voix dont on n'a ecoute qu'une.
        de: "Jenna - Warm, Soft, and Sultry"
        it: "Jenna - Warm, Soft, and Sultry"
        pt: "Jenna - Warm, Soft, and Sultry"
        # ⚠ `br` PARTAGE LA VOIX DE `pt`, PAS SES TEXTES (2026-09-16). Le portugais du
        #   Brésil est une langue à part entière dans l'app : chaque réplique a son texte
        #   `br`, et donc son propre fichier `_br.mp3`. Seul le timbre est commun, faute
        #   d'avoir validé une voix brésilienne au catalogue. En choisir une plus tard ne
        #   demande que de changer cette ligne, puis d'effacer les `_br` pour les refaire.
        br: "Jenna - Warm, Soft, and Sultry"
        nl: "Jenna - Warm, Soft, and Sultry"

      # Reglages de rendu, et c'est ICI que se joue le ton, pas dans le texte.
      #
      # `stability` est le reglage le plus contre-intuitif du lot : PLUS IL EST BAS, PLUS
      # LA VOIX VIT. A 0,45 elle etait juste et reguliere, donc un peu mecanique ; a 0,30
      # elle varie d'une phrase a l'autre, marque des elans, respire. Trop bas (sous 0,20)
      # elle devient instable au point de changer de caractere en cours de replique.
      #
      # `expressivity` (le champ `style` de l'API) ajoute l'intention par-dessus. Monte de
      # 0,25 a 0,45 : assez pour qu'un conteur ait l'air d'y croire, pas au point de
      # surjouer, on raconte a un enfant le soir, on ne presente pas un jeu televise.
      #
      # ⚠ CES DEUX REGLAGES COUTENT DE LA REPRODUCTIBILITE : deux generations du meme
      #   texte ne donneront plus exactement le meme fichier. C'est le prix d'une voix
      #   vivante, et il se paie surtout si l'on regenere une seule replique d'une serie.
      stability: 0.30
      similarity: 0.80
      expressivity: 0.45
      format: "mp3_44100_128"

      # --- Repli Google, conserve et inerte -----------------------------------
      # Reprendre gemini-tts demande de remettre `tool: "gemini-tts"` ci-dessus et de
      # redeclarer ces trois clefs a la place des `voices`.
      #   model: "gemini-2.5-flash-tts"
      #   voice: "Kore"
      #   style: "Dis ce texte comme un conteur qui confie quelque chose a un enfant…"
      #   locations: ["europe-west4", "us-central1"]

    video:
      fps: 30
      fill: "blur"
      subtitles: "burned"

  steps:

    # =========================================================================
    # LES ASSETS HISTORIQUES, TOUS DECLARES. Un fichier pose dans un bundle et
    # declare nulle part est un RATE DE DECLARATION, pas une categorie a part :
    # il n'a ni etape, ni style, ni endroit ou ecrire un prompt, et la console ne
    # peut rien en faire. Ces trois etapes ferment ce trou, 120 fichiers sur 378
    # au 2026-09-11 : les icones d'interface, les musiques, les sons, les videos,
    # les images du site.
    #
    # ⚠ `source` VEUT DIRE « rien ne sait le refaire », et c'est la verite pour
    #   ceux-la : ils n'ont pas de prompt. Ce n'est pas un manque a combler d'un
    #   coup, c'est un etat CONNU. Demander la regeneration de l'un d'eux ne
    #   produit pas n'importe quoi : la console l'ecarte vers « a revoir », et la
    #   revue propose de le garder, d'en televerser une reprise, ou d'en ecrire un
    #   prompt. Ecrire ce prompt le fera passer de `source` a `image`, ici meme.
    #
    # ⚠ EN PREMIER, ET C'EST L'ORDRE QUI COMPTE. Les jokers ci-dessous ratissent
    #   large et recouvrent des fichiers que les etapes SUIVANTES declarent plus
    #   precisement, les huit guides, les 205 familles, les captures du site. La
    #   derniere declaration l'emporte : les precises doivent donc passer apres.
    - name: historique_core
      enabled: true
      dir: "resources"
      items:
        icones:   { kind: source, out: "icon/*.png" }
        splash:   { kind: source, out: "images/splashs/*.png" }
        # Sons embarqués dans l'APK : roar.mp3, le son signature des notifications
        # (copié aussi dans res/raw par `build.android_raw` du client).
        sons_apk: { kind: source, out: "sounds/*.mp3" }

    # =========================================================================

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_splash:
          kind: image
          out: "images/splashs/splash.png"
          prompt: >-
            Le personnage de la référence, un nain barbu, un elfe et un magicien, nettoient un grand dragon marron au milieu d'une montagne d'or et de trésors dans une grande salle de château sombre et poussiéreuse.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_eu:
          kind: image
          out: "icon/eu.png"
          prompt: >-
            Le drapeau de l'Union européenne, avec un fond bleu uni et douze étoiles dorées à cinq branches disposées en cercle au centre. Les étoiles sont uniformément espacées et pointent vers le haut. Le style est graphique et minimaliste, avec des couleurs vives et un éclairage uniforme.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_google:
          kind: image
          out: "icon/google.png"
          prompt: >-
            Le logo Google, un "G" majuscule stylisé, est composé de plusieurs couleurs vives : le haut est rouge, le côté gauche est un dégradé de jaune, vert et bleu, et la barre horizontale est bleue. Le logo est net et détouré sur un fond transparent, avec un éclairage uniforme qui met en valeur les couleurs vives.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_icon:
          kind: image
          out: "icon/icon.png"
          prompt: >-
            Un ours en peluche marron, avec des cornes de démon et des yeux rouges lumineux, est assis de face, tenant une épée en bois dans sa main droite, devant un bouclier médiéval gris et usé. Le style est un dessin numérique aux contours épais et expressifs, avec des textures de tissu et de métal détaillées, une palette de couleurs terreuses et sombres rehaussée par le rouge vif des yeux, et un éclairage qui met en valeur les reliefs et les ombres, le tout détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_shield:
          kind: image
          out: "icon/shield.png"
          prompt: >-
            Un blason médiéval détaillé, divisé en quartiers or et violet, avec un plumeau et un balai croisés en son centre, entourés de volutes de poussière et de quelques pièces d'or et de pierres précieuses éparses en bas ; le tout est encadré d'une bordure métallique ornée et surmonté d'un bandeau portant l'inscription "DONJON ET SAVON". Style d'illustration de jeu vidéo fantastique, avec des couleurs riches et saturées, des textures réalistes et un éclairage doux et diffus qui met en valeur les détails.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_us:
          kind: image
          out: "icon/us.png"
          prompt: >-
            Le drapeau des États-Unis d'Amérique, avec cinquante étoiles blanches sur un canton bleu et treize bandes horizontales alternées rouges et blanches. Le drapeau est représenté de manière simple et graphique, avec des couleurs vives et un design plat.
    # =========================================================================
    # ACCUEIL DU NOUVEAU JOUEUR, 1/3 : LES SOURCES
    #
    # Ce que les modeles rendent, garde INTACT et hors de tout bundle : PNG pleine
    # resolution, WAV sans perte. Rien ici n'est servi a personne, ni embarque dans
    # le paquet, ni televerse dans un bucket. C'est la matiere.
    #
    # ⚠ POURQUOI NE PAS GENERER DIRECTEMENT AU BON FORMAT : parce qu'une derivation
    #   se refait, une generation se repaie. Changer le debit d'une voix ou la
    #   qualite d'une image ne doit pas demander de redemander au modele, qui, lui,
    #   rendrait autre chose. Les deux etapes suivantes ne font que decliner ceci.
    # ⚠ `resources_others/` N'EST PAS UN BUNDLE (cf. le bloc `bundles` en tete) :
    #   ces fichiers n'entrent donc pas dans l'inventaire, et c'est voulu.
    # =========================================================================
    - name: intro_sources
      enabled: true
      dir: "resources_others/intro"
      # Meme main que l'icone et le splash : ce sont les deux seules images que le
      # joueur aura vues avant l'interlude, et l'accueil doit etre du meme monde.
      refs: [historique_core_icon, historique_core_splash]
      style: >-
        Rich fantasy game illustration in the exact style of the reference images:
        bold expressive outlines, earthy palette warmed by candlelight and gold, soft
        volumetric dust floating in the air, a faint medieval wink on modern household
        objects. Portrait composition for a phone screen, the subject centred with
        quiet margins at the top and bottom. No text, no letters, no logo, no
        watermark, no frame.
      items:

        # --- Les quatre tableaux -------------------------------------------------
        intro_t1_maison:
          kind: image
          aspect: "9:16"
          out: "big/t1_maison.png"
          prompt: >-
            A cosy family living room at dusk, slowly turning into a dusty dungeon:
            moss creeping over the sofa, cobwebs hanging from the lamp, floor tiles
            becoming worn flagstones, a wooden chest half buried under laundry in the
            corner. Melancholic but gentle, never frightening.

        intro_t2_monstres:
          kind: image
          aspect: "9:16"
          out: "big/t2_monstres.png"
          prompt: >-
            The household chores of that same room turned into small comical monsters:
            a pile of dishes with teeth, a laundry basket with grabbing arms, a dust
            bunny with glowing eyes under the table, a bin creature drooling. Mischievous
            and funny, never scary, a child must want to fight them.

        intro_t3_clan:
          kind: image
          aspect: "9:16"
          out: "big/t3_clan.png"
          prompt: >-
            A family of four standing shoulder to shoulder like an adventuring party in
            the doorway of that room, holding a broom, a mop, a feather duster and a
            bucket the way one holds weapons. Determined and grinning, a rolled rug
            carried behind them like a banner.

        intro_t4_coffre:
          kind: image
          aspect: "9:16"
          out: "big/t4_coffre.png"
          prompt: >-
            The same room, now clean and glowing, the family gathered around an open
            wooden treasure chest spilling golden light: coins, and small tokens of
            shared time, cinema tickets, a board game, a picnic basket. Warm,
            triumphant, tender.

        # --- Le lit sonore : EN ATTENTE ------------------------------------------
        # RETIRE LE 2026-09-13, et ce n'est pas un renoncement : lyria-002 refuse ce
        # morceau. Deux redactions, deux refus, HTTP 500 « Could not generate audio,
        # try a different prompt » sur la premiere, HTTP 503 « Audio generation failed »
        # sur la seconde, et une seule localisation ouverte depuis qu'europe-west4 a
        # perdu le modele, donc aucun repli. L'interlude se joue tres bien sans : une
        # narration sur fond de silence se remarque davantage qu'une narration sur nappe.
        #
        # POUR LA REPRENDRE : decommenter ci-dessous, remettre `intro_ambiance_mp3` dans
        # l'etape `intro`, et redeclarer `sound: intro_ambiance` sur l'interlude du theme
        # (+ son `sound.preload`). Trois endroits, tous signales.
        #
        # ⚠ ON NE DECRIT QUE DE LA MUSIQUE, c'est ce que la premiere redaction ignorait.
        #   Elle demandait un BRUITAGE (« soft wind in a stone hall » : lyria compose, il
        #   ne fait pas de sound design), une DUREE (le modele rend une trentaine de
        #   secondes quoi qu'on lui dise) et un MIXAGE (« quiet enough to speak over »,
        #   qui decrit la place du morceau dans un montage, pas le morceau). La seconde,
        #   ci-dessous, est deja debarrassee de tout cela, et se fait refuser quand meme.
        #
        # intro_ambiance:
        #   kind: music
        #   out: "sounds/intro_ambiance.wav"
        #   prompt: >-
        #     Slow medieval fantasy instrumental: low sustained strings and a distant lute,
        #     unhurried and a little mysterious, warming into a hopeful lift towards the end.
        #   negative: "drums, vocals, epic orchestral hits, modern synths"

        # --- La voix du conteur --------------------------------------------------
        # ⚠ HUIT LANGUES DEPUIS LE 2026-09-16 : `br` (portugais du Bresil) s'ajoute, avec la
        #   meme voix que `pt` mais ses propres textes (cf. `voices` en tete).
        # ⚠ SEPT LANGUES DEPUIS LE 2026-09-15, avec l'ouverture de de/it/pt/nl dans l'app.
        #   Les voix s'etaient d'abord limitees a fr/en/es pour ne pas alourdir le paquet
        #   de langues que l'app n'offrait pas encore. Une fois ces langues choisissables,
        #   un enfant allemand qui entendrait le conteur en francais ne comprendrait rien
        #   a l'accueil ; le surcout reste de l'ordre du megaoctet (64 kbps mono).
        #   `langs:` restreint les sorties ET les textes exiges (assetgen._texts). Le
        #   worker retombe sur le francais pour toute langue non embarquee, jamais sur
        #   le silence.
        # ⚠ LE NOM DU FICHIER D'UN ECRAN EST LE dvid DE CET ECRAN. Le worker construit
        #   « intro/voices/<page>_<lang>.wav » depuis la page courante, sans table de
        #   correspondance : renommer un ecran sans renommer sa voix la fait taire, et
        #   c'est le seul couplage, il est volontaire, et il tient en une ligne.
        # ⚠ LES SOURCES SONT EN .mp3, pas en .wav : ElevenLabs rend directement du MP3
        #   (128 kbps), la ou Vertex rendait du PCM brut qu'il fallait envelopper. Les
        #   derivations restent utiles, elles ramenent a 64 kbps mono, ce qui divise
        #   encore le poids par deux pour une narration ou personne n'entendra la
        #   difference. Revenir a Vertex demanderait de remettre `.wav` ici.
        #
        # ⚠ LES TEXTES SONT ACCENTUES, eux. Le modele lit ce qu'on lui donne : « etait »
        #   ne se prononce pas comme « était », et une voix de conteur qui ecorche sa
        #   propre langue ruine exactement ce qu'on est venu chercher ici.

        intro_v_t1:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/t1_@@@lang@@@.mp3"
          text:
            fr: "Il était une fois une maison envahie de poussière."
            en: "Once upon a time, a house overrun with dust."
            es: "Había una vez una casa invadida por el polvo."
            de: "Es war einmal ein Haus, das im Staub versank."
            it: "C'era una volta una casa invasa dalla polvere."
            pt: "Era uma vez uma casa invadida pelo pó."
            br: "Era uma vez uma casa invadida pela poeira."
            nl: "Er was eens een huis dat onder het stof verdween."

        intro_v_t2:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/t2_@@@lang@@@.mp3"
          text:
            fr: "La vaisselle grogne, le linge sale rôde, la poussière s'installe."
            en: "The dishes growl, the dirty laundry prowls, the dust settles in."
            es: "La vajilla gruñe, la ropa sucia acecha, el polvo se instala."
            de: "Das Geschirr knurrt, die schmutzige Wäsche schleicht umher, der Staub macht es sich gemütlich."
            it: "I piatti brontolano, i panni sporchi si aggirano, la polvere si sistema."
            pt: "A loiça resmunga, a roupa suja anda à espreita, o pó instala-se."
            br: "A louça resmunga, a roupa suja fica à espreita, a poeira se instala."
            nl: "De afwas gromt, de vuile was sluipt rond, het stof nestelt zich."

        intro_v_t3:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/t3_@@@lang@@@.mp3"
          text:
            fr: "Courage ! Formez une équipe, un clan, qui ne laisse personne derrière."
            en: "Take heart! Form a team, a clan, that leaves no one behind."
            es: "¡Ánimo! Formad un equipo, un clan, que no deje a nadie atrás."
            de: "Nur Mut! Bildet ein Team, einen Clan, der niemanden zurücklässt."
            it: "Coraggio! Formate una squadra, un clan, che non lascia indietro nessuno."
            pt: "Coragem! Formem uma equipa, um clã, que não deixa ninguém para trás."
            br: "Coragem! Formem uma equipe, um clã, que não deixa ninguém para trás."
            nl: "Moed houden! Vorm een team, een clan, die niemand achterlaat."

        # ⚠ CETTE REPLIQUE SE TERMINE PAR UNE QUESTION, et c'est elle qui fait la
        #   jonction. L'interlude s'arretait sur une promesse, puis deux boutons
        #   paraissaient sans rapport avec ce qu'on venait d'entendre : le conteur se
        #   taisait, et un formulaire prenait sa place. En posant « as-tu deja un
        #   personnage ? », la voix DEMANDE ce que l'ecran suivant propose, les deux
        #   portes ne sont plus un choix administratif mais la reponse a la question.
        #
        #   Le tutoiement singulier est voulu ici, alors que le reste de la replique
        #   s'adresse a la famille au pluriel : le recit parle au clan, la question
        #   s'adresse a la personne qui tient le telephone.
        intro_v_t4:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/t4_@@@lang@@@.mp3"
          text:
            fr: "Combattez les monstres, nettoyez cette maison. Des trésors vous attendent… et peut-être même de l'argent de poche. Mais d'abord : as-tu déjà un personnage ?"
            en: "Fight the monsters, clean this house. Treasures await you… and maybe even some pocket money. But first: do you already have a character?"
            es: "Combatid a los monstruos, limpiad esta casa. Os esperan tesoros… y quizá hasta algo de paga. Pero antes: ¿ya tienes un personaje?"
            de: "Bekämpft die Monster, putzt dieses Haus. Schätze warten auf euch… und vielleicht sogar Taschengeld. Aber zuerst: Hast du schon einen Charakter?"
            it: "Combattete i mostri, pulite questa casa. Vi aspettano tesori… e forse perfino la paghetta. Ma prima: hai già un personaggio?"
            pt: "Combatam os monstros, limpem esta casa. Esperam-vos tesouros… e talvez até uma mesada. Mas primeiro: já tens uma personagem?"
            br: "Combatam os monstros, limpem esta casa. Tesouros esperam por vocês… e talvez até uma mesada. Mas primeiro: você já tem um personagem?"
            nl: "Bevecht de monsters, maak dit huis schoon. Er wachten schatten op jullie… en misschien zelfs zakgeld. Maar eerst: heb je al een personage?"

        # --- Une replique par ecran d'onboarding ---------------------------------
        intro_v_region_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/region_screen_@@@lang@@@.mp3"
          text:
            fr: "Dans quel royaume va jouer ton personnage et ton clan ?"
            en: "In which realm will your character and your clan play?"
            es: "¿En qué reino jugarán tu personaje y tu clan?"
            de: "In welchem Königreich werden dein Charakter und dein Clan spielen?"
            it: "In quale regno giocheranno il tuo personaggio e il tuo clan?"
            pt: "Em que reino vão jogar a tua personagem e o teu clã?"
            br: "Em que reino seu personagem e seu clã vão jogar?"
            nl: "In welk koninkrijk gaan je personage en je clan spelen?"

        intro_v_age_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/age_screen_@@@lang@@@.mp3"
          text:
            fr: "L'aubergiste se méfie. Ta date de naissance ?"
            en: "The innkeeper is wary. Your date of birth?"
            es: "El posadero desconfía. ¿Tu fecha de nacimiento?"
            de: "Der Wirt ist misstrauisch. Dein Geburtsdatum?"
            it: "L'oste è diffidente. La tua data di nascita?"
            pt: "O estalajadeiro desconfia. A tua data de nascimento?"
            br: "O taverneiro desconfia. Qual é a sua data de nascimento?"
            nl: "De waard is argwanend. Je geboortedatum?"

        # ⚠ PAS DE REPLIQUE POUR `link_account_screen`, ET C'EST VOULU. L'interlude du
        #   pacte, qui le precede immediatement, dit deja « Tu peux maintenant entrer dans
        #   le donjon ! », la redire a l'arrivee reviendrait a repeter la meme phrase a
        #   deux secondes d'intervalle. L'ecran de login parait donc en silence, et c'est
        #   le seul du tunnel dans ce cas.

        # ⚠ CETTE REPLIQUE SE JOUE SUR L'ECRAN DE L'ENIGME, pas sur celui de l'age : c'est
        #   la qu'elle a un sens (« resous l'enigme » se dit devant l'enigme). Le fichier
        #   porte donc le dvid `parentalgate_screen`, et le worker le trouve sans table.
        intro_v_parentalgate_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/parentalgate_screen_@@@lang@@@.mp3"
          text:
            fr: "Si tu es un adulte, résous l'énigme."
            en: "If you are an adult, solve the riddle."
            es: "Si eres adulto, resuelve el enigma."
            de: "Wenn du erwachsen bist, löse das Rätsel."
            it: "Se sei un adulto, risolvi l'enigma."
            pt: "Se és adulto, resolve o enigma."
            br: "Se você é adulto, resolva o enigma."
            nl: "Als je volwassen bent, los dan het raadsel op."

        # Trois mots, et volontairement trois seulement. C'est le seul ecran du tunnel ou
        # la voix ne raconte rien : elle demande de LIRE. Un conteur bavard, ici,
        # detournerait de ce qu'il y a a lire, et ce qu'il y a a lire engage.
        intro_v_documents_acceptance_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/documents_acceptance_screen_@@@lang@@@.mp3"
          text:
            fr: "Lis attentivement les conditions."
            en: "Read the terms carefully."
            es: "Lee atentamente las condiciones."
            de: "Lies die Bedingungen aufmerksam."
            it: "Leggi attentamente le condizioni."
            pt: "Lê atentamente as condições."
            br: "Leia as condições com atenção."
            nl: "Lees de voorwaarden aandachtig."

        intro_v_kid_assent_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/kid_assent_screen_@@@lang@@@.mp3"
          # ⚠ L'ENFANT PARLE LE PREMIER (2026-09-22) : la réplique disait « tes parents ont dit
          #   oui », ce qui n'est plus vrai à cet instant. Ses parents décident APRÈS lui.
          text:
            fr: "C'est à toi qu'on demande d'abord. As-tu envie de jouer ?"
            en: "We are asking you first. Do you want to play?"
            es: "Te lo preguntamos primero a ti. ¿Tienes ganas de jugar?"
            de: "Wir fragen zuerst dich. Hast du Lust zu spielen?"
            it: "Lo chiediamo prima a te. Hai voglia di giocare?"
            pt: "Perguntamos primeiro a ti. Tens vontade de jogar?"
            br: "A pergunta é primeiro para você. Está com vontade de jogar?"
            nl: "We vragen het eerst aan jou. Heb je zin om te spelen?"

        intro_v_player_name_screen:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/player_name_screen_@@@lang@@@.mp3"
          text:
            fr: "Comment s'appelle ton aventurier ?"
            en: "What is your adventurer's name?"
            es: "¿Cómo se llama tu aventurero?"
            de: "Wie heißt dein Abenteurer?"
            it: "Come si chiama il tuo avventuriero?"
            pt: "Como se chama o teu aventureiro?"
            br: "Qual é o nome do seu aventureiro?"
            nl: "Hoe heet jouw avonturier?"

        intro_v_new_or_pick_clan:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/new_or_pick_clan_@@@lang@@@.mp3"
          text:
            fr: "Tu peux fonder ton clan si tu es le premier, ou rejoindre les tiens."
            en: "You can found your clan if you are the first, or join your own."
            es: "Puedes fundar tu clan si eres el primero, o unirte a los tuyos."
            de: "Du kannst deinen Clan gründen, wenn du der Erste bist, oder dich deinen Leuten anschließen."
            it: "Puoi fondare il tuo clan se sei il primo, o unirti ai tuoi."
            pt: "Podes fundar o teu clã se fores o primeiro, ou juntar-te aos teus."
            br: "Você pode fundar seu clã se for o primeiro, ou se juntar aos seus."
            nl: "Je kunt je clan stichten als je de eerste bent, of je bij de jouwen aansluiten."

        intro_v_create_clan:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/create_clan_@@@lang@@@.mp3"
          text:
            fr: "Comment s'appelle ton clan ?"
            en: "What is your clan called?"
            es: "¿Cómo se llama tu clan?"
            de: "Wie heißt dein Clan?"
            it: "Come si chiama il tuo clan?"
            pt: "Como se chama o teu clã?"
            br: "Qual é o nome do seu clã?"
            nl: "Hoe heet je clan?"

        intro_v_kid_wants_clan:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/kid_wants_clan_@@@lang@@@.mp3"
          text:
            fr: "Rejoins un clan avec ta famille."
            en: "Join a clan with your family."
            es: "Únete a un clan con tu familia."
            de: "Tritt mit deiner Familie einem Clan bei."
            it: "Unisciti a un clan con la tua famiglia."
            pt: "Junta-te a um clã com a tua família."
            br: "Entre em um clã com a sua família."
            nl: "Sluit je samen met je familie aan bij een clan."

        # ⚠ « ET » ET NON « & ». Le nom de l'application s'ecrit avec une esperluette
        #   partout ailleurs, mais une synthese vocale ne sait pas quoi en faire : selon
        #   la langue et le modele, elle la lit « esperluette », l'epelle, ou l'avale. Un
        #   texte destine a etre ENTENDU s'ecrit comme il se prononce.
        #
        # ⚠ LE NOM CHANGE AVEC LA LANGUE, Donjons et Savons, Dungeons and Dusting,
        #   Calabozos y Jabones, et ce n'est pas une traduction approximative : ce sont
        #   les trois noms deposes du jeu. Les recopier ici plutot que d'y mettre un jeton
        #   les fige, mais un jeton ne se prononcerait pas.
        #   de/it/pt/nl n'ont PAS de nom depose : ils disent la marque, « Donjons et
        #   Savons », comme leurs pages du site. En inventer un serait deposer sans le dire.
        intro_v_dashboard:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/dashboard_@@@lang@@@.mp3"
          text:
            fr: "Bienvenue dans Donjons et Savons."
            en: "Welcome to Dungeons and Dusting."
            es: "Bienvenido a Calabozos y Jabones."
            de: "Willkommen bei Donjons et Savons."
            it: "Benvenuto in Donjons et Savons."
            pt: "Bem-vindo a Donjons et Savons."
            br: "Bem-vindo a Donjons et Savons."
            nl: "Welkom bij Donjons et Savons."

        intro_v_decisiontree:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voices/decisiontree_@@@lang@@@.mp3"
          text:
            fr: "L'aubergiste va personnaliser tes quêtes. Réponds sans crainte, ou passe ton chemin."
            en: "The innkeeper will tailor your quests. Answer freely, or go on your way."
            es: "El posadero personalizará tus misiones. Responde sin miedo, o sigue tu camino."
            de: "Der Wirt wird deine Quests anpassen. Antworte ohne Furcht, oder zieh deines Weges."
            it: "L'oste personalizzerà le tue missioni. Rispondi senza timore, o prosegui per la tua strada."
            pt: "O estalajadeiro vai personalizar as tuas missões. Responde sem receio, ou segue o teu caminho."
            br: "O taverneiro vai personalizar suas missões. Responda sem medo, ou siga seu caminho."
            nl: "De waard gaat je queesten op maat maken. Antwoord zonder vrees, of ga je eigen weg."


    # =========================================================================
    # ACCUEIL DU NOUVEAU JOUEUR, 2/3 : CE QUI EST EMBARQUE
    #
    # Le grand interlude se joue AVANT que le royaume ne soit choisi : a cet instant
    # aucun datacenter n'est connu, aucun bucket n'est resoluble, aucune session
    # n'existe. Ce qui n'est pas dans le paquet n'existe pas encore. D'ou le bundle
    # `core` (dir: resources, bundled), et d'ou, aussi, le soin mis au poids.
    #
    # ⚠ WEBP ET MP3, PAS PNG ET WAV. Mesure du 2026-09-13 : les memes fichiers
    #   pesaient 20,4 Mo bruts et 2,0 Mo derives, pour une difference que ni l'oeil
    #   ni l'oreille ne relevent sur un telephone. Vingt megaoctets d'apk pour un
    #   accueil de trente secondes, c'etait reprendre d'une main ce qu'on venait
    #   d'economiser de l'autre en retirant la video.
    # ⚠ SOUS-ARBRE `intro/` DEDIE, jamais `images/big/`. Le bundle gagne toujours sur
    #   le cloud pour un meme chemin nu : une image posee sous un chemin du theme
    #   masquerait silencieusement celle du theme, partout et pour toujours.
    # =========================================================================
    - name: intro
      enabled: true
      dir: "resources"
      items:
        intro_t1_maison_webp:
          kind: derive
          refs: [intro_t1_maison]
          out: "intro/big/t1_maison.webp"
          quality: 85
        intro_t2_monstres_webp:
          kind: derive
          refs: [intro_t2_monstres]
          out: "intro/big/t2_monstres.webp"
          quality: 85
        intro_t3_clan_webp:
          kind: derive
          refs: [intro_t3_clan]
          out: "intro/big/t3_clan.webp"
          quality: 85
        intro_t4_coffre_webp:
          kind: derive
          refs: [intro_t4_coffre]
          out: "intro/big/t4_coffre.webp"
          quality: 85

        # Le lit sonore : EN ATTENTE avec sa source (cf. `intro_ambiance` plus haut).
        # 96 kbps parce que c'est de la musique et non de la parole, le debit de la
        # voix y ferait entendre ses artefacts sur les tenues.
        #
        # intro_ambiance_mp3:
        #   kind: derive
        #   refs: [intro_ambiance]
        #   out: "intro/sounds/intro_ambiance.mp3"
        #   bitrate: "96k"
        #   channels: 2

        # Les quatre repliques des tableaux. 64 kbps mono : une narration n'a ni
        # stereo a rendre ni aigus a preserver, et le gain est d'un facteur six.
        intro_v_t1_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_t1]
          out: "intro/voices/t1_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_t2_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_t2]
          out: "intro/voices/t2_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_t3_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_t3]
          out: "intro/voices/t3_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_t4_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_t4]
          out: "intro/voices/t4_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14

    # =========================================================================
    # ACCUEIL DU NOUVEAU JOUEUR, 3/3 : LA VAGUE `ante`
    #
    # Les repliques des ecrans du tunnel. Elles ne sont PAS embarquees : elles
    # descendent pendant les trente secondes de l'interlude d'accueil, depuis le
    # bucket PUBLIC, avant meme que le royaume ne soit choisi (cf. `assets.ante` du
    # layer client et `preload` de backend/config.yml).
    #
    # ⚠ `resources_cloud/intro/` N'EST PAS DANS `assets.directories` : ces fichiers
    #   ne partent donc PAS dans le bucket d'assets, seulement dans le bucket public.
    #   Ils y vivent sous leur chemin NU, « intro/voices/x.mp3 », c'est-a-dire
    #   exactement celui que l'application demande. La vague `ante` se joue avant
    #   tout manifeste : un chemin qui aurait besoin d'un alias de theme pour etre
    #   resolu ne serait pas trouve.
    # =========================================================================
    # ⚠ EMBARQUEES, ET NON PLUS SERVIES PAR LE BUCKET. Elles ont d'abord descendu avec
    #   la vague `ante`, pour ne pas alourdir le paquet, 644 Ko pour douze repliques en
    #   trois langues. Le calcul etait juste et la conclusion fausse : un asset d'`ante`
    #   n'est ECRIT QU'UNE FOIS sur une installation. La vague ne redescend pas ce qui est
    #   deja en cache, et `_reconcileBundle` ne rattrape que les assets embarques. Le
    #   2026-09-13, un appareil de test jouait encore les voix du matin, celles d'un autre
    #   moteur de synthese, avec les textes d'avant, sans qu'aucun build n'y puisse rien.
    #
    #   644 Ko contre l'impossibilite de corriger une replique : le choix ne se discute pas.
    #   Le nom de l'etape reste `intro_preload` pour ne pas casser les references.
    - name: intro_preload
      enabled: true
      dir: "resources"
      items:
        intro_v_region_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_region_screen]
          out: "intro/voices/region_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_age_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_age_screen]
          out: "intro/voices/age_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_parentalgate_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_parentalgate_screen]
          out: "intro/voices/parentalgate_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_documents_acceptance_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_documents_acceptance_screen]
          out: "intro/voices/documents_acceptance_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_kid_assent_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_kid_assent_screen]
          out: "intro/voices/kid_assent_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_player_name_screen_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_player_name_screen]
          out: "intro/voices/player_name_screen_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_new_or_pick_clan_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_new_or_pick_clan]
          out: "intro/voices/new_or_pick_clan_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_create_clan_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_create_clan]
          out: "intro/voices/create_clan_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_kid_wants_clan_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_kid_wants_clan]
          out: "intro/voices/kid_wants_clan_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_dashboard_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_dashboard]
          out: "intro/voices/dashboard_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14
        intro_v_decisiontree_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [intro_v_decisiontree]
          out: "intro/voices/decisiontree_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14

    - name: historique_donjon
      enabled: true

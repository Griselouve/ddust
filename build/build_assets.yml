    # =========================================================================
    # LE PACTE, les conditions viennent d'etre acceptees
    #
    # Quatre secondes entre la signature et la liaison du compte : un bouclier, deux
    # epees qui claquent dessus, et « c'est parti ». C'est le seul interlude du tunnel
    # qui CELEBRE au lieu d'expliquer, et il tombe au bon endroit, juste apres le seul
    # ecran ou l'on a demande quelque chose d'aride.
    #
    # ⚠ DECLARE ICI ET PAS PLUS HAUT, A CAUSE DE L'ORDRE DES REFERENCES. Les epees sont
    #   generees D'APRES le bouclier (`historique_donjon_shield`, etape precedente), et
    #   assetgen refuse une reference vers un item declare plus loin. Remonter cette
    #   etape aupres des autres `intro_*` casserait donc le build, et le casserait bien,
    #   avec un message clair, ce qui est deja ca.
    - name: pacte_sources
      enabled: true
      dir: "resources_others/pacte"
      # Le bouclier EST la reference : c'est de lui que les epees tiennent leur metal,
      # leur usure et leur eclairage. Sans cela on obtient deux belles epees qui ne sont
      # visiblement pas du meme jeu.
      refs: [historique_donjon_shield]
      style: >-
        Video game illustration matching the reference image exactly: worn and rusted
        metal, crisp outlines, detailed textures, even lighting, transparent background.
        No text, no logo, no frame, no shadow on the ground.
      items:
        # ⚠ `aspect: "1:1"` ET `traitements`, et les deux manquaient. Le premier parce que
        #   ces epees viennent se poser sur un bouclier carre : rendues au format 3:2 par
        #   defaut, elles arrivaient en 1248x832 et le cadrage les ecrasait dans une boite
        #   qui n'etait pas la leur.
        #
        # ⚠ AUCUN MODELE NE REND DE CANAL ALPHA, et c'est la lecon a retenir. Demander un
        #   « fond transparent » ne produit pas de transparence : le modele DESSINE ce
        #   qu'il croit etre un fond transparent, c'est-a-dire le damier gris et blanc des
        #   logiciels d'image. C'est exactement ce qu'on a obtenu, deux carrees a damier
        #   qui se croisaient sur le bouclier. Le detourage se fait APRES, par `rembg`,
        #   comme pour les 89 autres assets detoures de ddust.
        #
        #   Le prompt demande donc un fond UNI, qui se segmente proprement, au lieu d'une
        #   transparence que le modele ne sait pas produire.
        pacte_sword_l:
          kind: image
          aspect: "1:1"
          out: "sword_left.png"
          # ⚠ `unbg_flat` ET NON `remove_bg` : le fond est UNI, on n'a donc rien a deviner.
          #   `rembg` segmente par probabilite et confondait les reflets clairs de la lame
          #   avec le gris du fond, la lame ressortait criblee de trous, et l'on voyait
          #   le bouclier a travers l'acier. Ni un seuil, ni une fermeture morphologique
          #   ne rattrapaient cela. La propagation depuis les bords, elle, n'atteint jamais
          #   un reflet enclave dans le sujet : mesure du 2026-09-13, 6,9 % de pixels
          #   pleinement opaques contre 0,2 % avec `rembg`.
          #
          # `trim` ensuite : `unbg_flat` rend l'image entiere, sujet minuscule au milieu.
          #   Sans rognage, l'epee arrive sept fois trop petite quelle que soit sa boite,
          #   le cadrage `RATIO_IN` ajuste l'IMAGE, pas ce qu'elle contient.
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            Une épée de chevalier vue de face, POMMEAU EN HAUT et POINTE DIRIGÉE VERS LE
            BAS, légèrement inclinée vers la droite, garde droite et pommeau rond, métal
            usé et piqué de rouille. L'épée occupe toute la hauteur de l'image, centrée,
            sur un fond uni gris moyen parfaitement plat, sans motif, sans damier, sans
            ombre portée.

        # Cf. `pacte_sword_l` : meme format, meme detourage, meme fond uni.
        pacte_sword_r:
          kind: image
          aspect: "1:1"
          out: "sword_right.png"
          traitements:
            - { outil: alpha_tools, fonction: unbg_flat }
            - { outil: alpha_tools, fonction: trim }
          prompt: >-
            La même épée, en miroir : POMMEAU EN HAUT et POINTE DIRIGÉE VERS LE BAS,
            légèrement inclinée vers la gauche, garde droite et pommeau rond, métal usé
            et piqué de rouille. L'épée occupe toute la hauteur de l'image, centrée, sur
            un fond uni gris moyen parfaitement plat, sans motif, sans damier, sans ombre
            portée.

        # ⚠ LE SON N'EST PAS GENERE, IL EXISTE. Aucun de nos modeles ne fait de
        #   bruitage, lyria compose de la musique, pas un choc de lames, et le jeu a
        #   deja ce qu'il faut. On le DECLARE seulement, pour pouvoir le deriver : une
        #   source declaree est verifiee, jamais fabriquee.
        pacte_clang_src:
          kind: source
          out: "../../resources_cloud/donjon/sounds/effect_slash.mp3"

        # ⚠ DECLAREE UNE SECONDE FOIS, ET C'EST VOULU. Le joker `musiques:` de l'etape
        #   `historique_donjon` couvre deja ce fichier, mais UN JOKER NE SE REFERENCE
        #   PAS : `refs` attend le nom d'un item, et un joker en represente vingt. Pour
        #   deriver CE fichier-la, il lui faut un nom. Les deux declarations ne se
        #   marchent pas dessus : une source n'est que VERIFIEE, jamais produite, et
        #   verifier deux fois un fichier present ne fait rien du tout.
        seuil_music_src:
          kind: source
          out: "../../resources_cloud/donjon/music/Ambiant1_General_V1.mp3"

        # La replique finale. Trois mots : l'interlude dure quatre secondes, et ce qui
        # suit est un bouton sur lequel il faut appuyer.
        pacte_voice:
          kind: voice
          langs: [fr, en, es, de, it, pt, br, nl]
          out: "voice_@@@lang@@@.mp3"
          text:
            fr: "C'est bon ! Tu peux maintenant entrer dans le donjon !"
            en: "That's it! You may now enter the dungeon!"
            es: "¡Listo! ¡Ya puedes entrar en la mazmorra!"
            de: "Geschafft! Jetzt darfst du den Kerker betreten!"
            it: "Fatto! Ora puoi entrare nel dungeon!"
            pt: "Pronto! Agora já podes entrar na masmorra!"
            br: "Pronto! Agora você já pode entrar na masmorra!"
            nl: "Gelukt! Nu mag je de kerker betreden!"

    # Le pacte est EMBARQUE, comme les quatre tableaux de l'accueil.
    #
    # ⚠ IL A COMMENCE DANS LE BUCKET `preload`, ET C'ETAIT UNE ERREUR. Le raisonnement
    #   tenait, quatre secondes vues une fois ne justifient pas d'alourdir l'apk, mais
    #   il se trompait d'ordre de grandeur : DERIVES, ces fichiers pesent 47 Ko en tout,
    #   contre 2 Mo deja embarques pour l'interlude. On payait une dependance reseau
    #   entiere pour economiser deux pour cent de ce qu'on embarque deja.
    #
    #   Et cette dependance ne tenait pas : la vague `ante` descend au tout debut, mais
    #   un cache deja constitue lors d'un lancement precedent ne la rejoue pas, le jour
    #   ou l'on ajoute un fichier, les installations existantes ne le voient jamais
    #   arriver. La scene jouait alors son rideau, sans bouclier ni epees.
    - name: pacte
      enabled: true
      dir: "resources"
      items:
        pacte_shield:
          kind: derive
          refs: [historique_donjon_shield]
          out: "intro/pacte/shield.webp"
          width: 384
        pacte_sword_left:
          kind: derive
          refs: [pacte_sword_l]
          out: "intro/pacte/sword_left.webp"
          width: 384
        pacte_sword_right:
          kind: derive
          refs: [pacte_sword_r]
          out: "intro/pacte/sword_right.webp"
          width: 384
        # ⚠ `trim_silence` : le fichier d'origine porte 0,24 s de silence avant sa
        #   premiere crete. Joue au bon instant, le choc s'entendait donc un quart de
        #   seconde trop tard, un decalage qu'aucun reglage de scene ne pouvait
        #   rattraper, puisqu'il n'etait pas dans la scene.
        pacte_clang:
          kind: derive
          refs: [pacte_clang_src]
          out: "intro/pacte/swords.mp3"
          bitrate: "64k"
          trim_silence: true
          loudness: -14
        pacte_voice_mp3:
          kind: derive
          langs: [fr, en, es, de, it, pt, br, nl]
          refs: [pacte_voice]
          out: "intro/voices/pacte_@@@lang@@@.mp3"
          bitrate: "64k"
          loudness: -14

        # La musique du seuil. 96 kbps STEREO, et non le 64 mono des voix : une
        # narration est une seule source au centre, une musique a une largeur, la
        # reduire en mono s'entend immediatement sur des nappes d'ambiance.
        #
        # 4,1 Mo d'origine, ~2 Mo ici. C'est le plus gros fichier embarque du jeu, et il
        # se justifie : c'est le seul son que le joueur entend avant d'avoir choisi son
        # royaume, donc avant que le moindre bucket ne soit resoluble.
        seuil_music:
          kind: derive
          refs: [seuil_music_src]
          out: "intro/sounds/seuil.mp3"
          bitrate: "96k"
          channels: 2

    - name: historique_web
      enabled: true
      dir: "hosting/web/assets"
      # `images` (img/*.webp) et `affiches` (video/*.png) retires le 2026-09-15 avec les
      # fichiers qu'ils recensaient : un motif qui ne trouve plus rien ARRETE le build. Les
      # captures du site sont desormais fabriquees dans le workspace (backend/build.yml,
      # hosting_assets), elles n'ont plus d'exemplaire dans le depot a inventorier.
      items:
        # Les clips du site (installation de la beta) et leurs affiches webp.
        # NOM UNIQUE DANS TOUT LE FICHIER, et pas seulement dans son etape. assetgen
        # indexe ses items PAR NOM : un second `videos` etait refuse et le build
        # s'arretait. L'inventaire, lui, indexe par CHEMIN et ne voyait rien.
        clips:    { kind: source, out: "video/*.mp4" }
        affichesw: { kind: source, out: "video/*.webp" }

    # =========================================================================
    - name: guides
      enabled: true
      # Les huit illustrations des lecons dvtuto guide_parent / guide_enfant.
      # DEJA PRODUITES le 2026-09-10 : cette etape ne regenere rien. Elle reste
      # declaree pour deux raisons, le prompt est la seule trace de leur fabrication,
      # et la declaration vaut liste de controle si l'une venait a disparaitre.
      dir: "resources_cloud/donjon/images/big"
      style: >
        Loose hand-drawn ink sketch, thin confident black line work, visible pencil
        under-drawing, deliberately unfinished. Only two or three flat watercolour
        washes: warm amber, muted blue-grey, soft terracotta. Off-white paper
        background with plenty of empty space. Light, airy and readable at small size,
        NOT a rich detailed game illustration. Warm, gentle, everyday family mood.
        A modern home, with a faint medieval wink in the props only. Simple rounded
        faces, friendly expressions, no realistic portraits. Wide landscape
        composition, subjects centred, generous margins. Absolutely no text, no
        letters, no numbers, no speech bubbles, no logo, no watermark, no frame.
      items:

        # -- Guide du parent. L'ordre compte : l'effort ouvre, la mort suit. Ouvrir sur
        #    « votre enfant est mort » installerait le contresens que ces ecrans defont.
        guide_p1:
          kind: image
          out: "guide_p1.png"
          prompt: >
            A young person stands proudly beside a bed that is only half made, holding up
            a phone to show a photo of it. A parent crouches down to their height, smiling,
            one hand pointing warmly at the part that IS done. Encouragement, never
            scolding.
        guide_p2:
          kind: image
          out: "guide_p2.png"
          prompt: >
            A young person sits on the floor hugging their knees, their phone set face-down
            beside them, looking away and a little flat. A parent sits down on the floor at
            the same height, leaning in gently to ask what is going on. Concern and
            closeness, no anger, no pointing finger. A tiny cartoon skull floats faintly
            above the phone, drawn as a small icon.
        guide_p3:
          kind: image
          out: "guide_p3.png"
          prompt: >
            A family sitting on a living-room rug around an open wooden treasure chest.
            Instead of gold, what rises out of the chest are small symbols of shared time:
            a picnic basket, a board game, a pair of cinema tickets, a football. Everyone
            leans in, delighted.
        guide_p4:
          kind: image
          out: "guide_p4.png"
          prompt: >
            A tall parent carrying an absurdly high tower of folded laundry, while two much
            smaller family members stand below holding a single sock each, looking up. The
            parent smiles and takes a step back to make room for them. Gentle humour about
            the imbalance.

        # -- Guide de l'aventurier. Meme mecanique, mais chaque ecran dit un DROIT et
        #    jamais un devoir : recommencer, refuser, garder sa photo, recevoir sa part.
        guide_k1:
          kind: image
          out: "guide_k1.png"
          prompt: >
            Four family members standing shoulder to shoulder like a small adventuring
            party, holding a broom, a feather duster and a watering can the way one holds a
            sword or a staff. Grinning, ready, united. A rolled-up rug carried as their
            banner.
        guide_k2:
          kind: image
          out: "guide_k2.png"
          prompt: >
            A young person looks at their phone, where a small row of hearts has gone faint.
            With their other hand they pick up a broom, and one heart lights up bright and
            full again. Reassuring and hopeful, not dramatic.
        guide_k3:
          kind: image
          out: "guide_k3.png"
          prompt: >
            A young person cheerfully starting a household task over again from the
            beginning, sleeves rolled up. A parent stands a little behind, giving a warm
            thumbs up. A soft circular arrow drawn around them suggests going round once
            more. Nothing sad, nothing shameful.
        guide_k4:
          kind: image
          out: "guide_k4.png"
          prompt: >
            In the foreground, a young person holds a phone close to their chest, screen
            turned away from everyone, smiling with a small proud secret. Behind them,
            slightly out of focus, the rest of the family celebrates around an open wooden
            chest.


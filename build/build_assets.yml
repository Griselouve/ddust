    - name: captures
      enabled: true
      # Les prises de la vitrine dont la video de demonstration a besoin, dans les huit
      # langues. Seules celles-ci sont nommees : un `visual` doit designer un item, pas
      # un fichier. Les autres prises n'en restent pas moins inventoriees (bundle
      # `showcase`).
      #
      # ⚠ LE NOM D'UNE PRISE EST CELUI DE L'ECRAN (`<page>.png`, `<page>-01.png` pour une
      #   variante). Renommer un ecran dans la conf de la vitrine rend la source absente,
      #   et une source absente ARRETE le build : c'est voulu, la video ne doit pas
      #   partir avec un trou.
      dir: "resources_others/showcase"
      items:
        cap_clan: { kind: source, out: "@@@lang@@@/clan_page.png" }
        cap_salon_tasks: { kind: source, out: "@@@lang@@@/salon_tasks.png" }
        cap_combat_proof: { kind: source, out: "@@@lang@@@/combat-02.png" }
        cap_combat_verdict: { kind: source, out: "@@@lang@@@/combat-03.png" }

    # =========================================================================
    # Le groupe `site` (les vignettes du site DERIVEES des captures anglaises numerotees,
    # hosting/web/assets/img/NN-*.webp) a ete RETIRE le 2026-09-15.
    #
    # ⚠ NE PAS LE REMETTRE. Le site ne montre plus ces captures : il montre celles de la
    #   vitrine (dvshowcase), dans la langue de chaque page, declarees dans
    #   backend/build.yml sous `hosting_assets` et fabriquees dans le workspace a chaque
    #   build. Laisser ce groupe aurait refait a chaque build des images que plus aucune
    #   page ne demande, directement dans le depot.
    #   Les sources `cap_*` du groupe `captures` restent : les videos en derivent.

    # =========================================================================
    # L'etape `store` (les huit captures de stores/google/assets/) a ete RETIREE le
    # 2026-09-16. ⚠ NE PAS LA REMETTRE : le listing de `build.yml` est le seul producteur
    # de ce dossier, et il PURGE avant d'ecrire. Deux producteurs se battaient a chaque
    # build.

    # =========================================================================
    - name: plans
      enabled: false
      # DESACTIVEE tant que les captures ne sont pas la : une etape desactivee est
      # invisible, ni generee ni verifiee. La reactiver lancera Veo et Lyria, ce qui se
      # compte en minutes et en argent reel, d'ou le drapeau plutot qu'un essai timide.
      #
      # CONTRAINTE DE PROMPT, non verifiable par le code : aucun plan ne doit montrer
      # quelqu'un PARLER face camera. La voix off est remplacee langue par langue ; une
      # bouche qui articule le francais sous une phrase allemande ruinerait la video.
      dir: "resources_others/video/sources"
      style: >
        Warm hand-drawn animated illustration, soft ink outlines and light watercolour
        washes, gentle camera. Cosy family home with a faint medieval fantasy wink.
        No on-screen text, no letters, no logo, no watermark. Nobody speaks to camera.
      items:

        clip_intro:
          kind: clip
          out: "clip_intro.mp4"
          # La premiere image vient d'une planche DEJA validee : le clip anime ce qui
          # existe au lieu de reinventer le decor et les personnages.
          refs: [guide_k1]
          prompt: >
            The family lowers their brooms and mops like adventurers at the end of a quest,
            the camera drifting slowly backwards to reveal the tidy room around them.
        clip_chest:
          kind: clip
          out: "clip_chest.mp4"
          refs: [guide_p3]
          prompt: >
            The wooden chest lids opens slowly, warm golden light spilling out over the
            faces around it. Slow push in towards the glow.
        music_theme:
          kind: music
          out: "music_theme.wav"
          prompt: >
            Gentle warm acoustic theme, light plucked strings and soft flute, medieval
            folk flavour, unhurried and hopeful, suitable as a quiet background bed under
            a spoken narration. No drums, no big climax.
          negative: "aggressive, epic, orchestral hits, vocals, drums"

    # =========================================================================
    - name: videos
      enabled: false
      # DESACTIVEE : a activer une fois l'etape `plans` passee (les captures, elles, sont la).
      #
      # Il n'y a PAS de « video maitre » qu'on habillerait. Il y a des PLANS sans langue,
      # et la duree de chaque plan est celle de sa narration DANS LA LANGUE COURANTE :
      # une phrase allemande plus longue allonge son plan, un clip trop court est prolonge
      # sur sa derniere image. La version allemande dure donc plus longtemps que
      # l'anglaise sans qu'un seul plan ait ete regenere.
      items:

        demo:
          kind: video
          # Video de DEMONSTRATION : montage de captures, pas une generation. Sept
          # montages, chacun a partir des captures de sa langue. Confier des captures a
          # un generateur video reviendrait a le laisser reinventer l'interface, avec des
          # boutons qui n'existent pas et du texte deforme.
          music: music_theme
          shots:
            - visual: clip_intro
              min_duration: 4.0
              text:
                fr: "Dans Donjons & Savons, les tâches de la maison deviennent des monstres à vaincre."
                en: "In Donjons & Savons, household chores become monsters to defeat."
                es: "En Donjons & Savons, las tareas del hogar se convierten en monstruos que vencer."
                de: "In Donjons & Savons wird aus Hausarbeit ein Monster, das besiegt werden will."
                it: "In Donjons & Savons, le faccende di casa diventano mostri da sconfiggere."
                pt: "Em Donjons & Savons, as tarefas da casa tornam-se monstros a derrotar."
                br: "Em Donjons & Savons, as tarefas de casa viram monstros a derrotar."
                nl: "In Donjons & Savons worden huishoudelijke klusjes monsters om te verslaan."
            - visual: cap_clan
              motion: zoom_in
              min_duration: 3.5
              text:
                fr: "Chaque membre du clan a son personnage, ses points de vie et son expérience."
                en: "Every clan member has their own character, health points and experience."
                es: "Cada miembro del clan tiene su personaje, sus puntos de vida y su experiencia."
                de: "Jedes Clanmitglied hat einen eigenen Charakter, Lebenspunkte und Erfahrung."
                it: "Ogni membro del clan ha il suo personaggio, i punti vita e l'esperienza."
                pt: "Cada membro do clã tem o seu personagem, pontos de vida e experiência."
                br: "Cada membro do clã tem seu personagem, pontos de vida e experiência."
                nl: "Elk clanlid heeft een eigen personage, levenspunten en ervaring."
            - visual: cap_salon_tasks
              motion: pan_left
              min_duration: 3.5
              text:
                fr: "On choisit un monstre, c'est-à-dire une tâche, et on part au combat."
                en: "You pick a monster, which is really a chore, and head into battle."
                es: "Eliges un monstruo, es decir una tarea, y vas al combate."
                de: "Du wählst ein Monster, also eine Aufgabe, und ziehst in den Kampf."
                it: "Scegli un mostro, cioè una faccenda, e vai in battaglia."
                pt: "Escolhes um monstro, ou seja uma tarefa, e vais para o combate."
                br: "Você escolhe um monstro, ou seja, uma tarefa, e parte para o combate."
                nl: "Je kiest een monster, oftewel een klus, en gaat de strijd aan."
            - visual: cap_combat_proof
              motion: zoom_in
              min_duration: 3.5
              text:
                fr: "La tâche accomplie, une photo suffit comme preuve. Elle ne quitte jamais le téléphone."
                en: "Once the chore is done, a photo is proof enough. It never leaves the phone."
                es: "Hecha la tarea, una foto basta como prueba. Nunca sale del teléfono."
                de: "Ist die Aufgabe erledigt, genügt ein Foto als Beweis. Es verlässt das Handy nie."
                it: "Finita la faccenda, una foto basta come prova. Non lascia mai il telefono."
                pt: "Feita a tarefa, uma foto basta como prova. Nunca sai do telemóvel."
                br: "Feita a tarefa, uma foto basta como prova. Ela nunca sai do celular."
                nl: "Klus klaar? Een foto is bewijs genoeg. Hij verlaat de telefoon nooit."
            - visual: cap_combat_verdict
              motion: pan_right
              min_duration: 3.5
              text:
                fr: "Un chef de clan valide, et l'expérience est gagnée. Rien n'est jamais retiré."
                en: "A clan chief validates, and the experience is earned. Nothing is ever taken away."
                es: "Un jefe de clan valida y se gana la experiencia. Nunca se quita nada."
                de: "Ein Clanchef bestätigt, und die Erfahrung ist verdient. Nichts wird je abgezogen."
                it: "Un capo clan convalida e l'esperienza è guadagnata. Non si toglie mai nulla."
                pt: "Um chefe de clã valida e a experiência é ganha. Nunca se retira nada."
                br: "Um chefe de clã valida e a experiência é ganha. Nunca se tira nada."
                nl: "Een clanleider bevestigt en de ervaring is verdiend. Er wordt nooit iets afgenomen."
            - visual: clip_chest
              min_duration: 4.5
              text:
                fr: "Et quand le coffre du clan est plein, toute la famille l'ouvre ensemble."
                en: "And when the clan chest is full, the whole family opens it together."
                es: "Y cuando el cofre del clan está lleno, toda la familia lo abre junta."
                de: "Und wenn die Clantruhe voll ist, öffnet die ganze Familie sie gemeinsam."
                it: "E quando il forziere del clan è pieno, tutta la famiglia lo apre insieme."
                pt: "E quando o baú do clã está cheio, toda a família o abre em conjunto."
                br: "E quando o baú do clã está cheio, a família inteira o abre junta."
                nl: "En als de clankist vol is, opent de hele familie hem samen."
          formats:
            # Format carre, pour les vitrines qui le reclament (Play, posts sociaux).
            # ⚠ IL N'EST PLUS EMBARQUE DANS L'APP : dvvideo a ete retire le 2026-09-12
            #   avec l'ecran d'introduction, l'accueil etant desormais un interlude
            #   dvflame joue sur des assets embarques. La sortie quitte donc le bundle
            #   donjon, l'y laisser aurait remis 15 Mo par langue dans le bucket, pour
            #   un lecteur qui n'existe plus. Sous-titres incrustes : hors de l'app, il
            #   n'y a pas de piste separee a proposer.
            square:
              size: "720x720"
              out: "resources_others/video/out/demo-square-@@@lang@@@.mp4"
              subtitles: burned
            # Site et YouTube. Sous-titres en FICHIER a cote : c'est la seule forme
            # qu'un navigateur et YouTube savent lire, et elle laisse l'image intacte.
            landscape:
              size: "1920x1080"
              out: "hosting/web/assets/video/demo-@@@lang@@@.mp4"
              subtitles: sidecar
            # TikTok et Shorts : un fichier plat par langue, tout incruste. Ni l'un ni
            # l'autre n'accepte de piste separee.
            portrait:
              size: "1080x1920"
              out: "resources_others/video/out/demo-tiktok-@@@lang@@@.mp4"
              subtitles: burned

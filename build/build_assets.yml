    - name: captures
      enabled: true
      # LE POINT DE DEPOT UNIQUE des captures d'ecran de l'application.
      #
      # Il n'y en avait pas : les memes images vivaient en trois exemplaires — les PNG
      # dans le repertoire deploye du site, leurs WebP a cote, et huit d'entre elles
      # recopiees a l'identique dans stores/google/assets (verifie par empreinte, les
      # huit etaient octet pour octet les memes). Desormais on depose ICI, et le site
      # comme le store comme les videos en DERIVENT.
      #
      # Ce repertoire n'est ni embarque dans l'application ni publie : c'est un magasin
      # de sources. Y ranger sept series de captures ne coute rien a personne, la ou
      # sept series dans hosting/web seraient deployees pour rien.
      #
      # `langs: [en]` parce que la serie existante est ANGLAISE (les libelles a l'ecran
      # le sont : « Me », « Shop », « Time to clean ! »). Deposer fr/, de/, es/, it/,
      # pt/ et nl/ puis elargir cette liste ICI, en un seul endroit, suffira a nourrir
      # les videos dans les sept langues.
      dir: "resources_others/screenshots"

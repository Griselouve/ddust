# -----------------------------------------------------------------------------
# --- Assets generes — declaration lue par le builder (modules/builder/assetgen.py)
# -----------------------------------------------------------------------------
# Pose a cote du build.yml DE LA SUITE, et separe de lui a dessein : build.yml est
# deja tres charge, et ceci n'est pas de la construction — c'est de la MATIERE.
#
# Au niveau suite et non au niveau d'une app : ces fichiers n'appartiennent au client
# pas plus qu'a la montre, resources_cloud est mutualise, et c'est deja contre cette
# racine que build.resources resout ses chemins.
#
# TROIS REGLES, rappelees ici parce qu'elles decident de la facon de travailler :
#   1. un fichier declare qui manque et qu'on ne sait pas produire ARRETE le build ;
#   2. rien n'est jamais ecrase — une retouche a la main survit indefiniment et ne
#      declenche aucune cascade sur ce qui en derive ;
#   3. refaire un asset consiste a l'EFFACER et a relancer un build.
#
# `dir` est relatif au repertoire de CE fichier. On depose l'ORIGINAL en pleine
# resolution : c'est imgshaking qui ramene a 768 px la COPIE embarquee, et lui seul.
# -----------------------------------------------------------------------------
assets:

  # --- LES BUNDLES : la bibliotheque d'assets, telle que la console la montre ------
  #
  # Un bundle = un repertoire, un rang d'affichage, et une place dans le modele de
  # nommage. Un fichier HORS de tout bundle n'existe pas pour la bibliotheque — d'ou
  # l'avertissement que l'inventaire emet quand une sortie declaree tombe dehors.
  #
  # `root`    = la racine de manifeste cloud, celle que `dvcloudassets` retire pour
  #             obtenir le nom NU que l'application demande. Absente = pas de cascade.
  # `bundled` = embarque dans l'APK : l'application le nomme avec le prefixe `assets/`,
  #             et ce prefixe est ce qui distingue les deux mondes dans la conf.
  #
  # ⚠ PAS DE BUNDLE `media` (arbitre le 2026-09-11) : il n'existe aujourd'hui ni master
  #   YouTube ni video TikTok, et un bundle vide n'est que du bruit dans l'ecran
  #   Modules. Le format portrait de la video de demonstration ecrit pour l'instant
  #   dans `resources_others/video/out/`, donc hors bundle — l'inventaire le signale a
  #   chaque passe, et c'est ce qui rouvrira la question le jour ou il sortira.
  bundles:
    core:
      dir: "resources"
      order: 10
      bundled: true
    general:
      dir: "resources_cloud/general"
      order: 20
      root: "general"
    donjon:
      dir: "resources_cloud/donjon"
      order: 30
      root: "donjon"
    # ⚠ CES DEUX BUNDLES NE SE REGENERENT PAS, ET C'EST UNE PROPRIETE, PAS UN OUBLI.
    #   Ils portent des CAPTURES d'ecran de l'application et ce qui en derive. Les
    #   reproduire demanderait de rejouer l'application, pas de decrire une image : un
    #   prompt y promettrait une regeneration qui rendrait une ILLUSTRATION a la place
    #   d'une capture. Plausible, et fausse.
    #
    #   Le drapeau vit sur le BUNDLE et non sur chaque fichier : c'est une propriete de
    #   la matiere, la meme pour les 76 fichiers, et la poser une fois evite de la
    #   reposer a chaque capture ajoutee.
    screenshots:
      dir: "resources_others/screenshots"
      order: 40
      generable: false
    web:
      dir: "hosting/web/assets"
      order: 50
      generable: false

  # Les sept langues officielles. Tout `out` contenant @@@lang@@@ produit sept fichiers,
  # et tout bloc `text:` doit porter ces sept clefs — une langue oubliee est une erreur,
  # pas un repli silencieux : une video muette sur un marche passerait inapercue.
  langs: [fr, en, es, de, it, pt, nl]

  defaults:
    # MESURE, pas suppose (sondes des 2026-09-10 et 2026-09-11 sur asura-888) :
    #   - aucun modele Imagen n'est ouvert (404 « does not have access to it ») ;
    #   - gemini-2.5-flash-image repond partout et honore imageConfig.aspectRatio ;
    #   - Veo 3.1 / 3.0 / 2.0 ET Lyria repondent, us-central1 et europe-west4 ;
    #   - gemini-2.5-flash-tts repond en europe-west4 ; les variantes `-preview-tts`
    #     ne repondent QUE sur us-central1, donc n'en faites pas un defaut.
    image:
      model: "gemini-2.5-flash-image"
      aspect: "3:2"
      locations: ["europe-west4", "us-central1"]
    clip:
      model: "veo-3.1-generate-preview"
      duration: 8
      aspect: "16:9"
      audio: false                 # la bande-son vient de Lyria + de la voix : un plan
                                   # muet se remonte, un plan sonore s'impose.
      locations: ["us-central1", "europe-west4"]
    music:
      model: "lyria-002"
      locations: ["us-central1", "europe-west4"]
    voice:
      model: "gemini-2.5-flash-tts"
      # UNE seule voix pour les sept langues : la langue se deduit du texte, pas d'un
      # parametre. C'est ce qui donne l'unite de timbre qu'un catalogue par langue ne
      # donne pas — sept voix differentes feraient sept marques differentes.
      voice: "Kore"
      style: "Lis ce texte d'une voix chaleureuse et posee de conteur, sans emphase :"
      locations: ["europe-west4", "us-central1"]
    video:
      fps: 30
      fill: "blur"
      subtitles: "burned"

  steps:

    # =========================================================================
    # LES ASSETS HISTORIQUES, TOUS DECLARES. Un fichier pose dans un bundle et
    # declare nulle part est un RATE DE DECLARATION, pas une categorie a part :
    # il n'a ni etape, ni style, ni endroit ou ecrire un prompt, et la console ne
    # peut rien en faire. Ces trois etapes ferment ce trou — 120 fichiers sur 378
    # au 2026-09-11 : les icones d'interface, les musiques, les sons, les videos,
    # les images du site.
    #
    # ⚠ `source` VEUT DIRE « rien ne sait le refaire », et c'est la verite pour
    #   ceux-la : ils n'ont pas de prompt. Ce n'est pas un manque a combler d'un
    #   coup — c'est un etat CONNU. Demander la regeneration de l'un d'eux ne
    #   produit pas n'importe quoi : la console l'ecarte vers « a revoir », et la
    #   revue propose de le garder, d'en televerser une reprise, ou d'en ecrire un
    #   prompt. Ecrire ce prompt le fera passer de `source` a `image`, ici meme.
    #
    # ⚠ EN PREMIER, ET C'EST L'ORDRE QUI COMPTE. Les jokers ci-dessous ratissent
    #   large et recouvrent des fichiers que les etapes SUIVANTES declarent plus
    #   precisement — les huit guides, les 205 familles, les captures du site. La
    #   derniere declaration l'emporte : les precises doivent donc passer apres.
    - name: historique_core
      enabled: true
      dir: "resources"
      items:
        icones:   { kind: source, out: "icon/*.png" }
        splash:   { kind: source, out: "images/splashs/*.png" }

    # =========================================================================

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_splash:
          kind: image
          out: "images/splashs/splash.png"
          prompt: >-
            Le personnage de la référence, un nain barbu, un elfe et un magicien, nettoient un grand dragon marron au milieu d'une montagne d'or et de trésors dans une grande salle de château sombre et poussiéreuse.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_eu:
          kind: image
          out: "icon/eu.png"
          prompt: >-
            Le drapeau de l'Union européenne, avec un fond bleu uni et douze étoiles dorées à cinq branches disposées en cercle au centre. Les étoiles sont uniformément espacées et pointent vers le haut. Le style est graphique et minimaliste, avec des couleurs vives et un éclairage uniforme.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_google:
          kind: image
          out: "icon/google.png"
          prompt: >-
            Le logo Google, un "G" majuscule stylisé, est composé de plusieurs couleurs vives : le haut est rouge, le côté gauche est un dégradé de jaune, vert et bleu, et la barre horizontale est bleue. Le logo est net et détouré sur un fond transparent, avec un éclairage uniforme qui met en valeur les couleurs vives.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_icon:
          kind: image
          out: "icon/icon.png"
          prompt: >-
            Un ours en peluche marron, avec des cornes de démon et des yeux rouges lumineux, est assis de face, tenant une épée en bois dans sa main droite, devant un bouclier médiéval gris et usé. Le style est un dessin numérique aux contours épais et expressifs, avec des textures de tissu et de métal détaillées, une palette de couleurs terreuses et sombres rehaussée par le rouge vif des yeux, et un éclairage qui met en valeur les reliefs et les ombres, le tout détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_shield:
          kind: image
          out: "icon/shield.png"
          prompt: >-
            Un blason médiéval détaillé, divisé en quartiers or et violet, avec un plumeau et un balai croisés en son centre, entourés de volutes de poussière et de quelques pièces d'or et de pierres précieuses éparses en bas ; le tout est encadré d'une bordure métallique ornée et surmonté d'un bandeau portant l'inscription "DONJON ET SAVON". Style d'illustration de jeu vidéo fantastique, avec des couleurs riches et saturées, des textures réalistes et un éclairage doux et diffus qui met en valeur les détails.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_core_us:
          kind: image
          out: "icon/us.png"
          prompt: >-
            Le drapeau des États-Unis d'Amérique, avec cinquante étoiles blanches sur un canton bleu et treize bandes horizontales alternées rouges et blanches. Le drapeau est représenté de manière simple et graphique, avec des couleurs vives et un design plat.
    - name: historique_donjon
      enabled: true
      dir: "resources_cloud/donjon"
      items:
        big:      { kind: source, out: "images/big/*.png" }
        medium:   { kind: source, out: "images/medium/*.png" }
        # 33 icones d'interface : le kebab, les fleches, les pastilles d'admin.
        small:    { kind: source, out: "images/small/*.png" }
        splashs:  { kind: source, out: "images/splashs/*.png" }
        pirates:  { kind: source, out: "images/splashs/pirates/*.png" }
        musiques: { kind: source, out: "music/*.mp3" }
        sons:     { kind: source, out: "sounds/*.mp3" }
        videos:   { kind: source, out: "videos/*.mp4" }

    # =========================================================================

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_coffreritual:
          kind: image
          out: "images/big/CoffreRitual.png"
          prompt: >-
            Le personnage de la référence 2, un chevalier, tient une serpillière et lève un poing en l'air, le personnage de la référence 1, une elfe, tient un plumeau et lève une jambe en l'air, et le personnage de la référence 3, un bébé, est assis par terre et applaudit, tous les trois devant un coffre au trésor ouvert rempli de pièces d'or et de bijoux, dans une grotte.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_logo:
          kind: image
          out: "images/big/logo.png"
          prompt: >-
            Le personnage de la référence est assis sur le côté gauche d'un logo doré et orné qui dit "Donjons & Savons" avec un dragon entrelacé dans le texte, le tout sur un fond texturé de bois sombre.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_playstore:
          kind: image
          out: "images/big/playstore.png"
          prompt: >-
            Le personnage de la référence est assis à gauche du texte "Donjons & Savons" qui est écrit en lettres dorées avec un dragon en arrière-plan, et à droite du texte se trouve un seau doré avec un balai à franges et des bulles de savon.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_chestok:
          kind: image
          out: "images/medium/chestok.png"
          prompt: >-
            Le personnage de la référence est un coffre au trésor en bois avec des ferrures métalliques, ouvert, rempli de pièces d'or, de bijoux, de couronnes et d'autres trésors scintillants, avec quelques pièces d'or éparpillées sur le sol devant lui.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adult:
          kind: image
          out: "images/small/adult.png"
          prompt: >-
            Le personnage de la référence, mais en version adulte et debout, tenant une hache, avec un petit ours en peluche assis sur une couverture à carreaux avec un hochet et une petite voiture à ses pieds, et une flèche bleue incurvée pointant du petit ours vers le grand ours, avec un coffre au trésor à côté du grand ours.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_cadeau:
          kind: image
          out: "images/small/cadeau.png"
          prompt: >-
            Le personnage de la référence est assis, souriant, et tient un cadeau coloré emballé avec un ruban doré dans sa patte droite.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_chestip:
          kind: image
          out: "images/small/chestip.png"
          prompt: >-
            Le personnage de la référence est un coffre en bois avec des renforts métalliques, un visage souriant, posé sur un sol blanc avec quelques pièces d'or et des petits cailloux.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_nomore_chef:
          kind: image
          out: "images/small/nomore_chef.png"
          prompt: >-
            Le personnage de la référence est assis, tenant une épée en bois dans sa main droite, et porte une couronne dorée ornée de pierres précieuses sur sa tête, avec une croix rouge barrant la couronne.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_splash:
          kind: image
          out: "images/splashs/pirates/splash.png"
          prompt: >-
            Un groupe de quatre aventuriers, dont un nain barbu, un jeune homme en armure, une femme en tenue de pirate et un magicien, nettoient un kraken géant sur le pont d'un navire en pleine mer, entourés de pièces d'or et de trésors.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_splash_pirate_pirate_v2:
          kind: image
          out: "images/splashs/splash-pirate_pirate_v2.png"
          prompt: >-
            Un groupe d'aventuriers nettoie un kraken géant sur le pont d'un navire pirate en pleine mer, avec le personnage de la référence en haut de l'échelle nettoyant le dos du kraken, le nain de la référence sur une échelle nettoyant le flanc du kraken, le jeune chevalier de la référence sur un tabouret nettoyant la bouche du kraken, et le magicien de la référence à droite, tenant une baguette magique et un seau, tandis que des pièces d'or et des trésors sont éparpillés sur le pont.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_chest:
          kind: image
          out: "images/big/chest.png"
          prompt: >-
            Un coffre au trésor en bois ancien et robuste, avec des renforts métalliques rouillés et des rivets, présente un visage souriant et malicieux sculpté sur sa façade, avec des yeux plissés et une large bouche. Quelques pièces d'or et d'argent sont éparpillées à sa base, le tout est rendu dans un style de dessin animé détaillé avec des textures riches, des ombres douces et un éclairage diffus, détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_gameover:
          kind: image
          out: "images/big/gameover.png"
          prompt: >-
            Un squelette en robe de faucheur noire, l'air perplexe et se grattant la tête, tient une faux et se tient au milieu d'un tas de terre et de débris, incluant des crânes, des bottes, un bouclier, un seau, une serpillière et des vaporisateurs de nettoyage. Le style est une illustration de dessin animé avec des contours nets, des couleurs vives et un ombrage doux, sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_titre_clan:
          kind: image
          out: "images/big/titre_clan.png"
          prompt: >-
            Un médaillon de forme bouclier en or et argent, orné d'une tête d'ours et de feuilles de laurier en haut, d'une étoile à huit branches avec un serpent enroulé autour en son centre, d'un ruban avec l'inscription "FORTITER ET FIDELITER" et d'une pile de pièces en bas, est suspendu à un ruban rouge et doré. Le style est une illustration numérique détaillée avec des textures métalliques réalistes, des reflets brillants et des ombres profondes, le tout détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_titre_perso:
          kind: image
          out: "images/big/titre_perso.png"
          prompt: >-
            Une médaille militaire dorée et argentée, en forme de bouclier, est suspendue à un ruban vert olive plissé avec une épingle de fixation. Le bouclier est surmonté d'une couronne et orné d'une tête d'ours aux yeux rouges, encadrée de feuilles de chêne, avec un ruban portant l'inscription "HONORIS CAUSA" en dessous. L'illustration est détaillée et réaliste, avec des textures métalliques et un éclairage qui met en valeur les reliefs, le tout détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_bourse:
          kind: image
          out: "images/medium/bourse.png"
          prompt: >-
            Un sac de toile marron clair rempli à ras bord de pièces d'or rondes et épaisses, certaines tombées autour de la base du sac, le tout détouré sur fond transparent. Les pièces sont dorées avec un bord argenté et un motif d'étoile gravé, le sac est fermé par un cordon noué. Style de peinture numérique détaillé, avec des textures riches, des ombres douces et des reflets réalistes sur les pièces, éclairage diffus.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_fairy_tile:
          kind: image
          out: "images/medium/fairy_tile.png"
          prompt: >-
            Une fée souriante aux longs cheveux argentés, vêtue d'une robe de femme de chambre avec un tablier et une bouteille de spray, tient une boîte cadeau scintillante dans chaque main, ses ailes translucides parsemées de bulles et d'étoiles. Le personnage est en pleine longueur, dans un style anime détaillé et lumineux, avec des couleurs pastel douces et un éclairage féerique, détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_nope:
          kind: image
          out: "images/medium/nope.png"
          prompt: >-
            Un grand point d'interrogation de couleur vert olive est centré dans un cercle épais de la même couleur, bordé d'un fin contour marron. Le sujet est détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_nounours:
          kind: image
          out: "images/medium/nounours.png"
          prompt: >-
            Un ours en peluche marron, usé et rapiécé, avec des cornes de démon grises et des yeux rouges lumineux, est assis de face, tenant une épée en bois dans sa main droite, devant un bouclier médiéval gris et rouillé ; le tout est dessiné dans un style cartoon détaillé avec des contours épais, des ombres marquées et une palette de couleurs terreuses, sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_ring:
          kind: image
          out: "images/medium/ring.png"
          prompt: >-
            Un anneau épais de couleur vert olive avec un contour fin de couleur rouille, détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_shield:
          kind: image
          out: "images/medium/shield.png"
          prompt: >-
            Un bouclier de chevalier en métal, usé et rouillé, avec une étoile à sept branches fissurée en son centre, est représenté de face. Le style est celui d'une illustration de jeu vidéo, avec des contours nets, des textures détaillées et un éclairage uniforme, le tout sur un fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_add:
          kind: image
          out: "images/small/adm_add.png"
          prompt: >-
            Un symbole plus (+) parfaitement symétrique, de couleur or mat, avec des bras de largeur égale et des extrémités carrées, est détouré sur fond transparent. Le style est minimaliste et graphique, avec des lignes nettes et une texture lisse, sous un éclairage uniforme et doux qui met en valeur la couleur sans ombres prononcées.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_cross:
          kind: image
          out: "images/small/adm_cross.png"
          prompt: >-
            Une croix rouge épaisse, formée de deux bandes rectangulaires qui se croisent en leur centre, avec un contour noir fin. Le sujet est détouré sur fond transparent, dans un style graphique simple et plat, sans ombres ni dégradés.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_disable:
          kind: image
          out: "images/small/adm_disable.png"
          prompt: >-
            Un panneau d'interdiction universel, un cercle orange épais avec une barre diagonale du haut gauche au bas droit, le tout sur fond transparent. Le style est une icône vectorielle simple et plate, avec des lignes nettes et une couleur unie, sans ombres ni dégradés.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_enable:
          kind: image
          out: "images/small/adm_enable.png"
          prompt: >-
            Un grand symbole de coche vert vif, épais et anguleux, est orienté vers le haut et la droite. Le symbole est détouré sur fond transparent, avec un style graphique simple et net.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_hide:
          kind: image
          out: "images/small/adm_hide.png"
          prompt: >-
            Un œil stylisé, de couleur rouge foncé, est barré par une ligne diagonale de la même couleur, indiquant une fonction de masquage ou d'invisibilité. Le dessin est simple, avec des lignes épaisses et un aspect légèrement texturé, détouré sur fond transparent.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_adm_show:
          kind: image
          out: "images/small/adm_show.png"
          prompt: >-
            Un œil stylisé, vert vif, avec un iris et une pupille concentriques, le tout détouré sur fond transparent. Le style est minimaliste, avec des lignes épaisses et uniformes, évoquant un pictogramme ou une icône.

        # Item cree par `bundles apply` : un prompt ecrit depuis
        # la console demande une declaration a lui.
        historique_donjon_crown:
          kind: image
          out: "images/small/crown.png"
          prompt: >-

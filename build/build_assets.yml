    - name: plans
      enabled: false
      # DESACTIVEE tant que les captures ne sont pas la : une etape desactivee est
      # invisible, ni generee ni verifiee. La reactiver lancera Veo et Lyria, ce qui se
      # compte en minutes et en argent reel — d'ou le drapeau plutot qu'un essai timide.
      #
      # CONTRAINTE DE PROMPT, non verifiable par le code : aucun plan ne doit montrer
      # quelqu'un PARLER face camera. La voix off est remplacee langue par langue ; une
      # bouche qui articule le francais sous une phrase allemande ruinerait la video.
      dir: "resources_others/video/sources"
      style: >
        Warm hand-drawn animated illustration, soft ink outlines and light watercolour
        washes, gentle camera. Cosy family home with a faint medieval fantasy wink.
        No on-screen text, no letters, no logo, no watermark. Nobody speaks to camera.
      items:

        clip_intro:
          kind: clip
          out: "clip_intro.mp4"
          # La premiere image vient d'une planche DEJA validee : le clip anime ce qui
          # existe au lieu de reinventer le decor et les personnages.
          refs: [guide_k1]
          prompt: >
            The family lowers their brooms and mops like adventurers at the end of a quest,
            the camera drifting slowly backwards to reveal the tidy room around them.
        clip_chest:
          kind: clip
          out: "clip_chest.mp4"
          refs: [guide_p3]
          prompt: >
            The wooden chest lids opens slowly, warm golden light spilling out over the
            faces around it. Slow push in towards the glow.
        music_theme:
          kind: music
          out: "music_theme.wav"
          prompt: >
            Gentle warm acoustic theme, light plucked strings and soft flute, medieval
            folk flavour, unhurried and hopeful, suitable as a quiet background bed under
            a spoken narration. No drums, no big climax.
          negative: "aggressive, epic, orchestral hits, vocals, drums"

    # =========================================================================
    - name: videos
      enabled: false
      # DESACTIVEE : a activer une fois les captures deposees et l'etape `plans` passee.
      #
      # Il n'y a PAS de « video maitre » qu'on habillerait. Il y a des PLANS sans langue,
      # et la duree de chaque plan est celle de sa narration DANS LA LANGUE COURANTE :
      # une phrase allemande plus longue allonge son plan, un clip trop court est prolonge
      # sur sa derniere image. La version allemande dure donc plus longtemps que
      # l'anglaise sans qu'un seul plan ait ete regenere.
      items:

        demo:
          kind: video
          # Video de DEMONSTRATION : montage de captures, pas une generation. Sept
          # montages, chacun a partir des captures de sa langue. Confier des captures a
          # un generateur video reviendrait a le laisser reinventer l'interface, avec des
          # boutons qui n'existent pas et du texte deforme.
          music: music_theme
          shots:
            - visual: clip_intro
              min_duration: 4.0
              text:
                fr: "Dans Donjons & Savons, les tâches de la maison deviennent des monstres à vaincre."
                en: "In Donjons & Savons, household chores become monsters to defeat."
                es: "En Donjons & Savons, las tareas del hogar se convierten en monstruos que vencer."
                de: "In Donjons & Savons wird aus Hausarbeit ein Monster, das besiegt werden will."
                it: "In Donjons & Savons, le faccende di casa diventano mostri da sconfiggere."
                pt: "Em Donjons & Savons, as tarefas da casa tornam-se monstros a derrotar."
                nl: "In Donjons & Savons worden huishoudelijke klusjes monsters om te verslaan."
            - visual: cap_33_me
              motion: zoom_in
              min_duration: 3.5
              text:
                fr: "Chaque membre du clan a son personnage, ses points de vie et son expérience."
                en: "Every clan member has their own character, health points and experience."
                es: "Cada miembro del clan tiene su personaje, sus puntos de vida y su experiencia."
                de: "Jedes Clanmitglied hat einen eigenen Charakter, Lebenspunkte und Erfahrung."
                it: "Ogni membro del clan ha il suo personaggio, i punti vita e l'esperienza."
                pt: "Cada membro do clã tem o seu personagem, pontos de vida e experiência."
                nl: "Elk clanlid heeft een eigen personage, levenspunten en ervaring."

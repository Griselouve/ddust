    - name: personnages
      enabled: true
      # LES TROIS PLANCHES DE REFERENCE du theme donjon. Elles ont servi, a la main,
      # a fabriquer presque tout le reste — les monstres de taches, les avatars, les
      # icones de domaine. Ce lien n'existait nulle part : ni dans les dates de
      # fichiers, ni dans les noms. Le declarer ici, c'est ce qui permettra plus tard
      # a une cascade de savoir ce qu'une retouche de l'elfe entraine.
      dir: "resources_cloud/donjon/images/medium"
      items:
        ref_elfe:
          kind: source
          out: "intro_little_elfe.png"
          prompt: >-
            Une jeune elfe souriante aux cheveux blonds tressés, portant des lunettes rondes et vêtue d'une robe et d'une cape rapiécées marron, lève une jambe et tient une petite brosse à poussière d'où s'échappent des étincelles dorées, à côté d'un seau métallique rouillé. Le personnage est dessiné dans un style d'illustration de jeu vidéo, avec des contours marqués et une palette de couleurs terreuses, le tout détouré sur fond transparent.
        ref_hobbit:
          kind: source
          out: "intro_little_hobbit.png"
          prompt: >-
            Un jeune garçon aux cheveux bruns ébouriffés, vêtu d'une chemise déchirée et d'une couche, est assis les jambes écartées, couvert de mousse et de bulles, tenant un chiffon sale. Un seau renversé avec de l'eau savonneuse et des nuages de mousse sont au sol, tandis que des bulles flottent autour de lui. Style dessin animé, couleurs vives et saturées, éclairage doux et diffus, détouré sur fond transparent.
        ref_knight:
          kind: source
          out: "intro_little_knight.png"
          prompt: >-
            Un jeune chevalier en armure complète, avec un bouclier sur le dos, nettoie le sol avec une serpillière et un seau, dans une pose dynamique, la langue tirée, entouré d'éclaboussures d'eau et de bulles. Illustration de style manga, avec un trait fin et des couleurs vives, des reflets brillants sur l'armure et l'eau, détourée sur fond transparent.

    # =========================================================================
    - name: familles
      enabled: true
      # LE GROS DU TRAVAIL, EN QUATRE LIGNES. Chaque `out` porte un JOKER et se deplie
      # sur les fichiers existants. 205 des 218 fichiers de `images/medium` sont couverts
      # ici ; les tracer a la souris dans draw.io aurait demande plus de six cents
      # fleches identiques.
      #
      # ⚠ PLUS DE `refs:` AU NIVEAU DE L'ETAPE, ET C'EST UN RETRAIT DELIBERE DU
      #   2026-09-12. Elles posaient les trois personnages d'introduction comme parents
      #   de CHACUN des 205 fichiers — 615 liens approximatifs. C'etait juste tant que
      #   rien de plus fin n'existait ; le marquage a la main a depuis donne a chaque
      #   monstre son parent UNIQUE ET REEL.
      #
      # ⚠ ET CE N'ETAIT PLUS UNE SIMPLE IMPRECISION : LA CASCADE SE CALCULE SUR CE
      #   GRAPHE. Le sous-graphe de l'elfe comptait 218 assets, c'est-a-dire presque tout
      #   `images/medium` ; regenerer l'elfe proposait donc de regenerer 138 monstres qui
      #   n'en descendent pas — et l'ecran de cout chiffrait cette erreur en euros.
      #
      # ⚠ L'ETAPE, ELLE, RESTE. C'est elle qui porte l'`item` de chaque fichier, donc le
      #   regroupement de style de `bundles prompts` : monstres 138, avatars 42,
      #   domaines 21, clans 4. La retirer ferait retomber les quatre series sur un
      #   regroupement par repertoire et leur ferait perdre leur style commun.
      dir: "resources_cloud/donjon/images/medium"
      items:
        # 138 monstres de taches, un par feuille de tache.
        monstres:   { kind: source, out: "dt_t_*.png" }
        # ⚠ CES TROIS ITEMS NE DOIVENT PAS LEUR ASPECT A UNE IMAGE SOURCE, MAIS A UN
        #   OUTIL. Le cercle dore vient de `tools/iconify.py`, le detourage de
        #   `tools/remove_bg.py` — passes a la main, systematiquement, et le prefixe du
        #   fichier le dit encore. Sans `traitements:`, une regeneration rendrait le
        #   dessin NU : pas de cercle, pas de detourage. Le fichier serait valide, du bon
        #   format, et la difference ne se verrait qu'a l'oeil, une fois publiee.
        #
        #   Aujourd'hui ils sont `kind: source` sans prompt, donc personne ne peut les
        #   regenerer. La declaration est INERTE et c'est voulu : elle protege le jour ou
        #   on leur donnera un prompt.

        # 42 avatars de joueur et 4 icones de clan, passes par l'anneau dore.
        avatars:    { kind: source, out: "icon_01_P_*.png", traitements: [iconify] }
        clans:      { kind: source, out: "icon_01_C_*.png", traitements: [iconify] }
        # 21 icones de domaine, detourees.
        domaines:
          kind: source
          out: "task_*_nobg.png"
          # `fonction:` parce que le module s'appelle `remove_bg` et la fonction
          # `remove_background` : sans elle, le chargeur chercherait `remove_bg`.
          traitements:
            - { outil: remove_bg, fonction: remove_background }


    - name: historique_web
      enabled: true
      dir: "hosting/web/assets"
      items:
        images:   { kind: source, out: "img/*.webp" }
        # Les clips du site, leurs affiches et les versions webp de celles-ci.
        # NOM UNIQUE DANS TOUT LE FICHIER, et pas seulement dans son etape. assetgen
        # indexe ses items PAR NOM : un second `videos` etait refuse et le build
        # s'arretait. L'inventaire, lui, indexe par CHEMIN et ne voyait rien.
        clips:    { kind: source, out: "video/*.mp4" }
        affiches: { kind: source, out: "video/*.png" }
        affichesw: { kind: source, out: "video/*.webp" }

    # =========================================================================
    - name: guides
      enabled: true
      # Les huit illustrations des lecons dvtuto guide_parent / guide_enfant.
      # DEJA PRODUITES le 2026-09-10 : cette etape ne regenere rien. Elle reste
      # declaree pour deux raisons — le prompt est la seule trace de leur fabrication,
      # et la declaration vaut liste de controle si l'une venait a disparaitre.
      dir: "resources_cloud/donjon/images/big"
      style: >
        Loose hand-drawn ink sketch, thin confident black line work, visible pencil
        under-drawing, deliberately unfinished. Only two or three flat watercolour
        washes: warm amber, muted blue-grey, soft terracotta. Off-white paper
        background with plenty of empty space. Light, airy and readable at small size,
        NOT a rich detailed game illustration. Warm, gentle, everyday family mood.
        A modern home, with a faint medieval wink in the props only. Simple rounded
        faces, friendly expressions, no realistic portraits. Wide landscape
        composition, subjects centred, generous margins. Absolutely no text, no
        letters, no numbers, no speech bubbles, no logo, no watermark, no frame.
      items:

        # -- Guide du parent. L'ordre compte : l'effort ouvre, la mort suit. Ouvrir sur
        #    « votre enfant est mort » installerait le contresens que ces ecrans defont.
        guide_p1:
          kind: image
          out: "guide_p1.png"
          prompt: >
            A young person stands proudly beside a bed that is only half made, holding up
            a phone to show a photo of it. A parent crouches down to their height, smiling,
            one hand pointing warmly at the part that IS done. Encouragement, never
            scolding.
        guide_p2:
          kind: image
          out: "guide_p2.png"
          prompt: >
            A young person sits on the floor hugging their knees, their phone set face-down
            beside them, looking away and a little flat. A parent sits down on the floor at
            the same height, leaning in gently to ask what is going on. Concern and
            closeness, no anger, no pointing finger. A tiny cartoon skull floats faintly
            above the phone, drawn as a small icon.
        guide_p3:
          kind: image
          out: "guide_p3.png"
          prompt: >
            A family sitting on a living-room rug around an open wooden treasure chest.
            Instead of gold, what rises out of the chest are small symbols of shared time:
            a picnic basket, a board game, a pair of cinema tickets, a football. Everyone
            leans in, delighted.
        guide_p4:
          kind: image
          out: "guide_p4.png"
          prompt: >
            A tall parent carrying an absurdly high tower of folded laundry, while two much
            smaller family members stand below holding a single sock each, looking up. The
            parent smiles and takes a step back to make room for them. Gentle humour about
            the imbalance.

        # -- Guide de l'aventurier. Meme mecanique, mais chaque ecran dit un DROIT et
        #    jamais un devoir : recommencer, refuser, garder sa photo, recevoir sa part.
        guide_k1:
          kind: image
          out: "guide_k1.png"
          prompt: >
            Four family members standing shoulder to shoulder like a small adventuring
            party, holding a broom, a feather duster and a watering can the way one holds a
            sword or a staff. Grinning, ready, united. A rolled-up rug carried as their
            banner.
        guide_k2:
          kind: image
          out: "guide_k2.png"
          prompt: >
            A young person looks at their phone, where a small row of hearts has gone faint.
            With their other hand they pick up a broom, and one heart lights up bright and
            full again. Reassuring and hopeful, not dramatic.
        guide_k3:
          kind: image
          out: "guide_k3.png"
          prompt: >
            A young person cheerfully starting a household task over again from the
            beginning, sleeves rolled up. A parent stands a little behind, giving a warm
            thumbs up. A soft circular arrow drawn around them suggests going round once
            more. Nothing sad, nothing shameful.
        guide_k4:
          kind: image
          out: "guide_k4.png"
          prompt: >
            In the foreground, a young person holds a phone close to their chest, screen
            turned away from everyone, smiling with a small proud secret. Behind them,
            slightly out of focus, the rest of the family celebrates around an open wooden
            chest.


# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  # --- Traductions du TUTORIEL --------------------------------------------------
  # Volontairement dans config.yml (PAS dans le thème) : un seul tutoriel pour TOUS les thèmes, les
  # libellés doivent survivre à un changement de thème. Fusionnées dans lang.translations.
  # --- L'ECRAN DU SEUIL ---------------------------------------------------------
  # L'ordre dans lequel la phrase d'accueil defile. L'anglais d'abord parce qu'il est
  # la langue de recours la plus largement reconnue — pas parce qu'il compte davantage ;
  # le francais suit, l'application etant d'abord vendue en France.
  #
  # ⚠ INDEPENDANT DES LANGUES OUVERTES (`lang.options`, les sept depuis le 2026-09-15) :
  #   on montre les langues CIBLES, y compris celles dont le marche n'est pas encore ouvert.
  #   Une langue qui defile ici ne promet rien d'autre que l'intention d'y aller.
  awake:
    # `br` (portugais du Brésil) juste après `pt` depuis le 2026-09-16 : les deux phrases
    # diffèrent (« espera-vos » / « espera vocês »), et un Brésilien doit voir la sienne.
    cycle: ["en", "fr", "es", "de", "it", "pt", "br", "nl"]

  lang:
    translations:
      # --- LE SEUIL (ecran `awake`) -------------------------------------------
      # ⚠ COMPILEE, ET PAS DANS LE THEME. Tout le reste des libelles vit dans le layer
      #   cloud, pour pouvoir etre corrige sans rebuild — mais cette phrase-ci est peinte
      #   a la PREMIERE FRAME de l'application, avant qu'un seul layer ne soit arrive.
      #   Dans le theme, elle s'affichait en clair : « awake_question ». C'etait logique :
      #   a cet instant l'application ne connait pas encore ses propres mots.
      #
      # C'est la premiere phrase du jeu, et la seule de son ecran. Elle pose une question
      # dont la reponse est le geste lui-meme : on ne repond pas « oui », on touche. D'ou
      # l'absence de bouton — un bouton aurait fait de ce franchissement un formulaire.
      # ⚠ LES SEPT LANGUES CIBLES, quelles que soient celles ouvertes. Cet ecran ne
      #   traduit pas : il DEFILE. A l'instant ou il parait, l'application ne sait pas
      #   encore a qui elle parle — ni royaume, ni compte, et la langue du systeme n'est
      #   qu'une presomption. Plutot que de parier, on montre la phrase dans chaque
      #   langue tour a tour, comme le font les telephones et les systemes au premier
      #   demarrage. Celui qui reconnait la sienne sait qu'il est au bon endroit ; les
      #   autres ont vu passer une invitation qu'ils comprendront a leur tour.
      #
      #   C'est aussi pour cela qu'elle vit dans la conf COMPILEE : elle est peinte a la
      #   premiere frame, avant qu'un seul layer cloud ne soit arrive.
      # Le titre de l'ecran des langues. Bilingue par necessite — a cet instant on ne
      # sait toujours pas a qui l'on parle, et c'est precisement la question posee.
      lang_choice_title:
        en: "Choose your language"
        fr: "Choisis ta langue"
        es: "Elige tu idioma"
        de: "Wähle deine Sprache"
        it: "Scegli la tua lingua"
        pt: "Escolhe o teu idioma"
        br: "Escolha seu idioma"
        nl: "Kies je taal"

      awake_question:
        en: "The dungeon awaits.\nAre you ready?"
        fr: "Le donjon vous attend.\nÊtes-vous prêt ?"
        es: "La mazmorra os espera.\n¿Estáis listos?"
        de: "Der Kerker erwartet euch.\nSeid ihr bereit?"
        it: "Il dungeon vi attende.\nSiete pronti?"
        pt: "A masmorra espera-vos.\nEstão prontos?"
        br: "A masmorra espera por vocês.\nEstão prontos?"
        nl: "De kerker wacht op jullie.\nZijn jullie klaar?"

      # ⚠ LES TROIS CORPS DE PROMPT ONT DÉMÉNAGÉ dans le layer cloud
      #   `resources_cloud/donjon/layers/theme-donjon-global.yml`. Ici ils étaient
      #   COMPILÉS : ajuster une contrainte de ton après un incident en production
      #   aurait demandé un build ET une release au store. Dans le layer, le garde-fou
      #   se corrige en poussant un fichier — c'est ce qui lui donne sa valeur.
      #   Ne PAS les redéclarer ici : la conf compilée est SOUS le layer (`above: conf`),
      #   une copie oubliée ne se verrait pas et servirait de repli silencieux.
      clan_menu_tutorials:
        fr: "Tutoriels"
        en: "Tutorials"
        es: "Tutoriales"
        de: "Tutorials"
        it: "Tutorial"
        pt: "Tutoriais"
        br: "Tutoriais"
        nl: "Tutorials"
      invite_consent_chief_check:
        fr: "Il sera aussi chef du clan"
        en: "They will also be a clan chief"
        es: "También será jefe del clan"
        de: "Er wird auch Clan-Anführer"
        it: "Sarà anche capo del clan"
        pt: "Também será chefe do clã"
        br: "Também será chefe do clã"
        nl: "Wordt ook clanleider"
      # welcome_child_screen : l'explication avant la caméra.
      welcome_child_intro:
        fr: "Installez le jeu sur le téléphone de votre enfant.\n\nLorsqu'il sera prêt à rejoindre votre clan, scannez le QR code qu'il affichera."
        en: "Install the game on your child's phone.\n\nWhen they're ready to join your clan, scan the QR code their phone shows."
        es: "Instale el juego en el teléfono de su hijo.\n\nCuando esté listo para unirse a su clan, escanee el código QR que mostrará."
        de: "Installieren Sie das Spiel auf dem Handy Ihres Kindes.\n\nSobald es bereit ist, Ihrem Clan beizutreten, scannen Sie den QR-Code, den es anzeigt."
        it: "Installate il gioco sul telefono di vostro figlio.\n\nQuando sarà pronto a unirsi al vostro clan, scansionate il codice QR che mostrerà."
        pt: "Instale o jogo no telemóvel do seu filho.\n\nQuando ele estiver pronto para entrar no seu clã, digitalize o código QR que ele mostrar."
        br: "Instale o jogo no celular do seu filho.\n\nQuando ele estiver pronto para entrar no seu clã, escaneie o QR code que ele mostrar."
        nl: "Installeer het spel op de telefoon van uw kind.\n\nZodra het klaar is om bij uw clan te komen, scant u de QR-code die het laat zien."
      welcome_child_scan:
        fr: "Scanner son QR code"
        en: "Scan their QR code"
        es: "Escanear su código QR"
        de: "QR-Code scannen"
        it: "Scansiona il suo codice QR"
        pt: "Digitalizar o código QR"
        br: "Escanear o QR code"
        nl: "QR-code scannen"
      clan_menu_add_child:
        fr: "Ajouter mon enfant"
        en: "Add my child"
        es: "Añadir a mi hijo"
        de: "Mein Kind hinzufügen"
        it: "Aggiungi mio figlio"
        pt: "Adicionar o meu filho"
        br: "Adicionar meu filho"
        nl: "Mijn kind toevoegen"
      clan_menu_add_child_desc:
        fr: "Ton enfant rejoint le clan, qu'il ait son propre téléphone ou non."
        en: "Your child joins the clan, whether or not they have their own phone."
        es: "Tu hijo se une al clan, tenga o no su propio teléfono."
        de: "Dein Kind tritt dem Clan bei, ob es ein eigenes Handy hat oder nicht."
        it: "Tuo figlio entra nel clan, che abbia o no un telefono suo."
        pt: "O teu filho entra no clã, tenha ou não telemóvel próprio."
        br: "Seu filho entra no clã, tenha ou não celular próprio."
        nl: "Je kind komt bij de clan, met of zonder eigen telefoon."
      clan_menu_advanced:
        fr: "Options avancées…"
        en: "Advanced options…"
        es: "Opciones avanzadas…"
        de: "Erweiterte Optionen…"
        it: "Opzioni avanzate…"
        pt: "Opções avançadas…"
        br: "Opções avançadas…"
        nl: "Geavanceerde opties…"
      perso_menu_advanced_desc:
        fr: "Langue, rappels, notifications, documents, suppression du compte…"
        en: "Language, reminders, notifications, documents, account deletion…"
        es: "Idioma, recordatorios, notificaciones, documentos, eliminación de la cuenta…"
        de: "Sprache, Erinnerungen, Benachrichtigungen, Dokumente, Kontolöschung…"
        it: "Lingua, promemoria, notifiche, documenti, eliminazione dell'account…"
        pt: "Idioma, lembretes, notificações, documentos, eliminação da conta…"
        br: "Idioma, lembretes, notificações, documentos, exclusão da conta…"
        nl: "Taal, herinneringen, meldingen, documenten, account verwijderen…"
      death_menu_advanced_desc:
        fr: "Rappels, documents, suppression du compte…"
        en: "Reminders, documents, account deletion…"
        es: "Recordatorios, documentos, eliminación de la cuenta…"
        de: "Erinnerungen, Dokumente, Kontolöschung…"
        it: "Promemoria, documenti, eliminazione dell'account…"
        pt: "Lembretes, documentos, eliminação da conta…"
        br: "Lembretes, documentos, exclusão da conta…"
        nl: "Herinneringen, documenten, account verwijderen…"
      clan_menu_advanced_desc:
        fr: "Invitation à distance, clans de tes enfants, IA du clan, parrainage…"
        en: "Remote invitation, your children's clans, clan AI, sponsorship…"
        es: "Invitación a distancia, clanes de tus hijos, IA del clan, padrinazgo…"
        de: "Einladung aus der Ferne, Clans deiner Kinder, Clan-KI, Patenschaft…"
        it: "Invito a distanza, clan dei tuoi figli, IA del clan, padrinato…"
        pt: "Convite à distância, clãs dos teus filhos, IA do clã, apadrinhamento…"
        br: "Convite a distância, clãs dos seus filhos, IA do clã, indicação…"
        nl: "Uitnodiging op afstand, clans van je kinderen, clan-AI, peterschap…"
      tutoriels_title:
        fr: "Tutoriels"
        en: "Tutorials"
        es: "Tutoriales"
        de: "Tutorials"
        it: "Tutorial"
        pt: "Tutoriais"
        br: "Tutoriais"
        nl: "Tutorials"
      tuto_dashboard_intro_title:
        fr: "Écran principal"
        en: "Main screen"
        es: "Pantalla principal"
        de: "Hauptbildschirm"
        it: "Schermata principale"
        pt: "Ecrã principal"
        br: "Tela principal"
        nl: "Hoofdscherm"
      tuto_header:
        fr: "TUTORIEL"
        en: "TUTORIAL"
        es: "TUTORIAL"
        de: "TUTORIAL"
        it: "TUTORIAL"
        pt: "TUTORIAL"
        br: "TUTORIAL"
        nl: "TUTORIAL"
      tuto_tap_continue:
        fr: "Touchez pour continuer"
        en: "Tap to continue"
        es: "Toca para continuar"
        de: "Tippe, um fortzufahren"
        it: "Tocca per continuare"
        pt: "Toca para continuar"
        br: "Toque para continuar"
        nl: "Tik om verder te gaan"
      tuto_skip:
        fr: "Passer"
        en: "Skip"
        es: "Saltar"
        de: "Überspringen"
        it: "Salta"
        pt: "Saltar"
        br: "Pular"
        nl: "Overslaan"
      tuto_skip_hint_title:
        fr: "Les tutoriels t'attendent"
        en: "Tutorials are waiting for you"
        es: "Los tutoriales te esperan"
        de: "Die Tutorials warten auf dich"
        it: "I tutorial ti aspettano"
        pt: "Os tutoriais esperam por ti"
        br: "Os tutoriais esperam por você"
        nl: "De tutorials wachten op je"
      tuto_skip_hint_text:
        fr: "Tu pourras revoir chaque tutoriel quand tu voudras : écran Clan, menu ⋮ en haut à droite, puis « Tutoriels »."
        en: "You can replay any tutorial whenever you like: Clan screen, the ⋮ menu at the top right, then “Tutorials”."
        es: "Podrás volver a ver cada tutorial cuando quieras: pantalla Clan, menú ⋮ arriba a la derecha y luego «Tutoriales»."
        de: "Du kannst jedes Tutorial jederzeit wieder ansehen: Clan-Bildschirm, Menü ⋮ oben rechts, dann „Tutorials“."
        it: "Potrai rivedere ogni tutorial quando vuoi: schermata Clan, menu ⋮ in alto a destra, poi «Tutorial»."
        pt: "Podes rever cada tutorial quando quiseres: ecrã Clã, menu ⋮ no canto superior direito e depois «Tutoriais»."
        br: "Você pode rever cada tutorial quando quiser: tela Clã, menu ⋮ no canto superior direito e depois “Tutoriais”."
        nl: "Je kunt elke tutorial bekijken wanneer je wilt: Clan-scherm, menu ⋮ rechtsboven, dan „Tutorials”."
      tuto_dash_shop:
        fr: "La Boutique : extensions, packs et thèmes pour enrichir ton aventure (bientôt disponible)."
        en: "The Shop: expansions, packs and themes to enrich your adventure (coming soon)."
        es: "La Tienda: expansiones, packs y temas para enriquecer tu aventura (próximamente)."
        de: "Der Laden: Erweiterungen, Pakete und Themen, um dein Abenteuer zu bereichern (bald verfügbar)."
        it: "Il Negozio: espansioni, pacchetti e temi per arricchire la tua avventura (presto disponibile)."
        pt: "A Loja: expansões, pacotes e temas para enriquecer a tua aventura (brevemente)."
        br: "A Loja: expansões, pacotes e temas para enriquecer sua aventura (em breve)."
        nl: "De Winkel: uitbreidingen, pakketten en thema's om je avontuur te verrijken (binnenkort beschikbaar)."
      tuto_dash_clan:
        fr: "Ton Clan : retrouve tes compagnons et le journal du clan."
        en: "Your Clan: find your companions and the clan log."
        es: "Tu Clan: reúnete con tus compañeros y consulta el registro del clan."
        de: "Dein Clan: Hier findest du deine Gefährten und das Tagebuch des Clans."
        it: "Il tuo Clan: ritrova i tuoi compagni e il diario del clan."
        pt: "O teu Clã: reencontra os teus companheiros e o diário do clã."
        br: "Seu Clã: reencontre seus companheiros e o diário do clã."
        nl: "Je Clan: vind je metgezellen en het dagboek van de clan terug."
      # Version chef. Ne dit PLUS « retrouve tes compagnons » : cette leçon se joue à la toute
      # première arrivée sur le dashboard, quand le fondateur est encore seul dans son clan — il n'a
      # aucun compagnon à retrouver. C'est là qu'il RECRUTE, et c'est ce qu'il faut lui annoncer.
      tuto_dash_clan_admin:
        fr: "Ton Clan : c'est ici que tu recrutes tes aventuriers et que tu gères les membres du clan — et que tu retrouves le journal du clan."
        en: "Your Clan: this is where you recruit your adventurers and manage clan members — and where you find the clan log."
        es: "Tu Clan: aquí reclutas a tus aventureros y gestionas los miembros del clan — y aquí encuentras el registro del clan."
        de: "Dein Clan: Hier rekrutierst du deine Abenteurer, verwaltest die Clanmitglieder und findest das Tagebuch des Clans."
        it: "Il tuo Clan: qui recluti i tuoi avventurieri e gestisci i membri del clan, e qui ritrovi il diario del clan."
        pt: "O teu Clã: é aqui que recrutas os teus aventureiros e geres os membros do clã, e que encontras o diário do clã."
        br: "Seu Clã: é aqui que você recruta seus aventureiros, gerencia os membros do clã e encontra o diário do clã."
        nl: "Je Clan: hier werf je je avonturiers, beheer je de clanleden en vind je het dagboek van de clan."
      tuto_dash_combat:
        fr: "Le Combat : c'est ici que tu choisis une tâche à accomplir pour gagner de l'XP."
        en: "Combat: this is where you pick a task to complete and earn XP."
        es: "El Combate: aquí eliges una tarea para completar y ganar XP."
        de: "Der Kampf: Hier wählst du eine Aufgabe, die du erledigst, um XP zu verdienen."
        it: "Il Combattimento: qui scegli un compito da portare a termine per guadagnare XP."
        pt: "O Combate: é aqui que escolhes uma tarefa para cumprir e ganhar XP."
        br: "O Combate: é aqui que você escolhe uma tarefa para cumprir e ganhar XP."
        nl: "Het Gevecht: hier kies je een taak om te voltooien en XP te verdienen."
      tuto_dash_combat_admin:
        fr: "Le Combat : c'est ici que tu choisis une tâche à accomplir pour gagner de l'XP, que tu peux valider les tâches des autres joueurs et administrer la liste des tâches."
        en: "Combat: this is where you pick a task to complete and earn XP, validate other players' tasks and manage the task list."
        es: "El Combate: aquí eliges una tarea para completar y ganar XP, validas las tareas de otros jugadores y gestionas la lista de tareas."
        de: "Der Kampf: Hier wählst du eine Aufgabe, um XP zu verdienen, bestätigst die Aufgaben der anderen Spieler und verwaltest die Aufgabenliste."
        it: "Il Combattimento: qui scegli un compito da portare a termine per guadagnare XP, puoi convalidare i compiti degli altri giocatori e gestire l'elenco dei compiti."
        pt: "O Combate: é aqui que escolhes uma tarefa para cumprir e ganhar XP, que podes validar as tarefas dos outros jogadores e gerir a lista de tarefas."
        br: "O Combate: é aqui que você escolhe uma tarefa para cumprir e ganhar XP, valida as tarefas dos outros jogadores e gerencia a lista de tarefas."
        nl: "Het Gevecht: hier kies je een taak om te voltooien en XP te verdienen, valideer je de taken van andere spelers en beheer je de takenlijst."
      tuto_dash_perso:
        fr: "Ton Personnage : avatar, niveau, points de vie et ton journal."
        en: "Your Character: avatar, level, hit points and your log."
        es: "Tu Personaje: avatar, nivel, puntos de vida y tu registro."
        de: "Dein Charakter: Avatar, Stufe, Lebenspunkte und dein Tagebuch."
        it: "Il tuo Personaggio: avatar, livello, punti vita e il tuo diario."
        pt: "O teu Personagem: avatar, nível, pontos de vida e o teu diário."
        br: "Seu Personagem: avatar, nível, pontos de vida e seu diário."
        nl: "Je Personage: avatar, niveau, levenspunten en je dagboek."
      tuto_dash_inv:
        fr: "Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus."
        en: "Items: here you get your objects, your spells and all kinds of bonuses."
        es: "Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones."
        de: "Die Items: Hier findest du deine Gegenstände, deine Zauber und alle möglichen Boni."
        it: "Gli Oggetti: qui accedi ai tuoi oggetti, ai tuoi incantesimi e a ogni sorta di bonus."
        pt: "Os Itens: aqui acedes aos teus objetos, aos teus feitiços e a todo o tipo de bónus."
        br: "Os Itens: aqui você acessa seus objetos, seus feitiços e todo tipo de bônus."
        nl: "De Items: hier vind je je voorwerpen, je spreuken en allerlei bonussen."
      tuto_dash_inv_admin:
        fr: "Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus, ainsi qu'au contenu du butin du clan."
        en: "Items: here you get your objects, your spells and all kinds of bonuses, plus the contents of the clan's loot."
        es: "Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones, así como al contenido del botín del clan."
        de: "Die Items: Hier findest du deine Gegenstände, deine Zauber und alle möglichen Boni, dazu den Inhalt der Beute des Clans."
        it: "Gli Oggetti: qui accedi ai tuoi oggetti, ai tuoi incantesimi e a ogni sorta di bonus, oltre al contenuto del bottino del clan."
        pt: "Os Itens: aqui acedes aos teus objetos, aos teus feitiços e a todo o tipo de bónus, bem como ao conteúdo do espólio do clã."
        br: "Os Itens: aqui você acessa seus objetos, seus feitiços e todo tipo de bônus, além do conteúdo do tesouro do clã."
        nl: "De Items: hier vind je je voorwerpen, je spreuken en allerlei bonussen, en ook de inhoud van de buit van de clan."
      tuto_items_title:
        fr: "Tes objets"
        en: "Your items"
        es: "Tus objetos"
        de: "Deine Gegenstände"
        it: "I tuoi oggetti"
        pt: "Os teus objetos"
        br: "Seus objetos"
        nl: "Je voorwerpen"
      tuto_items_grid:
        fr: "Retrouve ici tous tes objets, sorts et bonus, rangés par onglet. Touche une tuile pour voir ce qu'elle contient."
        en: "Here you'll find all your objects, spells and bonuses, sorted by tab. Tap a tile to see what it holds."
        es: "Aquí encuentras todos tus objetos, hechizos y bonificaciones, ordenados por pestaña. Toca una casilla para ver su contenido."
        de: "Hier findest du all deine Gegenstände, Zauber und Boni, nach Reitern sortiert. Tippe auf eine Kachel, um zu sehen, was sie enthält."
        it: "Qui trovi tutti i tuoi oggetti, incantesimi e bonus, ordinati per scheda. Tocca una casella per vedere cosa contiene."
        pt: "Aqui encontras todos os teus objetos, feitiços e bónus, arrumados por separador. Toca num quadrado para ver o que contém."
        br: "Aqui você encontra todos os seus objetos, feitiços e bônus, organizados por aba. Toque em um quadrado para ver o que ele contém."
        nl: "Hier vind je al je voorwerpen, spreuken en bonussen, per tabblad gesorteerd. Tik op een tegel om te zien wat erin zit."
      tuto_items_chest:
        fr: "Le coffre du clan est toujours en haut de ta grille, quel que soit l'onglet. Touche-le pour l'ouvrir et distribuer son contenu."
        en: "The clan's chest always sits at the top of your grid, whatever the tab. Tap it to open it and share out its contents."
        es: "El cofre del clan siempre está en la parte superior de tu cuadrícula, sea cual sea la pestaña. Tócalo para abrirlo y repartir su contenido."
        de: "Die Truhe des Clans steht immer ganz oben in deinem Raster, egal auf welchem Reiter. Tippe darauf, um sie zu öffnen und ihren Inhalt zu verteilen."
        it: "Lo scrigno del clan è sempre in cima alla tua griglia, qualunque sia la scheda. Toccalo per aprirlo e distribuirne il contenuto."
        pt: "O baú do clã está sempre no topo da tua grelha, seja qual for o separador. Toca-lhe para o abrires e distribuíres o seu conteúdo."
        br: "O baú do clã fica sempre no topo da sua grade, seja qual for a aba. Toque nele para abri-lo e distribuir o conteúdo."
        nl: "De kist van de clan staat altijd bovenaan je raster, op welk tabblad je ook bent. Tik erop om hem te openen en de inhoud te verdelen."
      tuto_items_wallet:
        fr: "Ta bourse affiche ton or en pastille : il représente l'argent de poche promis par tes chefs de clan. Repère son icône de pièces parmi tes objets."
        en: "Your purse shows your gold as a badge: it stands for the pocket money your clan chiefs have promised. Look for its coin icon among your objects."
        es: "Tu bolsa muestra tu oro en una insignia: representa el dinero de bolsillo que te han prometido tus jefes de clan. Busca su icono de monedas entre tus objetos."
        de: "Dein Geldbeutel zeigt dein Gold als Plakette: Es steht für das Taschengeld, das dir deine Clanchefs versprochen haben. Such sein Münzsymbol unter deinen Gegenständen."
        it: "Il tuo borsellino mostra il tuo oro in un bollino: rappresenta la paghetta che ti hanno promesso i tuoi capi clan. Cerca la sua icona con le monete tra i tuoi oggetti."
        pt: "A tua bolsa mostra o teu ouro num distintivo: representa a semanada que os teus chefes de clã te prometeram. Procura o ícone das moedas entre os teus objetos."
        br: "Sua bolsa mostra seu ouro em um selo: ele representa a mesada que seus chefes de clã prometeram a você. Procure o ícone das moedas entre seus objetos."
        nl: "Je buidel toont je goud in een badge: het staat voor het zakgeld dat je clanhoofden je hebben beloofd. Zoek het muntjespictogram tussen je voorwerpen."
      # Le tribut, vu du joueur. AU CONDITIONNEL : le versement est une décision du foyer, le jeu
      # ne le constate pas et ne doit donc rien promettre à un enfant.
      tuto_items_tribute:
        fr: "Si ton clan l'a décidé, un chef de clan peut te remettre cet or pour de vrai : c'est le tribut. Ta bourse baisse alors du montant versé."
        en: "If your clan has decided so, a clan chief can hand you that gold for real: that is the tribute. Your purse then drops by the amount paid."
        es: "Si tu clan lo ha decidido, un jefe de clan puede entregarte ese oro de verdad: es el tributo. Entonces tu bolsa baja el importe pagado."
        de: "Wenn dein Clan es so beschlossen hat, kann ein Clanchef dir dieses Gold wirklich geben: Das ist der Tribut. Dein Geldbeutel sinkt dann um den ausgezahlten Betrag."
        it: "Se il tuo clan l'ha deciso, un capo clan può consegnarti quest'oro per davvero: è il tributo. Il tuo borsellino cala allora dell'importo versato."
        pt: "Se o teu clã assim o tiver decidido, um chefe de clã pode entregar-te esse ouro a sério: é o tributo. A tua bolsa baixa então o valor pago."
        br: "Se o seu clã tiver decidido assim, um chefe de clã pode entregar esse ouro de verdade para você: é o tributo. Sua bolsa então diminui no valor pago."
        nl: "Als je clan dat heeft besloten, kan een clanhoofd je dat goud echt geven: dat is het tribuut. Je buidel daalt dan met het betaalde bedrag."
      tuto_perso_title:
        fr: "Ton personnage"
        en: "Your character"
        es: "Tu personaje"
        de: "Dein Charakter"
        it: "Il tuo personaggio"
        pt: "O teu personagem"
        br: "Seu personagem"
        nl: "Je personage"
      tuto_perso_avatar:
        fr: "Voici ton personnage : son avatar et son nom."
        en: "This is your character: their avatar and name."
        es: "Este es tu personaje: su avatar y su nombre."
        de: "Das ist dein Charakter: sein Avatar und sein Name."
        it: "Ecco il tuo personaggio: il suo avatar e il suo nome."
        pt: "Este é o teu personagem: o seu avatar e o seu nome."
        br: "Este é o seu personagem: o avatar e o nome dele."
        nl: "Dit is je personage: zijn avatar en zijn naam."
      tuto_perso_edit:
        fr: "Touche le crayon pour changer ton avatar et ton nom."
        en: "Tap the pencil to change your avatar and name."
        es: "Toca el lápiz para cambiar tu avatar y tu nombre."
        de: "Tippe auf den Stift, um deinen Avatar und deinen Namen zu ändern."
        it: "Tocca la matita per cambiare il tuo avatar e il tuo nome."
        pt: "Toca no lápis para mudares o teu avatar e o teu nome."
        br: "Toque no lápis para mudar seu avatar e seu nome."
        nl: "Tik op het potlood om je avatar en je naam te wijzigen."
      tuto_perso_level:
        fr: "Ta jauge de niveau : accomplis des tâches pour la remplir et monter de niveau."
        en: "Your level gauge: complete tasks to fill it and level up."
        es: "Tu barra de nivel: completa tareas para llenarla y subir de nivel."
        de: "Deine Stufenleiste: Erledige Aufgaben, um sie zu füllen und eine Stufe aufzusteigen."
        it: "La tua barra del livello: completa compiti per riempirla e salire di livello."
        pt: "A tua barra de nível: cumpre tarefas para a encheres e subires de nível."
        br: "Sua barra de nível: cumpra tarefas para enchê-la e subir de nível."
        nl: "Je niveaubalk: voltooi taken om hem te vullen en een niveau hoger te gaan."
      tuto_perso_pv:
        fr: "Tes points de vie : à zéro tu tombes, mais un compagnon peut te soigner."
        en: "Your hit points: at zero you fall, but a companion can heal you."
        es: "Tus puntos de vida: a cero caes, pero un compañero puede curarte."
        de: "Deine Lebenspunkte: Bei null fällst du, aber ein Gefährte kann dich heilen."
        it: "I tuoi punti vita: a zero cadi, ma un compagno può curarti."
        pt: "Os teus pontos de vida: a zero cais, mas um companheiro pode curar-te."
        br: "Seus pontos de vida: no zero você cai, mas um companheiro pode curar você."
        nl: "Je levenspunten: bij nul val je, maar een metgezel kan je genezen."
      tuto_perso_menu:
        fr: "Le menu Personnage : diverses options pour gérer ton profil et ton personnage."
        en: "The Character menu: various options to manage your profile and character."
        es: "El menú Personaje: varias opciones para gestionar tu perfil y tu personaje."
        de: "Das Charakter-Menü: verschiedene Optionen, um dein Profil und deinen Charakter zu verwalten."
        it: "Il menu Personaggio: diverse opzioni per gestire il tuo profilo e il tuo personaggio."
        pt: "O menu Personagem: várias opções para gerires o teu perfil e o teu personagem."
        br: "O menu Personagem: várias opções para gerenciar seu perfil e seu personagem."
        nl: "Het menu Personage: diverse opties om je profiel en je personage te beheren."
      tuto_clan_title:
        fr: "Ton clan"
        en: "Your clan"
        es: "Tu clan"
        de: "Dein Clan"
        it: "Il tuo clan"
        pt: "O teu clã"
        br: "Seu clã"
        nl: "Je clan"
      tuto_clan_identity:
        fr: "Ton clan : son avatar, son nom et son rang."
        en: "Your clan: its avatar, name and rank."
        es: "Tu clan: su avatar, su nombre y su rango."
        de: "Dein Clan: sein Avatar, sein Name und sein Rang."
        it: "Il tuo clan: il suo avatar, il suo nome e il suo rango."
        pt: "O teu clã: o seu avatar, o seu nome e o seu posto."
        br: "Seu clã: o avatar, o nome e a posição dele."
        nl: "Je clan: zijn avatar, zijn naam en zijn rang."
      tuto_clan_edit:
        fr: "Touche le crayon pour modifier l'avatar et le nom du clan."
        en: "Tap the pencil to change the clan's avatar and name."
        es: "Toca el lápiz para cambiar el avatar y el nombre del clan."
        de: "Tippe auf den Stift, um Avatar und Namen des Clans zu ändern."
        it: "Tocca la matita per modificare l'avatar e il nome del clan."
        pt: "Toca no lápis para alterares o avatar e o nome do clã."
        br: "Toque no lápis para alterar o avatar e o nome do clã."
        nl: "Tik op het potlood om de avatar en de naam van de clan te wijzigen."
      tuto_clan_level:
        fr: "Le niveau du clan : il monte quand ses membres accomplissent des tâches."
        en: "The clan level: it rises as its members complete tasks."
        es: "El nivel del clan: sube cuando sus miembros completan tareas."
        de: "Die Stufe des Clans: Sie steigt, wenn seine Mitglieder Aufgaben erledigen."
        it: "Il livello del clan: sale quando i suoi membri completano i compiti."
        pt: "O nível do clã: sobe quando os seus membros cumprem tarefas."
        br: "O nível do clã: sobe quando seus membros cumprem tarefas."
        nl: "Het niveau van de clan: het stijgt wanneer de leden taken voltooien."
      # « du cycle en cours » : la jauge repart à zéro après chaque ouverture du coffre. Sans ce
      # mot, elle se lit comme une progression définitive et son retour à zéro passe pour une perte.
      tuto_clan_butin:
        fr: "Le butin du clan pour le cycle en cours : cette jauge se remplit à mesure que le clan progresse. Une fois pleine, le trésor est découvert, partagé entre les membres, et un nouveau cycle commence."
        en: "The clan's loot for the current cycle: this gauge fills as the clan progresses. Once full, the treasure is revealed, shared among the members, and a new cycle begins."
        es: "El botín del clan del ciclo actual: esta barra se llena a medida que el clan progresa. Cuando está llena, el tesoro se revela, se reparte entre los miembros y empieza un nuevo ciclo."
        de: "Die Beute des Clans im laufenden Zyklus: Diese Leiste füllt sich, während der Clan vorankommt. Ist sie voll, wird der Schatz enthüllt und unter den Mitgliedern aufgeteilt, und ein neuer Zyklus beginnt."
        it: "Il bottino del clan per il ciclo in corso: questa barra si riempie man mano che il clan progredisce. Una volta piena, il tesoro viene scoperto e diviso tra i membri, e inizia un nuovo ciclo."
        pt: "O espólio do clã no ciclo em curso: esta barra enche-se à medida que o clã progride. Quando está cheia, o tesouro é revelado e repartido entre os membros, e começa um novo ciclo."
        br: "O tesouro do clã no ciclo atual: esta barra enche à medida que o clã progride. Quando fica cheia, o baú é revelado e dividido entre os membros, e começa um novo ciclo."
        nl: "De buit van de clan voor de huidige cyclus: deze balk vult zich naarmate de clan vooruitgaat. Is hij vol, dan wordt de schat onthuld en onder de leden verdeeld, en begint een nieuwe cyclus."
      tuto_clan_roster:
        fr: "Les membres du clan sont listés ici."
        en: "The clan members are listed here."
        es: "Los miembros del clan aparecen aquí."
        de: "Hier sind die Mitglieder des Clans aufgelistet."
        it: "Qui sono elencati i membri del clan."
        pt: "Os membros do clã estão listados aqui."
        br: "Os membros do clã estão listados aqui."
        nl: "Hier staan de leden van de clan."
      tuto_clan_roster_avatar:
        fr: "Pour chaque personnage, tu vois son niveau et ses points de vie."
        en: "For each character, you see their level and hit points."
        es: "Para cada personaje, ves su nivel y sus puntos de vida."
        de: "Bei jedem Charakter siehst du seine Stufe und seine Lebenspunkte."
        it: "Per ogni personaggio vedi il suo livello e i suoi punti vita."
        pt: "Para cada personagem, vês o seu nível e os seus pontos de vida."
        br: "Para cada personagem, você vê o nível e os pontos de vida dele."
        nl: "Bij elk personage zie je zijn niveau en zijn levenspunten."
      # La barre de la tuile = contribution du joueur AU CYCLE EN COURS (worker._refreshRoster :
      # butin du cycle / plafond, pondéré par sa part). Le meilleur contributeur affiche exactement
      # la jauge de butin du clan ; les autres au prorata. D'où « ce qu'il a apporté », et pas « son
      # niveau » - c'est la confusion que faisait l'ancienne formulation.
      tuto_clan_roster_name:
        fr: "Son nom (une couronne désigne les chefs de clan) et sa barre de contribution : ce qu'il a apporté au butin du cycle en cours, et donc la part qui lui reviendra au partage."
        en: "Their name (a crown marks the clan chiefs) and their contribution bar: what they have brought to the current cycle's loot, and therefore the share they will get when it is split."
        es: "Su nombre (una corona indica a los jefes del clan) y su barra de contribución: lo que ha aportado al botín del ciclo actual y, por tanto, la parte que le tocará en el reparto."
        de: "Sein Name (eine Krone kennzeichnet die Clanchefs) und seine Beitragsleiste: was er zur Beute des laufenden Zyklus beigetragen hat, und damit der Anteil, der ihm bei der Aufteilung zusteht."
        it: "Il suo nome (una corona indica i capi clan) e la sua barra di contributo: ciò che ha portato al bottino del ciclo in corso, e quindi la parte che gli spetterà nella spartizione."
        pt: "O seu nome (uma coroa assinala os chefes de clã) e a sua barra de contribuição: o que trouxe para o espólio do ciclo em curso e, portanto, a parte que lhe caberá na partilha."
        br: "O nome dele (uma coroa indica os chefes de clã) e sua barra de contribuição: o que ele trouxe para o tesouro do ciclo atual e, portanto, a parte que caberá a ele na divisão."
        nl: "Zijn naam (een kroon duidt de clanhoofden aan) en zijn bijdragebalk: wat hij heeft bijgedragen aan de buit van de huidige cyclus, en dus het deel dat hij bij de verdeling krijgt."
      # Bourse de la tuile : raccourci `purse_option: pay_tribute` (registry_clan_page). Dit le
      # montant libre et le plafond, parce que l'écran de saisie ne le redira pas.
      tuto_clan_roster_purse:
        fr: "À droite de chaque tuile, la bourse montre l'or gagné par le joueur. La toucher ouvre directement « Payer son tribut » : vous lui remettez cet or dans la vraie vie, et vous déclarez ici le montant versé."
        en: "On the right of each tile, the purse shows the gold the player has earned. Tapping it goes straight to « Pay their tribute »: you hand over that gold in real life, and declare here how much you paid."
        es: "A la derecha de cada casilla, la bolsa muestra el oro ganado por el jugador. Al tocarla se abre directamente « Pagar su tributo »: le entregas ese oro en la vida real y declaras aquí el importe pagado."
        de: "Rechts auf jeder Kachel zeigt der Geldbeutel das Gold, das der Spieler verdient hat. Tippst du darauf, öffnet sich direkt „Tribut zahlen“: Du gibst ihm dieses Gold im echten Leben und trägst hier den ausgezahlten Betrag ein."
        it: "A destra di ogni casella, il borsellino mostra l'oro guadagnato dal giocatore. Toccandolo si apre direttamente «Paga il suo tributo»: gli consegni quest'oro nella vita reale e dichiari qui l'importo versato."
        pt: "À direita de cada quadrado, a bolsa mostra o ouro ganho pelo jogador. Ao tocares-lhe, abre-se diretamente «Pagar o seu tributo»: entregas-lhe esse ouro na vida real e declaras aqui o valor pago."
        br: "À direita de cada quadrado, a bolsa mostra o ouro ganho pelo jogador. Ao tocar nela, abre direto \"Pagar seu tributo\": você entrega esse ouro a ele na vida real e declara aqui o valor pago."
        nl: "Rechts op elke tegel toont de buidel het goud dat de speler heeft verdiend. Tik erop en ‘Tribuut betalen’ gaat meteen open: je geeft hem dat goud in het echte leven en vult hier het betaalde bedrag in."
      tuto_clan_roster_kebab:
        fr: "Touche le « … » d'un membre pour ouvrir ses actions."
        en: "Tap a member's « … » to open their actions."
        es: "Toca el « … » de un miembro para abrir sus acciones."
        de: "Tippe auf das „…“ eines Mitglieds, um seine Aktionen zu öffnen."
        it: "Tocca il «…» di un membro per aprire le sue azioni."
        pt: "Toca no «…» de um membro para abrires as suas ações."
        br: "Toque no \"…\" de um membro para abrir as ações dele."
        nl: "Tik op de ‘…’ van een lid om zijn acties te openen."
      # Cadre le panneau : clan_selector n'offre qu'une poignée des 16 actions à la fois.
      tuto_clan_options_intro:
        fr: "Les actions proposées dépendent du joueur touché : vivant ou mort, présent ou absent, enfant ou adulte, un autre ou vous-même. Voici toutes celles qui existent."
        en: "The actions offered depend on the player you tap: alive or dead, present or away, child or adult, someone else or yourself. Here are all the ones that exist."
        es: "Las acciones ofrecidas dependen del jugador que toques: vivo o muerto, presente o ausente, niño o adulto, otro o tú mismo. Estas son todas las que existen."
        de: "Welche Aktionen angeboten werden, hängt vom angetippten Spieler ab: lebendig oder tot, anwesend oder abwesend, Kind oder Erwachsener, jemand anderes oder du selbst. Hier sind alle, die es gibt."
        it: "Le azioni proposte dipendono dal giocatore toccato: vivo o morto, presente o assente, bambino o adulto, un altro o te stesso. Ecco tutte quelle che esistono."
        pt: "As ações propostas dependem do jogador em que tocas: vivo ou morto, presente ou ausente, criança ou adulto, outra pessoa ou tu próprio. Eis todas as que existem."
        br: "As ações oferecidas dependem do jogador em que você toca: vivo ou morto, presente ou ausente, criança ou adulto, outra pessoa ou você mesmo. Aqui estão todas as que existem."
        nl: "Welke acties je krijgt, hangt af van de speler waarop je tikt: levend of dood, aanwezig of afwezig, kind of volwassene, iemand anders of jijzelf. Hier zijn ze allemaal."
      tuto_clan_options_title:
        fr: "Les actions sur un membre"
        en: "Actions on a member"
        es: "Acciones sobre un miembro"
        de: "Aktionen für ein Mitglied"
        it: "Azioni su un membro"
        pt: "Ações sobre um membro"
        br: "Ações sobre um membro"
        nl: "Acties voor een lid"
      roster_menu_log_desc:
        fr: "Consulter l'historique des actions de ce joueur."
        en: "View this player's action history."
        es: "Ver el historial de acciones de este jugador."
        de: "Den Verlauf der Aktionen dieses Spielers ansehen."
        it: "Consultare la cronologia delle azioni di questo giocatore."
        pt: "Consultar o histórico de ações deste jogador."
        br: "Consultar o histórico de ações deste jogador."
        nl: "De actiegeschiedenis van deze speler bekijken."
      # Proposée sur un joueur MORT uniquement, et une fois tous les 3 jours par chef
      # (cooldown _myLastCure) : grisée entre-temps, d'où la mention.
      roster_menu_revive_desc:
        fr: "Le remettre en jeu s'il est tombé à zéro point de vie. Une guérison tous les trois jours par chef de clan."
        en: "Bring them back if they have dropped to zero hit points. One healing every three days per clan chief."
        es: "Devolverlo al juego si ha caído a cero puntos de vida. Una curación cada tres días por jefe de clan."
        de: "Ihn wieder ins Spiel holen, wenn er auf null Lebenspunkte gefallen ist. Eine Heilung alle drei Tage pro Clanchef."
        it: "Rimetterlo in gioco se è sceso a zero punti vita. Una guarigione ogni tre giorni per capo clan."
        pt: "Voltar a pô-lo em jogo se tiver caído a zero pontos de vida. Uma cura a cada três dias por chefe de clã."
        br: "Colocá-lo de volta no jogo se ele tiver caído a zero pontos de vida. Uma cura a cada três dias por chefe de clã."
        nl: "Hem weer in het spel brengen als hij op nul levenspunten is gevallen. Eén genezing per drie dagen per clanhoofd."
      # +50 XP, offerte au SEUL joueur non-chef le plus bas en XP du clan, une fois tous les
      # 3 jours par chef (clan_selector + _myLastBoost). Ces trois bornes expliquent à elles
      # seules pourquoi l'option n'apparaît pas sur la plupart des tuiles.
      roster_menu_support_desc:
        fr: "Offrir de l'expérience à celui qui est le plus en retard dans le clan : lui seul y a droit, et une fois tous les trois jours par chef de clan."
        en: "Give experience to whoever is furthest behind in the clan: only they are eligible, and once every three days per clan chief."
        es: "Dar experiencia a quien más atrasado va en el clan: solo él puede recibirlo, y una vez cada tres días por jefe de clan."
        de: "Dem Spieler, der im Clan am weitesten zurückliegt, Erfahrung schenken: Nur er hat Anspruch darauf, und das einmal alle drei Tage pro Clanchef."
        it: "Regalare esperienza a chi è più indietro nel clan: solo lui ne ha diritto, e una volta ogni tre giorni per capo clan."
        pt: "Oferecer experiência a quem está mais atrasado no clã: só ele tem direito, e uma vez a cada três dias por chefe de clã."
        br: "Dar experiência a quem está mais atrasado no clã: só ele tem direito, e uma vez a cada três dias por chefe de clã."
        nl: "Ervaring geven aan wie het verst achterloopt in de clan: alleen hij heeft er recht op, en één keer per drie dagen per clanhoofd."
      # has_device=false : sorti du partage d'XP/butin, grisé sans crâne, ne peut plus mourir.
      # Se défait TOUT SEUL à sa prochaine connexion (_writeClanPlayer) - à dire, sinon le chef
      # cherche l'option inverse, qui n'existe pas.
      roster_menu_offline_desc:
        fr: "Pour un joueur qui ne peut pas jouer en ce moment : il sort du partage du butin et ne perd plus de points de vie. Il revient tout seul à sa prochaine connexion."
        en: "For a player who cannot play right now: they leave the loot sharing and stop losing hit points. They come back on their own at their next connection."
        es: "Para un jugador que no puede jugar ahora: sale del reparto del botín y deja de perder puntos de vida. Vuelve solo en su próxima conexión."
        de: "Für einen Spieler, der gerade nicht spielen kann: Er nimmt nicht mehr an der Beuteteilung teil und verliert keine Lebenspunkte mehr. Bei seiner nächsten Anmeldung ist er von selbst wieder dabei."
        it: "Per un giocatore che al momento non può giocare: esce dalla spartizione del bottino e non perde più punti vita. Rientra da solo al suo prossimo accesso."
        pt: "Para um jogador que não pode jogar neste momento: sai da partilha do espólio e deixa de perder pontos de vida. Volta sozinho na próxima vez que se ligar."
        br: "Para um jogador que não pode jogar agora: ele sai da divisão do tesouro e para de perder pontos de vida. Volta sozinho na próxima vez que se conectar."
        nl: "Voor een speler die nu niet kan spelen: hij doet niet meer mee aan de verdeling van de buit en verliest geen levenspunten meer. Bij zijn volgende aanmelding is hij vanzelf terug."
      # Le code temporaire est le fait NOUVEAU de cette option : il se choisit AVANT la bascule
      # (take_place -> imp_pin_set), et sans lui on ne reprend pas son compte.
      roster_menu_takeplace_desc:
        fr: "Prêter votre téléphone en jouant son personnage. Vous choisissez d'abord un code à 4 chiffres : il vous sera demandé pour reprendre votre compte."
        en: "Lend your phone while playing their character. You first choose a 4-digit code: it will be asked for to take your account back."
        es: "Prestar tu teléfono jugando su personaje. Primero eliges un código de 4 cifras: se te pedirá para recuperar tu cuenta."
        de: "Dein Handy verleihen und dabei seinen Charakter spielen. Zuerst wählst du einen 4-stelligen Code: Er wird abgefragt, wenn du dein Konto zurückholen willst."
        it: "Prestare il tuo telefono giocando con il suo personaggio. Prima scegli un codice di 4 cifre: ti verrà chiesto per riprendere il tuo account."
        pt: "Emprestar o teu telemóvel jogando com o personagem dele. Primeiro escolhes um código de 4 algarismos: ser-te-á pedido para recuperares a tua conta."
        br: "Emprestar seu celular jogando com o personagem dele. Primeiro você escolhe um código de 4 dígitos: ele será pedido para você recuperar sua conta."
        nl: "Je telefoon uitlenen en zijn personage spelen. Eerst kies je een code van 4 cijfers: die wordt gevraagd om je account terug te nemen."
      roster_menu_promote_chief_desc:
        fr: "Le nommer chef de clan."
        en: "Make them a clan chief."
        es: "Nombrarlo jefe del clan."
        de: "Ihn zum Clanchef ernennen."
        it: "Nominarlo capo clan."
        pt: "Nomeá-lo chefe de clã."
        br: "Nomeá-lo chefe de clã."
        nl: "Hem tot clanhoofd benoemen."
      roster_menu_nomore_chief_desc:
        fr: "Lui retirer son rôle de chef de clan."
        en: "Remove their clan chief role."
        es: "Quitarle su rol de jefe de clan."
        de: "Ihm die Rolle als Clanchef entziehen."
        it: "Togliergli il ruolo di capo clan."
        pt: "Retirar-lhe o papel de chefe de clã."
        br: "Tirar dele o papel de chefe de clã."
        nl: "Hem zijn rol als clanhoofd afnemen."
      # Bascule k -> t -> a : le tuteur ne pose que « t ». Le statut n'est acquis qu'à
      # l'acceptation des CGU adulte PAR L'INTÉRESSÉ, qui écrit « a ». Le dire, sinon le chef
      # croit avoir terminé.
      roster_menu_promote_adult_desc:
        fr: "Pour un enfant devenu majeur. Il devra ensuite accepter lui-même les conditions adultes : c'est son acceptation, pas votre déclaration, qui le rend majeur dans le jeu."
        en: "For a child who has come of age. They will then have to accept the adult terms themselves: it is their acceptance, not your declaration, that makes them an adult in the game."
        es: "Para un niño que ha alcanzado la mayoría de edad. Después deberá aceptar él mismo las condiciones de adulto: es su aceptación, no tu declaración, lo que lo hace mayor en el juego."
        de: "Für ein Kind, das volljährig geworden ist. Es muss danach selbst die Bedingungen für Erwachsene akzeptieren: Seine eigene Zustimmung, nicht deine Erklärung, macht es im Spiel volljährig."
        it: "Per un ragazzo diventato maggiorenne. Dovrà poi accettare lui stesso le condizioni per adulti: è la sua accettazione, non la tua dichiarazione, a renderlo maggiorenne nel gioco."
        pt: "Para um jovem que atingiu a maioridade. Terá depois de aceitar ele próprio as condições para adultos: é a aceitação dele, e não a tua declaração, que o torna maior no jogo."
        br: "Para um jovem que atingiu a maioridade. Depois ele terá que aceitar pessoalmente as condições para adultos: é a aceitação dele, e não a sua declaração, que o torna maior de idade no jogo."
        nl: "Voor een kind dat meerderjarig is geworden. Het moet daarna zelf de voorwaarden voor volwassenen aanvaarden: pas zijn eigen aanvaarding, niet jouw verklaring, maakt het meerderjarig in het spel."
      # Hors concours. Les libellés des deux options vivent dans le layer de thème, comme tous
      # les roster_menu_* ; seules les descriptions sont ici — elles ne s'affichent pas dans le
      # menu, elles alimentent le panneau du tutoriel (leçon roster_options).
      roster_menu_hors_concours_on_desc:
        fr: "Il continue de jouer et de faire gagner le clan, mais ne concourt plus : ni part du butin, ni comparaison avec les enfants."
        en: "They keep playing and keep earning for the clan, but no longer compete: no share of the loot, and no comparison with the children."
        es: "Sigue jugando y haciendo ganar al clan, pero ya no compite: ni parte del botín, ni comparación con los niños."
        de: "Er spielt weiter und lässt den Clan weiter gewinnen, tritt aber nicht mehr an: kein Anteil an der Beute, kein Vergleich mit den Kindern."
        it: "Continua a giocare e a far guadagnare il clan, ma non gareggia più: niente parte del bottino, niente confronto con i bambini."
        pt: "Continua a jogar e a fazer o clã ganhar, mas deixa de competir: nem parte do espólio, nem comparação com as crianças."
        br: "Continua jogando e fazendo o clã ganhar, mas deixa de competir: nem parte do tesouro, nem comparação com as crianças."
        nl: "Hij speelt verder en laat de clan nog steeds winnen, maar doet niet meer mee: geen deel van de buit, geen vergelijking met de kinderen."
      roster_menu_hors_concours_off_desc:
        fr: "Il concourt de nouveau : sa part du butin, son niveau et sa progression redeviennent visibles du clan."
        en: "They compete again: their share of the loot, their level and their progress become visible to the clan once more."
        es: "Vuelve a competir: su parte del botín, su nivel y su progreso vuelven a ser visibles para el clan."
        de: "Er tritt wieder an: Sein Beuteanteil, seine Stufe und sein Fortschritt sind für den Clan wieder sichtbar."
        it: "Torna a gareggiare: la sua parte di bottino, il suo livello e i suoi progressi tornano visibili al clan."
        pt: "Volta a competir: a sua parte do espólio, o seu nível e o seu progresso voltam a ser visíveis para o clã."
        br: "Volta a competir: sua parte do tesouro, seu nível e seu progresso voltam a ficar visíveis para o clã."
        nl: "Hij doet weer mee: zijn deel van de buit, zijn niveau en zijn voortgang zijn weer zichtbaar voor de clan."
      # Montant LIBRE, plafonné au solde (worker.pay_tribute -> money_page). Le jeu ne constate
      # rien : c'est le chef qui déclare. Raccourci : taper la bourse de la tuile.
      roster_menu_pay_tribute_desc:
        fr: "Lui remettre en vrai l'or de sa bourse, en tout ou en partie : vous déclarez ici le montant versé, et sa bourse baisse d'autant. Raccourci : touchez sa bourse sur sa tuile."
        en: "Hand over the gold in their purse for real, in full or in part: you declare the amount paid here, and their purse drops by that much. Shortcut: tap their purse on their tile."
        es: "Entregarle de verdad el oro de su bolsa, entero o en parte: declaras aquí el importe pagado y su bolsa baja otro tanto. Atajo: toca su bolsa en su casilla."
        de: "Ihm das Gold aus seinem Geldbeutel wirklich geben, ganz oder teilweise: Du trägst hier den ausgezahlten Betrag ein, und sein Geldbeutel sinkt um genau so viel. Abkürzung: Tippe auf den Geldbeutel auf seiner Kachel."
        it: "Consegnargli davvero l'oro del suo borsellino, tutto o in parte: dichiari qui l'importo versato e il suo borsellino cala di altrettanto. Scorciatoia: tocca il borsellino sulla sua casella."
        pt: "Entregar-lhe a sério o ouro da bolsa, total ou parcialmente: declaras aqui o valor pago e a bolsa dele baixa na mesma medida. Atalho: toca na bolsa dele, no quadrado dele."
        br: "Entregar a ele de verdade o ouro da bolsa, total ou parcialmente: você declara aqui o valor pago e a bolsa dele diminui na mesma medida. Atalho: toque na bolsa dele, no quadrado dele."
        nl: "Hem echt het goud uit zijn buidel geven, helemaal of gedeeltelijk: je vult hier het betaalde bedrag in en zijn buidel daalt evenveel. Snelkoppeling: tik op de buidel op zijn tegel."
      roster_menu_revoke_desc:
        fr: "Le retirer du clan."
        en: "Remove them from the clan."
        es: "Expulsarlo del clan."
        de: "Ihn aus dem Clan entfernen."
        it: "Rimuoverlo dal clan."
        pt: "Retirá-lo do clã."
        br: "Tirá-lo do clã."
        nl: "Hem uit de clan verwijderen."
      # ⚠ La nuance avec la ligne ci-dessus est TOUT le sujet : « A quitté le clan » retire du
      # clan et ne supprime rien ; ceci cesse de traiter les données. Les deux restent offerts.
      roster_menu_withdraw_consent_desc:
        fr: "Cesser de traiter ses données. Il quitte le jeu ; un chef de clan peut revenir sur cette décision pendant 3 jours."
        en: "Stop processing their data. They leave the game; a clan chief can reverse this for 3 days."
        es: "Dejar de tratar sus datos. Sale del juego; un jefe de clan puede revocarlo durante 3 días."
        de: "Die Verarbeitung seiner Daten beenden. Er verlässt das Spiel; ein Clanchef kann diese Entscheidung 3 Tage lang rückgängig machen."
        it: "Smettere di trattare i suoi dati. Lascia il gioco; un capo clan può annullare questa decisione per 3 giorni."
        pt: "Deixar de tratar os seus dados. Sai do jogo; um chefe de clã pode reverter esta decisão durante 3 dias."
        br: "Deixar de tratar os dados dele. Ele sai do jogo; um chefe de clã pode reverter esta decisão durante 3 dias."
        nl: "Stoppen met het verwerken van zijn gegevens. Hij verlaat het spel; een clanhoofd kan dit besluit 3 dagen lang terugdraaien."
      roster_menu_restore_consent_desc:
        fr: "Annuler le retrait : il retrouve sa place et son personnage, intacts."
        en: "Cancel the withdrawal: they get back their place and their character, untouched."
        es: "Cancelar la retirada: recupera su lugar y su personaje, intactos."
        de: "Den Widerruf aufheben: Er bekommt seinen Platz und seinen Charakter unversehrt zurück."
        it: "Annullare la revoca: ritrova il suo posto e il suo personaggio, intatti."
        pt: "Anular a retirada: recupera o seu lugar e o seu personagem, intactos."
        br: "Anular a saída: ele recupera seu lugar e seu personagem, intactos."
        nl: "De intrekking ongedaan maken: hij krijgt zijn plaats en zijn personage ongeschonden terug."
      tuto_clan_menu_title:
        fr: "Les options du clan"
        en: "Clan options"
        es: "Opciones del clan"
        de: "Clan-Optionen"
        it: "Le opzioni del clan"
        pt: "As opções do clã"
        br: "As opções do clã"
        nl: "Clanopties"
      tuto_clan_menu_admin_title:
        fr: "Les options réservées aux chefs de clan"
        en: "Options for clan chiefs only"
        es: "Opciones reservadas a los jefes de clan"
        de: "Optionen nur für Clanchefs"
        it: "Opzioni riservate ai capi clan"
        pt: "Opções reservadas aos chefes de clã"
        br: "Opções reservadas aos chefes de clã"
        nl: "Opties voor clanhoofden"
      tuto_perso_menu_title:
        fr: "Les options du personnage"
        en: "Character options"
        es: "Opciones del personaje"
        de: "Charakter-Optionen"
        it: "Le opzioni del personaggio"
        pt: "As opções do personagem"
        br: "As opções do personagem"
        nl: "Personage-opties"
      tuto_perso_menu_journal:
        fr: "« Mon Journal » raconte tout ce que tu as fait dans le donjon : tes tâches, tes montées de niveau, tes trésors. Personne ne peut l'effacer."
        en: "« My Log » tells everything you have done in the dungeon: your tasks, your level-ups, your treasures. Nobody can erase it."
        es: "« Mi Diario » cuenta todo lo que has hecho en la mazmorra: tus tareas, tus subidas de nivel, tus tesoros. Nadie puede borrarlo."
        de: "„Mein Tagebuch“ erzählt alles, was du im Kerker getan hast: deine Aufgaben, deine Stufenaufstiege, deine Schätze. Niemand kann es löschen."
        it: "«Il mio diario» racconta tutto quello che hai fatto nel dungeon: i tuoi compiti, i tuoi passaggi di livello, i tuoi tesori. Nessuno può cancellarlo."
        pt: "«O Meu Diário» conta tudo o que fizeste na masmorra: as tuas tarefas, as tuas subidas de nível, os teus tesouros. Ninguém o pode apagar."
        br: "\"Meu Diário\" conta tudo o que você fez na masmorra: suas tarefas, suas subidas de nível, seus tesouros. Ninguém pode apagá-lo."
        nl: "‘Mijn dagboek’ vertelt alles wat je in de kerker hebt gedaan: je taken, je niveaustijgingen, je schatten. Niemand kan het wissen."
      # Un DROIT, formulé comme tel, et réversible : c'est ce qui autorise à le proposer aux mineurs.
      tuto_perso_menu_nudges:
        fr: "« Ne plus me faire signe », dans « Options avancées… », coupe les messages que le donjon t'envoie quand tu ne viens plus. Tu peux les rétablir quand tu veux, au même endroit."
        en: "« Stop nudging me », under « Advanced options… », turns off the messages the dungeon sends you when you stop coming. You can turn them back on whenever you like, in the same place."
        es: "« No me avises más », en « Opciones avanzadas… », corta los mensajes que la mazmorra te envía cuando dejas de venir. Puedes restablecerlos cuando quieras, en el mismo sitio."
        de: "„Nicht mehr erinnern“ unter „Erweiterte Optionen…“ schaltet die Nachrichten ab, die dir der Kerker schickt, wenn du nicht mehr vorbeikommst. Du kannst sie jederzeit an derselben Stelle wieder einschalten."
        it: "«Non avvisarmi più», in «Opzioni avanzate…», disattiva i messaggi che il dungeon ti manda quando non vieni più. Puoi riattivarli quando vuoi, nello stesso punto."
        pt: "«Não me avises mais», em «Opções avançadas…», desliga as mensagens que a masmorra te envia quando deixas de vir. Podes voltar a ativá-las quando quiseres, no mesmo sítio."
        br: "\"Não me avise mais\", em \"Opções avançadas…\", desliga as mensagens que a masmorra envia quando você para de vir. Você pode reativá-las quando quiser, no mesmo lugar."
        nl: "‘Geen seintjes meer’, onder ‘Geavanceerde opties…’, zet de berichten uit die de kerker je stuurt als je niet meer langskomt. Je kunt ze op dezelfde plek weer aanzetten wanneer je wilt."
      clan_menu_log_desc:
        fr: "Voir le journal de tout le clan."
        en: "View the whole clan's log."
        es: "Ver el registro de todo el clan."
        de: "Das Tagebuch des ganzen Clans ansehen."
        it: "Vedere il diario di tutto il clan."
        pt: "Ver o diário de todo o clã."
        br: "Ver o diário de todo o clã."
        nl: "Het dagboek van de hele clan bekijken."
      # « Un adulte » depuis le 2026-09-22 : sans accord d'enfant joint, ce QR code ne propose

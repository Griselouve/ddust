      tuto_perso_menu_journal:
        fr: "« Mon Journal » raconte tout ce que tu as fait dans le donjon : tes tâches, tes montées de niveau, tes trésors. Personne ne peut l'effacer."
        en: "« My Log » tells everything you have done in the dungeon: your tasks, your level-ups, your treasures. Nobody can erase it."
        es: "« Mi Diario » cuenta todo lo que has hecho en la mazmorra: tus tareas, tus subidas de nivel, tus tesoros. Nadie puede borrarlo."
        de: "„Mein Tagebuch“ erzählt alles, was du im Kerker getan hast: deine Aufgaben, deine Stufenaufstiege, deine Schätze. Niemand kann es löschen."
        it: "«Il mio diario» racconta tutto quello che hai fatto nel dungeon: i tuoi compiti, i tuoi passaggi di livello, i tuoi tesori. Nessuno può cancellarlo."
        pt: "«O Meu Diário» conta tudo o que fizeste na masmorra: as tuas tarefas, as tuas subidas de nível, os teus tesouros. Ninguém o pode apagar."
        br: "\"Meu Diário\" conta tudo o que você fez na masmorra: suas tarefas, suas subidas de nível, seus tesouros. Ninguém pode apagá-lo."
        nl: "‘Mijn dagboek’ vertelt alles wat je in de kerker hebt gedaan: je taken, je niveaustijgingen, je schatten. Niemand kan het wissen."
      # Un DROIT, formulé comme tel, et réversible : c'est ce qui autorise à le proposer aux mineurs.
      tuto_perso_menu_nudges:
        fr: "« Ne plus me faire signe » coupe les messages que le donjon t'envoie quand tu ne viens plus. Tu peux les rétablir quand tu veux, au même endroit."
        en: "« Stop nudging me » turns off the messages the dungeon sends you when you stop coming. You can turn them back on whenever you like, in the same place."
        es: "« No me avises más » corta los mensajes que la mazmorra te envía cuando dejas de venir. Puedes restablecerlos cuando quieras, en el mismo sitio."
        de: "„Nicht mehr erinnern“ schaltet die Nachrichten ab, die dir der Kerker schickt, wenn du nicht mehr vorbeikommst. Du kannst sie jederzeit an derselben Stelle wieder einschalten."
        it: "«Non avvisarmi più» disattiva i messaggi che il dungeon ti manda quando non vieni più. Puoi riattivarli quando vuoi, nello stesso punto."
        pt: "«Não me avises mais» desliga as mensagens que a masmorra te envia quando deixas de vir. Podes voltar a ativá-las quando quiseres, no mesmo sítio."
        br: "\"Não me avise mais\" desliga as mensagens que a masmorra envia quando você para de vir. Você pode reativá-las quando quiser, no mesmo lugar."
        nl: "‘Geen seintjes meer’ zet de berichten uit die de kerker je stuurt als je niet meer langskomt. Je kunt ze op dezelfde plek weer aanzetten wanneer je wilt."

        es: "Invitar a un adulto con un código QR."
        de: "Einen Erwachsenen per QR-Code einladen."
        it: "Invitare un adulto con un codice QR."
        pt: "Convidar um adulto por código QR."
        br: "Convidar um adulto por QR Code."
        nl: "Een volwassene uitnodigen via QR-code."
      clan_menu_tutorials_desc:
        fr: "Revoir les tutoriels du jeu."
        en: "Replay the game tutorials."
        es: "Volver a ver los tutoriales del juego."
        de: "Die Tutorials des Spiels erneut ansehen."
        it: "Rivedere i tutorial del gioco."
        pt: "Rever os tutoriais do jogo."
        br: "Rever os tutoriais do jogo."
        nl: "De tutorials van het spel opnieuw bekijken."
      perso_menu_log_desc:
        fr: "Voir ton propre journal d'actions."
        en: "View your own action log."
        es: "Ver tu propio registro de acciones."
        de: "Dein eigenes Aktions-Tagebuch ansehen."
        it: "Vedere il tuo diario delle azioni."
        pt: "Ver o teu próprio diário de ações."
        br: "Ver seu próprio diário de ações."
        nl: "Je eigen actiedagboek bekijken."
      perso_menu_logout_desc:
        fr: "Te déconnecter de ton compte."
        en: "Sign out of your account."

        nl: "Er valt niets te openen: de kist wacht op een code."
      giftcode_invalid:
        fr: "Ce code n'ouvre aucun coffre. Vérifiez les signes, un par un."
        en: "This code opens no chest. Check the characters, one by one."
        es: "Este código no abre ningún cofre. Comprueba los signos, uno a uno."
        de: "Dieser Code öffnet keine Truhe. Prüf die Zeichen, eins nach dem anderen."
        it: "Questo codice non apre nessuno scrigno. Controlla i caratteri, uno per uno."
        pt: "Este código não abre nenhum baú. Verifica os caracteres, um a um."
        br: "Este código não abre nenhum baú. Confira os caracteres, um por um."
        nl: "Deze code opent geen enkele kist. Controleer de tekens, een voor een."
      giftcode_used:
        fr: "Votre clan a déjà ouvert ce coffre-là."
        en: "Your clan has already opened that chest."
        es: "Vuestro clan ya ha abierto ese cofre."
        de: "Euer Clan hat diese Truhe schon geöffnet."
        it: "Il vostro clan ha già aperto quello scrigno."
        pt: "O vosso clã já abriu esse baú."
        br: "O clã de vocês já abriu esse baú."
        nl: "Jullie clan heeft die kist al geopend."
      giftcode_exhausted:
        fr: "Ce coffre a été vidé par d'autres clans avant vous."
        en: "This chest was emptied by other clans before you."
        es: "Otros clanes vaciaron este cofre antes que vosotros."
        de: "Andere Clans haben diese Truhe schon vor euch geleert."
        it: "Altri clan hanno svuotato questo scrigno prima di voi."
        pt: "Outros clãs esvaziaram este baú antes de vocês."
        br: "Outros clãs esvaziaram este baú antes de vocês."
        nl: "Andere clans hebben deze kist al voor jullie leeggehaald."
      giftcode_expired:
        fr: "Ce code a fait son temps : le coffre s'est refermé."
        en: "This code has had its day: the chest has closed again."
        es: "Este código ya cumplió su tiempo: el cofre se ha vuelto a cerrar."
        de: "Dieser Code hat ausgedient: Die Truhe hat sich wieder geschlossen."
        it: "Questo codice ha fatto il suo tempo: lo scrigno si è richiuso."
        pt: "Este código já cumpriu o seu tempo: o baú voltou a fechar-se."
        br: "Este código já cumpriu seu tempo: o baú voltou a se fechar."
        nl: "Deze code heeft zijn tijd gehad: de kist is weer dichtgegaan."
      # Le message ne dit pas combien d'essais restent, ni quand la porte rouvre :
      # ce serait dire à quelqu'un qui cherche à deviner comment s'y prendre.
      giftcode_throttled:
        fr: "Trop de clés essayées. La serrure se repose ; revenez demain."
        en: "Too many keys tried. The lock is resting; come back tomorrow."
        es: "Demasiadas llaves probadas. La cerradura descansa; vuelve mañana."
        de: "Zu viele Schlüssel ausprobiert. Das Schloss ruht sich aus; komm morgen wieder."
        it: "Troppe chiavi provate. La serratura si riposa; torna domani."
        pt: "Demasiadas chaves experimentadas. A fechadura está a descansar; volta amanhã."
        br: "Chaves demais testadas. A fechadura está descansando; volte amanhã."
        nl: "Te veel sleutels geprobeerd. Het slot rust even uit; kom morgen terug."
      giftcode_not_admin:
        fr: "Seul un chef de clan peut ouvrir ce coffre."
        en: "Only a clan chief can open this chest."
        es: "Solo un jefe de clan puede abrir este cofre."
        de: "Nur ein Clanchef kann diese Truhe öffnen."
        it: "Solo un capo clan può aprire questo scrigno."
        pt: "Só um chefe de clã pode abrir este baú."
        br: "Só um chefe de clã pode abrir este baú."
        nl: "Alleen een clanhoofd kan deze kist openen."
      giftcode_network:
        fr: "Le coffre reste muet. Réessayez dans un instant."
        en: "The chest stays silent. Try again in a moment."
        es: "El cofre permanece mudo. Inténtalo de nuevo en un momento."
        de: "Die Truhe bleibt stumm. Versuch es gleich noch einmal."
        it: "Lo scrigno resta muto. Riprova tra un attimo."
        pt: "O baú continua mudo. Tenta outra vez daqui a pouco."
        br: "O baú continua mudo. Tente de novo daqui a pouco."
        nl: "De kist blijft stil. Probeer het zo meteen opnieuw."

      # DEUX jetons de refus, et un seul critère pour choisir : l'HISTOIRE COMMERCIALE
      # du clan (_storeCapNotice lit _storeState), jamais le plafond lui-même.
      #   - jamais souscrit  → store_cap_start : c'est une proposition, on dit ce qui
      #                        attend le clan et qu'il arrête quand il veut ;
      #   - tous les autres  → store_cap_full  : abonné qui déborde, résilié, expiré,
      #                        gelé. Ils savent déjà ce qu'est la cotisation, on ne
      #                        leur représente pas le modèle.
      # AUCUN des deux ne promet de jours offerts : il n'y a plus d'essai au catalogue
      # depuis le 2026-09-16, et une promesse démentie par la feuille de paiement est
      # pire que pas de promesse.
      #
      # Il y en avait eu trois autrefois (enfants pleins / adultes pleins / les deux),
      # parce que le catalogue portait deux plafonds distincts. Il n'y a plus qu'un
      # compteur de joueurs, donc plus qu'une façon d'être complet.
      #
      # Aucun des deux textes ne nomme de palier : celui qu'il faut prendre dépend de
      # l'effectif, et la page des paliers le flèche elle-même à la ligne près. Écrire
      # « prenez l'illimité » ici, comme le faisait une vieille version, vendait le
      # plus cher à un clan de trois qui n'avait besoin que du palier d'à côté.
      #
      # « pour cette cotisation » a été retiré de store_cap_full : c'était faux pour un
      # clan expiré ou gelé, qui n'en a plus aucune, et ça se lisait comme un reproche.
      store_cap_full:
        fr: "Le clan est au complet. Voici les paliers, et celui qui vous ouvrirait une place de plus."
        en: "The clan is full. Here are the tiers, and the one that would open another seat for you."
        es: "El clan está completo. Estos son los niveles, y el que os abriría una plaza más."
        de: "Der Clan ist voll. Hier sind die Tarife, und der, der euch einen Platz mehr öffnen würde."
        it: "Il clan è al completo. Ecco le fasce, e quella che vi aprirebbe un posto in più."
        pt: "O clã está completo. Aqui estão os escalões, e o que vos abriria mais um lugar."
        br: "O clã está completo. Aqui estão os planos, e o que abriria mais uma vaga para vocês."
        nl: "De clan is vol. Hier zijn de pakketten, en het pakket dat jullie een plek extra zou geven."
      # {n} = le plafond courant, substitué par on_tiers_appear (jamais un chiffre en
      # dur : la grille se règle depuis le bucket, ce texte est embarqué au binaire).
      #
      # ⚠ PLUS AUCUNE PROMESSE DE JOURS OFFERTS ici depuis le 2026-09-16 : l'offre
      # `essai-14j` a été retirée du catalogue, l'accès libre du début a pris sa place,
      # et il est DERRIÈRE la famille au moment où elle bute sur le plafond. Une
      # promesse embarquée au binaire que la feuille de paiement dément ne se rattrape
      # par aucun layer : elle demande une version sur les stores.
      store_cap_start:
        fr: "Votre clan grandit ! Au-delà de {n} aventuriers, il lui faut une cotisation, et vous l'arrêtez quand vous voulez."
        en: "Your clan is growing! Beyond {n} adventurers it needs dues, and you can stop whenever you want."
        es: "¡Vuestro clan crece! Más allá de {n} aventureros necesita una cuota, y la paráis cuando queráis."
        de: "Euer Clan wächst! Ab mehr als {n} Abenteurern braucht er einen Beitrag, und ihr könnt jederzeit aufhören."
        it: "Il vostro clan cresce! Oltre {n} avventurieri ha bisogno di una quota, e potete fermarla quando volete."
        pt: "O vosso clã está a crescer! Acima de {n} aventureiros precisa de uma quota, e podem pará-la quando quiserem."
        br: "O clã de vocês está crescendo! Acima de {n} aventureiros, ele precisa de uma assinatura, e vocês podem cancelar quando quiserem."
        nl: "Jullie clan groeit! Boven de {n} avonturiers is er een contributie nodig, en jullie stoppen ermee wanneer jullie willen."
      # La DEMANDE DE PREMIÈRE COTISATION, affichée aux seuls chefs sur la validation
      # qui atteint le seuil (trois tâches menées à leur terme depuis que le clan n'est
      # plus seul, dix pour un clan resté seul). Ne menace de rien, ne nomme aucun
      # palier, ne compte pas les tâches : ce n'est pas une sanction, c'est le moment où
      # l'on demande le prix — la famille vient de constater de ses yeux que le jeu
      # fonctionne, c'est le seul argument dont on ait besoin.
      #
      # UN SEUL TEXTE pour les deux seuils. Le chiffre qui a déclenché la demande ne
      # regarde pas la famille, et « dix défis relevés ! » dirait à un fondateur solo
      # qu'on comptait ses tours depuis le début.
      store_pitch_first:
        fr: "Votre clan a pris le rythme. Pour qu'il continue, il lui faut une cotisation : vous l'arrêtez quand vous voulez, et votre clan reste intact."
        en: "Your clan has found its rhythm. To keep it going it needs dues: you can stop whenever you want, and your clan stays intact."
        es: "Vuestro clan ha cogido el ritmo. Para que continúe necesita una cuota: la paráis cuando queráis, y vuestro clan queda intacto."
        de: "Euer Clan hat seinen Rhythmus gefunden. Damit es weitergeht, braucht er einen Beitrag: Ihr könnt jederzeit aufhören, und euer Clan bleibt unversehrt."
        it: "Il vostro clan ha preso il ritmo. Per continuare ha bisogno di una quota: potete fermarla quando volete, e il vostro clan resta intatto."
        pt: "O vosso clã apanhou o ritmo. Para continuar precisa de uma quota: podem pará-la quando quiserem, e o vosso clã fica intacto."
        br: "O clã de vocês pegou o ritmo. Para continuar, ele precisa de uma assinatura: vocês podem cancelar quando quiserem, e o clã fica intacto."
        nl: "Jullie clan zit in het ritme. Om door te gaan is er een contributie nodig: jullie stoppen ermee wanneer jullie willen, en jullie clan blijft intact."
      # LE REPORT, et son décompte. {n} = reports restants, substitué par
      # _tiersSyncDefer. Deux formulations, parce que « encore 1 fois » se lit mal et
      # surtout parce que la DERNIÈRE fois doit se dire comme telle : c'est toute la
      # différence entre une famille qui sait ce qui vient et une famille qui trouve
      # un jour la porte fermée sans avoir été prévenue.
      tiers_defer_n:
        fr: "Plus tard (encore {n} fois)"
        en: "Later ({n} more times)"
        es: "Más tarde ({n} veces más)"
        de: "Später (noch {n} Mal)"
        it: "Più tardi (ancora {n} volte)"
        pt: "Mais tarde (mais {n} vezes)"
        br: "Mais tarde (mais {n} vezes)"
        nl: "Later (nog {n} keer)"
      tiers_defer_last:
        fr: "Plus tard (dernière fois)"
        en: "Later (last time)"
        es: "Más tarde (última vez)"
        de: "Später (letztes Mal)"
        it: "Più tardi (ultima volta)"
        pt: "Mais tarde (última vez)"
        br: "Mais tarde (última vez)"
        nl: "Later (laatste keer)"

      # --- LES DEUX GUIDES (leçons dvtuto `guide_parent` / `guide_enfant`) -----------
      # Ce ne sont pas des textes d'interface : ce sont les seuls endroits de l'app où
      # l'INTENTION est dite. Trois règles de rédaction, à tenir dans les trois langues :
      #   - aucune injonction à l'enfant ; on lui dit ses droits, pas ses devoirs ;
      #   - aucun chiffre qui ne soit vérifiable dans le code (10 PV, 1 PV/jour, demi-XP) ;
      #   - le vouvoiement pour le parent, le tutoiement pour l'enfant.
      tuto_guide_parent_title:
        fr: "Guide du parent"
        en: "Parent's guide"
        es: "Guía para padres"
        de: "Ratgeber für Eltern"
        it: "Guida per genitori"
        pt: "Guia para pais"
        br: "Guia para pais"
        nl: "Gids voor ouders"
      tuto_guide_enfant_title:
        fr: "Guide de l'aventurier"
        en: "Adventurer's guide"
        es: "Guía del aventurero"
        de: "Ratgeber für Abenteurer"
        it: "Guida dell'avventuriero"
        pt: "Guia do aventureiro"
        br: "Guia do aventureiro"
        nl: "Gids van de avonturier"
      perso_menu_guide_parent_desc:
        fr: "Ce que l'application attend de vous : l'effort, l'alerte, le butin, votre place dans le jeu."
        en: "What the app expects from you: effort, the alert, the loot, and your own place in the game."
        es: "Lo que la aplicación espera de ti: el esfuerzo, la alerta, el botín y tu lugar en el juego."
        de: "Was die App von dir erwartet: die Mühe, die Warnung, die Beute und deinen eigenen Platz im Spiel."
        it: "Cosa si aspetta da te l'app: l'impegno, l'allarme, il bottino e il tuo posto nel gioco."
        pt: "O que a aplicação espera de ti: o esforço, o alerta, o espólio e o teu lugar no jogo."
        br: "O que o aplicativo espera de você: o esforço, o alerta, o tesouro e o seu lugar no jogo."
        nl: "Wat de app van je verwacht: de moeite, de waarschuwing, de buit en je eigen plek in het spel."
      perso_menu_guide_enfant_desc:
        fr: "Tes droits dans le jeu : recommencer, refuser un gage, garder ta photo."
        en: "Your rights in the game: start over, refuse a forfeit, keep your photo."
        es: "Tus derechos en el juego: volver a empezar, rechazar una prenda, guardar tu foto."
        de: "Deine Rechte im Spiel: neu anfangen, ein Pfand ablehnen, dein Foto behalten."
        it: "I tuoi diritti nel gioco: ricominciare, rifiutare una penitenza, tenere la tua foto."
        pt: "Os teus direitos no jogo: recomeçar, recusar um castigo, guardar a tua foto."
        br: "Seus direitos no jogo: recomeçar, recusar um castigo, guardar sua foto."
        nl: "Jouw rechten in het spel: opnieuw beginnen, een pand weigeren, je foto houden."

      # Rejeu du guide du parent par un mineur (écran Tutoriels : le rejeu force la leçon et
      # court-circuite ses `requires`). On ne montre rien du guide, et on nomme celui qui lui
      # revient plutôt que de le laisser devant un écran vide.
      guide_p_not_adult:
        fr: "Ce guide s'adresse aux adultes du clan. Le tien s'appelle « Guide de l'aventurier » — il est juste en dessous dans cette liste."
        en: "This guide is for the grown-ups of the clan. Yours is called « Adventurer's guide » — it is just below in this list."
        es: "Esta guía es para los adultos del clan. La tuya se llama « Guía del aventurero » — está justo debajo en esta lista."
        de: "Dieser Ratgeber ist für die Erwachsenen im Clan. Deiner heißt „Ratgeber für Abenteurer“: Er steht direkt darunter in dieser Liste."
        it: "Questa guida è per gli adulti del clan. La tua si chiama «Guida dell'avventuriero»: è subito sotto in questo elenco."
        pt: "Este guia é para os adultos do clã. O teu chama-se «Guia do aventureiro»: está logo abaixo nesta lista."
        br: "Este guia é para os adultos do clã. O seu se chama \"Guia do aventureiro\": está logo abaixo nesta lista."
        nl: "Deze gids is voor de volwassenen van de clan. De jouwe heet ‘Gids van de avonturier’: die staat er in deze lijst net onder."
      # --- Parent, écran 1 : l'effort. Il OUVRE le guide, avant l'écran sur la mort —
      #     commencer par « votre enfant est mort » installerait le contresens qu'on défait.
      guide_p1_title:
        fr: "L'effort avant le résultat"
        en: "Effort before result"
        es: "El esfuerzo antes que el resultado"
        de: "Die Mühe vor dem Ergebnis"
        it: "L'impegno prima del risultato"
        pt: "O esforço antes do resultado"
        br: "O esforço antes do resultado"
        nl: "De moeite vóór het resultaat"
      guide_p1_situation:
        fr: "Le lit est fait… à moitié. Votre enfant vous montre fièrement sa photo, et attend votre verdict."
        en: "The bed is made… halfway. Your child proudly shows you the photo, and waits for your verdict."
        es: "La cama está hecha… a medias. Tu hijo te enseña la foto con orgullo y espera tu veredicto."
        de: "Das Bett ist gemacht… halb. Dein Kind zeigt dir stolz sein Foto und wartet auf dein Urteil."
        it: "Il letto è fatto… a metà. Tuo figlio ti mostra con orgoglio la foto e aspetta il tuo verdetto."
        pt: "A cama está feita… a meio. O teu filho mostra-te a foto com orgulho e espera o teu veredicto."
        br: "A cama está feita… pela metade. Seu filho mostra a foto com orgulho e espera seu veredito."
        nl: "Het bed is opgemaakt… half. Je kind laat je trots de foto zien en wacht op je oordeel."
      guide_p1_a:
        fr: "Trois verdicts, aucune punition"
        en: "Three verdicts, no punishment"
        es: "Tres veredictos, ningún castigo"
        de: "Drei Urteile, keine Strafe"
        it: "Tre verdetti, nessuna punizione"
        pt: "Três veredictos, nenhum castigo"
        br: "Três vereditos, nenhum castigo"
        nl: "Drie oordelen, geen straf"
      guide_p1_a_desc:
        fr: "Accepté, partiel — la moitié des points —, ou refusé : la tâche revient simplement à l'enfant. Rien ne lui est jamais retiré."
        en: "Accepted, partial — half the points —, or refused: the task simply comes back to the child. Nothing is ever taken away."
        es: "Aceptada, parcial —la mitad de los puntos— o rechazada: la tarea vuelve al niño. Nunca se le quita nada."
        de: "Angenommen, teilweise (die Hälfte der Punkte) oder abgelehnt: Die Aufgabe geht einfach an das Kind zurück. Nie wird ihm etwas weggenommen."
        it: "Accettato, parziale (metà dei punti) o rifiutato: il compito torna semplicemente al bambino. Non gli viene mai tolto nulla."
        pt: "Aceite, parcial (metade dos pontos) ou recusada: a tarefa volta simplesmente para a criança. Nunca lhe é tirado nada."
        br: "Aceita, parcial (metade dos pontos) ou recusada: a tarefa simplesmente volta para a criança. Nunca se tira nada dela."
        nl: "Geaccepteerd, gedeeltelijk (de helft van de punten) of geweigerd: de taak gaat gewoon terug naar het kind. Er wordt nooit iets afgepakt."
      guide_p1_b:
        fr: "Aucun compteur d'échecs"
        en: "No failure tally"
        es: "Ningún recuento de fracasos"
        de: "Keine Strichliste für Misserfolge"
        it: "Nessun conteggio dei fallimenti"
        pt: "Nenhuma contagem de falhas"
        br: "Nenhuma contagem de falhas"
        nl: "Geen turflijst van mislukkingen"
      guide_p1_b_desc:
        fr: "Le journal ne garde pas trace d'un refus, et le jeu n'a ni classement ni note. N'en tenez pas non plus à la maison."
        en: "The log keeps no trace of a refusal, and the game has no ranking and no grades. Don't keep any at home either."
        es: "El diario no guarda rastro de un rechazo, y el juego no tiene ni clasificación ni notas. Tampoco las lleves en casa."
        de: "Das Tagebuch hält keine Ablehnung fest, und das Spiel hat weder Rangliste noch Noten. Führ auch zu Hause keine."
        it: "Il diario non tiene traccia di un rifiuto, e il gioco non ha né classifica né voti. Non tenerne nemmeno a casa."
        pt: "O diário não guarda registo de uma recusa, e o jogo não tem classificação nem notas. Também não as tenhas em casa."
        br: "O diário não registra uma recusa, e o jogo não tem ranking nem notas. Não use isso em casa também."
        nl: "Het dagboek houdt geen weigeringen bij, en het spel heeft geen ranglijst en geen cijfers. Houd die thuis ook niet bij."
      guide_p1_c:
        fr: "Dites d'abord ce qui est réussi"
        en: "Say what went right first"
        es: "Di primero lo que salió bien"
        de: "Sag zuerst, was gelungen ist"
        it: "Di' prima cosa è riuscito"
        pt: "Diz primeiro o que correu bem"
        br: "Diga primeiro o que deu certo"
        nl: "Zeg eerst wat gelukt is"
      guide_p1_c_desc:
        fr: "Un mot pèse plus lourd qu'un verdict. C'est le geste qui compte, pas la perfection du résultat."
        en: "A word weighs more than a verdict. What counts is the effort, not a perfect result."
        es: "Una palabra pesa más que un veredicto. Lo que cuenta es el gesto, no un resultado perfecto."
        de: "Ein Wort wiegt mehr als ein Urteil. Es zählt die Geste, nicht ein perfektes Ergebnis."
        it: "Una parola pesa più di un verdetto. Conta il gesto, non la perfezione del risultato."
        pt: "Uma palavra pesa mais do que um veredicto. O que conta é o gesto, não um resultado perfeito."
        br: "Uma palavra pesa mais do que um veredito. O que conta é o gesto, não um resultado perfeito."
        nl: "Een woord weegt zwaarder dan een oordeel. Het gebaar telt, niet een perfect resultaat."

      # --- Parent, écran 2 : la mort. LE point du dossier « intérêt de l'enfant » § 5.2 —
      #     un dispositif d'alerte que le destinataire ne sait pas lire n'alerte personne.
      #     Chiffres : `pv` init 10, `decay` 1 jour/PV → 0 PV au dixième jour d'inactivité.
      guide_p2_title:
        fr: "Perte de PV, c'est une alerte"
        en: "Losing life points is an alert"
        es: "Perder puntos de vida es una alerta"
        de: "LP-Verlust ist ein Warnsignal"
        it: "Perdere PV è un campanello d'allarme"
        pt: "Perder PV é um alerta"
        br: "Perder PV é um alerta"
        nl: "LP verliezen is een waarschuwing"
      guide_p2_situation:
        fr: "Le personnage de votre enfant peut mourir, et un gage l'attend alors. Ce n'est pas le jeu qui le punit : c'est l'application qui vous rend la main."
        en: "Your child's character may die, and a forfeit then awaits. The game is not punishing them: the app is handing things back to you."
        es: "El personaje de tu hijo puede morir, y entonces le espera una prenda. No es el juego que lo castiga: es la aplicación que te devuelve la mano."
        de: "Der Charakter deines Kindes kann sterben, und dann wartet ein Pfand auf ihn. Nicht das Spiel bestraft es: Die App gibt dir das Heft zurück in die Hand."
        it: "Il personaggio di tuo figlio può morire, e allora lo aspetta una penitenza. Non è il gioco che lo punisce: è l'app che ti restituisce la parola."
        pt: "O personagem do teu filho pode morrer, e então espera-o um castigo. Não é o jogo que o pune: é a aplicação que te devolve as rédeas."
        br: "O personagem do seu filho pode morrer, e aí um castigo espera por ele. Não é o jogo que pune: é o aplicativo que devolve as rédeas a você."
        nl: "Het personage van je kind kan doodgaan, en dan wacht er een pand. Het spel straft niet: de app geeft het stuur aan jou terug."
      guide_p2_a:
        fr: "Dix jours sans rien terminer"
        en: "Ten days without finishing anything"
        es: "Diez días sin terminar nada"
        de: "Zehn Tage, ohne etwas zu beenden"
        it: "Dieci giorni senza finire nulla"
        pt: "Dez dias sem terminar nada"
        br: "Dez dias sem terminar nada"
        nl: "Tien dagen zonder iets af te maken"
      guide_p2_a_desc:
        fr: "La perte de PV vous dit d'aller voir pourquoi : de l'ennui ? des tâches trop dures ? Et au bout, il peut y avoir un gage : non pour punir, votre enfant a le droit de refuser, mais pour dédramatiser et resserrer les liens."
        en: "Losing life points tells you to go and find out why: boredom? chores that are too hard? And there may be a forfeit at the end: not to punish, your child is free to refuse it, but to lighten the mood and bring you closer."
        es: "Perder puntos de vida te dice que vayas a ver por qué: ¿aburrimiento? ¿tareas demasiado difíciles? Y al final puede haber una prenda: no para castigar, tu hijo puede negarse, sino para quitar dramatismo y estrechar los lazos."
        de: "Der LP-Verlust sagt dir, dass du nachsehen solltest, warum: Langeweile? Zu schwere Aufgaben? Und am Ende kann ein Pfand stehen: nicht um zu bestrafen (dein Kind darf es ablehnen), sondern um die Stimmung zu lockern und euch näherzubringen."
        it: "La perdita di PV ti dice di andare a vedere perché: noia? Compiti troppo difficili? E alla fine può esserci una penitenza: non per punire (tuo figlio ha il diritto di rifiutarla), ma per sdrammatizzare e rinsaldare i legami."
        pt: "Perder PV diz-te para ires ver porquê: aborrecimento? Tarefas demasiado difíceis? E no fim pode haver um castigo: não para punir (o teu filho pode recusá-lo), mas para desdramatizar e estreitar os laços."
        br: "Perder PV avisa você para ir ver o porquê: tédio? Tarefas difíceis demais? E no fim pode haver um castigo: não para punir (seu filho pode recusá-lo), mas para descontrair e fortalecer os laços."
        nl: "Het verlies van LP zegt je dat je moet gaan kijken waarom: verveling? Te moeilijke taken? En aan het eind kan er een pand zijn: niet om te straffen (je kind mag het weigeren), maar om de spanning weg te nemen en jullie band te versterken."
      guide_p2_b:
        fr: "Une seule tâche répare tout"
        en: "A single task repairs everything"
        es: "Una sola tarea lo repara todo"
        de: "Eine einzige Aufgabe repariert alles"
        it: "Un solo compito ripara tutto"
        pt: "Uma só tarefa repara tudo"
        br: "Uma só tarefa conserta tudo"
        nl: "Eén taak herstelt alles"
      guide_p2_b_desc:
        fr: "Terminer une tâche rend l'intégralité des points de vie. Rien ne s'accumule, rien ne se rattrape : une punition ne s'effacerait pas si vite."
        en: "Finishing one task restores every life point. Nothing piles up, nothing has to be made up for: a punishment would not clear that easily."
        es: "Terminar una tarea devuelve todos los puntos de vida. Nada se acumula, nada hay que recuperar: un castigo no se borraría tan rápido."
        de: "Eine Aufgabe zu beenden gibt alle Lebenspunkte zurück. Nichts sammelt sich an, nichts muss nachgeholt werden: Eine Strafe wäre nicht so schnell vergessen."
        it: "Finire un compito restituisce tutti i punti vita. Niente si accumula, niente va recuperato: una punizione non si cancellerebbe così in fretta."
        pt: "Terminar uma tarefa devolve todos os pontos de vida. Nada se acumula, nada tem de ser recuperado: um castigo não se apagaria tão depressa."
        br: "Terminar uma tarefa devolve todos os pontos de vida. Nada se acumula, nada precisa ser recuperado: um castigo não se apagaria tão rápido."
        nl: "Eén taak afmaken geeft alle levenspunten terug. Niets stapelt zich op, niets hoeft te worden ingehaald: een straf zou niet zo snel verdwijnen."
      guide_p2_c:
        fr: "Le gage est un jeu de famille"
        en: "The forfeit is a family game"
        es: "La prenda es un juego de familia"
        de: "Das Pfand ist ein Familienspiel"
        it: "La penitenza è un gioco di famiglia"
        pt: "O castigo é um jogo de família"
        br: "O castigo é uma brincadeira em família"
        nl: "Het pand is een gezinsspel"
      guide_p2_c_desc:
        fr: "Rien ne vérifie qu'il a été fait. Il se joue devant le clan, jamais seul, et votre enfant a le droit de le refuser."
        en: "Nothing checks that it was carried out. It is played in front of the clan, never alone, and your child is free to refuse it."
        es: "Nada comprueba que se haya cumplido. Se juega ante el clan, nunca a solas, y tu hijo tiene derecho a negarse."
        de: "Nichts prüft, ob es erfüllt wurde. Es wird vor dem Clan gespielt, nie allein, und dein Kind darf es ablehnen."
        it: "Niente verifica che sia stata fatta. Si gioca davanti al clan, mai da soli, e tuo figlio ha il diritto di rifiutarla."
        pt: "Nada verifica se foi cumprido. Joga-se diante do clã, nunca a sós, e o teu filho tem o direito de o recusar."
        br: "Nada verifica se ele foi cumprido. É feito diante do clã, nunca a sós, e seu filho tem o direito de recusá-lo."
        nl: "Niets controleert of het is uitgevoerd. Het wordt gespeeld in het bijzijn van de clan, nooit alleen, en je kind mag het weigeren."

      # --- Parent, écran 3 : le butin. Le seul endroit où l'on dit quoi mettre dedans.
      guide_p3_title:
        fr: "Que mettre dans le butin ?"
        en: "What goes into the loot?"
        es: "¿Qué poner en el botín?"
        de: "Was kommt in die Beute?"
        it: "Cosa mettere nel bottino?"
        pt: "O que pôr no espólio?"
        br: "O que colocar no tesouro?"
        nl: "Wat stop je in de buit?"
      guide_p3_situation:
        fr: "Le coffre du clan est plein et va s'ouvrir. Toute la famille se demande ce qu'il y a dedans."
        en: "The clan chest is full and about to open. The whole family is wondering what is inside."
        es: "El cofre del clan está lleno y va a abrirse. Toda la familia se pregunta qué hay dentro."
        de: "Die Truhe des Clans ist voll und wird gleich geöffnet. Die ganze Familie fragt sich, was drin ist."
        it: "Lo scrigno del clan è pieno e sta per aprirsi. Tutta la famiglia si chiede cosa ci sia dentro."
        pt: "O baú do clã está cheio e vai abrir-se. A família toda pergunta-se o que estará lá dentro."
        br: "O baú do clã está cheio e vai se abrir. A família toda se pergunta o que haverá lá dentro."
        nl: "De kist van de clan is vol en gaat zo open. De hele familie vraagt zich af wat erin zit."
      guide_p3_a:
        fr: "Du temps plutôt que des objets"
        en: "Time rather than things"
        es: "Tiempo más que objetos"
        de: "Zeit statt Dinge"
        it: "Tempo più che oggetti"
        pt: "Tempo em vez de objetos"
        br: "Tempo em vez de objetos"
        nl: "Tijd in plaats van spullen"
      guide_p3_a_desc:
        fr: "Une sortie, un repas choisi, une soirée jeux. Un peu d'argent de poche si c'est déjà votre habitude."
        en: "An outing, a meal of their choosing, a games night. A little pocket money if that is already your habit."
        es: "Una salida, una comida elegida, una noche de juegos. Algo de paga si ya es vuestra costumbre."
        de: "Ein Ausflug, ein Wunschessen, ein Spieleabend. Ein bisschen Taschengeld, wenn das bei euch schon üblich ist."
        it: "Un'uscita, un pasto scelto, una serata giochi. Un po' di paghetta, se è già vostra abitudine."
        pt: "Um passeio, uma refeição à escolha, uma noite de jogos. Um pouco de semanada, se já for vosso hábito."
        br: "Um passeio, uma refeição à escolha, uma noite de jogos. Um pouco de mesada, se isso já for costume de vocês."
        nl: "Een uitje, een zelfgekozen maaltijd, een spelletjesavond. Een beetje zakgeld als dat bij jullie al gebruikelijk is."
      guide_p3_b:
        fr: "Ni gâter, ni marchander"
        en: "Neither spoiling nor bargaining"
        es: "Ni malcriar ni negociar"
        de: "Weder verwöhnen noch feilschen"
        it: "Né viziare né mercanteggiare"
        pt: "Nem mimar nem negociar"
        br: "Nem mimar nem negociar"
        nl: "Niet verwennen, niet onderhandelen"
      guide_p3_b_desc:
        fr: "Le butin n'est pas un salaire. Et « pas de butin tant que… » retourne le jeu contre lui-même."
        en: "The loot is not a wage. And « no loot until… » turns the game against itself."
        es: "El botín no es un sueldo. Y «no hay botín hasta que…» vuelve el juego contra sí mismo."
        de: "Die Beute ist kein Lohn. Und „keine Beute, solange…“ dreht das Spiel gegen sich selbst."
        it: "Il bottino non è uno stipendio. E «niente bottino finché…» rivolta il gioco contro sé stesso."
        pt: "O espólio não é um salário. E «não há espólio enquanto…» vira o jogo contra si próprio."
        br: "O tesouro não é um salário. E \"sem tesouro enquanto…\" vira o jogo contra ele mesmo."
        nl: "De buit is geen loon. En ‘geen buit zolang…’ keert het spel tegen zichzelf."
      guide_p3_c:
        fr: "Chacun reçoit sa part"
        en: "Everyone gets a share"
        es: "Cada uno recibe su parte"
        de: "Jeder bekommt seinen Anteil"
        it: "Ognuno riceve la sua parte"
        pt: "Cada um recebe a sua parte"
        br: "Cada um recebe sua parte"
        nl: "Iedereen krijgt zijn deel"
      guide_p3_c_desc:
        fr: "Y compris celui qui a peu joué. Une surprise ne doit pas se transformer en bulletin de notes."
        en: "Including the one who hardly played. A surprise must not turn into a report card."
        es: "Incluido quien apenas jugó. Una sorpresa no debe convertirse en un boletín de notas."
        de: "Auch wer wenig gespielt hat. Eine Überraschung darf nicht zum Zeugnis werden."
        it: "Anche chi ha giocato poco. Una sorpresa non deve trasformarsi in una pagella."
        pt: "Incluindo quem jogou pouco. Uma surpresa não se deve transformar num boletim de notas."
        br: "Inclusive quem jogou pouco. Uma surpresa não deve virar um boletim escolar."
        nl: "Ook wie weinig gespeeld heeft. Een verrassing mag geen rapport worden."

      # --- Parent, écran 4 : votre propre place. Hors concours, coup de pouce, photo.
      guide_p4_title:
        fr: "Jouer sans les écraser"
        en: "Play without crushing them"
        es: "Jugar sin aplastarlos"
        de: "Spielen, ohne sie zu überrollen"
        it: "Giocare senza schiacciarli"
        pt: "Jogar sem os esmagar"
        br: "Jogar sem esmagá-los"
        nl: "Spelen zonder ze te overklassen"
      guide_p4_situation:
        fr: "Vous prenez goût au jeu, et vous abattez trois fois plus de tâches que les enfants."
        en: "You are getting a taste for the game, and you are clearing three times as many tasks as the children."
        es: "Le has cogido el gusto al juego y despachas tres veces más tareas que los niños."
        de: "Du findest Gefallen am Spiel und erledigst dreimal so viele Aufgaben wie die Kinder."
        it: "Ci hai preso gusto e sbrighi tre volte più compiti dei bambini."
        pt: "Tomaste-lhe o gosto e despachas três vezes mais tarefas do que as crianças."
        br: "Você pegou gosto e despacha três vezes mais tarefas do que as crianças."
        nl: "Je krijgt de smaak van het spel te pakken en je werkt drie keer zoveel taken af als de kinderen."
      guide_p4_a:
        fr: "Passez hors concours"
        en: "Play out of contest"
        es: "Ponte fuera de concurso"
        de: "Spiel außer Konkurrenz"
        it: "Mettiti fuori concorso"
        pt: "Põe-te fora de concurso"
        br: "Fique fora da competição"
        nl: "Speel buiten mededinging"
      guide_p4_a_desc:
        fr: "Vous continuez à faire progresser le clan, mais vous sortez des comparaisons et des récompenses. La jauge des enfants se mesure au meilleur du cycle : ce serait vous."
        en: "You keep the clan moving forward, but you step out of comparisons and rewards. The children's gauge is measured against the best of the cycle — that would be you."
        es: "Sigues haciendo avanzar al clan, pero sales de las comparaciones y las recompensas. El medidor de los niños se mide con el mejor del ciclo: serías tú."
        de: "Du bringst den Clan weiter voran, aber du trittst aus Vergleichen und Belohnungen heraus. Die Anzeige der Kinder misst sich am Besten des Zyklus: Das wärst du."
        it: "Continui a far progredire il clan, ma esci dai confronti e dalle ricompense. L'indicatore dei bambini si misura sul migliore del ciclo: saresti tu."
        pt: "Continuas a fazer o clã avançar, mas sais das comparações e das recompensas. O medidor das crianças mede-se pelo melhor do ciclo: serias tu."
        br: "Você continua fazendo o clã avançar, mas sai das comparações e das recompensas. O medidor das crianças se baseia no melhor do ciclo: seria você."
        nl: "Je helpt de clan nog steeds vooruit, maar je doet niet meer mee aan vergelijkingen en beloningen. De meter van de kinderen wordt afgemeten aan de beste van de cyclus: dat zou jij zijn."
      guide_p4_b:
        fr: "Recommandez plutôt que comparer"
        en: "Recommend rather than compare"
        es: "Recomienda en vez de comparar"
        de: "Empfehlen statt vergleichen"
        it: "Consiglia invece di confrontare"
        pt: "Recomenda em vez de comparar"
        br: "Recomende em vez de comparar"
        nl: "Aanbevelen in plaats van vergelijken"
      guide_p4_b_desc:
        fr: "Un enfant à la traîne ? Recommandez-lui une tâche : elle rapporte davantage, sans que personne ait été désigné devant les autres."
        en: "A child falling behind? Recommend a task to them: it is worth more, and no one has been singled out in front of the others."
        es: "¿Un niño que se queda atrás? Recomiéndale una tarea: vale más, y nadie ha sido señalado ante los demás."
        de: "Ein Kind hängt hinterher? Empfiehl ihm eine Aufgabe: Sie bringt mehr ein, ohne dass jemand vor den anderen herausgestellt wird."
        it: "Un bambino resta indietro? Consigliagli un compito: vale di più, e nessuno viene indicato davanti agli altri."
        pt: "Uma criança está a ficar para trás? Recomenda-lhe uma tarefa: vale mais, e ninguém é apontado diante dos outros."
        br: "Uma criança está ficando para trás? Recomende uma tarefa para ela: vale mais, e ninguém é exposto na frente dos outros."
        nl: "Blijft een kind achter? Beveel het een taak aan: die levert meer op, zonder dat iemand voor de anderen wordt aangewezen."
      guide_p4_c:
        fr: "Les photos restent chez eux"
        en: "Photos stay with them"
        es: "Las fotos se quedan con ellos"
        de: "Die Fotos bleiben bei ihnen"
        it: "Le foto restano a loro"
        pt: "As fotos ficam com eles"
        br: "As fotos ficam com eles"
        nl: "De foto's blijven bij hen"
      guide_p4_c_desc:
        fr: "La preuve photo ne quitte jamais le téléphone de l'enfant : elle se montre en personne, elle ne se réclame pas. Pour tout effacer : Personnage, puis Supprimer mon compte."
        en: "The photo proof never leaves the child's phone: it is shown in person, it cannot be demanded. To erase everything: Character, then Delete my account."
        es: "La foto de prueba nunca sale del teléfono del niño: se enseña en persona, no se reclama. Para borrarlo todo: Personaje y luego Eliminar mi cuenta."
        de: "Das Beweisfoto verlässt nie das Handy des Kindes: Es wird persönlich gezeigt, man kann es nicht einfordern. Um alles zu löschen: Charakter, dann Mein Konto löschen."
        it: "La foto di prova non lascia mai il telefono del bambino: si mostra di persona, non si pretende. Per cancellare tutto: Personaggio, poi Elimina il mio account."
        pt: "A foto de prova nunca sai do telemóvel da criança: mostra-se pessoalmente, não se exige. Para apagar tudo: Personagem e depois Eliminar a minha conta."
        br: "A foto de prova nunca sai do celular da criança: ela é mostrada pessoalmente, não é exigida. Para apagar tudo: Personagem e depois Excluir minha conta."
        nl: "De bewijsfoto verlaat nooit de telefoon van het kind: hij wordt persoonlijk getoond, je kunt hem niet opeisen. Om alles te wissen: Personage, dan Mijn account verwijderen."

      # --- Enfant, écran 1 : à quoi sert ce que tu fais.
      guide_k1_title:
        fr: "Ton clan compte sur toi"
        en: "Your clan is counting on you"
        es: "Tu clan cuenta contigo"
        de: "Dein Clan zählt auf dich"
        it: "Il tuo clan conta su di te"
        pt: "O teu clã conta contigo"
        br: "Seu clã conta com você"
        nl: "Je clan rekent op je"
      guide_k1_situation:
        fr: "Chaque monstre que tu bats, c'est une tâche faite à la maison. Tes points font monter ton personnage, et tout ton clan avec toi."
        en: "Every monster you beat is a task done at home. Your points level up your character, and your whole clan with you."
        es: "Cada monstruo que vences es una tarea hecha en casa. Tus puntos suben a tu personaje, y a todo tu clan contigo."
        de: "Jedes Monster, das du besiegst, ist eine erledigte Aufgabe zu Hause. Deine Punkte lassen deinen Charakter aufsteigen, und deinen ganzen Clan mit dir."
        it: "Ogni mostro che sconfiggi è un compito fatto a casa. I tuoi punti fanno salire il tuo personaggio, e tutto il tuo clan con te."
        pt: "Cada monstro que vences é uma tarefa feita em casa. Os teus pontos fazem subir o teu personagem, e todo o teu clã contigo."
        br: "Cada monstro que você vence é uma tarefa feita em casa. Seus pontos fazem seu personagem subir, e todo o seu clã junto com você."
        nl: "Elk monster dat je verslaat, is een klusje dat thuis gedaan is. Je punten laten je personage stijgen, en je hele clan met je mee."
      guide_k1_a:
        fr: "On avance ensemble"
        en: "We move forward together"
        es: "Avanzamos juntos"
        de: "Wir kommen gemeinsam voran"
        it: "Andiamo avanti insieme"
        pt: "Avançamos juntos"
        br: "Avançamos juntos"
        nl: "We gaan samen vooruit"
      guide_k1_a_desc:
        fr: "Tes points s'ajoutent à ceux du clan. Personne ne joue contre toi : il n'y a pas de classement."
        en: "Your points add to the clan's. Nobody plays against you: there is no ranking."
        es: "Tus puntos se suman a los del clan. Nadie juega contra ti: no hay clasificación."
        de: "Deine Punkte kommen zu denen des Clans dazu. Niemand spielt gegen dich: Es gibt keine Rangliste."
        it: "I tuoi punti si sommano a quelli del clan. Nessuno gioca contro di te: non c'è classifica."
        pt: "Os teus pontos somam-se aos do clã. Ninguém joga contra ti: não há classificação."
        br: "Seus pontos se somam aos do clã. Ninguém joga contra você: não há ranking."
        nl: "Jouw punten tellen op bij die van de clan. Niemand speelt tegen jou: er is geen ranglijst."
      guide_k1_b:
        fr: "C'est toi qui choisis"
        en: "You are the one who chooses"
        es: "Tú eliges"
        de: "Du entscheidest"
        it: "Scegli tu"
        pt: "És tu que escolhes"
        br: "Quem escolhe é você"
        nl: "Jij kiest"
      guide_k1_b_desc:
        fr: "Tu prends le monstre que tu veux, tu le bats, puis un chef de clan valide."
        en: "You take whichever monster you want, you beat it, then a clan chief validates it."
        es: "Coges el monstruo que quieras, lo vences y luego un jefe de clan lo valida."
        de: "Du nimmst dir das Monster, das du willst, besiegst es, und dann bestätigt ein Clanchef."
        it: "Prendi il mostro che vuoi, lo sconfiggi, poi un capo clan convalida."
        pt: "Escolhes o monstro que quiseres, vences-o e depois um chefe de clã valida."
        br: "Você escolhe o monstro que quiser, vence e depois um chefe de clã valida."
        nl: "Je kiest het monster dat je wilt, je verslaat het, en dan valideert een clanhoofd."
      guide_k1_c:
        fr: "Un monstre à la fois"
        en: "One monster at a time"
        es: "Un monstruo cada vez"
        de: "Ein Monster nach dem anderen"
        it: "Un mostro alla volta"
        pt: "Um monstro de cada vez"
        br: "Um monstro de cada vez"
        nl: "Eén monster tegelijk"
      guide_k1_c_desc:
        fr: "Prends ton temps. Rien ne t'oblige à jouer tous les jours."
        en: "Take your time. Nothing forces you to play every day."
        es: "Tómate tu tiempo. Nada te obliga a jugar todos los días."
        de: "Lass dir Zeit. Nichts zwingt dich, jeden Tag zu spielen."
        it: "Prenditi il tuo tempo. Niente ti obbliga a giocare tutti i giorni."
        pt: "Não tenhas pressa. Nada te obriga a jogar todos os dias."
        br: "Sem pressa. Nada obriga você a jogar todos os dias."
        nl: "Neem je tijd. Niets verplicht je om elke dag te spelen."

      # --- Enfant, écran 2 : les PV et le gage, dits comme un droit et non comme une menace.
      guide_k2_title:
        fr: "Tes points de vie baissent ?"
        en: "Your life points going down?"
        es: "¿Te bajan los puntos de vida?"
        de: "Deine Lebenspunkte sinken?"
        it: "I tuoi punti vita calano?"
        pt: "Os teus pontos de vida estão a baixar?"
        br: "Seus pontos de vida estão caindo?"
        nl: "Dalen je levenspunten?"
      guide_k2_situation:
        fr: "Tu as vu tes cœurs diminuer tout seuls ? Ce n'est pas une punition : c'est juste le temps qui passe sans monstre battu."
        en: "Have you seen your hearts go down on their own? That is not a punishment: it is just time passing with no monster beaten."
        es: "¿Has visto bajar tus corazones solos? No es un castigo: es solo el tiempo que pasa sin vencer monstruos."
        de: "Hast du gesehen, wie deine Herzen von allein weniger werden? Das ist keine Strafe: Es ist nur die Zeit, die vergeht, ohne dass ein Monster besiegt wird."
        it: "Hai visto i tuoi cuori calare da soli? Non è una punizione: è solo il tempo che passa senza mostri sconfitti."
        pt: "Viste os teus corações a diminuir sozinhos? Não é um castigo: é só o tempo a passar sem venceres monstros."
        br: "Viu seus corações diminuindo sozinhos? Não é um castigo: é só o tempo passando sem você vencer monstros."
        nl: "Zag je je hartjes vanzelf minder worden? Dat is geen straf: het is gewoon de tijd die voorbijgaat zonder dat er een monster verslagen wordt."
      guide_k2_a:
        fr: "Un cœur par jour sans tâche"
        en: "One heart per day without a task"
        es: "Un corazón por día sin tarea"
        de: "Ein Herz pro Tag ohne Aufgabe"
        it: "Un cuore al giorno senza compiti"
        pt: "Um coração por dia sem tarefa"
        br: "Um coração por dia sem tarefa"
        nl: "Eén hartje per dag zonder taak"
      guide_k2_a_desc:
        fr: "Tu commences avec dix. Ils ne descendent que si plus rien n'est terminé."
        en: "You start with ten. They only go down when nothing is being finished."
        es: "Empiezas con diez. Solo bajan si ya no terminas nada."
        de: "Du startest mit zehn. Sie sinken nur, wenn gar nichts mehr beendet wird."
        it: "Parti con dieci. Calano solo se non finisci più niente."
        pt: "Começas com dez. Só diminuem se já não terminares nada."
        br: "Você começa com dez. Eles só diminuem se você não terminar mais nada."
        nl: "Je begint met tien. Ze gaan alleen omlaag als er niets meer wordt afgemaakt."
      guide_k2_b:
        fr: "Une tâche les rend tous"
        en: "One task gives them all back"
        es: "Una tarea te los devuelve todos"
        de: "Eine Aufgabe gibt dir alle zurück"
        it: "Un compito te li ridà tutti"
        pt: "Uma tarefa devolve-tos todos"
        br: "Uma tarefa traz todos de volta"
        nl: "Eén taak geeft ze allemaal terug"
      guide_k2_b_desc:
        fr: "Bats un seul monstre et tu récupères tous tes cœurs d'un coup."
        en: "Beat a single monster and you get every heart back at once."
        es: "Vence un solo monstruo y recuperas todos tus corazones de golpe."
        de: "Besiege ein einziges Monster und du bekommst alle Herzen auf einmal zurück."
        it: "Sconfiggi un solo mostro e recuperi tutti i tuoi cuori in un colpo."
        pt: "Vence um só monstro e recuperas todos os teus corações de uma vez."
        br: "Vença um só monstro e você recupera todos os seus corações de uma vez."
        nl: "Versla één monster en je krijgt al je hartjes in één keer terug."
      guide_k2_c:
        fr: "À zéro, un gage rigolo"
        en: "At zero, a funny forfeit"
        es: "A cero, una prenda divertida"
        de: "Bei null ein lustiges Pfand"
        it: "A zero, una penitenza buffa"
        pt: "A zero, um castigo divertido"
        br: "No zero, um castigo divertido"
        nl: "Op nul een grappig pand"
      guide_k2_c_desc:
        fr: "Un défi drôle à faire devant ta famille. Tu as le droit de dire non, et personne ne vérifie."
        en: "A funny challenge to do in front of your family. You are allowed to say no, and nobody checks."
        es: "Un reto gracioso para hacer ante tu familia. Tienes derecho a decir que no, y nadie lo comprueba."
        de: "Eine lustige Mutprobe vor deiner Familie. Du darfst Nein sagen, und niemand prüft nach."
        it: "Una sfida buffa da fare davanti alla tua famiglia. Hai il diritto di dire di no, e nessuno controlla."
        pt: "Um desafio divertido para fazer diante da tua família. Tens o direito de dizer que não, e ninguém verifica."
        br: "Um desafio divertido para fazer na frente da sua família. Você tem o direito de dizer não, e ninguém verifica."
        nl: "Een grappige uitdaging om voor je familie te doen. Je mag nee zeggen, en niemand controleert het."

      # --- Enfant, écran 3 : le refus. Rien n'est retiré, rien n'est archivé contre toi.
      guide_k3_title:
        fr: "Refusé ? Tu recommences"
        en: "Refused? You start again"
        es: "¿Rechazada? Vuelves a empezar"
        de: "Abgelehnt? Du fängst neu an"
        it: "Rifiutato? Ricominci"
        pt: "Recusada? Recomeças"
        br: "Recusada? Recomece"
        nl: "Geweigerd? Je begint opnieuw"
      guide_k3_situation:
        fr: "Un chef de clan a refusé ta tâche. Ça arrive, et ça ne t'enlève rien du tout."
        en: "A clan chief refused your task. It happens, and it takes nothing away from you."
        es: "Un jefe de clan ha rechazado tu tarea. Pasa, y no te quita nada."
        de: "Ein Clanchef hat deine Aufgabe abgelehnt. Das kommt vor, und es nimmt dir überhaupt nichts weg."
        it: "Un capo clan ha rifiutato il tuo compito. Succede, e non ti toglie proprio niente."
        pt: "Um chefe de clã recusou a tua tarefa. Acontece, e não te tira absolutamente nada."
        br: "Um chefe de clã recusou sua tarefa. Acontece, e isso não tira absolutamente nada de você."
        nl: "Een clanhoofd heeft je taak geweigerd. Dat gebeurt, en het neemt je helemaal niets af."
      guide_k3_a:
        fr: "Trois réponses possibles"
        en: "Three possible answers"
        es: "Tres respuestas posibles"
        de: "Drei mögliche Antworten"
        it: "Tre risposte possibili"
        pt: "Três respostas possíveis"
        br: "Três respostas possíveis"
        nl: "Drie mogelijke antwoorden"
      guide_k3_a_desc:
        fr: "Réussi, à moitié réussi — la moitié des points —, ou à refaire. Aucune ne te retire de points."
        en: "Done, half done — half the points —, or to be done again. None of them takes points off you."
        es: "Conseguida, a medias —la mitad de los puntos— o a repetir. Ninguna te quita puntos."
        de: "Geschafft, halb geschafft (die Hälfte der Punkte) oder nochmal machen. Keine davon nimmt dir Punkte weg."
        it: "Riuscito, riuscito a metà (metà dei punti) o da rifare. Nessuna ti toglie punti."
        pt: "Conseguida, meio conseguida (metade dos pontos) ou para repetir. Nenhuma te tira pontos."
        br: "Concluída, meio concluída (metade dos pontos) ou para refazer. Nenhuma tira pontos de você."
        nl: "Gelukt, half gelukt (de helft van de punten) of opnieuw doen. Geen enkele kost je punten."
      guide_k3_b:
        fr: "La tâche te revient"
        en: "The task comes back to you"
        es: "La tarea vuelve a ti"
        de: "Die Aufgabe kommt zu dir zurück"
        it: "Il compito torna a te"
        pt: "A tarefa volta para ti"
        br: "A tarefa volta para você"
        nl: "De taak komt bij je terug"
      guide_k3_b_desc:
        fr: "Elle retourne dans ta liste : tu peux la reprendre quand tu veux."
        en: "It goes back into your list: you can pick it up again whenever you want."
        es: "Vuelve a tu lista: puedes retomarla cuando quieras."
        de: "Sie kommt zurück in deine Liste: Du kannst sie wieder nehmen, wann du willst."
        it: "Torna nella tua lista: puoi riprenderlo quando vuoi."
        pt: "Volta para a tua lista: podes retomá-la quando quiseres."
        br: "Ela volta para sua lista: você pode retomá-la quando quiser."
        nl: "Hij gaat terug naar je lijst: je kunt hem weer oppakken wanneer je wilt."
      guide_k3_c:
        fr: "Seuls tes exploits sont écrits"
        en: "Only your feats get written down"
        es: "Solo se escriben tus hazañas"
        de: "Nur deine Heldentaten werden aufgeschrieben"
        it: "Si scrivono solo le tue imprese"
        pt: "Só se escrevem as tuas façanhas"
        br: "Só suas façanhas são escritas"
        nl: "Alleen je heldendaden worden opgeschreven"
      guide_k3_c_desc:
        fr: "Le journal du clan ne raconte pas tes ratés. Personne n'en garde la liste."
        en: "The clan log does not tell of your misses. Nobody keeps a list of them."
        es: "El diario del clan no cuenta tus fallos. Nadie guarda la lista."
        de: "Das Clan-Tagebuch erzählt nichts von deinen Patzern. Niemand führt eine Liste darüber."
        it: "Il diario del clan non racconta i tuoi errori. Nessuno ne tiene la lista."
        pt: "O diário do clã não conta as tuas falhas. Ninguém guarda a lista."
        br: "O diário do clã não conta suas falhas. Ninguém guarda essa lista."
        nl: "Het dagboek van de clan vertelt niets over je missers. Niemand houdt er een lijst van bij."

      # --- Enfant, écran 4 : le partage, et l'intimité de la preuve photo.
      guide_k4_title:
        fr: "Le butin"
        en: "The loot"
        es: "El botín"
        de: "Die Beute"
        it: "Il bottino"
        pt: "O espólio"
        br: "O tesouro"
        nl: "De buit"
      guide_k4_situation:
        fr: "Quand le coffre du clan est plein, il s'ouvre pour tout le monde en même temps."
        en: "When the clan chest is full, it opens for everyone at the same time."
        es: "Cuando el cofre del clan está lleno, se abre para todos a la vez."
        de: "Wenn die Truhe des Clans voll ist, öffnet sie sich für alle gleichzeitig."
        it: "Quando lo scrigno del clan è pieno, si apre per tutti nello stesso momento."
        pt: "Quando o baú do clã está cheio, abre-se para todos ao mesmo tempo."
        br: "Quando o baú do clã está cheio, ele se abre para todos ao mesmo tempo."
        nl: "Als de kist van de clan vol is, gaat hij voor iedereen tegelijk open."
      guide_k4_a:
        fr: "Le butin se partage"
        en: "The loot is shared"
        es: "El botín se reparte"
        de: "Die Beute wird geteilt"
        it: "Il bottino si divide"
        pt: "O espólio é repartido"
        br: "O tesouro é dividido"
        nl: "De buit wordt gedeeld"
      guide_k4_a_desc:
        fr: "Tu reçois ta part même si tu as joué moins que les autres."
        en: "You get your share even if you played less than the others."
        es: "Recibes tu parte aunque hayas jugado menos que los demás."
        de: "Du bekommst deinen Anteil, auch wenn du weniger gespielt hast als die anderen."
        it: "Ricevi la tua parte anche se hai giocato meno degli altri."
        pt: "Recebes a tua parte mesmo que tenhas jogado menos do que os outros."
        br: "Você recebe sua parte mesmo que tenha jogado menos que os outros."
        nl: "Je krijgt je deel, ook als je minder gespeeld hebt dan de anderen."
      guide_k4_b:
        fr: "Ta photo reste chez toi"
        en: "Your photo stays with you"
        es: "Tu foto se queda contigo"
        de: "Dein Foto bleibt bei dir"
        it: "La tua foto resta a te"
        pt: "A tua foto fica contigo"
        br: "Sua foto fica com você"
        nl: "Je foto blijft bij jou"
      guide_k4_b_desc:
        fr: "La photo de preuve ne sort jamais de ton téléphone. Personne ne peut la regarder à distance, même pas un chef de clan."
        en: "The proof photo never leaves your phone. Nobody can look at it from afar, not even a clan chief."
        es: "La foto de prueba nunca sale de tu teléfono. Nadie puede verla a distancia, ni siquiera un jefe de clan."
        de: "Das Beweisfoto verlässt nie dein Handy. Niemand kann es aus der Ferne ansehen, nicht einmal ein Clanchef."
        it: "La foto di prova non esce mai dal tuo telefono. Nessuno può guardarla a distanza, nemmeno un capo clan."
        pt: "A foto de prova nunca sai do teu telemóvel. Ninguém a pode ver à distância, nem sequer um chefe de clã."
        br: "A foto de prova nunca sai do seu celular. Ninguém pode vê-la a distância, nem mesmo um chefe de clã."
        nl: "De bewijsfoto verlaat nooit je telefoon. Niemand kan hem op afstand bekijken, zelfs geen clanhoofd."
      guide_k4_c:
        fr: "La fête est en vrai"
        en: "The celebration is real life"
        es: "La fiesta es de verdad"
        de: "Gefeiert wird in echt"
        it: "La festa è dal vivo"
        pt: "A festa é a sério"
        br: "A festa é de verdade"
        nl: "Het feest is echt"
      guide_k4_c_desc:
        fr: "Ce que le clan gagne se vit en famille, pas dans l'application."
        en: "What the clan wins is lived with your family, not inside the app."
        es: "Lo que el clan gana se vive en familia, no dentro de la aplicación."
        de: "Was der Clan gewinnt, erlebt ihr als Familie, nicht in der App."
        it: "Quello che il clan vince si vive in famiglia, non dentro l'app."
        pt: "O que o clã ganha vive-se em família, não dentro da aplicação."
        br: "O que o clã ganha é vivido em família, não dentro do aplicativo."
        nl: "Wat de clan wint, beleef je samen met je familie, niet in de app."

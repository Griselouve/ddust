      # Les trois étapes (chefs) qui suivent le panneau des options du clan, en un seul écran de
      # tutoriel. L'ENFANT D'ABORD : c'est le cas normal d'une famille, et depuis le 2026-09-22
      # sa seule porte (il dit oui sur son téléphone, le parent scanne cet accord). Puis le QR
      # code du clan, qui ne fait plus entrer qu'un adulte. Puis « Créer un joueur », présenté
      # comme l'exception : séparé, il se ferait passer pour la voie normale.
      tuto_clan_welcome_child:
        fr: "Pour faire entrer ton enfant, c'est lui qui commence : il installe Donjons & Savons sur son téléphone, dit qu'il a envie de jouer, et son écran affiche un QR code. Choisis « Accueillir un enfant », scanne ce code, déclare que tu en es responsable, puis montre-lui le QR code du clan. S'il n'est pas à côté de toi, il peut t'envoyer sa réponse, et tu l'invites à distance."
        en: "To bring your child in, they go first: they install Donjons & Savons on their phone, say they want to play, and their screen shows a QR code. Choose « Welcome a child », scan that code, declare that you are responsible for them, then show them the clan QR code. If they are not next to you, they can send you their answer, and you invite them remotely."
        es: "Para que entre tu hijo, empieza él: instala Donjons & Savons en su teléfono, dice que tiene ganas de jugar y su pantalla muestra un código QR. Elige « Acoger a un niño », escanea ese código, declara que eres su responsable y luego enséñale el código QR del clan. Si no está a tu lado, puede enviarte su respuesta y tú lo invitas a distancia."
        de: "Damit dein Kind beitritt, fängt es selbst an: Es installiert Donjons & Savons auf seinem Handy, sagt, dass es spielen möchte, und sein Bildschirm zeigt einen QR-Code. Wähle „Ein Kind aufnehmen“, scanne diesen Code, erkläre, dass du für es verantwortlich bist, und zeig ihm dann den QR-Code des Clans. Ist es nicht bei dir, kann es dir seine Antwort schicken, und du lädst es aus der Ferne ein."
        it: "Per far entrare tuo figlio, comincia lui: installa Donjons & Savons sul suo telefono, dice che ha voglia di giocare e il suo schermo mostra un codice QR. Scegli «Accogli un bambino», scansiona quel codice, dichiara di esserne responsabile, poi mostragli il codice QR del clan. Se non è accanto a te, può inviarti la sua risposta e tu lo inviti a distanza."
        pt: "Para o teu filho entrar, é ele que começa: instala Donjons & Savons no telemóvel, diz que tem vontade de jogar e o ecrã dele mostra um código QR. Escolhe «Acolher uma criança», digitaliza esse código, declara que és responsável por ele e depois mostra-lhe o código QR do clã. Se ele não estiver ao teu lado, pode enviar-te a resposta dele e tu convida-lo à distância."
        br: "Para seu filho entrar, é ele quem começa: instala Donjons & Savons no celular, diz que está com vontade de jogar e a tela dele mostra um QR Code. Escolha \"Acolher uma criança\", escaneie esse código, declare que você é responsável por ele e depois mostre o QR Code do clã. Se ele não estiver ao seu lado, pode enviar a resposta dele para você, e você o convida a distância."
        nl: "Om je kind erbij te halen, begint het zelf: het installeert Donjons & Savons op zijn telefoon, zegt dat het zin heeft om te spelen, en zijn scherm toont een QR-code. Kies ‘Een kind verwelkomen’, scan die code, verklaar dat je verantwoordelijk bent voor het kind en laat het daarna de QR-code van de clan zien. Is het niet bij je, dan kan het je zijn antwoord sturen en nodig jij het op afstand uit."
      tuto_clan_qr:
        fr: "« QR Code du clan », lui, fait entrer un adulte : l'autre parent, un grand frère majeur. Il installe le jeu, tu lui montres le QR code, il le scanne, et il est dans le clan."
        en: "« Clan QR Code », for its part, brings in an adult: the other parent, a grown-up older brother or sister. They install the game, you show them the QR code, they scan it, and they are in the clan."
        es: "« Código QR del clan », en cambio, hace entrar a un adulto: el otro progenitor, un hermano mayor de edad. Instala el juego, le enseñas el código QR, lo escanea y ya está en el clan."
        de: "„Clan-QR-Code“ dagegen bringt einen Erwachsenen herein: den anderen Elternteil, ein volljähriges älteres Geschwister. Er installiert das Spiel, du zeigst ihm den QR-Code, er scannt ihn, und schon ist er im Clan."
        it: "«Codice QR del clan», invece, fa entrare un adulto: l'altro genitore, un fratello maggiorenne. Installa il gioco, gli mostri il codice QR, lo scansiona ed è nel clan."
        pt: "«Código QR do clã», por sua vez, faz entrar um adulto: o outro pai ou mãe, um irmão mais velho maior de idade. Instala o jogo, mostras-lhe o código QR, ele digitaliza-o e já está no clã."
        br: "\"QR Code do clã\", por sua vez, faz entrar um adulto: o outro pai ou mãe, um irmão mais velho maior de idade. Ele instala o jogo, você mostra o QR Code, ele escaneia e já está no clã."
        nl: "‘QR-code van de clan’ haalt daarentegen een volwassene binnen: de andere ouder, een meerderjarige oudere broer of zus. Die installeert het spel, jij laat de QR-code zien, hij scant hem en zit in de clan."
      tuto_clan_create_player:
        fr: "« Créer un joueur », en revanche, ne sert que si l'enfant n'a pas de téléphone, ou est trop jeune pour avoir un compte : tu crées son personnage et tu joues à sa place."
        en: "« Create a player », on the other hand, is only for a child who has no phone, or is too young to have an account: you create their character and play in their place."
        es: "« Crear un jugador », en cambio, solo sirve si el niño no tiene teléfono, o es demasiado pequeño para tener una cuenta: creas su personaje y juegas en su lugar."
        de: "„Spieler erstellen“ ist dagegen nur für ein Kind gedacht, das kein Handy hat oder zu jung für ein Konto ist: Du erstellst seinen Charakter und spielst an seiner Stelle."
        it: "«Crea un giocatore», invece, serve solo se il bambino non ha un telefono o è troppo piccolo per avere un account: crei il suo personaggio e giochi al suo posto."
        pt: "«Criar um jogador», pelo contrário, só serve se a criança não tiver telemóvel ou for demasiado nova para ter uma conta: crias o personagem dela e jogas no lugar dela."
        br: "\"Criar um jogador\", por outro lado, só serve se a criança não tiver celular ou for nova demais para ter uma conta: você cria o personagem dela e joga no lugar dela."
        nl: "‘Speler aanmaken’ is daarentegen alleen bedoeld voor een kind zonder telefoon, of dat te jong is voor een account: jij maakt zijn personage aan en speelt in zijn plaats."
      # --- Reminders de recrutement (dvtuto.yml → recruit_dashboard / recruit_clan) ---
      # En-tête qui REMPLACE « TUTORIEL » sur ces deux écrans : ce n'est pas une leçon, c'est un
      # rappel d'action. Il s'affiche en ambre et non dans le bleu réservé aux tutoriels.
      reminder_header_recruit:
        fr: "RECRUTE"
        en: "RECRUIT"
        es: "RECLUTA"
        de: "REKRUTIERE"
        it: "RECLUTA"
        pt: "RECRUTA"
        br: "RECRUTAMENTO"
        nl: "WERF AAN"
      # Après dashboard_intro, flèche sur l'onglet Clan de la taskbar.
      reminder_recruit_dashboard:
        fr: "Bravo, tu viens de créer ton clan ! Il te faut maintenant une équipe d'aventuriers. Va dans l'onglet « Clan » et recrute tes héros."
        en: "Well done, you have just founded your clan! Now you need a team of adventurers. Go to the « Clan » tab and recruit your heroes."
        es: "¡Enhorabuena, acabas de fundar tu clan! Ahora necesitas un equipo de aventureros. Ve a la pestaña « Clan » y recluta a tus héroes."
        de: "Bravo, du hast gerade deinen Clan gegründet! Jetzt brauchst du ein Team von Abenteurern. Geh zum Reiter „Clan“ und rekrutiere deine Helden."
        it: "Bravo, hai appena fondato il tuo clan! Ora ti serve una squadra di avventurieri. Vai nella scheda «Clan» e recluta i tuoi eroi."
        pt: "Parabéns, acabaste de fundar o teu clã! Agora precisas de uma equipa de aventureiros. Vai ao separador «Clã» e recruta os teus heróis."
        br: "Parabéns, você acabou de fundar seu clã! Agora você precisa de uma equipe de aventureiros. Vá até a aba \"Clã\" e recrute seus heróis."
        nl: "Goed gedaan, je hebt net je clan opgericht! Nu heb je een team avonturiers nodig. Ga naar het tabblad ‘Clan’ en werf je helden."
      # Après clan_intro, flèche sur le kebab doré de l'en-tête.
      # ⚠ DEUX PORTES DEPUIS LE 2026-09-22 : « QR Code du clan » ne fait plus entrer qu'un adulte,
      #   un enfant entre par « Accueillir un enfant » (il dit d'abord oui sur son téléphone).
      reminder_recruit_clan:
        fr: "Ton clan a besoin de héros ! Ouvre ce menu : « Accueillir un enfant » pour ton enfant, qui dit d'abord oui sur son téléphone, et « QR Code du clan » pour un adulte."
        en: "Your clan needs heroes! Open this menu: « Welcome a child » for your child, who first says yes on their phone, and « Clan QR Code » for an adult."
        es: "¡Tu clan necesita héroes! Abre este menú: « Acoger a un niño » para tu hijo, que primero dice que sí en su teléfono, y « Código QR del clan » para un adulto."
        de: "Dein Clan braucht Helden! Öffne dieses Menü: „Ein Kind aufnehmen“ für dein Kind, das zuerst auf seinem Handy Ja sagt, und „Clan-QR-Code“ für einen Erwachsenen."
        it: "Il tuo clan ha bisogno di eroi! Apri questo menu: «Accogli un bambino» per tuo figlio, che prima dice di sì sul suo telefono, e «Codice QR del clan» per un adulto."
        pt: "O teu clã precisa de heróis! Abre este menu: «Acolher uma criança» para o teu filho, que primeiro diz que sim no telemóvel dele, e «Código QR do clã» para um adulto."
        br: "Seu clã precisa de heróis! Abra este menu: \"Acolher uma criança\" para seu filho, que primeiro diz sim no celular dele, e \"QR Code do clã\" para um adulto."
        nl: "Je clan heeft helden nodig! Open dit menu: ‘Een kind verwelkomen’ voor je kind, dat eerst ja zegt op zijn telefoon, en ‘QR-code van de clan’ voor een volwassene."
      # --- Relances de PRUDENCE (dvtuto.yml → safety_child / safety_adult) ---
      # Le jeu ne classe aucune tâche par danger : il ne peut pas savoir ce qui convient à CET
      # enfant-là. Ces rappels portent ce que l'application ne peut pas garantir elle-même, et
      # reprennent délibérément le vocabulaire des CGU — l'article 6 de la CGU adulte pour le
      # parent, le § 3 « La prudence avant tout » de la CGU enfant pour l'enfant — afin que
      # l'app et les documents disent exactement la même chose.
      reminder_header_safety:
        fr: "PRUDENCE"
        en: "SAFETY"
        es: "PRUDENCIA"
        de: "VORSICHT"
        it: "PRUDENZA"
        pt: "PRUDÊNCIA"
        br: "PRUDÊNCIA"
        nl: "VOORZICHTIG"
      # Écran Combat, joueur mineur. Écho du § 3 de la CGU enfant.
      reminder_safety_child:
        fr: "Les monstres sont imaginaires, mais les tâches sont réelles. Préviens toujours tes parents avant de commencer une tâche, et demande de l'aide tout de suite si quelque chose ne va pas. Aucun point d'expérience ne vaut une blessure."
        en: "The monsters are imaginary, but the chores are real. Always tell your parents before you start a chore, and ask for help straight away if anything goes wrong. No amount of XP is worth getting hurt."
        es: "Los monstruos son imaginarios, ¡pero las tareas son reales! Avisa siempre a tus padres antes de empezar una tarea y pide ayuda enseguida si algo va mal. Ningún punto de experiencia vale una herida."
        de: "Die Monster sind ausgedacht, aber die Aufgaben sind echt! Sag immer deinen Eltern Bescheid, bevor du mit einer Aufgabe anfängst, und bitte sofort um Hilfe, wenn etwas nicht stimmt. Kein Erfahrungspunkt ist eine Verletzung wert."
        it: "I mostri sono immaginari, ma i compiti sono veri! Avvisa sempre i tuoi genitori prima di iniziare un compito e chiedi subito aiuto se qualcosa non va. Nessun punto esperienza vale una ferita."
        pt: "Os monstros são imaginários, mas as tarefas são reais! Avisa sempre os teus pais antes de começares uma tarefa e pede logo ajuda se alguma coisa correr mal. Nenhum ponto de experiência vale uma ferida."
        br: "Os monstros são imaginários, mas as tarefas são reais! Sempre avise seus pais antes de começar uma tarefa e peça ajuda na hora se alguma coisa der errado. Nenhum ponto de experiência vale um machucado."
        nl: "De monsters zijn verzonnen, maar de klusjes zijn echt! Zeg het altijd tegen je ouders voordat je aan een taak begint, en vraag meteen hulp als er iets misgaat. Geen enkel ervaringspunt is een verwonding waard."
      # Dashboard, joueur adulte (chef ou non). Message plein écran : il ne désigne rien dans
      # l'app, justement parce que la supervision ne s'y joue pas.
      reminder_safety_adult:
        fr: "Les tâches du jeu se réalisent dans le monde réel. Restez à portée de votre enfant pendant qu'il les accomplit : l'application ne surveille rien et ne peut pas savoir si une tâche lui convient à ce moment-là."
        en: "The game's chores are carried out in the real world. Stay within reach of your child while they do them: the app supervises nothing, and cannot know whether a chore suits your child at that moment."
        es: "Las tareas del juego se realizan en el mundo real. Permanezca cerca de su hijo mientras las hace: la aplicación no vigila nada y no puede saber si una tarea le conviene en ese momento."
        de: "Die Aufgaben des Spiels finden in der echten Welt statt. Bleiben Sie in der Nähe Ihres Kindes, während es sie erledigt: Die App überwacht nichts und kann nicht wissen, ob eine Aufgabe in diesem Moment zu Ihrem Kind passt."
        it: "I compiti del gioco si svolgono nel mondo reale. Resti vicino a suo figlio mentre li svolge: l'applicazione non sorveglia nulla e non può sapere se un compito gli si addice in quel momento."
        pt: "As tarefas do jogo realizam-se no mundo real. Fique perto do seu filho enquanto as faz: a aplicação não vigia nada e não pode saber se uma tarefa lhe convém nesse momento."
        br: "As tarefas do jogo acontecem no mundo real. Fique perto do seu filho enquanto ele as faz: o aplicativo não vigia nada e não pode saber se uma tarefa é adequada para ele naquele momento."
        nl: "De taken van het spel gebeuren in de echte wereld. Blijf in de buurt van uw kind terwijl het ze uitvoert: de app houdt niets in de gaten en kan niet weten of een taak op dat moment bij uw kind past."
      # Dashboard, adulte CHEF uniquement (le seul à pouvoir curer). Flèche sur l'onglet Combat.
      reminder_safety_curate:
        fr: "C'est vous qui décidez des tâches proposées à votre clan. Désactivez à tout moment, depuis le mode administration de la liste des tâches, celles qui ne conviennent pas à votre enfant."
        en: "You decide which chores your clan is offered. From the administration mode of the task list, you can disable at any time those that do not suit your child."
        es: "Usted decide qué tareas se ofrecen a su clan. Desde el modo de administración de la lista de tareas, puede desactivar en cualquier momento las que no convengan a su hijo."
        de: "Sie entscheiden, welche Aufgaben Ihrem Clan angeboten werden. Im Verwaltungsmodus der Aufgabenliste können Sie jederzeit diejenigen deaktivieren, die nicht zu Ihrem Kind passen."
        it: "È lei a decidere quali compiti vengono proposti al suo clan. Dalla modalità di amministrazione dell'elenco dei compiti, può disattivare in qualsiasi momento quelli non adatti a suo figlio."
        pt: "Cabe-lhe a si decidir que tarefas são propostas ao seu clã. No modo de administração da lista de tarefas, pode desativar a qualquer momento as que não convêm ao seu filho."
        br: "Cabe a você decidir quais tarefas são oferecidas ao seu clã. No modo de administração da lista de tarefas, você pode desativar a qualquer momento as que não são adequadas para seu filho."
        nl: "U beslist welke taken uw clan krijgt aangeboden. In de beheermodus van de takenlijst kunt u op elk moment de taken uitschakelen die niet bij uw kind passen."
      # --- Impersonation (prendre la place d'un joueur) ---
      impersonating_as:
        fr: "Vous incarnez"
        en: "You are playing as"
        es: "Estás jugando como"
        de: "Du spielst als"
        it: "Stai giocando come"
        pt: "Estás a jogar como"
        br: "Você está jogando como"
        nl: "Je speelt als"
      impersonation_tap_return:
        fr: "touchez pour revenir"
        en: "tap to return"
        es: "toca para volver"
        de: "tippe zum Zurückkehren"
        it: "tocca per tornare"
        pt: "toca para voltar"
        br: "toque para voltar"
        nl: "tik om terug te gaan"
      # --- Code temporaire de l'emprunt ---
      # Le code est choisi AU MOMENT du prêt et meurt avec lui : le texte le dit, pour qu'aucun
      # adulte ne réutilise le code de son téléphone ou une date de naissance. On ne promet
      # jamais « sécurisé » — c'est un cran contre le retour opportuniste, pas une serrure.
      imp_pin_set_title:
        fr: "Un code pour revenir"
        en: "A code to come back"
        es: "Un código para volver"
        de: "Ein Code für die Rückkehr"
        it: "Un codice per tornare"
        pt: "Um código para voltar"
        br: "Um código para voltar"
        nl: "Een code om terug te komen"
      imp_pin_set_intro:
        fr: "Choisissez un code à 4 chiffres. Il vous sera demandé pour reprendre votre compte, et il sera oublié dès que vous l'aurez repris. Inutile d'en choisir un que vous utilisez ailleurs."
        en: "Choose a 4-digit code. You will be asked for it to take your account back, and it is forgotten as soon as you do. No need to pick one you use elsewhere."
        es: "Elige un código de 4 cifras. Se te pedirá para recuperar tu cuenta, y se olvidará en cuanto lo hagas. No hace falta elegir uno que uses en otro sitio."
        de: "Wähle einen 4-stelligen Code. Er wird abgefragt, wenn du dein Konto zurückholst, und wieder vergessen, sobald du es zurückhast. Nimm besser keinen, den du anderswo benutzt."
        it: "Scegli un codice di 4 cifre. Ti verrà chiesto per riprendere il tuo account e sarà dimenticato appena lo avrai ripreso. Inutile sceglierne uno che usi altrove."
        pt: "Escolhe um código de 4 algarismos. Ser-te-á pedido para recuperares a tua conta e será esquecido assim que a recuperares. Não vale a pena escolher um que uses noutro sítio."
        br: "Escolha um código de 4 dígitos. Ele será pedido para você recuperar sua conta e será esquecido assim que você a recuperar. Não precisa escolher um que você use em outro lugar."
        nl: "Kies een code van 4 cijfers. Die wordt gevraagd om je account terug te nemen, en wordt vergeten zodra je dat gedaan hebt. Kies liever geen code die je ergens anders gebruikt."
      imp_pin_set_cancel:
        fr: "Annuler"
        en: "Cancel"
        es: "Cancelar"
        de: "Abbrechen"
        it: "Annulla"
        pt: "Cancelar"
        br: "Cancelar"
        nl: "Annuleren"
      imp_pin_ask_title:
        fr: "Reprendre mon compte"
        en: "Take my account back"
        es: "Recuperar mi cuenta"
        de: "Mein Konto zurückholen"
        it: "Riprendi il mio account"
        pt: "Recuperar a minha conta"
        br: "Recuperar minha conta"
        nl: "Mijn account terugnemen"
      imp_pin_ask_intro:
        fr: "Saisissez le code choisi en prêtant votre compte."
        en: "Enter the code you chose when you lent your account."
        es: "Introduce el código que elegiste al prestar tu cuenta."
        de: "Gib den Code ein, den du beim Verleihen deines Kontos gewählt hast."
        it: "Inserisci il codice scelto quando hai prestato il tuo account."
        pt: "Introduz o código que escolheste ao emprestar a tua conta."
        br: "Digite o código que você escolheu ao emprestar sua conta."
        nl: "Voer de code in die je koos toen je je account uitleende."
      # {n} = essais restants. Formulé comme un décompte et non comme une menace : c'est un
      # enfant qui le lit le plus souvent.
      imp_pin_ask_left:
        fr: "Ce n'est pas le bon code. Plus que {n} essai(s)."
        en: "That is not the right code. {n} attempt(s) left."
        es: "Ese no es el código correcto. Quedan {n} intento(s)."
        de: "Das ist nicht der richtige Code. Noch {n} Versuch(e)."
        it: "Non è il codice giusto. Ancora {n} tentativo/i."
        pt: "Não é o código certo. Restam {n} tentativa(s)."
        br: "Não é o código certo. Restam {n} tentativa(s)."
        nl: "Dat is niet de juiste code. Nog {n} poging(en)."
      imp_pin_ask_blocked:
        fr: "Code bloqué. Déverrouillez avec votre appareil pour reprendre votre compte."
        en: "Code blocked. Unlock with your device to take your account back."
        es: "Código bloqueado. Desbloquea con tu dispositivo para recuperar tu cuenta."
        de: "Code gesperrt. Entsperre mit deinem Gerät, um dein Konto zurückzuholen."
        it: "Codice bloccato. Sblocca con il tuo dispositivo per riprendere il tuo account."
        pt: "Código bloqueado. Desbloqueia com o teu dispositivo para recuperares a tua conta."
        br: "Código bloqueado. Desbloqueie com seu dispositivo para recuperar sua conta."
        nl: "Code geblokkeerd. Ontgrendel met je apparaat om je account terug te nemen."
      imp_pin_ask_unlock:
        fr: "Déverrouiller avec l'appareil"
        en: "Unlock with device"
        es: "Desbloquear con el dispositivo"
        de: "Mit dem Gerät entsperren"
        it: "Sblocca con il dispositivo"
        pt: "Desbloquear com o dispositivo"
        br: "Desbloquear com o dispositivo"
        nl: "Ontgrendelen met apparaat"
      # {n} = minutes restantes. Cet écran n'apparaît que sur un appareil SANS verrou : il n'y a
      # aucune sortie à proposer, l'application rend la main d'elle-même à l'échéance.
      imp_pin_ask_locked:
        fr: "Code bloqué. Votre compte vous sera rendu dans {n} minute(s)."
        en: "Code blocked. Your account will be returned to you in {n} minute(s)."
        es: "Código bloqueado. Tu cuenta te será devuelta en {n} minuto(s)."
        de: "Code gesperrt. Du bekommst dein Konto in {n} Minute(n) zurück."
        it: "Codice bloccato. Il tuo account ti sarà restituito tra {n} minuto/i."
        pt: "Código bloqueado. A tua conta ser-te-á devolvida dentro de {n} minuto(s)."
        br: "Código bloqueado. Sua conta será devolvida a você em {n} minuto(s)."
        nl: "Code geblokkeerd. Je krijgt je account over {n} minuut/minuten terug."
      imp_pin_ask_cancel:
        fr: "Continuer à jouer"
        en: "Keep playing"
        es: "Seguir jugando"
        de: "Weiterspielen"
        it: "Continua a giocare"
        pt: "Continuar a jogar"
        br: "Continuar jogando"
        nl: "Verder spelen"
      # Phrase affichée par le dialogue SYSTÈME du verrou de l'appareil (dvdevicelock).
      imp_pin_unlock_reason:
        fr: "Confirmez que vous êtes le propriétaire de cet appareil pour reprendre votre compte."
        en: "Confirm you are the owner of this device to take your account back."
        es: "Confirma que eres el propietario de este dispositivo para recuperar tu cuenta."
        de: "Bestätige, dass du der Besitzer dieses Geräts bist, um dein Konto zurückzuholen."
        it: "Conferma di essere il proprietario di questo dispositivo per riprendere il tuo account."
        pt: "Confirma que és o proprietário deste dispositivo para recuperares a tua conta."
        br: "Confirme que você é o dono deste dispositivo para recuperar sua conta."
        nl: "Bevestig dat je de eigenaar van dit apparaat bent om je account terug te nemen."
      tuto_impersonation_title:
        fr: "Retour au compte"
        en: "Back to account"
        es: "Volver a la cuenta"
        de: "Zurück zum Konto"
        it: "Ritorno all'account"
        pt: "Voltar à conta"
        br: "Voltar à conta"
        nl: "Terug naar account"
      # ⚠ « demande » et non « revient » : depuis le code temporaire, toucher le bandeau ouvre la
      # saisie du code (worker.open_imp_pin_ask) et ne rend plus le compte. Le texte disait l'inverse.
      tuto_impersonation_back:
        fr: "Vous jouez à la place d'un membre du clan. Touchez ce bandeau pour demander à revenir sur votre compte."
        en: "You are playing in place of a clan member. Tap this banner to ask to return to your own account."
        es: "Estás jugando en lugar de un miembro del clan. Toca este letrero para pedir volver a tu cuenta."
        de: "Du spielst an Stelle eines Clanmitglieds. Tippe auf dieses Banner, um die Rückkehr zu deinem Konto anzufordern."
        it: "Stai giocando al posto di un membro del clan. Tocca questo banner per chiedere di tornare al tuo account."
        pt: "Estás a jogar no lugar de um membro do clã. Toca nesta faixa para pedires para voltar à tua conta."
        br: "Você está jogando no lugar de um membro do clã. Toque nesta faixa para pedir para voltar à sua conta."
        nl: "Je speelt in de plaats van een clanlid. Tik op deze banner om te vragen terug te gaan naar je eigen account."
      tuto_impersonation_pin:
        fr: "Le jeu demandera alors le code à 4 chiffres que vous avez choisi en prêtant votre compte. Sans lui, on reste sur le personnage de l'enfant."
        en: "The game will then ask for the 4-digit code you chose when you lent your account. Without it, you stay on the child's character."
        es: "El juego pedirá entonces el código de 4 cifras que elegiste al prestar tu cuenta. Sin él, te quedas en el personaje del niño."
        de: "Das Spiel fragt dann nach dem 4-stelligen Code, den du beim Verleihen deines Kontos gewählt hast. Ohne ihn bleibst du beim Charakter des Kindes."
        it: "Il gioco chiederà allora il codice di 4 cifre che hai scelto prestando il tuo account. Senza, resti sul personaggio del bambino."
        pt: "O jogo pedirá então o código de 4 algarismos que escolheste ao emprestar a tua conta. Sem ele, ficas no personagem da criança."
        br: "O jogo vai pedir então o código de 4 dígitos que você escolheu ao emprestar sua conta. Sem ele, você fica no personagem da criança."
        nl: "Het spel vraagt dan de code van 4 cijfers die je koos toen je je account uitleende. Zonder die code blijf je in het personage van het kind."
      tuto_impersonation_unlock:
        fr: "Code oublié ? Au bout de 5 essais, déverrouillez avec votre appareil. Et si votre appareil n'a pas de verrou, le compte vous revient tout seul un peu plus tard."
        en: "Forgot the code? After 5 tries, unlock with your device. And if your device has no lock, the account comes back to you on its own a little later."
        es: "¿Olvidaste el código? Tras 5 intentos, desbloquea con tu dispositivo. Y si tu dispositivo no tiene bloqueo, la cuenta vuelve a ti sola un poco más tarde."
        de: "Code vergessen? Nach 5 Versuchen entsperrst du mit deinem Gerät. Und wenn dein Gerät keine Sperre hat, bekommst du das Konto etwas später von selbst zurück."
        it: "Codice dimenticato? Dopo 5 tentativi, sblocca con il tuo dispositivo. E se il tuo dispositivo non ha un blocco, l'account ti torna da solo poco più tardi."
        pt: "Esqueceste o código? Após 5 tentativas, desbloqueia com o teu dispositivo. E se o teu dispositivo não tiver bloqueio, a conta volta para ti sozinha um pouco mais tarde."
        br: "Esqueceu o código? Depois de 5 tentativas, desbloqueie com seu dispositivo. E se seu dispositivo não tiver bloqueio, a conta volta sozinha para você um pouco mais tarde."
        nl: "Code vergeten? Ontgrendel na 5 pogingen met je apparaat. En heeft je apparaat geen vergrendeling, dan krijg je het account iets later vanzelf terug."
      # Repli du rejeu depuis l'écran Tutoriels hors emprunt : on nomme la fonction, on n'explique
      # pas le dispositif - la liste des tutoriels est ouverte à tous, enfants compris.
      tuto_impersonation_idle:
        fr: "Cette leçon s'affiche quand un chef de clan prête son compte à un autre joueur."
        en: "This lesson appears when a clan chief lends their account to another player."
        es: "Esta lección aparece cuando un jefe de clan presta su cuenta a otro jugador."
        de: "Diese Lektion erscheint, wenn ein Clanchef sein Konto einem anderen Spieler leiht."
        it: "Questa lezione compare quando un capo clan presta il suo account a un altro giocatore."
        pt: "Esta lição aparece quando um chefe de clã empresta a sua conta a outro jogador."
        br: "Esta lição aparece quando um chefe de clã empresta sua conta a outro jogador."
        nl: "Deze les verschijnt wanneer een clanhoofd zijn account uitleent aan een andere speler."
      # --- Créer un joueur (leçon jouée au clic sur l'option, avant l'écran de saisie du nom) ---
      # Titre de l'ecran de consentement au recrutement (invite_consent_screen). Les TEXTES
      # de ce meme ecran (mention, cases, boutons) vivent dans le theme : ce sont eux qu'un
      # habillage peut vouloir reecrire, pas le titre de la barre.
      invite_consent_title:
        fr: "Inviter quelqu'un"
        en: "Invite someone"
        es: "Invitar a alguien"
        de: "Jemanden einladen"
        it: "Invitare qualcuno"
        pt: "Convidar alguém"
        br: "Convidar alguém"
        nl: "Iemand uitnodigen"
      tuto_create_player_title:
        fr: "Créer un joueur"
        en: "Create a player"
        es: "Crear un jugador"
        de: "Spieler erstellen"
        it: "Crea un giocatore"
        pt: "Criar um jogador"
        br: "Criar um jogador"
        nl: "Speler aanmaken"
      tuto_create_player_what:
        fr: "« Créer un joueur » ajoute au clan un personnage fictif : celui d'un enfant trop jeune pour avoir un compte, ou qui n'a pas de téléphone. Il n'a ni compte ni appareil à lui : il n'existe que dans ton clan."
        en: "« Create a player » adds a make-believe character to the clan: that of a child too young to have an account, or without a phone. They have no account and no device of their own: they only exist inside your clan."
        es: "« Crear un jugador » añade al clan un personaje ficticio: el de un niño demasiado pequeño para tener una cuenta, o que no tiene teléfono. No tiene cuenta ni dispositivo propio: solo existe dentro de tu clan."
        de: "„Spieler erstellen“ fügt dem Clan einen ausgedachten Charakter hinzu: den eines Kindes, das zu jung für ein Konto ist oder kein Handy hat. Er hat weder ein eigenes Konto noch ein eigenes Gerät: Er existiert nur in deinem Clan."
        it: "«Crea un giocatore» aggiunge al clan un personaggio fittizio: quello di un bambino troppo piccolo per avere un account, o che non ha un telefono. Non ha né un account né un dispositivo suo: esiste solo nel tuo clan."
        pt: "«Criar um jogador» acrescenta ao clã um personagem fictício: o de uma criança demasiado nova para ter conta, ou que não tem telemóvel. Não tem conta nem dispositivo próprio: só existe no teu clã."
        br: "\"Criar um jogador\" adiciona ao clã um personagem fictício: o de uma criança nova demais para ter conta, ou que não tem celular. Ele não tem conta nem dispositivo próprio: só existe no seu clã."
        nl: "‘Speler aanmaken’ voegt een verzonnen personage aan de clan toe: dat van een kind dat te jong is voor een account, of geen telefoon heeft. Het heeft geen eigen account of apparaat: het bestaat alleen in je clan."
      tuto_create_player_switch:
        fr: "Pour le faire jouer, tu utilises « Jouer à sa place » depuis la liste des membres : ton téléphone devient le sien. L'enfant joue dessus, ou tu joues pour lui. Un bandeau rappelle qui tu incarnes, et tu reviens à ton compte quand tu veux."
        en: "To let them play, use « Play in their place » from the member list: your phone becomes theirs. The child plays on it, or you play for them. A banner reminds you who you are playing as, and you return to your account whenever you want."
        es: "Para que juegue, usa « Jugar en su lugar » desde la lista de miembros: tu teléfono pasa a ser el suyo. El niño juega en él, o tú juegas por él. Un letrero recuerda a quién encarnas, y vuelves a tu cuenta cuando quieras."
        de: "Damit es spielen kann, nutzt du „An seiner Stelle spielen“ in der Mitgliederliste: Dein Handy wird zu seinem. Das Kind spielt darauf, oder du spielst für es. Ein Banner erinnert dich daran, wen du spielst, und du kehrst zu deinem Konto zurück, wann du willst."
        it: "Per farlo giocare, usa «Gioca al suo posto» dall'elenco dei membri: il tuo telefono diventa il suo. Il bambino ci gioca, oppure giochi tu per lui. Un banner ti ricorda chi stai interpretando, e torni al tuo account quando vuoi."
        pt: "Para a pores a jogar, usa «Jogar no seu lugar» na lista de membros: o teu telemóvel passa a ser o dela. A criança joga nele, ou jogas tu por ela. Uma faixa lembra-te quem estás a encarnar, e voltas à tua conta quando quiseres."
        br: "Para colocá-la para jogar, use \"Jogar no seu lugar\" na lista de membros: seu celular passa a ser o dela. A criança joga nele, ou você joga por ela. Uma faixa lembra quem você está encarnando, e você volta à sua conta quando quiser."
        nl: "Om het te laten spelen, gebruik je ‘In zijn plaats spelen’ in de ledenlijst: je telefoon wordt de zijne. Het kind speelt erop, of jij speelt voor hem. Een banner herinnert je eraan wie je speelt, en je gaat terug naar je account wanneer je wilt."
      tuto_create_player_icons_title:
        fr: "Les deux icônes à retenir"

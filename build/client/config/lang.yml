        fr: "Ton Clan : c'est ici que tu recrutes tes aventuriers et que tu gères les membres du clan — et que tu retrouves le journal du clan."
        en: "Your Clan: this is where you recruit your adventurers and manage clan members — and where you find the clan log."
        es: "Tu Clan: aquí reclutas a tus aventureros y gestionas los miembros del clan — y aquí encuentras el registro del clan."
      tuto_dash_combat:
        fr: "Le Combat : c'est ici que tu choisis une tâche à accomplir pour gagner de l'XP."
        en: "Combat: this is where you pick a task to complete and earn XP."

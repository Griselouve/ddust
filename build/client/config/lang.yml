      # --- Rappel de cotisation impayée (bandeau commons/store_dunning) ---
      # ICI et non dans le thème, contrairement aux autres libellés store_* : le thème est un
      # layer de bucket, mergé tardivement, et un bandeau d'alerte qui s'affiche en clef brute
      # au lancement ne vaudrait rien. Compilé dans l'app = lisible à la première frame.
      # Trois tons, un par phase du cycle de relance serveur (soft J10-20, firm J20-40,
      # last J40-50), sur le registre des notifications push de vision.md : jamais de dette,
      # jamais de reproche, et toujours la porte ouverte.
      # Les trois textes REPRENNENT ceux de la relance push (backend config.yml,
      # STORE_LIFECYCLE.texts) : c'est le même événement, dit au même moment, au même
      # destinataire. Deux formulations différentes pour un seul fait donneraient
      # l'impression de deux problèmes distincts. On y ajoute seulement l'affordance
      # que la notification n'a pas besoin d'avoir — le bandeau, lui, est cliquable.
      store_dunning_soft:
        fr: "Bourse un peu légère — l'aventure continue. Touchez ici."
        en: "Purse running light — the adventure goes on. Tap here."
        es: "Bolsa algo ligera: la aventura continúa. Toca aquí."
        de: "Geldbeutel etwas leicht: Das Abenteuer geht weiter. Tippe hier."
        it: "Borsellino un po' leggero: l'avventura continua. Tocca qui."
        pt: "Bolsa um pouco leve: a aventura continua. Toca aqui."
        br: "Bolsa um pouco leve: a aventura continua. Toque aqui."
        nl: "Buidel wat licht: het avontuur gaat door. Tik hier."
      store_dunning_firm:
        fr: "La cotisation n'est pas passée. Le donjon vous attend — touchez ici."
        en: "The dues didn't go through. The dungeon awaits — tap here."
        es: "La cuota no ha pasado. La mazmorra te espera: toca aquí."
        de: "Der Beitrag ging nicht durch. Der Kerker wartet auf dich: Tippe hier."
        it: "La quota non è passata. Il dungeon ti aspetta: tocca qui."
        pt: "A quota não foi paga. A masmorra espera-te: toca aqui."
        br: "A assinatura não foi paga. A masmorra espera por você: toque aqui."
        nl: "De bijdrage is niet gelukt. De kerker wacht op je: tik hier."
      store_dunning_last:
        fr: "Le grimoire va se refermer. Touchez ici pour continuer."
        en: "The tome is about to close. Tap here to carry on."
        es: "El grimorio va a cerrarse. Toca aquí para continuar."
        de: "Das Zauberbuch schließt sich gleich. Tippe hier, um weiterzumachen."
        it: "Il grimorio sta per chiudersi. Tocca qui per continuare."
        pt: "O grimório vai fechar-se. Toca aqui para continuar."
        br: "O grimório vai se fechar. Toque aqui para continuar."
        nl: "Het toverboek gaat bijna dicht. Tik hier om door te gaan."
      # Phase tardive (J750-780) : le dernier appel, un mois avant l'effacement des
      # deux ans. En pratique le bandeau ne se voit pas — un clan à ce stade est gelé
      # depuis longtemps, et l'écran de gel a remplacé les écrans de jeu qui le
      # portent. Le libellé existe pour que `_applyDunning` ne pose jamais une clef
      # brute, et pour le jour où l'on ouvrirait le donjon plus longtemps.
      store_dunning_farewell:
        fr: "Votre clan sera effacé dans un mois. Touchez ici pour le garder."
        en: "Your clan will be erased in a month. Tap here to keep it."
        es: "Vuestro clan se borrará en un mes. Toca aquí para conservarlo."
        de: "Euer Clan wird in einem Monat gelöscht. Tippe hier, um ihn zu behalten."
        it: "Il vostro clan sarà cancellato tra un mese. Tocca qui per tenerlo."
        pt: "O vosso clã será apagado dentro de um mês. Toca aqui para o manter."
        br: "O clã de vocês será apagado em um mês. Toque aqui para mantê-lo."
        nl: "Jullie clan wordt over een maand gewist. Tik hier om hem te houden."

      # --- Libellés de MÉCANIQUE de la boutique (embarqués, jamais du thème) -----
      # Ils vivaient tous dans le layer de thème, publié au bucket. C'était le défaut
      # de câblage qui faisait apparaître « store_locked_text » et « store_revive » en
      # clair : un layer absent, en retard ou pas encore descendu, et l'écran de clan
      # gelé — le SEUL écran qu'une famille voit quand tout le reste est fermé — ne
      # portait plus que des clefs brutes. Un écran bloquant qui ne sait plus parler
      # est un cul-de-sac muet.
      #
      # La ligne de partage est désormais : la MÉCANIQUE est ici (elle doit rendre en
      # toutes circonstances), le DÉCOR reste au thème (shopname, et les noms des
      # paliers du catalogue — c'est bien le rôle d'un thème de les nommer).
      # Même raison que les textes de relance juste au-dessus.
      # --- Page des paliers -----------------------------------------------------
      # STRUCTURE seulement (titre, périodicités, décomptes, marqueurs). Les NOMS
      # des paliers viennent du catalogue et donc du thème (store_essentiel …
      # store_royaume), et les PRIX de Play — jamais d'ici. C'est la même ligne de
      # partage que partout ailleurs dans ce bloc.

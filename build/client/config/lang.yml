      # --- Combat, leçon 1 : l'écran des domaines ---
      tuto_combat_domains_intro:
        fr: "Dans cet écran, tu trouveras toutes les tâches à combattre, regroupées par domaine."
        en: "On this screen you'll find every task to fight, grouped by domain."
        es: "En esta pantalla encontrarás todas las tareas por combatir, agrupadas por ámbito."
        de: "Auf diesem Bildschirm findest du alle Aufgaben zum Bekämpfen, nach Bereichen gruppiert."
        it: "In questa schermata troverai tutti i compiti da combattere, raggruppati per ambito."
        pt: "Neste ecrã encontras todas as tarefas para combater, agrupadas por área."
        br: "Nesta tela você encontra todas as tarefas para combater, agrupadas por área."
        nl: "Op dit scherm vind je alle taken om te bevechten, gegroepeerd per domein."
      tuto_combat_domains_play:
        fr: "Choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP."
        en: "Choose a group of tasks to find a task to fight and earn XP."
        es: "Elige un grupo de tareas para encontrar una tarea que combatir y ganar XP."
        de: "Wähle eine Aufgabengruppe, um darin eine Aufgabe zum Bekämpfen zu finden und XP zu verdienen."
        it: "Scegli un gruppo di compiti per trovarci un compito da combattere e guadagnare XP."
        pt: "Escolhe um grupo de tarefas para lá encontrares uma tarefa para combater e ganhar XP."
        br: "Escolha um grupo de tarefas para encontrar nele uma tarefa para combater e ganhar XP."
        nl: "Kies een groep taken om er een taak te vinden om te bevechten en XP te verdienen."
      tuto_combat_domains_play_admin:
        fr: "En mode jeu, choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP."
        en: "In play mode, choose a group of tasks to find a task to fight and earn XP."
        es: "En modo juego, elige un grupo de tareas para encontrar una tarea que combatir y ganar XP."
        de: "Wähle im Spielmodus eine Aufgabengruppe, um darin eine Aufgabe zum Bekämpfen zu finden und XP zu verdienen."
        it: "In modalità gioco, scegli un gruppo di compiti per trovarci un compito da combattere e guadagnare XP."
        pt: "No modo jogo, escolhe um grupo de tarefas para lá encontrares uma tarefa para combater e ganhar XP."
        br: "No modo jogo, escolha um grupo de tarefas para encontrar nele uma tarefa para combater e ganhar XP."
        nl: "Kies in speelmodus een groep taken om er een taak te vinden om te bevechten en XP te verdienen."
      tuto_combat_domains_grey:
        fr: "Un domaine grisé n'a aucune tâche à combattre pour le moment."
        en: "A greyed-out domain has no task to fight right now."
        es: "Un ámbito en gris no tiene ninguna tarea que combatir por ahora."
        de: "Ein ausgegrauter Bereich hat im Moment keine Aufgabe zum Bekämpfen."
        it: "Un ambito in grigio non ha nessun compito da combattere per il momento."
        pt: "Uma área a cinzento não tem nenhuma tarefa para combater de momento."
        br: "Uma área em cinza não tem nenhuma tarefa para combater no momento."
        nl: "Een grijs domein heeft op dit moment geen taak om te bevechten."
      tuto_combat_domains_reperes_intro:
        fr: "Les domaines peuvent porter de petits repères qui donnent des informations supplémentaires."
        en: "Domains can carry small markers that give extra information."
        es: "Los ámbitos pueden llevar pequeñas marcas que dan información adicional."
        de: "Bereiche können kleine Markierungen tragen, die zusätzliche Informationen geben."
        it: "Gli ambiti possono avere piccoli segnali che danno informazioni in più."
        pt: "As áreas podem ter pequenas marcas que dão informações adicionais."
        br: "As áreas podem ter pequenas marcas que dão informações adicionais."
        nl: "Domeinen kunnen kleine markeringen hebben die extra informatie geven."
      tuto_combat_domains_admin_intro:
        fr: "En mode admin, choisis un groupe de tâches pour l'administrer : un ensemble d'options apparaît."
        en: "In admin mode, choose a group of tasks to manage it: a set of options appears."
        es: "En modo admin, elige un grupo de tareas para gestionarlo: aparece un conjunto de opciones."
        de: "Wähle im Admin-Modus eine Aufgabengruppe, um sie zu verwalten: Es erscheint eine Reihe von Optionen."
        it: "In modalità admin, scegli un gruppo di compiti per gestirlo: compare una serie di opzioni."
        pt: "No modo admin, escolhe um grupo de tarefas para o gerires: aparece um conjunto de opções."
        br: "No modo admin, escolha um grupo de tarefas para gerenciá-lo: aparece um conjunto de opções."
        nl: "Kies in adminmodus een groep taken om hem te beheren: er verschijnt een reeks opties."
      # Switch Jeu | Admin — partagé domaines + tâches.
      tuto_combat_switch:
        fr: "Réservé aux chefs de clan : bascule entre Jeu et Admin. En mode Admin, toucher une tuile n'engage plus le combat, mais ouvre ses réglages : la rendre active, la désactiver, la cacher aux joueurs."
        en: "Clan chiefs only: switches between Play and Admin. In Admin mode, tapping a tile no longer starts the fight but opens its settings: make it active, disable it, hide it from players."
        es: "Solo para jefes de clan: alterna entre Juego y Admin. En modo Admin, tocar una casilla ya no inicia el combate, sino que abre sus ajustes: activarla, desactivarla, ocultarla a los jugadores."
        de: "Nur für Clanchefs: wechselt zwischen Spiel und Admin. Im Admin-Modus startet ein Tippen auf eine Kachel keinen Kampf mehr, sondern öffnet ihre Einstellungen: aktivieren, deaktivieren, vor den Spielern verbergen."
        it: "Riservato ai capi clan: alterna tra Gioco e Admin. In modalità Admin, toccare una casella non avvia più il combattimento, ma apre le sue impostazioni: renderla attiva, disattivarla, nasconderla ai giocatori."
        pt: "Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar num quadrado já não inicia o combate, abre as suas definições: ativá-lo, desativá-lo, escondê-lo dos jogadores."
        br: "Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar em um quadrado não inicia mais o combate, abre as configurações dele: ativar, desativar, esconder dos jogadores."
        nl: "Alleen voor clanhoofden: schakelt tussen Spel en Admin. In Admin-modus start een tik op een tegel geen gevecht meer, maar opent die de instellingen: activeren, uitschakelen, verbergen voor spelers."
      # Tuile « + » : uniquement sur les écrans de tâches, uniquement en mode admin.
      tuto_combat_tasks_admin_add:
        fr: "En mode Admin, une tuile « + » s'ajoute à la fin de la liste : elle crée une nouvelle tâche dans ce groupe. Elle n'existe pas sur l'écran des domaines — on n'y crée jamais de groupe."
        en: "In Admin mode, a « + » tile is added at the end of the list: it creates a new task in this group. It does not exist on the domains screen — groups are never created there."
        es: "En modo Admin, una casilla « + » se añade al final de la lista: crea una nueva tarea en este grupo. No existe en la pantalla de ámbitos — allí nunca se crean grupos."
        de: "Im Admin-Modus erscheint am Ende der Liste eine „+“-Kachel: Sie erstellt eine neue Aufgabe in dieser Gruppe. Auf dem Bildschirm der Bereiche gibt es sie nicht, denn dort werden nie Gruppen erstellt."
        it: "In modalità Admin, alla fine dell'elenco si aggiunge una casella «+»: crea un nuovo compito in questo gruppo. Non esiste nella schermata degli ambiti: lì non si creano mai gruppi."
        pt: "No modo Admin, surge um quadrado «+» no fim da lista: cria uma nova tarefa neste grupo. Não existe no ecrã das áreas: aí nunca se criam grupos."
        br: "No modo Admin, aparece um quadrado \"+\" no fim da lista: ele cria uma nova tarefa neste grupo. Ele não existe na tela das áreas: ali nunca se criam grupos."
        nl: "In Admin-modus komt er een ‘+’-tegel aan het eind van de lijst: die maakt een nieuwe taak in deze groep. Op het domeinenscherm bestaat hij niet: daar worden nooit groepen gemaakt."

# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  # --- Traductions du TUTORIEL --------------------------------------------------
  # Volontairement dans config.yml (PAS dans le thème) : un seul tutoriel pour TOUS les thèmes, les
  # libellés doivent survivre à un changement de thème. Fusionnées dans lang.translations.
  lang:
    translations:
      # ⚠ LES TROIS CORPS DE PROMPT ONT DÉMÉNAGÉ dans le layer cloud
      #   `resources_cloud/donjon/layers/theme-donjon-global.yml`. Ici ils étaient
      #   COMPILÉS : ajuster une contrainte de ton après un incident en production
      #   aurait demandé un build ET une release au store. Dans le layer, le garde-fou
      #   se corrige en poussant un fichier — c'est ce qui lui donne sa valeur.
      #   Ne PAS les redéclarer ici : la conf compilée est SOUS le layer (`above: conf`),
      #   une copie oubliée ne se verrait pas et servirait de repli silencieux.
      clan_menu_tutorials:
        fr: "Tutoriels"
        en: "Tutorials"
        es: "Tutoriales"
      tutoriels_title:
        fr: "Tutoriels"
        en: "Tutorials"
        es: "Tutoriales"
      tuto_dashboard_intro_title:
        fr: "Écran principal"
        en: "Main screen"
        es: "Pantalla principal"
      tuto_header:
        fr: "TUTORIEL"
        en: "TUTORIAL"
        es: "TUTORIAL"
      tuto_tap_continue:
        fr: "Touchez pour continuer"
        en: "Tap to continue"
        es: "Toca para continuar"
      tuto_dash_shop:
        fr: "La Boutique : extensions, packs et thèmes pour enrichir ton aventure (bientôt disponible)."
        en: "The Shop: expansions, packs and themes to enrich your adventure (coming soon)."
        es: "La Tienda: expansiones, packs y temas para enriquecer tu aventura (próximamente)."
      tuto_dash_clan:
        fr: "Ton Clan : retrouve tes compagnons et le journal du clan."
        en: "Your Clan: find your companions and the clan log."
        es: "Tu Clan: reúnete con tus compañeros y consulta el registro del clan."
      # Version chef. Ne dit PLUS « retrouve tes compagnons » : cette leçon se joue à la toute
      # première arrivée sur le dashboard, quand le fondateur est encore seul dans son clan — il n'a
      # aucun compagnon à retrouver. C'est là qu'il RECRUTE, et c'est ce qu'il faut lui annoncer.
      tuto_dash_clan_admin:
        fr: "Ton Clan : c'est ici que tu recrutes tes aventuriers et que tu gères les membres du clan — et que tu retrouves le journal du clan."
        en: "Your Clan: this is where you recruit your adventurers and manage clan members — and where you find the clan log."
        es: "Tu Clan: aquí reclutas a tus aventureros y gestionas los miembros del clan — y aquí encuentras el registro del clan."
      tuto_dash_combat:
        fr: "Le Combat : c'est ici que tu choisis une tâche à accomplir pour gagner de l'XP."
        en: "Combat: this is where you pick a task to complete and earn XP."
        es: "El Combate: aquí eliges una tarea para completar y ganar XP."
      tuto_dash_combat_admin:
        fr: "Le Combat : c'est ici que tu choisis une tâche à accomplir pour gagner de l'XP, que tu peux valider les tâches des autres joueurs et administrer la liste des tâches."
        en: "Combat: this is where you pick a task to complete and earn XP, validate other players' tasks and manage the task list."
        es: "El Combate: aquí eliges una tarea para completar y ganar XP, validas las tareas de otros jugadores y gestionas la lista de tareas."
      tuto_dash_perso:
        fr: "Ton Personnage : avatar, niveau, points de vie et ton journal."
        en: "Your Character: avatar, level, hit points and your log."
        es: "Tu Personaje: avatar, nivel, puntos de vida y tu registro."
      tuto_dash_inv:
        fr: "Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus."
        en: "Items: here you get your objects, your spells and all kinds of bonuses."
        es: "Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones."
      tuto_dash_inv_admin:
        fr: "Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus, ainsi qu'au contenu du butin du clan."
        en: "Items: here you get your objects, your spells and all kinds of bonuses, plus the contents of the clan's loot."
        es: "Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones, así como al contenido del botín del clan."
      tuto_items_title:
        fr: "Tes objets"
        en: "Your items"
        es: "Tus objetos"
      tuto_items_grid:
        fr: "Retrouve ici tous tes objets, sorts et bonus, rangés par onglet. Touche une tuile pour voir ce qu'elle contient."
        en: "Here you'll find all your objects, spells and bonuses, sorted by tab. Tap a tile to see what it holds."
        es: "Aquí encuentras todos tus objetos, hechizos y bonificaciones, ordenados por pestaña. Toca una casilla para ver su contenido."
      tuto_items_chest:
        fr: "Le coffre du clan est toujours en haut de ta grille, quel que soit l'onglet. Touche-le pour l'ouvrir et distribuer son contenu."
        en: "The clan's chest always sits at the top of your grid, whatever the tab. Tap it to open it and share out its contents."
        es: "El cofre del clan siempre está en la parte superior de tu cuadrícula, sea cual sea la pestaña. Tócalo para abrirlo y repartir su contenido."
      tuto_items_wallet:
        fr: "Ta bourse affiche ton or en pastille. Repère son icône de pièces parmi tes objets."
        en: "Your purse shows your gold as a badge. Look for its coin icon among your objects."
        es: "Tu bolsa muestra tu oro en una insignia. Busca su icono de monedas entre tus objetos."
      tuto_perso_title:
        fr: "Ton personnage"
        en: "Your character"
        es: "Tu personaje"
      tuto_perso_avatar:
        fr: "Voici ton personnage : son avatar et son nom."
        en: "This is your character: their avatar and name."
        es: "Este es tu personaje: su avatar y su nombre."
      tuto_perso_edit:
        fr: "Touche le crayon pour changer ton avatar et ton nom."
        en: "Tap the pencil to change your avatar and name."
        es: "Toca el lápiz para cambiar tu avatar y tu nombre."
      tuto_perso_level:
        fr: "Ta jauge de niveau : accomplis des tâches pour la remplir et monter de niveau."
        en: "Your level gauge: complete tasks to fill it and level up."
        es: "Tu barra de nivel: completa tareas para llenarla y subir de nivel."
      tuto_perso_pv:
        fr: "Tes points de vie : à zéro tu tombes, mais un compagnon peut te soigner."
        en: "Your hit points: at zero you fall, but a companion can heal you."
        es: "Tus puntos de vida: a cero caes, pero un compañero puede curarte."
      tuto_perso_menu:
        fr: "Le menu Personnage : diverses options pour gérer ton profil et ton personnage."
        en: "The Character menu: various options to manage your profile and character."
        es: "El menú Personaje: varias opciones para gestionar tu perfil y tu personaje."
      tuto_clan_title:
        fr: "Ton clan"
        en: "Your clan"
        es: "Tu clan"
      tuto_clan_identity:
        fr: "Ton clan : son avatar, son nom et son rang."
        en: "Your clan: its avatar, name and rank."
        es: "Tu clan: su avatar, su nombre y su rango."
      tuto_clan_edit:
        fr: "Touche le crayon pour modifier l'avatar et le nom du clan."
        en: "Tap the pencil to change the clan's avatar and name."
        es: "Toca el lápiz para cambiar el avatar y el nombre del clan."
      tuto_clan_level:
        fr: "Le niveau du clan : il monte quand ses membres accomplissent des tâches."
        en: "The clan level: it rises as its members complete tasks."
        es: "El nivel del clan: sube cuando sus miembros completan tareas."
      tuto_clan_butin:
        fr: "Le butin du clan : cette jauge se remplit à mesure que le clan progresse ; une fois pleine, le trésor est découvert et partagé entre tous les membres."
        en: "The clan loot: this gauge fills as the clan progresses; once full, the treasure is revealed and shared among all members."
        es: "El botín del clan: esta barra se llena a medida que el clan progresa; cuando está llena, el tesoro se revela y se reparte entre todos los miembros."
      tuto_clan_roster:
        fr: "Les membres du clan sont listés ici."
        en: "The clan members are listed here."
        es: "Los miembros del clan aparecen aquí."
      tuto_clan_roster_avatar:
        fr: "Pour chaque personnage, tu vois son niveau et ses points de vie."
        en: "For each character, you see their level and hit points."
        es: "Para cada personaje, ves su nivel y sus puntos de vida."
      tuto_clan_roster_name:
        fr: "Son nom — une couronne désigne les chefs de clan — et sa barre de progrès, qui indique la part du butin qu'il recevra."
        en: "Their name — a crown marks the clan chiefs — and their progress bar, showing the share of the loot they will receive."
        es: "Su nombre — una corona indica a los jefes del clan — y su barra de progreso, que muestra la parte del botín que recibirá."
      tuto_clan_roster_kebab:
        fr: "Touche le « … » d'un membre pour ouvrir ses actions."
        en: "Tap a member's « … » to open their actions."
        es: "Toca el « … » de un miembro para abrir sus acciones."
      tuto_clan_options_title:
        fr: "Les actions sur un membre"
        en: "Actions on a member"
        es: "Acciones sobre un miembro"
      roster_menu_log_desc:
        fr: "Consulter l'historique des actions de ce joueur."
        en: "View this player's action history."
        es: "Ver el historial de acciones de este jugador."
      roster_menu_revive_desc:
        fr: "Soigner ce joueur et le remettre en jeu."
        en: "Heal this player and bring them back."
        es: "Curar a este jugador y devolverlo al juego."
      roster_menu_support_desc:
        fr: "Lui donner un coup de pouce d'expérience."
        en: "Give them an experience boost."
        es: "Darle un impulso de experiencia."
      roster_menu_offline_desc:
        fr: "Le marquer comme absent."
        en: "Mark them as away."
        es: "Marcarlo como ausente."
      roster_menu_takeplace_desc:
        fr: "Jouer à sa place (prendre son relais)."
        en: "Play in their place (take over)."
        es: "Jugar en su lugar (tomar el relevo)."
      roster_menu_promote_chief_desc:
        fr: "Le nommer chef de clan."
        en: "Make them a clan chief."
        es: "Nombrarlo jefe del clan."
      roster_menu_nomore_chief_desc:
        fr: "Lui retirer son rôle de chef."
        en: "Remove their chief role."
        es: "Quitarle su rol de jefe."
      roster_menu_promote_adult_desc:
        fr: "Le déclarer majeur."
        en: "Declare them an adult."
        es: "Declararlo mayor de edad."
      # Hors concours. Les libellés des deux options vivent dans le layer de thème, comme tous
      # les roster_menu_* ; seules les descriptions sont ici — elles ne s'affichent pas dans le
      # menu, elles alimentent le panneau du tutoriel (leçon roster_options).
      roster_menu_hors_concours_on_desc:
        fr: "Il continue de jouer et de faire gagner le clan, mais ne concourt plus : ni part du butin, ni comparaison avec les enfants."
        en: "They keep playing and keep earning for the clan, but no longer compete: no share of the loot, and no comparison with the children."
        es: "Sigue jugando y haciendo ganar al clan, pero ya no compite: ni parte del botín, ni comparación con los niños."
      roster_menu_hors_concours_off_desc:
        fr: "Il concourt de nouveau : sa part du butin, son niveau et sa progression redeviennent visibles du clan."
        en: "They compete again: their share of the loot, their level and their progress become visible to the clan once more."
        es: "Vuelve a competir: su parte del botín, su nivel y su progreso vuelven a ser visibles para el clan."
      roster_menu_pay_tribute_desc:
        fr: "Lui remettre en vrai l'argent de sa bourse."
        en: "Hand over the money in their purse for real."
        es: "Entregarle de verdad el dinero de su bolsa."
      roster_menu_revoke_desc:
        fr: "Le retirer du clan."
        en: "Remove them from the clan."
        es: "Expulsarlo del clan."
      # ⚠ La nuance avec la ligne ci-dessus est TOUT le sujet : « A quitté le clan » retire du
      # clan et ne supprime rien ; ceci cesse de traiter les données. Les deux restent offerts.
      roster_menu_withdraw_consent_desc:
        fr: "Cesser de traiter ses données. Il quitte le jeu ; un chef peut revenir sur cette décision pendant 3 jours."
        en: "Stop processing their data. They leave the game; a chief can reverse this for 3 days."
        es: "Dejar de tratar sus datos. Sale del juego; un jefe puede revocarlo durante 3 días."
      roster_menu_restore_consent_desc:
        fr: "Annuler le retrait : il retrouve sa place et son personnage, intacts."
        en: "Cancel the withdrawal: they get back their place and their character, untouched."
        es: "Cancelar la retirada: recupera su lugar y su personaje, intactos."
      tuto_clan_menu_title:
        fr: "Les options du clan"
        en: "Clan options"
        es: "Opciones del clan"
      tuto_perso_menu_title:
        fr: "Les options du personnage"
        en: "Character options"
        es: "Opciones del personaje"
      clan_menu_log_desc:
        fr: "Voir le journal de tout le clan."
        en: "View the whole clan's log."
        es: "Ver el registro de todo el clan."
      clan_menu_qr_desc:
        fr: "Inviter un joueur par QR code."
        en: "Invite a player via QR code."
        es: "Invitar a un jugador con un código QR."
      clan_menu_tutorials_desc:
        fr: "Revoir les tutoriels du jeu."
        en: "Replay the game tutorials."
        es: "Volver a ver los tutoriales del juego."
      perso_menu_log_desc:
        fr: "Voir ton propre journal d'actions."
        en: "View your own action log."
        es: "Ver tu propio registro de acciones."
      perso_menu_logout_desc:
        fr: "Te déconnecter de ton compte."
        en: "Sign out of your account."
        es: "Cerrar la sesión de tu cuenta."
      tuto_combat_domains_title:
        fr: "Le combat"
        en: "Combat"
        es: "El combate"
      # --- Combat, leçon 1 : l'écran des domaines ---
      tuto_combat_domains_intro:
        fr: "Dans cet écran, tu trouveras toutes les tâches à combattre, regroupées par domaine."
        en: "On this screen you'll find every task to fight, grouped by domain."
        es: "En esta pantalla encontrarás todas las tareas por combatir, agrupadas por ámbito."
      tuto_combat_domains_play:
        fr: "Choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP."
        en: "Choose a group of tasks to find a task to fight and earn XP."
        es: "Elige un grupo de tareas para encontrar una tarea que combatir y ganar XP."
      tuto_combat_domains_play_admin:
        fr: "En mode jeu, choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP."
        en: "In play mode, choose a group of tasks to find a task to fight and earn XP."
        es: "En modo juego, elige un grupo de tareas para encontrar una tarea que combatir y ganar XP."
      tuto_combat_domains_grey:
        fr: "Un domaine grisé n'a aucune tâche à combattre pour le moment."
        en: "A greyed-out domain has no task to fight right now."
        es: "Un ámbito en gris no tiene ninguna tarea que combatir por ahora."
      tuto_combat_domains_reperes_intro:
        fr: "Les domaines peuvent porter de petits repères qui donnent des informations supplémentaires."
        en: "Domains can carry small markers that give extra information."
        es: "Los ámbitos pueden llevar pequeñas marcas que dan información adicional."
      tuto_combat_domains_admin_intro:
        fr: "En mode admin, choisis un groupe de tâches pour l'administrer : un ensemble d'options apparaît."
        en: "In admin mode, choose a group of tasks to manage it: a set of options appears."
        es: "En modo admin, elige un grupo de tareas para gestionarlo: aparece un conjunto de opciones."
      # Switch Jeu | Admin — partagé domaines + tâches.
      tuto_combat_switch:
        fr: "Ce bouton bascule entre le mode Jeu et le mode Admin."
        en: "This button toggles between Play mode and Admin mode."
        es: "Este botón alterna entre el modo Juego y el modo Admin."
      # Titre du panneau d'administration — partagé domaines + tâches.
      tuto_combat_admin_title:
        fr: "Administrer un domaine / une tâche"
        en: "Manage a domain / task"
        es: "Gestionar un ámbito / una tarea"
      # --- Combat, leçon 2 : l'écran des tâches d'un groupe ---
      tuto_combat_tasks_title:
        fr: "Les tâches"
        en: "Tasks"
        es: "Las tareas"
      tuto_combat_tasks_intro:
        fr: "Dans cet écran, tu trouveras toutes les tâches à combattre d'un même groupe."
        en: "On this screen you'll find every task to fight within one group."
        es: "En esta pantalla encontrarás todas las tareas por combatir de un mismo grupo."
      tuto_combat_tasks_play:
        fr: "Choisis une tâche pour la combattre et gagner de l'XP."
        en: "Choose a task to fight it and earn XP."
        es: "Elige una tarea para combatirla y ganar XP."
      tuto_combat_tasks_play_admin:
        fr: "En mode jeu, choisis une tâche pour la combattre et gagner de l'XP."
        en: "In play mode, choose a task to fight it and earn XP."
        es: "En modo juego, elige una tarea para combatirla y ganar XP."
      tuto_combat_tasks_grey:
        fr: "Une tâche grisée n'est pas disponible pour l'instant : elle est déjà prise, en repos, ou réservée aux chefs."
        en: "A greyed-out task isn't available right now: it's already taken, resting, or reserved for chiefs."
        es: "Una tarea en gris no está disponible por ahora: ya está tomada, en reposo, o reservada a los jefes."
      tuto_combat_tasks_reperes_intro:
        fr: "Les tâches peuvent porter de petits repères qui donnent des informations supplémentaires."
        en: "Tasks can carry small markers that give extra information."
        es: "Las tareas pueden llevar pequeñas marcas que dan información adicional."
      tuto_combat_tasks_admin_intro:
        fr: "En mode admin, choisis une tâche pour l'administrer : un ensemble d'options apparaît."
        en: "In admin mode, choose a task to manage it: a set of options appears."
        es: "En modo admin, elige una tarea para gestionarla: aparece un conjunto de opciones."
      # --- Combat : légende des repères — partagée domaines + tâches ---
      tuto_combat_badges_title:
        fr: "Les repères"
        en: "Markers"
        es: "Las marcas"
      tuto_badge_flamme:
        fr: "Flamme — en cours"
        en: "Flame — in progress"
        es: "Llama — en curso"
      tuto_badge_flamme_desc:
        fr: "Un compagnon s'en occupe déjà."
        en: "A companion is already handling it."
        es: "Un compañero ya se está encargando."
      tuto_badge_hand:
        fr: "Exclamation — à valider"
        en: "Exclamation mark — to validate"
        es: "Exclamación — por validar"
      tuto_badge_hand_desc:
        fr: "La tâche est terminée et attend qu'un chef la valide."
        en: "The task is done and waiting for a chief to validate it."
        es: "La tarea está terminada y espera que un jefe la valide."
      tuto_badge_xp:
        fr: "XP — recommandée"
        en: "XP — recommended"
        es: "XP — recomendada"
      tuto_badge_xp_desc:
        fr: "Un chef la met en avant : elle rapporte un bonus d'XP."
        en: "A chief is highlighting it: it grants bonus XP."
        es: "Un jefe la destaca: otorga XP extra."
      tuto_badge_skull:
        fr: "Crâne — au repos"
        en: "Skull — resting"
        es: "Calavera — en reposo"
      tuto_badge_skull_desc:
        fr: "La tâche vient d'être faite : elle réapparaîtra après un délai."
        en: "The task was just done: it will come back after a while."
        es: "La tarea acaba de hacerse: reaparecerá tras un tiempo."
      tuto_badge_cure:
        fr: "Pansement — en régénération"
        en: "Bandage — regenerating"
        es: "Vendaje — regenerando"
      tuto_badge_cure_desc:
        fr: "La tâche se recharge et sera bientôt de nouveau disponible."
        en: "The task is recharging and will soon be available again."
        es: "La tarea se está recargando y pronto volverá a estar disponible."
      # --- Combat, leçon 3 : une tâche en cours (déroulé + validation par le chef) ---
      tuto_combat_active_title:
        fr: "La tâche en cours"
        en: "The active task"
        es: "La tarea en curso"
      tuto_combat_active_intro:
        fr: "Tu as pris une tâche : la voici, c'est ton combat du moment."
        en: "You've taken on a task: here it is, your current fight."
        es: "Has asumido una tarea: aquí está, tu combate del momento."
      tuto_combat_active_difficulty:
        fr: "Cette pastille indique la difficulté de la tâche et l'XP qu'elle te rapportera."
        en: "This badge shows the task's difficulty and the XP it will earn you."
        es: "Esta insignia indica la dificultad de la tarea y la XP que te dará."
      tuto_combat_active_criteria:
        fr: "Voici les critères à remplir pour vaincre le monstre."
        en: "These are the criteria to meet to defeat the monster."
        es: "Estos son los criterios que debes cumplir para vencer al monstruo."
      tuto_combat_active_done:
        fr: "Une fois la tâche accomplie pour de vrai, touche « J'ai vaincu le monstre ! ». Une photo sera prise comme preuve."
        en: "Once you've truly completed the task, tap “I defeated the monster!”. A photo will be taken as proof."
        es: "Una vez completada la tarea de verdad, toca «¡He vencido al monstruo!». Se tomará una foto como prueba."
      tuto_combat_active_validate:
        fr: "Ensuite, va voir le chef de clan pour qu'il valide ta tâche. Tu peux lui montrer ta preuve. (Si tu es le seul chef de clan, tes tâches se valident toutes seules.)"
        en: "Then go to the clan chief so they validate your task. You can show them your proof. (If you're the clan's only chief, your tasks validate themselves.)"
        es: "Luego ve al jefe del clan para que valide tu tarea. Puedes mostrarle tu prueba. (Si eres el único jefe del clan, tus tareas se validan solas.)"
      tuto_combat_active_wait:
        fr: "Tant que ta tâche n'est pas validée, tu ne peux pas en combattre une autre. Une fois validée, tu gagnes ton XP et tu repars au combat !"
        en: "Until your task is validated, you can't fight another one. Once validated, you earn your XP and head back to battle!"
        es: "Mientras tu tarea no esté validada, no puedes combatir otra. Una vez validada, ganas tu XP y ¡vuelves al combate!"
      tuto_combat_active_retreat:
        fr: "Si tu ne peux pas la terminer, bats en retraite : la tâche redevient libre pour le clan."
        en: "If you can't finish it, retreat: the task becomes free for the clan again."
        es: "Si no puedes terminarla, retírate: la tarea vuelve a quedar libre para el clan."
      adm_menu_enable_desc:
        fr: "Rendre la tâche active (disponible)."
        en: "Make the task active (available)."
        es: "Activar la tarea (disponible)."
      adm_menu_disable_desc:
        fr: "Désactiver la tâche (indisponible)."
        en: "Disable the task (unavailable)."
        es: "Desactivar la tarea (no disponible)."
      adm_menu_hide_desc:
        fr: "Cacher la tâche."
        en: "Hide the task."
        es: "Ocultar la tarea."
      adm_menu_show_desc:
        fr: "Rendre la tâche visible."
        en: "Make the task visible."
        es: "Hacer visible la tarea."
      adm_menu_edit_desc:
        fr: "Modifier la tâche (nom, effort, délai…)."
        en: "Edit the task (name, effort, deadline…)."
        es: "Editar la tarea (nombre, esfuerzo, plazo…)."
      adm_menu_tasks_desc:
        fr: "Ouvrir la liste des tâches de ce domaine."
        en: "Open this domain's task list."
        es: "Abrir la lista de tareas de este ámbito."
      adm_menu_revive_desc:
        fr: "Ressusciter une tâche morte."
        en: "Revive a dead task."
        es: "Resucitar una tarea muerta."
      adm_menu_recommend_desc:
        fr: "Recommander cette tâche (bonus d'XP pour le clan)."
        en: "Recommend this task (XP bonus for the clan)."
        es: "Recomendar esta tarea (bono de XP para el clan)."
      adm_menu_unrecommend_desc:
        fr: "Retirer la recommandation : plus de bonus d'XP sur cette tâche."
        en: "Remove the recommendation: no more XP bonus on this task."
        es: "Retirar la recomendación: se acabó el bono de XP en esta tarea."
      adm_menu_release_desc:
        fr: "Libérer la tâche : elle redevient disponible pour tout le clan."
        en: "Release the task: it becomes available to the whole clan again."
        es: "Liberar la tarea: vuelve a estar disponible para todo el clan."
      tuto_clan_menu:
        fr: "Le menu Clan : diverses options pour gérer le clan."
        en: "The Clan menu: various options to manage the clan."
        es: "El menú del clan: varias opciones para gestionar el clan."
      # Les deux étapes (chefs) qui suivent le panneau des options du clan. Elles se lisent comme une
      # PAIRE : le QR code d'abord — c'est le cas normal, l'enfant a un téléphone — puis « Créer un
      # joueur » présenté comme l'exception. Séparées, la seconde se fait passer pour la voie normale.
      tuto_clan_qr:
        fr: "Parmi ces options, « QR Code du clan » est celle qui fait entrer quelqu'un : ton enfant installe Donjons & Savons sur son téléphone, tu lui montres le QR code, il le scanne — et il est dans le clan. C'est la façon normale de recruter."
        en: "Among these options, « Clan QR Code » is the one that brings someone in: your child installs Donjons & Savons on their phone, you show them the QR code, they scan it — and they are in the clan. That is the normal way to recruit."
        es: "Entre estas opciones, « Código QR del clan » es la que hace entrar a alguien: tu hijo instala Donjons & Savons en su teléfono, le enseñas el código QR, lo escanea — y ya está en el clan. Es la forma normal de reclutar."
      tuto_clan_create_player:
        fr: "« Créer un joueur », en revanche, ne sert que si l'enfant n'a pas de téléphone, ou est trop jeune pour avoir un compte : tu crées son personnage et tu joues à sa place."
        en: "« Create a player », on the other hand, is only for a child who has no phone, or is too young to have an account: you create their character and play in their place."
        es: "« Crear un jugador », en cambio, solo sirve si el niño no tiene teléfono, o es demasiado pequeño para tener una cuenta: creas su personaje y juegas en su lugar."
      # --- Reminders de recrutement (dvtuto.yml → recruit_dashboard / recruit_clan) ---
      # En-tête qui REMPLACE « TUTORIEL » sur ces deux écrans : ce n'est pas une leçon, c'est un
      # rappel d'action. Il s'affiche en ambre et non dans le bleu réservé aux tutoriels.
      reminder_header_recruit:
        fr: "RECRUTE"
        en: "RECRUIT"
        es: "RECLUTA"
      # Après dashboard_intro, flèche sur l'onglet Clan de la taskbar.
      reminder_recruit_dashboard:
        fr: "Bravo, tu viens de créer ton clan ! Il te faut maintenant une équipe d'aventuriers. Va dans l'onglet « Clan » et recrute tes héros."
        en: "Well done, you have just founded your clan! Now you need a team of adventurers. Go to the « Clan » tab and recruit your heroes."
        es: "¡Enhorabuena, acabas de fundar tu clan! Ahora necesitas un equipo de aventureros. Ve a la pestaña « Clan » y recluta a tus héroes."
      # Après clan_intro, flèche sur le kebab doré de l'en-tête.
      reminder_recruit_clan:
        fr: "Ton clan a besoin de héros ! Ouvre ce menu, puis « QR Code du clan » : ta famille installe le jeu sur son téléphone et scanne le code pour te rejoindre."
        en: "Your clan needs heroes! Open this menu, then « Clan QR Code »: your family installs the game on their phone and scans the code to join you."
        es: "¡Tu clan necesita héroes! Abre este menú y luego « Código QR del clan »: tu familia instala el juego en su teléfono y escanea el código para unirse."
      # --- Relances de PRUDENCE (dvtuto.yml → safety_child / safety_adult) ---
      # Le jeu ne classe aucune tâche par danger : il ne peut pas savoir ce qui convient à CET
      # enfant-là. Ces rappels portent ce que l'application ne peut pas garantir elle-même, et
      # reprennent délibérément le vocabulaire des CGU — l'article 6 de la CGU adulte pour le
      # parent, le § 3 « La prudence avant tout » de la CGU enfant pour l'enfant — afin que
      # l'app et les documents disent exactement la même chose.
      reminder_header_safety:
        fr: "PRUDENCE"
        en: "SAFETY"
        es: "PRUDENCIA"
      # Écran Combat, joueur mineur. Écho du § 3 de la CGU enfant.
      reminder_safety_child:
        fr: "Les monstres sont imaginaires, mais les tâches sont réelles. Préviens toujours tes parents avant de commencer une tâche, et demande de l'aide tout de suite si quelque chose ne va pas. Aucun point d'expérience ne vaut une blessure."
        en: "The monsters are imaginary, but the chores are real. Always tell your parents before you start a chore, and ask for help straight away if anything goes wrong. No amount of XP is worth getting hurt."
        es: "Los monstruos son imaginarios, ¡pero las tareas son reales! Avisa siempre a tus padres antes de empezar una tarea y pide ayuda enseguida si algo va mal. Ningún punto de experiencia vale una herida."
      # Dashboard, joueur adulte (chef ou non). Message plein écran : il ne désigne rien dans
      # l'app, justement parce que la supervision ne s'y joue pas.
      reminder_safety_adult:
        fr: "Les tâches du jeu se réalisent dans le monde réel. Restez à portée de votre enfant pendant qu'il les accomplit : l'application ne surveille rien et ne peut pas savoir si une tâche lui convient à ce moment-là."
        en: "The game's chores are carried out in the real world. Stay within reach of your child while they do them: the app supervises nothing, and cannot know whether a chore suits your child at that moment."
        es: "Las tareas del juego se realizan en el mundo real. Permanezca cerca de su hijo mientras las hace: la aplicación no vigila nada y no puede saber si una tarea le conviene en ese momento."
      # Dashboard, adulte CHEF uniquement (le seul à pouvoir curer). Flèche sur l'onglet Combat.
      reminder_safety_curate:
        fr: "C'est vous qui décidez des tâches proposées à votre clan. Désactivez à tout moment, depuis le mode administration de la liste des tâches, celles qui ne conviennent pas à votre enfant."
        en: "You decide which chores your clan is offered. From the administration mode of the task list, you can disable at any time those that do not suit your child."
        es: "Usted decide qué tareas se ofrecen a su clan. Desde el modo de administración de la lista de tareas, puede desactivar en cualquier momento las que no convengan a su hijo."
      # --- Impersonation (prendre la place d'un joueur) ---
      impersonating_as:
        fr: "Vous incarnez"
        en: "You are playing as"
        es: "Estás jugando como"
      impersonation_tap_return:
        fr: "touchez pour revenir"
        en: "tap to return"
        es: "toca para volver"
      # --- Code temporaire de l'emprunt ---
      # Le code est choisi AU MOMENT du prêt et meurt avec lui : le texte le dit, pour qu'aucun
      # adulte ne réutilise le code de son téléphone ou une date de naissance. On ne promet
      # jamais « sécurisé » — c'est un cran contre le retour opportuniste, pas une serrure.
      imp_pin_set_title:
        fr: "Un code pour revenir"
        en: "A code to come back"
        es: "Un código para volver"
      imp_pin_set_intro:
        fr: "Choisissez un code à 4 chiffres. Il vous sera demandé pour reprendre votre compte, et il sera oublié dès que vous l'aurez repris. Inutile d'en choisir un que vous utilisez ailleurs."
        en: "Choose a 4-digit code. You will be asked for it to take your account back, and it is forgotten as soon as you do. No need to pick one you use elsewhere."
        es: "Elige un código de 4 cifras. Se te pedirá para recuperar tu cuenta, y se olvidará en cuanto lo hagas. No hace falta elegir uno que uses en otro sitio."
      imp_pin_set_cancel:
        fr: "Annuler"
        en: "Cancel"
        es: "Cancelar"
      imp_pin_ask_title:
        fr: "Reprendre mon compte"
        en: "Take my account back"
        es: "Recuperar mi cuenta"
      imp_pin_ask_intro:
        fr: "Saisissez le code choisi en prêtant votre compte."
        en: "Enter the code you chose when you lent your account."
        es: "Introduce el código que elegiste al prestar tu cuenta."
      # {n} = essais restants. Formulé comme un décompte et non comme une menace : c'est un
      # enfant qui le lit le plus souvent.
      imp_pin_ask_left:
        fr: "Ce n'est pas le bon code. Plus que {n} essai(s)."
        en: "That is not the right code. {n} attempt(s) left."
        es: "Ese no es el código correcto. Quedan {n} intento(s)."
      imp_pin_ask_blocked:
        fr: "Code bloqué. Déverrouillez avec votre appareil pour reprendre votre compte."
        en: "Code blocked. Unlock with your device to take your account back."
        es: "Código bloqueado. Desbloquea con tu dispositivo para recuperar tu cuenta."
      imp_pin_ask_unlock:
        fr: "Déverrouiller avec l'appareil"
        en: "Unlock with device"
        es: "Desbloquear con el dispositivo"
      # {n} = minutes restantes. Cet écran n'apparaît que sur un appareil SANS verrou : il n'y a
      # aucune sortie à proposer, l'application rend la main d'elle-même à l'échéance.
      imp_pin_ask_locked:
        fr: "Code bloqué. Votre compte vous sera rendu dans {n} minute(s)."
        en: "Code blocked. Your account will be returned to you in {n} minute(s)."
        es: "Código bloqueado. Tu cuenta te será devuelta en {n} minuto(s)."
      imp_pin_ask_cancel:
        fr: "Continuer à jouer"
        en: "Keep playing"
        es: "Seguir jugando"
      # Phrase affichée par le dialogue SYSTÈME du verrou de l'appareil (dvdevicelock).
      imp_pin_unlock_reason:
        fr: "Confirmez que vous êtes le propriétaire de cet appareil pour reprendre votre compte."
        en: "Confirm you are the owner of this device to take your account back."
        es: "Confirma que eres el propietario de este dispositivo para recuperar tu cuenta."
      tuto_impersonation_title:
        fr: "Retour au compte"
        en: "Back to account"
        es: "Volver a la cuenta"
      tuto_impersonation_back:
        fr: "Vous jouez à la place d'un membre du clan. Touchez ce bouton à tout moment pour revenir à votre propre compte."
        en: "You are playing in place of a clan member. Tap this button at any time to return to your own account."
        es: "Estás jugando en lugar de un miembro del clan. Toca este botón en cualquier momento para volver a tu propia cuenta."
      # --- Créer un joueur (leçon jouée au clic sur l'option, avant l'écran de saisie du nom) ---
      tuto_create_player_title:
        fr: "Créer un joueur"
        en: "Create a player"
        es: "Crear un jugador"
      tuto_create_player_what:
        fr: "« Créer un joueur » ajoute au clan un personnage fictif : celui d'un enfant trop jeune pour avoir un compte, ou qui n'a pas de téléphone. Il n'a ni compte ni appareil à lui : il n'existe que dans ton clan."
        en: "« Create a player » adds a make-believe character to the clan: that of a child too young to have an account, or without a phone. They have no account and no device of their own: they only exist inside your clan."
        es: "« Crear un jugador » añade al clan un personaje ficticio: el de un niño demasiado pequeño para tener una cuenta, o que no tiene teléfono. No tiene cuenta ni dispositivo propio: solo existe dentro de tu clan."
      tuto_create_player_switch:
        fr: "Pour le faire jouer, tu utilises « Jouer à sa place » depuis la liste des membres : ton téléphone devient le sien. L'enfant joue dessus, ou tu joues pour lui. Un bandeau rappelle qui tu incarnes, et tu reviens à ton compte quand tu veux."
        en: "To let them play, use « Play in their place » from the member list: your phone becomes theirs. The child plays on it, or you play for them. A banner reminds you who you are playing as, and you return to your account whenever you want."
        es: "Para que juegue, usa « Jugar en su lugar » desde la lista de miembros: tu teléfono pasa a ser el suyo. El niño juega en él, o tú juegas por él. Un letrero recuerda a quién encarnas, y vuelves a tu cuenta cuando quieras."
      tuto_create_player_icons_title:
        fr: "Les deux icônes à retenir"
        en: "The two icons to remember"
        es: "Los dos iconos que hay que recordar"
      tuto_create_player_row_create:
        fr: "Créer un joueur"
        en: "Create a player"
        es: "Crear un jugador"
      tuto_create_player_row_create_desc:
        fr: "Dans le menu du clan : crée le personnage de l'enfant (tu choisis son nom)."
        en: "In the clan menu: creates the child's character (you choose their name)."
        es: "En el menú del clan: crea el personaje del niño (tú eliges su nombre)."
      tuto_create_player_row_switch:
        fr: "Jouer à sa place"
        en: "Play in their place"
        es: "Jugar en su lugar"
      tuto_create_player_row_switch_desc:
        fr: "Dans le menu d'un membre : tu incarnes son personnage sur ton téléphone."
        en: "In a member's menu: you take on their character on your phone."
        es: "En el menú de un miembro: encarnas su personaje en tu teléfono."
      # --- Rappel de cotisation impayée (bandeau commons/store_dunning) ---
      # ICI et non dans le thème, contrairement aux autres libellés store_* : le thème est un
      # layer de bucket, mergé tardivement, et un bandeau d'alerte qui s'affiche en clef brute
      # au lancement ne vaudrait rien. Compilé dans l'app = lisible à la première frame.
      # Trois tons, un par phase du cycle de relance serveur (soft J10-20, firm J20-40,
      # last J40-50), sur le registre des notifications push de vision.md : jamais de dette,
      # jamais de reproche, et toujours la porte ouverte.
      # Les trois textes REPRENNENT ceux de la relance push (backend config.yml,
      # STORE_LIFECYCLE.texts) : c'est le même événement, dit au même moment, au même
      # destinataire. Deux formulations différentes pour un seul fait donneraient
      # l'impression de deux problèmes distincts. On y ajoute seulement l'affordance
      # que la notification n'a pas besoin d'avoir — le bandeau, lui, est cliquable.
      store_dunning_soft:
        fr: "Bourse un peu légère — l'aventure continue. Touchez ici."
        en: "Purse running light — the adventure goes on. Tap here."
        es: "Bolsa algo ligera: la aventura continúa. Toca aquí."
      store_dunning_firm:
        fr: "La cotisation n'est pas passée. Le donjon vous attend — touchez ici."
        en: "The dues didn't go through. The dungeon awaits — tap here."
        es: "La cuota no ha pasado. La mazmorra te espera: toca aquí."
      store_dunning_last:
        fr: "Le grimoire va se refermer. Touchez ici pour continuer."
        en: "The tome is about to close. Tap here to carry on."
        es: "El grimorio va a cerrarse. Toca aquí para continuar."
      # Phase tardive (J700-730) : le dernier appel, un mois avant l'effacement des
      # deux ans. En pratique le bandeau ne se voit pas — un clan à ce stade est gelé
      # depuis longtemps, et l'écran de gel a remplacé les écrans de jeu qui le
      # portent. Le libellé existe pour que `_applyDunning` ne pose jamais une clef
      # brute, et pour le jour où l'on ouvrirait le donjon plus longtemps.
      store_dunning_farewell:
        fr: "Votre clan sera effacé dans un mois. Touchez ici pour le garder."
        en: "Your clan will be erased in a month. Tap here to keep it."
        es: "Vuestro clan se borrará en un mes. Toca aquí para conservarlo."

      # --- Banc d'essai (kebab de la boutique → « Changer de scénario ») ---------
      # ICI et non dans le thème, pour la même raison que les bandeaux : c'est un
      # outil de DIAGNOSTIC. Il doit rester lisible précisément quand le layer du
      # bucket manque ou est en retard — sinon on choisit entre des clefs brutes au
      # moment même où l'on cherche à comprendre ce qui cloche.
      # Le CATALOGUE de scénarios, lui, reste au layer cloud (store-base-global.yml) :
      # c'est sa structure qui doit changer sans release, pas ses mots.
      scenario_menu:
        fr: "Changer de scénario"
        en: "Switch test scenario"
        es: "Cambiar de escenario"
      scenario_menu_desc:
        fr: "Simuler un état d'abonnement sans rebuilder"
        en: "Simulate a subscription state without rebuilding"
        es: "Simular un estado de suscripción sin recompilar"
      scenario_title:
        fr: "Banc d'essai"
        en: "Test bench"
        es: "Banco de pruebas"
      scenario_empty:
        fr: "Aucun scénario publié. Vérifier le layer store-base-global.yml au bucket."
        en: "No scenario published. Check the store-base-global.yml layer in the bucket."
        es: "Ningún escenario publicado. Comprueba la capa store-base-global.yml en el bucket."
      scenario_no_clan:
        fr: "Aucun clan : le banc écrit la cotisation d'un clan, il en faut un."
        en: "No clan: the bench writes a clan's dues, so there must be one."
        es: "Sin clan: el banco escribe la cuota de un clan, hace falta uno."

      scenario_reel:
        fr: "Réel (Google Play)"
        en: "Real (Google Play)"
        es: "Real (Google Play)"
      scenario_reel_desc:
        fr: "Aucune simulation : vrais prix, vrais achats, entitlement du serveur."
        en: "No simulation: real prices, real purchases, server entitlement."
        es: "Sin simulación: precios reales, compras reales, permisos del servidor."
      scenario_none:
        fr: "Jamais abonné"
        en: "Never subscribed"
        es: "Nunca suscrito"
      scenario_none_desc:
        fr: "Le clan n'a jamais souscrit."
        en: "The clan has never subscribed."
        es: "El clan nunca se ha suscrito."
      scenario_trial:
        fr: "Essai en cours"
        en: "Trial in progress"
        es: "Prueba en curso"
      scenario_trial_desc:
        fr: "Échéance à +14 jours, palier Clan."
        en: "Renewal in 14 days, Clan tier."
        es: "Vencimiento a +14 días, nivel Clan."
      scenario_essentiel:
        fr: "Abonné — Essentiel"
        en: "Subscribed — Essential"
        es: "Suscrito — Esencial"
      scenario_essentiel_desc:
        fr: "2 joueurs. Le palier le plus étroit : on bute dès le troisième membre."
        en: "2 players. The narrowest tier: you hit the wall at the third member."
        es: "2 jugadores. El nivel más estrecho: se topa al tercer miembro."
      scenario_clan:
        fr: "Abonné — Clan"
        en: "Subscribed — Clan"
        es: "Suscrito — Clan"
      scenario_clan_desc:
        fr: "5 joueurs. Le palier que souscrit la plupart des familles."
        en: "5 players. The tier most families subscribe to."
        es: "5 jugadores. El nivel que suscribe la mayoría de las familias."
      scenario_royaume:
        fr: "Abonné — Royaume"
        en: "Subscribed — Kingdom"
        es: "Suscrito — Reino"
      scenario_royaume_desc:
        fr: "Aucun plafond de joueurs."
        en: "No player cap."
        es: "Sin límite de jugadores."
      scenario_founder:
        fr: "Fondateur, mois offerts"
        en: "Founder, free months"
        es: "Fundador, meses gratis"
      scenario_founder_desc:
        fr: "Marque fondateur et 2 mois en réserve."
        en: "Founder badge and 2 months in reserve."
        es: "Distintivo de fundador y 2 meses en reserva."
      scenario_canceled:
        fr: "Résilié"
        en: "Cancelled"
        es: "Cancelado"
      scenario_canceled_desc:
        fr: "Reconduction coupée, ouvert jusqu'à l'échéance (+12 jours)."
        en: "Renewal stopped, open until the renewal date (+12 days)."
        es: "Renovación cortada, abierto hasta el vencimiento (+12 días)."
      scenario_grace:
        fr: "Impayé — rappel doux"
        en: "Unpaid — gentle reminder"
        es: "Impago — recordatorio suave"
      scenario_grace_desc:
        fr: "Bandeau de rappel aux chefs, rien ne se ferme."
        en: "Reminder banner for chiefs, nothing closes."
        es: "Banner de recordatorio para los jefes, nada se cierra."
      scenario_hold:
        fr: "Impayé — dernier rappel"
        en: "Unpaid — final reminder"
        es: "Impago — último recordatorio"
      scenario_hold_desc:
        fr: "Phase last du cycle de relance. Le jeu reste ouvert."
        en: "Last phase of the dunning cycle. The game stays open."
        es: "Última fase del ciclo de cobro. El juego sigue abierto."
      scenario_locked:
        fr: "Clan gelé"
        en: "Clan frozen"
        es: "Clan congelado"
      scenario_locked_desc:
        fr: "Donjon fermé. Seul état qui bloque le jeu."
        en: "Dungeon closed. The only state that blocks the game."
        es: "Mazmorra cerrada. El único estado que bloquea el juego."
      # État TERMINAL d'un abonnement à reconduction automatique — pas une offre à
      # durée déterminée, il n'y en a pas au catalogue et il n'en faut pas pour y
      # arriver. Play rend SUBSCRIPTION_STATE_EXPIRED dans trois cas : résiliation
      # dont l'échéance est passée, achat remboursé ou annulé, réserve de mois
      # offerts épuisée. Les trois se produisent en production.
      scenario_expired:
        fr: "Droit éteint (remboursement, fin de résiliation)"
        en: "Entitlement ended (refund, end of cancellation)"
        es: "Derecho extinguido (reembolso, fin de cancelación)"
      scenario_expired_desc:
        fr: "Il y a eu une cotisation ; elle ne court plus et ne se reconduira pas."
        en: "There were dues; they no longer run and will not renew."
        es: "Hubo una cuota; ya no corre y no se renovará."

      # --- Libellés de MÉCANIQUE de la boutique (embarqués, jamais du thème) -----
      # Ils vivaient tous dans le layer de thème, publié au bucket. C'était le défaut
      # de câblage qui faisait apparaître « store_locked_text » et « store_revive » en
      # clair : un layer absent, en retard ou pas encore descendu, et l'écran de clan
      # gelé — le SEUL écran qu'une famille voit quand tout le reste est fermé — ne
      # portait plus que des clefs brutes. Un écran bloquant qui ne sait plus parler
      # est un cul-de-sac muet.
      #
      # La ligne de partage est désormais : la MÉCANIQUE est ici (elle doit rendre en
      # toutes circonstances), le DÉCOR reste au thème (shopname, et les noms des
      # paliers du catalogue — c'est bien le rôle d'un thème de les nommer).
      # Même raison que les textes de relance juste au-dessus.
      # --- Page des paliers -----------------------------------------------------
      # STRUCTURE seulement (titre, périodicités, décomptes, marqueurs). Les NOMS
      # des paliers viennent du catalogue et donc du thème (store_essentiel …
      # store_royaume), et les PRIX de Play — jamais d'ici. C'est la même ligne de
      # partage que partout ailleurs dans ce bloc.
      tiers_title:
        fr: "Les paliers"
        en: "The tiers"
        es: "Los niveles"
      tiers_monthly:
        fr: "Par mois"
        en: "Monthly"
        es: "Por mes"
      tiers_yearly:
        fr: "Par an"
        en: "Yearly"
        es: "Por año"
      # Effectif d'un palier. {n} est substitué par le worker. Deux formes, parce
      # qu'« 1 à 2 joueurs » et « 14 joueurs et plus » ne se disent pas pareil et
      # qu'une phrase à trous unique donnerait l'une ou l'autre de travers.
      tiers_upto:
        fr: "Jusqu'à {n} joueurs"
        en: "Up to {n} players"
        es: "Hasta {n} jugadores"
      tiers_unlimited:
        fr: "Joueurs sans limite"
        en: "Unlimited players"
        es: "Jugadores sin límite"
      # Marqueurs de surlignage. Le palier courant et celui qu'on conseille sont
      # les deux seules informations que cette page doit faire ressortir.
      tiers_current:
        fr: "Votre palier"
        en: "Your tier"
        es: "Vuestro nivel"
      tiers_next:
        fr: "Conseillé"
        en: "Recommended"
        es: "Recomendado"
      # Effectif du clan, rappelé sous le palier courant : c'est le chiffre qui
      # explique tout le reste de l'écran.
      tiers_headcount:
        fr: "Votre clan compte {n} joueurs"
        en: "Your clan has {n} players"
        es: "Vuestro clan tiene {n} jugadores"
      # Catalogue vide (layer cloud pas encore descendu). Ne jamais laisser un
      # cadre muet sur l'écran qui porte toute l'offre.
      tiers_empty:
        fr: "Les paliers ne sont pas encore arrivés. Réessayez dans un instant."
        en: "The tiers haven't arrived yet. Try again in a moment."
        es: "Los niveles aún no han llegado. Inténtalo de nuevo en un momento."

      store_buy:
        fr: "Acheter"
        en: "Buy"
        es: "Comprar"
      store_owned:
        fr: "Déjà acquis"
        en: "Already owned"
        es: "Ya adquirido"
      store_expires:
        fr: "Prochaine échéance"
        en: "Next renewal"
        es: "Próxima renovación"
      store_locked_text:
        fr: "La bourse du clan est vide. Vos aventures vous attendent, intactes."
        en: "The clan's purse is empty. Your adventures are waiting, untouched."
        es: "La bolsa del clan está vacía. Vuestras aventuras os esperan, intactas."
      store_revive:
        fr: "Se réabonner"
        en: "Resubscribe"
        es: "Volver a suscribirse"
      store_restore_desc:
        fr: "Après une réinstallation : récupérer ce qui a déjà été payé."
        en: "After a reinstall: recover what has already been paid for."
        es: "Tras una reinstalación: recuperar lo que ya se ha pagado."
      store_manage_desc:
        fr: "Changer de moyen de paiement ou résilier, sur Google Play."
        en: "Change payment method or cancel, on Google Play."
        es: "Cambiar el método de pago o cancelar, en Google Play."

      # --- Codes cadeaux ---------------------------------------------------------
      # Le TON est celui du donjon, jamais celui d'un guichet : un enfant peut lire
      # l'écran par-dessus l'épaule d'un adulte. Aucun message ne dit « erreur », ni
      # « invalide », ni « échec » — un code qui ne marche pas est une porte qui ne
      # s'ouvre pas, et un code déjà servi est un coffre déjà vidé.
      #
      # Ces jetons vivent ICI et non au thème, comme le reste des libellés de la
      # boutique : un message qui explique pourquoi un cadeau ne s'ouvre pas doit
      # rester lisible même quand le layer du bucket est en retard.
      giftcode_menu:
        fr: "Utiliser un code"
        en: "Redeem a code"
        es: "Usar un código"
      giftcode_menu_desc:
        fr: "Un code reçu par courrier, sur une carte ou par un ami."
        en: "A code received by e-mail, on a card or from a friend."
        es: "Un código recibido por correo, en una tarjeta o de un amigo."
      giftcode_title:
        fr: "Un code pour le clan"
        en: "A code for the clan"
        es: "Un código para el clan"
      giftcode_intro:
        fr: "Recopiez le code tel qu'il est écrit. Les tirets, les espaces et les majuscules n'ont aucune importance."
        en: "Type the code just as it is written. Dashes, spaces and capitals make no difference."
        es: "Escribe el código tal como está. Los guiones, los espacios y las mayúsculas no importan."
      giftcode_hint:
        fr: "Le code"
        en: "The code"
        es: "El código"
      giftcode_confirm:
        fr: "Ouvrir le coffre"
        en: "Open the chest"
        es: "Abrir el cofre"
      giftcode_close:
        fr: "Merci !"
        en: "Thank you!"
        es: "¡Gracias!"
      # {n} n'est pas utilisé ici : le worker substitue @@@months@@@ lui-même, après
      # avoir résolu la traduction. Deux formulations parce qu'« 1 mois » et « 2 mois »
      # ne se disent pas de la même façon dans les trois langues.
      giftcode_success:
        fr: "Le coffre s'ouvre : @@@months@@@ mois offerts au clan. Ils s'ajoutent à ce que vous avez déjà."
        en: "The chest opens: @@@months@@@ months given to the clan. They add to what you already have."
        es: "El cofre se abre: @@@months@@@ meses de regalo para el clan. Se suman a lo que ya tenéis."
      giftcode_success_one:
        fr: "Le coffre s'ouvre : un mois offert au clan. Il s'ajoute à ce que vous avez déjà."
        en: "The chest opens: one month given to the clan. It adds to what you already have."
        es: "El cofre se abre: un mes de regalo para el clan. Se suma a lo que ya tenéis."
      giftcode_empty:
        fr: "Il n'y a rien à ouvrir : le coffre attend un code."
        en: "There is nothing to open: the chest is waiting for a code."
        es: "No hay nada que abrir: el cofre espera un código."
      giftcode_invalid:
        fr: "Ce code n'ouvre aucun coffre. Vérifiez les signes, un par un."
        en: "This code opens no chest. Check the characters, one by one."
        es: "Este código no abre ningún cofre. Comprueba los signos, uno a uno."
      giftcode_used:
        fr: "Votre clan a déjà ouvert ce coffre-là."
        en: "Your clan has already opened that chest."
        es: "Vuestro clan ya ha abierto ese cofre."
      giftcode_exhausted:
        fr: "Ce coffre a été vidé par d'autres clans avant vous."
        en: "This chest was emptied by other clans before you."
        es: "Otros clanes vaciaron este cofre antes que vosotros."
      giftcode_expired:
        fr: "Ce code a fait son temps : le coffre s'est refermé."
        en: "This code has had its day: the chest has closed again."
        es: "Este código ya cumplió su tiempo: el cofre se ha vuelto a cerrar."
      # Le message ne dit pas combien d'essais restent, ni quand la porte rouvre :
      # ce serait dire à quelqu'un qui cherche à deviner comment s'y prendre.
      giftcode_throttled:
        fr: "Trop de clés essayées. La serrure se repose ; revenez demain."
        en: "Too many keys tried. The lock is resting; come back tomorrow."
        es: "Demasiadas llaves probadas. La cerradura descansa; vuelve mañana."
      giftcode_not_admin:
        fr: "Seul un chef de clan peut ouvrir ce coffre."
        en: "Only a clan chief can open this chest."
        es: "Solo un jefe de clan puede abrir este cofre."
      giftcode_network:
        fr: "Le coffre reste muet. Réessayez dans un instant."
        en: "The chest stays silent. Try again in a moment."
        es: "El cofre permanece mudo. Inténtalo de nuevo en un momento."

      # --- Fabrique de codes (mode test) -----------------------------------------
      # Écran d'EXPLOITATION, pas de jeu : ton neutre, vocabulaire exact. Il ne sort
      # jamais du bucket de test.
      giftcode_mint_menu:
        fr: "Fabriquer des codes"
        en: "Mint gift codes"
        es: "Fabricar códigos"
      giftcode_mint_menu_desc:
        fr: "Créer un lot de codes cadeaux (compte éditeur seulement)"
        en: "Create a batch of gift codes (publisher account only)"
        es: "Crear un lote de códigos de regalo (solo cuenta editora)"
      giftcode_mint_title:
        fr: "Fabrique de codes"
        en: "Gift code mint"
        es: "Fábrica de códigos"
      giftcode_mint_hint:
        fr: "Les codes ne s'affichent qu'UNE FOIS : seule leur empreinte est conservée. Partagez-les avant de quitter."
        en: "Codes are shown ONCE only: only their fingerprint is kept. Share them before leaving."
        es: "Los códigos se muestran UNA SOLA VEZ: solo se conserva su huella. Compártelos antes de salir."
      giftcode_mint_count:
        fr: "Combien de codes"
        en: "How many codes"
        es: "Cuántos códigos"
      giftcode_mint_months:
        fr: "Mois offerts"
        en: "Months granted"
        es: "Meses de regalo"
      giftcode_mint_uses:
        fr: "Clans par code"
        en: "Clans per code"
        es: "Clanes por código"
      # 0 = sans fin. Un code de flyer qui n'expire jamais reste réclamable pour
      # toujours : le champ existe pour qu'y penser ne demande aucun détour.
      giftcode_mint_days:
        fr: "Valable (jours, 0 = sans fin)"
        en: "Valid for (days, 0 = forever)"
        es: "Válido (días, 0 = sin fin)"
      giftcode_mint_label:
        fr: "Nom du lot"
        en: "Batch name"
        es: "Nombre del lote"
      giftcode_mint_label_hint:
        fr: "ex. betas août"
        en: "e.g. august betas"
        es: "p. ej. betas agosto"
      giftcode_mint_confirm:
        fr: "Fabriquer"
        en: "Mint"
        es: "Fabricar"
      giftcode_mint_share:
        fr: "Partager les codes"
        en: "Share the codes"
        es: "Compartir los códigos"
      giftcode_revoke_hint:
        fr: "Lot ou code à couper"
        en: "Batch or code to cut"
        es: "Lote o código a cortar"
      giftcode_revoke:
        fr: "Couper"
        en: "Cut"
        es: "Cortar"
      # DEUX jetons de refus, et un seul critère pour choisir : l'HISTOIRE COMMERCIALE
      # du clan (_storeCapNotice lit _storeState), jamais le plafond lui-même.
      #   - jamais souscrit  → store_cap_start : c'est une proposition, on annonce les
      #                        quatorze jours offerts ;
      #   - tous les autres  → store_cap_full  : abonné qui déborde, résilié, expiré,
      #                        gelé. AUCUNE promesse d'essai — Play ne re-sert pas
      #                        `essai-14j` à un compte qui l'a déjà eue, et une
      #                        promesse démentie par la feuille de paiement est pire
      #                        que pas de promesse.
      #
      # Il y en avait eu trois autrefois (enfants pleins / adultes pleins / les deux),
      # parce que le catalogue portait deux plafonds distincts. Il n'y a plus qu'un
      # compteur de joueurs, donc plus qu'une façon d'être complet.
      #
      # Aucun des deux textes ne nomme de palier : celui qu'il faut prendre dépend de
      # l'effectif, et la page des paliers le flèche elle-même à la ligne près. Écrire
      # « prenez l'illimité » ici, comme le faisait une vieille version, vendait le
      # plus cher à un clan de trois qui n'avait besoin que du palier d'à côté.
      #
      # « pour cette cotisation » a été retiré de store_cap_full : c'était faux pour un
      # clan expiré ou gelé, qui n'en a plus aucune, et ça se lisait comme un reproche.
      store_cap_full:
        fr: "Le clan est au complet. Voici les paliers, et celui qui vous ouvrirait une place de plus."
        en: "The clan is full. Here are the tiers, and the one that would open another seat for you."
        es: "El clan está completo. Estos son los niveles, y el que os abriría una plaza más."
      # {n} = le plafond courant, substitué par on_tiers_appear (jamais un chiffre en
      # dur : la grille se règle depuis le bucket, ce texte est embarqué au binaire).
      #
      # ⚠ PROMESSE COMMERCIALE EMBARQUÉE. Les quatorze jours sont l'offre `essai-14j`
      # du catalogue. Si elle change ou disparaît au bucket, CE TEXTE DEVIENT FAUX et
      # demande une nouvelle version sur les stores — il n'y a pas de layer qui le
      # rattrape. Vérifier les deux ensemble.
      store_cap_start:
        fr: "Votre clan grandit ! Au-delà de {n} aventuriers, il lui faut une cotisation — les quatorze premiers jours sont offerts, et vous l'arrêtez quand vous voulez."
        en: "Your clan is growing! Beyond {n} adventurers it needs dues — the first fourteen days are free, and you can stop whenever you want."
        es: "¡Vuestro clan crece! Más allá de {n} aventureros necesita una cuota — los catorce primeros días son gratuitos, y la paráis cuando queráis."
      # Le MUR de première cotisation (D2), affiché aux seuls chefs après la deuxième
      # tâche validée du clan. Même promesse que store_cap_start et mêmes précautions.
      # Ne menace de rien et ne nomme aucun palier : ce n'est pas une sanction, c'est
      # le moment où l'on demande le prix — la famille vient de constater de ses yeux
      # que le jeu fonctionne.
      store_pitch_second:
        fr: "Deux défis déjà relevés — votre clan a pris le rythme. Pour qu'il continue, il lui faut une cotisation : les quatorze premiers jours sont offerts, et vous l'arrêtez quand vous voulez."
        en: "Two challenges already met — your clan has found its rhythm. To keep it going it needs dues: the first fourteen days are free, and you can stop whenever you want."
        es: "Dos desafíos ya superados — vuestro clan ha cogido el ritmo. Para que continúe necesita una cuota: los catorce primeros días son gratuitos, y la paráis cuando queráis."
      store_state_none:
        fr: "Aucune cotisation en cours"
        en: "No dues in effect"
        es: "Sin cuota en curso"
      store_state_trial:
        fr: "Essai en cours"
        en: "Trial in progress"
        es: "Prueba en curso"
      store_state_active:
        fr: "Cotisation à jour"
        en: "Dues up to date"
        es: "Cuota al día"
      store_state_canceled:
        fr: "Cotisation résiliée — la guilde reste ouverte jusqu'à l'échéance"
        en: "Dues cancelled — the guild stays open until the renewal date"
        es: "Cuota cancelada — el gremio sigue abierto hasta el vencimiento"
      store_state_grace:
        fr: "Le dragon de la banque sommeille mal — l'aventure continue"
        en: "The bank dragon is sleeping badly — the adventure goes on"
        es: "El dragón del banco duerme mal — la aventura continúa"
      store_state_hold:
        fr: "La cotisation n'est pas encore arrivée — la porte reste ouverte"
        en: "The dues haven't arrived yet — the door stays open"
        es: "La cuota aún no ha llegado — la puerta sigue abierta"
      store_state_locked:
        fr: "Le clan se repose"
        en: "The clan is resting"
        es: "El clan descansa"
      store_state_expired:
        fr: "La cotisation ne court plus"
        en: "The dues no longer run"
        es: "La cuota ya no corre"

      # --- LES DEUX GUIDES (leçons dvtuto `guide_parent` / `guide_enfant`) -----------
      # Ce ne sont pas des textes d'interface : ce sont les seuls endroits de l'app où
      # l'INTENTION est dite. Trois règles de rédaction, à tenir dans les trois langues :
      #   - aucune injonction à l'enfant ; on lui dit ses droits, pas ses devoirs ;
      #   - aucun chiffre qui ne soit vérifiable dans le code (10 PV, 1 PV/jour, demi-XP) ;
      #   - le vouvoiement pour le parent, le tutoiement pour l'enfant.
      tuto_guide_parent_title:
        fr: "Guide du parent"
        en: "Parent's guide"
        es: "Guía para padres"
      tuto_guide_enfant_title:
        fr: "Guide de l'aventurier"
        en: "Adventurer's guide"
        es: "Guía del aventurero"
      perso_menu_guide_parent_desc:
        fr: "Ce que l'application attend de vous : l'effort, l'alerte, le butin, votre place dans le jeu."
        en: "What the app expects from you: effort, the alert, the loot, and your own place in the game."
        es: "Lo que la aplicación espera de ti: el esfuerzo, la alerta, el botín y tu lugar en el juego."
      perso_menu_guide_enfant_desc:
        fr: "Tes droits dans le jeu : recommencer, refuser un gage, garder ta photo."
        en: "Your rights in the game: start over, refuse a forfeit, keep your photo."
        es: "Tus derechos en el juego: volver a empezar, rechazar una prenda, guardar tu foto."

      # --- Parent, écran 1 : l'effort. Il OUVRE le guide, avant l'écran sur la mort —
      #     commencer par « votre enfant est mort » installerait le contresens qu'on défait.
      guide_p1_title:
        fr: "L'effort avant le résultat"
        en: "Effort before result"
        es: "El esfuerzo antes que el resultado"
      guide_p1_situation:
        fr: "Le lit est fait… à moitié. Votre enfant vous montre fièrement sa photo, et attend votre verdict."
        en: "The bed is made… halfway. Your child proudly shows you the photo, and waits for your verdict."
        es: "La cama está hecha… a medias. Tu hijo te enseña la foto con orgullo y espera tu veredicto."
      guide_p1_a:
        fr: "Trois verdicts, aucune punition"
        en: "Three verdicts, no punishment"
        es: "Tres veredictos, ningún castigo"
      guide_p1_a_desc:
        fr: "Accepté, partiel — la moitié des points —, ou refusé : la tâche revient simplement à l'enfant. Rien ne lui est jamais retiré."
        en: "Accepted, partial — half the points —, or refused: the task simply comes back to the child. Nothing is ever taken away."
        es: "Aceptada, parcial —la mitad de los puntos— o rechazada: la tarea vuelve al niño. Nunca se le quita nada."
      guide_p1_b:
        fr: "Aucun compteur d'échecs"
        en: "No failure tally"
        es: "Ningún recuento de fracasos"
      guide_p1_b_desc:
        fr: "Le journal ne garde pas trace d'un refus, et le jeu n'a ni classement ni note. N'en tenez pas non plus à la maison."
        en: "The log keeps no trace of a refusal, and the game has no ranking and no grades. Don't keep any at home either."
        es: "El diario no guarda rastro de un rechazo, y el juego no tiene ni clasificación ni notas. Tampoco las lleves en casa."
      guide_p1_c:
        fr: "Dites d'abord ce qui est réussi"
        en: "Say what went right first"
        es: "Di primero lo que salió bien"
      guide_p1_c_desc:
        fr: "Un mot pèse plus lourd qu'un verdict. C'est le geste qui compte, pas la perfection du résultat."
        en: "A word weighs more than a verdict. What counts is the effort, not a perfect result."
        es: "Una palabra pesa más que un veredicto. Lo que cuenta es el gesto, no un resultado perfecto."

      # --- Parent, écran 2 : la mort. LE point du dossier « intérêt de l'enfant » § 5.2 —
      #     un dispositif d'alerte que le destinataire ne sait pas lire n'alerte personne.
      #     Chiffres : `pv` init 10, `decay` 1 jour/PV → 0 PV au dixième jour d'inactivité.
      guide_p2_title:
        fr: "Un crâne ? C'est une alerte"
        en: "A skull? That's an alert"
        es: "¿Una calavera? Es una alerta"
      guide_p2_situation:
        fr: "Le personnage de votre enfant est mort, et un gage l'attend. Ce n'est pas le jeu qui le punit : c'est l'application qui vous rend la main."
        en: "Your child's character has died, and a forfeit awaits. The game is not punishing them: the app is handing things back to you."
        es: "El personaje de tu hijo ha muerto y le espera una prenda. No es el juego que lo castiga: es la aplicación que te devuelve la mano."
      guide_p2_a:
        fr: "Dix jours sans rien terminer"
        en: "Ten days without finishing anything"
        es: "Diez días sin terminar nada"
      guide_p2_a_desc:
        fr: "Un point de vie par jour d'inactivité, dix au départ. Le crâne vous dit d'aller voir pourquoi : de l'ennui, des tâches trop dures, ou tout autre chose."
        en: "One life point per idle day, ten to begin with. The skull is telling you to go and find out why: boredom, tasks that are too hard, or something else entirely."
        es: "Un punto de vida por día sin actividad, diez al principio. La calavera te dice que vayas a ver por qué: aburrimiento, tareas demasiado difíciles u otra cosa."
      guide_p2_b:
        fr: "Une seule tâche répare tout"
        en: "A single task repairs everything"
        es: "Una sola tarea lo repara todo"
      guide_p2_b_desc:
        fr: "Terminer une tâche rend l'intégralité des points de vie. Rien ne s'accumule, rien ne se rattrape : une punition ne s'effacerait pas si vite."
        en: "Finishing one task restores every life point. Nothing piles up, nothing has to be made up for: a punishment would not clear that easily."
        es: "Terminar una tarea devuelve todos los puntos de vida. Nada se acumula, nada hay que recuperar: un castigo no se borraría tan rápido."
      guide_p2_c:
        fr: "Le gage est un jeu de famille"
        en: "The forfeit is a family game"
        es: "La prenda es un juego de familia"
      guide_p2_c_desc:
        fr: "Rien ne vérifie qu'il a été fait. Il se joue devant le clan, jamais seul, et votre enfant a le droit de le refuser."
        en: "Nothing checks that it was carried out. It is played in front of the clan, never alone, and your child is free to refuse it."
        es: "Nada comprueba que se haya cumplido. Se juega ante el clan, nunca a solas, y tu hijo tiene derecho a negarse."

      # --- Parent, écran 3 : le butin. Le seul endroit où l'on dit quoi mettre dedans.
      guide_p3_title:
        fr: "Que mettre dans le butin ?"
        en: "What goes into the loot?"
        es: "¿Qué poner en el botín?"
      guide_p3_situation:
        fr: "Le coffre du clan est plein et va s'ouvrir. Toute la famille se demande ce qu'il y a dedans."
        en: "The clan chest is full and about to open. The whole family is wondering what is inside."
        es: "El cofre del clan está lleno y va a abrirse. Toda la familia se pregunta qué hay dentro."
      guide_p3_a:
        fr: "Du temps plutôt que des objets"
        en: "Time rather than things"
        es: "Tiempo más que objetos"
      guide_p3_a_desc:
        fr: "Une sortie, un repas choisi, une soirée jeux. Un peu d'argent de poche si c'est déjà votre habitude."
        en: "An outing, a meal of their choosing, a games night. A little pocket money if that is already your habit."
        es: "Una salida, una comida elegida, una noche de juegos. Algo de paga si ya es vuestra costumbre."
      guide_p3_b:
        fr: "Ni gâter, ni marchander"
        en: "Neither spoiling nor bargaining"
        es: "Ni malcriar ni negociar"
      guide_p3_b_desc:
        fr: "Le butin n'est pas un salaire. Et « pas de butin tant que… » retourne le jeu contre lui-même."
        en: "The loot is not a wage. And « no loot until… » turns the game against itself."
        es: "El botín no es un sueldo. Y «no hay botín hasta que…» vuelve el juego contra sí mismo."
      guide_p3_c:
        fr: "Chacun reçoit sa part"
        en: "Everyone gets a share"
        es: "Cada uno recibe su parte"
      guide_p3_c_desc:
        fr: "Y compris celui qui a peu joué. Une surprise ne doit pas se transformer en bulletin de notes."
        en: "Including the one who hardly played. A surprise must not turn into a report card."
        es: "Incluido quien apenas jugó. Una sorpresa no debe convertirse en un boletín de notas."

      # --- Parent, écran 4 : votre propre place. Hors concours, coup de pouce, photo.
      guide_p4_title:
        fr: "Jouer sans les écraser"
        en: "Play without crushing them"
        es: "Jugar sin aplastarlos"
      guide_p4_situation:
        fr: "Vous prenez goût au jeu, et vous abattez trois fois plus de tâches que les enfants."
        en: "You are getting a taste for the game, and you are clearing three times as many tasks as the children."
        es: "Le has cogido el gusto al juego y despachas tres veces más tareas que los niños."
      guide_p4_a:
        fr: "Passez hors concours"
        en: "Play out of contest"
        es: "Ponte fuera de concurso"
      guide_p4_a_desc:
        fr: "Vous continuez à faire progresser le clan, mais vous sortez des comparaisons et des récompenses. La jauge des enfants se mesure au meilleur du cycle : ce serait vous."
        en: "You keep the clan moving forward, but you step out of comparisons and rewards. The children's gauge is measured against the best of the cycle — that would be you."
        es: "Sigues haciendo avanzar al clan, pero sales de las comparaciones y las recompensas. El medidor de los niños se mide con el mejor del ciclo: serías tú."
      guide_p4_b:
        fr: "Recommandez plutôt que comparer"
        en: "Recommend rather than compare"
        es: "Recomienda en vez de comparar"
      guide_p4_b_desc:
        fr: "Un enfant à la traîne ? Recommandez-lui une tâche : elle rapporte davantage, sans que personne ait été désigné devant les autres."
        en: "A child falling behind? Recommend a task to them: it is worth more, and no one has been singled out in front of the others."
        es: "¿Un niño que se queda atrás? Recomiéndale una tarea: vale más, y nadie ha sido señalado ante los demás."
      guide_p4_c:
        fr: "Les photos restent chez eux"
        en: "Photos stay with them"
        es: "Las fotos se quedan con ellos"
      guide_p4_c_desc:
        fr: "La preuve photo ne quitte jamais le téléphone de l'enfant : elle se montre en personne, elle ne se réclame pas. Pour tout effacer : Personnage, puis Supprimer mon compte."
        en: "The photo proof never leaves the child's phone: it is shown in person, it cannot be demanded. To erase everything: Character, then Delete my account."
        es: "La foto de prueba nunca sale del teléfono del niño: se enseña en persona, no se reclama. Para borrarlo todo: Personaje y luego Eliminar mi cuenta."

      # --- Enfant, écran 1 : à quoi sert ce que tu fais.
      guide_k1_title:
        fr: "Ton clan compte sur toi"
        en: "Your clan is counting on you"
        es: "Tu clan cuenta contigo"
      guide_k1_situation:
        fr: "Chaque monstre que tu bats, c'est une tâche faite à la maison. Tes points font monter ton personnage, et tout ton clan avec toi."
        en: "Every monster you beat is a task done at home. Your points level up your character, and your whole clan with you."
        es: "Cada monstruo que vences es una tarea hecha en casa. Tus puntos suben a tu personaje, y a todo tu clan contigo."
      guide_k1_a:
        fr: "On avance ensemble"
        en: "We move forward together"
        es: "Avanzamos juntos"
      guide_k1_a_desc:
        fr: "Tes points s'ajoutent à ceux du clan. Personne ne joue contre toi : il n'y a pas de classement."
        en: "Your points add to the clan's. Nobody plays against you: there is no ranking."
        es: "Tus puntos se suman a los del clan. Nadie juega contra ti: no hay clasificación."
      guide_k1_b:
        fr: "C'est toi qui choisis"
        en: "You are the one who chooses"
        es: "Tú eliges"
      guide_k1_b_desc:
        fr: "Tu prends le monstre que tu veux, tu le bats, puis un chef de clan valide."
        en: "You take whichever monster you want, you beat it, then a clan chief validates it."
        es: "Coges el monstruo que quieras, lo vences y luego un jefe de clan lo valida."
      guide_k1_c:
        fr: "Un monstre à la fois"
        en: "One monster at a time"
        es: "Un monstruo cada vez"
      guide_k1_c_desc:
        fr: "Prends ton temps. Rien ne t'oblige à jouer tous les jours."
        en: "Take your time. Nothing forces you to play every day."
        es: "Tómate tu tiempo. Nada te obliga a jugar todos los días."

      # --- Enfant, écran 2 : les PV et le gage, dits comme un droit et non comme une menace.
      guide_k2_title:
        fr: "Tes points de vie baissent ?"
        en: "Your life points going down?"
        es: "¿Te bajan los puntos de vida?"
      guide_k2_situation:
        fr: "Tu as vu tes cœurs diminuer tout seuls ? Ce n'est pas une punition : c'est juste le temps qui passe sans monstre battu."
        en: "Have you seen your hearts go down on their own? That is not a punishment: it is just time passing with no monster beaten."
        es: "¿Has visto bajar tus corazones solos? No es un castigo: es solo el tiempo que pasa sin vencer monstruos."
      guide_k2_a:
        fr: "Un cœur par jour sans tâche"
        en: "One heart per day without a task"
        es: "Un corazón por día sin tarea"
      guide_k2_a_desc:
        fr: "Tu commences avec dix. Ils ne descendent que si plus rien n'est terminé."
        en: "You start with ten. They only go down when nothing is being finished."
        es: "Empiezas con diez. Solo bajan si ya no terminas nada."
      guide_k2_b:
        fr: "Une tâche les rend tous"
        en: "One task gives them all back"
        es: "Una tarea te los devuelve todos"
      guide_k2_b_desc:
        fr: "Bats un seul monstre et tu récupères tous tes cœurs d'un coup."
        en: "Beat a single monster and you get every heart back at once."
        es: "Vence un solo monstruo y recuperas todos tus corazones de golpe."
      guide_k2_c:
        fr: "À zéro, un gage rigolo"
        en: "At zero, a funny forfeit"
        es: "A cero, una prenda divertida"
      guide_k2_c_desc:
        fr: "Un défi drôle à faire devant ta famille. Tu as le droit de dire non, et personne ne vérifie."
        en: "A funny challenge to do in front of your family. You are allowed to say no, and nobody checks."
        es: "Un reto gracioso para hacer ante tu familia. Tienes derecho a decir que no, y nadie lo comprueba."

      # --- Enfant, écran 3 : le refus. Rien n'est retiré, rien n'est archivé contre toi.
      guide_k3_title:
        fr: "Refusé ? Tu recommences"
        en: "Refused? You start again"
        es: "¿Rechazada? Vuelves a empezar"
      guide_k3_situation:
        fr: "Un chef de clan a refusé ta tâche. Ça arrive, et ça ne t'enlève rien du tout."
        en: "A clan chief refused your task. It happens, and it takes nothing away from you."
        es: "Un jefe de clan ha rechazado tu tarea. Pasa, y no te quita nada."
      guide_k3_a:
        fr: "Trois réponses possibles"
        en: "Three possible answers"
        es: "Tres respuestas posibles"
      guide_k3_a_desc:
        fr: "Réussi, à moitié réussi — la moitié des points —, ou à refaire. Aucune ne te retire de points."
        en: "Done, half done — half the points —, or to be done again. None of them takes points off you."
        es: "Conseguida, a medias —la mitad de los puntos— o a repetir. Ninguna te quita puntos."
      guide_k3_b:
        fr: "La tâche te revient"
        en: "The task comes back to you"
        es: "La tarea vuelve a ti"
      guide_k3_b_desc:
        fr: "Elle retourne dans ta liste : tu peux la reprendre quand tu veux."
        en: "It goes back into your list: you can pick it up again whenever you want."
        es: "Vuelve a tu lista: puedes retomarla cuando quieras."
      guide_k3_c:
        fr: "Seuls tes exploits sont écrits"
        en: "Only your feats get written down"
        es: "Solo se escriben tus hazañas"
      guide_k3_c_desc:
        fr: "Le journal du clan ne raconte pas tes ratés. Personne n'en garde la liste."
        en: "The clan log does not tell of your misses. Nobody keeps a list of them."
        es: "El diario del clan no cuenta tus fallos. Nadie guarda la lista."

      # --- Enfant, écran 4 : le partage, et l'intimité de la preuve photo.
      guide_k4_title:
        fr: "Le butin et ta photo"
        en: "The loot and your photo"
        es: "El botín y tu foto"
      guide_k4_situation:
        fr: "Quand le coffre du clan est plein, il s'ouvre pour tout le monde en même temps."
        en: "When the clan chest is full, it opens for everyone at the same time."
        es: "Cuando el cofre del clan está lleno, se abre para todos a la vez."
      guide_k4_a:
        fr: "Le butin se partage"
        en: "The loot is shared"
        es: "El botín se reparte"
      guide_k4_a_desc:
        fr: "Tu reçois ta part même si tu as joué moins que les autres."
        en: "You get your share even if you played less than the others."
        es: "Recibes tu parte aunque hayas jugado menos que los demás."
      guide_k4_b:
        fr: "Ta photo reste chez toi"
        en: "Your photo stays with you"
        es: "Tu foto se queda contigo"
      guide_k4_b_desc:
        fr: "La photo de preuve ne sort jamais de ton téléphone. Personne ne peut la regarder à distance, même pas un chef de clan."
        en: "The proof photo never leaves your phone. Nobody can look at it from afar, not even a clan chief."
        es: "La foto de prueba nunca sale de tu teléfono. Nadie puede verla a distancia, ni siquiera un jefe de clan."
      guide_k4_c:
        fr: "La fête est en vrai"
        en: "The celebration is real life"
        es: "La fiesta es de verdad"
      guide_k4_c_desc:
        fr: "Ce que le clan gagne se vit en famille, pas dans l'application."
        en: "What the clan wins is lived with your family, not inside the app."
        es: "Lo que el clan gana se vive en familia, no dentro de la aplicación."

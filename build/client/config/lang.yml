        pt: "Olá! Eu sou {short}, vou ser o teu companheiro nas tuas aventuras, e podes até brincar comigo!"
        br: "Oi! Eu sou {short}, vou ser seu companheiro nas suas aventuras, e você pode até brincar comigo!"
        nl: "Hallo! Ik ben {short}, ik ben je maatje tijdens je avonturen, en je kunt zelfs met me spelen!"

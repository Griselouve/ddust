        it: "Il compito è appena stato fatto: ricomparirà dopo un po'."
        pt: "A tarefa acabou de ser feita: vai reaparecer daqui a algum tempo."
        br: "A tarefa acabou de ser feita: vai reaparecer daqui a algum tempo."

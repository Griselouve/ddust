        nl: "De taak laadt op en is binnenkort weer beschikbaar."
      # --- Combat, leçon 3 : une tâche en cours (déroulé + validation par le chef) ---
      tuto_combat_active_title:
        fr: "La tâche en cours"
        en: "The active task"
        es: "La tarea en curso"
        de: "Die laufende Aufgabe"
        it: "Il compito in corso"
        pt: "A tarefa em curso"
        br: "A tarefa em andamento"
        nl: "De huidige taak"
      # Repli de la lecon « tache en cours » quand il n'y en a aucune : le rejeu depuis
      # l'ecran Tutoriels ne peut pas en inventer une.
      # Le tutoriel vient de prendre une tache pour la demonstration : il le DIT, sinon le
      # joueur croit avoir declenche un combat par megarde.
      tuto_combat_active_demo:
        fr: "J'ai choisi une tâche pour toi, histoire de te montrer. La voici : c'est ton combat du moment."
        en: "I picked a task for you, just to show you how it works. Here it is: your current fight."
        es: "He elegido una tarea por ti, solo para enseñarte cómo funciona. Aquí la tienes: tu combate del momento."
        de: "Ich habe eine Aufgabe für dich ausgesucht, nur um es dir zu zeigen. Hier ist sie: Das ist dein aktueller Kampf."
        it: "Ho scelto un compito per te, giusto per mostrarti come funziona. Eccolo: è il tuo combattimento del momento."
        pt: "Escolhi uma tarefa por ti, só para te mostrar como funciona. Aqui está: é o teu combate do momento."
        br: "Escolhi uma tarefa para você, só para mostrar como funciona. Aqui está: é o seu combate do momento."
        nl: "Ik heb een taak voor je gekozen, gewoon om het je te laten zien. Hier is hij: dat is je gevecht van dit moment."
      # Et il la rend, a la fin, pour ne rien imposer.
      tuto_combat_active_given_back:
        fr: "Celle-ci, je te la rends : elle redevient libre pour ton clan. À toi de choisir la tienne !"
        en: "This one, I'm giving back: it's free for your clan again. Now pick your own!"
        es: "Esta te la devuelvo: vuelve a estar libre para tu clan. ¡Ahora elige la tuya!"
        de: "Diese hier gebe ich dir zurück: Sie ist wieder frei für deinen Clan. Jetzt wähl deine eigene!"
        it: "Questo te lo restituisco: torna libero per il tuo clan. Ora scegli il tuo!"
        pt: "Esta, devolvo-ta: volta a estar livre para o teu clã. Agora escolhe a tua!"
        br: "Esta eu devolvo: ela volta a ficar livre para o seu clã. Agora escolha a sua!"
        nl: "Deze geef ik je terug: hij is weer vrij voor je clan. Kies nu je eigen taak!"
      # Repli : plus une seule tache libre dans tout le clan, il n'y a rien a montrer.
      tuto_combat_active_none:
        fr: "Toutes les tâches du clan sont déjà prises ! Reviens lire ce guide quand tu en auras commencé une : il te montrera les boutons au fur et à mesure."
        en: "Every task in the clan is already taken! Come back to this guide once you've started one: it will point out the buttons as you go."
        es: "¡Todas las tareas del clan ya están cogidas! Vuelve a esta guía cuando hayas empezado una: te mostrará los botones sobre la marcha."
        de: "Alle Aufgaben des Clans sind schon vergeben! Lies diese Anleitung noch einmal, wenn du eine begonnen hast: Sie zeigt dir die Knöpfe nach und nach."
        it: "Tutti i compiti del clan sono già presi! Torna a leggere questa guida quando ne avrai iniziato uno: ti mostrerà i pulsanti man mano."
        pt: "Todas as tarefas do clã já estão ocupadas! Volta a este guia quando tiveres começado uma: vai mostrar-te os botões à medida que avanças."
        br: "Todas as tarefas do clã já estão ocupadas! Volte a este guia quando tiver começado uma: ele vai mostrar os botões conforme você avança."
        nl: "Alle taken van de clan zijn al bezet! Lees deze gids opnieuw als je er een bent begonnen: hij wijst je de knoppen gaandeweg aan."
      tuto_combat_active_intro:
        fr: "Tu as pris une tâche : la voici, c'est ton combat du moment."
        en: "You've taken on a task: here it is, your current fight."
        es: "Has asumido una tarea: aquí está, tu combate del momento."
        de: "Du hast eine Aufgabe übernommen: Hier ist sie, das ist dein aktueller Kampf."
        it: "Hai preso un compito: eccolo, è il tuo combattimento del momento."
        pt: "Pegaste numa tarefa: aqui está, é o teu combate do momento."
        br: "Você pegou uma tarefa: aqui está, é o seu combate do momento."
        nl: "Je hebt een taak aangenomen: hier is hij, dat is je gevecht van dit moment."
      tuto_combat_active_difficulty:
        fr: "Cette pastille indique la difficulté de la tâche et l'XP qu'elle te rapportera."
        en: "This badge shows the task's difficulty and the XP it will earn you."
        es: "Esta insignia indica la dificultad de la tarea y la XP que te dará."
        de: "Diese Plakette zeigt die Schwierigkeit der Aufgabe und die XP, die sie dir bringt."
        it: "Questo bollino indica la difficoltà del compito e gli XP che ti farà guadagnare."
        pt: "Este distintivo indica a dificuldade da tarefa e o XP que te vai dar."
        br: "Este selo indica a dificuldade da tarefa e o XP que ela vai dar a você."
        nl: "Deze badge toont de moeilijkheid van de taak en de XP die hij je oplevert."
      tuto_combat_active_criteria:
        fr: "Voici les critères à remplir pour vaincre le monstre."
        en: "These are the criteria to meet to defeat the monster."
        es: "Estos son los criterios que debes cumplir para vencer al monstruo."
        de: "Das sind die Bedingungen, um das Monster zu besiegen."
        it: "Ecco i criteri da soddisfare per sconfiggere il mostro."
        pt: "Estes são os critérios a cumprir para vencer o monstro."
        br: "Estes são os critérios a cumprir para vencer o monstro."
        nl: "Dit zijn de voorwaarden om het monster te verslaan."
      tuto_combat_active_done:
        fr: "Une fois la tâche accomplie pour de vrai, touche « J'ai vaincu le monstre ! ». Tu prendras une photo, ou une courte vidéo sans son, comme preuve."
        en: "Once you've truly completed the task, tap “I defeated the monster!”. You'll take a photo, or a short silent video, as proof."
        es: "Una vez completada la tarea de verdad, toca «¡He vencido al monstruo!». Harás una foto, o un vídeo corto sin sonido, como prueba."
        de: "Sobald die Aufgabe wirklich erledigt ist, tippe auf „Ich habe das Monster besiegt!“. Als Beweis machst du ein Foto oder ein kurzes Video ohne Ton."
        it: "Una volta portato a termine il compito per davvero, tocca «Ho sconfitto il mostro!». Come prova scatterai una foto, o girerai un breve video senza audio."
        pt: "Depois de cumprires a tarefa a sério, toca em «Derrotei o monstro!». Vais tirar uma fotografia, ou gravar um vídeo curto sem som, como prova."
        br: "Depois de cumprir a tarefa de verdade, toque em \"Derrotei o monstro!\". Você vai tirar uma foto, ou gravar um vídeo curto sem som, como prova."
        nl: "Heb je de taak echt voltooid, tik dan op ‘Ik heb het monster verslagen!’. Je maakt een foto, of een korte video zonder geluid, als bewijs."
      tuto_combat_active_validate:
        fr: "Ensuite, va voir le chef de clan pour qu'il valide ta tâche. Tu peux lui montrer ta preuve. (Si tu es le seul chef de clan, tes tâches se valident toutes seules.)"
        en: "Then go to the clan chief so they validate your task. You can show them your proof. (If you're the clan's only chief, your tasks validate themselves.)"
        es: "Luego ve al jefe del clan para que valide tu tarea. Puedes mostrarle tu prueba. (Si eres el único jefe del clan, tus tareas se validan solas.)"
        de: "Geh dann zum Clanchef, damit er deine Aufgabe bestätigt. Du kannst ihm deinen Beweis zeigen. (Wenn du der einzige Clanchef bist, werden deine Aufgaben automatisch bestätigt.)"
        it: "Poi vai dal capo clan perché convalidi il tuo compito. Puoi mostrargli la tua prova. (Se sei l'unico capo clan, i tuoi compiti si convalidano da soli.)"
        pt: "Depois, vai ter com o chefe de clã para ele validar a tua tarefa. Podes mostrar-lhe a tua prova. (Se fores o único chefe de clã, as tuas tarefas validam-se sozinhas.)"
        br: "Depois, vá até o chefe do clã para ele validar sua tarefa. Você pode mostrar sua prova a ele. (Se você for o único chefe do clã, suas tarefas se validam sozinhas.)"
        nl: "Ga daarna naar het clanhoofd zodat die je taak valideert. Je kunt je bewijs laten zien. (Ben je het enige clanhoofd, dan worden je taken vanzelf gevalideerd.)"
      tuto_combat_active_wait:
        fr: "Tant que ta tâche n'est pas validée, tu ne peux pas en combattre une autre. Une fois validée, tu gagnes ton XP et tu repars au combat !"
        en: "Until your task is validated, you can't fight another one. Once validated, you earn your XP and head back to battle!"
        es: "Mientras tu tarea no esté validada, no puedes combatir otra. Una vez validada, ganas tu XP y ¡vuelves al combate!"
        de: "Solange deine Aufgabe nicht bestätigt ist, kannst du keine andere bekämpfen. Sobald sie bestätigt ist, bekommst du deine XP und ziehst wieder in den Kampf!"
        it: "Finché il tuo compito non è convalidato, non puoi combatterne un altro. Una volta convalidato, guadagni i tuoi XP e torni a combattere!"
        pt: "Enquanto a tua tarefa não for validada, não podes combater outra. Depois de validada, ganhas o teu XP e voltas ao combate!"
        br: "Enquanto sua tarefa não for validada, você não pode combater outra. Depois de validada, você ganha seu XP e volta ao combate!"
        nl: "Zolang je taak niet gevalideerd is, kun je geen andere bevechten. Zodra hij gevalideerd is, krijg je je XP en trek je weer ten strijde!"
      tuto_combat_active_retreat:
        fr: "Si tu ne peux pas la terminer, bats en retraite : la tâche redevient libre pour le clan."
        en: "If you can't finish it, retreat: the task becomes free for the clan again."
        es: "Si no puedes terminarla, retírate: la tarea vuelve a quedar libre para el clan."
        de: "Wenn du sie nicht beenden kannst, tritt den Rückzug an: Die Aufgabe ist dann wieder frei für den Clan."
        it: "Se non riesci a finirlo, batti in ritirata: il compito torna libero per il clan."
        pt: "Se não conseguires terminá-la, bate em retirada: a tarefa volta a ficar livre para o clã."
        br: "Se não conseguir terminá-la, bata em retirada: a tarefa volta a ficar livre para o clã."
        nl: "Kun je hem niet afmaken, trek je dan terug: de taak is weer vrij voor de clan."

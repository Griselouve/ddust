      # --- Codes cadeaux ---------------------------------------------------------
      # Le TON est celui du donjon, jamais celui d'un guichet : un enfant peut lire
      # l'écran par-dessus l'épaule d'un adulte. Aucun message ne dit « erreur », ni
      # « invalide », ni « échec » — un code qui ne marche pas est une porte qui ne
      # s'ouvre pas, et un code déjà servi est un coffre déjà vidé.
      #
      # Ces jetons vivent ICI et non au thème, comme le reste des libellés de la
      # boutique : un message qui explique pourquoi un cadeau ne s'ouvre pas doit
      # rester lisible même quand le layer du bucket est en retard.
      giftcode_menu:
        fr: "Utiliser un code"
        en: "Redeem a code"
        es: "Usar un código"
        de: "Code einlösen"
        it: "Usa un codice"
        pt: "Usar um código"
        br: "Usar um código"
        nl: "Code inwisselen"
      giftcode_menu_desc:
        fr: "Un code reçu par courrier, sur une carte ou par un ami."
        en: "A code received by e-mail, on a card or from a friend."
        es: "Un código recibido por correo, en una tarjeta o de un amigo."
        de: "Ein Code per Post, auf einer Karte oder von einem Freund."
        it: "Un codice ricevuto per posta, su un biglietto o da un amico."
        pt: "Um código recebido por correio, num cartão ou de um amigo."
        br: "Um código recebido pelo correio, em um cartão ou de um amigo."
        nl: "Een code ontvangen per post, op een kaart of van een vriend."

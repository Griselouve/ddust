# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  registry:
    #//------------------------------- Dashboard (still tests) ---------------------------------------------

    dashboard:
      masks:
        - page_taskbar
      show_back: false
      block_back: true
      title: "@@@T:dashboard@@@"
      actions:
        # PAS de `- dvtuto.enter` ici (même raison que l'écran `combat`) : une liste d'actions n'est
        # pas awaitée, le tuto tournerait DONC EN PARALLÈLE de on_dashboard_appear. Il gagnait
        # systématiquement la course contre l'animation de bienvenue clan — qui ne part qu'après
        # ~1 s d'I/O (vigilance + infos du clan) — et posait son voile PAR-DESSUS la scène `burn`,
        # sur un compte neuf où la leçon `dashboard_intro` n'est pas encore vue.
        # C'est on_dashboard_appear qui appelle dvtuto.enter, une fois la bienvenue TERMINÉE.
        # Liste (et non scalaire) conservée : les listes s'unionnent entre layers, un thème peut
        # donc ajouter son action d'apparition sans écraser celle-ci.
        appear:
          - worker.on_dashboard_appear
      registry:
        - commons/splash_background

    #//------------------------------- Items Screen (id interne : testme) ----------------------

    testme:
      masks:
        - page_taskbar
      show_back: false
      block_back: true
      title: "@@@T:testme_title@@@"
      # Anti-fuite : coupe la boucle batte_swords si on quitte le combat vers cet écran
      # ET rend la musique d'ambiance (via _stopCombatSiege, gardé).
      # Écran ouvert à TOUS les joueurs : chacun y voit ses propres items. Ce qui appartient au
      # CLAN (le coffre et sa bourse) reste filtré aux seuls admins par worker._pushClanItems.
      actions:
        appear:
          - worker.on_leave_combat_tab
          - worker.on_items_appear
      registry:
        - commons/splash_background
        - items/explorer
        - items/menu

    #//------------------------------- Profile Screen ------------------------------------------

    profile:
      masks:
        - page
      title: "@@@T:profile_title@@@"
      registry:
        - first_session/logo
        - dvcloud/profile_avatar
        - dvcloud/user_email_label
        - profile/separator
        - profile/lang_label
        - profile/lang_button
        - profile/logout_button
        - profile/mydata_button

    profile/separator:
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 35%
        w: 90%
        h: 0.3%
        border: false

    profile/lang_label:
      masks:
        - commons/btn_profile
      shape:
        y: 40%
        label: "@@@T:language_label@@@"

    profile/lang_button:
      class: DvLangButton
      layer: content
      shape:
        x: 55%
        y: 40%
        w: 16%
        h: 7%
        border: false
        events:
          tap: true

    # `profile/reset_button` (→ worker.do_reset : suppression de la session régionale puis
    # logout) a été retiré du bundle de publication. C'était un outil de développement, sans
    # confirmation, qui effaçait l'onboarding du joueur d'un seul tap. L'action `worker.do_reset`
    # reste enregistrée côté worker pour les besoins de mise au point.

    profile/logout_button:
      masks:
        - commons/btn_profile
      shape:
        y: 61%
        label: "@@@T:sign_out@@@"
        events:
          tap: true
        actions:
          tap: dvcloud.do_logout

    profile/mydata_button:
      masks:
        - commons/btn_profile
      shape:
        y: 71%
        label: "@@@T:my_data@@@"
        events:
          tap: true
        actions:
          tap: worker.open_privacy

    # L'écran `dashboard2` (dev/test : do_count_sessions, do_test_messaging) a été retiré du
    # bundle de publication. Il n'était référencé nulle part dans conf.registry.orb.registry,
    # donc inatteignable, mais il partait quand même dans l'AAB.

    # L'écran `shop` a quitté ce fragment pour registry_store.yml, avec les autres écrans
    # de la boutique (abonnement, fiche produit, mes achats, clan gelé) : il n'est plus une
    # coquille « bientôt disponible » mais une liste alimentée par dvstore.


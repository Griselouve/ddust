# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  registry:
    #//------------------------------- HOME SCREEN -----------------------------------------

    # Deux portes explicites, et c'est tout l'enjeu de cet écran : un nouveau joueur traverse
    # tout l'onboarding (royaume, âge, CGU) sans que Firebase Auth ne détienne son email, son
    # nom ou sa photo — le compte Google n'est lié qu'à la fin. Un joueur existant, lui,
    # s'authentifie tout de suite. Sans cette seconde porte, toute réinstallation créerait un
    # compte anonyme jetable et tomberait dans le parcours de conflit, qui deviendrait le cas
    # nominal au lieu d'un cas de bord.
    #
    # ⚠ CET ÉCRAN N'EST PLUS LE PREMIER. Le seuil (`awake`) et l'interlude passent avant :
    #   on ne demande « nouveau ou ancien » qu'à quelqu'un qui a vu ce qu'on lui propose.
    #
    # Aucune des deux portes n'ouvre de session : la gauche entre dans le tunnel, la droite
    # authentifie un compte qui existe déjà. La session anonyme, elle, attend la confirmation
    # du royaume. Seuil, interlude, portes et royaume se jouent donc sans réseau — tout vient
    # du paquet. C'était impossible tant qu'un `signInAnonymously` gardait la porte : qui
    # ouvrait l'application dans un train voyait un message d'échec avant d'avoir vu le jeu.
    home:
      masks:
        - page
      title: "@@@T:application_name@@@"
      registry:
        - home/icon_background
        - home/connect
        - home/already_have_account
        - home/rejected_scrim
        - home/rejected_text
        - home/rejected_close
        # La scene d'accueil, montee ICI AUSSI. Elle ne se joue pas sur cet ecran :
        # elle s'y TERMINE. La bascule de page a lieu sous le rideau noir, au dernier
        # fondu (worker.on_intro_reveal) ; sans cette vue, la scene mourrait avec la
        # page qu'on quitte et le rideau ne se leverait jamais — on verrait un saut sec
        # vers un ecran deja decouvert. dvflame partage une scene entre ses vues : celle
        # qui arrive reprend celle en cours.
        - home/intro_view
        # Le rideau du passage vers le royaume (interlude `passage_region`).
        - home/depart_view

    home/icon_background:
      masks:
        - commons/icon_background
      shape:
        y: 15%
        h: 45%

    home/connect:
      masks:
        - commons/shape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 62%
        w: 90%
        h: 10%
        label: "@@@T:start_adventure@@@"
        events:
          tap: true
        freezing_actions:
          # N'OUVRE PAS LA SESSION, et ne joue plus l'interlude non plus : celui-ci est
          # passé avant, sur l'écran du seuil. Ce tap ne fait donc qu'entrer dans le
          # tunnel. La session anonyme, elle, attend la confirmation du royaume —
          # premier moment où l'application a quelque chose à demander au réseau. Tout
          # ce qui précède se joue hors ligne, ce qui était impossible tant qu'un
          # `signInAnonymously` gardait la porte.
          #
          # ⚠ UN INTERLUDE, ET PLUS UNE LIGNE DE CODE. `passage_region` fait tomber le
          #   rideau et, au moment exact où l'écran est couvert, tire lui-même
          #   `steps.navigate.region` (cf. `on_covered` au thème). Le worker portait
          #   cette orchestration ; il n'a plus rien à en savoir.
          tap: dvinterlude.play.passage_region
        # ⚠ SANS L'ANNEAU. Le gel d'une `freezing_action` peint un voile et une roue
        #   d'attente AU-DESSUS de tout — y compris du rideau qu'on vient de faire
        #   tomber. C'est ce qui rendait la transition invisible : elle se jouait
        #   derrière une roue. L'écran reste bloqué, simplement il ne le montre pas.
        freeze_ring: false

    home/already_have_account:
      masks:
        - commons/shape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 73%
        w: 90%
        h: 10%
        label: "@@@T:already_have_account@@@"
        events:
          tap: true
        freezing_actions:
          tap: dvcloud.do_login_existing

    # ⚠ PLUS DE SELECTEUR DE LANGUE ICI, ET C'EST DELIBERE. La langue se choisit
    #   maintenant au deuxieme ecran (`lang_choice`), sur sept grandes tuiles a drapeau,
    #   AVANT que l'interlude ne parle — c'est meme la raison d'etre de cet ecran. Le
    #   petit selecteur qui subsistait ici venait de l'epoque ou la question ne se posait
    #   nulle part ailleurs ; le garder revenait a reposer, en petit et en bas de page,
    #   une question a laquelle on venait de repondre en grand.
    #
    #   Il reste sur `region_screen`, ou il a un autre sens : on y change de langue apres
    #   coup, si l'on s'est trompe de tuile.

    #//---- Compte refusé (« J'ai déjà un compte » sans compte en base) ----------------------
    # Overlay de widgets invisibles→visibles — jamais de showDialog. Trois messages, deux
    # émetteurs : worker.on_account_rejected pour un compte Google valide mais inconnu de la
    # base (entrée Firebase Auth supprimée) ou un incident de lecture (rien n'a été touché) ;
    # worker.on_login_failed quand c'est le sign-in Google lui-même qui n'a pas abouti —
    # annulation, ou refus du parent sur un compte supervisé Family Link.

    home/rejected_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        background_color: "#FF000000"
        opacity: 0.8
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop

    home/rejected_text:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 34%
        h: 24%
        font_size: 14.0
        text_align: CENTER
        label: ""     # rempli à l'exécution selon la raison du refus
        visible: false

    home/rejected_close:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 62%
        label: "@@@T:link_rejected_close@@@"
        visible: false
        events:
          tap: true
        freezing_actions:
          tap: worker.on_rejected_close

    home/intro_view:
      class: DvSceneView
      layer: popup
      scene: intro
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        border: false

    #//------------------------------- AWAKE (le seuil) --------------------------------------
    # LE PREMIER ÉCRAN DU JEU. Noir, une phrase, rien d'autre — ni cadre, ni bouton, ni
    # barre de titre. On touche n'importe où et le donjon s'ouvre.
    #
    # ⚠ IL EXISTE PARCE QUE L'ACCUEIL DEMANDAIT DE CHOISIR AVANT D'AVOIR RIEN MONTRÉ.
    #   « Je suis nouveau » ou « Retrouver mon héros » : deux portes posées à quelqu'un
    #   qui ne sait pas encore de quoi on lui parle. L'interlude passe donc avant, et
    #   les portes après — quand on les présente, le joueur sait ce qu'il rejoint.
    #
    # ⚠ PAS DE BOUTON, ET C'EST LE PROPOS. Un bouton demande une décision ; ici on ne
    #   décide de rien, on franchit. Toute la surface est tapable (awake/tap), et la
    #   phrase ne fait que dire qu'il y a quelque chose de l'autre côté.
    awake:
      masks:
        - page
      show_appbar: false
      show_back: false
      block_back: true
      title: ""
      actions:
        appear: worker.on_awake_appear
      registry:
        - awake/question
        - awake/tap

    # Le fond de cet écran est le noir du masque `page` : aucun décor, rien à charger,
    # rien à attendre. C'est aussi ce qui le rend affichable à la toute première frame,
    # avant même que le moindre asset ait été résolu.
    #
    # UN DvLabel PILOTÉ À LA MAIN, et non un DvSplash. Le splash sait paraître et
    # s'effacer tout seul, ce qui était exactement ce qu'on voulait — mais il n'a
    # jamais rien affiché ici, et deux tentatives n'ont pas suffi à comprendre
    # pourquoi. Le label, lui, est le mécanisme le plus éprouvé du framework : on
    # pose `shape.label`, on appelle `refreshUI()`, et ça se voit. Le fondu est
    # refait à la main par le worker (worker.on_awake_appear), en quelques pas
    # d'opacité — c'est dix lignes, et elles marchent.
    #
    # Pas de `label` ici : la phrase change à chaque langue, c'est le worker qui la
    # pose. `opacity: 0` pour que la première n'apparaisse pas d'un coup.
    awake/question:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 8%
        y: 42%
        w: 84%
        h: 16%
        text_align: CENTER
        valign: CENTER
        font_size: 20.0
        font_family: "MedievalSharp"
        font_color: "amber_200"
        border: false
        background_color: "transparent"
        opacity: 0
        label: ""
        # Le rythme du defilement, lu par worker.on_awake_appear. `fadein`/`fadeout`
        # sont la duree TOTALE d'un fondu ; `duration` le temps de lecture entre les
        # deux. Un tour de sept langues dure environ (0,65 + 1,2 + 0,65) x 7 = 17 s.
        #
        # Point d'equilibre trouve a l'essai, entre deux exces : un premier reglage trop
        # bref, ou la phrase paraissait clignoter, et un second a 1,1 / 1,6 / 1,1 ou l'on
        # attendait visiblement devant un ecran noir. 1,2 s de pleine lecture suffit pour
        # une phrase de six mots, et le fondu lui-meme reste lisible sur la plus grande
        # partie de sa course.
        fadein: 650
        duration: 1200
        fadeout: 650

    # La surface qui reçoit le tap : invisible, plein écran, déclarée APRÈS la phrase
    # pour passer au-dessus d'elle.
    #
    # ⚠ `actions` ET NON `freezing_actions`. Le gel de dvshape est le gel VISIBLE — voile
    #   et anneau d'attente — et il s'affichait en plein sur le noir du seuil, juste avant
    #   que l'interlude ne commence : une roue de chargement en guise d'ouverture. Le
    #   double tap est déjà gardé ailleurs, par `_introPlaying` (worker), et l'interlude
    #   pose de toute façon son propre gel, celui-là transparent.
    awake/tap:
      class: DvLabel
      layer: content
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        background_color: "transparent"
        border: false
        label: ""
        events:
          tap: true
        actions:
          # ⚠ PAS D'INTERLUDE ICI. Le seuil enchaine sur le choix de la langue, et ces
          #   deux ecrans forment UN SEUL moment : le noir du seuil est deja le fond de
          #   celui des langues. Un rideau entre les deux ferait clignoter un ecran deja
          #   noir. (Un remplacement trop large avait pose `passage_suite` ici le
          #   2026-09-13 : le tap du seuil naviguait alors vers le pas courant, et
          #   l'accueil partait de travers.)
          tap: steps.navigate

    #//------------------------------- CHOIX DE LA LANGUE ------------------------------------
    # Le deuxieme ecran, et le premier qui demande quelque chose. Huit langues posees a
    # plat, drapeau et nom DANS LEUR PROPRE LANGUE — « Deutsch », jamais « Allemand » :
    # c'est la seule ecriture que le lecteur vise reconnaitra a coup sur.
    #
    # ⚠ POURQUOI ICI ET PAS AILLEURS. L'interlude parle : quatre repliques de conteur, et
    #   il faut bien savoir dans quelle langue les dire. Tant que ce choix venait apres,
    #   on jouait l'accueil en francais a tout le monde — ce qui, pour un accueil, revient
    #   a se tromper de personne des la premiere seconde. Le choix passe donc AVANT, et
    #   c'est aussi ce qui dispense le seuil d'avoir a deviner : lui ne fait que defiler.
    #
    # ⚠ LES SEPT TUILES SONT ALLUMEES DEPUIS LE 2026-09-15. Quatre sont restees eteintes
    #   tant que le corpus n'existait qu'en fr/en/es : visibles pour dire « pas encore »,
    #   inertes pour ne rien promettre. `available: false` reste le moyen de refermer une
    #   langue sans la faire disparaitre.
    lang_choice:
      masks:
        - page
      show_appbar: false
      show_back: false
      block_back: true
      title: ""
      registry:
        - lang_choice/title
        - lang_choice/en
        - lang_choice/fr
        - lang_choice/es
        - lang_choice/de
        - lang_choice/it
        - lang_choice/pt
        - lang_choice/br
        - lang_choice/nl
        - lang_choice/intro_view
        - lang_choice/intro_label

    # Le titre ne se traduit pas : il est ecrit dans les deux langues les plus probables
    # de celui qui le lit, et surtout il montre ce qu'on attend — un drapeau a toucher.
    lang_choice/title:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 6%
        y: 7%
        w: 88%
        h: 8%
        text_align: CENTER
        valign: CENTER
        font_size: 15.0
        font_family: "MedievalSharp"
        font_color: "amber_200"
        background_color: "transparent"
        label: "@@@T:lang_choice_title@@@"

    # Gabarit commun des sept tuiles : chacune ne pose que sa hauteur, son code et son nom.
    lang_choice/tile:
      class: DvLangTile
      layer: content
      shape:
        x: 18%
        w: 64%
        h: 8%
        font_size: 15.0
        font_family: "MedievalSharp"
        events:
          tap: true
        actions:
          tap: worker.on_lang_chosen

    # ⚠ HUIT TUILES DEPUIS LE 2026-09-16 : le portugais s'est scindé en deux langues,
    #   `pt` (Portugal) et `br` (Brésil). Le pas est passé de 10 % à 9 % pour tout faire
    #   tenir sous le titre ; la hauteur d'une tuile (8 %) n'a pas bougé.
    # ⚠ LES DEUX PORTUGAIS SE NOMMENT PAR LEUR PAYS, dans leur langue : « Português » seul
    #   ne dit pas à un Brésilien laquelle des deux tuiles est la sienne.
    lang_choice/en:
      masks:
        - lang_choice/tile
      shape:
        y: 17%
        code: "en"
        label: "English"
        available: true
    lang_choice/fr:
      masks:
        - lang_choice/tile
      shape:
        y: 26%
        code: "fr"
        label: "Français"
        available: true
    lang_choice/es:
      masks:
        - lang_choice/tile
      shape:
        y: 35%
        code: "es"
        label: "Español"
        available: true
    lang_choice/de:
      masks:
        - lang_choice/tile
      shape:
        y: 44%
        code: "de"
        label: "Deutsch"
        available: true
    lang_choice/it:
      masks:
        - lang_choice/tile
      shape:
        y: 53%
        code: "it"
        label: "Italiano"
        available: true
    lang_choice/pt:
      masks:
        - lang_choice/tile
      shape:
        y: 62%
        code: "pt"
        label: "Português (Portugal)"
        available: true
    lang_choice/br:
      masks:
        - lang_choice/tile
      shape:
        y: 71%
        code: "br"
        label: "Português (Brasil)"
        available: true
    lang_choice/nl:
      masks:
        - lang_choice/tile
      shape:
        y: 80%
        code: "nl"
        label: "Nederlands"
        available: true

    #//---- L'interlude d'accueil, joué après le choix de la langue --------------------------
    # La scène des quatre tableaux ne vit QUE sur cet écran, et surtout pas dans le masque
    # `page` comme les célébrations : chaque page instancie sa propre copie des shapes
    # injectées, et les quatre images seraient chargées par le dashboard, les tiroirs, le
    # combat… pour une scène qu'aucun d'eux ne joue jamais.

    lang_choice/intro_view:
      class: DvSceneView
      layer: popup
      scene: intro
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        border: false

    # Le texte du tableau courant. Rythme plus rapide que les célébrations (qui tiennent
    # 6 s) : une réplique par tableau, et le tableau ne dure que 7,3 s.
    lang_choice/intro_label:
      masks:
        - commons/levelup_label
      shape:
        y: 72%
        h: 20%
        fadein: 600
        duration: 5000
        fadeout: 700
        font_size: 19.0

    #//------------------------------- REGION SCREEN -----------------------------------

    region_screen:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:region_screen_title@@@"
      # Decor d'arrivee + replique du conteur (worker_onboarding). Purement decoratif :
      # ni garde, ni verrou, ni attente — un asset manquant se tait, et l'etape se
      # comporte exactement pareil.
      actions:
        appear: worker.on_onboarding_appear
      registry:
        - region_screen/banner
        - commons/icon_background
        - region_screen/intro_text
        - documents/region_label
        # region_confirm avant le bouton : à la reprise de session le bouton rejoue le choix
        # dès son appear, et ce rejeu allume la confirmation — qui doit donc déjà exister.
        - documents/region_confirm
        - documents/region_button
        - documents/region_menu
        # La case des serveurs d'essai : n'apparaît QUE dans un build snapshot, et
        # dvdocuments la cache de lui-même partout ailleurs (documents.arm_test_servers).
        # Elle ne change pas le pays, donc pas les CGU : seulement le datacenter.
        - documents/test_servers
        # ⚠ EN DERNIER, ET C'EST TOUT L'INTÉRÊT. L'ordre de cette liste est celui d'ajout
        #   des shapes : déclaré en tête, le rideau se peignait SOUS le décor, les
        #   libellés et les boutons — il tombait bien, mais derrière l'écran.
        - region_screen/depart_view
        #- region_screen/skip_fast_test

    region_screen/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_region_screen@@@"

    # ⚠ PLUS AUCUN SELECTEUR DE LANGUE DANS LE TUNNEL, ET C'EST LE DERNIER A PARTIR.
    #   La langue se choisit desormais au deuxieme ecran (`lang_choice`), sur sept
    #   grandes tuiles a drapeau, AVANT que le conteur ne parle — c'est la raison d'etre
    #   de cet ecran. Les deux petits selecteurs qui subsistaient ensuite (ici et sur
    #   `home`) reposaient en bas de page, et en petit, une question deja tranchee en
    #   grand : de quoi faire douter qu'on y ait repondu.
    #
    #   Se tromper de tuile reste rattrapable : la langue se change dans les reglages,
    #   ou en relancant une application qui n'a encore rien ecrit nulle part.

    region_screen/intro_text:
      masks:
        - commons/intro_text
      shape:
        label: "@@@T:game_intro_text@@@"

    # Entre le bouton des royaumes (64 %) et le bouton de confirmation (85 %) : la bande
    # est libre, et la case n'existe de toute façon que dans un build de test.
    documents/test_servers:
      masks:
        - commons/nobordershape
      shape:
        y: 74%
        text_align: LEFT

    documents/region_label:
      masks:
        - commons/label_label
      shape:
        y: 59%
        label: "@@@T:region_label@@@"

    # Bouton de choix du royaume : vide au départ (« Consulter la carte... »), il porte ensuite
    # le drapeau et le nom du royaume. Cadre donjon, comme le kebab de l'écran Personnage.
    documents/region_button:
      button_style: commons/donjon_button
      shape:
        x: 5%
        w: 90%
        y: 64%
        h: 7%
        icon_size: 30.0
        empty_label: "@@@T:region_select_label@@@"
        # Le bouton porte le choix deja fait : il se lit comme la ligne du menu ou on l'a
        # pris. Meme clef, meme regle.
        icon_side: right

    # Popup des royaumes : la largeur du bouton qui l'ouvre.
    documents/region_menu:
      shape:
        w: 90%
        # ⚠ LE DRAPEAU A DROITE. Place AVANT le libelle, il le QUALIFIE — « [drapeau EU]
        #   France » se lit « la France europeenne », et comme ce drapeau n'est pas celui
        #   du pays nomme, cela saute aux yeux comme une erreur : on croit que quelqu'un
        #   s'est trompe de drapeau. Place APRES, il precise : « France - serveurs EU
        #   [drapeau] ».
        #
        #   Ce drapeau designe le DATACENTER, jamais le pays : il n'existe pas de drapeau
        #   pour « eu », et en dessiner un serait inventer un pays.
        icon_side: right

    documents/region_confirm:
      masks:
        - commons/dark_button
      shape:
        x: 5%
        y: 85%
        w: 90%
        h: 7%
        label: "@@@T:region_confirm@@@"
        # Cf. `home/connect` : le gel reste, seule sa peinture part — la roue d'attente
        # recouvrirait le rideau.
        freeze_ring: false
        # Même détournement que pour l'âge : l'interlude rappelle `do_region_confirm`
        # une fois l'écran couvert. Ce qui suit est le premier appel réseau du parcours,
        # et il se fait donc derrière un noir plutôt que devant un bouton enfoncé.
        events:
          tap: true
        freezing_actions:
          tap: dvinterlude.play.passage_royaume

    # region_screen/skip_fast_test:
      # class: DvLabel
      # layer: content
      # shape:
        # x: 70%
        # y: 2%
        # w: 25%
        # h: 5%
        # label: "@@@T:skip_fast_test@@@"
        # text_align: CENTER
        # events:
          # tap: true
        # freezing_actions:
          # tap: worker.on_fast_test_skip

    #//------------------------------- PLAYER NAME SCREEN ----------------------------------

    # Formulaire complet (commons/inspireform_*, comme create_clan) : nom + description +
    # « Inspire moi ». L'inspiration rend en UN appel le nom et la description du personnage ET
    # leurs substituts, qui deviennent l'identité visible hors du clan — jamais affichés ici.
    player_name_screen:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:player_name_screen_title@@@"
      keyboard_scrollable: true
      actions:
        # Le handler metier D'ABORD, le decor ensuite : une liste d'actions n'est
        # pas attendue une par une, et ce qui remplit l'ecran ne doit pas courir
        # derriere ce qui l'habille (worker.on_onboarding_appear).
        appear:
          - worker.on_player_name_appear
          - worker.on_onboarding_appear
      registry:
        - player_name_screen/banner
        - player_name_screen/icon_background
        - player_name_screen/name_label
        - player_name_screen/name
        - player_name_screen/desc_label
        - player_name_screen/desc
        - player_name_screen/inspire
        - player_name_screen/replay
        - player_name_screen/confirm
        - player_name_screen/depart_view

    player_name_screen/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_player_name_screen@@@"

    player_name_screen/icon_background:
      masks:
        - commons/inspireform_bg

    player_name_screen/name_label:
      masks:
        - commons/inspireform_name_label
      shape:
        label: "@@@T:player_name_label@@@"

    player_name_screen/name:
      masks:
        - commons/inspireform_name
      shape:
        actions:
          changed: worker.on_player_name_changed

    player_name_screen/desc_label:
      masks:
        - commons/inspireform_desc_label
      shape:
        label: "@@@T:player_description_label@@@"

    player_name_screen/desc:
      masks:
        - commons/inspireform_desc
      shape:
        actions:
          changed: worker.on_player_name_desc_changed

    player_name_screen/inspire:
      masks:
        - commons/inspireform_inspire
      shape:
        freezing_actions:
          tap: worker.on_inspire_player_name

    player_name_screen/replay:
      masks:
        - commons/inspireform_replay
      shape:
        freezing_actions:
          tap: worker.on_replay_player_name

    player_name_screen/confirm:
      masks:
        - commons/inspireform_confirm
      shape:
        label: "@@@T:player_name_confirm@@@"
        freezing_actions:
          tap: dvinterlude.play.passage_suite

    #//------------------------------- AGE SCREEN -----------------------------------

    age_screen:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:age_screen_title@@@"
      # Decor d'arrivee + replique du conteur (worker_onboarding). Purement decoratif :
      # ni garde, ni verrou, ni attente — un asset manquant se tait, et l'etape se
      # comporte exactement pareil.
      actions:
        appear: worker.on_onboarding_appear
      registry:
        - age_screen/banner
        - commons/icon_background
        - age_screen/intro_text
        - documents/birthday_label
        - documents/birthday_date
        - documents/age_confirm
        # En dernier : cf. `region_screen`.
        - age_screen/depart_view
        #- age_screen/skip_fast_test

    age_screen/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_age_screen@@@"

    age_screen/intro_text:
      masks:
        - commons/intro_text
      shape:
        label: "@@@T:age_intro_text@@@"

    documents/birthday_label:
      masks:
        - commons/label_label
      shape:
        y: 60%
        label: "@@@T:birthday_label@@@"

    documents/birthday_date:
      masks:
        - commons/shape
      shape:
        x: 5%
        w: 90%
        y: 65%
        h: 7%
        date: "2000-06-15"
        events:
          change: true
        actions:
          change: documents.on_birthdate_changed

    documents/age_confirm:
      masks:
        - commons/dark_button
      shape:
        x: 5%
        w: 90%
        y: 85%
        h: 7%
        label: "@@@T:confirm@@@"
        # Cf. `home/connect`.
        freeze_ring: false
        # ⚠ ON DETOURNE L'ACTION DU MODULE VERS UN INTERLUDE, qui la rappellera lui-même
        #   une fois l'écran couvert (`passage_age.on_covered` → `documents.do_confirm`).
        #   La validation de la date reste entièrement chez dvdocuments : on n'intercale
        #   qu'un rideau, et on ne touche à rien d'autre.
        events:
          tap: true
        freezing_actions:
          tap: dvinterlude.play.passage_age

    # age_screen/skip_fast_test:
      # class: DvLabel
      # layer: content
      # shape:
        # x: 70%
        # y: 2%
        # w: 25%
        # h: 5%
        # label: "@@@T:skip_fast_test@@@"
        # text_align: CENTER
        # events:
          # tap: true
        # freezing_actions:
          # tap: worker.on_fast_test_skip

    #//------------------------------- PARENTAL GATE SCREEN ----------------------------------

    parentalgate_screen:
      masks:
        - page
      show_appbar: true
      title: "@@@T:parentalgate_title@@@"
      # La replique du conteur, et RIEN D'AUTRE : pas de voile, pas d'etincelles. Cet
      # ecran est un controle chronometre — l'habiller reviendrait a distraire de la
      # seule chose qui s'y passe.
      actions:
        appear: worker.on_screen_voice
      registry:
        - parentalgate_screen/icon_background

    parentalgate_screen/icon_background:
      masks:
        - commons/icon_background
      shape:
        y: 10%
        h: 35%

    parentalgate/instruction:
      masks:
        - commons/intro_text
      shape:
        y: 10%
        h: 35%

    parentalgate/expression:
      shape:
        x: 5%
        y: 50%
        w: 72%
        h: 8%

    parentalgate/countdown:
      shape:
        x: 80%
        y: 50%
        w: 15%
        h: 8%

    parentalgate/answer_display:
      shape:
        x: 5%
        y: 60%
        w: 90%
        h: 7%

    parentalgate/numpad:
      shape:
        x: 5%
        y: 69%
        w: 90%
        h: 29%
        show_ok: false
        show_back: false

    #//------------------------------- DOCUMENTS ACCEPTANCE SCREEN ----------------------------

    documents_acceptance_screen:
      masks:
        - page
      show_appbar: true
      title: "@@@T:documents_acceptance_title@@@"
      # « Lis attentivement les conditions » — dit une fois, a l'arrivee. Aucun decor
      # ici non plus, et pour une raison plus forte encore qu'ailleurs : c'est l'ecran
      # ou le joueur engage sa signature.
      #
      # ⚠ CET ECRAN N'EST PAS RESERVE A L'ONBOARDING. Toute nouvelle version de document
      #   le repose a tout le monde au lancement suivant : la replique se fera donc aussi
      #   entendre a un joueur de longue date. C'est acceptable — elle dit exactement ce
      #   qu'il convient de faire dans ce cas-la aussi.
      actions:
        # La replique, ET le lever du rideau : cet ecran arrive derriere le noir pose
        # par `age_screen`, et il est le seul du tunnel a ne pas porter le masque
        # `page_onboarding` — donc a ne pas avoir la scene `arrive` qui s'en charge
        # ailleurs. Sans cela, il paraitrait d'un coup au milieu d'un fondu.
        appear: worker.on_acceptance_appear
      registry:
        - commons/arrive_view
        - documents/acceptance_title
        - documents/acceptance_content
        - documents/acceptance_hint
        - documents/acceptance_checkbox
        # Autorisation de transfert international. Déclarée pour TOUS les royaumes, affichée
        # par dvdocuments seulement là où le marché porte `transfer: true` au catalogue de
        # régions — aujourd'hui aucun, puisque `fr` vit dans le cloud `eu`. La France ne voit
        # donc rien changer, et le jour où un marché servi depuis un datacenter lointain
        # s'ouvre, la case est déjà là. Ne PAS la retirer sous prétexte qu'elle ne s'affiche
        # nulle part : sans elle, le module journalise un warning et ne demande RIEN.
        - documents/acceptance_transfer
        - documents/acceptance_accept
        - commons/pacte_view

    documents/acceptance_title:
      masks:
        - commons/nobordershape

    documents/acceptance_hint:
      masks:
        - commons/nobordershape

    documents/acceptance_checkbox:
      masks:
        - commons/nobordershape
      shape:
        text_align: LEFT

    documents/acceptance_transfer:
      masks:
        - commons/nobordershape
      shape:
        text_align: LEFT

    documents/acceptance_accept:
      masks:
        - commons/dark_button

    #//------------------------------- KID ASSENT SCREEN --------------------------------------
    # L'avis du mineur, recueilli AVANT toute écriture (session encore anonyme, rien sur le
    # disque) et AVANT la décision de son parent : c'est l'enfant qui parle le premier, sa
    # réponse voyage ensuite jusqu'au parent (kid_assent_share). Cf. le commentaire du pas
    # `kid_assent_screen` dans steps.yml pour le fondement juridique.
    #
    # UNE SEULE QUESTION : « as-tu envie de jouer ? ». La seconde (« c'est toujours ce que tu
    # veux ? »), posée quand une invitation attendait déjà (lien ouvert application fermée), a
    # disparu le 2026-09-22 : chaque oui crée une demande à code neuf (worker.kid_assent_route),
    # et une invitation reçue avant ce oui ne peut pas y répondre. Elle est refusée, et l'écran
    # de partage dit pourquoi.
    #
    # L'écran POSE UNE QUESTION. Un simple « Continuer » ne rendrait compte de rien : le texte
    # doit interroger l'enfant et le bouton doit être sa réponse, pas un accusé de lecture.
    # D'où le libellé « Oui, je pars à l'aventure ! » et non « Continuer ».
    #
    # Pas de bouton « Non » : décliner n'a rien à écrire, et un refus enregistré serait
    # justement une donnée collectée sur un enfant qui n'a pas consenti. Ne pas valider EST
    # la réponse négative. La flèche existe pour qu'il ne soit pas coincé — pas d'appbar ici,
    # le pas précédent navigue en `reset` et il n'y aurait donc rien à dépiler.

    kid_assent_screen:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:kid_assent_title@@@"
      # La question d'abord (le metier), la replique du conteur ensuite (le decor) : une liste
      # d'actions n'est pas attendue une par une, et ce qui remplit l'ecran ne doit pas courir
      # derriere ce qui l'habille.
      actions:
        appear:
          - worker.on_kid_assent_appear
          - worker.on_onboarding_appear
      registry:
        - kid_assent_screen/banner
        - commons/icon_background
        - kid_assent/back
        - kid_assent/question
        - kid_assent/go
        - kid_assent_screen/depart_view

    kid_assent_screen/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_kid_assent_screen@@@"

    # Flèche retour explicite : renvoie aux documents (route `back` du pas). Discrète, en haut
    # à gauche, hors du chemin du bouton principal.
    kid_assent/back:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 4%
        # Descendu de 2 % à 7 % : la bande haute appartient désormais au bandeau de
        # chapitre, injecté sur les huit écrans du tunnel. Cet écran n'a pas d'appbar,
        # sa flèche y était donc seule — elle ne l'est plus.
        y: 7%
        w: 30%
        h: 5%
        text_align: LEFT
        font_size: 13.0
        label: "@@@T:kid_assent_back@@@"
        events:
          tap: true
        actions:
          tap: steps.navigate.back

    kid_assent/question:
      masks:
        - commons/intro_text
      shape:
        y: 22%
        h: 34%
        font_size: 17.0
        label: "@@@T:kid_assent_question@@@"

    kid_assent/go:
      masks:
        - commons/btn_wide
      shape:
        y: 70%
        h: 12%
        text_align: CENTER
        label: "@@@T:kid_assent_go@@@"
        events:
          tap: true
        freezing_actions:
          tap: dvinterlude.play.passage_assent

    #//------------------------------- JOIN WAIT ---------------------------------------------
    # L'ADHÉSION EN ATTENTE (2026-09-22). Le candidat, enfant ou adulte, est connecté et a
    # accepté l'invitation ; c'est au chef de confirmer son arrivée, en publiant le secret du
    # clan, et le jeu du chef peut être fermé. L'attente vit en base (users.pending_join) : le
    # joueur peut fermer le jeu, on_login le ramène ici, et worker.on_join_wait_appear reprend
    # la vigilance du secret. L'admission se fait d'elle-même, sans rien toucher.
    #
    # « J'abandonne » vide l'attente : l'enfant repart de sa question (kid_assent_screen),
    # l'adulte du choix du clan. Pas de flèche retour : la page est posée en `reset`, et le
    # seul autre chemin de sortie est ce bouton.
    join_wait:
      masks:
        - page
      show_appbar: true
      title: "@@@T:join_wait_title@@@"
      # ⚠ `actions` A LA RACINE : c'est de la racine que l'appear d'une PAGE est tire.
      actions:
        appear: worker.on_join_wait_appear
      registry:
        - commons/icon_background
        - join_wait/text
        - join_wait/giveup

    join_wait/text:
      masks:
        - commons/intro_text
      shape:
        y: 22%
        h: 34%
        font_size: 17.0
        label: "@@@T:join_wait_text@@@"

    join_wait/giveup:
      masks:
        - commons/btn_wide
      shape:
        y: 72%
        h: 10%
        text_align: CENTER
        label: "@@@T:join_wait_giveup@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_join_wait_giveup

    #//------------------------------- KID ASSENT SHARE -------------------------------------
    # La réponse de l'enfant, À TRANSMETTRE. Le oui vient d'être donné ; c'est au parent de
    # décider, et il ne peut le faire que s'il le reçoit. Deux façons :
    #   * le QR code, que le parent scanne avec « Accueillir un enfant » (menu du clan) quand
    #     il est à côté ;
    #   * le même lien, envoyé par le partage du téléphone quand il est loin.
    # Puis l'invitation du parent revient ICI : QR code du clan à scanner, ou lien et code.
    #
    # ⚠ RIEN N'EST ÉCRIT SUR CET ÉCRAN, ni en base ni sur le disque. Le QR code ne porte aucune
    #   donnée personnelle (date, langue, royaume, texte montré, version des conditions, et un
    #   code tiré au hasard : cf. worker._buildKidAssentLink), et une invitation valide ne fait
    #   que mener à la connexion Google. On ne rejoint le clan qu'après, sous le compte définitif.
    #
    # UNE INVITATION VALIDE, c'est une invitation « enfant » qui porte le code affiché ici
    # (worker._inviteKindRefusal). Une invitation « adulte », ou faite pour une autre demande,
    # est refusée sur place, avec un message sous le bouton d'envoi.
    #
    # Pas de flèche retour : le oui est donné, revenir sur la question n'a pas de sens, et
    # fermer l'application suffit à tout oublier.
    kid_assent_share:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:kid_assent_share_title@@@"
      # ⚠ `actions` A LA RACINE : c'est de la racine que l'appear d'une PAGE est tire.
      actions:
        appear: worker.on_kid_assent_share_appear
      registry:
        - kid_assent_share/banner
        - kid_assent_share/intro
        - kid_assent_share/qrcode
        - kid_assent_share/code
        - kid_assent_share/send
        - kid_assent_share/error
        - kid_assent_share/scan
        - kid_assent_share/pin
        - kid_assent_share/notice

    kid_assent_share/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_kid_assent_share@@@"

    kid_assent_share/intro:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 6%
        w: 90%
        h: 11%
        font_size: 13.0
        text_align: CENTER
        label: "@@@T:kid_assent_share_intro@@@"

    # Contenu posé à l'exécution (worker.on_kid_assent_share_appear) : le lien du oui n'existe
    # qu'une fois l'enfant ayant répondu.
    # Hauteur ramenée de 34 % à 28 % (2026-09-22) pour loger le code dessous. Le QR code est
    # carré et c'est sa largeur (60 %) qui le borne sur un téléphone en portrait : il ne
    # rapetisse pas.
    kid_assent_share/qrcode:
      class: DvQrCode
      layer: content
      shape:
        x: 20%
        y: 18%
        w: 60%
        h: 28%
        content: ""

    # Le code de la demande, EN GRAND (« Ton code : K7F2QX »), posé par
    # worker.on_kid_assent_share_appear. Le parent le retrouve en tête de sa déclaration
    # (invite_consent_screen/assent) et compare d'un coup d'œil : c'est ce code que son
    # invitation portera, et l'appareil de l'enfant refuse toute invitation qui ne le porte pas.
    # Entre le QR code (18 % → 46 %) et le bouton d'envoi (53 %).
    kid_assent_share/code:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 46%
        w: 90%
        h: 6.5%
        font_size: 22.0
        text_align: CENTER
        label: ""

    kid_assent_share/send:
      masks:
        - commons/dark_button
      class: DvLabel
      layer: content
      shape:
        x: 15%
        y: 53%
        w: 70%
        h: 7%
        label: "@@@T:kid_assent_share_send@@@"
        events:
          tap: true
        # Par le worker, et non share.kid_assent en direct : le lien porte le code de la
        # demande, qui n'est posé dans le dictionnaire que le temps du partage.
        freezing_actions:
          tap: worker.on_kid_assent_send

    # Message d'erreur (code scanné qui n'est pas une invitation, invitation d'une autre
    # contrée, faite pour un adulte, ou qui ne porte pas le code de cette demande). Invisible
    # par défaut, révélé par le worker : jamais de fenêtre modale.
    kid_assent_share/error:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 61%
        w: 90%
        h: 8%
        label: ""
        text_align: CENTER
        font_size: 12.0
        font_color: "0xFFCC4444"
        visible: false

    kid_assent_share/scan:
      masks:
        - commons/btn_wide
      shape:
        y: 70%
        h: 9%
        text_align: CENTER
        label: "@@@T:kid_assent_share_scan@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_kid_scan_invite

    # Invitation à distance : lien reçu + code dicté par le parent (même écran de saisie que
    # « Je n'ai pas le QR code » de l'adulte).
    kid_assent_share/pin:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 15%
        y: 80%
        w: 70%
        h: 5%
        text_align: CENTER
        label: "@@@T:kid_assent_share_pin@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_no_qr

    # Ce qui attend l'enfant juste après : la connexion Google, et l'autorisation d'un parent
    # si le compte est supervisé. Le dire ICI, pendant que le parent est peut-être encore à
    # côté, plutôt que de le découvrir devant un bouton qui ne peut pas marcher.
    kid_assent_share/notice:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 86%
        w: 90%
        h: 12%
        font_size: 11.0
        text_align: CENTER
        label: "@@@T:join_clan_google_notice@@@"

    #//------------------------------- LINK ACCOUNT SCREEN ------------------------------------
    # Dernière étape de l'onboarding et PREMIÈRE écriture en base : jusqu'ici tout s'est passé
    # en session anonyme, en mémoire. Écran bloquant (pas d'appbar, donc pas de retour, et aucun
    # bouton « plus tard ») : sans compte lié, le héros ne survivrait ni à une réinstallation ni
    # à un changement d'appareil. L'adulte y arrive après les CGU, le mineur une fois
    # l'invitation de son parent en main (QR du clan scanné, ou lien et code), et AVANT d'entrer
    # dans le clan : l'acceptation part ensuite, sous le compte définitif (worker.on_login).

    link_account_screen:
      masks:
        - page_onboarding
      show_appbar: false
      title: "@@@T:link_account_title@@@"
      # ⚠ PAS DE `on_onboarding_appear` ICI, ET C'EST DELIBERE. Cette action ne sert plus
      #   qu'a dire la replique du conteur — le decor, lui, part tout seul avec la scene
      #   `arrive` (`autostart`). Or cet ecran doit rester MUET : l'interlude du pacte,
      #   qui le precede immediatement, vient de dire « Tu peux maintenant entrer dans le
      #   donjon ! ».
      #
      #   Le laisser ferait rejouer `intro/voices/link_account_screen_*.mp3` — un fichier
      #   qu'on ne genere plus, mais qui SURVIT DANS LE CACHE des installations
      #   existantes, avec son ancien texte et son ancienne voix. C'est exactement ce qui
      #   s'entendait encore le 2026-09-13 : « Un heros sans pacte se perd au premier
      #   changement de telephone », dit par un moteur de synthese abandonne depuis.
      actions:
        appear: worker.on_link_account_appear
      registry:
        - link_account_screen/banner
        - link_account/background
        - link_account/title
        - link_account/notice
        - link_account/google_button
        - link_account/google_icon
        - link_account/error
        - link_account/conflict_scrim
        - link_account/conflict_text
        - link_account/conflict_confirm
        - link_account/conflict_cancel

    link_account_screen/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_link_account_screen@@@"

    link_account/background:
      masks:
        - commons/icon_background
      shape:
        y: 8%
        h: 32%

    link_account/title:
      masks:
        - commons/intro_text
      shape:
        y: 43%
        h: 8%
        label: "@@@T:link_account_title@@@"

    # L'écran est bloquant, et il N'EST PLUS REPRENABLE : rien n'est écrit avant la connexion,
    # un kill ramène donc au tout premier écran. Le dire, et dire aussi ce qui peut bloquer un
    # enfant (compte supervisé Family Link), sinon il s'acharne sur un bouton qui ne peut pas
    # marcher.
    link_account/notice:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 52%
        w: 90%
        h: 10%
        font_size: 11.0
        label: "@@@T:link_account_notice@@@"

    link_account/google_button:
      masks:
        - commons/btn_wide
      shape:
        y: 78%
        label: "@@@T:link_account_google@@@"
        events:
          tap: true
        freezing_actions:
          tap: dvcloud.do_link_account

    # Logo Google, posé DANS le bouton : commons/btn_wide est un DvLabel, il n'a pas de
    # gouttière d'icône réservée. Aucun event déclaré ici, donc aucun GestureDetector n'est
    # construit et le tap traverse jusqu'au bouton. Déclaré après lui pour passer dessus.
    link_account/google_icon:
      class: DvLabel
      layer: content
      shape:
        x: 10%
        y: 80.5%
        w: 9%
        h: 5%
        label: ""
        border: false
        image: "assets/icon/google.png"
        stretch: RATIO_IN

    # Remonté AU-DESSUS du bouton et agrandi : à y:89% h:9% il ne tenait qu'une ligne, et le
    # message d'échec en fait plusieurs (il doit parler de l'autorisation parentale). La bande
    # 62→78% était libre entre le titre et le bouton, et l'explication y est mieux placée —
    # juste au-dessus du bouton qu'on redemande d'appuyer. Le bouton, lui, ne bouge pas.
    link_account/error:
      masks:
        - commons/btn_wide
      shape:
        y: 62.5%
        h: 15%
        font_size: 11.0
        label: ""
        visible: false

    #//---- Conflit : le compte Google porte déjà un héros ----------------------------------
    # Overlay de widgets invisibles→visibles, idiome commons/death_* : jamais de showDialog.
    # Adoption possible, pour l'adulte comme pour le mineur : rien n'a encore été écrit sous
    # l'uid anonyme. (Le blocage pur, seul conflict_cancel révélé, ne sert plus que de filet :
    # il protégeait un mineur admis dans un clan avant de se connecter, cas disparu.)

    link_account/conflict_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        background_color: "#FF000000"
        opacity: 0.85
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop


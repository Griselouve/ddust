# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  registry:
    #//------------------------------- NEW OR PICK CLAN SCREEN ----------------------------

    new_or_pick_clan:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:new_or_pick_clan_title@@@"
      # Decor d'arrivee + replique du conteur (worker_onboarding). Purement decoratif :
      # ni garde, ni verrou, ni attente — un asset manquant se tait, et l'etape se
      # comporte exactement pareil.
      # Le metier D'ABORD (message d'une attente abandonnee ou expiree), le decor ensuite :
      # une liste d'actions n'est pas attendue une par une.
      actions:
        appear:
          - worker.on_new_or_pick_clan_appear
          - worker.on_onboarding_appear
      registry:
        - new_or_pick_clan/banner
        - new_or_pick_clan/icon_background
        - new_or_pick_clan/notice
        - new_or_pick_clan/join
        - new_or_pick_clan/create
        - new_or_pick_clan/confirm_scrim
        - new_or_pick_clan/confirm_panel
        - new_or_pick_clan/confirm_scan
        - new_or_pick_clan/confirm_yes
        - new_or_pick_clan/confirm_no
        - new_or_pick_clan/depart_view

    new_or_pick_clan/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_new_or_pick_clan@@@"

    new_or_pick_clan/icon_background:
      masks:
        - commons/icon_background
      shape:
        y: 18%

    # Message d'une adhésion qui n'a pas abouti, côté adulte : worker._joinNotice, révélé une fois
    # par worker.on_new_or_pick_clan_appear.
    # Invisible par défaut, jamais de fenêtre modale. Sous le bandeau de chapitre (0,5 → 5 %),
    # au-dessus de l'icône de fond (18 %) et hors de la zone des illustrations dvpops (35 → 59 %).
    new_or_pick_clan/notice:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 6%
        w: 90%
        h: 11%
        label: ""
        text_align: CENTER
        visible: false

    new_or_pick_clan/join:
      masks:
        - commons/btn_wide
      shape:
        y: 60%
        h: 15%
        label: "@@@T:join_clan@@@"
        events:
          tap: true
        freezing_actions:
          tap: dvinterlude.play.passage_join

    new_or_pick_clan/create:
      masks:
        - commons/btn_wide
      shape:
        y: 80%
        h: 15%
        label: "@@@T:create_clan_btn@@@"
        events:
          tap: true
        actions:
          tap: worker.on_ask_create_clan

    # Overlay de confirmation « Créer un clan » — invisible par défaut, révélé par worker.on_ask_create_clan
    # (même idiome que l'overlay de mort commons/death_* : layer: overlay + visible: false + scrim worker.noop).
    # Listé APRÈS create → rendu au-dessus des deux boutons.
    new_or_pick_clan/confirm_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop # avale les taps derrière le panneau

    # y: 4% — HAUT de l'écran, et non le milieu : dvpops attache ses illustrations en `layer: popup`,
    # peint APRÈS `overlay` (cf. l'ordre de page.layers), donc l'elfe et le chevalier passent
    # par-dessus le voile ET le texte. Ils occupent 35→59 % (pick/illus_*) : le panneau doit rester
    # au-dessus de 35 % pour rester lisible.
    new_or_pick_clan/confirm_panel:
      class: DvLabel
      layer: overlay
      shape:
        x: 8%
        y: 4%
        w: 84%
        h: 30%
        text_align: CENTER
        # 14 et non 16 : le message dit désormais la CONSÉQUENCE (un seul clan par foyer, définitif)
        # et non plus une simple politesse — il est plus long. Le plafond reste 35 % : dvpops attache
        # l'elfe et le chevalier à partir de là, en layer popup, donc par-dessus ce panneau.
        # DvLabel se rend via DvImageView, qui enveloppe TOUT le widget (texte compris) dans un
        # Opacity : ce 0.6 n'est pas décoratif, il reproduit celui que confirm_yes/confirm_no
        # héritent de commons/shape. Sans lui, la question sort en or vif et les boutons en or
        # éteint — deux jaunes pour un seul token amber_200.
        border: false
        label: "@@@T:confirm_create_clan_msg@@@"
        visible: false

    # Trois boutons, et l'ORDRE est le message. La sortie « quelqu'un l'a déjà créé » vient EN
    # PREMIER : c'est le seul garde-fou contre le clan en double, qui est irréparable une fois
    # commis (aucune action « quitter le clan », fondateur admin à vie, multi-clan post-lancement).
    # L'ancienne version se contentait de demander « quelqu'un n'en a-t-il pas déjà créé un ? » et
    # renvoyait, sur « non », vers un écran qui ne proposait rien d'autre — une question à la place
    # d'une issue.
    new_or_pick_clan/confirm_scan:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 56%
        h: 12%
        text_align: CENTER
        label: "@@@T:confirm_create_scan@@@"
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_create_clan_goto_join

    new_or_pick_clan/confirm_yes:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 70%
        h: 12%
        text_align: CENTER
        label: "@@@T:confirm_create_yes@@@"
        visible: false
        events:
          tap: true
        actions:
          tap: dvinterlude.play.passage_creation

    new_or_pick_clan/confirm_no:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 84%
        h: 10%
        text_align: CENTER
        label: "@@@T:confirm_create_no@@@"
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_cancel_create_clan

    #//------------------------------- CREATE CLAN SCREEN ----------------------------------

    create_clan:
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:create_clan_screen_title@@@"
      keyboard_scrollable: true
      actions:
        # Le handler metier D'ABORD, le decor ensuite : une liste d'actions n'est
        # pas attendue une par une, et ce qui remplit l'ecran ne doit pas courir
        # derriere ce qui l'habille (worker.on_onboarding_appear).
        appear:
          - worker.on_create_clan_appear
          - worker.on_onboarding_appear
      registry:
        - create_clan/banner
        - create_clan/icon_background
        - create_clan/name_label
        - create_clan/name
        - create_clan/desc_label
        - create_clan/desc
        - create_clan/inspire
        - create_clan/replay
        - create_clan/confirm
        - create_clan/depart_view

    create_clan/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_create_clan@@@"

    create_clan/icon_background:
      masks:
        - commons/inspireform_bg

    create_clan/name_label:
      masks:
        - commons/inspireform_name_label
      shape:
        label: "@@@T:clan_name_label@@@"

    create_clan/name:
      masks:
        - commons/inspireform_name
      shape:
        actions:
          changed: worker.on_create_clan_name_changed

    create_clan/desc_label:
      masks:
        - commons/inspireform_desc_label
      shape:
        label: "@@@T:clan_description_label@@@"

    create_clan/desc:
      masks:
        - commons/inspireform_desc
      shape:
        actions:
          changed: worker.on_create_clan_desc_changed

    create_clan/inspire:
      masks:
        - commons/inspireform_inspire
      shape:
        freezing_actions:
          tap: worker.on_inspire_clan

    create_clan/replay:
      masks:
        - commons/inspireform_replay
      shape:
        freezing_actions:
          tap: worker.on_replay_clan

    create_clan/confirm:
      masks:
        - commons/inspireform_confirm
      shape:
        label: "@@@T:create_clan_confirm@@@"
        freezing_actions:
          tap: dvinterlude.play.passage_suite

    #//------------------------------- DECISIONTREE SCREEN ------------------------------------

    decisiontree:
      class: DvDecisionTree
      masks:
        - page_onboarding
      show_appbar: true
      title: "@@@T:decisiontree_title@@@"
      questions_asset: "configs/decisiontree.yml"
      default: keep
      exhaustive_blacklist: false
      exhaustive_whitelist: false
      options_shape:
        border: true
        text_align: CENTER
      registry:
        - decisiontree/banner
        - decisiontree/icon_background
        - decisiontree/intro
        - decisiontree/options
        - decisiontree/depart_view
      # ⚠ A LA RACINE, ET NON SOUS `shape:`. Une PAGE resout ses actions par
      #   `DvView._resolveActions()`, qui lit `get("actions")` — un `shape.actions` y est
      #   purement ignore, sans erreur ni avertissement. `freezing_actions`, juste en
      #   dessous, reste sous `shape:` : il est traite par DvShape, et celui-la y trouve
      #   bien son compte.
      actions:
        appear: worker.on_onboarding_appear
      shape:
        freezing_actions:
          done: dvinterlude.play.passage_quete

    decisiontree/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_decisiontree@@@"

    decisiontree/icon_background:
      masks:
        - commons/icon_background
      shape:
        y: 40%
        #h: 35%

    decisiontree/intro:
      shape:
        border: true
        y: 5%
        h: 30%

    #//------------------------------- THEME PICK SCREEN (fondateur) --------------------------
    # L'AMBIANCE DU CLAN, choisie par son fondateur juste après la quête et avant le dashboard
    # (pas `decisiontree`, routeur worker.decisiontree_route). Celui qui REJOINT un clan n'y
    # passe jamais : il suit le thème du clan (worker_store._syncClanTheme, vigilance).
    #
    # L'écran vit dans le thème COURANT de l'appareil (celui de l'onboarding, donjon le plus
    # souvent) : habillé par theme-donjon-global.yml et par la couche dino.
    #
    # Deux grandes cartes empilées, chacune sur toute la largeur : l'image de vitrine du thème,
    # son nom et une phrase. Un tap n'importe où sur une carte (cadre, image, nom, phrase :
    # chacun porte l'action, pour qu'aucun libellé n'avale le tap) choisit le thème
    # (worker.on_theme_pick_donjon / on_theme_pick_dino) : message bref, `clan_owned` sync puis
    # enable, bascule de l'appareil sous le rideau du thème choisi, puis le dashboard, où la
    # bienvenue du clan se joue. Échec réseau : message bref, l'écran reste, on peut retaper.
    #
    # PAS DE SORTIE SANS CHOISIR, ET PAS DE RETOUR : on arrive ici en `reset` (rien à dépiler),
    # la flèche et le bouton retour du système sont coupés.
    #
    # Les deux images vivent dans `general` (vitrines.py, build_assets.yml étape
    # `vitrines_themes`) : l'écran s'affiche avant que la racine du thème non actif ne soit
    # téléchargée, et elles sont les mêmes quel que soit le thème courant, d'où leur place ici
    # et non dans les couches de thème.
    theme_pick_page:
      masks:
        - page_onboarding
      show_appbar: true
      show_back: false
      block_back: true
      title: "@@@T:theme_pick_title@@@"
      registry:
        - theme_pick_page/banner
        - theme_pick_page/donjon_card
        - theme_pick_page/donjon_image
        - theme_pick_page/donjon_title
        - theme_pick_page/donjon_text
        - theme_pick_page/note
        - theme_pick_page/dino_card
        - theme_pick_page/dino_image
        - theme_pick_page/dino_title
        - theme_pick_page/dino_text

    theme_pick_page/banner:
      masks:
        - commons/onboarding_banner
      shape:
        label: "@@@T:chapter_theme_pick@@@"

    # --- Gabarits (habillés par les couches de thème) ---
    # Le cadre de la carte.
    theme_pick_page/card:
      class: DvLabel
      layer: content
      shape:
        x: 4%
        w: 92%
        h: 40%
        label: ""
        border: true
        events:
          tap: true

    # L'image de vitrine, 2:1, entière.
    theme_pick_page/image:
      class: DvLabel
      layer: content
      shape:
        x: 6%
        w: 88%
        h: 25%
        label: ""
        border: false
        stretch: RATIO_IN
        events:
          tap: true

    theme_pick_page/card_title:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 6%
        w: 88%
        h: 5%
        text_align: CENTER
        valign: CENTER
        text_padding: 0.0
        border: false
        events:
          tap: true

    theme_pick_page/card_text:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        # DvLabel est GRAS par défaut (dvlabel.dart) : un texte courant le dit en clair, sinon
        # l'écran entier passe en gras (relevé par la vitrine, 2026-10-21). Le gras = boutons, titres.
        font_weight: normal
        x: 6%
        w: 88%
        h: 8%
        text_align: CENTER
        valign: TOP
        text_padding: 2.0
        border: false
        events:
          tap: true

    # --- Carte du HAUT : Donjon (6 % → 46 %) ---
    theme_pick_page/donjon_card:
      masks:
        - theme_pick_page/card
      shape:
        y: 6%
        actions:
          tap: worker.on_theme_pick_donjon

    theme_pick_page/donjon_image:
      masks:
        - theme_pick_page/image
      shape:
        y: 7%
        image: "images/big/theme_vitrine_donjon.png"
        actions:
          tap: worker.on_theme_pick_donjon

    theme_pick_page/donjon_title:
      masks:
        - theme_pick_page/card_title
      shape:
        y: 32.5%
        label: "@@@T:theme_pick_donjon_title@@@"
        actions:
          tap: worker.on_theme_pick_donjon

    theme_pick_page/donjon_text:
      masks:
        - theme_pick_page/card_text
      shape:
        y: 37.5%
        label: "@@@T:theme_pick_donjon_text@@@"
        actions:
          tap: worker.on_theme_pick_donjon

    # Entre les deux cartes : le choix n'est pas définitif.
    theme_pick_page/note:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        # DvLabel est GRAS par défaut (dvlabel.dart) : un texte courant le dit en clair, sinon
        # l'écran entier passe en gras (relevé par la vitrine, 2026-10-21). Le gras = boutons, titres.
        font_weight: normal
        x: 5%
        y: 46.5%
        w: 90%
        h: 5%
        text_align: CENTER
        valign: CENTER
        text_padding: 0.0
        border: false
        label: "@@@T:theme_pick_note@@@"

    # --- Carte du BAS : Gentils dinosaures (52 % → 92 %) ---
    theme_pick_page/dino_card:
      masks:
        - theme_pick_page/card
      shape:
        y: 52%
        actions:
          tap: worker.on_theme_pick_dino

    theme_pick_page/dino_image:
      masks:
        - theme_pick_page/image
      shape:
        y: 53%
        image: "images/big/theme_vitrine_dino.png"
        actions:
          tap: worker.on_theme_pick_dino

    theme_pick_page/dino_title:
      masks:
        - theme_pick_page/card_title
      shape:
        y: 78.5%
        label: "@@@T:theme_pick_dino_title@@@"
        actions:
          tap: worker.on_theme_pick_dino

    theme_pick_page/dino_text:
      masks:
        - theme_pick_page/card_text
      shape:
        y: 83.5%
        label: "@@@T:theme_pick_dino_text@@@"
        actions:
          tap: worker.on_theme_pick_dino

    new_or_pick_clan/depart_view:
      masks:
        - commons/depart_view

    create_clan/depart_view:
      masks:
        - commons/depart_view

    decisiontree/depart_view:
      masks:
        - commons/depart_view


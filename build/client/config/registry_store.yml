# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — écrans de la BOUTIQUE (module dvstore).
# ---
# --- Aucun de ces écrans ne connaît Play : ils lisent `store.*` dans le
# --- dictionnaire deva (publié par dvstore) et déclenchent `store.buy.*`,
# --- ou `store.manage`. Le worker ne fait que remplir les
# --- listes et poser les libellés — la vérité commerciale vient du serveur.
# -----------------------------------------------------------------------------
conf:
  registry:

    #//------------------------------- Boutique (onglet taskbar) -------------------
    # GABARIT : celui de clan_page et personnage, au pixel près — icône ronde en
    # tête (x35 w30 y0 h20), plaque dorée du nom (y16 h10), sous-titre rouge
    # (y22.5 h4), corps en y28 h58, kebab en x67 y9. La boutique est un écran de
    # jeu comme les deux autres, elle doit s'annoncer comme eux : c'est l'échoppe
    # du marchand, pas un panneau de gestion.
    #
    # PAGE D'ENTRÉE DE LA BOUTIQUE (dvshop, 2026-10-14). L'écran garde son identité —
    # fond du thème, échoppe du marchand, enseigne — et son corps (y28→86 %) devient une
    # grille de tuiles (`shop/hub`, DvShopHub) : une par boutique dédiée (Thèmes,
    # Extensions & packs, Échoppe d'objets), plus le code cadeau et l'abonnement. Le
    # kebab a disparu : tout ce qu'il portait est une tuile (les tutoriels restent au
    # kebab du Clan). Tuiles, boutiques, sections et libellés : layer
    # shop-base-global.yml ; catalogue : build.yml de la suite (`shop.catalog`).
    #
    # Une tuile ouvre TOUJOURS sa boutique sur sa propre page (`shop_store_page`),
    # même quand un joueur n'en voit qu'une : sauter la page d'entrée romprait l'écran.
    # Un joueur qui ne voit aucune tuile (un enfant, avant l'extension loots) lit
    # « Bientôt », jamais un écran vide.

    shop:
      masks:
        - page_taskbar
      show_appbar: true
      show_back: false
      title: "@@@T:Boutique@@@"
      # Anti-fuite conservée du précédent écran : si le joueur quitte le combat par
      # la taskbar (sans cliquer vaincu/retraite), la boucle batte_swords doit être
      # coupée à l'arrivée ici. on_shop_appear appelle _stopCombatSiege lui-même —
      # `appear` ne prend qu'une action, elle doit donc porter les deux devoirs.
      #
      # `show` AUTANT QUE `appear`, et c'est indispensable : le framework émet
      # `appear` sur didPush (arrivée sur une page neuve) mais `show` sur
      # didPopNext (retour depuis une page empilée). Or les lignes de DvList sont
      # STATIQUES, partagées par toutes les instances vivantes (cf. dvlist.dart
      # `_rowsData`) : revenir d'un écran qui a poussé ses propres lignes laissait
      # la boutique afficher CELLES-LÀ. Sans `show`, on rentrait dans la boutique
      # et l'on y trouvait la liste des scénarios de test.
      actions:
        appear: worker.on_shop_appear
        show:   worker.on_shop_appear
      registry:
        - commons/splash_background
        - shop/icon
        - shop/label
        - shop/hub
        - shop/mock_badge
        - shop/mock_scrim
        - shop/mock_text
        - shop/mock_close

    # La tente du marchand. AUCUNE image ici : elle vient du thème
    # (theme-donjon-global → images/medium/icon_Marchand.png), exactement comme
    # clan_page/icon et personnage/icon tirent leur avatar du décor. C'est ce qui
    # permet à un autre thème d'avoir sa propre échoppe sans toucher au client.
    shop/icon:
      class: DvLabel
      shape:
        x: 35%
        w: 30%
        y: 0%
        h: 20%

    shop/label:
      mask: commons/intro_text
      layer: content
      shape:
        x: 5%
        y: 16%
        w: 90%
        h: 10%
        text_align: CENTER
        label: "@@@T:shopname@@@"
        border: true

    # Pas de `shop/title_label` : sur le Clan et le Personnage, le sous-titre rouge
    # porte le TITRE DE NIVEAU, une information qui change et se mérite. Une devise
    # de marchand n'aurait rien dit, et le rouge vif d'une ligne de progression sous
    # une enseigne de boutique se lit comme une alerte.

    # LES TUILES de la page d'entrée : dans le corps du gabarit (y28→86 %), sous
    # l'enseigne. Le contenu, les pastilles et l'habillage viennent de la conf `shop`.
    shop/hub:
      class: DvShopHub
      layer: content
      shape:
        x: 5%
        y: 28%
        w: 90%
        h: 58%

    #//------------------------------- Une boutique (dvshop) ------------------------
    # La page commune des boutiques dédiées : `shop.open.<boutique>` (une tuile, ou un
    # lien direct depuis n'importe quel écran) la pousse après avoir choisi quoi
    # montrer. Style propre à la boutique (`shop.style` du thème), SANS le décor
    # illustré de la page d'entrée : le mélange des deux décevrait. La dvtaskbar reste
    # visible (masque page_taskbar) : on ne quitte jamais le jeu pour faire ses courses.
    shop_store_page:
      masks:
        - page_taskbar
      show_appbar: true
      show_back: true
      title: "@@@T:Boutique@@@"
      actions:
        appear: worker.on_shop_store_appear
      registry:
        - shop_store_page/store
        - shop_store_page/mock_badge

    shop_store_page/store:
      class: DvShopStore
      layer: content
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 88%

    shop_store_page/mock_badge:
      masks:
        - commons/store_mock_badge

    # --- Faux Google Play de la cible d'essai ---------------------------------
    # Pastille « playstore mocked » : le clan est au FAUX Google Play de la cible d'essai
    # (dvstore `store.mock.active`). Posée sur tous les écrans d'achat et d'abonnement
    # (`<page>/mock_badge`), rendue visible par le worker (_storeMockBadge) à chaque
    # apparition : un faux achat ne doit jamais se confondre avec un vrai.
    commons/store_mock_badge:
      class: DvLabel
      layer: overlay
      shape:
        x: 2%
        y: 1%
        w: 36%
        h: 3.5%
        label: "@@@T:store_mock_badge@@@"
        font_size: 11.0
        font_color: "#FFFFFFFF"
        background_color: "#FFE65100"
        border: true
        border_color: "#FFFFFFFF"
        border_size: 1.0
        border_radius: 10.0
        text_align: CENTER
        valign: CENTER
        visible: false

    shop/mock_badge:
      masks:
        - commons/store_mock_badge

    # « Rejoindre la boutique beta » : le code « clan:joueur », copié et montré en grand
    # (overlay, jamais de popup), à envoyer à grisloup.com.
    shop/mock_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        background_color: "#FF000000"
        opacity: 0.8
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop

    shop/mock_text:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 30%
        h: 28%
        font_size: 14.0
        text_align: CENTER
        label: ""     # rempli par worker.on_store_mock_id
        visible: false

    shop/mock_close:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 62%
        label: "@@@T:store_mock_id_close@@@"
        visible: false
        events:
          tap: true
        freezing_actions:
          tap: worker.on_store_mock_close

    #//------------------------------- Abonnement : DÉMÉNAGÉ ------------------------
    # `subscription_page` (bandeau d'état, bascule mensuel/annuel, bouton de palier)
    # a été retiré en août 2026, au motif qu'il redisait un état de compte et qu'une
    # relance d'impayé déposant le chef sur un écran de tarifs ne répond pas à la
    # relance. Les entrées commerciales ont alors été renvoyées vers la BOUTIQUE.
    #
    # C'était un cul-de-sac : la boutique ne listait plus aucun abonnement depuis le
    # retrait de `shop/list`, si bien qu'AUCUN clan ne pouvait plus souscrire.
    #
    # Depuis le 2026-08-20, ces entrées mènent à `tiers_page` (registry_store_tiers.yml)
    # via worker._storeGotoTiers. Ce n'est pas le retour de subscription_page : cet
    # écran-là racontait un compte, celui-ci compare cinq paliers et en surligne deux
    # (le courant, le conseillé). Depuis le 2026-10-04, un chef peut aussi l'ouvrir de
    # lui-même : « Gérer mon abonnement », dans le kebab de la boutique, y mène quand le
    # clan n'est pas abonné (worker.store_manage_or_tiers).
    #
    # La mécanique d'achat, elle, n'a pas bougé de worker_store : contrôle parental,
    # prix de la périodicité courante, achat dvstore.

    #//------------------------------- Fiche produit : SUPPRIMÉE --------------------
    # `store_product_page` (fiche d'un produit à l'unité : image, nom, description,
    # bouton d'achat) a été retirée le 2026-09-15. Rien n'y menait : l'identifiant du
    # produit affiché n'était jamais renseigné. Elle reviendra avec la refonte des
    # codes et des achats à l'unité, repensée de zéro.

    #//------------------------------- Mes achats : SUPPRIMÉ ------------------------
    # L'écran « Mes achats » (relevé de facturation lu dans clans_store/{clanId}/events)
    # a été retiré. Il redisait l'état que la boutique porte déjà, il fallait le
    # chercher sous un kebab, et son historique n'intéressait personne au quotidien.
    #
    # Ce qu'il apportait vraiment — la trace de ce qui a été acheté — vit maintenant
    # au JOURNAL DU CLAN, avec le reste de l'histoire de la famille : achats,
    # renouvellements, changements de palier, incidents et reprises y sont racontés
    # par worker_log._logLine (jetons log_store_*). La sous-collection de facturation
    # reste écrite par le serveur : elle demeure la pièce d'audit en cas de litige,
    # elle n'a simplement plus d'écran dédié.

    #//------------------------------- Clan gelé -----------------------------------
    # Fin du cycle de défaut de paiement (J50).
    #
    # ÉCRAN ACTUELLEMENT SANS ENTRÉE : plus aucun code n'y navigue. Le jeu ne se
    # ferme pour aucun état commercial — on laisse toujours entrer dans le donjon, et
    # c'est la page des paliers qui porte l'offre. Conservé tel quel : si l'on veut un jour
    # dire les choses à un chef de clan, il est prêt, et une entrée depuis la
    # boutique suffira à le rouvrir.
    #
    # Le ton est délibérément chaleureux et sans reproche — ce sont des enfants qui
    # peuvent tomber dessus. On ne parle ni de dette, ni de retard : la troupe se
    # repose, et la porte reste ouverte.

    locked_page:
      masks:
        - page
      show_appbar: false
      show_back: false
      actions:
        appear: worker.on_locked_appear
      registry:
        - locked_page/background
        - locked_page/image
        - locked_page/text
        - locked_page/revive
        - locked_page/mock_badge

    # FOND NOIR, et non `commons/splash_background`. Le décor habituel est une scène
    # de donjon chargée : l'elfe aux poches vides s'y perdait, et une salle au trésor
    # rutilante derrière « la bourse du clan est vide » disait exactement le contraire
    # du moment. Le noir isole le sujet et fait le silence qu'il faut ici.
    #
    # Widget explicite plutôt que de compter sur le `background_color: black` du
    # template `page` : le fond de cet écran est une décision, elle doit être lisible
    # dans la conf de l'écran et non déduite d'un défaut hérité.
    locked_page/mock_badge:
      masks:
        - commons/store_mock_badge

    locked_page/background:
      class: DvLabel
      layer: background
      shape:
        x: 0
        y: 0
        w: 100%
        h: 100%
        border: false

    # L'IMAGE PORTE L'ÉCRAN. Une elfe de ménage en haillons, les poches retournées,
    # seau renversé et plumeau à terre : elle dit la bourse vide sans prononcer le
    # mot, et un enfant la comprend avant de savoir lire. C'est très exactement ce
    # qu'on veut ici — l'ancienne version alignait six lignes de texte que personne
    # ne lisait, sur un « game over » qui annonçait une fin alors qu'il n'y en a pas.
    #
    # Pleine hauteur (y6→70 %) et RATIO_IN : c'est le sujet, pas une vignette.
    #
    # AUCUNE image ici : elle vient du THÈME, comme shop/icon, clan_page/icon et
    # personnage/icon. C'est du décor, et un autre thème racontera ce moment avec sa
    # propre illustration. Le registry ne déclare que la structure.
    locked_page/image:
      masks:
        - commons/nobordershape
      class: DvImage
      layer: content
      shape:
        x: 8%
        y: 6%
        w: 84%
        h: 64%

    # UNE ligne, pas un discours. Elle existe pour l'ENFANT : lui, le bouton lui est
    # masqué, il ne verrait qu'une image et n'aurait aucun moyen de comprendre
    # pourquoi le donjon ne s'ouvre plus. Deux propositions, sans reproche, et la
    # promesse que rien n'est perdu.
    locked_page/text:
      class: DvLabel
      layer: content
      shape:
        x: 6%
        y: 72%
        w: 88%
        h: 10%
        text_align: CENTER
        text_padding: 0.0
        label: "@@@T:store_locked_text@@@"
        border: false

    # UN SEUL bouton, et réservé aux chefs : un enfant qui tombe sur cet écran ne
    # doit pas se voir proposer de payer (worker.on_locked_appear le masque pour
    # tout le monde sauf les administrateurs adultes).
    #
    # « Gérer mon abonnement » a disparu : sur un clan gelé il n'y a plus
    # d'abonnement à gérer, et envoyer une famille vers la page Play de résiliation
    # au moment où on lui demande de revenir n'avait aucun sens.
    #
    # ACHÈTE SUR PLACE, et ne navigue nulle part — c'est ce qui fait de cet écran un
    # cul-de-sac réel. L'envoyer vers un écran à taskbar la rouvrirait, et un enfant
    # qui s'ennuie taperait « Clan » pour rentrer dans le donjon qu'on vient de
    # fermer. `store_revive_clan` ouvre directement la feuille de paiement Play,
    # derrière le contrôle parental, sur l'offre d'entrée et au tarif courant.
    #
    # `freezing_actions` : l'achat part vers Play, la page se gèle le temps de
    # l'aller-retour (idiome des autres boutons d'achat).
    locked_page/revive:
      masks:
        - commons/btn_wide
      shape:
        y: 85%
        h: 10%
        label: "@@@T:store_revive@@@"
        visible: false
        events:
          tap: true
        freezing_actions:
          tap: worker.store_revive_clan

    #//------------------------------- Banc d'essai : SUPPRIMÉ -----------------------
    # `store_scenario_page` (changer de scénario d'abonnement à chaud) et l'option
    # « Faire venir la fée » ont été retirées le 2026-09-15, avec leur catalogue de
    # scénarios (store-base-global.yml). La simulation `store.debug.simulate_*` de
    # dvstore a suivi le 2026-09-29 : on éprouve désormais la facturation contre le
    # simulateur de store local (composants storemock, cf. readme de dvstore).

    #//------------------------------- Code cadeau ---------------------------------
    # UN CHAMP, UN BOUTON. On tape ce qui est écrit sur la carte (ou reçu par mail), le
    # serveur tranche, et la réponse tient en une phrase.
    #
    # Le code n'est qu'une PORTE : il ne prouve rien tant que `store_claim` ne l'a pas
    # validé ET consommé. L'écran ne calcule donc aucun droit, il ne fait que présenter.
    #
    # Gabarit repris de l'ancien `enter_invite_pin` (retiré le 2026-10-18 ; guardian_pin_page,
    # registry_multiclan.yml, a la même forme) : un champ, un bouton de validation, une ligne
    # d'erreur cachée. `keyboard_scrollable` pour que le clavier virtuel ne vienne pas couvrir le
    # champ au moment où on tape dedans.

    giftcode_page:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: "@@@T:giftcode_title@@@"
      keyboard_scrollable: true
      actions:
        appear: worker.on_giftcode_appear
      registry:
        - commons/splash_background
        - giftcode_page/intro
        - giftcode_page/code
        - giftcode_page/confirm
        - giftcode_page/error
        - giftcode_page/ok_scrim
        - giftcode_page/ok_panel
        - giftcode_page/ok_close
        - giftcode_page/mock_badge

    giftcode_page/mock_badge:
      masks:
        - commons/store_mock_badge

    giftcode_page/intro:
      masks:
        - commons/intro_text
      shape:
        x: 5%
        y: 6%
        w: 90%
        h: 18%
        text_align: CENTER
        label: "@@@T:giftcode_intro@@@"

    # Gros et centré : c'est un code qu'on recopie signe par signe en levant les yeux
    # d'une carte. Les tirets et la casse n'ont aucune importance — le serveur normalise
    # ce qu'il reçoit (majuscules, tirets et espaces retirés, O lu comme 0, I et L comme
    # 1). Rien à valider ici : un écran qui refuse une saisie que le serveur aurait
    # acceptée est un écran qui ment.
    giftcode_page/code:
      masks:
        - commons/entry
      shape:
        x: 8%
        y: 28%
        w: 84%
        h: 9%
        type: TEXT
        hint: "@@@T:giftcode_hint@@@"
        text_align: CENTER

    # `freezing_actions` et non `actions` : l'appel part au serveur, la page se gèle le
    # temps de l'aller-retour. Sans le gel, un double-tap enverrait deux réclamations —
    # la seconde ne créditerait rien (le verrou tient), mais elle brûlerait un essai et
    # afficherait « déjà utilisé » sur un code qui vient de marcher.
    giftcode_page/confirm:
      masks:
        - commons/btn_medium
      shape:
        x: 10%
        y: 42%
        w: 80%
        h: 9%
        label: "@@@T:giftcode_confirm@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_giftcode_confirm

    # UNE seule ligne d'erreur, dont le worker change le libellé avant de la révéler :
    # « ce code ne s'ouvre pas », « ce trésor a déjà été ramassé »… Ce sont des enfants
    # qui peuvent lire par-dessus l'épaule, aucun message ne dit « erreur ».
    # `scrollable` parce que certaines phrases tiennent sur deux lignes selon la langue.
    giftcode_page/error:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 54%
        w: 90%
        h: 12%
        label: ""
        text_align: CENTER
        scrollable: true
        visible: false

    # SUCCÈS : overlay de widgets révélés, jamais une popup modale (idiome maison
    # commons/death_* et clan_page/invite_*). L'ordre du registry est l'ordre de
    # hit-test : `ok_close` est listé APRÈS `ok_scrim`, sans quoi le voile avalerait
    # ses taps et l'écran resterait bloqué.
    giftcode_page/ok_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop

    giftcode_page/ok_panel:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: overlay
      shape:
        x: 8%
        y: 26%
        w: 84%
        h: 36%
        label: ""
        text_align: CENTER
        scrollable: true
        visible: false

    giftcode_page/ok_close:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 70%
        h: 11%
        text_align: CENTER
        label: "@@@T:giftcode_close@@@"
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_giftcode_close

    #//------------------------------- Fabrique de codes : SUPPRIMÉE -----------------
    # `giftcode_mint_page` (fabriquer et révoquer des codes cadeaux depuis l'app, sous
    # `store.debug.test_mode`) a été retirée le 2026-09-15. La gestion des codes sera
    # refondue, et on repartira de zéro plutôt que de faire évoluer cet écran. La SAISIE
    # d'un code par un chef (`giftcode_page`, ci-dessus) reste en place. Côté serveur,
    # `store_mint` / `store_revoke` (pustore) n'ont pas été touchées : elles attendent
    # la refonte.

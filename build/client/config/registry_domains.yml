# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  registry:
    #//------------------------------- Salon Tasks Screen ---------------------------------

    salon_tasks:
      masks:
        - page_admin
      show_appbar: true
      show_back: false
      title: "@@@T:salon_tasks_title@@@"
      background_color: black
      registry:
        - commons/splash_background
        - salon_tasks/tiroir

    salon_tasks/tiroir:
      class: DvTiroir
      layer: content
      # Selector des tâches. Mode JEU : le worker ne renvoie que l'option seule (= le tap courant)
      # → aucune option, donc pas de menu, la tâche se lance directement (iso-fonctionnel).
      # Mode CHEF : il renvoie les options d'administration → le tiroir ouvre commons/tiroir_menu.
      selector: worker.task_selector
      menu: commons/tiroir_menu
      menu_enabled: true
      shape:
        x: 1%
        y: 0%
        w: 98%
        h: 88%
        border: true
        font_size: 14.0
        border_color: "0xFFB07328"
        border_size: 1.0
        border_radius: 6.0
        font_color: black
        background_color: "black"
        opacity: 0.8
      icons:
        salon_01:
          image: images/medium/dt_t_salon_01.png
          label: "@@@T:dt_t_salon_01@@@"
          actions:
            tap: seltask.salon_01
        salon_02:
          image: images/medium/dt_t_salon_02.png
          label: "@@@T:dt_t_salon_02@@@"
          actions:
            tap: seltask.salon_02
        salon_03:
          image: images/medium/dt_t_salon_03.png
          label: "@@@T:dt_t_salon_03@@@"
          actions:
            tap: seltask.salon_03
        salon_04:

# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — PAGE DES PALIERS d'abonnement (refonte 2026-09-30).
# ---
# --- C'est le seul écran d'où l'on souscrit ou change de cotisation. Il ne
# --- s'atteint jamais par navigation libre : une RAISON commerciale l'ouvre —
# --- plafond de joueurs atteint, bandeau d'impayé, relance push, réabonnement
# --- d'un clan gelé, mur de première cotisation. Toutes passent par
# --- worker._storeGotoTiers, qui publie cette raison dans `worker.store.notice`.
# ---
# --- UN CHOIX, PAS UN TABLEAU. L'app connaît l'effectif du clan, donc le palier qui
# --- lui convient : l'écran ne demande plus de comparer cinq lignes, il pose une
# --- seule question, « à l'année ou au mois ? ». Le palier passe au second plan,
# --- derrière le lien « changer » (tiers_pick_page, plus bas).
# ---
# --- Ce qui le rend vendeur, et qu'il ne faut pas « simplifier » :
# ---   - les VISAGES du clan en tête : on paie pour eux, pas pour un nom de palier ;
# ---   - un titre de quatre mots, une ligne dessous, et rien de plus à lire ;
# ---   - la carte ANNUELLE dorée, présélectionnée, avec son ruban, le montant des
# ---     douze mensualités barré et l'économie en MONTANT (jamais en pourcentage) ;
# ---   - la carte MENSUELLE sobre, « sans engagement » : l'échappatoire qui rassure
# ---     et fait paraître l'annuel plus intéressant encore ;
# ---   - un seul gros bouton, et la réassurance en petit dessous.
# ---
# --- ⚠ DEUX GARDE-FOUS JURIDIQUES, à ne pas « améliorer » :
# ---   - le montant barré n'est PAS un ancien prix, c'est douze mensualités. La
# ---     pastille dit donc « … par rapport au mois » : une comparaison explicite, et
# ---     non un prix de référence au sens de la directive Omnibus ;
# ---   - le ruban dit « MEILLEUR PRIX », qui est un fait. « Le plus populaire » ne
# ---     s'écrira que le jour où une mesure le prouvera.
# ---
# --- Rien n'est chiffré ici : prix, économie et référence viennent de Play via
# --- dvstore (`store.catalog.<id>.plans.*`, `yearly_savings`, `yearly_reference`).
# -----------------------------------------------------------------------------
conf:
  registry:

    #//------------------------------- Gabarits de l'écran -------------------------
    # Texte posé sur une carte : pas de cadre, crème, et le tap de la carte. Chaque
    # élément porte le même geste que son cadre, sinon il intercepterait le tap.
    tiers/txt:
      class: DvLabel
      layer: content
      shape:
        border: false
        text_align: LEFT
        font_color: "0xFFFFF3D6"
        font_size: 15.0

    # LE VOILE. L'illustration du fond est une scène chargée : sans lui, rien de ce
    # qui est posé dessus ne se lit (relevé au premier rendu, 2026-10-01). Sombre et
    # chaud, comme la maquette ; l'image reste devinée derrière, l'offre passe devant.
    tiers/veil:
      class: DvLabel
      layer: background
      shape:
        x: 0
        y: 0
        w: 100%
        h: 100%
        border: false
        label: ""
        background_color: "0xE0140E0A"

    tiers/on_year:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_yearly

    tiers/on_month:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_monthly

    #//------------------------------- La vitrine ----------------------------------
    # NÉE NON BLOQUANTE : `show_back: true`. C'est la forme de presque toutes les
    # venues : la famille a voulu quelque chose, on lui dit le prix, elle décide. Un
    # clan qui a DÉJÀ payé n'est jamais enfermé ici.
    #
    # UNE venue fait exception, et le worker retire alors la flèche et l'appbar
    # (_storeGotoTiers `blocking: true`) : la première cotisation d'un clan qui a
    # épuisé ses reports. D'où le bouton « Plus tard » et son décompte annoncé.
    #
    # `masks: [page]` et non `page_taskbar` : c'est un écran empilé pour répondre à
    # une question, pas un onglet de jeu. Il n'hérite donc ni de la taskbar, ni du
    # bandeau d'impayé, qui ne serait ici qu'un doublon accusateur.
    tiers_page:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: ""
      actions:
        appear: worker.on_tiers_appear
        # `show` AUTANT QUE `appear` : au retour du choix du palier, la page ne
        # renaît pas, elle se remontre, et doit repeindre le palier choisi.
        show:   worker.on_tiers_appear
      registry:
        - commons/splash_background
        - tiers/veil
        - tiers_page/av1
        - tiers_page/av2
        - tiers_page/av3
        - tiers_page/av4
        - tiers_page/av5
        - tiers_page/av6
        - tiers_page/clan
        - tiers_page/title
        - tiers_page/notice
        - tiers_page/year_card
        - tiers_page/year_ribbon
        - tiers_page/year_name
        - tiers_page/year_radio
        - tiers_page/year_price
        - tiers_page/year_old
        - tiers_page/year_save
        - tiers_page/month_card
        - tiers_page/month_name
        - tiers_page/month_radio
        - tiers_page/month_price
        - tiers_page/month_note
        - tiers_page/formula
        - tiers_page/defer
        - tiers_page/cta
        - tiers_page/safe

    # LES VISAGES DU CLAN. Six places, qui se chevauchent : le worker pose l'avatar
    # de chaque membre (dans l'ordre du clan), masque les places en trop et recentre
    # la rangée. Au-delà de six, la ligne du dessous dit le compte exact.
    tiers_page/av1:
      class: DvLabel
      layer: content
      shape: { x: 26%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }
    tiers_page/av2:
      class: DvLabel
      layer: content
      shape: { x: 34%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }
    tiers_page/av3:
      class: DvLabel
      layer: content
      shape: { x: 42%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }
    tiers_page/av4:
      class: DvLabel
      layer: content
      shape: { x: 50%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }
    tiers_page/av5:
      class: DvLabel
      layer: content
      shape: { x: 58%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }
    tiers_page/av6:
      class: DvLabel
      layer: content
      shape: { x: 66%, y: 1.5%, w: 16%, h: 7.5%, border: false, visible: false }

    # « Les Lapins Blancs · 5 aventuriers »
    tiers_page/clan:
      masks:
        - tiers/txt
      shape:
        x: 5%
        y: 9.5%
        w: 90%
        h: 3.5%
        text_align: CENTER
        font_size: 14.0
        font_color: "0xFFC9B48D"
        label: ""

    # Le titre : quatre mots, et c'est tout.
    tiers_page/title:
      masks:
        - tiers/txt
      shape:
        x: 4%
        y: 13%
        w: 92%
        h: 9%
        text_align: CENTER
        font_family: "MedievalSharp"
        font_size: 25.0
        font_weight: bold
        label: "@@@T:tiers_headline@@@"

    # LA RAISON DE LA VENUE (plafond atteint, relance…), ou à défaut la phrase qui
    # accompagne le titre. Le worker l'écrit toujours : jamais de cadre creux.
    tiers_page/notice:
      masks:
        - tiers/txt
      shape:
        x: 6%
        y: 22%
        w: 88%
        h: 6%
        text_align: CENTER
        font_size: 14.0
        font_color: "0xFFBFAE90"
        label: "@@@T:tiers_subline@@@"

    #//------------------------------- Carte annuelle -----------------------------
    # Le cadre DORÉ, toujours : c'est le meilleur prix, sélectionné ou non. La
    # sélection se lit à la pastille ronde et à l'épaisseur du trait (worker).
    tiers_page/year_card:
      masks:
        - tiers/on_year
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 31%
        w: 90%
        h: 17%
        label: ""
        border: true
        border_size: 3.0
        border_color: "0xFFD6A84A"
        border_radius: 18.0
        background_color: "0x2ED6A84A"

    tiers_page/year_ribbon:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 30%
        y: 29.4%
        w: 40%
        h: 3.2%
        text_align: CENTER
        font_size: 12.0
        font_weight: bold
        font_color: "0xFF2A1A08"
        background_color: "0xFFD6A84A"
        border_radius: 12.0
        label: "@@@T:tiers_best@@@"

    tiers_page/year_name:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 10%
        y: 33%
        w: 60%
        h: 4.5%
        font_size: 19.0
        font_weight: bold
        label: "@@@T:tiers_year@@@"

    # Pastille de sélection : pleine et cochée, ou vide.
    tiers_page/year_radio:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 81%
        y: 33.2%
        w: 8%
        h: 4%
        text_align: CENTER
        font_size: 15.0
        font_weight: bold
        font_color: "0xFF2A1A08"
        border: true
        border_size: 2.0
        border_color: "0xFFD6A84A"
        border_radius: 20.0
        background_color: "0xFFD6A84A"
        label: "✓"

    # « 39,99 € / an », en grand.
    tiers_page/year_price:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 10%
        y: 38%
        w: 50%
        h: 5.5%
        font_size: 26.0
        font_weight: bold
        font_color: "0xFFFFFFFF"
        label: ""

    # Les douze mensualités, BARRÉES, à droite de la carte. Masquées si Play ne
    # donne pas les deux prix : on n'affiche jamais un montant qu'on n'a pas.
    tiers_page/year_old:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 58%
        y: 38.5%
        w: 32%
        h: 4.5%
        text_align: RIGHT
        font_size: 17.0
        font_color: "0xFF9D8F78"
        text_decoration: line_through
        label: ""
        visible: false

    # L'économie, en MONTANT, dans une pastille verte.
    tiers_page/year_save:
      masks:
        - tiers/txt
        - tiers/on_year
      shape:
        x: 10%
        y: 43.3%
        w: 80%
        h: 3.6%
        text_align: CENTER
        font_size: 13.0
        font_weight: bold
        font_color: "0xFFEAFFDF"
        background_color: "0xFF3F7A3A"
        border_radius: 10.0
        label: ""
        visible: false

    #//------------------------------- Carte mensuelle ----------------------------
    # Sobre. Son trait ne devient doré que si elle est choisie.
    tiers_page/month_card:
      masks:
        - tiers/on_month
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 50%
        w: 90%
        h: 14%
        label: ""
        border: true
        border_size: 1.5
        border_color: "0x33FFFFFF"
        border_radius: 18.0
        background_color: "0x0AFFFFFF"

    tiers_page/month_name:
      masks:
        - tiers/txt
        - tiers/on_month
      shape:
        x: 10%
        y: 52%
        w: 60%
        h: 4.5%
        font_size: 19.0
        font_weight: bold
        label: "@@@T:tiers_month@@@"

    tiers_page/month_radio:
      masks:
        - tiers/txt
        - tiers/on_month
      shape:
        x: 81%
        y: 52.2%
        w: 8%
        h: 4%
        text_align: CENTER
        font_size: 15.0
        font_weight: bold
        font_color: "0xFF2A1A08"
        border: true
        border_size: 2.0
        border_color: "0x59FFFFFF"
        border_radius: 20.0
        label: ""

    tiers_page/month_price:
      masks:
        - tiers/txt
        - tiers/on_month
      shape:
        x: 10%
        y: 56.5%
        w: 60%
        h: 4.5%
        font_size: 22.0
        font_weight: bold
        font_color: "0xFFFFFFFF"
        label: ""

    tiers_page/month_note:
      masks:
        - tiers/txt
        - tiers/on_month
      shape:
        x: 10%
        y: 60.5%
        w: 80%
        h: 3%
        font_size: 13.0
        font_color: "0xFFA89A82"
        label: "@@@T:tiers_no_commitment@@@"

    #//------------------------------- Palier, bouton, réassurance ----------------
    # « Formule Tribu · jusqu'à 7 · changer ». Le lien ouvre tiers_pick_page.
    tiers_page/formula:
      masks:
        - tiers/txt
      shape:
        x: 5%
        y: 65.5%
        w: 90%
        h: 4%
        text_align: CENTER
        font_size: 14.0
        font_color: "0xFFCDBB9A"
        highlight_color: "0xFFFFF3D6"
        link_color: "0xFFE2B85C"
        label: ""

    # « PLUS TARD » — le report de première cotisation. NÉ INVISIBLE, et il le reste
    # partout ailleurs : ces venues-là ont déjà leur sortie (la flèche). Le DÉCOMPTE
    # est écrit dessus (worker._tiersSyncDefer) : une famille doit savoir combien
    # de fois elle pourra encore repousser. Discret : c'est la sortie, pas l'offre.
    tiers_page/defer:
      masks:
        - tiers/txt
      shape:
        x: 10%
        y: 71%
        w: 80%
        h: 5%
        text_align: CENTER
        font_size: 14.0
        font_color: "0xFFA89A82"
        label: ""
        visible: false
        events:
          tap: true
        actions:
          tap: worker.tiers_defer

    # LE bouton. Son libellé devient « Votre formule actuelle » (et il s'éteint)
    # quand la carte choisie est très exactement l'abonnement en cours.
    tiers_page/cta:
      masks:
        - tiers/txt
      shape:
        x: 5%
        y: 78%
        w: 90%
        h: 8%
        text_align: CENTER
        font_size: 19.0
        font_weight: bold
        font_color: "0xFF2A1A08"
        background_color: "0xFFE2B85C"
        border_radius: 16.0
        label: "@@@T:tiers_continue@@@"
        events:
          tap: true
        actions:
          tap: worker.tiers_buy

    tiers_page/safe:
      masks:
        - tiers/txt
      shape:
        x: 5%
        y: 88%
        w: 90%
        h: 3.5%
        text_align: CENTER
        font_size: 12.0
        font_color: "0xFF8F836F"
        label: "@@@T:tiers_safe@@@"

    #//------------------------------- Choix du palier -----------------------------
    # « Combien d'aventuriers ? ». Mêmes cartes que la vitrine, une par abonnement du
    # catalogue dans l'ordre `order` : à gauche le nom, les PLACES en points (pleins :
    # vos aventuriers, vides : la place qui reste) et le plafond ; à droite les DEUX
    # prix, au mois en grand et à l'année dessous. Un palier trop petit se voit sans
    # rien lire, il est éteint et inerte : lui vendre un sous-dimensionnement, c'est
    # lui vendre un refus.
    #
    # TROIS MARQUES, qui ne se confondent pas : le cadre doré est le palier CHOISI
    # (celui que la vitrine présentera) ; le ruban « POPULAIRE » est réglé au bucket
    # (`store.showcase.popular`, fixé à la main : Tribu) ; « VOTRE
    # PALIER » marque l'abonnement en cours. Pas de « conseillé » : on ne connaît ni
    # la famille ni la taille de clan qui lui convient.
    #
    # Six emplacements, positions fixes : le worker remplit ceux qu'il faut et masque
    # les autres. Un septième palier au catalogue demanderait un emplacement de plus
    # ici (DvList, qui n'a pas cette limite, dessine ses prix trop petits pour un
    # écran de vente : relevé au premier rendu, 2026-10-01).
    tiers_pick/on_c1:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_1

    tiers_pick/on_c2:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_2

    tiers_pick/on_c3:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_3

    tiers_pick/on_c4:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_4

    tiers_pick/on_c5:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_5

    tiers_pick/on_c6:
      shape:
        events:
          tap: true
        actions:
          tap: worker.tiers_pick_6

    tiers_pick_page:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: ""
      actions:
        appear: worker.on_tiers_pick_appear
        show:   worker.on_tiers_pick_appear
      registry:
        - commons/splash_background
        - tiers/veil
        - tiers_pick_page/title
        - tiers_pick_page/sub
        - tiers_pick_page/c1_frame
        - tiers_pick_page/c1_badge
        - tiers_pick_page/c1_name
        - tiers_pick_page/c1_seats
        - tiers_pick_page/c1_cap
        - tiers_pick_page/c1_month
        - tiers_pick_page/c1_year
        - tiers_pick_page/c2_frame
        - tiers_pick_page/c2_badge
        - tiers_pick_page/c2_name
        - tiers_pick_page/c2_seats
        - tiers_pick_page/c2_cap
        - tiers_pick_page/c2_month
        - tiers_pick_page/c2_year
        - tiers_pick_page/c3_frame
        - tiers_pick_page/c3_badge
        - tiers_pick_page/c3_name
        - tiers_pick_page/c3_seats
        - tiers_pick_page/c3_cap
        - tiers_pick_page/c3_month
        - tiers_pick_page/c3_year
        - tiers_pick_page/c4_frame
        - tiers_pick_page/c4_badge
        - tiers_pick_page/c4_name
        - tiers_pick_page/c4_seats
        - tiers_pick_page/c4_cap
        - tiers_pick_page/c4_month
        - tiers_pick_page/c4_year
        - tiers_pick_page/c5_frame
        - tiers_pick_page/c5_badge
        - tiers_pick_page/c5_name
        - tiers_pick_page/c5_seats
        - tiers_pick_page/c5_cap
        - tiers_pick_page/c5_month
        - tiers_pick_page/c5_year
        - tiers_pick_page/c6_frame
        - tiers_pick_page/c6_badge
        - tiers_pick_page/c6_name
        - tiers_pick_page/c6_seats
        - tiers_pick_page/c6_cap
        - tiers_pick_page/c6_month
        - tiers_pick_page/c6_year

    tiers_pick_page/title:
      masks:
        - tiers/txt
      shape:
        x: 4%
        y: 2%
        w: 92%
        h: 6.5%
        text_align: CENTER
        font_family: "MedievalSharp"
        font_size: 25.0
        font_weight: bold
        label: "@@@T:tiers_pick_title@@@"

    tiers_pick_page/sub:
      masks:
        - tiers/txt
      shape:
        x: 5%
        y: 8.5%
        w: 90%
        h: 3.5%
        text_align: CENTER
        font_size: 14.0
        font_color: "0xFFBFAE90"
        label: ""

    tiers_pick_page/c1_frame:
      masks:
        - tiers_pick/on_c1
      class: DvLabel
      layer: content
      shape:
        x: 4%
        y: 15.00%
        w: 92%
        h: 12.00%
        label: ""
        visible: false
        border: true
        border_size: 1.5
        border_color: "0x33FFFFFF"
        border_radius: 16.0
        background_color: "0x0AFFFFFF"
    tiers_pick_page/c1_badge:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 58%
        y: 13.70%
        w: 34%
        h: 2.60%
        label: ""
        visible: false
        text_align: CENTER
        font_size: 11.0
        font_weight: bold
        font_color: "0xFF2A1A08"
        background_color: "0xFFD6A84A"
        border_radius: 10.0
    tiers_pick_page/c1_name:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 8%
        y: 16.40%
        w: 46%
        h: 3.60%
        label: ""
        visible: false
        font_size: 19.0
        font_weight: bold
    tiers_pick_page/c1_seats:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 8%
        y: 20.00%
        w: 46%
        h: 3.20%
        label: ""
        visible: false
        font_size: 16.0
        font_color: "0xFFD6A84A"
    tiers_pick_page/c1_cap:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 8%
        y: 23.20%
        w: 50%
        h: 2.80%
        label: ""
        visible: false
        font_size: 13.0
        font_color: "0xFFBFAE90"
    tiers_pick_page/c1_month:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 52%
        y: 17.20%
        w: 40%
        h: 4.00%
        label: ""
        visible: false
        text_align: RIGHT
        font_size: 19.0
        font_weight: bold
        font_color: "0xFFFFFFFF"
    tiers_pick_page/c1_year:
      masks:
        - tiers/txt
        - tiers_pick/on_c1
      shape:
        x: 52%
        y: 21.60%
        w: 40%
        h: 3.20%
        label: ""
        visible: false
        text_align: RIGHT
        font_size: 15.0
        font_color: "0xFFE2B85C"

    tiers_pick_page/c2_frame:
      masks:
        - tiers_pick/on_c2
      class: DvLabel
      layer: content
      shape:
        x: 4%
        y: 28.20%
        w: 92%
        h: 12.00%
        label: ""
        visible: false
        border: true
        border_size: 1.5
        border_color: "0x33FFFFFF"
        border_radius: 16.0
        background_color: "0x0AFFFFFF"
    tiers_pick_page/c2_badge:
      masks:
        - tiers/txt
        - tiers_pick/on_c2
      shape:
        x: 58%
        y: 26.90%
        w: 34%
        h: 2.60%
        label: ""

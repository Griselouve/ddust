# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  # --- dvsteps: enchaînement des écrans ----------------------------------------
  steps:
    # Ordre d'onboarding : royaume → âge → CGU → LIAISON DU COMPTE → nom → clan.
    # Tout ce qui précède la liaison se déroule en session anonyme, sans une seule écriture
    # en base ; le nom vient après, quand le joueur a une identité durable.
    # Le seuil : un tap, l'interlude, puis les deux portes. Aucune route conditionnelle —
    # à ce stade on ne sait rien du joueur, et c'est exactement ce qu'on veut.
    awake:
      navigate: reset
      # ⚠ LES ROUTES DE REPRISE, ET CE N'EST PAS UN COPIER-COLLER MALHEUREUX. `on_login`
      #   s'execute au DEMARRAGE et route le joueur selon ce qu'il trouve en base :
      #   `steps.navigate.dashboard` pour un joueur enrole, `.player_name` pour un compte
      #   sans personnage, `.clan` pour un personnage sans clan, etc. Il part donc depuis
      #   l'ecran d'accueil, celui que l'orb vient d'ouvrir.
      #
      #   dvsteps resout une route dans le pas de la PAGE COURANTE : sans ces lignes, le
      #   pas ne connait aucune de ces destinations. Jusqu'au 2026-09-14 il retombait alors
      #   sur `default` en silence, et TOUTE reprise de session atterrissait sur le choix
      #   des langues ; depuis, dvsteps refuse et le journalise, ce qui est plus honnete
      #   mais laisse le joueur sur place. Dans les deux cas il faut ces routes.
      #
      #   Un joueur deja enrole ne doit jamais voir l'accueil. C'est ici que cela se joue.
      routes:
        default: lang_choice
        region: region_screen
        player_name: player_name_screen
        age: age_screen
        link: link_account_screen
        clan: new_or_pick_clan
        dashboard: dashboard
        # Adhésion en attente (users.pending_join) : le joueur a fermé le jeu pendant
        # que son chef devait confirmer son arrivée. on_login l'y ramène.
        join_wait: join_wait

    # Le choix de la langue. L'interlude se joue SUR cet écran, une fois la langue
    # connue ; c'est sa fin (worker.on_intro_finished) qui mène aux deux portes.
    lang_choice:
      navigate: reset
      # ⚠ LES ROUTES DE REPRISE, ET CE N'EST PAS UN COPIER-COLLER MALHEUREUX. `on_login`
      #   s'execute au DEMARRAGE et route le joueur selon ce qu'il trouve en base :
      #   `steps.navigate.dashboard` pour un joueur enrole, `.player_name` pour un compte
      #   sans personnage, `.clan` pour un personnage sans clan, etc. Il part donc depuis
      #   l'ecran d'accueil, celui que l'orb vient d'ouvrir.
      #
      #   dvsteps resout une route dans le pas de la PAGE COURANTE : sans ces lignes, le
      #   pas ne connait aucune de ces destinations. Jusqu'au 2026-09-14 il retombait alors
      #   sur `default` en silence, et TOUTE reprise de session atterrissait sur le choix
      #   des langues ; depuis, dvsteps refuse et le journalise, ce qui est plus honnete
      #   mais laisse le joueur sur place. Dans les deux cas il faut ces routes.
      #
      #   Un joueur deja enrole ne doit jamais voir l'accueil. C'est ici que cela se joue.
      routes:
        default: home
        region: region_screen
        player_name: player_name_screen
        age: age_screen
        link: link_account_screen
        clan: new_or_pick_clan
        dashboard: dashboard
        join_wait: join_wait

    home:
      navigate: reset
      routes:
        region: region_screen
        player_name: player_name_screen
        age: age_screen
        link: link_account_screen
        # ⚠ PLUS DE ROUTE `join` DE REPRISE (retirée le 2026-09-22, ici comme sur `awake` et
        #   `lang_choice`). Elle ramenait à l'écran d'avis un mineur anonyme dont l'onboarding
        #   avait déjà été écrit en base, en attendant son admission. Ce mineur n'existe plus :
        #   rien ne s'écrit avant le login, et un enfant qui ferme l'application repart du seuil.
        #   L'homonyme `join` de new_or_pick_clan est une AUTRE table de routes (adulte qui
        #   renonce à créer son clan, worker_clan.on_create_clan_goto_join), toujours en service.
        clan: new_or_pick_clan
        dashboard: dashboard
        join_wait: join_wait

    region_screen:
      navigate: reset
      routes:
        default: age_screen

    # Le nom est demandé APRÈS la liaison du compte, pour tout le monde. Le routeur décide
    # de la suite selon que le joueur est déjà dans un clan (mineur admis) ou non (adulte).
    player_name_screen:
      routeur: worker.on_confirm_player_name
      navigate: reset
      routes:
        dashboard: dashboard
        clan: new_or_pick_clan
        cancel: player_name_screen
        default: new_or_pick_clan

    # L'ÉCRAN VIDÉO A DISPARU le 2026-09-12, et avec lui le seul fichier de la vague
    # `vital` : 16 Mo qu'il fallait avoir descendus avant de montrer quoi que ce soit.
    # L'accueil est désormais porté par un interlude dvflame joué sur des assets
    # embarqués, donc sans un octet de réseau. L'âge enchaîne directement sur les
    # conditions — même patron que l'ancien pas `ddvideo` : `documents.show_cgu`
    # navigue lui-même (navigate_reset interne au module), il ne rend donc aucune
    # clé de route et dvsteps se contente de tirer `actions.routed` après coup.
    #
    # L'ambiance du donjon partait à la fin de la vidéo ; elle part ici. C'est le
    # premier moment où elle a des chances d'être en cache : le royaume est choisi
    # depuis un écran, la vague `critical` est lancée.
    age_screen:
      routeur: documents.show_cgu
      actions:
        # ⚠ PASSE PAR LE WORKER, qui COUPE d'abord la musique du seuil. Cette ligne
        #   lancait directement la playlist ; depuis que le seuil a la sienne, cela
        #   faisait jouer les deux ensemble a partir d'ici.
        routed: worker.on_ambiance_relais

    # Trois issues : le mineur va dire s'il veut jouer (écran d'avis, puis transmission de sa
    # réponse au parent ; il ne liera son compte qu'une fois l'invitation du parent en main),
    # l'adulte encore anonyme doit lier son compte tout de suite, et l'adulte déjà authentifié
    # (compte supprimé qui refait son onboarding) enchaîne directement sur le nom.
    # Les trois premières routes sont celles de l'ONBOARDING. Les deux dernières servent la
    # RÉ-acceptation : une nouvelle version de document repose cet écran à tout le monde, et un
    # joueur déjà enrôlé doit retrouver son dashboard (ou finir la saisie de son nom) au lieu
    # d'être renvoyé dans le funnel de jointure — cf. worker.legalstate.
    # ⚠ CET ECRAN A BESOIN DE SON PAS, meme s'il n'est pas a nous. `parentalgate_screen`
    #   appartient a dvparentalgate : il s'intercale entre l'age et les conditions quand
    #   un adulte se declare, et dvdocuments enchaine ensuite par `steps.navigate`. Sans
    #   pas ici, dvsteps ne trouve rien pour la page courante, le journal dit « pas de
    #   step configuré pour la page: parentalgate_screen » et le parcours s'arrete net —
    #   enigme resolue, ecran fige.
    #
    #   Le routeur est le meme que celui de l'age, et pour cause : c'est la meme suite.
    #   Le detour par l'enigme ne change pas la destination, il ne fait que la retarder.
    #
    # ⚠ CE PAS N'ETAIT PAS NECESSAIRE AVANT LE 2026-09-13, et c'est ce qui le rendait
    #   invisible. `documents.do_confirm` etait alors appele par le BOUTON de l'age :
    #   dvsteps prenait la page de l'appelant — `age_screen` — et son pas s'appliquait.
    #   Depuis que la confirmation passe par un interlude (appelant nul), dvsteps se
    #   rabat sur la page COURANTE, qui est l'enigme au moment ou elle se resout.
    parentalgate_screen:
      routeur: documents.show_cgu
      actions:
        routed: worker.on_ambiance_relais

    documents_acceptance_screen:
      routeur: worker.legalstate
      navigate: reset
      routes:
        k: kid_assent_screen
        a: link_account_screen
        a_linked: player_name_screen
        dashboard: dashboard
        player_name: player_name_screen
        # Adhésion en attente quand une nouvelle version des conditions est reposée.
        join_wait: join_wait

    # AVIS DU MINEUR : condition n° 3 de l'article 2.2.2.25.2.9 du Decreto 1074 de 2015
    # (qui compile l'art. 12 du Decreto 1377 de 2013) : l'autorisation du représentant légal
    # n'est valable qu'« previo ejercicio del menor de su derecho a ser escuchado ». L'enfant
    # s'exprime donc AVANT la décision de son parent, et sa réponse voyage jusqu'à lui.
    #
    # PLACEMENT NON NÉGOCIABLE : entre la route "k" des documents et tout ce qui touche à un
    # clan. À ce stade la session est encore ANONYME et rien n'a été écrit, ni en base ni sur
    # le disque : un enfant qui ne valide pas ne laisse aucune trace. Et rien ne s'écrira
    # avant que le parent n'ait décidé (RGPD art. 8) : l'enfant ne se connecte qu'une fois
    # l'invitation du parent en main.
    #
    # Pas de `default` : « oui » avance, la flèche renvoie aux documents. Un enfant qui ne veut
    # pas ne valide simplement pas : il n'y a rien à décliner, donc aucune trace d'un refus, et
    # il peut revenir quand il veut.
    #
    # ⚠ UN ROUTEUR, parce que le « oui » a quelque chose à faire avant de naviguer : c'est lui
    #   qui crée la demande (son code tiré au hasard, et le lien qui le porte). Il reçoit la
    #   route demandée (`go` par l'interlude passage_assent, `back` par la flèche).
    #   * `go`   : l'écran qui transmet la réponse et son code au parent ;
    #   * `back` : retour aux documents.
    # ⚠ LES ROUTES `pin` ET `link` ONT DISPARU (2026-09-22). Elles servaient à l'enfant arrivé
    #   par un lien d'invitation application fermée : l'écran d'avis servait de nouvelle
    #   confirmation, puis l'on allait droit à la saisie du code ou à la connexion. Une
    #   invitation porte désormais le code de la demande à laquelle elle répond, et ce code ne
    #   survit pas à la fermeture de l'application : une invitation reçue avant le oui est
    #   refusée, l'enfant envoie une nouvelle demande.
    kid_assent_screen:
      routeur: worker.kid_assent_route
      navigate: reset
      routes:
        go: kid_assent_share
        back: documents_acceptance_screen

    # La réponse de l'enfant, à transmettre : QR code à montrer, lien à envoyer. C'est aussi
    # d'ici qu'il reçoit l'invitation de son parent (scan du QR du clan, ou lien et code).
    # Une invitation valide mène à la connexion Google (route `link`), et à rien d'autre :
    # l'acceptation elle-même attend le compte définitif (worker.on_login).
    # `default` ne sert qu'au mineur DÉJÀ connecté et sans clan (ramené ici après un refus
    # d'admission, ou depuis kid_wants_clan) : son invitation est acceptée sur-le-champ, et il
    # attend son admission sur join_wait (worker._acceptAndWait y navigue lui-même ; la route
    # est là pour qu'un `steps.navigate` égaré ne mène pas au tableau de bord sans clan).
    kid_assent_share:
      navigate: reset
      routes:
        link: link_account_screen
        default: join_wait

    # Saisie du lien et du code d'une invitation à distance. Deux sorties : l'enfant encore
    # anonyme part se connecter (`link`), le joueur déjà connecté attend son admission sur
    # join_wait (`default`), comme après un scan de QR code.
    enter_invite_pin:
      navigate: reset
      routes:
        link: link_account_screen
        default: join_wait

    # Écran bloquant : aucune route de sortie « plus tard ». La navigation qui en part est
    # décidée par worker.on_account_linked, qui rejoue on_login une fois le flush réussi.
    link_account_screen:
      navigate: reset
      routes:
        player_name: player_name_screen
        clan: new_or_pick_clan
        dashboard: dashboard
        # « Retrouver mon héros » d'un compte dont l'adhésion attendait encore son chef.
        join_wait: join_wait
        default: link_account_screen

    # L'ADHÉSION EN ATTENTE (2026-09-22). Le candidat, enfant ou adulte, est connecté et a
    # accepté l'invitation : c'est maintenant au chef de publier le secret du clan, et son jeu
    # peut être fermé. L'attente vit en base (users.pending_join) : le joueur peut fermer le
    # jeu, on_login le ramène ici (routes `join_wait` de awake, lang_choice, home,
    # documents_acceptance_screen et link_account_screen). Aucune leçon de tutoriel ne vise
    # cet écran.
    # Deux sorties, toutes deux décidées par le worker : l'admission (`default`, le tableau de
    # bord, ou l'écran du nom s'il manque), et l'abandon ou l'expiration (retour à la demande
    # de l'enfant, ou au choix du clan pour l'adulte, cf. worker._leaveJoin).
    join_wait:
      navigate: reset
      routes:
        default: dashboard

    new_or_pick_clan:
      navigate: new
      routes:
        join: kid_wants_clan
        create: create_clan
        default: new_or_pick_clan

    create_clan:
      routeur: worker.on_confirm_create_clan
      navigate: reset
      routes:
        ok: decisiontree
        default: create_clan

    decisiontree:
      navigate: reset
      routes:
        default: dashboard

    dashboard:
      navigate: reset
      routes:
        default: decisiontree

    testme:
      navigate: new
      routes:
        default: testme

    kid_wants_clan:
      navigate: reset
      routes:
        default: join_wait

    shop:
      navigate: new
      routes:
        default: shop

    clan_page:
      navigate: new
      routes:
        default: clan_page

    log_page:
      navigate: new
      routes:
        default: log_page

    butin_page:
      navigate: new
      routes:
        default: butin_page

    money_page:
      navigate: new
      routes:
        default: money_page

    give_page:
      navigate: new
      routes:
        default: give_page

    item_view_page:
      navigate: new
      routes:
        default: item_view_page

    # --- Boutique (dvstore) ---------------------------------------------------
    # Ces écrans s'atteignent par navigate_new (taskbar, boutons, worker) : aucun
    # n'est aiguillé par dvsteps, et les entrées ci-dessous ne servent donc qu'à les
    # déclarer.
    #
    # Le routeur `store.gate.<feature>` — qui rend allowed | paywall | locked —
    # N'EST câblé NULLE PART, et c'est délibéré : le jeu ne se ferme pour aucun état
    # commercial. On laisse toujours entrer dans le donjon, et c'est la page des paliers qui
    # porte l'offre — les familles y vont d'elles-mêmes vérifier ou souscrire. Un
    # écran imposé au lancement dirait la même chose, mais en barrant la porte.
    #
    # Le jour où une fonctionnalité sera vendue à l'unité (les validations
    # automatiques, les packs de domaines), c'est ici qu'elle se protégera :
    #
    #   <écran d'où l'on part>:
    #     routeur: store.gate.auto_validation
    #     navigate: new
    #     routes:
    #       allowed: <écran de la fonctionnalité>
    #       paywall: shop
    #       locked:  locked_page
    #
    # ⚠ La clef d'une entrée dvsteps est l'écran COURANT, pas la destination : le
    # routeur se pose sur l'écran d'où le joueur part, jamais sur celui qu'il veut
    # atteindre. Une entrée et une clef dans `grants` au catalogue suffiront — sans
    # une ligne de Dart.

    # Page des paliers. Ouverte par worker._storeGotoTiers, qui publie d'abord la
    # RAISON de la venue — jamais par un `navigate_new.tiers_page` en dur, qui
    # laisserait le bandeau de la visite précédente en place.
    tiers_page:
      navigate: new
      routes:
        default: tiers_page

    locked_page:
      navigate: new
      routes:
        default: locked_page

    combat:
      navigate: new
      routes:
        default: combat

    salon_tasks:
      navigate: new
      routes:
        default: salon_tasks

    animaux_tasks:
      navigate: new
      routes:
        default: animaux_tasks

    bureau_tasks:
      navigate: new
      routes:
        default: bureau_tasks

    chambre_enfant_tasks:
      navigate: new
      routes:
        default: chambre_enfant_tasks

    chambre_parentale_tasks:
      navigate: new
      routes:
        default: chambre_parentale_tasks

    courses_tasks:
      navigate: new
      routes:
        default: courses_tasks

    cuisine_tasks:
      navigate: new
      routes:
        default: cuisine_tasks

    dechets_tasks:
      navigate: new
      routes:
        default: dechets_tasks

    entree_tasks:
      navigate: new
      routes:
        default: entree_tasks

    extras_tasks:
      navigate: new
      routes:
        default: extras_tasks

    garage_tasks:
      navigate: new
      routes:
        default: garage_tasks

    jardin_tasks:
      navigate: new
      routes:
        default: jardin_tasks

    linge_tasks:
      navigate: new
      routes:
        default: linge_tasks

    repas_tasks:
      navigate: new
      routes:
        default: repas_tasks

    vaisselle_tasks:
      navigate: new
      routes:
        default: vaisselle_tasks

    salle_de_bain_tasks:
      navigate: new
      routes:
        default: salle_de_bain_tasks

    terrasse_tasks:
      navigate: new

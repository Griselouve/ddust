# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  # --- documents config (masque flutter/modules/dvdocuments/config.yml) --------
  documents:
    # Bucket d'AMORÇAGE seulement : à cet instant le joueur n'a pas encore de région, il
    # faut donc bien en désigner un en dur pour aller chercher index.json. Cet index liste
    # les documents de TOUTES les régions (pudocuments l'écrit à l'identique dans chaque
    # bucket), et les documents eux-mêmes sont ensuite lus à leur URL régionale. Un joueur
    # américain fait donc un seul aller-retour vers l'Europe, au tout premier lancement.
    #
    # Ce bucket reste celui de la cible de RÉFÉRENCE, y compris pour une build bâtie sur
    # la cible d'essai : les textes légaux sont publics et identiques mot pour mot, et les
    # servir depuis `eut` obligerait à y publier un corpus complet pour rien.
    bucket_base_url: "https://storage.googleapis.com/dvddust-eu-documents-storage"
    # ⚠ RÉGION = MARCHÉ, PAS DATACENTER. Ce que le joueur choisit ici décide des
    #   documents légaux qu'on lui présente, et de rien d'autre. Le datacenter — la
    #   clé `documents.session.cloud_region` — en est déduit par le `regions_catalog`
    #   de dvdocuments : `fr` pointe vers `eu`.
    # ⚠ CONSÉQUENCE VOULUE, le jour où un second royaume européen s'ouvrira : deux
    #   joueurs de royaumes différents mais du même datacenter partagent une base,
    #   donc peuvent appartenir au même clan tout en lisant des conditions générales
    #   différentes. Toute comparaison « sont-ils joignables ? » se fait pour cette
    #   raison sur cloud_region, jamais sur la région (cf. _inviteRegionMismatch).
    # ⚠ CE QUE LE JOUEUR CHOISIT EST UN PAYS, pas un marché. Personne ne sait ce
    #   qu'est le royaume « eun » ; tout le monde sait où est le Danemark. Le marché
    #   se déduit du pays, et le datacenter du marché — le joueur n'en voit rien.
    # ⚠ `options` N'EST PLUS ÉCRIT ICI, et c'est le fond de l'affaire : dvdocuments
    #   dérive la liste de son `regions_catalog` (un pays par pays des marchés
    #   ouverts, libellé `@@@T:country_<iso>@@@`, drapeau du datacenter). Une liste
    #   tenue à la main aurait été à rallonger à chaque ouverture de marché, et
    #   l'oubli n'aurait sauté aux yeux qu'en production. On ne redéclare ici que ce
    #   qu'on veut habiller autrement, pays par pays — aujourd'hui, rien.
    # ⚠ `default` reste un MARCHÉ : il ne pré-sélectionne rien à l'écran, il sert de
    #   repli pour résoudre les documents tant que la session est muette.
    # ⚠ UN SEUL PAYS AUJOURD'HUI, et c'est volontaire : `documents.regions` du
    #   build.yml n'ouvre que la France. L'écran de choix reste affiché malgré tout
    #   — choisir son royaume est l'acte par lequel le joueur reconnaît le droit
    #   qui lui sera appliqué, et un écran sauté ne vaut pas déclaration.
    # ⚠ CE QUI LE GARANTIT est désormais dvdocuments lui-même : depuis le
    #   2026-09-12, le module ne déduit PLUS jamais la région (`_autoResolveRegions`
    #   supprimée). Il l'avait fait en silence jusque-là, et le paragraphe ci-dessus
    #   n'était qu'un commentaire sans effet. `enabled: true` suffit donc : la seule
    #   façon de ne pas poser l'écran serait `enabled: false`, que ddust n'utilise pas
    #   et n'utilisera pas.
    region:
      enabled: true
      default: "fr"
    birthdate:
      enabled: true
      display: 26
    lang:
      default: "fr"
    acceptance:
      cgu:
        mode: "checkbox"
        title: "@@@T:documents_acceptance_title@@@"
    # Déclaration du chef de clan au moment d'ouvrir un recrutement (invite_consent_screen).
    # Elle voyage avec l'invitation et se colle à la preuve d'acceptation des CGU de celui qui
    # entre : c'est le couplage qui manquait entre l'acte du chef et la personne du nouveau venu.
    #
    # ⚠ DEUX ACQUITTEMENTS, ET PLUS UN SEUL À TROIS CASES (2026-09-22). Un enfant n'entre
    #   qu'avec un accord : il dit d'abord qu'il veut jouer, et son accord est joint (QR code
    #   ou lien, « Accueillir un enfant »). D'où :
    #   * `guardian` : les deux cas « enfant », proposés SEULEMENT quand un accord d'enfant est
    #     joint ; le scellé embarque alors cet accord (documents.seal_ack avec `assent`), qui
    #     voyage jusqu'au dossier de l'enfant et s'enregistre aussi sous le compte du parent
    #     (documents.record_guardian_decision) ;
    #   * `adult` : le seul cas « adulte », pour « QR Code du clan » et « Inviter à distance »
    #     sans accord joint.
    #   documents.show_ack pousse TOUTES les options d'un acquittement, sans filtre : la règle
    #   se lit donc ici, dans la découpe, et le worker n'a qu'à choisir lequel montrer.
    # ⚠ CES CAS SONT CEUX DE invite_consent_notice, et ils doivent le rester : la mention
    #   les annonce, les cases les font déclarer. En changer un ici sans changer l'autre ferait
    #   déclarer au chef quelque chose qu'il n'a pas lu.
    # ⚠ `guardian: true` pose `accepted_as_parental_guardian` sur la preuve. « Il s'agit d'un
    #   adulte » ne le pose PAS : un adulte n'a pas de responsable légal. Et c'est ce drapeau
    #   que l'appareil de l'enfant vérifie avant d'entrer (worker._handleClanJoin) : un mineur
    #   venu avec une invitation « adulte » n'est pas admis.
    # ⚠ UNE DÉCLARATION PAR INVITATION : le worker la vide après la première admission.
    acknowledgements:
      adult:
        doc: "cgu"
        choice: "one"
        items:
          - id: "adult"
            label: "@@@T:invite_ack_adult@@@"
            guardian: false
      guardian:
        doc: "cgu"
        choice: "one"
        items:
          - id: "child_reads"
            label: "@@@T:invite_ack_child_reads@@@"
            guardian: true
          - id: "child_read_aloud"
            label: "@@@T:invite_ack_child_read_aloud@@@"
            guardian: true
    # Indexé par région-marché, comme age_thresholds : c'est le droit qui décide si
    # une porte parentale est requise, et le droit suit le marché.
    parentalgate:
      fr:
        a: "parentalgate.invoke_gate"
        k: ""
    # Un SEUL seuil opère : 18 ans, l'âge de la majorité contractuelle. Tout mineur, quel
    # que soit son âge, relève du consentement de son responsable légal : ddust n'exploite
    # jamais le consentement propre du mineur que l'article 8 du RGPD autorise à partir de
    # 13-16 ans selon l'État membre (15 ans en France).
    # ⚠ La règle SURVIT à l'ouverture d'un marché hors Union : ce qui varie d'un droit à
    #   l'autre — COPPA aux États-Unis, la LPD suisse — est porté par la RÉDACTION des
    #   documents de ce marché, jamais par un palier applicatif. C'est cette décision-là,
    #   et elle seule, qui rend le corpus recopiable d'un marché au suivant.
    # ⚠ Le seuil bas reste déclaré à 0 : la clé `k` DOIT exister, car _computeLegalState
    # (dvdocuments_motor) initialise l'état légal à la clé du plus petit seuil. La
    # supprimer ferait basculer le défaut sur `a` et rendrait adulte un enfant de cinq ans.
    # ⚠ Ce bloc est désormais une SURCHARGE : dvdocuments livre déjà ces mêmes seuils
    # pour chaque région de son catalogue. On les redéclare ici parce que le choix de
    # ne jamais exploiter le consentement propre du mineur est un choix de ddust, et
    # qu'il doit rester lisible dans la conf de ddust — pas hérité en silence.
    age_thresholds:
      fr:
        k: 0
        a: 18
    actions:
      on_session_ready: "worker.on_documents_ready"
      on_acceptance_complete: "worker.on_acceptance_complete"
      on_delete_complete: ""
      on_region_confirmed: "worker.on_region_screen_done"
    # Tant que la session Firebase est anonyme, dvdocuments n'écrit rien : la session légale
    # reste locale (en mémoire : couche `prelogin`, jamais sur le disque) et l'acceptation des
    # CGU attend en mémoire. Tout part en base d'un coup au flush (worker._flushOnboarding),
    # à la liaison du compte, pour l'adulte comme pour le mineur, l'acceptation étant rejouée
    # avec son horodatage réel.
    deferred:
      when_action: "worker.is_anonymous"
      # Application bloquée par dvautover (mise à jour forcée, clan à mettre à jour ou en
      # maintenance) : pas même la session légale, réécrite sinon à chaque connexion.
      also_when_actions:
        - "autover.is_blocked"

  # `regions:` N'EST PLUS ÉCRIT ICI, ET C'ÉTAIT UN DUPLICATA. Le builder l'injecte
  # depuis la cible d'infrastructure visée par le build (build.yml de la suite,
  # `build.targets.<cible>.regions`). Le client lit ce bloc pour balayer les régions
  # au login (worker_session : _resolveUserId, _findBestSession) et retrouver seul la
  # région d'un joueur qui réinstalle l'app.
  #
  # Conséquence directe et voulue : une app de production ne connaît que `EU`, une app
  # d'essai ne connaît que `EUT`. Aucune des deux ne peut balayer la base de l'autre,
  # et le balayage ne fait plus qu'un aller-retour.

  settings:
    configurations:
      android_mobile:
        os: android
        disposition: mobile
      windows_desktop:
        os: windows
        disposition: desktop
    parameters:
      lang:
        type: select
        modifiable: true
        default: "fr"
        action: "lang.set"
        options:
          fr: "Français"
          en: "English"
          es: "Español"
          de: "Deutsch"
          it: "Italiano"
          pt: "Português (Portugal)"
          br: "Português (Brasil)"
          nl: "Nederlands"

  virtuallobby:
    ttl_hours: 72
    actions:
      on_management_created: "worker.on_management_created"
      on_consent_required: "worker.on_consent_required_clan"
      on_submission_created: ""
      on_accepted: "worker.on_virtuallobby_accepted"
      on_rejected: ""
      on_cancelled: ""
      on_status_changed: "worker.on_submission_status_changed"

  lock:
    # Expiration par défaut d'un verrou, en millisecondes (override possible par appel).
    default_ttl_ms: 30000

  deeplink:
    routes:
      "ddust://invite": "worker.on_invite_clan_link"
      # ⚠ `ddust://request` RETIRÉ le 2026-09-22, avec tout le parcours « demande d'entrée » : il
      #   faisait entrer un candidat sans passer par la déclaration du chef, en réutilisant la
      #   dernière déclaration scellée. Un vieux lien de ce type n'ouvre plus rien.
      # Invitation à distance : le couple {group_id, lobby_id} est chiffré par un PIN (vive voix).
      "ddust://invitepin": "worker.on_invite_pin_link"
      # L'accord de l'enfant (« je veux jouer »), envoyé à son parent depuis kid_assent_share.
      # Ouvert par le parent : sa déclaration s'ouvre, en mode enfant (worker.on_assent_link).
      "ddust://assent": "worker.on_assent_link"

  share:
    testmessage:
      text: "@@@T:create_clan_confirm@@@"
    # region= : un clan ne vit que dans sa région de stockage. Sans elle, un joueur d'une autre
    # région suivrait le lien et tomberait sur un « clan introuvable » sans explication.
    #
    # ⚠️ Les partages d'invitation (et celui de l'accord de l'enfant) portent `share_site_link` en dernière ligne, comme le
    # partage de journal. Ce n'est pas de la décoration : le destinataire d'une invitation est,
    # par définition, quelqu'un qui n'a PAS encore le jeu. Un lien `ddust://` seul ne fait
    # strictement rien sur un téléphone sans l'app — et le parent qui l'envoie croit avoir tout
    # dit. C'est le seul endroit du partage qui indique où trouver le jeu, et c'est ici qu'il
    # compte le plus. Le logo accompagne le message pour qu'il soit identifiable dans un fil.
    # `worker.pending_invite_type` : `&k=child&n=<code>` ou `&k=adult`, la nature de
    # l'invitation et le code de la demande de l'enfant. Posé par worker.on_share_clan_invite le
    # temps du partage seulement (le code d'un enfant n'a rien à faire sur le disque du chef).
    # ⚠ `worker.invite_out_*` (clan, lobby, région), posés eux aussi le temps du partage : c'est
    # l'invitation SORTANTE du chef. Jamais `worker.pending_group_id` / `pending_lobby_id`, qui
    # sont l'invitation REÇUE : au lancement suivant, on_login rejouait celle du chef comme une
    # candidature dans son propre lobby.
    clan_invite:
      text: "@@@T:share_clan_invite_text@@@\n\n@@@T:share_clan_invite_link@@@\nddust://invite?group_id=@@@worker.invite_out_group_id@@@&lobby_id=@@@worker.invite_out_lobby_id@@@&region=@@@worker.invite_out_region@@@@@@worker.pending_invite_type@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    # L'accord de l'enfant, envoyé à son parent (kid_assent_share). Même lien que le QR code
    # de l'écran, posé par worker.on_kid_assent_share_appear. Sans donnée personnelle : il peut
    # traverser n'importe quelle messagerie. Le lien du site en dernière ligne, comme partout :
    # un parent qui n'a pas encore le jeu doit savoir où le trouver.
    kid_assent:
      text: "@@@T:share_kid_assent_text@@@\n@@@worker.kid_assent_link@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    # Invitation à distance : token chiffré posé dans worker.invite_out_pin_token le seul temps du
    # partage (worker.on_share_clan_invite_pin), jamais au-delà : il n'a rien à faire sur le disque du chef.
    # Le PIN est dicté de vive voix, jamais dans le lien.
    clan_invite_pin:
      text: "@@@T:share_clan_invite_pin_text@@@\n\n@@@T:share_clan_invite_link@@@\nddust://invitepin?token=@@@worker.invite_out_pin_token@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    # MULTICLAN : échange entre adultes à distance (chef qui accueille un enfant d'un autre clan,
    # candidat co-représentant). Même lien et même écran de saisie que l'invitation d'un clan ;
    # jeton posé dans worker.guardian_out_token le seul temps du partage. Le code est dicté.
    guardian_link:
      text: "@@@T:share_guardian_link_text@@@\n\n@@@T:share_clan_invite_link@@@\nddust://invitepin?token=@@@worker.guardian_out_token@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    # Journal (joueur, clan, ou récit IA du conte du butin) : logo (image) + accroche + corps, tous
    # deux posés au runtime par worker.on_log_appear dans log.share_intro / log.share_text.
    # L'accroche VARIE selon ce qui est partagé (journal brut vs récit narratif IA) — c'est pour ça
    # qu'elle est indirectée par @@@log.share_intro@@@ et non écrite en dur ici comme avant.
    # Résolu par dvsocialshare (Android).
    # La dernière ligne porte le lien du site vitrine (@@@T:share_site_link@@@, une URL par langue) :
    # c'est le seul endroit du partage qui dit où trouver le jeu. Elle est écrite ICI et non dans
    # l'accroche runtime parce qu'elle ne varie pas, elle : journal brut ou conte IA, même lien.
    log:
      text: "@@@log.share_intro@@@\n\n@@@log.share_text@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    # Partage DE L'APP (panneau « Noter et partager », worker.on_rate_share). Deux messages, un
    # seul choisi selon `app_share.store_url` : vide → le site (test interne, pas de fiche
    # publique), rempli → la fiche Play.
    app_site:
      text: "@@@T:share_app_text@@@\n\n@@@T:share_site_link@@@"
      image: "images/big/logo.png"
    app_store:
      text: "@@@T:share_app_text@@@\n\n@@@app_share.store_url@@@"
      image: "images/big/logo.png"

  # LA BASCULE TEST INTERNE → PUBLIÉ. Vide tant que l'app n'a pas de fiche publique : le partage
  # envoie le site et les étoiles n'ouvrent rien. Le jour de la publication, y coller l'URL de la
  # fiche (https://play.google.com/store/apps/details?id=<package>) avec la build de sortie. Pas
  # de valeur déduite : l'app ignore son stade Play, et le package de l'entrée neuve n'est pas
  # encore connu (com.grisloup.ddust_client est brûlé).
  app_share:
    store_url: ""

  # --- Interludes : ce qui EXISTE ---------------------------------------------------
  # Les cinq célébrations que le worker sait déclencher (dvinterlude.play.<id>). On ne déclare ICI
  # que ce qui relève de l'APPLICATION : le DvSplash où poser le texte (une shape du registry) et
  # les actions à tirer à la fin (les verrous du worker).
  #
  # Tout le CONTENU — la scène dvflame, le son, la vibration, et leurs définitions — vit dans le
  # THÈME (resources_cloud/layers/theme-donjon-global.yml). Un autre univers y redéfinit les
  # animations à son goût sans toucher une ligne d'ici.
  interludes:
    # ACCUEIL DU NOUVEAU JOUEUR — le seul interlude qui se joue avant que quoi que ce soit
    # n'existe : pas de session, pas de royaume, pas de réseau. Quatre tableaux embarqués.
    #
    # `freeze` au défaut (true) : L'INTERLUDE NE SE SAUTE PAS. Il l'a pu un temps, par
    #   un voile tapable — puis on l'a retiré. C'est trente secondes une fois dans la
    #   vie d'une installation, et c'est le seul moment où le jeu explique de quoi il
    #   parle avant de commencer à demander. Laisser passer outre, c'est laisser arriver
    #   au premier formulaire quelqu'un qui ne sait toujours pas où il est — exactement
    #   ce qu'on corrige ici. Le gel `quiet` de dvorb ne peint rien : il rend seulement
    #   l'écran sourd aux taps le temps de la scène.
    # `music: keep` : aucune ambiance ne joue encore sur `home`. Avec `cut` (le défaut),
    #   la fin de l'interlude tirerait `dvsound.ambiance.resume` et FERAIT DÉMARRER une
    #   musique que personne n'avait lancée — l'ambiance du donjon a son moment, bien
    #   plus loin, à la sortie de l'écran de l'âge.
    # `guard: 45` : au-delà des 30,6 s de la scène, marge comprise. Le garde-fou ne
    #   protège pas la scène, il protège l'application d'une scène qui ne finirait
    #   jamais (vue détruite par une navigation imprévue).
    # Pas de `splash` : le texte CHANGE à chaque tableau. C'est le worker qui le pose,
    #   beat après beat, via `dvorb.splash.home/intro_label`.
    intro:
      music: keep
      guard: 45
      on_finished:
        worker: { order: 1, action: "worker.on_intro_finished" }

    # ⚠ LES TROIS PASSAGES (`passage_region`, `passage_royaume`, `passage_age`) SONT
    #   DECLARES AU THEME, et non ici. Ils y portent leur `on_covered` — donc leur
    #   destination — et cela n'a de sens qu'à côté de la scène dont ils dépendent : le
    #   moment de la bascule est un instant de la timeline, pas un réglage d'écran.

    # LE PACTE — quatre secondes, à la sortie des conditions.
    #
    # `music: keep` : l'ambiance du donjon tourne depuis l'écran de l'âge. La couper puis
    #   la reprendre pour quatre secondes s'entendrait comme un incident.
    # `guard: 15` : deux fois la scène, marge comprise. Comme ailleurs, il ne protège pas
    #   la scène mais l'application d'une scène qui ne finirait jamais.
    # Pas de `splash` : il n'y a rien à lire, la voix dit tout.
    pacte:
      music: keep
      guard: 15
      on_finished:
        worker: { order: 1, action: "worker.on_pacte_finished" }

    # Montée de niveau ET bienvenue clan. Le `on_finished` ne relâche aucun garde : il réveille
    # l'attente de on_dashboard_appear, qui ne rend la main au tutoriel qu'une fois la bienvenue
    # terminée (sans quoi le voile du tuto se poserait par-dessus la scène `burn`). Une vraie
    # montée de niveau tire le même hook et ne trouve simplement rien à réveiller.
    levelup:
      splash: commons/levelup_label
      on_finished:
        worker: { order: 1, action: "worker.on_celebration_end" }
    # Passage à l'âge adulte (bascule légale t → a), AVANT la CGU adulte : la célébration « burn »
    # (texte adulthood_anim), puis le rideau sous lequel la CGU s'ouvre (worker._playAdulthood).
    # Le `on_finished` du rideau double son `on_covered` (déclaré au thème) : un rideau préempté
    # avant d'avoir couvert l'écran ouvre quand même la CGU. Le worker n'agit qu'une fois.
    adulthood:
      splash: commons/levelup_label
      on_finished:
        worker: { order: 1, action: "worker.on_adulthood_finished" }
    passage_adulthood:
      on_finished:
        worker: { order: 1, action: "worker.on_adulthood_covered" }
    # MULTICLAN : le rideau du changement de clan (« Bon retour parmi … »). La bascule a lieu
    # sous le noir (on_covered, déclaré au thème) ; `on_finished` la double si le rideau est
    # préempté avant d'avoir couvert l'écran. Le worker n'agit qu'une fois.
    passage_switch:
      splash: my_clans_page/switch_label
      on_finished:
        worker: { order: 1, action: "worker.on_switch_covered" }
    giftxp: { splash: commons/giftxp_label }
    giftgold: { splash: commons/giftgold_label }
    # Victoire de tâche validée : image seule (aucun texte → pas de splash), pas de verrou worker.
    # Scène + son vivent dans le thème (interludes.victory / flame.scenes.victory).
    victory: {}

    # Le soin et la mort ne déclarent pas de splash : leur texte n'est connu qu'après une lecture
    # réseau (le soigneur), le worker le pose lui-même quand il l'a.
    # Ils relâchent en revanche le verrou de leur célébration à la fin — que la scène ait fini
    # normalement, que le garde-fou ait dû la terminer, ou qu'un autre interlude l'ait préemptée.
    heal:
      on_finished:
        worker: { order: 1, action: "worker.on_celebration_end" }
    gameover:
      on_finished:
        worker: { order: 1, action: "worker.on_celebration_end" }

    # Ouverture du butin : splash doré + relâche du verrou worker à la fin. La scène navigue en
    # cours de route (worker.butin_reveal, tiré à l'acte qui couvre l'écran d'or) : c'est SOUS la
    # nappe que l'écran de récompenses est empilé.
    butin:
      splash: commons/butin_label
      on_finished:
        worker: { order: 1, action: "worker.on_celebration_end" }


# -----------------------------------------------------------------------------
# --- Fragment de conf.registry — issu du découpage de config.yml (voir plan
# --- 'a-force-de-developper' / memoire project_ddust_config_split).
# -----------------------------------------------------------------------------
conf:
  registry:
    #//------------------------------- Clan Screen ---------------------------------

    clan_page:
      masks:
        - page_taskbar
      show_appbar: true
      show_back: false
      title: "@@@T:Clan@@@"
      actions:
        # PAS de `- dvtuto.enter` ici (même raison que `dashboard` et `combat`) : une liste d'actions
        # n'est pas awaitée, la leçon tournait EN PARALLÈLE de on_clan_appear et évaluait ses gardes
        # chef sur un rôle pas encore établi. C'est on_clan_appear qui l'appelle, en dernier.
        appear:
          - worker.on_clan_appear
      registry:
        - commons/splash_background
        - clan_page/icon
        - clan_page/label
        - clan_page/title_label
        - clan_page/lvl_track
        - clan_page/lvl_fill
        - clan_page/lvl_flame
        - clan_page/lvl_label
        - clan_page/xp_label
        - clan_page/butin_track
        - clan_page/butin_fill
        - clan_page/butin_chest_ip
        - clan_page/butin_chest_ok
        - clan_page/butin_label
        - clan_page/roster
        # Appel au recrutement, PAR-DESSUS le bas du roster : listé après lui pour le z-order.
        # N'existe visuellement que quand le clan est seul, donc au-dessus d'un vide.
        - clan_page/invite_cta
        - clan_page/roster_menu
        - clan_page/settings
        - clan_page/settings_menu
        - clan_page/edit_toggle
        - clan_page/edit_avatar_big
        - clan_page/edit_name_big
        # Ordre = z-order : l'aura SOUS le coffre, et les deux au-dessus de tout le reste.
        - clan_page/butin_aura
        - clan_page/butin_open
        # Le consentement du chef au recrutement a quitte cet ecran le 2026-09-15 : il a
        # desormais le sien (invite_consent_screen, plus bas dans ce fichier).
        # Overlay de retrait du consentement parental — listé APRÈS celui du recrutement :
        # les deux ne s'ouvrent jamais ensemble, mais celui-ci porte une suppression et doit
        # couvrir tout le reste sans exception.
        - clan_page/consent_scrim
        - clan_page/consent_panel
        - clan_page/consent_yes
        - clan_page/consent_no

    clan_page/lvl_track:
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 4%
        w: 29%
        h: 2.4%
        background_color: "0xFF99864E"
        border_radius: 6.0
        border: false

    clan_page/lvl_fill:
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 4%
        w: 1%
        h: 2.4%
        background_color: "0xFFB11226"
        border_radius: 6.0
        border: false

    clan_page/lvl_flame:
      class: DvImage
      layer: content
      shape:
        x: 1%
        y: -1%
        w: 10%
        h: 10%
        stretch: "RATIO_IN"
        image: "images/small/flamme_nobg.png"
        border: false

    clan_page/lvl_label:
      class: DvLabel
      layer: content
      shape:
        x: 32%
        y: 0%
        w: 16%
        h: 7%
        text_align: CENTER
        text_padding: 0.0
        font_size: 19.0
        font_color: "WHITE"
        label: "1"
        border: false
        stretch: "RATIO_IN"
        image: "images/medium/shield.png"

    clan_page/xp_label:
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 4%
        w: 28%
        h: 2.4%
        text_align: RIGHT
        text_padding: 0.0
        font_size: 10.0
        font_color: "BLACK"
        label: ""
        border: false

    # --- Barre de BUTIN (miroir à droite de la barre d'XP du clan) ---------------
    # Piste/remplissage = copies de lvl_track/lvl_fill, mais à droite (miroir autour
    # de x=50%). Le remplissage est ANCRÉ À DROITE : x/w sont recalculés à chaud par
    # on_clan_appear. À la place de la flamme : un coffre (chestip), remplacé par
    # chestok quand le butin atteint son max → deux DvImage empilées dont on bascule
    # la visibilité (show/hide), car reload() écraserait un shape.image posé à chaud.
    clan_page/butin_track:
      class: DvLabel
      layer: content
      shape:
        x: 66%
        y: 4%
        w: 29%
        h: 2.4%
        background_color: "0xFF99864E"
        border_radius: 6.0
        border: false

    clan_page/butin_fill:
      class: DvLabel
      layer: content
      shape:
        x: 66%
        y: 4%
        w: 1%
        h: 2.4%
        background_color: "0xFFB11226"
        border_radius: 6.0
        border: false

    clan_page/butin_chest_ip:
      class: DvImage
      layer: content
      shape:
        x: 89%
        y: 1%
        w: 8%
        h: 8%
        stretch: "RATIO_IN"
        image: "images/small/chestip.png"
        visible: true
        border: false

    clan_page/butin_chest_ok:
      class: DvImage
      layer: content
      shape:
        x: 89%
        y: 1%
        w: 8%
        h: 8%
        stretch: "RATIO_IN"
        image: "images/medium/chestok.png"
        visible: false
        border: false

    clan_page/butin_label:
      class: DvLabel
      layer: content
      shape:
        x: 67%
        y: 4%
        w: 28%
        h: 2.4%
        text_align: LEFT
        text_padding: 0.0
        font_size: 10.0
        font_color: "BLACK"
        label: ""
        border: false

    # --- Ouverture du butin : le coffre doré et son aura ------------------------
    # Révélés ENSEMBLE par worker.on_clan_appear quand le butin est au plafond ET que le joueur est
    # un chef (visible:false par défaut, idiome items/explorer). L'aura est déclarée AVANT le coffre
    # dans le registry de clan_page : elle se dessine donc SOUS lui.
    #
    # Vue transparente de la scène dvflame `chestaura` (halo qui respire + rayons). Elle déborde
    # volontairement le coffre de tous les côtés — c'est là que vivent les rayons. `interactive`
    # reste à false (défaut) : IgnorePointer, les taps traversent jusqu'au coffre.
    clan_page/butin_aura:
      class: DvSceneView
      layer: content
      scene: chestaura
      shape:
        x: 75%
        y: 4%
        w: 25%
        h: 15%
        visible: false
        border: false

    # Le coffre plein, dans la bande de droite laissée libre par le kebab (rapetissé et calé en
    # 67-77 %). C'est LE déclencheur de la cérémonie d'ouverture : il prend le verrou dvlock et
    # empile butin_open_page.
    # `actions` et NON `freezing_actions` : le gel d'une page est un booléen, pas un compteur
    # (DvPage.freeze). La cérémonie s'achève par une animation qui pose son propre gel, et la fin
    # d'une action gelante l'effacerait. Le double tap est écarté par la garde du worker.
    clan_page/butin_open:
      class: DvImage
      layer: content
      shape:
        x: 81%
        y: 8%
        w: 14%
        h: 7%
        stretch: "RATIO_IN"
        image: "images/medium/chestok.png"
        visible: false
        border: false
        events:
          tap: true
        actions:
          tap: worker.on_butin_open_tap

    clan_page/icon:
      class: DvLabel
      shape:
        x: 35%
        w: 30%
        y: 0%
        h: 20%
        image_fallback: "images/medium/nope.png"

    clan_page/label:
      mask: commons/intro_text
      layer: content
      shape:
        x: 5%
        y: 16%
        w: 90%
        h: 10%
        text_align: CENTER
        label: "@@@session.clan.name@@@"
        border: true

    # Titre du clan : posé en bas du panneau du nom, change toutes les 5 niveaux de clan.
    # Rempli à chaud par on_clan_appear (write d'un token @@@T:clan_title_N@@@).
    clan_page/title_label:
      class: DvLabel
      layer: content
      shape:
        x: 5%
        y: 22.5%
        w: 90%
        h: 4%
        text_align: CENTER
        text_padding: 0.0
        font_size: 11.0
        font_color: "0xFFB11226"
        label: ""
        border: false

    # --- Édition du clan (miroir de l'édition du personnage) -------------------
    # Petite icône edit discrète (haut droite) → toggle_clan_edit révèle les 2
    # grosses icônes edit (avatar + nom du clan).
    clan_page/edit_toggle:
      class: DvLabel
      layer: content
      shape:
        x: 55%
        y: 1%
        w: 8%
        h: 5%    
        stretch: "RATIO_IN"
        image: "images/medium/icon_edit.png"
        border: false
        label: ""
        events:
          tap: true
        actions:
          tap: worker.toggle_clan_edit

    # Bouton settings de l'en-tête (kebab « … » doré, identique à celui des tuiles du roster).
    # Ouvre le menu clan_page/settings_menu.
    clan_page/settings:
      class: DvMenuButton
      layer: content
      menu: clan_page/settings_menu
      menu_enabled: true
      # Même cadre doré que les boutons du roster (fond noir ~60 % + cadre doré).
      button_style: commons/donjon_button
      # Bande libre à droite, SOUS la barre de butin (y4-9 %) et le coffre (y1-9 %), au-dessus du
      # bandeau du nom (y16 %). Coincé entre l'avatar du clan (qui finit à x65 %) et le coffre doré
      # d'ouverture du butin (qui commence à x81 %) : la zone tient en 67-77 %.
      # ATTENTION : DvMenuButton peint un carré de côté min(w,h) CENTRÉ dans la zone, mais la zone
      # entière reste cliquable — c'est w qui déborderait sur l'avatar, pas le dessin. Pour
      # rapetisser le kebab il faut donc baisser w ET h (sinon la dimension déjà minimale gagne).
      shape:
        x: 67%
        y: 9%
        w: 10%
        h: 5%
        border: false

    # Menu du bouton settings de l'écran Clan (Journal, accueil d'un enfant, QR, invitation,
    # tutoriels + « Créer un joueur »). Le selector clan_settings_selector filtre les options
    # réservées au chef : recruter (enfant, QR, invitation à distance) et « Créer un joueur »
    # n'apparaissent que pour un admin ; seuls le journal et les tutoriels sont visibles par tous.
    # ⚠ Une option ajoutée ici est à reporter dans le panneau du tutoriel qui lui correspond
    #   (dvtuto.yml, menu_options ou menu_options_admin) : ils sont écrits à la main.
    clan_page/settings_menu:
      class: DvMenu
      layer: popup
      selector: worker.clan_settings_selector
      show_label: false
      shape:
        w: 55%
        background_color: "0xF01A1A1A"
        border_color: "amber_200"
        border_size: 1.0
        border_radius: 10.0
        font_color: "amber_200"
        font_size: 15.0
      options:
        clan_log:
          image: "images/small/scroll_nobg.png"
          desc: "@@@T:clan_menu_log_desc@@@"
          shape:
            label: "@@@T:clan_menu_log@@@"
          actions:
            tap: worker.open_clan_log
        # Accueillir un enfant : l'enfant a dit qu'il voulait jouer, son téléphone affiche un QR
        # code ; le chef le scanne, voit cet accord, déclare, puis invite (QR ou à distance).
        # C'est la SEULE porte d'un enfant : « QR Code du clan » et « Inviter à distance » ne
        # proposent plus que le cas adulte. Réservé au chef (clan_settings_selector), double
        # garde dans worker.on_welcome_child. Icône Material `face` (un visage, pas d'asset) :
        # elle est dans la liste blanche de DvHelper, que `child_care` n'est pas.
        welcome_child:
          icon: "face"
          desc: "@@@T:clan_menu_welcome_child_desc@@@"
          shape:
            label: "@@@T:clan_menu_welcome_child@@@"
          actions:
            tap: worker.on_welcome_child
        # Fait entrer un ADULTE dans le clan par QR code (sans accord d'enfant joint, seul le cas
        # adulte est proposé). Réservé au chef (clan_settings_selector), avec double garde dans
        # worker.on_invite_clan.
        clan_qr:
          image: "images/small/qr-code.png"
          desc: "@@@T:clan_menu_qr_desc@@@"
          shape:
            label: "@@@T:clan_menu_qr@@@"
          actions:
            tap: worker.on_invite_clan
        # Invitation à distance : lien chiffré par PIN, partagé sur les réseaux sociaux (pas de QR).
        # Icône Material Flutter (partage) au lieu d'un asset — colorée par le thème du menu.
        # Réservé au chef (clan_settings_selector), double garde dans worker.on_invite_clan_remote.
        clan_invite_remote:
          icon: "share"
          desc: "@@@T:clan_menu_invite_remote_desc@@@"
          shape:
            label: "@@@T:clan_menu_invite_remote@@@"
          actions:
            tap: worker.on_invite_clan_remote
        tutorials:
          image: "images/medium/nope.png"
          desc: "@@@T:clan_menu_tutorials_desc@@@"
          shape:
            label: "@@@T:clan_menu_tutorials@@@"
          actions:
            tap: navigate_new.tutoriels
        # Créer un joueur enfant (sans téléphone ni compte Google), admis directement dans le
        # clan. Réservé au chef (clan_settings_selector). Icône Material group_add (colorée par
        # le thème, pas d'asset). Ouvre l'écran create_player_screen.
        create_player:
          icon: "group_add"
          desc: "@@@T:clan_menu_create_player_desc@@@"
          shape:
            label: "@@@T:clan_menu_create_player@@@"
          actions:
            tap: worker.create_player
        # « Mes achats » a DÉMÉNAGÉ dans le kebab de la boutique (shop/settings_menu).
        # Tout ce qui touche à l'argent se regroupe sur l'écran qui le vend : l'écran
        # Clan n'a plus à en parler, et l'on ne cherche plus son relevé de cotisation
        # sous un menu qui parle de recrutement et de tutoriels.

    #//------------------------------- ECRAN de CONSENTEMENT du chef (recrutement) -------
    # Ouvert par worker.on_invite_clan / on_invite_clan_remote / on_welcome_child / on_assent_link
    # AVANT que le lobby ne soit cree :
    # le chef qui recrute fait potentiellement entrer un enfant dans son clan, il doit avoir la
    # mention de responsabilite legale et le lien vers les CGU adulte sous les yeux A CET INSTANT
    # (RGPD art. 8 : le consentement doit etre eclaire au moment de l'acte, pas seulement a
    # l'installation). Un seul point de passage pour le QR et pour l'invitation a distance : c'est
    # la DEMANDE de recrutement qui est gardee, pas l'ecran qui en decoule.
    #
    # ⚠ UN ECRAN, ET NON PLUS UN OVERLAY. C'etait jusqu'au 2026-09-15 un voile noir a 80 % pose
    #   sur clan_page. L'idiome maison proscrit la fenetre MODALE, pas la page : le voile laissait
    #   le roster, la banniere de recrutement et le coffre transparaitre sous le texte, ce qui
    #   donnait trois plans de lecture superposes pour un acte qui engage la responsabilite legale
    #   du chef. Une declaration se lit sur un fond qui ne bouge pas.
    #
    # ⚠ LE RETOUR EST LIBRE (`show_back: true`). Renoncer a inviter ne demande aucune confirmation,
    #   et `worker.pending_invite_kind` est repose a chaque ouverture : un retour sans passer par
    #   « Pas maintenant » ne laisse donc rien derriere lui.
    #
    # DEUX MODES (worker.on_invite_consent_appear) :
    #   * ENFANT, quand un accord d'enfant est joint (« Accueillir un enfant », lien ddust://assent) :
    #     le panneau de tete montre ce que l'enfant a accepte, quand, et le texte qui lui a ete
    #     montre ; les cases se limitent aux deux cas « enfant » ; le chef choisit ensuite QR code
    #     ou invitation a distance (invite_consent_screen/kind) ;
    #   * ADULTE, sinon : une seule case, « il s'agit d'un adulte », et le panneau de tete dit
    #     comment faire entrer un enfant (ou, apres un scan rate, que ce n'etait pas un accord).
    invite_consent_screen:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: "@@@T:invite_consent_title@@@"
      # ⚠ `actions` A LA RACINE, et non sous `shape:`. C'est de la racine que l'appear d'une PAGE
      #   est tire ; declare sous `shape:`, il ne part jamais (cf. la correction du 2026-09-14 sur
      #   douze pages). L'appear reconstruit les cases a neuf et rallume le bouton eteint.
      actions:
        appear:
          - worker.on_invite_consent_appear
      registry:
        - commons/splash_background
        - invite_consent_screen/panel
        - invite_consent_screen/assent
        - invite_consent_screen/notice
        - documents/ack_options
        - invite_consent_screen/kind
        - invite_consent_screen/yes
        - invite_consent_screen/no

    # Fond du bloc de lecture. Sur l'overlay, c'est le voile noir qui portait le texte ; ici le
    # decor de l'ecran passerait au travers et rendrait la mention illisible. Meme fond que les
    # boutons du jeu (noir ~60 % + cadre dore) : l'ecran reste dans le donjon.
    invite_consent_screen/panel:
      class: DvLabel
      layer: content
      shape:
        x: 4%
        y: 2%
        w: 92%
        h: 68%
        background_color: "0x99000000"
        border: true
        border_color: "amber_200"
        border_size: 1.0
        border_radius: 8.0
        label: ""

    # En tete, ce qui a PRECEDE la decision du chef. En mode enfant : l'accord de l'enfant, sa
    # date et le texte qu'on lui a montre (dans la langue du chef, qui doit le comprendre). En
    # mode adulte : comment faire entrer un enfant, ou pourquoi le code scanne n'a pas suffi.
    # Toujours rempli par le worker (on_invite_consent_appear), jamais vide a l'ecran.
    # En mode enfant, la premiere ligne est le CODE de la demande (invite_consent_assent_code),
    # en blanc (marqueurs [[ ]] + highlight_color) : le chef le compare a celui que l'enfant
    # affiche en grand. Deux lignes de plus dans une case qui n'a pas grandi : `scrollable`,
    # pour qu'une langue longue ne coupe jamais la fin du texte montre a l'enfant.
    invite_consent_screen/assent:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 7%
        y: 3%
        w: 86%
        h: 24%
        font_size: 11.0
        font_color: "amber_200"
        highlight_color: "0xFFFFFFFF"
        scrollable: true
        text_align: LEFT
        label: ""

    # Le masque commons/parental_consent fournit la mise en page (JUSTIFY, link_color, lien inline
    # vers les CGU adulte) ; le LIBELLE, lui, est surcharge. Son texte par defaut est
    # inconditionnel (« vous declarez etre son responsable legal »), ce qui n'est vrai que sur
    # l'ecran de creation d'un profil d'enfant : ici, on ne sait pas qui scannera le QR — un
    # adulte, un enfant sans clan, ou un enfant deja pris en charge par le chef d'un autre clan.
    # invite_consent_notice enonce les trois cas et ne fait declarer que celui qui s'applique.
    # ⚠️ Aucun events.tap ici : le GestureDetector de la shape capterait le tap avant le lien.
    # Descendue sous le panneau de l'accord (2026-09-22), et resserree : les cases, elles, n'ont
    # plus que deux lignes au plus.
    invite_consent_screen/notice:
      masks:
        - commons/parental_consent
      layer: content
      shape:
        x: 7%
        y: 28%
        w: 86%
        h: 20%
        font_size: 12.0
        font_color: "amber_200"
        label: "@@@T:invite_consent_notice@@@"

    # Les cas annonces par la mention ci-dessus (deux « enfant » avec un accord joint, « adulte »
    # seul sinon : cf. les deux acquittements de screens_meta.yml), mais A COCHER : le chef ne se contente
    # plus d'accuser reception, il declare CELUI qui s'applique — et cette declaration part avec
    # l'invitation pour se coller a la preuve d'acceptation de celui qui entrera (cf.
    # documents.acknowledgements dans screens_meta.yml).
    # Les options ne sont PAS ecrites ici : documents.show_ack les pousse depuis la conf du
    # module, coquille vide comme documents/region_menu.
    documents/ack_options:
      layer: content
      shape:
        x: 7%
        y: 49%
        w: 86%
        h: 12%
        font_color: "amber_200"
        font_size: 12.0
        row_height: 28.0
        events:
          change: true
        actions:
          change: worker.on_invite_ack_changed

    # QR code ou invitation a distance, en mode ENFANT seulement : invisible ailleurs, ou
    # l'option du menu a deja choisi. Un tap bascule (worker.on_invite_kind_toggle) ; le libelle
    # dit le mode courant ET qu'on peut le changer. Le mode de depart suit la facon dont
    # l'accord est arrive : scanne sur place → QR code, lien recu → a distance.
    invite_consent_screen/kind:
      masks:
        - commons/btn_wide
      layer: content
      shape:
        x: 7%
        y: 62%
        w: 86%
        h: 7%
        text_align: CENTER
        font_size: 12.0
        label: ""
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_invite_kind_toggle

    # Le bouton est ETEINT ET SOURD a l'ouverture de l'ecran, et ne s'allume qu'une fois une
    # case cochee (worker._setInviteYesReady) : une invitation sans declaration ne part pas.
    # `events.tap` est declare a true ici — c'est le worker qui le coupe et le retablit.
    invite_consent_screen/yes:
      masks:
        - commons/btn_wide
      layer: content
      shape:
        y: 74%
        h: 11%
        text_align: CENTER
        label: "@@@T:invite_consent_yes@@@"
        events:
          tap: true
        actions:
          tap: worker.on_confirm_invite_consent

    invite_consent_screen/no:
      masks:
        - commons/btn_wide
      layer: content
      shape:
        y: 87%
        h: 11%
        text_align: CENTER
        label: "@@@T:invite_consent_no@@@"
        events:
          tap: true
        actions:
          tap: worker.on_cancel_invite_consent

    #//------------------ Retrait du consentement parental (art. 7(3) RGPD) -------------
    # Overlay de confirmation du retrait, et de sa rétractation. Idiome maison — layer overlay
    # + visible:false + scrim worker.noop —, JAMAIS de popup modale (cf. personnage/delete_*,
    # dont ceci est le décalque). Ouvert par worker.withdraw_consent / worker.restore_consent,
    # qui écrivent le texte du panneau et les libellés des deux boutons à l'exécution : le même
    # overlay sert les deux gestes, en sens inverse.
    #
    # Le texte dit ce que le retrait FAIT et ce qu'il NE FAIT PAS — il n'interdit pas à l'enfant
    # de jouer un jour ailleurs, et il n'efface pas la preuve du consentement, qui est close et
    # datée. C'est ce que promettent les documents publiés ; le panneau ne peut pas dire moins.
    clan_page/consent_scrim:
      class: DvLabel
      layer: overlay
      shape:
        x: 0%
        y: 0%
        w: 100%
        h: 100%
        background_color: "#FF000000"
        opacity: 0.9
        border: false
        visible: false
        events:
          tap: true
        actions:
          tap: worker.noop # avale les taps derrière le panneau

    clan_page/consent_panel:
      class: DvLabel
      layer: overlay
      shape:
        x: 6%
        y: 14%
        w: 88%
        h: 48%
        text_align: CENTER
        font_size: 14.0
        font_color: "amber_200"
        # Même opacité que consent_yes/consent_no (héritée de commons/shape) : DvImageView
        # applique shape.opacity au texte lui-même (cf. personnage/delete_panel).
        opacity: 0.6
        border: false
        label: " "
        visible: false

    clan_page/consent_yes:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 66%
        h: 12%
        text_align: CENTER
        label: " "
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_consent_confirm

    clan_page/consent_no:
      masks:
        - commons/btn_wide
      layer: overlay
      shape:
        y: 81%
        h: 12%
        text_align: CENTER
        label: " "
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_consent_cancel

    #//------------------------------- Tutoriels (dvtuto) ------------------------------
    # Page listant les leçons (accès via le menu settings du Clan). DvTiroir SANS selector → un tap
    # sur une leçon exécute directement dvtuto.replay.<id> : navigue vers l'écran de la leçon et la
    # rejoue en forçant (ignore la porte « vue »). Ajouter une icône par nouvelle leçon.
    tutoriels:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: "@@@T:tutoriels_title@@@"
      background_color: black
      registry:
        - tutoriels/list

    tutoriels/list:
      class: DvTutoList          # liste scrollable de titres (auto-alimentée par conf.dvtuto.lessons)
      layer: content
      shape:
        x: 4%
        y: 3%
        w: 92%
        h: 93%

    clan_page/edit_avatar_big:
      class: DvLabel
      layer: overlay
      shape:
        x: 42%
        y: 5%
        w: 16%
        h: 10%
        stretch: "RATIO_IN"
        image: "images/medium/icon_edit.png"
        border: false
        label: ""
        visible: false
        events:
          tap: true
        actions:
          tap: worker.open_clan_avatar_explorer

    clan_page/edit_name_big:
      class: DvLabel
      layer: overlay
      shape:
        x: 42%
        y: 17%
        w: 16%
        h: 8%
        stretch: "RATIO_IN"
        image: "images/medium/icon_edit.png"
        border: false
        label: ""
        visible: false
        events:
          tap: true
        actions:
          tap: worker.edit_clan_name

    #//------------------------------- Clan avatar explorer ------------------------------
    # Explorateur d'avatars de clan : grille (DvExplorer) filtrée sur icon_XX_C_XX.png.
    clan_avatar_explorer:
      masks:
        - page
      show_appbar: true
      show_back: true
      title: "@@@T:choose_avatar@@@"
      background_color: black
      registry:
        - clan_avatar_explorer/grid

    clan_avatar_explorer/grid:
      class: DvExplorer
      layer: content
      selector: worker.on_clan_avatar_selected
      shape:
        x: 3%
        y: 3%
        w: 94%
        h: 90%
        show_filename: false
        show_miniature: true
        selection: single
        folder: "images/medium"
        regex_filter: "icon_[0-9]+_C_[0-9]+[.]png"
        border_color: "0xFFEAD9A6"

    # Liste scrollable des membres du clan (une tuile par joueur). Peuplée à chaud
    # par worker.on_clan_appear via l'action dvroster.set_members. y 28% → sous le
    # titre du clan ; jusqu'à ~86% (au-dessus de la taskbar à 88%). L'entête reste fixe.
    clan_page/roster:
      class: DvRoster
      layer: content
      # Menu contextuel ouvert au tap sur une tuile (DvRoster le gère lui-même : ouverture +
      # bascule d'un joueur à l'autre). L'app ne fournit que les données, le menu et ses actions.
      menu: clan_page/roster_menu
      # Menu activé au tap (comportement DvRoster). false → exécuterait l'option seule du selector.
      menu_enabled: true
      # Tri métier des tuiles (optionnel) : action worker → admins d'abord (alpha), puis les autres (alpha).
      sort: worker.clan_roster_sort
      # Mode boutons : au lieu d'ouvrir le menu au tap, afficher les options du menu (mêmes clefs,
      # même selector, mêmes actions) en icônes cliquables sous le nom. L'icône de chaque option
      # est déclarée dans `menu` (clef `image:` par option).
      buttons: true
      # Replier toutes les options derrière l'icône « … » : aucune icône d'option directe sur la
      # tuile, seul le kebab 3 points s'affiche → tap ouvre le menu vertical de toutes les options.
      buttons_collapsed: true
      # Nombre max d'icônes en ligne. Au-delà : les 4 premières + une icône « … » qui ouvre le
      # menu vertical (liste de TOUTES les options, icône à gauche + libellé à droite).
      buttons_max: 5
      # Taille (px) des icônes d'action en ligne (plus grosses = plus lisibles pour les enfants).
      buttons_size: 52
      # Style de thème du cadre des boutons (fond noir ~60 % + cadre doré).
      button_style: commons/donjon_button
      shape:
        x: 3%
        y: 28%
        w: 94%
        h: 58%
        border: false
        # Flammèche au bout de la barre de progrès « butin » de chaque joueur (sous le nom).
        # Sert aussi de badge « tâche en cours » (bas-droit de l'avatar).
        flame_image: "images/small/flamme_nobg.png"
        # Badge « demande de validation » (bas-droit de l'avatar) : la main.
        hand_image: "images/small/hand_nobg.png"
        # Les 5 clefs suivantes SURCHARGENT les défauts codés en dur de DvRoster (dvroster.dart),
        # tous en `images/big/…` : sans elles, le framework irait chercher ces 5 fichiers dans
        # `big/` alors qu'ils ont été reclassés (reclassement des images, cf. readme.md §12).
        nope_image:  "images/medium/nope.png"        # repli avatar introuvable
        ecu_image:   "images/medium/shield.png"      # écu de niveau
        heart_image: "images/small/heart_nobg.png"   # cœur de PV
        skull_image: "images/big/skull_nobg.png"     # crâne (mort) — reste en big (voile de mort, 256 dp)
        crown_image: "images/small/crown.png"        # couronne d'admin
        # Bourse du bord droit de la tuile (montant = champ `wallet` poussé par le worker). En la
        # déclarant, on demande le badge : sans cette clef, DvRoster n'en dessine aucun. Elle prend
        # le bord droit et repousse le kebab à sa gauche — l'argent se lit à la même place pour
        # tout le monde, y compris les joueurs qui n'ont pas de kebab (aucune option).
        purse_image: "images/medium/bourse.png"
        # Raccourci : taper la bourse joue directement l'option `pay_tribute` du roster_menu, au
        # lieu de passer par le kebab. Même clef, même selector (worker.clan_selector) → inerte
        # pour qui n'y a pas droit (non-chef) ou n'a rien à encaisser (bourse vide, option grisée).
        purse_option: "pay_tribute"

    # APPEL AU RECRUTEMENT. Un roster d'une seule tuile n'est pas un état neutre du jeu, c'est un
    # clan qui n'a pas encore commencé : il doit se réclamer lui-même. Le geste de recrutement vivait
    # uniquement derrière le kebab (5 taps, une icône de 10%×5% à deviner) — c'est le geste que les
    # parents ratent le plus, alors que c'est le seul qui compte à ce moment-là.
    #
    # Le tap appelle `worker.on_invite_clan`, donc EXACTEMENT le même chemin que l'option du kebab :
    # overlay de consentement RGPD d'abord (l'invitation peut faire entrer un enfant), lobby ensuite.
    # Aucun raccourci sur le consentement, seulement sur la découverte.
    #
    # Visibilité pilotée par _syncInviteCta (worker_screen_clan.dart) et PERSISTÉE en config registry
    # (idiome écran born-filled) : la bannière naît dans le bon état au rebuild, sans clignoter.
    # Placée en bas de la zone du roster (qui court jusqu'à ~86%, taskbar à 88%) : avec une seule
    # tuile, tout le bas de l'écran est vide.
    clan_page/invite_cta:
      masks:
        - commons/btn_wide
      layer: content
      shape:
        y: 74%
        # 12 % et non 11 : cinquante caracteres en corps 14 tiennent sur deux lignes dans
        # 90 % de largeur, et il faut de quoi les loger toutes les deux sans rogner la
        # seconde. `text_padding: 0` retire la marge interne du gabarit de bouton, qui
        # mangeait une partie de cette hauteur.
        h: 12%
        text_padding: 0.0
        text_align: CENTER
        font_size: 14.0
        label: "@@@T:clan_invite_cta@@@"
        visible: false
        events:
          tap: true
        actions:
          tap: worker.on_invite_clan

    # Menu contextuel ouvert au clic sur une tuile joueur (worker.dvroster.tap appelle
    # act("show", {x,y})). Trigger invisible (show_label:false) : c'est un « fantôme »
    # dans le layer popup, l'overlay s'ouvre à la position du tap. Chaque entrée (map
    # clef → shape.label + actions.tap) est ÉDITABLE ici ; les actions ciblent le handler
    # préfixé rostermenu.<clef>, qui lit le joueur cliqué dans session.selected_player_*.
    clan_page/roster_menu:
      class: DvMenu
      layer: popup
      show_label: false
      # Sélecteur : appelé avec `data` (infos du joueur cliqué) juste avant l'ouverture ;
      # retourne la liste des clefs d'options valides (seules celles-ci s'affichent).
      selector: worker.clan_selector
      shape:
        w: 55%
        background_color: "0xF01A1A1A"
        border_color: "amber_200"
        border_size: 1.0
        border_radius: 10.0
        font_color: "amber_200"
        font_size: 15.0
      # Chaque option porte une `image:` (icône du bouton en mode `buttons` du roster), en plus
      # de son label (repli mode menu) et de son action de tap. L'ordre d'affichage effectif est
      # décidé par le selector (worker.clan_selector) ; l'ordre ci-dessous n'est qu'indicatif.
      options:
        player_log:
          image: "images/small/scroll_nobg.png"
          desc: "@@@T:roster_menu_log_desc@@@"
          shape:
            label: "@@@T:roster_menu_log@@@"
          actions:
            tap: worker.open_player_log
        revive_player:
          image: "images/small/pharma.png"
          desc: "@@@T:roster_menu_revive_desc@@@"
          shape:
            label: "@@@T:roster_menu_revive@@@"
          actions:
            tap: worker.revive_player
        support_player:
          image: "images/small/xp_nobg.png"
          desc: "@@@T:roster_menu_support_desc@@@"
          shape:
            label: "@@@T:roster_menu_support@@@"
          actions:
            tap: worker.support_player
        declare_offline:
          image: "images/small/notconnected_nobg.png"
          desc: "@@@T:roster_menu_offline_desc@@@"
          shape:
            label: "@@@T:roster_menu_offline@@@"
          actions:
            tap: worker.declare_offline
        take_place:
          image: "images/small/switch_nobg.png"
          desc: "@@@T:roster_menu_takeplace_desc@@@"
          shape:
            label: "@@@T:roster_menu_takeplace@@@"
          actions:
            tap: worker.take_place
        promote_chief:
          image: "images/small/chef_nobg.png"
          desc: "@@@T:roster_menu_promote_chief_desc@@@"
          shape:
            label: "@@@T:roster_menu_promote_chief@@@"
          actions:
            tap: worker.promote_chief
        nomore_chief:
          image: "images/small/nomore_chef.png"
          desc: "@@@T:roster_menu_nomore_chief_desc@@@"
          shape:
            label: "@@@T:roster_menu_nomore_chief@@@"
          actions:
            tap: worker.nomore_chief
        promote_adult:
          image: "images/small/adult.png"
          desc: "@@@T:roster_menu_promote_adult_desc@@@"
          shape:
            label: "@@@T:roster_menu_promote_adult@@@"
          actions:
            tap: worker.promote_adult
        pay_tribute:
          image: "images/medium/bourse.png"
          desc: "@@@T:roster_menu_pay_tribute_desc@@@"
          shape:
            label: "@@@T:roster_menu_pay_tribute@@@"
          actions:
            tap: worker.pay_tribute
        # Rappels de relance. Deux options EXCLUSIVES arbitrées par clan_selector (idiome
        # promote_chief / nomore_chief) : une seule des deux est jamais proposée. Icônes
        # Material plutôt qu'images : ce sont des réglages, pas des actes de jeu.
        nudges_off:
          icon: "notifications_off"
          desc: "@@@T:roster_menu_nudges_off_desc@@@"
          shape:
            label: "@@@T:roster_menu_nudges_off@@@"
          actions:
            tap: worker.nudges_off
        nudges_on:
          icon: "notifications_active"
          desc: "@@@T:roster_menu_nudges_on_desc@@@"
          shape:
            label: "@@@T:roster_menu_nudges_on@@@"
          actions:
            tap: worker.nudges_on
        # Hors concours. Deux options EXCLUSIVES arbitrées par clan_selector, réservées aux
        # joueurs ADULTES (masquées ailleurs, pas grisées) et proposées y compris sur soi-même :
        # le cas nominal est le chef qui se met lui-même en retrait pour ne pas écraser ses
        # enfants. Icônes Material, comme nudges_* : c'est un réglage, pas un acte de jeu.
        hors_concours_on:
          icon: "self_improvement"
          desc: "@@@T:roster_menu_hors_concours_on_desc@@@"
          shape:
            label: "@@@T:roster_menu_hors_concours_on@@@"
          actions:
            tap: worker.hors_concours_on
        hors_concours_off:
          icon: "sports_score"
          desc: "@@@T:roster_menu_hors_concours_off_desc@@@"
          shape:
            label: "@@@T:roster_menu_hors_concours_off@@@"
          actions:
            tap: worker.hors_concours_off
        revoke_player:
          image: "images/small/byebye_nobg.png"
          desc: "@@@T:roster_menu_revoke_desc@@@"
          shape:
            label: "@@@T:roster_menu_revoke@@@"
          actions:
            tap: worker.revoke_player
        # RETRAIT DU CONSENTEMENT PARENTAL (art. 7(3) RGPD). Proposée aux seuls chefs du CLAN
        # D'ORIGINE d'un joueur mineur — même règle que promote_adult, et pour la même raison :
        # c'est le seul clan dont le consentement est en cause. À ne pas confondre avec
        # revoke_player, qui retire du clan sans rien effacer : ici on cesse de TRAITER.
        # Le libellé est celui que publient les 84 politiques de confidentialité adultes (§ 9) —
        # ⚠ ne pas le reformuler sans reprendre le corpus.
        withdraw_consent:
          image: "images/small/poubelle.png"
          desc: "@@@T:roster_menu_withdraw_consent_desc@@@"
          shape:
            label: "@@@T:roster_menu_withdraw_consent@@@"
          actions:
            tap: worker.withdraw_consent
        # Retour arrière pendant le délai de rétractation. clan_selector n'expose QUE cette
        # option sur une tuile en cours de retrait : le joueur est hors du jeu, il n'y a rien
        # d'autre à lui faire.
        restore_consent:
          image: "images/small/adm_enable.png"
          desc: "@@@T:roster_menu_restore_consent_desc@@@"
          shape:
            label: "@@@T:roster_menu_restore_consent@@@"
          actions:
            tap: worker.restore_consent

    #//------------------------------- Log Screen ------------------------------------
    # Écran narratif « journal d'un joueur » : ouvert depuis le menu roster (option
    # player_log, admins). worker.on_log_appear lit clans_logs, reconstitue l'histoire
    # chronologique du joueur cliqué (_logPlayerId/_logPlayerName) et écrit le texte
    # résolu dans log_page/story.

    log_page:
      masks:
        - page
      show_appbar: true
      show_back: true # retour → clan_page (écran empilé via navigate_new)
      title: "@@@T:log_page_title@@@"
      actions:
        appear: worker.on_log_appear
      registry:
        - commons/splash_background # même fond splash.png que le dashboard
        - log_page/logo
        - log_page/story
        - log_page/share

    # Logo « Donjons & Savons » en haut, même largeur que le frame (94%). Ratio ≈ 2.26 :
    # box un poil plus haute que nécessaire + RATIO_IN + align TOP → image pleine largeur,
    # ancrée en haut (léger vide bas absorbé sous le frame).
    log_page/logo:
      class: DvImage
      layer: content
      shape:
        x: 3%
        y: 2%
        w: 94%
        h: 26%
        image: "images/big/logo.png"
        stretch: RATIO_IN
        align: TOP
        border: false

    # DvRichLabel (Markdown) noir bordé d'or, sous le logo (style tiroir des tâches).
    # Seedé avec un @@@T:@@@ pour l'écouteur de traduction ; le worker y réécrit ensuite le
    # récit en Markdown (en-têtes de date via <center>…</center>, entrées en paragraphes).
    log_page/story:
      class: DvRichLabel
      layer: content
      shape:
        x: 3%
        y: 27%
        w: 94%
        h: 70%
        text_align: LEFT
        valign: TOP # texte ancré en haut (pas centré verticalement)
        scrollable: true # défilement si le récit dépasse la hauteur
        border: true
        border_color: "0xFFB07328"
        border_size: 1.0
        border_radius: 6.0
        background_color: "black"
        opacity: 0.8
        font_color: "#C8A84B"
        font_size: 11.0
        text_padding: 10.0
        label: "@@@T:log_page_loading@@@"

    # Icône « Partager » (bas centre, chevauche le bas du frame) → dvsocialshare (Android) :
    # logo + récit (share.log). Rendue dans une pastille circulaire (fond sombre + bordure or)
    # pour la visibilité : box carrée (~60px) + border_radius = moitié → cercle.
    #
    # RÉSERVÉE AUX ADULTES (`legal_state == "a"`), révélée par worker.on_log_appear. C'est le
    # SEUL point d'export du journal vers l'extérieur — le conte du butin y aboutit aussi — et
    # « le partage vers l'extérieur est réservé aux adultes : un enfant ne peut rien publier »
    # est une phrase publiée (§ 5.3 du dossier « intérêt supérieur de l'enfant »).
    # Adulte et non chef : le rôle de chef est une fonction de jeu, la phrase parle de majorité
    # légale. Un second parent membre partage l'histoire de sa famille sans avoir été promu.
    # `visible: false` par défaut — le repli d'une lecture en échec est de ne rien montrer.
    # Le tap passe par worker.on_log_share et non par share.log : masquer une icône n'est pas
    # une autorisation, l'action doit refuser d'elle-même si on l'appelle autrement.
    log_page/share:
      class: DvIcon
      layer: content
      shape:
        x: 42.5%
        y: 87%
        w: 15%
        h: 9%
        icon: "share"
        icon_color: "#C8A84B"
        icon_size: 26
        background_color: "0xCC1A1A1A"
        border: true
        border_color: "0xFFB07328"
        border_size: 1.5
        border_radius: 30.0
        visible: false
        events:
          tap: true
        freezing_actions:
          tap: worker.on_log_share


    #//------------------------- EMPRUNT DE COMPTE : LE CODE TEMPORAIRE --------------------
    # Deux écrans pour un seul geste : prêter son compte à son enfant, et se donner le moyen de
    # le reprendre. Ils encadrent take_place / restore_self (worker_members.dart).
    #
    # Ce qui est en jeu n'est pas de l'argent — la boutique est fermée aux non-adultes — mais
    # les options d'administration, dont la validation par l'enfant de ses PROPRES tâches.
    # Et ce n'est pas une serrure : l'enfant tient un téléphone déverrouillé, effacer les
    # données de l'app depuis les réglages Android remet tout à zéro. C'est un cran contre le
    # retour accidentel ou opportuniste, et rien de plus ne doit être promis.
    #
    # SAISIE MASQUÉE, en deux shapes. DvNumpad lit et écrit sa valeur DANS SA CIBLE d'affichage
    # (`display:`), donc masquer directement cette cible casserait la saisie — le pavé relirait
    # des points. `.../buffer` est donc invisible et porte les chiffres ; `.../mask` montre les
    # points. Le code est choisi devant l'enfant, autant ne pas l'afficher en clair.
    # `show_ok: false` fait auto-valider à CHAQUE chiffre : le worker ignore tout ce qui n'a pas
    # la longueur attendue.

    imp_pin_set:
      masks:
        - page
      show_appbar: false          # pas de retour système : on sort par Annuler, qui a un sens métier
      title: "@@@T:imp_pin_set_title@@@"
      shape:
        actions:
          appear: worker.on_imp_pin_set_appear
      registry:
        - commons/icon_background
        - imp_pin_set/intro
        - imp_pin_set/mask
        - imp_pin_set/buffer
        - imp_pin_set/numpad
        - imp_pin_set/cancel

    imp_pin_set/intro:
      masks:
        - commons/intro_text
      shape:
        y: 6%
        h: 20%
        font_size: 13.0
        label: "@@@T:imp_pin_set_intro@@@"

    imp_pin_set/mask:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 10%
        y: 29%
        w: 80%
        h: 8%
        text_align: CENTER
        font_size: 30.0
        font_weight: bold
        label: ""

    # Cible RÉELLE du pavé : porte les chiffres, jamais affichée.
    imp_pin_set/buffer:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 10%
        y: 29%
        w: 80%
        h: 8%
        label: ""
        visible: false

    imp_pin_set/numpad:
      class: DvNumpad
      layer: content
      shape:
        x: 10%
        y: 39%
        w: 80%
        h: 44%
        display: "imp_pin_set/buffer"
        btn_border_radius: 8.0
        gap: 6.0
        show_ok: false
        show_back: true
        events:
          submit: true
        actions:
          submit: worker.on_imp_pin_set

    imp_pin_set/cancel:
      masks:
        - commons/btn_wide
      shape:
        y: 86%
        h: 8%
        text_align: CENTER
        font_size: 13.0
        label: "@@@T:imp_pin_set_cancel@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_imp_pin_set_cancel

    # --- Reprise du compte : saisie du code -------------------------------------------------
    # `message` porte les trois états successifs : invitation, essais restants, blocage. Le pavé
    # et le masque disparaissent au 5e échec, remplacés soit par `unlock` (l'appareil sait
    # vérifier son propriétaire), soit par rien du tout et une échéance — sur un appareil sans
    # verrou il n'y a aucune sortie à proposer, et l'application rend la main toute seule.
    imp_pin_ask:
      masks:
        - page
      show_appbar: false          # sortir par la flèche système reviendrait à contourner la demande
      title: "@@@T:imp_pin_ask_title@@@"
      shape:
        actions:
          appear: worker.on_imp_pin_ask_appear
      registry:
        - commons/icon_background
        - imp_pin_ask/message
        - imp_pin_ask/mask
        - imp_pin_ask/buffer
        - imp_pin_ask/numpad
        - imp_pin_ask/unlock
        - imp_pin_ask/cancel

    imp_pin_ask/message:
      masks:
        - commons/intro_text
      shape:
        y: 6%
        h: 20%
        font_size: 13.0
        label: "@@@T:imp_pin_ask_intro@@@"

    imp_pin_ask/mask:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 10%
        y: 29%
        w: 80%
        h: 8%
        text_align: CENTER
        font_size: 30.0
        font_weight: bold
        label: ""

    imp_pin_ask/buffer:
      masks:
        - commons/nobordershape
      class: DvLabel
      layer: content
      shape:
        x: 10%
        y: 29%
        w: 80%
        h: 8%
        label: ""
        visible: false

    imp_pin_ask/numpad:
      class: DvNumpad
      layer: content
      shape:
        x: 10%
        y: 39%
        w: 80%
        h: 44%
        display: "imp_pin_ask/buffer"
        btn_border_radius: 8.0
        gap: 6.0
        show_ok: false
        show_back: true
        events:
          submit: true
        actions:
          submit: worker.on_imp_pin_ask

    # Révélé au 5e échec, et SEULEMENT si l'appareil a un verrou. Il plafonne la garantie au
    # verrou de l'appareil — assumé : un adulte qui a oublié son code doit pouvoir rentrer chez
    # lui sans support ni réinitialisation.
    imp_pin_ask/unlock:
      masks:
        - commons/btn_wide
      shape:
        y: 50%
        h: 10%
        text_align: CENTER
        label: "@@@T:imp_pin_ask_unlock@@@"
        visible: false
        events:
          tap: true
        freezing_actions:
          tap: worker.on_imp_device_unlock

    # Annuler = RESTER sur le compte de l'enfant. Refermer une demande de code ne vaut jamais
    # réponse correcte, et c'est le seul repli sûr.
    imp_pin_ask/cancel:
      masks:
        - commons/btn_wide
      shape:
        y: 86%
        h: 8%
        text_align: CENTER
        font_size: 13.0
        label: "@@@T:imp_pin_ask_cancel@@@"
        events:
          tap: true
        freezing_actions:
          tap: worker.on_imp_pin_cancel

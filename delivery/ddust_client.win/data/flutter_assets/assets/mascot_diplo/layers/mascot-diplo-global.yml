          - { weight: 6,  seq: [[coucou, 1000], [ref, 0]] }
          - { weight: 5,  seq: [[saute, 420], [ref, 0]], fx: hop }
        reactions:
          - { weight: 1, seq: [[assis, 500], [appelle, 1100], [ref, 0]], fx: pulse }
          - { weight: 1, seq: [[rit, 1100], [ref, 0]], fx: shake }
          - { weight: 1, seq: [[saute, 450], [ref, 0]], fx: hop }
          - { weight: 1, seq: [[assis, 350], [bulle, 1400], [ref, 0]] }
          - { weight: 1, seq: [[roule, 1600], [ref, 0]] }
          - { weight: 1, seq: [[surpris, 600], [coucou, 900], [ref, 0]], fx: hop }
          - { weight: 1, seq: [[timide, 1400], [ref, 0]] }

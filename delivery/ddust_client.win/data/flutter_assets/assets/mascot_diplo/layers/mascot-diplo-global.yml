        poses_names:
          land: pose
          help: aide
          listen: assis
          think: queue
          wave: coucou
          yawn: baille
          sleep: dort
          surprised: surpris
          blink: cligne
          laugh: rit
          shy: timide
          petted: roule          # sur le dos, ventre en l'air : la caresse

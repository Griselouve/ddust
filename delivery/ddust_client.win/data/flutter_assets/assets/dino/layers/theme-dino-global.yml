        es: El cuidador de dinos que tus padres eligieron para ti ya no está disponible. Envía una nueva solicitud
          a tus padres.
        de: Der Dino-Hüter, den deine Eltern für dich ausgewählt haben, ist nicht mehr verfügbar. Schick deinen
          Eltern eine neue Anfrage.
        it: Il guardiano dei dino che i tuoi genitori avevano scelto per te non è più disponibile. Manda una nuova
          richiesta ai tuoi genitori.
        pt: O guardião dos dinos que os teus pais escolheram para ti já não está disponível. Envia um novo pedido

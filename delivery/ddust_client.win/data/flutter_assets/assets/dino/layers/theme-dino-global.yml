          Deze tekst is bedoeld voor het gezin dat het heeft beleefd: een herinnering aan wat het samen heeft gedaan. Let op, het gezin kan ervoor kiezen hem te delen met mensen om zich heen (grootouders, vrienden): hij moet dus begrijpelijk blijven voor iemand die het spel niet kent. Hij probeert nooit reclame te maken voor het spel.

          Hier zijn de naam van de stam en zijn beschrijving:
          ---
          @@@worker.narrate_clan@@@
          ---
          Hier is zijn dagboek (chronologisch, van nieuw naar oud):
          ---
          @@@worker.narrate_input@@@

      decisiontree_intro:
        fr: |-
          Le conteur du feu a besoin de quelques infos pour préparer tes missions...

          Ce qui se dit au coin du feu reste au coin du feu : tes réponses ne sont pas enregistrées, mais elles servent à améliorer ton jeu.
          Tu ne le feras qu'une fois !
        en: |-
          The fireside storyteller needs a few details to prepare your missions...

          What's said by the campfire stays by the campfire: your answers aren't recorded, but they help make your game better.
          You'll only do this once!
        es: |-
          El cuentacuentos del fuego necesita algunos detalles para preparar tus misiones...

          Lo que se dice junto al fuego, se queda junto al fuego: tus respuestas no se guardan, pero ayudan a mejorar tu juego.
          ¡Solo lo harás una vez!
        de: |-
          Der Geschichtenerzähler am Feuer braucht ein paar Angaben, um deine Aufträge vorzubereiten...

          Was am Lagerfeuer gesagt wird, bleibt am Lagerfeuer: Deine Antworten werden nicht gespeichert, aber sie helfen, dein Spiel besser zu machen.
          Du machst das nur ein einziges Mal!
        it: |-
          Il cantastorie del falò ha bisogno di qualche informazione per preparare le tue missioni...

          Ciò che si dice al falò resta al falò: le tue risposte non vengono salvate, ma servono a migliorare il tuo gioco.
          Lo farai una volta sola!
        pt: |-
          O contador de histórias da fogueira precisa de algumas informações para preparar as tuas missões...

          O que se diz à fogueira fica à fogueira: as tuas respostas não são guardadas, mas servem para melhorar o teu jogo.
          Só o farás uma vez!
        br: |-
          O contador de histórias da fogueira precisa de algumas informações para preparar suas missões...

          O que se diz na fogueira fica na fogueira: suas respostas não são salvas, mas servem para melhorar seu jogo.
          Você só vai fazer isso uma vez!
        nl: |-
          De verteller bij het vuur heeft wat informatie nodig om je opdrachten voor te bereiden...

          Wat bij het kampvuur gezegd wordt, blijft bij het kampvuur: je antwoorden worden niet opgeslagen, maar ze helpen om je spel beter te maken.
          Je doet dit maar één keer!

      consent_withdraw_warn:
        fr: |-
          Vous retirez votre consentement pour {name}.
          Il quitte le jeu immédiatement.
          Pendant 3 jours, un chef de sa tribu d'origine peut revenir sur cette décision. Passé ce délai, ses données de jeu sont supprimées.
          La preuve de votre consentement n'est pas effacée : elle est close et datée.
          Cela ne l'empêche pas d'être invité un jour dans une autre tribu, par un adulte qui en répondra.
        en: |-
          You are withdrawing your consent for {name}.
          They leave the game immediately.
          For 3 days, a chief of their tribe of origin may reverse this decision. After that, their game data is deleted.
          The proof of your consent is not erased: it is closed and dated.
          This does not prevent them from one day being invited into another tribe, by an adult who answers for them.
        es: |-
          Retiras tu consentimiento para {name}.
          Sale del juego de inmediato.
          Durante 3 días, un jefe de su tribu de origen puede revocar esta decisión. Pasado ese plazo, sus datos de juego se eliminan.
          La prueba de tu consentimiento no se borra: queda cerrada y fechada.
          Esto no impide que algún día se le invite a otra tribu, por un adulto que responda por él.
        de: |-
          Du widerrufst deine Einwilligung für {name}.
          Das Kind verlässt das Spiel sofort.
          3 Tage lang kann ein Chef seines Ursprungsstammes diese Entscheidung rückgängig machen. Danach werden seine Spieldaten gelöscht.
          Der Nachweis deiner Einwilligung wird nicht gelöscht: Er wird abgeschlossen und datiert.
          Das hindert das Kind nicht daran, eines Tages in einen anderen Stamm eingeladen zu werden, von einem Erwachsenen, der dann für es einsteht.
        it: |-
          Stai revocando il tuo consenso per {name}.
          Lascia subito il gioco.
          Per 3 giorni, un capo della sua tribù d'origine può annullare questa decisione. Trascorso questo termine, i suoi dati di gioco vengono eliminati.
          La prova del tuo consenso non viene cancellata: viene chiusa e datata.
          Questo non gli impedisce di essere invitato un giorno in un'altra tribù, da un adulto che ne risponderà.
        pt: |-
          Estás a retirar o teu consentimento para {name}.
          Sai do jogo de imediato.
          Durante 3 dias, um chefe da sua tribo de origem pode reverter esta decisão. Findo esse prazo, os seus dados de jogo são eliminados.
          A prova do teu consentimento não é apagada: fica encerrada e datada.
          Isto não impede que um dia seja convidado para outra tribo, por um adulto que responda por ele.
        br: |-
          Você está retirando seu consentimento para {name}.
          Ele sai do jogo imediatamente.
          Durante 3 dias, um chefe da tribo de origem dele pode reverter essa decisão. Depois desse prazo, os dados de jogo dele são excluídos.
          A prova do seu consentimento não é apagada: fica arquivada e datada.
          Isso não impede que um dia ele seja convidado para outra tribo, por um adulto que responda por ele.
        nl: |-
          Je trekt je toestemming voor {name} in.
          Het kind verlaat het spel meteen.
          Gedurende 3 dagen kan een hoofd van de oorspronkelijke stam dit besluit terugdraaien. Daarna worden de spelgegevens verwijderd.
          Het bewijs van je toestemming wordt niet gewist: het wordt afgesloten en gedateerd.
          Dit belet niet dat het kind ooit in een andere stam wordt uitgenodigd, door een volwassene die ervoor instaat.
      consent_restore_warn:
        fr: |-
          Vous rétablissez {name}.
          Il retrouve son personnage, ses niveaux et sa place dans la tribu, intacts.
          Votre consentement reprend effet.
        en: |-
          You are restoring {name}.
          They get back their character, their levels and their place in the tribe, untouched.
          Your consent takes effect again.
        es: |-
          Restableces a {name}.
          Recupera su personaje, sus niveles y su lugar en la tribu, intactos.
          Tu consentimiento vuelve a surtir efecto.
        de: |-
          Du stellst {name} wieder her.
          Das Kind bekommt seinen Charakter, seine Stufen und seinen Platz im Stamm unversehrt zurück.
          Deine Einwilligung gilt wieder.
        it: |-
          Stai ripristinando {name}.
          Ritrova il suo personaggio, i suoi livelli e il suo posto nella tribù, intatti.
          Il tuo consenso torna a essere valido.
        pt: |-
          Estás a restabelecer {name}.
          Recupera a sua personagem, os seus níveis e o seu lugar na tribo, intactos.
          O teu consentimento volta a produzir efeitos.
        br: |-
          Você está restabelecendo {name}.
          Ele recupera o personagem, os níveis e o lugar dele na tribo, intactos.
          Seu consentimento volta a valer.
        nl: |-
          Je herstelt {name}.
          Het kind krijgt zijn personage, zijn levels en zijn plek in de stam ongeschonden terug.
          Je toestemming geldt weer.

        br: Mostrar o sinal da tribo
        nl: Stamteken tonen
      share_clan_invite_text:
        fr: 'Rejoins ma tribu sur Donjons & Savons ! Les corvées de la maison deviennent des dinos à chouchouter
          : chaque tâche faite rapporte de l''XP, et quand l''œuf de la tribu est plein, il éclot plein de surprises.'
        en: 'Join my tribe on Donjons & Savons! Household chores become dinos to look after: every task earns XP,
          and when the tribe''s egg is full, it hatches with surprises.'
        es: '¡Únete a mi tribu en Donjons & Savons! Las tareas de casa se convierten en dinos que cuidar: cada tarea
          da XP, y cuando el huevo de la tribu está lleno, se abre lleno de sorpresas.'
        de: 'Tritt meinem Stamm in Donjons & Savons bei! Aus den Hausarbeiten werden Dinos zum Umsorgen: Jede erledigte
          Aufgabe bringt XP, und wenn das Dino-Ei des Stammes voll ist, springt es voller Überraschungen auf.'
        it: 'Unisciti alla mia tribù su Donjons & Savons! Le faccende di casa diventano dino da coccolare: ogni
          compito svolto fa guadagnare XP, e quando l''uovo della tribù è pieno, si schiude pieno di sorprese.'
        pt: 'Junta-te à minha tribo no Donjons & Savons! As tarefas da casa tornam-se dinos para cuidar: cada tarefa
          cumprida dá XP, e quando o ovo da tribo está cheio, abre-se cheio de surpresas.'
        br: 'Entre na minha tribo no Donjons & Savons! As tarefas de casa viram dinos pra cuidar: cada tarefa cumprida
          dá XP, e quando o ovo da tribo fica cheio, ele abre cheio de surpresas.'
        nl: 'Word lid van mijn stam in Donjons & Savons! De klusjes in huis worden dino''s om te verzorgen: elke
          voltooide taak levert XP op, en als het ei van de stam vol is, komt het uit vol verrassingen.'
      share_clan_invite_link:
        fr: 'Installe d''abord le jeu (lien plus bas), puis ouvre ce lien pour entrer dans la tribu :'
        en: 'Install the game first (link below), then open this link to join the tribe:'
        es: 'Instala primero el juego (enlace abajo) y luego abre este enlace para entrar en la tribu:'
        de: 'Installiere zuerst das Spiel (Link weiter unten) und öffne dann diesen Link, um dem Stamm beizutreten:'
        it: 'Installa prima il gioco (link più in basso), poi apri questo link per entrare nella tribù:'
        pt: 'Instala primeiro o jogo (ligação mais abaixo) e depois abre esta ligação para entrares na tribo:'
        br: 'Primeiro instale o jogo (link mais abaixo) e depois abra este link para entrar na tribo:'
        nl: 'Installeer eerst het spel (link hieronder) en open daarna deze link om bij de stam te komen:'
      share_clan_invite_pin_text:
        fr: Rejoins ma tribu sur Donjons & Savons ! Les corvées de la maison deviennent des dinos à chouchouter.
          Il te faudra le code à 6 chiffres que je t'ai donné de vive voix.
        en: Join my tribe on Donjons & Savons! Household chores become dinos to look after. You will need the 6-digit
          code I read out to you.
        es: ¡Únete a mi tribu en Donjons & Savons! Las tareas de casa se convierten en dinos que cuidar. Necesitarás
          el código de 6 cifras que te dicté.
        de: Tritt meinem Stamm in Donjons & Savons bei! Aus den Hausarbeiten werden Dinos zum Umsorgen. Du brauchst
          den 6-stelligen Code, den ich dir mündlich gesagt habe.
        it: Unisciti alla mia tribù su Donjons & Savons! Le faccende di casa diventano dino da coccolare. Ti servirà
          il codice a 6 cifre che ti ho detto a voce.
        pt: Junta-te à minha tribo no Donjons & Savons! As tarefas da casa tornam-se dinos para cuidar. Vais precisar
          do código de 6 algarismos que te disse de viva voz.
        br: Entre na minha tribo no Donjons & Savons! As tarefas de casa viram dinos pra cuidar. Você vai precisar
          do código de 6 dígitos que eu falei para você em voz alta.
        nl: Word lid van mijn stam in Donjons & Savons! De klusjes in huis worden dino's om te verzorgen. Je hebt
          de 6-cijferige code nodig die ik je heb verteld.
      invite_wrong_region:
        fr: Cette tribu est gardée dans une autre contrée du monde. Pour la rejoindre, il faut avoir choisi la même
          contrée qu'elle au tout début du jeu.
        en: This tribe is kept in another land. To join it, you must have chosen the same land as it did at the
          very start of the game.
        es: Esta tribu se guarda en otra tierra. Para unirte a ella, debes haber elegido la misma tierra que ella
          al comienzo del juego.
        de: Dieser Stamm wird in einem anderen Land der Welt gehütet. Um ihm beizutreten, musst du ganz am Anfang
          des Spiels dasselbe Land gewählt haben.
        it: Questa tribù è custodita in un'altra terra del mondo. Per unirti, devi aver scelto la sua stessa terra
          all'inizio del gioco.
        pt: Esta tribo está guardada noutra terra do mundo. Para te juntares a ela, tens de ter escolhido a mesma
          terra logo no início do jogo.
        br: Esta tribo está guardada em outra terra do mundo. Para entrar nela, você precisa ter escolhido a mesma
          terra logo no início do jogo.
        nl: Deze stam wordt bewaard in een ander land van de wereld. Om je erbij aan te sluiten, moet je helemaal
          aan het begin van het spel hetzelfde land hebben gekozen.

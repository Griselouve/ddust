      join_wait_text:
        fr: 'Ton chef de tribu doit maintenant confirmer ton arrivée. Tu peux fermer le jeu : tu reviendras ici.'
        en: 'Your tribe chief must now confirm your arrival. You can close the game: you will come back here.'
        es: 'Ahora tu jefe de tribu debe confirmar tu llegada. Puedes cerrar el juego: volverás aquí.'
        de: 'Dein Stammes-Chef muss jetzt deine Ankunft bestätigen. Du kannst das Spiel schließen: Du kommst hierher
          zurück.'
        it: 'Ora il tuo capo della tribù deve confermare il tuo arrivo. Puoi chiudere il gioco: tornerai qui.'
        pt: 'Agora o teu chefe da tribo tem de confirmar a tua chegada. Podes fechar o jogo: voltarás aqui.'
        br: 'Agora seu chefe da tribo precisa confirmar sua chegada. Você pode fechar o jogo: vai voltar para cá.'
        nl: 'Je stamhoofd moet nu je komst bevestigen. Je mag het spel sluiten: je komt hier terug.'
      join_expired:
        fr: 'Ton invitation a expiré : demande-en une nouvelle à ton chef de tribu.'
        en: 'Your invitation has expired: ask your tribe chief for a new one.'
        es: 'Tu invitación ha caducado: pide una nueva a tu jefe de tribu.'
        de: 'Deine Einladung ist abgelaufen: Bitte deinen Stammes-Chef um eine neue.'
        it: 'Il tuo invito è scaduto: chiedine uno nuovo al tuo capo della tribù.'
        pt: 'O teu convite expirou: pede um novo ao teu chefe da tribo.'
        br: 'Seu convite expirou: peça um novo ao seu chefe da tribo.'
        nl: 'Je uitnodiging is verlopen: vraag je stamhoofd om een nieuwe.'

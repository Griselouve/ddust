      confirm_create_clan_msg:
        fr: |-
          Une seule tribu par famille !

          Si un autre adulte de ton foyer a déjà créé la tribu, ne crée pas la tienne : rejoins la sienne avec son QR code, il te nommera chef de la tribu et tu auras exactement les mêmes pouvoirs.

          On ne peut pas changer de tribu par la suite.
        en: |-
          One tribe per family!

          If another adult in your household has already created the tribe, do not create yours: join theirs with their QR code and they will make you a tribe chief, with exactly the same powers.

          You cannot switch tribes afterwards.
        es: |-
          ¡Una sola tribu por familia!

          Si otro adulto de tu hogar ya ha creado la tribu, no crees la tuya: únete a la suya con su código QR y te nombrará jefe de la tribu, con exactamente los mismos poderes.

          Después no se puede cambiar de tribu.
        de: |-
          Nur ein Stamm pro Familie!

          Wenn ein anderer Erwachsener aus deinem Haushalt den Stamm schon gegründet hat, gründe nicht deinen eigenen: Tritt seinem mit seinem QR-Code bei, er ernennt dich zum Stammes-Chef und du hast genau dieselben Befugnisse.

          Der Stamm kann später nicht gewechselt werden.
        it: |-
          Una sola tribù per famiglia!

          Se un altro adulto di casa tua ha già creato la tribù, non creare la tua: unisciti alla sua con il suo codice QR, ti nominerà capo della tribù e avrai esattamente gli stessi poteri.

          In seguito non si può cambiare tribù.
        pt: |-
          Uma só tribo por família!

          Se outro adulto da tua casa já criou a tribo, não cries a tua: junta-te à dele com o código QR dele, ele nomeia-te chefe da tribo e terás exatamente os mesmos poderes.

          Depois não é possível mudar de tribo.
        br: |-
          Uma só tribo por família!

          Se outro adulto da sua casa já criou a tribo, não crie a sua: entre na dele com o QR Code dele, ele nomeia você chefe da tribo e você terá exatamente os mesmos poderes.

          Depois não é possível mudar de tribo.
        nl: |-
          Maar één stam per gezin!

          Als een andere volwassene in je huishouden de stam al heeft opgericht, maak dan geen eigen stam: word lid van de zijne met zijn QR-code, hij benoemt je tot stamhoofd en je krijgt precies dezelfde rechten.

          Je kunt later niet meer van stam wisselen.

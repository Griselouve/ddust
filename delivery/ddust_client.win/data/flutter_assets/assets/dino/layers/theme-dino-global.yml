          REGISTRE IMPOSÉ : ce texte sera lu par des enfants de 3 à 7 ans.
          - Tous les dinos sont gentils : leurs seuls soucis sont la saleté et le désordre, drôles et sans gravité. Aucune violence envers une personne ou un animal, aucune arme, aucun sang, aucune blessure, aucune mort ; aucun dino ne mange personne.
          - Rien qui fasse peur : ni horreur, ni menace, ni punition, ni humiliation, ni moquerie visant quelqu'un ; ni noir, ni orage, ni volcan, ni météorite, ni disparition des dinosaures.

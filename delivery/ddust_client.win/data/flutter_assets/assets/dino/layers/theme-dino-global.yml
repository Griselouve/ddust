          VERBINDLICHER TON. Dieser Text wird von Kindern zwischen 3 und 7 Jahren gelesen.
          - Alle Dinos sind lieb: Ihre einzigen Sorgen sind Schmutz und Unordnung, lustig und harmlos. Keine Gewalt gegen Menschen oder Tiere, keine Waffen, kein Blut, keine Verletzungen, kein Tod; kein Dino frisst jemanden.
          - Nichts, was Angst macht: kein Horror, keine Drohungen, keine Strafen, keine Demütigung, kein Spott über irgendjemanden; keine Dunkelheit, kein Gewitter, kein Vulkan, kein Meteorit, kein Aussterben der Dinosaurier.

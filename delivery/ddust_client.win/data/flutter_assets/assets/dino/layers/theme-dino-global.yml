          Se il nome, la descrizione o il diario usano ancora parole da sotterraneo (mostro, combattimento, bottino…), raccontalo con le parole della Valle Verde: un dino da coccolare, i punti vita, addormentarsi dalla noia.

          DIVIETI assoluti:
          - Non conosci il genere di NESSUN bambino: il nome che si è scelto non te lo dice. Non usare quindi MAI «lui» o «lei» per indicare un bambino, né alcun aggettivo o participio concordato al maschile o al femminile che lo riguardi (evita «piccolo»/«piccola», «motivato»/«motivata»… accanto al nome di un personaggio); ripeti invece il nome che si è scelto, oppure formula la frase senza concordanza di genere.
          - Non elencare MAI i compiti uno per uno; questo testo non è un inventario del diario.
          - Non associare MAI un numero di XP a un'azione precisa (vietata ogni forma «ha fatto X (N XP)»).
          - Nessuna frase-bilancio che riassuma i totali alla fine («l'uovo si è schiuso N volte, portando…»).
          - Non più di UN numero in tutto il testo.
          - Nessun incipit scontato come «In un mondo in cui…», «C'era una volta…», «In un'epoca in cui…».
          - Nessuna frase meta su di te o sul testo («Ecco il racconto…», «Questa storia dimostra che…»).
          - Nessun superlativo vuoto («incredibile», «eccezionale», «leggendario») senza un fatto concreto dietro.
          - Nessuna predica moralista né conclusione che fa la lezione.
          - Nessuna raffica di emoji (una o due al massimo, oppure nessuna).
          - Non parlare MAI della creazione, della fondazione né degli inizi della tribù: si racconta ciò che vive una famiglia, non il suo atto di nascita.
          - Non usare MAI le parole «monete», «oro», «valuta», «soldi» o «paghetta», e non menzionare MAI l'uovo, le sue sorprese né una ricompensa: questo argomento è trattato altrove, non in questo testo.

          COSA FARE:
          - Racconta SOLO fatti presenti nel diario qui sopra; non inventare alcun evento.
          - Frasi brevi, tono caloroso e un po' divertente, come un genitore che racconta la sua settimana attorno al falò; non una cronaca pomposa.
          - Chiama i bambini con il nome che si sono scelti.
          - Concludi con ciò che la tribù ha vissuto concretamente, mai con un invito all'azione né uno slogan pubblicitario.
          - Scrivi tutto in @@@worker.inspire_lang@@@.

          REGISTRO OBBLIGATORIO. Questo testo sarà letto da bambini dai 3 ai 7 anni.
          - Tutti i dino sono buoni: i loro unici guai sono lo sporco e il disordine, buffi e innocui. Nessuna violenza verso persone o animali, nessuna arma, niente sangue, ferite o morte; nessun dino mangia qualcuno.
          - Niente che faccia paura: niente orrore, minacce, punizioni, umiliazioni o prese in giro verso qualcuno; niente buio, temporali, vulcani, meteoriti o scomparsa dei dinosauri.
          - Nessun tema per adulti: sessualità, seduzione, alcol, tabacco, droghe, gioco d'azzardo, politica, religione, malattia.
          - Nessun insulto, nessuna parolaccia, nessun linguaggio volgare, nemmeno attenuato.
          - Non inventare alcun dato personale: né cognome, né indirizzo, né scuola, né città, né età.
          - Non usare mai le parole del mondo dei sotterranei: mostro, combattimento, arma, bottino, tesoro, forziere, boss, avventuriero.
          - Nel dubbio, scegli sempre la formulazione più dolce.

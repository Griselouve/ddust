          C'est définitif et sans retour.
        en: |-
          Careful: you will lose EVERYTHING (your character, levels, pocket money and tribes).
          This is final, with no way back.
        es: |-
          Cuidado: lo perderás TODO (tu personaje, niveles, dinero de bolsillo y tribus).
          Es definitivo y sin vuelta atrás.
        de: |-
          Achtung: Du verlierst ALLES (deinen Charakter, deine Stufen, dein Taschengeld und deine Stämme).
          Das ist endgültig, ohne Weg zurück.
        it: |-
          Attenzione: perderai TUTTO (il tuo personaggio, i tuoi livelli, la tua paghetta e le tue tribù).
          È definitivo e senza ritorno.
        pt: |-
          Atenção: vais perder TUDO (a tua personagem, os teus níveis, a tua semanada e as tuas tribos).
          É definitivo e sem volta atrás.
        br: |-
          Atenção: você vai perder TUDO (seu personagem, seus níveis, sua mesada e suas tribos).
          É definitivo e não tem volta.
        nl: |-
          Let op: je verliest ALLES (je personage, je niveaus, je zakgeld en je stammen).
          Dit is definitief, er is geen weg terug.

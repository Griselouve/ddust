        it: |-
          Zzz… Ti sei annoiato così tanto che ti sei addormentato! Presto, ti serve una sveglia

          Fai una sfida in famiglia: sei TU a scegliere la tua sveglia e TU a scegliere come ti sveglia: solletico, smorfie o barzellette. Di' «basta» quando vuoi, e tutto si ferma subito.
        pt: |-
          Zzz… Aborreceste-te tanto que adormeceste! Depressa, precisas de um despertador

          Faz um desafio em família: és TU que escolhes o teu despertador e TU que escolhes como ele te acorda: cócegas, caretas ou piadas. Diz «tréguas» quando quiseres e tudo para logo.
        br: |-
          Zzz… Você ficou tão entediado que pegou no sono! Rápido, você precisa de um despertador

          Faça um desafio em família: é VOCÊ quem escolhe seu despertador e VOCÊ quem escolhe como ele te acorda: cócegas, caretas ou piadas. Diga "trégua" quando quiser e tudo para na hora.
        nl: |-
          Zzz… Je verveelde je zo erg dat je in slaap viel! Snel, je hebt een wekker nodig

          Doe een gezinsuitdaging: JIJ kiest je wekker en JIJ kiest hoe die je wakker maakt: kietelen, gekke gezichten of moppen. Roep ‘stop’ wanneer je wilt, en alles stopt meteen.
      gage_02:
        fr: |-
          Tu as fait la grimace devant la poussière ? Voyons si tu peux apprendre les grimaces au vieux tricératops

          Faire un défi en famille : tu dois grimacer devant ta tribu jusqu'à ce que quelqu'un rigole.
        en: |-
          Pulled a face at the dust? Let's see if you can teach the old triceratops how to pull faces

          Take on a family challenge: make faces at your tribe until one of them laughs.
        es: |-
          ¿Pusiste cara de asco ante el polvo? Veamos si puedes enseñar a hacer muecas al viejo triceratops

          Haz un desafío en familia: haz muecas ante tu tribu hasta que alguien se ría.
        de: |-
          Du hast beim Staub das Gesicht verzogen? Mal sehen, ob du dem alten Triceratops Grimassen beibringen kannst

          Mach ein Familienspiel: Schneide vor deinem Stamm Grimassen, bis einer lacht.
        it: |-
          Hai fatto una smorfia davanti alla polvere? Vediamo se riesci a insegnare le smorfie al vecchio triceratopo

          Fai una sfida in famiglia: fai smorfie davanti alla tua tribù finché qualcuno non ride.
        pt: |-
          Fizeste uma careta à poeira? Vamos ver se consegues ensinar o velho tricerátopo a fazer caretas

          Faz um desafio em família: faz caretas diante da tua tribo até alguém se rir.
        br: |-
          Fez careta para a poeira? Vamos ver se você consegue ensinar o velho tricerátopo a fazer caretas

          Faça um desafio em família: faça caretas para a sua tribo até alguém rir.
        nl: |-
          Trok je een gek gezicht naar het stof? Eens kijken of je de oude triceratops gekke gezichten kunt leren trekken

          Doe een gezinsuitdaging: trek gekke gezichten naar je stam tot er iemand lacht.
      gage_03:
        fr: |-
          Zzz…. Endormi par des chaussettes… Chut, tu as le droit de garder le silence

          Faire un défi en famille : chaque membre de la tribu te dit un mot que tu dois faire deviner aux autres sans parler ni écrire ni signer.
        en: |-
          Zzz.... Sent to sleep by socks... Shh, you have the right to remain silent

          Take on a family challenge: each tribe member gives you a word you must get the others to guess, without speaking, writing or signing.
        es: |-
          Zzz.... Dormido por unos calcetines... Chis, tienes derecho a guardar silencio

          Haz un desafío en familia: cada miembro de la tribu te da una palabra que debes hacer adivinar a los demás sin hablar, escribir ni hacer señas.
        de: |-
          Zzz…. Von Socken eingeschläfert… Psst, du hast das Recht zu schweigen

          Mach ein Familienspiel: Jedes Stammesmitglied sagt dir ein Wort, das du die anderen erraten lassen musst, ohne zu sprechen, zu schreiben oder Zeichensprache zu benutzen.
        it: |-
          Zzz…. Addormentato dai calzini… Sst, hai il diritto di restare in silenzio

          Fai una sfida in famiglia: ogni membro della tribù ti dice una parola che devi far indovinare agli altri senza parlare, scrivere o fare segni.
        pt: |-
          Zzz…. Adormecido por umas meias… Chiu, tens o direito de ficar em silêncio

          Faz um desafio em família: cada membro da tribo diz-te uma palavra que tens de fazer adivinhar aos outros sem falar, escrever nem fazer sinais.
        br: |-
          Zzz…. Umas meias fizeram você pegar no sono… Psiu, você tem o direito de ficar em silêncio

          Faça um desafio em família: cada membro da tribo fala uma palavra para você, e você tem que fazer os outros adivinharem sem falar, escrever nem fazer sinais.
        nl: |-
          Zzz…. In slaap gebracht door sokken… Sst, je hebt het recht om te zwijgen

          Doe een gezinsuitdaging: elk stamlid geeft je een woord dat je de anderen moet laten raden zonder te praten, te schrijven of gebaren te maken.
      gage_04:
        fr: |-
          Tu as laissé la poussière s'étaler partout, et le petit dino éternue ! La tribu attend une promesse, pas des excuses !

          Faire un défi en famille : une main sur le balai, promets bien fort devant toute la tribu réunie une chose que tu feras avant demain soir.
        en: |-
          You let the dust spread everywhere, and the little dino is sneezing! The tribe wants a promise, not excuses!

          Take on a family challenge: one hand on the broom, promise out loud before the whole tribe one thing you will do before tomorrow evening.
        es: |-
          ¡Dejaste que el polvo se extendiera por todas partes y el dino pequeño estornuda! ¡La tribu espera una promesa, no excusas!

          Haz un desafío en familia: con una mano sobre la escoba, promete bien alto ante toda la tribu reunida una cosa que harás antes de mañana por la noche.
        de: |-
          Du hast den Staub sich überall ausbreiten lassen, und der kleine Dino niest! Der Stamm will ein Versprechen, keine Ausreden!

          Mach ein Familienspiel: Eine Hand auf dem Besen, versprich laut vor dem ganzen Stamm eine Sache, die du bis morgen Abend erledigst.
        it: |-
          Hai lasciato che la polvere si spargesse ovunque, e il piccolo dino starnutisce! La tribù vuole una promessa, non delle scuse!

          Fai una sfida in famiglia: con una mano sulla scopa, prometti ad alta voce davanti a tutta la tribù riunita una cosa che farai entro domani sera.
        pt: |-
          Deixaste o pó espalhar-se por todo o lado, e o dino pequenino está a espirrar! A tribo quer uma promessa, não desculpas!

          Faz um desafio em família: com uma mão na vassoura, promete bem alto diante da tribo inteira reunida uma coisa que vais fazer antes de amanhã à noite.
        br: |-
          Você deixou a poeira se espalhar por todo lado, e o dino pequenininho está espirrando! A tribo quer uma promessa, não desculpas!

          Faça um desafio em família: com uma mão na vassoura, prometa bem alto diante da tribo inteira reunida uma coisa que você vai fazer antes de amanhã à noite.
        nl: |-
          Je hebt het stof overal laten liggen, en het kleine dinootje niest! De stam wil een belofte, geen excuses!

          Doe een gezinsuitdaging: met één hand op de bezem beloof je hardop voor de hele stam één ding dat je voor morgenavond gaat doen.
      gage_05:
        fr: |-
          Tu dois retrouver tes points de vie, petit gardien, mais ce jus de baies a un drôle de goût

          Faire un défi en famille : la tribu prépare UN jus surprise devant toi, en montrant chaque ingrédient avant de le verser. Goûte, puis devine tout ce qu'il y a dedans.
        en: |-
          You need to get your hit points back, little keeper, but this berry juice tastes funny

          Take on a family challenge: the tribe makes ONE surprise juice in front of you, holding up every ingredient before it goes in. Take a sip, then guess everything that is in it.
        es: |-
          Tienes que recuperar tus puntos de vida, pequeño cuidador, pero este zumo de bayas sabe rarísimo

          Haz un desafío en familia: la tribu prepara UN zumo sorpresa delante de ti, enseñando cada ingrediente antes de echarlo. Da un sorbo y adivina todo lo que lleva.
        de: |-
          Du brauchst deine Lebenspunkte zurück, kleiner Hüter, aber dieser Beerensaft schmeckt komisch

          Mach ein Familienspiel: Der Stamm mixt vor deinen Augen EINEN Überraschungssaft und zeigt jede Zutat, bevor sie hineinkommt. Probier einen Schluck und errate dann alles, was drin ist.
        it: |-
          Devi recuperare i tuoi punti vita, piccolo guardiano, ma questo succo di bacche ha un sapore buffo

          Fai una sfida in famiglia: la tribù prepara UN succo a sorpresa davanti a te, mostrando ogni ingrediente prima di versarlo. Assaggia, poi indovina tutto quello che c'è dentro.
        pt: |-
          Tens de recuperar os teus pontos de vida, pequeno guardião, mas este sumo de bagas sabe a coisa esquisita

          Faz um desafio em família: a tribo prepara UM sumo surpresa à tua frente, mostrando cada ingrediente antes de o deitar. Prova e depois adivinha tudo o que lá está dentro.
        br: |-
          Você precisa recuperar seus pontos de vida, pequeno cuidador, mas esse suco de frutinhas tem um gosto esquisito

          Faça um desafio em família: a tribo prepara UM suco surpresa na sua frente, mostrando cada ingrediente antes de colocá-lo. Prove e depois adivinhe tudo o que tem dentro.
        nl: |-
          Je moet je levenspunten terugkrijgen, kleine verzorger, maar dit bessensap smaakt raar

          Doe een gezinsuitdaging: de stam maakt voor je ogen ÉÉN verrassingssapje en laat elk ingrediënt zien voordat het erin gaat. Neem een slokje en raad dan alles wat erin zit.
      gage_06:
        fr: |-
          La grotte croule sous le désordre et la poussière. Et toi, ça te fait rire ?

          Faire un défi en famille : simuler un rire pendant 45 secondes.
        en: |-
          The cave is buried in mess and dust. Do you think that's funny?

          Take on a family challenge: fake a laugh for 45 seconds.
        es: |-
          La cueva está llena de desorden y polvo. ¿Y a ti te hace gracia?

          Haz un desafío en familia: simula una risa durante 45 segundos.
        de: |-
          Die Höhle versinkt in Unordnung und Staub. Und du findest das lustig?

          Mach ein Familienspiel: 45 Sekunden lang ein Lachen vortäuschen.
        it: |-
          La grotta è sommersa da disordine e polvere. E tu ridi?

          Fai una sfida in famiglia: fingi una risata per 45 secondi.
        pt: |-
          A gruta está cheia de desarrumação e pó. E tu achas graça?

          Faz um desafio em família: finge uma gargalhada durante 45 segundos.
        br: |-
          A caverna está cheia de bagunça e poeira. E você acha graça?

          Faça um desafio em família: finja uma gargalhada durante 45 segundos.
        nl: |-
          De grot ligt vol rommel en stof. En jij vindt dat grappig?

          Doe een gezinsuitdaging: doe 45 seconden lang alsof je lacht.
      gage_07:
        fr: |-
          Ton petit tablier n'a pas tenu longtemps face au linge sale et à la poussière qui gratte. Il t'en faut un autre.

          Faire un défi en famille : faire un défilé en revêtant 3 tenues épiques et drôles.
        en: |-
          Your little apron didn't last long against the dirty laundry and the itchy dust. You need another one.

          Take on a family challenge: put on a fashion show wearing 3 epic and funny outfits.
        es: |-
          Tu delantal no aguantó mucho ante la ropa sucia y el polvo que pica. Necesitas otro.

          Haz un desafío en familia: haz un desfile luciendo 3 atuendos épicos y graciosos.
        de: |-
          Deine kleine Schürze hat der Schmutzwäsche und dem kratzigen Staub nicht lange standgehalten. Du brauchst eine neue.

          Mach ein Familienspiel: Veranstalte eine Modenschau mit 3 tollen und lustigen Outfits.
        it: |-
          Il tuo grembiulino non ha resistito a lungo ai panni sporchi e alla polvere che pizzica. Te ne serve un altro.

          Fai una sfida in famiglia: fai una sfilata indossando 3 costumi epici e buffi.
        pt: |-
          O teu aventalzinho não aguentou muito tempo a roupa suja e o pó que faz comichão. Tens de arranjar outro.

          Faz um desafio em família: faz um desfile com 3 fatiotas épicas e divertidas.
        br: |-
          Seu aventalzinho não aguentou muito tempo a roupa suja e a poeira que coça. Você precisa arrumar outro.

          Faça um desafio em família: faça um desfile com 3 roupas épicas e divertidas.
        nl: |-
          Je schortje hield het niet lang vol tegen de vuile was en het kriebelstof. Je hebt een nieuw nodig.

          Doe een gezinsuitdaging: houd een modeshow in 3 epische en grappige outfits.
      gage_08:
        fr: |-
          La prochaine fois que la bande des dinos-chatouilleurs approche, ne bouge pas, fais la statue.

          Faire un défi en famille : tu ne peux pas rire ni sourire pendant 3 minutes, malgré tout ce que peut faire ta tribu.
        en: |-
          Next time the tickle-dino gang comes near, don't move, be a statue.

          Take on a family challenge: you can't laugh or smile for 3 minutes, whatever your tribe does.
        es: |-
          La próxima vez que se acerque la pandilla de dinos cosquilleros, no te muevas, quédate como una estatua.

          Haz un desafío en familia: no puedes reír ni sonreír durante 3 minutos, haga lo que haga tu tribu.
        de: |-
          Wenn das nächste Mal die Kitzel-Dino-Bande kommt, beweg dich nicht, sei eine Statue.

          Mach ein Familienspiel: Du darfst 3 Minuten lang weder lachen noch lächeln, egal was dein Stamm anstellt.
        it: |-
          La prossima volta che si avvicina la banda dei dino-solletico, non muoverti, fai la statua.

          Fai una sfida in famiglia: non puoi ridere né sorridere per 3 minuti, qualunque cosa faccia la tua tribù.
        pt: |-
          Da próxima vez que o bando dos dinos-cócegas se aproximar, não te mexas, faz de estátua.

          Faz um desafio em família: não podes rir nem sorrir durante 3 minutos, faça a tua tribo o que fizer.
        br: |-
          Da próxima vez que a turma dos dinos-cócegas chegar perto, não se mexa, vire estátua.

          Faça um desafio em família: você não pode rir nem sorrir durante 3 minutos, não importa o que sua tribo faça.
        nl: |-
          Als de kietel-dinobende de volgende keer aankomt, verroer je niet en speel standbeeld.

          Doe een gezinsuitdaging: je mag 3 minuten lang niet lachen of glimlachen, wat je stam ook doet.
      gage_09:
        fr: |-
          C'était incroyable ! Il y avait un énorme diplodocus de linge sale qui éternuait de la poussière partout, j'étais entouré de bébés dinos tout collants et je n'ai rien pu faire ! …

          Faire un défi en famille : raconte une histoire complètement inventée pendant au moins 3 minutes.
        en: |-
          It was amazing! There was a huge diplodocus made of dirty laundry sneezing dust everywhere, I was surrounded by sticky baby dinos and there was nothing I could do! ...

          Take on a family challenge: tell a completely made-up story for at least 3 minutes.
        es: |-
          ¡Fue increíble! Había un diplodocus enorme de ropa sucia que estornudaba polvo por todas partes, estaba rodeado de dinos bebé pegajosos y no pude hacer nada! ...

          Haz un desafío en familia: cuenta una historia totalmente inventada durante al menos 3 minutos.
        de: |-
          Es war unglaublich! Da war ein riesiger Diplodocus aus Schmutzwäsche, der überall Staub nieste, ich war von klebrigen Dino-Babys umringt und konnte nichts tun! …

          Mach ein Familienspiel: Erzähl mindestens 3 Minuten lang eine komplett erfundene Geschichte.
        it: |-
          È stato incredibile! C'era un enorme diplodoco di panni sporchi che starnutiva polvere dappertutto, ero circondato da cuccioli di dino tutti appiccicosi e non ho potuto fare niente! …

          Fai una sfida in famiglia: racconta una storia completamente inventata per almeno 3 minuti.
        pt: |-
          Foi incrível! Havia um enorme diplódoco de roupa suja que espirrava pó por todo o lado, eu estava rodeado de bebés dinos todos peganhentos e não pude fazer nada! …

          Faz um desafio em família: conta uma história completamente inventada durante pelo menos 3 minutos.
        br: |-
          Foi incrível! Tinha um enorme diplodoco de roupa suja que espirrava poeira para todo lado, eu estava cercado de dinos bebês grudentos e não pude fazer nada! …

          Faça um desafio em família: conte uma história completamente inventada durante pelo menos 3 minutos.
        nl: |-
          Het was ongelooflijk! Er was een enorme diplodocus van vuile was die overal stof nieste, ik was omringd door plakkerige babydino's en kon niets doen! …

          Doe een gezinsuitdaging: vertel minstens 3 minuten lang een helemaal verzonnen verhaal.
      gage_10:
        fr: |-
          Il est encore temps de sortir de la grotte, mais attention, il y a des pièges rigolos partout. Des pièges verticaux et des pièges horizontaux.

          Faire un défi en famille : tu ne peux dire ni oui ni non pendant au moins 3 minutes.
        en: |-
          There's still time to get out of the cave, but watch out, there are silly traps everywhere. Vertical traps and horizontal traps.

          Take on a family challenge: you can't say yes or no for at least 3 minutes.
        es: |-
          Aún estás a tiempo de salir de la cueva, pero cuidado, hay trampas de broma por todas partes. Trampas verticales y trampas horizontales.

          Haz un desafío en familia: no puedes decir ni sí ni no durante al menos 3 minutos.
        de: |-
          Noch kannst du aus der Höhle hinaus, aber Vorsicht, überall sind Scherz-Fallen. Senkrechte Fallen und waagerechte Fallen.

          Mach ein Familienspiel: Du darfst mindestens 3 Minuten lang weder Ja noch Nein sagen.
        it: |-
          Sei ancora in tempo per uscire dalla grotta, ma attenzione, ci sono trappole buffe ovunque. Trappole verticali e trappole orizzontali.

          Fai una sfida in famiglia: non puoi dire né sì né no per almeno 3 minuti.
        pt: |-
          Ainda vais a tempo de sair da gruta, mas cuidado, há armadilhas brincalhonas por todo o lado. Armadilhas verticais e armadilhas horizontais.

          Faz um desafio em família: não podes dizer nem sim nem não durante pelo menos 3 minutos.
        br: |-
          Você ainda tem tempo de sair da caverna, mas cuidado, tem armadilhas de brincadeira por todo lado. Armadilhas verticais e armadilhas horizontais.

          Faça um desafio em família: você não pode dizer nem sim nem não durante pelo menos 3 minutos.
        nl: |-
          Je kunt nog uit de grot, maar pas op, er zijn overal grappige vallen. Verticale vallen en horizontale vallen.

          Doe een gezinsuitdaging: je mag minstens 3 minuten lang geen ja en geen nee zeggen.
      gage_11:
        fr: |-
          Pourquoi le bébé dino aime les escaliers ? Parce qu'il adore monter de niveau… Et toi, on grimpe ?

          Faire un défi en famille : raconter des blagues jusqu'à faire rire au moins un membre de la tribu.
        en: |-
          Why does the baby dino love stairs? Because he loves leveling up... How about you, ready to climb?

          Take on a family challenge: tell jokes until at least one tribe member laughs.
        es: |-
          ¿Por qué al dino bebé le gustan las escaleras? Porque le encanta subir de nivel... ¿Y tú, subimos?

          Haz un desafío en familia: cuenta chistes hasta hacer reír al menos a un miembro de la tribu.
        de: |-
          Warum liebt das Dino-Baby Treppen? Weil es so gern Stufen aufsteigt… Und du, kletterst du mit?

          Mach ein Familienspiel: Erzähl Witze, bis mindestens ein Stammesmitglied lacht.
        it: |-
          Perché il cucciolo di dino ama le scale? Perché adora salire di livello… E tu, saliamo?

          Fai una sfida in famiglia: racconta barzellette finché almeno un membro della tribù non ride.
        pt: |-
          Porque é que o bebé dino gosta de escadas? Porque adora subir de nível… E tu, vamos subir?

          Faz um desafio em família: conta piadas até fazeres rir pelo menos um membro da tribo.
        br: |-
          Por que o dino bebê gosta de escadas? Porque adora subir de nível… E você, vamos subir?

          Faça um desafio em família: conte piadas até fazer pelo menos um membro da tribo rir.
        nl: |-
          Waarom houdt de babydino van trappen? Omdat hij dol is op een level omhoog gaan… En jij, klim je mee?

          Doe een gezinsuitdaging: vertel moppen tot minstens één stamlid lacht.
      gage_12:
        fr: |-
          Tu as regardé le dino de bien trop près, et Zzz, te voilà endormi. Au moins, tu sais à quoi il ressemble.

          Faire un défi en famille : dessine en 2 minutes le dino que tu gardais, montre ton chef-d'œuvre, et la tribu doit deviner de quelle pièce il sortait.
        en: |-
          You watched the dino far too closely, and Zzz, off you went to sleep. At least you know what it looks like.

          Take on a family challenge: draw in 2 minutes the dino you were looking after, show off your masterpiece, and the tribe must guess which room it came out of.
        es: |-
          Miraste al dino demasiado de cerca y, Zzz, te quedaste dormido. Al menos sabes cómo es.

          Haz un desafío en familia: dibuja en 2 minutos al dino que cuidabas, enseña tu obra maestra y la tribu tiene que adivinar de qué habitación salió.
        de: |-
          Du hast den Dino viel zu genau angeschaut, und Zzz, schon bist du eingeschlafen. Immerhin weißt du jetzt, wie er aussieht.

          Mach ein Familienspiel: Zeichne in 2 Minuten den Dino, um den du dich gekümmert hast, zeig dein Meisterwerk, und der Stamm muss erraten, aus welchem Zimmer er kam.
        it: |-
          Hai guardato il dino troppo da vicino e, Zzz, ti sei addormentato. Almeno sai che aspetto ha.

          Fai una sfida in famiglia: disegna in 2 minuti il dino di cui ti occupavi, mostra il tuo capolavoro, e la tribù deve indovinare da quale stanza è uscito.
        pt: |-
          Olhaste para o dino demasiado de perto e, Zzz, adormeceste. Ao menos já sabes como ele é.

          Faz um desafio em família: desenha em 2 minutos o dino de que cuidavas, mostra a tua obra-prima, e a tribo tem de adivinhar de que divisão ele saiu.
        br: |-
          Você olhou o dino de perto demais e, Zzz, pegou no sono. Pelo menos agora sabe como ele é.

          Faça um desafio em família: desenhe em 2 minutos o dino de que você cuidava, mostre sua obra-prima, e a tribo tem que adivinhar de qual cômodo ele saiu.
        nl: |-
          Je keek veel te lang naar de dino, en Zzz, daar viel je in slaap. Nu weet je tenminste hoe hij eruitziet.

          Doe een gezinsuitdaging: teken in 2 minuten de dino voor wie je zorgde, laat je meesterwerk zien, en de stam moet raden uit welke kamer hij kwam.
      gage_13:
        fr: |-
          Les murs de la grotte répètent tout ce qu'on leur dit. Toi aussi, maintenant.

          Faire un défi en famille : pendant 3 minutes, tu répètes en écho, tout bas, le dernier mot de chaque phrase prononcée par un membre de la tribu.
        en: |-
          The cave walls send back everything said to them. So do you, from now on.

          Take on a family challenge: for 3 minutes, echo back in a whisper the last word of every sentence a tribe member says.
        es: |-
          Las paredes de la cueva devuelven todo lo que se les dice. Tú también, a partir de ahora.

          Haz un desafío en familia: durante 3 minutos, repite en voz baja, como un eco, la última palabra de cada frase que diga un miembro de la tribu.
        de: |-
          Die Höhlenwände werfen alles zurück, was man ihnen sagt. Du jetzt auch.

          Mach ein Familienspiel: 3 Minuten lang wiederholst du ganz leise wie ein Echo das letzte Wort jedes Satzes, den ein Stammesmitglied sagt.
        it: |-
          Le pareti della grotta ripetono tutto quello che gli si dice. Adesso anche tu.

          Fai una sfida in famiglia: per 3 minuti ripeti come un'eco, sottovoce, l'ultima parola di ogni frase detta da un membro della tribù.
        pt: |-
          As paredes da gruta devolvem tudo o que se lhes diz. Agora tu também.

          Faz um desafio em família: durante 3 minutos, repetes em eco, baixinho, a última palavra de cada frase dita por um membro da tribo.
        br: |-
          As paredes da caverna devolvem tudo o que se diz a elas. Agora você também.

          Faça um desafio em família: durante 3 minutos, repita como um eco, baixinho, a última palavra de cada frase dita por um membro da tribo.
        nl: |-
          De grotmuren kaatsen alles terug wat je tegen ze zegt. Jij nu ook.

          Doe een gezinsuitdaging: 3 minuten lang herhaal je fluisterend als een echo het laatste woord van elke zin die een stamlid zegt.
      gage_14:
        fr: |-
          Un gardien endormi n'a plus de surnom. Mais rien ne t'empêche d'en donner aux autres.

          Faire un défi en famille : invente un surnom rigolo à chaque membre de la tribu (demande-lui son accord, un surnom qui ne lui plaît pas ne compte pas) et chacun répond au sien jusqu'à la fin de la journée. Toi, tu gardes ton nom.
        en: |-
          A sleeping keeper has no nickname left. Nothing stops you giving nicknames to everyone else, though.

          Take on a family challenge: invent a funny nickname for each tribe member (ask them first, a nickname they don't like doesn't count) and each of them answers to theirs until the end of the day. You keep your own name.
        es: |-
          Un cuidador dormido ya no tiene apodo. Pero nada te impide repartirlos entre los demás.

          Haz un desafío en familia: inventa un apodo divertido para cada miembro de la tribu (pídele permiso, un apodo que no le guste no vale) y cada uno responderá al suyo hasta el final del día. Tú conservas tu nombre.
        de: |-
          Ein eingeschlafener Hüter hat keinen Spitznamen mehr. Aber nichts hindert dich daran, den anderen welche zu geben.

          Mach ein Familienspiel: Erfinde für jedes Stammesmitglied einen lustigen Spitznamen (frag vorher, ob es einverstanden ist, ein Name, der ihm nicht gefällt, zählt nicht), und jeder hört bis zum Ende des Tages auf seinen. Du behältst deinen eigenen Namen.
        it: |-
          Un guardiano addormentato non ha più soprannomi. Ma niente ti impedisce di darne agli altri.

          Fai una sfida in famiglia: inventa un soprannome buffo per ogni membro della tribù (chiedigli il permesso, un soprannome che non gli piace non vale) e ognuno risponde al suo fino alla fine della giornata. Tu tieni il tuo nome.
        pt: |-
          Um guardião adormecido já não tem alcunha. Mas nada te impede de as dar aos outros.

          Faz um desafio em família: inventa uma alcunha divertida para cada membro da tribo (pede-lhe autorização, uma alcunha de que não goste não conta) e cada um responde pela sua até ao fim do dia. Tu ficas com o teu nome.
        br: |-
          Um cuidador dormindo não tem mais apelido. Mas nada impede você de dar apelidos para os outros.

          Faça um desafio em família: invente um apelido divertido para cada membro da tribo (peça autorização, um apelido de que a pessoa não goste não vale) e cada um responde pelo seu até o fim do dia. Você fica com o seu nome.
        nl: |-
          Een slapende verzorger heeft geen bijnaam meer. Maar niets houdt je tegen om er aan de anderen uit te delen.

          Doe een gezinsuitdaging: verzin een grappige bijnaam voor elk stamlid (vraag eerst toestemming, een bijnaam die iemand niet leuk vindt telt niet) en iedereen luistert tot het eind van de dag naar die naam. Jij houdt je eigen naam.
      gage_15:
        fr: |-
          Tu ne tiens plus bien droit sur tes jambes ? Pas grave : les crabes de la rivière s'en sortent très bien.

          Faire un défi en famille : pendant 15 minutes, tu ne te déplaces plus qu'en crabe, sur le côté, jamais de face.
        en: |-
          Not steady on your feet any more? Never mind: the river crabs manage just fine.

          Take on a family challenge: for 15 minutes, you only move like a crab, sideways, never facing forward.
        es: |-
          ¿Ya no te sostienes derecho? No pasa nada: los cangrejos del río se apañan de maravilla.

          Haz un desafío en familia: durante 15 minutos, solo te desplazas como un cangrejo: de lado, nunca de frente.
        de: |-
          Du stehst nicht mehr fest auf deinen Beinen? Macht nichts: Die Krabben am Fluss kommen prima zurecht.

          Mach ein Familienspiel: 15 Minuten lang bewegst du dich nur noch wie eine Krabbe fort, seitwärts, nie nach vorn.
        it: |-
          Non ti reggi più bene sulle gambe? Poco male: i granchi del fiume se la cavano benissimo.

          Fai una sfida in famiglia: per 15 minuti ti sposti solo come un granchio, di lato, mai in avanti.
        pt: |-
          Já não te aguentas bem de pé? Não faz mal: os caranguejos do rio desenrascam-se muito bem.

          Faz um desafio em família: durante 15 minutos só te deslocas como um caranguejo, de lado, nunca de frente.
        br: |-
          Não está mais conseguindo ficar de pé? Tudo bem: os caranguejos do rio se viram muito bem.

          Faça um desafio em família: durante 15 minutos, você só se desloca como um caranguejo, de lado, nunca de frente.
        nl: |-
          Sta je niet meer stevig op je benen? Geeft niks: de krabben in de rivier redden zich prima.

          Doe een gezinsuitdaging: 15 minuten lang beweeg je alleen nog als een krab, zijwaarts, nooit naar voren.
      gage_d_01:
        fr: Le réveille-matin était choisi, la façon de réveiller aussi, et par @@@session.user.name@@@ en personne,
          qui a tenu bon jusqu'à décider que c'était assez. Après plein de câlins et de bisous baveux, la tribu
          reprend son petit gardien avec elle et repart s'occuper des dinos.
        en: The alarm clock was chosen, and so was the way to wake up, by @@@session.user.name@@@ in person, who
          held on right up to deciding that was enough. After lots of hugs and slobbery kisses, the tribe takes
          its little keeper back and heads off to look after the dinos again.
        es: El despertador estaba elegido, y la forma de despertar también, por @@@session.user.name@@@ en persona,
          que aguantó hasta decidir que ya bastaba. Tras muchos abrazos y besos babosos, la tribu recibe de nuevo
          a su pequeño cuidador y vuelve a cuidar de los dinos.
        de: Der Wecker war gewählt, die Art des Weckens auch, und zwar von @@@session.user.name@@@ höchstpersönlich,
          der tapfer durchhielt, bis er entschied, dass es genug war. Nach vielen Umarmungen und sabbrigen Küssen
          nimmt der Stamm seinen kleinen Hüter wieder auf und kümmert sich weiter um die Dinos.
        it: La sveglia era stata scelta, e anche il modo di svegliarsi, da @@@session.user.name@@@ in persona, che
          ha tenuto duro fino a decidere che bastava. Dopo tanti abbracci e baci bavosi, la tribù riaccoglie il
          suo piccolo guardiano e torna a prendersi cura dei dino.
        pt: O despertador estava escolhido, e a forma de acordar também, por @@@session.user.name@@@ em pessoa,
          que aguentou firme até decidir que já chegava. Depois de muitos abraços e beijinhos babados, a tribo volta
          a acolher o seu pequeno guardião e regressa para cuidar dos dinos.
        br: O despertador foi escolhido, e o jeito de acordar também, por @@@session.user.name@@@ em pessoa, que
          aguentou firme até decidir que já bastava. Depois de muitos abraços e beijinhos babados, a tribo acolhe
          de novo seu pequeno cuidador e volta a cuidar dos dinos.
        nl: De wekker was gekozen, en hoe je wakker wordt gemaakt ook, door @@@session.user.name@@@ zelf, die volhield
          tot die besloot dat het genoeg was. Na heel veel knuffels en natte zoenen neemt de stam zijn kleine verzorger
          weer op en gaat verder met zorgen voor de dino's.
      gage_d_02:
        fr: 'À force de grimaces plus rigolotes les unes que les autres, @@@session.user.name@@@ a fini par faire
          éclater de rire le vieux tricératops lui-même. Le défi du réveil est relevé : la tribu, hilare, accueille
          de nouveau son champion des drôles de têtes.'
        en: 'With one silly face after another, @@@session.user.name@@@ finally made the old triceratops himself
          burst out laughing. The wake-up challenge is done: the tribe, in stitches, welcomes back its champion
          of funny faces.'
        es: 'A base de muecas cada cual más graciosa, @@@session.user.name@@@ acabó haciendo reír a carcajadas al
          mismísimo viejo triceratops. El reto del despertar está superado: la tribu, partida de risa, recibe de
          nuevo a su campeón de las caras graciosas.'
        de: 'Mit einer Grimasse lustiger als die andere hat @@@session.user.name@@@ sogar den alten Triceratops
          zum Lachen gebracht. Das Aufwach-Spiel ist geschafft: Der Stamm, der sich vor Lachen biegt, empfängt seinen
          Meister der lustigen Gesichter wieder in seiner Mitte.'
        it: 'A furia di smorfie una più buffa dell''altra, @@@session.user.name@@@ è riuscito a far ridere perfino
          il vecchio triceratopo. La sfida del risveglio è riuscita: la tribù, piegata dalle risate, riaccoglie
          il suo campione delle facce buffe.'
        pt: 'À força de caretas cada qual mais engraçada, @@@session.user.name@@@ acabou por pôr o próprio velho
          tricerátopo a rir às gargalhadas. O desafio do despertar está feito: a tribo, a chorar de riso, volta
          a receber o seu campeão das caras engraçadas.'
        br: 'À força de caretas, uma mais engraçada que a outra, @@@session.user.name@@@ acabou fazendo o próprio
          velho tricerátopo cair na gargalhada. O desafio de acordar foi cumprido: a tribo, chorando de rir, recebe
          de volta seu campeão das caras engraçadas.'
        nl: 'Met het ene gekke gezicht na het andere heeft @@@session.user.name@@@ zelfs de oude triceratops aan
          het lachen gekregen. Het wakker-word-spelletje is gelukt: de stam, slap van het lachen, verwelkomt zijn
          kampioen van de gekke gezichten terug.'
      gage_d_03:
        fr: 'Sans un mot, sans un geste écrit, @@@session.user.name@@@ a mimé l''impossible et fait deviner chaque
          mot à la tribu ébahie. Le silence se rompt sous les applaudissements : la vallée rend sa voix (et sa place)
          à son mime légendaire.'
        en: 'Not a word, not a written sign: @@@session.user.name@@@ mimed the impossible and got the amazed tribe
          to guess every word. The silence breaks under the applause: the valley gives its legendary mime back both
          voice and place.'
        es: 'Sin una palabra, sin un solo gesto escrito, @@@session.user.name@@@ mimó lo imposible e hizo adivinar
          cada palabra a la tribu atónita. El silencio se rompe entre aplausos: el valle devuelve a su mimo legendario
          la voz (y su lugar).'
        de: 'Ohne ein Wort, ohne ein geschriebenes Zeichen hat @@@session.user.name@@@ das Unmögliche pantomimisch
          dargestellt und den staunenden Stamm jedes Wort erraten lassen. Die Stille bricht im Applaus: Das Tal
          gibt seinem legendären Pantomimen die Stimme zurück (und seinen Platz).'
        it: 'Senza una parola, senza un solo gesto scritto, @@@session.user.name@@@ ha mimato l''impossibile e ha
          fatto indovinare ogni parola alla tribù sbalordita. Il silenzio si rompe tra gli applausi: la valle restituisce
          al suo mimo leggendario la voce (e il suo posto).'
        pt: 'Sem uma palavra, sem um único gesto escrito, @@@session.user.name@@@ fez mímica do impossível e pôs
          a tribo, boquiaberta, a adivinhar cada palavra. O silêncio quebra-se entre aplausos: o vale devolve ao
          seu mimo lendário a voz (e o seu lugar).'
        br: 'Sem uma palavra, sem um único gesto escrito, @@@session.user.name@@@ fez mímica do impossível e deixou
          a tribo, boquiaberta, adivinhando cada palavra. O silêncio se quebra entre aplausos: o vale devolve ao
          seu mímico lendário a voz (e o seu lugar).'
        nl: 'Zonder een woord, zonder één geschreven teken heeft @@@session.user.name@@@ het onmogelijke uitgebeeld
          en de verbaasde stam elk woord laten raden. De stilte wordt verbroken door applaus: de vallei geeft zijn
          legendarische mime zijn stem terug (en zijn plek).'
      gage_d_04:
        fr: 'Une main sur le balai et l''autre sur le cœur, @@@session.user.name@@@ a fait sa promesse devant la
          tribu réunie, et personne n''a osé rire. Le petit dino n''éternue plus (enfin, presque) : la tribu applaudit
          son gardien et l''accueille avec une grande fête.'
        en: 'One hand on the broom and the other on their heart, @@@session.user.name@@@ made the promise before
          the whole tribe, and nobody dared laugh. The little dino has stopped sneezing (well, almost): the tribe
          cheers its keeper and welcomes them with a big party.'
        es: 'Con una mano sobre la escoba y la otra en el corazón, @@@session.user.name@@@ hizo su promesa ante
          la tribu reunida, y nadie se atrevió a reír. El dino pequeño ya no estornuda (bueno, casi): la tribu aplaude
          a su cuidador y lo recibe con una gran fiesta.'
        de: 'Eine Hand auf dem Besen, die andere auf dem Herzen, hat @@@session.user.name@@@ vor dem versammelten
          Stamm sein Versprechen gegeben, und niemand wagte zu lachen. Der kleine Dino niest nicht mehr (na ja,
          fast): Der Stamm jubelt seinem Hüter zu und empfängt ihn mit einem großen Fest.'
        it: 'Una mano sulla scopa e l''altra sul cuore, @@@session.user.name@@@ ha fatto la sua promessa davanti
          alla tribù riunita, e nessuno ha osato ridere. Il piccolo dino non starnutisce più (beh, quasi): la tribù
          applaude il suo guardiano e lo accoglie con una gran festa.'
        pt: 'Com uma mão na vassoura e a outra no coração, @@@session.user.name@@@ fez a sua promessa perante a
          tribo reunida, e ninguém se atreveu a rir. O dino pequenino já não espirra (bem, quase): a tribo aplaude
          o seu guardião e recebe-o com uma grande festa.'
        br: 'Com uma mão na vassoura e a outra no coração, @@@session.user.name@@@ fez sua promessa diante da tribo
          reunida, e ninguém se atreveu a rir. O dino pequenininho não espirra mais (bom, quase): a tribo aplaude
          seu cuidador e o recebe com uma grande festa.'
        nl: 'Met één hand op de bezem en de andere op het hart heeft @@@session.user.name@@@ de belofte gedaan voor
          de voltallige stam, en niemand durfde te lachen. Het kleine dinootje niest niet meer (nou ja, bijna):
          de stam juicht zijn verzorger toe en onthaalt hem met een groot feest.'
      gage_d_05:
        fr: 'Sans grimacer (ou presque), @@@session.user.name@@@ a goûté le jus que la tribu avait préparé sous
          ses yeux, et en a nommé les ingrédients un à un, même celui que personne n''avouait. Les points de vie
          reviennent, les joues roses aussi : le jus a marché, et la tribu porte son gardien en triomphe.'
        en: 'Without flinching (well, almost), @@@session.user.name@@@ tasted the juice the tribe had made in plain
          sight, and named its ingredients one by one, even the one nobody would own up to. The hit points are back,
          and the rosy cheeks too: the juice worked, and the tribe carries its keeper in triumph.'
        es: 'Sin rechistar (o casi), @@@session.user.name@@@ probó el zumo que la tribu había preparado a la vista
          y nombró sus ingredientes uno a uno, incluso el que nadie quería confesar. Vuelven los puntos de vida,
          y los mofletes rosados también: el zumo ha funcionado, y la tribu lleva a su cuidador a hombros.'
        de: 'Ohne mit der Wimper zu zucken (fast), hat @@@session.user.name@@@ den Saft probiert, den der Stamm
          vor aller Augen gemixt hatte, und alle Zutaten nacheinander genannt, sogar die, die keiner zugeben wollte.
          Die Lebenspunkte kehren zurück, die roten Bäckchen auch: Der Saft hat gewirkt, und der Stamm trägt seinen
          Hüter auf den Schultern.'
        it: 'Senza fare una piega (o quasi), @@@session.user.name@@@ ha assaggiato il succo che la tribù aveva preparato
          davanti a tutti, e ne ha nominato gli ingredienti uno a uno, perfino quello che nessuno voleva ammettere.
          Tornano i punti vita, e anche le guance rosa: il succo ha funzionato, e la tribù porta in trionfo il suo
          guardiano.'
        pt: 'Sem pestanejar (ou quase), @@@session.user.name@@@ provou o sumo que a tribo tinha preparado à vista
          de todos, e disse os ingredientes um a um, até aquele que ninguém queria confessar. Voltam os pontos de
          vida, e as bochechas coradas também: o sumo resultou, e a tribo leva o seu guardião em ombros.'
        br: 'Sem fazer careta (ou quase), @@@session.user.name@@@ provou o suco que a tribo tinha preparado na frente
          de todos e disse os ingredientes um por um, até aquele que ninguém queria confessar. Os pontos de vida
          voltam, e as bochechas rosadas também: o suco funcionou, e a tribo carrega seu cuidador nos ombros.'
        nl: 'Zonder een spier te vertrekken (bijna dan), heeft @@@session.user.name@@@ het sapje geproefd dat de
          stam waar iedereen bij was had gemaakt, en alle ingrediënten een voor een genoemd, zelfs het ingrediënt
          dat niemand wilde toegeven. De levenspunten zijn terug, en de rode wangetjes ook: het sapje heeft gewerkt,
          en de stam draagt zijn verzorger op de schouders.'
      gage_d_06:
        fr: '« Ha… ha… HA ! » : quarante-cinq secondes d''un rire aussi faux que courageux, et @@@session.user.name@@@
          a fait s''envoler le désordre et la grisaille. La grotte reprend des couleurs : la tribu, ravie, retrouve
          son clown courageux.'
        en: '"Ha... ha... HA!": forty-five seconds of a laugh as fake as it was brave, and @@@session.user.name@@@
          blew away the mess and the gloom. The cave brightens up again: the tribe, delighted, gets its brave clown
          back.'
        es: '«¡Ja... ja... JA!»: cuarenta y cinco segundos de una risa tan falsa como valiente, y @@@session.user.name@@@
          hizo volar el desorden y la tristeza. La cueva recupera el color: la tribu, encantada, recibe de nuevo
          a su payaso valiente.'
        de: '„Ha… ha… HA!“: fünfundvierzig Sekunden Lachen, so unecht wie mutig, und @@@session.user.name@@@ hat
          Unordnung und Trübsal davongepustet. Die Höhle lebt wieder auf: Der Stamm, ganz begeistert, hat seinen
          mutigen Clown zurück.'
        it: '«Ah… ah… AH!»: quarantacinque secondi di una risata tanto finta quanto coraggiosa, e @@@session.user.name@@@
          ha fatto volare via il disordine e la malinconia. La grotta si rianima: la tribù, conquistata, riaccoglie
          il suo pagliaccio coraggioso.'
        pt: '«Ah… ah… AH!»: quarenta e cinco segundos de uma gargalhada tão falsa como corajosa, e @@@session.user.name@@@
          fez voar a desarrumação e a tristeza. A gruta ganha cor outra vez: a tribo, encantada, volta a receber
          o seu palhaço corajoso.'
        br: '"Rá… rá… RÁ!": quarenta e cinco segundos de uma risada tão falsa quanto corajosa, e @@@session.user.name@@@
          fez a bagunça e a tristeza voarem para longe. A caverna se anima: a tribo, encantada, recebe de volta
          seu palhaço corajoso.'
        nl: '‘Ha… ha… HA!’: vijfenveertig seconden lachen, even nep als dapper, en @@@session.user.name@@@ heeft
          de rommel en de somberheid weggeblazen. De grot fleurt op: de stam, helemaal blij, heeft zijn dappere
          clown terug.'
      gage_d_07:
        fr: Trois tenues plus épiques et loufoques les unes que les autres ont défilé sous les bravos de la tribu,
          et @@@session.user.name@@@ s'est trouvé un tablier digne de sa légende. Rhabillé de la tête aux pieds,
          notre gardien de dinos repart, plus rayonnant que jamais.
        en: Three outfits, each more epic and wacky than the last, paraded past the cheering tribe, and @@@session.user.name@@@
          found an apron worthy of their legend. Dressed head to toe, our dino keeper sets off again, more dazzling
          than ever.
        es: Tres atuendos a cuál más épico y estrafalario desfilaron entre los vítores de la tribu, y @@@session.user.name@@@
          encontró un delantal digno de su leyenda. Vestido de pies a cabeza, nuestro cuidador de dinos vuelve al
          camino, más radiante que nunca.
        de: Drei Outfits, eines toller und verrückter als das andere, sind unter dem Jubel des Stammes vorbeigezogen,
          und @@@session.user.name@@@ hat eine Schürze gefunden, die seiner Legende würdig ist. Von Kopf bis Fuß
          neu eingekleidet, macht sich unser Dino-Hüter wieder auf den Weg, strahlender als je zuvor.
        it: Tre costumi uno più epico e stravagante dell'altro hanno sfilato tra gli applausi della tribù, e @@@session.user.name@@@
          si è trovato un grembiule degno della sua leggenda. Rivestito da capo a piedi, il nostro guardiano dei
          dino riparte, più splendente che mai.
        pt: Três fatiotas, cada qual mais épica e disparatada, desfilaram entre os vivas da tribo, e @@@session.user.name@@@
          encontrou um avental digno da sua lenda. Vestido dos pés à cabeça, o nosso guardião dos dinos volta ao
          caminho, mais radiante do que nunca.
        br: Três roupas, uma mais épica e maluca que a outra, desfilaram sob os vivas da tribo, e @@@session.user.name@@@
          encontrou um avental digno da sua lenda. Vestido dos pés à cabeça, nosso cuidador de dinos volta ao caminho,
          mais radiante do que nunca.
        nl: Drie outfits, de een nog epischer en gekker dan de ander, kwamen voorbij onder gejuich van de stam,
          en @@@session.user.name@@@ vond een schort die bij zijn legende past. Van top tot teen aangekleed gaat
          onze dinoverzorger weer op pad, stralender dan ooit.
      gage_d_08:
        fr: 'Immobile, impassible, insensible aux pires pitreries de la tribu, @@@session.user.name@@@ a fait la
          statue trois minutes durant sans esquisser le moindre sourire. Les dinos-chatouilleurs, déçus, sont repartis
          bredouilles : la tribu retrouve son gardien le plus imperturbable.'
        en: 'Still, stone-faced, unmoved by the tribe''s silliest antics, @@@session.user.name@@@ was a statue for
          three whole minutes without the slightest smile. The disappointed tickle-dinos went home empty-handed:
          the tribe gets back its most unshakeable keeper.'
        es: 'Inmóvil, impasible, insensible a las peores payasadas de la tribu, @@@session.user.name@@@ se quedó
          como una estatua tres minutos sin esbozar la menor sonrisa. Los dinos cosquilleros, decepcionados, se
          fueron con las manos vacías: la tribu recupera a su cuidador más imperturbable.'
        de: 'Reglos, ungerührt, unempfindlich gegen die albernsten Späße des Stammes, war @@@session.user.name@@@
          drei Minuten lang eine Statue, ohne auch nur zu lächeln. Die enttäuschten Kitzel-Dinos sind mit leeren
          Händen abgezogen: Der Stamm hat seinen unerschütterlichsten Hüter zurück.'
        it: 'Immobile, impassibile, insensibile alle peggiori buffonate della tribù, @@@session.user.name@@@ ha
          fatto la statua per tre minuti senza accennare il minimo sorriso. I dino-solletico, delusi, se ne sono
          andati a mani vuote: la tribù ritrova il suo guardiano più imperturbabile.'
        pt: 'Imóvel, impassível, insensível às maiores palhaçadas da tribo, @@@session.user.name@@@ fez de estátua
          durante três minutos sem esboçar o menor sorriso. Os dinos-cócegas, desiludidos, foram-se embora de mãos
          a abanar: a tribo recupera o seu guardião mais imperturbável.'
        br: 'Imóvel, impassível, sem ligar para as maiores palhaçadas da tribo, @@@session.user.name@@@ ficou de
          estátua por três minutos sem dar nem um sorrisinho. Os dinos-cócegas, decepcionados, foram embora de mãos
          vazias: a tribo recupera seu cuidador mais imperturbável.'
        nl: 'Onbeweeglijk, onverstoorbaar, ongevoelig voor de gekste grappen van de stam, stond @@@session.user.name@@@
          drie minuten lang als een standbeeld zonder ook maar te glimlachen. De teleurgestelde kietel-dino''s gingen
          met lege handen weg: de stam heeft zijn kalmste verzorger terug.'
      gage_d_09:
        fr: Pendant de longues minutes, @@@session.user.name@@@ a inventé une histoire si folle (diplodocus de linge
          sale compris) que la tribu en est restée bouche bée. Conteur reconnu, notre gardien de dinos retrouve
          sa place au coin du feu sous les bravos.
        en: For minutes on end, @@@session.user.name@@@ spun a tale so wild (dirty-laundry diplodocus included)
          that the tribe was left open-mouthed. A true storyteller, our dino keeper returns to the campfire to loud
          cheers.
        es: Durante largos minutos, @@@session.user.name@@@ inventó una historia tan loca (diplodocus de ropa sucia
          incluido) que la tribu se quedó boquiabierta. Cuentacuentos consagrado, nuestro cuidador de dinos vuelve
          a su sitio en el rincón del fuego entre aplausos.
        de: Minutenlang hat @@@session.user.name@@@ eine so verrückte Geschichte erfunden (Schmutzwäsche-Diplodocus
          inklusive), dass der Stamm mit offenem Mund dasaß. Als echter Geschichtenerzähler kehrt unser Dino-Hüter
          unter Jubel ans Lagerfeuer zurück.
        it: Per lunghi minuti, @@@session.user.name@@@ ha inventato una storia così folle (diplodoco di panni sporchi
          compreso) che la tribù è rimasta a bocca aperta. Cantastorie consacrato, il nostro guardiano dei dino
          torna al suo posto vicino al falò tra gli applausi.
        pt: Durante longos minutos, @@@session.user.name@@@ inventou uma história tão maluca (diplódoco de roupa
          suja incluído) que a tribo ficou de boca aberta. Contador de histórias consagrado, o nosso guardião dos
          dinos regressa ao seu lugar à fogueira entre aplausos.
        br: Durante longos minutos, @@@session.user.name@@@ inventou uma história tão maluca (diplodoco de roupa
          suja incluído) que a tribo ficou de boca aberta. Contador de histórias consagrado, nosso cuidador de dinos
          volta ao seu lugar na fogueira sob aplausos.
        nl: Minutenlang heeft @@@session.user.name@@@ een verhaal verzonnen dat zo gek was (vuilewas-diplodocus
          inbegrepen) dat de stam er met open mond bij zat. Als echte verteller keert onze dinoverzorger onder gejuich
          terug naar het kampvuur.
      gage_d_10:
        fr: Slalomant entre les pièges verticaux et horizontaux, @@@session.user.name@@@ a tenu trois minutes sans
          lâcher le moindre « oui » ni « non ». Sorti de la grotte sain et sauf, notre petit malin est accueilli
          par une tribu admirative… et un peu jalouse.
        en: Weaving between the vertical and horizontal traps, @@@session.user.name@@@ held out three minutes without
          letting slip a single "yes" or "no". Out of the cave safe and sound, our clever one is greeted by an admiring
          tribe... and a slightly jealous one.
        es: Sorteando las trampas verticales y horizontales, @@@session.user.name@@@ aguantó tres minutos sin soltar
          un solo «sí» ni «no». Fuera de la cueva sano y salvo, nuestro listillo es recibido por una tribu admirada…
          y un poco celosa.
        de: Im Slalom zwischen senkrechten und waagerechten Fallen hat @@@session.user.name@@@ drei Minuten durchgehalten,
          ohne ein einziges „Ja“ oder „Nein“ herauszulassen. Heil aus der Höhle zurück, wird unser Schlaufuchs von
          einem bewundernden… und etwas neidischen Stamm empfangen.
        it: Zigzagando tra le trappole verticali e orizzontali, @@@session.user.name@@@ ha resistito tre minuti
          senza lasciarsi scappare un solo «sì» né «no». Uscito sano e salvo dalla grotta, il nostro furbetto viene
          accolto da una tribù ammirata… e un po' invidiosa.
        pt: Contornando as armadilhas verticais e horizontais, @@@session.user.name@@@ aguentou três minutos sem
          deixar escapar um único «sim» nem «não». Saído são e salvo da gruta, o nosso espertalhão é recebido por
          uma tribo admirada… e um pouco invejosa.
        br: Desviando das armadilhas verticais e horizontais, @@@session.user.name@@@ aguentou três minutos sem
          deixar escapar um único "sim" nem "não". Fora da caverna são e salvo, nosso espertinho é recebido por
          uma tribo admirada… e um pouco invejosa.
        nl: Slalommend tussen de verticale en horizontale vallen hield @@@session.user.name@@@ het drie minuten
          vol zonder één keer ‘ja’ of ‘nee’ te zeggen. Veilig en wel uit de grot wordt onze slimmerik onthaald door
          een bewonderende… en ietwat jaloerse stam.
      gage_d_11:
        fr: Blague après blague, @@@session.user.name@@@ a fini par décrocher le rire d'un membre de la tribu (la
          blague des escaliers y est sûrement pour quelque chose). Sacré roi des bons mots, notre gardien de dinos
          remonte enfin de niveau et retourne voir les dinos.
        en: Joke after joke, @@@session.user.name@@@ finally got a laugh out of a tribe member (the stairs joke
          surely helped). Crowned king of puns, our dino keeper levels up at last and heads back to the dinos.
        es: Chiste tras chiste, @@@session.user.name@@@ acabó arrancando la risa de un miembro de la tribu (el chiste
          de las escaleras seguro que ayudó). Coronado rey de las ocurrencias, nuestro cuidador de dinos por fin
          sube de nivel y vuelve con los dinos.
        de: Witz um Witz hat @@@session.user.name@@@ endlich einem Stammesmitglied ein Lachen entlockt (der Treppenwitz
          hat bestimmt geholfen). Zum König der Wortspiele gekrönt, steigt unser Dino-Hüter endlich eine Stufe auf
          und kehrt zu den Dinos zurück.
        it: Barzelletta dopo barzelletta, @@@session.user.name@@@ è riuscito a strappare una risata a un membro
          della tribù (la battuta sulle scale avrà aiutato). Incoronato re delle battute, il nostro guardiano dei
          dino risale finalmente di livello e torna dai dino.
        pt: Piada atrás de piada, @@@session.user.name@@@ acabou por arrancar uma gargalhada a um membro da tribo
          (a piada das escadas deve ter ajudado). Coroado rei dos trocadilhos, o nosso guardião dos dinos sobe finalmente
          de nível e volta para junto dos dinos.
        br: Piada atrás de piada, @@@session.user.name@@@ acabou arrancando uma risada de um membro da tribo (a
          piada da escada com certeza ajudou). Coroado rei dos trocadilhos, nosso cuidador de dinos finalmente sobe
          de nível e volta para perto dos dinos.
        nl: Mop na mop heeft @@@session.user.name@@@ eindelijk een stamlid aan het lachen gekregen (de trappenmop
          hielp vast). Gekroond tot koning van de woordgrappen gaat onze dinoverzorger eindelijk een level omhoog
          en keert terug naar de dino's.
      gage_d_12:
        fr: 'Deux minutes de crayon auront suffi : le dino que gardait @@@session.user.name@@@ trône désormais sur
          le papier, avec un sourire bien trop grand pour être vrai. La tribu a deviné d''où il sortait, et son
          artiste se réveille sous les applaudissements.'
        en: 'Two minutes of pencil were enough: the dino @@@session.user.name@@@ was looking after now sits proudly
          on paper, with a smile far too big to be true. The tribe guessed where it came from, and its artist wakes
          up to applause.'
        es: 'Bastaron dos minutos de lápiz: el dino que cuidaba @@@session.user.name@@@ luce ahora en el papel,
          con una sonrisa demasiado grande para ser verdad. La tribu adivinó de dónde salía, y su artista se despierta
          entre aplausos.'
        de: 'Zwei Minuten Bleistift haben gereicht: Der Dino, um den sich @@@session.user.name@@@ gekümmert hat,
          thront jetzt auf dem Papier, mit einem viel zu breiten Lächeln. Der Stamm hat erraten, woher er kam, und
          sein Künstler wacht unter Applaus auf.'
        it: 'Sono bastati due minuti di matita: il dino di cui si occupava @@@session.user.name@@@ troneggia ora
          sul foglio, con un sorriso troppo grande per essere vero. La tribù ha indovinato da dove usciva, e il
          suo artista si risveglia tra gli applausi.'
        pt: 'Bastaram dois minutos de lápis: o dino de que @@@session.user.name@@@ cuidava reina agora no papel,
          com um sorriso grande demais para ser verdade. A tribo adivinhou de onde ele saiu, e o seu artista acorda
          entre aplausos.'
        br: 'Bastaram dois minutos de lápis: o dino de que @@@session.user.name@@@ cuidava agora brilha no papel,
          com um sorriso grande demais para ser verdade. A tribo adivinhou de onde ele saiu, e seu artista acorda
          sob aplausos.'
        nl: 'Twee minuten tekenen was genoeg: de dino voor wie @@@session.user.name@@@ zorgde, prijkt nu op papier,
          met een veel te grote glimlach. De stam heeft geraden waar hij vandaan kwam, en zijn kunstenaar wordt
          wakker onder applaus.'
      gage_d_13:
        fr: Trois minutes durant, @@@session.user.name@@@ a renvoyé à la tribu chacun de ses derniers mots, tout
          bas, jusqu'à ce que plus personne n'ose finir une phrase. L'écho s'est tu, la grotte a rendu son petit
          gardien, et la tribu le réveille en riant.
        en: For three whole minutes, @@@session.user.name@@@ sent each last word back to the tribe in a whisper,
          until nobody dared finish a sentence. The echo has gone quiet, the cave has given back its little keeper,
          and the tribe wakes them up laughing.
        es: Durante tres minutos, @@@session.user.name@@@ devolvió a la tribu cada una de sus últimas palabras,
          en voz baja, hasta que nadie se atrevía a terminar una frase. El eco se ha callado, la cueva ha devuelto
          a su pequeño cuidador y la tribu lo despierta entre risas.
        de: Drei Minuten lang hat @@@session.user.name@@@ dem Stamm jedes letzte Wort ganz leise zurückgegeben,
          bis sich niemand mehr traute, einen Satz zu beenden. Das Echo ist verstummt, die Höhle hat ihren kleinen
          Hüter zurückgegeben, und der Stamm weckt ihn lachend auf.
        it: Per tre minuti, @@@session.user.name@@@ ha rimandato alla tribù ognuna delle sue ultime parole, sottovoce,
          finché nessuno osava più finire una frase. L'eco si è spenta, la grotta ha restituito il suo piccolo guardiano,
          e la tribù lo sveglia ridendo.
        pt: Durante três minutos, @@@session.user.name@@@ devolveu à tribo cada uma das suas últimas palavras, baixinho,
          até já ninguém se atrever a acabar uma frase. O eco calou-se, a gruta devolveu o seu pequeno guardião,
          e a tribo acorda-o a rir.
        br: Durante três minutos, @@@session.user.name@@@ devolveu à tribo cada uma das suas últimas palavras, baixinho,
          até ninguém mais ter coragem de terminar uma frase. O eco se calou, a caverna devolveu seu pequeno cuidador,
          e a tribo o acorda rindo.
        nl: Drie minuten lang heeft @@@session.user.name@@@ elk laatste woord fluisterend teruggegeven aan de stam,
          tot niemand nog een zin durfde af te maken. De echo is stil, de grot heeft zijn kleine verzorger teruggegeven,
          en de stam maakt hem lachend wakker.
      gage_d_14:
        fr: 'Les surnoms sont distribués : chaque membre de la tribu porte désormais le surnom que @@@session.user.name@@@
          lui a trouvé, et qu''il a accepté de bon cœur. Une journée entière à répondre à ces noms-là, et la tribu,
          rebaptisée de la tête aux pieds, réveille son parrain dans la bonne humeur.'
        en: 'The nicknames are handed out: every tribe member now wears the nickname @@@session.user.name@@@ found
          for them, and happily agreed to. A whole day answering to those names, and the tribe, renamed from head
          to toe, wakes its name-giver up in high spirits.'
        es: 'Los apodos están repartidos: cada miembro de la tribu lleva ahora el apodo que @@@session.user.name@@@
          le ha buscado, y que aceptó de buen grado. Un día entero respondiendo a esos nombres, y la tribu, rebautizada
          de pies a cabeza, despierta a su padrino con buen humor.'
        de: 'Die Spitznamen sind verteilt: Jedes Stammesmitglied trägt jetzt den Spitznamen, den @@@session.user.name@@@
          für es gefunden hat, und hat ihn gern angenommen. Einen ganzen Tag lang auf diese Namen hören, und der
          Stamm, von Kopf bis Fuß umgetauft, weckt seinen Namensgeber gut gelaunt auf.'
        it: 'I soprannomi sono distribuiti: ogni membro della tribù porta ora il soprannome che @@@session.user.name@@@
          gli ha trovato, e che ha accettato di buon cuore. Un''intera giornata a rispondere a quei nomi, e la tribù,
          ribattezzata da capo a piedi, sveglia il suo padrino di buonumore.'
        pt: 'As alcunhas estão distribuídas: cada membro da tribo tem agora a alcunha que @@@session.user.name@@@
          lhe encontrou, e que aceitou de bom grado. Um dia inteiro a responder por esses nomes, e a tribo, rebatizada
          dos pés à cabeça, acorda o seu padrinho com bom humor.'
        br: 'Os apelidos foram distribuídos: cada membro da tribo agora tem o apelido que @@@session.user.name@@@
          encontrou para ele, e que aceitou de bom grado. Um dia inteiro respondendo por esses nomes, e a tribo,
          rebatizada dos pés à cabeça, acorda seu padrinho com bom humor.'
        nl: 'De bijnamen zijn uitgedeeld: elk stamlid draagt nu de bijnaam die @@@session.user.name@@@ voor hem
          bedacht, en die hij graag aannam. Een hele dag naar die namen luisteren, en de stam, van top tot teen
          omgedoopt, maakt zijn peetouder goedgehumeurd wakker.'
      gage_d_15:
        fr: 'Un quart d''heure durant, @@@session.user.name@@@ n''a plus traversé une seule pièce autrement que
          de côté, pinces levées, au grand désarroi des portes trop étroites. Les crabes de la rivière saluent leur
          cousin : la tribu retrouve son gardien, un peu de travers mais bien réveillé.'
        en: 'For a quarter of an hour, @@@session.user.name@@@ crossed every room sideways only, claws raised, much
          to the dismay of the narrower doors. The river crabs salute their cousin: the tribe gets its keeper back,
          a bit lopsided but wide awake.'
        es: 'Durante un cuarto de hora, @@@session.user.name@@@ solo cruzó las habitaciones de lado, pinzas en alto,
          para desesperación de las puertas demasiado estrechas. Los cangrejos del río saludan a su primo: la tribu
          recupera a su cuidador, un poco torcido pero bien despierto.'
        de: 'Eine Viertelstunde lang hat @@@session.user.name@@@ jedes Zimmer nur seitwärts durchquert, Scheren
          erhoben, sehr zum Leidwesen der zu schmalen Türen. Die Krabben am Fluss grüßen ihren Vetter: Der Stamm
          hat seinen Hüter zurück, etwas schief, aber hellwach.'
        it: 'Per un quarto d''ora, @@@session.user.name@@@ ha attraversato ogni stanza solo di lato, chele alzate,
          con gran disappunto delle porte troppo strette. I granchi del fiume salutano il loro cugino: la tribù
          ritrova il suo guardiano, un po'' storto ma ben sveglio.'
        pt: 'Durante um quarto de hora, @@@session.user.name@@@ só atravessou as divisões de lado, pinças no ar,
          para desespero das portas mais estreitas. Os caranguejos do rio saúdam o seu primo: a tribo recupera o
          seu guardião, um pouco torto mas bem acordado.'
        br: 'Durante quinze minutos, @@@session.user.name@@@ só atravessou os cômodos de lado, pinças para cima,
          para desespero das portas estreitas demais. Os caranguejos do rio saúdam o primo: a tribo recupera seu
          cuidador, meio torto mas bem acordado.'
        nl: 'Een kwartier lang heeft @@@session.user.name@@@ elke kamer alleen zijwaarts doorkruist, scharen omhoog,
          tot wanhoop van de te smalle deuren. De krabben in de rivier groeten hun neef: de stam heeft zijn verzorger
          terug, een beetje scheef maar klaarwakker.'
      gage_heal:
        fr: Seulement si les chefs de ta tribu trouvent que tu as réussi, ils pourront te réveiller.
        en: Only if your tribe chiefs think you succeeded will they be able to wake you up.
        es: Solo si los jefes de tu tribu consideran que lo has conseguido podrán despertarte.
        de: Nur wenn die Stammes-Chefs finden, dass du es geschafft hast, können sie dich aufwecken.
        it: Solo se i capi della tua tribù riterranno che ce l'hai fatta, potranno svegliarti.
        pt: Só se os chefes da tua tribo acharem que conseguiste é que te poderão acordar.
        br: Os chefes da sua tribo só poderão acordar você se acharem que você conseguiu.
        nl: Alleen als je stamhoofden vinden dat het je gelukt is, kunnen ze je wakker maken.

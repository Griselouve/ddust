      clan_menu_ai_off_desc:
        fr: 'Pour toute la tribu : « Inspire moi » propose des idées toutes faites, et l''histoire de l''œuf laisse
          place au mur de la grotte'
        en: 'For the whole tribe: "Inspire me" offers ready-made ideas, and the egg story gives way to the cave
          wall'
        es: 'Para toda la tribu: «Inspírame» propone ideas ya hechas y el cuento del huevo deja paso a la pared
          de la cueva'
        de: 'Für den ganzen Stamm: „Inspiriere mich“ schlägt fertige Ideen vor, und statt der Ei-Geschichte erscheint
          die Höhlenwand'
        it: 'Per tutta la tribù: «Ispirami» propone idee già pronte e il racconto dell''uovo lascia il posto alla
          parete della grotta'
        pt: 'Para toda a tribo: «Inspira-me» propõe ideias já feitas e o conto do ovo dá lugar à parede da gruta'
        br: 'Para toda a tribo: "Me inspire" sugere ideias prontas e o conto do ovo dá lugar à parede da caverna'
        nl: 'Voor de hele stam: ''Inspireer me'' stelt kant-en-klare ideeën voor en het ei-verhaal maakt plaats
          voor de grotmuur'
      clan_menu_ai_on_desc:
        fr: 'Pour toute la tribu : « Inspire moi » et l''histoire de l''œuf font de nouveau appel à l''IA'
        en: 'For the whole tribe: "Inspire me" and the egg story use AI again'
        es: 'Para toda la tribu: «Inspírame» y el cuento del huevo vuelven a usar la IA'
        de: 'Für den ganzen Stamm: „Inspiriere mich“ und die Ei-Geschichte nutzen wieder die KI'
        it: 'Per tutta la tribù: «Ispirami» e il racconto dell''uovo tornano a usare l''IA'
        pt: 'Para toda a tribo: «Inspira-me» e o conto do ovo voltam a usar a IA'
        br: 'Para toda a tribo: "Me inspire" e o conto do ovo voltam a usar a IA'
        nl: 'Voor de hele stam: ''Inspireer me'' en het ei-verhaal gebruiken weer AI'
      create_player_description_label:
        fr: Raconte son gardien de dinos
        en: Tell us about their dino keeper
        es: Cuenta quién es su cuidador de dinos
        de: Erzähl von seinem Dino-Hüter
        it: Racconta il suo guardiano dei dino
        pt: Conta quem é o seu guardião dos dinos
        br: Conte quem é esse cuidador de dinos
        nl: Vertel over zijn dinoverzorger
      invite_consent_notice:
        fr: En invitant quelqu'un dans votre tribu, vous déclarez de qui il s'agit. S'il s'agit d'un enfant dont
          vous êtes le responsable légal, vous consentez à la collecte de ses données de jeu. Plus de détails sur
          ((les conditions générales d'utilisation|documents.open_doc?cgu@a)).
        en: By inviting someone into your tribe, you declare who they are. If it is a child for whom you are the
          legal guardian, you consent to the collection of their game data. More details in ((the terms of service|documents.open_doc?cgu@a)).
        es: Al invitar a alguien a tu tribu, declaras de quién se trata. Si es un niño del que eres el responsable
          legal, consientes la recogida de sus datos de juego. Más detalles en ((las condiciones generales de uso|documents.open_doc?cgu@a)).
        de: Wenn du jemanden in deinen Stamm einlädst, erklärst du, um wen es sich handelt. Handelt es sich um ein
          Kind, dessen Erziehungsberechtigter du bist, willigst du in die Erhebung seiner Spieldaten ein. Mehr Details
          in ((den Nutzungsbedingungen|documents.open_doc?cgu@a)).
        it: Invitando qualcuno nella tua tribù, dichiari di chi si tratta. Se si tratta di un bambino di cui sei
          il tutore legale, acconsenti alla raccolta dei suoi dati di gioco. Maggiori dettagli nelle ((Condizioni
          d'uso|documents.open_doc?cgu@a)).
        pt: Ao convidares alguém para a tua tribo, declaras de quem se trata. Se for uma criança de quem és o responsável
          legal, consentes a recolha dos seus dados de jogo. Mais detalhes nos ((Termos de utilização|documents.open_doc?cgu@a)).
        br: Ao convidar alguém para a sua tribo, você declara de quem se trata. Se for uma criança pela qual você
          é o responsável legal, você consente com a coleta dos dados de jogo dela. Mais detalhes nos ((Termos de
          uso|documents.open_doc?cgu@a)).
        nl: Door iemand in je stam uit te nodigen, verklaar je om wie het gaat. Gaat het om een kind van wie je
          de wettelijke voogd bent, dan stem je in met het verzamelen van zijn spelgegevens. Meer details in de
          ((Gebruiksvoorwaarden|documents.open_doc?cgu@a)).
      invite_consent_child_hint:
        fr: 'Pour inviter un enfant, c''est lui qui commence : il installe le jeu et dit qu''il veut jouer. Scannez
          ensuite le QR code qu''il affiche avec « Ajouter mon enfant », dans le menu de la tribu. Ici, vous invitez
          un adulte.'
        en: 'To invite a child, they go first: they install the game and say they want to play. Then scan the QR
          code they display with “Add my child”, in the tribe menu. Here, you are inviting an adult.'
        es: 'Para invitar a un niño, empieza él: instala el juego y dice que quiere jugar. Después escanea el código
          QR que muestra con «Añadir a mi hijo», en el menú de la tribu. Aquí invitas a un adulto.'
        de: 'Um ein Kind einzuladen, fängt es selbst an: Es installiert das Spiel und sagt, dass es spielen will.
          Scanne danach den QR-Code, den es anzeigt, mit „Mein Kind hinzufügen“ im Stammes-Menü. Hier lädst du einen
          Erwachsenen ein.'
        it: 'Per invitare un bambino, comincia lui: installa il gioco e dice che vuole giocare. Poi scansiona il
          codice QR che mostra con «Aggiungi mio figlio», nel menu della tribù. Qui inviti un adulto.'
        pt: 'Para convidar uma criança, é ela que começa: instala o jogo e diz que quer jogar. Depois digitaliza
          o código QR que ela mostra com «Adicionar o meu filho», no menu da tribo. Aqui, convidas um adulto.'
        br: 'Para convidar uma criança, é ela quem começa: instala o jogo e diz que quer jogar. Depois, escaneie
          o QR Code que ela mostra com “Adicionar meu filho”, no menu da tribo. Aqui, você está convidando um adulto.'
        nl: 'Om een kind uit te nodigen, begint het zelf: het installeert het spel en zegt dat het wil spelen. Scan
          daarna de QR-code die het toont met ‘Mijn kind toevoegen’ in het stammenu. Hier nodig je een volwassene
          uit.'

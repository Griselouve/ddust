        es: 'Una tribu pequeñita: un adulto y su cuidador de dinos, o dos amigos del valle.'
        de: 'Ein kleiner Stamm: ein Erwachsener und sein Dino-Hüter, oder zwei Freunde aus dem Tal.'
        it: 'Una piccola tribù: un adulto e il suo guardiano dei dino, o due amici della valle.'
        pt: 'Uma pequena tribo: um adulto e o seu guardião dos dinos, ou dois amigos do vale.'
        br: 'Uma pequena tribo: um adulto e seu cuidador de dinos, ou dois amigos do vale.'
        nl: 'Een kleine stam: een volwassene en zijn dinoverzorger, of twee vrienden uit de vallei.'
      store_clan_desc:
        fr: 'La famille de tous les jours : parents et enfants réunis autour des mêmes dinos.'
        en: 'The everyday family: parents and children gathered around the same dinos.'
        es: 'La familia de siempre: padres e hijos juntos alrededor de los mismos dinos.'
        de: 'Die ganz normale Familie: Eltern und Kinder kümmern sich um dieselben Dinos.'
        it: 'La famiglia di tutti i giorni: genitori e figli riuniti attorno agli stessi dino.'
        pt: 'A família do dia a dia: pais e filhos juntos à volta dos mesmos dinos.'
        br: 'A família do dia a dia: pais e filhos juntos em volta dos mesmos dinos.'
        nl: 'Het gewone gezin: ouders en kinderen samen rond dezelfde dino''s.'
      store_tribu_desc:
        fr: 'Quand la grotte déborde : grande fratrie, foyers réunis, le cercle autour du feu s''agrandit.'
        en: 'When the cave overflows: a big sibling crew, homes joined together, the circle around the fire grows.'
        es: 'Cuando la cueva se queda pequeña: muchos hermanos, hogares unidos, el círculo junto al fuego crece.'
        de: 'Wenn die Höhle überquillt: viele Geschwister, vereinte Familien, der Kreis ums Feuer wird größer.'
        it: 'Quando la grotta trabocca: tanti fratelli, famiglie riunite, il cerchio attorno al fuoco si allarga.'
        pt: 'Quando a gruta transborda: muitos irmãos, lares unidos, a roda à volta da fogueira cresce.'
        br: 'Quando a caverna fica cheia: muitos irmãos, lares unidos, a roda em volta da fogueira cresce.'
        nl: 'Als de grot overloopt: veel broers en zussen, gezinnen samen, de kring rond het vuur wordt groter.'
      store_guilde_desc:
        fr: Cousins, grands-parents, deux grottes qui n'en font plus qu'une.
        en: Cousins, grandparents, two caves that have become one.
        es: Primos, abuelos, dos cuevas que ya son una sola.
        de: Cousins, Großeltern, zwei Höhlen, die eins geworden sind.
        it: Cugini, nonni, due grotte che ormai sono una sola.
        pt: Primos, avós, duas grutas que passaram a ser uma só.
        br: Primos, avós, duas cavernas que viraram uma só.
        nl: 'Neven, nichten, grootouders: twee grotten die één zijn geworden.'
      store_royaume_desc:
        fr: 'Pour les tribus sans fin : aucune limite, tous les gardiens de dinos que vous voudrez.'
        en: 'For endless tribes: no limit, as many dino keepers as you like.'
        es: 'Para tribus sin fin: sin límite, todos los cuidadores de dinos que queráis.'
        de: 'Für Stämme ohne Ende: keine Grenze, so viele Dino-Hüter, wie ihr wollt.'
        it: 'Per le tribù senza fine: nessun limite, tutti i guardiani dei dino che volete.'
        pt: 'Para tribos sem fim: sem limite, todos os guardiões dos dinos que quiserem.'
        br: 'Para tribos sem fim: sem limite, todos os cuidadores de dinos que vocês quiserem.'
        nl: 'Voor stammen zonder eind: geen grens, zoveel dinoverzorgers als jullie willen.'

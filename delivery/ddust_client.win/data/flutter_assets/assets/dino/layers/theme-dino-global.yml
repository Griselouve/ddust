      opening_title:
        fr: Faire éclore l'œuf
        en: Hatch the egg
        es: Abrir el huevo
        de: Das Ei öffnen
        it: Far schiudere l'uovo
        pt: Abrir o ovo
        br: Abrir o ovo
        nl: Het ei laten uitkomen
      opening_master_text:
        fr: |-
          Le moment tant attendu est arrivé ! Il est temps de faire éclore l'œuf et de découvrir ses surprises. Faites-le bien :

          • Réunissez la tribu, si possible pour de vrai, dans la même pièce
          • Chacun peut raconter son histoire, ce qu'il a accompli, ce dont il est fier, ce qui a été difficile. Vous pouvez même jouer des rôles
          • Utilisez une tirelire ou une boîte pour y mettre l'argent de poche et l'ouvrir en famille
          • Fêtez ce beau travail, posez les écrans et faites un jeu en famille, vous l'avez bien mérité
          • Et celui qui a remporté le moins d'XP gagne un lot de consolation : « tout le monde lui fait un bisou ! »
        en: |-
          The moment you have been waiting for is here! Time to hatch the egg and discover its surprises. Do it properly:

          • Gather the tribe, in the same room if you can
          • Everyone can tell their story: what they achieved, what they are proud of, what was hard. You can even act it out
          • Use a piggy bank or a box to hold the pocket money, and open it together
          • Celebrate all that good work: put the screens down and play a family game, you have earned it
          • And whoever earned the least XP gets a consolation prize: “everyone gives them a kiss!”
        es: |-
          ¡Ha llegado el momento tan esperado! Es hora de abrir el huevo y descubrir sus sorpresas. Hacedlo bien:

          • Reunid a la tribu, a ser posible de verdad, en la misma habitación
          • Cada uno puede contar su historia: lo que ha logrado, de qué está orgulloso, qué le ha costado. Incluso podéis interpretar papeles
          • Usad una hucha o una caja para guardar la paga y abridla en familia
          • Celebrad este buen trabajo: dejad las pantallas y jugad a un juego en familia, os lo habéis ganado
          • Y quien haya ganado menos XP recibe un premio de consolación: «¡todos le dan un beso!»
        de: |-
          Der lang ersehnte Moment ist da! Zeit, das Ei zu öffnen und seine Überraschungen zu entdecken. Macht es richtig:

          • Holt den Stamm zusammen, am besten wirklich im selben Raum
          • Jeder kann seine Geschichte erzählen: was er geschafft hat, worauf er stolz ist, was schwer war. Ihr könnt sogar Rollen spielen
          • Nehmt eine Spardose oder eine Schachtel für das Taschengeld und öffnet sie gemeinsam
          • Feiert die tolle Arbeit: legt die Bildschirme weg und spielt ein Familienspiel, ihr habt es euch verdient
          • Und wer die wenigsten XP gesammelt hat, bekommt einen Trostpreis: „Alle geben ihm einen Kuss!“
        it: |-
          Il momento tanto atteso è arrivato! È ora di aprire l'uovo e scoprire le sue sorprese. Fatelo bene:

          • Riunite la tribù, se possibile davvero, nella stessa stanza
          • Ognuno può raccontare la sua storia: cosa ha fatto, di cosa è fiero, cosa è stato difficile. Potete anche recitare dei ruoli
          • Usate un salvadanaio o una scatola per metterci la paghetta e apritelo in famiglia
          • Festeggiate il bel lavoro: mettete via gli schermi e fate un gioco in famiglia, ve lo siete meritato
          • E chi ha ottenuto meno XP vince un premio di consolazione: «tutti gli danno un bacio!»
        pt: |-
          Chegou o momento tão esperado! Está na hora de abrir o ovo e descobrir as suas surpresas. Façam-no bem:

          • Juntem a tribo, se possível a sério, na mesma divisão
          • Cada um pode contar a sua história: o que conseguiu, do que se orgulha, o que foi difícil. Podem até fazer teatro
          • Usem um mealheiro ou uma caixa para guardar a semanada e abram-no em família
          • Celebrem o bom trabalho: pousem os ecrãs e façam um jogo em família, vocês merecem
          • E quem ganhou menos XP recebe um prémio de consolação: «toda a gente lhe dá um beijinho!»
        br: |-
          Chegou o momento tão esperado! É hora de abrir o ovo e descobrir suas surpresas. Façam do jeito certo:

          • Reúnam a tribo, de verdade se possível, no mesmo cômodo
          • Cada um pode contar sua história: o que conseguiu, do que se orgulha, o que foi difícil. Vocês podem até encenar
          • Usem um cofrinho ou uma caixa para guardar a mesada e abram em família
          • Comemorem o bom trabalho: larguem as telas e façam um jogo em família, vocês merecem
          • E quem ganhou menos XP leva um prêmio de consolação: “todo mundo dá um beijo nele!”
        nl: |-
          Het langverwachte moment is daar! Tijd om het ei open te maken en de verrassingen te ontdekken. Doe het goed:

          • Breng de stam samen, het liefst echt in dezelfde kamer
          • Iedereen mag zijn verhaal vertellen: wat hij gedaan heeft, waar hij trots op is, wat moeilijk was. Jullie kunnen het zelfs naspelen
          • Gebruik een spaarpot of een doosje voor het zakgeld en maak het samen open
          • Vier het goede werk: leg de schermen weg en speel een gezelschapsspel, dat hebben jullie verdiend
          • En wie de minste XP heeft, krijgt een troostprijs: “iedereen geeft hem een kusje!”
      opening_master_btn:
        fr: Prêt ! On fait éclore l'œuf !
        en: Ready! Let's hatch the egg!
        es: ¡Listos! ¡Abramos el huevo!
        de: Fertig! Wir öffnen das Ei!
        it: Pronti! Apriamo l'uovo!
        pt: Prontos! Vamos abrir o ovo!
        br: Prontos! Vamos abrir o ovo!
        nl: Klaar! Het ei mag uitkomen!
      opening_player_text:
        fr: La tribu a chouchouté les dinos contre la poussière, le désordre et le linge sale. Le dino du jour est
          tout content ! Et pour dire merci, il a laissé... un gros œuf plein de surprises !
        en: 'The tribe took great care of the dinos: no more dust, mess or dirty laundry. The dino of the day is
          so happy! And to say thank you, it left... a big egg full of surprises!'
        es: 'La tribu ha cuidado muy bien de los dinos: adiós al polvo, al desorden y a la ropa sucia. ¡El dino
          del día está feliz! Y para dar las gracias, ha dejado... ¡un huevo enorme lleno de sorpresas!'
        de: 'Der Stamm hat sich toll um die Dinos gekümmert: Staub, Unordnung und schmutzige Wäsche sind weg. Der
          Dino des Tages ist glücklich! Und zum Dank hat er... ein großes Ei voller Überraschungen dagelassen!'
        it: 'La tribù si è presa cura dei dino: via la polvere, il disordine e i panni sporchi. Il dino del giorno
          è felicissimo! E per dire grazie ha lasciato... un grande uovo pieno di sorprese!'
        pt: 'A tribo cuidou muito bem dos dinos: adeus pó, desarrumação e roupa suja. O dino do dia está todo contente!
          E para agradecer, deixou... um ovo enorme cheio de surpresas!'
        br: 'A tribo cuidou muito bem dos dinos: tchau poeira, bagunça e roupa suja. O dino do dia está todo feliz!
          E para agradecer, deixou... um ovo enorme cheio de surpresas!'
        nl: 'De stam heeft goed voor de dino''s gezorgd: weg met stof, rommel en vuile was. De dino van de dag is
          superblij! En als bedankje liet hij... een groot ei vol verrassingen achter!'
      opening_player_btn:
        fr: Je fais éclore l'œuf !
        en: I'm hatching the egg!
        es: ¡Abro el huevo!
        de: Ich öffne das Ei!
        it: Apro l'uovo!
        pt: Vou abrir o ovo!
        br: Vou abrir o ovo!
        nl: Ik maak het ei open!
      opening_notif:
        fr: 'La tribu t''appelle : viens faire éclore l''œuf !'
        en: 'The tribe is calling: come and hatch the egg!'
        es: 'La tribu te llama: ¡ven a abrir el huevo!'
        de: 'Der Stamm ruft: Komm, wir öffnen das Ei!'
        it: 'La tribù ti chiama: vieni ad aprire l''uovo!'
        pt: 'A tribo está a chamar-te: vem abrir o ovo!'
        br: 'A tribo está te chamando: venha abrir o ovo!'
        nl: 'De stam roept je: kom het ei openmaken!'
      butin_notif:
        fr: Crac ! L'œuf a éclos ! Viens voir ta surprise.
        en: Crack! The egg has hatched! Come and see your surprise.
        es: ¡Crac! ¡El huevo se ha abierto! Ven a ver tu sorpresa.
        de: Knack! Das Ei ist aufgesprungen! Komm und sieh dir deine Überraschung an.
        it: Crac! L'uovo si è schiuso! Vieni a vedere la tua sorpresa.
        pt: Crac! O ovo abriu-se! Vem ver a tua surpresa.
        br: Crec! O ovo abriu! Venha ver sua surpresa.
        nl: Krak! Het ei is uitgekomen! Kom je verrassing bekijken.

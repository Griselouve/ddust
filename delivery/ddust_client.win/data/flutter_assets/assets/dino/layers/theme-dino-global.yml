        it: '@@@session.user.name@@@ ha ricevuto la sua parte: {amount} dindini di paghetta vera e propria.'
        pt: '@@@session.user.name@@@ recebeu a sua parte: {amount} paus de mesada bem verdadeira.'
        br: '@@@session.user.name@@@ recebeu sua parte: {amount} paus de mesada de verdade.'
        nl: '@@@session.user.name@@@ heeft zijn deel gekregen: {amount} pegels echt zakgeld.'
      log_boss_summoned:
        fr: 'Le dino du jour arrive dans la vallée : {task} rapporte plein d''XP en plus.'
        en: 'The dino of the day arrives in the valley: {task} now gives lots of extra XP.'
        es: 'El dino del día llega al valle: {task} da un montón de XP extra.'
        de: 'Der Dino des Tages kommt ins Tal: {task} bringt jetzt viele Extra-XP.'
        it: 'Il dino del giorno arriva nella valle: {task} dà tanti XP in più.'
        pt: 'O dino do dia chegou ao vale: {task} dá muitos XP extra.'
        br: 'O dino do dia chegou ao vale: {task} dá muito XP extra.'
        nl: 'De dino van de dag komt de vallei in: {task} geeft veel extra XP.'
      evt_chase:
        fr: Faire partir
        en: Shoo away
        es: Espantar
        de: Verscheuchen
        it: Mandar via
        pt: Enxotar
        br: Espantar
        nl: Wegsturen
      evt_chase_desc:
        fr: Faire sortir le curieux de la tribu
        en: Send the snooper out of the tribe
        es: Sacar al curioso de la tribu
        de: Den Schnüffler aus dem Stamm schicken
        it: Mandare il curiosone fuori dalla tribù
        pt: Mandar o curioso para fora da tribo
        br: Tirar o xereta da tribo
        nl: De nieuwsgierige uit de stam sturen
      evt_souris:
        fr: 'Une petite souris passe la tête : « Merci gardien de dinos, c''est bien plus propre maintenant ! Voici
          une petite récompense. »'
        en: 'A little mouse pokes its head out: “Thank you, dino keeper, it''s so much cleaner now! Here''s a small
          reward.”'
        es: 'Un ratoncito asoma la cabeza: «¡Gracias, cuidador de dinos, ahora está mucho más limpio! Aquí tienes
          una pequeña recompensa.»'
        de: 'Eine kleine Maus steckt den Kopf heraus: „Danke, Dino-Hüter, jetzt ist es viel sauberer! Hier ist eine
          kleine Belohnung.“'
        it: 'Un topolino fa capolino: «Grazie, guardiano dei dino, ora è molto più pulito! Ecco una piccola ricompensa.»'
        pt: 'Um ratinho espreita: «Obrigado, guardião dos dinos, agora está muito mais limpo! Aqui tens uma pequena
          recompensa.»'
        br: 'Um ratinho coloca a cabeça para fora: “Valeu, cuidador de dinos, agora está bem mais limpo! Aqui vai
          uma pequena recompensa.”'
        nl: 'Een muisje steekt zijn kopje naar buiten: “Dank je, dinoverzorger, het is nu veel schoner! Hier is
          een kleine beloning.”'
      evt_piege:
        fr: Oups ! Un petit dino farceur t'a fait une blague. Tu perds 1 point de vie… mais tu le récupéreras dès
          que cette mission sera validée !
        en: Oops! A cheeky little dino played a prank on you. You lose 1 health point… but you'll get it back as
          soon as this mission is validated!
        es: ¡Uy! Un dino bromista te ha gastado una broma. Pierdes 1 punto de vida… ¡pero lo recuperarás en cuanto
          se valide esta misión!
        de: Hoppla! Ein frecher kleiner Dino hat dir einen Streich gespielt. Du verlierst 1 Lebenspunkt… aber du
          bekommst ihn zurück, sobald dieser Auftrag bestätigt ist!
        it: Ops! Un dino burlone ti ha fatto uno scherzo. Perdi 1 punto vita… ma lo recupererai appena questa missione
          sarà convalidata!
        pt: Ups! Um dino brincalhão pregou-te uma partida. Perdes 1 ponto de vida… mas vais recuperá-lo assim que
          esta missão for validada!
        br: Ops! Um dino brincalhão pregou uma peça em você. Você perde 1 ponto de vida… mas vai recuperá-lo assim
          que esta missão for validada!
        nl: Oeps! Een ondeugend dinootje heeft je een streek geleverd. Je verliest 1 levenspunt… maar je krijgt
          het terug zodra deze opdracht is goedgekeurd!
      evt_gobelin_name:
        fr: Ptérodactyle fouineur
        en: Nosy pterodactyl
        es: Pterodáctilo cotilla
        de: Neugieriger Flugsaurier
        it: Pterodattilo ficcanaso
        pt: Pterodáctilo bisbilhoteiro
        br: Pterodáctilo xereta
        nl: Nieuwsgierige pterodactylus
      evt_gobelin:
        fr: Ouste ! Le ptérodactyle fouineur s'envole sans demander son reste. La tribu est tranquille, et tu gagnes
          un peu d'expérience.
        en: Shoo! The nosy pterodactyl flaps off without a word. The tribe is at peace, and you earn a little experience.
        es: ¡Fuera! El pterodáctilo cotilla se va volando sin rechistar. La tribu está tranquila y ganas un poco
          de experiencia.
        de: Husch! Der neugierige Flugsaurier flattert schnell davon. Der Stamm hat seine Ruhe, und du bekommst
          ein bisschen Erfahrung.
        it: Sciò! Lo pterodattilo ficcanaso vola via senza fiatare. La tribù è tranquilla, e tu guadagni un po'
          di esperienza.
        pt: Xô! O pterodáctilo bisbilhoteiro foge a voar sem dizer nada. A tribo está sossegada e tu ganhas um pouco
          de experiência.
        br: Xô! O pterodáctilo xereta sai voando sem dizer nada. A tribo está tranquila, e você ganha um pouco de
          experiência.
        nl: Hup, weg jij! De nieuwsgierige pterodactylus fladdert er snel vandoor. De stam heeft rust, en jij krijgt
          een beetje ervaring.
      evt_gobelin_notif:
        fr: '{name} a fait partir un ptérodactyle fouineur de la tribu !'
        en: '{name} shooed a nosy pterodactyl out of the tribe!'
        es: ¡{name} ha espantado a un pterodáctilo cotilla de la tribu!
        de: '{name} hat einen neugierigen Flugsaurier aus dem Stamm verscheucht!'
        it: '{name} ha mandato via uno pterodattilo ficcanaso dalla tribù!'
        pt: '{name} enxotou um pterodáctilo bisbilhoteiro da tribo!'
        br: '{name} espantou um pterodáctilo xereta da tribo!'
        nl: '{name} heeft een nieuwsgierige pterodactylus uit de stam gestuurd!'
      evt_changelin:
        fr: Démasqué ! Ce n'était pas {name} mais un caméléon farceur, qui file en rigolant. {name} et toi gagnez
          un peu d'expérience.
        en: Unmasked! That wasn't {name} but a cheeky chameleon, who runs off giggling. {name} and you both earn
          a little experience.
        es: ¡Descubierto! No era {name}, sino un camaleón bromista, que se escapa riéndose. {name} y tú ganáis un
          poco de experiencia.
        de: Erwischt! Das war nicht {name}, sondern ein freches Chamäleon, das kichernd davonläuft. {name} und du
          bekommt ein bisschen Erfahrung.
        it: Smascherato! Non era {name} ma un camaleonte burlone, che scappa ridacchiando. {name} e tu guadagnate
          un po' di esperienza.
        pt: Desmascarado! Não era {name}, mas sim um camaleão brincalhão, que foge a rir-se. {name} e tu ganham
          um pouco de experiência.
        br: Desmascarado! Não era {name}, e sim um camaleão brincalhão, que sai correndo e rindo. {name} e você
          ganham um pouco de experiência.
        nl: Ontmaskerd! Dat was niet {name} maar een grappige kameleon, die giechelend wegrent. {name} en jij krijgen
          een beetje ervaring.
      evt_changelin_miss:
        fr: Oups, c'était le vrai {name} ! Pendant ce temps, le caméléon farceur a filé en rigolant. Il reviendra
          peut-être…
        en: Oops, that was the real {name}! Meanwhile, the cheeky chameleon ran off giggling. Maybe it will be back…
        es: ¡Uy, era {name} de verdad! Mientras tanto, el camaleón bromista se ha escapado riéndose. A lo mejor
          vuelve…
        de: Hoppla, das war wirklich {name}! Inzwischen ist das freche Chamäleon kichernd davongelaufen. Vielleicht
          kommt es wieder…
        it: Ops, era il vero {name}! Nel frattempo, il camaleonte burlone è scappato ridacchiando. Forse tornerà…
        pt: Ups, era mesmo {name}! Entretanto, o camaleão brincalhão fugiu a rir-se. Talvez volte…
        br: Ops, era {name} de verdade! Enquanto isso, o camaleão brincalhão saiu correndo e rindo. Talvez ele volte…
        nl: Oeps, dat was echt {name}! Ondertussen is de grappige kameleon giechelend weggerend. Misschien komt
          hij terug…
      evt_changelin_notif:
        fr: '{name} a démasqué un caméléon farceur dans la tribu !'
        en: '{name} unmasked a cheeky chameleon in the tribe!'
        es: ¡{name} ha descubierto a un camaleón bromista en la tribu!
        de: '{name} hat ein freches Chamäleon im Stamm erwischt!'
        it: '{name} ha smascherato un camaleonte burlone nella tribù!'
        pt: '{name} desmascarou um camaleão brincalhão na tribo!'
        br: '{name} desmascarou um camaleão brincalhão na tribo!'
        nl: '{name} heeft een grappige kameleon in de stam ontmaskerd!'
      evt_bienfaiteur:
        fr: Tiens ? Quelqu'un de gentil a glissé un jus de baies dans ton sac. Bois-le quand tu veux !
        en: Oh? Someone kind slipped a berry juice into your bag. Drink it whenever you like!
        es: ¿Anda? Alguien muy amable ha metido un zumo de bayas en tu bolsa. ¡Bébetelo cuando quieras!
        de: Nanu? Jemand Liebes hat dir einen Beerensaft in die Tasche gesteckt. Trink ihn, wann du willst!
        it: Toh! Qualcuno di gentile ha messo un succo di bacche nella tua borsa. Bevilo quando vuoi!
        pt: Olha só! Alguém simpático pôs um sumo de bagas no teu saco. Bebe-o quando quiseres!
        br: Ué? Alguém muito legal colocou um suco de frutinhas na sua bolsa. Beba quando quiser!
        nl: Hé? Iemand liefs heeft een bessensap in je tas gestopt. Drink het op wanneer je wilt!

tags: [theme-dino]
data:
  lang:
    translations:
      it_t_titre_perso:
        fr: Surnom de personnage
        en: Character nickname
        es: Apodo de personaje
        de: Charakter-Spitzname
        it: Soprannome del personaggio
        pt: Alcunha de personagem
        br: Apelido de personagem
        nl: Personagebijnaam
      it_d_titre_perso:
        fr: Un surnom gagné à la sueur de l'éponge. À toi de décider si tu le portes.
        en: A nickname earned by the sweat of your sponge. Up to you whether you use it.
        es: Un apodo ganado con el sudor de la esponja. Tú decides si lo llevas.
        de: Ein Spitzname, verdient im Schweiße deines Schwamms. Du entscheidest, ob du ihn trägst.
        it: Un soprannome guadagnato col sudore della spugna. Sta a te decidere se usarlo.
        pt: Uma alcunha ganha com o suor da esponja. Tu decides se a usas.
        br: Um apelido ganho com o suor da esponja. Você decide se vai usá-lo.
        nl: Een bijnaam verdiend in het zweet van je spons. Jij beslist of je hem gebruikt.
      it_t_titre_clan:
        fr: Surnom de clan
        en: Clan nickname
        es: Apodo de clan
        de: Clan-Spitzname
        it: Soprannome del clan
        pt: Alcunha de clã
        br: Apelido de clã
        nl: Clanbijnaam
      it_d_titre_clan:
        fr: Un surnom gagné par le clan tout entier. Seul un chef de clan décide de l'arborer.
        en: A nickname earned by the whole clan. Only a clan chief decides to use it.
        es: Un apodo ganado por todo el clan. Solo un jefe de clan decide lucirlo.
        de: Ein Spitzname, verdient vom ganzen Clan. Nur ein Clanchef entscheidet, ihn zu tragen.
        it: Un soprannome guadagnato da tutto il clan. Solo un capo clan decide di sfoggiarlo.
        pt: Uma alcunha ganha pelo clã inteiro. Só um chefe de clã decide ostentá-la.
        br: Um apelido ganho pelo clã inteiro. Só um chefe de clã decide exibi-lo.
        nl: Een bijnaam verdiend door de hele clan. Alleen een clanhoofd beslist of hij gebruikt wordt.
      it_f_titres:
        fr: Surnoms
        en: Nicknames
        es: Apodos
        de: Spitznamen
        it: Soprannomi
        pt: Alcunhas
        br: Apelidos
        nl: Bijnamen
      it_o_title_apply:
        fr: Porter ce surnom
        en: Use this nickname
        es: Llevar este apodo
        de: Spitznamen tragen
        it: Usa questo soprannome
        pt: Usar esta alcunha
        br: Usar este apelido
        nl: Bijnaam gebruiken
      it_o_title_unapply:
        fr: Ne plus porter ce surnom
        en: Stop using this nickname
        es: Dejar de llevar este apodo
        de: Spitznamen ablegen
        it: Non usare più il soprannome
        pt: Deixar de usar a alcunha
        br: Parar de usar o apelido
        nl: Bijnaam niet meer gebruiken
      it_t_butin:
        fr: Œuf de dino
        en: Dino egg
        es: Huevo de dino
        de: Dino-Ei
        it: Uovo di dino
        pt: Ovo de dino
        br: Ovo de dino
        nl: Dino-ei
      it_d_butin:
        fr: 'L''œuf du clan : les surprises y attendent au chaud jusqu''à l''éclosion.'
        en: 'The clan''s egg: the surprises wait snug inside until it hatches.'
        es: 'El huevo del clan: las sorpresas esperan calentitas hasta que se abra.'
        de: 'Das Ei des Clans: Die Überraschungen warten darin warm, bis es aufspringt.'
        it: 'L''uovo del clan: le sorprese aspettano al calduccio finché non si schiude.'
        pt: 'O ovo do clã: as surpresas esperam quentinhas até ele se abrir.'
        br: 'O ovo do clã: as surpresas esperam quentinhas até ele abrir.'
        nl: 'Het ei van de clan: de verrassingen wachten er warm in tot het uitkomt.'
      it_t_potion_pv:
        fr: Jus de baies
        en: Berry juice
        es: Zumo de bayas
        de: Beerensaft
        it: Succo di bacche
        pt: Sumo de bagas
        br: Suco de frutinhas
        nl: Bessensap
      it_d_potion_pv:
        fr: Un ami secret l'a glissé dans ton sac. Bois-le pour retrouver 1 point de vie.
        en: A secret friend slipped it into your bag. Drink it to get 1 hit point back.
        es: Un amigo secreto lo metió en tu bolsa. Bébelo para recuperar 1 punto de vida.
        de: Ein heimlicher Freund hat ihn in deine Tasche gesteckt. Trink ihn, um 1 Lebenspunkt zurückzubekommen.
        it: Un amico segreto l'ha infilato nella tua borsa. Bevilo per recuperare 1 punto vita.
        pt: Um amigo secreto meteu-o no teu saco. Bebe-o para recuperares 1 ponto de vida.
        br: Um amigo secreto colocou ele na sua bolsa. Beba para recuperar 1 ponto de vida.
        nl: Een geheime vriend stopte het in je tas. Drink het op om 1 levenspunt terug te krijgen.
      it_f_potions:
        fr: Jus
        en: Juices
        es: Zumos
        de: Säfte
        it: Succhi
        pt: Sumos
        br: Sucos
        nl: Sapjes
      it_o_to_chest:
        fr: Remettre dans l'œuf
        en: Put back in the egg
        es: Devolver al huevo
        de: Zurück ins Ei
        it: Rimetti nell'uovo
        pt: Devolver ao ovo
        br: Devolver ao ovo
        nl: Terug in het ei
      it_o_open:
        fr: Faire éclore l'œuf
        en: Hatch the egg
        es: Abrir el huevo
        de: Ei öffnen
        it: Fai schiudere l'uovo
        pt: Abrir o ovo
        br: Abrir o ovo
        nl: Ei laten uitkomen
      butin_hint:
        fr: Touchez un objet pour le sortir de l'œuf, touchez la bourse pour promettre de l'argent.
        en: Tap an item to take it out of the egg, tap the purse to promise money.
        es: Toca un objeto para sacarlo del huevo, toca la bolsa para prometer dinero.
        de: Tippe einen Gegenstand an, um ihn aus dem Ei zu nehmen, tippe den Geldbeutel an, um Geld zu versprechen.
        it: Tocca un oggetto per toglierlo dall'uovo, tocca il borsellino per promettere soldi.
        pt: Toca num objeto para o tirar do ovo, toca na bolsa para prometer dinheiro.
        br: Toque em um objeto para tirá-lo do ovo, toque na bolsa para prometer dinheiro.
        nl: Tik op een voorwerp om het uit het ei te halen, tik op de buidel om geld te beloven.
      butin_empty:
        fr: L'œuf est vide.
        en: The egg is empty.
        es: El huevo está vacío.
        de: Das Ei ist leer.
        it: L'uovo è vuoto.
        pt: O ovo está vazio.
        br: O ovo está vazio.
        nl: Het ei is leeg.
      butin_note_title:
        fr: Une note dans l'œuf
        en: A note in the egg
        es: Una nota en el huevo
        de: Eine Notiz im Ei
        it: Un biglietto nell'uovo
        pt: Uma nota no ovo
        br: Uma nota no ovo
        nl: Een briefje in het ei
      butin_note_hint:
        fr: 'Cette note sera lue par tout le clan quand l''œuf éclora. Personne ne la voit avant, pas même les autres
          chefs de clan. C''est l''endroit rêvé pour une annonce ou une surprise : « on va tous à un super parc
          d''attractions, vous l''avez mérité ».'
        en: 'This note will be read by the whole clan when the egg hatches. Nobody sees it before then, not even
          the other clan chiefs. It''s the perfect place for an announcement or a surprise: “we''re all going to
          an amazing amusement park, you''ve earned it.”'
        es: 'Esta nota será leída por todo el clan cuando se abra el huevo. Nadie la ve antes, ni siquiera los demás
          jefes de clan. Es el lugar perfecto para un anuncio o una sorpresa: «vamos todos a un parque de atracciones
          increíble, os lo habéis ganado».'
        de: 'Diese Notiz wird vom ganzen Clan gelesen, wenn das Ei aufspringt. Vorher sieht sie niemand, nicht einmal
          die anderen Clanchefs. Der perfekte Ort für eine Ankündigung oder eine Überraschung: „Wir fahren alle
          in einen super Freizeitpark, ihr habt es euch verdient.“'
        it: 'Questo biglietto sarà letto da tutto il clan quando l''uovo si schiuderà. Nessuno lo vede prima, nemmeno
          gli altri capi clan. È il posto perfetto per un annuncio o una sorpresa: «andiamo tutti in un fantastico
          parco divertimenti, ve lo siete meritato».'
        pt: 'Esta nota será lida pelo clã inteiro quando o ovo se abrir. Ninguém a vê antes, nem sequer os outros
          chefes de clã. É o sítio ideal para um anúncio ou uma surpresa: «vamos todos a um parque de diversões
          espetacular, vocês merecem».'
        br: 'Esta nota será lida pelo clã inteiro quando o ovo abrir. Ninguém a vê antes, nem mesmo os outros chefes
          de clã. É o lugar ideal para um anúncio ou uma surpresa: "vamos todos a um parque de diversões incrível,
          vocês merecem".'
        nl: 'Dit briefje wordt door de hele clan gelezen als het ei uitkomt. Niemand ziet het eerder, zelfs de andere
          clanhoofden niet. De perfecte plek voor een aankondiging of een verrassing: ‘we gaan allemaal naar een
          supergaaf pretpark, jullie hebben het verdiend’.'
      butin_money_warning:
        fr: 'Attention : c''est une promesse d''argent RÉEL, à distribuer entre les joueurs le jour où l''œuf éclora.
          Prévois une tirelire ou une vraie boîte où déposer cet argent au fur et à mesure : le jour de l''éclosion,
          la distribution sera immédiate.'
        en: 'Careful: this is a promise of REAL money, to be shared among the players on the day the egg hatches.
          Keep a piggy bank or a real box and put the money in as you go: on hatching day, sharing it out will be
          immediate.'
        es: 'Atención: es una promesa de dinero REAL, para repartir entre los jugadores el día en que se abra el
          huevo. Ten una hucha o una caja de verdad donde ir metiendo ese dinero: el día de la apertura, el reparto
          será inmediato.'
        de: 'Achtung: Das ist ein Versprechen von ECHTEM Geld, das an dem Tag, an dem das Ei aufspringt, unter den
          Spielern aufgeteilt wird. Leg dir ein Sparschwein oder eine echte Kiste zu und steck das Geld nach und
          nach hinein: An diesem Tag wird dann sofort verteilt.'
        it: 'Attenzione: è una promessa di soldi VERI, da dividere tra i giocatori il giorno in cui l''uovo si schiuderà.
          Tieni un salvadanaio o una vera scatola dove mettere quei soldi man mano: il giorno della schiusa la distribuzione
          sarà immediata.'
        pt: 'Atenção: é uma promessa de dinheiro A SÉRIO, para repartir entre os jogadores no dia em que o ovo se
          abrir. Arranja um mealheiro ou uma caixa verdadeira onde ir pondo esse dinheiro: no dia da abertura, a
          distribuição será imediata.'
        br: 'Atenção: é uma promessa de dinheiro DE VERDADE, para dividir entre os jogadores no dia em que o ovo
          abrir. Arrume um cofrinho ou uma caixa de verdade para ir guardando esse dinheiro: no dia da abertura,
          a distribuição será imediata.'
        nl: 'Let op: dit is een belofte van ECHT geld, dat verdeeld wordt onder de spelers op de dag dat het ei
          uitkomt. Zet een spaarpot of een echte doos klaar en stop het geld er gaandeweg in: op die dag kan het
          meteen worden uitgedeeld.'
      money_lbl_back:
        fr: Somme à remettre dans l'œuf
        en: Amount to put back in the egg
        es: Cantidad a devolver al huevo
        de: Betrag zurück ins Ei
        it: Somma da rimettere nell'uovo
        pt: Quantia a devolver ao ovo
        br: Quantia a devolver ao ovo
        nl: Bedrag terug in het ei
      money_warn_back:
        fr: 'Cet argent quitte ta bourse et retourne dans l''œuf du clan : il sera repartagé à la prochaine éclosion.'
        en: 'This money leaves your purse and goes back into the clan''s egg: it will be shared again the next time
          the egg hatches.'
        es: 'Este dinero sale de tu bolsa y vuelve al huevo del clan: se repartirá de nuevo la próxima vez que se
          abra.'
        de: 'Dieses Geld verlässt deinen Geldbeutel und geht zurück ins Ei des Clans: Es wird neu verteilt, wenn
          das Ei das nächste Mal aufspringt.'
        it: 'Questi soldi escono dal tuo borsellino e tornano nell''uovo del clan: saranno ridivisi alla prossima
          schiusa.'
        pt: 'Este dinheiro sai da tua bolsa e volta para o ovo do clã: será repartido de novo quando o ovo voltar
          a abrir-se.'
        br: 'Este dinheiro sai da sua bolsa e volta para o ovo do clã: será dividido de novo quando o ovo abrir
          outra vez.'
        nl: 'Dit geld gaat uit je buidel terug in het ei van de clan: het wordt opnieuw verdeeld als het ei weer
          uitkomt.'
      awake_question:
        fr: 'La Vallée Verte vous attend.

          Êtes-vous prêts ?'
        en: 'Green Valley awaits.

          Are you ready?'
        es: 'El Valle Verde os espera.

          ¿Estáis listos?'
        de: 'Das Grüne Tal wartet auf euch.

          Seid ihr bereit?'
        it: 'La Valle Verde vi aspetta.

          Siete pronti?'
        pt: 'O Vale Verde espera-vos.

          Estão prontos?'
        br: 'O Vale Verde espera por vocês.

          Estão prontos?'
        nl: 'De Groene Vallei wacht op jullie.

          Zijn jullie klaar?'
      tuto_dash_clan:
        fr: 'Ton Clan : retrouve tes amis et le mur de la grotte.'
        en: 'Your Clan: find your friends and the cave wall.'
        es: 'Tu Clan: reúnete con tus amigos y mira la pared de la cueva.'
        de: 'Dein Clan: Hier findest du deine Freunde und die Höhlenwand.'
        it: 'Il tuo Clan: ritrova i tuoi amici e la parete della grotta.'
        pt: 'O teu Clã: reencontra os teus amigos e a parede da gruta.'
        br: 'Seu Clã: reencontre seus amigos e a parede da caverna.'
        nl: 'Je Clan: vind je vrienden en de grotmuur terug.'
      tuto_dash_clan_admin:
        fr: 'Ton Clan : c''est ici que tu invites tes gardiens de dinos, que tu gères les membres du clan et que
          tu retrouves le mur de la grotte.'
        en: 'Your Clan: this is where you invite your dino keepers, manage clan members and find the cave wall.'
        es: 'Tu Clan: aquí invitas a tus cuidadores de dinos, gestionas los miembros del clan y encuentras la pared
          de la cueva.'
        de: 'Dein Clan: Hier lädst du deine Dino-Hüter ein, verwaltest die Clanmitglieder und findest die Höhlenwand.'
        it: 'Il tuo Clan: qui inviti i tuoi guardiani dei dino, gestisci i membri del clan e ritrovi la parete della
          grotta.'
        pt: 'O teu Clã: é aqui que convidas os teus guardiões dos dinos, geres os membros do clã e encontras a parede
          da gruta.'
        br: 'Seu Clã: é aqui que você convida seus cuidadores de dinos, gerencia os membros do clã e encontra a
          parede da caverna.'
        nl: 'Je Clan: hier nodig je je dinoverzorgers uit, beheer je de clanleden en vind je de grotmuur.'
      tuto_dash_combat:
        fr: 'Les Dinos : ici, tu choisis un dino à chouchouter, une vraie tâche, pour gagner de l''XP.'
        en: 'Dinos: here you pick a dino to look after, a real task, and earn XP.'
        es: 'Los Dinos: aquí eliges un dino que cuidar, una tarea de verdad, para ganar XP.'
        de: 'Die Dinos: Hier wählst du einen Dino zum Umsorgen, eine echte Aufgabe, und verdienst XP.'
        it: 'I Dino: qui scegli un dino da coccolare, un vero compito, per guadagnare XP.'
        pt: 'Os Dinos: é aqui que escolhes um dino para cuidar, uma tarefa a sério, e ganhas XP.'
        br: 'Os Dinos: é aqui que você escolhe um dino pra cuidar, uma tarefa de verdade, e ganha XP.'
        nl: 'De Dino''s: hier kies je een dino om te verzorgen, een echte taak, en verdien je XP.'
      tuto_dash_combat_admin:
        fr: 'Les Dinos : ici, tu choisis un dino à chouchouter pour gagner de l''XP, tu valides les tâches des autres
          joueurs et tu gères la liste des tâches.'
        en: 'Dinos: here you pick a dino to look after and earn XP, validate other players'' tasks and manage the
          task list.'
        es: 'Los Dinos: aquí eliges un dino que cuidar para ganar XP, validas las tareas de otros jugadores y gestionas
          la lista de tareas.'
        de: 'Die Dinos: Hier wählst du einen Dino zum Umsorgen, um XP zu verdienen, bestätigst die Aufgaben der
          anderen Spieler und verwaltest die Aufgabenliste.'
        it: 'I Dino: qui scegli un dino da coccolare per guadagnare XP, convalidi i compiti degli altri giocatori
          e gestisci l''elenco dei compiti.'
        pt: 'Os Dinos: é aqui que escolhes um dino para cuidar e ganhar XP, validas as tarefas dos outros jogadores
          e geres a lista de tarefas.'
        br: 'Os Dinos: é aqui que você escolhe um dino pra cuidar e ganhar XP, valida as tarefas dos outros jogadores
          e gerencia a lista de tarefas.'
        nl: 'De Dino''s: hier kies je een dino om te verzorgen en XP te verdienen, valideer je de taken van andere
          spelers en beheer je de takenlijst.'
      tuto_dash_perso:
        fr: 'Ton Personnage : avatar, niveau, points de vie et ton journal.'
        en: 'Your Character: avatar, level, hit points and your log.'
        es: 'Tu Personaje: avatar, nivel, puntos de vida y tu registro.'
        de: 'Dein Charakter: Avatar, Stufe, Lebenspunkte und dein Tagebuch.'
        it: 'Il tuo Personaggio: avatar, livello, punti vita e il tuo diario.'
        pt: 'O teu Personagem: avatar, nível, pontos de vida e o teu diário.'
        br: 'Seu Personagem: avatar, nível, pontos de vida e seu diário.'
        nl: 'Je Personage: avatar, niveau, levenspunten en je dagboek.'
      tuto_dash_inv:
        fr: 'Les Items : ici tu trouves tes objets, tes petits pouvoirs et toutes sortes de bonus.'
        en: 'Items: here you find your objects, your little powers and all kinds of bonuses.'
        es: 'Los Items: aquí encuentras tus objetos, tus pequeños poderes y todo tipo de bonificaciones.'
        de: 'Die Items: Hier findest du deine Gegenstände, deine kleinen Kräfte und alle möglichen Boni.'
        it: 'Gli Oggetti: qui trovi i tuoi oggetti, i tuoi piccoli poteri e ogni sorta di bonus.'
        pt: 'Os Itens: aqui encontras os teus objetos, os teus pequenos poderes e todo o tipo de bónus.'
        br: 'Os Itens: aqui você encontra seus objetos, seus pequenos poderes e todo tipo de bônus.'
        nl: 'De Items: hier vind je je voorwerpen, je kleine krachten en allerlei bonussen.'
      tuto_dash_inv_admin:
        fr: 'Les Items : ici tu trouves tes objets, tes petits pouvoirs et toutes sortes de bonus, ainsi que ce
          qu''il y a dans l''œuf de dino du clan.'
        en: 'Items: here you find your objects, your little powers and all kinds of bonuses, plus what is inside
          the clan''s dino egg.'
        es: 'Los Items: aquí encuentras tus objetos, tus pequeños poderes y todo tipo de bonificaciones, y también
          lo que hay en el huevo de dino del clan.'
        de: 'Die Items: Hier findest du deine Gegenstände, deine kleinen Kräfte und alle möglichen Boni, dazu den
          Inhalt des Dino-Eis vom Clan.'
        it: 'Gli Oggetti: qui trovi i tuoi oggetti, i tuoi piccoli poteri e ogni sorta di bonus, oltre a ciò che
          c''è nell''uovo di dino del clan.'
        pt: 'Os Itens: aqui encontras os teus objetos, os teus pequenos poderes e todo o tipo de bónus, bem como
          o que está no ovo de dino do clã.'
        br: 'Os Itens: aqui você encontra seus objetos, seus pequenos poderes e todo tipo de bônus, além do que
          tem no ovo de dino do clã.'
        nl: 'De Items: hier vind je je voorwerpen, je kleine krachten en allerlei bonussen, en ook wat er in het
          dino-ei van de clan zit.'
      tuto_items_grid:
        fr: Retrouve ici tous tes objets, pouvoirs et bonus, rangés par onglet. Touche une tuile pour voir ce qu'elle
          contient.
        en: Here you'll find all your objects, powers and bonuses, sorted by tab. Tap a tile to see what it holds.
        es: Aquí encuentras todos tus objetos, poderes y bonificaciones, ordenados por pestaña. Toca una casilla
          para ver su contenido.
        de: Hier findest du all deine Gegenstände, Kräfte und Boni, nach Reitern sortiert. Tippe auf eine Kachel,
          um zu sehen, was sie enthält.
        it: Qui trovi tutti i tuoi oggetti, poteri e bonus, ordinati per scheda. Tocca una casella per vedere cosa
          contiene.
        pt: Aqui encontras todos os teus objetos, poderes e bónus, arrumados por separador. Toca num quadrado para
          ver o que contém.
        br: Aqui você encontra todos os seus objetos, poderes e bônus, organizados por aba. Toque em um quadrado
          para ver o que ele contém.
        nl: Hier vind je al je voorwerpen, krachten en bonussen, per tabblad gesorteerd. Tik op een tegel om te
          zien wat erin zit.
      tuto_items_chest:
        fr: L'œuf de dino du clan est toujours en haut de ta grille, quel que soit l'onglet. Touche-le pour le faire
          éclore et partager ses surprises.
        en: The clan's dino egg always sits at the top of your grid, whatever the tab. Tap it to hatch it and share
          out its surprises.
        es: El huevo de dino del clan siempre está arriba en tu cuadrícula, sea cual sea la pestaña. Tócalo para
          abrirlo y repartir sus sorpresas.
        de: Das Dino-Ei des Clans steht immer ganz oben in deinem Raster, egal auf welchem Reiter. Tippe darauf,
          damit es aufspringt, und verteile die Überraschungen.
        it: L'uovo di dino del clan è sempre in cima alla tua griglia, qualunque sia la scheda. Toccalo per farlo
          schiudere e dividere le sorprese.
        pt: O ovo de dino do clã está sempre no topo da tua grelha, seja qual for o separador. Toca-lhe para o abrires
          e repartires as surpresas.
        br: O ovo de dino do clã fica sempre no topo da sua grade, seja qual for a aba. Toque nele para ele abrir
          e dividir as surpresas.
        nl: Het dino-ei van de clan staat altijd bovenaan je raster, op welk tabblad je ook bent. Tik erop om het
          uit te laten komen en de verrassingen te verdelen.
      tuto_items_wallet:
        fr: 'Ta bourse affiche ton argent de poche en pastille : celui que tes chefs de clan t''ont promis. Repère
          son icône parmi tes objets.'
        en: 'Your purse shows your pocket money as a badge: the money your clan chiefs have promised. Look for its
          icon among your objects.'
        es: 'Tu bolsa muestra tu dinero de bolsillo en una insignia: el que te han prometido tus jefes de clan.
          Busca su icono entre tus objetos.'
        de: 'Dein Geldbeutel zeigt dein Taschengeld als Plakette: das, was dir deine Clanchefs versprochen haben.
          Such sein Symbol unter deinen Gegenständen.'
        it: 'Il tuo borsellino mostra la tua paghetta in un bollino: quella che ti hanno promesso i tuoi capi clan.
          Cerca la sua icona tra i tuoi oggetti.'
        pt: 'A tua bolsa mostra a tua semanada num distintivo: a que os teus chefes de clã te prometeram. Procura
          o ícone dela entre os teus objetos.'
        br: 'Sua bolsa mostra sua mesada em um selo: a que seus chefes de clã prometeram a você. Procure o ícone
          dela entre seus objetos.'
        nl: 'Je buidel toont je zakgeld in een badge: het geld dat je clanhoofden je hebben beloofd. Zoek het pictogram
          ervan tussen je voorwerpen.'
      tuto_items_tribute:
        fr: 'Si ton clan l''a décidé, un chef de clan peut te donner cet argent de poche pour de vrai : c''est le
          tribut. Ta bourse baisse alors du montant versé.'
        en: 'If your clan has decided so, a clan chief can hand you that pocket money for real: that is the tribute.
          Your purse then drops by the amount paid.'
        es: 'Si tu clan lo ha decidido, un jefe de clan puede darte ese dinero de bolsillo de verdad: es el tributo.
          Entonces tu bolsa baja el importe pagado.'
        de: 'Wenn dein Clan es so beschlossen hat, kann ein Clanchef dir dieses Taschengeld wirklich geben: Das
          ist der Tribut. Dein Geldbeutel sinkt dann um den ausgezahlten Betrag.'
        it: 'Se il tuo clan l''ha deciso, un capo clan può darti questa paghetta per davvero: è il tributo. Il tuo
          borsellino cala allora dell''importo versato.'
        pt: 'Se o teu clã assim o tiver decidido, um chefe de clã pode dar-te essa semanada a sério: é o tributo.
          A tua bolsa baixa então o valor pago.'
        br: 'Se o seu clã tiver decidido assim, um chefe de clã pode te dar essa mesada de verdade: é o tributo.
          Sua bolsa então diminui no valor pago.'
        nl: 'Als je clan dat heeft besloten, kan een clanhoofd je dat zakgeld echt geven: dat is het tribuut. Je
          buidel daalt dan met het betaalde bedrag.'
      tuto_perso_pv:
        fr: 'Tes points de vie : à zéro, tu t''endors, mais un ami peut te réveiller.'
        en: 'Your hit points: at zero you fall asleep, but a friend can wake you up.'
        es: 'Tus puntos de vida: a cero te quedas dormido, pero un amigo puede despertarte.'
        de: 'Deine Lebenspunkte: Bei null schläfst du ein, aber ein Freund kann dich aufwecken.'
        it: 'I tuoi punti vita: a zero ti addormenti, ma un amico può svegliarti.'
        pt: 'Os teus pontos de vida: a zero adormeces, mas um amigo pode acordar-te.'
        br: 'Seus pontos de vida: no zero você pega no sono, mas um amigo pode te acordar.'
        nl: 'Je levenspunten: bij nul val je in slaap, maar een vriend kan je wakker maken.'
      tuto_clan_butin:
        fr: 'L''œuf du clan pour le cycle en cours : cette jauge se remplit à mesure que le clan progresse. Une
          fois pleine, l''œuf éclot (Crac !), ses surprises sont partagées entre les membres, et un nouveau cycle
          commence.'
        en: 'The clan''s egg for the current cycle: this gauge fills as the clan progresses. Once full, the egg
          hatches (Crack!), its surprises are shared among the members, and a new cycle begins.'
        es: 'El huevo del clan del ciclo actual: esta barra se llena a medida que el clan progresa. Cuando está
          llena, el huevo se abre (¡Crac!), sus sorpresas se reparten entre los miembros y empieza un nuevo ciclo.'
        de: 'Das Ei des Clans im laufenden Zyklus: Diese Leiste füllt sich, während der Clan vorankommt. Ist sie
          voll, springt das Ei auf (Knack!), die Überraschungen werden unter den Mitgliedern aufgeteilt, und ein
          neuer Zyklus beginnt.'
        it: 'L''uovo del clan per il ciclo in corso: questa barra si riempie man mano che il clan progredisce. Una
          volta piena, l''uovo si schiude (Crac!), le sorprese vengono divise tra i membri e inizia un nuovo ciclo.'
        pt: 'O ovo do clã no ciclo em curso: esta barra enche-se à medida que o clã progride. Quando está cheia,
          o ovo abre-se (Crac!), as surpresas são repartidas entre os membros e começa um novo ciclo.'
        br: 'O ovo do clã no ciclo atual: esta barra enche à medida que o clã progride. Quando fica cheia, o ovo
          abre (Crec!), as surpresas são divididas entre os membros e começa um novo ciclo.'
        nl: 'Het ei van de clan voor de huidige cyclus: deze balk vult zich naarmate de clan vooruitgaat. Is hij
          vol, dan komt het ei uit (Krak!), worden de verrassingen onder de leden verdeeld en begint een nieuwe
          cyclus.'
      tuto_clan_roster_avatar:
        fr: Pour chaque personnage, tu vois son niveau et ses points de vie.
        en: For each character, you see their level and hit points.
        es: Para cada personaje, ves su nivel y sus puntos de vida.
        de: Bei jedem Charakter siehst du seine Stufe und seine Lebenspunkte.
        it: Per ogni personaggio vedi il suo livello e i suoi punti vita.
        pt: Para cada personagem, vês o seu nível e os seus pontos de vida.
        br: Para cada personagem, você vê o nível e os pontos de vida dele.
        nl: Bij elk personage zie je zijn niveau en zijn levenspunten.
      tuto_clan_roster_name:
        fr: 'Son nom (une couronne désigne les chefs de clan) et sa barre de contribution : ce qu''il a apporté
          à l''œuf du cycle en cours, et donc sa part des surprises au partage.'
        en: 'Their name (a crown marks the clan chiefs) and their contribution bar: what they have brought to the
          current cycle''s egg, and therefore their share of the surprises when it is split.'
        es: 'Su nombre (una corona indica a los jefes del clan) y su barra de contribución: lo que ha aportado al
          huevo del ciclo actual y, por tanto, su parte de las sorpresas en el reparto.'
        de: 'Sein Name (eine Krone kennzeichnet die Clanchefs) und seine Beitragsleiste: was er zum Ei des laufenden
          Zyklus beigetragen hat, und damit sein Anteil an den Überraschungen bei der Aufteilung.'
        it: 'Il suo nome (una corona indica i capi clan) e la sua barra di contributo: ciò che ha portato all''uovo
          del ciclo in corso, e quindi la sua parte di sorprese nella spartizione.'
        pt: 'O seu nome (uma coroa assinala os chefes de clã) e a sua barra de contribuição: o que trouxe para o
          ovo do ciclo em curso e, portanto, a sua parte das surpresas na partilha.'
        br: 'O nome dele (uma coroa indica os chefes de clã) e sua barra de contribuição: o que ele trouxe para
          o ovo do ciclo atual e, portanto, a parte das surpresas que caberá a ele na divisão.'
        nl: 'Zijn naam (een kroon duidt de clanhoofden aan) en zijn bijdragebalk: wat hij heeft bijgedragen aan
          het ei van de huidige cyclus, en dus zijn deel van de verrassingen bij de verdeling.'
      tuto_clan_roster_purse:
        fr: 'À droite de chaque tuile, la bourse montre l''argent de poche gagné par le joueur. La toucher ouvre
          directement « Payer son tribut » : vous lui remettez cet argent de poche dans la vraie vie, et vous déclarez
          ici le montant versé.'
        en: 'On the right of each tile, the purse shows the pocket money the player has earned. Tapping it goes
          straight to « Pay their tribute »: you hand over that pocket money in real life, and declare here how
          much you paid.'
        es: 'A la derecha de cada casilla, la bolsa muestra el dinero de bolsillo ganado por el jugador. Al tocarla
          se abre directamente « Pagar su tributo »: le entregas ese dinero de bolsillo en la vida real y declaras
          aquí el importe pagado.'
        de: 'Rechts auf jeder Kachel zeigt der Geldbeutel das Taschengeld, das der Spieler verdient hat. Tippst
          du darauf, öffnet sich direkt „Tribut zahlen“: Du gibst ihm dieses Taschengeld im echten Leben und trägst
          hier den ausgezahlten Betrag ein.'
        it: 'A destra di ogni casella, il borsellino mostra la paghetta guadagnata dal giocatore. Toccandolo si
          apre direttamente «Paga il suo tributo»: gli consegni questa paghetta nella vita reale e dichiari qui
          l''importo versato.'
        pt: 'À direita de cada quadrado, a bolsa mostra a semanada ganha pelo jogador. Ao tocares-lhe, abre-se diretamente
          «Pagar o seu tributo»: entregas-lhe essa semanada na vida real e declaras aqui o valor pago.'
        br: 'À direita de cada quadrado, a bolsa mostra a mesada ganha pelo jogador. Ao tocar nela, abre direto
          "Pagar seu tributo": você entrega essa mesada a ele na vida real e declara aqui o valor pago.'
        nl: 'Rechts op elke tegel toont de buidel het zakgeld dat de speler heeft verdiend. Tik erop en ‘Tribuut
          betalen’ gaat meteen open: je geeft hem dat zakgeld in het echte leven en vult hier het betaalde bedrag
          in.'
      tuto_clan_options_intro:
        fr: 'Les actions proposées dépendent du joueur touché : réveillé ou endormi, présent ou absent, enfant ou
          adulte, un autre ou vous-même. Voici toutes celles qui existent.'
        en: 'The actions offered depend on the player you tap: awake or asleep, present or away, child or adult,
          someone else or yourself. Here are all the ones that exist.'
        es: 'Las acciones ofrecidas dependen del jugador que toques: despierto o dormido, presente o ausente, niño
          o adulto, otro o tú mismo. Estas son todas las que existen.'
        de: 'Welche Aktionen angeboten werden, hängt vom angetippten Spieler ab: wach oder eingeschlafen, anwesend
          oder abwesend, Kind oder Erwachsener, jemand anderes oder du selbst. Hier sind alle, die es gibt.'
        it: 'Le azioni proposte dipendono dal giocatore toccato: sveglio o addormentato, presente o assente, bambino
          o adulto, un altro o te stesso. Ecco tutte quelle che esistono.'
        pt: 'As ações propostas dependem do jogador em que tocas: acordado ou a dormir, presente ou ausente, criança
          ou adulto, outra pessoa ou tu próprio. Eis todas as que existem.'
        br: 'As ações oferecidas dependem do jogador em que você toca: acordado ou dormindo, presente ou ausente,
          criança ou adulto, outra pessoa ou você mesmo. Aqui estão todas as que existem.'
        nl: 'Welke acties je krijgt, hangt af van de speler waarop je tikt: wakker of in slaap, aanwezig of afwezig,
          kind of volwassene, iemand anders of jijzelf. Hier zijn ze allemaal.'
      roster_menu_revive_desc:
        fr: Le réveiller s'il s'est endormi à zéro point de vie. Un réveil tous les trois jours par chef de clan.
        en: Wake them up if they fell asleep at zero hit points. One wake-up every three days per clan chief.
        es: Despertarlo si se ha quedado dormido con cero puntos de vida. Un despertar cada tres días por jefe de
          clan.
        de: Ihn aufwecken, wenn er bei null Lebenspunkten eingeschlafen ist. Einmal Aufwecken alle drei Tage pro
          Clanchef.
        it: Svegliarlo se si è addormentato a zero punti vita. Un risveglio ogni tre giorni per capo clan.
        pt: Acordá-lo se tiver adormecido com zero pontos de vida. Um despertar a cada três dias por chefe de clã.
        br: Acordá-lo se ele tiver pegado no sono com zero pontos de vida. Um despertar a cada três dias por chefe
          de clã.
        nl: Hem wakker maken als hij bij nul levenspunten in slaap is gevallen. Eén keer wekken per drie dagen per
          clanhoofd.
      roster_menu_offline_desc:
        fr: 'Pour un joueur qui ne peut pas jouer en ce moment : il sort du partage de l''œuf et ne perd plus de
          points de vie. Il revient tout seul à sa prochaine connexion.'
        en: 'For a player who cannot play right now: they leave the egg sharing and stop losing hit points. They
          come back on their own at their next connection.'
        es: 'Para un jugador que no puede jugar ahora: sale del reparto del huevo y deja de perder puntos de vida.
          Vuelve solo en su próxima conexión.'
        de: 'Für einen Spieler, der gerade nicht spielen kann: Er nimmt nicht mehr an der Ei-Teilung teil und verliert
          keine Lebenspunkte mehr. Bei seiner nächsten Anmeldung ist er von selbst wieder dabei.'
        it: 'Per un giocatore che al momento non può giocare: esce dalla spartizione dell''uovo e non perde più
          punti vita. Rientra da solo al suo prossimo accesso.'
        pt: 'Para um jogador que não pode jogar neste momento: sai da partilha do ovo e deixa de perder pontos de
          vida. Volta sozinho na próxima vez que se ligar.'
        br: 'Para um jogador que não pode jogar agora: ele sai da divisão do ovo e para de perder pontos de vida.
          Volta sozinho na próxima vez que se conectar.'
        nl: 'Voor een speler die nu niet kan spelen: hij doet niet meer mee aan de verdeling van het ei en verliest
          geen levenspunten meer. Bij zijn volgende aanmelding is hij vanzelf terug.'
      roster_menu_hors_concours_on_desc:
        fr: 'Il continue de jouer et de faire gagner le clan, mais ne concourt plus : ni part des surprises de l''œuf,
          ni comparaison avec les enfants.'
        en: 'They keep playing and keep earning for the clan, but no longer compete: no share of the egg surprises,
          and no comparison with the children.'
        es: 'Sigue jugando y haciendo ganar al clan, pero ya no compite: ni parte de las sorpresas del huevo, ni
          comparación con los niños.'
        de: 'Er spielt weiter und lässt den Clan weiter gewinnen, tritt aber nicht mehr an: kein Anteil an den Ei-Überraschungen,
          kein Vergleich mit den Kindern.'
        it: 'Continua a giocare e a far guadagnare il clan, ma non gareggia più: niente parte delle sorprese dell''uovo,
          niente confronto con i bambini.'
        pt: 'Continua a jogar e a fazer o clã ganhar, mas deixa de competir: nem parte das surpresas do ovo, nem
          comparação com as crianças.'
        br: 'Continua jogando e fazendo o clã ganhar, mas deixa de competir: nem parte das surpresas do ovo, nem
          comparação com as crianças.'
        nl: 'Hij speelt verder en laat de clan nog steeds winnen, maar doet niet meer mee: geen deel van de ei-verrassingen,
          geen vergelijking met de kinderen.'
      roster_menu_hors_concours_off_desc:
        fr: 'Il concourt de nouveau : sa part des surprises de l''œuf, son niveau et sa progression redeviennent
          visibles du clan.'
        en: 'They compete again: their share of the egg surprises, their level and their progress become visible
          to the clan once more.'
        es: 'Vuelve a competir: su parte de las sorpresas del huevo, su nivel y su progreso vuelven a ser visibles
          para el clan.'
        de: 'Er tritt wieder an: Sein Anteil an den Ei-Überraschungen, seine Stufe und sein Fortschritt sind für
          den Clan wieder sichtbar.'
        it: 'Torna a gareggiare: la sua parte di sorprese dell''uovo, il suo livello e i suoi progressi tornano
          visibili al clan.'
        pt: 'Volta a competir: a sua parte das surpresas do ovo, o seu nível e o seu progresso voltam a ser visíveis
          para o clã.'
        br: 'Volta a competir: sua parte das surpresas do ovo, seu nível e seu progresso voltam a ficar visíveis
          para o clã.'
        nl: 'Hij doet weer mee: zijn deel van de ei-verrassingen, zijn niveau en zijn voortgang zijn weer zichtbaar
          voor de clan.'
      roster_menu_pay_tribute_desc:
        fr: 'Lui remettre en vrai l''argent de poche de sa bourse, en tout ou en partie : vous déclarez ici le montant
          versé, et sa bourse baisse d''autant. Raccourci : touchez sa bourse sur sa tuile.'
        en: 'Hand over, for real, the pocket money in their purse, in full or in part: you declare the amount paid
          here, and their purse drops by that much. Shortcut: tap their purse on their tile.'
        es: 'Entregarle de verdad el dinero de bolsillo de su bolsa, entero o en parte: declaras aquí el importe
          pagado y su bolsa baja otro tanto. Atajo: toca su bolsa en su casilla.'
        de: 'Ihm das Taschengeld aus seinem Geldbeutel wirklich geben, ganz oder teilweise: Du trägst hier den ausgezahlten
          Betrag ein, und sein Geldbeutel sinkt um genau so viel. Abkürzung: Tippe auf den Geldbeutel auf seiner
          Kachel.'
        it: 'Consegnargli davvero la paghetta del suo borsellino, tutta o in parte: dichiari qui l''importo versato
          e il suo borsellino cala di altrettanto. Scorciatoia: tocca il borsellino sulla sua casella.'
        pt: 'Entregar-lhe a sério a semanada da bolsa dele, total ou parcialmente: declaras aqui o valor pago e
          a bolsa dele baixa na mesma medida. Atalho: toca na bolsa dele, no quadrado dele.'
        br: 'Entregar a ele de verdade a mesada da bolsa dele, total ou parcialmente: você declara aqui o valor
          pago e a bolsa dele diminui na mesma medida. Atalho: toque na bolsa dele, no quadrado dele.'
        nl: 'Hem echt het zakgeld uit zijn buidel geven, helemaal of gedeeltelijk: je vult hier het betaalde bedrag
          in en zijn buidel daalt evenveel. Snelkoppeling: tik op de buidel op zijn tegel.'
      tuto_perso_menu_journal:
        fr: '« Mon Journal » raconte tout ce que tu as fait dans la vallée : tes tâches, les fois où tu as grandi,
          tes surprises. Personne ne peut l''effacer.'
        en: '« My Log » tells everything you have done in the valley: your tasks, the times you grew, your surprises.
          Nobody can erase it.'
        es: '« Mi Diario » cuenta todo lo que has hecho en el valle: tus tareas, las veces que has crecido, tus
          sorpresas. Nadie puede borrarlo.'
        de: '„Mein Tagebuch“ erzählt alles, was du im Tal getan hast: deine Aufgaben, wann du gewachsen bist, deine
          Überraschungen. Niemand kann es löschen.'
        it: '«Il mio diario» racconta tutto quello che hai fatto nella valle: i tuoi compiti, le volte che sei cresciuto,
          le tue sorprese. Nessuno può cancellarlo.'
        pt: '«O Meu Diário» conta tudo o que fizeste no vale: as tuas tarefas, as vezes que cresceste, as tuas surpresas.
          Ninguém o pode apagar.'
        br: '"Meu Diário" conta tudo o que você fez no vale: suas tarefas, as vezes que você cresceu, suas surpresas.
          Ninguém pode apagá-lo.'
        nl: '‘Mijn dagboek’ vertelt alles wat je in de vallei hebt gedaan: je taken, wanneer je gegroeid bent, je
          verrassingen. Niemand kan het wissen.'
      tuto_perso_menu_nudges:
        fr: « Ne plus me faire signe », dans « Options avancées… », coupe les messages que la vallée t'envoie quand
          tu ne viens plus. Tu peux les rétablir quand tu veux, au même endroit.
        en: « Stop nudging me », under « Advanced options… », turns off the messages the valley sends you when you
          stop coming. You can turn them back on whenever you like, in the same place.
        es: « No me avises más », en « Opciones avanzadas… », corta los mensajes que el valle te envía cuando dejas
          de venir. Puedes restablecerlos cuando quieras, en el mismo sitio.
        de: „Nicht mehr erinnern“ unter „Erweiterte Optionen…“ schaltet die Nachrichten ab, die dir das Tal schickt,
          wenn du nicht mehr vorbeikommst. Du kannst sie jederzeit an derselben Stelle wieder einschalten.
        it: «Non avvisarmi più», in «Opzioni avanzate…», disattiva i messaggi che la valle ti manda quando non vieni
          più. Puoi riattivarli quando vuoi, nello stesso punto.
        pt: «Não me avises mais», em «Opções avançadas…», desliga as mensagens que o vale te envia quando deixas
          de vir. Podes voltar a ativá-las quando quiseres, no mesmo sítio.
        br: '"Não me avise mais", em "Opções avançadas…", desliga as mensagens que o vale envia quando você para
          de vir. Você pode reativá-las quando quiser, no mesmo lugar.'
        nl: ‘Geen seintjes meer’, onder ‘Geavanceerde opties…’, zet de berichten uit die de vallei je stuurt als
          je niet meer langskomt. Je kunt ze op dezelfde plek weer aanzetten wanneer je wilt.
      tuto_combat_domains_title:
        fr: Les dinos
        en: Dinos
        es: Los dinos
        de: Die Dinos
        it: I dino
        pt: Os dinos
        br: Os dinos
        nl: De dino's
      tuto_combat_domains_intro:
        fr: Dans cet écran, tu trouveras tous les dinos à chouchouter (les tâches), regroupés par domaine.
        en: On this screen you'll find every dino to look after (the tasks), grouped by domain.
        es: En esta pantalla encontrarás todos los dinos que cuidar (las tareas), agrupados por ámbito.
        de: Auf diesem Bildschirm findest du alle Dinos zum Umsorgen (die Aufgaben), nach Bereichen gruppiert.
        it: In questa schermata troverai tutti i dino da coccolare (i compiti), raggruppati per ambito.
        pt: Neste ecrã encontras todos os dinos para cuidar (as tarefas), agrupados por área.
        br: Nesta tela você encontra todos os dinos pra cuidar (as tarefas), agrupados por área.
        nl: Op dit scherm vind je alle dino's om te verzorgen (de taken), gegroepeerd per domein.
      tuto_combat_domains_play:
        fr: Choisis un groupe de tâches pour y trouver un dino à chouchouter et gagner de l'XP.
        en: Choose a group of tasks to find a dino to look after and earn XP.
        es: Elige un grupo de tareas para encontrar un dino que cuidar y ganar XP.
        de: Wähle eine Aufgabengruppe, um darin einen Dino zum Umsorgen zu finden und XP zu verdienen.
        it: Scegli un gruppo di compiti per trovarci un dino da coccolare e guadagnare XP.
        pt: Escolhe um grupo de tarefas para lá encontrares um dino para cuidar e ganhar XP.
        br: Escolha um grupo de tarefas para encontrar nele um dino pra cuidar e ganhar XP.
        nl: Kies een groep taken om er een dino te vinden om te verzorgen en XP te verdienen.
      tuto_combat_domains_play_admin:
        fr: En mode jeu, choisis un groupe de tâches pour y trouver un dino à chouchouter et gagner de l'XP.
        en: In play mode, choose a group of tasks to find a dino to look after and earn XP.
        es: En modo juego, elige un grupo de tareas para encontrar un dino que cuidar y ganar XP.
        de: Wähle im Spielmodus eine Aufgabengruppe, um darin einen Dino zum Umsorgen zu finden und XP zu verdienen.
        it: In modalità gioco, scegli un gruppo di compiti per trovarci un dino da coccolare e guadagnare XP.
        pt: No modo jogo, escolhe um grupo de tarefas para lá encontrares um dino para cuidar e ganhar XP.
        br: No modo jogo, escolha um grupo de tarefas para encontrar nele um dino pra cuidar e ganhar XP.
        nl: Kies in speelmodus een groep taken om er een dino te vinden om te verzorgen en XP te verdienen.
      tuto_combat_domains_grey:
        fr: Un domaine grisé n'a aucun dino à chouchouter pour le moment.
        en: A greyed-out domain has no dino to look after right now.
        es: Un ámbito en gris no tiene ningún dino que cuidar por ahora.
        de: Ein ausgegrauter Bereich hat im Moment keinen Dino zum Umsorgen.
        it: Un ambito in grigio non ha nessun dino da coccolare per il momento.
        pt: Uma área a cinzento não tem nenhum dino para cuidar de momento.
        br: Uma área em cinza não tem nenhum dino pra cuidar no momento.
        nl: Een grijs domein heeft op dit moment geen dino om te verzorgen.
      tuto_combat_switch:
        fr: 'Réservé aux chefs de clan : bascule entre Jeu et Admin. En mode Admin, toucher une tuile ne lance plus
          la tâche, mais ouvre ses réglages : la rendre active, la désactiver, la cacher aux joueurs.'
        en: 'Clan chiefs only: switches between Play and Admin. In Admin mode, tapping a tile no longer starts the
          task but opens its settings: make it active, disable it, hide it from players.'
        es: 'Solo para jefes de clan: alterna entre Juego y Admin. En modo Admin, tocar una casilla ya no inicia
          la tarea, sino que abre sus ajustes: activarla, desactivarla, ocultarla a los jugadores.'
        de: 'Nur für Clanchefs: wechselt zwischen Spiel und Admin. Im Admin-Modus startet ein Tippen auf eine Kachel
          keine Aufgabe mehr, sondern öffnet ihre Einstellungen: aktivieren, deaktivieren, vor den Spielern verbergen.'
        it: 'Riservato ai capi clan: alterna tra Gioco e Admin. In modalità Admin, toccare una casella non avvia
          più il compito, ma apre le sue impostazioni: renderla attiva, disattivarla, nasconderla ai giocatori.'
        pt: 'Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar num quadrado já não inicia
          a tarefa, abre as suas definições: ativá-lo, desativá-lo, escondê-lo dos jogadores.'
        br: 'Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar em um quadrado não inicia
          mais a tarefa, abre as configurações dele: ativar, desativar, esconder dos jogadores.'
        nl: 'Alleen voor clanhoofden: schakelt tussen Spel en Admin. In Admin-modus start een tik op een tegel geen
          taak meer, maar opent die de instellingen: activeren, uitschakelen, verbergen voor spelers.'
      tuto_combat_tasks_intro:
        fr: Dans cet écran, tu trouveras tous les dinos à chouchouter d'un même groupe.
        en: On this screen you'll find every dino to look after within one group.
        es: En esta pantalla encontrarás todos los dinos que cuidar de un mismo grupo.
        de: Auf diesem Bildschirm findest du alle Dinos zum Umsorgen aus derselben Gruppe.
        it: In questa schermata troverai tutti i dino da coccolare di uno stesso gruppo.
        pt: Neste ecrã encontras todos os dinos para cuidar de um mesmo grupo.
        br: Nesta tela você encontra todos os dinos pra cuidar de um mesmo grupo.
        nl: Op dit scherm vind je alle dino's om te verzorgen uit één groep.
      tuto_combat_tasks_play:
        fr: Choisis un dino à chouchouter et gagne de l'XP.
        en: Choose a dino to look after and earn XP.
        es: Elige un dino que cuidar y gana XP.
        de: Wähle einen Dino zum Umsorgen und verdiene XP.
        it: Scegli un dino da coccolare e guadagna XP.
        pt: Escolhe um dino para cuidar e ganha XP.
        br: Escolha um dino pra cuidar e ganhe XP.
        nl: Kies een dino om te verzorgen en verdien XP.
      tuto_combat_tasks_play_admin:
        fr: En mode jeu, choisis un dino à chouchouter et gagne de l'XP.
        en: In play mode, choose a dino to look after and earn XP.
        es: En modo juego, elige un dino que cuidar y gana XP.
        de: Wähle im Spielmodus einen Dino zum Umsorgen und verdiene XP.
        it: In modalità gioco, scegli un dino da coccolare e guadagna XP.
        pt: No modo jogo, escolhe um dino para cuidar e ganha XP.
        br: No modo jogo, escolha um dino pra cuidar e ganhe XP.
        nl: Kies in speelmodus een dino om te verzorgen en verdien XP.
      tuto_badge_skull:
        fr: 'Zzz : au repos'
        en: 'Zzz: resting'
        es: 'Zzz: en reposo'
        de: 'Zzz: ruht'
        it: 'Zzz: a riposo'
        pt: 'Zzz: em repouso'
        br: 'Zzz: em repouso'
        nl: 'Zzz: rust'
      tuto_combat_active_demo:
        fr: 'J''ai choisi une tâche pour toi, histoire de te montrer. La voici : c''est le dino dont tu t''occupes
          en ce moment.'
        en: 'I picked a task for you, just to show you how it works. Here it is: the dino you''re looking after
          right now.'
        es: 'He elegido una tarea por ti, solo para enseñarte cómo funciona. Aquí la tienes: el dino que cuidas
          ahora.'
        de: 'Ich habe eine Aufgabe für dich ausgesucht, nur um es dir zu zeigen. Hier ist sie: Das ist der Dino,
          um den du dich gerade kümmerst.'
        it: 'Ho scelto un compito per te, giusto per mostrarti come funziona. Eccolo: è il dino di cui ti prendi
          cura adesso.'
        pt: 'Escolhi uma tarefa por ti, só para te mostrar como funciona. Aqui está: é o dino de que estás a cuidar
          agora.'
        br: 'Escolhi uma tarefa para você, só para mostrar como funciona. Aqui está: é o dino de que você está cuidando
          agora.'
        nl: 'Ik heb een taak voor je gekozen, gewoon om het je te laten zien. Hier is hij: de dino voor wie je nu
          zorgt.'
      tuto_combat_active_intro:
        fr: 'Tu as pris une tâche : la voici, c''est le dino dont tu t''occupes en ce moment.'
        en: 'You''ve taken on a task: here it is, the dino you''re looking after right now.'
        es: 'Has asumido una tarea: aquí está, el dino que cuidas ahora.'
        de: 'Du hast eine Aufgabe übernommen: Hier ist sie, das ist der Dino, um den du dich gerade kümmerst.'
        it: 'Hai preso un compito: eccolo, è il dino di cui ti prendi cura adesso.'
        pt: 'Pegaste numa tarefa: aqui está, é o dino de que estás a cuidar agora.'
        br: 'Você pegou uma tarefa: aqui está, é o dino de que você está cuidando agora.'
        nl: 'Je hebt een taak aangenomen: hier is hij, de dino voor wie je nu zorgt.'
      tuto_combat_active_criteria:
        fr: Voici ce qu'il faut faire pour rendre le dino tout content.
        en: Here's what to do to make the dino happy.
        es: Esto es lo que hay que hacer para que el dino esté feliz.
        de: Das musst du tun, um den Dino glücklich zu machen.
        it: Ecco cosa fare per rendere felice il dino.
        pt: Isto é o que tens de fazer para deixar o dino contente.
        br: Isto é o que você precisa fazer para deixar o dino feliz.
        nl: Dit moet je doen om de dino blij te maken.
      tuto_combat_active_done:
        fr: Une fois la tâche faite pour de vrai, touche « J'ai fini ! ». Tu prendras une photo, ou une courte vidéo
          sans son, comme preuve.
        en: Once you've truly completed the task, tap “I'm done!”. You'll take a photo, or a short silent video,
          as proof.
        es: Una vez completada la tarea de verdad, toca «¡He terminado!». Harás una foto, o un vídeo corto sin sonido,
          como prueba.
        de: Sobald die Aufgabe wirklich erledigt ist, tippe auf „Ich bin fertig!“. Als Beweis machst du ein Foto
          oder ein kurzes Video ohne Ton.
        it: Una volta portato a termine il compito per davvero, tocca «Ho finito!». Come prova scatterai una foto,
          o girerai un breve video senza audio.
        pt: Depois de cumprires a tarefa a sério, toca em «Acabei!». Vais tirar uma fotografia, ou gravar um vídeo
          curto sem som, como prova.
        br: Depois de cumprir a tarefa de verdade, toque em "Terminei!". Você vai tirar uma foto, ou gravar um vídeo
          curto sem som, como prova.
        nl: Heb je de taak echt voltooid, tik dan op ‘Ik ben klaar!’. Je maakt een foto, of een korte video zonder
          geluid, als bewijs.
      tuto_combat_active_wait:
        fr: Tant que ta tâche n'est pas validée, tu ne peux pas t'occuper d'un autre dino. Une fois validée, tu
          gagnes ton XP et un nouveau dino t'attend !
        en: Until your task is validated, you can't look after another dino. Once validated, you earn your XP and
          a new dino is waiting for you!
        es: Mientras tu tarea no esté validada, no puedes cuidar de otro dino. Una vez validada, ganas tu XP y ¡otro
          dino te espera!
        de: Solange deine Aufgabe nicht bestätigt ist, kannst du dich um keinen anderen Dino kümmern. Sobald sie
          bestätigt ist, bekommst du deine XP und ein neuer Dino wartet auf dich!
        it: Finché il tuo compito non è convalidato, non puoi prenderti cura di un altro dino. Una volta convalidato,
          guadagni i tuoi XP e un nuovo dino ti aspetta!
        pt: Enquanto a tua tarefa não for validada, não podes cuidar de outro dino. Depois de validada, ganhas o
          teu XP e um novo dino espera por ti!
        br: Enquanto sua tarefa não for validada, você não pode cuidar de outro dino. Depois de validada, você ganha
          seu XP e um novo dino espera por você!
        nl: Zolang je taak niet gevalideerd is, kun je niet voor een andere dino zorgen. Zodra hij gevalideerd is,
          krijg je je XP en wacht er een nieuwe dino op je!
      tuto_combat_active_retreat:
        fr: 'Si tu ne peux pas la terminer, touche « Je reviens plus tard » : la tâche redevient libre pour le clan.'
        en: 'If you can''t finish it, tap “I''ll come back later”: the task becomes free for the clan again.'
        es: 'Si no puedes terminarla, toca «Vuelvo luego»: la tarea vuelve a quedar libre para el clan.'
        de: 'Wenn du sie nicht beenden kannst, tippe auf „Ich komme später wieder“: Die Aufgabe ist dann wieder
          frei für den Clan.'
        it: 'Se non riesci a finirlo, tocca «Torno dopo»: il compito torna libero per il clan.'
        pt: 'Se não conseguires terminá-la, toca em «Volto mais tarde»: a tarefa volta a ficar livre para o clã.'
        br: 'Se não conseguir terminá-la, toque em "Volto depois": a tarefa volta a ficar livre para o clã.'
        nl: 'Kun je hem niet afmaken, tik dan op ‘Ik kom later terug’: de taak is weer vrij voor de clan.'
      adm_menu_revive_desc:
        fr: Réveiller une tâche endormie.
        en: Wake up a sleeping task.
        es: Despertar una tarea dormida.
        de: Eine eingeschlafene Aufgabe aufwecken.
        it: Svegliare un compito addormentato.
        pt: Acordar uma tarefa adormecida.
        br: Acordar uma tarefa adormecida.
        nl: Een ingeslapen taak wakker maken.
      reminder_recruit_dashboard:
        fr: Bravo, tu viens de créer ton clan ! Il te faut maintenant une équipe de gardiens de dinos. Va dans l'onglet
          « Clan » et invite tes héros.
        en: Well done, you have just founded your clan! Now you need a team of dino keepers. Go to the « Clan »
          tab and invite your heroes.
        es: ¡Enhorabuena, acabas de fundar tu clan! Ahora necesitas un equipo de cuidadores de dinos. Ve a la pestaña
          « Clan » e invita a tus héroes.
        de: Bravo, du hast gerade deinen Clan gegründet! Jetzt brauchst du ein Team von Dino-Hütern. Geh zum Reiter
          „Clan“ und lade deine Helden ein.
        it: Bravo, hai appena fondato il tuo clan! Ora ti serve una squadra di guardiani dei dino. Vai nella scheda
          «Clan» e invita i tuoi eroi.
        pt: Parabéns, acabaste de fundar o teu clã! Agora precisas de uma equipa de guardiões dos dinos. Vai ao
          separador «Clã» e convida os teus heróis.
        br: Parabéns, você acabou de fundar seu clã! Agora você precisa de uma equipe de cuidadores de dinos. Vá
          até a aba "Clã" e convide seus heróis.
        nl: Goed gedaan, je hebt net je clan opgericht! Nu heb je een team dinoverzorgers nodig. Ga naar het tabblad
          ‘Clan’ en nodig je helden uit.
      reminder_safety_child:
        fr: Les dinos sont imaginaires, mais les tâches sont réelles. Préviens toujours tes parents avant de commencer
          une tâche, et demande de l'aide tout de suite si quelque chose ne va pas. Aucun point d'expérience ne
          vaut un bobo.
        en: The dinos are make-believe, but the chores are real. Always tell your parents before you start a chore,
          and ask for help straight away if anything goes wrong. No amount of XP is worth getting hurt.
        es: Los dinos son imaginarios, ¡pero las tareas son reales! Avisa siempre a tus padres antes de empezar
          una tarea y pide ayuda enseguida si algo va mal. Ningún punto de experiencia vale hacerte daño.
        de: Die Dinos sind ausgedacht, aber die Aufgaben sind echt! Sag immer deinen Eltern Bescheid, bevor du mit
          einer Aufgabe anfängst, und bitte sofort um Hilfe, wenn etwas nicht stimmt. Kein Erfahrungspunkt ist ein
          Aua wert.
        it: I dino sono immaginari, ma i compiti sono veri! Avvisa sempre i tuoi genitori prima di iniziare un compito
          e chiedi subito aiuto se qualcosa non va. Nessun punto esperienza vale farsi male.
        pt: Os dinos são imaginários, mas as tarefas são reais! Avisa sempre os teus pais antes de começares uma
          tarefa e pede logo ajuda se alguma coisa correr mal. Nenhum ponto de experiência vale um dói-dói.
        br: Os dinos são imaginários, mas as tarefas são reais! Sempre avise seus pais antes de começar uma tarefa
          e peça ajuda na hora se alguma coisa der errado. Nenhum ponto de experiência vale um machucado.
        nl: De dino's zijn verzonnen, maar de klusjes zijn echt! Zeg het altijd tegen je ouders voordat je aan een
          taak begint, en vraag meteen hulp als er iets misgaat. Geen enkel ervaringspunt is een au waard.
      store_dunning_firm:
        fr: 'La cotisation n''est pas passée. La Vallée Verte vous attend : touchez ici.'
        en: 'The dues didn''t go through. Green Valley awaits: tap here.'
        es: 'La cuota no ha pasado. El Valle Verde te espera: toca aquí.'
        de: 'Der Beitrag ging nicht durch. Das Grüne Tal wartet auf dich: Tippe hier.'
        it: 'La quota non è passata. La Valle Verde ti aspetta: tocca qui.'
        pt: 'A quota não foi paga. O Vale Verde espera-te: toca aqui.'
        br: 'A assinatura não foi paga. O Vale Verde espera por você: toque aqui.'
        nl: 'De bijdrage is niet gelukt. De Groene Vallei wacht op je: tik hier.'
      store_dunning_last:
        fr: La grotte va se refermer. Touchez ici pour continuer.
        en: The cave is about to close. Tap here to carry on.
        es: La cueva va a cerrarse. Toca aquí para continuar.
        de: Die Höhle schließt sich gleich. Tippe hier, um weiterzumachen.
        it: La grotta sta per chiudersi. Tocca qui per continuare.
        pt: A gruta vai fechar-se. Toca aqui para continuar.
        br: A caverna vai se fechar. Toque aqui para continuar.
        nl: De grot gaat bijna dicht. Tik hier om door te gaan.

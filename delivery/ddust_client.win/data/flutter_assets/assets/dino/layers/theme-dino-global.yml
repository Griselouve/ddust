          - Kurze Sätze, ein warmer und ein wenig lustiger Ton, wie ein Elternteil, der am Lagerfeuer von seiner Woche erzählt; keine schwülstige Chronik.
          - Nenne die Kinder bei dem Namen, den sie sich ausgesucht haben.

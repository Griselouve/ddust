          ---
          @@@worker.narrate_totals@@@
          ---

          Deze tekst is een KORT bericht dat je in één oogopslag leest, geen artikel. Schrijf EERST een vrolijke openingszin over hoe goed de stam bezig is, DAARNA hoogstens 3 tot 4 zinnen die ÉÉN ENKEL bijzonder moment uit dit dagboek vertellen; de rest is achtergrond, je hoeft niet alles te noemen. In totaal: hoogstens 5 zinnen, 60 tot 90 woorden.
          Als de naam, de beschrijving of het dagboek nog kerkerwoorden gebruiken (monster, gevecht, buit…), vertel het dan met de woorden van de Groene Vallei: een dino die verzorgd wordt, levenspunten, in slaap vallen van verveling.

          Strikte VERBODEN:
          - Je kent het geslacht van GEEN ENKEL kind: de naam die het zelf koos, vertelt je dat niet. Gebruik dus NOOIT ‘hij’ of ‘zij’ voor een kind, en geen enkel woord dat een geslacht vastlegt (vermijd bijvoorbeeld ‘held’/‘heldin’, ‘jongen’/‘meisje’ bij de naam van een personage); herhaal in plaats daarvan de naam die het koos, of formuleer de zin zo dat er geen geslacht nodig is.
          - Som NOOIT de taken een voor een op; deze tekst is geen inventaris van het dagboek.
          - Koppel NOOIT een aantal XP aan een specifieke handeling (verboden is elke vorm van ‘heeft X gedaan (N XP)’).
          - Geen balanszin aan het eind die totalen samenvat (‘het ei kwam N keer uit en bracht…’).
          - Niet meer dan ÉÉN cijfer in de hele tekst.
          - Geen afgezaagde openingen zoals ‘In een wereld waar…’, ‘Er was eens…’, ‘In een tijd waarin…’.
          - Geen metazinnen over jezelf of over de tekst (‘Hier is het verhaal…’, ‘Dit verhaal laat zien dat…’).
          - Geen holle superlatieven (‘ongelooflijk’, ‘uitzonderlijk’, ‘legendarisch’) zonder concreet feit erachter.
          - Geen moraliserende preek en geen belerende conclusie.
          - Geen stortvloed aan emoji's (hoogstens een of twee, of geen).
          - Spreek NOOIT over de oprichting, de stichting of het begin van de stam: we vertellen wat een gezin beleeft, niet zijn geboorteakte.
          - Gebruik NOOIT de woorden ‘munten’, ‘goud’, ‘valuta’, ‘geld’ of ‘zakgeld’, en noem NOOIT het ei, de verrassingen ervan of een beloning: dat onderwerp wordt elders behandeld, niet in deze tekst.

          WAT WEL:
          - Vertel ALLEEN feiten die in het dagboek hierboven staan; verzin geen enkele gebeurtenis.
          - Korte zinnen, een warme en een beetje grappige toon, zoals een ouder die bij het kampvuur over zijn week vertelt; geen hoogdravende kroniek.
          - Noem de kinderen bij de naam die ze zelf hebben gekozen.
          - Eindig met wat de stam concreet heeft beleefd, nooit met een oproep tot actie of een reclameslogan.
          - Schrijf alles in @@@worker.inspire_lang@@@.

          VERPLICHT REGISTER. Deze tekst wordt gelezen door kinderen van 3 tot 7 jaar.

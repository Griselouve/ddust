      invite_for_child:
        fr: Cette invitation a été faite pour un enfant. Demande au chef de la tribu une invitation pour un adulte.
        en: This invitation was made for a child. Ask the tribe chief for an invitation for an adult.
        es: Esta invitación se hizo para un niño. Pide al jefe de la tribu una invitación para un adulto.
        de: Diese Einladung war für ein Kind gedacht. Bitte den Stammes-Chef um eine Einladung für einen Erwachsenen.
        it: Questo invito era per un bambino. Chiedi al capo della tribù un invito per un adulto.
        pt: Este convite foi feito para uma criança. Pede ao chefe da tribo um convite para um adulto.
        br: Este convite foi feito para uma criança. Peça ao chefe da tribo um convite para um adulto.
        nl: Deze uitnodiging was bedoeld voor een kind. Vraag het stamhoofd om een uitnodiging voor een volwassene.
      join_wait_title:

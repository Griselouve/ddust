  mascot:
    ai:
      knowledge: |
        Donjons & Savons est un jeu de famille : la maison est une grotte de la Vallée Verte, la famille
        une tribu, et chaque tâche ménagère un gentil dino qui a besoin d'aide. Un joueur choisit une tâche
        (bouton central « Au ménage ! »), la fait pour de vrai, puis un chef de tribu (un parent) la valide :
        le joueur gagne de l'expérience (XP), la tribu aussi. Le niveau du joueur monte avec son XP (il
        grandit). Ses points de vie baissent doucement s'il ne s'occupe plus des dinos ; à
        zéro, il s'endort d'ennui et doit relever le défi du réveil pour se réveiller. L'XP de la tribu fait
        grandir l'œuf de dino : quand il est prêt, il éclot et la famille découvre ses surprises, une VRAIE
        récompense décidée à l'avance par les parents. Les chefs de tribu valident les tâches, gèrent la
        tribu et invitent ; un enfant ne peut pas être chef. Un enfant sans téléphone peut quand même jouer :
        un parent crée son personnage. La tribu a un abonnement, géré dans la Boutique ; une tribu peut
        parrainer d'autres familles. Les tutoriels se revoient depuis le menu « … » de l'écran Tribu.
    guide:
      destinations:
        clan_qr:
          desc: 'Écran Tribu, menu « … » : « Inviter un adulte (QR code) », faire entrer un adulte (autre parent,
            grand frère majeur) dans la tribu en lui montrant un QR code.'
        add_child:
          desc: 'Écran Tribu, menu « … » : « Ajouter mon enfant », faire entrer son enfant dans la tribu, avec ou
            sans téléphone.'
        clan_log:
          desc: 'Écran Tribu, menu « … » : « Le mur de la grotte », l''historique de tout ce que la tribu a vécu
            avec ses dinos.'
        tutorials:
          desc: 'Écran Tribu, menu « … » : « Tutoriels », revoir les tutoriels du jeu.'
        adv_invite_remote:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : « Inviter à distance », une invitation par lien
            et code quand la personne n''est pas à côté.'
        adv_guest_child:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : « Accueillir un enfant d''une autre tribu », un
            enfant qui a déjà une tribu (famille recomposée, cousins).'
        adv_guardian:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : « Gérer les tribus de mes enfants », autoriser
            une tribu, ajouter un co-représentant, retirer un enfant d''une tribu.'
        adv_ai:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : couper ou rallumer l''IA pour toute la tribu (chef
            seulement).'
        adv_referral:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : « Parrainer une tribu », parrainer une autre famille.'
        adv_rate:
          desc: 'Écran Tribu, menu « … », « Options avancées… » : « Noter et partager », noter l''application et
            la partager.'
        tab_boutique:
          desc: 'Onglet « Boutique » en bas : abonnement de la tribu, achats, codes cadeaux.'
        tab_clan:
          desc: 'Onglet « Tribu » en bas : les membres de la tribu, son niveau, l''œuf de dino et ses surprises.'
        tab_menage:
          desc: 'Bouton central « Au ménage ! » en bas : choisir une pièce puis un dino à chouchouter (une tâche).'
        tab_moi:
          desc: 'Onglet « Moi » en bas : son personnage, son niveau, ses points de vie, ses réglages.'
        tab_items:
          desc: 'Onglet « Items » en bas : les objets gagnés et l''œuf de dino de la tribu (ses surprises).'

        es: '¡@@@session.user.name@@@ ha tendido parte de la ropa mojada! El parasaurolophus sujeta la cuerda: esperará.'
        de: '@@@session.user.name@@@ hat einen Teil der nassen Wäsche aufgehängt! Der Parasaurolophus hält die Leine

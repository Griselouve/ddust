      dt_a_animaux_01:
        fr: Ton animal a faim et le bébé diplodocus fixe sa gamelle vide ! Donne-lui sa juste ration.
        en: Your pet is hungry and the baby diplodocus is staring at the empty bowl! Give it the right portion.
        es: ¡Tu mascota tiene hambre y el bebé diplodocus mira su cuenco vacío! Dale la ración justa.
        de: Dein Haustier hat Hunger und das Diplodocus-Baby starrt auf den leeren Napf! Gib ihm die richtige Portion.
        it: Il tuo animale ha fame e il cucciolo di diplodoco fissa la ciotola vuota! Dagli la giusta razione.
        pt: O teu animal tem fome e o bebé diplódoco olha para a tigela vazia! Dá-lhe a dose certa.
        br: Seu bichinho está com fome e o bebê diplodoco encara a tigela vazia! Dê a ele a porção certa.
        nl: Je huisdier heeft honger en de babydiplodocus staart naar het lege bakje! Geef het de juiste portie.
      dt_c_animaux_01:
        fr: '@@@session.user.name@@@ a bien commencé le repas de l''animal ! Le bébé diplodocus boude un peu, mais
          il attendra.'
        en: '@@@session.user.name@@@ made a great start on the pet''s meal! The baby diplodocus is sulking a bit,
          but it will wait.'
        es: ¡@@@session.user.name@@@ ha empezado bien la comida de la mascota! El bebé diplodocus está algo enfurruñado,
          pero esperará.
        de: '@@@session.user.name@@@ hat mit dem Futter fürs Haustier gut angefangen! Das Diplodocus-Baby schmollt
          ein bisschen, aber es wartet.'
        it: '@@@session.user.name@@@ ha iniziato bene la pappa dell''animale! Il cucciolo di diplodoco fa un po''
          il broncio, ma aspetterà.'
        pt: '@@@session.user.name@@@ começou bem a refeição do animal! O bebé diplódoco amua um bocadinho, mas vai
          esperar.'
        br: '@@@session.user.name@@@ começou bem a refeição do bichinho! O bebê diplodoco ficou meio emburrado,
          mas vai esperar.'
        nl: '@@@session.user.name@@@ is goed begonnen met het eten van het huisdier! De babydiplodocus mokt een
          beetje, maar hij wacht wel.'
      dt_a_animaux_02:
        fr: 'Le petit tricératops a bu dans l''eau de ton animal : elle est toute trouble ! Change-la pour une eau
          claire et fraîche.'
        en: The little triceratops drank from your pet's water and now it's all cloudy! Change it for clean, fresh
          water.
        es: ¡El pequeño triceratops ha bebido del agua de tu mascota y está turbia! Cámbiala por agua limpia y fresca.
        de: Der kleine Triceratops hat aus dem Wasser deines Haustiers getrunken, jetzt ist es trüb! Gib frisches,
          klares Wasser hinein.
        it: Il piccolo triceratopo ha bevuto l'acqua del tuo animale ed è tutta torbida! Cambiala con acqua limpida
          e fresca.
        pt: O pequeno tricerátopo bebeu da água do teu animal e ficou turva! Troca-a por água limpa e fresquinha.
        br: O pequeno tricerátopo bebeu da água do seu bichinho e ela ficou turva! Troque por água limpa e fresquinha.
        nl: De kleine triceratops heeft uit het water van je huisdier gedronken en nu is het troebel! Geef vers,
          helder water.
      dt_c_animaux_02:
        fr: '@@@session.user.name@@@ a bien commencé à changer l''eau ! Le petit tricératops fait la moue, il attendra
          la suite.'
        en: '@@@session.user.name@@@ got a good start on changing the water! The little triceratops is pouting,
          it will wait for the rest.'
        es: ¡@@@session.user.name@@@ ha empezado bien a cambiar el agua! El pequeño triceratops pone morritos, esperará
          el resto.
        de: '@@@session.user.name@@@ hat gut angefangen, das Wasser zu wechseln! Der kleine Triceratops zieht eine
          Schnute und wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha iniziato bene a cambiare l''acqua! Il piccolo triceratopo fa il musetto,
          aspetterà il resto.'
        pt: '@@@session.user.name@@@ começou bem a trocar a água! O pequeno tricerátopo faz beicinho, vai esperar
          pelo resto.'
        br: '@@@session.user.name@@@ começou bem a trocar a água! O pequeno tricerátopo fez biquinho, vai esperar
          o resto.'
        nl: '@@@session.user.name@@@ is goed begonnen met het water verversen! De kleine triceratops trekt een pruillip
          en wacht op de rest.'
      dt_a_animaux_03:
        fr: 'Le bébé stégosaure se bouche le nez : la litière, la cage ou l''aquarium de ton animal sent fort !
          Nettoie jusqu''à ce que tout soit frais.'
        en: 'The baby stegosaurus is holding its nose: your pet''s litter box, cage or aquarium smells! Clean it
          until everything is fresh.'
        es: '¡El bebé estegosaurio se tapa la nariz: el arenero, la jaula o el acuario de tu mascota huele fuerte!
          Limpia hasta que todo esté fresco.'
        de: 'Das Stegosaurus-Baby hält sich die Nase zu: Katzenklo, Käfig oder Aquarium deines Haustiers riecht!
          Putz, bis alles frisch ist.'
        it: 'Il cucciolo di stegosauro si tappa il naso: la lettiera, la gabbia o l''acquario del tuo animale puzza!
          Pulisci finché è tutto fresco.'
        pt: 'O bebé estegossauro tapa o nariz: a caixa de areia, a gaiola ou o aquário do teu animal cheira mal!
          Limpa até ficar tudo fresquinho.'
        br: 'O bebê estegossauro tapou o nariz: a caixa de areia, a gaiola ou o aquário do seu bichinho está com
          cheiro forte! Limpe até ficar tudo fresquinho.'
        nl: 'De babystegosaurus knijpt zijn neus dicht: de kattenbak, kooi of het aquarium van je huisdier stinkt!
          Maak schoon tot alles fris is.'
      dt_c_animaux_03:
        fr: '@@@session.user.name@@@ a bien frotté le coin de l''animal ! Le bébé stégosaure se bouche encore un
          peu le nez, il attendra la fin.'
        en: '@@@session.user.name@@@ scrubbed the pet''s corner really well! The baby stegosaurus is still holding
          its nose a little, it will wait.'
        es: ¡@@@session.user.name@@@ ha frotado bien el rincón de la mascota! El bebé estegosaurio aún se tapa un
          poco la nariz, esperará al final.
        de: '@@@session.user.name@@@ hat die Ecke des Haustiers schon gut geputzt! Das Stegosaurus-Baby hält sich
          noch etwas die Nase zu und wartet.'
        it: '@@@session.user.name@@@ ha strofinato bene l''angolo dell''animale! Il cucciolo di stegosauro si tappa
          ancora un po'' il naso, aspetterà.'
        pt: '@@@session.user.name@@@ esfregou bem o cantinho do animal! O bebé estegossauro ainda tapa um pouco
          o nariz, vai esperar pelo fim.'
        br: '@@@session.user.name@@@ esfregou bem o cantinho do bichinho! O bebê estegossauro ainda tapa um pouco
          o nariz, vai esperar o final.'
        nl: '@@@session.user.name@@@ heeft het hoekje van het huisdier al goed geboend! De babystegosaurus knijpt
          zijn neus nog wat dicht en wacht.'
      dt_a_animaux_05:
        fr: Le petit ankylosaure voudrait que ton animal soit aussi doux que lui ! Brosse ou nettoie son poil jusqu'à
          ce qu'il soit sans nœuds.
        en: The little ankylosaurus wants your pet to be as smooth as it is! Brush or clean its fur until there
          are no knots.
        es: ¡El pequeño anquilosaurio quiere que tu mascota esté tan suave como él! Cepilla o limpia su pelo hasta
          que no tenga nudos.
        de: Der kleine Ankylosaurus möchte, dass dein Haustier so glatt ist wie er! Bürste oder putz das Fell, bis
          keine Knoten mehr da sind.
        it: Il piccolo anchilosauro vuole il tuo animale morbido come lui! Spazzola o pulisci il pelo finché non
          ci sono più nodi.
        pt: O pequeno anquilossauro quer o teu animal tão macio como ele! Escova ou limpa o pelo até não haver nós.
        br: O pequeno anquilossauro quer seu bichinho tão macio quanto ele! Escove ou limpe o pelo até não sobrar
          nenhum nó.
        nl: De kleine ankylosaurus wil dat je huisdier net zo glad is als hij! Borstel of poets de vacht tot alle
          knoopjes weg zijn.
      dt_c_animaux_05:
        fr: '@@@session.user.name@@@ a déjà démêlé plein de nœuds ! Le petit ankylosaure tend sa brosse en boudant
          : on finira tout à l''heure.'
        en: '@@@session.user.name@@@ already undid lots of knots! The little ankylosaurus holds out the brush with
          a pout: we''ll finish later.'
        es: '¡@@@session.user.name@@@ ya ha deshecho muchos nudos! El pequeño anquilosaurio ofrece el cepillo con
          morritos: luego terminamos.'
        de: '@@@session.user.name@@@ hat schon viele Knoten gelöst! Der kleine Ankylosaurus hält schmollend die
          Bürste hin: Wir machen später weiter.'
        it: '@@@session.user.name@@@ ha già sciolto tanti nodi! Il piccolo anchilosauro porge la spazzola col broncio:
          finiremo più tardi.'
        pt: '@@@session.user.name@@@ já desfez muitos nós! O pequeno anquilossauro estende a escova a amuar: acabamos
          daqui a pouco.'
        br: '@@@session.user.name@@@ já desfez um monte de nós! O pequeno anquilossauro estende a escova, emburrado:
          a gente termina daqui a pouco.'
        nl: '@@@session.user.name@@@ heeft al veel knoopjes losgemaakt! De kleine ankylosaurus houdt mokkend de
          borstel vast: straks maken we het af.'
      dt_a_balcon_01:
        fr: Le bébé ptérodactyle a semé des feuilles sèches partout sur le balcon ! Balaie jusqu'à ce que le sol
          soit dégagé.
        en: The baby pterodactyl scattered dry leaves all over the balcony! Sweep until the floor is clear.
        es: ¡El bebé pterodáctilo ha dejado hojas secas por todo el balcón! Barre hasta que el suelo quede despejado.
        de: Das Flugsaurier-Baby hat überall auf dem Balkon trockene Blätter verteilt! Feg, bis der Boden frei ist.
        it: Il cucciolo di pterodattilo ha sparso foglie secche su tutto il balcone! Spazza finché il pavimento
          è libero.
        pt: O bebé pterodáctilo espalhou folhas secas pela varanda toda! Varre até o chão ficar limpinho.
        br: O bebê pterodáctilo espalhou folhas secas pela sacada toda! Varra até o chão ficar livre.
        nl: De babypterodactylus heeft overal op het balkon droge blaadjes gestrooid! Veeg tot de vloer leeg is.
      dt_c_balcon_01:
        fr: '@@@session.user.name@@@ a bien balayé le balcon ! Il reste quelques feuilles : le bébé ptérodactyle
          attendra sur la rambarde.'
        en: '@@@session.user.name@@@ swept the balcony nicely! A few leaves are left: the baby pterodactyl will
          wait on the railing.'
        es: '¡@@@session.user.name@@@ ha barrido bien el balcón! Quedan algunas hojas: el bebé pterodáctilo esperará
          en la barandilla.'
        de: '@@@session.user.name@@@ hat den Balkon schon gut gefegt! Ein paar Blätter sind noch da: Das Flugsaurier-Baby
          wartet auf dem Geländer.'
        it: '@@@session.user.name@@@ ha spazzato bene il balcone! Restano poche foglie: il cucciolo di pterodattilo
          aspetterà sulla ringhiera.'
        pt: '@@@session.user.name@@@ varreu bem a varanda! Ainda há umas folhas: o bebé pterodáctilo vai esperar
          no parapeito.'
        br: '@@@session.user.name@@@ varreu bem a sacada! Ainda tem umas folhas: o bebê pterodáctilo vai esperar
          no parapeito.'
        nl: '@@@session.user.name@@@ heeft het balkon al mooi geveegd! Er liggen nog wat blaadjes: de babypterodactylus
          wacht op de reling.'
      dt_a_balcon_02:
        fr: Le petit tricératops a fait des traces de pattes boueuses sur le balcon ! Nettoie à grande eau jusqu'à
          un sol propre.
        en: The little triceratops left muddy footprints all over the balcony! Wash it with lots of water until
          the floor is clean.
        es: ¡El pequeño triceratops ha dejado huellas de barro en el balcón! Friega con mucha agua hasta que el
          suelo quede limpio.
        de: Der kleine Triceratops hat matschige Fußspuren auf dem Balkon hinterlassen! Wisch mit viel Wasser, bis
          der Boden sauber ist.
        it: Il piccolo triceratopo ha lasciato impronte di fango sul balcone! Pulisci con tanta acqua finché il
          pavimento è pulito.
        pt: O pequeno tricerátopo deixou pegadas de lama na varanda! Esfrega com muita água até o chão ficar limpo.
        br: O pequeno tricerátopo deixou pegadas de lama na sacada! Esfregue com bastante água até o chão ficar
          limpo.
        nl: De kleine triceratops heeft modderpootjes op het balkon gezet! Schrob met veel water tot de vloer schoon
          is.
      dt_c_balcon_02:
        fr: '@@@session.user.name@@@ a déjà effacé plein de traces de pattes ! Le petit tricératops attendra, les
          pieds dans une flaque.'
        en: '@@@session.user.name@@@ already washed away lots of footprints! The little triceratops will wait, feet
          in a puddle.'
        es: ¡@@@session.user.name@@@ ya ha quitado muchas huellas! El pequeño triceratops esperará, con las patas
          en un charco.
        de: '@@@session.user.name@@@ hat schon viele Fußspuren weggewischt! Der kleine Triceratops wartet mit den
          Füßen in einer Pfütze.'
        it: '@@@session.user.name@@@ ha già tolto tante impronte! Il piccolo triceratopo aspetterà, con le zampe
          in una pozzanghera.'
        pt: '@@@session.user.name@@@ já tirou muitas pegadas! O pequeno tricerátopo vai esperar, com as patas numa
          poça.'
        br: '@@@session.user.name@@@ já tirou um monte de pegadas! O pequeno tricerátopo vai esperar, com as patas
          numa poça.'
        nl: '@@@session.user.name@@@ heeft al veel pootafdrukken weggepoetst! De kleine triceratops wacht wel, met
          zijn voeten in een plas.'
      dt_a_bureau_01:
        fr: Atchoum ! Le bébé diplodocus éternue dans la poussière du bureau ! Passe l'aspirateur ou le balai partout,
          même dans les coins.
        en: Achoo! The baby diplodocus keeps sneezing in the office dust! Vacuum or sweep everywhere, corners too.
        es: ¡Achís! ¡El bebé diplodocus estornuda con el polvo del despacho! Pasa la aspiradora o la escoba por
          todo, rincones incluidos.
        de: Hatschi! Das Diplodocus-Baby niest im Staub vom Büro! Saug oder feg überall, auch in den Ecken.
        it: Etciù! Il cucciolo di diplodoco starnutisce per la polvere dello studio! Passa l'aspirapolvere o la
          scopa ovunque, anche negli angoli.
        pt: Atchim! O bebé diplódoco espirra com o pó do escritório! Aspira ou varre tudo, até os cantinhos.
        br: Atchim! O bebê diplodoco espirra com a poeira do escritório! Aspire ou varra tudo, até os cantinhos.
        nl: Hatsjoe! De babydiplodocus niest van het stof in het kantoor! Stofzuig of veeg overal, ook in de hoekjes.
      dt_c_bureau_01:
        fr: '@@@session.user.name@@@ a déjà enlevé beaucoup de poussière du bureau ! Le bébé diplodocus éternue
          encore un peu, il attendra la fin.'
        en: '@@@session.user.name@@@ already cleared lots of dust from the office! The baby diplodocus still sneezes
          a little, it will wait.'
        es: ¡@@@session.user.name@@@ ya ha quitado mucho polvo del despacho! El bebé diplodocus aún estornuda un
          poco, esperará al final.
        de: '@@@session.user.name@@@ hat schon viel Staub aus dem Büro geholt! Das Diplodocus-Baby niest noch ein
          bisschen und wartet.'
        it: '@@@session.user.name@@@ ha già tolto tanta polvere dallo studio! Il cucciolo di diplodoco starnutisce
          ancora un po'', aspetterà.'
        pt: '@@@session.user.name@@@ já tirou muito pó do escritório! O bebé diplódoco ainda espirra um bocadinho,
          vai esperar pelo fim.'
        br: '@@@session.user.name@@@ já tirou muita poeira do escritório! O bebê diplodoco ainda espirra um pouquinho,
          vai esperar o final.'
        nl: '@@@session.user.name@@@ heeft al veel stof uit het kantoor gehaald! De babydiplodocus niest nog een
          beetje en wacht op de rest.'
      dt_a_bureau_02:
        fr: Le petit stégosaure a de la poussière sur ses plaques à force de jouer sur les étagères du bureau !
          Fais les poussières partout.
        en: The little stegosaurus got dust on its plates playing on the office shelves! Dust every surface.
        es: ¡El pequeño estegosaurio tiene polvo en las placas de tanto jugar en las estanterías del despacho! Quita
          el polvo de todo.
        de: Der kleine Stegosaurus hat Staub auf den Platten, weil er auf den Regalen im Büro gespielt hat! Wisch
          überall Staub.
        it: Il piccolo stegosauro ha le placche impolverate a forza di giocare sugli scaffali dello studio! Spolvera
          dappertutto.
        pt: O pequeno estegossauro tem pó nas placas de tanto brincar nas prateleiras do escritório! Limpa o pó
          de tudo.
        br: O pequeno estegossauro está com poeira nas placas de tanto brincar nas prateleiras do escritório! Tire
          o pó de tudo.
        nl: De kleine stegosaurus heeft stof op zijn platen van het spelen op de planken in het kantoor! Stof alles
          af.
      dt_c_bureau_02:
        fr: '@@@session.user.name@@@ a déjà fait briller une bonne partie du bureau ! Le petit stégosaure attendra
          pour les dernières étagères.'
        en: '@@@session.user.name@@@ already made a good part of the office shine! The little stegosaurus will wait
          for the last shelves.'
        es: ¡@@@session.user.name@@@ ya ha dejado brillante buena parte del despacho! El pequeño estegosaurio esperará
          las últimas estanterías.
        de: '@@@session.user.name@@@ hat schon einen großen Teil vom Büro zum Glänzen gebracht! Der kleine Stegosaurus
          wartet auf die letzten Regale.'
        it: '@@@session.user.name@@@ ha già fatto brillare buona parte dello studio! Il piccolo stegosauro aspetterà
          per gli ultimi scaffali.'
        pt: '@@@session.user.name@@@ já pôs a brilhar boa parte do escritório! O pequeno estegossauro espera pelas
          últimas prateleiras.'
        br: '@@@session.user.name@@@ já deixou boa parte do escritório brilhando! O pequeno estegossauro vai esperar
          pelas últimas prateleiras.'
        nl: '@@@session.user.name@@@ heeft al een groot deel van het kantoor laten glanzen! De kleine stegosaurus
          wacht op de laatste planken.'
      dt_a_bureau_03:
        fr: Le bébé iguanodon a glissé avec ses pattes collantes sur le sol du bureau ! Passe la serpillière jusqu'à
          ce qu'il brille.
        en: The baby iguanodon slid around the office floor with sticky feet! Mop until the floor shines, with no
          sticky spots.
        es: ¡El bebé iguanodonte ha resbalado con sus patas pegajosas por el suelo del despacho! Friega hasta que
          brille, sin manchas.
        de: Das Iguanodon-Baby ist mit klebrigen Füßen übers Büro gerutscht! Wisch den Boden, bis er glänzt und
          nichts mehr klebt.
        it: Il cucciolo di iguanodonte è scivolato con le zampe appiccicose sul pavimento dello studio! Passa lo
          straccio finché brilla.
        pt: O bebé iguanodonte escorregou com as patas pegajosas no chão do escritório! Passa a esfregona até brilhar,
          sem nada pegajoso.
        br: O bebê iguanodonte escorregou com as patas grudentas no chão do escritório! Passe pano até brilhar,
          sem nada grudento.
        nl: De babyiguanodon is met plakpootjes over de kantoorvloer gegleden! Dweil tot de vloer glanst en niets
          meer plakt.
      dt_c_bureau_03:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie du sol ! Le bébé iguanodon attendra sans bouger
          ses pattes collantes.'
        en: '@@@session.user.name@@@ already made part of the floor shine! The baby iguanodon will wait without
          moving its sticky feet.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte del suelo! El bebé iguanodonte esperará sin mover
          sus patas pegajosas.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Boden zum Glänzen gebracht! Das Iguanodon-Baby wartet,
          ohne die Klebefüße zu bewegen.'
        it: '@@@session.user.name@@@ ha già fatto brillare un pezzo di pavimento! Il cucciolo di iguanodonte aspetterà
          senza muovere le zampe.'
        pt: '@@@session.user.name@@@ já pôs parte do chão a brilhar! O bebé iguanodonte vai esperar sem mexer as
          patas pegajosas.'
        br: '@@@session.user.name@@@ já deixou parte do chão brilhando! O bebê iguanodonte vai esperar sem mexer
          as patas grudentas.'
        nl: '@@@session.user.name@@@ heeft al een stuk vloer laten glanzen! De babyiguanodon wacht zonder zijn plakpootjes
          te bewegen.'
      dt_a_bureau_04:
        fr: Le petit diplodocus a collé son nez sur les vitres du bureau, et maintenant il ne voit plus dehors !
          Nettoie-les jusqu'à ce qu'elles soient transparentes.
        en: The little diplodocus pressed its nose on the office windows and now it can't see outside! Clean them
          until they're clear.
        es: ¡El pequeño diplodocus ha pegado la nariz a los cristales del despacho y ya no ve fuera! Límpialos hasta
          que estén transparentes.
        de: Der kleine Diplodocus hat die Nase an die Bürofenster gedrückt und sieht nichts mehr! Putz sie, bis
          sie ganz klar sind.
        it: Il piccolo diplodoco ha schiacciato il naso sui vetri dello studio e non vede più fuori! Puliscili finché
          sono trasparenti.
        pt: O pequeno diplódoco encostou o nariz aos vidros do escritório e já não vê lá fora! Limpa-os até ficarem
          transparentes.
        br: O pequeno diplodoco encostou o nariz nos vidros do escritório e não enxerga mais lá fora! Limpe até
          ficarem transparentes.
        nl: De kleine diplodocus drukte zijn neus tegen de kantoorramen en ziet niks meer! Poets ze tot ze helemaal
          doorzichtig zijn.
      dt_c_bureau_04:
        fr: '@@@session.user.name@@@ a déjà nettoyé une partie des vitres ! Le petit diplodocus regarde dehors d''un
          œil, il attendra le reste.'
        en: '@@@session.user.name@@@ already cleaned some of the windows! The little diplodocus peeks out with one
          eye, it will wait for the rest.'
        es: ¡@@@session.user.name@@@ ya ha limpiado parte de los cristales! El pequeño diplodocus mira fuera con
          un ojo, esperará el resto.
        de: '@@@session.user.name@@@ hat schon einen Teil der Fenster geputzt! Der kleine Diplodocus schaut mit
          einem Auge raus und wartet.'
        it: '@@@session.user.name@@@ ha già pulito parte dei vetri! Il piccolo diplodoco guarda fuori con un occhio,
          aspetterà il resto.'
        pt: '@@@session.user.name@@@ já limpou parte dos vidros! O pequeno diplódoco espreita com um olho, vai esperar
          pelo resto.'
        br: '@@@session.user.name@@@ já limpou parte dos vidros! O pequeno diplodoco espia com um olho só, vai esperar
          o resto.'
        nl: '@@@session.user.name@@@ heeft al een deel van de ramen gepoetst! De kleine diplodocus gluurt met één
          oog naar buiten en wacht.'
      dt_a_bureau_05:
        fr: 'Le bébé tricératops a goûté sur le plan de travail du bureau : miettes et taches partout ! Nettoie
          jusqu''à une surface nette.'
        en: 'The baby triceratops had a snack on the office desk: crumbs and stains everywhere! Clean until the
          surface is spotless.'
        es: '¡El bebé triceratops ha merendado en la mesa del despacho: migas y manchas por todas partes! Limpia
          hasta dejarla impecable.'
        de: 'Das Triceratops-Baby hat auf dem Schreibtisch im Büro gevespert: überall Krümel und Flecken! Putz,
          bis alles sauber ist.'
        it: 'Il cucciolo di triceratopo ha fatto merenda sul piano di lavoro dello studio: briciole e macchie ovunque!
          Pulisci finché è perfetto.'
        pt: 'O bebé tricerátopo lanchou na secretária do escritório: migalhas e nódoas por todo o lado! Limpa até
          ficar impecável.'
        br: 'O bebê tricerátopo lanchou na mesa do escritório: farelos e manchas para todo lado! Limpe até ficar
          impecável.'
        nl: 'De babytriceratops heeft gesmuld op het bureau: overal kruimels en vlekken! Maak schoon tot het blad
          helemaal netjes is.'
      dt_c_bureau_05:
        fr: '@@@session.user.name@@@ a déjà ramassé plein de miettes ! Le bébé tricératops attendra pour les dernières
          taches, sans grignoter.'
        en: '@@@session.user.name@@@ already picked up lots of crumbs! The baby triceratops will wait for the last
          stains, no snacking.'
        es: ¡@@@session.user.name@@@ ya ha recogido muchas migas! El bebé triceratops esperará las últimas manchas,
          sin picotear.
        de: '@@@session.user.name@@@ hat schon viele Krümel weggemacht! Das Triceratops-Baby wartet auf die letzten
          Flecken, ohne zu naschen.'
        it: '@@@session.user.name@@@ ha già tolto tante briciole! Il cucciolo di triceratopo aspetterà le ultime
          macchie, senza sgranocchiare.'
        pt: '@@@session.user.name@@@ já apanhou muitas migalhas! O bebé tricerátopo espera pelas últimas nódoas,
          sem petiscar.'
        br: '@@@session.user.name@@@ já recolheu um monte de farelos! O bebê tricerátopo vai esperar as últimas
          manchas, sem beliscar.'
        nl: '@@@session.user.name@@@ heeft al veel kruimels opgeruimd! De babytriceratops wacht op de laatste vlekken,
          zonder te snoepen.'
      dt_a_bureau_06:
        fr: Le petit T. rex a fait tomber tous les papiers du bureau avec sa queue ! Range papiers et objets à leur
          place.
        en: The little T. rex knocked all the papers off the desk with its tail! Put the papers and things back
          where they go.
        es: ¡El pequeño T. rex ha tirado todos los papeles del despacho con la cola! Ordena papeles y cosas en su
          sitio.
        de: Der kleine T. rex hat mit dem Schwanz alle Papiere im Büro runtergeworfen! Räum Papiere und Sachen an
          ihren Platz.
        it: Il piccolo T. rex ha fatto cadere tutti i fogli dello studio con la coda! Rimetti fogli e oggetti al
          loro posto.
        pt: O pequeno T. rex deitou ao chão os papéis todos do escritório com a cauda! Arruma papéis e coisas no
          lugar.
        br: O pequeno T. rex derrubou todos os papéis do escritório com o rabo! Arrume papéis e objetos no lugar.
        nl: De kleine T. rex heeft met zijn staart alle papieren van het bureau gegooid! Ruim papieren en spulletjes
          op hun plek.
      dt_c_bureau_06:
        fr: '@@@session.user.name@@@ a déjà rangé une belle pile ! Le petit T. rex garde sa queue bien sage en attendant
          la suite.'
        en: '@@@session.user.name@@@ already tidied a nice pile! The little T. rex keeps its tail very still while
          it waits.'
        es: ¡@@@session.user.name@@@ ya ha ordenado un buen montón! El pequeño T. rex deja la cola quietecita mientras
          espera.
        de: '@@@session.user.name@@@ hat schon einen schönen Stapel aufgeräumt! Der kleine T. rex hält beim Warten
          den Schwanz ganz still.'
        it: '@@@session.user.name@@@ ha già messo in ordine una bella pila! Il piccolo T. rex tiene la coda ferma
          mentre aspetta.'
        pt: '@@@session.user.name@@@ já arrumou uma bela pilha! O pequeno T. rex fica com a cauda quietinha enquanto
          espera.'
        br: '@@@session.user.name@@@ já arrumou uma bela pilha! O pequeno T. rex deixa o rabo quietinho enquanto
          espera.'
        nl: '@@@session.user.name@@@ heeft al een mooie stapel opgeruimd! De kleine T. rex houdt zijn staart heel
          stil terwijl hij wacht.'
      dt_a_chambre_enfant_01:
        fr: Le bébé tricératops s'est roulé dans la poussière de la chambre enfant ! Passe l'aspirateur ou le balai
          partout, même dans les coins.
        en: The baby triceratops rolled in the dust of the kids' room! Vacuum or sweep everywhere, corners too.
        es: ¡El bebé triceratops se ha revolcado en el polvo del cuarto de los peques! Pasa la aspiradora o la escoba
          por todo, rincones incluidos.
        de: Das Triceratops-Baby hat sich im Staub vom Kinderzimmer gewälzt! Saug oder feg überall, auch in den
          Ecken.
        it: Il cucciolo di triceratopo si è rotolato nella polvere della cameretta! Passa l'aspirapolvere o la scopa
          ovunque, anche negli angoli.
        pt: O bebé tricerátopo rebolou no pó do quarto dos miúdos! Aspira ou varre tudo, até os cantinhos.
        br: O bebê tricerátopo rolou na poeira do quarto das crianças! Aspire ou varra tudo, até os cantinhos.
        nl: De babytriceratops heeft gerold in het stof van de kinderkamer! Stofzuig of veeg overal, ook in de hoekjes.
      dt_c_chambre_enfant_01:
        fr: '@@@session.user.name@@@ a déjà enlevé beaucoup de poussière de la chambre enfant ! Le bébé tricératops
          attendra pour les derniers coins.'
        en: '@@@session.user.name@@@ already got rid of lots of dust in the kids'' room! The baby triceratops will
          wait for the last corners.'
        es: ¡@@@session.user.name@@@ ya ha quitado mucho polvo del cuarto de los peques! El bebé triceratops esperará
          los últimos rincones.
        de: '@@@session.user.name@@@ hat im Kinderzimmer schon viel Staub weggemacht! Das Triceratops-Baby wartet
          auf die letzten Ecken.'
        it: '@@@session.user.name@@@ ha già tolto tanta polvere dalla cameretta! Il cucciolo di triceratopo aspetterà
          gli ultimi angoli.'
        pt: '@@@session.user.name@@@ já tirou muito pó do quarto dos miúdos! O bebé tricerátopo vai esperar pelos
          últimos cantinhos.'
        br: '@@@session.user.name@@@ já tirou muita poeira do quarto das crianças! O bebê tricerátopo vai esperar
          os últimos cantinhos.'
        nl: '@@@session.user.name@@@ heeft al veel stof uit de kinderkamer gehaald! De babytriceratops wacht op
          de laatste hoekjes.'
      dt_a_chambre_enfant_02:
        fr: Le petit ptérodactyle a battu des ailes et la poussière s'est posée partout dans la chambre enfant !
          Fais les poussières sur chaque meuble.
        en: The little pterodactyl flapped its wings and dust landed all over the kids' room! Dust every piece of
          furniture.
        es: ¡El pequeño pterodáctilo ha batido las alas y el polvo ha caído por todo el cuarto de los peques! Quita
          el polvo de cada mueble.
        de: Der kleine Flugsaurier hat mit den Flügeln geschlagen, jetzt liegt überall im Kinderzimmer Staub! Wisch
          jedes Möbelstück ab.
        it: Il piccolo pterodattilo ha sbattuto le ali e la polvere è finita dappertutto nella cameretta! Spolvera
          ogni mobile.
        pt: O pequeno pterodáctilo bateu as asas e o pó caiu por todo o quarto dos miúdos! Limpa o pó de cada móvel.
        br: O pequeno pterodáctilo bateu as asas e a poeira caiu pelo quarto das crianças todo! Tire o pó de cada
          móvel.
        nl: De kleine pterodactylus fladderde met zijn vleugels en nu ligt er overal stof in de kinderkamer! Stof
          elk meubel af.
      dt_c_chambre_enfant_02:
        fr: '@@@session.user.name@@@ a déjà dépoussiéré une bonne partie de la chambre ! Le petit ptérodactyle replie
          ses ailes et attend la suite.'
        en: '@@@session.user.name@@@ already dusted a good part of the room! The little pterodactyl folds its wings
          and waits for the rest.'
        es: ¡@@@session.user.name@@@ ya ha quitado el polvo de buena parte del cuarto! El pequeño pterodáctilo pliega
          las alas y espera.
        de: '@@@session.user.name@@@ hat schon einen großen Teil vom Zimmer abgestaubt! Der kleine Flugsaurier legt
          die Flügel an und wartet.'
        it: '@@@session.user.name@@@ ha già spolverato buona parte della cameretta! Il piccolo pterodattilo chiude
          le ali e aspetta il resto.'
        pt: '@@@session.user.name@@@ já limpou o pó de boa parte do quarto! O pequeno pterodáctilo dobra as asas
          e espera pelo resto.'
        br: '@@@session.user.name@@@ já tirou o pó de boa parte do quarto! O pequeno pterodáctilo dobra as asas
          e espera o resto.'
        nl: '@@@session.user.name@@@ heeft al een groot deel van de kamer afgestoft! De kleine pterodactylus vouwt
          zijn vleugels en wacht.'
      dt_a_chambre_enfant_03:
        fr: Le bébé stégosaure a renversé son jus de baies sur le sol de la chambre enfant ! Passe la serpillière
          jusqu'à ce que ça brille.
        en: The baby stegosaurus spilled its berry juice on the kids' room floor! Mop until it shines, with no sticky
          spots.
        es: ¡El bebé estegosaurio ha derramado su zumo de bayas en el suelo del cuarto de los peques! Friega hasta
          que brille.
        de: Das Stegosaurus-Baby hat seinen Beerensaft auf den Boden im Kinderzimmer gekippt! Wisch, bis alles glänzt
          und nichts klebt.
        it: Il cucciolo di stegosauro ha rovesciato il succo di bacche sul pavimento della cameretta! Passa lo straccio
          finché brilla.
        pt: O bebé estegossauro entornou o sumo de bagas no chão do quarto dos miúdos! Passa a esfregona até brilhar.
        br: O bebê estegossauro derramou o suco de frutinhas no chão do quarto das crianças! Passe pano até brilhar.
        nl: De babystegosaurus heeft zijn bessensap op de vloer van de kinderkamer gemorst! Dweil tot het glanst
          en niets plakt.
      dt_c_chambre_enfant_03:
        fr: '@@@session.user.name@@@ a déjà essuyé presque tout le jus ! Le bébé stégosaure promet de ne plus rien
          renverser en attendant.'
        en: '@@@session.user.name@@@ already wiped up almost all the juice! The baby stegosaurus promises not to
          spill anything while it waits.'
        es: ¡@@@session.user.name@@@ ya ha limpiado casi todo el zumo! El bebé estegosaurio promete no derramar
          nada mientras espera.
        de: '@@@session.user.name@@@ hat schon fast den ganzen Saft aufgewischt! Das Stegosaurus-Baby verspricht,
          beim Warten nichts zu kippen.'
        it: '@@@session.user.name@@@ ha già asciugato quasi tutto il succo! Il cucciolo di stegosauro promette di
          non rovesciare più niente.'
        pt: '@@@session.user.name@@@ já limpou quase todo o sumo! O bebé estegossauro promete não entornar nada
          enquanto espera.'
        br: '@@@session.user.name@@@ já limpou quase todo o suco! O bebê estegossauro promete não derramar nada
          enquanto espera.'
        nl: '@@@session.user.name@@@ heeft al bijna al het sap opgedweild! De babystegosaurus belooft niks meer
          te morsen terwijl hij wacht.'
      dt_a_chambre_enfant_04:
        fr: Le bébé diplodocus a fait des bisous sur les vitres de la chambre enfant ! Nettoie-les jusqu'à ce qu'elles
          soient transparentes.
        en: The baby diplodocus gave the kids' room windows lots of kisses! Clean them until they're perfectly clear.
        es: ¡El bebé diplodocus ha dado besitos a los cristales del cuarto de los peques! Límpialos hasta que estén
          transparentes.
        de: Das Diplodocus-Baby hat die Fenster im Kinderzimmer abgeküsst! Putz sie, bis sie ganz klar sind.
        it: Il cucciolo di diplodoco ha dato tanti bacini ai vetri della cameretta! Puliscili finché sono trasparenti.
        pt: O bebé diplódoco deu beijinhos nos vidros do quarto dos miúdos! Limpa-os até ficarem transparentes.
        br: O bebê diplodoco deu beijinhos nos vidros do quarto das crianças! Limpe até ficarem transparentes.
        nl: De babydiplodocus heeft de ramen van de kinderkamer vol kusjes gegeven! Poets ze tot ze helemaal doorzichtig
          zijn.
      dt_c_chambre_enfant_04:
        fr: '@@@session.user.name@@@ a déjà effacé plein de bisous sur les vitres ! Le bébé diplodocus attendra,
          sans en refaire, promis.'
        en: '@@@session.user.name@@@ already wiped off lots of kisses from the windows! The baby diplodocus will
          wait and won''t add more, promise.'
        es: ¡@@@session.user.name@@@ ya ha borrado muchos besitos de los cristales! El bebé diplodocus esperará
          sin dar más, prometido.
        de: '@@@session.user.name@@@ hat schon viele Küsschen von den Fenstern geputzt! Das Diplodocus-Baby wartet
          und küsst nicht nach, versprochen.'
        it: '@@@session.user.name@@@ ha già cancellato tanti bacini dai vetri! Il cucciolo di diplodoco aspetterà
          senza farne altri, promesso.'
        pt: '@@@session.user.name@@@ já apagou muitos beijinhos dos vidros! O bebé diplódoco vai esperar sem dar
          mais, prometido.'
        br: '@@@session.user.name@@@ já apagou um monte de beijinhos dos vidros! O bebê diplodoco vai esperar sem
          dar mais, prometido.'
        nl: '@@@session.user.name@@@ heeft al veel kusjes van de ramen gepoetst! De babydiplodocus wacht en geeft
          er geen nieuwe, beloofd.'
      dt_a_chambre_enfant_05:
        fr: 'Le petit iguanodon ne se voit plus dans le miroir de la chambre enfant : il est tout terne ! Nettoie-le
          jusqu''à un reflet clair.'
        en: The little iguanodon can't see itself in the kids' room mirror, it's all dull! Clean it until the reflection
          is clear.
        es: ¡El pequeño iguanodonte ya no se ve en el espejo del cuarto de los peques, está todo empañado! Límpialo
          hasta que refleje bien.
        de: Der kleine Iguanodon sieht sich im Spiegel vom Kinderzimmer nicht mehr, er ist ganz matt! Putz ihn,
          bis er wieder klar ist.
        it: Il piccolo iguanodonte non si vede più nello specchio della cameretta, è tutto opaco! Puliscilo finché
          il riflesso è chiaro.
        pt: O pequeno iguanodonte já não se vê no espelho do quarto dos miúdos, está todo baço! Limpa-o até o reflexo
          ficar claro.
        br: O pequeno iguanodonte não se enxerga mais no espelho do quarto das crianças, está todo opaco! Limpe
          até o reflexo ficar claro.
        nl: De kleine iguanodon ziet zichzelf niet meer in de spiegel van de kinderkamer, hij is helemaal dof! Poets
          tot hij weer helder is.
      dt_c_chambre_enfant_05:
        fr: '@@@session.user.name@@@ a déjà fait réapparaître la moitié du petit iguanodon dans le miroir ! Il attendra
          pour voir le reste.'
        en: '@@@session.user.name@@@ already made half of the little iguanodon show up in the mirror! It will wait
          to see the rest.'
        es: ¡@@@session.user.name@@@ ya ha hecho aparecer medio iguanodonte en el espejo! Esperará para ver el resto.
        de: '@@@session.user.name@@@ hat den kleinen Iguanodon schon zur Hälfte im Spiegel sichtbar gemacht! Er
          wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha già fatto ricomparire metà del piccolo iguanodonte nello specchio! Aspetterà
          per vedere il resto.'
        pt: '@@@session.user.name@@@ já fez aparecer metade do pequeno iguanodonte no espelho! Ele vai esperar para
          ver o resto.'
        br: '@@@session.user.name@@@ já fez aparecer metade do pequeno iguanodonte no espelho! Ele vai esperar para
          ver o resto.'
        nl: '@@@session.user.name@@@ heeft de kleine iguanodon al half terug in de spiegel getoverd! Hij wacht om
          de rest te zien.'
      dt_a_chambre_enfant_06:
        fr: Le bébé stégosaure a renversé tous les jouets de la chambre enfant ! Range chaque chose à sa place.
        en: The baby stegosaurus tipped out all the toys in the kids' room! Put everything back in its place.
        es: ¡El bebé estegosaurio ha volcado todos los juguetes del cuarto de los peques! Ordena cada cosa en su
          sitio.
        de: Das Stegosaurus-Baby hat alle Spielsachen im Kinderzimmer ausgekippt! Räum alles an seinen Platz.
        it: Il cucciolo di stegosauro ha rovesciato tutti i giochi della cameretta! Rimetti ogni cosa al suo posto.
        pt: O bebé estegossauro despejou os brinquedos todos do quarto dos miúdos! Arruma cada coisa no seu lugar.
        br: O bebê estegossauro espalhou todos os brinquedos do quarto das crianças! Guarde cada coisa no lugar.
        nl: De babystegosaurus heeft alle speelgoed in de kinderkamer omgekiept! Ruim alles op zijn plek.
      dt_c_chambre_enfant_06:
        fr: '@@@session.user.name@@@ a déjà rangé plein de jouets ! Le bébé stégosaure boude un peu sur le tapis,
          il attendra la suite.'
        en: '@@@session.user.name@@@ already put away lots of toys! The baby stegosaurus sulks a bit on the rug,
          it will wait for the rest.'
        es: ¡@@@session.user.name@@@ ya ha recogido muchos juguetes! El bebé estegosaurio se enfurruña en la alfombra,
          esperará el resto.
        de: '@@@session.user.name@@@ hat schon viele Spielsachen weggeräumt! Das Stegosaurus-Baby schmollt auf dem
          Teppich und wartet.'
        it: '@@@session.user.name@@@ ha già messo a posto tanti giochi! Il cucciolo di stegosauro fa il broncio
          sul tappeto, aspetterà.'
        pt: '@@@session.user.name@@@ já arrumou muitos brinquedos! O bebé estegossauro amua no tapete, vai esperar
          pelo resto.'
        br: '@@@session.user.name@@@ já guardou um monte de brinquedos! O bebê estegossauro fica emburrado no tapete,
          vai esperar o resto.'
        nl: '@@@session.user.name@@@ heeft al veel speelgoed opgeruimd! De babystegosaurus mokt een beetje op het
          kleed en wacht.'
      dt_a_chambre_enfant_09:
        fr: Le petit tricératops a sauté sur le lit de la chambre enfant avec ses pattes boueuses ! Change les draps
          pour des draps propres.
        en: The little triceratops jumped on the bed in the kids' room with muddy feet! Change the sheets for clean
          ones.
        es: ¡El pequeño triceratops ha saltado en la cama del cuarto de los peques con las patas llenas de barro!
          Cambia las sábanas por unas limpias.
        de: Der kleine Triceratops ist mit Matschfüßen aufs Bett im Kinderzimmer gesprungen! Bezieh das Bett mit
          frischer Bettwäsche.
        it: Il piccolo triceratopo è saltato sul letto della cameretta con le zampe infangate! Cambia le lenzuola
          con quelle pulite.
        pt: O pequeno tricerátopo saltou para a cama do quarto dos miúdos com as patas enlameadas! Muda os lençóis
          por uns lavados.
        br: O pequeno tricerátopo pulou na cama do quarto das crianças com as patas enlameadas! Troque os lençóis
          por limpos.
        nl: De kleine triceratops sprong met modderpootjes op het bed in de kinderkamer! Verschoon het bed met schone
          lakens.
      dt_c_chambre_enfant_09:
        fr: '@@@session.user.name@@@ a déjà enlevé les draps boueux ! Le petit tricératops attendra, assis bien
          sagement par terre.'
        en: '@@@session.user.name@@@ already took off the muddy sheets! The little triceratops will wait, sitting
          nicely on the floor.'
        es: ¡@@@session.user.name@@@ ya ha quitado las sábanas con barro! El pequeño triceratops esperará sentadito
          en el suelo.
        de: '@@@session.user.name@@@ hat die Matschbettwäsche schon abgezogen! Der kleine Triceratops wartet ganz
          brav auf dem Boden.'
        it: '@@@session.user.name@@@ ha già tolto le lenzuola infangate! Il piccolo triceratopo aspetterà, seduto
          buono per terra.'
        pt: '@@@session.user.name@@@ já tirou os lençóis enlameados! O pequeno tricerátopo vai esperar, sentadinho
          no chão.'
        br: '@@@session.user.name@@@ já tirou os lençóis enlameados! O pequeno tricerátopo vai esperar, sentadinho
          no chão.'
        nl: '@@@session.user.name@@@ heeft de modderlakens er al af gehaald! De kleine triceratops wacht keurig
          op de grond.'
      dt_a_chambre_enfant_10:
        fr: Le bébé ankylosaure a fait des dessins de boue sur les murs de la chambre enfant ! Nettoie-les jusqu'à
          des murs tout propres.
        en: The baby ankylosaurus drew mud pictures on the kids' room walls! Wash them until the walls are spotless.
        es: ¡El bebé anquilosaurio ha hecho dibujos de barro en las paredes del cuarto de los peques! Límpialas
          hasta dejarlas impecables.
        de: Das Ankylosaurus-Baby hat Matschbilder an die Wände im Kinderzimmer gemalt! Wisch sie ab, bis die Wände
          sauber sind.
        it: Il cucciolo di anchilosauro ha fatto disegni di fango sui muri della cameretta! Puliscili finché sono
          perfetti.
        pt: O bebé anquilossauro fez desenhos de lama nas paredes do quarto dos miúdos! Limpa-as até ficarem impecáveis.
        br: O bebê anquilossauro fez desenhos de lama nas paredes do quarto das crianças! Limpe até ficarem impecáveis.
        nl: De babyankylosaurus heeft moddertekeningen op de muren van de kinderkamer gemaakt! Was ze tot de muren
          brandschoon zijn.
      dt_c_chambre_enfant_10:
        fr: '@@@session.user.name@@@ a déjà effacé une partie des dessins de boue ! Le bébé ankylosaure attendra,
          les pattes derrière le dos.'
        en: '@@@session.user.name@@@ already wiped off some of the mud pictures! The baby ankylosaurus will wait,
          paws behind its back.'
        es: ¡@@@session.user.name@@@ ya ha borrado parte de los dibujos de barro! El bebé anquilosaurio esperará
          con las patas a la espalda.
        de: '@@@session.user.name@@@ hat schon einen Teil der Matschbilder weggewischt! Das Ankylosaurus-Baby wartet,
          Pfoten hinterm Rücken.'
        it: '@@@session.user.name@@@ ha già cancellato parte dei disegni di fango! Il cucciolo di anchilosauro aspetterà,
          zampe dietro la schiena.'
        pt: '@@@session.user.name@@@ já apagou parte dos desenhos de lama! O bebé anquilossauro vai esperar, de
          patas atrás das costas.'
        br: '@@@session.user.name@@@ já apagou parte dos desenhos de lama! O bebê anquilossauro vai esperar, com
          as patas para trás.'
        nl: '@@@session.user.name@@@ heeft al een deel van de moddertekeningen weggepoetst! De babyankylosaurus
          wacht, pootjes op zijn rug.'
      dt_a_chambre_enfant_11:
        fr: Le petit diplodocus trouve que le matelas de la chambre enfant sent le renfermé ! Aère le matelas jusqu'à
          ce qu'il soit frais.
        en: The little diplodocus thinks the mattress in the kids' room smells stuffy! Air the mattress until it's
          fresh.
        es: ¡Al pequeño diplodocus el colchón del cuarto de los peques le huele a cerrado! Airea el colchón hasta
          que esté fresco.
        de: Der kleine Diplodocus findet, die Matratze im Kinderzimmer riecht muffig! Lüfte die Matratze, bis sie
          frisch ist.
        it: Il piccolo diplodoco trova che il materasso della cameretta sappia di chiuso! Arieggia il materasso
          finché è fresco.
        pt: O pequeno diplódoco acha que o colchão do quarto dos miúdos cheira a fechado! Areja o colchão até ficar
          fresquinho.
        br: O pequeno diplodoco acha que o colchão do quarto das crianças está com cheiro de abafado! Areje o colchão
          até ficar fresquinho.
        nl: De kleine diplodocus vindt dat de matras in de kinderkamer muf ruikt! Lucht de matras tot hij fris is.
      dt_c_chambre_enfant_11:
        fr: '@@@session.user.name@@@ a déjà bien aéré le matelas ! Le petit diplodocus renifle encore un peu, il
          attendra la fin.'
        en: '@@@session.user.name@@@ already aired the mattress quite a bit! The little diplodocus still sniffs
          a little, it will wait.'
        es: ¡@@@session.user.name@@@ ya ha aireado bastante el colchón! El pequeño diplodocus aún olfatea un poco,
          esperará al final.
        de: '@@@session.user.name@@@ hat die Matratze schon gut gelüftet! Der kleine Diplodocus schnuppert noch
          ein bisschen und wartet.'
        it: '@@@session.user.name@@@ ha già arieggiato bene il materasso! Il piccolo diplodoco annusa ancora un
          po'', aspetterà la fine.'
        pt: '@@@session.user.name@@@ já arejou bem o colchão! O pequeno diplódoco ainda funga um bocadinho, vai
          esperar pelo fim.'
        br: '@@@session.user.name@@@ já arejou bem o colchão! O pequeno diplodoco ainda fareja um pouquinho, vai
          esperar o final.'
        nl: '@@@session.user.name@@@ heeft de matras al flink gelucht! De kleine diplodocus snuffelt nog wat en
          wacht op het eind.'
      dt_a_chambre_parentale_01:
        fr: Le bébé ankylosaure a traîné sa queue dans la poussière de la chambre des parents ! Passe l'aspirateur
          ou le balai partout, même dans les coins.
        en: The baby ankylosaurus dragged its tail through the dust in the grown-ups' room! Vacuum or sweep everywhere,
          corners too.
        es: ¡El bebé anquilosaurio ha arrastrado la cola por el polvo del cuarto de los papás! Pasa la aspiradora
          o la escoba por todo, rincones incluidos.
        de: Das Ankylosaurus-Baby hat seinen Schwanz durch den Staub im Elternzimmer gezogen! Saug oder feg überall,
          auch in den Ecken.
        it: Il cucciolo di anchilosauro ha trascinato la coda nella polvere della camera dei genitori! Passa l'aspirapolvere
          o la scopa ovunque, anche negli angoli.
        pt: O bebé anquilossauro arrastou a cauda pelo pó do quarto dos pais! Aspira ou varre tudo, até os cantinhos.
        br: O bebê anquilossauro arrastou o rabo pela poeira do quarto dos pais! Aspire ou varra tudo, até os cantinhos.
        nl: De babyankylosaurus sleepte zijn staart door het stof in de ouderslaapkamer! Stofzuig of veeg overal,
          ook in de hoekjes.
      dt_c_chambre_parentale_01:
        fr: '@@@session.user.name@@@ a déjà enlevé beaucoup de poussière ! Le bébé ankylosaure boude un peu, il
          attendra pour les derniers coins.'
        en: '@@@session.user.name@@@ already cleared lots of dust! The baby ankylosaurus sulks a bit, it will wait
          for the last corners.'
        es: ¡@@@session.user.name@@@ ya ha quitado mucho polvo! El bebé anquilosaurio está algo enfurruñado, esperará
          los últimos rincones.
        de: '@@@session.user.name@@@ hat schon viel Staub weggemacht! Das Ankylosaurus-Baby schmollt ein bisschen
          und wartet auf die letzten Ecken.'
        it: '@@@session.user.name@@@ ha già tolto tanta polvere! Il cucciolo di anchilosauro fa un po'' il broncio,
          aspetterà gli ultimi angoli.'
        pt: '@@@session.user.name@@@ já tirou muito pó! O bebé anquilossauro amua um bocadinho, vai esperar pelos
          últimos cantinhos.'
        br: '@@@session.user.name@@@ já tirou muita poeira! O bebê anquilossauro ficou meio emburrado, vai esperar
          os últimos cantinhos.'
        nl: '@@@session.user.name@@@ heeft al veel stof weggehaald! De babyankylosaurus mokt een beetje en wacht
          op de laatste hoekjes.'
      dt_a_chambre_parentale_02:
        fr: 'Le petit brachiosaure a passé sa tête par la fenêtre : il y a de la poussière partout dans la chambre
          des parents ! Fais les poussières sur chaque meuble.'
        en: 'The little brachiosaurus poked its head through the window: there''s dust all over the grown-ups''
          room! Dust every piece of furniture.'
        es: '¡El pequeño braquiosaurio ha asomado la cabeza por la ventana: hay polvo por todo el cuarto de los
          papás! Quita el polvo de cada mueble.'
        de: 'Der kleine Brachiosaurus schaut zum Fenster rein: Im Elternzimmer liegt überall Staub! Wisch jedes
          Möbelstück ab.'
        it: 'Il piccolo brachiosauro ha infilato la testa dalla finestra: c''è polvere dappertutto nella camera
          dei genitori! Spolvera ogni mobile.'
        pt: 'O pequeno braquiossauro espreitou pela janela: há pó por todo o quarto dos pais! Limpa o pó de cada
          móvel.'
        br: 'O pequeno braquiossauro espiou pela janela: tem poeira pelo quarto dos pais todo! Tire o pó de cada
          móvel.'
        nl: 'De kleine brachiosaurus steekt zijn kop door het raam: overal stof in de ouderslaapkamer! Stof elk
          meubel af.'
      dt_c_chambre_parentale_02:
        fr: '@@@session.user.name@@@ a déjà dépoussiéré une bonne partie de la chambre ! Le petit brachiosaure garde
          la tête à la fenêtre et attend.'
        en: '@@@session.user.name@@@ already dusted a good part of the room! The little brachiosaurus keeps its
          head at the window and waits.'
        es: ¡@@@session.user.name@@@ ya ha quitado el polvo de buena parte del cuarto! El pequeño braquiosaurio
          sigue asomado y espera.
        de: '@@@session.user.name@@@ hat schon einen großen Teil vom Zimmer abgestaubt! Der kleine Brachiosaurus
          bleibt am Fenster und wartet.'
        it: '@@@session.user.name@@@ ha già spolverato buona parte della camera! Il piccolo brachiosauro resta alla
          finestra e aspetta.'
        pt: '@@@session.user.name@@@ já limpou o pó de boa parte do quarto! O pequeno braquiossauro fica à janela
          e espera.'
        br: '@@@session.user.name@@@ já tirou o pó de boa parte do quarto! O pequeno braquiossauro continua na janela
          e espera.'
        nl: '@@@session.user.name@@@ heeft al een groot deel van de kamer afgestoft! De kleine brachiosaurus blijft
          bij het raam en wacht.'
      dt_a_chambre_parentale_03:
        fr: Le bébé iguanodon a dansé avec ses pattes collantes sur le sol de la chambre des parents ! Passe la
          serpillière jusqu'à ce que ça brille.
        en: The baby iguanodon danced on the grown-ups' room floor with sticky feet! Mop until it shines, with no
          sticky spots.
        es: ¡El bebé iguanodonte ha bailado con sus patas pegajosas en el suelo del cuarto de los papás! Friega
          hasta que brille.
        de: Das Iguanodon-Baby hat mit Klebefüßen im Elternzimmer getanzt! Wisch den Boden, bis er glänzt und nichts
          mehr klebt.
        it: Il cucciolo di iguanodonte ha ballato con le zampe appiccicose sul pavimento della camera dei genitori!
          Passa lo straccio finché brilla.
        pt: O bebé iguanodonte dançou com as patas pegajosas no chão do quarto dos pais! Passa a esfregona até brilhar.
        br: O bebê iguanodonte dançou com as patas grudentas no chão do quarto dos pais! Passe pano até brilhar.
        nl: De babyiguanodon heeft met plakpootjes gedanst op de vloer van de ouderslaapkamer! Dweil tot het glanst
          en niets plakt.
      dt_c_chambre_parentale_03:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie du sol ! Le bébé iguanodon arrête de danser
          et attend la suite.'
        en: '@@@session.user.name@@@ already made part of the floor shine! The baby iguanodon stops dancing and
          waits for the rest.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte del suelo! El bebé iguanodonte deja de bailar y espera
          el resto.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Boden zum Glänzen gebracht! Das Iguanodon-Baby hört
          auf zu tanzen und wartet.'
        it: '@@@session.user.name@@@ ha già fatto brillare un pezzo di pavimento! Il cucciolo di iguanodonte smette
          di ballare e aspetta.'
        pt: '@@@session.user.name@@@ já pôs parte do chão a brilhar! O bebé iguanodonte para de dançar e espera
          pelo resto.'
        br: '@@@session.user.name@@@ já deixou parte do chão brilhando! O bebê iguanodonte para de dançar e espera
          o resto.'
        nl: '@@@session.user.name@@@ heeft al een stuk vloer laten glanzen! De babyiguanodon stopt met dansen en
          wacht op de rest.'
      dt_a_chambre_parentale_04:
        fr: Le petit tricératops a soufflé de la buée sur les vitres de la chambre des parents pour dessiner ! Nettoie-les
          jusqu'à ce qu'elles soient transparentes.
        en: The little triceratops breathed on the grown-ups' room windows to draw pictures! Clean them until they're
          perfectly clear.
        es: ¡El pequeño triceratops ha echado vaho en los cristales del cuarto de los papás para dibujar! Límpialos
          hasta que estén transparentes.
        de: Der kleine Triceratops hat die Fenster im Elternzimmer angehaucht, um zu malen! Putz sie, bis sie ganz
          klar sind.
        it: Il piccolo triceratopo ha appannato i vetri della camera dei genitori per disegnarci! Puliscili finché
          sono trasparenti.
        pt: O pequeno tricerátopo bafejou os vidros do quarto dos pais para fazer desenhos! Limpa-os até ficarem
          transparentes.
        br: O pequeno tricerátopo bafejou nos vidros do quarto dos pais para desenhar! Limpe até ficarem transparentes.
        nl: De kleine triceratops heeft op de ramen van de ouderslaapkamer geblazen om te tekenen! Poets ze tot
          ze helemaal doorzichtig zijn.
      dt_c_chambre_parentale_04:
        fr: '@@@session.user.name@@@ a déjà effacé plein de dessins sur les vitres ! Le petit tricératops attendra
          pour les derniers.'
        en: '@@@session.user.name@@@ already wiped off lots of window drawings! The little triceratops will wait
          for the last ones.'
        es: ¡@@@session.user.name@@@ ya ha borrado muchos dibujos de los cristales! El pequeño triceratops esperará
          los últimos.
        de: '@@@session.user.name@@@ hat schon viele Bilder von den Fenstern geputzt! Der kleine Triceratops wartet
          auf die letzten.'
        it: '@@@session.user.name@@@ ha già cancellato tanti disegni dai vetri! Il piccolo triceratopo aspetterà
          gli ultimi.'
        pt: '@@@session.user.name@@@ já apagou muitos desenhos dos vidros! O pequeno tricerátopo vai esperar pelos
          últimos.'
        br: '@@@session.user.name@@@ já apagou um monte de desenhos dos vidros! O pequeno tricerátopo vai esperar
          os últimos.'
        nl: '@@@session.user.name@@@ heeft al veel tekeningen van de ramen gepoetst! De kleine triceratops wacht
          op de laatste.'
      dt_a_chambre_parentale_05:
        fr: Le bébé stégosaure veut admirer ses plaques dans le miroir de la chambre des parents, mais il est tout
          terne ! Nettoie-le jusqu'à un reflet clair.
        en: The baby stegosaurus wants to admire its plates in the grown-ups' room mirror, but it's all dull! Clean
          it until the reflection is clear.
        es: ¡El bebé estegosaurio quiere admirar sus placas en el espejo del cuarto de los papás, pero está empañado!
          Límpialo hasta que refleje bien.
        de: Das Stegosaurus-Baby will seine Platten im Spiegel vom Elternzimmer bewundern, aber er ist ganz matt!
          Putz ihn, bis er wieder klar ist.
        it: Il cucciolo di stegosauro vuole ammirare le sue placche nello specchio della camera dei genitori, ma
          è opaco! Puliscilo finché il riflesso è chiaro.
        pt: O bebé estegossauro quer admirar as placas no espelho do quarto dos pais, mas está baço! Limpa-o até
          o reflexo ficar claro.
        br: O bebê estegossauro quer admirar as placas no espelho do quarto dos pais, mas ele está opaco! Limpe
          até o reflexo ficar claro.
        nl: De babystegosaurus wil zijn platen bewonderen in de spiegel van de ouderslaapkamer, maar die is dof!
          Poets tot hij weer helder is.
      dt_c_chambre_parentale_05:
        fr: '@@@session.user.name@@@ a déjà fait briller un bout du miroir ! Le bébé stégosaure y voit une plaque
          sur deux, il attendra le reste.'
        en: '@@@session.user.name@@@ already made part of the mirror shine! The baby stegosaurus can see every other
          plate, it will wait for the rest.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar un trozo del espejo! El bebé estegosaurio ve la mitad de
          sus placas, esperará el resto.
        de: '@@@session.user.name@@@ hat schon ein Stück vom Spiegel blank geputzt! Das Stegosaurus-Baby sieht jede
          zweite Platte und wartet.'
        it: '@@@session.user.name@@@ ha già fatto brillare un pezzo di specchio! Il cucciolo di stegosauro vede
          metà delle placche, aspetterà.'
        pt: '@@@session.user.name@@@ já pôs um bocado do espelho a brilhar! O bebé estegossauro vê metade das placas,
          vai esperar pelo resto.'
        br: '@@@session.user.name@@@ já deixou um pedaço do espelho brilhando! O bebê estegossauro vê metade das
          placas, vai esperar o resto.'
        nl: '@@@session.user.name@@@ heeft al een stuk spiegel laten glanzen! De babystegosaurus ziet de helft van
          zijn platen en wacht op de rest.'
      dt_a_chambre_parentale_06:
        fr: Le petit T. rex a joué à cache-cache dans la chambre des parents et tout est en désordre ! Range chaque
          chose à sa place.
        en: The little T. rex played hide-and-seek in the grown-ups' room and everything's a mess! Put everything
          back in its place.
        es: ¡El pequeño T. rex ha jugado al escondite en el cuarto de los papás y todo está desordenado! Ordena
          cada cosa en su sitio.
        de: Der kleine T. rex hat im Elternzimmer Verstecken gespielt, jetzt ist alles durcheinander! Räum alles
          an seinen Platz.
        it: Il piccolo T. rex ha giocato a nascondino nella camera dei genitori ed è tutto in disordine! Rimetti
          ogni cosa al suo posto.
        pt: O pequeno T. rex brincou às escondidas no quarto dos pais e está tudo desarrumado! Arruma cada coisa
          no seu lugar.
        br: O pequeno T. rex brincou de esconde-esconde no quarto dos pais e está tudo bagunçado! Guarde cada coisa
          no lugar.
        nl: De kleine T. rex speelde verstoppertje in de ouderslaapkamer en alles ligt overhoop! Ruim alles op zijn
          plek.
      dt_c_chambre_parentale_06:
        fr: '@@@session.user.name@@@ a déjà bien rangé la chambre ! Le petit T. rex, caché derrière le rideau, attendra
          la suite.'
        en: '@@@session.user.name@@@ already tidied the room quite a bit! The little T. rex, hiding behind the curtain,
          will wait for the rest.'
        es: ¡@@@session.user.name@@@ ya ha ordenado bastante el cuarto! El pequeño T. rex, escondido tras la cortina,
          esperará el resto.
        de: '@@@session.user.name@@@ hat das Zimmer schon gut aufgeräumt! Der kleine T. rex wartet versteckt hinterm
          Vorhang auf den Rest.'
        it: '@@@session.user.name@@@ ha già messo bene in ordine la camera! Il piccolo T. rex, nascosto dietro la
          tenda, aspetterà il resto.'
        pt: '@@@session.user.name@@@ já arrumou bem o quarto! O pequeno T. rex, escondido atrás da cortina, vai
          esperar pelo resto.'
        br: '@@@session.user.name@@@ já arrumou bem o quarto! O pequeno T. rex, escondido atrás da cortina, vai
          esperar o resto.'
        nl: '@@@session.user.name@@@ heeft de kamer al flink opgeruimd! De kleine T. rex wacht verstopt achter het
          gordijn op de rest.'
      dt_a_chambre_parentale_08:
        fr: Le bébé diplodocus a fait des roulades sur le lit des parents avec ses pattes pleines d'herbe ! Change
          les draps pour des draps propres.
        en: The baby diplodocus did roly-polies on the grown-ups' bed with grassy feet! Change the sheets for clean
          ones.
        es: ¡El bebé diplodocus ha dado volteretas en la cama de los papás con las patas llenas de hierba! Cambia
          las sábanas por unas limpias.
        de: Das Diplodocus-Baby hat mit grasigen Füßen Purzelbäume auf dem Elternbett gemacht! Bezieh das Bett mit
          frischer Bettwäsche.
        it: Il cucciolo di diplodoco ha fatto le capriole sul letto dei genitori con le zampe piene d'erba! Cambia
          le lenzuola con quelle pulite.
        pt: O bebé diplódoco deu cambalhotas na cama dos pais com as patas cheias de erva! Muda os lençóis por uns
          lavados.
        br: O bebê diplodoco deu cambalhotas na cama dos pais com as patas cheias de grama! Troque os lençóis por
          limpos.
        nl: De babydiplodocus maakte koprollen op het bed van de ouders met graspootjes! Verschoon het bed met schone
          lakens.
      dt_c_chambre_parentale_08:
        fr: '@@@session.user.name@@@ a déjà retiré les draps pleins d''herbe ! Le bébé diplodocus attendra pour
          les draps propres, sans faire de roulade.'
        en: '@@@session.user.name@@@ already pulled off the grassy sheets! The baby diplodocus will wait for clean
          ones, no roly-polies.'
        es: ¡@@@session.user.name@@@ ya ha quitado las sábanas con hierba! El bebé diplodocus esperará las limpias,
          sin volteretas.
        de: '@@@session.user.name@@@ hat die grasige Bettwäsche schon abgezogen! Das Diplodocus-Baby wartet auf
          die frische, ohne Purzelbaum.'
        it: '@@@session.user.name@@@ ha già tolto le lenzuola piene d''erba! Il cucciolo di diplodoco aspetterà
          quelle pulite, senza capriole.'
        pt: '@@@session.user.name@@@ já tirou os lençóis cheios de erva! O bebé diplódoco espera pelos lavados,
          sem cambalhotas.'
        br: '@@@session.user.name@@@ já tirou os lençóis cheios de grama! O bebê diplodoco vai esperar os limpos,
          sem cambalhota.'
        nl: '@@@session.user.name@@@ heeft de graslakens er al af gehaald! De babydiplodocus wacht op schone, zonder
          koprollen.'
      dt_a_chambre_parentale_09:
        fr: 'Le petit ankylosaure a sauté sur le matelas des parents : il est tout tassé et sent le renfermé ! Retourne
          ou aère le matelas jusqu''à ce qu''il soit frais.'
        en: 'The little ankylosaurus bounced on the grown-ups'' mattress: it''s squashed and smells stuffy! Turn
          or air the mattress until it''s fresh.'
        es: '¡El pequeño anquilosaurio ha saltado en el colchón de los papás: está aplastado y huele a cerrado!
          Dale la vuelta o airéalo hasta que esté fresco.'
        de: 'Der kleine Ankylosaurus ist auf der Elternmatratze herumgehüpft: Sie ist platt und muffig! Dreh oder
          lüfte die Matratze, bis sie frisch ist.'
        it: 'Il piccolo anchilosauro ha saltato sul materasso dei genitori: è schiacciato e sa di chiuso! Gira o
          arieggia il materasso finché è fresco.'
        pt: 'O pequeno anquilossauro saltou no colchão dos pais: está achatado e cheira a fechado! Vira ou areja
          o colchão até ficar fresquinho.'
        br: 'O pequeno anquilossauro pulou no colchão dos pais: ele está amassado e com cheiro de abafado! Vire
          ou areje o colchão até ficar fresquinho.'
        nl: 'De kleine ankylosaurus heeft op de matras van de ouders gesprongen: hij is plat en ruikt muf! Draai
          of lucht de matras tot hij fris is.'
      dt_c_chambre_parentale_09:
        fr: '@@@session.user.name@@@ a déjà bien bougé le matelas ! Le petit ankylosaure attend la suite, sans sauter
          dessus.'
        en: '@@@session.user.name@@@ already moved the mattress a good bit! The little ankylosaurus waits for the
          rest, without bouncing on it.'
        es: ¡@@@session.user.name@@@ ya ha movido bastante el colchón! El pequeño anquilosaurio espera el resto,
          sin saltar encima.
        de: '@@@session.user.name@@@ hat die Matratze schon gut bewegt! Der kleine Ankylosaurus wartet auf den Rest,
          ohne draufzuhüpfen.'
        it: '@@@session.user.name@@@ ha già spostato bene il materasso! Il piccolo anchilosauro aspetta il resto,
          senza saltarci sopra.'
        pt: '@@@session.user.name@@@ já mexeu bem no colchão! O pequeno anquilossauro espera pelo resto, sem saltar
          em cima.'
        br: '@@@session.user.name@@@ já mexeu bastante no colchão! O pequeno anquilossauro espera o resto, sem pular
          em cima.'
        nl: '@@@session.user.name@@@ heeft de matras al flink verschoven! De kleine ankylosaurus wacht op de rest,
          zonder erop te springen.'
      dt_a_chambre_parentale_10:
        fr: 'Le bébé tricératops a frotté ses cornes contre les murs de la chambre des parents : il y a des traces
          partout ! Nettoie-les jusqu''à des murs tout propres.'
        en: 'The baby triceratops rubbed its horns on the grown-ups'' room walls: there are marks everywhere! Wash
          them until the walls are spotless.'
        es: '¡El bebé triceratops ha frotado sus cuernos contra las paredes del cuarto de los papás: hay marcas
          por todas partes! Límpialas bien.'
        de: 'Das Triceratops-Baby hat seine Hörner an den Wänden im Elternzimmer gerieben: überall Spuren! Wisch
          sie ab, bis die Wände sauber sind.'
        it: 'Il cucciolo di triceratopo ha strofinato le corna sui muri della camera dei genitori: ci sono segni
          ovunque! Puliscili finché sono perfetti.'
        pt: 'O bebé tricerátopo esfregou os cornos nas paredes do quarto dos pais: há marcas por todo o lado! Limpa-as
          até ficarem impecáveis.'
        br: 'O bebê tricerátopo esfregou os chifres nas paredes do quarto dos pais: tem marcas para todo lado! Limpe
          até ficarem impecáveis.'
        nl: 'De babytriceratops heeft zijn hoorns langs de muren van de ouderslaapkamer geschuurd: overal strepen!
          Was ze tot de muren brandschoon zijn.'
      dt_c_chambre_parentale_10:
        fr: '@@@session.user.name@@@ a déjà effacé plein de traces de cornes ! Le bébé tricératops attendra, bien
          loin des murs.'
        en: '@@@session.user.name@@@ already wiped off lots of horn marks! The baby triceratops will wait, far away
          from the walls.'
        es: ¡@@@session.user.name@@@ ya ha borrado muchas marcas de cuernos! El bebé triceratops esperará, bien
          lejos de las paredes.
        de: '@@@session.user.name@@@ hat schon viele Hörnerspuren weggewischt! Das Triceratops-Baby wartet, schön
          weit weg von den Wänden.'
        it: '@@@session.user.name@@@ ha già cancellato tanti segni di corna! Il cucciolo di triceratopo aspetterà,
          ben lontano dai muri.'
        pt: '@@@session.user.name@@@ já apagou muitas marcas de cornos! O bebé tricerátopo vai esperar, bem longe
          das paredes.'
        br: '@@@session.user.name@@@ já apagou um monte de marcas de chifre! O bebê tricerátopo vai esperar, bem
          longe das paredes.'
        nl: '@@@session.user.name@@@ heeft al veel hoornstrepen weggepoetst! De babytriceratops wacht, ver weg van
          de muren.'
      dt_a_couloir_01:
        fr: Le petit diplodocus a couru dans le couloir et soulevé un nuage de poussière ! Passe l'aspirateur ou
          le balai partout, même dans les coins.
        en: The little diplodocus ran down the hallway and kicked up a cloud of dust! Vacuum or sweep everywhere,
          corners too.
        es: ¡El pequeño diplodocus ha corrido por el pasillo y ha levantado una nube de polvo! Pasa la aspiradora
          o la escoba por todo, rincones incluidos.
        de: Der kleine Diplodocus ist durch den Flur gerannt und hat eine Staubwolke aufgewirbelt! Saug oder feg
          überall, auch in den Ecken.
        it: Il piccolo diplodoco ha corso nel corridoio e ha sollevato una nuvola di polvere! Passa l'aspirapolvere
          o la scopa ovunque, anche negli angoli.
        pt: O pequeno diplódoco correu pelo corredor e levantou uma nuvem de pó! Aspira ou varre tudo, até os cantinhos.
        br: O pequeno diplodoco correu pelo corredor e levantou uma nuvem de poeira! Aspire ou varra tudo, até os
          cantinhos.
        nl: De kleine diplodocus rende door de gang en schopte een stofwolk op! Stofzuig of veeg overal, ook in
          de hoekjes.
      dt_c_couloir_01:
        fr: '@@@session.user.name@@@ a déjà nettoyé une bonne partie du couloir ! Le petit diplodocus marche sur
          la pointe des pattes en attendant.'
        en: '@@@session.user.name@@@ already cleaned a good part of the hallway! The little diplodocus tiptoes around
          while it waits.'
        es: ¡@@@session.user.name@@@ ya ha limpiado buena parte del pasillo! El pequeño diplodocus camina de puntillas
          mientras espera.
        de: '@@@session.user.name@@@ hat schon einen großen Teil vom Flur sauber gemacht! Der kleine Diplodocus
          schleicht auf Zehenspitzen und wartet.'
        it: '@@@session.user.name@@@ ha già pulito buona parte del corridoio! Il piccolo diplodoco cammina in punta
          di zampe mentre aspetta.'
        pt: '@@@session.user.name@@@ já limpou boa parte do corredor! O pequeno diplódoco anda em bicos de pés enquanto
          espera.'
        br: '@@@session.user.name@@@ já limpou boa parte do corredor! O pequeno diplodoco anda na ponta das patas
          enquanto espera.'
        nl: '@@@session.user.name@@@ heeft al een groot deel van de gang schoongemaakt! De kleine diplodocus loopt
          op zijn tenen terwijl hij wacht.'
      dt_a_couloir_02:
        fr: Le bébé ptérodactyle a volé le long du couloir et fait tomber la poussière partout ! Fais les poussières
          sur chaque meuble et cadre.
        en: The baby pterodactyl flew down the hallway and shook dust onto everything! Dust every piece of furniture
          and frame.
        es: ¡El bebé pterodáctilo ha volado por el pasillo y ha llenado todo de polvo! Quita el polvo de cada mueble
          y cuadro.
        de: Das Flugsaurier-Baby ist durch den Flur geflogen und hat überall Staub verteilt! Wisch jedes Möbelstück
          und jeden Rahmen ab.
        it: Il cucciolo di pterodattilo ha volato lungo il corridoio e ha fatto cadere polvere ovunque! Spolvera
          ogni mobile e cornice.
        pt: O bebé pterodáctilo voou pelo corredor e espalhou pó por todo o lado! Limpa o pó de cada móvel e quadro.
        br: O bebê pterodáctilo voou pelo corredor e espalhou poeira para todo lado! Tire o pó de cada móvel e quadro.
        nl: De babypterodactylus vloog door de gang en liet overal stof vallen! Stof elk meubel en elke lijst af.
      dt_c_couloir_02:
        fr: '@@@session.user.name@@@ a déjà dépoussiéré une partie du couloir ! Le bébé ptérodactyle se pose sur
          un cadre et attend la suite.'
        en: '@@@session.user.name@@@ already dusted part of the hallway! The baby pterodactyl lands on a frame and
          waits for the rest.'
        es: ¡@@@session.user.name@@@ ya ha quitado el polvo de parte del pasillo! El bebé pterodáctilo se posa en
          un cuadro y espera.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Flur abgestaubt! Das Flugsaurier-Baby setzt sich auf
          einen Rahmen und wartet.'
        it: '@@@session.user.name@@@ ha già spolverato parte del corridoio! Il cucciolo di pterodattilo si posa
          su una cornice e aspetta.'
        pt: '@@@session.user.name@@@ já limpou o pó de parte do corredor! O bebé pterodáctilo pousa num quadro e
          espera pelo resto.'
        br: '@@@session.user.name@@@ já tirou o pó de parte do corredor! O bebê pterodáctilo pousa num quadro e
          espera o resto.'
        nl: '@@@session.user.name@@@ heeft al een deel van de gang afgestoft! De babypterodactylus landt op een
          lijst en wacht op de rest.'
      dt_a_couloir_03:
        fr: 'Le petit iguanodon est rentré de la mare sans s''essuyer les pattes : le couloir colle ! Passe la serpillière
          jusqu''à ce qu''il brille.'
        en: 'The little iguanodon came back from the pond without wiping its feet: the hallway is sticky! Mop until
          it shines.'
        es: ¡El pequeño iguanodonte ha vuelto de la charca sin limpiarse las patas y el pasillo se pega! Friega
          hasta que brille.
        de: 'Der kleine Iguanodon kam vom Teich, ohne die Füße abzuputzen: Der Flur klebt! Wisch, bis der Boden
          glänzt.'
        it: 'Il piccolo iguanodonte è tornato dallo stagno senza pulirsi le zampe: il corridoio appiccica! Passa
          lo straccio finché brilla.'
        pt: 'O pequeno iguanodonte voltou do charco sem limpar as patas: o corredor está pegajoso! Passa a esfregona
          até brilhar.'
        br: 'O pequeno iguanodonte voltou da lagoa sem limpar as patas: o corredor está grudento! Passe pano até
          brilhar.'
        nl: 'De kleine iguanodon kwam van de vijver zonder zijn poten te vegen: de gang plakt! Dweil tot de vloer
          glanst.'
      dt_c_couloir_03:
        fr: '@@@session.user.name@@@ a déjà fait briller un bout du couloir ! Le petit iguanodon attendra sur le
          paillasson, promis.'
        en: '@@@session.user.name@@@ already made part of the hallway shine! The little iguanodon will wait on the
          doormat, promise.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar un trozo del pasillo! El pequeño iguanodonte esperará en
          el felpudo, prometido.
        de: '@@@session.user.name@@@ hat schon ein Stück vom Flur zum Glänzen gebracht! Der kleine Iguanodon wartet
          auf der Fußmatte, versprochen.'
        it: '@@@session.user.name@@@ ha già fatto brillare un pezzo di corridoio! Il piccolo iguanodonte aspetterà
          sullo zerbino, promesso.'
        pt: '@@@session.user.name@@@ já pôs um bocado do corredor a brilhar! O pequeno iguanodonte espera no tapete
          da entrada, prometido.'
        br: '@@@session.user.name@@@ já deixou um pedaço do corredor brilhando! O pequeno iguanodonte vai esperar
          no capacho, prometido.'
        nl: '@@@session.user.name@@@ heeft al een stuk gang laten glanzen! De kleine iguanodon wacht op de deurmat,
          beloofd.'
      dt_a_couloir_04:
        fr: Le bébé stégosaure a frôlé les murs du couloir avec ses plaques pleines de boue ! Nettoie-les jusqu'à
          des murs tout propres.
        en: The baby stegosaurus brushed the hallway walls with its muddy plates! Wash them until the walls are
          spotless.
        es: ¡El bebé estegosaurio ha rozado las paredes del pasillo con sus placas llenas de barro! Límpialas hasta
          dejarlas impecables.
        de: Das Stegosaurus-Baby hat mit seinen Matschplatten die Wände im Flur gestreift! Wisch sie ab, bis die
          Wände sauber sind.
        it: Il cucciolo di stegosauro ha sfiorato i muri del corridoio con le placche infangate! Puliscili finché
          sono perfetti.
        pt: O bebé estegossauro roçou as paredes do corredor com as placas cheias de lama! Limpa-as até ficarem
          impecáveis.
        br: O bebê estegossauro raspou as paredes do corredor com as placas cheias de lama! Limpe até ficarem impecáveis.
        nl: De babystegosaurus schuurde met zijn modderige platen langs de muren van de gang! Was ze tot de muren
          brandschoon zijn.
      dt_c_couloir_04:
        fr: '@@@session.user.name@@@ a mis du cœur à nettoyer les murs du couloir ! Il reste un peu de boue : le
          bébé stégosaure attendra.'
        en: '@@@session.user.name@@@ put real heart into washing the hallway walls! A bit of mud is left: the baby
          stegosaurus will wait.'
        es: '¡@@@session.user.name@@@ ha puesto mucho cariño en limpiar las paredes del pasillo! Queda algo de barro:
          el bebé estegosaurio esperará.'
        de: '@@@session.user.name@@@ hat die Wände im Flur mit viel Herz geputzt! Ein bisschen Matsch ist noch da:
          Das Stegosaurus-Baby wartet.'
        it: '@@@session.user.name@@@ ha pulito i muri del corridoio con tanto impegno! Resta un po'' di fango: il
          cucciolo di stegosauro aspetterà.'
        pt: '@@@session.user.name@@@ limpou as paredes do corredor com muito carinho! Ainda há um pouco de lama:
          o bebé estegossauro vai esperar.'
        br: '@@@session.user.name@@@ limpou as paredes do corredor com muito carinho! Ainda tem um pouco de lama:
          o bebê estegossauro vai esperar.'
        nl: '@@@session.user.name@@@ heeft de muren van de gang met veel liefde gepoetst! Er zit nog wat modder:
          de babystegosaurus wacht.'
      dt_a_courses_01:
        fr: Le garde-manger est vide et le petit diplodocus a le ventre qui gargouille ! Fais les courses avec la
          liste, jusqu'au dernier article.
        en: The pantry is empty and the little diplodocus's tummy is rumbling! Do the shopping from the list, down
          to the last item.
        es: ¡La despensa está vacía y al pequeño diplodocus le ruge la barriga! Haz la compra con la lista, hasta
          el último artículo.
        de: Die Vorratskammer ist leer und dem kleinen Diplodocus knurrt der Bauch! Geh mit der Liste einkaufen,
          bis zum letzten Artikel.
        it: La dispensa è vuota e al piccolo diplodoco brontola la pancia! Fai la spesa con la lista, fino all'ultimo
          articolo.
        pt: A despensa está vazia e a barriga do pequeno diplódoco já ronca! Faz as compras com a lista, até ao
          último artigo.
        br: A despensa está vazia e a barriga do pequeno diplodoco está roncando! Faça as compras com a lista, até
          o último item.
        nl: De voorraadkast is leeg en het buikje van de kleine diplodocus rommelt! Doe de boodschappen met de lijst,
          tot het laatste ding.
      dt_c_courses_01:
        fr: '@@@session.user.name@@@ a déjà rempli une partie du panier ! Le petit diplodocus attendra le reste
          en grignotant une feuille.'
        en: '@@@session.user.name@@@ already filled part of the basket! The little diplodocus will wait for the
          rest, nibbling a leaf.'
        es: ¡@@@session.user.name@@@ ya ha llenado parte de la cesta! El pequeño diplodocus esperará el resto mordisqueando
          una hoja.
        de: '@@@session.user.name@@@ hat den Korb schon halb gefüllt! Der kleine Diplodocus knabbert ein Blatt und
          wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha già riempito parte del cestino! Il piccolo diplodoco aspetterà il resto
          sgranocchiando una foglia.'
        pt: '@@@session.user.name@@@ já encheu parte do cesto! O pequeno diplódoco espera pelo resto a roer uma
          folhinha.'
        br: '@@@session.user.name@@@ já encheu parte da cesta! O pequeno diplodoco vai esperar o resto mordiscando
          uma folhinha.'
        nl: '@@@session.user.name@@@ heeft het mandje al half gevuld! De kleine diplodocus knabbelt op een blaadje
          en wacht op de rest.'
      dt_a_courses_02:
        fr: 'Les sacs de courses sont trop lourds pour le bébé tricératops ! Aide-le : porte tous les sacs jusqu''à
          la cuisine.'
        en: 'The shopping bags are too heavy for the baby triceratops! Help out: carry all the bags to the kitchen.'
        es: '¡Las bolsas de la compra pesan demasiado para el bebé triceratops! Ayúdale: lleva todas las bolsas
          hasta la cocina.'
        de: 'Die Einkaufstaschen sind zu schwer für das Triceratops-Baby! Hilf ihm: Trag alle Taschen in die Küche.'
        it: 'Le borse della spesa sono troppo pesanti per il cucciolo di triceratopo! Aiutalo: porta tutte le borse
          fino in cucina.'
        pt: 'Os sacos das compras são pesados demais para o bebé tricerátopo! Ajuda-o: leva os sacos todos até à
          cozinha.'
        br: 'As sacolas de compras estão pesadas demais para o bebê tricerátopo! Ajude: leve todas as sacolas até
          a cozinha.'
        nl: 'De boodschappentassen zijn te zwaar voor de babytriceratops! Help hem: draag alle tassen naar de keuken.'
      dt_c_courses_02:
        fr: '@@@session.user.name@@@ a déjà porté plusieurs sacs ! Le bébé tricératops attend à côté des derniers,
          il compte sur toi.'
        en: '@@@session.user.name@@@ already carried several bags! The baby triceratops waits by the last ones,
          counting on you.'
        es: ¡@@@session.user.name@@@ ya ha llevado varias bolsas! El bebé triceratops espera junto a las últimas,
          cuenta contigo.
        de: '@@@session.user.name@@@ hat schon mehrere Taschen getragen! Das Triceratops-Baby wartet bei den letzten
          und zählt auf dich.'
        it: '@@@session.user.name@@@ ha già portato diverse borse! Il cucciolo di triceratopo aspetta vicino alle
          ultime, conta su di te.'
        pt: '@@@session.user.name@@@ já levou vários sacos! O bebé tricerátopo espera ao pé dos últimos, conta contigo.'
        br: '@@@session.user.name@@@ já levou várias sacolas! O bebê tricerátopo espera do lado das últimas, conta
          com você.'
        nl: '@@@session.user.name@@@ heeft al een paar tassen gedragen! De babytriceratops wacht bij de laatste
          en rekent op je.'
      dt_a_courses_03:
        fr: Le petit stégosaure a vidé les sacs de courses sur le plan de travail ! Range chaque article à sa place,
          le frais au frigo.
        en: The little stegosaurus emptied the shopping bags onto the counter! Put each item where it goes, cold
          things in the fridge.
        es: ¡El pequeño estegosaurio ha vaciado las bolsas de la compra en la encimera! Guarda cada cosa en su sitio,
          lo fresco en la nevera.
        de: Der kleine Stegosaurus hat die Einkaufstaschen auf die Arbeitsplatte gekippt! Räum alles ein, Kühles
          in den Kühlschrank.
        it: Il piccolo stegosauro ha svuotato le borse della spesa sul piano di lavoro! Metti ogni cosa al suo posto,
          il fresco in frigo.
        pt: O pequeno estegossauro despejou os sacos das compras na bancada! Arruma cada coisa no lugar, o fresco
          no frigorífico.
        br: O pequeno estegossauro esvaziou as sacolas de compras na bancada! Guarde cada coisa no lugar, o que
          é gelado na geladeira.
        nl: De kleine stegosaurus heeft de boodschappentassen op het aanrecht leeggekiept! Ruim alles op, koude
          dingen in de koelkast.
      dt_c_courses_03:
        fr: '@@@session.user.name@@@ a déjà rangé une bonne partie des courses ! Le petit stégosaure garde le reste
          à l''œil en attendant.'
        en: '@@@session.user.name@@@ already put away a good part of the shopping! The little stegosaurus keeps
          an eye on the rest while it waits.'
        es: ¡@@@session.user.name@@@ ya ha guardado buena parte de la compra! El pequeño estegosaurio vigila el
          resto mientras espera.
        de: '@@@session.user.name@@@ hat schon viel vom Einkauf eingeräumt! Der kleine Stegosaurus passt beim Warten
          auf den Rest auf.'
        it: '@@@session.user.name@@@ ha già sistemato buona parte della spesa! Il piccolo stegosauro tiene d''occhio
          il resto mentre aspetta.'
        pt: '@@@session.user.name@@@ já arrumou boa parte das compras! O pequeno estegossauro fica de olho no resto
          enquanto espera.'
        br: '@@@session.user.name@@@ já guardou boa parte das compras! O pequeno estegossauro fica de olho no resto
          enquanto espera.'
        nl: '@@@session.user.name@@@ heeft al veel boodschappen opgeruimd! De kleine stegosaurus let op de rest
          terwijl hij wacht.'
      dt_a_courses_04:
        fr: 'Le bébé diplodocus ouvre les placards : il ne sait pas ce qui manque ! Regarde les réserves et fais
          la liste des courses complète.'
        en: The baby diplodocus opens the cupboards but doesn't know what's missing! Check the supplies and write
          the full shopping list.
        es: ¡El bebé diplodocus abre la despensa y no sabe qué falta! Mira la despensa y haz la lista de la compra
          completa.
        de: Das Diplodocus-Baby macht die Schränke auf und weiß nicht, was fehlt! Schau die Vorräte durch und schreib
          die ganze Einkaufsliste.
        it: Il cucciolo di diplodoco apre la dispensa e non sa cosa manca! Controlla le scorte e scrivi la lista
          della spesa completa.
        pt: O bebé diplódoco abre a despensa e não sabe o que falta! Vê as provisões e faz a lista de compras completa.
        br: O bebê diplodoco abre a despensa e não sabe o que está faltando! Confira o que tem e faça a lista de
          compras completa.
        nl: De babydiplodocus doet de kastjes open maar weet niet wat er mist! Kijk de voorraad na en maak de hele
          boodschappenlijst.
      dt_c_courses_04:
        fr: '@@@session.user.name@@@ a déjà écrit une bonne partie de la liste ! Le bébé diplodocus attendra pour
          la finir avec toi.'
        en: '@@@session.user.name@@@ already wrote a good part of the list! The baby diplodocus will wait to finish
          it with you.'
        es: ¡@@@session.user.name@@@ ya ha escrito buena parte de la lista! El bebé diplodocus esperará para terminarla
          contigo.
        de: '@@@session.user.name@@@ hat schon einen großen Teil der Liste geschrieben! Das Diplodocus-Baby wartet,
          um sie mit dir fertigzumachen.'
        it: '@@@session.user.name@@@ ha già scritto buona parte della lista! Il cucciolo di diplodoco aspetterà
          per finirla con te.'
        pt: '@@@session.user.name@@@ já escreveu boa parte da lista! O bebé diplódoco vai esperar para a acabar
          contigo.'
        br: '@@@session.user.name@@@ já escreveu boa parte da lista! O bebê diplodoco vai esperar para terminar
          com você.'
        nl: '@@@session.user.name@@@ heeft al een groot deel van de lijst geschreven! De babydiplodocus wacht om
          hem samen af te maken.'
      dt_a_courses_05:
        fr: Oh non, il manque juste une chose, et le petit tricératops la réclame ! File faire une petite course
          pour la rapporter.
        en: Oh no, just one thing is missing, and the little triceratops is asking for it! Pop out on a quick errand
          to fetch it.
        es: ¡Oh, no, falta solo una cosa y el pequeño triceratops la pide! Ve rápido a hacer un recadito para traerla.
        de: Oh nein, nur eine Sache fehlt, und der kleine Triceratops will sie haben! Lauf schnell los und hol sie.
        it: Oh no, manca solo una cosa e il piccolo triceratopo la vuole! Fai una piccola commissione per prenderla.
        pt: Oh não, falta só uma coisa e o pequeno tricerátopo está a pedi-la! Vai num instante fazer um recado
          para a trazer.
        br: Ah não, falta só uma coisa e o pequeno tricerátopo está pedindo! Dê uma corridinha para comprar.
        nl: O nee, er mist nog één ding en de kleine triceratops wil het hebben! Ga snel even een boodschapje doen.
      dt_c_courses_05:
        fr: '@@@session.user.name@@@ est bien parti pour la petite course ! Le petit tricératops attend à la porte,
          il patientera.'
        en: '@@@session.user.name@@@ made a good start on the errand! The little triceratops waits at the door,
          it can be patient.'
        es: ¡@@@session.user.name@@@ ha empezado bien el recadito! El pequeño triceratops espera en la puerta, tendrá
          paciencia.
        de: '@@@session.user.name@@@ ist gut losgelaufen! Der kleine Triceratops wartet geduldig an der Tür.'
        it: '@@@session.user.name@@@ è partito bene per la commissione! Il piccolo triceratopo aspetta alla porta,
          avrà pazienza.'
        pt: '@@@session.user.name@@@ começou bem o recado! O pequeno tricerátopo espera à porta, vai ter paciência.'
        br: '@@@session.user.name@@@ começou bem a comprinha! O pequeno tricerátopo espera na porta, vai ter paciência.'
        nl: '@@@session.user.name@@@ is goed op weg met het boodschapje! De kleine triceratops wacht geduldig bij
          de deur.'
      dt_a_cuisine_01:
        fr: Le bébé tricératops a semé des miettes et de la poussière dans toute la cuisine ! Passe l'aspirateur
          ou le balai partout, même dans les coins.
        en: The baby triceratops scattered crumbs and dust all over the kitchen! Vacuum or sweep everywhere, corners
          too.
        es: ¡El bebé triceratops ha dejado migas y polvo por toda la cocina! Pasa la aspiradora o la escoba por
          todo, rincones incluidos.
        de: Das Triceratops-Baby hat in der ganzen Küche Krümel und Staub verteilt! Saug oder feg überall, auch
          in den Ecken.
        it: Il cucciolo di triceratopo ha sparso briciole e polvere in tutta la cucina! Passa l'aspirapolvere o
          la scopa ovunque, anche negli angoli.
        pt: O bebé tricerátopo espalhou migalhas e pó pela cozinha toda! Aspira ou varre tudo, até os cantinhos.
        br: O bebê tricerátopo espalhou farelos e poeira pela cozinha toda! Aspire ou varra tudo, até os cantinhos.
        nl: De babytriceratops heeft overal in de keuken kruimels en stof gestrooid! Stofzuig of veeg overal, ook
          in de hoekjes.
      dt_c_cuisine_01:
        fr: '@@@session.user.name@@@ a déjà ramassé plein de miettes dans la cuisine ! Le bébé tricératops attendra
          pour les derniers coins.'
        en: '@@@session.user.name@@@ already picked up lots of crumbs in the kitchen! The baby triceratops will
          wait for the last corners.'
        es: ¡@@@session.user.name@@@ ya ha recogido muchas migas de la cocina! El bebé triceratops esperará los
          últimos rincones.
        de: '@@@session.user.name@@@ hat in der Küche schon viele Krümel weggemacht! Das Triceratops-Baby wartet
          auf die letzten Ecken.'
        it: '@@@session.user.name@@@ ha già tolto tante briciole dalla cucina! Il cucciolo di triceratopo aspetterà
          gli ultimi angoli.'
        pt: '@@@session.user.name@@@ já apanhou muitas migalhas na cozinha! O bebé tricerátopo vai esperar pelos
          últimos cantinhos.'
        br: '@@@session.user.name@@@ já recolheu um monte de farelos na cozinha! O bebê tricerátopo vai esperar
          os últimos cantinhos.'
        nl: '@@@session.user.name@@@ heeft al veel kruimels in de keuken opgeruimd! De babytriceratops wacht op
          de laatste hoekjes.'
      dt_a_cuisine_03:
        fr: 'Le petit stégosaure a renversé du miel par terre : le sol de la cuisine colle à ses pattes ! Passe
          la serpillière jusqu''à ce qu''il brille.'
        en: The little stegosaurus spilled honey and the kitchen floor sticks to its feet! Mop until it shines,
          with no sticky spots.
        es: ¡El pequeño estegosaurio ha derramado miel y el suelo de la cocina se le pega a las patas! Friega hasta
          que brille.
        de: Der kleine Stegosaurus hat Honig verschüttet, jetzt klebt der Küchenboden an seinen Füßen! Wisch, bis
          alles glänzt.
        it: Il piccolo stegosauro ha rovesciato il miele e il pavimento della cucina gli appiccica alle zampe! Passa
          lo straccio finché brilla.
        pt: O pequeno estegossauro entornou mel e o chão da cozinha cola-se às patas! Passa a esfregona até brilhar.
        br: O pequeno estegossauro derramou mel e o chão da cozinha está grudando nas patas! Passe pano até brilhar.
        nl: De kleine stegosaurus heeft honing gemorst en de keukenvloer plakt aan zijn poten! Dweil tot het glanst.
      dt_c_cuisine_03:
        fr: '@@@session.user.name@@@ a déjà décollé presque tout le miel ! Le petit stégosaure attend sur une patte,
          il patientera.'
        en: '@@@session.user.name@@@ already cleaned up almost all the honey! The little stegosaurus waits on one
          foot, it can be patient.'
        es: ¡@@@session.user.name@@@ ya ha quitado casi toda la miel! El pequeño estegosaurio espera a la pata coja,
          tendrá paciencia.
        de: '@@@session.user.name@@@ hat schon fast den ganzen Honig weggewischt! Der kleine Stegosaurus wartet
          geduldig auf einem Bein.'
        it: '@@@session.user.name@@@ ha già tolto quasi tutto il miele! Il piccolo stegosauro aspetta su una zampa
          sola, avrà pazienza.'
        pt: '@@@session.user.name@@@ já limpou quase todo o mel! O pequeno estegossauro espera ao pé-coxinho, vai
          ter paciência.'
        br: '@@@session.user.name@@@ já limpou quase todo o mel! O pequeno estegossauro espera num pé só, vai ter
          paciência.'
        nl: '@@@session.user.name@@@ heeft al bijna alle honing opgedweild! De kleine stegosaurus wacht geduldig
          op één poot.'
      dt_a_cuisine_04:
        fr: Le bébé diplodocus a léché les vitres de la cuisine pour goûter la pluie ! Nettoie-les jusqu'à ce qu'elles
          soient transparentes.
        en: The baby diplodocus licked the kitchen windows to taste the rain! Clean them until they're perfectly
          clear.
        es: ¡El bebé diplodocus ha lamido los cristales de la cocina para probar la lluvia! Límpialos hasta que
          estén transparentes.
        de: Das Diplodocus-Baby hat die Küchenfenster abgeschleckt, um den Regen zu probieren! Putz sie, bis sie
          ganz klar sind.
        it: Il cucciolo di diplodoco ha leccato i vetri della cucina per assaggiare la pioggia! Puliscili finché
          sono trasparenti.
        pt: O bebé diplódoco lambeu os vidros da cozinha para provar a chuva! Limpa-os até ficarem transparentes.
        br: O bebê diplodoco lambeu os vidros da cozinha para provar a chuva! Limpe até ficarem transparentes.
        nl: De babydiplodocus likte aan de keukenramen om de regen te proeven! Poets ze tot ze helemaal doorzichtig
          zijn.
      dt_c_cuisine_04:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie des vitres ! Le bébé diplodocus attendra, la
          langue bien rangée.'
        en: '@@@session.user.name@@@ already made some of the windows shine! The baby diplodocus will wait, tongue
          tucked away.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte de los cristales! El bebé diplodocus esperará con
          la lengua guardadita.
        de: '@@@session.user.name@@@ hat schon einen Teil der Fenster blank geputzt! Das Diplodocus-Baby wartet,
          die Zunge brav im Mund.'
        it: '@@@session.user.name@@@ ha già fatto brillare parte dei vetri! Il cucciolo di diplodoco aspetterà,
          con la lingua al suo posto.'
        pt: '@@@session.user.name@@@ já pôs parte dos vidros a brilhar! O bebé diplódoco vai esperar, com a língua
          guardadinha.'
        br: '@@@session.user.name@@@ já deixou parte dos vidros brilhando! O bebê diplodoco vai esperar, com a língua
          guardadinha.'
        nl: '@@@session.user.name@@@ heeft al een deel van de ramen laten glanzen! De babydiplodocus wacht, met
          zijn tong netjes binnen.'
      dt_a_cuisine_05:
        fr: 'Le petit tricératops a pétri de la pâte sur le plan de travail : c''est plein de miettes et de gras
          ! Nettoie jusqu''à une surface nette.'
        en: 'The little triceratops kneaded dough on the counter: it''s full of crumbs and grease! Clean until the
          surface is spotless.'
        es: ¡El pequeño triceratops ha amasado en la encimera y está llena de migas y grasa! Limpia hasta dejarla
          impecable.
        de: 'Der kleine Triceratops hat auf der Arbeitsplatte Teig geknetet: überall Krümel und Fett! Putz, bis
          sie ganz sauber ist.'
        it: 'Il piccolo triceratopo ha impastato sul piano di lavoro: è pieno di briciole e unto! Pulisci finché
          è perfetto.'
        pt: 'O pequeno tricerátopo amassou massa na bancada: está cheia de migalhas e gordura! Limpa até ficar impecável.'
        br: 'O pequeno tricerátopo sovou massa na bancada: está cheia de farelos e gordura! Limpe até ficar impecável.'
        nl: 'De kleine triceratops heeft deeg gekneed op het aanrecht: overal kruimels en vet! Maak schoon tot het
          blad netjes is.'
      dt_c_cuisine_05:
        fr: '@@@session.user.name@@@ a déjà bien frotté le plan de travail ! Le petit tricératops garde ses pattes
          pleines de pâte et attend.'
        en: '@@@session.user.name@@@ already gave the counter a good scrub! The little triceratops keeps its doughy
          paws still and waits.'
        es: ¡@@@session.user.name@@@ ya ha frotado bien la encimera! El pequeño triceratops deja quietas sus patas
          con masa y espera.
        de: '@@@session.user.name@@@ hat die Arbeitsplatte schon gut geschrubbt! Der kleine Triceratops hält die
          Teigpfoten still und wartet.'
        it: '@@@session.user.name@@@ ha già strofinato bene il piano di lavoro! Il piccolo triceratopo tiene ferme
          le zampe impastate e aspetta.'
        pt: '@@@session.user.name@@@ já esfregou bem a bancada! O pequeno tricerátopo fica quieto com as patas cheias
          de massa e espera.'
        br: '@@@session.user.name@@@ já esfregou bem a bancada! O pequeno tricerátopo fica quietinho com as patas
          cheias de massa e espera.'
        nl: '@@@session.user.name@@@ heeft het aanrecht al flink geschrobd! De kleine triceratops houdt zijn deegpootjes
          stil en wacht.'
      dt_a_cuisine_06:
        fr: 'Le bébé ankylosaure a voulu prendre son bain dans l''évier : il est plein de traces blanches et gluantes
          ! Récure jusqu''à un évier brillant.'
        en: 'The baby ankylosaurus tried to take a bath in the sink: it''s full of white, gooey marks! Scrub until
          the sink shines.'
        es: ¡El bebé anquilosaurio ha querido bañarse en el fregadero y está lleno de marcas blancas y pegajosas!
          Frota hasta que brille.
        de: 'Das Ankylosaurus-Baby wollte in der Spüle baden: Jetzt ist sie voller weißer, klebriger Flecken! Schrubb,
          bis sie glänzt.'
        it: 'Il cucciolo di anchilosauro ha voluto fare il bagno nel lavello: è pieno di segni bianchi e appiccicosi!
          Strofina finché brilla.'
        pt: 'O bebé anquilossauro quis tomar banho na banca da cozinha: está cheio de marcas brancas e pegajosas!
          Esfrega até brilhar.'
        br: 'O bebê anquilossauro quis tomar banho na pia: ela está cheia de marcas brancas e grudentas! Esfregue
          até brilhar.'
        nl: 'De babyankylosaurus wilde in de gootsteen in bad: nu zit hij vol witte, kleverige vlekken! Schrob tot
          hij glanst.'
      dt_c_cuisine_06:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie de l''évier ! Le bébé ankylosaure attendra,
          sans y remettre les pattes.'
        en: '@@@session.user.name@@@ already made part of the sink shine! The baby ankylosaurus will wait and keep
          its paws out.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte del fregadero! El bebé anquilosaurio esperará sin
          meter las patas.
        de: '@@@session.user.name@@@ hat einen Teil der Spüle schon blank geputzt! Das Ankylosaurus-Baby wartet
          und lässt die Pfoten draußen.'
        it: '@@@session.user.name@@@ ha già fatto brillare parte del lavello! Il cucciolo di anchilosauro aspetterà
          senza rimetterci le zampe.'
        pt: '@@@session.user.name@@@ já pôs parte da banca da cozinha a brilhar! O bebé anquilossauro vai esperar
          sem lá meter as patas.'
        br: '@@@session.user.name@@@ já deixou parte da pia brilhando! O bebê anquilossauro vai esperar sem pôr
          as patas lá dentro.'
        nl: '@@@session.user.name@@@ heeft al een deel van de gootsteen laten glanzen! De babyankylosaurus wacht
          en houdt zijn poten eruit.'
      dt_a_cuisine_07:
        fr: Le petit iguanodon a ouvert tous les placards avec ses pattes pleines de beurre ! Nettoie portes et
          poignées jusqu'à ce qu'elles soient nettes.
        en: The little iguanodon opened every cupboard with buttery paws! Clean the doors and handles until they're
          spotless.
        es: ¡El pequeño iguanodonte ha abierto todos los muebles de la cocina con las patas llenas de mantequilla!
          Limpia puertas y tiradores.
        de: Der kleine Iguanodon hat alle Küchenschränke mit Butterpfoten aufgemacht! Putz Türen und Griffe, bis
          sie sauber sind.
        it: Il piccolo iguanodonte ha aperto tutti i pensili con le zampe piene di burro! Pulisci ante e maniglie
          finché sono pulite.
        pt: O pequeno iguanodonte abriu todos os móveis da cozinha com as patas cheias de manteiga! Limpa portas
          e puxadores.
        br: O pequeno iguanodonte abriu todos os móveis da cozinha com as patas cheias de manteiga! Limpe portas
          e puxadores.
        nl: De kleine iguanodon heeft alle keukenkastjes geopend met boterpootjes! Poets deurtjes en handgrepen
          tot ze schoon zijn.
      dt_c_cuisine_07:
        fr: '@@@session.user.name@@@ a déjà nettoyé plusieurs portes de placard ! Le petit iguanodon attendra, les
          pattes bien essuyées.'
        en: '@@@session.user.name@@@ already cleaned several cupboard doors! The little iguanodon will wait with
          nicely wiped paws.'
        es: ¡@@@session.user.name@@@ ya ha limpiado varias puertas! El pequeño iguanodonte esperará con las patas
          bien secas.
        de: '@@@session.user.name@@@ hat schon mehrere Schranktüren geputzt! Der kleine Iguanodon wartet mit sauber
          abgewischten Pfoten.'
        it: '@@@session.user.name@@@ ha già pulito diverse ante! Il piccolo iguanodonte aspetterà con le zampe ben
          pulite.'
        pt: '@@@session.user.name@@@ já limpou várias portas dos móveis! O pequeno iguanodonte vai esperar com as
          patas bem limpinhas.'
        br: '@@@session.user.name@@@ já limpou várias portas dos móveis! O pequeno iguanodonte vai esperar com as
          patas bem limpinhas.'
        nl: '@@@session.user.name@@@ heeft al een paar kastdeurtjes gepoetst! De kleine iguanodon wacht met netjes
          afgeveegde poten.'
      dt_a_cuisine_08:
        fr: Le bébé tricératops a trouvé de vieux restes tout au fond du frigo, et ils sentent drôle ! Trie et jette
          ce qui est périmé.
        en: The baby triceratops found old leftovers at the back of the fridge, and they smell funny! Sort them
          and throw out what's expired.
        es: ¡El bebé triceratops ha encontrado sobras viejas al fondo de la nevera y huelen raro! Ordénalas y tira
          lo caducado.
        de: Das Triceratops-Baby hat hinten im Kühlschrank alte Reste gefunden, die komisch riechen! Sortier sie
          und wirf Abgelaufenes weg.
        it: Il cucciolo di triceratopo ha trovato vecchi avanzi in fondo al frigo, e hanno un odore strano! Smistali
          e butta ciò che è scaduto.
        pt: O bebé tricerátopo encontrou restos velhos no fundo do frigorífico, e cheiram esquisito! Separa e deita
          fora o que passou do prazo.
        br: O bebê tricerátopo achou restos velhos no fundo da geladeira, e estão com cheiro esquisito! Separe e
          jogue fora o que venceu.
        nl: De babytriceratops vond oude restjes achterin de koelkast, en ze ruiken raar! Sorteer ze en gooi weg
          wat over datum is.
      dt_c_cuisine_08:
        fr: '@@@session.user.name@@@ a déjà trié une partie des restes ! Le bébé tricératops se pince le nez et
          attend la suite.'
        en: '@@@session.user.name@@@ already sorted some of the leftovers! The baby triceratops pinches its nose
          and waits for the rest.'
        es: ¡@@@session.user.name@@@ ya ha ordenado parte de las sobras! El bebé triceratops se tapa la nariz y
          espera el resto.
        de: '@@@session.user.name@@@ hat schon einen Teil der Reste sortiert! Das Triceratops-Baby hält sich die
          Nase zu und wartet.'
        it: '@@@session.user.name@@@ ha già smistato parte degli avanzi! Il cucciolo di triceratopo si tappa il
          naso e aspetta il resto.'
        pt: '@@@session.user.name@@@ já separou parte dos restos! O bebé tricerátopo tapa o nariz e espera pelo
          resto.'
        br: '@@@session.user.name@@@ já separou parte dos restos! O bebê tricerátopo tapa o nariz e espera o resto.'
        nl: '@@@session.user.name@@@ heeft al een deel van de restjes gesorteerd! De babytriceratops knijpt zijn
          neus dicht en wacht.'
      dt_a_cuisine_09:
        fr: 'Le petit stégosaure a fait exploser sa soupe de fougères dans le micro-ondes : ça a giclé partout !
          Nettoie l''intérieur jusqu''à ce qu''il soit propre et sans odeur.'
        en: The little stegosaurus's fern soup splattered all over the microwave! Clean the inside until it's spotless
          and smells fresh.
        es: ¡La sopa de helechos del pequeño estegosaurio ha salpicado todo el microondas! Limpia el interior hasta
          que esté limpio y sin olor.
        de: Die Farnsuppe vom kleinen Stegosaurus ist in der Mikrowelle übergespritzt! Putz innen, bis alles sauber
          ist und nicht mehr riecht.
        it: La zuppa di felci del piccolo stegosauro è schizzata dappertutto nel microonde! Pulisci l'interno finché
          è pulito e senza odori.
        pt: A sopa de fetos do pequeno estegossauro salpicou o micro-ondas todo! Limpa o interior até ficar limpo
          e sem cheiro.
        br: A sopa de samambaia do pequeno estegossauro espirrou no micro-ondas todo! Limpe o interior até ficar
          limpo e sem cheiro.
        nl: De varensoep van de kleine stegosaurus is door de hele magnetron gespat! Maak de binnenkant schoon tot
          hij fris ruikt.
      dt_c_cuisine_09:
        fr: '@@@session.user.name@@@ a déjà décollé plein d''éclaboussures ! Le petit stégosaure attendra la fin
          pour réchauffer sa soupe.'
        en: '@@@session.user.name@@@ already scraped off lots of splatters! The little stegosaurus will wait to
          heat up its soup.'
        es: ¡@@@session.user.name@@@ ya ha quitado muchas salpicaduras! El pequeño estegosaurio esperará para calentar
          su sopa.
        de: '@@@session.user.name@@@ hat schon viele Spritzer weggemacht! Der kleine Stegosaurus wartet mit dem
          Aufwärmen seiner Suppe.'
        it: '@@@session.user.name@@@ ha già tolto tanti schizzi! Il piccolo stegosauro aspetterà la fine per scaldare
          la zuppa.'
        pt: '@@@session.user.name@@@ já tirou muitos salpicos! O pequeno estegossauro espera pelo fim para aquecer
          a sopa.'
        br: '@@@session.user.name@@@ já tirou um monte de respingos! O pequeno estegossauro vai esperar para esquentar
          a sopa.'
        nl: '@@@session.user.name@@@ heeft al veel spetters weggepoetst! De kleine stegosaurus wacht met het opwarmen
          van zijn soep.'
      dt_a_cuisine_10:
        fr: 'Le bébé brachiosaure a passé son long cou dans la hotte : elle est toute grasse ! Nettoie les filtres
          et la hotte jusqu''à ce qu''il n''y ait plus de gras.'
        en: 'The baby brachiosaurus stuck its long neck into the cooker hood: it''s all greasy! Clean the filters
          and hood until the grease is gone.'
        es: '¡El bebé braquiosaurio ha metido su largo cuello en la campana: está llena de grasa! Limpia los filtros
          y la campana hasta quitarla toda.'
        de: 'Das Brachiosaurus-Baby hat seinen langen Hals in die Dunstabzugshaube gesteckt: alles fettig! Putz
          Filter und Haube, bis kein Fett mehr da ist.'
        it: 'Il cucciolo di brachiosauro ha infilato il collo lungo nella cappa: è tutta unta! Pulisci filtri e
          cappa finché l''unto sparisce.'
        pt: 'O bebé braquiossauro meteu o pescoço comprido no exaustor: está todo engordurado! Limpa os filtros
          e o exaustor até sair a gordura.'
        br: 'O bebê braquiossauro enfiou o pescoço comprido na coifa: está toda engordurada! Limpe os filtros e
          a coifa até sair a gordura.'
        nl: 'De babybrachiosaurus stak zijn lange nek in de afzuigkap: alles is vettig! Maak de filters en de kap
          schoon tot het vet weg is.'
      dt_c_cuisine_10:
        fr: '@@@session.user.name@@@ a déjà enlevé une bonne partie du gras de la hotte ! Le bébé brachiosaure attendra,
          le cou bien droit.'
        en: '@@@session.user.name@@@ already removed a good part of the grease from the hood! The baby brachiosaurus
          will wait, neck nice and straight.'
        es: ¡@@@session.user.name@@@ ya ha quitado buena parte de la grasa de la campana! El bebé braquiosaurio
          esperará con el cuello bien recto.
        de: '@@@session.user.name@@@ hat schon viel Fett von der Haube geholt! Das Brachiosaurus-Baby wartet mit
          schön geradem Hals.'
        it: '@@@session.user.name@@@ ha già tolto buona parte dell''unto dalla cappa! Il cucciolo di brachiosauro
          aspetterà col collo dritto.'
        pt: '@@@session.user.name@@@ já tirou boa parte da gordura do exaustor! O bebé braquiossauro vai esperar
          de pescoço direitinho.'
        br: '@@@session.user.name@@@ já tirou boa parte da gordura da coifa! O bebê braquiossauro vai esperar com
          o pescoço bem retinho.'
        nl: '@@@session.user.name@@@ heeft al veel vet van de kap gehaald! De babybrachiosaurus wacht met een mooi
          rechte nek.'
      dt_a_cuisine_11:
        fr: 'Le petit T. rex a fait cuire un gâteau qui a débordé : l''intérieur du four est tout noirci ! Récure
          jusqu''à un four propre, sans dépôt brûlé.'
        en: 'The little T. rex baked a cake that overflowed: the inside of the oven is all black! Scrub until the
          oven is clean, with no burnt bits.'
        es: ¡El pequeño T. rex ha hecho un pastel que se ha desbordado y el interior del horno está negro! Frota
          hasta que quede limpio, sin restos quemados.
        de: 'Der kleine T. rex hat einen Kuchen gebacken, der übergelaufen ist: Der Ofen ist innen ganz schwarz!
          Schrubb, bis nichts Angebranntes mehr da ist.'
        it: 'Il piccolo T. rex ha cotto una torta che è traboccata: l''interno del forno è tutto annerito! Strofina
          finché è pulito, senza bruciature.'
        pt: 'O pequeno T. rex fez um bolo que transbordou: o interior do forno ficou todo negro! Esfrega até ficar
          limpo, sem restos queimados.'
        br: 'O pequeno T. rex fez um bolo que transbordou: o forno ficou todo preto por dentro! Esfregue até ficar
          limpo, sem restos queimados.'
        nl: 'De kleine T. rex bakte een taart die overliep: de oven is vanbinnen helemaal zwart! Schrob tot hij
          schoon is, zonder aangebrande resten.'
      dt_c_cuisine_11:
        fr: '@@@session.user.name@@@ a déjà bien récuré le four ! Le petit T. rex, un peu penaud, attendra avant
          son prochain gâteau.'
        en: '@@@session.user.name@@@ already scrubbed the oven nicely! The little T. rex, a bit sheepish, will wait
          before its next cake.'
        es: ¡@@@session.user.name@@@ ya ha frotado bien el horno! El pequeño T. rex, algo avergonzado, esperará
          antes de su próximo pastel.
        de: '@@@session.user.name@@@ hat den Ofen schon gut geschrubbt! Der kleine T. rex wartet etwas verlegen
          mit dem nächsten Kuchen.'
        it: '@@@session.user.name@@@ ha già strofinato bene il forno! Il piccolo T. rex, un po'' imbarazzato, aspetterà
          prima della prossima torta.'
        pt: '@@@session.user.name@@@ já esfregou bem o forno! O pequeno T. rex, meio envergonhado, espera antes
          do próximo bolo.'
        br: '@@@session.user.name@@@ já esfregou bem o forno! O pequeno T. rex, meio sem graça, vai esperar antes
          do próximo bolo.'
        nl: '@@@session.user.name@@@ heeft de oven al flink geschrobd! De kleine T. rex wacht een beetje beschaamd
          met zijn volgende taart.'
      dt_a_cuisine_12:
        fr: 'Le bébé diplodocus a fait déborder sa purée de baies sur la plaque de cuisson : elle est toute croûtée
          ! Nettoie jusqu''à une plaque brillante.'
        en: 'The baby diplodocus let its berry mash boil over on the hob: it''s all crusty! Clean until the hob
          shines.'
        es: ¡Al bebé diplodocus se le ha desbordado el puré de bayas en la placa y está llena de costras! Limpia
          hasta que brille.
        de: 'Der Beerenbrei vom Diplodocus-Baby ist auf dem Kochfeld übergekocht: alles verkrustet! Putz, bis das
          Kochfeld glänzt.'
        it: 'Al cucciolo di diplodoco è traboccata la purea di bacche sul piano cottura: è tutto incrostato! Pulisci
          finché brilla.'
        pt: 'O puré de bagas do bebé diplódoco transbordou na placa: está cheia de crostas! Limpa até a placa brilhar.'
        br: 'O purê de frutinhas do bebê diplodoco transbordou no fogão: está todo grudado! Limpe até o fogão brilhar.'
        nl: 'De bessenpuree van de babydiplodocus kookte over op de kookplaat: alles zit vastgekoekt! Poets tot
          de kookplaat glanst.'
      dt_c_cuisine_12:
        fr: '@@@session.user.name@@@ a déjà décollé plein de croûtes ! Le bébé diplodocus attendra, sa purée bien
          au frais.'
        en: '@@@session.user.name@@@ already scraped off lots of crusty bits! The baby diplodocus will wait, its
          mash safely cooling.'
        es: ¡@@@session.user.name@@@ ya ha quitado muchas costras! El bebé diplodocus esperará con su puré bien
          fresquito.
        de: '@@@session.user.name@@@ hat schon viele Krusten abgelöst! Das Diplodocus-Baby wartet, der Brei kühlt
          derweil ab.'
        it: '@@@session.user.name@@@ ha già tolto tante incrostazioni! Il cucciolo di diplodoco aspetterà, con la
          purea al fresco.'
        pt: '@@@session.user.name@@@ já tirou muitas crostas! O bebé diplódoco vai esperar, com o puré a arrefecer.'
        br: '@@@session.user.name@@@ já tirou um monte de crostas! O bebê diplodoco vai esperar, com o purê esfriando.'
        nl: '@@@session.user.name@@@ heeft al veel aangekoekte stukjes weggehaald! De babydiplodocus wacht terwijl
          zijn puree afkoelt.'
      dt_a_cuisine_13:
        fr: 'Le petit tricératops a ouvert le réfrigérateur : des restes oubliés et des taches de moisi lui font
          froncer le nez ! Vide, nettoie et désinfecte l''intérieur.'
        en: 'The little triceratops opened the fridge: forgotten leftovers and mouldy spots make it wrinkle its
          nose! Empty, clean and disinfect the inside.'
        es: '¡El pequeño triceratops ha abierto la nevera: sobras olvidadas y moho le hacen arrugar la nariz! Vacía,
          limpia y desinfecta el interior.'
        de: 'Der kleine Triceratops hat den Kühlschrank aufgemacht: vergessene Reste und Schimmel lassen ihn die
          Nase rümpfen! Leer, putz und desinfizier ihn innen.'
        it: 'Il piccolo triceratopo ha aperto il frigorifero: avanzi dimenticati e muffa gli fanno arricciare il
          naso! Svuota, pulisci e disinfetta l''interno.'
        pt: 'O pequeno tricerátopo abriu o frigorífico: restos esquecidos e bolor fazem-no franzir o nariz! Esvazia,
          limpa e desinfeta o interior.'
        br: 'O pequeno tricerátopo abriu a geladeira: restos esquecidos e mofo fazem ele torcer o nariz! Esvazie,
          limpe e desinfete o interior.'
        nl: 'De kleine triceratops deed de koelkast open: vergeten restjes en schimmel laten hem zijn neus optrekken!
          Leeg, poets en ontsmet de binnenkant.'
      dt_c_cuisine_13:
        fr: '@@@session.user.name@@@ a déjà vidé et nettoyé une partie du réfrigérateur ! Le petit tricératops attendra
          pour les dernières étagères.'
        en: '@@@session.user.name@@@ already emptied and cleaned part of the fridge! The little triceratops will
          wait for the last shelves.'
        es: ¡@@@session.user.name@@@ ya ha vaciado y limpiado parte de la nevera! El pequeño triceratops esperará
          las últimas baldas.
        de: '@@@session.user.name@@@ hat einen Teil vom Kühlschrank schon ausgeräumt und geputzt! Der kleine Triceratops
          wartet auf die letzten Fächer.'
        it: '@@@session.user.name@@@ ha già svuotato e pulito parte del frigorifero! Il piccolo triceratopo aspetterà
          gli ultimi ripiani.'
        pt: '@@@session.user.name@@@ já esvaziou e limpou parte do frigorífico! O pequeno tricerátopo vai esperar
          pelas últimas prateleiras.'
        br: '@@@session.user.name@@@ já esvaziou e limpou parte da geladeira! O pequeno tricerátopo vai esperar
          as últimas prateleiras.'
        nl: '@@@session.user.name@@@ heeft een deel van de koelkast al leeggehaald en gepoetst! De kleine triceratops
          wacht op de laatste planken.'
      dt_a_cuisine_15:
        fr: Le bébé stégosaure voulait une tisane, mais la bouilloire ou la cafetière est pleine de calcaire ! Détartre-la
          jusqu'à un intérieur propre.
        en: The baby stegosaurus wanted a herbal tea, but the kettle or coffee maker is full of limescale! Descale
          it until the inside is clean.
        es: ¡El bebé estegosaurio quería una infusión, pero el hervidor o la cafetera está lleno de cal! Descalcifícalo
          hasta que quede limpio por dentro.
        de: Das Stegosaurus-Baby wollte Tee, aber Wasserkocher oder Kaffeemaschine ist voller Kalk! Entkalke, bis
          innen alles sauber ist.
        it: Il cucciolo di stegosauro voleva una tisana, ma il bollitore o la caffettiera è pieno di calcare! Togli
          il calcare finché è pulito dentro.
        pt: O bebé estegossauro queria um chá, mas a chaleira ou a cafeteira está cheia de calcário! Tira o calcário
          até ficar limpa por dentro.
        br: O bebê estegossauro queria um chazinho, mas a chaleira ou a cafeteira está cheia de calcário! Tire o
          calcário até ficar limpa por dentro.
        nl: De babystegosaurus wilde thee, maar de waterkoker of het koffiezetapparaat zit vol kalk! Ontkalk tot
          de binnenkant schoon is.
      dt_c_cuisine_15:
        fr: '@@@session.user.name@@@ a déjà fait fondre une bonne partie du calcaire ! Le bébé stégosaure attendra
          sa tisane, sa tasse à la patte.'
        en: '@@@session.user.name@@@ already dissolved a good part of the limescale! The baby stegosaurus will wait
          for its tea, cup in paw.'
        es: ¡@@@session.user.name@@@ ya ha quitado buena parte de la cal! El bebé estegosaurio esperará su infusión,
          con la taza en la pata.
        de: '@@@session.user.name@@@ hat schon viel Kalk gelöst! Das Stegosaurus-Baby wartet auf seinen Tee, die
          Tasse in der Pfote.'
        it: '@@@session.user.name@@@ ha già sciolto buona parte del calcare! Il cucciolo di stegosauro aspetterà
          la tisana, tazza in zampa.'
        pt: '@@@session.user.name@@@ já tirou boa parte do calcário! O bebé estegossauro espera pelo chá, de chávena
          na pata.'
        br: '@@@session.user.name@@@ já tirou boa parte do calcário! O bebê estegossauro vai esperar o chazinho,
          com a xícara na pata.'
        nl: '@@@session.user.name@@@ heeft al veel kalk opgelost! De babystegosaurus wacht op zijn thee, met het
          kopje in zijn poot.'
      dt_a_cuisine_18:
        fr: Le petit iguanodon ne se voit plus dans le robinet de la cuisine, tout couvert de traces blanches !
          Détartre-le jusqu'à ce qu'il brille.
        en: The little iguanodon can't see itself in the kitchen tap anymore, it's covered in white marks! Descale
          it until it shines.
        es: ¡El pequeño iguanodonte ya no se ve en el grifo de la cocina, lleno de marcas blancas! Quítale la cal
          hasta que brille.
        de: Der kleine Iguanodon sieht sich nicht mehr im Küchenwasserhahn, der voller weißer Flecken ist! Entkalke
          ihn, bis er glänzt.
        it: Il piccolo iguanodonte non si specchia più nel rubinetto della cucina, pieno di segni bianchi! Togli
          il calcare finché brilla.
        pt: O pequeno iguanodonte já não se vê na torneira da cozinha, cheia de marcas brancas! Tira o calcário
          até brilhar.
        br: O pequeno iguanodonte não se enxerga mais na torneira da cozinha, cheia de marcas brancas! Tire o calcário
          até brilhar.
        nl: De kleine iguanodon ziet zichzelf niet meer in de keukenkraan, die vol witte vlekken zit! Ontkalk tot
          hij glanst.
      dt_c_cuisine_18:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie du robinet ! Le petit iguanodon y voit déjà
          son museau, il attendra le reste.'
        en: '@@@session.user.name@@@ already made part of the tap shine! The little iguanodon can see its snout
          now, it will wait for the rest.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte del grifo! El pequeño iguanodonte ya ve su hocico,
          esperará el resto.
        de: '@@@session.user.name@@@ hat den Wasserhahn schon teilweise blank geputzt! Der kleine Iguanodon sieht
          seine Schnauze und wartet.'
        it: '@@@session.user.name@@@ ha già fatto brillare parte del rubinetto! Il piccolo iguanodonte ci vede il
          muso, aspetterà il resto.'
        pt: '@@@session.user.name@@@ já pôs parte da torneira a brilhar! O pequeno iguanodonte já vê o focinho,
          vai esperar pelo resto.'
        br: '@@@session.user.name@@@ já deixou parte da torneira brilhando! O pequeno iguanodonte já vê o focinho,
          vai esperar o resto.'
        nl: '@@@session.user.name@@@ heeft de kraan al deels laten glanzen! De kleine iguanodon ziet zijn snuitje
          al en wacht op de rest.'
      dt_a_cuisine_19:
        fr: Le bébé tricératops a fait des câlins au réfrigérateur avec ses pattes pleines de confiture ! Nettoie
          portes et poignées jusqu'à ce que ce soit net.
        en: The baby triceratops hugged the fridge with jammy paws! Clean the doors and handles until they're spotless.
        es: ¡El bebé triceratops ha abrazado la nevera con las patas llenas de mermelada! Limpia puertas y tiradores
          hasta dejarlos impecables.
        de: Das Triceratops-Baby hat den Kühlschrank mit Marmeladenpfoten umarmt! Putz Türen und Griffe, bis sie
          sauber sind.
        it: Il cucciolo di triceratopo ha abbracciato il frigorifero con le zampe piene di marmellata! Pulisci sportelli
          e maniglie finché sono puliti.
        pt: O bebé tricerátopo abraçou o frigorífico com as patas cheias de compota! Limpa portas e puxadores até
          ficarem impecáveis.
        br: O bebê tricerátopo abraçou a geladeira com as patas cheias de geleia! Limpe portas e puxadores até ficarem
          impecáveis.
        nl: De babytriceratops heeft de koelkast geknuffeld met jampootjes! Poets deuren en handgrepen tot ze schoon
          zijn.
      dt_c_cuisine_19:
        fr: '@@@session.user.name@@@ a déjà effacé plein de traces de câlins ! Le bébé tricératops attendra pour
          en refaire, promis.'
        en: '@@@session.user.name@@@ already wiped off lots of hug marks! The baby triceratops will wait before
          hugging again, promise.'
        es: ¡@@@session.user.name@@@ ya ha borrado muchas marcas de abrazos! El bebé triceratops esperará antes
          de abrazar otra vez, prometido.
        de: '@@@session.user.name@@@ hat schon viele Kuschelspuren weggeputzt! Das Triceratops-Baby wartet mit dem
          nächsten Drücker, versprochen.'
        it: '@@@session.user.name@@@ ha già cancellato tanti segni di abbracci! Il cucciolo di triceratopo aspetterà
          prima di rifarne, promesso.'
        pt: '@@@session.user.name@@@ já apagou muitas marcas de abraços! O bebé tricerátopo vai esperar antes de
          abraçar outra vez, prometido.'
        br: '@@@session.user.name@@@ já apagou um monte de marcas de abraço! O bebê tricerátopo vai esperar antes
          de abraçar de novo, prometido.'
        nl: '@@@session.user.name@@@ heeft al veel knuffelvlekken weggepoetst! De babytriceratops wacht met de volgende
          knuffel, beloofd.'
      dt_a_dechets_01:
        fr: Pouah ! La poubelle déborde et le petit ankylosaure se bouche le nez ! Sors les poubelles, remets un
          sac neuf et ramasse les petits déchets tombés.
        en: Yuck! The bin is overflowing and the little ankylosaurus is holding its nose! Take out the rubbish,
          put in a new bag and pick up any bits that fell.
        es: ¡Puaj! ¡La basura rebosa y el pequeño anquilosaurio se tapa la nariz! Saca la basura, pon una bolsa
          nueva y recoge lo que se haya caído.
        de: Igitt! Der Mülleimer quillt über und der kleine Ankylosaurus hält sich die Nase zu! Bring den Müll raus,
          häng einen neuen Beutel ein und heb Heruntergefallenes auf.
        it: Bleah! La pattumiera trabocca e il piccolo anchilosauro si tappa il naso! Porta fuori la spazzatura,
          metti un sacco nuovo e raccogli quello che è caduto.
        pt: Credo! O caixote do lixo transborda e o pequeno anquilossauro tapa o nariz! Leva o lixo para fora, põe
          um saco novo e apanha o que caiu.
        br: Eca! O lixo está transbordando e o pequeno anquilossauro tapa o nariz! Leve o lixo para fora, coloque
          um saco novo e pegue o que caiu.
        nl: Bah! De vuilnisbak puilt uit en de kleine ankylosaurus knijpt zijn neus dicht! Breng het afval buiten,
          doe er een nieuwe zak in en raap op wat gevallen is.
      dt_c_dechets_01:
        fr: '@@@session.user.name@@@ a déjà sorti une partie des poubelles ! Le petit ankylosaure se bouche encore
          le nez, il attendra la fin.'
        en: '@@@session.user.name@@@ already took out some of the rubbish! The little ankylosaurus is still holding
          its nose, it will wait.'
        es: ¡@@@session.user.name@@@ ya ha sacado parte de la basura! El pequeño anquilosaurio aún se tapa la nariz,
          esperará al final.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Müll rausgebracht! Der kleine Ankylosaurus hält sich
          noch die Nase zu und wartet.'
        it: '@@@session.user.name@@@ ha già portato fuori parte della spazzatura! Il piccolo anchilosauro si tappa
          ancora il naso, aspetterà.'
        pt: '@@@session.user.name@@@ já levou parte do lixo para fora! O pequeno anquilossauro ainda tapa o nariz,
          vai esperar pelo fim.'
        br: '@@@session.user.name@@@ já levou parte do lixo para fora! O pequeno anquilossauro ainda tapa o nariz,
          vai esperar o final.'
        nl: '@@@session.user.name@@@ heeft al een deel van het afval buitengezet! De kleine ankylosaurus knijpt
          zijn neus nog dicht en wacht.'
      dt_a_dechets_02:
        fr: Les sacs poubelle sont pleins à craquer et le bébé tricératops n'arrive plus à rien y mettre ! Remplace-les
          par des sacs neufs bien fermés.
        en: The bin bags are bursting and the baby triceratops can't fit anything else in! Replace them with new
          bags, tied up tight.
        es: ¡Las bolsas de basura están a reventar y el bebé triceratops ya no puede meter nada! Cámbialas por bolsas
          nuevas bien cerradas.
        de: Die Müllbeutel sind randvoll und das Triceratops-Baby kriegt nichts mehr hinein! Ersetz sie durch neue,
          gut verschlossene Beutel.
        it: I sacchi della spazzatura sono pieni zeppi e il cucciolo di triceratopo non riesce più a metterci niente!
          Sostituiscili con sacchi nuovi ben chiusi.
        pt: Os sacos do lixo estão a abarrotar e o bebé tricerátopo já não consegue pôr nada! Troca-os por sacos
          novos bem fechados.
        br: Os sacos de lixo estão lotados e o bebê tricerátopo não consegue pôr mais nada! Troque por sacos novos
          bem fechados.
        nl: De vuilniszakken zitten propvol en de babytriceratops krijgt er niks meer in! Vervang ze door nieuwe
          zakken, goed dichtgeknoopt.
      dt_c_dechets_02:
        fr: '@@@session.user.name@@@ a déjà changé une partie des sacs ! Le bébé tricératops attend avec sa peau
          de banane, il patientera.'
        en: '@@@session.user.name@@@ already changed some of the bags! The baby triceratops waits with its banana
          peel, it can be patient.'
        es: ¡@@@session.user.name@@@ ya ha cambiado parte de las bolsas! El bebé triceratops espera con su piel
          de plátano, tendrá paciencia.
        de: '@@@session.user.name@@@ hat schon einen Teil der Beutel gewechselt! Das Triceratops-Baby wartet geduldig
          mit seiner Bananenschale.'
        it: '@@@session.user.name@@@ ha già cambiato parte dei sacchi! Il cucciolo di triceratopo aspetta con la
          sua buccia di banana, avrà pazienza.'
        pt: '@@@session.user.name@@@ já trocou parte dos sacos! O bebé tricerátopo espera com a casca de banana,
          vai ter paciência.'
        br: '@@@session.user.name@@@ já trocou parte dos sacos! O bebê tricerátopo espera com a casca de banana,
          vai ter paciência.'
        nl: '@@@session.user.name@@@ heeft al een deel van de zakken vervangen! De babytriceratops wacht geduldig
          met zijn bananenschil.'
      dt_a_dechets_03:
        fr: Le petit stégosaure a tout mélangé dans la même poubelle ! Trie les déchets dans les bons bacs de recyclage,
          jusqu'au dernier.
        en: The little stegosaurus mixed everything up in the same bin! Sort the rubbish into the right recycling
          bins, down to the last piece.
        es: ¡El pequeño estegosaurio lo ha mezclado todo en el mismo cubo! Separa los residuos en los contenedores
          de reciclaje, hasta el último.
        de: Der kleine Stegosaurus hat alles in denselben Eimer geworfen! Trenn den Müll in die richtigen Recyclingtonnen,
          bis zum letzten Stück.
        it: Il piccolo stegosauro ha mescolato tutto nello stesso bidone! Smista i rifiuti nei contenitori giusti,
          fino all'ultimo.
        pt: O pequeno estegossauro misturou tudo no mesmo caixote! Separa o lixo pelos ecopontos certos, até ao
          último.
        br: O pequeno estegossauro misturou tudo na mesma lixeira! Separe o lixo nas lixeiras de reciclagem certas,
          até o último.
        nl: De kleine stegosaurus heeft alles in dezelfde bak gegooid! Sorteer het afval in de juiste recyclebakken,
          tot het laatste stukje.
      dt_c_dechets_03:
        fr: '@@@session.user.name@@@ a déjà bien trié les déchets ! Le petit stégosaure tient le dernier carton
          et attend la suite.'
        en: '@@@session.user.name@@@ already sorted lots of the rubbish! The little stegosaurus holds the last box
          and waits for the rest.'
        es: ¡@@@session.user.name@@@ ya ha separado bastantes residuos! El pequeño estegosaurio sujeta el último
          cartón y espera.
        de: '@@@session.user.name@@@ hat schon viel Müll sortiert! Der kleine Stegosaurus hält den letzten Karton
          und wartet.'
        it: '@@@session.user.name@@@ ha già smistato tanti rifiuti! Il piccolo stegosauro tiene l''ultimo cartone
          e aspetta il resto.'
        pt: '@@@session.user.name@@@ já separou bastante lixo! O pequeno estegossauro segura o último cartão e espera
          pelo resto.'
        br: '@@@session.user.name@@@ já separou bastante lixo! O pequeno estegossauro segura a última caixa e espera
          o resto.'
        nl: '@@@session.user.name@@@ heeft al veel afval gesorteerd! De kleine stegosaurus houdt de laatste doos
          vast en wacht.'
      dt_a_dechets_04:
        fr: Le bébé diplodocus a empilé les bouteilles et le recyclage en une tour qui penche ! Descends tout au
          point de collecte et vide tout.
        en: The baby diplodocus stacked the bottles and recycling into a wobbly tower! Take it all down to the collection
          point and empty everything.
        es: ¡El bebé diplodocus ha apilado las botellas y el reciclaje en una torre que se tambalea! Bájalo todo
          al punto de recogida y vacíalo.
        de: Das Diplodocus-Baby hat Flaschen und Wertstoffe zu einem wackligen Turm gestapelt! Bring alles zur Sammelstelle
          und leer es aus.
        it: Il cucciolo di diplodoco ha impilato bottiglie e riciclo in una torre traballante! Porta tutto al punto
          di raccolta e svuota.
        pt: O bebé diplódoco empilhou as garrafas e a reciclagem numa torre a abanar! Leva tudo ao ecoponto e despeja
          tudo.
        br: O bebê diplodoco empilhou as garrafas e a reciclagem numa torre bamba! Leve tudo até o ponto de coleta
          e esvazie tudo.
        nl: De babydiplodocus heeft de flessen en het recyclen opgestapeld tot een wiebelige toren! Breng alles
          naar het inzamelpunt en maak alles leeg.
      dt_c_dechets_04:
        fr: '@@@session.user.name@@@ a déjà descendu une partie du recyclage ! Le bébé diplodocus tient la tour
          bien droite en attendant.'
        en: '@@@session.user.name@@@ already took down part of the recycling! The baby diplodocus holds the tower
          steady while it waits.'
        es: ¡@@@session.user.name@@@ ya ha bajado parte del reciclaje! El bebé diplodocus sujeta la torre bien recta
          mientras espera.
        de: '@@@session.user.name@@@ hat schon einen Teil der Wertstoffe weggebracht! Das Diplodocus-Baby hält den
          Turm beim Warten gerade.'
        it: '@@@session.user.name@@@ ha già portato giù parte del riciclo! Il cucciolo di diplodoco tiene dritta
          la torre mentre aspetta.'
        pt: '@@@session.user.name@@@ já levou parte da reciclagem! O bebé diplódoco segura a torre direitinha enquanto
          espera.'
        br: '@@@session.user.name@@@ já levou parte da reciclagem! O bebê diplodoco segura a torre retinha enquanto
          espera.'
        nl: '@@@session.user.name@@@ heeft al een deel van het recyclen weggebracht! De babydiplodocus houdt de
          toren recht terwijl hij wacht.'
      dt_a_dechets_05:
        fr: Les épluchures commencent à sentir fort et les mouches agacent le petit tricératops ! Vide-les dans
          le composteur et referme bien.
        en: The peelings are getting smelly and the flies are bugging the little triceratops! Empty them into the
          compost bin and close it tight.
        es: ¡Las mondas empiezan a oler fuerte y las moscas molestan al pequeño triceratops! Vacíalas en el compostador
          y ciérralo bien.
        de: Die Schalen fangen an zu riechen und die Fliegen ärgern den kleinen Triceratops! Leer sie in den Komposter
          und mach ihn gut zu.
        it: Le bucce cominciano a puzzare e le mosche infastidiscono il piccolo triceratopo! Svuotale nella compostiera
          e chiudi bene.
        pt: As cascas começam a cheirar mal e as moscas chateiam o pequeno tricerátopo! Despeja-as no compostor
          e fecha bem.
        br: As cascas estão começando a cheirar forte e as moscas incomodam o pequeno tricerátopo! Jogue na composteira
          e feche bem.
        nl: De schillen gaan stinken en de vliegjes plagen de kleine triceratops! Gooi ze in de compostbak en doe
          hem goed dicht.
      dt_c_dechets_05:
        fr: '@@@session.user.name@@@ a déjà vidé une partie des épluchures ! Le petit tricératops éloigne les mouches
          avec sa queue en attendant.'
        en: '@@@session.user.name@@@ already emptied some of the peelings! The little triceratops swishes the flies
          away with its tail while it waits.'
        es: ¡@@@session.user.name@@@ ya ha vaciado parte de las mondas! El pequeño triceratops espanta las moscas
          con la cola mientras espera.
        de: '@@@session.user.name@@@ hat schon einen Teil der Schalen ausgeleert! Der kleine Triceratops wedelt
          beim Warten die Fliegen weg.'
        it: '@@@session.user.name@@@ ha già svuotato parte delle bucce! Il piccolo triceratopo scaccia le mosche
          con la coda mentre aspetta.'
        pt: '@@@session.user.name@@@ já despejou parte das cascas! O pequeno tricerátopo enxota as moscas com a
          cauda enquanto espera.'
        br: '@@@session.user.name@@@ já jogou parte das cascas! O pequeno tricerátopo espanta as moscas com o rabo
          enquanto espera.'
        nl: '@@@session.user.name@@@ heeft al een deel van de schillen weggegooid! De kleine triceratops wappert
          de vliegjes weg met zijn staart.'
      dt_a_dechets_06:
        fr: Le bébé ptérodactyle a vu que les petites poubelles et corbeilles débordent dans chaque pièce ! Vide-les
          toutes, jusqu'à la dernière.
        en: The baby pterodactyl spotted that the little bins and wastebaskets are overflowing in every room! Empty
          them all, down to the last one.
        es: ¡El bebé pterodáctilo ha visto que las papeleras rebosan en cada habitación! Vacíalas todas, hasta la
          última.
        de: 'Das Flugsaurier-Baby hat gesehen: In jedem Zimmer quellen die kleinen Mülleimer und Papierkörbe über!
          Leer sie alle, bis zum letzten.'
        it: Il cucciolo di pterodattilo ha visto che i cestini traboccano in ogni stanza! Svuotali tutti, fino all'ultimo.
        pt: O bebé pterodáctilo viu que os cestos dos papéis transbordam em todas as divisões! Esvazia-os todos,
          até ao último.
        br: O bebê pterodáctilo viu que as lixeirinhas estão transbordando em todos os cômodos! Esvazie todas, até
          a última.
        nl: De babypterodactylus zag dat de prullenbakjes in elke kamer overlopen! Leeg ze allemaal, tot de laatste.
      dt_c_dechets_06:
        fr: '@@@session.user.name@@@ a vidé presque toutes les corbeilles ! Il en reste une ou deux : le bébé ptérodactyle
          attendra dessus.'
        en: '@@@session.user.name@@@ emptied almost every wastebasket! One or two are left: the baby pterodactyl
          will wait perched on top.'
        es: '¡@@@session.user.name@@@ ha vaciado casi todas las papeleras! Quedan una o dos: el bebé pterodáctilo
          esperará posado encima.'
        de: '@@@session.user.name@@@ hat fast alle Papierkörbe geleert! Ein, zwei sind noch übrig: Das Flugsaurier-Baby
          wartet obendrauf.'
        it: '@@@session.user.name@@@ ha svuotato quasi tutti i cestini! Ne restano uno o due: il cucciolo di pterodattilo
          aspetterà lì sopra.'
        pt: '@@@session.user.name@@@ esvaziou quase todos os cestos! Faltam um ou dois: o bebé pterodáctilo vai
          esperar empoleirado.'
        br: '@@@session.user.name@@@ esvaziou quase todas as lixeirinhas! Faltam uma ou duas: o bebê pterodáctilo
          vai esperar em cima.'
        nl: '@@@session.user.name@@@ heeft bijna alle prullenbakjes geleegd! Er staan er nog één of twee: de babypterodactylus
          wacht erop.'
      dt_a_dechets_07:
        fr: 'Le petit ankylosaure a regardé dans la poubelle de la cuisine : elle colle et sent fort ! Vide-la,
          nettoie-la et désinfecte-la jusqu''à ce qu''elle sente bon.'
        en: 'The little ankylosaurus peeked into the kitchen bin: it''s sticky and smelly! Empty, wash and disinfect
          it until it smells nice.'
        es: '¡El pequeño anquilosaurio ha mirado en el cubo de la cocina: está pegajoso y huele fuerte! Vacíalo,
          límpialo y desinféctalo.'
        de: 'Der kleine Ankylosaurus hat in den Küchenmülleimer geschaut: Er klebt und riecht! Leer ihn, putz und
          desinfizier ihn, bis er gut riecht.'
        it: 'Il piccolo anchilosauro ha guardato nella pattumiera della cucina: è appiccicosa e puzza! Svuotala,
          puliscila e disinfettala.'
        pt: 'O pequeno anquilossauro espreitou o caixote do lixo da cozinha: está pegajoso e cheira mal! Esvazia,
          limpa e desinfeta até cheirar bem.'
        br: 'O pequeno anquilossauro espiou a lixeira da cozinha: está grudenta e com cheiro forte! Esvazie, limpe
          e desinfete até ficar cheirosa.'
        nl: 'De kleine ankylosaurus keek in de keukenvuilnisbak: hij plakt en stinkt! Leeg hem, poets hem en ontsmet
          hem tot hij fris ruikt.'
      dt_c_dechets_07:
        fr: '@@@session.user.name@@@ a déjà bien frotté la poubelle ! Elle sent encore un peu : le petit ankylosaure
          attendra la fin.'
        en: '@@@session.user.name@@@ already scrubbed the bin nicely! It''s still a bit smelly: the little ankylosaurus
          will wait.'
        es: '¡@@@session.user.name@@@ ya ha frotado bien el cubo! Aún huele un poco: el pequeño anquilosaurio esperará
          al final.'
        de: '@@@session.user.name@@@ hat den Mülleimer schon gut geschrubbt! Er riecht noch ein bisschen: Der kleine
          Ankylosaurus wartet.'
        it: '@@@session.user.name@@@ ha già strofinato bene la pattumiera! Puzza ancora un po'': il piccolo anchilosauro
          aspetterà la fine.'
        pt: '@@@session.user.name@@@ já esfregou bem o caixote! Ainda cheira um bocadinho: o pequeno anquilossauro
          vai esperar pelo fim.'
        br: '@@@session.user.name@@@ já esfregou bem a lixeira! Ainda tem um cheirinho: o pequeno anquilossauro
          vai esperar o final.'
        nl: '@@@session.user.name@@@ heeft de vuilnisbak al flink geschrobd! Hij ruikt nog een beetje: de kleine
          ankylosaurus wacht.'
      dt_a_entree_01:
        fr: Le bébé tricératops est rentré en rapportant de la poussière plein les pattes dans l'entrée ! Passe
          l'aspirateur ou le balai partout, même dans les coins.
        en: The baby triceratops came home and tracked dust all over the entrance! Vacuum or sweep everywhere, corners
          too.
        es: ¡El bebé triceratops ha entrado con las patas llenas de polvo y ha ensuciado la entrada! Pasa la aspiradora
          o la escoba por todo, rincones incluidos.
        de: Das Triceratops-Baby ist mit staubigen Füßen in den Eingang gekommen! Saug oder feg überall, auch in
          den Ecken.
        it: Il cucciolo di triceratopo è rientrato con le zampe piene di polvere nell'ingresso! Passa l'aspirapolvere
          o la scopa ovunque, anche negli angoli.
        pt: O bebé tricerátopo entrou com as patas cheias de pó e sujou a entrada! Aspira ou varre tudo, até os
          cantinhos.
        br: O bebê tricerátopo entrou com as patas cheias de poeira e sujou a entrada! Aspire ou varra tudo, até
          os cantinhos.
        nl: De babytriceratops kwam binnen met stoffige pootjes en de hal is vies! Stofzuig of veeg overal, ook
          in de hoekjes.
      dt_c_entree_01:
        fr: '@@@session.user.name@@@ a déjà bien nettoyé l''entrée ! Le bébé tricératops attendra sur le paillasson
          pour les derniers coins.'
        en: '@@@session.user.name@@@ already cleaned the entrance nicely! The baby triceratops will wait on the
          doormat for the last corners.'
        es: ¡@@@session.user.name@@@ ya ha limpiado bien la entrada! El bebé triceratops esperará en el felpudo
          los últimos rincones.
        de: '@@@session.user.name@@@ hat den Eingang schon gut sauber gemacht! Das Triceratops-Baby wartet auf der
          Fußmatte auf die letzten Ecken.'
        it: '@@@session.user.name@@@ ha già pulito bene l''ingresso! Il cucciolo di triceratopo aspetterà sullo
          zerbino gli ultimi angoli.'
        pt: '@@@session.user.name@@@ já limpou bem a entrada! O bebé tricerátopo espera no tapete pelos últimos
          cantinhos.'
        br: '@@@session.user.name@@@ já limpou bem a entrada! O bebê tricerátopo vai esperar no capacho os últimos
          cantinhos.'
        nl: '@@@session.user.name@@@ heeft de hal al mooi schoongemaakt! De babytriceratops wacht op de deurmat
          op de laatste hoekjes.'
      dt_a_entree_02:
        fr: Le petit ptérodactyle s'est posé sur le meuble de l'entrée et la poussière s'est envolée partout ! Fais
          les poussières sur chaque surface.
        en: The little pterodactyl landed on the hall cabinet and dust flew everywhere! Dust every surface.
        es: ¡El pequeño pterodáctilo se ha posado en el mueble de la entrada y el polvo ha volado por todas partes!
          Quita el polvo de cada superficie.
        de: Der kleine Flugsaurier ist auf dem Möbel im Eingang gelandet, und der Staub ist überall hingeflogen!
          Wisch jede Fläche ab.
        it: Il piccolo pterodattilo si è posato sul mobile dell'ingresso e la polvere è volata ovunque! Spolvera
          ogni superficie.
        pt: O pequeno pterodáctilo pousou no móvel da entrada e o pó voou para todo o lado! Limpa o pó de cada superfície.
        br: O pequeno pterodáctilo pousou no móvel da entrada e a poeira voou para todo lado! Tire o pó de cada
          superfície.
        nl: De kleine pterodactylus landde op het halkastje en het stof vloog overal heen! Stof elk oppervlak af.
      dt_c_entree_02:
        fr: '@@@session.user.name@@@ a déjà dépoussiéré une partie de l''entrée ! Le petit ptérodactyle attendra
          perché sur le portemanteau.'
        en: '@@@session.user.name@@@ already dusted part of the entrance! The little pterodactyl will wait perched
          on the coat rack.'
        es: ¡@@@session.user.name@@@ ya ha quitado el polvo de parte de la entrada! El pequeño pterodáctilo esperará
          en el perchero.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Eingang abgestaubt! Der kleine Flugsaurier wartet
          oben auf der Garderobe.'
        it: '@@@session.user.name@@@ ha già spolverato parte dell''ingresso! Il piccolo pterodattilo aspetterà appollaiato
          sull''attaccapanni.'
        pt: '@@@session.user.name@@@ já limpou o pó de parte da entrada! O pequeno pterodáctilo vai esperar empoleirado
          no cabide.'
        br: '@@@session.user.name@@@ já tirou o pó de parte da entrada! O pequeno pterodáctilo vai esperar empoleirado
          no cabideiro.'
        nl: '@@@session.user.name@@@ heeft al een deel van de hal afgestoft! De kleine pterodactylus wacht bovenop
          de kapstok.'
      dt_a_entree_03:
        fr: 'Le bébé ankylosaure a sauté dans toutes les flaques avant de rentrer : le sol de l''entrée est tout
          sale ! Passe la serpillière jusqu''à ce qu''il brille.'
        en: 'The baby ankylosaurus jumped in every puddle before coming in: the entrance floor is all dirty! Mop
          until it shines.'
        es: ¡El bebé anquilosaurio ha saltado en todos los charcos antes de entrar y el suelo de la entrada está
          sucio! Friega hasta que brille.
        de: 'Das Ankylosaurus-Baby ist vor dem Reinkommen in jede Pfütze gesprungen: Der Boden im Eingang ist ganz
          schmutzig! Wisch, bis er glänzt.'
        it: 'Il cucciolo di anchilosauro è saltato in tutte le pozzanghere prima di entrare: il pavimento dell''ingresso
          è sporco! Passa lo straccio finché brilla.'
        pt: 'O bebé anquilossauro saltou em todas as poças antes de entrar: o chão da entrada está todo sujo! Passa
          a esfregona até brilhar.'
        br: 'O bebê anquilossauro pulou em todas as poças antes de entrar: o chão da entrada está todo sujo! Passe
          pano até brilhar.'
        nl: 'De babyankylosaurus sprong in alle plassen voor hij binnenkwam: de vloer in de hal is vies! Dweil tot
          hij glanst.'
      dt_c_entree_03:
        fr: '@@@session.user.name@@@ a déjà fait briller une partie de l''entrée ! Le bébé ankylosaure attendra,
          loin des flaques cette fois.'
        en: '@@@session.user.name@@@ already made part of the entrance shine! The baby ankylosaurus will wait, away
          from puddles this time.'
        es: ¡@@@session.user.name@@@ ya ha hecho brillar parte de la entrada! El bebé anquilosaurio esperará, lejos
          de los charcos esta vez.
        de: '@@@session.user.name@@@ hat einen Teil vom Eingang schon zum Glänzen gebracht! Das Ankylosaurus-Baby
          wartet, diesmal ohne Pfützen.'
        it: '@@@session.user.name@@@ ha già fatto brillare parte dell''ingresso! Il cucciolo di anchilosauro aspetterà,
          lontano dalle pozzanghere.'
        pt: '@@@session.user.name@@@ já pôs parte da entrada a brilhar! O bebé anquilossauro vai esperar, desta
          vez longe das poças.'
        br: '@@@session.user.name@@@ já deixou parte da entrada brilhando! O bebê anquilossauro vai esperar, desta
          vez longe das poças.'
        nl: '@@@session.user.name@@@ heeft al een deel van de hal laten glanzen! De babyankylosaurus wacht, deze
          keer ver van de plassen.'
      dt_a_entree_04:
        fr: 'Le petit tricératops a enlevé ses bottes en s''appuyant aux murs de l''entrée : il y a des traces partout
          ! Nettoie-les jusqu''à des murs tout propres.'
        en: 'The little triceratops leaned on the entrance walls to take off its boots: there are marks everywhere!
          Wash them until the walls are spotless.'
        es: ¡El pequeño triceratops se ha apoyado en las paredes de la entrada para quitarse las botas y hay marcas
          por todas partes! Límpialas bien.
        de: 'Der kleine Triceratops hat sich beim Stiefelausziehen an die Wände im Eingang gelehnt: überall Spuren!
          Wisch sie ab, bis die Wände sauber sind.'
        it: 'Il piccolo triceratopo si è appoggiato ai muri dell''ingresso per togliersi gli stivali: ci sono segni
          ovunque! Puliscili finché sono perfetti.'
        pt: 'O pequeno tricerátopo encostou-se às paredes da entrada para tirar as botas: há marcas por todo o lado!
          Limpa-as até ficarem impecáveis.'
        br: 'O pequeno tricerátopo se apoiou nas paredes da entrada para tirar as botas: tem marcas para todo lado!
          Limpe até ficarem impecáveis.'
        nl: 'De kleine triceratops leunde tegen de muren van de hal om zijn laarzen uit te doen: overal vlekken!
          Was ze tot de muren brandschoon zijn.'
      dt_c_entree_04:
        fr: '@@@session.user.name@@@ a déjà effacé une bonne partie des traces ! Le petit tricératops attend sur
          un pied, bottes à la main.'
        en: '@@@session.user.name@@@ already wiped off a good part of the marks! The little triceratops waits on
          one foot, boots in hand.'
        es: ¡@@@session.user.name@@@ ya ha borrado buena parte de las marcas! El pequeño triceratops espera a la
          pata coja, con las botas en la mano.
        de: '@@@session.user.name@@@ hat schon viele Spuren weggewischt! Der kleine Triceratops wartet auf einem
          Bein, die Stiefel in der Hand.'
        it: '@@@session.user.name@@@ ha già cancellato buona parte dei segni! Il piccolo triceratopo aspetta su
          un piede, stivali in mano.'
        pt: '@@@session.user.name@@@ já apagou boa parte das marcas! O pequeno tricerátopo espera ao pé-coxinho,
          de botas na mão.'
        br: '@@@session.user.name@@@ já apagou boa parte das marcas! O pequeno tricerátopo espera num pé só, com
          as botas na mão.'
        nl: '@@@session.user.name@@@ heeft al veel vlekken weggepoetst! De kleine triceratops wacht op één been,
          laarzen in de hand.'
      dt_a_extras_01:
        fr: Les plantes d'intérieur ont soif, et le bébé diplodocus n'a plus rien de bon à grignoter ! Arrose-les
          toutes jusqu'à une terre bien humide.
        en: The houseplants are thirsty, and the baby diplodocus has nothing tasty left to nibble! Water them all
          until the soil is nice and damp.
        es: ¡Las plantas de interior tienen sed y el bebé diplodocus ya no tiene nada rico que mordisquear! Riégalas
          todas hasta que la tierra esté húmeda.
        de: Die Zimmerpflanzen haben Durst, und das Diplodocus-Baby hat nichts Leckeres mehr zum Knabbern! Gieß
          sie alle, bis die Erde schön feucht ist.
        it: Le piante di casa hanno sete e il cucciolo di diplodoco non ha più niente di buono da sgranocchiare!
          Innaffiale tutte finché la terra è umida.
        pt: As plantas de interior têm sede e o bebé diplódoco já não tem nada bom para trincar! Rega-as todas até
          a terra ficar húmida.
        br: As plantas de dentro de casa estão com sede e o bebê diplodoco não tem mais nada gostoso para beliscar!
          Regue todas até a terra ficar úmida.
        nl: De kamerplanten hebben dorst en de babydiplodocus heeft niks lekkers meer om aan te knabbelen! Geef
          ze allemaal water tot de aarde vochtig is.
      dt_c_extras_01:
        fr: '@@@session.user.name@@@ a déjà arrosé plusieurs plantes ! Le bébé diplodocus attendra que les dernières
          aient bu, sans les grignoter.'
        en: '@@@session.user.name@@@ already watered several plants! The baby diplodocus will wait for the last
          ones to drink, without nibbling.'
        es: ¡@@@session.user.name@@@ ya ha regado varias plantas! El bebé diplodocus esperará a que beban las últimas,
          sin mordisquearlas.
        de: '@@@session.user.name@@@ hat schon mehrere Pflanzen gegossen! Das Diplodocus-Baby wartet auf die letzten,
          ohne zu knabbern.'
        it: '@@@session.user.name@@@ ha già innaffiato diverse piante! Il cucciolo di diplodoco aspetterà che bevano
          le ultime, senza sgranocchiarle.'
        pt: '@@@session.user.name@@@ já regou várias plantas! O bebé diplódoco espera que as últimas bebam, sem
          as trincar.'
        br: '@@@session.user.name@@@ já regou várias plantas! O bebê diplodoco vai esperar as últimas beberem, sem
          beliscar.'
        nl: '@@@session.user.name@@@ heeft al een paar planten water gegeven! De babydiplodocus wacht op de laatste,
          zonder te knabbelen.'
      dt_a_extras_02:
        fr: Le petit ptérodactyle a vu la boîte aux lettres déborder de courrier ! Ramasse-le et trie-le jusqu'à
          ce que la boîte soit vide.
        en: The little pterodactyl saw the letterbox overflowing with post! Collect it and sort it until the box
          is empty.
        es: ¡El pequeño pterodáctilo ha visto el buzón lleno de cartas! Recógelas y ordénalas hasta que el buzón
          quede vacío.
        de: Der kleine Flugsaurier hat gesehen, dass der Briefkasten überquillt! Hol die Post raus und sortier sie,
          bis der Kasten leer ist.
        it: Il piccolo pterodattilo ha visto la cassetta delle lettere strapiena! Raccogli la posta e smistala finché
          la cassetta è vuota.
        pt: O pequeno pterodáctilo viu a caixa do correio a abarrotar! Apanha as cartas e separa-as até a caixa
          ficar vazia.
        br: O pequeno pterodáctilo viu a caixa de correio lotada! Pegue as cartas e separe até a caixa ficar vazia.
        nl: De kleine pterodactylus zag de brievenbus uitpuilen van de post! Haal de post eruit en sorteer tot de
          bus leeg is.
      dt_c_extras_02:
        fr: '@@@session.user.name@@@ a déjà ramassé une partie du courrier ! Le petit ptérodactyle garde une lettre
          dans le bec en attendant.'
        en: '@@@session.user.name@@@ already collected some of the post! The little pterodactyl holds a letter in
          its beak while it waits.'
        es: ¡@@@session.user.name@@@ ya ha recogido parte de las cartas! El pequeño pterodáctilo sujeta una carta
          en el pico mientras espera.
        de: '@@@session.user.name@@@ hat schon einen Teil der Post geholt! Der kleine Flugsaurier hält beim Warten
          einen Brief im Schnabel.'
        it: '@@@session.user.name@@@ ha già raccolto parte della posta! Il piccolo pterodattilo tiene una lettera
          nel becco mentre aspetta.'
        pt: '@@@session.user.name@@@ já apanhou parte das cartas! O pequeno pterodáctilo segura uma carta no bico
          enquanto espera.'
        br: '@@@session.user.name@@@ já pegou parte das cartas! O pequeno pterodáctilo segura uma carta no bico
          enquanto espera.'
        nl: '@@@session.user.name@@@ heeft al een deel van de post gehaald! De kleine pterodactylus houdt een brief
          in zijn snavel terwijl hij wacht.'
      dt_a_extras_03:
        fr: 'L''aspirateur est si plein de poussière qu''il fait rire le bébé tricératops : il ne souffle plus qu''un
          petit pff ! Vide et nettoie le bac et le filtre.'
        en: The vacuum cleaner is so full of dust it only goes pff, and the baby triceratops giggles! Empty and
          clean the bin and the filter.
        es: ¡La aspiradora está tan llena de polvo que solo hace pff y el bebé triceratops se ríe! Vacía y limpia
          el depósito y el filtro.
        de: Der Staubsauger ist so voll, dass er nur noch pff macht, und das Triceratops-Baby kichert! Leer und
          putz Behälter und Filter.
        it: L'aspirapolvere è così pieno di polvere che fa solo pff, e il cucciolo di triceratopo ride! Svuota e
          pulisci il contenitore e il filtro.
        pt: O aspirador está tão cheio de pó que só faz pff, e o bebé tricerátopo ri-se! Esvazia e limpa o depósito
          e o filtro.
        br: O aspirador está tão cheio de poeira que só faz pff, e o bebê tricerátopo dá risada! Esvazie e limpe
          o reservatório e o filtro.
        nl: De stofzuiger zit zo vol stof dat hij alleen nog pff doet, en de babytriceratops giechelt! Leeg en poets
          het bakje en het filter.
      dt_c_extras_03:
        fr: '@@@session.user.name@@@ a déjà vidé une bonne partie de l''aspirateur ! Le bébé tricératops attendra
          le premier vroum tout neuf.'
        en: '@@@session.user.name@@@ already emptied a good part of the vacuum cleaner! The baby triceratops will
          wait for the first brand-new vroom.'
        es: ¡@@@session.user.name@@@ ya ha vaciado buena parte de la aspiradora! El bebé triceratops esperará el
          primer brum nuevecito.
        de: '@@@session.user.name@@@ hat den Staubsauger schon gut ausgeleert! Das Triceratops-Baby wartet auf das
          erste nagelneue Brumm.'
        it: '@@@session.user.name@@@ ha già svuotato buona parte dell''aspirapolvere! Il cucciolo di triceratopo
          aspetterà il primo vrum nuovo.'
        pt: '@@@session.user.name@@@ já esvaziou boa parte do aspirador! O bebé tricerátopo vai esperar pelo primeiro
          vrum novinho.'
        br: '@@@session.user.name@@@ já esvaziou boa parte do aspirador! O bebê tricerátopo vai esperar o primeiro
          vrum novinho.'
        nl: '@@@session.user.name@@@ heeft de stofzuiger al flink geleegd! De babytriceratops wacht op de eerste
          gloednieuwe vroem.'
      dt_a_extras_04:
        fr: Une ampoule ne s'allume plus, et le petit stégosaure ne trouve plus ses jouets ! Remplace-la pour rallumer
          la lumière.
        en: A light bulb won't come on, and the little stegosaurus can't find its toys! Replace it to bring the
          light back.
        es: ¡Una bombilla ya no se enciende y el pequeño estegosaurio no encuentra sus juguetes! Cámbiala para que
          vuelva la luz.
        de: Eine Glühbirne geht nicht mehr an, und der kleine Stegosaurus findet seine Spielsachen nicht! Wechsle
          sie, damit es wieder hell wird.
        it: Una lampadina non si accende più e il piccolo stegosauro non trova i suoi giochi! Sostituiscila per
          riavere la luce.
        pt: Uma lâmpada já não acende e o pequeno estegossauro não encontra os brinquedos! Troca-a para voltar a
          haver luz.
        br: Uma lâmpada não acende mais e o pequeno estegossauro não acha os brinquedos! Troque para a luz voltar.
        nl: Een lamp doet het niet meer en de kleine stegosaurus kan zijn speelgoed niet vinden! Vervang hem zodat
          het weer licht wordt.
      dt_c_extras_04:
        fr: '@@@session.user.name@@@ a bien commencé à changer l''ampoule ! Le petit stégosaure attend la lumière,
          il patientera.'
        en: '@@@session.user.name@@@ made a good start on changing the bulb! The little stegosaurus is waiting for
          the light, it can be patient.'
        es: ¡@@@session.user.name@@@ ha empezado bien a cambiar la bombilla! El pequeño estegosaurio espera la luz,
          tendrá paciencia.
        de: '@@@session.user.name@@@ hat gut angefangen, die Glühbirne zu wechseln! Der kleine Stegosaurus wartet
          geduldig aufs Licht.'
        it: '@@@session.user.name@@@ ha iniziato bene a cambiare la lampadina! Il piccolo stegosauro aspetta la
          luce, avrà pazienza.'
        pt: '@@@session.user.name@@@ começou bem a trocar a lâmpada! O pequeno estegossauro espera pela luz, vai
          ter paciência.'
        br: '@@@session.user.name@@@ começou bem a trocar a lâmpada! O pequeno estegossauro espera a luz, vai ter
          paciência.'
        nl: '@@@session.user.name@@@ is goed begonnen met de lamp vervangen! De kleine stegosaurus wacht geduldig
          op het licht.'
      dt_a_extras_05:
        fr: Le bébé iguanodon a allumé et éteint toutes les lumières avec ses pattes collantes ! Nettoie et désinfecte
          chaque interrupteur.
        en: The baby iguanodon flicked every light on and off with sticky paws! Clean and disinfect every light
          switch.
        es: ¡El bebé iguanodonte ha encendido y apagado todas las luces con las patas pegajosas! Limpia y desinfecta
          cada interruptor.
        de: Das Iguanodon-Baby hat mit Klebepfoten alle Lichter an- und ausgemacht! Putz und desinfizier jeden Lichtschalter.
        it: Il cucciolo di iguanodonte ha acceso e spento tutte le luci con le zampe appiccicose! Pulisci e disinfetta
          ogni interruttore.
        pt: O bebé iguanodonte acendeu e apagou as luzes todas com as patas pegajosas! Limpa e desinfeta cada interruptor.
        br: O bebê iguanodonte acendeu e apagou todas as luzes com as patas grudentas! Limpe e desinfete cada interruptor.
        nl: De babyiguanodon deed met plakpootjes alle lichten aan en uit! Poets en ontsmet elk lichtknopje.
      dt_a_extras_06:
        fr: Le petit tricératops a ouvert toutes les portes avec ses pattes pleines de boue ! Nettoie-les jusqu'à
          ce qu'elles soient toutes propres.
        en: The little triceratops opened every door with muddy paws! Clean them until they're all spotless.
        es: ¡El pequeño triceratops ha abierto todas las puertas con las patas llenas de barro! Límpialas hasta
          que queden impecables.
        de: Der kleine Triceratops hat alle Türen mit Matschpfoten aufgemacht! Putz sie, bis sie alle sauber sind.
        it: Il piccolo triceratopo ha aperto tutte le porte con le zampe infangate! Puliscile finché sono tutte
          pulite.
        pt: O pequeno tricerátopo abriu as portas todas com as patas enlameadas! Limpa-as até ficarem todas impecáveis.
        br: O pequeno tricerátopo abriu todas as portas com as patas enlameadas! Limpe até ficarem todas impecáveis.
        nl: De kleine triceratops deed alle deuren open met modderpootjes! Poets ze tot ze allemaal schoon zijn.
      dt_a_extras_07:
        fr: Le bébé diplodocus trouve que ça sent le renfermé dans la grotte ! Ouvre grand les fenêtres pour faire
          entrer de l'air frais.
        en: The baby diplodocus thinks the cave smells stuffy! Open the windows wide to let fresh air in.
        es: ¡Al bebé diplodocus la cueva le huele a cerrado! Abre bien las ventanas para que entre aire fresco.
        de: Das Diplodocus-Baby findet, in der Höhle riecht es muffig! Mach die Fenster weit auf und lass frische
          Luft rein.
        it: Il cucciolo di diplodoco trova che la grotta sappia di chiuso! Spalanca le finestre per far entrare
          aria fresca.
        pt: O bebé diplódoco acha que a gruta cheira a fechado! Abre bem as janelas para entrar ar fresquinho.
        br: O bebê diplodoco acha que a caverna está com cheiro de abafado! Abra bem as janelas para entrar ar fresquinho.
        nl: De babydiplodocus vindt dat het muf ruikt in de grot! Zet de ramen wijd open zodat er frisse lucht binnenkomt.
      dt_a_extras_08:
        fr: Quelqu'un de ta tribu a besoin d'un coup de main, et le petit stégosaure te montre le chemin ! Rends-lui
          le service qu'il attend.
        en: Someone in your tribe needs a hand, and the little stegosaurus is showing you the way! Do them the favour
          they're hoping for.
        es: ¡Alguien de tu tribu necesita una mano y el pequeño estegosaurio te enseña el camino! Hazle el favor
          que espera.
        de: Jemand aus deinem Stamm braucht Hilfe, und der kleine Stegosaurus zeigt dir den Weg! Tu ihm den Gefallen,
          auf den er wartet.
        it: Qualcuno della tua tribù ha bisogno di una mano e il piccolo stegosauro ti mostra la strada! Fagli il
          favore che aspetta.
        pt: Alguém da tua tribo precisa de uma ajudinha e o pequeno estegossauro mostra-te o caminho! Faz-lhe o
          favor que ele espera.
        br: Alguém da sua tribo precisa de uma ajudinha e o pequeno estegossauro mostra o caminho! Faça o favor
          que ele está esperando.
        nl: Iemand van je stam heeft een handje hulp nodig, en de kleine stegosaurus wijst je de weg! Doe hem het
          plezier waar hij op wacht.
      dt_a_garage_01:
        fr: Le petit ankylosaure a joué au ballon dans le garage et soulevé plein de poussière ! Balaie jusqu'à
          ce que le sol soit dégagé.
        en: The little ankylosaurus played ball in the garage and kicked up loads of dust! Sweep until the floor
          is clear.
        es: ¡El pequeño anquilosaurio ha jugado a la pelota en el garaje y ha levantado mucho polvo! Barre hasta
          que el suelo quede despejado.
        de: Der kleine Ankylosaurus hat in der Garage Ball gespielt und viel Staub aufgewirbelt! Feg, bis der Boden
          frei ist.
        it: Il piccolo anchilosauro ha giocato a palla nel garage e ha sollevato tanta polvere! Spazza finché il
          pavimento è libero.
        pt: O pequeno anquilossauro jogou à bola na garagem e levantou muito pó! Varre até o chão ficar limpinho.
        br: O pequeno anquilossauro jogou bola na garagem e levantou muita poeira! Varra até o chão ficar livre.
        nl: De kleine ankylosaurus heeft in de garage gevoetbald en veel stof opgeschopt! Veeg tot de vloer leeg
          is.
      dt_a_garage_02:
        fr: Le bébé tricératops a marché dans des taches d'huile au garage et glisse partout ! Nettoie le sol jusqu'à
          ce qu'il soit net.
        en: The baby triceratops stepped in oil stains in the garage and is slipping everywhere! Clean the floor
          until it's spotless.
        es: ¡El bebé triceratops ha pisado manchas de aceite en el garaje y resbala por todas partes! Limpia el
          suelo hasta dejarlo impecable.
        de: Das Triceratops-Baby ist in der Garage in Ölflecken getreten und rutscht überall! Putz den Boden, bis
          er sauber ist.
        it: Il cucciolo di triceratopo ha pestato macchie d'olio nel garage e scivola dappertutto! Pulisci il pavimento
          finché è pulito.
        pt: O bebé tricerátopo pisou nódoas de óleo na garagem e escorrega por todo o lado! Limpa o chão até ficar
          impecável.
        br: O bebê tricerátopo pisou em manchas de óleo na garagem e está escorregando por todo lado! Limpe o chão
          até ficar impecável.
        nl: De babytriceratops stapte in olievlekken in de garage en glijdt overal uit! Maak de vloer schoon tot
          hij netjes is.
      dt_a_garage_03:
        fr: Le petit T. rex a voulu bricoler avec ses petits bras, et l'établi est sens dessus dessous ! Range outils
          et pièces jusqu'à un plan dégagé.
        en: The little T. rex tried some DIY with its tiny arms, and the workbench is upside down! Put away tools
          and parts until it's clear.
        es: ¡El pequeño T. rex ha querido hacer bricolaje con sus bracitos y el banco de trabajo está patas arriba!
          Ordena herramientas y piezas.
        de: Der kleine T. rex wollte mit seinen kurzen Ärmchen basteln, jetzt steht die Werkbank kopf! Räum Werkzeug
          und Teile weg, bis sie frei ist.
        it: Il piccolo T. rex ha voluto fare bricolage con le sue braccine e il banco da lavoro è sottosopra! Riordina
          attrezzi e pezzi.
        pt: O pequeno T. rex quis fazer bricolage com os bracinhos e a bancada ficou de pernas para o ar! Arruma
          ferramentas e peças.
        br: O pequeno T. rex quis consertar coisas com os bracinhos e a bancada ficou de pernas para o ar! Arrume
          ferramentas e peças.
        nl: De kleine T. rex wilde klussen met zijn korte armpjes en de werkbank staat op zijn kop! Ruim gereedschap
          en onderdelen op.
      dt_a_garage_04:
        fr: Le bébé brachiosaure ne peut plus entrer dans le garage tant il y a d'objets ! Désencombre et range
          jusqu'à des passages dégagés.
        en: The baby brachiosaurus can't get into the garage, there's so much stuff! Clear out and tidy until the
          paths are open.
        es: ¡El bebé braquiosaurio ya no cabe en el garaje de tantas cosas que hay! Despeja y ordena hasta que se
          pueda pasar.
        de: Das Brachiosaurus-Baby kommt nicht mehr in die Garage, so viel Zeug steht da! Miste aus und räum auf,
          bis die Wege frei sind.
        it: Il cucciolo di brachiosauro non riesce più a entrare in garage, ci sono troppe cose! Sgombra e riordina
          finché si passa.
        pt: O bebé braquiossauro já não cabe na garagem com tanta tralha! Desimpede e arruma até se poder passar.
        br: O bebê braquiossauro não cabe mais na garagem de tanta tralha! Desentulhe e arrume até dar para passar.
        nl: De babybrachiosaurus past niet meer in de garage, er staat zoveel! Ruim op en maak de doorgangen vrij.
      dt_a_garage_05:
        fr: Le petit stégosaure voulait aider à jardiner, mais les outils du garage sont tout rouillés et sales
          ! Nettoie-les jusqu'à ce qu'ils soient prêts à servir.
        en: The little stegosaurus wanted to help in the garden, but the garage tools are rusty and dirty! Clean
          them until they're ready to use.
        es: ¡El pequeño estegosaurio quería ayudar en el jardín, pero las herramientas del garaje están oxidadas
          y sucias! Límpialas hasta que estén listas.
        de: Der kleine Stegosaurus wollte im Garten helfen, aber die Werkzeuge in der Garage sind rostig und schmutzig!
          Putz sie, bis sie wieder einsatzbereit sind.
        it: Il piccolo stegosauro voleva aiutare in giardino, ma gli attrezzi del garage sono arrugginiti e sporchi!
          Puliscili finché sono pronti.
        pt: O pequeno estegossauro queria ajudar no jardim, mas as ferramentas da garagem estão ferrugentas e sujas!
          Limpa-as até estarem prontas.
        br: O pequeno estegossauro queria ajudar no jardim, mas as ferramentas da garagem estão enferrujadas e sujas!
          Limpe até ficarem prontas.
        nl: De kleine stegosaurus wilde helpen in de tuin, maar het gereedschap in de garage is roestig en vies!
          Poets het tot het klaar is voor gebruik.
      dt_a_garage_06:
        fr: Le bébé tricératops tient la boîte à vis, mais il manque une paire de mains ! Aide un parent jusqu'à
          la fin du bricolage.
        en: The baby triceratops is holding the box of screws, but one more pair of hands is needed! Help a grown-up
          until the DIY is done.
        es: ¡El bebé triceratops sujeta la caja de tornillos, pero falta un par de manos! Ayuda a un adulto hasta
          terminar el bricolaje.
        de: Das Triceratops-Baby hält die Schraubenkiste, aber es fehlt noch ein Paar Hände! Hilf einem Erwachsenen,
          bis die Bastelei fertig ist.
        it: Il cucciolo di triceratopo tiene la scatola delle viti, ma manca un paio di mani! Aiuta un genitore
          fino alla fine del lavoretto.
        pt: O bebé tricerátopo segura a caixa dos parafusos, mas falta um par de mãos! Ajuda um adulto até acabar
          o bricolage.
        br: O bebê tricerátopo segura a caixa de parafusos, mas falta um par de mãos! Ajude um adulto até terminar
          o conserto.
        nl: De babytriceratops houdt de schroevendoos vast, maar er is nog een paar handen nodig! Help een ouder
          tot het klusje af is.
      dt_a_jardin_01:
        fr: 'Le petit diplodocus a secoué les arbres : les feuilles sèches et les brindilles couvrent le jardin
          ! Ramasse-les jusqu''à un sol net.'
        en: The little diplodocus shook the trees and dry leaves and twigs cover the garden! Pick them up until
          the ground is clear.
        es: ¡El pequeño diplodocus ha sacudido los árboles y hojas secas y ramitas cubren el jardín! Recógelas hasta
          dejar el suelo limpio.
        de: 'Der kleine Diplodocus hat die Bäume geschüttelt: Trockene Blätter und Zweige liegen im ganzen Garten!
          Sammle sie auf, bis der Boden frei ist.'
        it: 'Il piccolo diplodoco ha scosso gli alberi: foglie secche e rametti coprono il giardino! Raccoglili
          finché il terreno è pulito.'
        pt: O pequeno diplódoco abanou as árvores e as folhas secas e os raminhos cobrem o jardim! Apanha-os até
          o chão ficar limpo.
        br: O pequeno diplodoco sacudiu as árvores e as folhas secas e os gravetos cobrem o jardim! Recolha tudo
          até o chão ficar limpo.
        nl: De kleine diplodocus schudde aan de bomen en nu ligt de tuin vol droge blaadjes en takjes! Raap ze op
          tot de grond leeg is.
      dt_a_jardin_02:
        fr: L'herbe de la pelouse est si haute que le bébé tricératops s'y perd ! Tonds jusqu'à une pelouse égale
          et nette.
        en: The lawn grass is so tall the baby triceratops gets lost in it! Mow until the lawn is even and neat.
        es: ¡La hierba del césped está tan alta que el bebé triceratops se pierde en ella! Corta el césped hasta
          dejarlo igualito.
        de: Das Gras auf dem Rasen ist so hoch, dass sich das Triceratops-Baby darin verläuft! Mäh, bis der Rasen
          schön gleichmäßig ist.
        it: L'erba del prato è così alta che il cucciolo di triceratopo ci si perde! Taglia il prato finché è pari
          e ordinato.
        pt: A relva está tão alta que o bebé tricerátopo se perde lá dentro! Corta a relva até ficar certinha.
        br: A grama está tão alta que o bebê tricerátopo se perde nela! Corte a grama até ficar bem certinha.
        nl: Het gras van het gazon is zo hoog dat de babytriceratops erin verdwaalt! Maai tot het gazon mooi gelijk
          is.
      dt_a_jardin_03:
        fr: Les plantes du jardin ont soif et le petit stégosaure veut leur redonner le sourire ! Arrose-les toutes
          jusqu'à une terre bien humide.
        en: The garden plants are thirsty and the little stegosaurus wants to cheer them up! Water them all until
          the soil is nice and damp.
        es: ¡Las plantas del jardín tienen sed y el pequeño estegosaurio quiere animarlas! Riégalas todas hasta
          que la tierra esté húmeda.
        de: Die Gartenpflanzen haben Durst, und der kleine Stegosaurus will sie aufmuntern! Gieß sie alle, bis die
          Erde schön feucht ist.
        it: Le piante del giardino hanno sete e il piccolo stegosauro vuole rallegrarle! Innaffiale tutte finché
          la terra è umida.
        pt: As plantas do jardim têm sede e o pequeno estegossauro quer animá-las! Rega-as todas até a terra ficar
          húmida.
        br: As plantas do jardim estão com sede e o pequeno estegossauro quer animar todas! Regue até a terra ficar
          úmida.
        nl: De tuinplanten hebben dorst en de kleine stegosaurus wil ze opvrolijken! Geef ze allemaal water tot
          de aarde vochtig is.
      dt_a_jardin_04:
        fr: Le bébé ankylosaure glisse sur la mousse des allées du jardin ! Nettoie les allées jusqu'à des chemins
          bien dégagés.
        en: The baby ankylosaurus keeps slipping on the moss on the garden paths! Clean the paths until they're
          nice and clear.
        es: ¡El bebé anquilosaurio resbala con el musgo de los caminos del jardín! Limpia los caminos hasta dejarlos
          despejados.
        de: Das Ankylosaurus-Baby rutscht auf dem Moos der Gartenwege aus! Putz die Wege, bis sie schön frei sind.
        it: Il cucciolo di anchilosauro scivola sul muschio dei vialetti del giardino! Pulisci i vialetti finché
          sono sgombri.
        pt: O bebé anquilossauro escorrega no musgo dos caminhos do jardim! Limpa os caminhos até ficarem desimpedidos.
        br: O bebê anquilossauro escorrega no musgo dos caminhos do jardim! Limpe os caminhos até ficarem livres.
        nl: De babyankylosaurus glijdt uit over het mos op de tuinpaadjes! Maak de paadjes schoon tot ze mooi vrij
          zijn.
      dt_a_jardin_05:
        fr: Des mauvaises herbes ont poussé partout dans les massifs, et le petit tricératops ne trouve plus ses
          fleurs ! Désherbe jusqu'à des parterres nets.
        en: Weeds have sprung up all over the flower beds, and the little triceratops can't find its flowers! Weed
          until the beds are neat.
        es: ¡Han salido malas hierbas en todos los parterres y el pequeño triceratops no encuentra sus flores! Quita
          las malas hierbas.
        de: Überall in den Beeten wächst Unkraut, und der kleine Triceratops findet seine Blumen nicht mehr! Jäte,
          bis die Beete ordentlich sind.
        it: Le erbacce sono spuntate in tutte le aiuole e il piccolo triceratopo non trova più i suoi fiori! Togli
          le erbacce finché le aiuole sono in ordine.
        pt: Cresceram ervas daninhas nos canteiros todos e o pequeno tricerátopo já não encontra as flores! Arranca
          as ervas até os canteiros ficarem limpos.
        br: O mato cresceu nos canteiros todos e o pequeno tricerátopo não acha mais as flores! Tire o mato até
          os canteiros ficarem limpos.
        nl: Overal in de borders groeit onkruid en de kleine triceratops kan zijn bloemen niet meer vinden! Wied
          tot de borders netjes zijn.
      dt_a_jardin_06:
        fr: Les haies ont tant poussé que le bébé diplodocus a des feuilles plein les oreilles ! Taille haies et
          plantes jusqu'à des formes nettes.
        en: The hedges have grown so much the baby diplodocus has leaves in its ears! Trim the hedges and plants
          into neat shapes.
        es: ¡Los setos han crecido tanto que el bebé diplodocus tiene hojas hasta en las orejas! Poda setos y plantas
          hasta dejarlos bonitos.
        de: Die Hecken sind so gewachsen, dass das Diplodocus-Baby Blätter in den Ohren hat! Schneid Hecken und
          Pflanzen in schöne Form.
        it: Le siepi sono cresciute così tanto che il cucciolo di diplodoco ha foglie nelle orecchie! Pota siepi
          e piante finché sono in ordine.
        pt: As sebes cresceram tanto que o bebé diplódoco tem folhas nas orelhas! Apara sebes e plantas até ficarem
          bem arranjadas.
        br: As cercas vivas cresceram tanto que o bebê diplodoco está com folhas nas orelhas! Pode cercas e plantas
          até ficarem bem certinhas.
        nl: De heggen zijn zo gegroeid dat de babydiplodocus blaadjes in zijn oren heeft! Knip heggen en planten
          mooi in vorm.
      dt_a_linge_01:
        fr: Le petit stégosaure a plongé dans le panier à linge sale, et tout est mélangé ! Trie le blanc, la couleur
          et le délicat en tas séparés.
        en: The little stegosaurus dived into the dirty laundry basket and it's all mixed up! Sort whites, colours
          and delicates into separate piles.
        es: ¡El pequeño estegosaurio se ha tirado al cesto de la ropa sucia y está todo mezclado! Separa lo blanco,
          el color y lo delicado.
        de: Der kleine Stegosaurus ist in den Wäschekorb gesprungen, jetzt ist alles durcheinander! Sortier Weißes,
          Buntes und Feines in eigene Haufen.
        it: Il piccolo stegosauro si è tuffato nel cesto dei panni sporchi ed è tutto mischiato! Dividi bianchi,
          colorati e delicati in mucchi separati.
        pt: O pequeno estegossauro mergulhou no cesto da roupa suja e está tudo misturado! Separa o branco, a cor
          e o delicado em montes.
        br: O pequeno estegossauro mergulhou no cesto de roupa suja e está tudo misturado! Separe branco, colorido
          e delicado em pilhas.
        nl: De kleine stegosaurus dook in de wasmand en alles ligt door elkaar! Sorteer wit, bont en fijn in aparte
          stapels.
      dt_a_linge_02:
        fr: Le tas de linge sale est si haut que le bébé tricératops grimpe dessus ! Démarre une machine à laver
          adaptée.
        en: The pile of dirty laundry is so tall the baby triceratops is climbing it! Start a suitable washing machine
          cycle.
        es: ¡El montón de ropa sucia es tan alto que el bebé triceratops trepa por él! Pon una lavadora con el programa
          adecuado.
        de: Der Berg Schmutzwäsche ist so hoch, dass das Triceratops-Baby darauf klettert! Starte eine passende
          Waschmaschine.
        it: Il mucchio di panni sporchi è così alto che il cucciolo di triceratopo ci si arrampica! Avvia una lavatrice
          adatta.
        pt: O monte de roupa suja está tão alto que o bebé tricerátopo trepa por ele! Põe uma máquina de lavar a
          roupa no programa certo.
        br: A pilha de roupa suja está tão alta que o bebê tricerátopo escala ela! Ligue a máquina de lavar no programa
          certo.
        nl: De stapel vuile was is zo hoog dat de babytriceratops erop klimt! Zet een passende wasmachine aan.
      dt_a_linge_02_alt:
        fr: Le tas de linge sale veut partir en promenade avec le petit diplodocus ! Emporte-le à la laverie et
          démarre le lavage.
        en: The pile of dirty laundry wants to go for a walk with the little diplodocus! Take it to the launderette
          and start the wash.
        es: ¡El montón de ropa sucia quiere ir de paseo con el pequeño diplodocus! Llévalo a la lavandería y pon
          el lavado.
        de: Der Berg Schmutzwäsche will mit dem kleinen Diplodocus spazieren gehen! Bring ihn in den Waschsalon
          und starte die Wäsche.
        it: Il mucchio di panni sporchi vuole fare una passeggiata col piccolo diplodoco! Portalo in lavanderia
          e avvia il lavaggio.
        pt: O monte de roupa suja quer ir passear com o pequeno diplódoco! Leva-o à lavandaria e põe a lavar.
        br: A pilha de roupa suja quer passear com o pequeno diplodoco! Leve até a lavanderia e coloque para lavar.
        nl: De stapel vuile was wil gaan wandelen met de kleine diplodocus! Breng hem naar de wasserette en start
          de was.
      dt_a_linge_03:
        fr: Le linge mouillé sort de la machine, et le bébé ptérodactyle veut le voir s'envoler au vent ! Étends-le
          entièrement pour qu'il sèche.
        en: The wet laundry is out of the machine and the baby pterodactyl wants to see it flap in the wind! Hang
          it all out to dry.
        es: ¡La ropa mojada sale de la lavadora y el bebé pterodáctilo quiere verla ondear al viento! Tiéndela toda
          para que se seque.
        de: Die nasse Wäsche ist aus der Maschine, und das Flugsaurier-Baby will sie im Wind flattern sehen! Häng
          alles zum Trocknen auf.
        it: Il bucato bagnato esce dalla lavatrice e il cucciolo di pterodattilo vuole vederlo svolazzare al vento!
          Stendilo tutto ad asciugare.
        pt: A roupa molhada saiu da máquina e o bebé pterodáctilo quer vê-la a esvoaçar ao vento! Estende-a toda
          para secar.
        br: A roupa molhada saiu da máquina e o bebê pterodáctilo quer ver ela balançar no vento! Estenda tudo para
          secar.
        nl: De natte was komt uit de machine en de babypterodactylus wil hem zien wapperen in de wind! Hang alles
          op om te drogen.
      dt_a_linge_04:
        fr: Le linge sec attend sur le fil, et le petit ankylosaure veut le câliner tout chaud ! Ramasse-le entièrement
          avant qu'il reprenne la poussière.
        en: The dry laundry is waiting on the line and the little ankylosaurus wants to cuddle it while it's warm!
          Bring it all in before it gets dusty.
        es: ¡La ropa seca espera en el tendedero y el pequeño anquilosaurio quiere abrazarla calentita! Recógela
          toda antes de que coja polvo.
        de: Die trockene Wäsche hängt auf der Leine, und der kleine Ankylosaurus will sie warm knuddeln! Nimm alles
          ab, bevor sie wieder staubig wird.
        it: Il bucato asciutto aspetta sul filo e il piccolo anchilosauro vuole coccolarlo ancora caldo! Ritiralo
          tutto prima che si impolveri.
        pt: A roupa seca espera no estendal e o pequeno anquilossauro quer abraçá-la quentinha! Apanha-a toda antes
          que ganhe pó.
        br: A roupa seca está esperando no varal e o pequeno anquilossauro quer abraçar ela quentinha! Recolha tudo
          antes de pegar poeira.
        nl: De droge was hangt aan de lijn en de kleine ankylosaurus wil hem lekker warm knuffelen! Haal alles binnen
          voor het weer stoffig wordt.
      dt_a_linge_05:
        fr: Le bébé tricératops s'est fait un nid dans le tas de linge sec ! Plie chaque vêtement jusqu'à des piles
          bien nettes.
        en: The baby triceratops made a nest in the pile of dry laundry! Fold every piece into nice neat stacks.
        es: ¡El bebé triceratops se ha hecho un nido en el montón de ropa seca! Dobla cada prenda hasta hacer pilas
          bien ordenadas.
        de: Das Triceratops-Baby hat sich im Berg trockener Wäsche ein Nest gebaut! Falte jedes Teil zu ordentlichen
          Stapeln.
        it: Il cucciolo di triceratopo si è fatto un nido nel mucchio di bucato asciutto! Piega ogni capo in pile
          ben ordinate.
        pt: O bebé tricerátopo fez um ninho no monte de roupa seca! Dobra cada peça em pilhas bem arrumadinhas.
        br: O bebê tricerátopo fez um ninho na pilha de roupa seca! Dobre cada peça em pilhas bem arrumadinhas.
        nl: De babytriceratops heeft een nestje gemaakt in de stapel droge was! Vouw elk kledingstuk tot nette stapeltjes.
      dt_a_linge_06:
        fr: Le petit stégosaure garde les piles de linge plié, mais elles commencent à pencher ! Range chaque pile
          dans son armoire ou son tiroir.
        en: The little stegosaurus is guarding the folded laundry, but the piles are starting to lean! Put each
          pile away in its wardrobe or drawer.
        es: ¡El pequeño estegosaurio vigila las pilas de ropa doblada, pero empiezan a inclinarse! Guarda cada pila
          en su sitio o en su cajón.
        de: Der kleine Stegosaurus bewacht die gefaltete Wäsche, aber die Stapel wackeln schon! Räum jeden Stapel
          in seinen Schrank oder seine Schublade.
        it: Il piccolo stegosauro sorveglia le pile di bucato piegato, ma cominciano a pendere! Metti ogni pila
          nel suo cassetto o al suo posto.
        pt: O pequeno estegossauro guarda as pilhas de roupa dobrada, mas estão a começar a tombar! Arruma cada
          pilha na sua gaveta ou no seu lugar.
        br: O pequeno estegossauro vigia as pilhas de roupa dobrada, mas elas estão começando a tombar! Guarde cada
          pilha na gaveta ou no seu lugar.
        nl: De kleine stegosaurus bewaakt de stapels gevouwen was, maar ze beginnen te hellen! Leg elke stapel in
          zijn kast of la.
      dt_a_linge_08:
        fr: 'Le bébé diplodocus s''est roulé en boule sur le linge propre : tout est froissé ! Repasse jusqu''à
          un linge bien lisse.'
        en: The baby diplodocus curled up on the clean laundry and now it's all crumpled! Iron until everything
          is smooth.
        es: ¡El bebé diplodocus se ha acurrucado sobre la ropa limpia y está toda arrugada! Plancha hasta que quede
          bien lisa.
        de: 'Das Diplodocus-Baby hat sich auf der sauberen Wäsche zusammengerollt: alles zerknittert! Bügle, bis
          alles schön glatt ist.'
        it: Il cucciolo di diplodoco si è accoccolato sul bucato pulito ed è tutto stropicciato! Stira finché è
          ben liscio.
        pt: O bebé diplódoco enroscou-se na roupa lavada e ficou toda amarrotada! Passa a ferro até ficar bem lisinha.
        br: O bebê diplodoco se enrolou na roupa limpa e ficou tudo amassado! Passe a ferro até ficar bem lisinho.
        nl: De babydiplodocus heeft opgekruld op de schone was gelegen en alles is gekreukt! Strijk tot alles mooi
          glad is.
      dt_a_linge_09:
        fr: 'Le petit iguanodon a reniflé la machine à laver : le joint et le bac sentent le moisi ! Nettoie-les
          et démarre un cycle à vide.'
        en: 'The little iguanodon sniffed the washing machine: the seal and drawer smell mouldy! Clean them and
          run an empty cycle.'
        es: '¡El pequeño iguanodonte ha olfateado la lavadora: la goma y el cajetín huelen a moho! Límpialos y pon
          un ciclo en vacío.'
        de: 'Der kleine Iguanodon hat an der Waschmaschine geschnuppert: Dichtung und Fach riechen muffig! Putz
          sie und starte einen Leerlauf.'
        it: 'Il piccolo iguanodonte ha annusato la lavatrice: la guarnizione e la vaschetta sanno di muffa! Puliscile
          e avvia un ciclo a vuoto.'
        pt: 'O pequeno iguanodonte cheirou a máquina de lavar: a borracha e a gaveta cheiram a bolor! Limpa-as e
          põe um ciclo em vazio.'
        br: 'O pequeno iguanodonte cheirou a máquina de lavar: a borracha e a gaveta estão com cheiro de mofo! Limpe
          e ligue um ciclo vazio.'
        nl: 'De kleine iguanodon snuffelde aan de wasmachine: de rubberen rand en het bakje ruiken muf! Maak ze
          schoon en draai een lege wasbeurt.'
      dt_a_moto_01:
        fr: 'Le bébé tricératops a fait une balade en moto dans la boue : elle est couverte de terre et de moucherons
          ! Nettoie-la jusqu''à ce qu''elle brille.'
        en: 'The baby triceratops went for a muddy motorbike ride: it''s covered in dirt and bugs! Clean it until
          it shines.'
        es: ¡El bebé triceratops ha dado un paseo en moto por el barro y está llena de tierra y mosquitos! Límpiala
          hasta que brille.
        de: 'Das Triceratops-Baby hat eine Motorradtour durch den Matsch gemacht: alles voller Erde und Mücken!
          Putz das Motorrad, bis es glänzt.'
        it: 'Il cucciolo di triceratopo ha fatto un giro in moto nel fango: è coperta di terra e moscerini! Puliscila
          finché brilla.'
        pt: 'O bebé tricerátopo deu uma volta de mota na lama: está coberta de terra e mosquitos! Limpa-a até brilhar.'
        br: 'O bebê tricerátopo deu uma volta de moto na lama: ela está coberta de terra e mosquitinhos! Limpe até
          brilhar.'
        nl: 'De babytriceratops maakte een motorritje door de modder: hij zit vol aarde en vliegjes! Poets de motor
          tot hij glanst.'
      dt_a_repas_06:
        fr: Le ventre du petit diplodocus gargouille, et toute la tribu a faim ! Cuisine un plat simple et sers-le
          bien chaud.
        en: The little diplodocus's tummy is rumbling, and the whole tribe is hungry! Cook a simple dish and serve
          it nice and hot.
        es: ¡Al pequeño diplodocus le ruge la barriga y toda la tribu tiene hambre! Cocina un plato sencillo y sírvelo
          bien calentito.
        de: Dem kleinen Diplodocus knurrt der Bauch, und der ganze Stamm hat Hunger! Koch ein einfaches Gericht
          und servier es schön warm.
        it: Al piccolo diplodoco brontola la pancia e tutta la tribù ha fame! Cucina un piatto semplice e servilo
          bello caldo.
        pt: A barriga do pequeno diplódoco ronca e a tribo toda tem fome! Cozinha um prato simples e serve-o bem
          quentinho.
        br: A barriga do pequeno diplodoco está roncando e a tribo toda está com fome! Cozinhe um prato simples
          e sirva bem quentinho.
        nl: Het buikje van de kleine diplodocus rommelt en de hele stam heeft honger! Kook een eenvoudig gerecht
          en dien het warm op.
      dt_a_repas_07:
        fr: Le bébé tricératops souffle sur son assiette, mais elle est toute froide ! Réchauffe le plat et sers-le
          à bonne température.
        en: The baby triceratops is blowing on its plate, but it's stone cold! Heat up the dish and serve it at
          just the right temperature.
        es: ¡El bebé triceratops sopla su plato, pero está frío! Calienta la comida y sírvela a buena temperatura.
        de: Das Triceratops-Baby pustet auf seinen Teller, aber er ist ganz kalt! Wärm das Essen auf und servier
          es mit der richtigen Temperatur.
        it: Il cucciolo di triceratopo soffia sul piatto, ma è tutto freddo! Riscalda il cibo e servilo alla giusta
          temperatura.
        pt: O bebé tricerátopo sopra o prato, mas está frio! Aquece a comida e serve-a à temperatura certa.
        br: O bebê tricerátopo assopra o prato, mas ele está frio! Esquente a comida e sirva na temperatura certa.
        nl: De babytriceratops blaast op zijn bord, maar het is koud! Warm het eten op en dien het op de goede temperatuur
          op.
      dt_a_repas_10:
        fr: Le petit stégosaure a mis son bavoir, et toute la tribu attend le repas de tous les jours ! Prépare
          un plat sain et nourrissant, et sers-le chaud.
        en: The little stegosaurus has its bib on, and the whole tribe is waiting for the everyday meal! Make a
          healthy, filling dish and serve it hot.
        es: ¡El pequeño estegosaurio ya lleva su babero y toda la tribu espera la comida de cada día! Prepara un
          plato sano y nutritivo y sírvelo caliente.
        de: Der kleine Stegosaurus hat sein Lätzchen um, und der ganze Stamm wartet aufs Alltagsessen! Koch etwas
          Gesundes, Sättigendes und servier es warm.
        it: Il piccolo stegosauro ha già il bavaglino e tutta la tribù aspetta il pasto di ogni giorno! Prepara
          un piatto sano e nutriente e servilo caldo.
        pt: O pequeno estegossauro já pôs o babete e a tribo toda espera a refeição do dia a dia! Prepara um prato
          saudável e nutritivo e serve-o quente.
        br: O pequeno estegossauro já pôs o babador e a tribo toda espera a comida do dia a dia! Prepare um prato
          saudável e nutritivo e sirva quente.
        nl: De kleine stegosaurus heeft zijn slabbetje al om en de hele stam wacht op het gewone avondeten! Maak
          een gezond, voedzaam gerecht en dien het warm op.
      dt_a_repas_11:
        fr: 'Grande fête dans la Vallée Verte : tous les dinos sont invités ! Prépare un repas gastronomique à plusieurs
          plats et dresse-le avec soin.'
        en: 'Big party in Green Valley: all the dinos are invited! Make a fancy meal with several courses and plate
          it with care.'
        es: '¡Gran fiesta en el Valle Verde: todos los dinos están invitados! Prepara una comida de lujo con varios
          platos y preséntala con mimo.'
        de: 'Großes Fest im Grünen Tal: Alle Dinos sind eingeladen! Koch ein feines Menü mit mehreren Gängen und
          richte es liebevoll an.'
        it: 'Grande festa nella Valle Verde: tutti i dino sono invitati! Prepara un pranzo raffinato con più portate
          e impiattalo con cura.'
        pt: 'Grande festa no Vale Verde: todos os dinos estão convidados! Prepara uma refeição requintada com vários
          pratos e apresenta-a com carinho.'
        br: 'Grande festa no Vale Verde: todos os dinos foram convidados! Prepare uma refeição caprichada com vários
          pratos e monte tudo com carinho.'
        nl: 'Groot feest in de Groene Vallei: alle dino''s zijn uitgenodigd! Maak een chique maaltijd met meerdere
          gangen en richt alles mooi aan.'
      dt_a_salle_de_bain_01:
        fr: Le petit ankylosaure s'est secoué après son bain et la poussière a volé dans toute la salle de bain
          ! Passe l'aspirateur ou le balai partout, même dans les coins.
        en: The little ankylosaurus shook itself after its bath and dust flew all over the bathroom! Vacuum or sweep
          everywhere, corners too.
        es: ¡El pequeño anquilosaurio se ha sacudido después del baño y el polvo ha volado por todo el cuarto de
          baño! Pasa la aspiradora o la escoba por todo.
        de: Der kleine Ankylosaurus hat sich nach dem Baden geschüttelt, jetzt fliegt überall im Bad Staub herum!
          Saug oder feg überall, auch in den Ecken.
        it: Il piccolo anchilosauro si è scrollato dopo il bagno e la polvere è volata in tutto il bagno! Passa
          l'aspirapolvere o la scopa ovunque, anche negli angoli.
        pt: O pequeno anquilossauro sacudiu-se depois do banho e o pó voou pela casa de banho toda! Aspira ou varre
          tudo, até os cantinhos.
        br: O pequeno anquilossauro se sacudiu depois do banho e a poeira voou pelo banheiro todo! Aspire ou varra
          tudo, até os cantinhos.
        nl: De kleine ankylosaurus schudde zich uit na zijn bad en het stof vloog door de hele badkamer! Stofzuig
          of veeg overal, ook in de hoekjes.
      dt_a_salle_de_bain_02:
        fr: 'Le bébé ptérodactyle a fait sa toilette en battant des ailes : de la poussière partout dans la salle
          de bain ! Fais les poussières sur chaque surface.'
        en: 'The baby pterodactyl flapped its wings while washing up: dust all over the bathroom! Dust every surface.'
        es: ¡El bebé pterodáctilo se ha aseado batiendo las alas y hay polvo por todo el cuarto de baño! Quita el
          polvo de cada superficie.
        de: 'Das Flugsaurier-Baby hat sich beim Waschen mit den Flügeln geschüttelt: überall Staub im Bad! Wisch
          jede Fläche ab.'
        it: 'Il cucciolo di pterodattilo si è lavato sbattendo le ali: polvere in tutto il bagno! Spolvera ogni
          superficie.'
        pt: 'O bebé pterodáctilo lavou-se a bater as asas: há pó por toda a casa de banho! Limpa o pó de cada superfície.'
        br: 'O bebê pterodáctilo se lavou batendo as asas: tem poeira pelo banheiro todo! Tire o pó de cada superfície.'
        nl: 'De babypterodactylus wapperde met zijn vleugels bij het wassen: overal stof in de badkamer! Stof elk
          oppervlak af.'
      dt_a_salle_de_bain_03:
        fr: 'Splash ! Le petit tricératops est sorti du bain sans serviette : le sol de la salle de bain est tout
          collant ! Passe la serpillière jusqu''à ce qu''il brille.'
        en: 'Splash! The little triceratops got out of the bath without a towel: the bathroom floor is all sticky!
          Mop until it shines.'
        es: ¡Splash! ¡El pequeño triceratops ha salido del baño sin toalla y el suelo del cuarto de baño está pegajoso!
          Friega hasta que brille.
        de: 'Platsch! Der kleine Triceratops ist ohne Handtuch aus der Wanne gestiegen: Der Badboden klebt! Wisch,
          bis er glänzt.'
        it: 'Splash! Il piccolo triceratopo è uscito dal bagno senza asciugamano: il pavimento del bagno è appiccicoso!
          Passa lo straccio finché brilla.'
        pt: 'Splash! O pequeno tricerátopo saiu do banho sem toalha: o chão da casa de banho está pegajoso! Passa
          a esfregona até brilhar.'
        br: 'Splash! O pequeno tricerátopo saiu do banho sem toalha: o chão do banheiro está grudento! Passe pano
          até brilhar.'
        nl: 'Plons! De kleine triceratops stapte zonder handdoek uit bad: de badkamervloer plakt! Dweil tot hij
          glanst.'
      dt_a_salle_de_bain_04:
        fr: Le bébé diplodocus a dessiné des cœurs dans la buée des vitres de la salle de bain ! Nettoie-les jusqu'à
          ce qu'elles soient transparentes.
        en: The baby diplodocus drew hearts in the steam on the bathroom windows! Clean them until they're perfectly
          clear.
        es: ¡El bebé diplodocus ha dibujado corazones en el vaho de los cristales del cuarto de baño! Límpialos
          hasta que estén transparentes.
        de: Das Diplodocus-Baby hat Herzen auf die beschlagenen Badfenster gemalt! Putz sie, bis sie ganz klar sind.
        it: Il cucciolo di diplodoco ha disegnato cuoricini sui vetri appannati del bagno! Puliscili finché sono
          trasparenti.
        pt: O bebé diplódoco desenhou corações nos vidros embaciados da casa de banho! Limpa-os até ficarem transparentes.
        br: O bebê diplodoco desenhou coraçõezinhos nos vidros embaçados do banheiro! Limpe até ficarem transparentes.
        nl: De babydiplodocus tekende hartjes op de beslagen ramen van de badkamer! Poets ze tot ze helemaal doorzichtig
          zijn.
      dt_a_salle_de_bain_05:
        fr: 'Le petit iguanodon s''est brossé les dents en éclaboussant tout le lavabo : il y a des traces blanches
          partout ! Récure le lavabo et le robinet jusqu''à ce qu''ils brillent.'
        en: 'The little iguanodon splashed the whole sink while brushing its teeth: white marks everywhere! Scrub
          the sink and tap until they shine.'
        es: ¡El pequeño iguanodonte ha salpicado todo el lavabo al lavarse los dientes y hay marcas blancas! Frota
          el lavabo y el grifo hasta que brillen.
        de: 'Der kleine Iguanodon hat beim Zähneputzen das ganze Waschbecken bespritzt: überall weiße Flecken! Schrubb
          Becken und Wasserhahn, bis sie glänzen.'
        it: 'Il piccolo iguanodonte ha schizzato tutto il lavandino lavandosi i denti: segni bianchi ovunque! Strofina
          lavandino e rubinetto finché brillano.'
        pt: 'O pequeno iguanodonte salpicou o lavatório todo a lavar os dentes: há marcas brancas por todo o lado!
          Esfrega o lavatório e a torneira até brilharem.'
        br: 'O pequeno iguanodonte espirrou água na pia toda ao escovar os dentes: tem marcas brancas por todo lado!
          Esfregue a pia e a torneira até brilharem.'
        nl: 'De kleine iguanodon spetterde bij het tandenpoetsen de hele wastafel vol: overal witte vlekken! Schrob
          wastafel en kraan tot ze glanzen.'
      dt_a_salle_de_bain_06:
        fr: Le bébé stégosaure veut se coiffer, mais le miroir de la salle de bain est tout embué ! Nettoie-le jusqu'à
          un reflet clair et net.
        en: The baby stegosaurus wants to do its hair, but the bathroom mirror is all steamed up! Clean it until
          the reflection is clear.
        es: ¡El bebé estegosaurio quiere peinarse, pero el espejo del cuarto de baño está empañado! Límpialo hasta
          que refleje bien.
        de: Das Stegosaurus-Baby will sich kämmen, aber der Badspiegel ist ganz beschlagen! Putz ihn, bis er wieder
          klar ist.
        it: Il cucciolo di stegosauro vuole pettinarsi, ma lo specchio del bagno è tutto appannato! Puliscilo finché
          il riflesso è chiaro.
        pt: O bebé estegossauro quer pentear-se, mas o espelho da casa de banho está embaciado! Limpa-o até o reflexo
          ficar claro.
        br: O bebê estegossauro quer se pentear, mas o espelho do banheiro está todo embaçado! Limpe até o reflexo
          ficar claro.
        nl: De babystegosaurus wil zijn haar doen, maar de badkamerspiegel is beslagen! Poets tot hij weer helder
          is.
      dt_a_salle_de_bain_07:
        fr: 'Le petit tricératops ne veut plus se doucher : les parois, les joints et la bonde sont pleins de calcaire
          et de moisi ! Récure la douche jusqu''à ce qu''elle soit nette.'
        en: 'The little triceratops won''t shower: the walls, grout and drain are covered in limescale and mould!
          Scrub the shower until it''s spotless.'
        es: '¡El pequeño triceratops ya no quiere ducharse: mamparas, juntas y desagüe tienen cal y moho! Frota
          la ducha hasta que quede impecable.'
        de: 'Der kleine Triceratops will nicht mehr duschen: Wände, Fugen und Abfluss sind voller Kalk und Schimmel!
          Schrubb die Dusche, bis sie sauber ist.'
        it: 'Il piccolo triceratopo non vuole più fare la doccia: pareti, fughe e scarico sono pieni di calcare
          e muffa! Strofina la doccia finché è pulita.'
        pt: 'O pequeno tricerátopo já não quer tomar duche: paredes, juntas e ralo estão cheios de calcário e bolor!
          Esfrega o duche até ficar impecável.'
        br: 'O pequeno tricerátopo não quer mais tomar banho: box, rejuntes e ralo estão cheios de calcário e mofo!
          Esfregue o chuveiro até ficar impecável.'
        nl: 'De kleine triceratops wil niet meer douchen: wanden, voegen en afvoer zitten vol kalk en schimmel!
          Schrob de douche tot hij schoon is.'
      dt_a_salle_de_bain_08:
        fr: Le bébé ankylosaure a laissé un grand cercle de mousse sale autour de la baignoire ! Récure jusqu'à
          une baignoire nette, sans aucun anneau.
        en: The baby ankylosaurus left a big dirty ring around the bathtub! Scrub until the tub is spotless, with
          no ring left.
        es: ¡El bebé anquilosaurio ha dejado un gran cerco de espuma sucia en la bañera! Frota hasta que quede impecable,
          sin ningún cerco.
        de: Das Ankylosaurus-Baby hat einen dicken Schmutzrand in der Badewanne hinterlassen! Schrubb, bis die Wanne
          sauber ist und kein Rand mehr bleibt.
        it: Il cucciolo di anchilosauro ha lasciato un grande alone di schiuma sporca nella vasca! Strofina finché
          è pulita, senza aloni.
        pt: O bebé anquilossauro deixou uma grande marca de espuma suja à volta da banheira! Esfrega até ficar impecável,
          sem marca nenhuma.
        br: O bebê anquilossauro deixou uma marca grande de espuma suja em volta da banheira! Esfregue até ficar
          impecável, sem marca nenhuma.
        nl: De babyankylosaurus liet een grote vieze schuimrand achter in het bad! Schrob tot het bad schoon is,
          zonder rand.
      dt_a_salle_de_bain_10:
        fr: 'Le petit diplodocus s''est essuyé avec toutes les serviettes : elles traînent mouillées partout ! Remplace-les
          par des serviettes propres et sèches.'
        en: The little diplodocus dried off with every towel and they're lying around wet! Replace them with clean,
          dry towels.
        es: ¡El pequeño diplodocus se ha secado con todas las toallas y están mojadas por todas partes! Cámbialas
          por toallas limpias y secas.
        de: Der kleine Diplodocus hat sich mit allen Handtüchern abgetrocknet, jetzt liegen sie nass herum! Ersetz
          sie durch saubere, trockene.
        it: Il piccolo diplodoco si è asciugato con tutti gli asciugamani e sono bagnati ovunque! Sostituiscili
          con asciugamani puliti e asciutti.
        pt: O pequeno diplódoco limpou-se a todas as toalhas e estão molhadas por todo o lado! Troca-as por toalhas
          lavadas e secas.
        br: O pequeno diplodoco se secou com todas as toalhas e elas estão molhadas por todo lado! Troque por toalhas
          limpas e secas.
        nl: De kleine diplodocus droogde zich af met alle handdoeken en ze liggen overal nat! Vervang ze door schone,
          droge handdoeken.
      dt_a_salle_de_bain_11:
        fr: Le bébé tricératops a trouvé des taches noires dans les joints du carrelage de la salle de bain ! Récure
          jusqu'à des joints nets et clairs.
        en: The baby triceratops found black spots in the bathroom tile grout! Scrub until the grout is clean and
          bright.
        es: ¡El bebé triceratops ha encontrado manchas negras en las juntas de los azulejos del baño! Frota hasta
          que las juntas queden limpias y claras.
        de: Das Triceratops-Baby hat schwarze Flecken in den Fliesenfugen im Bad gefunden! Schrubb, bis die Fugen
          sauber und hell sind.
        it: Il cucciolo di triceratopo ha trovato macchie nere nelle fughe delle piastrelle del bagno! Strofina
          finché le fughe sono pulite e chiare.
        pt: O bebé tricerátopo encontrou manchas pretas nas juntas dos azulejos da casa de banho! Esfrega até as
          juntas ficarem limpas e claras.
        br: O bebê tricerátopo achou manchas pretas nos rejuntes do azulejo do banheiro! Esfregue até os rejuntes
          ficarem limpos e claros.
        nl: De babytriceratops vond zwarte vlekjes in de voegen van de badkamertegels! Schrob tot de voegen schoon
          en licht zijn.
      dt_a_salle_de_bain_12:
        fr: Le petit stégosaure veut se mirer dans les robinets de la salle de bain, mais ils sont couverts de calcaire
          ! Détartre-les jusqu'à ce qu'ils brillent.
        en: The little stegosaurus wants to see itself in the bathroom taps, but they're covered in limescale! Descale
          them until they shine.
        es: ¡El pequeño estegosaurio quiere mirarse en los grifos del baño, pero están llenos de cal! Quítales la
          cal hasta que brillen.
        de: Der kleine Stegosaurus will sich in den Wasserhähnen im Bad spiegeln, aber sie sind voller Kalk! Entkalke
          sie, bis sie glänzen.
        it: Il piccolo stegosauro vuole specchiarsi nei rubinetti del bagno, ma sono pieni di calcare! Togli il
          calcare finché brillano.
        pt: O pequeno estegossauro quer ver-se nas torneiras da casa de banho, mas estão cheias de calcário! Tira
          o calcário até brilharem.
        br: O pequeno estegossauro quer se ver nas torneiras do banheiro, mas elas estão cheias de calcário! Tire
          o calcário até brilharem.
        nl: De kleine stegosaurus wil zichzelf zien in de badkamerkranen, maar ze zitten vol kalk! Ontkalk ze tot
          ze glanzen.
      dt_a_salon_01:
        fr: Le petit tricératops s'est roulé dans la poussière du salon ! Passe l'aspirateur ou le balai partout,
          même dans les coins et sous les meubles.
        en: The little triceratops rolled in the living room dust! Vacuum or sweep everywhere, even in the corners
          and under the furniture.
        es: ¡El pequeño triceratops se ha revolcado en el polvo del salón! Pasa la aspiradora o la escoba por todo,
          también en los rincones y bajo los muebles.
        de: Der kleine Triceratops hat sich im Staub vom Wohnzimmer gewälzt! Saug oder feg überall, auch in den
          Ecken und unter den Möbeln.
        it: Il piccolo triceratopo si è rotolato nella polvere del soggiorno! Passa l'aspirapolvere o la scopa ovunque,
          anche negli angoli e sotto i mobili.
        pt: O pequeno tricerátopo rebolou no pó da sala! Aspira ou varre tudo, até os cantinhos e debaixo dos móveis.
        br: O pequeno tricerátopo rolou na poeira da sala! Aspire ou varra tudo, até os cantinhos e embaixo dos
          móveis.
        nl: De kleine triceratops heeft gerold in het stof van de woonkamer! Stofzuig of veeg overal, ook in de
          hoekjes en onder de meubels.
      dt_a_salon_02:
        fr: 'Atchoum ! Le bébé diplodocus éternue : il y a de la poussière sur les étagères, les meubles et les
          bibelots du salon ! Fais les poussières partout.'
        en: 'Achoo! The baby diplodocus is sneezing: there''s dust on the living room shelves, furniture and ornaments!
          Dust everything.'
        es: '¡Achís! ¡El bebé diplodocus estornuda: hay polvo en las estanterías, los muebles y los adornos del
          salón! Quita el polvo de todo.'
        de: 'Hatschi! Das Diplodocus-Baby niest: Auf Regalen, Möbeln und Deko im Wohnzimmer liegt Staub! Wisch überall
          Staub.'
        it: 'Etciù! Il cucciolo di diplodoco starnutisce: c''è polvere su scaffali, mobili e soprammobili del soggiorno!
          Spolvera tutto.'
        pt: 'Atchim! O bebé diplódoco espirra: há pó nas prateleiras, nos móveis e nos enfeites da sala! Limpa o
          pó de tudo.'
        br: 'Atchim! O bebê diplodoco espirra: tem poeira nas prateleiras, nos móveis e nos enfeites da sala! Tire
          o pó de tudo.'
        nl: 'Hatsjoe! De babydiplodocus niest: er ligt stof op de planken, meubels en snuisterijen in de woonkamer!
          Stof alles af.'
      dt_a_salon_03:
        fr: Le petit iguanodon a fait du patin avec ses pattes mouillées sur le sol du salon ! Passe la serpillière
          jusqu'à ce qu'il brille, sans aucune trace.
        en: The little iguanodon went skating on the living room floor with wet feet! Mop until it shines, with
          no marks left.
        es: ¡El pequeño iguanodonte ha patinado con las patas mojadas por el suelo del salón! Friega hasta que brille,
          sin ninguna marca.
        de: Der kleine Iguanodon ist mit nassen Füßen übers Wohnzimmer geschlittert! Wisch, bis der Boden glänzt
          und keine Spuren bleiben.
        it: Il piccolo iguanodonte ha pattinato con le zampe bagnate sul pavimento del soggiorno! Passa lo straccio
          finché brilla, senza aloni.
        pt: O pequeno iguanodonte patinou com as patas molhadas no chão da sala! Passa a esfregona até brilhar,
          sem marca nenhuma.
        br: O pequeno iguanodonte patinou com as patas molhadas no chão da sala! Passe pano até brilhar, sem nenhuma
          marca.
        nl: De kleine iguanodon is met natte pootjes over de woonkamervloer geschaatst! Dweil tot hij glanst, zonder
          strepen.
      dt_a_salon_04:
        fr: Le bébé tricératops a collé son museau aux vitres du salon pour regarder les papillons ! Nettoie-les
          jusqu'à ce qu'elles soient transparentes, sans traces.
        en: The baby triceratops pressed its snout against the living room windows to watch the butterflies! Clean
          them until they're clear, with no streaks.
        es: ¡El bebé triceratops ha pegado el hocico a los cristales del salón para mirar las mariposas! Límpialos
          hasta que estén transparentes.
        de: Das Triceratops-Baby hat die Schnauze an die Wohnzimmerfenster gedrückt, um Schmetterlinge zu sehen!
          Putz sie streifenfrei und klar.
        it: Il cucciolo di triceratopo ha schiacciato il muso sui vetri del soggiorno per guardare le farfalle!
          Puliscili finché sono trasparenti, senza aloni.
        pt: O bebé tricerátopo encostou o focinho aos vidros da sala para ver as borboletas! Limpa-os até ficarem
          transparentes, sem marcas.
        br: O bebê tricerátopo grudou o focinho nos vidros da sala para ver as borboletas! Limpe até ficarem transparentes,
          sem marcas.
        nl: De babytriceratops drukte zijn snuit tegen de woonkamerramen om naar vlinders te kijken! Poets ze helemaal
          doorzichtig, zonder strepen.
      dt_a_salon_05:
        fr: Le petit stégosaure a vu des taches grises sur les murs du salon et ça le chiffonne ! Nettoie les murs
          jusqu'à ce qu'ils soient propres, sans aucune tache.
        en: The little stegosaurus spotted grey marks on the living room walls and it's bothering it! Wash the walls
          until they're clean, with no stains.
        es: ¡El pequeño estegosaurio ha visto manchas grises en las paredes del salón y eso le preocupa! Limpia
          las paredes hasta que no quede ni una mancha.
        de: Der kleine Stegosaurus hat graue Flecken an den Wohnzimmerwänden entdeckt, und das stört ihn! Wisch
          die Wände, bis kein Fleck mehr da ist.
        it: Il piccolo stegosauro ha visto macchie grigie sui muri del soggiorno e non è contento! Pulisci i muri
          finché non c'è più nessuna macchia.
        pt: O pequeno estegossauro viu manchas cinzentas nas paredes da sala e não gostou nada! Limpa as paredes
          até não haver mancha nenhuma.
        br: O pequeno estegossauro viu manchas cinza nas paredes da sala e ficou chateado! Limpe as paredes até
          não sobrar nenhuma mancha.
        nl: De kleine stegosaurus zag grijze vlekken op de woonkamermuren en dat zit hem dwars! Was de muren tot
          er geen vlek meer is.
      dt_a_salon_06:
        fr: 'Le bébé diplodocus fait des grimaces au miroir du salon, mais il ne se voit plus : tout est terne !
          Nettoie-le jusqu''à un reflet clair, sans traces.'
        en: The baby diplodocus is pulling faces at the living room mirror, but it can't see itself, it's all dull!
          Clean it until it's clear, with no streaks.
        es: ¡El bebé diplodocus hace muecas al espejo del salón, pero ya no se ve porque está empañado! Límpialo
          hasta que refleje bien, sin marcas.
        de: Das Diplodocus-Baby schneidet Grimassen vor dem Wohnzimmerspiegel, sieht sich aber nicht, alles ist
          matt! Putz ihn streifenfrei und klar.
        it: Il cucciolo di diplodoco fa le smorfie allo specchio del soggiorno, ma non si vede, è tutto opaco! Puliscilo
          finché il riflesso è chiaro.
        pt: O bebé diplódoco faz caretas ao espelho da sala, mas já não se vê, está todo baço! Limpa-o até o reflexo
          ficar claro, sem marcas.
        br: O bebê diplodoco faz careta no espelho da sala, mas não se enxerga, está todo opaco! Limpe até o reflexo
          ficar claro, sem marcas.
        nl: 'De babydiplodocus trekt gekke bekken naar de woonkamerspiegel, maar ziet zichzelf niet: alles is dof!
          Poets hem helder, zonder strepen.'
      dt_a_salon_07:
        fr: Le bébé stégosaure a renversé ses jouets partout dans le salon ! Range chaque objet à sa place dans
          le grand panier.
        en: The baby stegosaurus tipped its toys out all over the living room! Put every item back in its place
          in the big basket.
        es: ¡El bebé estegosaurio ha volcado sus juguetes por todo el salón! Guarda cada cosa en su sitio, en la
          cesta grande.
        de: Das Stegosaurus-Baby hat seine Spielsachen im ganzen Wohnzimmer verteilt! Räum alles an seinen Platz
          in den großen Korb.
        it: Il cucciolo di stegosauro ha sparso i suoi giochi in tutto il soggiorno! Rimetti ogni cosa al suo posto
          nel cesto grande.
        pt: O bebé estegossauro espalhou os brinquedos pela sala toda! Arruma cada coisa no seu lugar, no cesto
          grande.
        br: O bebê estegossauro espalhou os brinquedos pela sala toda! Guarde cada coisa no lugar, no cesto grande.
        nl: De babystegosaurus heeft zijn speelgoed door de hele woonkamer gestrooid! Ruim alles op zijn plek in
          de grote mand.
      dt_a_salon_08:
        fr: 'Le petit tricératops a goûté sur le canapé : des miettes partout dans les coussins ! Aspire ou dépoussière
          coussins et recoins jusqu''à un canapé impeccable.'
        en: 'The little triceratops had a snack on the sofa: crumbs all over the cushions! Vacuum or dust the cushions
          and nooks until the sofa is spotless.'
        es: ¡El pequeño triceratops ha merendado en el sofá y hay migas en todos los cojines! Aspira o sacude cojines
          y rincones hasta dejarlo impecable.
        de: 'Der kleine Triceratops hat auf dem Sofa gevespert: überall Krümel in den Kissen! Saug oder klopf Kissen
          und Ritzen aus, bis das Sofa tipptopp ist.'
        it: 'Il piccolo triceratopo ha fatto merenda sul divano: briciole in tutti i cuscini! Aspira o spolvera
          cuscini e angoli finché il divano è perfetto.'
        pt: 'O pequeno tricerátopo lanchou no sofá: há migalhas nas almofadas todas! Aspira ou sacode almofadas
          e cantinhos até o sofá ficar impecável.'
        br: 'O pequeno tricerátopo lanchou no sofá: tem farelo em todas as almofadas! Aspire ou tire o pó de almofadas
          e cantinhos até o sofá ficar impecável.'
        nl: 'De kleine triceratops heeft op de bank gesnoept: overal kruimels in de kussens! Stofzuig of klop kussens
          en hoekjes uit tot de bank brandschoon is.'
      dt_a_salon_09:
        fr: 'Le bébé ankylosaure s''est vautré tout boueux sur le canapé : il y a des taches partout ! Shampouine
          ou nettoie jusqu''à un tissu propre, sans odeur.'
        en: 'The baby ankylosaurus flopped onto the sofa all muddy: there are stains everywhere! Shampoo or clean
          until the fabric is fresh, with no smell.'
        es: ¡El bebé anquilosaurio se ha tumbado lleno de barro en el sofá y hay manchas por todas partes! Limpia
          bien la tapicería hasta que quede limpia y sin olor.
        de: 'Das Ankylosaurus-Baby hat sich voller Matsch aufs Sofa gelegt: überall Flecken! Schamponier oder reinige
          den Stoff, bis er sauber ist und nicht riecht.'
        it: 'Il cucciolo di anchilosauro si è sdraiato tutto infangato sul divano: macchie ovunque! Smacchia o pulisci
          finché il tessuto è pulito e senza odori.'
        pt: 'O bebé anquilossauro deitou-se todo enlameado no sofá: há nódoas por todo o lado! Champoa ou limpa
          até o tecido ficar limpo e sem cheiro.'
        br: 'O bebê anquilossauro deitou todo enlameado no sofá: tem mancha para todo lado! Lave ou limpe até o
          tecido ficar limpo e sem cheiro.'
        nl: 'De babyankylosaurus plofte vol modder op de bank: overal vlekken! Shampoo of reinig tot de stof schoon
          is en niet meer ruikt.'
      dt_a_terrasse_01:
        fr: Le vent a fait danser les feuilles sèches, et le bébé ptérodactyle les a toutes semées sur la terrasse
          ! Balaie jusqu'à ce que le sol soit dégagé.
        en: The wind made the dry leaves dance, and the baby pterodactyl scattered them all over the terrace! Sweep
          until the floor is clear.
        es: ¡El viento ha hecho bailar las hojas secas y el bebé pterodáctilo las ha esparcido por la terraza! Barre
          hasta que el suelo quede despejado.
        de: Der Wind hat die trockenen Blätter tanzen lassen, und das Flugsaurier-Baby hat sie auf der Terrasse
          verteilt! Feg, bis der Boden frei ist.
        it: Il vento ha fatto ballare le foglie secche e il cucciolo di pterodattilo le ha sparse sulla terrazza!
          Spazza finché il pavimento è libero.
        pt: O vento pôs as folhas secas a dançar e o bebé pterodáctilo espalhou-as pela varanda! Varre até o chão
          ficar limpinho.
        br: O vento fez as folhas secas dançarem e o bebê pterodáctilo espalhou todas pelo terraço! Varra até o
          chão ficar livre.
        nl: De wind liet de droge blaadjes dansen en de babypterodactylus strooide ze over het hele terras! Veeg
          tot de vloer leeg is.
      dt_a_terrasse_02:
        fr: 'Le petit tricératops a joué dans la boue puis sur la terrasse : elle est toute crottée ! Nettoie-la
          à grande eau jusqu''à un sol propre.'
        en: 'The little triceratops played in the mud and then on the terrace: it''s all grubby! Wash it with lots
          of water until the floor is clean.'
        es: ¡El pequeño triceratops ha jugado en el barro y luego en la terraza, y está toda sucia! Friégala con
          mucha agua hasta que quede limpia.
        de: 'Der kleine Triceratops hat im Matsch gespielt und dann auf der Terrasse: alles verdreckt! Schrubb sie
          mit viel Wasser, bis sie sauber ist.'
        it: 'Il piccolo triceratopo ha giocato nel fango e poi sulla terrazza: è tutta sporca! Puliscila con tanta
          acqua finché è pulita.'
        pt: 'O pequeno tricerátopo brincou na lama e depois na varanda: está toda suja! Esfrega-a com muita água
          até o chão ficar limpo.'
        br: 'O pequeno tricerátopo brincou na lama e depois no terraço: está todo sujo! Esfregue com bastante água
          até o chão ficar limpo.'
        nl: 'De kleine triceratops speelde in de modder en daarna op het terras: alles is vies! Schrob met veel
          water tot de vloer schoon is.'
      dt_a_terrasse_03:
        fr: Les plantes du balcon et de la terrasse ont chaud au soleil, et le bébé diplodocus leur fait de l'ombre
          ! Arrose-les toutes jusqu'à une terre bien humide.
        en: The balcony and terrace plants are hot in the sun, and the baby diplodocus is giving them shade! Water
          them all until the soil is nice and damp.
        es: ¡Las plantas del balcón y la terraza tienen calor al sol y el bebé diplodocus les da sombra! Riégalas
          todas hasta que la tierra esté húmeda.
        de: Den Pflanzen auf Balkon und Terrasse ist heiß in der Sonne, und das Diplodocus-Baby spendet ihnen Schatten!
          Gieß sie alle, bis die Erde schön feucht ist.
        it: Le piante del balcone e della terrazza hanno caldo al sole e il cucciolo di diplodoco fa loro ombra!
          Innaffiale tutte finché la terra è umida.
        pt: As plantas da varanda e do terraço têm calor ao sol e o bebé diplódoco faz-lhes sombra! Rega-as todas
          até a terra ficar húmida.
        br: As plantas da sacada e do terraço estão com calor no sol e o bebê diplodoco faz sombra para elas! Regue
          todas até a terra ficar úmida.
        nl: De planten op het balkon en terras hebben het warm in de zon en de babydiplodocus geeft ze schaduw!
          Geef ze allemaal water tot de aarde vochtig is.
      dt_a_toilettes_01:
        fr: Le bébé stégosaure a trouvé des moutons de poussière dans le petit coin ! Passe l'aspirateur ou le balai
          partout, même dans les coins.
        en: The baby stegosaurus found dust bunnies in the toilet! Vacuum or sweep everywhere, corners too.
        es: ¡El bebé estegosaurio ha encontrado pelusas de polvo en el aseo! Pasa la aspiradora o la escoba por
          todo, rincones incluidos.
        de: Das Stegosaurus-Baby hat Staubflusen im stillen Örtchen gefunden! Saug oder feg überall, auch in den
          Ecken.
        it: Il cucciolo di stegosauro ha trovato batuffoli di polvere nel bagnetto! Passa l'aspirapolvere o la scopa
          ovunque, anche negli angoli.
        pt: O bebé estegossauro encontrou cotão na casa de banho! Aspira ou varre tudo, até os cantinhos.
        br: O bebê estegossauro achou bolinhas de poeira no banheirinho! Aspire ou varra tudo, até os cantinhos.
        nl: De babystegosaurus vond stofpluisjes in het kleinste kamertje! Stofzuig of veeg overal, ook in de hoekjes.
      dt_a_toilettes_02:
        fr: Le petit ptérodactyle a fait voler la poussière partout dans le petit coin ! Fais les poussières sur
          chaque surface.
        en: The little pterodactyl made dust fly all over the toilet! Dust every surface.
        es: ¡El pequeño pterodáctilo ha hecho volar el polvo por todo el aseo! Quita el polvo de cada superficie.
        de: Der kleine Flugsaurier hat im stillen Örtchen überall Staub aufgewirbelt! Wisch jede Fläche ab.
        it: Il piccolo pterodattilo ha fatto volare la polvere in tutto il bagnetto! Spolvera ogni superficie.
        pt: O pequeno pterodáctilo fez voar o pó por toda a casa de banho! Limpa o pó de cada superfície.
        br: O pequeno pterodáctilo fez a poeira voar pelo banheirinho todo! Tire o pó de cada superfície.
        nl: De kleine pterodactylus liet overal stof opwaaien in het kleinste kamertje! Stof elk oppervlak af.
      dt_a_toilettes_03:
        fr: Le bébé iguanodon a fait des traces de pattes sur le sol du petit coin ! Passe la serpillière jusqu'à
          ce qu'il brille, sans trace collante.
        en: The baby iguanodon left footprints on the toilet floor! Mop until it shines, with no sticky spots.
        es: ¡El bebé iguanodonte ha dejado huellas en el suelo del aseo! Friega hasta que brille, sin manchas pegajosas.
        de: Das Iguanodon-Baby hat Fußspuren auf dem Boden im stillen Örtchen hinterlassen! Wisch, bis er glänzt
          und nichts klebt.
        it: Il cucciolo di iguanodonte ha lasciato impronte sul pavimento del bagnetto! Passa lo straccio finché
          brilla, senza nulla di appiccicoso.
        pt: O bebé iguanodonte deixou pegadas no chão da casa de banho! Passa a esfregona até brilhar, sem nada
          pegajoso.
        br: O bebê iguanodonte deixou pegadas no chão do banheirinho! Passe pano até brilhar, sem nada grudento.
        nl: De babyiguanodon liet pootafdrukken achter op de vloer van het kleinste kamertje! Dweil tot hij glanst
          en niets plakt.
      dt_a_toilettes_04:
        fr: 'Le petit tricératops refuse d''aller sur la cuvette : elle est pleine de tartre et de microbes ! Récure-la
          jusqu''à ce qu''elle soit nette et désinfectée.'
        en: 'The little triceratops won''t use the toilet bowl: it''s full of limescale and germs! Scrub it until
          it''s clean and disinfected.'
        es: '¡El pequeño triceratops no quiere usar el váter: está lleno de cal y microbios! Frótalo hasta que quede
          limpio y desinfectado.'
        de: 'Der kleine Triceratops will nicht aufs Klo: Die Schüssel ist voller Kalk und Bakterien! Schrubb sie,
          bis sie sauber und desinfiziert ist.'
        it: 'Il piccolo triceratopo non vuole usare il water: è pieno di calcare e microbi! Strofinalo finché è
          pulito e disinfettato.'
        pt: 'O pequeno tricerátopo não quer ir à sanita: está cheia de calcário e micróbios! Esfrega-a até ficar
          limpa e desinfetada.'
        br: 'O pequeno tricerátopo não quer usar o vaso: ele está cheio de calcário e micróbios! Esfregue até ficar
          limpo e desinfetado.'
        nl: 'De kleine triceratops wil niet op de wc-pot: hij zit vol kalk en bacteriën! Schrob hem tot hij schoon
          en ontsmet is.'
      dt_a_toilettes_06:
        fr: Le bébé diplodocus a remarqué des petites éclaboussures sur les murs du petit coin ! Nettoie-les jusqu'à
          des murs tout propres.
        en: The baby diplodocus spotted little splashes on the toilet walls! Clean them until the walls are spotless.
        es: ¡El bebé diplodocus ha visto salpicaduras en las paredes del aseo! Límpialas hasta que queden impecables.
        de: Das Diplodocus-Baby hat kleine Spritzer an den Wänden im stillen Örtchen entdeckt! Putz sie, bis die
          Wände sauber sind.
        it: Il cucciolo di diplodoco ha notato piccoli schizzi sui muri del bagnetto! Puliscili finché sono perfetti.
        pt: O bebé diplódoco reparou em salpicos nas paredes da casa de banho! Limpa-as até ficarem impecáveis.
        br: O bebê diplodoco viu respingos nas paredes do banheirinho! Limpe até ficarem impecáveis.
        nl: De babydiplodocus zag kleine spatjes op de muren van het kleinste kamertje! Poets ze tot de muren brandschoon
          zijn.
      dt_a_vaisselle_01:
        fr: Le petit stégosaure a mangé dans toutes les assiettes, et elles s'empilent dans l'évier ! Fais la vaisselle
          jusqu'à ce que tout soit propre et à sécher.
        en: The little stegosaurus ate off every plate and they're piling up in the sink! Do the dishes until everything
          is clean and drying.
        es: ¡El pequeño estegosaurio ha comido en todos los platos y se amontonan en el fregadero! Friega hasta
          que todo esté limpio y secándose.
        de: Der kleine Stegosaurus hat von allen Tellern gegessen, jetzt stapeln sie sich in der Spüle! Spül ab,
          bis alles sauber zum Trocknen steht.
        it: Il piccolo stegosauro ha mangiato in tutti i piatti e si accumulano nel lavello! Fai i piatti finché
          è tutto pulito e ad asciugare.
        pt: O pequeno estegossauro comeu em todos os pratos e estão empilhados na banca! Faz a loiça até estar tudo
          limpo e a secar.
        br: O pequeno estegossauro comeu em todos os pratos e eles estão empilhados na pia! Lave a louça até tudo
          ficar limpo e secando.
        nl: De kleine stegosaurus heeft van alle borden gegeten en ze stapelen zich op in de gootsteen! Was af tot
          alles schoon staat te drogen.
      dt_a_vaisselle_02:
        fr: Après la grande fête des dinos, une montagne de vaisselle déborde de l'évier ! Fais toute la grosse
          vaisselle jusqu'à ce que tout soit propre et à sécher.
        en: After the big dino party, a mountain of dishes is spilling out of the sink! Wash it all until everything
          is clean and drying.
        es: ¡Después de la gran fiesta de los dinos, una montaña de platos rebosa del fregadero! Friégalo todo hasta
          que esté limpio y secándose.
        de: Nach dem großen Dino-Fest quillt ein Berg Geschirr aus der Spüle! Spül alles ab, bis es sauber zum Trocknen
          steht.
        it: Dopo la grande festa dei dino, una montagna di piatti trabocca dal lavello! Pulisci tutto finché è pulito
          e ad asciugare.
        pt: Depois da grande festa dos dinos, uma montanha de loiça transborda da banca! Esfrega tudo até estar
          limpo e a secar.
        br: Depois da grande festa dos dinos, uma montanha de louça transborda da pia! Lave tudo até ficar limpo
          e secando.
        nl: Na het grote dinofeest puilt er een berg afwas uit de gootsteen! Was alles af tot het schoon staat te
          drogen.
      dt_a_vaisselle_03:
        fr: Le bébé tricératops a fait une tour de vaisselle sale devant le lave-vaisselle ! Remplis-le entièrement
          et démarre le cycle.
        en: The baby triceratops built a tower of dirty dishes in front of the dishwasher! Load it all the way and
          start the cycle.
        es: ¡El bebé triceratops ha hecho una torre de platos sucios delante del lavavajillas! Llénalo entero y
          ponlo en marcha.
        de: Das Triceratops-Baby hat vor der Spülmaschine einen Turm aus schmutzigem Geschirr gebaut! Räum sie ganz
          ein und starte sie.
        it: Il cucciolo di triceratopo ha fatto una torre di piatti sporchi davanti alla lavastoviglie! Riempila
          tutta e avvia il ciclo.
        pt: O bebé tricerátopo fez uma torre de loiça suja à frente da máquina da loiça! Enche-a toda e põe-na a
          trabalhar.
        br: O bebê tricerátopo fez uma torre de louça suja na frente da máquina de lavar louça! Encha toda e ligue.
        nl: De babytriceratops bouwde een toren van vuile vaat voor de vaatwasser! Ruim hem helemaal in en zet hem
          aan.
      dt_a_vaisselle_04:
        fr: Le lave-vaisselle est plein de vaisselle propre, et le petit diplodocus voudrait son bol préféré ! Vide-le
          et range chaque pièce à sa place.
        en: The dishwasher is full of clean dishes, and the little diplodocus wants its favourite bowl! Empty it
          and put everything away.
        es: ¡El lavavajillas está lleno de platos limpios y el pequeño diplodocus quiere su cuenco favorito! Vacíalo
          y guarda cada cosa en su sitio.
        de: Die Spülmaschine ist voller sauberem Geschirr, und der kleine Diplodocus will seine Lieblingsschüssel!
          Räum sie aus und alles an seinen Platz.
        it: La lavastoviglie è piena di piatti puliti e il piccolo diplodoco vuole la sua ciotola preferita! Svuotala
          e metti tutto al suo posto.
        pt: A máquina da loiça está cheia de loiça lavada e o pequeno diplódoco quer a tigela preferida! Esvazia-a
          e arruma tudo no lugar.
        br: A máquina de lavar louça está cheia de louça limpa e o pequeno diplodoco quer a tigela favorita! Esvazie
          e guarde tudo no lugar.
        nl: De vaatwasser zit vol schone vaat en de kleine diplodocus wil zijn lievelingskom! Ruim hem uit en zet
          alles op zijn plek.
      dt_a_vaisselle_05:
        fr: Plic, ploc ! La vaisselle propre dégouline encore, et le bébé stégosaure joue dans les gouttes ! Sèche
          chaque pièce au torchon et range-la.
        en: Drip, drop! The clean dishes are still dripping, and the baby stegosaurus is playing in the drops! Dry
          each piece with a tea towel and put it away.
        es: ¡Plic, ploc! Los platos limpios aún gotean y el bebé estegosaurio juega con las gotas. Seca cada pieza
          con el trapo y guárdala.
        de: Plitsch, platsch! Das saubere Geschirr tropft noch, und das Stegosaurus-Baby spielt mit den Tropfen!
          Trockne jedes Teil ab und räum es weg.
        it: Plic, ploc! I piatti puliti gocciolano ancora e il cucciolo di stegosauro gioca con le gocce! Asciuga
          ogni pezzo con lo strofinaccio e mettilo via.
        pt: Pingo, pingo! A loiça lavada ainda pinga e o bebé estegossauro brinca com as gotas! Seca cada peça com
          o pano e arruma-a.
        br: Pinga, pinga! A louça limpa ainda está pingando e o bebê estegossauro brinca com as gotas! Seque cada
          peça com o pano de prato e guarde.
        nl: Drup, drup! De schone vaat druipt nog en de babystegosaurus speelt met de druppels! Droog alles af met
          de theedoek en ruim het op.
      dt_a_vaisselle_06:
        fr: La vaisselle sèche fait une tour qui penche sur l'égouttoir, et le petit tricératops retient son souffle
          ! Range chaque pièce dans les placards.
        en: The dry dishes are a leaning tower on the rack, and the little triceratops is holding its breath! Put
          every piece away in the cupboards.
        es: ¡Los platos secos forman una torre que se inclina en el escurridor y el pequeño triceratops contiene
          el aliento! Guarda cada pieza en su sitio.
        de: Das trockene Geschirr ist ein schiefer Turm auf dem Abtropfgestell, und der kleine Triceratops hält
          die Luft an! Räum alles in die Schränke.
        it: I piatti asciutti fanno una torre pendente sullo scolapiatti e il piccolo triceratopo trattiene il fiato!
          Metti ogni pezzo nei pensili.
        pt: A loiça seca faz uma torre torta no escorredor e o pequeno tricerátopo sustém a respiração! Arruma cada
          peça nos móveis.
        br: A louça seca virou uma torre torta no escorredor e o pequeno tricerátopo prende a respiração! Guarde
          cada peça nos móveis.
        nl: De droge vaat vormt een scheve toren op het afdruiprek en de kleine triceratops houdt zijn adem in!
          Zet alles in de kastjes.
      dt_a_vaisselle_07:
        fr: 'Le repas arrive, et le bébé diplodocus attend devant une table toute nue ! Mets la table : couverts,
          assiettes et verres pour chacun.'
        en: 'Dinner''s coming, and the baby diplodocus is waiting at a bare table! Set the table: cutlery, plates
          and glasses for everyone.'
        es: '¡Llega la comida y el bebé diplodocus espera ante una mesa vacía! Pon la mesa: cubiertos, platos y
          vasos para cada uno.'
        de: 'Gleich gibt''s Essen, und das Diplodocus-Baby wartet an einem leeren Tisch! Deck den Tisch: Besteck,
          Teller und Gläser für alle.'
        it: 'Arriva il pranzo e il cucciolo di diplodoco aspetta davanti a una tavola vuota! Apparecchia: posate,
          piatti e bicchieri per tutti.'
        pt: 'A refeição está a chegar e o bebé diplódoco espera diante de uma mesa vazia! Põe a mesa: talheres,
          pratos e copos para todos.'
        br: 'A comida está chegando e o bebê diplodoco espera na frente de uma mesa vazia! Arrume a mesa: talheres,
          pratos e copos para todo mundo.'
        nl: 'Het eten komt eraan en de babydiplodocus wacht aan een lege tafel! Dek de tafel: bestek, borden en
          glazen voor iedereen.'
      dt_a_vaisselle_08:
        fr: Miam, le repas est fini ! Mais le petit stégosaure ne voit plus la table sous les assiettes. Débarrasse
          tout jusqu'à une table nette.
        en: Yum, the meal is over! But the little stegosaurus can't see the table under all the plates. Clear everything
          until the table is clean.
        es: ¡Ñam, se acabó la comida! Pero el pequeño estegosaurio no ve la mesa bajo tantos platos. Recoge todo
          hasta dejarla limpia.
        de: Mmh, das Essen ist vorbei! Aber der kleine Stegosaurus sieht den Tisch unter all den Tellern nicht mehr.
          Räum alles ab, bis er sauber ist.
        it: Gnam, il pasto è finito! Ma il piccolo stegosauro non vede più la tavola sotto i piatti. Sparecchia
          tutto finché è pulita.
        pt: Nham, a refeição acabou! Mas o pequeno estegossauro já não vê a mesa debaixo dos pratos. Levanta tudo
          até a mesa ficar limpa.
        br: Nham, a comida acabou! Mas o pequeno estegossauro não vê mais a mesa debaixo dos pratos. Tire tudo até
          a mesa ficar limpa.
        nl: Mmm, het eten is op! Maar de kleine stegosaurus ziet de tafel niet meer onder de borden. Ruim alles
          af tot de tafel schoon is.
      dt_a_vaisselle_09:
        fr: 'Le lave-vaisselle fait des bruits bizarres, et le bébé tricératops penche la tête : le filtre est tout
          encrassé ! Nettoie-le et démarre un cycle à vide.'
        en: 'The dishwasher is making funny noises and the baby triceratops tilts its head: the filter is all clogged!
          Clean it and run an empty cycle.'
        es: '¡El lavavajillas hace ruidos raros y el bebé triceratops ladea la cabeza: el filtro está atascado!
          Límpialo y pon un ciclo en vacío.'
        de: 'Die Spülmaschine macht komische Geräusche, und das Triceratops-Baby legt den Kopf schief: Der Filter
          ist verstopft! Putz ihn und starte einen Leerlauf.'
        it: 'La lavastoviglie fa rumori strani e il cucciolo di triceratopo piega la testa: il filtro è intasato!
          Puliscilo e avvia un ciclo a vuoto.'
        pt: 'A máquina da loiça faz barulhos esquisitos e o bebé tricerátopo inclina a cabeça: o filtro está entupido!
          Limpa-o e põe um ciclo em vazio.'
        br: 'A máquina de lavar louça faz barulhos esquisitos e o bebê tricerátopo inclina a cabeça: o filtro está
          entupido! Limpe e ligue um ciclo vazio.'
        nl: 'De vaatwasser maakt rare geluiden en de babytriceratops houdt zijn kop scheef: het filter zit verstopt!
          Maak het schoon en draai een lege wasbeurt.'
      dt_a_voiture_01:
        fr: 'Le petit diplodocus a pique-niqué dans la voiture : miettes et poussière partout à l''intérieur ! Nettoie
          l''habitacle jusqu''à ce qu''il soit net.'
        en: 'The little diplodocus had a picnic in the car: crumbs and dust all over the inside! Clean the interior
          until it''s spotless.'
        es: ¡El pequeño diplodocus ha hecho un pícnic en el coche y hay migas y polvo por todo el interior! Limpia
          el interior hasta dejarlo impecable.
        de: 'Der kleine Diplodocus hat im Auto gepicknickt: überall Krümel und Staub! Putz den Innenraum, bis er
          sauber ist.'
        it: 'Il piccolo diplodoco ha fatto un picnic in macchina: briciole e polvere dappertutto dentro! Pulisci
          l''abitacolo finché è perfetto.'
        pt: 'O pequeno diplódoco fez um piquenique no carro: migalhas e pó por todo o lado lá dentro! Limpa o interior
          até ficar impecável.'
        br: 'O pequeno diplodoco fez um piquenique no carro: farelos e poeira por todo lado lá dentro! Limpe o interior
          até ficar impecável.'
        nl: 'De kleine diplodocus heeft gepicknickt in de auto: overal kruimels en stof binnenin! Maak het interieur
          schoon tot het netjes is.'
      dt_a_voiture_02:
        fr: 'Le bébé tricératops a fait la course avec la voiture sur un chemin boueux : elle est couverte de terre
          et de moucherons ! Nettoie l''extérieur jusqu''à ce qu''elle brille.'
        en: 'The baby triceratops raced the car down a muddy track: it''s covered in dirt and bugs! Wash the outside
          until it shines.'
        es: ¡El bebé triceratops ha echado una carrera al coche por un camino de barro y está lleno de tierra y
          mosquitos! Limpia el exterior hasta que brille.
        de: 'Das Triceratops-Baby ist mit dem Auto über einen Matschweg um die Wette gelaufen: alles voller Erde
          und Mücken! Putz das Auto außen, bis es glänzt.'
        it: 'Il cucciolo di triceratopo ha fatto a gara con la macchina su una strada fangosa: è coperta di terra
          e moscerini! Pulisci l''esterno finché brilla.'
        pt: 'O bebé tricerátopo fez uma corrida com o carro num caminho de lama: está coberto de terra e mosquitos!
          Limpa o exterior até brilhar.'
        br: 'O bebê tricerátopo apostou corrida com o carro numa estrada de lama: ele está coberto de terra e mosquitinhos!
          Limpe a parte de fora até brilhar.'
        nl: 'De babytriceratops deed een wedstrijdje met de auto over een modderpad: hij zit vol aarde en vliegjes!
          Was de buitenkant tot hij glanst.'
      dt_c_extras_05:
        fr: '@@@session.user.name@@@ a bien frotté les interrupteurs, mais pas tous ! Le bébé tricératops boude
          un peu, il attendra la suite.'
        en: '@@@session.user.name@@@ scrubbed the light switches, but not all of them! The baby triceratops is sulking
          a little. He''ll wait.'
        es: '¡@@@session.user.name@@@ ha frotado los interruptores, pero no todos! El bebé triceratops se enfurruña
          un poco: esperará.'
        de: '@@@session.user.name@@@ hat die Lichtschalter geputzt, aber noch nicht alle! Das Triceratops-Baby schmollt
          ein bisschen und wartet.'
        it: '@@@session.user.name@@@ ha strofinato gli interruttori, ma non tutti! Il cucciolo di triceratopo tiene
          un po'' il broncio: aspetterà.'
        pt: '@@@session.user.name@@@ esfregou os interruptores, mas não todos! O bebé tricerátopo amuou um pouco,
          mas vai esperar.'
        br: '@@@session.user.name@@@ esfregou os interruptores, mas não todos! O bebê tricerátopo fez biquinho,
          mas vai esperar.'
        nl: '@@@session.user.name@@@ heeft de lichtknopjes gepoetst, maar nog niet allemaal! De babytriceratops
          pruilt een beetje en wacht.'
      dt_c_extras_06:
        fr: '@@@session.user.name@@@ a bien commencé à nettoyer les portes ! Le petit stégosaure boude un peu, mais
          il gardera la porte ouverte.'
        en: '@@@session.user.name@@@ made a good start on the doors! The little stegosaurus is sulking a bit, but
          he''ll wait.'

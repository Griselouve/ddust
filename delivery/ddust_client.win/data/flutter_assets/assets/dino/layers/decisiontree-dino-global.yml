        br: '@@@session.user.name@@@ fez as compras para a tribo: o diplodoco já está com água na boca!'
        nl: '@@@session.user.name@@@ heeft boodschappen gedaan voor de stam: de diplodocus watertandt al!'
      dt_d_courses_02:
        fr: '@@@session.user.name@@@ a porté toutes les courses jusqu''à la cuisine : le brachiosaure trouve ça
          fort !'
        en: '@@@session.user.name@@@ carried all the shopping to the kitchen: the brachiosaurus is so impressed!'
        es: '¡@@@session.user.name@@@ ha llevado toda la compra a la cocina: ¡al braquiosaurio le parece fortísimo!'
        de: '@@@session.user.name@@@ hat alle Einkäufe in die Küche getragen: Der Brachiosaurus findet das superstark!'
        it: '@@@session.user.name@@@ ha portato tutta la spesa in cucina: il brachiosauro pensa che sia fortissimo!'
        pt: '@@@session.user.name@@@ levou as compras todas até à cozinha: o braquiossauro acha muito forte!'
        br: '@@@session.user.name@@@ levou todas as compras até a cozinha: o braquiossauro acha muito forte!'
        nl: '@@@session.user.name@@@ heeft alle boodschappen naar de keuken gedragen: de brachiosaurus vindt het
          stoer!'
      dt_d_courses_03:
        fr: '@@@session.user.name@@@ a rangé les courses : le dino trouve ses biscuits !'
        en: '@@@session.user.name@@@ put the shopping away: the dino finds his biscuits!'
        es: '¡@@@session.user.name@@@ ha guardado la compra: ¡el dino encuentra sus galletas!'
        de: '@@@session.user.name@@@ hat die Einkäufe eingeräumt: Der Dino findet die Kekse!'
        it: '@@@session.user.name@@@ ha messo via la spesa: il triceratopo sa dove sono i biscotti!'
        pt: '@@@session.user.name@@@ arrumou as compras: o dino sabe onde estão as bolachas!'
        br: '@@@session.user.name@@@ guardou as compras: o dino sabe onde estão os biscoitos!'
        nl: '@@@session.user.name@@@ heeft de boodschappen opgeruimd: de dino vindt de koekjes!'
      dt_d_courses_04:
        fr: '@@@session.user.name@@@ a fait la liste des courses : le dino ajoute des fraises !'
        en: '@@@session.user.name@@@ wrote the shopping list: the stegosaurus adds berries!'
        es: '¡@@@session.user.name@@@ ha hecho la lista de la compra: el estegosaurio añade fresas!'
        de: '@@@session.user.name@@@ hat die Einkaufsliste geschrieben: Der Stegosaurus will Erdbeeren!'
        it: '@@@session.user.name@@@ ha scritto la lista della spesa: lo stegosauro aggiunge fragole!'
        pt: '@@@session.user.name@@@ fez a lista das compras: o estegossauro junta morangos!'
        br: '@@@session.user.name@@@ fez a lista de compras: o estegossauro põe morangos!'
        nl: '@@@session.user.name@@@ heeft het boodschappenlijstje gemaakt: de stegosaurus wil aardbeien!'
      dt_d_courses_05:
        fr: '@@@session.user.name@@@ a rapporté la petite course : le bébé dino dit merci !'
        en: '@@@session.user.name@@@ fetched the little errand: the baby dino says thanks!'
        es: '¡@@@session.user.name@@@ ha traído el recadito: el dino da las gracias!'
        de: '@@@session.user.name@@@ hat den Einkauf geholt: Der Dino dankt!'
        it: '@@@session.user.name@@@ ha fatto la commissione: il dino dice grazie!'
        pt: '@@@session.user.name@@@ trouxe a comprinha: o dino agradece!'
        br: '@@@session.user.name@@@ trouxe a comprinha: o dino agradece!'
        nl: '@@@session.user.name@@@ heeft het boodschapje gehaald: de dino is blij!'
      dt_d_cuisine_01:
        fr: '@@@session.user.name@@@ a aspiré ou balayé la cuisine : le tricératops ne trouve plus une miette !'
        en: '@@@session.user.name@@@ vacuumed or swept the kitchen: the baby triceratops can''t find a crumb!'
        es: '¡@@@session.user.name@@@ ha aspirado o barrido la cocina: el triceratops no encuentra ni una miga!'
        de: '@@@session.user.name@@@ hat die Küche gesaugt oder gefegt: Der Triceratops findet keinen Krümel!'
        it: '@@@session.user.name@@@ ha aspirato o spazzato la cucina: il triceratopo non trova una briciola!'
        pt: '@@@session.user.name@@@ aspirou ou varreu a cozinha: o tricerátopo não vê uma migalha!'
        br: '@@@session.user.name@@@ aspirou ou varreu a cozinha: o tricerátopo não acha migalhas!'
        nl: '@@@session.user.name@@@ heeft de keuken gezogen of geveegd: de babytriceratops vindt geen kruimel meer!'
      dt_d_cuisine_03:
        fr: '@@@session.user.name@@@ a lavé le sol de la cuisine : le stégosaure danse, ça ne colle plus !'
        en: '@@@session.user.name@@@ washed the kitchen floor: the stegosaurus dances on it!'
        es: '¡@@@session.user.name@@@ ha fregado el suelo de la cocina: ¡el estegosaurio baila sin pegarse!'
        de: '@@@session.user.name@@@ hat den Küchenboden gewischt: Der Stegosaurus tanzt, nichts klebt mehr!'
        it: '@@@session.user.name@@@ ha lavato il pavimento della cucina: lo stegosauro balla felice!'
        pt: '@@@session.user.name@@@ lavou o chão da cozinha: o estegossauro dança, já não cola!'
        br: '@@@session.user.name@@@ lavou o chão da cozinha: o estegossauro dança, não gruda mais!'
        nl: '@@@session.user.name@@@ heeft de keukenvloer gedweild: de stegosaurus danst, niks plakt!'
      dt_d_cuisine_04:
        fr: '@@@session.user.name@@@ a fait briller les vitres de la cuisine : le ptérodactyle fait coucou !'
        en: '@@@session.user.name@@@ made the kitchen windows sparkle: the pterodactyl waves hello!'
        es: '¡@@@session.user.name@@@ ha dejado brillantes los cristales de la cocina: el pterodáctilo saluda!'
        de: '@@@session.user.name@@@ hat die Küchenfenster blank geputzt: Der Flugsaurier winkt fröhlich!'
        it: '@@@session.user.name@@@ ha fatto brillare i vetri della cucina: lo pterodattilo saluta!'
        pt: '@@@session.user.name@@@ pôs os vidros da cozinha a brilhar: o pterodáctilo acena!'
        br: '@@@session.user.name@@@ deixou os vidros da cozinha brilhando: o pterodáctilo acena!'
        nl: '@@@session.user.name@@@ heeft de keukenramen laten blinken: de pterodactylus zwaait vrolijk!'
      dt_d_cuisine_05:
        fr: '@@@session.user.name@@@ a nettoyé le plan de travail : plus de gras, le T. rex peut couper ses légumes
          !'
        en: '@@@session.user.name@@@ cleaned the worktop: no more grease, the T. rex chops his veggies!'
        es: '¡@@@session.user.name@@@ ha limpiado la encimera: sin grasa, ¡el T. rex ya corta verduras!'
        de: '@@@session.user.name@@@ hat die Arbeitsplatte geputzt: kein Fett mehr, der T. rex schneidet Gemüse!'
        it: '@@@session.user.name@@@ ha pulito il piano di lavoro: niente unto, il T. rex può tagliare le verdure!'
        pt: '@@@session.user.name@@@ limpou a bancada: sem gordura, o T. rex já pode cortar legumes!'
        br: '@@@session.user.name@@@ limpou a bancada: sem gordura, o T. rex já pode cortar legumes!'
        nl: '@@@session.user.name@@@ heeft het aanrecht gepoetst: geen vet meer, de T. rex snijdt groente!'
      dt_d_cuisine_06:
        fr: '@@@session.user.name@@@ a fait briller l''évier : le bébé diplodocus y fait des bulles !'
        en: '@@@session.user.name@@@ made the sink shine: the baby diplodocus blows bubbles in it!'
        es: '¡@@@session.user.name@@@ ha dejado reluciente el fregadero: el dino hace pompas!'
        de: '@@@session.user.name@@@ hat die Spüle blank geputzt: Das Dino-Baby macht Blubberblasen!'
        it: '@@@session.user.name@@@ ha fatto brillare il lavello: il cucciolo di dino fa le bolle!'
        pt: '@@@session.user.name@@@ pôs o lava-loiça a brilhar: o bebé diplódoco faz bolinhas!'
        br: '@@@session.user.name@@@ deixou a pia brilhando: o bebê diplodoco faz bolhinhas!'
        nl: '@@@session.user.name@@@ heeft de gootsteen laten blinken: de babydiplodocus blaast belletjes!'
      dt_d_cuisine_07:
        fr: '@@@session.user.name@@@ a nettoyé les placards de la cuisine : le stégosaure les ouvre en souriant
          !'
        en: '@@@session.user.name@@@ cleaned the kitchen cupboards: the stegosaurus opens them with a smile!'
        es: '¡@@@session.user.name@@@ ha limpiado los armarios de la cocina: ¡el estegosaurio los abre sonriendo!'
        de: '@@@session.user.name@@@ hat die Küchenschränke geputzt: Der Stegosaurus öffnet sie lächelnd!'
        it: '@@@session.user.name@@@ ha pulito i pensili della cucina: lo stegosauro li apre sorridendo!'
        pt: '@@@session.user.name@@@ limpou os armários da cozinha: o estegossauro abre-os a sorrir!'
        br: '@@@session.user.name@@@ limpou os armários da cozinha: o estegossauro abre eles sorrindo!'
        nl: '@@@session.user.name@@@ heeft de keukenkastjes gepoetst: de stegosaurus doet ze lachend open!'
      dt_d_cuisine_08:
        fr: '@@@session.user.name@@@ a vidé les vieux restes du frigo : le dino renifle, mmm !'
        en: '@@@session.user.name@@@ cleared the old leftovers from the fridge: the triceratops sniffs, mmm!'
        es: '¡@@@session.user.name@@@ ha tirado las sobras viejas de la nevera: el dino olfatea, ¡mmm!'
        de: '@@@session.user.name@@@ hat alte Reste aus dem Kühlschrank geholt: Der Triceratops schnuppert, mmm!'
        it: '@@@session.user.name@@@ ha tolto i vecchi avanzi dal frigo: il triceratopo annusa, mmm!'
        pt: '@@@session.user.name@@@ tirou os restos velhos do frigorífico: o tricerátopo funga, mmm!'
        br: '@@@session.user.name@@@ tirou os restos velhos da geladeira: o tricerátopo fareja, mmm!'
        nl: '@@@session.user.name@@@ heeft oude restjes uit de koelkast gehaald: de triceratops snuffelt, mmm!'
      dt_d_cuisine_09:
        fr: '@@@session.user.name@@@ a nettoyé le micro-ondes : le bébé ankylosaure peut y chauffer son lait !'
        en: '@@@session.user.name@@@ cleaned the microwave: the baby ankylosaurus can warm his milk in it!'
        es: '¡@@@session.user.name@@@ ha limpiado el microondas: el bebé anquilosaurio ya puede calentar su leche!'
        de: '@@@session.user.name@@@ hat die Mikrowelle geputzt: Das Ankylosaurus-Baby kann seine Milch wärmen!'
        it: '@@@session.user.name@@@ ha pulito il microonde: il cucciolo di anchilosauro ci può scaldare il latte!'
        pt: '@@@session.user.name@@@ limpou o micro-ondas: o bebé anquilossauro já pode aquecer o leite!'
        br: '@@@session.user.name@@@ limpou o micro-ondas: o bebê anquilossauro já pode esquentar o leite!'
        nl: '@@@session.user.name@@@ heeft de magnetron schoongemaakt: de babyankylosaurus kan zijn melk opwarmen!'
      dt_d_cuisine_10:
        fr: '@@@session.user.name@@@ a nettoyé la hotte de la cuisine : plus de gras, le brachiosaure est ravi !'
        en: '@@@session.user.name@@@ cleaned the cooker hood: no more grease, the brachiosaurus cheers!'
        es: '¡@@@session.user.name@@@ ha limpiado la campana de la cocina: sin grasa, ¡el braquiosaurio está encantado!'
        de: '@@@session.user.name@@@ hat die Dunstabzugshaube geputzt: Der Brachiosaurus freut sich!'
        it: '@@@session.user.name@@@ ha pulito la cappa della cucina: niente unto, il brachiosauro è felicissimo!'
        pt: '@@@session.user.name@@@ limpou o exaustor da cozinha: sem gordura, o braquiossauro adora!'
        br: '@@@session.user.name@@@ limpou a coifa da cozinha: sem gordura, o braquiossauro adorou!'
        nl: '@@@session.user.name@@@ heeft de afzuigkap gepoetst: de brachiosaurus is blij!'
      dt_d_cuisine_11:
        fr: '@@@session.user.name@@@ a nettoyé l''intérieur du four : le T. rex va cuire ses gâteaux !'
        en: '@@@session.user.name@@@ cleaned the inside of the oven: the T. rex can bake his cakes!'
        es: '¡@@@session.user.name@@@ ha limpiado el interior del horno: ¡el T. rex ya puede hacer pasteles!'
        de: '@@@session.user.name@@@ hat den Backofen innen geputzt: Der T. rex kann jetzt Kuchen backen!'
        it: '@@@session.user.name@@@ ha pulito l''interno del forno: il T. rex può cuocere le sue torte!'
        pt: '@@@session.user.name@@@ limpou o interior do forno: o T. rex já pode fazer bolos!'
        br: '@@@session.user.name@@@ limpou o forno por dentro: o T. rex já pode assar bolos!'
        nl: '@@@session.user.name@@@ heeft de oven vanbinnen gepoetst: de T. rex kan taartjes bakken!'
      dt_d_cuisine_12:
        fr: '@@@session.user.name@@@ a nettoyé la plaque de cuisson : plus de croûtes, le parasaurolophe trompette,
          pouêt !'
        en: '@@@session.user.name@@@ cleaned the hob: no more crusty bits, the parasaurolophus toots!'
        es: '¡@@@session.user.name@@@ ha limpiado la placa de cocina: sin costras, el parasaurolophus trompetea,
          ¡pu-pú!'
        de: '@@@session.user.name@@@ hat das Kochfeld geputzt: Der Parasaurolophus trötet, töröö!'
        it: '@@@session.user.name@@@ ha pulito il piano cottura: niente incrostazioni, il parasaurolofo strombetta!'
        pt: '@@@session.user.name@@@ limpou a placa: sem crostas, o parassaurolofo toca a trombeta!'
        br: '@@@session.user.name@@@ limpou o fogão: sem crostas, o parassaurolofo toca a trombeta!'
        nl: '@@@session.user.name@@@ heeft de kookplaat gepoetst: geen korstjes meer, de parasaurolophus toetert,
          toet!'
      dt_d_cuisine_13:
        fr: '@@@session.user.name@@@ a nettoyé l''intérieur du frigo : le tricératops renifle, ça sent le frais
          !'
        en: '@@@session.user.name@@@ cleaned the inside of the fridge: the triceratops sniffs, so fresh!'
        es: '¡@@@session.user.name@@@ ha limpiado la nevera por dentro: el triceratops olfatea, ¡qué fresquito!'
        de: '@@@session.user.name@@@ hat den Kühlschrank innen geputzt: Der Triceratops schnuppert, so frisch!'
        it: '@@@session.user.name@@@ ha pulito l''interno del frigo: il triceratopo annusa, che fresco!'
        pt: '@@@session.user.name@@@ limpou o frigorífico por dentro: o tricerátopo funga, que fresquinho!'
        br: '@@@session.user.name@@@ limpou a geladeira por dentro: o tricerátopo fareja, que fresquinho!'
        nl: '@@@session.user.name@@@ heeft de koelkast vanbinnen gepoetst: de triceratops snuffelt, zo fris!'
      dt_d_cuisine_15:
        fr: '@@@session.user.name@@@ a détartré la bouilloire ou la cafetière : le diplodocus boit une tisane !'
        en: '@@@session.user.name@@@ descaled the kettle or coffee maker: the diplodocus pours a herbal tea!'
        es: '¡@@@session.user.name@@@ ha quitado la cal del hervidor o la cafetera: ¡el dino toma té!'
        de: '@@@session.user.name@@@ hat Wasserkocher oder Kaffeemaschine entkalkt: Der Dino trinkt Tee!'
        it: '@@@session.user.name@@@ ha tolto il calcare al bollitore o alla moka: il dino beve!'
        pt: '@@@session.user.name@@@ descalcificou a chaleira ou a cafeteira: o diplódoco bebe chá!'
        br: '@@@session.user.name@@@ tirou o calcário da chaleira ou cafeteira: o diplodoco toma chá!'
        nl: '@@@session.user.name@@@ heeft de waterkoker of koffiezetter ontkalkt: de dino drinkt thee!'
      dt_d_cuisine_18:
        fr: '@@@session.user.name@@@ a détartré les robinets de la cuisine : ils brillent, le bébé stégosaure s''y
          voit !'
        en: '@@@session.user.name@@@ descaled the kitchen taps: they shine, the baby stegosaurus sees himself!'
        es: '¡@@@session.user.name@@@ ha quitado la cal de los grifos de la cocina: ¡el estegosaurio se ve en ellos!'
        de: '@@@session.user.name@@@ hat die Küchenwasserhähne entkalkt: Sie glänzen, das Stegosaurus-Baby sieht
          sich darin!'
        it: '@@@session.user.name@@@ ha tolto il calcare dai rubinetti della cucina: lo stegosauro ci si specchia!'
        pt: '@@@session.user.name@@@ tirou o calcário das torneiras da cozinha: brilham, o bebé estegossauro vê-se
          nelas!'
        br: '@@@session.user.name@@@ tirou o calcário das torneiras da cozinha: brilham, o bebê estegossauro se
          vê nelas!'
        nl: '@@@session.user.name@@@ heeft de keukenkranen ontkalkt: ze glanzen, de babystegosaurus ziet zichzelf!'
      dt_d_cuisine_19:
        fr: '@@@session.user.name@@@ a nettoyé l''extérieur du frigo : le bébé tricératops y colle son dessin !'
        en: '@@@session.user.name@@@ cleaned the outside of the fridge: the baby triceratops sticks his drawing
          on it!'
        es: '¡@@@session.user.name@@@ ha limpiado la nevera por fuera: ¡el bebé triceratops pega su dibujo!'
        de: '@@@session.user.name@@@ hat den Kühlschrank außen geputzt: Das Triceratops-Baby klebt sein Bild dran!'
        it: '@@@session.user.name@@@ ha pulito l''esterno del frigo: il triceratopo ci appende il suo disegno!'
        pt: '@@@session.user.name@@@ limpou o frigorífico por fora: o bebé tricerátopo cola lá o seu desenho!'
        br: '@@@session.user.name@@@ limpou a geladeira por fora: o bebê tricerátopo cola o desenho dele!'
        nl: '@@@session.user.name@@@ heeft de koelkast vanbuiten gepoetst: de babytriceratops plakt er zijn tekening
          op!'
      dt_d_dechets_01:
        fr: '@@@session.user.name@@@ a sorti les poubelles : l''ankylosaure fait au revoir aux sacs !'
        en: '@@@session.user.name@@@ took out the bins: the ankylosaurus waves the bags goodbye!'
        es: '¡@@@session.user.name@@@ ha sacado la basura: ¡el anquilosaurio dice adiós a las bolsas!'
        de: '@@@session.user.name@@@ hat den Müll rausgebracht: Der Ankylosaurus winkt den Säcken!'
        it: '@@@session.user.name@@@ ha portato fuori la spazzatura: l''anchilosauro saluta i sacchi!'
        pt: '@@@session.user.name@@@ levou o lixo para fora: o anquilossauro diz adeus!'
        br: '@@@session.user.name@@@ levou o lixo para fora: o anquilossauro dá tchau!'
        nl: '@@@session.user.name@@@ heeft het afval buitengezet: de ankylosaurus zwaait de zakken uit!'
      dt_d_dechets_02:
        fr: '@@@session.user.name@@@ a mis des sacs poubelle neufs : le tricératops trouve le coin des déchets tout
          propre !'
        en: '@@@session.user.name@@@ put in new bin bags: the triceratops thinks the trash corner looks clean!'
        es: '¡@@@session.user.name@@@ ha puesto bolsas de basura nuevas: ¡al bebé triceratops el rincón le parece
          limpísimo!'
        de: '@@@session.user.name@@@ hat neue Müllsäcke eingelegt: Das Triceratops-Baby findet die Müll-Ecke blitzsauber!'
        it: '@@@session.user.name@@@ ha messo sacchetti nuovi: il cucciolo di triceratopo trova l''angolo dei rifiuti
          pulito!'
        pt: '@@@session.user.name@@@ pôs sacos do lixo novos: o bebé tricerátopo acha o cantinho do lixo todo limpinho!'
        br: '@@@session.user.name@@@ colocou sacos de lixo novos: o bebê tricerátopo acha o cantinho do lixo todo
          limpinho!'
        nl: '@@@session.user.name@@@ heeft nieuwe vuilniszakken ingedaan: de babytriceratops vindt het afvalhoekje
          superschoon!'
      dt_d_dechets_03:
        fr: '@@@session.user.name@@@ a trié les déchets : le stégosaure applaudit !'
        en: '@@@session.user.name@@@ sorted the rubbish: the stegosaurus claps!'
        es: '¡@@@session.user.name@@@ ha separado la basura: el estegosaurio aplaude!'
        de: '@@@session.user.name@@@ hat den Müll getrennt: Der Dino klatscht!'
        it: '@@@session.user.name@@@ ha diviso i rifiuti: lo stegosauro applaude!'
        pt: '@@@session.user.name@@@ separou o lixo: o estegossauro bate palmas!'
        br: '@@@session.user.name@@@ separou o lixo: o estegossauro bate palmas!'
        nl: '@@@session.user.name@@@ heeft het afval gesorteerd: de stegosaurus klapt!'
      dt_d_dechets_04:
        fr: '@@@session.user.name@@@ a porté le verre et le recyclage au point de collecte : le diplodocus est fier
          !'
        en: '@@@session.user.name@@@ took the glass and recycling to the collection point: the diplodocus is so
          proud!'
        es: '¡@@@session.user.name@@@ ha llevado el vidrio y el reciclaje al contenedor: ¡el diplodocus está orgulloso!'
        de: '@@@session.user.name@@@ hat Glas und Wertstoffe weggebracht: Der Diplodocus ist stolz!'
        it: '@@@session.user.name@@@ ha portato vetro e differenziata alla raccolta: il diplodoco è fiero!'
        pt: '@@@session.user.name@@@ levou o vidro e a reciclagem ao ecoponto: o diplódoco adora!'
        br: '@@@session.user.name@@@ levou o vidro e a reciclagem ao ponto de coleta: o diplodoco está orgulhoso!'
        nl: '@@@session.user.name@@@ heeft glas en recycling naar het inzamelpunt gebracht: de diplodocus is zo
          trots!'
      dt_d_dechets_05:
        fr: '@@@session.user.name@@@ a vidé les épluchures au composteur : l''iguanodon fait la fête !'
        en: '@@@session.user.name@@@ emptied the food scraps into the compost: the iguanodon cheers!'
        es: '¡@@@session.user.name@@@ ha vaciado los restos en el compostador: ¡el iguanodonte lo celebra!'
        de: '@@@session.user.name@@@ hat Bioabfall in den Komposter geleert: Der Iguanodon feiert!'
        it: '@@@session.user.name@@@ ha svuotato l''umido nel compost: l''iguanodonte fa festa!'
        pt: '@@@session.user.name@@@ despejou os restos no compostor: o iguanodonte faz a festa!'
        br: '@@@session.user.name@@@ jogou os restos na composteira: o iguanodonte faz festa!'
        nl: '@@@session.user.name@@@ heeft het gft-afval in de compostbak geleegd: de iguanodon juicht!'
      dt_d_dechets_06:
        fr: '@@@session.user.name@@@ a vidé toutes les corbeilles : le bébé diplodocus fait une ronde !'
        en: '@@@session.user.name@@@ emptied all the little bins: the baby diplodocus dances in a circle!'
        es: '¡@@@session.user.name@@@ ha vaciado todas las papeleras: ¡el diplodocus baila en corro!'
        de: '@@@session.user.name@@@ hat alle Papierkörbe geleert: Der Dino tanzt im Kreis!'
        it: '@@@session.user.name@@@ ha svuotato tutti i cestini: il dino fa il girotondo!'
        pt: '@@@session.user.name@@@ esvaziou os cestos todos: o bebé diplódoco dança à roda!'

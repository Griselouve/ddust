          pero esperará.
        de: '@@@session.user.name@@@ hat schon gut mit den Türen angefangen! Der kleine Stegosaurus schmollt etwas,
          aber er lässt die Tür offen.'
        it: '@@@session.user.name@@@ ha cominciato bene a pulire le porte! Il piccolo stegosauro tiene il broncio,
          ma lascerà la porta aperta.'
        pt: '@@@session.user.name@@@ começou bem a limpar as portas! O estegossauro amuou um pouco, mas vai esperar.'
        br: '@@@session.user.name@@@ começou bem a limpar as portas! O estegossauro ficou emburrado, mas vai esperar.'
        nl: '@@@session.user.name@@@ is goed begonnen met de deuren! De kleine stegosaurus pruilt een beetje, maar

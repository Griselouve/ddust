        nl: '@@@session.user.name@@@ heeft een deel van de natte was opgehangen! De parasaurolophus houdt de lijn
          vast en wacht.'
      dt_c_linge_04:
        fr: '@@@session.user.name@@@ a ramassé une partie du linge sec ! Le reste attend au vent, le bébé diplodocus
          aussi.'
        en: '@@@session.user.name@@@ took down part of the dry laundry! The rest is still swinging in the wind.
          The baby diplodocus will wait.'
        es: ¡@@@session.user.name@@@ ha recogido parte de la ropa seca! El diplodocus esperará el resto.
        de: '@@@session.user.name@@@ hat einen Teil der trockenen Wäsche abgenommen! Der Rest flattert noch, das
          Diplodocus-Baby wartet.'
        it: '@@@session.user.name@@@ ha raccolto una parte dei panni asciutti! Il resto dondola al vento: il cucciolo
          di diplodoco aspetterà.'
        pt: '@@@session.user.name@@@ apanhou parte da roupa seca! O resto está ao vento, o diplódoco vai esperar.'
        br: '@@@session.user.name@@@ recolheu parte da roupa seca! O resto ainda está no varal, o diplodoco vai
          esperar.'
        nl: '@@@session.user.name@@@ heeft een deel van de droge was afgehaald! De rest wappert nog, de babydiplodocus
          wacht.'
      dt_c_linge_05:
        fr: '@@@session.user.name@@@ a déjà plié une belle pile de linge ! Le stégosaure boude un peu, mais il attendra
          pour plier le reste.'
        en: '@@@session.user.name@@@ already folded a nice pile of laundry! The stegosaurus is sulking a bit, but
          he''ll wait to fold the rest.'
        es: ¡@@@session.user.name@@@ ya ha doblado un buen montón de ropa! El estegosaurio se enfurruña un poco,
          pero esperará para doblar el resto.
        de: '@@@session.user.name@@@ hat schon einen schönen Stapel Wäsche gefaltet! Der Stegosaurus schmollt etwas,
          aber er wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha già piegato una bella pila di panni! Lo stegosauro tiene il broncio, ma
          aspetterà per piegare il resto.'
        pt: '@@@session.user.name@@@ já dobrou uma bela pilha de roupa! O estegossauro amuou um bocadinho, mas espera
          para dobrar o resto.'
        br: '@@@session.user.name@@@ já dobrou uma bela pilha de roupa! O estegossauro ficou emburrado, mas espera
          para dobrar o resto.'
        nl: '@@@session.user.name@@@ heeft al een mooie stapel was gevouwen! De stegosaurus pruilt wat, maar hij
          wacht om de rest te vouwen.'
      dt_c_linge_06:
        fr: '@@@session.user.name@@@ a rangé une partie du linge plié ! Le bébé tricératops garde le reste au chaud,
          il attendra.'
        en: '@@@session.user.name@@@ put away part of the folded laundry! The baby triceratops is keeping the rest
          warm. He''ll wait.'
        es: '¡@@@session.user.name@@@ ha guardado parte de la ropa doblada! El bebé triceratops cuida del resto:
          esperará.'
        de: '@@@session.user.name@@@ hat einen Teil der gefalteten Wäsche weggeräumt! Das Triceratops-Baby passt
          auf den Rest auf und wartet.'
        it: '@@@session.user.name@@@ ha messo via una parte dei panni piegati! Il cucciolo di triceratopo tiene
          d''occhio il resto: aspetterà.'
        pt: '@@@session.user.name@@@ arrumou parte da roupa dobrada! O bebé tricerátopo toma conta do resto e vai
          esperar.'
        br: '@@@session.user.name@@@ guardou parte da roupa dobrada! O bebê tricerátopo cuida do resto e vai esperar.'
        nl: '@@@session.user.name@@@ heeft een deel van de gevouwen was opgeruimd! De babytriceratops past op de
          rest en wacht.'
      dt_c_linge_08:
        fr: '@@@session.user.name@@@ a repassé une partie du linge, quelques plis font encore les malins ! L''ankylosaure
          attendra la suite.'
        en: '@@@session.user.name@@@ ironed part of the laundry, a few creases are still being cheeky! The ankylosaurus
          will wait for the rest.'
        es: ¡@@@session.user.name@@@ ha planchado parte de la ropa y algunas arrugas aún se hacen las listas! El
          anquilosaurio esperará.
        de: '@@@session.user.name@@@ hat einen Teil der Wäsche gebügelt, ein paar Falten sind noch frech! Der Ankylosaurus
          wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha stirato una parte dei panni, qualche piega fa ancora la furba! L''anchilosauro
          aspetterà il resto.'
        pt: '@@@session.user.name@@@ passou a ferro parte da roupa, ainda há vincos marotos! O anquilossauro espera
          pelo resto.'
        br: '@@@session.user.name@@@ passou parte da roupa, ainda tem umas dobrinhas teimosas! O anquilossauro vai
          esperar o resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de was gestreken, er zitten nog brutale kreukels in! De
          ankylosaurus wacht op de rest.'
      dt_c_linge_09:
        fr: '@@@session.user.name@@@ a commencé à bichonner la machine à laver : le joint, le bac... Le stégosaure
          attendra pour le cycle à vide.'
        en: '@@@session.user.name@@@ started pampering the washing machine: the seal, the drawer... The stegosaurus
          will wait for the empty cycle.'
        es: '¡@@@session.user.name@@@ ha empezado a mimar la lavadora: la goma, el cajetín... El estegosaurio esperará
          para el lavado en vacío.'
        de: '@@@session.user.name@@@ hat angefangen, die Waschmaschine zu pflegen: Dichtung, Fach... Der Stegosaurus
          wartet auf die Leerwäsche.'
        it: '@@@session.user.name@@@ ha cominciato a coccolare la lavatrice: la guarnizione, il cassetto... Lo stegosauro
          aspetterà il ciclo a vuoto.'
        pt: '@@@session.user.name@@@ começou a mimar a máquina de lavar: a borracha, a gaveta... O estegossauro
          espera pelo ciclo em vazio.'
        br: '@@@session.user.name@@@ começou a cuidar da máquina de lavar: a borracha, a gaveta... O estegossauro
          espera o ciclo vazio.'
        nl: '@@@session.user.name@@@ is de wasmachine gaan verwennen: de rubber, het bakje... De stegosaurus wacht
          op de lege wasbeurt.'
      dt_c_moto_01:
        fr: '@@@session.user.name@@@ a déjà lavé une partie de la moto ! La boue tient bon par endroits, le bébé
          ankylosaure attendra la suite.'
        en: '@@@session.user.name@@@ already washed part of the motorbike! The mud is hanging on in places. The
          baby ankylosaurus will wait.'
        es: ¡@@@session.user.name@@@ ya ha lavado parte de la moto! Aún queda barro; el bebé anquilosaurio esperará.
        de: '@@@session.user.name@@@ hat schon einen Teil vom Motorrad gewaschen! Der Matsch hält noch, das Ankylosaurus-Baby
          wartet.'
        it: '@@@session.user.name@@@ ha già lavato una parte della moto! Il fango resiste qua e là: il cucciolo
          di anchilosauro aspetterà.'
        pt: '@@@session.user.name@@@ já lavou parte da mota! A lama ainda resiste nalguns sítios, o bebé anquilossauro
          vai esperar.'
        br: '@@@session.user.name@@@ já lavou parte da moto! Ainda tem lama em alguns cantos, o anquilossauro vai
          esperar.'
        nl: '@@@session.user.name@@@ heeft al een deel van de motor gewassen! De modder zit hier en daar nog, de
          babyankylosaurus wacht.'
      dt_c_repas_06:
        fr: '@@@session.user.name@@@ a commencé à cuisiner pour la tribu, ça sent déjà bon ! Le T. rex attend, sa
          serviette autour du cou.'
        en: '@@@session.user.name@@@ started cooking for the tribe, it already smells good! The T. rex is waiting
          with his napkin on.'
        es: ¡@@@session.user.name@@@ ha empezado a cocinar para la tribu y ya huele bien! El T. rex espera con la
          servilleta puesta.
        de: '@@@session.user.name@@@ hat angefangen, für den Stamm zu kochen, es duftet schon! Der T. rex wartet
          mit Serviette um den Hals.'
        it: '@@@session.user.name@@@ ha cominciato a cucinare per la tribù, c''è già un buon profumo! Il T. rex
          aspetta col tovagliolo al collo.'
        pt: '@@@session.user.name@@@ começou a cozinhar para a tribo e já cheira bem! O T. rex espera de guardanapo
          ao pescoço.'
        br: '@@@session.user.name@@@ começou a cozinhar para a tribo e já está cheirando bem! O T. rex espera de
          guardanapo no pescoço.'
        nl: '@@@session.user.name@@@ is begonnen met koken voor de stam, het ruikt al lekker! De T. rex wacht met
          zijn servet om.'
      dt_c_repas_07:
        fr: '@@@session.user.name@@@ a fait chauffer le plat, mais il est encore tiède ! Le bébé diplodocus attendra,
          cuillère en main.'
        en: '@@@session.user.name@@@ warmed up the dish, but it''s still lukewarm! The baby diplodocus will wait.'
        es: ¡@@@session.user.name@@@ ha calentado el plato, ¡pero aún está tibio! El diplodocus esperará.
        de: '@@@session.user.name@@@ hat das Essen aufgewärmt, aber es ist noch etwas lauwarm! Das Diplodocus-Baby
          wartet mit dem Löffel.'
        it: '@@@session.user.name@@@ ha scaldato il piatto, ma è ancora tiepido! Il diplodoco aspetta col cucchiaio.'
        pt: '@@@session.user.name@@@ aqueceu o prato, mas está morno! O bebé diplódoco espera de colher na mão.'
        br: '@@@session.user.name@@@ esquentou o prato, mas está morno! O bebê diplodoco espera de colher na mão.'
        nl: '@@@session.user.name@@@ heeft het eten opgewarmd, maar het is nog wat lauw! De babydiplodocus wacht
          met zijn lepel klaar.'
      dt_c_repas_10:
        fr: '@@@session.user.name@@@ a commencé le plat de tous les jours, il mijote encore ! Le tricératops attend
          près du feu, le ventre qui gargouille.'
        en: '@@@session.user.name@@@ started the everyday dish, it''s still simmering! The triceratops waits by
          the fire, tummy rumbling.'
        es: ¡@@@session.user.name@@@ ha empezado el plato de cada día y aún está al fuego! El triceratops espera
          junto al fuego con la tripa rugiendo.
        de: '@@@session.user.name@@@ hat das Alltagsessen angefangen, es köchelt noch! Der Triceratops wartet am
          Feuer, sein Bauch grummelt.'
        it: '@@@session.user.name@@@ ha cominciato il piatto di tutti i giorni, sobbolle ancora! Il triceratopo
          aspetta al falò, col pancino che brontola.'
        pt: '@@@session.user.name@@@ começou o prato do dia a dia, ainda está ao lume! O tricerátopo espera à fogueira,
          de barriga a roncar.'
        br: '@@@session.user.name@@@ começou o prato do dia a dia, ainda está no fogo! O tricerátopo espera na fogueira,
          de barriga roncando.'
        nl: '@@@session.user.name@@@ is begonnen met het gewone maaltje, het pruttelt nog! De triceratops wacht
          bij het vuur, zijn buik rommelt.'
      dt_c_repas_11:
        fr: '@@@session.user.name@@@ a commencé un grand repas de fête, il reste encore des étapes ! Le T. rex attendra
          en salivant un peu.'
        en: '@@@session.user.name@@@ started a big party meal, there are still a few steps left! The T. rex will
          wait, drooling a little.'
        es: ¡@@@session.user.name@@@ ha empezado un gran banquete de fiesta y aún quedan pasos! El T. rex esperará
          con la boca hecha agua.
        de: '@@@session.user.name@@@ hat ein großes Festessen angefangen, ein paar Schritte fehlen noch! Der T.
          rex wartet und sabbert ein bisschen.'
        it: '@@@session.user.name@@@ ha cominciato un gran pranzo di festa, mancano ancora dei passaggi! Il T. rex
          aspetterà con l''acquolina in bocca.'
        pt: '@@@session.user.name@@@ começou uma grande refeição de festa, ainda faltam uns passos! O T. rex espera
          com água na boca.'
        br: '@@@session.user.name@@@ começou um grande banquete de festa, ainda faltam umas etapas! O T. rex espera
          com água na boca.'
        nl: '@@@session.user.name@@@ is begonnen aan een groot feestmaal, er zijn nog een paar stappen! De T. rex
          wacht en kwijlt een beetje.'
      dt_c_salle_de_bain_01:
        fr: '@@@session.user.name@@@ a passé l''aspirateur ou le balai dans une partie de la salle de bain-cascade
          ! Le bébé tricératops attendra la suite.'
        en: '@@@session.user.name@@@ vacuumed or swept part of the waterfall bathroom! The baby triceratops will
          wait for the rest.'
        es: ¡@@@session.user.name@@@ ha pasado la aspiradora o la escoba por parte del baño-cascada! El bebé triceratops
          esperará el resto.
        de: '@@@session.user.name@@@ hat einen Teil vom Wasserfall-Bad gesaugt oder gefegt! Das Triceratops-Baby
          wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha passato l''aspirapolvere o la scopa in una parte del bagno-cascata! Il cucciolo
          di triceratopo aspetterà il resto.'
        pt: '@@@session.user.name@@@ aspirou ou varreu parte da casa de banho-cascata! O bebé tricerátopo espera
          pelo resto.'
        br: '@@@session.user.name@@@ aspirou ou varreu parte do banheiro-cascata! O bebê tricerátopo vai esperar
          o resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de watervalbadkamer gezogen of geveegd! De babytriceratops
          wacht op de rest.'
      dt_c_salle_de_bain_02:
        fr: '@@@session.user.name@@@ a fait une partie des poussières de la salle de bain ! Le petit stégosaure
          boude un peu, il attendra.'
        en: '@@@session.user.name@@@ dusted part of the bathroom! The little stegosaurus is sulking a bit. He''ll
          wait.'
        es: '¡@@@session.user.name@@@ ha quitado parte del polvo del baño! El pequeño estegosaurio se enfurruña
          un poco: esperará.'
        de: '@@@session.user.name@@@ hat im Bad schon ein bisschen Staub gewischt! Der kleine Stegosaurus schmollt
          etwas und wartet.'
        it: '@@@session.user.name@@@ ha tolto una parte della polvere del bagno! Il piccolo stegosauro tiene il
          broncio: aspetterà.'
        pt: '@@@session.user.name@@@ limpou parte do pó da casa de banho! O pequeno estegossauro amuou um bocadinho,
          vai esperar.'
        br: '@@@session.user.name@@@ tirou parte do pó do banheiro! O pequeno estegossauro ficou emburrado, mas
          vai esperar.'
        nl: '@@@session.user.name@@@ heeft een deel van de badkamer afgestoft! De kleine stegosaurus pruilt een
          beetje en wacht.'
      dt_c_salle_de_bain_03:
        fr: '@@@session.user.name@@@ a lavé une partie du sol de la salle de bain ! Le bébé diplodocus attend pour
          patauger sur le reste.'
        en: '@@@session.user.name@@@ washed part of the bathroom floor! The baby diplodocus is waiting to splash
          about on the rest.'
        es: ¡@@@session.user.name@@@ ha fregado parte del suelo del baño! El bebé diplodocus espera para chapotear
          en el resto.
        de: '@@@session.user.name@@@ hat einen Teil vom Badboden gewischt! Das Diplodocus-Baby wartet, um auf dem
          Rest zu planschen.'
        it: '@@@session.user.name@@@ ha lavato una parte del pavimento del bagno! Il cucciolo di diplodoco aspetta
          per sguazzare sul resto.'
        pt: '@@@session.user.name@@@ lavou parte do chão da casa de banho! O bebé diplódoco espera para chapinhar
          no resto.'
        br: '@@@session.user.name@@@ lavou parte do chão do banheiro! O bebê diplodoco espera para chapinhar no
          resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de badkamervloer gedweild! De babydiplodocus wacht om op
          de rest te plonzen.'
      dt_c_salle_de_bain_04:
        fr: '@@@session.user.name@@@ a nettoyé une partie des vitres de la salle de bain ! Le ptérodactyle attendra
          pour voir dehors bien clair.'
        en: '@@@session.user.name@@@ cleaned part of the bathroom windows! The pterodactyl will wait to see outside
          nice and clearly.'
        es: ¡@@@session.user.name@@@ ha limpiado parte de los cristales del baño! El pterodáctilo esperará para
          ver fuera bien claro.
        de: '@@@session.user.name@@@ hat einen Teil der Badfenster geputzt! Der Flugsaurier wartet, um klar nach
          draußen zu sehen.'
        it: '@@@session.user.name@@@ ha pulito una parte dei vetri del bagno! Lo pterodattilo aspetterà per vedere
          fuori bello chiaro.'
        pt: '@@@session.user.name@@@ limpou parte dos vidros da casa de banho! O pterodáctilo espera para ver lá
          fora bem claro.'
        br: '@@@session.user.name@@@ limpou parte dos vidros do banheiro! O pterodáctilo vai esperar para ver lá
          fora bem clarinho.'
        nl: '@@@session.user.name@@@ heeft een deel van de badkamerramen gelapt! De pterodactylus wacht om helder
          naar buiten te kijken.'
      dt_c_salle_de_bain_05:
        fr: '@@@session.user.name@@@ a frotté une partie du lavabo, il reste des petites taches blanches ! Le bébé
          stégosaure attendra la suite.'
        en: '@@@session.user.name@@@ scrubbed part of the sink, little white marks are left! The baby stegosaurus
          will wait for the rest.'
        es: ¡@@@session.user.name@@@ ha frotado parte del lavabo y quedan manchitas blancas! El bebé estegosaurio
          esperará el resto.
        de: '@@@session.user.name@@@ hat einen Teil vom Waschbecken geschrubbt, kleine weiße Flecken sind noch da!
          Das Stegosaurus-Baby wartet.'
        it: '@@@session.user.name@@@ ha strofinato una parte del lavandino, restano macchioline bianche! Il cucciolo
          di stegosauro aspetterà.'
        pt: '@@@session.user.name@@@ esfregou parte do lavatório, ainda há manchinhas brancas! O bebé estegossauro
          espera pelo resto.'
        br: '@@@session.user.name@@@ esfregou parte da pia, ainda tem manchinhas brancas! O bebê estegossauro vai
          esperar o resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de wastafel geschrobd, er zitten nog witte vlekjes! De babystegosaurus
          wacht.'
      dt_c_salle_de_bain_06:
        fr: '@@@session.user.name@@@ a essuyé une partie du miroir de la salle de bain ! Le tricératops n''y voit
          encore qu''une corne, il attendra.'
        en: '@@@session.user.name@@@ wiped part of the bathroom mirror! The triceratops can only see one horn so
          far. He''ll wait.'
        es: ¡@@@session.user.name@@@ ha limpiado parte del espejo del baño! El triceratops aún solo ve un cuerno
          y media sonrisa, pero esperará con paciencia.
        de: '@@@session.user.name@@@ hat einen Teil vom Badspiegel geputzt! Der Triceratops sieht erst ein Horn,
          er wartet.'
        it: '@@@session.user.name@@@ ha pulito una parte dello specchio del bagno! Il triceratopo ci vede solo un
          corno: aspetterà.'
        pt: '@@@session.user.name@@@ limpou parte do espelho da casa de banho! O tricerátopo só vê um corno, vai
          esperar.'
        br: '@@@session.user.name@@@ limpou parte do espelho do banheiro! O tricerátopo só vê um chifre, vai esperar.'
        nl: '@@@session.user.name@@@ heeft een deel van de badkamerspiegel gepoetst! De triceratops ziet nog maar
          één hoorn, hij wacht.'
      dt_c_salle_de_bain_07:
        fr: '@@@session.user.name@@@ a frotté une partie de la douche ! Le diplodocus attend sa douche-cascade en
          tapant du pied, il patientera.'
        en: '@@@session.user.name@@@ scrubbed part of the shower! The diplodocus is tapping his foot for his waterfall
          shower, but he''ll be patient.'
        es: ¡@@@session.user.name@@@ ha frotado parte de la ducha! El diplodocus espera su ducha-cascada dando golpecitos
          con la pata.
        de: '@@@session.user.name@@@ hat einen Teil der Dusche geschrubbt! Der Diplodocus tippt mit dem Fuß, aber
          er wartet geduldig.'
        it: '@@@session.user.name@@@ ha strofinato una parte della doccia! Il diplodoco aspetta la sua doccia-cascata
          battendo la zampa.'
        pt: '@@@session.user.name@@@ esfregou parte do duche! O diplódoco espera o seu duche-cascata a bater o pé,
          com paciência.'
        br: '@@@session.user.name@@@ esfregou parte do box! O diplodoco espera o banho-cascata batendo o pé, com
          paciência.'
        nl: '@@@session.user.name@@@ heeft een deel van de douche geschrobd! De diplodocus tikt met zijn poot, maar
          hij wacht geduldig.'
      dt_c_salle_de_bain_08:
        fr: '@@@session.user.name@@@ a frotté une partie de la baignoire ! Le bébé ankylosaure garde son canard
          en plastique, il attendra son bain.'
        en: '@@@session.user.name@@@ scrubbed part of the bathtub! The baby ankylosaurus is holding his rubber duck.
          He''ll wait for his bath.'
        es: '¡@@@session.user.name@@@ ha frotado parte de la bañera! El bebé anquilosaurio sujeta su patito de goma:
          esperará su baño.'
        de: '@@@session.user.name@@@ hat einen Teil der Badewanne geschrubbt! Das Ankylosaurus-Baby hält sein Quietscheentchen
          und wartet.'
        it: '@@@session.user.name@@@ ha strofinato una parte della vasca! Il cucciolo di anchilosauro stringe la
          sua paperella: aspetterà il bagnetto.'
        pt: '@@@session.user.name@@@ esfregou parte da banheira! O bebé anquilossauro segura o patinho de borracha
          e espera pelo banho.'
        br: '@@@session.user.name@@@ esfregou parte da banheira! O bebê anquilossauro segura o patinho de borracha
          e espera o banho.'
        nl: '@@@session.user.name@@@ heeft een deel van het bad geschrobd! De babyankylosaurus houdt zijn badeendje
          vast en wacht.'
      dt_c_salle_de_bain_10:
        fr: '@@@session.user.name@@@ a changé une partie des serviettes ! Le stégosaure attend encore une serviette
          toute douce, il patientera.'
        en: '@@@session.user.name@@@ changed some of the towels! The stegosaurus is still waiting for a soft towel.
          He''ll be patient.'
        es: '¡@@@session.user.name@@@ ha cambiado parte de las toallas! El estegosaurio aún espera una toalla suavecita:
          tendrá paciencia.'
        de: '@@@session.user.name@@@ hat einen Teil der Handtücher gewechselt! Der Stegosaurus wartet noch auf ein
          weiches Tuch, geduldig.'
        it: '@@@session.user.name@@@ ha cambiato una parte degli asciugamani! Lo stegosauro aspetta ancora un asciugamano
          morbido, con pazienza.'
        pt: '@@@session.user.name@@@ trocou parte das toalhas! O estegossauro ainda espera uma toalha fofinha, com
          paciência.'
        br: '@@@session.user.name@@@ trocou parte das toalhas! O estegossauro ainda espera uma toalha fofinha, com
          paciência.'
        nl: '@@@session.user.name@@@ heeft een deel van de handdoeken verwisseld! De stegosaurus wacht nog op een
          zachte handdoek, geduldig.'
      dt_c_salle_de_bain_11:
        fr: '@@@session.user.name@@@ a frotté une partie des joints et du carrelage ! Le bébé tricératops compte
          les carreaux, il attendra la suite.'
        en: '@@@session.user.name@@@ scrubbed part of the grout and tiles! The baby triceratops is counting the

        de: '@@@session.user.name@@@ hat die Waschmaschine angestellt: Der Stegosaurus schaut der Wäsche zu!'
        it: '@@@session.user.name@@@ ha avviato la lavatrice: lo stegosauro guarda i panni girare!'
        pt: '@@@session.user.name@@@ ligou a máquina de lavar: o estegossauro vê a roupa a girar!'
        br: '@@@session.user.name@@@ ligou a máquina de lavar: o estegossauro vê a roupa girar!'
        nl: '@@@session.user.name@@@ heeft de wasmachine aangezet: de stegosaurus kijkt hoe de was draait!'
      dt_d_linge_02_alt:
        fr: '@@@session.user.name@@@ a porté le linge à la laverie : le diplodocus dit merci !'
        en: '@@@session.user.name@@@ took the laundry to the launderette: the diplodocus says thanks!'
        es: '¡@@@session.user.name@@@ ha llevado la ropa a la lavandería: ¡el diplodocus sonríe!'
        de: '@@@session.user.name@@@ hat die Wäsche zum Waschsalon gebracht: Der Diplodocus sagt danke!'
        it: '@@@session.user.name@@@ ha portato il bucato in lavanderia: il diplodoco dice grazie!'
        pt: '@@@session.user.name@@@ levou a roupa à lavandaria: o diplódoco agradece!'
        br: '@@@session.user.name@@@ levou a roupa à lavanderia: o diplodoco agradece!'
        nl: '@@@session.user.name@@@ heeft de was naar de wasserette gebracht: de diplodocus is blij!'
      dt_d_linge_03:
        fr: '@@@session.user.name@@@ a étendu le linge : le parasaurolophe souffle, fffff !'
        en: '@@@session.user.name@@@ hung out the laundry: the dino blows on it, whoosh!'
        es: '¡@@@session.user.name@@@ ha tendido la ropa: el parasaurolophus sopla, ¡fffff!'
        de: '@@@session.user.name@@@ hat die Wäsche aufgehängt: Der Parasaurolophus pustet, fffff!'
        it: '@@@session.user.name@@@ ha steso i panni: il parasaurolofo ci soffia sopra, fffff!'
        pt: '@@@session.user.name@@@ estendeu a roupa: o parassaurolofo sopra, fffff!'
        br: '@@@session.user.name@@@ estendeu a roupa: o parassaurolofo sopra nela, fffff!'
        nl: '@@@session.user.name@@@ heeft de was opgehangen: de dino blaast, fffff!'
      dt_d_linge_04:
        fr: '@@@session.user.name@@@ a ramassé le linge sec : le dino fait un câlin !'
        en: '@@@session.user.name@@@ took down the dry laundry: the baby diplodocus hugs it!'
        es: '¡@@@session.user.name@@@ ha recogido la ropa seca: el diplodocus abraza el montón!'
        de: '@@@session.user.name@@@ hat die trockene Wäsche abgenommen: Das Diplodocus-Baby kuschelt damit!'
        it: '@@@session.user.name@@@ ha raccolto i panni asciutti: il diplodoco abbraccia la pila!'
        pt: '@@@session.user.name@@@ apanhou a roupa seca: o diplódoco abraça a pilha!'
        br: '@@@session.user.name@@@ recolheu a roupa seca: o diplodoco abraça a pilha!'
        nl: '@@@session.user.name@@@ heeft de droge was afgehaald: de diplodocus knuffelt hem!'
      dt_d_linge_05:
        fr: '@@@session.user.name@@@ a plié le linge : le stégosaure admire les piles !'
        en: '@@@session.user.name@@@ folded the laundry: the stegosaurus admires the piles!'
        es: '¡@@@session.user.name@@@ ha doblado la ropa: el estegosaurio la admira!'
        de: '@@@session.user.name@@@ hat die Wäsche gefaltet: Der Stegosaurus staunt!'
        it: '@@@session.user.name@@@ ha piegato i panni: lo stegosauro ammira le pile!'
        pt: '@@@session.user.name@@@ dobrou a roupa: o estegossauro admira as pilhas!'
        br: '@@@session.user.name@@@ dobrou a roupa: o estegossauro admira as pilhas!'
        nl: '@@@session.user.name@@@ heeft de was gevouwen: de stegosaurus kijkt blij!'
      dt_d_linge_06:
        fr: '@@@session.user.name@@@ a rangé le linge : le dino ferme les tiroirs !'
        en: '@@@session.user.name@@@ put the laundry away: the dino shuts the drawers!'
        es: '¡@@@session.user.name@@@ ha guardado la ropa: el dino cierra los cajones!'
        de: '@@@session.user.name@@@ hat die Wäsche weggeräumt: Der Dino schließt die Schubladen!'
        it: '@@@session.user.name@@@ ha messo via i panni: il triceratopo chiude i cassetti!'
        pt: '@@@session.user.name@@@ arrumou a roupa: o tricerátopo fecha as gavetas!'
        br: '@@@session.user.name@@@ guardou a roupa: o tricerátopo fecha as gavetas!'
        nl: '@@@session.user.name@@@ heeft de was opgeruimd: de dino sluit de laatjes!'
      dt_d_linge_08:
        fr: '@@@session.user.name@@@ a repassé le linge : plus un pli, l''ankylosaure est ravi !'
        en: '@@@session.user.name@@@ ironed the laundry: not a crease left, the ankylosaurus is delighted!'
        es: '¡@@@session.user.name@@@ ha planchado la ropa: ni una arruga, ¡el anquilosaurio está encantado!'
        de: '@@@session.user.name@@@ hat die Wäsche gebügelt: keine Falte mehr, der Ankylosaurus freut sich!'
        it: '@@@session.user.name@@@ ha stirato i panni: nemmeno una piega, l''anchilosauro è felicissimo!'
        pt: '@@@session.user.name@@@ passou a roupa a ferro: nem um vinco, o anquilossauro adora!'
        br: '@@@session.user.name@@@ passou a roupa: nenhuma dobrinha, o anquilossauro adorou!'
        nl: '@@@session.user.name@@@ heeft de was gestreken: geen kreukel meer, de ankylosaurus is superblij!'
      dt_d_linge_09:
        fr: '@@@session.user.name@@@ a entretenu la machine à laver : elle sent bon, le stégosaure renifle !'
        en: '@@@session.user.name@@@ looked after the washing machine: it smells nice, the dino sniffs!'
        es: '¡@@@session.user.name@@@ ha cuidado la lavadora: huele bien, ¡el estegosaurio olfatea!'
        de: '@@@session.user.name@@@ hat die Waschmaschine gepflegt: Sie duftet, der Stegosaurus schnuppert, mmm!'
        it: '@@@session.user.name@@@ ha pulito la lavatrice: che profumo, lo stegosauro annusa, mmm!'
        pt: '@@@session.user.name@@@ cuidou da máquina de lavar: cheira bem, o estegossauro funga, mmm!'
        br: '@@@session.user.name@@@ cuidou da máquina de lavar: que cheirinho, o estegossauro fareja, mmm!'
        nl: '@@@session.user.name@@@ heeft de wasmachine verzorgd: hij ruikt fris, de stegosaurus snuffelt, mmm!'
      dt_d_moto_01:
        fr: '@@@session.user.name@@@ a lavé la moto : l''ankylosaure veut faire un tour, vroum !'
        en: '@@@session.user.name@@@ washed the motorbike: the ankylosaurus wants a ride, vroom!'
        es: '¡@@@session.user.name@@@ ha lavado la moto: el anquilosaurio quiere una vuelta, ¡brum!'
        de: '@@@session.user.name@@@ hat das Motorrad gewaschen: Der Ankylosaurus will mitfahren, brumm!'
        it: '@@@session.user.name@@@ ha lavato la moto: l''anchilosauro vuole fare un giro, brum!'
        pt: '@@@session.user.name@@@ lavou a mota: o anquilossauro quer dar uma volta, vrum!'
        br: '@@@session.user.name@@@ lavou a moto: o anquilossauro quer dar uma volta, vrum!'
        nl: '@@@session.user.name@@@ heeft de motor gewassen: de ankylosaurus wil een ritje maken, vroem!'
      dt_d_repas_06:
        fr: '@@@session.user.name@@@ a cuisiné un bon petit plat : le T. rex dit miam !'
        en: '@@@session.user.name@@@ cooked a simple dish: the T. rex says yum!'
        es: '¡@@@session.user.name@@@ ha cocinado un plato sencillo: ¡el T. rex dice ñam!'
        de: '@@@session.user.name@@@ hat ein einfaches Gericht gekocht: Der T. rex sagt mampf!'
        it: '@@@session.user.name@@@ ha cucinato un piatto semplice: il T. rex dice gnam!'
        pt: '@@@session.user.name@@@ cozinhou um prato simples: o T. rex diz nham!'
        br: '@@@session.user.name@@@ cozinhou um prato simples: o T. rex diz nhac!'
        nl: '@@@session.user.name@@@ heeft een simpel gerecht gekookt: de T. rex zegt mmm!'
      dt_d_repas_07:
        fr: '@@@session.user.name@@@ a réchauffé le plat : le bébé diplodocus souffle dessus et se régale !'
        en: '@@@session.user.name@@@ warmed up the dish: the baby diplodocus blows on it and tucks in!'
        es: '¡@@@session.user.name@@@ ha calentado el plato: el bebé diplodocus sopla y se lo come!'
        de: '@@@session.user.name@@@ hat das Essen aufgewärmt: Das Diplodocus-Baby pustet und schmaust!'
        it: '@@@session.user.name@@@ ha scaldato il piatto: il cucciolo di diplodoco ci soffia e se lo gusta!'
        pt: '@@@session.user.name@@@ aqueceu o prato: o bebé diplódoco sopra e delicia-se!'
        br: '@@@session.user.name@@@ esquentou o prato: o bebê diplodoco assopra e se delicia!'
        nl: '@@@session.user.name@@@ heeft het eten opgewarmd: de babydiplodocus blaast erop en smult!'
      dt_d_repas_10:
        fr: '@@@session.user.name@@@ a préparé le plat du quotidien : la tribu se régale, le tricératops lèche son
          bol !'
        en: '@@@session.user.name@@@ made the everyday dish: the tribe tucks in, the dino licks his plate!'
        es: '¡@@@session.user.name@@@ ha preparado el plato de cada día: la tribu disfruta, ¡el triceratops rebaña!'
        de: '@@@session.user.name@@@ hat das Alltagsessen gekocht: Der Stamm schmaust, der Triceratops leckt den
          Teller ab!'
        it: '@@@session.user.name@@@ ha preparato il piatto di tutti i giorni: la tribù se lo gusta e il triceratopo
          lecca il piatto!'
        pt: '@@@session.user.name@@@ preparou o prato do dia a dia: a tribo delicia-se e o tricerátopo lambe o prato!'
        br: '@@@session.user.name@@@ preparou o prato do dia a dia: a tribo se delicia e o tricerátopo lambe o prato!'
        nl: '@@@session.user.name@@@ heeft het gewone maaltje gemaakt: de stam smult en de triceratops likt zijn
          bord af!'
      dt_d_repas_11:
        fr: '@@@session.user.name@@@ a préparé un repas de fête digne des grands chefs : le T. rex danse de joie
          !'
        en: '@@@session.user.name@@@ made a gourmet party meal: the T. rex dances for joy!'
        es: '¡@@@session.user.name@@@ ha preparado un banquete de chef: ¡el T. rex baila de alegría!'
        de: '@@@session.user.name@@@ hat ein Festessen gezaubert: Der T. rex tanzt vor Freude!'
        it: '@@@session.user.name@@@ ha preparato un pranzo di festa da grande chef: il T. rex balla di gioia!'
        pt: '@@@session.user.name@@@ preparou uma refeição de festa: o T. rex dança de alegria!'
        br: '@@@session.user.name@@@ preparou um banquete de chef: o T. rex dança de alegria!'
        nl: '@@@session.user.name@@@ heeft een feestmaal als een echte topkok gemaakt: de T. rex danst van blijdschap!'
      dt_d_salle_de_bain_01:
        fr: '@@@session.user.name@@@ a aspiré ou balayé la salle de bain : le bébé tricératops n''éternue plus !'
        en: '@@@session.user.name@@@ vacuumed or swept the bathroom: the baby triceratops stopped sneezing!'
        es: '¡@@@session.user.name@@@ ha aspirado o barrido el baño: el bebé triceratops ya no estornuda!'
        de: '@@@session.user.name@@@ hat das Bad gesaugt oder gefegt: Das Triceratops-Baby niest nicht mehr!'
        it: '@@@session.user.name@@@ ha aspirato o spazzato il bagno: il triceratopo non starnutisce più!'
        pt: '@@@session.user.name@@@ aspirou ou varreu a casa de banho: o tricerátopo já não espirra!'
        br: '@@@session.user.name@@@ aspirou ou varreu o banheiro: o tricerátopo não espirra mais!'
        nl: '@@@session.user.name@@@ heeft de badkamer gezogen of geveegd: de babytriceratops niest niet meer!'
      dt_d_salle_de_bain_02:
        fr: '@@@session.user.name@@@ a fait les poussières de la salle de bain : le stégosaure brille comme neuf
          !'
        en: '@@@session.user.name@@@ dusted the bathroom: the stegosaurus shines like new!'
        es: '¡@@@session.user.name@@@ ha quitado el polvo del baño: ¡el estegosaurio brilla como nuevo!'
        de: '@@@session.user.name@@@ hat im Bad Staub gewischt: Der Stegosaurus glänzt wie neu!'
        it: '@@@session.user.name@@@ ha spolverato il bagno: lo stegosauro brilla come nuovo!'
        pt: '@@@session.user.name@@@ limpou o pó da casa de banho: o estegossauro brilha!'
        br: '@@@session.user.name@@@ tirou o pó do banheiro: o estegossauro brilha como novo!'
        nl: '@@@session.user.name@@@ heeft de badkamer afgestoft: de stegosaurus glanst als nieuw!'
      dt_d_salle_de_bain_03:
        fr: '@@@session.user.name@@@ a lavé le sol de la salle de bain : le bébé diplodocus fait des glissades !'
        en: '@@@session.user.name@@@ washed the bathroom floor: the baby diplodocus slides about, whee!'
        es: '¡@@@session.user.name@@@ ha fregado el suelo del baño: el bebé diplodocus resbala, ¡yupiii!'
        de: '@@@session.user.name@@@ hat den Badboden gewischt: Das Diplodocus-Baby rutscht, juhuu!'
        it: '@@@session.user.name@@@ ha lavato il pavimento del bagno: il diplodoco scivola, wiii!'
        pt: '@@@session.user.name@@@ lavou o chão da casa de banho: o bebé diplódoco escorrega, uiii!'
        br: '@@@session.user.name@@@ lavou o chão do banheiro: o bebê diplodoco escorrega, uiii!'
        nl: '@@@session.user.name@@@ heeft de badkamervloer gedweild: de babydiplodocus glijdt, joehoe!'
      dt_d_salle_de_bain_04:
        fr: '@@@session.user.name@@@ a fait briller les vitres de la salle de bain : le ptérodactyle fait coucou
          !'
        en: '@@@session.user.name@@@ made the bathroom windows sparkle: the pterodactyl waves hello!'
        es: '¡@@@session.user.name@@@ ha dejado brillantes los cristales del baño: ¡el pterodáctilo saluda!'
        de: '@@@session.user.name@@@ hat die Badfenster blank geputzt: Der Flugsaurier winkt!'
        it: '@@@session.user.name@@@ ha pulito i vetri del bagno: lo pterodattilo saluta!'
        pt: '@@@session.user.name@@@ pôs os vidros da casa de banho a brilhar: o pterodáctilo acena!'
        br: '@@@session.user.name@@@ deixou os vidros do banheiro brilhando: o pterodáctilo acena!'
        nl: '@@@session.user.name@@@ heeft de badkamerramen laten blinken: de pterodactylus zwaait!'
      dt_d_salle_de_bain_05:
        fr: '@@@session.user.name@@@ a fait briller le lavabo : le stégosaure s''y lave les pattes !'
        en: '@@@session.user.name@@@ made the sink shine: the stegosaurus washes his paws in it!'
        es: '¡@@@session.user.name@@@ ha dejado reluciente el lavabo: ¡el dino se lava las patas!'
        de: '@@@session.user.name@@@ hat das Waschbecken geputzt: Der Stegosaurus wäscht seine Tatzen!'
        it: '@@@session.user.name@@@ ha fatto brillare il lavandino: lo stegosauro ci si lava le zampe!'
        pt: '@@@session.user.name@@@ pôs o lavatório a brilhar: o estegossauro lava as patas!'
        br: '@@@session.user.name@@@ deixou a pia brilhando: o estegossauro lava as patinhas!'
        nl: '@@@session.user.name@@@ heeft de wastafel gepoetst: de stegosaurus wast zijn pootjes!'
      dt_d_salle_de_bain_06:
        fr: '@@@session.user.name@@@ a fait briller le miroir de la salle de bain : le tricératops fait des grimaces
          !'
        en: '@@@session.user.name@@@ made the bathroom mirror shine: the triceratops pulls funny faces!'
        es: '¡@@@session.user.name@@@ ha dejado brillante el espejo del baño: ¡el triceratops se hace muecas!'
        de: '@@@session.user.name@@@ hat den Badspiegel blank geputzt: Der Triceratops schneidet Grimassen!'
        it: '@@@session.user.name@@@ ha fatto brillare lo specchio del bagno: il triceratopo fa le smorfie!'
        pt: '@@@session.user.name@@@ pôs o espelho da casa de banho a brilhar: o tricerátopo faz caretas!'
        br: '@@@session.user.name@@@ deixou o espelho do banheiro brilhando: o tricerátopo faz caretas!'
        nl: '@@@session.user.name@@@ heeft de badkamerspiegel laten blinken: de triceratops trekt gekke bekken!'
      dt_d_salle_de_bain_07:
        fr: '@@@session.user.name@@@ a nettoyé la douche : le diplodocus y chante, lalala !'
        en: '@@@session.user.name@@@ cleaned the shower: the diplodocus sings in it, la la la!'
        es: '¡@@@session.user.name@@@ ha limpiado la ducha: el diplodocus canta, ¡lalala!'
        de: '@@@session.user.name@@@ hat die Dusche geputzt: Der Diplodocus singt darin, lalala!'
        it: '@@@session.user.name@@@ ha pulito la doccia: il diplodoco canta, lalalà!'
        pt: '@@@session.user.name@@@ limpou o duche: o diplódoco canta, lalalá!'
        br: '@@@session.user.name@@@ limpou o box: o diplodoco canta, lalalá!'
        nl: '@@@session.user.name@@@ heeft de douche gepoetst: de diplodocus zingt, lalala!'
      dt_d_salle_de_bain_08:
        fr: '@@@session.user.name@@@ a nettoyé la baignoire : le bébé ankylosaure plonge, plouf !'
        en: '@@@session.user.name@@@ cleaned the bathtub: the baby ankylosaurus jumps in, splash!'
        es: '¡@@@session.user.name@@@ ha limpiado la bañera: el bebé anquilosaurio se zambulle, ¡chof!'
        de: '@@@session.user.name@@@ hat die Badewanne geputzt: Das Dino-Baby hüpft rein, platsch!'
        it: '@@@session.user.name@@@ ha pulito la vasca: il cucciolo di anchilosauro si tuffa, splash!'
        pt: '@@@session.user.name@@@ limpou a banheira: o bebé anquilossauro mergulha, chape!'
        br: '@@@session.user.name@@@ limpou a banheira: o bebê anquilossauro mergulha, tchibum!'
        nl: '@@@session.user.name@@@ heeft het bad gepoetst: de babyankylosaurus duikt erin!'
      dt_d_salle_de_bain_10:
        fr: '@@@session.user.name@@@ a changé les serviettes : le stégosaure s''enroule dedans comme un burrito
          !'
        en: '@@@session.user.name@@@ changed the towels: the stegosaurus wraps up like a burrito!'
        es: '¡@@@session.user.name@@@ ha cambiado las toallas: ¡el estegosaurio se envuelve como un burrito!'
        de: '@@@session.user.name@@@ hat die Handtücher gewechselt: Der Stegosaurus wickelt sich ein!'
        it: '@@@session.user.name@@@ ha cambiato gli asciugamani: lo stegosauro ci si avvolge tutto!'
        pt: '@@@session.user.name@@@ trocou as toalhas: o estegossauro enrola-se como um burrito!'
        br: '@@@session.user.name@@@ trocou as toalhas: o estegossauro se enrola feito burrito!'
        nl: '@@@session.user.name@@@ heeft de handdoeken verwisseld: de stegosaurus rolt zich erin op!'
      dt_d_salle_de_bain_11:
        fr: '@@@session.user.name@@@ a nettoyé les joints et le carrelage : le bébé tricératops joue à la marelle
          !'
        en: '@@@session.user.name@@@ cleaned the grout and tiles: the baby triceratops plays hopscotch!'
        es: '¡@@@session.user.name@@@ ha limpiado las juntas y los azulejos: ¡el bebé triceratops juega a la rayuela!'
        de: '@@@session.user.name@@@ hat Fugen und Fliesen geputzt: Das Triceratops-Baby spielt Himmel und Hölle!'
        it: '@@@session.user.name@@@ ha pulito fughe e piastrelle: il cucciolo di triceratopo gioca a campana!'
        pt: '@@@session.user.name@@@ limpou as juntas e os azulejos: o bebé tricerátopo joga à macaca!'
        br: '@@@session.user.name@@@ limpou os rejuntes e os azulejos: o bebê tricerátopo brinca de amarelinha!'
        nl: '@@@session.user.name@@@ heeft de voegen en tegels gepoetst: de babytriceratops speelt hinkelen!'
      dt_d_salle_de_bain_12:
        fr: '@@@session.user.name@@@ a détartré la robinetterie de la salle de bain : le parasaurolophe s''y voit
          et trompette, pouêt !'
        en: '@@@session.user.name@@@ descaled the bathroom taps: the parasaurolophus sees himself and toots!'
        es: '¡@@@session.user.name@@@ ha quitado la cal de los grifos del baño: el parasaurolophus se ve y trompetea,
          ¡pu-pú!'
        de: '@@@session.user.name@@@ hat die Wasserhähne im Bad entkalkt: Der Parasaurolophus trötet, töröö!'
        it: '@@@session.user.name@@@ ha tolto il calcare dai rubinetti del bagno: il parasaurolofo strombetta, pepé!'
        pt: '@@@session.user.name@@@ tirou o calcário das torneiras da casa de banho: o parassaurolofo toca a trombeta,
          pó-pó!'
        br: '@@@session.user.name@@@ tirou o calcário das torneiras do banheiro: o parassaurolofo toca a trombeta!'
        nl: '@@@session.user.name@@@ heeft de kranen in de badkamer ontkalkt: de parasaurolophus toetert, toet!'
      dt_d_salon_01:
        fr: '@@@session.user.name@@@ a rendu le salon tout propre : le tricératops saute de joie !'
        en: '@@@session.user.name@@@ made the living room spotless: the triceratops jumps for joy!'
        es: '¡@@@session.user.name@@@ ha dejado el salón limpísimo: el triceratops salta de alegría!'
        de: '@@@session.user.name@@@ hat das Wohnzimmer blitzblank gemacht: Der Triceratops hüpft vor Freude!'
        it: '@@@session.user.name@@@ ha reso il soggiorno pulitissimo: il triceratopo salta di gioia!'
        pt: '@@@session.user.name@@@ deixou a sala limpinha: o tricerátopo salta de alegria!'
        br: '@@@session.user.name@@@ deixou a sala limpinha: o tricerátopo pula de alegria!'
        nl: '@@@session.user.name@@@ heeft de woonkamer brandschoon gemaakt: de triceratops springt blij!'
      dt_d_salon_02:
        fr: '@@@session.user.name@@@ a fait les poussières du salon : le diplodocus n''éternue plus, ouf !'
        en: '@@@session.user.name@@@ dusted the living room: the diplodocus has stopped sneezing, phew!'
        es: '¡@@@session.user.name@@@ ha quitado el polvo del salón: el diplodocus ya no estornuda, ¡uf!'
        de: '@@@session.user.name@@@ hat im Wohnzimmer Staub gewischt: Der Diplodocus niest nicht mehr, puh!'
        it: '@@@session.user.name@@@ ha spolverato il soggiorno: il diplodoco non starnutisce più, uff!'
        pt: '@@@session.user.name@@@ limpou o pó da sala: o diplódoco já não espirra, ufa!'
        br: '@@@session.user.name@@@ tirou o pó da sala: o diplodoco não espirra mais, ufa!'
        nl: '@@@session.user.name@@@ heeft de woonkamer afgestoft: de diplodocus niest niet meer, pfoe!'
      dt_d_salon_03:
        fr: '@@@session.user.name@@@ a lavé le sol du salon : le stégosaure y danse !'
        en: '@@@session.user.name@@@ washed the living room floor: the stegosaurus dances on it!'
        es: '¡@@@session.user.name@@@ ha fregado el suelo del salón: ¡el estegosaurio baila!'
        de: '@@@session.user.name@@@ hat den Wohnzimmerboden gewischt: Der Stegosaurus tanzt darauf!'
        it: '@@@session.user.name@@@ ha lavato il pavimento del soggiorno: lo stegosauro ci balla!'
        pt: '@@@session.user.name@@@ lavou o chão da sala: o estegossauro dança!'
        br: '@@@session.user.name@@@ lavou o chão da sala: o estegossauro dança!'
        nl: '@@@session.user.name@@@ heeft de woonkamervloer gedweild: de stegosaurus danst!'
      dt_d_salon_04:
        fr: '@@@session.user.name@@@ a fait briller les vitres du salon : le ptérodactyle voit tout !'
        en: '@@@session.user.name@@@ made the living room windows sparkle: the pterodactyl can see Green Valley!'
        es: '¡@@@session.user.name@@@ ha dejado brillantes los cristales del salón: ¡el pterodáctilo lo ve todo!'
        de: '@@@session.user.name@@@ hat die Wohnzimmerfenster geputzt: Der Flugsaurier sieht das Grüne Tal!'
        it: '@@@session.user.name@@@ ha fatto brillare i vetri del soggiorno: lo pterodattilo vede la valle!'
        pt: '@@@session.user.name@@@ pôs os vidros da sala a brilhar: o pterodáctilo vê o Vale Verde!'
        br: '@@@session.user.name@@@ deixou os vidros da sala brilhando: o pterodáctilo vê tudo!'
        nl: '@@@session.user.name@@@ heeft de woonkamerramen laten blinken: de pterodactylus ziet de Groene Vallei!'
      dt_d_salon_05:
        fr: '@@@session.user.name@@@ a lavé les murs du salon : le brachiosaure trouve la grotte jolie !'
        en: '@@@session.user.name@@@ washed the living room walls: the brachiosaurus thinks the cave looks lovely!'
        es: '¡@@@session.user.name@@@ ha lavado las paredes del salón: ¡al braquiosaurio la cueva le encanta!'
        de: '@@@session.user.name@@@ hat die Wohnzimmerwände gewaschen: Der Brachiosaurus findet die Höhle hübsch!'
        it: '@@@session.user.name@@@ ha lavato i muri del soggiorno: il brachiosauro trova la grotta bellissima!'
        pt: '@@@session.user.name@@@ lavou as paredes da sala: o braquiossauro acha a gruta linda!'
        br: '@@@session.user.name@@@ lavou as paredes da sala: o braquiossauro acha a caverna linda!'
        nl: '@@@session.user.name@@@ heeft de woonkamermuren gewassen: de brachiosaurus vindt de grot prachtig!'
      dt_d_salon_06:
        fr: '@@@session.user.name@@@ a fait briller le miroir du salon : le bébé tricératops s''y fait un bisou
          !'
        en: '@@@session.user.name@@@ made the living room mirror shine: the baby triceratops kisses his reflection!'
        es: '¡@@@session.user.name@@@ ha dejado brillante el espejo del salón: ¡el bebé triceratops se da un beso!'
        de: '@@@session.user.name@@@ hat den Wohnzimmerspiegel blank geputzt: Das Triceratops-Baby gibt sich ein
          Küsschen!'
        it: '@@@session.user.name@@@ ha fatto brillare lo specchio del soggiorno: il triceratopo si dà un bacino!'
        pt: '@@@session.user.name@@@ pôs o espelho da sala a brilhar: o bebé tricerátopo dá-se um beijinho!'
        br: '@@@session.user.name@@@ deixou o espelho da sala brilhando: o bebê tricerátopo se dá um beijinho!'
        nl: '@@@session.user.name@@@ heeft de woonkamerspiegel laten blinken: de babytriceratops geeft zichzelf
          een kusje!'
      dt_d_salon_07:
        fr: '@@@session.user.name@@@ a tout rangé dans le salon : le stégosaure fait un gros câlin !'
        en: '@@@session.user.name@@@ tidied up the living room: the baby stegosaurus gives a big hug!'
        es: '¡@@@session.user.name@@@ ha ordenado el salón: el bebé estegosaurio da un abrazo enorme!'
        de: '@@@session.user.name@@@ hat das Wohnzimmer aufgeräumt: Der Stegosaurus umarmt alle!'
        it: '@@@session.user.name@@@ ha riordinato il soggiorno: lo stegosauro fa un abbraccio gigante!'
        pt: '@@@session.user.name@@@ arrumou a sala: o bebé estegossauro dá um abração!'
        br: '@@@session.user.name@@@ arrumou a sala: o bebê estegossauro dá um abração!'
        nl: '@@@session.user.name@@@ heeft de woonkamer opgeruimd: de stegosaurus geeft een knuffel!'
      dt_d_salon_08:
        fr: '@@@session.user.name@@@ a aspiré le canapé : l''ankylosaure s''y affale, tout doux !'
        en: '@@@session.user.name@@@ vacuumed the sofa: the ankylosaurus flops down on it, so soft!'
        es: '¡@@@session.user.name@@@ ha aspirado el sofá: el anquilosaurio se tumba, ¡qué blandito!'
        de: '@@@session.user.name@@@ hat das Sofa abgesaugt: Der Ankylosaurus plumpst darauf, so weich!'
        it: '@@@session.user.name@@@ ha aspirato il divano: l''anchilosauro ci si spaparanza, che morbido!'
        pt: '@@@session.user.name@@@ aspirou o sofá: o anquilossauro atira-se para lá, que fofo!'
        br: '@@@session.user.name@@@ aspirou o sofá: o anquilossauro se joga nele, que fofinho!'
        nl: '@@@session.user.name@@@ heeft de bank gezogen: de ankylosaurus ploft erop, zo zacht!'
      dt_d_salon_09:
        fr: '@@@session.user.name@@@ a shampouiné le canapé : le tricératops s''y pelotonne !'
        en: '@@@session.user.name@@@ shampooed the sofa: the triceratops curls up on it!'
        es: '¡@@@session.user.name@@@ ha lavado el sofá: el triceratops se acurruca!'
        de: '@@@session.user.name@@@ hat das Sofa gereinigt: Der Triceratops kuschelt sich hinein!'
        it: '@@@session.user.name@@@ ha lavato il divano: il triceratopo ci si accoccola!'
        pt: '@@@session.user.name@@@ lavou o sofá: o tricerátopo aninha-se!'
        br: '@@@session.user.name@@@ lavou o sofá: o tricerátopo se aconchega!'
        nl: '@@@session.user.name@@@ heeft de bank gereinigd: de triceratops kruipt erop!'
      dt_d_terrasse_01:
        fr: '@@@session.user.name@@@ a balayé la terrasse : le bébé iguanodon y fait la roue !'
        en: '@@@session.user.name@@@ swept the terrace: the baby iguanodon does cartwheels on it!'
        es: '¡@@@session.user.name@@@ ha barrido la terraza: el bebé iguanodonte hace la rueda!'
        de: '@@@session.user.name@@@ hat die Terrasse gefegt: Das Iguanodon-Baby schlägt Rad!'
        it: '@@@session.user.name@@@ ha spazzato la terrazza: il cucciolo di iguanodonte fa la ruota!'
        pt: '@@@session.user.name@@@ varreu o terraço: o bebé iguanodonte faz o pino!'
        br: '@@@session.user.name@@@ varreu a varanda: o bebê iguanodonte dá estrelinha!'
        nl: '@@@session.user.name@@@ heeft het terras geveegd: de babyiguanodon maakt een radslag!'
      dt_d_terrasse_02:
        fr: '@@@session.user.name@@@ a lavé la terrasse : le tricératops s''y allonge au soleil !'
        en: '@@@session.user.name@@@ washed the terrace: the triceratops stretches out in the sun!'
        es: '¡@@@session.user.name@@@ ha lavado la terraza: el triceratops se tumba al sol!'
        de: '@@@session.user.name@@@ hat die Terrasse geschrubbt: Der Triceratops liegt in der Sonne!'
        it: '@@@session.user.name@@@ ha lavato la terrazza: il triceratopo si stende al sole!'
        pt: '@@@session.user.name@@@ lavou o terraço: o tricerátopo estende-se ao sol!'
        br: '@@@session.user.name@@@ lavou a varanda: o tricerátopo se estica no sol!'
        nl: '@@@session.user.name@@@ heeft het terras geschrobd: de triceratops ligt in de zon!'
      dt_d_terrasse_03:
        fr: '@@@session.user.name@@@ a arrosé les plantes du balcon et de la terrasse : le stégosaure renifle les
          fleurs, mmm !'
        en: '@@@session.user.name@@@ watered the balcony and terrace plants: the stegosaurus sniffs the flowers!'
        es: '¡@@@session.user.name@@@ ha regado las plantas del balcón y la terraza: ¡el estegosaurio huele las
          flores!'
        de: '@@@session.user.name@@@ hat die Balkon- und Terrassenpflanzen gegossen: Der Stegosaurus schnuppert
          an den Blumen, mmm!'
        it: '@@@session.user.name@@@ ha annaffiato le piante del balcone e della terrazza: lo stegosauro annusa
          i fiori, mmm!'
        pt: '@@@session.user.name@@@ regou as plantas da varanda e do terraço: o estegossauro cheira as flores,
          mmm!'
        br: '@@@session.user.name@@@ regou as plantas da sacada e da varanda: o estegossauro cheira as flores, mmm!'
        nl: '@@@session.user.name@@@ heeft de planten op balkon en terras water gegeven: de stegosaurus snuffelt!'
      dt_d_toilettes_01:
        fr: '@@@session.user.name@@@ a aspiré ou balayé le petit coin : le diplodocus applaudit avec sa queue !'
        en: '@@@session.user.name@@@ vacuumed or swept the little room: the diplodocus claps with his tail!'
        es: '¡@@@session.user.name@@@ ha aspirado o barrido el aseo: ¡el diplodocus aplaude con la cola!'
        de: '@@@session.user.name@@@ hat das Örtchen gesaugt oder gefegt: Der Dino klatscht!'
        it: '@@@session.user.name@@@ ha aspirato o spazzato il bagnetto: il diplodoco applaude con la coda!'
        pt: '@@@session.user.name@@@ aspirou ou varreu a sanita: o diplódoco aplaude!'
        br: '@@@session.user.name@@@ aspirou ou varreu o banheirinho: o diplodoco aplaude com o rabo!'
        nl: '@@@session.user.name@@@ heeft de wc gezogen of geveegd: de diplodocus klapt met zijn staart!'
      dt_d_toilettes_02:
        fr: '@@@session.user.name@@@ a fait les poussières du petit coin : le bébé stégosaure n''éternue plus !'
        en: '@@@session.user.name@@@ dusted the little room: the stegosaurus has stopped sneezing!'
        es: '¡@@@session.user.name@@@ ha quitado el polvo del aseo: ¡el estegosaurio ya no estornuda!'
        de: '@@@session.user.name@@@ hat im Örtchen Staub gewischt: Das Dino-Baby niest nicht mehr!'
        it: '@@@session.user.name@@@ ha spolverato il bagnetto: il cucciolo di stegosauro non starnutisce!'
        pt: '@@@session.user.name@@@ limpou o pó da sanita: o dino já não espirra!'
        br: '@@@session.user.name@@@ tirou o pó do banheirinho: o bebê estegossauro não espirra mais!'
        nl: '@@@session.user.name@@@ heeft de wc afgestoft: de babystegosaurus niest niet meer!'
      dt_d_toilettes_03:
        fr: '@@@session.user.name@@@ a lavé le sol du petit coin : le tricératops sent la fleur !'
        en: '@@@session.user.name@@@ washed the little room floor: the triceratops smells flowers!'
        es: '¡@@@session.user.name@@@ ha fregado el suelo del aseo: ¡el triceratops huele a flores!'
        de: '@@@session.user.name@@@ hat den Boden im Örtchen gewischt: Der Dino riecht Blumen!'
        it: '@@@session.user.name@@@ ha lavato il pavimento del bagnetto: il triceratopo dice che profuma di fiori!'
        pt: '@@@session.user.name@@@ lavou o chão da sanita: o tricerátopo cheira flores!'
        br: '@@@session.user.name@@@ lavou o chão do banheirinho: o tricerátopo sente cheiro de flor!'
        nl: '@@@session.user.name@@@ heeft de wc-vloer gedweild: de dino ruikt bloemen!'
      dt_d_toilettes_04:
        fr: '@@@session.user.name@@@ a fait briller la cuvette : le bébé ankylosaure applaudit, bravo !'
        en: '@@@session.user.name@@@ made the toilet bowl shine: the baby ankylosaurus claps!'
        es: '¡@@@session.user.name@@@ ha dejado reluciente el váter: el bebé anquilosaurio aplaude, ¡bravo!'
        de: '@@@session.user.name@@@ hat die Kloschüssel geputzt: Das Dino-Baby klatscht, bravo!'
        it: '@@@session.user.name@@@ ha fatto brillare il water: il cucciolo di dino applaude, bravo!'
        pt: '@@@session.user.name@@@ pôs a sanita a brilhar: o dino aplaude!'
        br: '@@@session.user.name@@@ deixou o vaso brilhando: o bebê anquilossauro aplaude, oba!'
        nl: '@@@session.user.name@@@ heeft de wc-pot gepoetst: de babydino klapt, bravo!'
      dt_d_toilettes_06:
        fr: '@@@session.user.name@@@ a lavé les murs du petit coin : le stégosaure fait un grand sourire !'
        en: '@@@session.user.name@@@ washed the little room walls: the stegosaurus gives a big smile!'
        es: '¡@@@session.user.name@@@ ha lavado las paredes del aseo: ¡el estegosaurio sonríe de oreja a oreja!'
        de: '@@@session.user.name@@@ hat die Wände im Örtchen gewaschen: Der Stegosaurus strahlt!'
        it: '@@@session.user.name@@@ ha lavato i muri del bagnetto: lo stegosauro fa un gran sorriso!'
        pt: '@@@session.user.name@@@ lavou as paredes da sanita: o estegossauro sorri!'
        br: '@@@session.user.name@@@ lavou as paredes do banheirinho: o estegossauro abre um sorrisão!'
        nl: '@@@session.user.name@@@ heeft de wc-muren gewassen: de stegosaurus lacht breeduit!'
      dt_d_vaisselle_01:
        fr: '@@@session.user.name@@@ a fait la petite vaisselle : le bébé tricératops retrouve son bol, youpi !'
        en: '@@@session.user.name@@@ did the few dishes: the baby triceratops gets his bowl back, yippee!'
        es: '¡@@@session.user.name@@@ ha fregado los pocos platos: el triceratops recupera su cuenco, ¡yupi!'
        de: '@@@session.user.name@@@ hat das bisschen Geschirr gespült: Der Triceratops hat seine Schüssel!'
        it: '@@@session.user.name@@@ ha lavato i pochi piatti: il triceratopo ritrova la sua ciotola, evviva!'
        pt: '@@@session.user.name@@@ lavou a pouca loiça: o bebé tricerátopo tem a tigela de volta, viva!'
        br: '@@@session.user.name@@@ lavou a pouca louça: o bebê tricerátopo tem a tigela de volta!'
        nl: '@@@session.user.name@@@ heeft de kleine afwas gedaan: de babytriceratops heeft zijn kom terug, joepie!'
      dt_d_vaisselle_02:
        fr: '@@@session.user.name@@@ a fait la grosse vaisselle : plus de montagne, le brachiosaure n''en revient
          pas !'
        en: '@@@session.user.name@@@ did the big pile of dishes: the brachiosaurus can''t believe it!'
        es: '¡@@@session.user.name@@@ ha fregado la montaña de platos: ¡el braquiosaurio no se lo cree!'
        de: '@@@session.user.name@@@ hat den Geschirrberg gespült: Der Brachiosaurus staunt!'
        it: '@@@session.user.name@@@ ha lavato la montagna di piatti: il brachiosauro non ci crede!'
        pt: '@@@session.user.name@@@ lavou a montanha de loiça: o braquiossauro nem acredita!'
        br: '@@@session.user.name@@@ lavou a montanha de louça: o braquiossauro nem acredita!'
        nl: '@@@session.user.name@@@ heeft de grote afwas gedaan: de brachiosaurus kan het niet geloven!'
      dt_d_vaisselle_03:
        fr: '@@@session.user.name@@@ a rempli le lave-vaisselle : le bébé stégosaure ferme la porte, clac !'
        en: '@@@session.user.name@@@ loaded the dishwasher: the baby stegosaurus shuts the door, click!'
        es: '¡@@@session.user.name@@@ ha llenado el lavavajillas: el bebé estegosaurio cierra la puerta, ¡clac!'
        de: '@@@session.user.name@@@ hat die Spülmaschine eingeräumt: Das Stegosaurus-Baby macht zu, klack!'
        it: '@@@session.user.name@@@ ha riempito la lavastoviglie: il cucciolo di stegosauro chiude, clac!'
        pt: '@@@session.user.name@@@ encheu a máquina da loiça: o bebé estegossauro fecha a porta, clac!'
        br: '@@@session.user.name@@@ encheu a lava-louças: o bebê estegossauro fecha a porta, clac!'
        nl: '@@@session.user.name@@@ heeft de vaatwasser ingeruimd: de babystegosaurus doet hem dicht, klak!'
      dt_d_vaisselle_04:
        fr: '@@@session.user.name@@@ a vidé le lave-vaisselle : les assiettes brillent, le tricératops dit bravo
          !'
        en: '@@@session.user.name@@@ emptied the dishwasher: the plates sparkle, the triceratops cheers!'
        es: '¡@@@session.user.name@@@ ha vaciado el lavavajillas: los platos brillan, ¡el dino aplaude!'
        de: '@@@session.user.name@@@ hat die Spülmaschine ausgeräumt: Die Teller glänzen, der Triceratops ruft bravo!'
        it: '@@@session.user.name@@@ ha svuotato la lavastoviglie: i piatti brillano, il triceratopo dice bravo!'
        pt: '@@@session.user.name@@@ esvaziou a máquina da loiça: o tricerátopo diz boa!'
        br: '@@@session.user.name@@@ esvaziou a lava-louças: o tricerátopo diz parabéns!'
        nl: '@@@session.user.name@@@ heeft de vaatwasser uitgeruimd: de borden blinken, de triceratops juicht!'
      dt_d_vaisselle_05:
        fr: '@@@session.user.name@@@ a essuyé la vaisselle : plus une goutte, le diplodocus applaudit !'
        en: '@@@session.user.name@@@ dried the dishes: not a drop left, the diplodocus claps!'
        es: '¡@@@session.user.name@@@ ha secado los platos: ni una gota, ¡el diplodocus aplaude!'
        de: '@@@session.user.name@@@ hat das Geschirr abgetrocknet: Der Diplodocus klatscht!'
        it: '@@@session.user.name@@@ ha asciugato i piatti: nemmeno una goccia, il diplodoco applaude!'
        pt: '@@@session.user.name@@@ limpou a loiça: nem uma gota, o diplódoco aplaude!'
        br: '@@@session.user.name@@@ secou a louça: nenhuma gota, o diplodoco aplaude!'
        nl: '@@@session.user.name@@@ heeft de afwas afgedroogd: geen druppel meer, de diplodocus klapt!'
      dt_d_vaisselle_06:
        fr: '@@@session.user.name@@@ a rangé toute la vaisselle dans les placards : le stégosaure ferme les portes,
          ravi !'
        en: '@@@session.user.name@@@ put all the dishes away in the cupboards: the stegosaurus shuts the doors,
          so happy!'
        es: '¡@@@session.user.name@@@ ha guardado los platos en los armarios: el estegosaurio cierra las puertas,
          ¡feliz!'
        de: '@@@session.user.name@@@ hat das Geschirr in die Schränke geräumt: Der Stegosaurus macht zu, ganz glücklich!'
        it: '@@@session.user.name@@@ ha messo tutti i piatti negli armadietti: lo stegosauro chiude gli sportelli,
          felicissimo!'
        pt: '@@@session.user.name@@@ arrumou a loiça toda nos armários: o estegossauro fecha as portas, contente!'
        br: '@@@session.user.name@@@ guardou a louça nos armários: o estegossauro fecha as portas, feliz!'
        nl: '@@@session.user.name@@@ heeft alle afwas in de kastjes gezet: de stegosaurus doet de deurtjes dicht,
          superblij!'
      dt_d_vaisselle_07:
        fr: '@@@session.user.name@@@ a mis la table : le T. rex s''assoit, serviette au cou !'
        en: '@@@session.user.name@@@ laid the table: the T. rex sits down, napkin on!'
        es: '¡@@@session.user.name@@@ ha puesto la mesa: ¡el T. rex se sienta a comer!'
        de: '@@@session.user.name@@@ hat den Tisch gedeckt: Der T. rex setzt sich hin!'
        it: '@@@session.user.name@@@ ha apparecchiato la tavola: il T. rex si siede col tovagliolo!'
        pt: '@@@session.user.name@@@ pôs a mesa: o T. rex senta-se de guardanapo!'
        br: '@@@session.user.name@@@ pôs a mesa: o T. rex senta de guardanapo!'
        nl: '@@@session.user.name@@@ heeft de tafel gedekt: de T. rex gaat zitten met zijn servet om!'
      dt_d_vaisselle_08:
        fr: '@@@session.user.name@@@ a débarrassé la table : le diplodocus est ravi !'
        en: '@@@session.user.name@@@ cleared the table: the diplodocus is so happy!'
        es: '¡@@@session.user.name@@@ ha recogido la mesa: ¡el diplodocus está feliz!'
        de: '@@@session.user.name@@@ hat den Tisch abgeräumt: Der Diplodocus ist glücklich!'
        it: '@@@session.user.name@@@ ha sparecchiato la tavola: il diplodoco è felicissimo!'
        pt: '@@@session.user.name@@@ levantou a mesa: o diplódoco está contente!'
        br: '@@@session.user.name@@@ tirou a mesa: o diplodoco está feliz!'
        nl: '@@@session.user.name@@@ heeft de tafel afgeruimd: de diplodocus is superblij!'
      dt_d_vaisselle_09:
        fr: '@@@session.user.name@@@ a entretenu le lave-vaisselle : il ronronne, le bébé ankylosaure aussi !'
        en: '@@@session.user.name@@@ looked after the dishwasher: the baby ankylosaurus purrs with it!'
        es: '¡@@@session.user.name@@@ ha cuidado el lavavajillas: ronronea, ¡y el bebé anquilosaurio también!'
        de: '@@@session.user.name@@@ hat die Spülmaschine gepflegt: Das Dino-Baby schnurrt mit!'
        it: '@@@session.user.name@@@ ha pulito la lavastoviglie: fa le fusa, e anche il cucciolo di anchilosauro!'
        pt: '@@@session.user.name@@@ cuidou da máquina da loiça: ronrona, e o bebé anquilossauro também!'
        br: '@@@session.user.name@@@ cuidou da lava-louças: ronrona, e o bebê anquilossauro também!'
        nl: '@@@session.user.name@@@ heeft de vaatwasser verzorgd: hij spint, en de babyankylosaurus ook!'
      dt_d_voiture_01:
        fr: '@@@session.user.name@@@ a nettoyé l''intérieur de la voiture : le dino monte !'
        en: '@@@session.user.name@@@ cleaned inside the car: the triceratops hops in!'
        es: '¡@@@session.user.name@@@ ha limpiado el coche por dentro: ¡el dino sube!'
        de: '@@@session.user.name@@@ putzte das Auto innen: Der Dino steigt ein!'
        it: '@@@session.user.name@@@ ha pulito l''interno dell''auto: il dino sale!'
        pt: '@@@session.user.name@@@ limpou o carro por dentro: o tricerátopo entra!'
        br: '@@@session.user.name@@@ limpou o carro por dentro: o tricerátopo entra!'
        nl: '@@@session.user.name@@@ heeft de auto vanbinnen gepoetst: de triceratops stapt in!'
      dt_d_voiture_02:
        fr: '@@@session.user.name@@@ a lavé la voiture : elle brille, le bébé diplodocus s''y voit !'
        en: '@@@session.user.name@@@ washed the outside of the car: the diplodocus is thrilled!'

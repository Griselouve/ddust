        br: '@@@session.user.name@@@ lavou parte da pouca louça! O bebê tricerátopo espera a tigela preferida, com
          paciência.'
        nl: '@@@session.user.name@@@ heeft een deel van de kleine afwas gedaan! De babytriceratops wacht geduldig
          op zijn lievelingskom.'
      dt_c_vaisselle_02:
        fr: '@@@session.user.name@@@ a lavé une bonne partie de la grosse pile de vaisselle ! Le brachiosaure attendra
          pour essuyer le reste.'
        en: '@@@session.user.name@@@ washed a good part of the big pile of dishes! The brachiosaurus will wait to
          dry the rest.'
        es: ¡@@@session.user.name@@@ ha fregado buena parte de la montaña de platos! El braquiosaurio esperará para
          secar el resto.
        de: '@@@session.user.name@@@ hat einen guten Teil vom großen Geschirrberg gespült! Der Brachiosaurus wartet,
          um den Rest abzutrocknen.'
        it: '@@@session.user.name@@@ ha lavato buona parte della montagna di piatti! Il brachiosauro aspetterà per
          asciugare il resto.'
        pt: '@@@session.user.name@@@ lavou boa parte da montanha de loiça! O braquiossauro espera para limpar o
          resto.'
        br: '@@@session.user.name@@@ lavou boa parte da montanha de louça! O braquiossauro vai esperar para secar
          o resto.'
        nl: '@@@session.user.name@@@ heeft een flink deel van de grote berg afwas gedaan! De brachiosaurus wacht
          om de rest af te drogen.'
      dt_c_vaisselle_03:
        fr: '@@@session.user.name@@@ a mis une partie de la vaisselle dans le lave-vaisselle ! Le bébé stégosaure
          attendra pour tout caser.'
        en: '@@@session.user.name@@@ loaded part of the dishes into the dishwasher! The baby stegosaurus will wait
          to fit everything in.'
        es: ¡@@@session.user.name@@@ ha metido parte de los platos en el lavavajillas! El bebé estegosaurio esperará
          para meterlo todo.
        de: '@@@session.user.name@@@ hat einen Teil vom Geschirr in die Spülmaschine geräumt! Das Stegosaurus-Baby
          wartet auf den Rest.'
        it: '@@@session.user.name@@@ ha messo una parte dei piatti in lavastoviglie! Il cucciolo di stegosauro aspetterà
          per sistemare tutto.'
        pt: '@@@session.user.name@@@ pôs parte da loiça na máquina! O bebé estegossauro espera para arrumar o resto.'
        br: '@@@session.user.name@@@ colocou parte da louça na lava-louças! O bebê estegossauro vai esperar para
          encaixar o resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de afwas in de vaatwasser gezet! De babystegosaurus wacht
          om alles in te ruimen.'
      dt_c_vaisselle_04:
        fr: '@@@session.user.name@@@ a vidé une partie du lave-vaisselle ! Le tricératops tient une pile d''assiettes,
          il attendra la suite.'
        en: '@@@session.user.name@@@ emptied part of the dishwasher! The triceratops is holding a stack of plates.
          He''ll wait for the rest.'
        es: '¡@@@session.user.name@@@ ha vaciado parte del lavavajillas! El triceratops sujeta una pila de platos:
          esperará el resto.'
        de: '@@@session.user.name@@@ hat einen Teil der Spülmaschine ausgeräumt! Der Triceratops hält einen Tellerstapel
          und wartet.'
        it: '@@@session.user.name@@@ ha svuotato una parte della lavastoviglie! Il triceratopo regge una pila di
          piatti: aspetterà il resto.'
        pt: '@@@session.user.name@@@ esvaziou parte da máquina da loiça! O tricerátopo segura uma pilha de pratos
          e espera pelo resto.'
        br: '@@@session.user.name@@@ esvaziou parte da lava-louças! O tricerátopo segura uma pilha de pratos e espera
          o resto.'
        nl: '@@@session.user.name@@@ heeft een deel van de vaatwasser uitgeruimd! De triceratops houdt een stapel
          borden vast en wacht.'
      dt_c_vaisselle_05:
        fr: '@@@session.user.name@@@ a essuyé une partie de la vaisselle mouillée ! Le bébé diplodocus tient le
          torchon, il attendra la suite.'
        en: '@@@session.user.name@@@ dried part of the wet dishes! The baby diplodocus is holding the tea towel.
          He''ll wait for more.'
        es: '¡@@@session.user.name@@@ ha secado parte de los platos mojados! El bebé diplodocus sujeta el trapo:
          esperará.'
        de: '@@@session.user.name@@@ hat einen Teil vom nassen Geschirr abgetrocknet! Das Diplodocus-Baby hält das
          Geschirrtuch und wartet.'
        it: '@@@session.user.name@@@ ha asciugato una parte dei piatti bagnati! Il cucciolo di diplodoco tiene lo
          strofinaccio: aspetterà.'
        pt: '@@@session.user.name@@@ limpou parte da loiça molhada! O bebé diplódoco segura o pano e vai esperar.'
        br: '@@@session.user.name@@@ secou parte da louça molhada! O bebê diplodoco segura o pano de prato e vai
          esperar.'
        nl: '@@@session.user.name@@@ heeft een deel van de natte afwas afgedroogd! De babydiplodocus houdt de theedoek
          vast en wacht.'
      dt_c_vaisselle_06:
        fr: '@@@session.user.name@@@ a rangé une partie de la vaisselle ! Le stégosaure garde les tasses au chaud,
          il attendra pour finir.'
        en: '@@@session.user.name@@@ put away part of the dishes! The stegosaurus is minding the cups. He''ll wait
          to finish.'
        es: '¡@@@session.user.name@@@ ha guardado parte de los platos! El estegosaurio cuida las tazas: esperará.'
        de: '@@@session.user.name@@@ hat einen Teil vom Geschirr eingeräumt! Der Stegosaurus passt auf die Tassen
          auf und wartet.'
        it: '@@@session.user.name@@@ ha messo via una parte dei piatti! Lo stegosauro tiene d''occhio le tazze:
          aspetterà per finire.'
        pt: '@@@session.user.name@@@ arrumou parte da loiça! O estegossauro toma conta das chávenas e espera para
          acabar.'
        br: '@@@session.user.name@@@ guardou parte da louça! O estegossauro cuida das xícaras e espera para terminar.'
        nl: '@@@session.user.name@@@ heeft een deel van de afwas opgeruimd! De stegosaurus past op de kopjes en
          wacht.'
      dt_c_vaisselle_07:
        fr: '@@@session.user.name@@@ a commencé à mettre la table, il manque encore des couverts ! Le T. rex attend
          sagement, il patientera.'
        en: '@@@session.user.name@@@ started laying the table, some cutlery is still missing! The T. rex is waiting
          nicely. He''ll be patient.'
        es: '¡@@@session.user.name@@@ ha empezado a poner la mesa y aún faltan cubiertos! El T. rex espera muy formal:
          tendrá paciencia.'
        de: '@@@session.user.name@@@ hat angefangen, den Tisch zu decken, es fehlt noch Besteck! Der T. rex wartet
          brav und geduldig.'
        it: '@@@session.user.name@@@ ha cominciato ad apparecchiare, mancano ancora le posate! Il T. rex aspetta
          buono buono, con pazienza.'
        pt: '@@@session.user.name@@@ começou a pôr a mesa, ainda faltam talheres! O T. rex espera muito quietinho,
          com paciência.'
        br: '@@@session.user.name@@@ começou a pôr a mesa, ainda faltam talheres! O T. rex espera bem quietinho,
          com paciência.'
        nl: '@@@session.user.name@@@ is begonnen met de tafel dekken, er mist nog bestek! De T. rex wacht braaf
          en geduldig.'
      dt_c_vaisselle_08:
        fr: '@@@session.user.name@@@ a débarrassé une bonne partie de la table, il restait juste quelques miettes
          ! Le diplodocus attendra la suite.'
        en: '@@@session.user.name@@@ cleared most of the table, just a few crumbs were left! The diplodocus will
          wait for the rest.'
        es: ¡@@@session.user.name@@@ ha recogido buena parte de la mesa, solo quedaban unas migas! El diplodocus
          esperará el resto.
        de: '@@@session.user.name@@@ hat den Tisch fast abgeräumt, nur ein paar Krümel blieben! Der Diplodocus wartet
          auf den Rest.'
        it: '@@@session.user.name@@@ ha sparecchiato buona parte della tavola, restava solo qualche briciola! Il
          diplodoco aspetterà il resto.'
        pt: '@@@session.user.name@@@ levantou boa parte da mesa, só ficaram umas migalhas! O diplódoco espera pelo
          resto.'
        br: '@@@session.user.name@@@ tirou boa parte da mesa, só sobraram umas migalhas! O diplodoco vai esperar
          o resto.'
        nl: '@@@session.user.name@@@ heeft de tafel bijna afgeruimd, er lagen nog wat kruimels! De diplodocus wacht
          op de rest.'
      dt_c_vaisselle_09:
        fr: '@@@session.user.name@@@ a commencé à bichonner le lave-vaisselle, le filtre attend encore ! Le bébé
          ankylosaure attendra la suite.'
        en: '@@@session.user.name@@@ started pampering the dishwasher, the filter is still waiting! The baby ankylosaurus
          will wait for the rest.'
        es: ¡@@@session.user.name@@@ ha empezado a mimar el lavavajillas y el filtro aún espera! El bebé anquilosaurio
          esperará el resto.
        de: '@@@session.user.name@@@ hat angefangen, die Spülmaschine zu pflegen, das Sieb wartet noch! Das Ankylosaurus-Baby
          wartet auch.'
        it: '@@@session.user.name@@@ ha cominciato a coccolare la lavastoviglie, il filtro aspetta ancora! Il cucciolo
          di anchilosauro aspetterà.'
        pt: '@@@session.user.name@@@ começou a mimar a máquina da loiça, o filtro ainda espera! O bebé anquilossauro
          espera pelo resto.'
        br: '@@@session.user.name@@@ começou a cuidar da lava-louças, o filtro ainda espera! O bebê anquilossauro
          vai esperar o resto.'
        nl: '@@@session.user.name@@@ is de vaatwasser gaan verwennen, het filter wacht nog! De babyankylosaurus
          wacht op de rest.'
      dt_c_voiture_01:
        fr: '@@@session.user.name@@@ a nettoyé une partie de l''intérieur de la voiture, il restait encore un petit
          bout ! Le tricératops attendra.'
        en: '@@@session.user.name@@@ cleaned part of the inside of the car, there was still a little bit left! The
          triceratops will wait.'
        es: ¡@@@session.user.name@@@ ha limpiado parte del interior del coche, aún quedaba un poquito! El triceratops
          esperará.
        de: '@@@session.user.name@@@ hat das Auto innen schon zum Teil sauber gemacht, ein Stückchen fehlte noch!
          Der Triceratops wartet.'
        it: '@@@session.user.name@@@ ha pulito una parte dell''interno della macchina, mancava ancora un pezzettino!
          Il triceratopo aspetterà.'
        pt: '@@@session.user.name@@@ limpou parte do interior do carro, ainda faltava um bocadinho! O tricerátopo
          vai esperar.'
        br: '@@@session.user.name@@@ limpou parte de dentro do carro, ainda faltava um pouquinho! O tricerátopo
          vai esperar.'
        nl: '@@@session.user.name@@@ heeft de auto vanbinnen al deels schoongemaakt, er bleef nog een stukje over!
          De triceratops wacht.'
      dt_c_voiture_02:
        fr: '@@@session.user.name@@@ a lavé une partie de la carrosserie de la voiture ! Le bébé diplodocus attend
          avec l''éponge, il patientera.'
        en: '@@@session.user.name@@@ washed part of the outside of the car! The baby diplodocus is waiting with
          the sponge. He''ll be patient.'
        es: '¡@@@session.user.name@@@ ha lavado parte de la carrocería del coche! El bebé diplodocus espera con
          la esponja: tendrá paciencia.'
        de: '@@@session.user.name@@@ hat das Auto außen schon zum Teil gewaschen! Das Diplodocus-Baby wartet geduldig
          mit dem Schwamm.'
        it: '@@@session.user.name@@@ ha lavato una parte della carrozzeria della macchina! Il cucciolo di diplodoco
          aspetta con la spugna, paziente.'
        pt: '@@@session.user.name@@@ lavou parte do exterior do carro! O bebé diplódoco espera com a esponja, com
          paciência.'
        br: '@@@session.user.name@@@ lavou parte de fora do carro! O bebê diplodoco espera com a esponja, com paciência.'
        nl: '@@@session.user.name@@@ heeft de auto vanbuiten al deels gewassen! De babydiplodocus wacht geduldig
          met de spons.'
      dt_d_animaux_01:
        fr: '@@@session.user.name@@@ a nourri l''animal : le bébé dino applaudit !'
        en: '@@@session.user.name@@@ fed the pet: the baby dino claps!'
        es: '¡@@@session.user.name@@@ ha dado de comer al animal: el dino aplaude!'
        de: '@@@session.user.name@@@ hat das Tier gefüttert: Das Dino-Baby klatscht!'
        it: '@@@session.user.name@@@ ha dato la pappa all''animale: il dino applaude!'
        pt: '@@@session.user.name@@@ deu de comer ao animal: o dino bate palmas!'
        br: '@@@session.user.name@@@ deu comida pro bichinho: o dino bate palmas!'
        nl: '@@@session.user.name@@@ heeft het dier eten gegeven: de babydino klapt!'
      dt_d_animaux_02:
        fr: '@@@session.user.name@@@ a changé l''eau de l''animal : le dino trinque !'
        en: '@@@session.user.name@@@ changed the pet''s water: the dino says cheers!'
        es: '¡@@@session.user.name@@@ ha cambiado el agua del animal: ¡el dino brinda!'
        de: '@@@session.user.name@@@ hat dem Tier frisches Wasser gegeben: Der Dino prostet!'
        it: '@@@session.user.name@@@ ha cambiato l''acqua all''animale: il dino brinda!'
        pt: '@@@session.user.name@@@ mudou a água do animal: glu glu, o dino brinda!'
        br: '@@@session.user.name@@@ trocou a água do bichinho: o dino brinda!'
        nl: '@@@session.user.name@@@ heeft het water van het dier ververst: de dino proost!'
      dt_d_animaux_03:
        fr: '@@@session.user.name@@@ a nettoyé le coin de l''animal : le dino est ravi !'
        en: '@@@session.user.name@@@ cleaned the pet''s corner: the dino is thrilled!'
        es: '¡@@@session.user.name@@@ ha limpiado el rincón del animal: al dino le encanta!'
        de: '@@@session.user.name@@@ hat die Ecke vom Tier geputzt: Der Dino findet es wunderschön!'
        it: '@@@session.user.name@@@ ha pulito l''angolo dell''animale: al dino piace tanto!'
        pt: '@@@session.user.name@@@ limpou o canto do animal: o dino acha tudo lindo!'
        br: '@@@session.user.name@@@ limpou o cantinho do bicho: o dino achou tudo lindo!'
        nl: '@@@session.user.name@@@ heeft het hoekje van het dier gepoetst: de dino is blij!'
      dt_d_animaux_05:
        fr: '@@@session.user.name@@@ a brossé l''animal : le stégosaure veut aussi la brosse !'
        en: '@@@session.user.name@@@ brushed the pet''s fur: the stegosaurus wants a brush too!'
        es: '¡@@@session.user.name@@@ ha cepillado al animal: el estegosaurio también quiere!'
        de: '@@@session.user.name@@@ hat das Fell vom Tier gebürstet: Der Stegosaurus will auch gebürstet werden!'
        it: '@@@session.user.name@@@ ha spazzolato l''animale: lo stegosauro vuole la spazzola!'
        pt: '@@@session.user.name@@@ escovou o animal: o estegossauro também quer ser escovado!'
        br: '@@@session.user.name@@@ escovou o bicho: o estegossauro também quer uma escovada!'
        nl: '@@@session.user.name@@@ heeft de vacht van het dier geborsteld: de stegosaurus wil ook geborsteld worden!'
      dt_d_balcon_01:
        fr: '@@@session.user.name@@@ a balayé le balcon : le ptérodactyle s''y pose en souriant !'
        en: '@@@session.user.name@@@ swept the balcony: the pterodactyl lands on it with a smile!'
        es: '¡@@@session.user.name@@@ ha barrido el balcón: el pterodáctilo se posa sonriendo!'
        de: '@@@session.user.name@@@ hat den Balkon gefegt: Der Flugsaurier landet lächelnd!'
        it: '@@@session.user.name@@@ ha spazzato il balcone: lo pterodattilo ci atterra sorridendo!'
        pt: '@@@session.user.name@@@ varreu a varanda: o pterodáctilo pousa a sorrir!'
        br: '@@@session.user.name@@@ varreu a sacada: o pterodáctilo pousa sorrindo!'
        nl: '@@@session.user.name@@@ heeft het balkon geveegd: de pterodactylus landt lachend!'
      dt_d_balcon_02:
        fr: '@@@session.user.name@@@ a lavé le balcon : le ptérodactyle bat des ailes, flap flap !'
        en: '@@@session.user.name@@@ washed the balcony: the pterodactyl flaps his wings, flap flap!'
        es: '¡@@@session.user.name@@@ ha fregado el balcón: el pterodáctilo aletea, ¡flap, flap!'
        de: '@@@session.user.name@@@ hat den Balkon geschrubbt: Der Flugsaurier flattert, flatter!'
        it: '@@@session.user.name@@@ ha lavato il balcone: lo pterodattilo sbatte le ali, flap flap!'
        pt: '@@@session.user.name@@@ lavou a varanda: o pterodáctilo bate as asas, flap flap!'
        br: '@@@session.user.name@@@ lavou a sacada: o pterodáctilo bate as asas, flap flap!'
        nl: '@@@session.user.name@@@ heeft het balkon geschrobd: de pterodactylus klappert, flap!'
      dt_d_bureau_01:
        fr: '@@@session.user.name@@@ a aspiré ou balayé le bureau : le bébé tricératops saute de joie !'
        en: '@@@session.user.name@@@ vacuumed or swept the office: the baby triceratops jumps for joy!'
        es: '¡@@@session.user.name@@@ ha aspirado o barrido el despacho: el bebé triceratops salta de alegría!'
        de: '@@@session.user.name@@@ hat das Büro gesaugt oder gefegt: Das Triceratops-Baby hüpft vor Freude!'
        it: '@@@session.user.name@@@ ha aspirato o spazzato lo studio: il triceratopo salta di gioia!'
        pt: '@@@session.user.name@@@ aspirou ou varreu o escritório: o bebé tricerátopo salta de alegria!'
        br: '@@@session.user.name@@@ aspirou ou varreu o escritório: o bebê tricerátopo pula de alegria!'
        nl: '@@@session.user.name@@@ heeft het kantoor gezogen of geveegd: de babytriceratops springt blij!'
      dt_d_bureau_02:
        fr: '@@@session.user.name@@@ a fait les poussières du bureau : le diplodocus n''éternue plus, ouf !'
        en: '@@@session.user.name@@@ dusted the office: the diplodocus has stopped sneezing, phew!'
        es: '¡@@@session.user.name@@@ ha quitado el polvo del despacho: el diplodocus ya no estornuda, ¡uf!'
        de: '@@@session.user.name@@@ hat im Büro Staub gewischt: Der Diplodocus niest nicht mehr, puh!'
        it: '@@@session.user.name@@@ ha spolverato lo studio: il diplodoco non starnutisce più, uff!'
        pt: '@@@session.user.name@@@ limpou o pó do escritório: o diplódoco já não espirra, ufa!'
        br: '@@@session.user.name@@@ tirou o pó do escritório: o diplodoco não espirra mais, ufa!'
        nl: '@@@session.user.name@@@ heeft het kantoor afgestoft: de diplodocus niest niet meer, pfoe!'
      dt_d_bureau_03:
        fr: '@@@session.user.name@@@ a lavé le sol du bureau : le stégosaure y glisse, wiii !'
        en: '@@@session.user.name@@@ washed the office floor: the stegosaurus slides on it, wheee!'
        es: '¡@@@session.user.name@@@ ha fregado el suelo del despacho: el estegosaurio resbala, ¡yupi!'
        de: '@@@session.user.name@@@ hat den Büroboden gewischt: Der Stegosaurus rutscht lachend drüber, juhuu!'
        it: '@@@session.user.name@@@ ha lavato il pavimento dello studio: lo stegosauro ci scivola ridendo, wiii!'
        pt: '@@@session.user.name@@@ lavou o chão do escritório: o estegossauro escorrega a rir, uiii!'
        br: '@@@session.user.name@@@ lavou o chão do escritório: o estegossauro escorrega rindo, uiii!'
        nl: '@@@session.user.name@@@ heeft de kantoorvloer gedweild: de stegosaurus glijdt, joehoe!'
      dt_d_bureau_04:
        fr: '@@@session.user.name@@@ a fait briller les vitres du bureau : le ptérodactyle salue !'
        en: '@@@session.user.name@@@ made the office windows sparkle: the pterodactyl waves hello!'
        es: '¡@@@session.user.name@@@ ha dejado brillantes los cristales del despacho: el pterodáctilo saluda!'
        de: '@@@session.user.name@@@ hat die Bürofenster blank geputzt: Der Flugsaurier winkt von draußen!'
        it: '@@@session.user.name@@@ ha fatto brillare i vetri dello studio: lo pterodattilo saluta!'
        pt: '@@@session.user.name@@@ pôs os vidros do escritório a brilhar: o pterodáctilo acena!'
        br: '@@@session.user.name@@@ deixou os vidros do escritório brilhando: o pterodáctilo dá tchauzinho!'
        nl: '@@@session.user.name@@@ heeft de kantoorramen laten blinken: de pterodactylus zwaait van buiten!'
      dt_d_bureau_05:
        fr: '@@@session.user.name@@@ a nettoyé le plan de travail du bureau : le bébé tricératops peut dessiner
          !'
        en: '@@@session.user.name@@@ cleaned the office desk: the baby triceratops can draw now!'
        es: '¡@@@session.user.name@@@ ha limpiado la mesa del despacho: el bebé triceratops ya puede dibujar!'
        de: '@@@session.user.name@@@ hat die Schreibtischplatte geputzt: Das Triceratops-Baby kann jetzt malen!'
        it: '@@@session.user.name@@@ ha pulito il piano della scrivania: il cucciolo di triceratopo ci può disegnare!'
        pt: '@@@session.user.name@@@ limpou a secretária: o bebé tricerátopo já pode desenhar!'
        br: '@@@session.user.name@@@ limpou a mesa do escritório: o bebê tricerátopo já pode desenhar!'
        nl: '@@@session.user.name@@@ heeft het bureaublad schoongemaakt: de babytriceratops kan nu tekenen!'
      dt_d_bureau_06:
        fr: '@@@session.user.name@@@ a tout rangé dans le bureau : l''iguanodon retrouve ses crayons !'
        en: '@@@session.user.name@@@ tidied the office: the iguanodon finds his pencils!'
        es: '¡@@@session.user.name@@@ ha ordenado el despacho: el iguanodonte encuentra sus lápices!'
        de: '@@@session.user.name@@@ hat das Büro aufgeräumt: Der Iguanodon findet seine Stifte!'
        it: '@@@session.user.name@@@ ha riordinato lo studio: l''iguanodonte ritrova le sue matite!'
        pt: '@@@session.user.name@@@ arrumou o escritório: o iguanodonte encontra os lápis!'
        br: '@@@session.user.name@@@ arrumou o escritório: o iguanodonte achou os lápis!'
        nl: '@@@session.user.name@@@ heeft het kantoor opgeruimd: de iguanodon vindt zijn potloden terug!'
      dt_d_chambre_enfant_01:
        fr: '@@@session.user.name@@@ a aspiré ou balayé la chambre-nid des enfants : le stégosaure fait des roulades
          !'
        en: '@@@session.user.name@@@ vacuumed or swept the kids'' nest room: the baby stegosaurus rolls about!'
        es: '¡@@@session.user.name@@@ ha aspirado o barrido el cuarto-nido de los peques: el bebé estegosaurio da
          volteretas!'
        de: '@@@session.user.name@@@ hat das Kinder-Nestzimmer gesaugt oder gefegt: Der Stegosaurus kugelt herum!'

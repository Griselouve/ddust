      dt_c_linge_01:
        fr: '@@@session.user.name@@@ a commencé à trier le gros tas de linge sale ! Le bébé tricératops boude un
          peu, il attendra la suite.'
        en: '@@@session.user.name@@@ started sorting the big pile of dirty laundry! The baby triceratops is sulking
          a little. He''ll wait for more.'
        es: '¡@@@session.user.name@@@ ha empezado a separar el montón de ropa sucia! El bebé triceratops se enfurruña

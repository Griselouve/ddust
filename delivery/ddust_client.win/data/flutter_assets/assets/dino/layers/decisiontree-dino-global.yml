      dt_c_linge_02_alt:
        fr: '@@@session.user.name@@@ a porté une partie du linge vers la laverie ! Le diplodocus attendra pour porter
          le reste sur son long dos.'
        en: '@@@session.user.name@@@ carried part of the laundry to the launderette! The diplodocus will wait to

        es: ¡@@@session.user.name@@@ ha llevado parte de la ropa a la lavandería! El diplodocus esperará para llevar
          el resto en su lomo.
        de: '@@@session.user.name@@@ hat einen Teil der Wäsche zum Waschsalon gebracht! Der Diplodocus wartet, um
          den Rest zu tragen.'
        it: '@@@session.user.name@@@ ha portato una parte del bucato in lavanderia! Il diplodoco aspetterà per portare
          il resto sulla schiena.'
        pt: '@@@session.user.name@@@ levou parte da roupa à lavandaria! O diplódoco espera para levar o resto no
          lombo comprido.'
        br: '@@@session.user.name@@@ levou parte da roupa para a lavanderia! O diplodoco vai esperar para levar
          o resto nas costas.'
        nl: '@@@session.user.name@@@ heeft een deel van de was naar de wasserette gebracht! De diplodocus wacht
          om de rest op zijn rug te dragen.'
      dt_c_linge_03:
        fr: '@@@session.user.name@@@ a étendu une partie du linge mouillé ! Le parasaurolophe tient le fil, il attendra
          la suite.'
        en: '@@@session.user.name@@@ hung up part of the wet laundry! The parasaurolophus is holding the other end

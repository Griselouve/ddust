        pt: '@@@session.user.name@@@ limpou o pó da entrada: o diplódoco entra sem espirrar!'
        br: '@@@session.user.name@@@ tirou o pó da entrada: o diplodoco entra sem espirrar!'
        nl: '@@@session.user.name@@@ heeft de ingang afgestoft: de diplodocus niest niet meer!'
      dt_d_entree_03:

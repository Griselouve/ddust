        pt: '@@@session.user.name@@@ abriu algumas janelas para arejar, mas não todas! O diplódoco ainda espera
          um bocadinho de ar fresco.'
        br: '@@@session.user.name@@@ abriu algumas janelas, mas não todas! O diplodoco ainda está esperando um ventinho

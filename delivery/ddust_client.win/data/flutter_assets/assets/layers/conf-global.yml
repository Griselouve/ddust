      clan_menu_welcome_guest_desc:
        br: 'Mostre este código ao pai ou à mãe da criança: ele autoriza seu clã e depois a criança pode entrar.'
        de: 'Zeig diesen Code einem Elternteil des Kindes: Es erlaubt deinen Clan, dann kann das Kind beitreten.'

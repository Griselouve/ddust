      guardian_cog_declare:
        br: Declaro que sou responsável legal por {name}. Posso decidir em quais clãs esta criança joga, retirar meu consentimento e declará-la maior de idade.
        de: Ich erkläre, gesetzlicher Vertreter von {name} zu sein. Ich kann entscheiden, in welchen Clans dieses Kind spielt, meine Einwilligung widerrufen und es für volljährig erklären.
        en: I declare that I am the legal guardian of {name}. I can decide which clans this child plays in, withdraw my consent and declare them an adult.
        es: Declaro que soy responsable legal de {name}. Puedo decidir en qué clanes juega este niño, retirar mi consentimiento y declararlo mayor de edad.
        fr: Je déclare être représentant légal de {name}. Je peux décider des clans où joue cet enfant, retirer mon consentement et le déclarer majeur.
        it: Dichiaro di essere rappresentante legale di {name}. Posso decidere in quali clan gioca questo bambino, ritirare il mio consenso e dichiararlo maggiorenne.
        nl: Ik verklaar dat ik de wettelijke vertegenwoordiger van {name} ben. Ik kan beslissen in welke clans dit kind speelt, mijn toestemming intrekken en het meerderjarig verklaren.
        pt: Declaro que sou representante legal de {name}. Posso decidir em que clãs esta criança joga, retirar o meu consentimento e declará-la maior de idade.

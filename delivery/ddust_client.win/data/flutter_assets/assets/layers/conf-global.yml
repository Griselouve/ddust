        de: 'Totenkopf: ruht'
        en: Skull, resting
        es: Calavera, en reposo
        fr: Crâne, au repos
        it: 'Teschio: a riposo'
        nl: 'Doodshoofd: rust'
        pt: 'Caveira: em repouso'
      tuto_badge_skull_desc:
        br: 'A tarefa acabou de ser feita: vai reaparecer daqui a algum tempo.'
        de: 'Die Aufgabe wurde gerade erledigt: Sie taucht nach einer Weile wieder auf.'
        en: 'The task was just done: it will come back after a while.'
        es: 'La tarea acaba de hacerse: reaparecerá tras un tiempo.'
        fr: 'La tâche vient d''être faite : elle réapparaîtra après un délai.'
        it: 'Il compito è appena stato fatto: ricomparirà dopo un po''.'
        nl: 'De taak is net gedaan: hij komt na een tijdje terug.'
        pt: 'A tarefa acabou de ser feita: vai reaparecer daqui a algum tempo.'
      tuto_badge_xp:
        br: 'XP: recomendada'
        de: 'XP: empfohlen'
        en: XP, recommended
        es: XP, recomendada
        fr: XP, recommandée
        it: 'XP: consigliato'
        nl: 'XP: aanbevolen'
        pt: 'XP: recomendada'
      tuto_badge_xp_desc:
        br: 'Um chefe de clã a destacou: ela dá um bônus de XP.'
        de: 'Ein Clanchef hebt sie hervor: Sie bringt einen XP-Bonus.'
        en: 'A clan chief is highlighting it: it grants bonus XP.'
        es: 'Un jefe de clan la destaca: otorga XP extra.'
        fr: 'Un chef de clan la met en avant : elle rapporte un bonus d''XP.'
        it: 'Un capo clan lo mette in evidenza: dà un bonus di XP.'
        nl: 'Een clanhoofd zet hem in de kijker: hij levert extra XP op.'
        pt: 'Um chefe de clã destaca-a: dá um bónus de XP.'
      tuto_clan_butin:
        br: 'O tesouro do clã no ciclo atual: esta barra enche à medida que o clã progride. Quando fica cheia, o baú é revelado e dividido entre os membros, e começa um novo ciclo.'
        de: 'Die Beute des Clans im laufenden Zyklus: Diese Leiste füllt sich, während der Clan vorankommt. Ist sie voll, wird der Schatz enthüllt und unter den Mitgliedern aufgeteilt, und ein neuer Zyklus beginnt.'
        en: 'The clan''s loot for the current cycle: this gauge fills as the clan progresses. Once full, the treasure is revealed, shared among the members, and a new cycle begins.'
        es: 'El botín del clan del ciclo actual: esta barra se llena a medida que el clan progresa. Cuando está llena, el tesoro se revela, se reparte entre los miembros y empieza un nuevo ciclo.'
        fr: 'Le butin du clan pour le cycle en cours : cette jauge se remplit à mesure que le clan progresse. Une fois pleine, le trésor est découvert, partagé entre les membres, et un nouveau cycle commence.'
        it: 'Il bottino del clan per il ciclo in corso: questa barra si riempie man mano che il clan progredisce. Una volta piena, il tesoro viene scoperto e diviso tra i membri, e inizia un nuovo ciclo.'
        nl: 'De buit van de clan voor de huidige cyclus: deze balk vult zich naarmate de clan vooruitgaat. Is hij vol, dan wordt de schat onthuld en onder de leden verdeeld, en begint een nieuwe cyclus.'
        pt: 'O espólio do clã no ciclo em curso: esta barra enche-se à medida que o clã progride. Quando está cheia, o tesouro é revelado e repartido entre os membros, e começa um novo ciclo.'
      tuto_clan_create_player:
        br: 'Se ele não tiver celular, ou for novo demais para ter conta, escolha "Adicionar meu filho" e depois "Meu filho não tem celular": você cria o personagem dele e joga no lugar dele.'
        de: 'Hat es kein Handy oder ist es zu jung für ein Konto, wähle „Mein Kind hinzufügen“ und dann „Mein Kind hat kein Handy“: Du erstellst seinen Charakter und spielst an seiner Stelle.'
        en: 'If they have no phone, or are too young to have an account, choose « Add my child » then « My child has no phone »: you create their character and play in their place.'
        es: 'Si no tiene teléfono, o es demasiado pequeño para tener una cuenta, elige « Añadir a mi hijo » y luego « Mi hijo no tiene teléfono »: creas su personaje y juegas en su lugar.'
        fr: 'S''il n''a pas de téléphone, ou s''il est trop jeune pour avoir un compte, choisis « Ajouter mon enfant » puis « Mon enfant n''a pas de téléphone » : tu crées son personnage et tu joues à sa place.'
        it: 'Se non ha un telefono, o è troppo piccolo per avere un account, scegli «Aggiungi mio figlio» e poi «Mio figlio non ha un telefono»: crei il suo personaggio e giochi al suo posto.'
        nl: 'Heeft het geen telefoon, of is het te jong voor een account, kies dan ‘Mijn kind toevoegen’ en daarna ‘Mijn kind heeft geen telefoon’: jij maakt zijn personage aan en speelt in zijn plaats.'
        pt: 'Se não tiver telemóvel, ou for demasiado novo para ter conta, escolhe «Adicionar o meu filho» e depois «O meu filho não tem telemóvel»: crias o personagem dele e jogas no lugar dele.'
      tuto_clan_edit:
        br: Toque no lápis para alterar o avatar e o nome do clã.
        de: Tippe auf den Stift, um Avatar und Namen des Clans zu ändern.
        en: Tap the pencil to change the clan's avatar and name.
        es: Toca el lápiz para cambiar el avatar y el nombre del clan.
        fr: Touche le crayon pour modifier l'avatar et le nom du clan.
        it: Tocca la matita per modificare l'avatar e il nome del clan.
        nl: Tik op het potlood om de avatar en de naam van de clan te wijzigen.
        pt: Toca no lápis para alterares o avatar e o nome do clã.
      tuto_clan_identity:
        br: 'Seu clã: o avatar, o nome e a posição dele.'
        de: 'Dein Clan: sein Avatar, sein Name und sein Rang.'
        en: 'Your clan: its avatar, name and rank.'
        es: 'Tu clan: su avatar, su nombre y su rango.'
        fr: 'Ton clan : son avatar, son nom et son rang.'
        it: 'Il tuo clan: il suo avatar, il suo nome e il suo rango.'
        nl: 'Je clan: zijn avatar, zijn naam en zijn rang.'
        pt: 'O teu clã: o seu avatar, o seu nome e o seu posto.'
      tuto_clan_level:
        br: 'O nível do clã: sobe quando seus membros cumprem tarefas.'
        de: 'Die Stufe des Clans: Sie steigt, wenn seine Mitglieder Aufgaben erledigen.'
        en: 'The clan level: it rises as its members complete tasks.'
        es: 'El nivel del clan: sube cuando sus miembros completan tareas.'
        fr: 'Le niveau du clan : il monte quand ses membres accomplissent des tâches.'
        it: 'Il livello del clan: sale quando i suoi membri completano i compiti.'
        nl: 'Het niveau van de clan: het stijgt wanneer de leden taken voltooien.'
        pt: 'O nível do clã: sobe quando os seus membros cumprem tarefas.'
      tuto_clan_menu:
        br: 'O menu Clã: várias opções para gerenciar o clã.'
        de: 'Das Clan-Menü: verschiedene Optionen, um den Clan zu verwalten.'
        en: 'The Clan menu: various options to manage the clan.'
        es: 'El menú del clan: varias opciones para gestionar el clan.'
        fr: 'Le menu Clan : diverses options pour gérer le clan.'
        it: 'Il menu Clan: diverse opzioni per gestire il clan.'
        nl: 'Het menu Clan: diverse opties om de clan te beheren.'
        pt: 'O menu Clã: várias opções para gerir o clã.'
      tuto_clan_menu_admin_title:
        br: Opções reservadas aos chefes de clã
        de: Optionen nur für Clanchefs
        en: Options for clan chiefs only
        es: Opciones reservadas a los jefes de clan
        fr: Les options réservées aux chefs de clan
        it: Opzioni riservate ai capi clan
        nl: Opties voor clanhoofden
        pt: Opções reservadas aos chefes de clã
      tuto_clan_menu_title:
        br: As opções do clã
        de: Clan-Optionen
        en: Clan options
        es: Opciones del clan
        fr: Les options du clan
        it: Le opzioni del clan
        nl: Clanopties
        pt: As opções do clã
      tuto_clan_options_intro:
        br: 'As ações oferecidas dependem do jogador em que você toca: vivo ou morto, presente ou ausente, criança ou adulto, outra pessoa ou você mesmo. Aqui estão todas as que existem.'
        de: 'Welche Aktionen angeboten werden, hängt vom angetippten Spieler ab: lebendig oder tot, anwesend oder abwesend, Kind oder Erwachsener, jemand anderes oder du selbst. Hier sind alle, die es gibt.'
        en: 'The actions offered depend on the player you tap: alive or dead, present or away, child or adult, someone else or yourself. Here are all the ones that exist.'
        es: 'Las acciones ofrecidas dependen del jugador que toques: vivo o muerto, presente o ausente, niño o adulto, otro o tú mismo. Estas son todas las que existen.'
        fr: 'Les actions proposées dépendent du joueur touché : vivant ou mort, présent ou absent, enfant ou adulte, un autre ou vous-même. Voici toutes celles qui existent.'
        it: 'Le azioni proposte dipendono dal giocatore toccato: vivo o morto, presente o assente, bambino o adulto, un altro o te stesso. Ecco tutte quelle che esistono.'
        nl: 'Welke acties je krijgt, hangt af van de speler waarop je tikt: levend of dood, aanwezig of afwezig, kind of volwassene, iemand anders of jijzelf. Hier zijn ze allemaal.'
        pt: 'As ações propostas dependem do jogador em que tocas: vivo ou morto, presente ou ausente, criança ou adulto, outra pessoa ou tu próprio. Eis todas as que existem.'
      tuto_clan_options_title:
        br: Ações sobre um membro
        de: Aktionen für ein Mitglied
        en: Actions on a member
        es: Acciones sobre un miembro
        fr: Les actions sur un membre
        it: Azioni su un membro
        nl: Acties voor een lid
        pt: Ações sobre um membro
      tuto_clan_qr:
        br: '"Convidar um adulto (QR Code)", por sua vez, faz entrar um adulto: o outro pai ou mãe, um irmão mais velho maior de idade. Ele instala o jogo, você mostra o QR Code, ele escaneia e já está no clã.'
        de: '„Einen Erwachsenen einladen (QR-Code)“ dagegen bringt einen Erwachsenen herein: den anderen Elternteil, ein volljähriges älteres Geschwister. Er installiert das Spiel, du zeigst ihm den QR-Code, er scannt ihn, und schon ist er im Clan.'
        en: '« Invite an adult (QR code) », for its part, brings in an adult: the other parent, a grown-up older brother or sister. They install the game, you show them the QR code, they scan it, and they are in the clan.'
        es: '« Invitar a un adulto (código QR) », en cambio, hace entrar a un adulto: el otro progenitor, un hermano mayor de edad. Instala el juego, le enseñas el código QR, lo escanea y ya está en el clan.'
        fr: '« Inviter un adulte (QR code) », lui, fait entrer un adulte : l''autre parent, un grand frère majeur. Il installe le jeu, tu lui montres le QR code, il le scanne, et il est dans le clan.'
        it: '«Invita un adulto (codice QR)», invece, fa entrare un adulto: l''altro genitore, un fratello maggiorenne. Installa il gioco, gli mostri il codice QR, lo scansiona ed è nel clan.'
        nl: '‘Een volwassene uitnodigen (QR-code)’ haalt daarentegen een volwassene binnen: de andere ouder, een meerderjarige oudere broer of zus. Die installeert het spel, jij laat de QR-code zien, hij scant hem en zit in de clan.'
        pt: '«Convidar um adulto (código QR)», por sua vez, faz entrar um adulto: o outro pai ou mãe, um irmão mais velho maior de idade. Instala o jogo, mostras-lhe o código QR, ele digitaliza-o e já está no clã.'
      tuto_clan_roster:
        br: Os membros do clã estão listados aqui.
        de: Hier sind die Mitglieder des Clans aufgelistet.
        en: The clan members are listed here.
        es: Los miembros del clan aparecen aquí.
        fr: Les membres du clan sont listés ici.
        it: Qui sono elencati i membri del clan.
        nl: Hier staan de leden van de clan.
        pt: Os membros do clã estão listados aqui.
      tuto_clan_roster_avatar:
        br: Para cada personagem, você vê o nível e os pontos de vida dele.
        de: Bei jedem Charakter siehst du seine Stufe und seine Lebenspunkte.
        en: For each character, you see their level and hit points.
        es: Para cada personaje, ves su nivel y sus puntos de vida.
        fr: Pour chaque personnage, tu vois son niveau et ses points de vie.
        it: Per ogni personaggio vedi il suo livello e i suoi punti vita.
        nl: Bij elk personage zie je zijn niveau en zijn levenspunten.
        pt: Para cada personagem, vês o seu nível e os seus pontos de vida.
      tuto_clan_roster_kebab:
        br: Toque no "..." de um membro para abrir as ações dele.
        de: Tippe auf das „...“ eines Mitglieds, um seine Aktionen zu öffnen.
        en: Tap a member's « ... » to open their actions.
        es: Toca el « ... » de un miembro para abrir sus acciones.
        fr: Touche le « ... » d'un membre pour ouvrir ses actions.
        it: Tocca il «...» di un membro per aprire le sue azioni.
        nl: Tik op de ‘...’ van een lid om zijn acties te openen.
        pt: Toca no «...» de um membro para abrires as suas ações.
      tuto_clan_roster_name:
        br: 'O nome dele (uma coroa indica os chefes de clã) e sua barra de contribuição: o que ele trouxe para o tesouro do ciclo atual e, portanto, a parte que caberá a ele na divisão.'
        de: 'Sein Name (eine Krone kennzeichnet die Clanchefs) und seine Beitragsleiste: was er zur Beute des laufenden Zyklus beigetragen hat, und damit der Anteil, der ihm bei der Aufteilung zusteht.'
        en: 'Their name (a crown marks the clan chiefs) and their contribution bar: what they have brought to the current cycle''s loot, and therefore the share they will get when it is split.'
        es: 'Su nombre (una corona indica a los jefes del clan) y su barra de contribución: lo que ha aportado al botín del ciclo actual y, por tanto, la parte que le tocará en el reparto.'
        fr: 'Son nom (une couronne désigne les chefs de clan) et sa barre de contribution : ce qu''il a apporté au butin du cycle en cours, et donc la part qui lui reviendra au partage.'
        it: 'Il suo nome (una corona indica i capi clan) e la sua barra di contributo: ciò che ha portato al bottino del ciclo in corso, e quindi la parte che gli spetterà nella spartizione.'
        nl: 'Zijn naam (een kroon duidt de clanhoofden aan) en zijn bijdragebalk: wat hij heeft bijgedragen aan de buit van de huidige cyclus, en dus het deel dat hij bij de verdeling krijgt.'
        pt: 'O seu nome (uma coroa assinala os chefes de clã) e a sua barra de contribuição: o que trouxe para o espólio do ciclo em curso e, portanto, a parte que lhe caberá na partilha.'
      tuto_clan_roster_purse:
        br: 'À direita de cada quadrado, a bolsa mostra o ouro ganho pelo jogador. Ao tocar nela, abre direto "Pagar seu tributo": você entrega esse ouro a ele na vida real e declara aqui o valor pago.'
        de: 'Rechts auf jeder Kachel zeigt der Geldbeutel das Gold, das der Spieler verdient hat. Tippst du darauf, öffnet sich direkt „Tribut zahlen“: Du gibst ihm dieses Gold im echten Leben und trägst hier den ausgezahlten Betrag ein.'
        en: 'On the right of each tile, the purse shows the gold the player has earned. Tapping it goes straight to « Pay their tribute »: you hand over that gold in real life, and declare here how much you paid.'
        es: 'A la derecha de cada casilla, la bolsa muestra el oro ganado por el jugador. Al tocarla se abre directamente « Pagar su tributo »: le entregas ese oro en la vida real y declaras aquí el importe pagado.'
        fr: 'À droite de chaque tuile, la bourse montre l''or gagné par le joueur. La toucher ouvre directement « Payer son tribut » : vous lui remettez cet or dans la vraie vie, et vous déclarez ici le montant versé.'
        it: 'A destra di ogni casella, il borsellino mostra l''oro guadagnato dal giocatore. Toccandolo si apre direttamente «Paga il suo tributo»: gli consegni quest''oro nella vita reale e dichiari qui l''importo versato.'
        nl: 'Rechts op elke tegel toont de buidel het goud dat de speler heeft verdiend. Tik erop en ‘Tribuut betalen’ gaat meteen open: je geeft hem dat goud in het echte leven en vult hier het betaalde bedrag in.'
        pt: 'À direita de cada quadrado, a bolsa mostra o ouro ganho pelo jogador. Ao tocares-lhe, abre-se diretamente «Pagar o seu tributo»: entregas-lhe esse ouro na vida real e declaras aqui o valor pago.'
      tuto_clan_title:
        br: Seu clã
        de: Dein Clan
        en: Your clan
        es: Tu clan
        fr: Ton clan
        it: Il tuo clan
        nl: Je clan
        pt: O teu clã
      tuto_clan_welcome_child:
        br: 'Para seu filho entrar, é ele quem começa: instala Donjons & Savons no celular, diz que está com vontade de jogar e a tela dele mostra um QR Code. Escolha "Adicionar meu filho", escaneie esse código, declare que você é responsável por ele e depois mostre a ele o convite que aparece: ele o escaneia em seguida. Se ele não estiver ao seu lado, pode enviar a resposta dele para você, e você o convida a distância.'
        de: 'Damit dein Kind beitritt, fängt es selbst an: Es installiert Donjons & Savons auf seinem Handy, sagt, dass es spielen möchte, und sein Bildschirm zeigt einen QR-Code. Wähle „Mein Kind hinzufügen“, scanne diesen Code, erkläre, dass du für es verantwortlich bist, und zeig ihm dann die Einladung, die erscheint: Es scannt sie seinerseits. Ist es nicht bei dir, kann es dir seine Antwort schicken, und du lädst es aus der Ferne ein.'
        en: 'To bring your child in, they go first: they install Donjons & Savons on their phone, say they want to play, and their screen shows a QR code. Choose « Add my child », scan that code, declare that you are responsible for them, then show them the invitation that appears: they scan it in turn. If they are not next to you, they can send you their answer, and you invite them remotely.'
        es: 'Para que entre tu hijo, empieza él: instala Donjons & Savons en su teléfono, dice que tiene ganas de jugar y su pantalla muestra un código QR. Elige « Añadir a mi hijo », escanea ese código, declara que eres su responsable y luego enséñale la invitación que aparece: él la escanea a su vez. Si no está a tu lado, puede enviarte su respuesta y tú lo invitas a distancia.'
        fr: 'Pour faire entrer ton enfant, c''est lui qui commence : il installe Donjons & Savons sur son téléphone, dit qu''il a envie de jouer, et son écran affiche un QR code. Choisis « Ajouter mon enfant », scanne ce code, déclare que tu en es responsable, puis montre-lui l''invitation qui s''affiche : il la scanne à son tour. S''il n''est pas à côté de toi, il peut t''envoyer sa réponse, et tu l''invites à distance.'
        it: 'Per far entrare tuo figlio, comincia lui: installa Donjons & Savons sul suo telefono, dice che ha voglia di giocare e il suo schermo mostra un codice QR. Scegli «Aggiungi mio figlio», scansiona quel codice, dichiara di esserne responsabile, poi mostragli l''invito che compare: lui lo scansiona a sua volta. Se non è accanto a te, può inviarti la sua risposta e tu lo inviti a distanza.'
        nl: 'Om je kind erbij te halen, begint het zelf: het installeert Donjons & Savons op zijn telefoon, zegt dat het zin heeft om te spelen, en zijn scherm toont een QR-code. Kies ‘Mijn kind toevoegen’, scan die code, verklaar dat je verantwoordelijk bent voor het kind en laat het daarna de uitnodiging zien die verschijnt: het scant die op zijn beurt. Is het niet bij je, dan kan het je zijn antwoord sturen en nodig jij het op afstand uit.'
        pt: 'Para o teu filho entrar, é ele que começa: instala Donjons & Savons no telemóvel, diz que tem vontade de jogar e o ecrã dele mostra um código QR. Escolhe «Adicionar o meu filho», digitaliza esse código, declara que és responsável por ele e depois mostra-lhe o convite que aparece: ele digitaliza-o por sua vez. Se ele não estiver ao teu lado, pode enviar-te a resposta dele e tu convida-lo à distância.'
      tuto_combat_active_criteria:
        br: Estes são os critérios a cumprir para vencer o monstro.
        de: Das sind die Bedingungen, um das Monster zu besiegen.
        en: These are the criteria to meet to defeat the monster.
        es: Estos son los criterios que debes cumplir para vencer al monstruo.
        fr: Voici les critères à remplir pour vaincre le monstre.
        it: Ecco i criteri da soddisfare per sconfiggere il mostro.
        nl: Dit zijn de voorwaarden om het monster te verslaan.
        pt: Estes são os critérios a cumprir para vencer o monstro.
      tuto_combat_active_demo:
        br: 'Escolhi uma tarefa para você, só para mostrar como funciona. Aqui está: é o seu combate do momento.'
        de: 'Ich habe eine Aufgabe für dich ausgesucht, nur um es dir zu zeigen. Hier ist sie: Das ist dein aktueller Kampf.'
        en: 'I picked a task for you, just to show you how it works. Here it is: your current fight.'
        es: 'He elegido una tarea por ti, solo para enseñarte cómo funciona. Aquí la tienes: tu combate del momento.'
        fr: 'J''ai choisi une tâche pour toi, histoire de te montrer. La voici : c''est ton combat du moment.'
        it: 'Ho scelto un compito per te, giusto per mostrarti come funziona. Eccolo: è il tuo combattimento del momento.'
        nl: 'Ik heb een taak voor je gekozen, gewoon om het je te laten zien. Hier is hij: dat is je gevecht van dit moment.'
        pt: 'Escolhi uma tarefa por ti, só para te mostrar como funciona. Aqui está: é o teu combate do momento.'
      tuto_combat_active_difficulty:
        br: Este selo indica a dificuldade da tarefa e o XP que ela vai dar a você.
        de: Diese Plakette zeigt die Schwierigkeit der Aufgabe und die XP, die sie dir bringt.
        en: This badge shows the task's difficulty and the XP it will earn you.
        es: Esta insignia indica la dificultad de la tarea y la XP que te dará.
        fr: Cette pastille indique la difficulté de la tâche et l'XP qu'elle te rapportera.
        it: Questo bollino indica la difficoltà del compito e gli XP che ti farà guadagnare.
        nl: Deze badge toont de moeilijkheid van de taak en de XP die hij je oplevert.
        pt: Este distintivo indica a dificuldade da tarefa e o XP que te vai dar.
      tuto_combat_active_done:
        br: Depois de cumprir a tarefa de verdade, toque em "Derrotei o monstro!". Você vai tirar uma foto, ou gravar um vídeo curto sem som, como prova.
        de: Sobald die Aufgabe wirklich erledigt ist, tippe auf „Ich habe das Monster besiegt!“. Als Beweis machst du ein Foto oder ein kurzes Video ohne Ton.
        en: Once you've truly completed the task, tap “I defeated the monster!”. You'll take a photo, or a short silent video, as proof.
        es: Una vez completada la tarea de verdad, toca «¡He vencido al monstruo!». Harás una foto, o un vídeo corto sin sonido, como prueba.
        fr: Une fois la tâche accomplie pour de vrai, touche « J'ai vaincu le monstre ! ». Tu prendras une photo, ou une courte vidéo sans son, comme preuve.
        it: Una volta portato a termine il compito per davvero, tocca «Ho sconfitto il mostro!». Come prova scatterai una foto, o girerai un breve video senza audio.
        nl: Heb je de taak echt voltooid, tik dan op ‘Ik heb het monster verslagen!’. Je maakt een foto, of een korte video zonder geluid, als bewijs.
        pt: Depois de cumprires a tarefa a sério, toca em «Derrotei o monstro!». Vais tirar uma fotografia, ou gravar um vídeo curto sem som, como prova.
      tuto_combat_active_given_back:
        br: 'Esta eu devolvo: ela volta a ficar livre para o seu clã. Agora escolha a sua!'
        de: 'Diese hier gebe ich dir zurück: Sie ist wieder frei für deinen Clan. Jetzt wähl deine eigene!'
        en: 'This one, I''m giving back: it''s free for your clan again. Now pick your own!'
        es: 'Esta te la devuelvo: vuelve a estar libre para tu clan. ¡Ahora elige la tuya!'
        fr: 'Celle-ci, je te la rends : elle redevient libre pour ton clan. À toi de choisir la tienne !'
        it: 'Questo te lo restituisco: torna libero per il tuo clan. Ora scegli il tuo!'
        nl: 'Deze geef ik je terug: hij is weer vrij voor je clan. Kies nu je eigen taak!'
        pt: 'Esta, devolvo-ta: volta a estar livre para o teu clã. Agora escolhe a tua!'
      tuto_combat_active_intro:
        br: 'Você pegou uma tarefa: aqui está, é o seu combate do momento.'
        de: 'Du hast eine Aufgabe übernommen: Hier ist sie, das ist dein aktueller Kampf.'
        en: 'You''ve taken on a task: here it is, your current fight.'
        es: 'Has asumido una tarea: aquí está, tu combate del momento.'
        fr: 'Tu as pris une tâche : la voici, c''est ton combat du moment.'
        it: 'Hai preso un compito: eccolo, è il tuo combattimento del momento.'
        nl: 'Je hebt een taak aangenomen: hier is hij, dat is je gevecht van dit moment.'
        pt: 'Pegaste numa tarefa: aqui está, é o teu combate do momento.'
      tuto_combat_active_none:
        br: 'Todas as tarefas do clã já estão ocupadas! Volte a este guia quando tiver começado uma: ele vai mostrar os botões conforme você avança.'
        de: 'Alle Aufgaben des Clans sind schon vergeben! Lies diese Anleitung noch einmal, wenn du eine begonnen hast: Sie zeigt dir die Knöpfe nach und nach.'
        en: 'Every task in the clan is already taken! Come back to this guide once you''ve started one: it will point out the buttons as you go.'
        es: '¡Todas las tareas del clan ya están cogidas! Vuelve a esta guía cuando hayas empezado una: te mostrará los botones sobre la marcha.'
        fr: 'Toutes les tâches du clan sont déjà prises ! Reviens lire ce guide quand tu en auras commencé une : il te montrera les boutons au fur et à mesure.'
        it: 'Tutti i compiti del clan sono già presi! Torna a leggere questa guida quando ne avrai iniziato uno: ti mostrerà i pulsanti man mano.'
        nl: 'Alle taken van de clan zijn al bezet! Lees deze gids opnieuw als je er een bent begonnen: hij wijst je de knoppen gaandeweg aan.'
        pt: 'Todas as tarefas do clã já estão ocupadas! Volta a este guia quando tiveres começado uma: vai mostrar-te os botões à medida que avanças.'
      tuto_combat_active_retreat:
        br: 'Se não conseguir terminá-la, bata em retirada: a tarefa volta a ficar livre para o clã.'
        de: 'Wenn du sie nicht beenden kannst, tritt den Rückzug an: Die Aufgabe ist dann wieder frei für den Clan.'
        en: 'If you can''t finish it, retreat: the task becomes free for the clan again.'
        es: 'Si no puedes terminarla, retírate: la tarea vuelve a quedar libre para el clan.'
        fr: 'Si tu ne peux pas la terminer, bats en retraite : la tâche redevient libre pour le clan.'
        it: 'Se non riesci a finirlo, batti in ritirata: il compito torna libero per il clan.'
        nl: 'Kun je hem niet afmaken, trek je dan terug: de taak is weer vrij voor de clan.'
        pt: 'Se não conseguires terminá-la, bate em retirada: a tarefa volta a ficar livre para o clã.'
      tuto_combat_active_title:
        br: A tarefa em andamento
        de: Die laufende Aufgabe
        en: The active task
        es: La tarea en curso
        fr: La tâche en cours
        it: Il compito in corso
        nl: De huidige taak
        pt: A tarefa em curso
      tuto_combat_active_validate:
        br: Depois, vá até o chefe do clã para ele validar sua tarefa. Você pode mostrar sua prova a ele. (Se você for o único chefe do clã, suas tarefas se validam sozinhas.)
        de: Geh dann zum Clanchef, damit er deine Aufgabe bestätigt. Du kannst ihm deinen Beweis zeigen. (Wenn du der einzige Clanchef bist, werden deine Aufgaben automatisch bestätigt.)
        en: Then go to the clan chief so they validate your task. You can show them your proof. (If you're the clan's only chief, your tasks validate themselves.)
        es: Luego ve al jefe del clan para que valide tu tarea. Puedes mostrarle tu prueba. (Si eres el único jefe del clan, tus tareas se validan solas.)
        fr: Ensuite, va voir le chef de clan pour qu'il valide ta tâche. Tu peux lui montrer ta preuve. (Si tu es le seul chef de clan, tes tâches se valident toutes seules.)
        it: Poi vai dal capo clan perché convalidi il tuo compito. Puoi mostrargli la tua prova. (Se sei l'unico capo clan, i tuoi compiti si convalidano da soli.)
        nl: Ga daarna naar het clanhoofd zodat die je taak valideert. Je kunt je bewijs laten zien. (Ben je het enige clanhoofd, dan worden je taken vanzelf gevalideerd.)
        pt: Depois, vai ter com o chefe de clã para ele validar a tua tarefa. Podes mostrar-lhe a tua prova. (Se fores o único chefe de clã, as tuas tarefas validam-se sozinhas.)
      tuto_combat_active_wait:
        br: Enquanto sua tarefa não for validada, você não pode combater outra. Depois de validada, você ganha seu XP e volta ao combate!
        de: Solange deine Aufgabe nicht bestätigt ist, kannst du keine andere bekämpfen. Sobald sie bestätigt ist, bekommst du deine XP und ziehst wieder in den Kampf!
        en: Until your task is validated, you can't fight another one. Once validated, you earn your XP and head back to battle!
        es: Mientras tu tarea no esté validada, no puedes combatir otra. Una vez validada, ganas tu XP y ¡vuelves al combate!
        fr: Tant que ta tâche n'est pas validée, tu ne peux pas en combattre une autre. Une fois validée, tu gagnes ton XP et tu repars au combat !
        it: Finché il tuo compito non è convalidato, non puoi combatterne un altro. Una volta convalidato, guadagni i tuoi XP e torni a combattere!
        nl: Zolang je taak niet gevalideerd is, kun je geen andere bevechten. Zodra hij gevalideerd is, krijg je je XP en trek je weer ten strijde!
        pt: Enquanto a tua tarefa não for validada, não podes combater outra. Depois de validada, ganhas o teu XP e voltas ao combate!
      tuto_combat_admin_title:
        br: Gerenciar uma área / uma tarefa
        de: Bereich / Aufgabe verwalten
        en: Manage a domain / task
        es: Gestionar un ámbito / una tarea
        fr: Administrer un domaine / une tâche
        it: Gestire un ambito / un compito
        nl: Domein / taak beheren
        pt: Gerir uma área / uma tarefa
      tuto_combat_badges_title:
        br: As marcas
        de: Die Markierungen
        en: Markers
        es: Las marcas
        fr: Les repères
        it: I segnali
        nl: De markeringen
        pt: As marcas
      tuto_combat_domains_admin_intro:
        br: 'No modo admin, escolha um grupo de tarefas para gerenciá-lo: aparece um conjunto de opções.'
        de: 'Wähle im Admin-Modus eine Aufgabengruppe, um sie zu verwalten: Es erscheint eine Reihe von Optionen.'
        en: 'In admin mode, choose a group of tasks to manage it: a set of options appears.'
        es: 'En modo admin, elige un grupo de tareas para gestionarlo: aparece un conjunto de opciones.'
        fr: 'En mode admin, choisis un groupe de tâches pour l''administrer : un ensemble d''options apparaît.'
        it: 'In modalità admin, scegli un gruppo di compiti per gestirlo: compare una serie di opzioni.'
        nl: 'Kies in adminmodus een groep taken om hem te beheren: er verschijnt een reeks opties.'
        pt: 'No modo admin, escolhe um grupo de tarefas para o gerires: aparece um conjunto de opções.'
      tuto_combat_domains_grey:
        br: Uma área em cinza não tem nenhuma tarefa para combater no momento.
        de: Ein ausgegrauter Bereich hat im Moment keine Aufgabe zum Bekämpfen.
        en: A greyed-out domain has no task to fight right now.
        es: Un ámbito en gris no tiene ninguna tarea que combatir por ahora.
        fr: Un domaine grisé n'a aucune tâche à combattre pour le moment.
        it: Un ambito in grigio non ha nessun compito da combattere per il momento.
        nl: Een grijs domein heeft op dit moment geen taak om te bevechten.
        pt: Uma área a cinzento não tem nenhuma tarefa para combater de momento.
      tuto_combat_domains_intro:
        br: Nesta tela você encontra todas as tarefas para combater, agrupadas por área.
        de: Auf diesem Bildschirm findest du alle Aufgaben zum Bekämpfen, nach Bereichen gruppiert.
        en: On this screen you'll find every task to fight, grouped by domain.
        es: En esta pantalla encontrarás todas las tareas por combatir, agrupadas por ámbito.
        fr: Dans cet écran, tu trouveras toutes les tâches à combattre, regroupées par domaine.
        it: In questa schermata troverai tutti i compiti da combattere, raggruppati per ambito.
        nl: Op dit scherm vind je alle taken om te bevechten, gegroepeerd per domein.
        pt: Neste ecrã encontras todas as tarefas para combater, agrupadas por área.
      tuto_combat_domains_play:
        br: Escolha um grupo de tarefas para encontrar nele uma tarefa para combater e ganhar XP.
        de: Wähle eine Aufgabengruppe, um darin eine Aufgabe zum Bekämpfen zu finden und XP zu verdienen.
        en: Choose a group of tasks to find a task to fight and earn XP.
        es: Elige un grupo de tareas para encontrar una tarea que combatir y ganar XP.
        fr: Choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP.
        it: Scegli un gruppo di compiti per trovarci un compito da combattere e guadagnare XP.
        nl: Kies een groep taken om er een taak te vinden om te bevechten en XP te verdienen.
        pt: Escolhe um grupo de tarefas para lá encontrares uma tarefa para combater e ganhar XP.
      tuto_combat_domains_play_admin:
        br: No modo jogo, escolha um grupo de tarefas para encontrar nele uma tarefa para combater e ganhar XP.
        de: Wähle im Spielmodus eine Aufgabengruppe, um darin eine Aufgabe zum Bekämpfen zu finden und XP zu verdienen.
        en: In play mode, choose a group of tasks to find a task to fight and earn XP.
        es: En modo juego, elige un grupo de tareas para encontrar una tarea que combatir y ganar XP.
        fr: En mode jeu, choisis un groupe de tâches pour y trouver une tâche à combattre et gagner de l'XP.
        it: In modalità gioco, scegli un gruppo di compiti per trovarci un compito da combattere e guadagnare XP.
        nl: Kies in speelmodus een groep taken om er een taak te vinden om te bevechten en XP te verdienen.
        pt: No modo jogo, escolhe um grupo de tarefas para lá encontrares uma tarefa para combater e ganhar XP.
      tuto_combat_domains_reperes_intro:
        br: As áreas podem ter pequenas marcas que dão informações adicionais.
        de: Bereiche können kleine Markierungen tragen, die zusätzliche Informationen geben.
        en: Domains can carry small markers that give extra information.
        es: Los ámbitos pueden llevar pequeñas marcas que dan información adicional.
        fr: Les domaines peuvent porter de petits repères qui donnent des informations supplémentaires.
        it: Gli ambiti possono avere piccoli segnali che danno informazioni in più.
        nl: Domeinen kunnen kleine markeringen hebben die extra informatie geven.
        pt: As áreas podem ter pequenas marcas que dão informações adicionais.
      tuto_combat_domains_title:
        br: O combate
        de: Der Kampf
        en: Combat
        es: El combate
        fr: Le combat
        it: Il combattimento
        nl: Het gevecht
        pt: O combate
      tuto_combat_switch:
        br: 'Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar em um quadrado não inicia mais o combate, abre as configurações dele: ativar, desativar, esconder dos jogadores.'
        de: 'Nur für Clanchefs: wechselt zwischen Spiel und Admin. Im Admin-Modus startet ein Tippen auf eine Kachel keinen Kampf mehr, sondern öffnet ihre Einstellungen: aktivieren, deaktivieren, vor den Spielern verbergen.'
        en: 'Clan chiefs only: switches between Play and Admin. In Admin mode, tapping a tile no longer starts the fight but opens its settings: make it active, disable it, hide it from players.'
        es: 'Solo para jefes de clan: alterna entre Juego y Admin. En modo Admin, tocar una casilla ya no inicia el combate, sino que abre sus ajustes: activarla, desactivarla, ocultarla a los jugadores.'
        fr: 'Réservé aux chefs de clan : bascule entre Jeu et Admin. En mode Admin, toucher une tuile n''engage plus le combat, mais ouvre ses réglages : la rendre active, la désactiver, la cacher aux joueurs.'
        it: 'Riservato ai capi clan: alterna tra Gioco e Admin. In modalità Admin, toccare una casella non avvia più il combattimento, ma apre le sue impostazioni: renderla attiva, disattivarla, nasconderla ai giocatori.'
        nl: 'Alleen voor clanhoofden: schakelt tussen Spel en Admin. In Admin-modus start een tik op een tegel geen gevecht meer, maar opent die de instellingen: activeren, uitschakelen, verbergen voor spelers.'
        pt: 'Reservado aos chefes de clã: alterna entre Jogo e Admin. No modo Admin, tocar num quadrado já não inicia o combate, abre as suas definições: ativá-lo, desativá-lo, escondê-lo dos jogadores.'
      tuto_combat_tasks_admin_add:
        br: 'No modo Admin, aparece um quadrado "+" no fim da lista: ele cria uma nova tarefa neste grupo. Ele não existe na tela das áreas: ali nunca se criam grupos.'
        de: 'Im Admin-Modus erscheint am Ende der Liste eine „+“-Kachel: Sie erstellt eine neue Aufgabe in dieser Gruppe. Auf dem Bildschirm der Bereiche gibt es sie nicht, denn dort werden nie Gruppen erstellt.'
        en: 'In Admin mode, a « + » tile is added at the end of the list: it creates a new task in this group. It does not exist on the domains screen, groups are never created there.'
        es: 'En modo Admin, una casilla « + » se añade al final de la lista: crea una nueva tarea en este grupo. No existe en la pantalla de ámbitos, allí nunca se crean grupos.'
        fr: 'En mode Admin, une tuile « + » s''ajoute à la fin de la liste : elle crée une nouvelle tâche dans ce groupe. Elle n''existe pas sur l''écran des domaines, on n''y crée jamais de groupe.'
        it: 'In modalità Admin, alla fine dell''elenco si aggiunge una casella «+»: crea un nuovo compito in questo gruppo. Non esiste nella schermata degli ambiti: lì non si creano mai gruppi.'
        nl: 'In Admin-modus komt er een ‘+’-tegel aan het eind van de lijst: die maakt een nieuwe taak in deze groep. Op het domeinenscherm bestaat hij niet: daar worden nooit groepen gemaakt.'
        pt: 'No modo Admin, surge um quadrado «+» no fim da lista: cria uma nova tarefa neste grupo. Não existe no ecrã das áreas: aí nunca se criam grupos.'
      tuto_combat_tasks_admin_intro:
        br: 'No modo admin, escolha uma tarefa para gerenciá-la: aparece um conjunto de opções.'
        de: 'Wähle im Admin-Modus eine Aufgabe, um sie zu verwalten: Es erscheint eine Reihe von Optionen.'
        en: 'In admin mode, choose a task to manage it: a set of options appears.'
        es: 'En modo admin, elige una tarea para gestionarla: aparece un conjunto de opciones.'
        fr: 'En mode admin, choisis une tâche pour l''administrer : un ensemble d''options apparaît.'
        it: 'In modalità admin, scegli un compito per gestirlo: compare una serie di opzioni.'
        nl: 'Kies in adminmodus een taak om hem te beheren: er verschijnt een reeks opties.'
        pt: 'No modo admin, escolhe uma tarefa para a gerires: aparece um conjunto de opções.'
      tuto_combat_tasks_grey:
        br: 'Uma tarefa em cinza não está disponível no momento: já está ocupada, em repouso ou reservada aos chefes de clã.'
        de: 'Eine ausgegraute Aufgabe ist gerade nicht verfügbar: Sie ist schon vergeben, ruht oder ist den Clanchefs vorbehalten.'
        en: 'A greyed-out task isn''t available right now: it''s already taken, resting, or reserved for clan chiefs.'
        es: 'Una tarea en gris no está disponible por ahora: ya está tomada, en reposo, o reservada a los jefes de clan.'
        fr: 'Une tâche grisée n''est pas disponible pour l''instant : elle est déjà prise, en repos, ou réservée aux chefs de clan.'
        it: 'Un compito in grigio non è disponibile per ora: è già preso, a riposo, o riservato ai capi clan.'
        nl: 'Een grijze taak is nu niet beschikbaar: hij is al bezet, rust uit of is voorbehouden aan clanhoofden.'
        pt: 'Uma tarefa a cinzento não está disponível de momento: já está ocupada, em repouso ou reservada aos chefes de clã.'
      tuto_combat_tasks_intro:
        br: Nesta tela você encontra todas as tarefas para combater de um mesmo grupo.
        de: Auf diesem Bildschirm findest du alle Aufgaben zum Bekämpfen aus derselben Gruppe.
        en: On this screen you'll find every task to fight within one group.
        es: En esta pantalla encontrarás todas las tareas por combatir de un mismo grupo.
        fr: Dans cet écran, tu trouveras toutes les tâches à combattre d'un même groupe.
        it: In questa schermata troverai tutti i compiti da combattere di uno stesso gruppo.
        nl: Op dit scherm vind je alle taken om te bevechten uit één groep.
        pt: Neste ecrã encontras todas as tarefas para combater de um mesmo grupo.
      tuto_combat_tasks_play:
        br: Escolha uma tarefa para combatê-la e ganhar XP.
        de: Wähle eine Aufgabe, um sie zu bekämpfen und XP zu verdienen.
        en: Choose a task to fight it and earn XP.
        es: Elige una tarea para combatirla y ganar XP.
        fr: Choisis une tâche pour la combattre et gagner de l'XP.
        it: Scegli un compito per combatterlo e guadagnare XP.
        nl: Kies een taak om ertegen te vechten en XP te verdienen.
        pt: Escolhe uma tarefa para a combateres e ganhares XP.
      tuto_combat_tasks_play_admin:
        br: No modo jogo, escolha uma tarefa para combatê-la e ganhar XP.
        de: Wähle im Spielmodus eine Aufgabe, um sie zu bekämpfen und XP zu verdienen.
        en: In play mode, choose a task to fight it and earn XP.
        es: En modo juego, elige una tarea para combatirla y ganar XP.
        fr: En mode jeu, choisis une tâche pour la combattre et gagner de l'XP.
        it: In modalità gioco, scegli un compito per combatterlo e guadagnare XP.
        nl: Kies in speelmodus een taak om ertegen te vechten en XP te verdienen.
        pt: No modo jogo, escolhe uma tarefa para a combateres e ganhares XP.
      tuto_combat_tasks_reperes_intro:
        br: As tarefas podem ter pequenas marcas que dão informações adicionais.
        de: Aufgaben können kleine Markierungen tragen, die zusätzliche Informationen geben.
        en: Tasks can carry small markers that give extra information.
        es: Las tareas pueden llevar pequeñas marcas que dan información adicional.
        fr: Les tâches peuvent porter de petits repères qui donnent des informations supplémentaires.
        it: I compiti possono avere piccoli segnali che danno informazioni in più.
        nl: Taken kunnen kleine markeringen hebben die extra informatie geven.
        pt: As tarefas podem ter pequenas marcas que dão informações adicionais.

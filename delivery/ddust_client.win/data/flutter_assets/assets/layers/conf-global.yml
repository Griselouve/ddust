      tuto_create_player_row_create:
        br: Criar um jogador
        de: Spieler erstellen
        en: Create a player
        es: Crear un jugador
        fr: Créer un joueur
        it: Crea un giocatore
        nl: Speler aanmaken
        pt: Criar um jogador
      tuto_create_player_row_create_desc:
        br: 'No menu do clã: crie o personagem da criança (você escolhe o nome).'
        de: 'Im Clan-Menü: erstellt den Charakter des Kindes (du wählst seinen Namen).'
        en: 'In the clan menu: creates the child''s character (you choose their name).'
        es: 'En el menú del clan: crea el personaje del niño (tú eliges su nombre).'
        fr: 'Dans le menu du clan : crée le personnage de l''enfant (tu choisis son nom).'
        it: 'Nel menu del clan: crea il personaggio del bambino (scegli tu il nome).'
        nl: 'In het clanmenu: maakt het personage van het kind aan (jij kiest de naam).'
        pt: 'No menu do clã: cria o personagem da criança (tu escolhes o nome).'
      tuto_create_player_row_switch:
        br: Jogar no seu lugar
        de: An seiner Stelle spielen
        en: Play in their place
        es: Jugar en su lugar
        fr: Jouer à sa place
        it: Gioca al suo posto
        nl: In zijn plaats spelen
        pt: Jogar no seu lugar
      tuto_create_player_row_switch_desc:
        br: 'No menu de um membro: você encarna o personagem dele no seu celular.'
        de: 'Im Menü eines Mitglieds: Du spielst seinen Charakter auf deinem Handy.'
        en: 'In a member''s menu: you take on their character on your phone.'
        es: 'En el menú de un miembro: encarnas su personaje en tu teléfono.'
        fr: 'Dans le menu d''un membre : tu incarnes son personnage sur ton téléphone.'
        it: 'Nel menu di un membro: interpreti il suo personaggio sul tuo telefono.'
        nl: 'In het menu van een lid: je speelt zijn personage op je telefoon.'
        pt: 'No menu de um membro: encarnas o personagem dele no teu telemóvel.'
      tuto_create_player_switch:
        br: 'Para colocá-la para jogar, use "Jogar no seu lugar" na lista de membros: seu celular passa a ser o dela. A criança joga nele, ou você joga por ela. Uma faixa lembra quem você está encarnando, e você volta à sua conta quando quiser.'
        de: 'Damit es spielen kann, nutzt du „An seiner Stelle spielen“ in der Mitgliederliste: Dein Handy wird zu seinem. Das Kind spielt darauf, oder du spielst für es. Ein Banner erinnert dich daran, wen du spielst, und du kehrst zu deinem Konto zurück, wann du willst.'
        en: 'To let them play, use « Play in their place » from the member list: your phone becomes theirs. The child plays on it, or you play for them. A banner reminds you who you are playing as, and you return to your account whenever you want.'
        es: 'Para que juegue, usa « Jugar en su lugar » desde la lista de miembros: tu teléfono pasa a ser el suyo. El niño juega en él, o tú juegas por él. Un letrero recuerda a quién encarnas, y vuelves a tu cuenta cuando quieras.'
        fr: 'Pour le faire jouer, tu utilises « Jouer à sa place » depuis la liste des membres : ton téléphone devient le sien. L''enfant joue dessus, ou tu joues pour lui. Un bandeau rappelle qui tu incarnes, et tu reviens à ton compte quand tu veux.'
        it: 'Per farlo giocare, usa «Gioca al suo posto» dall''elenco dei membri: il tuo telefono diventa il suo. Il bambino ci gioca, oppure giochi tu per lui. Un banner ti ricorda chi stai interpretando, e torni al tuo account quando vuoi.'
        nl: 'Om het te laten spelen, gebruik je ‘In zijn plaats spelen’ in de ledenlijst: je telefoon wordt de zijne. Het kind speelt erop, of jij speelt voor hem. Een banner herinnert je eraan wie je speelt, en je gaat terug naar je account wanneer je wilt.'
        pt: 'Para a pores a jogar, usa «Jogar no seu lugar» na lista de membros: o teu telemóvel passa a ser o dela. A criança joga nele, ou jogas tu por ela. Uma faixa lembra-te quem estás a encarnar, e voltas à tua conta quando quiseres.'
      tuto_create_player_title:
        br: Criar um jogador
        de: Spieler erstellen
        en: Create a player
        es: Crear un jugador
        fr: Créer un joueur
        it: Crea un giocatore
        nl: Speler aanmaken
        pt: Criar um jogador
      tuto_create_player_what:
        br: '"Criar um jogador" adiciona ao clã um personagem fictício: o de uma criança nova demais para ter conta, ou que não tem celular. Ele não tem conta nem dispositivo próprio: só existe no seu clã.'
        de: '„Spieler erstellen“ fügt dem Clan einen ausgedachten Charakter hinzu: den eines Kindes, das zu jung für ein Konto ist oder kein Handy hat. Er hat weder ein eigenes Konto noch ein eigenes Gerät: Er existiert nur in deinem Clan.'
        en: '« Create a player » adds a make-believe character to the clan: that of a child too young to have an account, or without a phone. They have no account and no device of their own: they only exist inside your clan.'
        es: '« Crear un jugador » añade al clan un personaje ficticio: el de un niño demasiado pequeño para tener una cuenta, o que no tiene teléfono. No tiene cuenta ni dispositivo propio: solo existe dentro de tu clan.'
        fr: '« Créer un joueur » ajoute au clan un personnage fictif : celui d''un enfant trop jeune pour avoir un compte, ou qui n''a pas de téléphone. Il n''a ni compte ni appareil à lui : il n''existe que dans ton clan.'
        it: '«Crea un giocatore» aggiunge al clan un personaggio fittizio: quello di un bambino troppo piccolo per avere un account, o che non ha un telefono. Non ha né un account né un dispositivo suo: esiste solo nel tuo clan.'
        nl: '‘Speler aanmaken’ voegt een verzonnen personage aan de clan toe: dat van een kind dat te jong is voor een account, of geen telefoon heeft. Het heeft geen eigen account of apparaat: het bestaat alleen in je clan.'
        pt: '«Criar um jogador» acrescenta ao clã um personagem fictício: o de uma criança demasiado nova para ter conta, ou que não tem telemóvel. Não tem conta nem dispositivo próprio: só existe no teu clã.'
      tuto_dash_clan:
        br: 'Seu Clã: reencontre seus companheiros e o diário do clã.'
        de: 'Dein Clan: Hier findest du deine Gefährten und das Tagebuch des Clans.'
        en: 'Your Clan: find your companions and the clan log.'
        es: 'Tu Clan: reúnete con tus compañeros y consulta el registro del clan.'
        fr: 'Ton Clan : retrouve tes compagnons et le journal du clan.'
        it: 'Il tuo Clan: ritrova i tuoi compagni e il diario del clan.'
        nl: 'Je Clan: vind je metgezellen en het dagboek van de clan terug.'
        pt: 'O teu Clã: reencontra os teus companheiros e o diário do clã.'
      tuto_dash_clan_admin:
        br: 'Seu Clã: é aqui que você recruta seus aventureiros, gerencia os membros do clã e encontra o diário do clã.'
        de: 'Dein Clan: Hier rekrutierst du deine Abenteurer, verwaltest die Clanmitglieder und findest das Tagebuch des Clans.'
        en: 'Your Clan: this is where you recruit your adventurers and manage clan members, and where you find the clan log.'
        es: 'Tu Clan: aquí reclutas a tus aventureros y gestionas los miembros del clan, y aquí encuentras el registro del clan.'
        fr: 'Ton Clan : c''est ici que tu recrutes tes aventuriers et que tu gères les membres du clan, et que tu retrouves le journal du clan.'
        it: 'Il tuo Clan: qui recluti i tuoi avventurieri e gestisci i membri del clan, e qui ritrovi il diario del clan.'
        nl: 'Je Clan: hier werf je je avonturiers, beheer je de clanleden en vind je het dagboek van de clan.'
        pt: 'O teu Clã: é aqui que recrutas os teus aventureiros e geres os membros do clã, e que encontras o diário do clã.'
      tuto_dash_combat:
        br: 'O Combate: é aqui que você escolhe uma tarefa para cumprir e ganhar XP.'
        de: 'Der Kampf: Hier wählst du eine Aufgabe, die du erledigst, um XP zu verdienen.'
        en: 'Combat: this is where you pick a task to complete and earn XP.'
        es: 'El Combate: aquí eliges una tarea para completar y ganar XP.'
        fr: 'Le Combat : c''est ici que tu choisis une tâche à accomplir pour gagner de l''XP.'
        it: 'Il Combattimento: qui scegli un compito da portare a termine per guadagnare XP.'
        nl: 'Het Gevecht: hier kies je een taak om te voltooien en XP te verdienen.'
        pt: 'O Combate: é aqui que escolhes uma tarefa para cumprir e ganhar XP.'
      tuto_dash_combat_admin:
        br: 'O Combate: é aqui que você escolhe uma tarefa para cumprir e ganhar XP, valida as tarefas dos outros jogadores e gerencia a lista de tarefas.'
        de: 'Der Kampf: Hier wählst du eine Aufgabe, um XP zu verdienen, bestätigst die Aufgaben der anderen Spieler und verwaltest die Aufgabenliste.'
        en: 'Combat: this is where you pick a task to complete and earn XP, validate other players'' tasks and manage the task list.'
        es: 'El Combate: aquí eliges una tarea para completar y ganar XP, validas las tareas de otros jugadores y gestionas la lista de tareas.'
        fr: 'Le Combat : c''est ici que tu choisis une tâche à accomplir pour gagner de l''XP, que tu peux valider les tâches des autres joueurs et administrer la liste des tâches.'
        it: 'Il Combattimento: qui scegli un compito da portare a termine per guadagnare XP, puoi convalidare i compiti degli altri giocatori e gestire l''elenco dei compiti.'
        nl: 'Het Gevecht: hier kies je een taak om te voltooien en XP te verdienen, valideer je de taken van andere spelers en beheer je de takenlijst.'
        pt: 'O Combate: é aqui que escolhes uma tarefa para cumprir e ganhar XP, que podes validar as tarefas dos outros jogadores e gerir a lista de tarefas.'
      tuto_dash_inv:
        br: 'Os Itens: aqui você acessa seus objetos, seus feitiços e todo tipo de bônus.'
        de: 'Die Items: Hier findest du deine Gegenstände, deine Zauber und alle möglichen Boni.'
        en: 'Items: here you get your objects, your spells and all kinds of bonuses.'
        es: 'Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones.'
        fr: 'Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus.'
        it: 'Gli Oggetti: qui accedi ai tuoi oggetti, ai tuoi incantesimi e a ogni sorta di bonus.'
        nl: 'De Items: hier vind je je voorwerpen, je spreuken en allerlei bonussen.'
        pt: 'Os Itens: aqui acedes aos teus objetos, aos teus feitiços e a todo o tipo de bónus.'
      tuto_dash_inv_admin:
        br: 'Os Itens: aqui você acessa seus objetos, seus feitiços e todo tipo de bônus, além do conteúdo do tesouro do clã.'
        de: 'Die Items: Hier findest du deine Gegenstände, deine Zauber und alle möglichen Boni, dazu den Inhalt der Beute des Clans.'
        en: 'Items: here you get your objects, your spells and all kinds of bonuses, plus the contents of the clan''s loot.'
        es: 'Los Items: aquí accedes a tus objetos, tus hechizos y todo tipo de bonificaciones, así como al contenido del botín del clan.'
        fr: 'Les Items : ici tu accèdes à tes objets, tes sortilèges et toutes sortes de bonus, ainsi qu''au contenu du butin du clan.'
        it: 'Gli Oggetti: qui accedi ai tuoi oggetti, ai tuoi incantesimi e a ogni sorta di bonus, oltre al contenuto del bottino del clan.'
        nl: 'De Items: hier vind je je voorwerpen, je spreuken en allerlei bonussen, en ook de inhoud van de buit van de clan.'
        pt: 'Os Itens: aqui acedes aos teus objetos, aos teus feitiços e a todo o tipo de bónus, bem como ao conteúdo do espólio do clã.'
      tuto_dash_perso:
        br: 'Seu Personagem: avatar, nível, pontos de vida e seu diário.'
        de: 'Dein Charakter: Avatar, Stufe, Lebenspunkte und dein Tagebuch.'
        en: 'Your Character: avatar, level, hit points and your log.'
        es: 'Tu Personaje: avatar, nivel, puntos de vida y tu registro.'
        fr: 'Ton Personnage : avatar, niveau, points de vie et ton journal.'
        it: 'Il tuo Personaggio: avatar, livello, punti vita e il tuo diario.'
        nl: 'Je Personage: avatar, niveau, levenspunten en je dagboek.'
        pt: 'O teu Personagem: avatar, nível, pontos de vida e o teu diário.'
      tuto_dash_shop:

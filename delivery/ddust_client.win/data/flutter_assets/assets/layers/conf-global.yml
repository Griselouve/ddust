        br: Digite o código do jeito que está. Hifens, espaços e maiúsculas não importam.
        de: Schreib den Code genau so ab, wie er dasteht. Bindestriche, Leerzeichen und Großbuchstaben spielen keine Rolle.
        en: Type the code just as it is written. Dashes, spaces and capitals make no difference.
        es: Escribe el código tal como está. Los guiones, los espacios y las mayúsculas no importan.
        fr: Recopiez le code tel qu'il est écrit. Les tirets, les espaces et les majuscules n'ont aucune importance.
        it: Scrivi il codice così come è scritto. Trattini, spazi e maiuscole non contano.
        nl: Typ de code over zoals hij geschreven staat. Streepjes, spaties en hoofdletters maken niet uit.
        pt: Escreve o código tal como está. Os hífenes, os espaços e as maiúsculas não importam.

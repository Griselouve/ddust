      mascot_ai_off:
        br: Meu chefe de clã pediu para eu não falar mais... mas eu fico aqui!
        de: Mein Clan-Anführer hat mich gebeten, nicht mehr zu reden... aber ich bleibe hier!
        en: My clan chief asked me to stop talking... but I'm staying right here!
        es: Mi jefe de clan me pidió que no hablara... ¡pero me quedo aquí!
        fr: Mon chef de clan m'a demandé de ne plus parler... je reste là, promis !
        it: Il mio capo clan mi ha chiesto di non parlare più... ma resto qui!
        nl: Mijn clanleider vroeg me te zwijgen... maar ik blijf hier!
        pt: O meu chefe de clã pediu-me para não falar... mas fico aqui!
      mascot_error:
        br: Ops, minhas asas se enrolaram... tente de novo daqui a pouco!
        de: Hoppla, meine Flügel haben sich verheddert... Versuch es gleich noch einmal!
        en: Oops, my wings tangled... I can't think right now. Try again in a moment!
        es: Uy, se me enredaron las alas... no consigo pensar. ¡Inténtalo en un momento!
        fr: Oups, mes ailes ont fourché... je n'arrive pas à réfléchir. Réessaie dans un moment !
        it: Ops, mi si sono aggrovigliate le ali... riprova tra un momento!
        nl: Oeps, mijn vleugels raakten in de knoop... probeer het zo nog eens!
        pt: Ups, as minhas asas enrolaram-se... tenta outra vez daqui a pouco!
      mascot_follow:

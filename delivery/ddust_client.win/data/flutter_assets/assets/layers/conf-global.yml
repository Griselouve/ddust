      tuto_badge_cure_desc:
        br: A tarefa está recarregando e logo voltará a ficar disponível.
        de: Die Aufgabe lädt sich auf und ist bald wieder verfügbar.
        en: The task is recharging and will soon be available again.
        es: La tarea se está recargando y pronto volverá a estar disponible.
        fr: La tâche se recharge et sera bientôt de nouveau disponible.
        it: Il compito si sta ricaricando e sarà presto di nuovo disponibile.
        nl: De taak laadt op en is binnenkort weer beschikbaar.
        pt: A tarefa está a recarregar e em breve voltará a estar disponível.
      tuto_badge_flamme:

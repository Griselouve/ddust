      tuto_perso_menu_journal:
        br: '"Meu Diário" conta tudo o que você fez na masmorra: suas tarefas, suas subidas de nível, seus tesouros. Ninguém pode apagá-lo.'
        de: '„Mein Tagebuch“ erzählt alles, was du im Kerker getan hast: deine Aufgaben, deine Stufenaufstiege, deine Schätze. Niemand kann es löschen.'
        en: '« My Log » tells everything you have done in the dungeon: your tasks, your level-ups, your treasures. Nobody can erase it.'
        es: '« Mi Diario » cuenta todo lo que has hecho en la mazmorra: tus tareas, tus subidas de nivel, tus tesoros. Nadie puede borrarlo.'
        fr: '« Mon Journal » raconte tout ce que tu as fait dans le donjon : tes tâches, tes montées de niveau, tes trésors. Personne ne peut l''effacer.'
        it: '«Il mio diario» racconta tutto quello che hai fatto nel dungeon: i tuoi compiti, i tuoi passaggi di livello, i tuoi tesori. Nessuno può cancellarlo.'
        nl: '‘Mijn dagboek’ vertelt alles wat je in de kerker hebt gedaan: je taken, je niveaustijgingen, je schatten. Niemand kan het wissen.'
        pt: '«O Meu Diário» conta tudo o que fizeste na masmorra: as tuas tarefas, as tuas subidas de nível, os teus tesouros. Ninguém o pode apagar.'
      tuto_perso_menu_nudges:
        br: '"Não me avise mais", em "Opções avançadas...", desliga as mensagens que a masmorra envia quando você para de vir. Você pode reativá-las quando quiser, no mesmo lugar.'
        de: „Nicht mehr erinnern“ unter „Erweiterte Optionen...“ schaltet die Nachrichten ab, die dir der Kerker schickt, wenn du nicht mehr vorbeikommst. Du kannst sie jederzeit an derselben Stelle wieder einschalten.
        en: « Stop nudging me », under « Advanced options... », turns off the messages the dungeon sends you when you stop coming. You can turn them back on whenever you like, in the same place.
        es: « No me avises más », en « Opciones avanzadas... », corta los mensajes que la mazmorra te envía cuando dejas de venir. Puedes restablecerlos cuando quieras, en el mismo sitio.
        fr: « Ne plus me faire signe », dans « Options avancées... », coupe les messages que le donjon t'envoie quand tu ne viens plus. Tu peux les rétablir quand tu veux, au même endroit.
        it: «Non avvisarmi più», in «Opzioni avanzate...», disattiva i messaggi che il dungeon ti manda quando non vieni più. Puoi riattivarli quando vuoi, nello stesso punto.
        nl: ‘Geen seintjes meer’, onder ‘Geavanceerde opties...’, zet de berichten uit die de kerker je stuurt als je niet meer langskomt. Je kunt ze op dezelfde plek weer aanzetten wanneer je wilt.
        pt: «Não me avises mais», em «Opções avançadas...», desliga as mensagens que a masmorra te envia quando deixas de vir. Podes voltar a ativá-las quando quiseres, no mesmo sítio.

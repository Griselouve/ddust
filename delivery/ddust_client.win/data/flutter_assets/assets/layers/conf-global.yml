      mascot_hello_adult:
        br: Olá! Meu nome é {name}, mas você pode me chamar de {short}. Se precisar de ajuda, é só me perguntar!
        de: Hallo! Ich heiße {name}, aber du kannst mich {short} nennen. Wenn du Hilfe brauchst, frag mich!
        en: Hello! My name is {name}, but you can call me {short}. If you need help, just ask me!
        es: ¡Hola! Me llamo {name}, pero puedes llamarme {short}. Si necesitas ayuda, ¡pregúntame!
        fr: Bonjour ! Je m'appelle {name}, mais tu peux m'appeler {short}. Si tu as besoin d'aide, demande-moi !
        it: Ciao! Mi chiamo {name}, ma puoi chiamarmi {short}. Se hai bisogno di aiuto, chiedimelo!
        nl: Hallo! Ik heet {name}, maar je mag me {short} noemen. Heb je hulp nodig? Vraag het me maar!
        pt: Olá! Chamo-me {name}, mas podes chamar-me {short}. Se precisares de ajuda, pergunta-me!
      mascot_hello_kid:
        br: Oi! Eu sou {short}, vou ser seu companheiro nas suas aventuras, e você pode até brincar comigo!
        de: Hallo! Ich bin {short} und begleite dich auf deinen Abenteuern. Du kannst sogar mit mir spielen!
        en: Hello! I'm {short}, I'll be your companion on your adventures, and you can even play with me!

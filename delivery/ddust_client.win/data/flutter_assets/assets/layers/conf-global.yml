      delete_account_sole_guardian:
        br: 'Você é o único responsável legal por: {name}. Antes de excluir sua conta, adicione um corresponsável (menu do clã, "Opções avançadas..." e depois "Gerenciar os clãs dos meus filhos") ou exclua primeiro a conta da criança.'
        de: 'Du bist der einzige gesetzliche Vertreter von: {name}. Bevor du dein Konto löschst, füge einen Mitvertreter hinzu (Clan-Menü, „Erweiterte Optionen...“, dann „Clans meiner Kinder verwalten“) oder lösche zuerst das Konto des Kindes.'
        en: 'You are the only legal guardian of: {name}. Before deleting your account, add a co-guardian (clan menu, "Advanced options...", then "Manage my children''s clans") or delete the child''s account first.'
        es: 'Eres el único responsable legal de: {name}. Antes de borrar tu cuenta, añade un corresponsable (menú del clan, «Opciones avanzadas...» y luego «Gestionar los clanes de mis hijos») o borra primero la cuenta del niño.'
        fr: 'Tu es le seul représentant légal de : {name}. Avant de supprimer ton compte, ajoute un co-représentant (menu du clan, « Options avancées... », puis « Gérer les clans de mes enfants ») ou supprime d''abord le compte de l''enfant.'
        it: 'Sei l''unico rappresentante legale di: {name}. Prima di eliminare il tuo account, aggiungi un co-rappresentante (menu del clan, «Opzioni avanzate...», poi «Gestisci i clan dei miei figli») o elimina prima l''account del bambino.'
        nl: 'Je bent de enige wettelijke vertegenwoordiger van: {name}. Voeg voordat je je account verwijdert een medevertegenwoordiger toe (clanmenu, "Geavanceerde opties...", dan "Clans van mijn kinderen beheren") of verwijder eerst het account van het kind.'
        pt: 'És o único representante legal de: {name}. Antes de apagar a tua conta, adiciona um corresponsável (menu do clã, «Opções avançadas...» e depois «Gerir os clãs dos meus filhos») ou apaga primeiro a conta da criança.'

      store_pitch_first:
        br: 'O clã de vocês pegou o ritmo. Para continuar, ele precisa de uma assinatura: vocês podem cancelar quando quiserem, e o clã fica intacto.'
        de: 'Euer Clan hat seinen Rhythmus gefunden. Damit es weitergeht, braucht er einen Beitrag: Ihr könnt jederzeit aufhören, und euer Clan bleibt unversehrt.'

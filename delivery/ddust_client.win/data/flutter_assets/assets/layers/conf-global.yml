        nl: 'Jullie clan zit in het ritme. Om door te gaan is er een contributie nodig: jullie stoppen ermee wanneer jullie willen, en jullie clan blijft intact.'
        pt: 'O vosso clã apanhou o ritmo. Para continuar precisa de uma quota: podem pará-la quando quiserem, e o vosso clã fica intacto.'

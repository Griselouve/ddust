        es: 'Enseña este código al padre o la madre del niño: autoriza tu clan y luego el niño puede entrar.'
        fr: 'Montre ce code au parent de l''enfant : il autorise ton clan, puis l''enfant peut entrer.'
        it: 'Mostra questo codice al genitore del bambino: autorizza il tuo clan, poi il bambino può entrare.'
        nl: 'Laat deze code zien aan de ouder van het kind: die geeft je clan toestemming, daarna kan het kind erbij.'
        pt: 'Mostra este código ao pai ou à mãe da criança: autoriza o teu clã e depois a criança pode entrar.'
      clan_other_region:

        es: 'El otro padre o madre, por ejemplo: tendrá los mismos derechos que tú. Escanea su código QR.'
        fr: 'L''autre parent, par exemple : il aura les mêmes droits que toi. Scanne son QR code.'
        it: 'L''altro genitore, per esempio: avrà gli stessi diritti tuoi. Scansiona il suo codice QR.'
        nl: 'De andere ouder bijvoorbeeld: die krijgt dezelfde rechten als jij. Scan zijn of haar QR-code.'
        pt: 'O outro pai ou mãe, por exemplo: terá os mesmos direitos que tu. Lê o código QR dele.'

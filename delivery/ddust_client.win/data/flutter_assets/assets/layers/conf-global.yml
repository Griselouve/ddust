  lang:
    translations:
      adm_menu_disable_desc:
        br: Desativar a tarefa (indisponível).
        de: Die Aufgabe deaktivieren (nicht verfügbar).
        en: Disable the task (unavailable).
        es: Desactivar la tarea (no disponible).
        fr: Désactiver la tâche (indisponible).
        it: Disattivare il compito (non disponibile).
        nl: De taak uitschakelen (niet beschikbaar).
        pt: Desativar a tarefa (indisponível).
      adm_menu_edit_desc:
        br: Editar a tarefa (nome, esforço, prazo...).
        de: Die Aufgabe bearbeiten (Name, Aufwand, Frist...).
        en: Edit the task (name, effort, deadline...).
        es: Editar la tarea (nombre, esfuerzo, plazo...).
        fr: Modifier la tâche (nom, effort, délai...).
        it: Modificare il compito (nome, sforzo, scadenza...).
        nl: De taak bewerken (naam, inspanning, termijn...).
        pt: Editar a tarefa (nome, esforço, prazo...).
      adm_menu_enable_desc:
        br: Ativar a tarefa (disponível).
        de: Die Aufgabe aktivieren (verfügbar).
        en: Make the task active (available).
        es: Activar la tarea (disponible).
        fr: Rendre la tâche active (disponible).
        it: Rendere attivo il compito (disponibile).
        nl: De taak activeren (beschikbaar).
        pt: Ativar a tarefa (disponível).
      adm_menu_hide_desc:
        br: Esconder a tarefa.
        de: Die Aufgabe verbergen.
        en: Hide the task.
        es: Ocultar la tarea.
        fr: Cacher la tâche.
        it: Nascondere il compito.
        nl: De taak verbergen.
        pt: Esconder a tarefa.
      adm_menu_recommend_desc:
        br: Recomendar esta tarefa (bônus de XP para o clã).
        de: Diese Aufgabe empfehlen (XP-Bonus für den Clan).
        en: Recommend this task (XP bonus for the clan).
        es: Recomendar esta tarea (bono de XP para el clan).
        fr: Recommander cette tâche (bonus d'XP pour le clan).
        it: Consigliare questo compito (bonus XP per il clan).
        nl: Deze taak aanbevelen (XP-bonus voor de clan).
        pt: Recomendar esta tarefa (bónus de XP para o clã).
      adm_menu_release_desc:
        br: 'Liberar a tarefa: ela volta a ficar disponível para todo o clã.'
        de: 'Die Aufgabe freigeben: Sie ist wieder für den ganzen Clan verfügbar.'
        en: 'Release the task: it becomes available to the whole clan again.'
        es: 'Liberar la tarea: vuelve a estar disponible para todo el clan.'
        fr: 'Libérer la tâche : elle redevient disponible pour tout le clan.'
        it: 'Liberare il compito: torna disponibile per tutto il clan.'
        nl: 'De taak vrijgeven: hij is weer beschikbaar voor de hele clan.'
        pt: 'Libertar a tarefa: volta a estar disponível para todo o clã.'
      adm_menu_revive_desc:
        br: Ressuscitar uma tarefa morta.
        de: Eine tote Aufgabe wiederbeleben.
        en: Revive a dead task.
        es: Resucitar una tarea muerta.
        fr: Ressusciter une tâche morte.
        it: Resuscitare un compito morto.
        nl: Een dode taak weer tot leven wekken.
        pt: Ressuscitar uma tarefa morta.
      adm_menu_show_desc:
        br: Tornar a tarefa visível.
        de: Die Aufgabe sichtbar machen.
        en: Make the task visible.
        es: Hacer visible la tarea.
        fr: Rendre la tâche visible.
        it: Rendere visibile il compito.
        nl: De taak zichtbaar maken.
        pt: Tornar a tarefa visível.
      adm_menu_tasks_desc:
        br: Abrir a lista de tarefas desta área.
        de: Die Aufgabenliste dieses Bereichs öffnen.
        en: Open this domain's task list.
        es: Abrir la lista de tareas de este ámbito.
        fr: Ouvrir la liste des tâches de ce domaine.
        it: Aprire l'elenco dei compiti di questo ambito.
        nl: De takenlijst van dit domein openen.
        pt: Abrir a lista de tarefas desta área.
      adm_menu_unrecommend_desc:
        br: 'Retirar a recomendação: acabou o bônus de XP nesta tarefa.'
        de: 'Die Empfehlung zurücknehmen: kein XP-Bonus mehr für diese Aufgabe.'
        en: 'Remove the recommendation: no more XP bonus on this task.'
        es: 'Retirar la recomendación: se acabó el bono de XP en esta tarea.'
        fr: 'Retirer la recommandation : plus de bonus d''XP sur cette tâche.'
        it: 'Togliere la raccomandazione: niente più bonus XP su questo compito.'
        nl: 'De aanbeveling intrekken: geen XP-bonus meer op deze taak.'
        pt: 'Retirar a recomendação: acabou o bónus de XP nesta tarefa.'
      autover_beta_accept:
        br: Entrar na beta
        de: Zur Beta wechseln
        en: Join the beta
        es: Pasar a la beta
        fr: Passer en beta
        it: Passa alla beta
        nl: Naar de beta
        pt: Passar para a beta
      autover_beta_declaration:
        br: 'Confirmo que nenhum membro do meu clã joga com uma conta Google supervisionada (Family Link): essas contas não podem entrar em uma beta.'
        de: 'Ich bestätige, dass kein Mitglied meines Clans mit einem beaufsichtigten Google-Konto (Family Link) spielt: Solche Konten können keiner Beta beitreten.'
        en: 'I confirm that no member of my clan plays with a supervised Google account (Family Link): these accounts cannot join a beta.'
        es: 'Confirmo que ningún miembro de mi clan juega con una cuenta de Google supervisada (Family Link): estas cuentas no pueden unirse a una beta.'
        fr: 'Je confirme qu''aucun membre de mon clan ne joue avec un compte Google supervisé (Family Link) : ces comptes ne peuvent pas rejoindre une beta.'
        it: 'Confermo che nessun membro del mio clan gioca con un account Google supervisionato (Family Link): questi account non possono entrare in una beta.'
        nl: 'Ik bevestig dat geen enkel lid van mijn clan speelt met een Google-account onder toezicht (Family Link): zulke accounts kunnen niet aan een beta deelnemen.'
        pt: 'Confirmo que nenhum membro do meu clã joga com uma conta Google supervisionada (Family Link): estas contas não podem entrar numa beta.'
      autover_beta_decline:
        br: Ficar na versão pública
        de: Bei der öffentlichen Version bleiben
        en: Stay on the public version
        es: Quedarme con la versión pública
        fr: Rester sur la version publique
        it: Restare sulla versione pubblica
        nl: Bij de openbare versie blijven
        pt: Ficar na versão pública
      autover_beta_message:
        br: Esta versão de teste leva todo o seu clã para os servidores da beta. Cada membro vai precisar instalar a versão de teste para continuar jogando.
        de: Diese Testversion bringt deinen ganzen Clan auf die Beta-Server. Jedes Mitglied muss die Testversion installieren, um weiterzuspielen.
        en: This test version takes your whole clan to the beta servers. Every member will need to install the test version to keep playing.
        es: Esta versión de prueba lleva a todo tu clan a los servidores de la beta. Cada miembro tendrá que instalar la versión de prueba para seguir jugando.
        fr: Cette version de test emmène tout ton clan sur les serveurs de la beta. Chaque membre devra installer la version de test pour continuer à jouer.
        it: Questa versione di prova porta tutto il tuo clan sui server della beta. Ogni membro dovrà installare la versione di prova per continuare a giocare.
        nl: Deze testversie brengt je hele clan naar de betaservers. Elk lid moet de testversie installeren om verder te spelen.
        pt: Esta versão de teste leva todo o teu clã para os servidores da beta. Cada membro terá de instalar a versão de teste para continuar a jogar.
      autover_beta_title:
        br: Entrar na beta
        de: Zur Beta wechseln
        en: Join the beta
        es: Pasar a la beta
        fr: Passer en beta
        it: Passare alla beta
        nl: Naar de beta
        pt: Passar para a beta
      autover_early_message:
        br: Ela estará pronta em alguns minutos.
        de: Sie ist in ein paar Minuten bereit.
        en: It will be ready in a few minutes.
        es: Estará lista en unos minutos.
        fr: Elle sera prête dans quelques minutes.
        it: Sarà pronta tra qualche minuto.
        nl: Hij is over een paar minuten klaar.
        pt: Estará pronta dentro de alguns minutos.
      autover_early_title:
        br: Sua versão chegou antes da hora
        de: Deine Version ist zu früh angekommen
        en: Your version arrived early
        es: Tu versión ha llegado antes de tiempo
        fr: Ta version est arrivée en avance
        it: La tua versione è arrivata in anticipo
        nl: Je versie is te vroeg aangekomen
        pt: A tua versão chegou mais cedo
      autover_hint_manual:
        br: Baixe a nova versão pelo seu canal de costume.
        de: Lade die neue Version über deinen gewohnten Weg herunter.
        en: Download the new version from your usual source.
        es: Descarga la nueva versión desde tu canal habitual.
        fr: Télécharge la nouvelle version par ton canal habituel.
        it: Scarica la nuova versione dal tuo canale abituale.
        nl: Download de nieuwe versie via je gebruikelijke kanaal.
        pt: Descarrega a nova versão pelo teu canal habitual.
      autover_hint_store:
        br: 'Se nada acontecer, a atualização está a caminho: tente de novo um pouco mais tarde.'
        de: 'Wenn nichts passiert, ist die Aktualisierung unterwegs: versuche es etwas später noch einmal.'
        en: 'If nothing happens, the update is on its way: try again a little later.'
        es: 'Si no pasa nada, la actualización está en camino: vuelve a intentarlo un poco más tarde.'
        fr: 'Si rien ne se passe, la mise à jour arrive : réessaie un peu plus tard.'
        it: 'Se non succede nulla, l''aggiornamento sta arrivando: riprova tra poco.'
        nl: 'Gebeurt er niets, dan is de update onderweg: probeer het iets later opnieuw.'
        pt: 'Se nada acontecer, a atualização está a caminho: tenta de novo um pouco mais tarde.'
      autover_maintenance_message:
        br: Seu clã está sendo atualizado. Volte em alguns minutos.
        de: Dein Clan wird gerade aktualisiert. Komm in ein paar Minuten wieder.
        en: Your clan is being updated. Come back in a few minutes.
        es: Tu clan se está actualizando. Vuelve en unos minutos.
        fr: Ton clan est en cours de mise à jour. Reviens dans quelques minutes.
        it: Il tuo clan è in fase di aggiornamento. Torna tra qualche minuto.
        nl: Je clan wordt bijgewerkt. Kom over een paar minuten terug.
        pt: O teu clã está a ser atualizado. Volta dentro de alguns minutos.
      autover_maintenance_title:
        br: Clã em manutenção
        de: Clan in Wartung
        en: Clan under maintenance
        es: Clan en mantenimiento
        fr: Clan en maintenance
        it: Clan in manutenzione
        nl: Clan in onderhoud
        pt: Clã em manutenção
      autover_message:
        br: Esta versão do aplicativo não é mais compatível. Atualize para continuar.
        de: Diese Version der App wird nicht mehr unterstützt. Aktualisiere sie, um weiterzuspielen.
        en: This version of the app is no longer supported. Update it to continue.
        es: Esta versión de la aplicación ya no es compatible. Actualízala para continuar.
        fr: Cette version de l'application n'est plus compatible. Mets-la à jour pour continuer.
        it: Questa versione dell'app non è più supportata. Aggiornala per continuare.
        nl: Deze versie van de app wordt niet meer ondersteund. Werk hem bij om verder te gaan.
        pt: Esta versão da aplicação já não é compatível. Atualiza-a para continuar.
      autover_running_message:
        br: Seu clã está passando para a nova versão. Leva só um instante.
        de: Dein Clan wechselt zur neuen Version. Das dauert nur einen Moment.
        en: Your clan is moving to the new version. It only takes a moment.
        es: Tu clan pasa a la nueva versión. Solo tarda un momento.
        fr: Ton clan passe à la nouvelle version. Cela ne prend qu'un instant.
        it: Il tuo clan passa alla nuova versione. Ci vuole solo un attimo.
        nl: Je clan gaat over op de nieuwe versie. Dat duurt maar even.
        pt: O teu clã está a passar para a nova versão. Demora só um instante.
      autover_running_title:
        br: Atualizando o clã
        de: Clan wird aktualisiert
        en: Updating the clan
        es: Actualizando el clan
        fr: Mise à jour du clan
        it: Aggiornamento del clan
        nl: Clan wordt bijgewerkt
        pt: A atualizar o clã
      autover_self_refresh:
        br: Esta tela vai avançar sozinha.
        de: Dieser Bildschirm geht von selbst weiter.
        en: This screen will move on by itself.
        es: Esta pantalla avanzará sola.
        fr: Cet écran se rouvrira tout seul.
        it: Questa schermata andrà avanti da sola.
        nl: Dit scherm gaat vanzelf verder.
        pt: Este ecrã avança sozinho.
      autover_title:
        br: Atualização necessária
        de: Aktualisierung erforderlich
        en: Update required
        es: Actualización necesaria
        fr: Mise à jour nécessaire
        it: Aggiornamento necessario
        nl: Update vereist
        pt: Atualização necessária
      autover_update:
        br: Atualizar
        de: Aktualisieren
        en: Update
        es: Actualizar
        fr: Mettre à jour
        it: Aggiorna
        nl: Bijwerken
        pt: Atualizar
      autover_wait_message:
        br: A nova versão precisa atualizar seu clã. Um chefe de clã precisa abrir o aplicativo.
        de: Die neue Version muss deinen Clan aktualisieren. Ein Clanchef muss die App öffnen.
        en: The new version needs your clan to be updated. A clan leader has to open the app.
        es: La nueva versión necesita actualizar tu clan. Un jefe de clan tiene que abrir la aplicación.
        fr: La nouvelle version demande de mettre ton clan à jour. Un chef de clan doit ouvrir l'application.
        it: La nuova versione richiede di aggiornare il tuo clan. Un capo clan deve aprire l'app.
        nl: De nieuwe versie moet je clan bijwerken. Een clanleider moet de app openen.
        pt: A nova versão precisa de atualizar o teu clã. Um chefe de clã tem de abrir a aplicação.
      autover_wait_title:
        br: Seu clã está se preparando
        de: Dein Clan bereitet sich vor
        en: Your clan is getting ready
        es: Tu clan se está preparando
        fr: Ton clan se prépare
        it: Il tuo clan si sta preparando
        nl: Je clan maakt zich klaar
        pt: O teu clã está a preparar-se
      awake_question:
        br: 'A masmorra espera por vocês.

          Estão prontos?'
        de: 'Der Kerker erwartet euch.

          Seid ihr bereit?'
        en: 'The dungeon awaits.

          Are you ready?'
        es: 'La mazmorra os espera.

          ¿Estáis listos?'
        fr: 'Le donjon vous attend.

          Êtes-vous prêt ?'
        it: 'Il dungeon vi attende.

          Siete pronti?'
        nl: 'De kerker wacht op jullie.

          Zijn jullie klaar?'
        pt: 'A masmorra espera-vos.

          Estão prontos?'
      back_to_my_clan:
        br: Voltar para o meu clã
        de: Zurück zu meinem Clan
        en: Back to my clan
        es: Volver a mi clan
        fr: Revenir à mon clan
        it: Torna al mio clan
        nl: Terug naar mijn clan
        pt: Voltar ao meu clã
      camera_hint:
        br: Toque para uma foto, segure para um vídeo (sem som)
        de: Tippe für ein Foto, halte gedrückt für ein Video (ohne Ton)
        en: Tap for a photo, hold for a video (no sound)
        es: Toca para una foto, mantén pulsado para un vídeo (sin sonido)
        fr: Touche pour une photo, maintiens pour une vidéo (sans son)
        it: Tocca per una foto, tieni premuto per un video (senza audio)
        nl: Tik voor een foto, houd ingedrukt voor een video (zonder geluid)
        pt: Toca para uma fotografia, mantém premido para um vídeo (sem som)
      camera_hint_recording:
        br: Solte para parar
        de: Loslassen zum Beenden
        en: Let go to stop
        es: Suelta para parar
        fr: Lâche pour arrêter
        it: Rilascia per fermare
        nl: Loslaten om te stoppen
        pt: Larga para parar
      chapter_theme_pick:
        br: 'Capítulo VIII: O clima'
        de: 'Kapitel VIII: Die Stimmung'
        en: 'Chapter VIII: The atmosphere'
        es: 'Capítulo VIII: El ambiente'
        fr: 'Chapitre VIII : L''ambiance'
        it: 'Capitolo VIII: L''atmosfera'
        nl: 'Hoofdstuk VIII: De sfeer'
        pt: 'Capítulo VIII: O ambiente'
      claim_pick_title:
        br: Recuperar um jogador
        de: Einen Spieler wiederfinden
        en: Find a player
        es: Recuperar un jugador
        fr: Retrouver un joueur
        it: Ritrovare un giocatore
        nl: Een speler terugvinden
        pt: Recuperar um jogador
      clan_menu_add_child:
        br: Adicionar meu filho
        de: Mein Kind hinzufügen
        en: Add my child
        es: Añadir a mi hijo
        fr: Ajouter mon enfant
        it: Aggiungi mio figlio
        nl: Mijn kind toevoegen
        pt: Adicionar o meu filho
      clan_menu_add_child_desc:
        br: Seu filho entra no clã, tenha ou não celular próprio.
        de: Dein Kind tritt dem Clan bei, ob es ein eigenes Handy hat oder nicht.
        en: Your child joins the clan, whether or not they have their own phone.
        es: Tu hijo se une al clan, tenga o no su propio teléfono.
        fr: Ton enfant rejoint le clan, qu'il ait son propre téléphone ou non.
        it: Tuo figlio entra nel clan, che abbia o no un telefono suo.
        nl: Je kind komt bij de clan, met of zonder eigen telefoon.
        pt: O teu filho entra no clã, tenha ou não telemóvel próprio.
      clan_menu_advanced:
        br: Opções avançadas...
        de: Erweiterte Optionen...
        en: Advanced options...
        es: Opciones avanzadas...
        fr: Options avancées...
        it: Opzioni avanzate...
        nl: Geavanceerde opties...
        pt: Opções avançadas...
      clan_menu_advanced_desc:
        br: Convite a distância, clãs dos seus filhos, IA do clã, indicação...
        de: Einladung aus der Ferne, Clans deiner Kinder, Clan-KI, Patenschaft...
        en: Remote invitation, your children's clans, clan AI, sponsorship...
        es: Invitación a distancia, clanes de tus hijos, IA del clan, padrinazgo...
        fr: Invitation à distance, clans de tes enfants, IA du clan, parrainage...
        it: Invito a distanza, clan dei tuoi figli, IA del clan, padrinato...
        nl: Uitnodiging op afstand, clans van je kinderen, clan-AI, peterschap...
        pt: Convite à distância, clãs dos teus filhos, IA do clã, apadrinhamento...
      clan_menu_guardian_hub:
        br: Gerenciar os clãs dos meus filhos
        de: Clans meiner Kinder verwalten
        en: Manage my children's clans
        es: Gestionar los clanes de mis hijos
        fr: Gérer les clans de mes enfants
        it: Gestisci i clan dei miei figli
        nl: Clans van mijn kinderen beheren
        pt: Gerir os clãs dos meus filhos
      clan_menu_guardian_hub_desc:

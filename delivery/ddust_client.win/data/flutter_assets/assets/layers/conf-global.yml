        fr: 'Ce clan vit dans un autre royaume : on ne peut pas encore le rejoindre depuis le tien.'
        it: 'Questo clan vive in un altro regno: non si può ancora entrare dal tuo.'
        nl: 'Deze clan woont in een ander koninkrijk: vanuit het jouwe kun je er nog niet bij.'
        pt: 'Este clã vive noutro reino: ainda não é possível entrar a partir do teu.'

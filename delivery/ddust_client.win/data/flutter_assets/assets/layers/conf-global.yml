        es: Exclamación, por validar
        fr: Exclamation, à valider
        it: 'Punto esclamativo: da convalidare'
        nl: 'Uitroepteken: te valideren'
        pt: 'Exclamação: por validar'
      tuto_badge_hand_desc:
        br: A tarefa está terminada e espera que um chefe de clã a valide.
        de: Die Aufgabe ist erledigt und wartet darauf, dass ein Clanchef sie bestätigt.
        en: The task is done and waiting for a clan chief to validate it.
        es: La tarea está terminada y espera que un jefe de clan la valide.
        fr: La tâche est terminée et attend qu'un chef de clan la valide.
        it: Il compito è finito e aspetta che un capo clan lo convalidi.
        nl: De taak is klaar en wacht tot een clanhoofd hem valideert.
        pt: A tarefa está terminada e espera que um chefe de clã a valide.
      tuto_badge_skull:

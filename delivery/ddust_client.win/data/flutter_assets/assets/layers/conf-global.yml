      referral_conditions:
        br: 'Como funciona

          • Compartilhem o código de vocês com outro clã. Ele digita o código em "Tenho um padrinho", antes da primeira assinatura paga.

          • Quando esse clã pagar a primeira assinatura e não pedir reembolso em 3 dias, o clã de vocês ganha um mês: a próxima cobrança é adiada em um mês, ou um mês grátis é somado se vocês não forem assinantes.

          • Um só mês por clã indicado, e só o padrinho direto ganha. Os clãs indicados pelos afilhados de vocês fazem os títulos crescerem.

          • Limite: os meses grátis em andamento nunca passam de 2 por clã indicado que continua assinante. Acima disso, o mês é perdido. Um mês ganho nunca é retirado.

          • A indicação só vale entre clãs da mesma região de servidores.

          • Indicar a si mesmo é proibido. Em caso de abuso, Donjons & Savons pode desativar um código, cancelar uma indicação ou suspender a oferta.'
        de: 'So funktioniert es

          • Teilt euren Code mit einem anderen Clan. Er gibt ihn unter „Wir haben einen Paten“ ein, vor seinem ersten bezahlten Abo.

          • Wenn dieser Clan sein erstes Abo bezahlt und es nicht innerhalb von 3 Tagen erstattet bekommt, gewinnt euer Clan einen Monat: eure nächste Abbuchung verschiebt sich um einen Monat, oder ein Gratismonat kommt hinzu, wenn ihr kein Abo habt.

          • Nur ein Monat pro geworbenem Clan, und nur der direkte Pate bekommt ihn. Clans, die von euren geworbenen Clans geworben werden, lassen eure Titel wachsen.

          • Obergrenze: eure laufenden Gratismonate übersteigen nie 2 pro geworbenem Clan, der noch ein Abo hat. Darüber hinaus verfällt der Monat. Ein gewonnener Monat wird nie zurückgenommen.

          • Werben gilt nur zwischen Clans derselben Serverregion.

          • Sich selbst zu werben ist verboten. Bei Missbrauch kann Donjons & Savons einen Code deaktivieren, eine Werbung aufheben oder das Angebot aussetzen.'
        en: 'How it works

          • Share your code with another clan. They enter it in "I have a sponsor", before their first paid subscription.

          • When that clan pays its first subscription and is not refunded within 3 days, your clan earns a month: your next billing date moves one month later, or a free month is added if you are not subscribed.

          • Only one month per sponsored clan, and only the direct sponsor earns it. Clans sponsored by your own sponsored clans make your titles grow.

          • Limit: your free months in progress never exceed 2 per sponsored clan that is still subscribed. Beyond that, the month is lost. A month earned is never taken back.

          • Sponsorship only works between clans of the same server region.

          • Sponsoring yourself is not allowed. In case of abuse, Dungeons & Dusting may deactivate a code, cancel a sponsorship or suspend the offer.'
        es: 'Cómo funciona

          • Compartid vuestro código con otro clan. Lo introduce en «Tengo un padrino», antes de su primera suscripción de pago.

          • Cuando ese clan paga su primera suscripción y no pide el reembolso en 3 días, vuestro clan gana un mes: vuestro próximo cobro se retrasa un mes, o se añade un mes gratis si no tenéis suscripción.

          • Un solo mes por clan apadrinado, y solo lo gana el padrino directo. Los clanes apadrinados por vuestros ahijados hacen crecer vuestros títulos.

          • Tope: vuestros meses gratis en curso nunca superan 2 por clan apadrinado que siga suscrito. Por encima, el mes se pierde. Un mes ganado nunca se retira.

          • El padrinazgo solo vale entre clanes de una misma región de servidores.

          • Apadrinarse a uno mismo está prohibido. En caso de abuso, Calabozos & Jabones puede desactivar un código, anular un padrinazgo o suspender la oferta.'
        fr: 'Comment ça marche

          • Partagez votre code avec un autre clan. Il le saisit dans « J''ai un parrain », avant son premier abonnement payé.

          • Quand ce clan paie son premier abonnement et ne se fait pas rembourser dans les 3 jours, votre clan gagne un mois : votre prochaine échéance est repoussée d''un mois, ou un mois offert s''ajoute si vous n''êtes pas abonnés.

          • Un seul mois par clan parrainé, et seul le parrain direct le gagne. Les clans parrainés par vos filleuls font grandir vos titres.

          • Plafond : vos mois offerts en cours ne dépassent jamais 2 par clan parrainé encore abonné. Au-delà, le mois est perdu. Un mois gagné n''est jamais repris.

          • Un parrainage ne vaut qu''entre clans d''une même région de serveurs.

          • Se parrainer soi-même est interdit. En cas d''abus, Donjons & Savons peut désactiver un code, annuler un parrainage ou suspendre l''offre.'
        it: 'Come funziona

          • Condividete il vostro codice con un altro clan. Lo inserisce in «Ho un padrino», prima del suo primo abbonamento a pagamento.

          • Quando quel clan paga il suo primo abbonamento e non chiede il rimborso entro 3 giorni, il vostro clan guadagna un mese: il vostro prossimo addebito slitta di un mese, oppure si aggiunge un mese in regalo se non siete abbonati.

          • Un solo mese per clan di cui siete padrini, e lo guadagna solo il padrino diretto. I clan portati dai vostri figliocci fanno crescere i vostri titoli.

          • Tetto: i vostri mesi in regalo in corso non superano mai 2 per clan figlioccio ancora abbonato. Oltre, il mese è perso. Un mese guadagnato non viene mai ripreso.

          • Il padrinato vale solo tra clan della stessa regione di server.

          • Fare da padrino a se stessi è vietato. In caso di abuso, Donjons & Savons può disattivare un codice, annullare un padrinato o sospendere l''offerta.'
        nl: 'Zo werkt het

          • Deel jullie code met een andere clan. Die voert hem in bij "Ik heb een peetouder", vóór het eerste betaalde abonnement.

          • Als die clan zijn eerste abonnement betaalt en binnen 3 dagen geen terugbetaling krijgt, wint jullie clan een maand: jullie volgende afschrijving schuift een maand op, of er komt een gratis maand bij als jullie geen abonnement hebben.

          • Eén maand per aangebrachte clan, en alleen de directe peetouder krijgt hem. Clans die door jullie aangebrachte clans worden aangebracht, laten jullie titels groeien.

          • Plafond: jullie lopende gratis maanden zijn nooit meer dan 2 per aangebrachte clan die nog een abonnement heeft. Daarboven vervalt de maand. Een verdiende maand wordt nooit teruggenomen.

          • Aanbrengen geldt alleen tussen clans van dezelfde serverregio.

          • Jezelf aanbrengen is verboden. Bij misbruik kan Donjons & Savons een code uitschakelen, een aanbrenging annuleren of het aanbod opschorten.'
        pt: 'Como funciona

          • Partilhem o vosso código com outro clã. Ele introduz o código em «Tenho um padrinho», antes da primeira subscrição paga.

          • Quando esse clã pagar a primeira subscrição e não for reembolsado nos 3 dias seguintes, o vosso clã ganha um mês: a vossa próxima cobrança é adiada um mês, ou é acrescentado um mês oferecido se não tiverem subscrição.

          • Um só mês por clã apadrinhado, e só o padrinho direto o ganha. Os clãs apadrinhados pelos vossos afilhados fazem crescer os vossos títulos.

          • Limite: os vossos meses oferecidos em curso nunca passam de 2 por clã apadrinhado ainda com subscrição. Acima disso, o mês perde-se. Um mês ganho nunca é retirado.

          • O apadrinhamento só vale entre clãs da mesma região de servidores.

          • Apadrinhar-se a si próprio é proibido. Em caso de abuso, Donjons & Savons pode desativar um código, anular um apadrinhamento ou suspender a oferta.'
